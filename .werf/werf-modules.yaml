# modules_images
  {{- $Root := . }}
  {{- $ModulesImagesDigestList := list }}
  {{- $ExcludedModulesDict := dict }}
  {{- $AvailableModulesDict := dict }}
  {{- $HasAvailableModules := false }}

# Collect images if desired for editions
#
# depending on the rules for skipping modules in the editions.yaml
# file and the used assembly mechanism (werf, docker), we form modules for assembly
  {{- $ModulesImagesBuildFiles := dict }}
  {{- $isEE := false }}
  {{- range $_, $edition := $.Editions }}
    {{- if not $edition.skipCollectImages }}
      {{ $ModulesImagesBuildFiles = merge $ModulesImagesBuildFiles ($.Files.Glob (printf "%s/*/images/*/{Dockerfile,werf.inc.yaml}" $edition.modulesDir)) }}
      {{- /* the edition's images/ sits next to its modules/: images/ for CE, ee/cse/images/ for CSE */}}
      {{- $imagesDir := "images" }}
      {{- if ne (dir $edition.modulesDir) "." }}
        {{- $imagesDir = printf "%s/images" (dir $edition.modulesDir) }}
      {{- end }}
      {{- $ModulesImagesBuildFiles = merge $ModulesImagesBuildFiles ($.Files.Glob (printf "%s/*/*/{Dockerfile,werf.inc.yaml}" $imagesDir)) }}
      {{- $ModulesImagesBuildFiles = merge $ModulesImagesBuildFiles ($.Files.Glob (printf "%s/*/*/*/{Dockerfile,werf.inc.yaml}" $imagesDir)) }}
    {{- end }}
    # fill in "$_" data for assembly
    {{- if eq $.Env $edition.name }}
      {{- if hasKey $edition "isEE" }}
        {{- $isEE = $edition.isEE }}
      {{- end }}
      {{- if $edition.excludeModules }}
        {{- range $_, $exludeModuleName := $edition.excludeModules }}
          {{- $_ := set $ExcludedModulesDict (printf "%s" $exludeModuleName) "true" }}
        {{- end }}
      {{- end }}
      {{- if $edition.availableModules }}
        {{- $HasAvailableModules = true }}
        {{- range $_, $availableModuleName := $edition.availableModules }}
          {{- $_ := set $AvailableModulesDict (printf "%s" $availableModuleName) "true" }}
        {{- end }}
      {{- end }}

      {{- break -}}
    {{- end }}
   {{- end }}

  {{- /*
    Images outside the modules, collected above from each edition's images/ directory.

    images/<scope>/<image> holds images that used to live in modules/000-common/images, and
    images/<scope>/<namespace>/<image> those of a former pseudo-module such as
    registrypackages, grouped by the area they serve. The scope only places the files: an
    image is still built and published as common/<image> or <namespace>/<image>, so that its
    key in images_digests.json, which helm_lib, bashible and external modules read, stays the
    same.
  */}}
  {{- $RootImagesModuleName := "common" }}

   {{- range $path, $content := $ModulesImagesBuildFiles  }}
    {{- $ctx := dict }}
    {{- if regexMatch "/werf.inc.yaml$" $path }}
      {{- $_ := set $ctx "ImageInstructionType" "Stapel" }}
    {{- else }}
      {{- $_ := set $ctx "ImageInstructionType" "Dockerfile" }}
    {{- end }}
    {{- $modulePath := "" }}
    {{- $modulePriority := "" }}
    {{- $moduleName := "" }}
    {{- $imageName := "" }}
    {{- $imagePath := "" }}
    {{- $ossYamlPath := "" }}
    {{- if regexMatch "^(.*)modules/([0-9]+)-([a-z0-9-]+)/images/([0-9a-z-_]+)/(Dockerfile|werf.inc.yaml)$" $path }}
      {{- $ImageData := regexReplaceAll "^(.*)modules/([0-9]+)-([a-z0-9-]+)/images/([0-9a-z-_]+)/(Dockerfile|werf.inc.yaml)$" $path "${1}#${2}#${3}#${4}" | split "#" }}
      {{- $modulePath = $ImageData._0 }}
      {{- $modulePriority = $ImageData._1 }}
      {{- $moduleName = $ImageData._2 }}
      {{- $imageName = $ImageData._3 }}
      {{- $imagePath = printf "%smodules/%s-%s/images/%s" $modulePath $modulePriority $moduleName $imageName }}
      {{- $ossYamlPath = printf "%s/modules/%s-%s/oss.yaml" $modulePath $modulePriority $moduleName }}
    {{- else if regexMatch "^((?:ee/(?:[a-z-]+/)?)?)images/([a-z0-9-]+)/([a-z0-9-]+)/([0-9a-z-_]+)/(Dockerfile|werf.inc.yaml)$" $path }}
      {{- /* images/<scope>/<namespace>/<image> */}}
      {{- $ImageData := regexReplaceAll "^((?:ee/(?:[a-z-]+/)?)?)images/([a-z0-9-]+)/([a-z0-9-]+)/([0-9a-z-_]+)/(Dockerfile|werf.inc.yaml)$" $path "${1}#${2}#${3}#${4}" | split "#" }}
      {{- $modulePath = $ImageData._0 }}
      {{- $moduleName = $ImageData._2 }}
      {{- $imageName = $ImageData._3 }}
      {{- $imagePath = printf "%simages/%s/%s/%s" $modulePath $ImageData._1 $moduleName $imageName }}
      {{- $ossYamlPath = printf "%simages/%s/%s/oss.yaml" $modulePath $ImageData._1 $moduleName }}
    {{- else }}
      {{- /* images/<scope>/<image> */}}
      {{- $ImageData := regexReplaceAll "^((?:ee/(?:[a-z-]+/)?)?)images/([a-z0-9-]+)/([0-9a-z-_]+)/(Dockerfile|werf.inc.yaml)$" $path "${1}#${2}#${3}" | split "#" }}
      {{- $modulePath = $ImageData._0 }}
      {{- $moduleName = $RootImagesModuleName }}
      {{- $imageName = $ImageData._2 }}
      {{- $imagePath = printf "%simages/%s/%s" $modulePath $ImageData._1 $imageName }}
      {{- $ossYamlPath = printf "%simages/%s/oss.yaml" $modulePath $ImageData._1 }}
    {{- end }}
    # exclude modules and images from editions
    {{- if hasKey $ExcludedModulesDict $moduleName }}
      {{- continue -}}
    {{- end }}
    {{- if and $HasAvailableModules (not (hasKey $AvailableModulesDict $moduleName)) }}
      {{- continue -}}
    {{- end }}

    {{- $_ := set $ctx "CandiVersionMap" $.CandiVersionMap }}
    {{- $_ := set $ctx "k8sVersions" $Root.k8sVersions }}
    {{- $_ := set $ctx "ModulePath" $modulePath }}
    {{- $_ := set $ctx "ModulePriority" $modulePriority }}
    {{- $_ := set $ctx "ModuleName" $moduleName }}
    {{- $_ := set $ctx "OssYamlPath" $ossYamlPath }}
    {{- $_ := set $ctx "ImageName" $imageName }}
    {{- /* the image directory relative to the repository root, wherever the image lives */}}
    {{- $_ := set $ctx "ImagePath" $imagePath }}
    {{- $_ := set $ctx "ImageBuildData" $content }}
    {{- $_ := set $ctx "Files" $Root.Files }}
    {{- $_ := set $ctx "Env" $Root.Env }}
    {{- $_ := set $ctx "isEE" $isEE }}
    {{- $_ := set $ctx "HasAvailableModules" $HasAvailableModules }}
    {{- $_ := set $ctx "AvailableModulesDict" $AvailableModulesDict }}

    {{- $_ := set $ctx "Images" $Root.Images }}
    {{- $_ := set $ctx "CandiVersionMap" $Root.CandiVersionMap }}
    {{- $_ := set $ctx "TF" $Root.TF }}
    {{- $_ := set $ctx "SOURCE_REPO" $Root.SOURCE_REPO }}
    {{- $_ := set $ctx "CLOUD_PROVIDERS_SOURCE_REPO" $Root.CLOUD_PROVIDERS_SOURCE_REPO }}
    {{- $_ := set $ctx "GOPROXY" $Root.GOPROXY }}
    {{- $_ := set $ctx "DECKHOUSE_PRIVATE_REPO" $Root.DECKHOUSE_PRIVATE_REPO }}
    {{- $_ := set $ctx "DistroPackagesProxy" $Root.DistroPackagesProxy }}
    {{- $_ := set $ctx "CargoProxy" $Root.CargoProxy }}
    # cosign
    {{- $_ := set $ctx "RegistryUser" $Root.RegistryUser }}
    {{- $_ := set $ctx "RegistryPassword" $Root.RegistryPassword }}
    {{- $_ := set $ctx "CosignVaultAdress" $Root.CosignVaultAdress }}
    {{- $_ := set $ctx "CosignVaultToken" $Root.CosignVaultToken }}
    {{- $_ := set $ctx "CosignVaultKey" $Root.CosignVaultKey }}
    {{- $_ := set $ctx "CosignTransitSecret" $Root.CosignTransitSecret }}
    # svance
    {{- $_ := set $ctx "ProjectName" (list $ctx.ModuleName $ctx.ImageName | join "/") }}
    {{- $_ := set $ctx "SVACE_ENABLED" $Root.SVACE_ENABLED }}
    {{- $_ := set $ctx "SVACE_ANALYZE_HOST" $Root.SVACE_ANALYZE_HOST }}
    {{- $_ := set $ctx "SVACE_ANALYZE_SSH_USER" $Root.SVACE_ANALYZE_SSH_USER }}
    {{- $_ := set $ctx "Commit" $Root.Commit }}
    {{- $_ := set $ctx "gitPrefix" $Root.gitPrefix }}
---
{{ include "module_image_template" $ctx }}
  {{- range $ImageYamlMainfest := regexSplit "\n?---[ \t]*\n" (include "module_image_template" $ctx) -1 }}
    {{- $ImageManifest := $ImageYamlMainfest | fromYaml }}
    {{- if $ImageManifest.image }}
      {{- if ne $ImageManifest.final false }}
        {{- $ModulesImagesDigestList = append $ModulesImagesDigestList $ImageManifest.image }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
---
# render images digest image
{{ include "images_digest_image" (dict "Images" .Images "ModulesImagesDigestList" $ModulesImagesDigestList) }}
---
