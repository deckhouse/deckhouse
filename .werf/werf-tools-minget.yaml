---
image: minget-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
shell:
  install:
  - pm install minget
---
image: minget-common-artifact
final: false
from: {{ index $.Images "base/distroless-fin" }}
import:
- image: minget-artifact
  add: /usr/bin/minget
  to: /usr/bin/minget
  before: install
