# Patterns used by tools/docs/glossary/link_terms.py to find glossary terms in
# documentation pages. One entry per term id (file name in
# docs/documentation/_glossary/). Each language lists Python regular
# expressions; they are compiled case-insensitively with word boundaries
# added around them. Use (?-i:...) for tokens that must keep their case.
# A term listed in `skip` is not linked automatically: it is too generic
# to be linked on every page. `paths` restricts a term to pages whose path
# (relative to docs/documentation/pages) starts with one of the prefixes:
# use it for words that mean something else outside their section.
skip:
  - virtual-machine
  - api
  - cluster
  - system
  - workload
  - namespace
  - module
  - alert
  - control-plane
