syntax = "proto3";

package dhctl.provider.validate.v1;

// Full import path: a relative value makes the generated code unimportable.
option go_package = "github.com/deckhouse/deckhouse/go_lib/dhctl-provider-protocol/api/validate/v1";

// ValidateService is the validate action: a validator checks a cloud provider's
// configuration before the caller touches any infrastructure.
//
// One service per action. A validator registers what it implements, and a caller
// learns a missing action from gRPC's Unimplemented rather than from a negotiation.
service ValidateService {
  rpc Validate(ValidateRequest) returns (ValidateResponse);
}


message ValidateRequest {
  // JSON-encoded validate input; Input in this package's Go code, wire shape in
  // README.md.
  //
  // JSON rather than protobuf messages because every field that carries substance
  // is an arbitrary Kubernetes object: google.protobuf.Struct would be exactly as
  // untyped while costing a conversion layer on both sides.
  bytes input_json = 1;
}

// Blocking problems go to errors, non-blocking ones to warnings; an empty response
// means the configuration is valid.
//
// A failure of the validator itself is NOT reported here — it is a gRPC status:
// InvalidArgument, Unimplemented or Internal.
message ValidateResponse {
  repeated ViolationResponse errors   = 1;
  repeated ViolationResponse warnings = 2;
}

// Named apart from the hand-written Violation, which is the type a validator uses:
// generated and hand-written code share this Go package.
message ViolationResponse {
  // Resource field path, e.g. "Secret/d8-credentials.data.secret".
  string path = 1;
  // Stable machine-readable identifier, e.g. "credential_secret_required".
  string code    = 2;
  string message = 3;
  // Display-only. A validator handling a sensitive field sends a placeholder such as
  // "masked" instead of the value.
  string value = 4;
}
