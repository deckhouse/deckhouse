topnav_title: Deckhouse
site_title: Deckhouse
company_name:
  en: Flant
  ru: Флант
company_url:
  en: https://flant.com
  ru: https://flant.ru
url: https://deckhouse.io
urls:
  ru: https://deckhouse.ru
  en: https://deckhouse.io
canonical_url_prefix_documentation: /products/kubernetes-platform/documentation/v1
canonical_url_prefix: /products/kubernetes-platform
site_description:
  en: "Deckhouse. An operator which creates homogeneous Kubernetes clusters anywhere and fully manages them. Manages all necessary addons to provide observability, security and service mesh."
  ru: "Deckhouse. Позволяет создавать идентичные Kubernetes-кластеры в любой инфраструктуре и полностью, «автомагически» управляет ими."
github_repo_path: /deckhouse/deckhouse
d8Revision: EE

# AI-friendly exports: llms.txt, corpus.json and per-page Markdown (_plugins/ai_export.rb).
AIExport: true
# AIRoot add the "Optional" section to llms.txt  with the links to the llms.txt and corpus.json of the embedded and external modules.
AIRoot: true
AIllmsFileName: llms.txt
AIcorpusFileName: corpus.json

# summaryI18nKey names an i18n.common entry (_data/i18n.yml) used as the llms.txt
# summary; it falls back to site_description if unset or empty. The embedded
# modules build overrides it with aiLlmsSummaryEmbedded (werf-modules-static.inc.yaml).
ai_export:
  title: Deckhouse Kubernetes Platform
  summaryI18nKey: aiLlmsSummary

metrics:
  google: G-4X28CEP7W2
  yandex:
    ru: 78422802
    en: 100410448

sass:
    style: compressed

chat_script_url:
  en: "https://crm.flant.ru/upload/crm/site_button/loader_2_qurrbf.js"
  ru: "https://crm.flant.ru/upload/crm/site_button/loader_3_20bbbd.js"

social_links:
  ru:
    telegram: https://t.me/deckhouse_ru
  en:
    telegram: https://t.me/deckhouse

output: web

collections:
  faq:
    output: false

exclude:
- .idea/
- .gitignore
- vendor
- Gemfile.lock
- Gemfile
- backends
- '*.sh'
- '*.yml'
- '*.yaml'
- docker-compose*.yml
- _tools/


highlighter: rouge
feedback_disable: true

plugins:
  - jekyll-regex-replace
  - jekyll_include_plugin
  - jekyll_asset_pipeline

asset_pipeline:
  bundle: true
  compress: true
  output_path: assets
  #display_path: nil
  gzip: false

markdown: kramdown
kramdown:
 input: GFM
 auto_ids: true
 hard_wrap: false
 syntax_highlighter: rouge
 syntax_highlighter_opts:
  default_lang: plaintext
 parse_block_html: true

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      toc: false
      layout: "page"
      comments: false
      searchable: true
      sitemap_include: true
      topnav: topnav
      output: web
      sidebar: main
      multilang: true
      comparable: true
      product_code: kubernetes-platform
      searchBageEnabled: true
      lang: en
      showPrevNextButton: true
      feedback: true
      # Maximum number of automatically extracted links in the "Related Links" section to display
      # if the page has NO defined relative_links
      extractedLinksOnlyMax: 6
      # Maximum number of automatically extracted links in the "Related Links" section to display
      # if the page has defined relative_links
      extractedLinksMax: 2
  - scope:
      path: "pages/internal"
    values:
      ai_export: false
  - scope:
      path: "pages/drafts"
    values:
      ai_export: false
  - scope:
      path: "pages/admin"
    values:
      sidebar: main
      sitemap_include: true
      showPrevNextButton: true
      searchBoost: 2
  - scope:
      path: "pages/architecture"
    values:
      sidebar: main
      sitemap_include: true
      showPrevNextButton: true
      searchBoost: 2
  - scope:
      path: "pages/user"
    values:
      sidebar: main
      sitemap_include: true
      showPrevNextButton: true
      searchBoost: 1.5
  - scope:
      path: "pages/reference"
      sitemap_include: true
    values:
      sidebar: main
      searchBoost: 1.5
  - scope:
      path: "modules_ru"
      type: "pages"
    values:
      lang: ru
      showPrevNextButton: true
  - scope:
      path: "_faq/admin"
      type: faq
    values:
      section: admin
      searchable: true
      sitemap_include: true
      searchBoost: 2
  - scope:
      path: "_faq/user"
      type: faq
    values:
      section: user
      searchable: true
      sitemap_include: true
      searchBoost: 2
timezone: Europe/Moscow
