d8Revision: EE

# AI-friendly exports: llms.txt, corpus.json and per-page Markdown (_plugins/ai_export.rb).
# The embedded modules build overrides some of these in werf-modules-static.inc.yaml.
ai_export:
  # Nothing is generated unless `enabled` is true.
  enabled: true
  # `root` adds the "Optional" section to llms.txt with links to the llms.txt and
  # corpus.json of the embedded and external modules. Set it in the build whose
  # llms.txt is the entry point of the site.
  root: true
  llmsFileName: llms.txt
  corpusFileName: corpus.json
  title: Deckhouse Kubernetes Platform
  # summaryI18nKey names an i18n.common entry (_data/i18n.yml) used as the llms.txt
  # summary; it falls back to site_description if unset or empty.
  summaryI18nKey: aiLlmsSummary

metrics:
  google: G-4X28CEP7W2
  yandex:
    ru: 78422802
    en: 100410448

sass:
    style: compressed

chat_script_url:
  en: "https://crm.flant.ru/upload/crm/site_button/loader_2_qurrbf.js"
  ru: "https://crm.flant.ru/upload/crm/site_button/loader_3_20bbbd.js"

social_links:
  ru:
    telegram: https://t.me/deckhouse_ru
  en:
    telegram: https://t.me/deckhouse

output: web

collections:
  faq:
    output: false

exclude:
- .idea/
- .gitignore
- vendor
- Gemfile.lock
- Gemfile
- backends
- '*.sh'
- '*.yml'
- '*.yaml'
- docker-compose*.yml
- _tools/


highlighter: rouge
feedback_disable: true

# Link rewriting in generated HTML (see _plugins/link_rewrite.rb).
# When enabled, an <a href="..."> whose host is not in whitelist_hosts (and is
# not a subdomain of a listed host) is unwrapped — the tag is dropped, the link
# text stays. Per-link opt-out: <a data-keep-link="true">.
# By default, link rewriting is disabled. But it is enabled for the CSE edition in the documentation module.
link_rewrite_enable: false
link_rewrite:
  # Allowed hosts. For a link whose host is not listed here (and is not a subdomain
  # of a listed host), the <a> tag is unwrapped: the tag is dropped but the link
  # text stays in place. Relative links, mailto:/tel:/#anchor and links with the
  # data-keep-link attribute are never touched.
  whitelist_hosts: []
  # Regex URL substitutions applied BEFORE the whitelist check — a rule can
  # redirect an external URL to an allowed host so the link survives.
  replace:
  #  - from: '^https?://old\.example\.com/(.*)$'
  #    to:   'https://new.example.com/\1'

plugins:
  - jekyll-regex-replace
  - jekyll_include_plugin
  - jekyll_asset_pipeline

asset_pipeline:
  bundle: true
  compress: true
  output_path: assets
  #display_path: nil
  gzip: false

markdown: kramdown
kramdown:
 input: GFM
 auto_ids: true
 hard_wrap: false
 syntax_highlighter: rouge
 syntax_highlighter_opts:
  default_lang: plaintext
 parse_block_html: true

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      toc: false
      layout: "page"
      comments: false
      searchable: true
      sitemap_include: true
      topnav: topnav
      output: web
      sidebar: main
      multilang: true
      comparable: true
      product_code: kubernetes-platform
      searchBageEnabled: true
      lang: en
      showPrevNextButton: true
      feedback: true
      # Maximum number of automatically extracted links in the "Related Links" section to display
      # if the page has NO defined relative_links
      extractedLinksOnlyMax: 6
      # Maximum number of automatically extracted links in the "Related Links" section to display
      # if the page has defined relative_links
      extractedLinksMax: 2
  - scope:
      path: "pages/internal"
    values:
      ai_export: false
  - scope:
      path: "pages/drafts"
    values:
      ai_export: false
  - scope:
      path: "pages/installing"
    values:
      editionsNotAvailable: [cse]
  - scope:
      path: "pages/admin"
    values:
      sidebar: main
      sitemap_include: true
      showPrevNextButton: true
      editionsNotAvailable: [cse]
      searchBoost: 2
  - scope:
      path: "pages/architecture"
    values:
      sidebar: main
      sitemap_include: true
      showPrevNextButton: true
      editionsNotAvailable: [cse]
      searchBoost: 2
  - scope:
      path: "pages/user"
    values:
      sidebar: main
      sitemap_include: true
      showPrevNextButton: true
      editionsNotAvailable: [cse]
      searchBoost: 1.5
  - scope:
      path: "pages/reference"
      sitemap_include: true
    values:
      sidebar: main
      searchBoost: 1.5
  - scope:
      path: "modules_ru"
      type: "pages"
    values:
      lang: ru
      showPrevNextButton: true
  - scope:
      path: "_faq/admin"
      type: faq
    values:
      section: admin
      searchable: true
      sitemap_include: true
      searchBoost: 2
  - scope:
      path: "_faq/user"
      type: faq
    values:
      section: user
      searchable: true
      sitemap_include: true
      searchBoost: 2
timezone: Europe/Moscow
