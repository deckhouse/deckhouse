- name: single-node-cluster
  en:
    description: |
      All-in-one cluster where a single node performs both master and worker roles
  ru:
    description: |
      Одноузловой кластер, в котором один узел выполняет роли и master, и worker
  nodes:
    - node_type: master
      count: 1
      vcpu: 12
      ram_gb: 24
      disk_gb: 350

- name: single-master-cluster
  en:
    description: |
      Cluster with one master node and one or more worker nodes
  ru:
    description: |
      Кластер с одним master-узлом и одним или несколькими worker-узлами
  nodes:
    - node_type: master
      count: 1
      vcpu: 8
      ram_gb: 16
      disk_gb: 150
    - node_type: worker
      count: "1+"
      vcpu: 8
      ram_gb: 16
      disk_gb: 250

- name: three-master-cluster
  en:
    description: |
      High-availability cluster with three master nodes
  ru:
    description: |
      Кластер с тремя master-узлами для высокой доступности
  nodes:
    - node_type: master
      count: 3
      vcpu: 6
      ram_gb: 12
      disk_gb: 150

- name: role-separated-cluster
  en:
    description: |
      Cluster with role separation: dedicated master, worker, system, frontend and monitoring nodes
  ru:
    description: |
      Кластер с разделением ролей узлов: выделенные master-, worker-, системные, frontend- и узлы мониторинга
  nodes:
    - node_type: master
      count: 3
      vcpu: 6
      ram_gb: 12
      disk_gb: 60
    - node_type: worker
      count: "1+"
      vcpu: 2
      ram_gb: 4
      disk_gb: 60
    - node_type: system
      count: "2+"
      vcpu: 2
      ram_gb: 4
      disk_gb: 100
    - node_type: system
      count: "2+"
      vcpu: 6
      ram_gb: 12
      disk_gb: 300
      en:
        note: |
          Applied if there are no dedicated monitoring nodes
      ru:
        note: |
          Применяется, если нет выделенных узлов мониторинга
    - node_type: frontend
      count: "2+"
      vcpu: 2
      ram_gb: 4
      disk_gb: 60
    - node_type: monitoring
      count: "2+"
      vcpu: 4
      ram_gb: 8
      disk_gb: 200