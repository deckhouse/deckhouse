basic-auth:
    - version: 2
      description:
        en: |
            * Delete the `locations[].whitelist` values that are not an IPv4 or IPv6 address or subnet, such as `all`. A location left without addresses requires a password, and a location without `users` denies every request.
            * Delete the locations whose value is neither `/` nor a single path segment, and the `htpasswd` and `/htpasswd` locations.
            * Delete the repeated locations that differ only in the leading `/`. The first one is kept.
        ru: |
            * Удалите из `locations[].whitelist` значения, которые не являются IPv4- или IPv6-адресом или подсетью, например `all`. Location без оставшихся адресов требует пароль, а location без `users` отклоняет все запросы.
            * Удалите location, значение которых не является `/` или одним сегментом пути, а также location `htpasswd` и `/htpasswd`.
            * Удалите повторы location, которые отличаются только начальным `/`. Остаётся первый из них.
      conversions:
        - if .locations != null then .locations |= map(if .whitelist != null then (.whitelist |= map(select(type == "string" and (test("^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(/0*(3[0-2]|[12]?[0-9]))?$") or test("^(([0-9A-Fa-f]{1,4}:){7}([0-9A-Fa-f]{1,4}|:)|([0-9A-Fa-f]{1,4}:){6}(:[0-9A-Fa-f]{1,4}|((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])|:)|([0-9A-Fa-f]{1,4}:){5}(((:[0-9A-Fa-f]{1,4}){1,2})|:((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])|:)|([0-9A-Fa-f]{1,4}:){4}(((:[0-9A-Fa-f]{1,4}){1,3})|((:[0-9A-Fa-f]{1,4})?:((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|:)|([0-9A-Fa-f]{1,4}:){3}(((:[0-9A-Fa-f]{1,4}){1,4})|((:[0-9A-Fa-f]{1,4}){0,2}:((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|:)|([0-9A-Fa-f]{1,4}:){2}(((:[0-9A-Fa-f]{1,4}){1,5})|((:[0-9A-Fa-f]{1,4}){0,3}:((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|:)|([0-9A-Fa-f]{1,4}:){1}(((:[0-9A-Fa-f]{1,4}){1,6})|((:[0-9A-Fa-f]{1,4}){0,4}:((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|:)|(:(((:[0-9A-Fa-f]{1,4}){1,7})|((:[0-9A-Fa-f]{1,4}){0,5}:((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|:)))(/0*(12[0-8]|1[01][0-9]|[1-9]?[0-9]))?$"))))) | (if (.whitelist | length) == 0 then del(.whitelist) else . end) else . end) end
        - if .locations != null then .locations |= map(select((.location | type) == "string" and (.location | test("^(/|/?[a-zA-Z0-9_-][a-zA-Z0-9._-]*)$")) and ((.location | test("^/?htpasswd$")) | not))) end
        - if .locations != null then .locations |= reduce .[] as $l ([]; if any(.[]; (.location | ltrimstr("/")) == ($l.location | ltrimstr("/"))) then . else . + [$l] end) end
cilium-hubble:
    - version: 2
      conversions:
        - del(.auth.password) | if .auth == {} then del(.auth) end
cloud-provider-dvp:
    - version: 2
      description:
        en: |
            * Move `provider.namespace` to `provider.parameters.namespace`.
            * Move `zones` to `nodes.parameters.zones`.
            * Delete `provider.kubeconfigDataBase64`. The kubeconfig is stored in a Secret of type `cloud-provider.deckhouse.io/credentials`.
            * Set `nodes.parameters.layout` (defaults to `Standard`).
            * Replace the placeholder in `nodes.parameters.sshPublicKey` with a real SSH public key.
        ru: |
            * Перенесите `provider.namespace` в `provider.parameters.namespace`.
            * Перенесите `zones` в `nodes.parameters.zones`.
            * Удалите `provider.kubeconfigDataBase64`. Kubeconfig хранится в секрете типа `cloud-provider.deckhouse.io/credentials`.
            * Задайте `nodes.parameters.layout` (по умолчанию — `Standard`).
            * Замените плейсхолдер в `nodes.parameters.sshPublicKey` на реальный публичный SSH-ключ.
      conversions:
        - if .provider == null then .provider = {} end
        - if .provider.parameters == null then .provider.parameters = {} end
        - if .provider.parameters.namespace == null then (if .provider.namespace != null then .provider.parameters.namespace = .provider.namespace else .provider.parameters.namespace = "default" end) end
        - del(.provider.namespace)
        - del(.provider.kubeconfigDataBase64)
        - if .nodes == null then .nodes = {} end
        - if .nodes.parameters == null then .nodes.parameters = {} end
        - if .nodes.parameters.layout == null then .nodes.parameters.layout = "Standard" end
        - if .nodes.parameters.sshPublicKey == null then .nodes.parameters.sshPublicKey = "ssh-rsa PLACEHOLDER_REPLACE_ME" end
        - if .zones != null then .nodes.parameters.zones = .zones end
        - del(.zones)
        - if .nodes.disabled == null then .nodes.disabled = false end
        - if .storage == null then .storage = {} end
        - if .storage.disabled == null then .storage.disabled = false end
        - if .ccm == null then .ccm = {} end
        - if .ccm.disabled == null then .ccm.disabled = false end
        - if .storage.parameters == null then .storage.parameters = {} end
cloud-provider-vsphere:
    - version: 2
      description:
        en: If the field `.storageClass.compatibilityFlag` exists, capitalize the field value.
        ru: Если поле `.storageClass.compatibilityFlag` существует, перепишите значение с заглавной буквы.
      conversions:
        - if .storageClass | has("compatibilityFlag") then .storageClass.compatibilityFlag |= (.[0:1] | ascii_upcase) + (.[1:] | ascii_downcase) end
cloud-provider-yandex:
    - version: 2
      description:
        en: |
            The settings are grouped under the [`provider`](configuration.html#parameters-provider), [`nodes`](configuration.html#parameters-nodes), [`storage`](configuration.html#parameters-storage), and [`ccm`](configuration.html#parameters-ccm) parameters. The conversion does the following:

            - The [`cloudID`](configuration.html#parameters-provider-parameters-cloudid), [`folderID`](configuration.html#parameters-provider-parameters-folderid), [`layout`](configuration.html#parameters-nodes-parameters-layout), [`nodeNetworkCIDR`](configuration.html#parameters-nodes-parameters-nodenetworkcidr), and [`sshPublicKey`](configuration.html#parameters-nodes-parameters-sshpublickey) parameters have to be filled in manually.
            - The `storageClass.exclude` parameter is renamed to [`excludedStorageClasses`](configuration.html#parameters-storage-parameters-excludedstorageclasses), and `storageClass.provision` to [`provisionedStorageClasses`](configuration.html#parameters-storage-parameters-provisionedstorageclasses).
            - The `storageClass.default` parameter is removed. Set the default StorageClass with the global [`defaultClusterStorageClass`](/products/kubernetes-platform/documentation/v1/reference/api/global.html#parameters-defaultclusterstorageclass) parameter.
            - The `additionalExternalNetworkIDs` parameter is moved to [`ccm.parameters.additionalExternalNetworkIDs`](configuration.html#parameters-ccm-parameters-additionalexternalnetworkids).
        ru: |
            Настройки сгруппированы по параметрам [`provider`](configuration.html#parameters-provider), [`nodes`](configuration.html#parameters-nodes), [`storage`](configuration.html#parameters-storage) и [`ccm`](configuration.html#parameters-ccm). Конверсия выполняет следующее:

            - Параметры [`cloudID`](configuration.html#parameters-provider-parameters-cloudid), [`folderID`](configuration.html#parameters-provider-parameters-folderid), [`layout`](configuration.html#parameters-nodes-parameters-layout), [`nodeNetworkCIDR`](configuration.html#parameters-nodes-parameters-nodenetworkcidr) и [`sshPublicKey`](configuration.html#parameters-nodes-parameters-sshpublickey) нужно заполнить вручную.
            - Параметр `storageClass.exclude` переименован в [`excludedStorageClasses`](configuration.html#parameters-storage-parameters-excludedstorageclasses), а `storageClass.provision` в [`provisionedStorageClasses`](configuration.html#parameters-storage-parameters-provisionedstorageclasses).
            - Параметр `storageClass.default` удалён. Задайте StorageClass по умолчанию глобальным параметром [`defaultClusterStorageClass`](/products/kubernetes-platform/documentation/v1/reference/api/global.html#parameters-defaultclusterstorageclass).
            - Параметр `additionalExternalNetworkIDs` перенесён в [`ccm.parameters.additionalExternalNetworkIDs`](configuration.html#parameters-ccm-parameters-additionalexternalnetworkids).
      conversions:
        - if .provider == null then .provider = {} end
        - if .provider.parameters == null then .provider.parameters = {} end
        - if .provider.parameters.cloudID == null then .provider.parameters.cloudID = "PLACEHOLDER_REPLACE_ME" end
        - if .provider.parameters.folderID == null then .provider.parameters.folderID = "PLACEHOLDER_REPLACE_ME" end
        - if .nodes == null then .nodes = {} end
        - if .nodes.parameters == null then .nodes.parameters = {} end
        - if .nodes.parameters.layout == null then .nodes.parameters.layout = "Standard" end
        - if .nodes.parameters.nodeNetworkCIDR == null then .nodes.parameters.nodeNetworkCIDR = "10.0.0.0/16" end
        - if .nodes.parameters.sshPublicKey == null then .nodes.parameters.sshPublicKey = "ssh-rsa PLACEHOLDER_REPLACE_ME" end
        - if .nodes.disabled == null then .nodes.disabled = false end
        - if .storage == null then .storage = {} end
        - if .storage.parameters == null then .storage.parameters = {} end
        - if .storageClass.exclude != null then .storage.parameters.excludedStorageClasses = .storageClass.exclude end
        - if .storageClass.provision != null then .storage.parameters.provisionedStorageClasses = .storageClass.provision end
        - del(.storageClass)
        - if .storage.disabled == null then .storage.disabled = false end
        - if .ccm == null then .ccm = {} end
        - if .ccm.parameters == null then .ccm.parameters = {} end
        - if .additionalExternalNetworkIDs != null then .ccm.parameters.additionalExternalNetworkIDs = .additionalExternalNetworkIDs end
        - del(.additionalExternalNetworkIDs)
        - if .ccm.disabled == null then .ccm.disabled = false end
control-plane-manager:
    - version: 2
      description:
        en: Delete `etcd.externalMembersNames`
        ru: Удалите `etcd.externalMembersNames`
      conversions:
        - del(.etcd.externalMembersNames) | if .etcd == {} then del(.etcd) end
    - version: 3
      description:
        en: Replace `.apiserver.loadBalancer` with `.apiserver.publishAPI.loadBalancer`.
        ru: Замените `.apiserver.loadBalancer` на `.apiserver.publishAPI.loadBalancer`.
      conversions:
        - if .apiserver.loadBalancer != null then .apiserver.publishAPI.loadBalancer.enabled = true end
        - if .apiserver.loadBalancer.port != null then .apiserver.publishAPI.loadBalancer.port = .apiserver.loadBalancer.port | del(.apiserver.loadBalancer.port) end
        - if .apiserver.loadBalancer.sourceRanges != null then .apiserver.publishAPI.loadBalancer.sourceRanges = .apiserver.loadBalancer.sourceRanges | del(.apiserver.loadBalancer.sourceRanges) end
        - if .apiserver.loadBalancer.annotations != null then .apiserver.publishAPI.loadBalancer.annotations = .apiserver.loadBalancer.annotations | del(.apiserver.loadBalancer.annotations) end
        - del(.apiserver.loadBalancer)
descheduler:
    - version: 2
      description:
        en: Delete `settings`.
        ru: Удалите `settings`.
      conversions:
        - del(.)
global:
    - version: 2
      description:
        en: Move `storageClass` to `modules.storageClass`. Remove `modules.resourcesRequests.everyNode`, `modules.resourcesRequests.masterNode` and `modules.proxy` parameters.
        ru: Перенесите `storageClass` в `modules.storageClass`. Удалите параметры `modules.resourcesRequests.everyNode`, `modules.resourcesRequests.masterNode` и `modules.proxy`.
      conversions:
        - if .storageClass and .modules.storageClass == null then .modules.storageClass = .storageClass end
        - del(.storageClass)
        - del(.modules.resourcesRequests.everyNode)
        - del(.modules.resourcesRequests.masterNode)
        - del(.modules.proxy)
    - version: 3
      description:
        en: Move `modules.ingressClass` to `modules.ingress.ingressClass`, and `modules.gatewayAPIGateway` to `modules.gatewayAPI.gateway`.
        ru: Перенесите `modules.ingressClass` в `modules.ingress.ingressClass`, а `modules.gatewayAPIGateway` — в `modules.gatewayAPI.gateway`.
      conversions:
        - if .modules.ingressClass != null and .modules.ingress.ingressClass == null then .modules.ingress.ingressClass = .modules.ingressClass else . end
        - del(.modules.ingressClass)
        - if .modules.gatewayAPIGateway != null and .modules.gatewayAPI.gateway == null then .modules.gatewayAPI.gateway = .modules.gatewayAPIGateway else . end
        - del(.modules.gatewayAPIGateway)
istio:
    - version: 2
      description:
        en: Delete `.settings.auth.password`.
        ru: Удалите `.settings.auth.password`.
      conversions:
        - del(.auth.password) | if .auth == {} then del(.auth) end
    - version: 3
      description:
        en: |
            * Move `.settings.enableHTTP10` to `.settings.dataPlane.enableHTTP10`.
            * Move `.settings.proxyConfig` to `.settings.dataPlane.proxyConfig`.
        ru: |
            * Перенесите `.settings.enableHTTP10` в `.settings.dataPlane.enableHTTP10`.
            * Перенесите `.settings.proxyConfig` в `.settings.dataPlane.proxyConfig`.
      conversions:
        - if has("enableHTTP10") then .dataPlane.enableHTTP10 = .enableHTTP10 | del(.enableHTTP10) else . end
        - if has("proxyConfig") then .dataPlane.proxyConfig = .proxyConfig | del(.proxyConfig) else . end
metallb:
    - version: 2
      description:
        en: Remove all `addressPool` elements with the `layer2` protocol.
        ru: Удалите все элементы `addressPool` с протоколом `layer2`.
      conversions:
        - del(.addressPools[]? | select(.protocol == "layer2"))
    - version: 3
      description:
        en: |
            Address pools and BGP settings have been moved to separate Custom Resources. Please remove the following fields from the `metallb` `ModuleConfig`:
              - `.settings.addressPools`
              - `.settings.bgpPeers`
              - `.settings.bgpCommunities`
        ru: |
            Настройки пулов и BGP вынесены в отдельные Custom Resources. Пожалуйста, удалите следующие поля из `ModuleConfig` `metallb`:
              - `.settings.addressPools`
              - `.settings.bgpPeers`
              - `.settings.bgpCommunities`
      conversions:
        - del(.bgpPeers, .bgpCommunities, .addressPools)
node-manager:
    - version: 2
      description:
        en: Delete `allowedKubernetesVersions` and `allowedBundles`.
        ru: Удалите `allowedKubernetesVersions` и `allowedBundles`.
      conversions:
        - del(.allowedKubernetesVersions, .allowedBundles)
    - version: 3
      description:
        en: Delete `earlyOomEnabled`.
        ru: Удалите `earlyOomEnabled`.
      conversions:
        - del(.earlyOomEnabled)
openvpn:
    - version: 2
      conversions:
        - del(.auth.password) | if .auth == {} then del(.auth) end
        - del(.storageClass)
user-authn:
    - version: 2
      description:
        en: Replace `publishAPI.enable` with `publishAPI.enabled`.
        ru: Замените `publishAPI.enable` на `publishAPI.enabled`.
      conversions:
        - if .publishAPI.enable != null then .publishAPI.enabled = .publishAPI.enable | del(.publishAPI.enable) end
    - version: 3
      description:
        en: 'An `idTokenTTL` of 6 hours or more is replaced with `5h59m`: Dex rotates its signing keys every 6 hours.'
        ru: 'Значение `idTokenTTL` 6 часов и больше заменяется на `5h59m`: ключи подписи Dex ротируются каждые 6 часов.'
      conversions:
        - if (.idTokenTTL | type) == "string" and (.idTokenTTL | test("^([0-9]+h)?([0-9]+m)?([0-9]+s)?$")) and ((.idTokenTTL | capture("^((?<h>[0-9]+)h)?((?<m>[0-9]+)m)?((?<s>[0-9]+)s)?$") | ((.h // "0" | tonumber) * 3600 + (.m // "0" | tonumber) * 60 + (.s // "0" | tonumber))) >= 21600) then .idTokenTTL = "5h59m" end
