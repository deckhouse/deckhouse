# Public DNS names of Deckhouse Platform (DP) components, modules and products.
#
# Consumers:
#   - the reference page docs/documentation/pages/reference/PUBLIC_DOMAINS*.md (table and /etc/hosts generator);
#   - the getting started guides in docs/site/_includes/getting_started/** (minimal DNS list, entries with gs: true).
#
# Fields:
#   name: the value that replaces %s in the modules.publicDomainTemplate parameter.
#   gs:   getting started; true if the name belongs to the minimal DNS list of the getting started guides.
#   en, ru: localized texts, Markdown is allowed.
#     created_by: the module or product that uses the name.
#     purpose:    what is served on the name.
#     note:       availability conditions or other remarks; use '—' if there is nothing to add.

- name: api
  gs: true
  en:
    created_by: 'The [`control-plane-manager`](/modules/control-plane-manager/) module'
    purpose: 'Kubernetes API publication. External access to the Kubernetes API via Ingress or Gateway API'
    note: |
      To make the name available, enable [API publication](/modules/control-plane-manager/configuration.html#parameters-apiserver-publishapi). The [`storage-volume-data-manager`](/modules/storage-volume-data-manager/) module also uses this name for data export and import (DataExport and DataImport resources). The module obtains the certificate from the Ingress that publishes the Kubernetes API. Therefore, this module also requires API publication
  ru:
    created_by: 'Модуль [`control-plane-manager`](/modules/control-plane-manager/)'
    purpose: 'Публикация Kubernetes API. Внешний доступ к Kubernetes API через Ingress или Gateway API'
    note: |
      Чтобы имя было доступно, включите [публикацию API](/modules/control-plane-manager/configuration.html#parameters-apiserver-publishapi). Это же имя использует [модуль `storage-volume-data-manager`](/modules/storage-volume-data-manager/) для выгрузки и загрузки данных (ресурсы DataExport и DataImport). Модуль берёт сертификат у Ingress, через который публикуется Kubernetes API. Поэтому этому модулю тоже нужна публикация API

