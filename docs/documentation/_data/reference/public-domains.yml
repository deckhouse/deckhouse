    purpose: 'Model downloads and public model catalog (`/v2`, `/api/distribution/...`)'
    note: 'The public catalog is available when [`distribution.mode: PublicCatalog`](/modules/ai-models/configuration.html#parameters-distribution-mode) is set'
  ru:
