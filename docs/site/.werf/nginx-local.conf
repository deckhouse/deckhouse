user  nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 500;
    multi_accept on;
    use epoll;
}

http {
    proxy_cache_path /cache keys_zone=dcache:10m max_size=200m inactive=30d;

    log_format json_combined escape=json '{ "time_local": "$time_local", '
     '"host": "$host", '
     '"remote_addr": "$remote_addr", '
     '"remote_user": "$remote_user", '
     '"request": "$request", '
     '"status": "$status", '
     '"body_bytes_sent": "$body_bytes_sent", '
     '"request_time": "$request_time", '
     '"http_referrer": "$http_referer", '
     '"http_user_agent": "$http_user_agent" }';

    ssi on;
    gzip off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Add MIME type for ES modules (.mjs files)
    # and for the per-page Markdown of the AI export (.md files).
    types {
        application/javascript mjs;
        text/markdown md;
    }

    error_log /dev/stderr debug;
    rewrite_log on;

    map $host $lang {
        hostnames;
        ".deckhouse.ru"   "ru";
        # for test environments
        ".deckhouse-ru.*" "ru";
        "ru.localhost"    "ru";
        default           "en";
    }

    # A directory typed without the trailing slash gets one: the relative
    # links of its page need it. An address with the slash checks a path
    # that is never there, so the only if of the location is false for it
    # (see the site config, .helm/templates/10-cm-moduleslibrary.yaml).
    map $uri $ondemand_dir_check {
        volatile;
        ~/$      /nonexistent;
        default  $request_filename;
    }

    map $host $publicdocupstream {
        hostnames;
        "ru.localhost"    "https://deckhouse_ru";
        default           "https://deckhouse_io";
    }

    map $host $publicdochost {
        hostnames;
        "ru.localhost"    "deckhouse.ru";
        default           "deckhouse.io";
    }

    # Map channel names to versions using generated channels.conf
    map $channel_name $channel_version {
        default "latest";
        include /app/channels-data/channels.conf;
    }

    # Map installer channel names to versions
    map $installer_channel_name $installer_channel_version {
        default "v0.4.1";
        include /app/installer-versions-nginx.include;
    }

    upstream deckhouse_io {
        server deckhouse.io:443;
    }

    upstream deckhouse_ru {
        server deckhouse.ru:443;
    }

    server {
        root   /app;
        index  readme.html index.html;
        error_page 403 404 /$lang/404.html;

        charset utf-8;
        # `charset` only appends the encoding to the types listed here, and the
        # default list has no text/markdown: the per-page Markdown of the AI
        # export would be served without a charset and a browser would guess it.
        charset_types text/xml text/plain text/vnd.wap.wml application/javascript application/rss+xml text/markdown;
        listen 80;
        server_name _;

        set_real_ip_from  0.0.0.0/0;
        access_log       /dev/stdout json_combined;
        error_log        /dev/stderr info;

        set $channel_name "latest";
        # docs-builder, resolved by the DNS of the compose network on every
        # request: nginx starts and keeps serving while the container restarts.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $builder "http://builder:8081";

        rewrite /products/kubernetes-platform/documentation/((?!(v[0-9]|v[0-9]+\.[0-9]+|alpha|beta|early-access|stable|rock-solid|latest)).*)$ /products/kubernetes-platform/documentation/latest/$1 redirect;
        rewrite ^(.*)/documentation(/(v[0-9]+|v[0-9]+\.[0-9]+|latest))?/deckhouse-overview.html$ /products/kubernetes-platform/documentation$2/admin/configuration/ redirect;
        rewrite ^/documentation/(.*)$ /products/kubernetes-platform/documentation/$1 redirect;
        rewrite ^/gs/(.*)$ /products/kubernetes-platform/gs/$1 redirect;
        rewrite ^/guides/(.*)$ /products/kubernetes-platform/documentation/v1/guides/$1 redirect;
        rewrite ^/products/kubernetes-platform/guides/?$ /products/kubernetes-platform/documentation/v1/guides/ redirect;
        rewrite ^/products/kubernetes-platform/guides/(.*)$ /products/kubernetes-platform/documentation/v1/guides/$1 redirect;
        rewrite ^/products/virtualization-platform/guides/production\.html$ /products/kubernetes-platform/documentation/v1/guides/virt-production.html redirect;
        rewrite ^/products/virtualization-platform/guides/migrating-vms-from-vmware-to-dvp\.html$ /products/kubernetes-platform/documentation/v1/guides/virt-migrating-from-vmware.html redirect;
        rewrite ^/products/virtualization-platform/guides(/.*)?$ /products/kubernetes-platform/documentation/v1/guides/ redirect;
        # Keep /en/404.html and /ru/404.html for error_page (prod serves them via try_files in location /).
        rewrite ^/(ru|en)/(?!404\.html$)(.*)$ /$2 break;
        rewrite ^/ru/terms-of-service\.html /ru/security-policy.html permanent;
        rewrite ^/ru/cookie-policy\.html /ru/security-policy.html permanent;
        rewrite ^/ru/privacy-policy\.html /ru/security-policy.html permanent;
        rewrite ^/en/security-policy\.html /en/privacy-policy.html permanent;

        location ~ ^(/ru|/en)?/404\.html$ {
            rewrite ^/404\.html$ /$lang/404.html last;
            try_files $uri =404;
        }

       location / {
           proxy_redirect    off;
           proxy_set_header  Host              $publicdochost;
           proxy_set_header  X-Real-IP         $remote_addr;
           proxy_set_header  X-Original-URI    $request_uri;
           proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;

           proxy_pass $publicdocupstream;
       }

        location ~* ^(/images|/js|/assets|/gs|/presentations|/license_request_expired.html|/license_request_success.html) {
            try_files /$lang/$uri /$lang/$uri/index.html /$lang/$uri/ $uri $uri/index.html $uri/ =404;
        }

        # Modules from sources are rendered on demand by docs-builder (the
        # builder container), as on the public site: nginx reads the pages
        # from the cache volume of docs-builder (/app/ondemand), and asks
        # docs-builder for a page that is not there yet, which answers with
        # a placeholder until it is rendered. The locations are those of the
        # site (.helm/templates/10-cm-moduleslibrary.yaml) without the
        # versions of the embedded modules, which the site takes from S3.
        rewrite ^/modules$ /modules/ redirect;
        rewrite ^/modules/(?<module>[^/.]+)$ /modules/$module/ redirect;
        rewrite ^/modules/(?<module>[^/.]+)/(?<channel>alpha|beta|early-access|stable|rock-solid)$ /modules/$module/$channel/ redirect;
        rewrite ^/modules/(?<module>[^/.]+)/(?<version>v[0-9]+\.[0-9]+\.[0-9]+[^/]*)$ /modules/$module/$version/ redirect;

        # The list of modules, built by docs-builder. It answers with a
        # placeholder until the list is built.
        location ~* ^/modules/$  {
            try_files /ondemand/.index/$lang/modules/index.html @ondemand_render;
        }

        location ~* ^/modules/search-embedded-modules-index.json$  {
            try_files /embedded-modules/$lang/search-embedded-modules-index.json =404;
        }

        # Search index of the modules, built by docs-builder from the versions
        # of the stable channels.
        location ~* ^/modules/search-external-modules-index.json$  {
            try_files /ondemand/.index/$lang/search.json =404;
        }

        # AI export of the modules (see internal/aiexport of docs-builder).
        # The per-page .md files are served by the generic module locations below.
        location ~* ^/modules/embedded-llms\.txt$  {
            try_files /embedded-modules/$lang/embedded-llms.txt =404;
        }

        location ~* ^/modules/embedded-corpus\.json$  {
            try_files /embedded-modules/$lang/embedded-corpus.json =404;
        }

        location ~* ^/modules/external-llms\.txt$  {
            try_files /ondemand/.index/$lang/llms.txt =404;
        }

        location ~* ^/modules/external-corpus\.json$  {
            try_files /ondemand/.index/$lang/corpus.json =404;
        }

        # The cache volume of docs-builder: served only through the locations
        # that rewrite to it.
        location ^~ /ondemand/ {
            internal;
            # A directory typed without the trailing slash: the relative
            # links of its page need it.
            if (-d $ondemand_dir_check) {
                return 301 $ondemand_request_path/$is_args$args;
            }
        }

        # A version of a module, rendered by docs-builder on the first visit,
        # and the list of the versions of a module. A page that is not on the
        # cache volume goes to docs-builder, which renders the version and
        # answers with a placeholder meanwhile.
        location ~ ^/modules/[a-z0-9-]+/(v[0-9]+\.[0-9]+\.[0-9]+[^/]*/|versions/$) {
            root /app/ondemand/.site/$lang;
            set $ondemand_request_path $uri;
            if (-d $ondemand_dir_check) {
                return 301 $ondemand_request_path/$is_args$args;
            }
            try_files $uri $uri/ @ondemand_render;
        }

        location @ondemand_render {
            # docs-builder answers the pages it writes itself (placeholder,
            # versions, not found).
            proxy_intercept_errors off;
            rewrite ^ /$lang$uri break;
            proxy_pass $builder;
        }

        # A module address the cache volume does not have, as it was requested.
        location @ondemand_module {
            proxy_intercept_errors off;
            rewrite ^ /$lang$ondemand_request_path break;
            proxy_pass $builder;
        }

        # The render status the placeholder follows.
        location ~ ^/modules/\.render/(?<render_module>[a-z0-9-]+)/(?<render_version>[^/]+)$ {
            proxy_intercept_errors off;
            proxy_pass $builder/api/v2/render/$render_module/$render_version;
        }

        # The menu of a module.
        location ~ ^/modules/\.menu/(?<menu_module>[a-z0-9-]+)$ {
            proxy_intercept_errors off;
            proxy_pass $builder/api/v2/modules/$menu_module/menu;
        }

        # The versions of a module.
        location ~ ^/modules/\.versions/(?<versions_module>[a-z0-9-]+)$ {
            proxy_intercept_errors off;
            proxy_pass $builder/api/v2/modules/$versions_module/versions;
        }

        # A release channel of a module, or a minor version of Deckhouse: the
        # version docs-builder linked for the channel, else the embedded module
        # of this build (/app/embedded-modules, the site takes it from S3).
        location ~* ^/modules/([^/]+)/(rock-solid|stable|early-access|beta|alpha|latest|v[0-9]+\.[0-9]+)/(.*)$ {
            set $module "$1";
            set $channel "$2";
            set $module_doc "$3";
            set $embedded_modules_path "/embedded-modules/$lang/modules/$1";
            set $ondemand_request_path $uri;
            if (-d /app/ondemand/.site/$lang/modules/$module/$channel) {
               rewrite ^/modules/[^/]+/[^/]+/.*$ /ondemand/.site/$lang/modules/$module/$channel/$module_doc last;
            }
            try_files
              ${embedded_modules_path}/$module_doc
              ${embedded_modules_path}/index.html
              =404;
        }

        # A module without a channel or a version in the address: the version
        # of its stable channel linked by docs-builder, else the embedded
        # module of this build. Neither: docs-builder answers with a
        # placeholder for a module it knows, or its 404.
        location ~* ^/modules/([^./]+)/((?!(v[0-9]+\.[0-9]+|alpha|beta|early-access|stable|rock-solid|latest)).*)$ {
            set $module "$1";
            set $module_doc "$2";
            set $embedded_modules_path "/embedded-modules/$lang/modules/$1";
            set $ondemand_request_path $uri;
            if (-d /app/ondemand/.site/$lang/modules/$module/stable) {
               rewrite ^/ /ondemand/.site/$lang/modules/$module/stable/$module_doc last;
            }
            try_files
              ${embedded_modules_path}/$module_doc
              ${embedded_modules_path}/index.html
              @ondemand_module;
        }

        location ~* ^/products/kubernetes-platform/((gs)/(.*))$  {
            try_files /$lang/$1 /$lang/$1/index.html /$lang/$1/ =404;
        }

        location = /products/kubernetes-platform/documentation/sitemap.xml {
            try_files /$lang/sitemap.xml =404;
        }

        location /downloads/deckhouse-cli-trdl {
            return 302 /products/kubernetes-platform/documentation/v1/deckhouse-cli/;
        }

        location ~* ^/downloads/deckhouse-cli-trdl/(.*)  {
            rewrite ^/downloads/deckhouse-cli-trdl/(.*)$ /$1  break;

            proxy_cache             dcache;
            proxy_cache_key         $uri;
            proxy_cache_methods     GET;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Original-URI    $request_uri;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_buffer_size       16k;
            proxy_buffers           4 16k;
            proxy_ignore_headers    Set-Cookie;
            proxy_ignore_headers    Cache-Control;
            proxy_intercept_errors  on;

            error_page              301 302 307 = @handle_redirects;
            proxy_pass              https://tuf.deckhouse.ru;
        }

        location ~* ^/downloads/deckhouse-installer-trdl/(.*)  {
            rewrite ^/downloads/deckhouse-installer-trdl/(.*)$ /$1  break;

            proxy_cache             dcache;
            proxy_cache_key         $uri;
            proxy_cache_methods     GET;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Original-URI    $request_uri;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_buffer_size       16k;
            proxy_buffers           4 16k;
            proxy_ignore_headers    Set-Cookie;
            proxy_ignore_headers    Cache-Control;
            proxy_intercept_errors  on;

            error_page              301 302 307 = @handle_redirects;
            proxy_pass              https://55826e7c-84ae-42f3-87ed-204e97edfd86.selstorage.ru;
        }

        # DP documentation version
        location ~* ^/products/kubernetes-platform/documentation/(v[0-9]/|v[0-9]\.[0-9]+/|latest/)?(?<doc_path>.*)$  {
            root /app/dkp-docs;
            try_files /$lang/${doc_path} /$lang/${doc_path}/index.html /$lang/${doc_path}/ /${doc_path} /${doc_path}/index.html /${doc_path}/ =404;
        }

        # DVP documentation
        location ~* ^/products/(virtualization-platform/(documentation|modules|gs|reference)/.*)$  {
            error_page 403 404 /products/virtualization-platform/documentation/404.html;
            try_files /$lang/$1 /$lang/$1/index.html /$lang/$1/ $1 $1/index.html $1/ =404;
        }

        # Stronghold documentation
        location ~* ^/products/(stronghold/(documentation|guides|modules|gs|reference)/.*)$  {
            error_page 403 404 /products/stronghold/documentation/404.html;
            try_files /$lang/$1 /$lang/$1/index.html /$lang/$1/ $1 $1/index.html $1/ =404;
        }

        # Code documentation
        location ~* ^/products/(code/(documentation|reference)/.*)$  {
            error_page 403 404 /products/code/documentation/404.html;
            try_files /$lang/$1 /$lang/$1/index.html /$lang/$1/ $1 $1/index.html $1/ =404;
        }

        # Redirect for installer
        location ~* ^/downloads/installer/latest/([^/]+)/([^/]+)$   {
            # $installer_channel_name is mapped to $installer_channel_version (see map above)
            set $installer_channel_name "latest";

            rewrite ^/downloads/installer/latest/([^/]+)/([^/]+)$ /targets/releases/$installer_channel_version/$1/bin/$2  break;

            proxy_cache             dcache;
            proxy_cache_key         "$scheme$request_method$host$request_uri";
            proxy_cache_methods     GET;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Original-URI    $request_uri;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_buffer_size       16k;
            proxy_buffers           4 16k;
            proxy_ignore_headers    Set-Cookie;
            proxy_ignore_headers    Cache-Control;
            proxy_intercept_errors  on;

            error_page              301 302 307 = @handle_redirects;
            proxy_pass              https://55826e7c-84ae-42f3-87ed-204e97edfd86.selstorage.ru;
        }

        # Redirect for installer with specific version
        location ~* ^/downloads/installer/(v[0-9]+\.[0-9]+\.[0-9]+)/([^/]+)/([^/]+)$   {
            rewrite ^/downloads/installer/(v[0-9]+\.[0-9]+\.[0-9]+)/([^/]+)/([^/]+)$ /targets/releases/$1/$2/bin/$3  break;
            rewrite ^ /get  break;

            proxy_cache             dcache;
            proxy_cache_key         "$scheme$request_method$host$request_uri";
            proxy_cache_methods     GET;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Original-URI    $request_uri;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_buffer_size       16k;
            proxy_buffers           4 16k;
            proxy_ignore_headers    Set-Cookie;
            proxy_ignore_headers    Cache-Control;
            proxy_intercept_errors  on;

            error_page              301 302 307 = @handle_redirects;
            proxy_pass              https://55826e7c-84ae-42f3-87ed-204e97edfd86.selstorage.ru;
        }

        location /includes {
            proxy_redirect    off;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Original-URI    $request_uri;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_pass http://router:8080;
        }
        location ~* (/ru|/en)/(?<path>includes/.*)$ {
            proxy_redirect    off;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Original-URI    $path;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_pass http://router:8080;
        }
    }
}
