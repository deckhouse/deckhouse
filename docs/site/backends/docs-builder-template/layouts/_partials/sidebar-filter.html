<script type="text/javascript" src='/assets/js/filter.js?v={{ .Site.Lastmod | time.Format ":date_long" | hash.FNV32a }}'></script>

<div class="filter">
    <h2 class="filter--title">{{ T "filters" | humanize }}</h2>
    <div class="filter__container filter__container--search">
        <h3 class="filter__container--title">{{ T "search_filter" | humanize }}</h3>
        <div class="filter__search">
            <div class="filter__search--container">
                <div class="input-wrapper">
                    <input type="text" id="search-filter" placeholder='{{ T "search_placeholder_text_filter" }}' class="input">
                </div>
            </div>
            <div class="filter__search--filter"></div>
        </div>
    </div>
    <div class="filter__block">
        <div class="filter__container filter__container--editions">
            <h3 class="filter__container--title closing-title">{{ T "editions_filter" | humanize }}</h3>
            <div class="filter__checkboxes filter__checkboxes--editions">
                <input type="checkbox" id="editionsSelectAll" data-select-all="true">
                <label class="filter__checkboxes--all" for="editionsSelectAll">{{ T "editions_filter_all_selected" | humanize }}</label>
                <input type="checkbox" id="editionCORE" value="core">
                <label for="editionCORE">Core</label>
                <input type="checkbox" id="editionEE" value="ee">
                <label for="editionEE">Ultimate/Enterprise Edition</label>
                <input type="checkbox" id="editionCSELite" value="cse-lite">
                <label for="editionCSELite">Certified Core/CSE Lite</label>
                <input type="checkbox" id="editionCSEPro" value="cse-pro">
                <label for="editionCSEPro">Certified Pro/CSE Pro</label>
                <input type="checkbox" id="editionCE" value="ce">
                <label for="editionCE">Open/Community Edition</label>
                <input type="checkbox" id="editionBE" value="be">
                <label for="editionBE">Basic Edition</label>
                <input type="checkbox" id="editionSE" value="se">
                <label for="editionSE">Standard Edition</label>
                <input type="checkbox" id="editionSEPlus" value="se-plus">
                <label for="editionSEPlus">Standard Edition+</label>
            </div>
        </div>
        <div class="filter__container filter__container--extensions">
            <h3 class="filter__container--title closing-title">{{ T "extensions_filter" | humanize }}</h3>
            <div class="filter__checkboxes filter__checkboxes--extensions">
                <input type="checkbox" id="extensionsSelectAll" data-select-all="true">
                <label class="filter__checkboxes--all" for="extensionsSelectAll">{{ T "extensions_filter_all_selected" | humanize }}</label>
                {{- range $id, $ext := hugo.Data.helpers.extensions }}
                <input type="checkbox" id="extension-{{ $id }}" value="{{ $id }}">
                <label for="extension-{{ $id }}">{{ index $ext.title site.Language.Lang | default $ext.title.en }}</label>
                {{- end }}
            </div>
        </div>
        <div class="filter__container filter__container--stages">
            <h3 class="filter__container--title closing-title">{{ T "stage_filter" | humanize }}</h3>
            <div class="filter__checkboxes filter__checkboxes--stages">
                <input type="checkbox" id="stagesSelectAll" data-select-all="true">
                <label class="filter__checkboxes--all" for="stagesSelectAll">{{ T "stage_filter_all_selected" | humanize }}</label>
                <input type="checkbox" id="experimental" value="experimental">
                <label for="experimental">
                    Experimental
                    <img class="zoom-image-disable" src="/images/experimental.svg">
                </label>
                <input type="checkbox" id="preview" value="preview">
                <label for="preview">
                    Preview
                    <img class="zoom-image-disable" src="/images/preview.svg">
                </label>
                <input type="checkbox" id="generalAvailability" value="generalAvailability">
                <label for="generalAvailability">
                    General Availability (GA)
                </label>
                <input type="checkbox" id="deprecated" value="deprecated">
                <label for="deprecated">
                    Deprecated
                    <img class="zoom-image-disable" src="/images/deprecated.svg">
                </label>
            </div>
        </div>
        <div class="filter__container filter__container--tags">
            <h3 class="filter__container--title closing-title">{{ T "tags_filter" | humanize }}</h3>
            <div class="filter__checkboxes filter__checkboxes--tags">
                <!-- <input type="checkbox" id="tagsSelectAll" data-select-all="true">
                <label class="filter__checkboxes--all" for="tagsSelectAll">{{ T "tags_filter_all_selected" | humanize }}</label> -->
            </div>
        </div>
        <div class="filter__block--apply">
            <div class="filter__container filter__container--apply">
                <button type="button" class="apply-filter" disabled>Применить</button>
            </div>
        </div>
    </div>
</div>
