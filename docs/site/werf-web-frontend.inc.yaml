{{- $_ := set . "Env" (.Env | default "EE") }}
{{- $_ := set . "UsePrebuildJekyllImage" true }}
{{- $_ := set . "Mode" "production" }}
{{- $_ := set . "Edition" "EE" }}
{{- if or (eq $.Env "CE") (eq $.Env "BE") (eq $.Env "SE") (eq $.Env "SE-plus") (eq $.Env "EE") (eq $.Env "CSE") -}}
  {{- $_ := set . "Edition" $.Env }}
{{- else if eq $.Env "FE"  }}
  {{- $_ := set . "Edition" "EE" }}
{{- else }}
  {{- $_ := set . "Mode" $.Env }}
{{- end }}

{{- $context := . }}
{{- $_ := set $context "ModulePath" "../../" }}

{{- if and (ne $.Env "development") (ne $.Env "module") (ne $.Env "local") }}
image: site-external-artifacts
fromCacheVersion: v{{ div .Commit.Date.Unix (mul 60 60 24) }}2
from: {{ index $.Images "builder/distroless" }}
final: false
shell:
  beforeInstall:
  - pm install jq yq curl
  setup:
  - mkdir -p /data
  - echo "Getting data from the API server..."
  - curl --fail --retry-delay 5 -H "Referer: {{- env "DOC_API_REFERER" "https://deckhouse.io" }}" --retry 5 {{ env "DOC_API_URL" }}?api-key={{- env "DOC_API_KEY" }} -o /tmp/menus.json
  - |
    jq '.header | if ( ( .en | length) < 1 ) or ( ( .ru | length) < 1 ) then error("Got empty header array!") else ( . | {"topnav": { "en": [{"items": .en}], "ru": [ {"items": .ru}  ]}}) end ' /tmp/menus.json > /data/topnav.json
  - |
    jq '."header-products" | if ( ( .en | length) < 1 ) or ( ( .ru | length) < 1 ) then error("Got empty header array!") else . end | .ru += [{"title":"Airlock","url":"/products/airlock/","items":[{"title":"О продукте","url":"/products/airlock/"},{"title":"Документация","url":"/products/airlock/documentation/","target":"","rel":"doc"}]}]| .en += [{"title":"Airlock","url":"/products/airlock/","items":[{"title":"Documentation","url":"/products/airlock/documentation/","target":"","rel":"doc"}]}]' /tmp/menus.json > /data/topnav-l2-products.json
  - |
    jq '.footer | if ( ( .en | length) < 1 ) or ( ( .ru | length) < 1 ) then error("Got empty footer array!") else ( . | {"columns": . }) end ' /tmp/menus.json > /data/footer.json
  - |
    jq '.copyright | if ( ( .en | length) < 1 ) or ( ( .ru | length) < 1 ) then error("Got empty copyright array!") else . end ' /tmp/menus.json > /data/copyright.json
{{- end }}
---
{{ tpl (.Files.Get (printf "%sdocs/site/werf-islandkit.inc.yaml" .ModulePath)) . }}
---
image: web-frontend-artifact
from: {{ .ModuleName }}/{{ .ImageName }}/base-jekyll
final: false
shell:
  install:
  - |
        echo "Ruby: $(ruby --version)"
        echo "Gem: $(gem --version)"
        echo "Bundle: $(bundle --version)"
  setup:
  - |
        cd /srv/jekyll-data/site/

        # "Render OpenAPI schemas for DVP..."
        export MODULES_RAW_DIR=/rawdata
        export CRD_PATH=virtualization-platform/crds
        export OPENAPI_PATH=virtualization-platform/openapi
        bash _tools/prepare_resources.sh

        # "Building static files"
        mkdir -p /tmp/jekyll && chmod 700 /tmp/jekyll && export TMPDIR=/tmp/jekyll
        export JEKYLL_ENV=production
        mkdir -m 777 -p /app/_site/
        jekyll build -d /app/_site/ --config  _config.yml
        rm -rf .jekyll-cache .sass-cache
git:
# Common files used for building site and documentation (plugins, assets, etc.), plus unversionized products documentation
- add: /docs/documentation
  to: /srv/jekyll-data/site
  includePaths:
  - _assets/js/search.js
  - _data/rbac/
  - _data/reference/public-domains.yml
  - _includes/rbac/
  - _includes/related_links.liquid
  - _plugins/alert.rb
  - _plugins/tabs.rb
  - _plugins/jekyll_asset_pipeline.rb
  - _plugins/codeblock_unknown_lang_fallback.rb
  - _plugins/custom_filters.rb
  - _plugins/breadcrumbs_generator.rb
  - _plugins/custom_sidebar.rb
  - _plugins/editions_not_available.rb
  - _plugins/related_links.rb
  - _plugins/sidebar_custom.rb
  - _plugins/utils.rb
  - _plugins/offtopic.rb
  - _plugins/navigation_helper.rb
  stageDependencies:
    setup: '**/*'
- add: /docs/site
  to: /srv/jekyll-data/site
  excludePaths:
  - '*.md'
  - werf*.yaml
  - docker-compose*.yml
  - .werf
  - .helm
  - backends
  - Makefile
  - images/src
  # Printed by islandkit-artifact and brought in by the import below. These
  # paths must not come from git: in dev mode werf would add locally rendered
  # copies, they would override what the stage built, and the page would be
  # assembled from old fragments with a fresh bundle.
  - _includes/_generated
  - assets/islandkit
  - _data/islandkit_header.json
  - _sass/deckhouse-islands
  # The islandKit snapshot is read by islandkit-artifact alone.
  - _tools/islandkit/snapshot
  stageDependencies:
    install: ['Gemfile','Gemfile.lock']
    setup: '**/*'
- add: /global-hooks/openapi
  to: /rawdata/global
  stageDependencies:
    setup: ['**/*']
  includePaths: ['*config-values.yaml','doc-ru-config-values.yaml']
- add: /candi/openapi
  to: /rawdata/global
  stageDependencies:
    setup: ['**/*']
  includePaths: ['*cluster_configuration.yaml', '*init_configuration.yaml', '*static_cluster_configuration.yaml']
- add: /deckhouse-controller/crds
  to: /rawdata/global
  stageDependencies:
    setup: ['**/*']
import:
  # Header: fragments, their index, the bundle and the styles' Sass are printed
  # by islandkit-artifact. No environment condition - the header is needed in
  # every build, not only in production profiles like the external menu data
  # below.
  - from: islandkit-artifact
    add: /data/_generated
    to: /srv/jekyll-data/site/_includes/_generated
    before: setup
  - from: islandkit-artifact
    add: /data/islandkit_header.json
    to: /srv/jekyll-data/site/_data/islandkit_header.json
    before: setup
  - from: islandkit-artifact
    add: /data/islandkit-assets
    to: /srv/jekyll-data/site/assets/islandkit
    before: setup
  - from: islandkit-artifact
    add: /data/deckhouse-islands
    to: /srv/jekyll-data/site/_sass/deckhouse-islands
    before: setup
{{- if and (ne $.Env "development") (ne $.Env "module") (ne $.Env "local") }}
  - from: site-external-artifacts
    add: /data/topnav.json
    to: /srv/jekyll-data/site/_data/topnav.json
    before: setup
  - from: site-external-artifacts
    add: /data/topnav-l2-products.json
    to: /srv/jekyll-data/site/_data/topnav-l2-products.json
    before: setup
  - from: site-external-artifacts
    add: /data/footer.json
    to: /srv/jekyll-data/site/_data/footer.json
    before: setup
  - from: site-external-artifacts
    add: /data/copyright.json
    to: /srv/jekyll-data/site/_data/copyright.json
    before: setup
---
image: web-frontend-init
from: {{ index $.Images "builder/distroless" }}
shell:
  beforeInstall:
  - pm install jq yq
git:
- add: /{{ .ModulePath }}docs/site/.werf/channels-convert.sh
  to: /scripts/channels-convert.sh
{{- end }}
---
image: nginx-artifact
from: {{ index $.Images "builder/distroless" }}
shell:
  install: pm install nginx -d /out
---
image: web-frontend
{{- if or (eq $.Env "development") (eq $.Env "local") }}
from: {{ index $.Images "builder/alpine" }}
{{- else }}
from: scratch
imageSpec:
  config:
    workingDir: "/app"
    entrypoint: [ "/usr/sbin/nginx", "-g", "daemon off;" ]
{{- end }}
shell:
{{- if or (eq $.Env "development") (eq $.Env "local") }}
  beforeInstall:
  - apk add --no-cache nginx
git:
- add: /{{ .ModulePath }}docs/site/.werf/channels-convert.sh
  to: /scripts/channels-convert.sh
{{- end }}
import:
- from: web-frontend-artifact
  add: /app/_site
  to: /app
  before: setup
  excludePaths:
  - en/includes/
  - ru/includes/
{{- if or (eq $.Env "development") (eq $.Env "local") }}
- from: {{ index $.Images "tools/jq" }}
  add: /usr/bin/jq
  to: /usr/bin/jq
  before: setup
- from: {{ index $.Images "tools/yq" }}
  add: /usr/bin/yq
  to: /usr/bin/yq
  before: setup
- from: {{ .ModuleName }}/modules-embedded/static-artifact
  add: /app/_site/
  to: /app/embedded-modules
  before: setup
  includePaths:
  - en
  - ru
- from: {{ .ModuleName }}/{{ .ImageName }}/static
  add: /app/_site
  to: /app/dkp-docs
  before: setup
---
{{ tpl (.Files.Get (printf "%sdocs/documentation/werf-modules-static.inc.yaml" .ModulePath)) . }}
{{ tpl (.Files.Get (printf "%sdocs/documentation/werf-documentation-static.inc.yaml" .ModulePath)) . }}
{{- else }}
- from: nginx-artifact
  add: /out
  to: /
  before: setup
{{- end }}
