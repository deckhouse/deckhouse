kind: ConfigMap
apiVersion: v1
metadata:
  name: doc-moduleslibrary-nginx-config
data:
  nginx.conf: |-
    worker_processes auto;

    error_log /dev/stderr warn;
    pid       /tmp/nginx.pid;

    events {
      worker_connections 1024;
      multi_accept on;
    }

    http {
      include       /usr/conf/mime.types;
      default_type  application/octet-stream;

      # Add MIME type for ES modules (.mjs files)
      # and for the per-page Markdown of the AI export (.md files).
      types {
        application/javascript mjs;
        text/markdown md;
      }

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      proxy_cache_path /tmp/cache keys_zone=dcache:10m max_size=200m inactive=30m;

      access_log off;

      log_format json_combined escape=json '{ "time_local": "$time_local", '
        '"host": "$host", '
        '"remote_addr": "$remote_addr", '
        '"remote_user": "$remote_user", '
        '"request": "$request", '
        '"status": "$status", '
        '"body_bytes_sent": "$body_bytes_sent", '
        '"request_time": "$request_time", '
        '"http_referrer": "$http_referer", '
        '"http_user_agent": "$http_user_agent" }';

      # The page path of a version for docs-builder (ListenAccessLog): opened
      # versions are evicted last.
      log_format ondemand_access '/$lang$uri';

      keepalive_timeout  65;

      ssi off;
      gzip off;
      port_in_redirect off;
      absolute_redirect off;

      # A directory typed without the trailing slash gets one: the relative
      # links of its page need it. An address with the slash checks a path
      # that is never there, so the only if of the location is false for it:
      # an if that is true without returning drops try_files ("if is evil"),
      # and a version not rendered yet would get a 404 instead of
      # docs-builder.
      map $uri $ondemand_dir_check {
          # Evaluated anew on each use: a cached value would outlive a rewrite.
          volatile;
          ~/$      /nonexistent;
          default  $request_filename;
      }

      map $host $lang {
          hostnames;
          "deckhouse.ru"   "ru";
          "*.deckhouse.ru"   "ru";
          # for test environments
          "deckhouse-ru.*" "ru";
          "deckhouse-ru-2.*" "ru";
          "deckhouse-ru-3.*" "ru";
          "deckhouse-ru-4.*" "ru";
          "deckhouse-ru-5.*" "ru";
          "deckhouse-ru-6.*" "ru";
          "deckhouse-ru-7.*" "ru";
          "deckhouse-ru-8.*" "ru";
          "deckhouse-ru-9.*" "ru";
          "deckhouse-ru-10.*" "ru";
          default       "en";
      }

      # Map channel names to versions
      map $channel_name $channel_version {
          default "latest";
          include /app/channels-data/channels.conf;
      }

      server {
        listen   8080;
        server_name _;

        root   /app;
        index  index.html readme.html;
        error_page 403 404 /$lang/404.html;

        # Intercept proxy errors for processing with the error_page directive. Necessary for S3 handling.
        proxy_intercept_errors on;

        charset utf-8;
        # `charset` only appends the encoding to the types listed here, and the
        # default list has no text/markdown: the per-page Markdown of the AI
        # export would be served without a charset and a browser would guess it.
        charset_types text/xml text/plain text/vnd.wap.wml application/javascript application/rss+xml text/markdown;
        access_log     /dev/stdout json_combined;

        rewrite ^/modules$ /modules/ redirect;
        rewrite ^/modules/(?<module>[^/.]+)$ /modules/$module/ redirect;
        rewrite ^/modules/(?<module>[^/.]+)/(?<channel>alpha|beta|early-access|stable|rock-solid)$ /modules/$module/$channel/ redirect;
        rewrite ^/modules/(?<module>[^/.]+)/(?<version>v[0-9]+\.[0-9]+\.[0-9]+[^/]*)$ /modules/$module/$version/ redirect;

        location /link_test_report.txt {
            deny all;
        }

        location = /healthz {
            access_log  off;
            add_header Content-Type text/plain;
            return 200;
        }

        # The list of modules, built by docs-builder. It answers with a
        # placeholder until the list is built.
        location ~* ^/modules/$  {
            # A page with SSI includes, like the version pages: no gzip copy.
            try_files /ondemand/.index/$lang/modules/index.html @ondemand_render;
        }

        # Search index of the modules, built by docs-builder from the versions
        # of the stable channels.
        location ~* ^/modules/search-external-modules-index.json$  {
            # docs-builder writes a gzip copy of its own index; it carries no
            # SSI includes, so the ingress passes it as is.
            gzip_static on;
            gzip_vary on;
            try_files /ondemand/.index/$lang/search.json =404;
        }

        # AI export of the modules (see internal/aiexport of docs-builder).
        # The per-page .md files are served by the generic module locations below.
        location ~* ^/modules/external-llms\.txt$  {
            # docs-builder writes a gzip copy of its own index; it carries no
            # SSI includes, so the ingress passes it as is.
            gzip_static on;
            gzip_vary on;
            try_files /ondemand/.index/$lang/llms.txt =404;
        }

        location ~* ^/modules/external-corpus\.json$  {
            # docs-builder writes a gzip copy of its own index; it carries no
            # SSI includes, so the ingress passes it as is.
            gzip_static on;
            gzip_vary on;
            try_files /ondemand/.index/$lang/corpus.json =404;
        }

        # The cache volume of docs-builder: served only through the locations
        # that rewrite to it.
        location ^~ /ondemand/ {
            internal;
            # A directory typed without the trailing slash: the relative
            # links of its page need it.
            if (-d $ondemand_dir_check) {
                return 301 $ondemand_request_path/$is_args$args;
            }
        }

        # A version of a module, rendered by docs-builder on the first visit,
        # and the list of the versions of a module. A page that is not on the
        # cache volume goes to docs-builder, which renders the version and
        # answers with a placeholder meanwhile. The pages of a version are
        # the same files the channels pointing at it serve, so the version
        # URL is kept out of search engines by the header, not by the page.
        location ~ ^/modules/[a-z0-9-]+/(v[0-9]+\.[0-9]+\.[0-9]+[^/]*/|versions/$) {
            root /app/ondemand/.site/$lang;
            add_header X-Robots-Tag "noindex" always;
            access_log syslog:server=127.0.0.1:5514,nohostname,tag=docs_ondemand ondemand_access;
            set $ondemand_request_path $uri;
            # A directory typed without the trailing slash: the relative
            # links of its page need it.
            if (-d $ondemand_dir_check) {
                return 301 $ondemand_request_path/$is_args$args;
            }
            try_files $uri $uri/ @ondemand_render;
        }

        location @ondemand_render {
            # docs-builder answers the pages it writes itself (placeholder,
            # versions, not found).
            proxy_intercept_errors off;
            add_header X-Robots-Tag "noindex" always;
            rewrite ^ /$lang$uri break;
            proxy_pass http://127.0.0.1:8081;
        }

        # A module address the bucket does not have, as it was requested.
        # The 404 of docs-builder gets the 404 page of the site.
        location @ondemand_module {
            recursive_error_pages on;
            add_header X-Robots-Tag "noindex" always;
            rewrite ^ /$lang$ondemand_request_path break;
            proxy_pass http://127.0.0.1:8081;
        }

        # The render status the placeholder follows.
        location ~ ^/modules/\.render/(?<render_module>[a-z0-9-]+)/(?<render_version>[^/]+)$ {
            limit_except GET {
                deny all;
            }
            proxy_intercept_errors off;
            proxy_pass http://127.0.0.1:8081/api/v2/render/$render_module/$render_version;
        }

        # The menu of a module.
        location ~ ^/modules/\.menu/(?<menu_module>[a-z0-9-]+)$ {
            limit_except GET {
                deny all;
            }
            proxy_intercept_errors off;
            proxy_pass http://127.0.0.1:8081/api/v2/modules/$menu_module/menu;
        }

        # The versions of a module.
        location ~ ^/modules/\.versions/(?<versions_module>[a-z0-9-]+)$ {
            limit_except GET {
                deny all;
            }
            proxy_intercept_errors off;
            proxy_pass http://127.0.0.1:8081/api/v2/modules/$versions_module/versions;
        }

        # Search index for embedded modules
        location ~* ^/modules/(search-embedded-modules-index\.json|embedded-corpus\.json|embedded-llms\.txt)$  {
            # $channel_name is mapped to $channel_version (see map above)
            set $channel_name "stable";

            rewrite ^/modules/embedded-corpus\.json$ /deckhouse-{{ $.Values.werf.env }}/${channel_version}/modules/$lang/embedded-corpus.json break;
            rewrite ^/modules/embedded-llms\.txt$ /deckhouse-{{ $.Values.werf.env }}/${channel_version}/modules/$lang/embedded-llms.txt break;
            rewrite ^/modules/search-embedded-modules-index\.json$ /deckhouse-{{ $.Values.werf.env }}/${channel_version}/modules/$lang/search-embedded-modules-index.json break;

            limit_except GET {
                deny all;
            }

            resolver                d8-kube-dns.kube-system.svc.cluster.local ipv6=off;

            proxy_cache             dcache;
            proxy_cache_valid       200 30m;
            proxy_cache_valid       304 1m;
            proxy_cache_revalidate         on;
            proxy_cache_background_update  on;
            proxy_cache_use_stale updating error timeout;
            proxy_cache_lock        on;
            proxy_cache_key         $uri;

            proxy_intercept_errors  on;
            proxy_buffering         on;
            proxy_buffer_size       16k;
            proxy_busy_buffers_size 32k;
            proxy_buffers           4 16k;
            proxy_ignore_headers    Set-Cookie;

            proxy_set_header Host   {{ .Values.global.doc_s3_bucket_public_url }};
            proxy_set_header If-Modified-Since $upstream_http_last_modified;
            proxy_set_header If-None-Match $upstream_http_etag;

            proxy_connect_timeout   30s;
            proxy_read_timeout      30s;
            proxy_send_timeout      30s;

            add_header X-Cache-Status $upstream_cache_status always;

            proxy_pass              https://{{ .Values.global.doc_s3_bucket_public_url }};
        }

        # Requests for modules channels - /module/NAME/CHANNEL/...
        location ~* ^/modules/([^/]+)/(rock-solid|stable|early-access|beta|alpha)/(.*)$ {
            set $module "$1";
            set $channel "$2";
            # $channel_name is mapped to $channel_version (see map above)
            set $channel_name "$2";
            set $module_doc "$3";

            # The version the channel points at, rendered by docs-builder.
            set $ondemand_request_path $uri;
            if (-d /app/ondemand/.site/$lang/modules/$module/$channel) {
               rewrite ^/modules/[^/]+/[^/]+/.*$ /ondemand/.site/$lang/modules/$module/$channel/$module_doc last;
            }

            # Redirect for channel names to their corresponding versions for modules served from S3.
            rewrite ^/modules/[^/]+/(rock-solid|stable|early-access|beta|alpha)/$lang/modules/$module/$channel_version/$module_doc redirect;
        }

        # Requests for modules without channel and version in URL - /module/NAME/...
        # This is the default URL for modules documentation and it is indexed by search engines.
        location ~* ^/modules/([^./]+)/((?!(v[0-9]+\.[0-9]+|alpha|beta|early-access|stable|rock-solid|latest)).*)$ {
            set $module "$1";
            # $channel_name is mapped to $channel_version (see map above)
            set $channel_name "stable";
            set $module_doc "$2";

            # The version of the stable channel, rendered by docs-builder.
            set $ondemand_request_path $uri;
            if (-d /app/ondemand/.site/$lang/modules/$module/${channel_name}) {
               rewrite ^/ /ondemand/.site/$lang/modules/$module/$channel_name/$module_doc last;
            }

            # Not in the bucket either: a module docs-builder has not
            # published yet, which leads to its version, or a page that is
            # not there.
            # The bucket answers 403 for a key it does not have.
            error_page 403 404 = @ondemand_module;

            # Serve doc for the stable channel. Don't redirect as it shoud be SEO friendly.
            rewrite /$    /deckhouse-{{ $.Values.werf.env }}/$channel_version/modules/$lang/modules/$module/${module_doc}index.html break;
            rewrite [^/]$ /deckhouse-{{ $.Values.werf.env }}/$channel_version/modules/$lang/modules/$module/$module_doc break;

            limit_except GET {
                deny all;
            }

            resolver                d8-kube-dns.kube-system.svc.cluster.local ipv6=off;

            proxy_cache             dcache;
            proxy_cache_valid       200 30m;
            proxy_cache_valid       304 1m;
            proxy_cache_revalidate         on;
            proxy_cache_background_update  on;
            proxy_cache_use_stale updating error timeout;
            proxy_cache_lock        on;
            proxy_cache_key         $uri;

            proxy_intercept_errors  on;
            proxy_buffering         on;
            proxy_buffer_size       16k;
            proxy_busy_buffers_size 32k;
            proxy_buffers           4 16k;
            proxy_ignore_headers    Set-Cookie;

            proxy_set_header Host   {{ .Values.global.doc_s3_bucket_public_url }};
            proxy_set_header If-Modified-Since $upstream_http_last_modified;
            proxy_set_header If-None-Match $upstream_http_etag;

            proxy_connect_timeout   30s;
            proxy_read_timeout      30s;
            proxy_send_timeout      30s;

            add_header X-Cache-Status $upstream_cache_status always;

            proxy_pass              https://{{ .Values.global.doc_s3_bucket_public_url }};
        }

        # Embedded modules (they are served from s3)
        location ~* ^/modules/([^/]+)/(latest|v1\.[0-9]+)/(.*)$ {
            limit_except GET {
                deny all;
            }

            set $module "$1";
            set $module_version "$2";
            set $module_doc "$3";

            rewrite ^/modules/[^/]+/(latest|v1\.[0-9]+)/$ /deckhouse-{{ $.Values.werf.env }}/${module_version}/modules/$lang/modules/$module/index.html break;
            rewrite ^/modules/[^/]+/(latest|v1\.[0-9]+)/(.+)$ /deckhouse-{{ $.Values.werf.env }}/${module_version}/modules/$lang/modules/$module/$module_doc break;

            resolver                d8-kube-dns.kube-system.svc.cluster.local ipv6=off;

            proxy_cache             dcache;
            proxy_cache_valid       200 30m;
            proxy_cache_valid       304 1m;
            proxy_cache_revalidate         on;
            proxy_cache_background_update  on;
            proxy_cache_use_stale updating error timeout;
            proxy_cache_lock        on;
            proxy_cache_key         $uri;

            proxy_intercept_errors  on;
            proxy_buffering         on;
            proxy_buffer_size       16k;
            proxy_busy_buffers_size 32k;
            proxy_buffers           4 16k;
            proxy_ignore_headers    Set-Cookie;

            proxy_set_header Host   {{ .Values.global.doc_s3_bucket_public_url }};
            proxy_set_header If-Modified-Since $upstream_http_last_modified;
            proxy_set_header If-None-Match $upstream_http_etag;

            proxy_connect_timeout   30s;
            proxy_read_timeout      30s;
            proxy_send_timeout      30s;

            add_header X-Cache-Status $upstream_cache_status always;

            proxy_pass              https://{{ .Values.global.doc_s3_bucket_public_url }};
        }

        location / {
            try_files $uri $uri/ =404;
        }
      }
    }
