---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-pm-artifact
  add: /relocate-pm
  to: /
  before: setup
{{- include "image mount points" . }}
{{- include "pm_binaries_artifact" (dict
      "Images" $.Images
      "name" (printf "%s/%s-pm-artifact" $.ModuleName $.ImageName)
      "packages" "netcat coreutils bash"
      "binaries" "/usr/bin/sh /usr/bin/bash /usr/bin/chown /usr/bin/chmod /usr/bin/ls /usr/bin/cp /usr/bin/rm /usr/bin/mkdir /usr/bin/sleep /usr/bin/true /usr/bin/nc") }}
