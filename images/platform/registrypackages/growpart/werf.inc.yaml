{{- $cloud_utils_version := include "get_oss_version_by_id" (list "cloud-utils" $ )  -}}
{{- $image_version := $cloud_utils_version | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /
  to: /
  includePaths:
  - opt/deckhouse
  - install
  - uninstall
  before: install
imageSpec:
  config:
    labels: { "distro": "all", "version": "all" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
{{- /*
  Only cloud-utils is cloned. growpart is a shell script and container-factory has no
  package for it, so this is the one piece that still comes from source; fdisk and sfdisk,
  which used to mean building util-linux statically here, now come from pm.
*/}}
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/src" }}
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
  - git clone -b {{ $cloud_utils_version }} --depth 1 $(cat /run/secrets/SOURCE_REPO)/canonical/cloud-utils.git /src/cloud-utils
  - rm -rf /src/cloud-utils/.git
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /{{ $.ImagePath }}/scripts
  to: /
  stageDependencies:
    install:
    - '**/*'
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
shell:
  beforeInstall:
  - pm install file findutils patchelf
  install:
  # -n, because without it pm consults the builder's own package index and skips whatever
  # is already installed there — glibc among it. The tree under /pm would then come out
  # without its loader and the package would ship nothing that starts on a node.
  - pm install -n util-linux -d /pm
  - mkdir -p /opt/deckhouse/bin /opt/deckhouse/lib
  - cp -pr /pm/usr/sbin/fdisk /pm/usr/sbin/sfdisk /opt/deckhouse/bin
  - cp -pr /src/cloud-utils/bin/growpart /opt/deckhouse/bin/growpart
  - chmod +x /opt/deckhouse/bin/growpart
  # growpart is a script, so the ELF checks below step over it and nothing else would
  # notice if the clone stopped putting it there.
  - test -x /opt/deckhouse/bin/growpart
  {{- include "relocate_and_verify" (dict "resolve" "/pm" "smoke" (list "/opt/deckhouse/bin/fdisk -V" "/opt/deckhouse/bin/sfdisk -v")) | nindent 2 }}
