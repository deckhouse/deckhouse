---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: scratch
fromCacheVersion: "2025-06-24 13:00"
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /
  to: /
  includePaths:
    - opt/deckhouse
    - install
    - uninstall
  before: install
imageSpec:
  config:
    labels: { "distro": "all", "version": "all" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /{{ $.ImagePath }}/scripts
  to: /
  stageDependencies:
    install:
    - '**/*'
shell:
  beforeInstall:
  - pm install file findutils patchelf
  install:
  # -n, because without it pm consults the builder's own package index and skips whatever
  # is already installed there — glibc among it. The tree under /src would then come out
  # without its loader and the package would ship nothing that starts on a node.
  - pm install -n nfs-utils -d /src
  - mkdir -p /opt/deckhouse/bin /opt/deckhouse/lib
  # Only the four mount helpers. pm's sbin also carries key.dns_resolver and request-key,
  # which belong to the kernel keyring plumbing and which the install script never links.
  - cp -pr /src/sbin/mount.nfs /src/sbin/mount.nfs4 /src/sbin/umount.nfs /src/sbin/umount.nfs4 /opt/deckhouse/bin
  # The idmap backends are opened with dlopen, so no resolution reaches them.
  - cp -pr /src/usr/lib/libnfsidmap /opt/deckhouse/lib
  - find /opt/deckhouse/lib -type f \( -name "*.la" -o -name "*.a" \) -delete
  {{- include "relocate_and_verify" (dict "resolve" "/src" "smoke" (list "/opt/deckhouse/bin/mount.nfs -V" "/opt/deckhouse/bin/mount.nfs4 -V")) | nindent 2 }}
