{{- $version := include "get_oss_version_by_id" (list "which" $ )  -}}
{{- $image_version := $version | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /
  to: /
  includePaths:
  - which
  - install
  - uninstall
  before: setup
imageSpec:
  config:
    labels: {"distro": "all", "version": "all", "which": "{{ $version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/src" }}
git:
- url: {{ $.SOURCE_REPO }}/gnu/which.git
  tag: v{{ $version }}
  add: /
  to: /src/which
- add: /{{ $.ImagePath }}/scripts
  to: /src/scripts
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
from: {{ index $.Images "builder/alpine" }}
final: false
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: setup
shell:
  install:
  {{- include "alpine packages proxy" . | nindent 2 }}
  - apk add --no-cache make build-base gcc binutils
  setup:
  - cd /src/which
  - export CFLAGS="-static -O2 -s"
  - export LDFLAGS="-static"
  - ./configure --disable-nls --disable-rpath
  - make
  - strip ./which
  - ./which --version
  - mv ./which /which
  - mv /src/scripts/* /
  - chmod +x /which /install /uninstall
