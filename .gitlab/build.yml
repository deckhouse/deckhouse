    - .build_ce
    - .rules:on_main_manual

build_ee:main:
  extends:
    - .build_ee
    - .rules:on_main_manual

build_be:main:
  extends:
    - .build_be
    - .rules:on_main_manual

build_se:main:
  extends:
    - .build_se
    - .rules:on_main_manual

build_se_plus:main:
  extends:
    - .build_se_plus
    - .rules:on_main_manual

build_cse:main:
  extends:
    - .build_cse
    - .rules:on_main_manual

# ---------------------------------------------------------------------------
# merge request: FE + tests automatic; other editions manual
# ---------------------------------------------------------------------------

build_fe:mr:
