    - .rules:on_merge_request_manual

build_ee:mr:
  extends:
    - .build_ee
    - .rules:on_merge_request_manual

build_be:mr:
  extends:
    - .build_be
    - .rules:on_merge_request_manual

build_se:mr:
  extends:
    - .build_se
    - .rules:on_merge_request_manual

build_se_plus:mr:
