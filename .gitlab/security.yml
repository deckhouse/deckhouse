# Source security scan (GitHub security-scan-src.yml subset). PR-only.
# Mirrors deckhouse/modules-actions gitleaks@v15 diff mode (no JS action).

gitleaks_scan:
  stage: validate
  needs: []
  extends:
    - .rules:on_merge_request
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"
    GITLEAKS_VERSION: "8.28.0"
    GITLEAKS_ACTION_REF: v15
  image: ${CI_REGISTRY}/deckhouse/ssdlc/ci-images/tools/golang-tools:${CI_IMAGES_TAG}
  script:
    - |
      curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
        | tar -xz -C /tmp gitleaks
      chmod +x /tmp/gitleaks
      /tmp/gitleaks version
    - |
      # Same centralized base config the GitHub composite action vendors into the workspace.
      curl -sSfL -o gitleaks.base.toml \
        "https://raw.githubusercontent.com/deckhouse/modules-actions/${GITLEAKS_ACTION_REF}/gitleaks/config/gitleaks.base.toml"
      test -s gitleaks.base.toml
    - |
      if [[ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]]; then
        LOG_OPTS="${CI_MERGE_REQUEST_DIFF_BASE_SHA}..${CI_COMMIT_SHA}"
      elif [[ -n "${CI_COMMIT_BEFORE_SHA:-}" && "${CI_COMMIT_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
        LOG_OPTS="${CI_COMMIT_BEFORE_SHA}..${CI_COMMIT_SHA}"
      else
        LOG_OPTS="${CI_COMMIT_SHA}^..${CI_COMMIT_SHA}"
      fi
      echo "gitleaks diff range: ${LOG_OPTS}"
      /tmp/gitleaks detect \
        --source "${CI_PROJECT_DIR}" \
        --config "${CI_PROJECT_DIR}/.gitleaks.toml" \
        --log-opts "${LOG_OPTS}" \
        --no-banner \
        --redact \
        --report-format json \
        --report-path gitleaks.json \
        --exit-code 1
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gitleaks.json
