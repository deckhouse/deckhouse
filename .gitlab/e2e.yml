# E2E pipelines via e2e-framework (Commander).
# Start: GitLab UI "New pipeline" (web) or Pipelines API (api).
#
# Instruction: 1.md
# Framework template: .gitlab/ci-templates/e2e-framework.yml
# Providers without CSE: e2e-framework/src/providers.py + CI templates
#   (Static has no CI template — excluded; StaticCSE/DVPCSE/Custom excluded)

include:
  - local: .gitlab/ci-templates/e2e-framework.yml
    inputs:
      runner_tag: k8s-intteam-cloud-d8-ssdlc-runner

variables:
  # Same JWT role as other GitLab jobs in this repo (.gitlab/*.yml → VAULT_AUTH_ROLE).
  VAULT_ROLE: "deckhouse"

  E2E_PROVIDER:
    value: "Yandex"
    options:
      - "Yandex"
      - "AWS"
      - "Azure"
      - "GCP"
      - "OpenStack"
      - "Vsphere"
      - "DVP"
      - "Zvirt"
      - "VCD"
      - "Huawei"
      - "StaticPrivate"
    description: "Cloud provider for e2e-framework (providers without CSE)."

  E2E_EDITION:
    value: "EE"
    options:
      - "FE"
      - "CE"
      - "EE"
    description: "Deckhouse edition to install (maps to build_* job / image tag suffix)."

  KUBERNETES_VERSION:
    value: "Automatic"
    options:
      - "Automatic"
      - "1.32"
      - "1.33"
      - "1.34"
      - "1.35"
      - "1.36"
    description: "Kubernetes version (candi/version_map.yml)."

  E2E_UPDATE_DECKHOUSE:
    value: "false"
    options:
      - "false"
      - "true"
    description: "Run deckhouse update after cluster create (requires UPDATE_IMAGE_TAG)."

  UPDATE_IMAGE_TAG:
    value: ""
    description: "Target image tag for deckhouse update (used when E2E_UPDATE_DECKHOUSE=true)."

  TASKFILE_COMMAND:
    value: "task -t testing/e2e-framework/Taskfile.yml smoke"
    description: "task command for e2e-tests job."

# ---------------------------------------------------------------------------
# Find edition build on existing branch/tag pipeline and play/wait if needed
# ---------------------------------------------------------------------------

e2e-ensure-build:
  extends:
    - .rules:on_e2e
  stage: e2e-ensure-build
  timeout: 4h
  interruptible: false
  needs: []
  image: ${CI_REGISTRY}/deckhouse/ssdlc/ci-images/tools/curl:${CI_IMAGES_TAG}
  variables:
    DOTENV_FILE: e2e-build.env
    GIT_STRATEGY: fetch
    VAULT_AUTH_PATH: fox
    VAULT_AUTH_ROLE: deckhouse
  id_tokens:
    VAULT_ID_TOKEN:
      aud: gitlab-access-aud
  secrets:
    FOX_TOKEN:
      vault: 6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/boatswain/BOATSWAIN_GITHUB_TOKEN/foxtoken@projects
      token: $VAULT_ID_TOKEN
      file: false
  script:
    - chmod +x .gitlab/scripts/e2e-ensure-build.sh
    - .gitlab/scripts/e2e-ensure-build.sh
  artifacts:
    reports:
      dotenv: e2e-build.env
    expire_in: 3 days

# ---------------------------------------------------------------------------
# Shared e2e job wiring
# ---------------------------------------------------------------------------

.e2e-needs-build:
  interruptible: false
  needs:
    - job: e2e-ensure-build
      artifacts: true

e2e-prestart:
  extends:
    - .e2e-prestart
    - .rules:on_e2e
    - .e2e-needs-build
  stage: e2e-prestart
  variables:
    DOTENV_FILE: dotenv-e2e.env

.e2e-provider-create:
  interruptible: false
  stage: e2e-create
  needs:
    - job: e2e-ensure-build
      artifacts: true
    - job: e2e-prestart
      artifacts: true

# ---------------------------------------------------------------------------
# Per-provider jobs (PROVIDER values from e2e-framework CloudProviderFactory,
# excluding *CSE* and Custom; Static omitted — no CI template).
# ---------------------------------------------------------------------------

# --- Yandex ---
e2e-yandex-create:
  extends:
    - .e2e-yandex-create-cluster
    - .e2e-provider-create
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $E2E_PROVIDER == "Yandex"

e2e-yandex-update:
  extends:
    - .e2e-yandex-update-deckhouse
  stage: e2e-update-deckhouse
  needs:
    - job: e2e-prestart
      artifacts: true
    - job: e2e-yandex-create
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $E2E_PROVIDER == "Yandex" && $E2E_UPDATE_DECKHOUSE == "true"

e2e-yandex-tests:
  extends:
    - .e2e-yandex-run-tests
  stage: e2e-tests
  variables:
    TASKFILE_COMMAND: $TASKFILE_COMMAND
  needs:
    - job: e2e-prestart
      artifacts: true
    - job: e2e-yandex-create
    - job: e2e-yandex-update
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $E2E_PROVIDER == "Yandex"

e2e-yandex-delete:
  extends:
    - .e2e-yandex-delete-cluster
  stage: e2e-delete
  needs:
    - job: e2e-prestart
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $E2E_PROVIDER == "Yandex"

e2e-yandex-delete-auto:
  extends:
    - .e2e-yandex-delete-cluster
  stage: e2e-delete
  when: on_success
  needs:
    - job: e2e-prestart
      artifacts: true
    - job: e2e-yandex-tests
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $E2E_PROVIDER == "Yandex"

