# Pipeline creation rules.
# Pipeline runs only for: tags, main, merge requests, release-x.xx branches.
workflow:
  # Cancel previous pipeline jobs for the same ref when a new commit arrives
  # (MR pushes, main pushes). Jobs with interruptible: false are kept.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # 1) Tag creation
    - if: $CI_COMMIT_TAG
    # 2) Push to main
    - if: $CI_COMMIT_BRANCH == "main"
    # 3) Merge request
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # 4) Push to release-x.xx (e.g. release-1.76)
    - if: $CI_COMMIT_BRANCH =~ /^release-\d+\.\d+$/
    # 5) Sheduled pipelines
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Fallback: block all other pipeline sources by default
    - when: never

# Reusable job-level rules (use via: extends: .rules:...)

.rules:on_tag:
  rules:
    - if: $CI_COMMIT_TAG

.rules:on_main:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

.rules:on_merge_request:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.rules:on_release_branch:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release-\d+\.\d+$/

.rules:on_schedule_cve_scans:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $DKP_CVE_SCANS_ENABLE == "true"

# Manual edition builds (MR / main). Release-branch editions are automatic.
.rules:on_main_manual:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

.rules:on_merge_request_manual:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual

# Pre-build unit/lint jobs and doc_web: PR + main + release-x.xx
# (matches GH build-and-test_{dev,main,pre-release}; not on tags).
.rules:on_validate:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^release-\d+\.\d+$/

# Post-build tests that need the published tests image (same contexts as on_validate).
.rules:on_test:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        TESTS_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}-tests
        DEV_IMAGE_TAG: $CI_COMMIT_REF_SLUG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        TESTS_IMAGE_TAG: pr${CI_MERGE_REQUEST_IID}-tests
        DEV_IMAGE_TAG: pr$CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH =~ /^release-\d+\.\d+$/
      variables:
        TESTS_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}-tests
        DEV_IMAGE_TAG: $CI_COMMIT_REF_SLUG

# PR + main only (GH security_scan / main_web_build).
.rules:on_pr_main:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        DEV_IMAGE_TAG: $CI_COMMIT_REF_SLUG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        DEV_IMAGE_TAG: pr$CI_MERGE_REQUEST_IID

# node-controller tests: PR only when those paths change (GH paths-filter).
.rules:on_merge_request_node_controller:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - modules/040-node-manager/images/node-controller/**/*

# Docs spellcheck: PR when documentation-related paths change (GH docs filter).
.rules:on_merge_request_docs:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.md"
        - "docs/**/*"
        - "**/crds/**/*"
        - "**/openapi/*config-values.yaml"
        - "candi/**/openapi/**/*"
        - "ee/candi/**/openapi/**/*"
