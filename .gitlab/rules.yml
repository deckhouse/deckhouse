# Pipeline creation rules.
# Pipeline runs only for: tags, main, merge requests, release-x.xx branches.
workflow:
  rules:
    # 1) Tag creation
    - if: $CI_COMMIT_TAG
    # 2) Push to main
    - if: $CI_COMMIT_BRANCH == "main"
    # 3) Merge request
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # 4) Push to release-x.xx (e.g. release-1.76)
    - if: $CI_COMMIT_BRANCH =~ /^release-\d+\.\d+$/
    # 5) Sheduled pipelines
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Fallback: block all other pipeline sources by default
    - when: never

# Reusable job-level rules (use via: extends: .rules:...)

.rules:on_tag:
  rules:
    - if: $CI_COMMIT_TAG

.rules:on_main:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

.rules:on_merge_request:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.rules:on_release_branch:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release-\d+\.\d+$/

.rules:on_schedule_cve_scans:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $DKP_CVE_SCANS_ENABLE == "true"

# Manual edition builds (non-tag contexts).
.rules:on_main_manual:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

.rules:on_merge_request_manual:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual

.rules:on_release_branch_manual:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release-\d+\.\d+$/
      when: manual

# Compact rules for jobs that run on every build pipeline context
# (tag, main, MR, release-x.xx) — used by validate jobs.
.rules:on_validate:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^release-\d+\.\d+$/

# Post-build tests: same coverage as on_validate, plus predictable
# TESTS_IMAGE_TAG matching build_tests publish (prIID / ref slug).
.rules:on_test:
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        TESTS_IMAGE_TAG: $CI_COMMIT_REF_SLUG
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        TESTS_IMAGE_TAG: $CI_COMMIT_REF_SLUG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        TESTS_IMAGE_TAG: pr$CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH =~ /^release-\d+\.\d+$/
      variables:
        TESTS_IMAGE_TAG: $CI_COMMIT_REF_SLUG
