# Update the release-channels ConfigMap consumed by the deckhouse-web site/API
# on the deckhouse-web clusters, once a release channel has been fully
# deployed (deploy:<channel> succeeded for every edition).
#
# KUBECONFIG_BASE64_PROD_25 / KUBECONFIG_BASE64_DEV come from the same Vault
# secret engine as DOC_API_KEY in .gitlab/web.yml. Same note as in
# release.yml: resolved as plain "vault:<path>#<field>" variables via
# import_vault_secrets (tolerant of a denied/failed lookup — the cluster is
# just skipped, see .gitlab/scripts/patch-channel-configmap.sh), not GitLab
# native `secrets:`, which would hard-fail the job outright if this ever
# runs outside deckhouse/deckhouse.
#
# Runs on the default k8s executor (tools/golang-tools image, same as
# k8s-autoupdate.yml) — werf and d8 are installed inline via the shared
# script references, same as on VM runners.

.release_web_base:
  stage: deploy
  image: ${CI_REGISTRY}/deckhouse/ssdlc/ci-images/tools/golang-tools:${CI_IMAGES_TAG}
  needs: []
  variables:
    VAULT_ADDR: "https://seguro.flant.com"
    VAULT_AUTH_PATH: fox
    VAULT_AUTH_ROLE: deckhouse
    KUBECONFIG_BASE64_PROD_25: "vault:projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/documentation_deploy_secret#KUBECONFIG_BASE64_PROD_25"
    KUBECONFIG_BASE64_DEV: "vault:projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/documentation_deploy_secret#KUBECONFIG_BASE64_DEV"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: gitlab-access-aud
  before_script:
    - !reference [.scripts, read_werf_version]
    - !reference [.scripts, install_werf]
    - !reference [.scripts, install_d8]
    - !reference [.scripts, import_vault_secrets]
  script:
    - bash .gitlab/scripts/patch-channel-configmap.sh

deploy_channels_web:alpha:
  extends:
    - .release_web_base
    - .rules:on_tag_manual
  variables:
    RELEASE_CHANNEL: alpha
  needs:
    - job: deploy:alpha

deploy_channels_web:beta:
  extends:
    - .release_web_base
    - .rules:on_tag_manual
  variables:
    RELEASE_CHANNEL: beta
  needs:
    - job: deploy:beta

deploy_channels_web:early-access:
  extends:
    - .release_web_base
    - .rules:on_tag_manual
  variables:
    RELEASE_CHANNEL: early-access
  needs:
    - job: deploy:early-access

deploy_channels_web:stable:
  extends:
    - .release_web_base
    - .rules:on_tag_manual
  variables:
    RELEASE_CHANNEL: stable
  needs:
    - job: deploy:stable

deploy_channels_web:rock-solid:
  extends:
    - .release_web_base
    - .rules:on_tag_manual
  variables:
    RELEASE_CHANNEL: rock-solid
  needs:
    - job: deploy:rock-solid
