# Post-build tests that run inside the published `tests` image (k8s executor).
# Image tag is predictable (prIID / ref slug) — published by build_tests via publish_image.
# DOCKER_AUTH_CONFIG is built from Vault secrets (resolved before job start / image pull).

.needs_build_tests:
  needs:
    - job: build_tests:mr
      optional: true
      artifacts: true
    - job: build_tests:main
      optional: true
      artifacts: true
    - job: build_tests:tag
      optional: true
      artifacts: true
    - job: build_tests:release
      optional: true
      artifacts: true

.needs_build_fe:
  needs:
    - job: build_fe:mr
      optional: true
      artifacts: true
    - job: build_fe:main
      optional: true
      artifacts: true
    - job: build_fe:tag
      optional: true
      artifacts: true
    - job: build_fe:release
      optional: true
      artifacts: true

.test_base:
  stage: test
  timeout: 2h
  image:
    name: ${DECKHOUSE_DEV_REGISTRY_HOST}/sys/deckhouse-oss/tests:${TESTS_IMAGE_TAG}
    pull_policy: always
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"
    VAULT_AUTH_PATH: fox
    VAULT_AUTH_ROLE: deckhouse
    TEST_TIMEOUT: 15m
    HOME: "/tmp"
    GOMODCACHE: ${HOME}/.cache/go-mod
    # username/password form — no base64; if pull fails, switch to "auth" field.
    DOCKER_AUTH_CONFIG: "{\"auths\":{\"${DECKHOUSE_DEV_REGISTRY_HOST}\":{\"username\":\"${DECKHOUSE_DEV_REGISTRY_USER}\",\"password\":\"${DECKHOUSE_DEV_REGISTRY_PASSWORD}\"}}}"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: gitlab-access-aud
  secrets:
    DECKHOUSE_DEV_REGISTRY_HOST:
      vault: 6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/registry_host/DECKHOUSE_DEV_REGISTRY_HOST@projects
      token: $VAULT_ID_TOKEN
      file: false
    DECKHOUSE_DEV_REGISTRY_USER:
      vault: 101ceaca-97cd-462f-aed5-070d9b9de175/dev-registry/writetoken/login@projects
      token: $VAULT_ID_TOKEN
      file: false
    DECKHOUSE_DEV_REGISTRY_PASSWORD:
      vault: 101ceaca-97cd-462f-aed5-070d9b9de175/dev-registry/writetoken/password@projects
      token: $VAULT_ID_TOKEN
      file: false

dhctl_tests:
  extends:
    - .test_base
    - .needs_build_tests
    - .rules:on_test
  variables:
    GIT_STRATEGY: none
  script:
    - |
      set -euo pipefail
      echo "Tests image tag: '${TESTS_IMAGE_TAG}'"
      cd /deckhouse/dhctl
      make ci

golint:
  extends:
    - .test_base
    - .needs_build_tests
    - .rules:on_test
  script:
    - |
      set -euo pipefail
      if [[ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]]; then
        export DIFF_BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
      elif [[ -n "${CI_COMMIT_BEFORE_SHA:-}" && "${CI_COMMIT_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
        export DIFF_BASE="${CI_COMMIT_BEFORE_SHA}"
      else
        export DIFF_BASE="$(git rev-parse HEAD^)"
      fi
      echo "DIFF_BASE=${DIFF_BASE}"
      echo "Tests image tag: '${TESTS_IMAGE_TAG}'"
      git config --global --add safe.directory "${CI_PROJECT_DIR}"
      make lint-changed

openapi_test_cases:
  extends:
    - .test_base
    - .needs_build_tests
    - .rules:on_test
  script:
    - |
      set -euo pipefail
      echo "Tests image tag: '${TESTS_IMAGE_TAG}'"
      ginkgo -vet=off ./testing/openapi_cases/

validators:
  extends:
    - .test_base
    - .needs_build_tests
    - .rules:on_test
  script:
    - |
      set -euo pipefail
      echo "Tests image tag: '${TESTS_IMAGE_TAG}'"
      go run gotest.tools/gotestsum@latest -- -tags=validation -run Validation -timeout="${TEST_TIMEOUT}" ./testing/...

# Rootless / default-user scan on built FE images (needs docker + crane on host).
.security_scan_base:
  stage: test
  tags:
    - vm-intteam-cloud-d8-ssdlc-runner
  timeout: 2h
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"
    VAULT_AUTH_PATH: fox
    VAULT_AUTH_ROLE: deckhouse
  id_tokens:
    VAULT_ID_TOKEN:
      aud: gitlab-access-aud
  secrets:
    DECKHOUSE_DEV_REGISTRY_HOST:
      vault: 6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/registry_host/DECKHOUSE_DEV_REGISTRY_HOST@projects
      token: $VAULT_ID_TOKEN
      file: false
    DECKHOUSE_DEV_REGISTRY_USER:
      vault: 101ceaca-97cd-462f-aed5-070d9b9de175/dev-registry/writetoken/login@projects
      token: $VAULT_ID_TOKEN
      file: false
    DECKHOUSE_DEV_REGISTRY_PASSWORD:
      vault: 101ceaca-97cd-462f-aed5-070d9b9de175/dev-registry/writetoken/password@projects
      token: $VAULT_ID_TOKEN
      file: false
    DECKHOUSE_PRIVATE_REPO:
      vault: 6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/fox_pull_secret/DECKHOUSE_PRIVATE_REPO@projects
      token: $VAULT_ID_TOKEN
      file: false
  before_script:
    - !reference [.scripts, docker_config_isolation]
    - !reference [.scripts, login_dev_registry]

security_scan_images:
  extends:
    - .security_scan_base
    - .needs_build_fe
    - .rules:on_validate
  script:
    - |
      set -euo pipefail
      if [[ -n "${CI_MERGE_REQUEST_IID:-}" ]]; then
        TAG="pr${CI_MERGE_REQUEST_IID}"
      else
        TAG="${CI_COMMIT_REF_SLUG}"
      fi
      export TAG
      export IMAGE="${DECKHOUSE_DEV_REGISTRY_HOST}/sys/deckhouse-oss"
      export DECKHOUSE_PRIVATE_REPO
      echo "⚓️ 🏎 Running default user validation on ${TAG}..."
      make cve-base-images-check-default-user
