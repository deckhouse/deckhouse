# Promote to prod registry, and deploy release tags by release channel.
#
# Manual jobs on tag pipelines only (stage: deploy). Mirrors the GitHub
# Actions promote_image.yml / deploy-<channel>.yml workflows:
#   - promote:tag       -> stage registry to prod registry, per edition.
#   - deploy:<channel>  -> republish a release tag under a channel tag
#                          (alpha/beta/early-access/stable/rock-solid),
#                          per edition.
#
# Deploying to early-access, stable or rock-solid requires first running
# check_release_operator:<channel>, which fails if the person approving the
# deploy is the same person who pushed the release tag.
#
# Outside the deckhouse/deckhouse project (forks/test projects), images are
# published to this project's built-in registry ($CI_REGISTRY) instead of
# the prod registry — see .gitlab/scripts/{promote-image,deploy-channel}.sh.

.release_base:
  stage: deploy
  tags:
    - vm-intteam-cloud-d8-ssdlc-runner
  needs: []
  variables:
    VAULT_ADDR: "https://seguro.flant.com"
    VAULT_AUTH_PATH: fox
    VAULT_AUTH_ROLE: deckhouse
    DECKHOUSE_REGISTRY_STAGE_HOST: "vault:projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/registry_host#DECKHOUSE_REGISTRY_STAGE_HOST"
    DECKHOUSE_REGISTRY_STAGE_USER: "vault:projects/data/101ceaca-97cd-462f-aed5-070d9b9de175/stage-registry/writetoken#login"
    DECKHOUSE_REGISTRY_STAGE_PASSWORD: "vault:projects/data/101ceaca-97cd-462f-aed5-070d9b9de175/stage-registry/writetoken#password"
    DECKHOUSE_READ_REGISTRY_HOST: "vault:projects/data/101ceaca-97cd-462f-aed5-070d9b9de175/registry_host#DECKHOUSE_READ_REGISTRY_HOST"
    DECKHOUSE_READ_REGISTRY_USER: "vault:projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/registry_read_token#login"
    DECKHOUSE_READ_REGISTRY_PASSWORD: "vault:projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/registry_read_token#password"
    # Prod/write registry: only resolves in the deckhouse/deckhouse project —
    # empty everywhere else, which is what the fork-fallback check in
    # promote-image.sh/deploy-channel.sh keys off of.
    DECKHOUSE_REGISTRY_HOST: "vault:projects/data/101ceaca-97cd-462f-aed5-070d9b9de175/registry_host#DECKHOUSE_REGISTRY_HOST"
    DECKHOUSE_REGISTRY_USER: "vault:projects/data/101ceaca-97cd-462f-aed5-070d9b9de175/registry-write/deckhouse-admin#login"
    DECKHOUSE_REGISTRY_PASSWORD: "vault:projects/data/101ceaca-97cd-462f-aed5-070d9b9de175/registry-write/deckhouse-admin#password"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: gitlab-access-aud
  before_script:
    - !reference [.scripts, docker_config_isolation]
    - !reference [.scripts, read_werf_version]
    - !reference [.scripts, install_werf]
    - !reference [.scripts, install_d8]
    - !reference [.scripts, import_vault_secrets]
    - !reference [.scripts, login_stage_registry]
    - !reference [.scripts, login_write_registry]
    - !reference [.scripts, login_read_registry]

# Same WERF_ENV values as build_*:tag in .gitlab/build.yml. Those jobs aren't
# a parallel:matrix themselves (each edition is its own named job), so this
# stays a plain static needs list — every promote:tag instance waits for all
# of them, not just its own edition.
.needs_build_tag: &needs_build_tag
  - job: build_fe:tag
  - job: build_ce:tag
  - job: build_ee:tag
  - job: build_be:tag
  - job: build_se:tag
  - job: build_se_plus:tag

# promote:tag IS a WERF_ENV parallel:matrix job, so deploy:<channel> below can
# depend on the matching edition instance via a matrix expression
# (GitLab 18.6+, docs.gitlab.com/ci/yaml/matrix_expressions).
.needs_promote_tag: &needs_promote_tag
  job: promote:tag
  parallel:
    matrix:
      - WERF_ENV: ['$[[ matrix.WERF_ENV ]]']

promote:tag:
  extends:
    - .release_base
    - .rules:on_tag_manual
  needs: *needs_build_tag
  parallel:
    matrix:
      - WERF_ENV: [CE, EE, FE, BE, SE, SE-plus]
  script:
    - bash .gitlab/scripts/promote-image.sh

# ---------------------------------------------------------------------------
# Self-review gate: required before deploying to a channel above EarlyAccess.
# Runs on the default k8s executor (tools/curl image, same as
# e2e-ensure-build in .gitlab/e2e.yml) — just curl + jq against the GitLab API.
# FOX_TOKEN isn't restricted to the main project (already used the same way,
# unconditionally, in .gitlab/changelog-update.yml), so this keeps using
# GitLab-native `secrets:` — no need for the vault: marker/import dance.
# ---------------------------------------------------------------------------

.check_release_operator_base:
  stage: deploy
  image: ${CI_REGISTRY}/deckhouse/ssdlc/ci-images/tools/curl:${CI_IMAGES_TAG}
  needs: []
  variables:
    VAULT_AUTH_PATH: fox
    VAULT_AUTH_ROLE: deckhouse
  id_tokens:
    VAULT_ID_TOKEN:
      aud: gitlab-access-aud
  secrets:
    FOX_TOKEN:
      vault: 6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/boatswain/BOATSWAIN_GITHUB_TOKEN/foxtoken@projects
      token: $VAULT_ID_TOKEN
      file: false
  script:
    - bash .gitlab/scripts/check-release-operator.sh

check_release_operator:early-access:
  extends:
    - .check_release_operator_base
    - .rules:on_tag_manual
  variables:
    RELEASE_CHANNEL: early-access

check_release_operator:stable:
  extends:
    - .check_release_operator_base
    - .rules:on_tag_manual
  variables:
    RELEASE_CHANNEL: stable

check_release_operator:rock-solid:
  extends:
    - .check_release_operator_base
    - .rules:on_tag_manual
  variables:
    RELEASE_CHANNEL: rock-solid

# ---------------------------------------------------------------------------
# Deploy a release tag by release channel, per edition.
# ---------------------------------------------------------------------------

deploy:alpha:
  extends:
    - .release_base
    - .rules:on_tag_manual
  variables:
    RELEASE_CHANNEL: alpha
  needs:
    - *needs_promote_tag
  parallel:
    matrix:
      - WERF_ENV: [CE, EE, FE, BE, SE, SE-plus]
  script:
    - bash .gitlab/scripts/deploy-channel.sh

deploy:beta:
  extends:
    - .release_base
    - .rules:on_tag_manual
  variables:
    RELEASE_CHANNEL: beta
  needs:
    - *needs_promote_tag
  parallel:
    matrix:
      - WERF_ENV: [CE, EE, FE, BE, SE, SE-plus]
  script:
    - bash .gitlab/scripts/deploy-channel.sh

deploy:early-access:
  extends:
    - .release_base
    - .rules:on_tag_manual
  variables:
    RELEASE_CHANNEL: early-access
  needs:
    - *needs_promote_tag
    - job: check_release_operator:early-access
  parallel:
    matrix:
      - WERF_ENV: [CE, EE, FE, BE, SE, SE-plus]
  script:
    - bash .gitlab/scripts/deploy-channel.sh

deploy:stable:
  extends:
    - .release_base
    - .rules:on_tag_manual
  variables:
    RELEASE_CHANNEL: stable
  needs:
    - *needs_promote_tag
    - job: check_release_operator:stable
  parallel:
    matrix:
      - WERF_ENV: [CE, EE, FE, BE, SE, SE-plus]
  script:
    - bash .gitlab/scripts/deploy-channel.sh

deploy:rock-solid:
  extends:
    - .release_base
    - .rules:on_tag_manual
  variables:
    RELEASE_CHANNEL: rock-solid
  needs:
    - *needs_promote_tag
    - job: check_release_operator:rock-solid
  parallel:
    matrix:
      - WERF_ENV: [CE, EE, FE, BE, SE, SE-plus]
  script:
    - bash .gitlab/scripts/deploy-channel.sh
