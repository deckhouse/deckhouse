# Antivirus scans (Dr.Web / Kaspersky) — PR mode matching GitHub build-and-test_dev.
# Runs on the dedicated antivirus runner after build_fe; delta-scans via ONLY_IMAGES
# from changed_images.py (full scan fallback when CHANGED_COUNT > 0 but compact empty).

include:
  - '.gitlab/notify.yml'

.av_cleanup: &av_cleanup |
  if [[ -f av.env ]]; then
    # shellcheck disable=SC1091
    source av.env
  fi
  if [[ -z "${CONTAINER_NAME:-}" ]]; then
    echo "container name is empty, nothing to clean up"
    exit 0
  fi

  cleaned_any=false
  if [[ -n "${SCAN_IDS:-}" ]]; then
    for scan_id in ${SCAN_IDS}; do
      [[ -z "${scan_id}" ]] && continue
      docker exec "${CONTAINER_NAME}" rm -rf "scans/${scan_id}" || true
      cleaned_any=true
    done
  fi

  if [[ "${cleaned_any}" == "false" && -n "${SCAN_ID:-}" ]]; then
    docker exec "${CONTAINER_NAME}" rm -rf "scans/${SCAN_ID}" || true
    cleaned_any=true
  fi

  if [[ "${cleaned_any}" == "false" ]]; then
    echo "scan ids are empty, nothing to clean up"
  fi

# Set MR labels like GitHub av_label_step (security/antivirus/success|failed).
.av_set_labels: &av_set_labels |
  if [[ -z "${CI_MERGE_REQUEST_IID:-}" ]]; then
    echo "Not an MR, skip antivirus labels"
    exit 0
  fi
  skipped=false
  if [[ -f av.env ]]; then
    # shellcheck disable=SC1091
    source av.env
  fi
  echo "AV label update: job=${CI_JOB_STATUS} skipped=${skipped} changed_count=${CHANGED_COUNT:-}"
  if [[ "${CHANGED_COUNT:-0}" == "0" || "${skipped}" == "true" ]]; then
    echo "No rebuilt images / scan skipped — clear antivirus labels"
    curl -sfS --request PUT \
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --data-urlencode "remove_labels=security/antivirus/success,security/antivirus/failed" \
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}" \
      >/dev/null
    exit 0
  fi
  if [[ "${CI_JOB_STATUS}" == "success" ]]; then
    curl -sfS --request PUT \
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --data-urlencode "add_labels=security/antivirus/success" \
      --data-urlencode "remove_labels=security/antivirus/failed" \
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}" \
      >/dev/null
  else
    curl -sfS --request PUT \
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --data-urlencode "add_labels=security/antivirus/failed" \
      --data-urlencode "remove_labels=security/antivirus/success" \
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}" \
      >/dev/null
  fi

.antivirus_schedule:
  timeout: 2h
  stage: test
  tags:
    - antivirus
  extends:
    - .rules:on_schedule_av_scan
    - .notify-base # using notify after_script reference
  variables:
    VAULT_AUTH_PATH: fox
    VAULT_AUTH_ROLE: deckhouse
    AV_SCAN_MODE: tags
  id_tokens:
    VAULT_ID_TOKEN:
      aud: gitlab-access-aud
  secrets:
    DECKHOUSE_DEV_REGISTRY_HOST:
      vault: 101ceaca-97cd-462f-aed5-070d9b9de175/registry_host/DECKHOUSE_DEV_REGISTRY_HOST@projects
      token: $VAULT_ID_TOKEN
      file: false
    DECKHOUSE_READ_REGISTRY_HOST:
      vault: 101ceaca-97cd-462f-aed5-070d9b9de175/registry_host/DECKHOUSE_READ_REGISTRY_HOST@projects
      token: $VAULT_ID_TOKEN
      file: false
    DECKHOUSE_REGISTRY_STAGE_HOST:
      vault: 101ceaca-97cd-462f-aed5-070d9b9de175/registry_host/DECKHOUSE_REGISTRY_STAGE_HOST@projects
      token: $VAULT_ID_TOKEN
      file: false
  needs:
    - job: av_get_tags
      artifacts: true
  script:
    - bash .gitlab/scripts/av_scan.sh
  after_script:
    - *av_cleanup
    - !reference [.notify_after_scripts, notify_av]
  artifacts:
    when: always
    expire_in: 5 days
    paths:
      - av-results/
      - av.env

.antivirus_base:
  stage: test
  tags:
    - antivirus
  needs:
    - job: build_fe:mr
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_PATH == "deckhouse/deckhouse"
  variables:
    VAULT_AUTH_PATH: fox
    VAULT_AUTH_ROLE: deckhouse
    AV_SCAN_MODE: mr
  id_tokens:
    VAULT_ID_TOKEN:
      aud: gitlab-access-aud
  secrets:
    DECKHOUSE_DEV_REGISTRY_HOST:
      vault: 6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/registry_host/DECKHOUSE_DEV_REGISTRY_HOST@projects
      token: $VAULT_ID_TOKEN
      file: false
  script:
    - bash .gitlab/scripts/av_scan.sh
  after_script:
    - *av_cleanup
    - *av_set_labels
  artifacts:
    when: always
    expire_in: 5 days
    paths:
      - av-results/
      - av.env

# Getting tags
av_get_tags:
  image: ${CI_REGISTRY}/deckhouse/ssdlc/ci-images/tools/gitleaks:${CI_IMAGES_TAG}
  stage: validate
  variables:
    DOTENV_FILE: tags.env
  extends:
    - .rules:on_schedule_av_scan
  script:
    - bash .gitlab/scripts/av_get_tags.sh
  artifacts:
    expire_in: 1 hour
    reports:
      dotenv: tags.env

drweb_scan_tag:
  variables:
    AV_NAME: drweb
  extends:
    - .antivirus_schedule

kaspersky_scan_tag:
  variables:
    AV_NAME: kaspersky
  extends:
    - .antivirus_schedule

drweb_scan:
  extends:
    - .antivirus_base
  variables:
    AV_NAME: drweb

kaspersky_scan:
  extends:
    - .antivirus_base
  variables:
    AV_NAME: kaspersky
