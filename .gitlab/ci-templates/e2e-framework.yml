    AWS_SECRET_ACCESS_KEY: "vault:projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/e2e/s3-terraform-state-bucket#AWS_SECRET_ACCESS_KEY"

.import_secrets:
  extends:
    - .e2e-framework-vars
  id_tokens:
    VAULT_ID_TOKEN:
      aud: gitlab-access-aud
  before_script:
    - D8_BIN=/usr/local/bin/d8
    - export VAULT_TOKEN=$(${D8_BIN} stronghold write -field=token auth/fox/login role=$VAULT_ROLE jwt=$VAULT_ID_TOKEN)
    - |
      while IFS='=' read -r name value; do
        # Проверяем, начинается ли значение с 'vault:'
        if [[ $value == vault:* ]]; then
          # Удаляем префикс 'vault:'
          stripped_value=${value#vault:}
          secret_path="${stripped_value%%#*}"
          secret_value=$(${D8_BIN} stronghold read -field=data -format=json "${secret_path}" | jq --arg v "${stripped_value#*#}"  '.[$v]' -r )
          export "$name=${secret_value}"
        fi
      done < <(env)

.e2e-prestart:
  extends:
    - .e2e-framework-vars
  image: ${IMAGE_NAME}:${IMAGE_TAG}
  stage: e2e-prestart
  script:
    - export PREFIX=$(echo "a${CI_JOB_ID}-${CI_PROJECT_NAME}" | tr '[:upper:]' '[:lower:]' | head -c 28 | sed 's/-*$//')
    - echo PREFIX = $PREFIX
    - echo "PREFIX=$PREFIX" > ${DOTENV_FILE}
  tags:
    - $[[ inputs.runner_tag ]]
  artifacts:
    reports:
      dotenv: ${DOTENV_FILE}
    expire_in: 3 days

.e2e-create-cluster:
  timeout: 3h
  extends: .import_secrets
  image: ${IMAGE_NAME}:${IMAGE_TAG}
  tags:
    - $[[ inputs.runner_tag ]]
  script:
    - python3 /e2e-framework/main.py create_cluster
  when: on_success

.e2e-create-modules:
  extends: .import_secrets
  image: ${IMAGE_NAME}:${IMAGE_TAG}
  tags:
    - $[[ inputs.runner_tag ]]
  script:
    - python3 /e2e-framework/main.py create_modules
  when: on_success

.e2e-run-tests:
  extends: .import_secrets
  image: ${IMAGE_NAME}:${IMAGE_TAG}
  tags:
    - $[[ inputs.runner_tag ]]
  script:
    - python3 /e2e-framework/main.py run_tests
  when: on_success

.e2e-update-deckhouse:
  timeout: 3h
  extends: .import_secrets
  image: ${IMAGE_NAME}:${IMAGE_TAG}
  tags:
    - $[[ inputs.runner_tag ]]
  script:
    - python3 /e2e-framework/main.py update_deckhouse
  when: on_success

.e2e-delete-cluster:
  extends: .import_secrets
  image: ${IMAGE_NAME}:${IMAGE_TAG}
  tags:
    - $[[ inputs.runner_tag ]]
  script:
    - python3 /e2e-framework/main.py delete_cluster
  when: manual


