- name: d8.secret-copier.rejected
  rules:
  - alert: D8SecretCopierSecretNotCopied
    expr: |
      max by (namespace, secret, reason) (d8_secret_copier_rejected_secret) > 0
    for: 5m
    labels:
      severity_level: "6"
      tier: application
      d8_module: secret-copier
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: Secret `{{ $labels.secret }}` was skipped by secret-copier, reason `{{ $labels.reason }}`.
      description: |-
        The [`secret-copier` module](https://github.com/deckhouse/deckhouse/tree/main/modules/600-secret-copier/) skipped the Secret `{{ $labels.secret }}` with the reason `{{ $labels.reason }}`.

        The meaning of the `namespace` label, which is `{{ $labels.namespace }}` here, depends on the reason:

        - `InvalidNamespaceSelector`: `namespace` is the namespace of the source Secret, `default`. The `secret-copier.deckhouse.io/target-namespace-selector` annotation of the source Secret is not a valid label selector, so the Secret is not copied to any namespace and its copies made before are deleted. Fix the annotation value. The exact parsing error is in the Deckhouse logs.
        - `ForeignSecretExists`: `namespace` is the target namespace. It already has a Secret `{{ $labels.secret }}` that was not created by `secret-copier`. Delete or rename it, and the copy will be created.
