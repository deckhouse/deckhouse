apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: descheduler-evictions-in-background
spec:
  description: >-
    The module always runs the descheduler with the upstream EvictionsInBackground
    feature gate. Verify the gate reaches both the Deployment spec and the running pod
    (a rejected gate makes the binary exit, so a ready pod proves it was accepted), and
    that a pod annotated with descheduler.alpha.kubernetes.io/request-evict-only is still
    evicted the usual way while no controller implements an eviction-in-background policy.
  concurrent: false
  timeouts:
    apply: 30s
    assert: 120s
    delete: 60s
    exec: 120s

  bindings:
    - name: stsTestLabel
      value: evictions-in-background
    - name: stsReplicas
      value: 3
    - name: antiTargetValue
      value: ($stsTestLabel)
    - name: workerNodes
      value: >-
        (x_k8s_list($client, 'v1', 'Node').items[?spec.unschedulable != `true`
        && metadata.labels."node-role.kubernetes.io/control-plane" == `null`
        && length(status.conditions[?type == 'Ready' && status == 'True']) > `0`])
    - name: targetNode
      value: ($workerNodes[0].metadata.name)

  catch:
    - description: Show pods in the test namespace on failure
      get:
        apiVersion: v1
        kind: Pod
    - description: Show events in the test namespace on failure
      events: {}
    - description: Show descheduler pod logs on failure
      podLogs:
        namespace: d8-descheduler
        selector: app=descheduler
        container: descheduler
        tail: 200

  steps:
    - name: assert-module-installed
      description: Verify that the descheduler module is installed in the cluster
      try:
        - description: Assert the Descheduler CRD exists
          assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: deschedulers.deckhouse.io

    - name: check-minimum-nodes
      description: Verify that the cluster has at least 2 eligible worker nodes for the eviction test
      try:
        - description: Assert at least 2 Ready, schedulable, non-control-plane worker nodes exist
          assert:
            resource:
              (length($workerNodes) >= `2`): true

    - name: create-statefulset
      description: >-
        Create a 3-replica StatefulSet whose pods carry the request-evict-only annotation,
        placed on a single worker node via spec.nodeName (kubelet admission bypasses the
        scheduler and ignores the pod anti-affinity), producing duplicates for RemoveDuplicates
      try:
        - description: Create the annotated StatefulSet pinned to the target node
          create:
            file: manifests/sts-pinned-annotated.yaml
            template: true

    - name: wait-statefulset-pinned
      description: Wait until all 3 replicas are Running on the target node and carry the annotation
      try:
        - description: Assert all 3 pods are Running on the target node with the request-evict-only annotation
          assert:
            timeout: 180s
            resource:
              (x_k8s_list($client, 'v1', 'Pod', $namespace).items[?metadata.labels."e2e-test" == $stsTestLabel]):
                (length(@) == `3`): true
                (length([?spec.nodeName == $targetNode]) == `3`): true
                (length([?status.phase == 'Running']) == `3`): true
                (length([?metadata.annotations."descheduler.alpha.kubernetes.io/request-evict-only" != `null`]) == `3`): true
        - description: Assert the StatefulSet reports 3 ready replicas
          assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: test-sts
              status:
                readyReplicas: 3

    - name: release-node-pinning
      description: >-
        Clear the template nodeName so that pods recreated after an eviction go through
        the scheduler (which enforces their anti-affinity); OnDelete keeps current pods in place
      try:
        - description: Patch the StatefulSet pod template to stop bypassing the scheduler
          patch:
            file: ../common/manifests/sts-unpin-patch.yaml
        - description: Assert the patch did not restart pods and all 3 remain on the target node
          assert:
            resource:
              (x_k8s_list($client, 'v1', 'Pod', $namespace).items[?metadata.labels."e2e-test" == $stsTestLabel]):
                (length(@) == `3`): true
                (length([?spec.nodeName == $targetNode]) == `3`): true

    - name: apply-descheduler-cr
      description: Enable the RemoveDuplicates strategy scoped to the annotated test pods only
      try:
        - description: Apply the Descheduler CR with RemoveDuplicates and a pod label selector
          apply:
            file: manifests/descheduler-cr.yaml
        - description: Assert the Descheduler CR exists
          assert:
            resource:
              apiVersion: deckhouse.io/v1alpha2
              kind: Descheduler
              metadata:
                name: e2e-evictions-in-background
      cleanup:
        - description: Delete the Descheduler CR
          delete:
            ref:
              apiVersion: deckhouse.io/v1alpha2
              kind: Descheduler
              name: e2e-evictions-in-background

    - name: assert-policy-rendered
      description: Verify that Deckhouse reconciled the CR into the descheduler policy ConfigMap
      try:
        - description: Assert the policy ConfigMap contains the e2e-evictions-in-background profile
          assert:
            timeout: 120s
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: descheduler-policy
                namespace: d8-descheduler
              data:
                (contains("policy.yaml", 'e2e-evictions-in-background')): true
      catch:
        - description: Show ConfigMap content on failure
          get:
            apiVersion: v1
            kind: ConfigMap
            name: descheduler-policy
            namespace: d8-descheduler
        - description: Show Descheduler CRs on failure
          get:
            apiVersion: deckhouse.io/v1alpha2
            kind: Descheduler

    - name: wait-descheduler-rollout
      description: >-
        Wait until the descheduler deployment finishes rolling out and its single pod runs
        with the current policy checksum (a descheduling cycle runs at pod startup)
      try:
        - description: Assert the rollout is complete and the running pod carries the current policy checksum
          assert:
            timeout: 300s
            file: ../common/asserts/assert-descheduler-rollout-complete.yaml
      catch:
        - description: Describe the descheduler deployment on failure
          describe:
            apiVersion: apps/v1
            kind: Deployment
            name: descheduler
            namespace: d8-descheduler
        - description: Show events in the descheduler namespace on failure
          events:
            namespace: d8-descheduler

    - name: assert-feature-gate-in-deployment
      description: Verify the module renders the EvictionsInBackground feature gate into the descheduler Deployment
      try:
        - description: Assert the descheduler container args carry --feature-gates with EvictionsInBackground=true
          assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: descheduler
                namespace: d8-descheduler
              (contains(spec.template.spec.containers[?name == 'descheduler'] | [0].args, '--feature-gates')): true
              (contains(spec.template.spec.containers[?name == 'descheduler'] | [0].args, 'EvictionsInBackground=true')): true
      catch:
        - description: Show the descheduler deployment on failure
          get:
            apiVersion: apps/v1
            kind: Deployment
            name: descheduler
            namespace: d8-descheduler

    - name: assert-descheduler-healthy-with-feature-gate
      description: >-
        Verify the running descheduler pod was started with the gate and is Ready.
        An unknown or malformed feature gate makes the descheduler binary exit at startup,
        so a Ready pod carrying the argument proves the gate was accepted.
      try:
        - description: Assert the descheduler deployment has a ready replica
          assert:
            file: ../common/asserts/assert-descheduler-ready.yaml
        - description: Assert the args of the running descheduler pod carry the feature gate
          script:
            content: |
              set -eu
              ARGS=$(kubectl -n d8-descheduler get pods -l app=descheduler \
                --field-selector=status.phase=Running \
                -o jsonpath='{.items[*].spec.containers[?(@.name=="descheduler")].args}')
              echo "descheduler args: ${ARGS}"
              echo "${ARGS}" | grep -q -- '--feature-gates'
              echo "${ARGS}" | grep -q 'EvictionsInBackground=true'
            check:
              ($error == null): true
      catch:
        - description: Show descheduler pods on failure
          get:
            apiVersion: v1
            kind: Pod
            namespace: d8-descheduler
            selector: app=descheduler

    - name: verify-annotated-pods-evicted
      description: >-
        Verify the annotated pods were evicted the usual way: with no controller answering
        the eviction request, the feature gate must not turn the eviction into a no-op
      try:
        - description: Assert the 3 annotated pods eventually run on at least 2 different nodes
          assert:
            timeout: 420s
            resource:
              (x_k8s_list($client, 'v1', 'Pod', $namespace).items[?metadata.labels."e2e-test" == $stsTestLabel && metadata.deletionTimestamp == `null`]):
                (length(@) == `3`): true
                (length([?status.phase == 'Running']) == `3`): true
                (min([].spec.nodeName) != max([].spec.nodeName)): true
        - description: Assert the StatefulSet returns to 3 ready replicas after the eviction
          assert:
            timeout: 180s
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: test-sts
              status:
                readyReplicas: 3

    - name: verify-eviction-events
      description: >-
        Verify the descheduler recorded eviction events for the annotated pods
        (event reason is the strategy name; 'Descheduled' is the event action)
      try:
        - description: Assert at least one RemoveDuplicates eviction event exists for a test-sts pod
          assert:
            timeout: 60s
            resource:
              apiVersion: v1
              kind: Event
              reason: RemoveDuplicates
              (starts_with(involvedObject.name, 'test-sts-')): true

    - name: verify-no-eviction-in-progress-left
      description: >-
        Verify no pod is left marked as an eviction in progress. The
        descheduler.alpha.kubernetes.io/eviction-in-progress annotation is set by the
        controller that owns the pod, never by the descheduler itself; with no such
        controller in the cluster it must never appear
      try:
        - description: Assert none of the test pods carries the eviction-in-progress annotation
          assert:
            resource:
              (x_k8s_list($client, 'v1', 'Pod', $namespace).items[?metadata.labels."e2e-test" == $stsTestLabel]):
                (length([?metadata.annotations."descheduler.alpha.kubernetes.io/eviction-in-progress" != `null`]) == `0`): true
