linters-settings:
  no-cyrillic:
    exclude-rules:
      directories:
        # The RBACv2 templates carry the localized title and description of every role and
        # capability they ship. That is product text, not a source comment: the console shows it
        # to whoever is choosing what to grant, and `d8:namespace-capability:kubernetes:view_logs`
        # on its own tells that person nothing.
        - templates/rbacv2
  module:
    conversions:
      disable: true
  openapi:
    exclude-rules:
      enum:
        - "properties.internal.properties.deschedulers.items.properties.strategies.properties.removePodsViolatingNodeAffinity.properties.nodeAffinityType.items"
        - "spec.versions[*].schema.openAPIV3Schema.properties.spec.properties.strategies.properties.removePodsViolatingNodeAffinity.properties.nodeAffinityType.items"
