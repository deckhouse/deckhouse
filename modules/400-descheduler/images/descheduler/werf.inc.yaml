{{- $version := include "get_oss_version_by_id" (list "descheduler" $ ) }}
{{- $version = printf "v%s" $version }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: common/src-artifact
final: false
git:
- url: {{ .SOURCE_REPO }}/kubernetes-sigs/descheduler.git
  tag: {{ $version }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/400-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
---
image: {{ .ModuleName }}/build-artifact
final: false
from: {{ index $.Images "builder/golang" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
  - cd /src
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod vendor
  - go build -ldflags "-s -w -X sigs.k8s.io/descheduler/pkg/version.version={{ $version }}" -o /descheduler sigs.k8s.io/descheduler/cmd/descheduler
  - chown 64535:64535 /descheduler
  - chmod 0700 /descheduler
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/build-artifact
  add: /descheduler
  to: /descheduler
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/descheduler"]
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
