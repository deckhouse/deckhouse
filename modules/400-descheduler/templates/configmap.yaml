{{- /*
  The averaging window of the node CPU utilization for LowNodeUtilization with metricsSource Prometheus.
  It is the tuning knob of that mode: the docs and the CRD description name 15 minutes, keep them in sync.
*/}}
{{- $prometheusWindow := "15m" }}
{{- /*
  node-exporter labels its series with `node` (the node name) while `instance` is IP:port;
  upstream matches samples to nodes by `instance` and expects a value in [0, 1].
*/}}
{{- $prometheusQuery := printf `label_replace(clamp(1 - avg by (node) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[%s])), 0, 1), "instance", "$1", "node", "(.+)")` $prometheusWindow }}
{{- $prometheusMetricsEnabled := include "descheduler_prometheus_metrics_enabled" . }}
{{- if len .Values.descheduler.internal.deschedulers }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: descheduler-policy
  namespace: d8-descheduler
  {{- include "helm_lib_module_labels" (list $) | nindent 2 }}
data:
  policy.yaml: |
    apiVersion: "descheduler/v1alpha2"
    kind: "DeschedulerPolicy"
    {{- if or (default false $.Values.descheduler.internal.isMetricsServerEnabled) $prometheusMetricsEnabled }}
    metricsProviders:
    {{- if default false $.Values.descheduler.internal.isMetricsServerEnabled }}
    - source: KubernetesMetrics
    {{- end }}
    {{- if $prometheusMetricsEnabled }}
    - source: Prometheus
      prometheus:
        url: https://aggregating-proxy.d8-monitoring.svc.{{ $.Values.global.discovery.clusterDomain }}
    {{- end }}
    {{- end }}
    profiles:
    {{- range $d := .Values.descheduler.internal.deschedulers }}
    - name: {{ $d.name }}
      pluginConfig:
      - name: "DefaultEvictor"
        args:
          {{- if $d.nodeLabelSelector }}
          nodeSelector: {{ $d.nodeLabelSelector }}
          {{- end }}
          {{- if $d.protectedStorageClasses }}
          {{- /*
            Upstream forbids mixing the deprecated boolean flags (evictLocalStoragePods,
            evictSystemCriticalPods, ignorePvcPods, evictFailedBarePods) with podProtections:
            DefaultEvictor validation rejects such a policy and the descheduler refuses to start.
            So when protectedStorageClasses is set, the very same behaviour is expressed
            through podProtections only.
            Default protections are: PodsWithLocalStorage, SystemCriticalPods, FailedBarePods, DaemonSetPods.
            Disabling FailedBarePods is the equivalent of `evictFailedBarePods: true`,
            disabling PodsWithLocalStorage is the equivalent of `evictLocalStoragePods: true`.
            The `PodsWithPVC` key under `config` is upper-camel-cased on purpose:
            it must match the protection name, and an unknown key is silently ignored,
            which would protect every Pod with a PVC instead of the listed StorageClasses only.
          */}}
          podProtections:
            defaultDisabled:
            - "FailedBarePods"
            {{- if $d.evictLocalStoragePods }}
            - "PodsWithLocalStorage"
            {{- end }}
            extraEnabled:
            - "PodsWithPVC"
            config:
              PodsWithPVC:
                protectedStorageClasses:
                {{- range $d.protectedStorageClasses }}
                - name: {{ . | quote }}
                {{- end }}
          {{- else }}
          evictLocalStoragePods: {{ if $d.evictLocalStoragePods }}{{ $d.evictLocalStoragePods }}{{- else }}false{{- end }}
          evictSystemCriticalPods: false
          ignorePvcPods: false
          evictFailedBarePods: true
          {{- end }}
          nodeFit: true
          {{- if $d.podLabelSelector }}
          labelSelector:
            {{- $d.podLabelSelector | toYaml | nindent 12 }}
          {{- end }}
          {{- if $d.namespaceLabelSelector }}
          namespaceLabelSelector:
            {{- $d.namespaceLabelSelector | toYaml | nindent 12 }}
          {{- end }}
          {{- if $d.priorityClassThreshold }}
          priorityThreshold:
            {{- $d.priorityClassThreshold | toYaml | nindent 12 }}
          {{- end }}
      {{- if dig "strategies" "lowNodeUtilization" "enabled" false $d }}
      - name: "LowNodeUtilization"
        args:
          {{- $s := omit $d.strategies.lowNodeUtilization "enabled" "metricsSource" }}
          {{- if and $prometheusMetricsEnabled (eq (dig "strategies" "lowNodeUtilization" "metricsSource" "" $d) "Prometheus") }}
          {{- /*
            Upstream accepts only the MetricResource key in Prometheus mode; the CRD requires cpu in both maps.
            Without the prometheus module the profile falls through to the Default rendering below.
          */}}
          {{- $_ := set $s "metricsUtilization" (dict "source" "Prometheus" "prometheus" (dict "query" $prometheusQuery)) }}
          {{- $_ = set $s "thresholds" (dict "MetricResource" $s.thresholds.cpu) }}
          {{- $_ = set $s "targetThresholds" (dict "MetricResource" $s.targetThresholds.cpu) }}
          {{- else if default false $.Values.descheduler.internal.isMetricsServerEnabled }}
          metricsUtilization:
            source: KubernetesMetrics
          {{- end }}
          {{- $s | toYaml | nindent 10 }}
      {{- end }}
      {{- if dig "strategies" "highNodeUtilization" "enabled" false $d }}
      - name: "HighNodeUtilization"
        args:
          {{- $s := unset ($d.strategies.highNodeUtilization | deepCopy) "enabled" }}
          {{- $s | toYaml | nindent 10 }}
      {{- end }}
      {{- if dig "strategies" "removePodsViolatingNodeAffinity" "enabled" false $d }}
      - name: "RemovePodsViolatingNodeAffinity"
        args:
          {{- $s := unset ($d.strategies.removePodsViolatingNodeAffinity | deepCopy) "enabled" }}
          {{- $s | toYaml | nindent 10 }}
      {{- end }}
      {{- if dig "strategies" "removePodsViolatingInterPodAntiAffinity" "enabled" false $d }}
      - name: "RemovePodsViolatingInterPodAntiAffinity"
      {{- end }}
      {{- if dig "strategies" "removeDuplicates" "enabled" false $d }}
      - name: "RemoveDuplicates"
      {{- end }}
      {{- if dig "strategies" "removePodsViolatingTopologySpreadConstraint" "enabled" false $d }}
      - name: "RemovePodsViolatingTopologySpreadConstraint"
        args:
          {{- $s := unset ($d.strategies.removePodsViolatingTopologySpreadConstraint | deepCopy) "enabled" }}
          {{- $s | toYaml | nindent 10 }}
      {{- end }}
      {{- if dig "strategies" "removePodsHavingTooManyRestarts" "enabled" false $d }}
      - name: "RemovePodsHavingTooManyRestarts"
        args:
          {{- $s := unset ($d.strategies.removePodsHavingTooManyRestarts | deepCopy) "enabled" }}
          {{- $s | toYaml | nindent 10 }}
      {{- end }}
      plugins:
        # DefaultEvictor is enabled for both `filter` and `preEvictionFilter`
        filter:
          enabled:
          - "DefaultEvictor"
        preEvictionFilter:
          enabled:
          - "DefaultEvictor"
        {{- if or (or (dig "strategies" "removePodsViolatingNodeAffinity" "enabled" false $d) (dig "strategies" "removePodsViolatingInterPodAntiAffinity" "enabled" false $d)) (dig "strategies" "removePodsHavingTooManyRestarts" "enabled" false $d) }}
        deschedule:
          enabled:
          {{- if dig "strategies" "removePodsViolatingNodeAffinity" "enabled" false $d }}
          - "RemovePodsViolatingNodeAffinity"
          {{- end }}
          {{- if dig "strategies" "removePodsViolatingInterPodAntiAffinity" "enabled" false $d }}
          - "RemovePodsViolatingInterPodAntiAffinity"
          {{- end }}
          {{- if dig "strategies" "removePodsHavingTooManyRestarts" "enabled" false $d }}
          - "RemovePodsHavingTooManyRestarts"
          {{- end }}
        {{- end }}
        {{- if or (or (or (dig "strategies" "highNodeUtilization" "enabled" false $d) (dig "strategies" "lowNodeUtilization" "enabled" false $d)) (dig "strategies" "removeDuplicates" "enabled" false $d)) (dig "strategies" "removePodsViolatingTopologySpreadConstraint" "enabled" false $d) }}
        balance:
          enabled:
          {{- if dig "strategies" "highNodeUtilization" "enabled" false $d }}
          - "HighNodeUtilization"
          {{- end }}
          {{- if dig "strategies" "lowNodeUtilization" "enabled" false $d }}
          - "LowNodeUtilization"
          {{- end }}
          {{- if dig "strategies" "removeDuplicates" "enabled" false $d }}
          - "RemoveDuplicates"
          {{- end }}
          {{- if dig "strategies" "removePodsViolatingTopologySpreadConstraint" "enabled" false $d }}
          - "RemovePodsViolatingTopologySpreadConstraint"
          {{- end }}
        {{- end }}
    {{- end }}
{{- end }}
