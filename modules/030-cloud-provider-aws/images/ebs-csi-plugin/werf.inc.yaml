{{- $csiFilter := list
      "/usr/bin/chmod" "/usr/bin/mkdir" "/usr/bin/rmdir" "/usr/bin/mount" "/usr/bin/umount" "/usr/bin/findmnt" "/usr/bin/lsblk"
      "/usr/sbin/blkid" "/usr/sbin/blkdiscard" "/usr/sbin/blockdev" "/usr/sbin/dumpe2fs" "/usr/sbin/e2fsck" "/usr/sbin/e2label"
      "/usr/sbin/findfs" "/usr/sbin/fstrim" "/usr/sbin/fsck" "/usr/sbin/fsck.ext2" "/usr/sbin/fsck.ext3" "/usr/sbin/fsck.ext4"
      "/usr/sbin/mke2fs" "/usr/sbin/mkfs" "/usr/sbin/mkfs.ext2" "/usr/sbin/mkfs.ext3" "/usr/sbin/mkfs.ext4" "/usr/sbin/resize2fs"
      "/usr/sbin/parted"
      "/usr/bin/fsck.xfs" "/usr/bin/mkfs.xfs" "/usr/bin/xfs_growfs" "/usr/bin/xfs_repair"
      "/usr/lib/libparted-fs-resize.so.0" }}
{{- $version_map := include "get_oss_version_map_by_id_and_condition_key" (list "csi-aws" "k8s" $) | fromYaml }}
{{- range $key, $value := $version_map }}
  {{- $image_version := toString $key | replace "." "-" }}
  {{- $version := toString $value }}
  {{- if $version }}
    {{- $patches := (printf "/%smodules/%s-%s/images/%s" $.ModulePath $.ModulePriority $.ModuleName $.ImageName) }}
    {{- $patch := false }}
    {{- range $path, $_ := $.Files.Glob (printf "%s/patches/%s/*.patch" $patches $version) }}
        {{- $patch = true }}
    {{- end }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /aws-ebs-csi-driver
  to: /bin/aws-ebs-csi-driver
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-pm-artifact
  add: /relocate-pm
  to: /
  before: install
imageSpec:
  config:
    entrypoint: ["/bin/aws-ebs-csi-driver"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/src" }}
git:
- url: {{ $.SOURCE_REPO }}/kubernetes-sigs/aws-ebs-csi-driver.git
  tag: {{ $version }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
{{- if $patch }}
- add: {{ $patches }}/patches/{{ $version }}
  to: /patches
  stageDependencies:
    install:
      - '**/*'
{{- end }}
shell:
  install:
    - cd /src
    {{- if $patch}}
    - git apply /patches/*.patch --verbose
    {{- end}}
    - rm -rf vendor
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/golang" }}
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
    add: /src
    to: /src
    before: install
mount:
{{ include "mount points for golang builds" $ }}
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
shell:
  install:
  - cd /src
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
  setup:
  - cd /src
  - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-X github.com/kubernetes-sigs/aws-ebs-csi-driver/pkg/driver.driverVersion={{ $version }} -X github.com/kubernetes-sigs/aws-ebs-csi-driver/pkg/cloud.driverVersion={{ $version }} -s -w" -o /aws-ebs-csi-driver ./cmd/main.go
  - chown 64535:64535 /aws-ebs-csi-driver
  - chmod 0755 /aws-ebs-csi-driver
 {{- end }}
{{- end }}
{{- include "pm_binaries_artifact" (dict
      "Images" $.Images
      "name" (printf "%s/%s-pm-artifact" $.ModuleName $.ImageName)
      "packages" "coreutils e2fsprogs xfsprogs util-linux parted"
      "binaries" (join " " $csiFilter)) }}
