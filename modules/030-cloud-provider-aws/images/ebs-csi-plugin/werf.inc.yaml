{{- $csiBins := list "chmod" "mkdir" "rmdir" "mount" "umount" "findmnt" "lsblk" }}
{{- $csiSbins := list "blkid" "blkdiscard" "blockdev" "dumpe2fs" "e2fsck" "e2label" "findfs" "fstrim" "fsck" "fsck.ext2" "fsck.ext3" "fsck.ext4" "fsck.xfs" "mke2fs" "mkfs" "mkfs.ext2" "mkfs.ext3" "mkfs.ext4" "mkfs.xfs" "resize2fs" "parted" "xfs_growfs" "xfs_repair" }}
{{- /* shared libraries needed by the tools above (readelf NEEDED closure) + libparted fs plugin loaded via dlopen; glibc itself (ld-linux, libc, libm) comes with lib64 */}}
{{- $csiLibs := list "libblkid" "libcom_err" "libdevmapper" "libe2p" "libext2fs" "libmount" "libncursesw" "libparted" "libparted-fs-resize" "libreadline" "libsmartcols" "libtinfo" "libuuid" }}
{{- $version_map := include "get_oss_version_map_by_id_and_condition_key" (list "csi-aws" "k8s" $) | fromYaml }}
{{- range $key, $value := $version_map }}
  {{- $image_version := toString $key | replace "." "-" }}
  {{- $version := toString $value }}
  {{- if $version }}
    {{- $patches := (printf "/%smodules/%s-%s/images/%s" $.ModulePath $.ModulePriority $.ModuleName $.ImageName) }}
    {{- $patch := false }}
    {{- range $path, $_ := $.Files.Glob (printf "%s/patches/%s/*.patch" $patches $version) }}
        {{- $patch = true }}
    {{- end }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: {{ index $.Images "base/distroless" }}
import:
- image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /aws-ebs-csi-driver
  to: /bin/aws-ebs-csi-driver
  before: setup
- image: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
  add: /out
  to: /
  before: install
  includePaths:
  - lib64
{{- range $csiLibs }}
  - usr/lib*/{{ . }}.so*
{{- end }}
{{- range $csiBins }}
  - usr/bin/{{ . }}
{{- end }}
{{- range $csiSbins }}
  - usr/sbin/{{ . }}
{{- end }}
imageSpec:
  config:
    entrypoint: ["/bin/aws-ebs-csi-driver"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/src" }}
{{- if $patch }}
git:
- add: {{ $patches }}/patches/{{ $version }}
  to: /patches
  stageDependencies:
    install:
      - '**/*'
{{- end }}
secrets:
- id: SOURCE_REPO
  value: {{ $.SOURCE_REPO }}
shell:
  install:
    - git clone --depth 1 --branch {{ $version }} $(cat /run/secrets/SOURCE_REPO)/kubernetes-sigs/aws-ebs-csi-driver.git /src
    - cd /src
    {{- if $patch}}
    - git apply /patches/*.patch --verbose
    {{- end}}
    - rm -rf .git vendor
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/golang" }}
import:
  - image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
    add: /src
    to: /src
    before: install
mount:
{{ include "mount points for golang builds" $ }}
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
shell:
  install:
  - cd /src
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
  setup:
  - cd /src
  - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-X github.com/kubernetes-sigs/aws-ebs-csi-driver/pkg/driver.driverVersion={{ $version }} -X github.com/kubernetes-sigs/aws-ebs-csi-driver/pkg/cloud.driverVersion={{ $version }} -s -w" -o /aws-ebs-csi-driver ./cmd/main.go
  - chown 64535:64535 /aws-ebs-csi-driver
  - chmod 0755 /aws-ebs-csi-driver
 {{- end }}
{{- end }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
shell:
  beforeInstall:
  - pm install coreutils e2fsprogs xfsprogs util-linux parted libc -d /out
