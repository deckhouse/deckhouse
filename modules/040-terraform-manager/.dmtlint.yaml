linters-settings:
  no-cyrillic:
    exclude-rules:
      directories:
        # The RBACv2 templates carry the localized title and description of every role and
        # capability they ship. That is product text, not a source comment: the console shows it
        # to whoever is choosing what to grant, and `d8:namespace-capability:kubernetes:view_logs`
        # on its own tells that person nothing.
        - templates/rbacv2
  container:
    exclude-rules:
      read-only-root-filesystem:
        - kind: Deployment
          name: terraform-auto-converger
          container: converger
        - kind: Deployment
          name: terraform-auto-converger
          container: to-tofu-migrator
        - kind: Deployment
          name: terraform-state-exporter
          container: exporter
        - kind: Deployment
          name: terraform-auto-converger
          container: prepare-converger
        - kind: Deployment
          name: terraform-state-exporter
          container: prepare-exporter
      liveness-probe:
        - kind: Deployment
          name: terraform-auto-converger
          container: kube-rbac-proxy
        - kind: Deployment
          name: terraform-state-exporter
          container: kube-rbac-proxy
      readiness-probe:
        - kind: Deployment
          name: terraform-auto-converger
          container: kube-rbac-proxy
        - kind: Deployment
          name: terraform-state-exporter
          container: kube-rbac-proxy
