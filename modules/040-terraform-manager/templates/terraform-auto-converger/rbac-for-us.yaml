---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraform-auto-converger
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraform-auto-converger
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "patch", "update", "create", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "create", "patch", "update", "delete"]
- apiGroups: ["apps"]
  verbs: ["get", "patch"]
  resources: ["deployments", "daemonsets", "statefulsets"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraform-auto-converger
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: terraform-auto-converger
subjects:
- kind: ServiceAccount
  name: terraform-auto-converger
  namespace: d8-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:terraform-manager:terraform-auto-converger:rbac-proxy
  {{- include "helm_lib_module_labels" (list . (dict "app" "terraform-auto-converger")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: d8:rbac-proxy
subjects:
- kind: ServiceAccount
  name: terraform-auto-converger
  namespace: d8-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: d8:terraform-manager:terraform-auto-converger
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: d8:terraform-manager:terraform-auto-converger
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: d8:terraform-manager:terraform-auto-converger
subjects:
- kind: ServiceAccount
  name: terraform-auto-converger
  namespace: d8-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:terraform-manager:terraform-auto-converger
  {{- include "helm_lib_module_labels" (list . (dict "app" "terraform-auto-converger")) | nindent 2 }}
rules:
- apiGroups: ["deckhouse.io"]
  resources: ["nodegroups"]
  verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]
# In-cluster dhctl parses the provider ModuleConfig (mc-flow, get-by-name),
# lists provider InstanceClasses for CloudProviderVars, and reads the global
# ModuleConfig for the cluster prefix (migrated from ClusterConfiguration.cloud.prefix).
- apiGroups: ["deckhouse.io"]
  resources: ["moduleconfigs"]
  resourceNames: ["cloud-provider-{{ .Values.global.clusterConfiguration.cloud.provider | lower }}", "global"]
  verbs: ["get"]
# The provider module owns its namespace; the converger only checks that it
# exists before saving discovery data there (see ensureNamespace in dhctl).
- apiGroups: [""]
  resources: ["namespaces"]
  resourceNames: ["d8-cloud-provider-{{ .Values.global.clusterConfiguration.cloud.provider | lower }}"]
  verbs: ["get"]
# In-cluster dhctl resolves the cloud provider bundle through the module chain when the
# provider is an external module: the Module object says which ModuleSource it came from and
# which version runs, and a ModulePullOverride pins the image directly. A denied read is
# tolerated (the mounted images-digests ConfigMap answers instead), so this only makes the
# resolution work rather than merely not crash.
- apiGroups: ["deckhouse.io"]
  resources: ["modules"]
  resourceNames: ["cloud-provider-{{ .Values.global.clusterConfiguration.cloud.provider | lower }}"]
  verbs: ["get"]
- apiGroups: ["deckhouse.io"]
  resources: ["modulepulloverrides"]
  resourceNames: ["cloud-provider-{{ .Values.global.clusterConfiguration.cloud.provider | lower }}"]
  verbs: ["get"]
# The ModuleSource is named by the Module, so it cannot be pinned by name here.
- apiGroups: ["deckhouse.io"]
  resources: ["modulesources"]
  verbs: ["get"]
- apiGroups: ["deckhouse.io"]
  resources: ["{{ .Values.global.clusterConfiguration.cloud.provider | lower }}instanceclasses"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:terraform-manager:terraform-auto-converger
  {{- include "helm_lib_module_labels" (list . (dict "app" "terraform-auto-converger")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: d8:terraform-manager:terraform-auto-converger
subjects:
- kind: ServiceAccount
  name: terraform-auto-converger
  namespace: d8-system
