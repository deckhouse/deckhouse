{{- $version := include "get_oss_version_by_id" (list "terraform-provider-yandex" $) }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: scratch
git:
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi
  to: /
  excludePaths:
  - '**/terraform_versions.yml'
  - '**/plan_rules.yml'
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi/terraform_versions.yml
  to: /terraform-manager/terraform_versions.yml
# plan_rules.yml must sit next to terraform_versions.yml: dhctl reads the pair
# straight from the unpacked bundle, and attachBundlePlanRules rejects a bundle
# that has no rules at all.
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi/plan_rules.yml
  to: /terraform-manager/plan_rules.yml
import:
- from: terraform-provider-yandex
  add: /terraform-provider-yandex
  to: /terraform-manager/terraform-provider-yandex
  before: setup
- from: {{ $.ModuleName }}/validator
  add: /dhctl-provider-yandex
  to: /validator
  before: setup
{{ include "image_spec_for_infrastructure_manager" . }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/src" }}
git:
- url: {{ $.SOURCE_REPO }}/yandex-cloud/terraform-provider-yandex.git
  tag: v{{ $version }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
---
image: terraform-provider-yandex
final: false
from: {{ index $.Images "builder/golang" }}
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GOPROXY=$(cat /run/secrets/GOPROXY)
  - cd /src
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -extldflags '-static' -X github.com/yandex-cloud/terraform-provider-yandex/version.ProviderVersion={{ $version }}" -o /terraform-provider-yandex .
  - strip /terraform-provider-yandex
  - chmod -R 755 /terraform-provider-yandex
  - chown 64535:64535 /terraform-provider-yandex
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName )) }}
