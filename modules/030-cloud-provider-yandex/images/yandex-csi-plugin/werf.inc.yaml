{{- $csiFilter := list
      "/usr/bin/chmod" "/usr/bin/mkdir" "/usr/bin/rmdir" "/usr/bin/mount" "/usr/bin/umount" "/usr/bin/findmnt" "/usr/bin/lsblk"
      "/usr/sbin/blkid" "/usr/sbin/blkdiscard" "/usr/sbin/blockdev" "/usr/sbin/dumpe2fs" "/usr/sbin/e2fsck" "/usr/sbin/e2label"
      "/usr/sbin/findfs" "/usr/sbin/fstrim" "/usr/sbin/fsck" "/usr/sbin/fsck.ext2" "/usr/sbin/fsck.ext3" "/usr/sbin/fsck.ext4"
      "/usr/sbin/mke2fs" "/usr/sbin/mkfs" "/usr/sbin/mkfs.ext2" "/usr/sbin/mkfs.ext3" "/usr/sbin/mkfs.ext4" "/usr/sbin/resize2fs"
      "/usr/sbin/parted"
      "/usr/bin/fsck.xfs" "/usr/bin/mkfs.xfs" "/usr/bin/xfs_growfs" "/usr/bin/xfs_repair"
      "/usr/lib/libparted-fs-resize.so.0" }}
{{- $version := include "get_oss_version_by_id" (list "csi-yandex" $) }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /go/bin/yandex-csi-driver
  to: /bin/yandex-csi-driver
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-pm-artifact
  add: /relocate-pm
  to: /
  before: install
imageSpec:
  config:
    entrypoint: ["/bin/yandex-csi-driver"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
git:
- url: {{ $.SOURCE_REPO }}/deckhouse/yandex-csi-driver.git
  tag: {{ $version }}
  add: /
  to: /go/src/app
final: false
from: {{ index $.Images "builder/src" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/golang" }}
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /go/src/app
    to: /go/src/app
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /go/src/app
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
  setup:
    - cd /go/src/app
    - |
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a \
      -ldflags '-X github.com/deckhouse/yandex-csi-driver/driver.version={{ $version }}' \
      -o /go/bin/yandex-csi-driver \
      github.com/deckhouse/yandex-csi-driver/cmd/yandex-csi-driver
    - chown 64535:64535 /go/bin/yandex-csi-driver
    - chmod 0755 /go/bin/yandex-csi-driver
{{- include "pm_binaries_artifact" (dict
      "Images" $.Images
      "name" (printf "%s/%s-pm-artifact" $.ModuleName $.ImageName)
      "packages" "coreutils e2fsprogs xfsprogs util-linux parted"
      "binaries" (join " " $csiFilter)) }}
