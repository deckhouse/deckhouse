{{- $csiBins := list "chmod" "mkdir" "rmdir" "mount" "umount" "findmnt" "lsblk" }}
{{- $csiSbins := list "blkid" "blkdiscard" "blockdev" "dumpe2fs" "e2fsck" "e2label" "findfs" "fstrim" "fsck" "fsck.ext2" "fsck.ext3" "fsck.ext4" "fsck.xfs" "mke2fs" "mkfs" "mkfs.ext2" "mkfs.ext3" "mkfs.ext4" "mkfs.xfs" "resize2fs" "parted" "xfs_growfs" "xfs_repair" }}
{{- /* shared libraries needed by the tools above (readelf NEEDED closure) + libparted fs plugin loaded via dlopen; glibc itself (ld-linux, libc, libm) comes with lib64 */}}
{{- $csiLibs := list "libblkid" "libcom_err" "libdevmapper" "libe2p" "libext2fs" "libmount" "libncursesw" "libparted" "libparted-fs-resize" "libreadline" "libsmartcols" "libtinfo" "libuuid" }}
{{- $version := include "get_oss_version_by_id" (list "csi-yandex" $) }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /go/bin/yandex-csi-driver
  to: /bin/yandex-csi-driver
  before: setup
- image: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
  add: /out
  to: /
  before: install
  includePaths:
  - lib64
{{- range $csiLibs }}
  - usr/lib*/{{ . }}.so*
{{- end }}
{{- range $csiBins }}
  - usr/bin/{{ . }}
{{- end }}
{{- range $csiSbins }}
  - usr/sbin/{{ . }}
{{- end }}
imageSpec:
  config:
    entrypoint: ["/bin/yandex-csi-driver"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/src" }}
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
    - git clone --depth 1 --branch {{ $version }} $(cat /run/secrets/SOURCE_REPO)/deckhouse/yandex-csi-driver.git /go/src/app
    - cd /go/src/app
    - rm -rf .git
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/golang" }}
import:
  - image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /go/src/app
    to: /go/src/app
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /go/src/app
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
  setup:
    - cd /go/src/app
    - |
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a \
      -ldflags '-X github.com/deckhouse/yandex-csi-driver/driver.version={{ $version }}' \
      -o /go/bin/yandex-csi-driver \
      github.com/deckhouse/yandex-csi-driver/cmd/yandex-csi-driver
    - chown 64535:64535 /go/bin/yandex-csi-driver
    - chmod 0755 /go/bin/yandex-csi-driver
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
shell:
  beforeInstall:
  - pm install coreutils e2fsprogs xfsprogs util-linux parted libc -d /out
