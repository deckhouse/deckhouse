version: v1
template: |
  {{- $zoneToSubnetIDMap := .provider.zoneToSubnetIdMap | required "provider.zoneToSubnetIdMap is required" }}
  {{- $defaultZone := first (keys $zoneToSubnetIDMap | sortAlpha) }}
  apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
  kind: YandexCluster
  metadata:
    name: {{ .cluster.name | quote }}
    namespace: {{ .cluster.namespace | quote }}
    labels:
      app: capi-controller-manager
  spec:
    folderID: {{ .provider.folderID | quote }}
    loadBalancer:
      type: "ALB"
      listener:
        subnet:
          id: {{ index $zoneToSubnetIDMap $defaultZone | quote }}
