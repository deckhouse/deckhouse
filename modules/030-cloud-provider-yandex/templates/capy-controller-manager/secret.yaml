{{- if not (default false (dig "nodes" "disabled" false .Values.cloudProviderYandex)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: yandex-credentials-capy
  namespace: d8-cloud-provider-yandex
  {{- include "helm_lib_module_labels" (list . (dict "app" "capy-controller-manager")) | nindent 2 }}
type: Opaque
data:
  key: {{ include "yandex_credential_secret" (list . "d8-credentials" "secret") | b64enc | quote }}
{{- end }}
