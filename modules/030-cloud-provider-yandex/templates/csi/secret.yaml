{{- if not (default false (dig "storage" "disabled" false .Values.cloudProviderYandex)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: csi-credentials
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "csi-controller")) | nindent 2 }}
type: Opaque
data:
  serviceAccountJSON: {{ include "yandex_credential_secret" (list . "d8-credentials" "secret") | b64enc | quote }}
{{- end }}
