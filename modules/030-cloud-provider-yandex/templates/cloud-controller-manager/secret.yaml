---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-controller-manager
  namespace: d8-cloud-provider-yandex
  {{- include "helm_lib_module_labels" (list . (dict "app" "cloud-controller-manager")) | nindent 2 }}
type: Opaque
data:
  service-acount-json: {{ include "yandex_credential_secret" (list . "d8-credentials" "secret") | b64enc | quote }}
