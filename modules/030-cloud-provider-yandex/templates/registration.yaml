{{- $providerID := "yandex" }}
{{- define "registration_values" }}
{{- $context := index . 0 }}
# obligatory
type: {{ b64enc "yandex" | quote }}
region: {{ $context.Values.cloudProviderYandex.internal.providerDiscoveryData.region | b64enc | quote }}
zones: {{ $context.Values.cloudProviderYandex.internal.providerDiscoveryData.zones | toJson | b64enc | quote }}
# Storage version of the InstanceClass CRD (spec.versions with storage: true). Not any served
# version: node-controller hashes what it reads into a checksum that names an immutable template.
instanceClassAPIVersion: {{ b64enc "v1" | quote }}
instanceClassKind: {{ b64enc "YandexInstanceClass" | quote }}
machineClassKind: {{ b64enc "YandexMachineClass" | quote }}
capiClusterKind: {{ b64enc "YandexCluster" | quote }}
capiClusterAPIVersion: {{ b64enc "infrastructure.cluster.x-k8s.io/v1alpha1" | quote }}
capiClusterAPIGroup: {{ b64enc "infrastructure.cluster.x-k8s.io" | quote }}
capiClusterName: {{ b64enc "yandex" | quote }}
capiMachineTemplateKind: {{ b64enc "YandexMachineTemplate" | quote }}
capiMachineTemplateAPIVersion: {{ b64enc "infrastructure.cluster.x-k8s.io/v1alpha1" | quote }}
capiMachineTemplateAPIGroup: {{ b64enc "infrastructure.cluster.x-k8s.io" | quote }}
{{- $sshPublicKey := dig "nodes" "parameters" "sshPublicKey" "" $context.Values.cloudProviderYandex }}
{{- if $sshPublicKey }}
sshPublicKey: {{ $sshPublicKey | b64enc | quote }}
{{- end }}

# Yandex
{{- $yandexValues := dict }}
{{- $serviceAccountJSON := include "yandex_credential_secret" (list $context "d8-credentials" "secret") }}
{{- if $serviceAccountJSON }}
{{- $_ := set $yandexValues "serviceAccountJSON" $serviceAccountJSON }}
{{- end }}
{{- if $sshPublicKey }}
{{- $_ := set $yandexValues "sshKey" $sshPublicKey }}
{{- end }}
{{- $_ := set $yandexValues "region" $context.Values.cloudProviderYandex.internal.providerDiscoveryData.region }}
{{- $_ := set $yandexValues "folderID" $context.Values.cloudProviderYandex.provider.parameters.folderID }}
{{- $_ := set $yandexValues "shouldAssignPublicIPAddress" $context.Values.cloudProviderYandex.internal.providerDiscoveryData.shouldAssignPublicIPAddress }}
{{- $_ := set $yandexValues "zoneToSubnetIdMap" $context.Values.cloudProviderYandex.internal.providerDiscoveryData.zoneToSubnetIdMap }}
{{- $_ := set $yandexValues "labels" ($context.Values.cloudProviderYandex.nodes.parameters.labels | default dict) }}
{{- $_ := set $yandexValues "nodeNetworkCIDR" $context.Values.cloudProviderYandex.nodes.parameters.nodeNetworkCIDR }}

{{- /*
  Fallback image for ephemeral nodes whose YandexInstanceClass carries no imageID: the field
  was optional before the CRD required it. Written by hooks/instance_class_defaults.go from the
  master YandexInstanceClass; empty in hybrid clusters and until the migration resources exist.
  The key itself is always emitted — node-manager templates dereference it unconditionally.
*/}}
{{- $_ := set $yandexValues "instanceClassDefaults" (dict "imageID" (dig "instanceClassDefaults" "imageID" "" $context.Values.cloudProviderYandex.internal)) }}
yandex: {{ $yandexValues | toJson | b64enc | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: d8-node-manager-cloud-provider
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list . (dict
    "cloud-provider.deckhouse.io/registration" ""
    "cloud-provider.deckhouse.io/name" $providerID
    )) | nindent 2 }}
type: Opaque
data: {{- include "registration_values" (list . ) | nindent 2 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "d8-node-manager-cloud-provider-%s" $providerID }}
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list . (dict
    "cloud-provider.deckhouse.io/registration" ""
    "cloud-provider.deckhouse.io/name" $providerID
    )) | nindent 2 }}
type: Opaque
data: {{- include "registration_values" (list . ) | nindent 2 }}
