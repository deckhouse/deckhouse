apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    werf.io/deploy-dependency-deployment: state=ready,kind=Deployment,name=validation-webhook,namespace=d8-cloud-provider-yandex
    werf.io/deploy-dependency-service: state=present,kind=Service,name=validation-webhook,namespace=d8-cloud-provider-yandex
  name: d8-cloud-provider-yandex-validation-webhook
  {{- include "helm_lib_module_labels" (list . (dict "app" "validation-webhook")) | nindent 2 }}
webhooks:
  - name: moduleconfigs.cloud-provider-yandex.deckhouse.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 30
    matchConditions:
      - name: yandex-module-config-name
        expression: >-
          (object != null && object.metadata.name == 'cloud-provider-yandex') ||
          (oldObject != null && oldObject.metadata.name == 'cloud-provider-yandex')
    clientConfig:
      service:
        name: validation-webhook
        namespace: d8-cloud-provider-yandex
        path: /validate-deckhouse-io-v1alpha1-moduleconfig
        port: 443
      caBundle: {{ .Values.cloudProviderYandex.internal.validationWebhookCert.ca | b64enc | quote }}
    rules:
      - apiGroups: ["deckhouse.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["moduleconfigs"]
        scope: "Cluster"
  - name: secrets.cloud-provider-yandex.deckhouse.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 30
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: d8-cloud-provider-yandex
    matchConditions:
      - name: credential-secret-type
        expression: >-
          (object != null && object.type == 'cloud-provider.deckhouse.io/credentials') ||
          (oldObject != null && oldObject.type == 'cloud-provider.deckhouse.io/credentials')
    clientConfig:
      service:
        name: validation-webhook
        namespace: d8-cloud-provider-yandex
        path: /validate--v1-secret
        port: 443
      caBundle: {{ .Values.cloudProviderYandex.internal.validationWebhookCert.ca | b64enc | quote }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
        scope: "Namespaced"
  - name: nodegroups.cloud-provider-yandex.deckhouse.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 30
    matchConditions:
      - name: yandex-node-group-involved
        expression: >-
          (object != null && object.spec.nodeType == 'CloudPermanent') ||
          (oldObject != null && oldObject.spec.nodeType == 'CloudPermanent') ||
          (object != null && has(object.spec.cloudInstances) && has(object.spec.cloudInstances.classReference) && object.spec.cloudInstances.classReference.kind == 'YandexInstanceClass') ||
          (oldObject != null && has(oldObject.spec.cloudInstances) && has(oldObject.spec.cloudInstances.classReference) && oldObject.spec.cloudInstances.classReference.kind == 'YandexInstanceClass')
    clientConfig:
      service:
        name: validation-webhook
        namespace: d8-cloud-provider-yandex
        path: /validate-deckhouse-io-v1-nodegroup
        port: 443
      caBundle: {{ .Values.cloudProviderYandex.internal.validationWebhookCert.ca | b64enc | quote }}
    rules:
      - apiGroups: ["deckhouse.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["nodegroups"]
        scope: "Cluster"
  - name: yandexinstanceclasses.cloud-provider-yandex.deckhouse.io-v1alpha1
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 30
    clientConfig:
      service:
        name: validation-webhook
        namespace: d8-cloud-provider-yandex
        path: /validate-deckhouse-io-v1alpha1-yandexinstanceclass
        port: 443
      caBundle: {{ .Values.cloudProviderYandex.internal.validationWebhookCert.ca | b64enc | quote }}
    rules:
      - apiGroups: ["deckhouse.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["yandexinstanceclasses"]
        scope: "Cluster"
  - name: yandexinstanceclasses.cloud-provider-yandex.deckhouse.io-v1
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 30
    clientConfig:
      service:
        name: validation-webhook
        namespace: d8-cloud-provider-yandex
        path: /validate-deckhouse-io-v1-yandexinstanceclass
        port: 443
      caBundle: {{ .Values.cloudProviderYandex.internal.validationWebhookCert.ca | b64enc | quote }}
    rules:
      - apiGroups: ["deckhouse.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["yandexinstanceclasses"]
        scope: "Cluster"
