    # ==========================================
    # Internal: providerDiscoveryData
    # null instead of an omitted collection
    # ==========================================

    # A nil Go slice/map marshals to null, not to an absent key, and null is not an array
    # or an object — this is what produced "in body must be of type array: null" for a
    # cluster whose infrastructure DKP does not create. The fix is `omitempty` on the
    # YandexCloudDiscoveryData fields, not `nullable: true` here: templates read these
    # through `dig ... (list)` / `dig ... (dict)`, and an explicit null would defeat the
    # default and reach `toJson` as null. These three cases keep that decision pinned.

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      internal:
        providerDiscoveryData:
          apiVersion: deckhouse.io/v1
          kind: YandexCloudDiscoveryData
          region: ru-central1
          zones: null

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      internal:
        providerDiscoveryData:
          apiVersion: deckhouse.io/v1
          kind: YandexCloudDiscoveryData
          region: ru-central1
          internalNetworkIDs: null

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      internal:
        providerDiscoveryData:
          apiVersion: deckhouse.io/v1
          kind: YandexCloudDiscoveryData
          region: ru-central1
          zoneToSubnetIdMap: null

