positive:
  configValues:
    # ==========================================
    # Required fields only (minimal valid configs)
    # ==========================================

    # layout: Standard
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...

    # layout: WithoutNAT
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: WithoutNAT
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...

    # layout: WithNATInstance (requires withNATInstance section)
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: WithNATInstance
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          withNATInstance:
            natInstanceExternalAddress: 198.51.100.1

    # ==========================================
    # zones
    # ==========================================

    # single zone
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          zones:
            - ru-central1-a

    # all available zones
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          zones:
            - ru-central1-a
            - ru-central1-b
            - ru-central1-d
            - ru-central1-e

    # ==========================================
    # dhcpOptions
    # ==========================================

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          dhcpOptions:
            domainName: example.com
            domainNameServers:
              - 8.8.8.8
              - 8.8.4.4

    # ==========================================
    # existing network and subnet maps
    # ==========================================

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          existingNetworkID: enp1234567890abcdef
          existingZoneToSubnetIDMap:
            ru-central1-a: e2lu8r1tbbtryhdpa9ro
            ru-central1-b: e2lu8r1tbbtryhdpa9rb

    # ==========================================
    # external IP addresses (per node group)
    # ==========================================

    # Auto-assigned
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          externalIPAddresses:
            master:
              - Auto
            worker:
              - Auto
              - Auto

    # Static IPs
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          externalIPAddresses:
            system:
              - 198.51.100.5
              - 203.0.113.10

    # Mixed Auto and static
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          externalIPAddresses:
            front:
              - 198.51.100.1
              - Auto

    # ==========================================
    # external subnet IDs (per node group)
    # ==========================================

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          externalSubnetIDs:
            system:
              - e9bnc7g9mu9mper9clk4
              - e2lgddi5svochh5fbq96
            worker:
              - b0csh41c1or82vuch89v

    # ==========================================
    # labels
    # ==========================================

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          labels:
            env: production
            team: platform

    # ==========================================
    # storage
    # ==========================================

    # empty parameters (valid)
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      storage:
        parameters: {}

    # only excludedStorageClasses
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      storage:
        parameters:
          excludedStorageClasses:
            - slow-disk
            - legacy-hdd

    # both storage fields
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      storage:
        parameters:
          excludedStorageClasses:
            - slow-disk
          provisionedStorageClasses:
            - name: "network-ssd-64k"
              type: "network-ssd"
              blockSize: "64Ki"

    # every allowed blockSize value
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      storage:
        parameters:
          provisionedStorageClasses:
            - name: "sc-4k"
              type: "network-ssd"
              blockSize: "4Ki"
            - name: "sc-8k"
              type: "network-ssd"
              blockSize: "8Ki"
            - name: "sc-16k"
              type: "network-ssd"
              blockSize: "16Ki"
            - name: "sc-32k"
              type: "network-ssd"
              blockSize: "32Ki"
            - name: "sc-64k"
              type: "network-ssd-nonreplicated"
              blockSize: "64Ki"
            - name: "sc-128k"
              type: "network-ssd-io-m3"
              blockSize: "128Ki"

    # only provisionedStorageClasses
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      storage:
        parameters:
          provisionedStorageClasses:
            - name: "network-ssd-64k"
              type: "network-ssd"
              blockSize: "64Ki"
            - name: "network-hdd"
              type: "network-hdd"

    # storage disabled
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      storage:
        disabled: true
        parameters: {}

    # ==========================================
    # ccm (Cloud Controller Manager)
    # ==========================================

    # enabled with empty parameters
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      ccm:
        parameters: {}

    # enabled with additional external networks
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      ccm:
        parameters:
          additionalExternalNetworkIDs:
            - enp-ext-net-1
            - enp-ext-net-2

    # enabled with additional internal networks
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      ccm:
        parameters:
          additionalInternalNetworkIDs:
            - enp-int-net-1
            - enp-int-net-2

    # disabled
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      ccm:
        disabled: true
        parameters: {}

    # ==========================================
    # WithNATInstance — full configuration
    # ==========================================

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: WithNATInstance
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          withNATInstance:
            externalSubnetID: ext-subnet-id
            internalSubnetCIDR: 192.168.1.0/24
            internalSubnetID: int-subnet-id
            natInstanceExternalAddress: 198.51.100.1
            natInstanceInternalAddress: 10.0.0.1
            natInstanceResources:
              cores: 4
              memory: 4096
              platform: high-freq-v3

    # ==========================================
    # Combined: all features together
    # ==========================================

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          dhcpOptions:
            domainName: internal.example.com
          existingNetworkID: enp-existing
          existingZoneToSubnetIDMap:
            ru-central1-a: subnet-a-id
          externalIPAddresses:
            worker:
              - Auto
          externalSubnetIDs:
            worker:
              - e9bnc7g9mu9mper9clk4
              - e2lgddi5svochh5fbq96
          labels:
            env: prod
          zones:
            - ru-central1-a
            - ru-central1-b
      ccm:
        parameters:
          additionalExternalNetworkIDs:
            - enp-ext-1
      storage:
        parameters:
          excludedStorageClasses:
            - slow-hdd

  values:
    # ==========================================
    # Bootstrap from a legacy YandexClusterConfiguration alone, with no
    # ModuleConfig to seed the settings sections.
    #
    # This is the state of the module values while the TLS hooks registered by
    # go_lib/hooks/tls_certificate run: they fire on the Kubernetes binding at
    # OperatorStartup and again with OnBeforeHelm order 5, both of which happen
    # before hooks/yandex_cluster_configuration.go (order 20) projects the PCC
    # onto provider/nodes. Their input.Values.Set must not be rejected — with a
    # ModuleConfig v1 around, openapi/conversions/v2.yaml fills these sections in
    # advance, which is why the failure only shows on a PCC-only cluster.
    # ==========================================

    - provider:
        parameters:
          cloudID: PLACEHOLDER_REPLACE_ME
          folderID: PLACEHOLDER_REPLACE_ME
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa PLACEHOLDER_REPLACE_ME
          # NodesParameters embeds these as structs rather than pointers, so they are
          # serialized even when empty. Keeping them here pins that shape: adding a required
          # field to either section would break the seeding hook, and this case catches it.
          withNATInstance: {}
          dhcpOptions: {}
      internal:
        capyControllerManagerWebhookCert:
          crt: YjY0ZW5jX3N0cmluZwo= # gitleaks:allow
          key: YjY0ZW5jX3N0cmluZwo= # gitleaks:allow
          ca: YjY0ZW5jX3N0cmluZwo= # gitleaks:allow

    # ==========================================
    # Internal: minimal providerClusterConfiguration
    # (Standard layout)
    # ==========================================

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      internal:
        providerClusterConfiguration:
          apiVersion: deckhouse.io/v1
          kind: YandexClusterConfiguration
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          masterNodeGroup:
            replicas: 1
            instanceClass:
              cores: 4
              memory: 8192
              imageID: fd85m9q2qspfnsv055rh
          provider:
            cloudID: test-cloud-id
            folderID: test-folder-id
            serviceAccountJSON: '{"id": "id"}'

    # ==========================================
    # Internal: providerClusterConfiguration with
    # master zones, labels, existing network
    # ==========================================

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      internal:
        providerClusterConfiguration:
          apiVersion: deckhouse.io/v1
          kind: YandexClusterConfiguration
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          labels:
            environment: production
          existingNetworkID: enp-existing
          masterNodeGroup:
            replicas: 3
            zones:
              - ru-central1-a
              - ru-central1-b
              - ru-central1-d
            instanceClass:
              cores: 4
              memory: 8192
              imageID: fd85m9q2qspfnsv055rh
              platform: standard-v3
              diskSizeGB: 50
              diskType: network-ssd
          provider:
            cloudID: test-cloud-id
            folderID: test-folder-id
            serviceAccountJSON: '{"id": "id"}'

    # ==========================================
    # Internal: providerClusterConfiguration
    # with nodeGroups, DHCP, external IPs
    # ==========================================

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      internal:
        providerClusterConfiguration:
          apiVersion: deckhouse.io/v1
          kind: YandexClusterConfiguration
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          dhcpOptions:
            domainName: example.com
          masterNodeGroup:
            replicas: 1
            instanceClass:
              cores: 4
              memory: 8192
              imageID: fd85m9q2qspfnsv055rh
          nodeGroups:
            - name: worker
              replicas: 3
              zones:
                - ru-central1-a
                - ru-central1-b
              instanceClass:
                cores: 8
                memory: 16384
                imageID: fd85m9q2qspfnsv055rh
                coreFraction: 50
                externalIPAddresses:
                  - Auto
                additionalLabels:
                  node-type: worker
            - name: front
              replicas: 2
              instanceClass:
                cores: 2
                memory: 4096
                imageID: fd85m9q2qspfnsv055rh
          provider:
            cloudID: test-cloud-id
            folderID: test-folder-id
            serviceAccountJSON: '{"id": "id"}'

    # ==========================================
    # Internal: providerClusterConfiguration
    # WithNATInstance layout
    # ==========================================

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: WithNATInstance
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      internal:
        providerClusterConfiguration:
          apiVersion: deckhouse.io/v1
          kind: YandexClusterConfiguration
          layout: WithNATInstance
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          masterNodeGroup:
            replicas: 1
            instanceClass:
              cores: 4
              memory: 8192
              imageID: fd85m9q2qspfnsv055rh
          withNATInstance:
            natInstanceExternalAddress: 198.51.100.1
            natInstanceResources:
              cores: 2
              memory: 2048
              platform: standard-v2
          provider:
            cloudID: test-cloud-id
            folderID: test-folder-id
            serviceAccountJSON: '{"id": "id"}'

    # ==========================================
    # Internal: providerDiscoveryData
    # ==========================================

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      internal:
        providerDiscoveryData:
          apiVersion: deckhouse.io/v1
          kind: YandexCloudDiscoveryData
          region: eu-central-1
          routeTableID: rt-12345
          defaultLbTargetGroupNetworkId: lb-network-id
          internalNetworkIDs:
            - net-1
            - net-2
          zones:
            - ru-central1-a
            - ru-central1-b
          zoneToSubnetIdMap:
            ru-central1-a: subnet-a
            ru-central1-b: subnet-b
          shouldAssignPublicIPAddress: true

    # ==========================================
    # Internal: providerDiscoveryData
    # with NAT instance fields
    # ==========================================

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      internal:
        providerDiscoveryData:
          apiVersion: deckhouse.io/v1
          kind: YandexCloudDiscoveryData
          region: eu-central-1
          routeTableID: rt-12345
          defaultLbTargetGroupNetworkId: lb-network-id
          internalNetworkIDs:
            - net-1
          zones:
            - ru-central1-a
          zoneToSubnetIdMap:
            ru-central1-a: subnet-a
          shouldAssignPublicIPAddress: true
          natInstanceName: cluster-nat-instance
          natInstanceZone: ru-central1-a
          monitoringAPIKey: test-api-key

    # ==========================================
    # Internal: storageClasses and webhook cert
    # ==========================================

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      internal:
        storageClasses:
          - name: fast
            type: network-ssd
          - name: slow
            type: network-hdd
        capyControllerManagerWebhookCert:
          crt: YjY0ZW5jX3N0cmluZwo= # gitleaks:allow
          key: YjY0ZW5jX3N0cmluZwo= # gitleaks:allow
          ca: YjY0ZW5jX3N0cmluZwo= # gitleaks:allow

    # ==========================================
    # Internal: cniSecretData
    # ==========================================

    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      internal:
        cniSecretData: "Y25pOiBZMmxzYVhWdApjaWxpdW06IGV3b2dJQ0p0YjJSbElqb2dJbFpZVEVGT0lpd0tJQ0FpYldGemNYVmxjbUZrWlUxdlpHVWlPaUFpUWxCR0lncDkK" # gitleaks:allow

    # ==========================================
    # Hybrid cluster: infrastructure is not created by DKP
    # ==========================================

    # hybrid cluster: infrastructure is not created by DKP, so the discovery data
    # inputs are supplied explicitly
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: WithoutNAT
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          existingNetworkID: enp-network
          existingRouteTableID: enp-route-table
          existingZoneToSubnetIDMap:
            ru-central1-a: subnet-a

    # ==========================================
    # Internal: providerDiscoveryData with only apiVersion/kind/region set
    # ==========================================

    # A cluster with no infrastructure run yet: providerDiscoveryData only requires
    # apiVersion and kind (see openapi/values.yaml), so an incomplete payload like this
    # one is valid. This case used to live under "negative" as "missing required
    # fields", back when routeTableID, defaultLbTargetGroupNetworkId,
    # internalNetworkIDs, zones and zoneToSubnetIdMap were all required; the schema
    # relaxation that lets a cluster without an infrastructure run render at all
    # means it is not a validation failure any more.
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      internal:
        providerDiscoveryData:
          apiVersion: deckhouse.io/v1
          kind: YandexCloudDiscoveryData
          region: test

    # ==========================================
    # Internal: providerDiscoveryData with empty, but present, collections
    # ==========================================

    # The same cluster as above, written by something that emits the keys instead of
    # omitting them. routeTableID, defaultLbTargetGroupNetworkId, internalNetworkIDs,
    # zones and zoneToSubnetIdMap used to carry minLength/minItems constraints, so this
    # payload was rejected with "should be at least 1 chars long" and the module could not
    # render at all without an infrastructure run. The constraints are gone; an empty
    # collection now means the same as an absent one, and templates/_helpers.tpl already
    # falls back to nodes.parameters.existing* for every one of these.
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      internal:
        providerDiscoveryData:
          apiVersion: deckhouse.io/v1
          kind: YandexCloudDiscoveryData
          region: ru-central1
          routeTableID: ""
          defaultLbTargetGroupNetworkId: ""
          internalNetworkIDs: []
          zones: []
          zoneToSubnetIdMap: {}

    # ==========================================
    # Internal: providerDiscoveryData with a discovered shouldAssignPublicIPAddress: false
    # ==========================================

    # shouldAssignPublicIPAddress is a *bool in go_lib/cloud-data so that "discovered as
    # false" survives serialization instead of being dropped as a zero value. Only the
    # WithoutNAT layout reports true, so false is the common case and has to be
    # representable next to an otherwise empty payload.
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
      internal:
        providerDiscoveryData:
          apiVersion: deckhouse.io/v1
          kind: YandexCloudDiscoveryData
          region: ru-central1
          shouldAssignPublicIPAddress: false

negative:
  configValues:
    # ==========================================
    # Missing required top-level fields
    # ==========================================

    # missing provider
    - nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...

    # missing nodes
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id

    # empty config
    - {}

    # ==========================================
    # Missing required nested fields
    # ==========================================

    # missing provider.parameters
    - provider: {}
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...

    # missing cloudID in provider
    - provider:
        parameters:
          folderID: test-folder-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...

    # missing folderID in provider
    - provider:
        parameters:
          cloudID: test-cloud-id
      nodes:
        parameters:
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...

    # missing nodes.parameters
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes: {}

    # missing layout in nodes
    - provider:
        parameters:
          cloudID: test-cloud-id
          folderID: test-folder-id
      nodes:
