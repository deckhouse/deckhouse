    # ==========================================

    # Relaxing the other fields did not relax region: every layout's cloud_discovery_data
    # output hardcodes it, and YandexCloudDiscoveryData.SetDefaults stamps it, so an empty
    # or absent region means something upstream is broken rather than "not discovered yet".

    - provider:
        parameters:
