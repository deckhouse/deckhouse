positive:
  configValues:
    # empty configuration is valid
    - {}

    # empty storage class is valid
    - "storageClass": {}

    # only exclude
    - storageClass:
        exclude: ["disk-type", "ssd-.*"]

    # only default
    - storageClass:
        default: "ssd"

    # all in
    - storageClass:
        default: "ssd"
        exclude: ["disk-type", "ssd-.*"]
  values:
    # four zones including ru-central1-f (the maximum allowed)
    - internal:
        providerClusterConfiguration:
          apiVersion: deckhouse.io/v1
          kind: YandexClusterConfiguration
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          zones:
            - ru-central1-a
            - ru-central1-b
            - ru-central1-d
            - ru-central1-f
          masterNodeGroup:
            replicas: 1
            instanceClass:
              cores: 4
              memory: 8192
              imageID: fd85m9q2qspfnsv055rh
          provider:
            cloudID: test-cloud-id
            folderID: test-folder-id
            serviceAccountJSON: '{"id": "id"}'

negative:
  configValues:
    - storageClass:
        exclude: "must be array"
    - storageClass:
        exclude: {"key": "must be array"}
    - storageClass:
        default: ["must be string"]
    - storageClass:
        default: {"key": "must be string"}

  values:
    # five zones: more than the four-zone maximum
    - internal:
        providerClusterConfiguration:
          apiVersion: deckhouse.io/v1
          kind: YandexClusterConfiguration
          layout: Standard
          nodeNetworkCIDR: 10.0.0.0/16
          sshPublicKey: ssh-rsa AAAA...
          zones:
            - ru-central1-a
            - ru-central1-b
            - ru-central1-d
            - ru-central1-e
            - ru-central1-f
          masterNodeGroup:
            replicas: 1
            instanceClass:
              cores: 4
              memory: 8192
              imageID: fd85m9q2qspfnsv055rh
          provider:
            cloudID: test-cloud-id
            folderID: test-folder-id
            serviceAccountJSON: '{"id": "id"}'
