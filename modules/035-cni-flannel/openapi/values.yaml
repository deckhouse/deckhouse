x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    x-required-for-helm:
    - podNetworkMode
    - ipv4OptionsGuardMode
    properties:
      ipv4OptionsGuardDefaultMode:
        type: string
        enum: ["Audit", "Enforce"]
