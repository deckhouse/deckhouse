type: object
properties:
  podNetworkMode:
    description: |
      Режим работы.
      > **Внимание.** При переключении между `HostGW` и `VXLAN` требуется **перезагрузка всех узлов** кластера. Изменять этот параметр можно **только** при использовании модуля **в bare-metal-кластерах**.
  ipv4OptionsGuard:
    description: |
      Защита от [CVE-2026-98432](https://www.cve.org/CVERecord?id=CVE-2026-98432) (use-after-free в обработке IPv4 TCP handshake в ядре Linux, срабатывающий на TCP SYN с IP-опциями).

      Сайдкар агента CNI устанавливает фильтр в сетевое пространство имён хоста и во все сетевые пространства имён подов на узле, включая поды, запущенные позже. Фильтр срабатывает на IPv4 TCP SYN и IPv4-фрагменты с IP-опциями.

      Фильтр использует тот режим iptables (nft или legacy), который iptables-wrapper выбрал на узле, как и остальные компоненты Deckhouse. В режиме nft фильтр создаётся нативными выражениями nftables, в режиме legacy — через iptables с match `u32`. Модули ядра не загружаются, если не включён параметр `allowKernelModuleLoad`. Если модули ядра выбранного режима не загружены, а модули другого режима загружены, фильтр использует другой режим, и узел отображается в алерте `D8IPv4OptionsGuardBackendMismatch`. Узел, который не удалось защитить, отображается в алерте `D8IPv4OptionsGuardNodeUnprotected`.

      Чтобы исключить узел (например, узел с маркированной сетью CIPSO), установите на него метку `ipv4-options-guard.deckhouse.io/disabled: "true"`: изменения на этом узле будут отменены.

      Защита не устраняет уязвимость: обновите ядро узлов, как только станет доступна исправленная версия.
    properties:
      mode:
        description: |
          Режим работы.

          Если режим не задан, он равен `Enforce` в кластерах, установленных вместе с митигацией, и `Audit` в кластерах, существовавших до неё.

          - `Audit` — подходящие пакеты только подсчитываются (метрика `d8_ipv4_options_guard_matched_packets_total` и алерт `D8IPv4OptionsGuardMatchedTraffic`). Используйте, чтобы убедиться, что приложения не зависят от IP-опций. Пока хотя бы один узел в этом режиме, алерт `D8IPv4OptionsGuardAuditMode` напоминает, что кластер ещё не защищён.
          - `Enforce` — подходящие пакеты отбрасываются, а MPTCP отключается, если включён параметр `disableMPTCP`.
          - `Disabled` — фильтр удаляется из всех сетевых пространств имён, включая работающие поды, а значение `net.mptcp.enabled` восстанавливается.

          Режим применяется без перезапуска подов агента CNI.
      disableMPTCP:
        description: |
          В режиме `Enforce` устанавливать `net.mptcp.enabled=0` в сетевом пространстве имён хоста и во всех сетевых пространствах имён подов. Это убирает условие опубликованного эксплойта.

          Сокеты, открытые до изменения, остаются MPTCP до перезапуска процесса. Для хоста настройка также записывается в `/etc/sysctl.d`, чтобы после перезагрузки применяться до запуска kubelet.
      allowKernelModuleLoad:
        description: |
          В режиме nft фильтру нужен модуль ядра `nf_tables`, в режиме legacy — модули ядра `ip_tables`, `iptable_raw`, `xt_tcpudp` и `xt_u32`.

          По умолчанию модули ядра не загружаются: если какой-то модуль режима, выбранного iptables-wrapper, не загружен, фильтр использует другой режим, когда его модули загружены, а иначе узел отображается как незащищённый. Установите `true`, чтобы загружать модули выбранного режима.
