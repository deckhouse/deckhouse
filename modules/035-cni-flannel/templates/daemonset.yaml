{{- define "kube_flannel_resources" }}
cpu: 25m
memory: 50Mi
{{- end }}

{{- if (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: flannel
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "flannel")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: DaemonSet
    name: flannel
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
    - containerName: "kube-flannel"
      minAllowed:
        {{- include "kube_flannel_resources" . | nindent 8 }}
      maxAllowed:
        cpu: 50m
        memory: 50Mi
    - containerName: ipv4-options-guard
      minAllowed:
        cpu: 10m
        memory: 25Mi
      maxAllowed:
        cpu: 50m
        memory: 64Mi
    - containerName: ipv4-options-guard-kube-rbac-proxy
      minAllowed:
        {{- include "helm_lib_container_kube_rbac_proxy_resources" . | nindent 8 }}
      maxAllowed:
        cpu: 25m
        memory: 64Mi
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: flannel
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "flannel")) | nindent 2 }}
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: flannel
  template:
    metadata:
      labels:
        tier: node
        app: flannel
        security.deckhouse.io/security-policy-exception: flannel
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{ include "helm_lib_prevent_ds_eviction_annotation" . | nindent 8 }}
    spec:
      # https://github.com/coreos/flannel/issues/1002 workaround
      terminationGracePeriodSeconds: 0
      imagePullSecrets:
      - name: deckhouse-registry
      {{- include "helm_lib_priority_class" (tuple . "system-node-critical") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple . "any-node" "with-uninitialized") | nindent 6 }}
      {{- include "helm_lib_module_pod_security_context_run_as_user_root" . | nindent 6 }}
      automountServiceAccountToken: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ .Chart.Name }}
      initContainers:
      - name: cni-migration-init-checker
        image: {{ include "helm_lib_module_image" (list $ "cniMigrationInitChecker" "common") }}
        {{- include "helm_lib_module_container_security_context_run_as_user_deckhouse_pss_restricted" . | nindent 8 }}
          readOnlyRootFilesystem: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CNI_NAME
          value: "flannel"
        - name: KUBERNETES_SERVICE_HOST
          value: "127.0.0.1"
        - name: KUBERNETES_SERVICE_PORT
          value: "6445"
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" $ | nindent 12 }}
      {{ include "helm_lib_module_init_container_iptables_wrapper" . | nindent 6 }}
      {{- if eq .Values.cniFlannel.internal.podNetworkMode "vxlan" }}
      - name: handle-vxlan-offload
        {{- include "helm_lib_module_container_security_context_read_only_root_filesystem_capabilities_drop_all_and_add" (list . (list "NET_ADMIN")) | nindent 8 }}
        image: {{ include "helm_lib_module_common_image" (list . "vxlanOffloadingFixer") }}
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        resources:
          requests:
          {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 12 }}
        terminationMessagePolicy: FallbackToLogsOnError
      {{- end }}
      containers:
      - name: kube-flannel
        {{- include "helm_lib_module_container_security_context_read_only_root_filesystem_capabilities_drop_all_and_add" (list . (list "NET_ADMIN" "NET_RAW")) | nindent 8 }}
        image: {{ include "helm_lib_module_image" (list . "flanneld") }}
        args:
        - --ip-masq
        - --kube-subnet-mgr
        env:
        - name: POD_NETWORK_MODE
          value: {{ .Values.cniFlannel.internal.podNetworkMode }}
        - name: MODULE_CNI_CILIUM_ENABLED
          value: {{ .Values.global.enabledModules | has "cni-cilium" | quote }}
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: run
          mountPath: /run/flannel
        - name: xtables-lock
          mountPath: /run/xtables.lock
        - name: flannel-cfg
          mountPath: /etc/kube-flannel/
        - name: cni
          mountPath: /etc/cni/net.d
        - name: tmp
          mountPath: /tmp
        - mountPath: /sbin
          name: sbin
          readOnly: true
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_logs_with_extra" 10 | nindent 12 }}
{{- if not (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- include "kube_flannel_resources" . | nindent 12 }}
{{- end }}
      - name: ipv4-options-guard
        # CVE-2026-98432 mitigation, settings in templates/ipv4-options-guard/configmap.yaml.
        image: {{ include "helm_lib_module_common_image" (list . "ipv4OptionsGuard") }}
        args:
        - --settings=/etc/ipv4-options-guard/settings.json
        - --netns-dir=/run/netns
        - --listen=127.0.0.1:9741
        - --sbin=/sbin
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KUBERNETES_SERVICE_HOST
          value: "127.0.0.1"
        - name: KUBERNETES_SERVICE_PORT
          value: "6445"
        securityContext:
          # setns into pod netns and writes to their /proc/sys/net need a privileged container.
          privileged: true
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: ipv4-options-guard-settings
          mountPath: /etc/ipv4-options-guard
          readOnly: true
        - name: ipv4-options-guard-netns
          mountPath: /run/netns
          # Pod netns are bind-mounted by containerd after the sidecar has started.
          mountPropagation: HostToContainer
          readOnly: true
        - name: ipv4-options-guard-state
          mountPath: /run/ipv4-options-guard
        - name: xtables-lock
          mountPath: /run/xtables.lock
        # iptables-wrapper populated by iptables-wrapper-init: the same legacy/nft decision as kube-flannel.
        - name: sbin
          mountPath: /sbin
        livenessProbe:
          httpGet:
            host: 127.0.0.1
            path: /healthz
            port: 9741
          periodSeconds: 30
        readinessProbe:
          # Always ok while the process serves: problems go to metrics, never to the agent pod readiness.
          httpGet:
            host: 127.0.0.1
            path: /healthz
            port: 9741
          periodSeconds: 30
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 12 }}
{{- if not (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            cpu: 10m
            memory: 25Mi
{{- end }}
        terminationMessagePolicy: FallbackToLogsOnError
      - name: ipv4-options-guard-kube-rbac-proxy
        {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 8 }}
        image: {{ include "helm_lib_module_common_image" (list . "kubeRbacProxy") }}
        args:
        - "--secure-listen-address=$(KUBE_RBAC_PROXY_LISTEN_ADDRESS):4261"
        - "--v=2"
        - "--logtostderr=true"
        - "--stale-cache-interval=1h30m"
        - "--livez-path=/livez"
        env:
        - name: KUBE_RBAC_PROXY_LISTEN_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: KUBE_RBAC_PROXY_CONFIG
          value: |
            upstreams:
            - upstream: http://127.0.0.1:9741/metrics
              path: /metrics
              authorization:
                resourceAttributes:
                  namespace: d8-{{ .Chart.Name }}
                  apiGroup: apps
                  apiVersion: v1
                  resource: daemonsets
                  subresource: prometheus-metrics
                  name: flannel
        ports:
        - containerPort: 4261
          name: https-metrics
        livenessProbe:
          httpGet:
            path: /livez
            port: 4261
            scheme: HTTPS
        readinessProbe:
          httpGet:
            path: /livez
            port: 4261
            scheme: HTTPS
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 12 }}
{{- if not (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- include "helm_lib_container_kube_rbac_proxy_resources" . | nindent 12 }}
{{- end }}
      volumes:
        - name: run
          hostPath:
            path: /run/flannel
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: cni
          hostPath:
            path: /etc/cni/net.d
        - name: flannel-cfg
          configMap:
            name: flannel
        - name: tmp
          emptyDir: {}
        - name: sbin
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: ipv4-options-guard-settings
          configMap:
            name: ipv4-options-guard
        - name: ipv4-options-guard-state
          hostPath:
            path: /run/ipv4-options-guard
            type: DirectoryOrCreate
        - name: ipv4-options-guard-netns
          hostPath:
            path: /run/netns
            type: DirectoryOrCreate
