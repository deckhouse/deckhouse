---
image: {{ .ModuleName }}/{{ .ImageName }}-entrypoint-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/entrypoint
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GOPROXY=$(cat /run/secrets/GOPROXY) GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - cd /src
  - go build -ldflags="-s -w" -o /entrypoint main.go
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/flannel
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  beforeInstall:
  - pm install linux-headers binutils
  install:
  - export GO_VERSION=${GOLANG_VERSION}
  - export GOPROXY=$(cat /run/secrets/GOPROXY)
  - cd /src
  - make dist/flanneld
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: common/src-artifact
final: false
git:
- url: {{ $.SOURCE_REPO }}/flannel-io/flannel.git
  tag: v{{ include "get_oss_version_by_id" (list "flannel" $ ) }}
  add: /
  to: /src/flannel
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}modules/035-{{ .ModuleName }}/images/flanneld/entrypoint
  to: /src/entrypoint
  stageDependencies:
    install:
    - '**/*'
- add: /{{ .ModulePath }}modules/035-{{ .ModuleName }}/images/flanneld/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - mkdir -p /src/flannel
  - cd /src/flannel
  - git apply /patches/*.patch --verbose
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: common/distroless
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /src/dist/flanneld
  to: /opt/bin/flanneld
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-entrypoint-artifact
  add: /entrypoint
  to: /entrypoint
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/entrypoint"]
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
