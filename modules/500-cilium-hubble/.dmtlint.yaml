linters-settings:
  no-cyrillic:
    exclude-rules:
      directories:
        # The RBACv2 templates carry the localized title and description of every role and
        # capability they ship. That is product text, not a source comment: the console shows it
        # to whoever is choosing what to grant, and `d8:namespace-capability:kubernetes:view_logs`
        # on its own tells that person nothing.
        - templates/rbacv2
  container:
    exclude-rules:
      read-only-root-filesystem:
        - kind: Deployment
          name: hubble-relay
          container: hubble-relay
        - kind: Deployment
          name: hubble-ui
          container: frontend
      liveness-probe:
        - kind: Deployment
          name: hubble-ui
          container: backend
        - kind: Deployment
          name: hubble-ui
          container: frontend
      readiness-probe:
        - kind: Deployment
          name: hubble-ui
          container: backend
        - kind: Deployment
          name: hubble-ui
          container: frontend
  module:
    conversions:
      disable: true
