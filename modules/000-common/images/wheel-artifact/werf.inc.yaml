{{- $commit := "02bc7137aafbc66e84a8bb4e1c34f6df7e0792db" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
final: false
fromImage: common/src-artifact
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
  - mkdir /wheels
  - cd /wheels
  - git init .
  - git remote add origin $(cat /run/secrets/SOURCE_REPO)/python-modules/wheels
  - git fetch origin {{ $commit }}
  - git checkout {{ $commit }}
  - rm -rf /wheels/.git
