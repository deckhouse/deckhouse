# Based on https://github.com/kubernetes-csi/external-snapshotter/blob/master/cmd/csi-snapshotter/Dockerfile
{{- range $key, $value := .CandiVersionMap.k8s }}
  {{- $version := toString $key }}
  {{- if $value.csi.snapshotter }}
    {{- $src_version := toString $value.csi.snapshotter }}
    {{- $patches := (printf "/%smodules/%s-%s/images/%s" $.ModulePath $.ModulePriority $.ModuleName $.ImageName) }}
    {{- $patch := false }}
    {{- range $path, $_ := $.Files.Glob (printf "%s/*" $patches) }}
      {{- if contains $src_version $path }}
        {{- $patch = true }}
      {{- end }}
    {{- end }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $version | replace "." "-" }}
from: common/distroless
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $version | replace "." "-" }}
  add: /csi-snapshotter
  to: /csi-snapshotter
  before: setup
{{- include "image mount points" $ }}
imageSpec:
  config:
    entrypoint: ["/csi-snapshotter"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $version | replace "." "-" }}
from: common/src-artifact
final: false
git:
- url: {{ $.SOURCE_REPO }}/kubernetes-csi/external-snapshotter.git
  tag: {{ $src_version }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
    {{- if $patch }}
- add: {{ $patches }}/patches/{{ $src_version }}
  to: /patches
  stageDependencies:
    install:
    - '**/*'
    {{- end }}
shell:
  install:
  - cd /src
  {{- if $patch }}
  - git apply /patches/*.patch --verbose
  {{- end }}
  - rm -rf vendor
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $version | replace "." "-" }}
from: {{ index $.Images "builder/golang" }}
final: false
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $version | replace "." "-" }}
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
shell:
  beforeInstall:
  - pm install git
  install:
  - export GO_VERSION=${GOLANG_VERSION} CGO_ENABLED=0 GOOS=linux GOARCH=amd64
  - cd /src
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
  - make build
  - cp bin/csi-snapshotter /csi-snapshotter
  - chown 64535:64535 /csi-snapshotter
  - chmod 0755 /csi-snapshotter
---
{{- include "vex mitigation" (list $ (printf "%s/%s-%s" $.ModuleName $.ImageName ($version | replace "." "-"))) }}
  {{- end }}
{{- end }}
