---
image: {{ .ModuleName }}/{{ .ImageName }}
from: common/distroless
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /
  to: /
  before: setup
  includePaths:
  # libs
  - bin
  - usr/lib
  - lib
  - lib64

  - usr/bin/sh
  - usr/bin/bash

  - usr/bin/chown
  - usr/bin/chmod
  - usr/bin/ls
  - usr/bin/cp
  - usr/bin/rm
  - usr/bin/mkdir
  - usr/bin/sleep
  - usr/bin/true

  - usr/bin/nc
{{- include "image mount points" . }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
shell:
  beforeInstall:
  - pm install netcat coreutils bash
