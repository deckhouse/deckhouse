---
image: {{ .ModuleName }}/{{ .ImageName }}
from: common/distroless
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /
  to: /
  before: setup
  includePaths:
  - bin
  - usr/bin/sh
  - usr/bin/chown
  - usr/bin/chmod
  - usr/bin/ls
  - usr/bin/cp
  - usr/bin/rm
  - usr/bin/mkdir
  - usr/bin/sleep
  - usr/bin/true
  - usr/bin/busybox

  - usr/bin/nc
  - usr/lib/libc.so.*
  - usr/lib/ld-linux-x86-64.so*
  - lib
  - lib64
{{- include "image mount points" . }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
shell:
  beforeInstall:
  - pm install netcat
