---
image: {{ .ModuleName }}/{{ .ImageName }}
from: common/distroless
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /
  to: /
  before: setup
  includePaths:
  - bin
  - usr/bin/sh
  - usr/bin/chown
  - usr/bin/chmod
  - usr/bin/ls
  - usr/bin/cp
  - usr/bin/rm
  - usr/bin/mkdir
  - usr/bin/sleep
  - usr/bin/true
  - usr/bin/nc
  - usr/bin/busybox
- image: registrypackages/netcat-artifact 
  add: /nc
  to: /usr/bin/nc
  before: setup
{{- include "image mount points" . }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
shell:
  beforeInstall:
  - pm install netcat
