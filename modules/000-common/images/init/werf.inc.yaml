{{- $binaries := list "chown" "chmod" "ls" "cp" "rm" "mkdir" "sleep" "true" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless-fin" }}
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /out/usr/bin
  to: /usr/bin
  includePaths:
  # every consumer of this image is started as `sh -c ...`; the sh -> bash and nc -> ncat
  # symlinks ship with the bash and ncat packets, so both link targets come along too
  - sh
  - bash
  - nc
  - ncat
{{- range $binaries }}
  - {{ . | quote }}
{{- end }}
  before: setup
{{- include "image mount points" . }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
shell:
  beforeInstall:
  - pm install coreutils bash ncat -d /out
