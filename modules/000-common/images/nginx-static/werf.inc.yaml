{{- $NginxVersion := "1.27.3" }}
{{- $OpenSSLVersion := "3.3.2" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
fromImage: common/src-artifact
final: false
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
  - git clone -b release-{{ $NginxVersion }} --single-branch --depth=1 $(cat /run/secrets/SOURCE_REPO)/nginx/nginx.git /src/nginx
  - git clone -b openssl-{{ $OpenSSLVersion }} --single-branch --depth=1 $(cat /run/secrets/SOURCE_REPO)/openssl/openssl.git /src/openssl
  - rm -r /src/nginx/.git /src/openssl/.git
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
from: {{ index $.Images "builder/alpine-3.21" }}
final: false
import:
- image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
shell:
  beforeInstall:
  {{- include "alpine packages proxy" . | nindent 2 }}
  - apk add pcre-dev zlib-dev zlib-static perl linux-headers build-base
  install:
  - cd /src/nginx
  - |
    ./auto/configure --prefix=/opt/nginx-static --with-cc-opt="-static -static-libgcc" \
      --with-ld-opt="-static" --with-stream --with-cpu-opt=generic --with-pcre --with-mail \
      --with-ipv6 --with-poll_module --with-select_module --with-http_ssl_module --with-http_realip_module \
      --with-http_addition_module --with-http_sub_module --with-http_dav_module --with-http_flv_module \
      --with-http_mp4_module --with-http_gunzip_module --with-http_gzip_static_module --with-http_auth_request_module \
      --with-http_random_index_module --with-http_secure_link_module --with-http_degradation_module \
      --with-http_stub_status_module --with-mail --with-mail_ssl_module --with-openssl=/src/openssl
  - make -j4
  - make -j4 install
  - chown -R 64535:64535 /opt/nginx-static
  - chmod 0700 /opt/nginx-static/sbin/nginx
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
fromImage: common/distroless
final: false
import:
- image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /opt/nginx-static
  to: /opt/nginx-static
  before: setup

---
# The registry proxy uses this Nginx fork; its harnesses live on deckhouse-fuzzing.
image: {{ $.ModuleName }}/{{ $.ImageName }}-fuzz
from: registry.flant.com/deckhouse/ssdlc/ci-images/fuzz-afl:34fdc16d905326c2fd7097363059baa398c9a1c0
fromLatest: true
final: false
git:
  - url: {{ $.SOURCE_REPO }}/nginx/nginx.git
    branch: deckhouse-fuzzing
    add: /
    to: /src/nginx
    stageDependencies:
      install:
        - '**/*'
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/fuzz
    to: /src/nginx/fuzz-platform
    stageDependencies:
      install:
        - '**/*'
shell:
  install:
    - cd /src/nginx
    - bash fuzz-platform/build.sh
    - cp fuzz-platform/Taskfile.yml Taskfile.yml
    - chmod -R a+rwX /src/nginx /out/fuzz
imageSpec:
  config:
    workingDir: /src/nginx
    labels:
      io.deckhouse.fuzz.engine: afl
    env:
      FUZZ_ENGINE: afl
      # One callback per fork child isolates Nginx module globals between inputs.
      AFL_FUZZER_LOOPCOUNT: "1"
      FUZZ_WORKDIR: /src/nginx
      FUZZ_SEED_DIR: /src/nginx/fuzz/corpus
      # LSan matches the ngx_init_setproctitle suppression by function name.
      ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:symbolize=1:allocator_may_return_null=1
      ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer
      LSAN_OPTIONS: suppressions=/src/nginx/fuzz/lsan.supp
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
