{{- $promuVersion := "0.17.0" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: common/src-artifact
final: false
git:
- url: {{ $.SOURCE_REPO }}/prometheus/promu.git
  tag: v{{ $promuVersion }}
  add: /
  to: /src/promu
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  includePaths:
  - '**/*.patch'
  stageDependencies:
    install:
    - '**/*.patch'
shell:
  install:
  - cd /src/promu
  - git apply /patches/*.patch --verbose
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/golang-1.25" }}
final: false
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/promu
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GOPROXY=$(cat /run/secrets/GOPROXY) CGO_ENABLED=0 GOOS=linux GOARCH=amd64
  - cd /src
  - go build -ldflags="-s -w" -o promu ./main.go
