{{- $chronyExproterVersion := "0.14.0"}}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: common/src-artifact
final: false
git:
- url: {{ $.SOURCE_REPO }}/SuperQ/chrony_exporter.git
  tag: v{{$chronyExproterVersion}}
  add: /
  to: /src/chrony_exporter
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  includePaths:
  - '**/*.patch'
  stageDependencies:
    install:
    - '**/*.patch'
shell:
  install:
  - cd /src
  - cd /src/chrony_exporter
  - git apply /patches/chrony_exporter/*.patch --verbose
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/golang" }}
final: false
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/chrony_exporter
  to: /chrony_exporter
  before: install
- from: common/promu-artifact
  add: /src/promu
  to: /bin/promu
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GOPROXY=$(cat /run/secrets/GOPROXY) CGO_ENABLED=1 GOOS=linux GOARCH=amd64
  - cd /chrony_exporter
  - promu build
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: common/distroless
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /chrony_exporter/chrony_exporter
  to: /bin/chrony_exporter
  before: install
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/bin/chrony_exporter"]
    expose: ["9123"]
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
