{{- $chronyExproterVersion := "0.14.0"}}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/src" }}
final: false
git:
- url: {{ $.SOURCE_REPO }}/SuperQ/chrony_exporter.git
  tag: v{{$chronyExproterVersion}}
  add: /
  to: /src/chrony_exporter
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  includePaths:
  - '**/*.patch'
  stageDependencies:
    install:
    - '**/*.patch'
shell:
  install:
  - cd /src
  - cd /src/chrony_exporter
  - git apply /patches/chrony_exporter/*.patch --verbose
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/golang" }}
final: false
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/chrony_exporter
  to: /chrony_exporter
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GOPROXY=$(cat /run/secrets/GOPROXY) CGO_ENABLED=0 GOOS=linux GOARCH=amd64
  - cd /chrony_exporter
  # The same version stamp promu put in from .promu.yml. The source is cloned without .git,
  # so promu reported the revision and branch as "non-git" too.
  - |
    go build -trimpath -ldflags="-s -w \
      -X github.com/prometheus/common/version.Version=$(cat VERSION) \
      -X github.com/prometheus/common/version.Revision=non-git \
      -X github.com/prometheus/common/version.Branch=non-git \
      -X github.com/prometheus/common/version.BuildUser=root@unknown" \
      -o chrony_exporter .
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: common/distroless
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /chrony_exporter/chrony_exporter
  to: /bin/chrony_exporter
  before: install
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/bin/chrony_exporter"]
    expose: ["9123"]
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
