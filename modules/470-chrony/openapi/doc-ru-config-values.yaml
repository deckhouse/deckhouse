properties:
  ntpServers:
    type: array
    description: |
      Список NTP-серверов для синхронизации времени.

      Каждый сервер задаётся именем хоста или IPv4-адресом, без порта.

      На master-узлах эти серверы также используются для синхронизации времени при загрузке, до запуска kubelet. На узлах Deckhouse Engine при загрузке используются первые 16 из них.
      Синхронизация времени при загрузке настраивается параметром [earlyTimeSync](#parameters-earlytimesync).
      Пустой список отключает синхронизацию времени при загрузке.

  earlyTimeSync:
    description: |
      Синхронизация времени на master-узлах при загрузке, до запуска kubelet.

      Не даёт статическим подам control plane запуститься с неверным временем, полученным от аппаратных часов (RTC) или гипервизора.
      Включение и изменение настроек применяются при следующей загрузке узла. Отключение действует сразу после применения конфигурации.
    properties:
      enabled:
        description: |
          Включает синхронизацию времени при загрузке, до запуска kubelet.

      timeoutSeconds:
        description: |
          Максимальное время ожидания синхронизации перед запуском kubelet, в секундах.

          На узлах под управлением bashible отсчёт начинается, когда сеть узла становится доступной. Если за это время ни один NTP-сервер не ответил или ответившие серверы расходятся, kubelet запускается с непроверенным временем. На узлах Deckhouse Engine параметр не действует: там ожидание не больше 30 секунд.

          Если master-узел, на котором уже настроена ранняя синхронизация, не может связаться с NTP-серверами, проверка ждёт до таймаута. Такое возможно в изолированном кластере с сервером по умолчанию `pool.ntp.org`. Укажите доступные серверы в параметре [ntpServers](#parameters-ntpservers) или отключите синхронизацию времени при загрузке.
