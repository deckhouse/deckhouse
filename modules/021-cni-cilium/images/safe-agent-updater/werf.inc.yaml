{{/*
Description: safe-agent-updater, orders agent restarts so a node never loses its datapath mid-update
Target: final image
Sources:
- Deckhouse specific, no upstream counterpart
*/}}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src
from: {{ index $.Images "builder/src" }}
final: false
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/src
  to: /src
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src
---
image: {{ .ModuleName }}/{{ .ImageName }}-build
from: {{ index $.Images "builder/golang" }}
final: false
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-src
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GO_VERSION=${GOLANG_VERSION} GOPROXY=$(cat /run/secrets/GOPROXY)
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - cd /src
  - |
    {{- $buildContext := deepCopy $ -}}
    {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
    {{- $_ := set $buildContext "BuildCommand" `go build -ldflags "-s -w" -o /out/safe-agent-updater .` -}}
    {{- include "image-build.build" $buildContext | indent 4 }}
  - chown 64535:64535 /out/safe-agent-updater
  - chmod 0700 /out/safe-agent-updater
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless-fin" }}
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-build
  add: /out/safe-agent-updater
  to: /safe-agent-updater
  before: install
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/safe-agent-updater"]
