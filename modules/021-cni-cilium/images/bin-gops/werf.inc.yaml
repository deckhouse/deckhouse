# #####################################################################
# Description: gops — утилита диагностики Go-процессов. Используется в runtime
# Target: agent, hubble-relay
# Sources:
# - cilium/cilium: images/runtime/Dockerfile (стадия go-builder)
# - cilium/cilium: images/runtime/build-gops.sh
# #####################################################################

{{- $gopsVersion := include "get_oss_version_by_id" (list "gops" $) }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src
from: {{ index $.Images "builder/src" }}
final: false
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
  - git clone --depth 1 --branch v{{ $gopsVersion }} $(cat /run/secrets/SOURCE_REPO)/google/gops.git /src
  - cd /src
  - git apply --verbose --allow-empty /patches/*.patch
  - rm -rf /src/.git
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "builder/golang" }}
final: false
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-src
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  beforeInstall:
  - pm install binutils
  install:
  - export GO_VERSION=${GOLANG_VERSION} GOPROXY=$(cat /run/secrets/GOPROXY)
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - cd /src
  - |
    {{- $buildContext := deepCopy $ -}}
    {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
    {{- $_ := set $buildContext "BuildCommand" `go build -ldflags "-s -w" -o /out/gops github.com/google/gops` -}}
    {{- include "image-build.build" $buildContext | indent 4 }}
  - strip /out/gops
  - go version -m /out/usr/bin/gops | grep -q "GOARCH=amd64"
