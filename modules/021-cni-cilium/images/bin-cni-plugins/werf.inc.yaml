# #####################################################################
# Description: CNI-плагин loopback (only) — . Используется в runtime # TODO(tden): дописать заголовок
# Target: agent # TODO(tden): проверить использование
# Sources:
# - cilium/cilium: images/runtime/Dockerfile (стадия go-builder)
# - cilium/cilium:images/runtime/build-cni.sh
# #####################################################################

{{- $cniVersion := include "get_oss_version_by_id" (list "cni-plugins" $) }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src
from: {{ index $.Images "builder/src" }}
final: false
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
  - git clone --depth 1 --branch v{{ $cniVersion }} $(cat /run/secrets/SOURCE_REPO)/containernetworking/plugins.git /src
  - cd /src
  - git apply --verbose --allow-empty /patches/*.patch
  - rm -rf /src/.git
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "builder/golang" }}
final: false
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-src
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  beforeInstall:
  - pm install binutils
  install:
  - export GO_VERSION=${GOLANG_VERSION} GOPROXY=$(cat /run/secrets/GOPROXY)
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - cd /src
  - export FLAGS='-s -w -X github.com/containernetworking/plugins/pkg/utils/buildversion.BuildVersion=v{{ $cniVersion }}' # TODO(tden): нормально ли иметь такой формат?
  - |
    {{- $buildContext := deepCopy $ -}}
    {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
    {{- $_ := set $buildContext "BuildCommand" `go build -mod=mod -ldflags "${FLAGS}" -o /out/cni/loopback ./plugins/main/loopback` -}}
    {{- include "image-build.build" $buildContext | indent 4 }}
  - strip /out/cni/loopback
  - go version -m /out/cni/loopback | grep -q "GOARCH=amd64"
