# #####################################################################
# Description: CNI plugins from containernetworking/plugins, installed onto the node by the agent
# Target: agent
# Sources:
# - cilium/cilium: images/runtime/Dockerfile (go-builder stage)
# - cilium/cilium: images/runtime/build-cni.sh
# Notes:
# - Only loopback is built, the other plugins from the repository are not needed
# - The /cni/loopback path in the agent image must not be changed
# #####################################################################
---
{{- $cniVersion := include "get_oss_version_by_id" (list "cni-plugins" $) }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src
from: {{ index $.Images "builder/src" }}
final: false
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
  - git clone --depth 1 --branch v{{ $cniVersion }} $(cat /run/secrets/SOURCE_REPO)/containernetworking/plugins.git /src
  - cd /src
  - git apply --verbose --allow-empty /patches/*.patch
  # Upstream builds from the committed vendor/ directory, we cannot: the patch
  # bumps go.mod/go.sum but not vendor/modules.txt, so vendoring goes
  # inconsistent and the build fails. Dependencies are fetched from GOPROXY
  # instead, go.sum from the patch keeps that verifiable
  - rm -rf /src/vendor /src/.git
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "builder/golang" }}
final: false
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-src
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GO_VERSION=${GOLANG_VERSION} GOPROXY=$(cat /run/secrets/GOPROXY)
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - cd /src
  - export FLAGS='-s -w -X github.com/containernetworking/plugins/pkg/utils/buildversion.BuildVersion=v{{ $cniVersion }}'
  - |
    {{- $buildContext := deepCopy $ -}}
    {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
    {{- $_ := set $buildContext "BuildCommand" `go build -mod=readonly -ldflags "${FLAGS}" -o /out/cni/loopback ./plugins/main/loopback` -}}
    {{- include "image-build.build" $buildContext | indent 4 }}
  - go version -m /out/cni/loopback | grep -q "GOARCH=amd64"
