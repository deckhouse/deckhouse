---
image: {{ .ModuleName }}/{{ .ImageName }}
from: common/distroless
import:
- from: common/check-kernel-version
  add: /check-kernel-version
  to: /check-kernel-version
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-pm-artifact
  add: /relocate-pm/bin/true
  to: /bin/true
  before: setup
- from: common/pause
  add: /pause
  to: /pause
  before: install
imageSpec:
  config:
    entrypoint: [ "/check-kernel-version" ]
{{- include "pm_binaries_artifact" (dict
      "Images" $.Images
      "name" (printf "%s/%s-pm-artifact" $.ModuleName $.ImageName)
      "packages" "coreutils"
      "binaries" "/usr/bin/true:/bin/true") }}
