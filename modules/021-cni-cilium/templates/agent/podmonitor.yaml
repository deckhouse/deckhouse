{{- if (.Values.global.enabledModules | has "operator-prometheus") }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium-agent
  namespace: d8-monitoring
  {{- include "helm_lib_module_labels" (list . (dict "app" "agent" "prometheus" "main")) | nindent 2 }}
spec:
  jobLabel: app
  podMetricsEndpoints:
  - port: https-metrics
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
    bearerTokenSecret:
      name: "prometheus-token"
      key: "token"
    honorLabels: true
    relabelings:
    - targetLabel: tier
      replacement: cluster
    - targetLabel: job
      replacement: "cilium-agent"
  {{- if .Values.cniCilium.internal.hubble.settings.extendedMetrics.enabled }}
  - port: https-metrics
    scheme: https
    path: /extended-metrics
    tlsConfig:
      insecureSkipVerify: true
    bearerTokenSecret:
      name: "prometheus-token"
      key: "token"
    honorLabels: true
    relabelings:
      - targetLabel: tier
        replacement: cluster
      - targetLabel: job
        replacement: "cilium-agent-extended-metrics"
  {{- end }}
  - port: https-metrics
    scheme: https
    path: /ipv4-options-guard/metrics
    tlsConfig:
      insecureSkipVerify: true
    bearerTokenSecret:
      name: "prometheus-token"
      key: "token"
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
    - targetLabel: tier
      replacement: cluster
    - targetLabel: job
      replacement: ipv4-options-guard
  selector:
    matchLabels:
      app: agent
  namespaceSelector:
    matchNames:
    - d8-{{ .Chart.Name }}
{{- end }}
