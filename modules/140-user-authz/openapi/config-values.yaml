# /modules/140-user-authz/openapi/config-values.yaml
# /ee/cse/modules/140-user-authz/openapi/config-values.yaml
type: object
properties:
  enableMultiTenancy:
    type: boolean
    default: false
    x-doc-d8Editions:
      - be
      - se
      - se+
      - ee
      - cse-lite
      - cse-pro
    description: |
      Enable namespace-based authorization (multi-tenancy mode).

      When enabled, the module deploys the authorization webhook on the master nodes and Permission Browser. They enforce the `namespaceSelector`, `limitNamespaces`, and `allowAccessToSystemNamespaces` fields of ClusterAuthorizationRule and serve WhoCan, SubjectAccessReport, and the filtered list of namespaces. The `kube-apiserver` settings are applied automatically by the [control-plane-manager](/modules/control-plane-manager/) module, see [Configuring kube-apiserver for multi-tenancy mode](usage.html#configuring-kube-apiserver-for-multi-tenancy-mode).
    x-doc-default: false
    x-examples: [true, false]
  controlPlaneConfigurator:
    type: object
    description: |
      Parameters of the [control-plane-manager](https://deckhouse.io/modules/control-plane-manager/) module.
    default: {}
    properties:
      enabled:
        type: boolean
        default: true
        description: |
          Passes parameters for configuring `authz-webhook` to the `control-plane-manager` module (see the parameters of the [control-plane-manager](https://deckhouse.io/modules/control-plane-manager/configuration.html#parameters) module).

          If this parameter is disabled, the `control-plane-manager` module assumes that Webhook-based authorization is disabled by default. In this case (if no additional settings are provided), the `control-plane-manager` module will try to delete all references to the Webhook plugin from the manifest (even if you configure the manifest manually).
        x-doc-default: true
        x-examples: [true, false]
