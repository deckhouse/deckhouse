properties:
  enableMultiTenancy:
    description: |
      Включить авторизацию по неймспейсам (режим multi-tenancy).

      При включении модуль разворачивает на master-узлах вебхук авторизации и Permission Browser. Они применяют поля `namespaceSelector`, `limitNamespaces` и `allowAccessToSystemNamespaces` ресурса ClusterAuthorizationRule и обслуживают WhoCan, SubjectAccessReport и отфильтрованный список неймспейсов. Настройки `kube-apiserver` автоматически выполняет модуль [control-plane-manager](/modules/control-plane-manager/), см. [«Настройка kube-apiserver для работы в режиме multi-tenancy»](usage.html#настройка-kube-apiserver-для-работы-в-режиме-multi-tenancy).
  controlPlaneConfigurator:
    description: |
      Параметры модуля [control-plane-manager](/modules/control-plane-manager/).
    properties:
      enabled:
        description: |
          Передавать ли в [control-plane-manager](https://deckhouse.ru/modules/control-plane-manager/) параметры для настройки authz-webhook (см. [параметры control-plane-manager'а](https://deckhouse.ru/modules/control-plane-manager/configuration.html#параметры)).

          При выключении этого параметра модуль `control-plane-manager` будет считать, что по умолчанию webhook-авторизация выключена, и, соответственно, если не будет дополнительных настроек, `control-plane-manager` будет стремиться вычеркнуть упоминания webhook-плагина из манифеста. Даже если вы настроите манифест вручную.
