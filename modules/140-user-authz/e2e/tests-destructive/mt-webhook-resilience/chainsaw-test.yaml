apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mt-webhook-resilience
spec:
  description: >-
    With the multitenancy mode on, restart user-authz-controller under a probe that keeps
    asking kube-apiserver for decisions with unique names (bypassing its authorizer cache): the
    restart must cause no false deny, no false allow and no failed review, and a rule created
    while the controller is stopped must converge once it is back. The rollout restart of the
    webhook DaemonSet is a known module defect and lives in known-defect-webhook-rollout-gap
    (skipped). Then take the webhook away
    entirely and verify that kube-apiserver fails closed for the subjects of the rules while
    the excluded identities (the d8-system ServiceAccounts, the cluster-admin kubeconfig of the
    runner) keep working. Every component is restored and the original ModuleConfig is put back.
  timeouts:
    apply: 60s
    assert: 3m
    error: 2m
    delete: 3m
    cleanup: 40m
    exec: 15m

  catch:
    - description: Show the evidence about the webhook Pods, DaemonSet, events and VPA
      script:
        content: bash ../../tests/common/scripts/webhook-evidence.sh catch
    - description: Show the Pods, DaemonSet and Deployments of d8-user-authz
      script:
        content: |
          kubectl -n d8-user-authz get daemonsets,deployments,pods -o wide
          kubectl -n d8-user-authz get daemonset user-authz-webhook -o jsonpath='{.spec.template.spec.nodeSelector}'; echo
          kubectl -n d8-user-authz get events --sort-by=.lastTimestamp | tail -n 40
    - description: Show the authorization webhook logs
      podLogs:
        namespace: d8-user-authz
        selector: app=user-authz-webhook
        container: webhook
        tail: 200
    - description: Show user-authz-controller logs
      podLogs:
        namespace: d8-user-authz
        selector: app=user-authz-controller
        tail: 200

  steps:
    - name: prerequisites
      description: Verify that the user-authz module and its controller are Ready
      try:
        - description: Wait for module user-authz and the user-authz-controller Deployment
          script:
            timeout: 20m
            content: bash ../../tests/common/scripts/ensure-user-authz.sh

    - name: enable-multitenancy
      description: Set enableMultiTenancy=true and wait until the authorization webhook serves every kube-apiserver
      try:
        - description: Enable the multitenancy mode and wait for the whole chain
          script:
            timeout: 40m
            content: bash ../../tests/common/scripts/multitenancy.sh enable
      cleanup:
        - description: Restore ModuleConfig user-authz and wait until kube-apiserver runs without the webhook
          script:
            timeout: 40m
            content: bash ../../tests/common/scripts/multitenancy.sh restore

    - name: create-rules
      description: Create an unlimited and a limited Editor rule and wait until the webhook enforces them
      try:
        - description: Create namespace e2e-authz-resilience-other
          script:
            content: bash "${E2E_LIB_DIR}/create-namespace.sh" e2e-authz-resilience-other
        - description: Apply the rules, retrying while the admission webhook still sees the mode as off
          script:
            timeout: 5m
            content: |
              set -u
              for attempt in $(seq 1 36); do
                if sed "s/@NAMESPACE@/${NAMESPACE}/" manifests/cars.yaml | kubectl apply -f -; then
                  exit 0
                fi
                echo "attempt ${attempt} failed, retrying"
                sleep 5
              done
              exit 1
        - description: Wait until the decisions are enforced
          script:
            timeout: 12m
            content: bash ../../tests/common/scripts/sar-check.sh ready.txt 600
      cleanup:
        - description: Delete the rules before the mode is switched off
          script:
            timeout: 5m
            content: kubectl delete -f manifests/cars.yaml -f manifests/late-car.yaml --ignore-not-found --wait=true
        - description: Delete namespace e2e-authz-resilience-other (its Project when multitenancy-manager adopted it)
          script:
            timeout: 6m
            content: bash "${E2E_LIB_DIR}/delete-namespace.sh" e2e-authz-resilience-other

    - name: controller-rollout-restart
      description: >-
        Restart user-authz-controller under the probe, then stop it, create a rule while no
        controller runs and start it again. The controller is not on the authorization path:
        existing bindings must survive the restart, and the rule created while it was down must
        converge once a new leader is elected (a rule created during a rolling restart could
        still be handled by the old leader and prove nothing).
      try:
        - description: Probe while the Deployment restarts; zero false denies, false allows and errors are allowed
          script:
            timeout: 15m
            content: >-
              bash ../../tests/common/scripts/probe-during.sh probe.txt 20 0 0 --
              bash -c 'kubectl -n d8-user-authz rollout restart deployment/user-authz-controller
              && kubectl -n d8-user-authz rollout status deployment/user-authz-controller --timeout=10m'
        - description: Probe while the controller is stopped, a rule is created and the controller is started again
          script:
            timeout: 15m
            content: |
              set -eu
              # The replicas are recorded in E2E_STATE_DIR: the `finally` of the step and
              # cleanup-leftovers.sh put them back if this script is killed on its timeout.
              bash ../../tests/common/scripts/controller-replicas.sh save
              trap 'bash ../../tests/common/scripts/controller-replicas.sh restore' EXIT
              bash ../../tests/common/scripts/probe-during.sh probe.txt 20 0 0 -- bash -c '
                set -e
                kubectl -n d8-user-authz scale deployment/user-authz-controller --replicas=0
                for _ in $(seq 1 60); do
                  pods="$(kubectl -n d8-user-authz get pods -l app=user-authz-controller -o name)"
                  [ -z "${pods}" ] && break
                  sleep 5
                done
                [ -z "${pods}" ] || { echo "user-authz-controller pods still running: ${pods}" >&2; exit 1; }
                kubectl apply -f manifests/late-car.yaml
                sleep 10
                if kubectl get clusterrolebinding user-authz:e2e-authz-res-late:user >/dev/null 2>&1; then
                  echo "a binding of the late rule exists although no controller runs" >&2
                  exit 1
                fi'
        - description: Assert the rule created during the restart is Ready
          assert:
            resource:
              apiVersion: deckhouse.io/v1
              kind: ClusterAuthorizationRule
              metadata:
                name: e2e-authz-res-late
              status:
                bindings: 2
                (conditions[?type == 'Ready']):
                  - status: 'True'
        - description: Assert the binding of the rule created during the restart
          assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: user-authz:e2e-authz-res-late:user
              roleRef:
                name: user-authz:user
      finally:
        - description: Start the controller replicas again if the step that stopped them was killed
          script:
            timeout: 11m
            content: bash ../../tests/common/scripts/controller-replicas.sh restore

    - name: webhook-unavailable
      description: >-
        Make the webhook DaemonSet unschedulable and verify that kube-apiserver fails closed for
        the Editor while the deckhouse ServiceAccount and the cluster-admin kubeconfig keep
        working; then restore the DaemonSet and wait until the Editor is allowed again.
      try:
        - description: Take the webhook away and check the fail-closed behaviour (the script restores the DaemonSet on exit)
          script:
            timeout: 15m
            content: bash fail-closed.sh run
      finally:
        - description: Make sure the DaemonSet is schedulable again and the webhook serves requests
          script:
            timeout: 15m
            content: bash fail-closed.sh restore
