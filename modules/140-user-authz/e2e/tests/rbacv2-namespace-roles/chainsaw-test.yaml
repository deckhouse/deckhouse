apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rbacv2-namespace-roles
spec:
  description: >-
    Bind the five namespace roles of the granular role model (d8:namespace:viewer, user,
    manager, admin, superadmin) with RoleBindings and verify the access matrix inside the
    namespace and outside it. Verify that user-authz-controller grants every holder the
    cluster dictionary through a d8:dict:* ClusterRoleBinding and removes it with the last
    RoleBinding of the subject.
  timeouts:
    apply: 60s
    assert: 2m
    error: 2m
    delete: 2m
    exec: 5m

  catch:
    - description: Show the RoleBindings of the test namespace
      get:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
    - description: Show the dictionary ClusterRoleBindings of the test users
      script:
        content: |
          kubectl get clusterrolebindings -l rbac.deckhouse.io/dict=true -o json \
            | jq -r '.items[] | select(.metadata.annotations["rbac.deckhouse.io/subject"] // "" | startswith("user:e2e-authz-ns-")) | [.metadata.name, .metadata.annotations["rbac.deckhouse.io/subject"]] | @tsv'
    - description: Show user-authz-controller logs
      podLogs:
        namespace: d8-user-authz
        selector: app=user-authz-controller
        tail: 200

  steps:
    - name: prerequisites
      description: Verify that the user-authz module and its controller are Ready, and the namespace roles exist
      try:
        - description: Wait for module user-authz and the user-authz-controller Deployment
          script:
            timeout: 20m
            content: bash ../common/scripts/ensure-user-authz.sh
        - description: Assert the namespace roles exist
          script:
            content: >-
              kubectl get clusterrole d8:namespace:viewer d8:namespace:user d8:namespace:manager
              d8:namespace:admin d8:namespace:superadmin d8:dict

    - name: bind-roles
      description: Create one RoleBinding per namespace role and a second namespace without bindings
      try:
        - description: Create namespace e2e-authz-rbacv2-other
          script:
            content: bash "${E2E_LIB_DIR}/create-namespace.sh" e2e-authz-rbacv2-other
        - description: Create the RoleBindings in the test namespace
          apply:
            file: manifests/rolebindings.yaml

      cleanup:
        - description: Delete namespace e2e-authz-rbacv2-other (its Project when multitenancy-manager adopted it)
          script:
            timeout: 6m
            content: bash "${E2E_LIB_DIR}/delete-namespace.sh" e2e-authz-rbacv2-other

    - name: dict-bindings
      description: Verify that every holder of a namespace role gets a d8:dict ClusterRoleBinding
      try:
        - description: Assert the dictionary binding of e2e-authz-ns-viewer
          assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                labels:
                  rbac.deckhouse.io/dict: 'true'
                  rbac.deckhouse.io/automated: 'true'
                annotations:
                  rbac.deckhouse.io/subject: user:e2e-authz-ns-viewer
              roleRef:
                kind: ClusterRole
                name: d8:dict
              subjects:
                - kind: User
                  name: e2e-authz-ns-viewer
        - description: Assert the dictionary binding of e2e-authz-ns-superadmin
          assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                labels:
                  rbac.deckhouse.io/dict: 'true'
                annotations:
                  rbac.deckhouse.io/subject: user:e2e-authz-ns-superadmin
              roleRef:
                name: d8:dict

    - name: access-matrix
      description: Compare the decisions for the five namespace roles with the reference matrix
      try:
        - description: Evaluate matrix.txt
          script:
            content: bash ../common/scripts/sar-check.sh matrix.txt 120

    - name: unbind-viewer
      description: Delete the viewer RoleBinding and verify that the access and the dictionary binding go away
      try:
        - description: Delete RoleBinding e2e-authz-ns-viewer
          delete:
            ref:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              name: e2e-authz-ns-viewer
        - description: Assert the dictionary binding of e2e-authz-ns-viewer is removed
          error:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                labels:
                  rbac.deckhouse.io/dict: 'true'
                annotations:
                  rbac.deckhouse.io/subject: user:e2e-authz-ns-viewer
        - description: Assert the dictionary binding of e2e-authz-ns-superadmin is kept
          assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                labels:
                  rbac.deckhouse.io/dict: 'true'
                annotations:
                  rbac.deckhouse.io/subject: user:e2e-authz-ns-superadmin
        - description: Evaluate matrix-viewer-removed.txt
          script:
            content: bash ../common/scripts/sar-check.sh matrix-viewer-removed.txt 60
