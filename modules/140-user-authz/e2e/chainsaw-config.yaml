apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: user-authz-e2e
spec:
  timeouts:
    apply: 60s
    assert: 3m
    error: 2m
    delete: 3m
    cleanup: 40m
    exec: 10m
  execution:
    parallel: 1
  discovery:
    testFile: chainsaw-test.yaml
  report:
    format: JUNIT-TEST
