version: '3'

vars:
  REPORTS: '{{.E2E_REPORTS_DIR | default "./reports"}}'

  # One namespace for the whole suite: multitenancy-manager adopts every new namespace into a
  # Project and then refuses to delete it directly, so chainsaw must not create its own.
  SUITE_NAMESPACE: e2e-authz

env:
  # Shared helpers of the module suites (delete-namespace.sh, create-namespace.sh, module-enabled.sh,
  # wait-deckhouse-queue.sh). The CI bundle sets E2E_LIB_DIR; in a checkout it is
  # testing/e2e/lib of the repository.
  E2E_LIB_DIR:
    sh: >-
      if [ -n "${E2E_LIB_DIR:-}" ]; then echo "${E2E_LIB_DIR}";
      else echo "$(git -C "{{.TASKFILE_DIR}}" rev-parse --show-toplevel)/testing/e2e/lib"; fi
  E2E_STATE_DIR: /tmp/e2e-authz-state

tasks:
  run:
    desc: Run the functional user-authz e2e tests
    cmds:
      - defer: bash tests/common/scripts/cleanup-leftovers.sh
      - mkdir -p {{.REPORTS}}
      # Leftovers of a run that was killed before its cleanup would break this one.
      - bash tests/common/scripts/cleanup-leftovers.sh
      - bash tests/common/scripts/ensure-user-authz.sh --enable
      - bash "${E2E_LIB_DIR}/create-namespace.sh" {{.SUITE_NAMESPACE}}
      - defer: bash "${E2E_LIB_DIR}/delete-namespace.sh" {{.SUITE_NAMESPACE}}
      - >-
        chainsaw test --test-dir tests --config chainsaw-config.yaml --namespace {{.SUITE_NAMESPACE}}
        --report-format JUNIT-TEST --report-path {{.REPORTS}} --report-name user-authz

  run:destructive:
    desc: Run the destructive user-authz e2e tests (restarts and outage of the authorization webhook)
    cmds:
      - defer: bash tests/common/scripts/cleanup-leftovers.sh
      - mkdir -p {{.REPORTS}}
      # Leftovers of a run that was killed before its cleanup would break this one.
      - bash tests/common/scripts/cleanup-leftovers.sh
      - bash tests/common/scripts/ensure-user-authz.sh --enable
      - bash "${E2E_LIB_DIR}/create-namespace.sh" {{.SUITE_NAMESPACE}}
      - defer: bash "${E2E_LIB_DIR}/delete-namespace.sh" {{.SUITE_NAMESPACE}}
      - >-
        chainsaw test --test-dir tests-destructive --config chainsaw-config.yaml --namespace {{.SUITE_NAMESPACE}}
        --report-format JUNIT-TEST --report-path {{.REPORTS}} --report-name user-authz-destructive

  lint:
    desc: Lint the Chainsaw configuration, every test of both suites and every script
    cmds:
      - chainsaw lint configuration -f chainsaw-config.yaml
      - for f in tests/*/chainsaw-test.yaml tests-destructive/*/chainsaw-test.yaml; do echo "$f"; chainsaw lint test -f "$f" || exit 1; done
      - for f in tests/common/scripts/*.sh tests-destructive/*/*.sh; do [ -e "$f" ] || continue; bash -n "$f" || exit 1; done
      - for f in "${E2E_LIB_DIR}"/*.sh; do bash -n "$f" || exit 1; done
