---
image: {{ .ModuleName }}/{{ .ImageName }}
fromImage: common/distroless
import:
- image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /src/user-authz-controller
  to: /user-authz-controller
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: [ "/user-authz-controller" ]
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
fromImage: common/src-artifact
final: false
git:
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
    to: /src
    includePaths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
    stageDependencies:
      install:
        - '**/*.go'
        - '**/go.mod'
        - '**/go.sum'
  # go.mod replaces github.com/deckhouse/deckhouse/go_lib/user-authz with a relative path that
  # resolves to /go_lib/user-authz from /src.
  - add: /{{ $.ModulePath }}go_lib/user-authz
    to: /go_lib/user-authz
    includePaths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
    stageDependencies:
      install:
        - '**/*.go'
        - '**/go.mod'
        - '**/go.sum'
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
  - image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /src
    to: /src
    before: install
  - image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /go_lib/user-authz
    to: /go_lib/user-authz
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - export GOPROXY=$(cat /run/secrets/GOPROXY) CGO_ENABLED=0 GOOS=linux GOARCH=amd64
    - cd /src
    - |
      {{- $buildContext := deepCopy $ -}}
      {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
      {{- $_ := set $buildContext "BuildCommand" `go build -ldflags '-s -w' -o user-authz-controller ./cmd` -}}
      {{- include "image-build.build" $buildContext | indent 6 }}
    - chown 64535:64535 user-authz-controller
    - chmod 0700 user-authz-controller
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
