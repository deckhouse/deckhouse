# Permissions of the toy server itself: read the front-proxy settings and
# delegate authentication and authorization to kube-apiserver.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scope-toy
  namespace: scope-toy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scope-toy:extension-apiserver-authentication-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: scope-toy
    namespace: scope-toy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scope-toy:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: scope-toy
    namespace: scope-toy
