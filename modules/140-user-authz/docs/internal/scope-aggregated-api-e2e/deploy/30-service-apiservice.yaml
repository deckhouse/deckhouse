apiVersion: v1
kind: Service
metadata:
  name: scope-toy
  namespace: scope-toy
spec:
  selector:
    app: scope-toy
  ports:
    - name: https
      port: 443
      targetPort: https
---
# The toy serves a self-signed certificate, so TLS verification of the
# backend is skipped. For a real extension set spec.caBundle instead.
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1.scopetoy.deckhouse.io
  annotations:
    scope.deckhouse.io/resources: gizmos
spec:
  group: scopetoy.deckhouse.io
  version: v1
  groupPriorityMinimum: 1000
  versionPriority: 15
  insecureSkipTLSVerify: true
  # caBundle: <base64 PEM of the serving CA>
  service:
    name: scope-toy
    namespace: scope-toy
    port: 443
