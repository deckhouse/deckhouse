- name: d8.user-authz.rbacv2.foreign-aggregation-label
  rules:
  # A ClusterRole outside the platform that carries rbac.deckhouse.io/aggregate-to-<lineage>-as
  # without being a custom capability. The aggregation controller reads nothing but the label, so
  # its rules are merged into the platform role for every holder; the cluster_roles webhook refuses
  # such an object on CREATE/UPDATE, but a role that predates the check stays until it is fixed.
  - alert: D8UserAuthzForeignAggregationLabel
    expr: |
      max by (name, lineage, kind) (d8_user_authz_foreign_aggregation_label) > 0
    for: 15m
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: user-authz
      d8_component: rbacv2
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_user_authz_foreign_aggregation_labels: "D8UserAuthzForeignAggregationLabels,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_user_authz_foreign_aggregation_labels: "D8UserAuthzForeignAggregationLabels,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: ClusterRole `{{ $labels.name }}` carries the `{{ $labels.lineage }}` aggregation label without being a custom capability.
      description: |-
        The ClusterRole `{{ $labels.name }}` carries the `rbac.deckhouse.io/aggregate-to-{{ $labels.lineage }}-as` label but is not labelled `rbac.deckhouse.io/kind: custom-capability`{{ if $labels.kind }} (its kind label is `{{ $labels.kind }}`){{ end }}. The aggregation controller reads nothing but that label, so it merges the rules of this role into {{ if eq $labels.lineage "system" "namespace" "project" }}the platform `d8:{{ $labels.lineage }}:*` roles{{ else if eq $labels.lineage "all" }}every custom role that selects the label, because no built-in role selects this label of the old scheme any longer{{ else }}the `d8:subsystem:{{ $labels.lineage }}:*` roles, if a subsystem has this name, and into every custom role that selects the label{{ end }}. Every holder of these roles in the cluster gets the rules, outside the role model's contract.

        For the aggregation label of the system scope, of the namespace or project scope, or of a built-in subsystem, the `rbacv2-cluster-roles.deckhouse.io` webhook refuses such an object, and every `UPDATE` of this role, including a GitOps re-apply, is denied until it is fixed. Choose one:

        * If the role is meant to extend the platform roles, replace it with a custom capability. The name of an object cannot be changed, so create `d8:custom:<scope>-capability:<name>` with the same rules and aggregation label, the `rbac.deckhouse.io/kind: custom-capability` and `rbac.deckhouse.io/scope: <scope>` labels, the `rbac.deckhouse.io/namespace` label if this role has one, and no `aggregationRule`, and then delete this role.
          Deckhouse reads `rbac.deckhouse.io/namespace` only on a system or subsystem capability, so only there it gives the RoleBinding objects in that namespace back.
          A capability of the old scheme with the `rbac.deckhouse.io/kind: use` label and `rbac.deckhouse.io/aggregate-to-kubernetes-as: <LEVEL>` or `rbac.deckhouse.io/aggregate-to-all-as: <LEVEL>` extended the namespace roles, so its replacement is `d8:custom:namespace-capability:<name>` with `rbac.deckhouse.io/scope: namespace` and `rbac.deckhouse.io/aggregate-to-namespace-as: <LEVEL>` instead. For the commands, refer to the [corresponding section](https://deckhouse.io/modules/user-authz/faq.html#replacing-a-capability) in the `user-authz` module FAQ.
        * Otherwise remove the `rbac.deckhouse.io/aggregate-to-*-as` labels from it.

        List every such role:

        ```bash
        d8 k get clusterroles -o json | jq -r '.items[] | select((.metadata.labels // {}) | to_entries | any(.key | startswith("rbac.deckhouse.io/aggregate-to-"))) | select((.metadata.labels.heritage // "") != "deckhouse") | select((.metadata.labels["rbac.deckhouse.io/kind"] // "") != "custom-capability") | .metadata.name'
        ```
