- name: d8.user-authz.release-duration
  rules:
  - alert: D8UserAuthzReleaseSlow
    expr: |
      (
        sum(increase(deckhouse_helm_operation_seconds_sum{module="user-authz", operation="upgrade"}[30m]))
        /
        sum(increase(deckhouse_helm_operation_seconds_count{module="user-authz", operation="upgrade"}[30m]))
      ) > 300
    for: 1m
    labels:
      severity_level: "5"
      tier: cluster
      d8_module: user-authz
      d8_component: user-authz
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_user_authz_malfunctioning: "D8UserAuthzMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_user_authz_malfunctioning: "D8UserAuthzMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The user-authz module release takes more than 5 minutes.
      description: |-
        Applying the `user-authz` Helm release took more than 5 minutes on average over the last 30 minutes. A release that does not finish within the module release timeout (20 minutes) fails, changes to ClusterAuthorizationRule and AuthorizationRule objects stop being applied and platform updates stall (the `D8DeckhouseCouldNotRunModule` alert fires in that case).

        The release no longer contains objects whose number depends on the number of rules or of custom roles: `user-authz-controller` owns the bindings and custom roles are granted through one aggregated role per access level. So the size of the release is no longer the usual cause, and two other explanations come first.

        If the cluster has just been updated to the release that moved the bindings to the controller, this is the one-time migration pass: the engine fetches every object of the previous manifest to see that it must be kept. It is proportional to the number of bindings, it happens once, and on clusters with more than about 5000 of them it can exceed the timeout — see the module FAQ on what to do about that.

        Otherwise the release is slow for a reason that has nothing to do with user-authz's own size: a slow API server, a stuck object with a finalizer, or the release engine itself. Check what the release is waiting on, and confirm the chart is the size it should be (about 85 objects plus the RBACv2 roles, independent of the number of rules):

        ```bash
        d8 s queue list
        d8 k -n d8-system logs deploy/deckhouse | grep '"module":"user-authz"'
        d8 k get clusterrolebindings -l heritage=deckhouse,module=user-authz --no-headers | wc -l
        ```

  - alert: D8UserAuthzRenderSlow
    expr: |
      (
        sum(increase(deckhouse_helm_operation_seconds_sum{module="user-authz", operation="template"}[30m]))
        /
        sum(increase(deckhouse_helm_operation_seconds_count{module="user-authz", operation="template"}[30m]))
      ) > 30
    for: 1m
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: user-authz
      d8_component: user-authz
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_user_authz_malfunctioning: "D8UserAuthzMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_user_authz_malfunctioning: "D8UserAuthzMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: Rendering the user-authz module templates takes more than 30 seconds.
      description: |-
        Rendering the templates of the `user-authz` module took more than 30 seconds on average over the last 30 minutes; normally it takes about a second.

        Render time used to grow with the number of ClusterAuthorizationRule objects, because the chart rendered a binding per rule and a copy of every rule into a ConfigMap. It no longer does: the bindings belong to `user-authz-controller` and both consumers read the rules from the API, so the chart is a fixed size. A render that is slow now is slow for a reason outside the module — the Deckhouse pod being starved of CPU is the common one.

        Check what the pod is getting and what the queue is doing:

        ```bash
        d8 k -n d8-system top pod -l app=deckhouse
        d8 s queue list
        d8 k -n d8-system logs deploy/deckhouse | grep '"module":"user-authz"'
        ```
