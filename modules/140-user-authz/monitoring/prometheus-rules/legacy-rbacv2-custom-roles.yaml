- name: d8.user-authz.rbacv2.legacy-custom-roles
  rules:
  # A custom ClusterRole whose aggregationRule selects capabilities by the rbac.deckhouse.io/kind:
  # manage|use label of the experimental role model, or by the aggregation label of a lineage that no
  # built-in role collects and no custom capability carries. The built-in capabilities no longer carry
  # these labels, so such a role aggregates none of their permissions, and custom roles get no
  # compatibility aliases.
  - alert: D8UserAuthzLegacyRBACv2CustomRoleFound
    expr: |
      max by (name) (d8_rbacv2_legacy_custom_role) > 0
    for: 15m
    labels:
      severity_level: "7"
      tier: cluster
      d8_module: user-authz
      d8_component: rbacv2
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_user_authz_legacy_rbacv2_custom_roles: "D8UserAuthzLegacyRBACv2CustomRoles,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_user_authz_legacy_rbacv2_custom_roles: "D8UserAuthzLegacyRBACv2CustomRoles,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The custom role `{{ $labels.name }}` has lost access it gave through the labels of an earlier role model.
      description: |-
        The ClusterRole `{{ $labels.name }}` has no `heritage: deckhouse` label and has an `aggregationRule` field, and one of the following holds:

        - A selector of its `aggregationRule` field requires the `rbac.deckhouse.io/kind: manage` or `use` label of the experimental role model. The built-in capabilities no longer carry these labels, so such a selector matches none of them. The Kubernetes aggregation controller keeps from it only the rules of the custom capabilities that still carry the old labels, and the subjects of the role have lost the other permissions it gave. Custom roles get no compatibility aliases.
        - The role has the `rbac.deckhouse.io/use-role` label without `rbac.deckhouse.io/scope: system` or `subsystem`. Deckhouse creates the RoleBinding objects for the subjects of a role in the namespaces of the modules only for roles with that scope, so it has deleted the ones it had created for this role, even if its selectors are already rewritten.
        - A selector of its `aggregationRule` field requires the aggregation label of a lineage that no built-in role collects, such as `rbac.deckhouse.io/aggregate-to-all-as` of the old scheme, the label of a subsystem the role model no longer has, or the label of a subsystem a module has left. The modules label their capabilities only with the lineages that the built-in roles collect, so such a selector matches none of the built-in capabilities either.
          A selector by a lineage that a custom capability carries is not counted, because it still gets the rules of that capability. A custom capability here is a ClusterRole without the `heritage: deckhouse` label and without an `aggregationRule` field. Neither is a selector by the lineage of the subsystem in the `rbac.deckhouse.io/subsystem` label of the role, because the custom capabilities of that subsystem carry it. Neither exception applies to the `all`, `deckhouse`, `infrastructure`, `kubernetes` and `networking` lineages, which do not count as custom ones. A compatibility alias of an old role, a ClusterRole with the `rbac.deckhouse.io/deprecated: "true"` label, does not count as a built-in role that collects a lineage, because it collects the lineage of an old subsystem only for the bindings to the old name.

        Repair the access in this order:

        1. Create a role of the new scheme next to this one. Give it the `d8:custom:` name prefix and the `rbac.deckhouse.io/kind: custom-role` label, and select the capabilities by the labels of the new scheme, without `rbac.deckhouse.io/kind`. Select the capabilities that a selector by a lineage no built-in role collects was meant for by their `rbac.deckhouse.io/capability` labels, or by `rbac.deckhouse.io/scope: system` and the `module` label of their module. If this role has the `rbac.deckhouse.io/use-role` label, keep the label on the new role and add `rbac.deckhouse.io/scope: subsystem` with `rbac.deckhouse.io/subsystem: <SUBSYSTEM>`, or `rbac.deckhouse.io/scope: system`, so that Deckhouse creates the RoleBinding objects in the namespaces of the modules again.
        1. Create capabilities of the new scheme in place of the custom capabilities of the old scheme that this role aggregates. The `D8UserAuthzForeignAggregationLabel` alert names them.
        1. For every RoleBinding and ClusterRoleBinding object to this role, create one with the same subjects to the new role. If this role has the `rbac.deckhouse.io/aggregate-to-all-as: <LEVEL>` label, what it extended depends on its kind label. With `rbac.deckhouse.io/kind: manage`, its permissions also reached the subjects of `d8:manage:all:<LEVEL>`. A custom role cannot be aggregated into `d8:system:<LEVEL>`, so bind the new role to those subjects with a ClusterRoleBinding. With `rbac.deckhouse.io/kind: use`, they reached the subjects of `d8:use:role:<LEVEL>` in every namespace, so move the permissions into a namespace capability with `rbac.deckhouse.io/aggregate-to-namespace-as: <LEVEL>`, which extends `d8:namespace:<LEVEL>`.
        1. Check the permissions of the subjects with `d8 k auth can-i <VERB> <RESOURCE> --as=<USER_NAME>`.
        1. Delete the old bindings, this role and the old capabilities.

        For the commands, refer to the [corresponding section](https://deckhouse.io/modules/user-authz/faq.html#how-do-i-migrate-custom-roles-to-the-new-scheme) in the `user-authz` module FAQ.

        List all such roles:

        ```bash
        d8 k get clusterroles -o json | jq -r '
          def lineages: [((.matchLabels // {}) | keys[]), (.matchExpressions[]? | select(.operator == "In" or .operator == "Exists") | .key)]
            | map(capture("^rbac\\.deckhouse\\.io/aggregate-to-(?<lineage>.+)-as$").lineage);
          ([.items[] | select(.metadata.labels.heritage == "deckhouse" and .metadata.labels["rbac.deckhouse.io/deprecated"] != "true")
                | .aggregationRule.clusterRoleSelectors[]? | lineages[]] + ["system", "namespace", "project"]) as $collected
          | ([.items[] | select(.metadata.labels.heritage != "deckhouse" and .aggregationRule == null) | (.metadata.labels // {}) | keys[]
                | capture("^rbac\\.deckhouse\\.io/aggregate-to-(?<lineage>.+)-as$").lineage]) as $carried
          | .items[]
          | select(.metadata.labels.heritage != "deckhouse" and .aggregationRule != null)
          | (.metadata.labels["rbac.deckhouse.io/subsystem"] // "") as $own
          | select(
              (
                ((.metadata.labels["rbac.deckhouse.io/use-role"] // "") != "")
                and (((.metadata.labels["rbac.deckhouse.io/scope"] // "") | IN("system", "subsystem")) | not)
              )
              or (
                [
                  .aggregationRule.clusterRoleSelectors[]?
                  | (.matchLabels["rbac.deckhouse.io/kind"] // empty),
                    (.matchExpressions[]? | select(.key == "rbac.deckhouse.io/kind" and .operator == "In") | .values[])
                ]
                | any(IN("manage", "use"))
              )
              or (
                [
                  .aggregationRule.clusterRoleSelectors[]? | lineages[]
                  | select((IN($collected[]) | not)
                      and (IN("all", "deckhouse", "infrastructure", "kubernetes", "networking") or (. != $own and (IN($carried[]) | not))))
                ]
                | length > 0
              )
            )
          | .metadata.name'
        ```
