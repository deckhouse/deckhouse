linters-settings:
  no-cyrillic:
    exclude-rules:
      directories:
        # The RBACv2 templates carry the localized title and description of every role and
        # capability they ship. That is product text, not a source comment: the console shows it
        # to whoever is choosing what to grant, and `d8:namespace-capability:kubernetes:view_logs`
        # on its own tells that person nothing.
        - templates/rbacv2
        - templates/rbacv2-compat
  module:
    oss:
      disable: true
  container:
    exclude-rules:
      host-network-ports:
        - kind: DaemonSet
          name: user-authz-webhook
          container: webhook
      readiness-probe:
        - kind: DaemonSet
          name: user-authz-webhook
          container: webhook
  rbac:
    exclude-rules:
      placement:
        - kind: ClusterRole
          name: user-authz:user:custom
        - kind: ClusterRole
          name: user-authz:privileged-user:custom
        - kind: ClusterRole
          name: user-authz:editor:custom
        - kind: ClusterRole
          name: user-authz:admin:custom
        - kind: ClusterRole
          name: user-authz:cluster-editor:custom
        - kind: ClusterRole
          name: user-authz:cluster-admin:custom
        - kind: ClusterRole
          name: user-authz:cluster-editor
        - kind: ClusterRole
          name: user-authz:admin
        - kind: ClusterRole
          name: user-authz:super-admin
        - kind: ClusterRole
          name: user-authz:privileged-user
        - kind: ClusterRole
          name: user-authz:user
        - kind: ClusterRole
          name: user-authz:cluster-admin
        - kind: ClusterRole
          name: user-authz:scale
        - kind: ClusterRole
          name: user-authz:port-forward
        - kind: ClusterRole
          name: user-authz:editor
