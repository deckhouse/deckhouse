apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:system:manager
  annotations:
    en.meta.deckhouse.io/title: "System Manager"
    ru.meta.deckhouse.io/title: "Управление системой"
    en.meta.deckhouse.io/description: "Management of the Deckhouse platform configuration across all subsystems."
    ru.meta.deckhouse.io/description: "Управление конфигурацией платформы Deckhouse во всех подсистемах."
  labels:
    heritage: deckhouse
    module: user-authz
    rbac.deckhouse.io/use-role: admin
    rbac.deckhouse.io/kind: role
    rbac.deckhouse.io/scope: system
    # can-assign range of the identity-assign webhook: a system manager assigns basic access levels
    # up to ClusterAdmin and granular roles up to the manager level of any scope, but no superadmin
    # role, cluster-admin or SuperAdmin.
    user-authz.deckhouse.io/can-assign-basic-max: ClusterAdmin
    user-authz.deckhouse.io/can-assign-scope: system
    user-authz.deckhouse.io/can-assign-max-level: admin
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.deckhouse.io/aggregate-to-system-as: manager
