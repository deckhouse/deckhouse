apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:namespace:superadmin
  annotations:
    en.meta.deckhouse.io/title: "Namespace Superadmin"
    ru.meta.deckhouse.io/title: "Суперадминистратор пространства имён"
    en.meta.deckhouse.io/description: "Namespace Administrator plus minting ServiceAccount tokens and making requests on behalf of ServiceAccounts."
    ru.meta.deckhouse.io/description: "Права администратора плюс выпуск токенов ServiceAccount и запросы от их имени."
  labels:
    heritage: deckhouse
    module: user-authz
    rbac.deckhouse.io/delegatable: "true"
    rbac.deckhouse.io/kind: role
    rbac.deckhouse.io/scope: namespace
    rbac.deckhouse.io/aggregate-to-project-as: superadmin
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.deckhouse.io/aggregate-to-namespace-as: superadmin
