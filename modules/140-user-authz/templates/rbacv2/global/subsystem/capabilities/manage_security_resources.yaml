apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:subsystem-capability:security:manage_resources
  annotations:
    en.meta.deckhouse.io/title: "Security: manage cluster resources"
    ru.meta.deckhouse.io/title: "Безопасность: управление кластерными ресурсами"
    en.meta.deckhouse.io/description: "Manage cluster-scoped security resources."
    ru.meta.deckhouse.io/description: "Управление кластерными ресурсами безопасности."
  labels:
    heritage: deckhouse
    module: user-authz
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "subsystem-capability.security.manage_resources"
    rbac.deckhouse.io/scope: subsystem
    rbac.deckhouse.io/subsystem: security
    rbac.deckhouse.io/aggregate-to-cluster-as: manager
    rbac.deckhouse.io/aggregate-to-security-as: manager
rules:
  # Admission webhooks and policies are written at the superadmin level only
  # (manage_security_admission_resources.yaml): a mutating webhook can change any object the platform
  # creates, including its own pods, and a deleted webhook or policy switches off what it enforces,
  # such as the limits of what the managers assign.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
      - clusterroles
    verbs:
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - certificates.k8s.io
    resources:
      - certificatesigningrequests
    verbs:
      - create
      - delete
      - deletecollection
      - patch
      - update