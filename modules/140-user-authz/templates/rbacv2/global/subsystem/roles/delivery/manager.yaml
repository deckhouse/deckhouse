apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:subsystem:delivery:manager
  annotations:
    en.meta.deckhouse.io/title: "Delivery: Manager"
    ru.meta.deckhouse.io/title: "Управление подсистемы доставки"
    en.meta.deckhouse.io/description: "Management of the Delivery subsystem configuration."
    ru.meta.deckhouse.io/description: "Управление конфигурацией подсистемы доставки."
  labels:
    heritage: deckhouse
    module: user-authz
    rbac.deckhouse.io/use-role: admin
    rbac.deckhouse.io/kind: role
    rbac.deckhouse.io/scope: subsystem
    rbac.deckhouse.io/subsystem: delivery
    rbac.deckhouse.io/aggregate-to-delivery-as: superadmin
    rbac.deckhouse.io/aggregate-to-system-as: manager
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.deckhouse.io/aggregate-to-delivery-as: manager
