apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:subsystem:delivery:viewer
  annotations:
    en.meta.deckhouse.io/title: "Delivery: Viewer"
    ru.meta.deckhouse.io/title: "Просмотр подсистемы доставки"
    en.meta.deckhouse.io/description: "Read-only access to the Delivery subsystem configuration."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к конфигурации подсистемы доставки."
  labels:
    heritage: deckhouse
    module: user-authz
    rbac.deckhouse.io/use-role: viewer
    rbac.deckhouse.io/kind: role
    rbac.deckhouse.io/scope: subsystem
    rbac.deckhouse.io/subsystem: delivery
    rbac.deckhouse.io/aggregate-to-delivery-as: manager
    rbac.deckhouse.io/aggregate-to-system-as: viewer
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.deckhouse.io/aggregate-to-delivery-as: viewer
