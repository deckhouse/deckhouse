apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:subsystem:managed-services:viewer
  annotations:
    en.meta.deckhouse.io/title: "Managed Services: Viewer"
    ru.meta.deckhouse.io/title: "Просмотр подсистемы управляемых сервисов"
    en.meta.deckhouse.io/description: "Read-only access to the Managed Services subsystem configuration."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к конфигурации подсистемы управляемых сервисов."
  labels:
    heritage: deckhouse
    module: user-authz
    rbac.deckhouse.io/use-role: viewer
    rbac.deckhouse.io/kind: role
    rbac.deckhouse.io/scope: subsystem
    rbac.deckhouse.io/subsystem: managed-services
    rbac.deckhouse.io/aggregate-to-managed-services-as: manager
    rbac.deckhouse.io/aggregate-to-system-as: viewer
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.deckhouse.io/aggregate-to-managed-services-as: viewer
      matchExpressions:
        - key: rbac.deckhouse.io/kind
          operator: NotIn
          values:
            - use
