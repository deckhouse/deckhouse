apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:subsystem:managed-services:superadmin
  annotations:
    en.meta.deckhouse.io/title: "Managed Services: Superadmin"
    ru.meta.deckhouse.io/title: "Суперадминистратор подсистемы управляемых сервисов"
    en.meta.deckhouse.io/description: "Full control over the Managed Services subsystem, including its system resources."
    ru.meta.deckhouse.io/description: "Полный контроль над подсистемой управляемых сервисов, включая её системные ресурсы."
  labels:
    heritage: deckhouse
    module: user-authz
    rbac.deckhouse.io/use-role: superadmin
    rbac.deckhouse.io/kind: role
    rbac.deckhouse.io/scope: subsystem
    rbac.deckhouse.io/subsystem: managed-services
    rbac.deckhouse.io/aggregate-to-system-as: superadmin
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.deckhouse.io/aggregate-to-managed-services-as: superadmin
      matchExpressions:
        - key: rbac.deckhouse.io/kind
          operator: NotIn
          values:
            - use
