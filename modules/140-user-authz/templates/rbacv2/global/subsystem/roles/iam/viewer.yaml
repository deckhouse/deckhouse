apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:subsystem:iam:viewer
  annotations:
    en.meta.deckhouse.io/title: "IAM: Viewer"
    ru.meta.deckhouse.io/title: "Просмотр подсистемы IAM"
    en.meta.deckhouse.io/description: "Read-only access to the IAM subsystem configuration."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к конфигурации подсистемы IAM."
  labels:
    heritage: deckhouse
    module: user-authz
    rbac.deckhouse.io/use-role: viewer
    rbac.deckhouse.io/kind: role
    rbac.deckhouse.io/scope: subsystem
    rbac.deckhouse.io/subsystem: iam
    rbac.deckhouse.io/aggregate-to-iam-as: manager
    rbac.deckhouse.io/aggregate-to-system-as: viewer
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.deckhouse.io/aggregate-to-iam-as: viewer
      matchExpressions:
        - key: rbac.deckhouse.io/kind
          operator: NotIn
          values:
            - use
