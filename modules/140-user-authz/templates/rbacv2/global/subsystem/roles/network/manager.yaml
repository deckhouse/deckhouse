apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:subsystem:network:manager
  annotations:
    en.meta.deckhouse.io/title: "Network: Manager"
    ru.meta.deckhouse.io/title: "Управление подсистемы сети"
    en.meta.deckhouse.io/description: "Management of the Network subsystem configuration."
    ru.meta.deckhouse.io/description: "Управление конфигурацией подсистемы сети."
  labels:
    heritage: deckhouse
    module: user-authz
    rbac.deckhouse.io/use-role: admin
    rbac.deckhouse.io/kind: role
    rbac.deckhouse.io/scope: subsystem
    rbac.deckhouse.io/subsystem: network
    rbac.deckhouse.io/aggregate-to-network-as: superadmin
    rbac.deckhouse.io/aggregate-to-system-as: manager
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.deckhouse.io/aggregate-to-network-as: manager
      matchExpressions:
        - key: rbac.deckhouse.io/kind
          operator: NotIn
          values:
            - use
