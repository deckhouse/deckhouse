apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:subsystem:network:superadmin
  annotations:
    en.meta.deckhouse.io/title: "Network: Superadmin"
    ru.meta.deckhouse.io/title: "Суперадминистратор подсистемы сети"
    en.meta.deckhouse.io/description: "Full control over the Network subsystem, including its system resources."
    ru.meta.deckhouse.io/description: "Полный контроль над подсистемой сети, включая её системные ресурсы."
  labels:
    heritage: deckhouse
    module: user-authz
    rbac.deckhouse.io/use-role: superadmin
    rbac.deckhouse.io/kind: role
    rbac.deckhouse.io/scope: subsystem
    rbac.deckhouse.io/subsystem: network
    rbac.deckhouse.io/aggregate-to-system-as: superadmin
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.deckhouse.io/aggregate-to-network-as: superadmin
      matchExpressions:
        - key: rbac.deckhouse.io/kind
          operator: NotIn
          values:
            - use
