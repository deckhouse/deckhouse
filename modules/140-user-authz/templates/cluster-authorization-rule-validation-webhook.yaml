---
apiVersion: deckhouse.io/v1alpha1
kind: ValidationWebhook
metadata:
  name: user-authz-cluster-authorization-rule
  {{- include "helm_lib_module_labels" (list . (dict "app" "webhook-handler")) | nindent 2 }}
validationObject:
  name: cluster-authorization-rules.deckhouse.io
  group: main
  rules:
  - apiGroups:   ["deckhouse.io"]
    apiVersions: ["*"]
    operations:  ["CREATE", "UPDATE"]
    resources:   ["clusterauthorizationrules"]
    scope:       "Cluster"
handler:
  # The code of the hook is webhooks/validating/cluster_authorization_rule.py, where its unit tests import it.
  python: |
    {{- (required "webhooks/validating/cluster_authorization_rule.py is missing" (.Files.Get "webhooks/validating/cluster_authorization_rule.py")) | nindent 4 }}
