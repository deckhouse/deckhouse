---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-authz-controller")) | nindent 2 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:user-authz:controller
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-authz-controller")) | nindent 2 }}
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - clusterauthorizationrules
  - authorizationrules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - deckhouse.io
  resources:
  - clusterauthorizationrules/status
  - authorizationrules/status
  verbs:
  - get
  - update
  - patch
# ownerReferences with blockOwnerDeletion=true on the bindings require the finalizers permission
# on the owner (OwnerReferencesPermissionEnforcement admission plugin).
- apiGroups:
  - deckhouse.io
  resources:
  - clusterauthorizationrules/finalizers
  - authorizationrules/finalizers
  verbs:
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  - rolebindings
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# A binding may reference any ClusterRole named in a rule (the access-level roles, the aggregated
# custom roles, additionalRoles), so the controller needs the `bind` verb without a name restriction.
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  verbs:
  - get
  - list
  - watch
  - bind
# The controller-runtime event recorder writes events.k8s.io/v1 Events.
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
# Leader election lease in the module namespace.
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:user-authz:controller
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-authz-controller")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: d8:user-authz:controller
subjects:
- kind: ServiceAccount
  name: controller
  namespace: d8-{{ .Chart.Name }}
