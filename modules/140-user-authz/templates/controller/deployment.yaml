{{- define "user_authz_controller_resources" }}
cpu: 20m
memory: 50Mi
{{- end }}

{{- if (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: user-authz-controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-authz-controller")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: user-authz-controller
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
    - containerName: "user-authz-controller"
      minAllowed:
        {{- include "user_authz_controller_resources" . | nindent 8 }}
      maxAllowed:
        cpu: 1000m
        memory: 1Gi
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-authz-controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-authz-controller")) | nindent 2 }}
spec:
  {{- include "helm_lib_deployment_strategy_and_replicas_for_ha" . | nindent 2 }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: user-authz-controller
  template:
    metadata:
      labels:
        app: user-authz-controller
    spec:
      {{- include "helm_lib_node_selector" (tuple . "system") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple . "system") | nindent 6 }}
      {{- include "helm_lib_priority_class" (tuple . "system-cluster-critical") | nindent 6 }}
      {{- include "helm_lib_pod_anti_affinity_for_ha" (list . (dict "app" "user-authz-controller")) | nindent 6 }}
      {{- include "helm_lib_module_pod_security_context_run_as_user_deckhouse" . | nindent 6 }}
      automountServiceAccountToken: true
      imagePullSecrets:
      - name: deckhouse-registry
      terminationGracePeriodSeconds: 60
      serviceAccountName: controller
      containers:
      - name: user-authz-controller
        {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 8 }}
        image: {{ include "helm_lib_module_image" (list . "userAuthzController") }}
        imagePullPolicy: 'IfNotPresent'
        env:
        - name: HA_MODE
{{- if (include "helm_lib_ha_enabled" .) }}
          value: "true"
{{- else }}
          value: "false"
{{- end }}
        # Reconcile workers and the API client rate limit. The defaults are sized for the initial
        # adoption of tens of thousands of bindings; they are exposed here so that they can be
        # tuned without rebuilding the image.
        - name: MAX_CONCURRENT_RECONCILES
          value: "8"
        - name: KUBE_CLIENT_QPS
          value: "100"
        - name: KUBE_CLIENT_BURST
          value: "200"
        ports:
        - containerPort: 9090
          name: healthz
          protocol: TCP
        - containerPort: 9091
          name: metrics
          protocol: TCP
        startupProbe:
          httpGet:
            path: /healthz
            port: 9090
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9090
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 12 }}
{{- if not (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- include "user_authz_controller_resources" . | nindent 12 }}
{{- end }}
