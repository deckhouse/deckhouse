---
apiVersion: deckhouse.io/v1alpha1
kind: ValidationWebhook
metadata:
  name: user-authz-multitenancy-car
  {{- include "helm_lib_module_labels" (list . (dict "app" "webhook-handler")) | nindent 2 }}
validationObject:
  name: d8-user-authz-car-multitenancy-related-options.deckhouse.io
  rules:
  - apiGroups:   ["deckhouse.io"]
    apiVersions: ["*"]
    operations:  ["CREATE", "UPDATE"]
    resources:   ["clusterauthorizationrules"]
    scope:       "Cluster"
context:
  - name: d8-user-authz-multitenancy-state
    kubernetes:
      apiVersion: v1
      kind: ConfigMap
      jqFilter: |
        {
          "enableMultiTenancy": (.data.enableMultiTenancy == "true")
        }
      namespace:
        nameSelector:
          matchNames:
          - d8-user-authz
      nameSelector:
        matchNames:
        - d8-user-authz-multitenancy-state
handler:
  # The code of the hook is webhooks/validating/multitenancy.py, where its unit tests import it.
  python: |
    {{- (required "webhooks/validating/multitenancy.py is missing" (.Files.Get "webhooks/validating/multitenancy.py")) | nindent 4 }}
