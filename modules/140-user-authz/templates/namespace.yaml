{{- define "labels" }}
extended-monitoring.deckhouse.io/enabled: ""
prometheus.deckhouse.io/rules-watcher-enabled: "true"
security.deckhouse.io/pod-policy: "restricted"
security.deckhouse.io/enable-security-policy-check: "true"
{{- end }}
---
# Unconditional: the namespace holds user-authz-controller, which reconciles rule
# bindings whether or not MultiTenancy is on. Gating it on enableMultiTenancy left the
# release unable to converge — the controller's Deployment, PDB, ServiceAccount and VPA
# are rendered unconditionally, and server-side apply refused them with
# `namespaces "d8-user-authz" not found`.
apiVersion: v1
kind: Namespace
metadata:
  name: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (fromYaml (include "labels" .))) | nindent 2 }}
---
# Mirrors userAuthz.enableMultiTenancy (already merged with the edition's config-schema
# default) into a real Kubernetes object, because the multitenancy.py and
# identity_privilege.py validating webhooks cannot read module Values, only Kubernetes
# objects. It is rendered whether or not MultiTenancy is on and says "true" or "false",
# so identity_privilege.py can tell "off" from a ConfigMap that is not there yet and
# take the strict side for the latter. It changes in the same Helm apply as the rest of
# the multitenancy objects, with no separate hook or bootstrap ordering to get wrong.
apiVersion: v1
kind: ConfigMap
metadata:
  name: d8-user-authz-multitenancy-state
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
data:
  enableMultiTenancy: {{ if .Values.userAuthz.enableMultiTenancy }}"true"{{ else }}"false"{{ end }}
{{- if .Values.userAuthz.enableMultiTenancy }}
---
{{- include "helm_lib_kube_rbac_proxy_ca_certificate" (list . (printf "d8-%s"  .Chart.Name)) }}
{{- end }}
