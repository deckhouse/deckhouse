---
apiVersion: deckhouse.io/v1alpha1
kind: ValidationWebhook
metadata:
  name: user-authz-system-resources-edit
  {{- include "helm_lib_module_labels" (list . (dict "app" "webhook-handler")) | nindent 2 }}
validationObject:
  name: rbacv2-system-resource-edit.deckhouse.io
  group: main
  # The same bypass as BYPASS_GROUPS, PRIVILEGED_USERS and PRIVILEGED_USER_PREFIXES of
  # webhooks/validating/system_resources.py,
  # expressed for the apiserver instead of the hook body. Both webhooks are fail-closed, and the exec
  # one matches CONNECT on every pod in the cluster: the target pod's marker lives on the Pod, while the
  # reviewed object is a PodExecOptions, so no CEL expression can pre-filter it the way
  # `only-marked-objects` filters the edit webhook. With the bypass evaluated only inside the hook, an
  # unavailable webhook-handler would block exec cluster-wide, including exec into the webhook-handler
  # pod needed to diagnose it. The hook keeps its own check: matchConditions are a pre-filter, not the
  # authority. One condition per identity, in the plain form the Kubernetes admission documentation
  # guarantees: a CEL expression that fails to compile invalidates the whole
  # ValidatingWebhookConfiguration. The template tests keep the list in step with the hook.
  matchConditions:
  - name: exclude-kube-apiserver
    expression: '"system:apiserver" != request.userInfo.username'
  - name: exclude-deckhouse
    expression: '"system:serviceaccount:d8-system:deckhouse" != request.userInfo.username'
  - name: exclude-aggregation-controller
    expression: '"system:serviceaccount:kube-system:clusterrole-aggregation-controller" != request.userInfo.username'
  - name: exclude-multitenancy-manager
    expression: '"system:serviceaccount:d8-multitenancy-manager:multitenancy-manager" != request.userInfo.username'
  # Every module ServiceAccount, not only the named ones above. Same prefix as
  # PRIVILEGED_USER_PREFIXES and the platform ValidatingAdmissionPolicies.
  - name: exclude-d8-serviceaccounts
    expression: '!request.userInfo.username.startsWith("system:serviceaccount:d8-")'
  - name: exclude-group-kubeadm-cluster-admins
    expression: '!("kubeadm:cluster-admins" in request.userInfo.groups)'
  - name: exclude-group-superadmins
    expression: '!("superadmins" in request.userInfo.groups)'
  - name: exclude-group-system-masters
    expression: '!("system:masters" in request.userInfo.groups)'
  - name: exclude-group-system-nodes
    expression: '!("system:nodes" in request.userInfo.groups)'
  - name: exclude-group-system-serviceaccounts-d8-system
    expression: '!("system:serviceaccounts:d8-system" in request.userInfo.groups)'
  - name: exclude-group-system-serviceaccounts-kube-system
    expression: '!("system:serviceaccounts:kube-system" in request.userInfo.groups)'
  - name: exclude-group-system-sudousers
    expression: '!("system:sudousers" in request.userInfo.groups)'
  # Only forward requests for objects that actually carry the markings, so the (intentionally broad)
  # rule below does not put every namespaced CREATE/UPDATE/DELETE through the hook. On CREATE only the
  # new object exists, so this forwards exactly the creates that set a marking. The pod template of a
  # workload counts too (spec.template, and spec.jobTemplate.spec.template for a CronJob): the pods
  # are created by kube-system controllers, which bypass the hook. Guarded with has()/in to never
  # error (which would otherwise fail the request under a Fail matchConditions policy).
  # has() tests only its last field: has(object.spec.template.metadata.labels) still evaluates
  # object.spec, and on a ConfigMap (no spec) or a Pod (no spec.template) that read raises
  # "no such key". CEL does not absorb it — false || <error> is an error — and this webhook is
  # fail-closed, so the error would reject every namespaced write the exclusion conditions had
  # not already skipped. Each level is therefore tested on its own. && does not evaluate the
  # right-hand side after a false test. type() == map stops a CRD whose spec (or a field under
  # it) is a scalar before the next field is read. The pod-template labels field is checked the
  # same way: with x-kubernetes-preserve-unknown-fields it can be a string or a list, and `in` on
  # that value raises "no such overload". ObjectMeta.labels is always a map, so the object's own
  # labels are not type-checked.
  - name: only-marked-objects
    # In admission matchConditions the reviewed objects are TOP-LEVEL CEL variables `object`/`oldObject`
    # (the `request` variable is the AdmissionRequest metadata and has NO `.object`/`.oldObject`). Using
    # `request.object` makes the expression fail CEL compilation, which invalidates the WHOLE
    # ValidatingWebhookConfiguration and crash-loops the webhook-handler (fail-closed → every webhook on
    # the handler stops). `object` is null on DELETE / CONNECT; `oldObject` is null on CREATE — guarded.
    expression: >-
      (object != null && has(object.metadata.labels) && (
        ('deckhouse.io/system-resource' in object.metadata.labels && object.metadata.labels['deckhouse.io/system-resource'] == 'true')
        || ('heritage' in object.metadata.labels && object.metadata.labels['heritage'] == 'multitenancy-manager')
      )) || (object != null && has(object.spec) && type(object.spec) == map && has(object.spec.template) && type(object.spec.template) == map && has(object.spec.template.metadata) && type(object.spec.template.metadata) == map && has(object.spec.template.metadata.labels) && type(object.spec.template.metadata.labels) == map && (
        ('deckhouse.io/system-resource' in object.spec.template.metadata.labels && object.spec.template.metadata.labels['deckhouse.io/system-resource'] == 'true')
        || ('heritage' in object.spec.template.metadata.labels && object.spec.template.metadata.labels['heritage'] == 'multitenancy-manager')
      )) || (object != null && has(object.spec) && type(object.spec) == map && has(object.spec.jobTemplate) && type(object.spec.jobTemplate) == map && has(object.spec.jobTemplate.spec) && type(object.spec.jobTemplate.spec) == map && has(object.spec.jobTemplate.spec.template) && type(object.spec.jobTemplate.spec.template) == map && has(object.spec.jobTemplate.spec.template.metadata) && type(object.spec.jobTemplate.spec.template.metadata) == map && has(object.spec.jobTemplate.spec.template.metadata.labels) && type(object.spec.jobTemplate.spec.template.metadata.labels) == map && (
        ('deckhouse.io/system-resource' in object.spec.jobTemplate.spec.template.metadata.labels && object.spec.jobTemplate.spec.template.metadata.labels['deckhouse.io/system-resource'] == 'true')
        || ('heritage' in object.spec.jobTemplate.spec.template.metadata.labels && object.spec.jobTemplate.spec.template.metadata.labels['heritage'] == 'multitenancy-manager')
      )) || (oldObject != null && has(oldObject.metadata.labels) && (
        ('deckhouse.io/system-resource' in oldObject.metadata.labels && oldObject.metadata.labels['deckhouse.io/system-resource'] == 'true')
        || ('heritage' in oldObject.metadata.labels && oldObject.metadata.labels['heritage'] == 'multitenancy-manager')
      )) || (oldObject != null && has(oldObject.spec) && type(oldObject.spec) == map && has(oldObject.spec.template) && type(oldObject.spec.template) == map && has(oldObject.spec.template.metadata) && type(oldObject.spec.template.metadata) == map && has(oldObject.spec.template.metadata.labels) && type(oldObject.spec.template.metadata.labels) == map && (
        ('deckhouse.io/system-resource' in oldObject.spec.template.metadata.labels && oldObject.spec.template.metadata.labels['deckhouse.io/system-resource'] == 'true')
        || ('heritage' in oldObject.spec.template.metadata.labels && oldObject.spec.template.metadata.labels['heritage'] == 'multitenancy-manager')
      )) || (oldObject != null && has(oldObject.spec) && type(oldObject.spec) == map && has(oldObject.spec.jobTemplate) && type(oldObject.spec.jobTemplate) == map && has(oldObject.spec.jobTemplate.spec) && type(oldObject.spec.jobTemplate.spec) == map && has(oldObject.spec.jobTemplate.spec.template) && type(oldObject.spec.jobTemplate.spec.template) == map && has(oldObject.spec.jobTemplate.spec.template.metadata) && type(oldObject.spec.jobTemplate.spec.template.metadata) == map && has(oldObject.spec.jobTemplate.spec.template.metadata.labels) && type(oldObject.spec.jobTemplate.spec.template.metadata.labels) == map && (
        ('deckhouse.io/system-resource' in oldObject.spec.jobTemplate.spec.template.metadata.labels && oldObject.spec.jobTemplate.spec.template.metadata.labels['deckhouse.io/system-resource'] == 'true')
        || ('heritage' in oldObject.spec.jobTemplate.spec.template.metadata.labels && oldObject.spec.jobTemplate.spec.template.metadata.labels['heritage'] == 'multitenancy-manager')
      ))
  rules:
  # CREATE is here because the marking is not something a user may claim: an object created with it
  # would be locked against its own author and against the namespace admin. UPDATE covers adding and
  # removing the marking on an existing object. resources: ["*"] already includes the built-in
  # workload kinds whose pod templates are checked above.
  - apiGroups:   ["*"]
    apiVersions: ["*"]
    operations:  ["CREATE", "UPDATE", "DELETE"]
    resources:   ["*"]
    scope:       "Namespaced"
handler:
  # The code of the hook is webhooks/validating/system_resources.py, where its unit tests import it.
  python: |
    {{- (required "webhooks/validating/system_resources.py is missing" (.Files.Get "webhooks/validating/system_resources.py")) | nindent 4 }}
