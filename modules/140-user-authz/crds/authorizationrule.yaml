apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authorizationrules.deckhouse.io
  labels:
    heritage: deckhouse
    module: user-authz
    backup.deckhouse.io/cluster-config: "true"
spec:
  group: deckhouse.io
  scope: Namespaced
  names:
    plural: authorizationrules
    singular: authorizationrule
    kind: AuthorizationRule
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Access level
          type: string
          jsonPath: .spec.accessLevel
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Bindings
          type: integer
          jsonPath: .status.bindings
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: |
            Manages RBAC and authorization settings within a particular namespace.

            > The `AuthorizationRule` resource is used in the [current role-based model](./#current-role-based-model) and isn't used in the experimental role model.
          required:
          - spec
          properties:
            status:
              type: object
              description: |
                Observed state of the rule, maintained by user-authz-controller.
              properties:
                conditions:
                  type: array
                  description: |
                    Conditions of the rule. `Ready=True` means every binding of the rule is applied; `Ready=False`
                    with reason `InvalidSpec` means the rule cannot be rendered and no binding was changed, with reason `ApplyError` that the API server rejected a write (the message names the binding and the error).
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                bindings:
                  type: integer
                  format: int32
                  description: |
                    Number of bindings rendered for the rule.
                observedGeneration:
                  type: integer
                  format: int64
                  description: |
                    Generation of the rule the status refers to.
            spec:
              type: object
              required:
              - subjects
              properties:
                accessLevel:
                  type: string
                  description: |
                    Access level:
                    * `User` — has access to information about all objects (including viewing pod logs) but cannot exec into containers, read secrets, and perform port-forwarding;
                    * `PrivilegedUser` — the same as `User` + can exec into containers, read secrets, and delete pods (and thus, restart them);
                    * `Editor` — is the same as `PrivilegedUser` + can create and edit all objects that are usually required for application tasks;
                    * `Admin` — the same as `Editor` + can delete service objects (auxiliary resources such as `ReplicaSet`, `certmanager.k8s.io/challenges` and `certmanager.k8s.io/orders`);

                  enum: [User,PrivilegedUser,Editor,Admin]
                  x-doc-examples: ['PrivilegedUser']
                portForwarding:
                  type: boolean
                  default: false
                  description: |
                    Allow/disallow the user to do `port-forwarding`.
                allowScale:
                  type: boolean
                  default: false
                  description: |
                    Defines if scaling of Deployments and StatefulSets is allowed/not allowed.
                subjects:
                  type: array
                  description: |
                    Users and/or groups to grant privileges.

                    [Kubernetes API reference...](https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.23/#subject-v1-rbac-authorization-k8s-io)

                    Pay attention to the following nuances if this module is used together with the [user-authn](https://deckhouse.io/modules/user-authn/) module:
                    - Use the user's `email` as the username to grant privileges to the specific user;
                    - When specifying a group, make sure that the necessary groups are allowed to be received from the provider, i.e., they are defined in the corresponding custom resource [DexProvider](https://deckhouse.io/modules/user-authn/cr.html#dexprovider).
                  items:
                    type: object
                    required:
                    - kind
                    - name
                    properties:
                      kind:
                        type: string
                        enum: [User, Group, ServiceAccount]
                        description: 'Type of user identification resource.'
                        x-doc-examples: ['Group']
                      name:
                        type: string
                        minLength: 1
                        description: 'Resource name.'
                        x-doc-examples: ['some-group-name']
                      namespace:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: '[a-z0-9]([-a-z0-9]*[a-z0-9])?'
                        description: 'ServiceAccount namespace.'
