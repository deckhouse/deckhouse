spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Управляет настройками RBAC и авторизацией в пределах конкретного неймспейса.

            > Ресурс AuthorizationRule относится к [упрощённой ролевой модели](./#упрощённая-ролевая-модель). Его права суммируются с правами [гранулярной модели](./#гранулярная-ролевая-модель).
          properties:
            status:
              description: |
                Наблюдаемое состояние правила, поддерживается user-authz-controller.
              properties:
                conditions:
                  items:
                    properties:
                      type:
                        description: Тип условия. Контроллер устанавливает `Ready`.
                      status:
                        description: Статус условия.
                      reason:
                        description: Причина статуса — `BindingsApplied`, `InvalidSpec` или `ApplyError`.
                      message:
                        description: Подробности статуса.
                      observedGeneration:
                        description: Поколение правила, к которому относится условие.
                      lastTransitionTime:
                        description: Время последнего изменения статуса условия.
                  description: |
                    Условия правила. `Ready=True` — все биндинги правила применены; `Ready=False` с причиной
                    `InvalidSpec` — правило нельзя отрендерить, биндинги не менялись; с причиной `ApplyError` — API-сервер отклонил запись (в сообщении указаны биндинг и ошибка).
                bindings:
                  description: |
                    Число биндингов, созданных для правила.
                observedGeneration:
                  description: |
                    Поколение правила, к которому относится статус.
            spec:
              properties:
                accessLevel:
                  description: |
                    Уровень доступа:
                    * `User` — позволяет получать информацию обо всех объектах (включая доступ к журналам подов), но не позволяет заходить в контейнеры, читать секреты и выполнять port-forward;
                    * `PrivilegedUser` — то же самое, что и `User`, но позволяет заходить в контейнеры, читать секреты, а также удалять поды (что обеспечивает возможность перезагрузки);
                    * `Editor` — то же самое, что и `PrivilegedUser`, но предоставляет возможность создавать, изменять и удалять все объекты, которые обычно нужны для прикладных задач;
                    * `Admin` — то же самое, что и `Editor`, но позволяет создавать и изменять поды, выпускать токены ServiceAccount'ов (`serviceaccounts/token`), управлять объектами `Role`, `RoleBinding` и `AuthorizationRule` и удалять служебные объекты (например, `ReplicaSet`, challenges и orders группы `acme.cert-manager.io`).

                portForwarding:
                  description: |
                    Разрешить/запретить выполнять `port-forward`.
                allowScale:
                  description: |
                    Разрешить/запретить масштабировать (выполнять scale) объекты Deployment и StatefulSet.
                subjects:
                  description: |
                    Пользователи, группы и ServiceAccount'ы, которым выдаётся уровень доступа.

                    [Описание в API Kubernetes](https://kubernetes.io/docs/reference/kubernetes-api/authorization-resources/role-binding-v1/#RoleBinding)

                    При использовании совместно с модулем [user-authn](/modules/user-authn/) обратите внимание на следующие нюансы:
                    - Для выдачи прав конкретному пользователю в качестве имени необходимо указывать его `email`.
                    - При указании группы убедитесь, что необходимые группы допускаются к получению от провайдера, то есть указаны в соответствующем кастомном ресурсе [DexProvider](/modules/user-authn/cr.html#dexprovider).
                  items:
                    properties:
                      kind:
                        description: 'Тип ресурса.'
                      name:
                        description: 'Имя ресурса.'
                      namespace:
                        description: 'Namespace для ServiceAccount.'
