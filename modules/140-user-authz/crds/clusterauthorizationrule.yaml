          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: |
            This object manages RBAC and namespace-based authorization.

            The settings determine which access level is assigned to the user and/or group.

            > The ClusterAuthorizationRule resource belongs to the [basic role-based model](./#basic-role-based-model). Its permissions add up with those of the [granular model](./#granular-role-based-model).
