apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterauthorizationrules.deckhouse.io
  labels:
    heritage: deckhouse
    module: user-authz
    backup.deckhouse.io/cluster-config: "true"
spec:
  group: deckhouse.io
  scope: Cluster
  names:
    plural: clusterauthorizationrules
    singular: clusterauthorizationrule
    kind: ClusterAuthorizationRule
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: false
      deprecated: true
      additionalPrinterColumns:
        - name: Access level
          type: string
          jsonPath: .spec.accessLevel
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Bindings
          type: integer
          jsonPath: .status.bindings
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: |
            This cluster-wide object manages RBAC and authorization.

            > The ClusterAuthorizationRule resource belongs to the [basic role-based model](./#basic-role-based-model). Its permissions add up with those of the [granular model](./#granular-role-based-model).
          required:
          - spec
          properties:
            status:
              type: object
              description: |
                Observed state of the rule, maintained by user-authz-controller.
              properties:
                conditions:
                  type: array
                  description: |
                    Conditions of the rule. `Ready=True` means every binding of the rule is applied; `Ready=False`
                    with reason `InvalidSpec` means the rule cannot be rendered and no binding was changed, with reason `ApplyError` that the API server rejected a write (the message names the binding and the error).
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                        description: Condition type. The controller sets `Ready`.
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: Condition status.
                      reason:
                        type: string
                        description: Reason of the status, `BindingsApplied`, `InvalidSpec` or `ApplyError`.
                      message:
                        type: string
                        description: Details of the status.
                      observedGeneration:
                        type: integer
                        format: int64
                        description: Generation of the rule that the condition refers to.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: Time of the last change of the condition status.
                bindings:
                  type: integer
                  format: int32
                  description: |
                    Number of bindings rendered for the rule.
                observedGeneration:
                  type: integer
                  format: int64
                  description: |
                    Generation of the rule the status refers to.
            spec:
              type: object
              required:
              - subjects
              properties:
                accessLevel:
                  type: string
                  description: |
                    Access level:
                    * `User` — has access to information about all objects (including viewing pod logs) but cannot exec into containers, read secrets, and perform port-forwarding;
                    * `PrivilegedUser` — the same as `User` + can exec into containers, read secrets, and delete pods (and thus, restart them);
                    * `Editor` — the same as `PrivilegedUser` + can create, edit, and delete the objects that are usually required for application tasks;
                    * `Admin` — the same as `Editor` + can create and modify pods, create ServiceAccount tokens (`serviceaccounts/token`), manage `Role`, `RoleBinding`, and `AuthorizationRule` objects, and delete auxiliary objects (for example, `ReplicaSet` and the challenges and orders of the `acme.cert-manager.io` group);
                    * `ClusterEditor` — the same as `Editor` + can manage a limited set of cluster-wide objects used in application tasks (`DaemonSet`, `StorageClass`, `CustomResourceDefinition`, `GatewayClass`, and the objects that modules add at this level, for example, `KeepalivedInstance`). This role is best suited for cluster operators.
                    * `ClusterAdmin` — the same as both `ClusterEditor` and `Admin` + can manage cluster-wide service objects (namespaces, quotas, `NetworkPolicy`, the proxy subresources of nodes, `ClusterAuthorizationRule`, `ClusterRole`, and `ClusterRoleBinding`). This role is best suited for cluster administrators.

                      **Warning.** `ClusterAdmin` can create ClusterAuthorizationRule objects only up to the `ClusterAdmin` level, and ClusterRoleBinding objects only to roles whose permissions it already holds.
                    * `SuperAdmin` — can perform any actions with any objects (note that `limitNamespaces` (see below) restrictions remain valid).
                  enum: [User,PrivilegedUser,Editor,Admin,ClusterEditor,ClusterAdmin,SuperAdmin]
                  x-doc-examples: ['PrivilegedUser']
                portForwarding:
                  type: boolean
                  default: false
                  description: |
                    Allow/disallow the user to do `port-forwarding`.
                allowScale:
                  type: boolean
                  default: false
                  description: |
                    Defines if scaling of Deployments and StatefulSets is allowed/not allowed.
                allowAccessToSystemNamespaces:
                  type: boolean
                  x-doc-deprecated: true
                  x-doc-d8Editions:
                    - be
                    - se
                    - se+
                    - ee
                    - cse-lite
                    - cse-pro
                  description: |
                    Allow access to system namespaces (`kube-*`, `d8-*`, `default`).

                    Requires the [enableMultiTenancy](configuration.html#parameters-enablemultitenancy) parameter. While it is disabled, a rule with this field is refused, and a rule that already has it is applied without its namespace limits, in every namespace of the cluster.

                    The namespace limits of the rule are enforced by the authorization webhook, so they do not apply to the subjects that the webhook does not check: control plane components, kubelets, and the ServiceAccounts of `kube-system` and of the namespaces whose names start with `d8-`. For them, the access level of the rule applies in every namespace.

                    Deprecated. Use the [namespaceSelector](cr.html#clusterauthorizationrule-v1-spec-namespaceselector) parameter (API version `v1` of the CR) instead.
                  x-doc-default: false
                limitNamespaces:
                  type: array
                  x-doc-deprecated: true
                  x-doc-d8Editions:
                    - be
                    - se
                    - se+
                    - ee
                    - cse-lite
                    - cse-pro
                  description: |
                    List of regex-patterns that define namespaces accessible by the user.

                    Each pattern must match the whole namespace name: `team` does not match `team-2`. A pattern that is not a valid RE2 regular expression is refused when the rule is written. If the check misses it, the pattern is ignored, the rule opens fewer namespaces, and the `D8UserAuthzWebhookRulesQuarantined` alert fires.

                    The decision making process:
                    * If the list is defined, then only its constituents are accessible.
                    * If the list is not defined, then all namespaces are accessible (except for the system ones, see the `allowAccessToSystemNamespaces` field).

                    Requires the [enableMultiTenancy](configuration.html#parameters-enablemultitenancy) parameter. While it is disabled, a rule with this field is refused, and a rule that already has it is applied without its namespace limits, in every namespace of the cluster.

                    The namespace limits of the rule are enforced by the authorization webhook, so they do not apply to the subjects that the webhook does not check: control plane components, kubelets, and the ServiceAccounts of `kube-system` and of the namespaces whose names start with `d8-`. For them, the access level of the rule applies in every namespace.

                    Deprecated. Use the [namespaceSelector](cr.html#clusterauthorizationrule-v1-spec-namespaceselector) parameter (API version `v1` of the CR) instead.
                  x-doc-examples: ['production-.*']
                  items:
                    type: string
                    minLength: 1
                subjects:
                  type: array
                  description: |
                    Users, groups, and ServiceAccounts to grant the access level to.

                    [Kubernetes API reference](https://kubernetes.io/docs/reference/kubernetes-api/authorization-resources/role-binding-v1/#RoleBinding)

                    Pay attention to the following nuances if this module is used together with the [user-authn](/modules/user-authn/) module:
                    - Use the user's `email` as the username to grant privileges to the specific user;
                    - When specifying a group, make sure that the necessary groups are allowed to be received from the provider, i.e., they are defined in the corresponding custom resource [DexProvider](/modules/user-authn/cr.html#dexprovider).
                  items:
                    type: object
                    required:
                    - kind
                    - name
                    properties:
                      kind:
                        type: string
                        enum: [User, Group, ServiceAccount]
                        description: 'Type of user identification resource.'
                        x-doc-examples: ['Group']
                      name:
                        type: string
                        minLength: 1
                        description: 'Resource name.'
                        x-doc-examples: ['some-group-name']
                      namespace:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: '[a-z0-9]([-a-z0-9]*[a-z0-9])?'
                        description: 'ServiceAccount namespace. The namespace limits of the rule do not apply to the ServiceAccounts of `kube-system` and of the namespaces whose names start with `d8-`: the authorization webhook does not check them.'
                additionalRoles:
                  type: array
                  description: |
                    Additional roles to bind for subjects.

                    Use the `accessLevel` parameter instead; this parameter is for exceptional cases.

                  x-doc-examples:
                  - - apiGroup: rbac.authorization.k8s.io
                      kind: ClusterRole
                      name: cluster-admin
                  items:
                    type: object
                    required:
                    - apiGroup
                    - kind
                    - name
                    properties:
                      apiGroup:
                        type: string
                        description: 'API group of the role. Only `rbac.authorization.k8s.io` is supported.'
                        x-doc-examples: ['rbac.authorization.k8s.io']
                        minLength: 1
                      kind:
                        type: string
                        description: 'Kind of the role.'
                        enum: [ClusterRole]
                        x-doc-examples: ['ClusterRole']
                      name:
                        type: string
                        description: 'Name of the role.'
                        minLength: 1
                        x-doc-examples: ['cluster-admin']
