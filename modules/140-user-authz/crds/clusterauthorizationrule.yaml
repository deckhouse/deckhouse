                  enum: [User,PrivilegedUser,Editor,Admin,ClusterEditor,ClusterAdmin,SuperAdmin]
                  x-doc-examples: ['PrivilegedUser']
                portForwarding:
                  type: boolean
                  default: false
                  description: |
