spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Cluster-wide-ресурс для управления настройками RBAC и авторизацией.

            > Ресурс ClusterAuthorizationRule относится к [упрощённой ролевой модели](./#упрощённая-ролевая-модель). Его права суммируются с правами [гранулярной модели](./#гранулярная-ролевая-модель).
          properties:
            status:
              description: |
                Наблюдаемое состояние правила, поддерживается user-authz-controller.
              properties:
                conditions:
                  items:
                    properties:
                      type:
                        description: Тип условия. Контроллер устанавливает `Ready`.
                      status:
                        description: Статус условия.
                      reason:
                        description: Причина статуса — `BindingsApplied`, `InvalidSpec` или `ApplyError`.
                      message:
                        description: Подробности статуса.
                      observedGeneration:
                        description: Поколение правила, к которому относится условие.
                      lastTransitionTime:
                        description: Время последнего изменения статуса условия.
                  description: |
                    Условия правила. `Ready=True` — все биндинги правила применены; `Ready=False` с причиной
                    `InvalidSpec` — правило нельзя отрендерить, биндинги не менялись; с причиной `ApplyError` — API-сервер отклонил запись (в сообщении указаны биндинг и ошибка).
                bindings:
                  description: |
                    Число биндингов, созданных для правила.
                observedGeneration:
                  description: |
                    Поколение правила, к которому относится статус.
            spec:
              properties:
                accessLevel:
                  description: |
                    Уровень доступа:
                    * `User` — позволяет получать информацию обо всех объектах (включая доступ к журналам подов), но не позволяет заходить в контейнеры, читать секреты и выполнять port-forward;
                    * `PrivilegedUser` — то же самое, что и `User`, но позволяет заходить в контейнеры, читать секреты, а также удалять поды (что обеспечивает возможность перезагрузки);
                    * `Editor` — то же самое, что и `PrivilegedUser`, но предоставляет возможность создавать, изменять и удалять все объекты, которые обычно нужны для прикладных задач;
                    * `Admin` — то же самое, что и `Editor`, но позволяет создавать и изменять поды, выпускать токены ServiceAccount'ов (`serviceaccounts/token`), управлять объектами `Role`, `RoleBinding` и `AuthorizationRule` и удалять служебные объекты (например, `ReplicaSet`, challenges и orders группы `acme.cert-manager.io`);
                    * `ClusterEditor` — то же самое, что и `Editor`, но позволяет управлять ограниченным набором cluster-wide-объектов для прикладных задач (`DaemonSet`, `StorageClass`, `CustomResourceDefinition`, `GatewayClass` и объекты, которые модули добавляют на этот уровень, например `KeepalivedInstance`). Роль для работы оператора кластера;
                    * `ClusterAdmin` — то же самое, что и `ClusterEditor` + `Admin`, но позволяет управлять служебными cluster-wide-объектами (неймспейсы, квоты, `NetworkPolicy`, подресурсы узлов для proxy, `ClusterAuthorizationRule`, `ClusterRole` и `ClusterRoleBinding`). Роль для работы администратора кластера.

                      **Внимание.** `ClusterAdmin` может создавать объекты ClusterAuthorizationRule с уровнем не выше `ClusterAdmin` и объекты ClusterRoleBinding только на роли, права которых у него уже есть.
                    * `SuperAdmin` — разрешены любые действия с любыми объектами, при этом ограничения `limitNamespaces` (см. ниже) продолжат работать.
                portForwarding:
                  description: |
                    Разрешить/запретить выполнять `port-forward`.
                allowScale:
                  description: |
                    Разрешить/запретить масштабировать (выполнять scale) объекты Deployment и StatefulSet.
                allowAccessToSystemNamespaces:
                  description: |
                    Разрешить пользователю доступ в системные неймспейсы (`kube-*`, `d8-*`, `default`, `antiopa`, `loghouse`).

                    Требует параметра [enableMultiTenancy](configuration.html#parameters-enablemultitenancy). Пока он выключен, правило с этим полем отклоняется, а правило, в котором поле уже задано, применяется без ограничений по неймспейсам — во всех неймспейсах кластера.

                    Ограничения правила по неймспейсам применяет вебхук авторизации, поэтому они не действуют на субъекты, которые вебхук не проверяет: компоненты control plane, kubelet и ServiceAccount'ы неймспейса `kube-system` и неймспейсов, имена которых начинаются с `d8-`. Для них уровень доступа правила действует во всех неймспейсах.

                    Параметр устарел, используйте вместо него параметр [namespaceSelector](cr.html#clusterauthorizationrule-v1-spec-namespaceselector) (версия `v1` ресурса).
                limitNamespaces:
                  description: |
                    Список разрешённых неймспейсов в формате регулярных выражений.

                    Каждый шаблон должен совпадать с именем неймспейса целиком: `team` не подходит для `team-2`. Шаблон, который не является корректным регулярным выражением RE2, отклоняется при записи правила. Если проверка его не распознала, шаблон игнорируется, правило открывает меньше неймспейсов и срабатывает алерт `D8UserAuthzWebhookRulesQuarantined`.

                    Политика:
                    * Если список указан, разрешаем доступ только по нему.
                    * Если список не указан, считаем, что разрешено всё, кроме системных неймспейсов (см. поле `allowAccessToSystemNamespaces`).

                    Требует параметра [enableMultiTenancy](configuration.html#parameters-enablemultitenancy). Пока он выключен, правило с этим полем отклоняется, а правило, в котором поле уже задано, применяется без ограничений по неймспейсам — во всех неймспейсах кластера.

                    Ограничения правила по неймспейсам применяет вебхук авторизации, поэтому они не действуют на субъекты, которые вебхук не проверяет: компоненты control plane, kubelet и ServiceAccount'ы неймспейса `kube-system` и неймспейсов, имена которых начинаются с `d8-`. Для них уровень доступа правила действует во всех неймспейсах.

                    Параметр устарел, используйте вместо него параметр [namespaceSelector](cr.html#clusterauthorizationrule-v1-spec-namespaceselector) (версия `v1` ресурса).
                subjects:
                  description: |
                    Пользователи, группы и ServiceAccount'ы, которым выдаётся уровень доступа.

                    [Описание в API Kubernetes](https://kubernetes.io/docs/reference/kubernetes-api/authorization-resources/role-binding-v1/#RoleBinding)

                    При использовании совместно с модулем [user-authn](/modules/user-authn/) обратите внимание на следующие нюансы:
                    - Для выдачи прав конкретному пользователю в качестве имени необходимо указывать его `email`.
                    - При указании группы убедитесь, что необходимые группы допускаются к получению от провайдера, то есть указаны в соответствующем кастомном ресурсе [DexProvider](/modules/user-authn/cr.html#dexprovider).
                  items:
                    properties:
                      kind:
                        description: 'Тип ресурса.'
                      name:
                        description: 'Имя ресурса.'
                      namespace:
                        description: "Неймспейс ServiceAccount. Ограничения правила по неймспейсам не действуют на ServiceAccount'ы неймспейса `kube-system` и неймспейсов, имена которых начинаются с `d8-`: их вебхук авторизации не проверяет."
                additionalRoles:
                  description: |
                    Дополнительные роли, которые необходимо выдать для заданных `subjects`.

                    Вместо него используйте параметр `accessLevel`: этот параметр — для исключительных случаев.
                  items:
                    properties:
                      apiGroup:
                        description: "API-группа роли. Поддерживается только `rbac.authorization.k8s.io`."
                      kind:
                        description: 'Kind роли.'
                      name:
                        description: 'Название роли.'
    - name: v1
      schema:
        openAPIV3Schema:
          description: |
            Управляет настройками RBAC и авторизацией по неймспейсам.

            Настройки определяют, какой уровень доступа назначен пользователю и/или группе.

            > Ресурс ClusterAuthorizationRule относится к [упрощённой ролевой модели](./#упрощённая-ролевая-модель). Его права суммируются с правами [гранулярной модели](./#гранулярная-ролевая-модель).
