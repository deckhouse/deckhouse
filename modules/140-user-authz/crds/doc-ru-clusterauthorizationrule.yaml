                    Параметр устарел, используйте вместо него параметр [namespaceSelector](#clusterauthorizationrule-v1-spec-namespaceselector).
                namespaceSelector:
                  description: |
                    Определяет доступные неймспейсы на основе значений, указанных в параметре `namespaceSelector.labelSelector`.

                    Если параметр `namespaceSelector` указан, значения параметров `limitNamespaces` и `allowAccessToSystemNamespaces` **игнорируются**. Таким образом, будут доступны либо все неймспейсы с лейблами, подпадающими под указанные в параметре `namespaceSelector.labelSelector` условия (включая системные неймспейсы), либо все неймспейсы (включая системные), если указан параметр `namespaceSelector.matchAny`.

                    Если параметр `namespaceSelector` не указан, набор доступных неймспейсов определяется значением параметров `limitNamespaces` и `allowAccessToSystemNamespaces`. Если не указан ни один из параметров `namespaceSelector`, `limitNamespaces` и `allowAccessToSystemNamespaces`, будут доступны все неймспейсы, за исключением системных (`kube-*`, `d8-*`, `default`, `antiopa`, `loghouse`).

                    Требует параметра [enableMultiTenancy](configuration.html#parameters-enablemultitenancy). Пока он выключен, правило с этим полем отклоняется, а правило, в котором поле уже задано, применяется без ограничений по неймспейсам — во всех неймспейсах кластера.

                    Ограничения правила по неймспейсам применяет вебхук авторизации, поэтому они не действуют на субъекты, которые вебхук не проверяет: компоненты control plane, kubelet и ServiceAccount'ы неймспейса `kube-system` и неймспейсов, имена которых начинаются с `d8-`. Для них уровень доступа правила действует во всех неймспейсах.
                  properties:
                    matchAny:
                      description: |
                        Разрешает доступ ко всем неймспейсам в кластере, включая системные.

                        Не может использоваться совместно с параметром `labelSelector`.

                        Так как с помощью параметра `labelSelector` можно предоставить доступ только к определённому перечню неймспейсов, параметр `matchAny` необходим в случаях, когда нужно предоставить доступ ко всем неймспейсам.
                    labelSelector:
                      description: |
                        Фильтр по лейблам неймспейсов.

                        Не может использоваться совместно с параметром `matchAny`.

                        Если указаны одновременно `matchExpressions` и `matchLabels`, учитываются оба фильтра (AND).
                        Если указано несколько условий `matchExpressions`, должны выполняться все.
                      properties:
                        matchExpressions:
                          description: Список фильтров на основе выражений.
                          items:
                            properties:
                              key:
                                description: Имя лейбла.
                              operator:
                                description: Оператор сравнения.
                              values:
                                description: Значение лейбла.
                        matchLabels:
                          description: Набор лейблов, которые должны быть у неймспейса.
                limitNamespaces:
                  description: |
                    Список разрешённых неймспейсов в формате регулярных выражений.

                    Каждый шаблон должен совпадать с именем неймспейса целиком: `team` не подходит для `team-2`. Шаблон, который не является корректным регулярным выражением RE2, отклоняется при записи правила. Если проверка его не распознала, шаблон игнорируется, правило открывает меньше неймспейсов и срабатывает алерт `D8UserAuthzWebhookRulesQuarantined`.

                    Политика:
                    * Если список указан, разрешаем доступ только по нему.
                    * Если список не указан, считаем, что разрешено всё, кроме системных неймспейсов (см. поле `allowAccessToSystemNamespaces`).

                    Требует параметра [enableMultiTenancy](configuration.html#parameters-enablemultitenancy). Пока он выключен, правило с этим полем отклоняется, а правило, в котором поле уже задано, применяется без ограничений по неймспейсам — во всех неймспейсах кластера.

                    Ограничения правила по неймспейсам применяет вебхук авторизации, поэтому они не действуют на субъекты, которые вебхук не проверяет: компоненты control plane, kubelet и ServiceAccount'ы неймспейса `kube-system` и неймспейсов, имена которых начинаются с `d8-`. Для них уровень доступа правила действует во всех неймспейсах.

                    Параметр устарел, используйте вместо него параметр [namespaceSelector](#clusterauthorizationrule-v1-spec-namespaceselector).
                subjects:
                  description: |
                    Пользователи, группы и ServiceAccount'ы, которым выдаётся уровень доступа.

                    [Описание в API Kubernetes](https://kubernetes.io/docs/reference/kubernetes-api/authorization-resources/role-binding-v1/#RoleBinding)

                    При использовании совместно с модулем [user-authn](/modules/user-authn/) обратите внимание на следующие нюансы:
                    - Для выдачи прав конкретному пользователю в качестве имени необходимо указывать его `email`.
                    - При указании группы убедитесь, что необходимые группы допускаются к получению от провайдера, то есть указаны в соответствующем кастомном ресурсе [DexProvider](/modules/user-authn/cr.html#dexprovider).
                  items:
                    properties:
                      kind:
                        description: 'Тип ресурса.'
                      name:
                        description: 'Имя ресурса.'
                      namespace:
                        description: "Неймспейс ServiceAccount. Ограничения правила по неймспейсам не действуют на ServiceAccount'ы неймспейса `kube-system` и неймспейсов, имена которых начинаются с `d8-`: их вебхук авторизации не проверяет."
                additionalRoles:
                  description: |
                    Дополнительные роли, которые необходимо выдать для заданных `subjects`.

                    Вместо него используйте параметр `accessLevel`: этот параметр — для исключительных случаев.
                  items:
                    properties:
                      apiGroup:
                        description: "API-группа роли. Поддерживается только `rbac.authorization.k8s.io`."
                      kind:
                        description: 'Kind роли.'
                      name:
                        description: 'Название роли.'
