                  description: |
                    Разрешить/запретить выполнять `port-forward`.
                allowScale:
                  description: |
                    Разрешить/запретить масштабировать (выполнять scale) объекты Deployment и StatefulSet.
                allowAccessToSystemNamespaces:
                  description: |
                    Разрешить пользователю доступ в системные неймспейсы (`kube-*`, `d8-*`, `default`, `antiopa`, `loghouse`).

                    Требует параметра [enableMultiTenancy](configuration.html#parameters-enablemultitenancy). Пока он выключен, правило с этим полем отклоняется, а правило, в котором поле уже задано, применяется без ограничений по неймспейсам — во всех неймспейсах кластера.

