                    `InvalidSpec` — правило нельзя отрендерить, биндинги не менялись; с причиной `ApplyError` — API-сервер отклонил запись (в сообщении указаны биндинг и ошибка).
                bindings:
                  description: |
                    Число биндингов, созданных для правила.
                observedGeneration:
                  description: |
                    Поколение правила, к которому относится статус.
