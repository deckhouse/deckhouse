---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-pm-artifact
  add: /relocate-pm
  to: /
  before: setup
imageSpec:
  config:
    entrypoint: ["/usr/sbin/pmacctd"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/src" }}
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
  - cd /src
  - git clone --depth 1 -b 1.7.9 $(cat /run/secrets/SOURCE_REPO)/pmacct/pmacct.git .
  - |
    cat > .gitmodules <<EOF
    [submodule "src/external_libs/libcdada"]
      path = src/external_libs/libcdada
      url = $(cat /run/secrets/SOURCE_REPO)/msune/libcdada.git
    EOF
  - git submodule update --init
  - rm -rf /src/.git
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
shell:
  beforeInstall:
  - pm install build-base autoconf automake libtool pkgconf libpcap-pwru-devel jansson-devel
  install:
  - cd /src
  - ./autogen.sh
  - ./configure --prefix=/usr --enable-jansson CFLAGS="-std=gnu17 -O2"
  - make
{{- include "pm_built_binaries_artifact" (dict
      "Images" $.Images
      "name" (printf "%s/%s-pm-artifact" $.ModuleName $.ImageName)
      "from" (printf "%s/%s-artifact" $.ModuleName $.ImageName)
      "packages" "libpcap-pwru jansson libstdc++"
      "binaries" "/src/src/pmacctd:/usr/sbin/pmacctd") }}
