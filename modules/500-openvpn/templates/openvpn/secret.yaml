{{- $moduleGateway := dict }}
{{- include "helm_lib_module_gateway" (list . $moduleGateway) }}
{{- $ingressEnabled := eq (include "helm_lib_module_ingress_enabled" .) "true" }}
{{- $gatewayEnabled := eq (include "helm_lib_module_gateway_enabled" .) "true" }}
{{- if and (not (.Values.global.enabledModules | has "user-authn")) (or $ingressEnabled $gatewayEnabled) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" .Chart.Name)) | nindent 2 }}
type: Opaque
data:
  auth: {{ print "admin:{PLAIN}" .Values.openvpn.internal.auth.password | b64enc | quote }}
{{- end }}
