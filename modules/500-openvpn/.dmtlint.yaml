linters-settings:
  no-cyrillic:
    exclude-rules:
      directories:
        # The RBACv2 templates carry the localized title and description of every role and
        # capability they ship. That is product text, not a source comment: the console shows it
        # to whoever is choosing what to grant, and `d8:namespace-capability:kubernetes:view_logs`
        # on its own tells that person nothing.
        - templates/rbacv2
  container:
    exclude-rules:
      read-only-root-filesystem:
        - kind: StatefulSet
          name: openvpn
          container: openvpn-tcp
      liveness-probe:
        - kind: StatefulSet
          name: openvpn
          container: openvpn-tcp
        - kind: StatefulSet
          name: openvpn
          container: ovpn-admin
      readiness-probe:
        - kind: StatefulSet
          name: openvpn
          container: openvpn-tcp
        - kind: StatefulSet
          name: openvpn
          container: ovpn-admin
  module:
    conversions:
      disable: true
