{{- define "simple_bridge_resources" }}
cpu: 25m
memory: 50Mi
{{- end }}

{{- if (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: simple-bridge
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "simple-bridge")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: DaemonSet
    name: simple-bridge
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
    - containerName: "simple-bridge"
      minAllowed:
        {{- include "simple_bridge_resources" . | nindent 8 }}
      maxAllowed:
        cpu: 50m
        memory: 50Mi
    - containerName: ipv4-options-guard
      minAllowed:
        cpu: 10m
        memory: 25Mi
      maxAllowed:
        cpu: 50m
        memory: 64Mi
    - containerName: ipv4-options-guard-kube-rbac-proxy
      minAllowed:
        {{- include "helm_lib_container_kube_rbac_proxy_resources" . | nindent 8 }}
      maxAllowed:
        cpu: 25m
        memory: 64Mi
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: simple-bridge
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list $ (dict "app" "simple-bridge")) | nindent 2 }}
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: simple-bridge
  template:
    metadata:
      annotations:
        {{ include "helm_lib_prevent_ds_eviction_annotation" . | nindent 8 }}
      labels:
        app: simple-bridge
        security.deckhouse.io/security-policy-exception: simple-bridge
    spec:
      imagePullSecrets:
      - name: deckhouse-registry
      {{- include "helm_lib_priority_class" (tuple . "system-node-critical") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple . "any-node" "with-uninitialized") | nindent 6 }}
      {{- include "helm_lib_module_pod_security_context_run_as_user_root" . | nindent 6 }}
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ .Chart.Name }}
      initContainers:
      - name: cni-migration-init-checker
        image: {{ include "helm_lib_module_image" (list $ "cniMigrationInitChecker" "common") }}
        {{- include "helm_lib_module_container_security_context_run_as_user_deckhouse_pss_restricted" . | nindent 8 }}
          readOnlyRootFilesystem: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CNI_NAME
          value: "simple-bridge"
        - name: KUBERNETES_SERVICE_HOST
          value: "127.0.0.1"
        - name: KUBERNETES_SERVICE_PORT
          value: "6445"
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" $ | nindent 12 }}
      {{ include "helm_lib_module_init_container_iptables_wrapper" . | nindent 6 }}
      containers:
      - name: simple-bridge
        image: {{ include "helm_lib_module_image" (list . "simpleBridge") }}
        {{- /*
          UID: 0 GID:0 using for privilege access for iptables because using hostNetwork
        */}}
        securityContext:
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: true
          capabilities:
            add:
            - NET_RAW
            - NET_ADMIN
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        command:
        - /bin/simple-bridge
        env:
        {{- if hasKey .Values.global "clusterConfiguration" }}
          {{- if .Values.global.clusterConfiguration.cloud }}
        - name: ROUTE_POD_NETWORK_TO_GW
          value: "{{ if eq .Values.global.clusterConfiguration.cloud.provider "Yandex" }}true{{ else }}false{{ end }}"
          {{- end }}
        {{- end }}
        - name: POD_SUBNET
          value: {{ .Values.global.discovery.podSubnet | quote }}
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: run
          mountPath: /run
        - name: cni
          mountPath: /etc/cni/net.d
        - name: tmp
          mountPath: /tmp
        - mountPath: /sbin
          name: sbin
          readOnly: true
        - mountPath: /sys/class/net
          name: net
          readOnly: true
        - name: xtables-lock
          mountPath: /run/xtables.lock
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_logs_with_extra" 10 | nindent 12 }}
{{- if not (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- include "simple_bridge_resources" . | nindent 12 }}
{{- end }}
      - name: ipv4-options-guard
        # CVE-2026-98432 mitigation, settings in templates/ipv4-options-guard/configmap.yaml.
        image: {{ include "helm_lib_module_common_image" (list . "ipv4OptionsGuard") }}
        args:
        - --settings=/etc/ipv4-options-guard/settings.json
        - --netns-dir=/run/netns
        - --listen=127.0.0.1:9741
        - --sbin=/sbin
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KUBERNETES_SERVICE_HOST
          value: "127.0.0.1"
        - name: KUBERNETES_SERVICE_PORT
          value: "6445"
        securityContext:
          # setns into pod netns and writes to their /proc/sys/net need a privileged container.
          privileged: true
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: ipv4-options-guard-settings
          mountPath: /etc/ipv4-options-guard
          readOnly: true
        - name: ipv4-options-guard-netns
          mountPath: /run/netns
          # Pod netns are bind-mounted by containerd after the sidecar has started.
          mountPropagation: HostToContainer
          readOnly: true
        - name: ipv4-options-guard-sysctl-d
          mountPath: /host/etc/sysctl.d
        - name: xtables-lock
          mountPath: /run/xtables.lock
        # iptables-wrapper populated by iptables-wrapper-init: the same legacy/nft decision as simple-bridge.
        - name: sbin
          mountPath: /sbin
        livenessProbe:
          httpGet:
            host: 127.0.0.1
            path: /healthz
            port: 9741
          periodSeconds: 30
        readinessProbe:
          # Always ok while the process serves: problems go to metrics, never to the agent pod readiness.
          httpGet:
            host: 127.0.0.1
            path: /healthz
            port: 9741
          periodSeconds: 30
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 12 }}
{{- if not (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            cpu: 10m
            memory: 25Mi
{{- end }}
        terminationMessagePolicy: FallbackToLogsOnError
      - name: ipv4-options-guard-kube-rbac-proxy
        {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 8 }}
        image: {{ include "helm_lib_module_common_image" (list . "kubeRbacProxy") }}
        args:
        - "--secure-listen-address=$(KUBE_RBAC_PROXY_LISTEN_ADDRESS):4261"
        - "--v=2"
        - "--logtostderr=true"
        - "--stale-cache-interval=1h30m"
        - "--livez-path=/livez"
        env:
        - name: KUBE_RBAC_PROXY_LISTEN_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: KUBE_RBAC_PROXY_CONFIG
          value: |
            upstreams:
            - upstream: http://127.0.0.1:9741/metrics
              path: /metrics
              authorization:
                resourceAttributes:
                  namespace: d8-{{ .Chart.Name }}
                  apiGroup: apps
                  apiVersion: v1
                  resource: daemonsets
                  subresource: prometheus-metrics
                  name: simple-bridge
        ports:
        - containerPort: 4261
          name: https-metrics
        livenessProbe:
          httpGet:
            path: /livez
            port: 4261
            scheme: HTTPS
        readinessProbe:
          httpGet:
            path: /livez
            port: 4261
            scheme: HTTPS
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 12 }}
{{- if not (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- include "helm_lib_container_kube_rbac_proxy_resources" . | nindent 12 }}
{{- end }}
      volumes:
      - name: run
        hostPath:
          path: /run
      - name: cni
        hostPath:
          path: /etc/cni/net.d
      - name: tmp
        emptyDir: {}
      - name: xtables-lock
        hostPath:
          path: /run/xtables.lock
          type: FileOrCreate
      - name: sbin
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      - name: net
        hostPath:
          path: /sys/class/net
      - name: ipv4-options-guard-settings
        configMap:
          name: ipv4-options-guard
      - name: ipv4-options-guard-sysctl-d
        hostPath:
          path: /etc/sysctl.d
          type: DirectoryOrCreate
      - name: ipv4-options-guard-netns
        hostPath:
          path: /run/netns
          type: DirectoryOrCreate
