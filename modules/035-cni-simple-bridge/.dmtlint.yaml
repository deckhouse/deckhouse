linters-settings:
  no-cyrillic:
    exclude-rules:
      directories:
        # The RBACv2 templates carry the localized title and description of every role and
        # capability they ship. That is product text, not a source comment: the console shows it
        # to whoever is choosing what to grant, and `d8:namespace-capability:kubernetes:view_logs`
        # on its own tells that person nothing.
        - templates/rbacv2
  module:
    oss:
      disable: true
    exclude-rules:
      license:
        files:
          - images/simple-bridge/src/rootfs/usr/bin/simple-bridge
  container:
    exclude-rules:
      read-only-root-filesystem:
        - kind: DaemonSet
          name: simple-bridge
          container: simple-bridge
      liveness-probe:
        - kind: DaemonSet
          name: simple-bridge
          container: simple-bridge
      readiness-probe:
        - kind: DaemonSet
          name: simple-bridge
          container: simple-bridge
  templates:
    exclude-rules:
      pdb:
        - kind: DaemonSet
          name: simple-bridge
