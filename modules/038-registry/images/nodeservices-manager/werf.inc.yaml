{{ $appRelPath := printf "/%s/modules/038-%s/images/%s/app" $.ModulePath $.ModuleName $.ImageName }}
{{ $appAbsPath := printf "/deckhouse/modules/038-%s/images/%s/app" $.ModuleName $.ImageName }}
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
fromImage: common/src-artifact
final: false
git:
  - add: {{ $appRelPath }}
    to:  /src{{ $appAbsPath }}
    stageDependencies:
      install:
        - '**/*'
  - add: /{{ $.ModulePath }}/go_lib/registry
    to: /src/deckhouse/go_lib/registry
    stageDependencies:
      install:
        - '**/*'
shell:
  install:
  - cd /src
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
from: {{ index $.Images "builder/golang" }}
final: false
import:
  - image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
    add: /src/deckhouse
    to: /deckhouse
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
  - id: GOPROXY
    value: "{{ $.GOPROXY }}"
shell:
  install:
    - export GOPROXY=$(cat /run/secrets/GOPROXY)
    - cd {{ $appAbsPath }}
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go test ./...
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o /manager ./cmd/staticpod
    - chown 64535:64535 /manager
    - chmod 0755 /manager
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}"
fromImage: common/distroless
import:
- image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
  add: /manager
  to: /manager
  before: setup
- image: common/pause
  add: /pause
  to: /pause
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/manager"]
{{- if eq (env "FUZZ_BUILD_ENABLED" "false") "true" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-fuzz
from: registry.flant.com/deckhouse/ssdlc/ci-images/fuzz-go:34fdc16d905326c2fd7097363059baa398c9a1c0
fromLatest: true
final: false
import:
  - image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /src/deckhouse
    to: /deckhouse
    before: install
git:
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/Taskfile.fuzz.yml
    to: {{ $appAbsPath }}/Taskfile.yml
    stageDependencies:
      install:
        - Taskfile.fuzz.yml
secrets:
  - id: GOPROXY
    value: {{ $.GOPROXY }}
shell:
  install:
    - cd {{ $appAbsPath }}
    - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
    - rm -rf test/e2e tests/e2e tests/ginkgo
    - chmod -R a+rwX /deckhouse /fuzz/gomod
imageSpec:
  config:
    workingDir: {{ $appAbsPath }}
    labels:
      io.deckhouse.fuzz.engine: go
    env:
      FUZZ_WORKDIR: {{ $appAbsPath }}
      FUZZ_PACKAGES: "./internal/staticpod"
      CGO_ENABLED: "0"
{{- end }}
