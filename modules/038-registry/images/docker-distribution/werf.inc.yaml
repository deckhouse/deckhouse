---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
fromImage: common/src-artifact
final: false
# The registry itself is `github.com/distribution/distribution/v3`, resolved through GOPROXY like every
# other dependency of this repository. What is built here is the wrapper around it — under `wrapper/`,
# about a thousand lines — and that is the whole of what this module adds to the upstream registry.
#
# It used to be the upstream project copied into this repository: 205 files, based on a release upstream
# stopped maintaining after v3.0.0, carrying nine patches and every security bump they implied. Four of
# those patches turned out to be upstream options by now (`proxy.ttl: 0` for a cache that never expires,
# `autoredirect` with `autoredirectpath` for the token challenge, `http.tls.clientauth` for client
# certificates), one described a deletion upstream does not perform, and the rest are the wrapper: the
# mapping of repository paths done in front of the cache, the token request forwarded to the service on
# the loopback, the trust decision about a forwarded client address, and the listener that accepts a
# push.
git:
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
    to: /src/scripts
    stageDependencies:
      install:
        - '**/*'
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/wrapper
    to: /src/distribution
    stageDependencies:
      install:
        - '**/*'
shell:
  install:
    - mkdir -m 1777 /src/tmp
    - chmod +x /src/scripts/*
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
from: {{ index $.Images "builder/golang" }}
final: false
import:
  - image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
    add: /src/distribution
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
  - id: GOPROXY
    value: "{{ $.GOPROXY }}"
shell:
  install:
    - export GOPROXY=$(cat /run/secrets/GOPROXY)
    - export GOOS=linux
    - export GOARCH=amd64
    - export CGO_ENABLED=0
    - cd /src/distribution
    # Named `registry`, because the image's entrypoint and the syncer both call it that: `registry
    # serve <config>` and `registry garbage-collect <config>` are the two commands, unchanged from
    # when this was the upstream binary itself.
    - go build -ldflags="-s -w" -o /registry .
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}"
fromImage: common/distroless
import:
- image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
  add: /src/scripts
  to: /
  includePaths:
  - install
  - uninstall
  before: setup
- image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
  add: /src/tmp
  to: /tmp
  before: setup
- image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
  add: /registry
  to: /registry
  before: setup
- image: common/pause
  add: /pause
  to: /pause
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/registry"]
    cmd: ["serve", "/config/config.yaml"]
---
# Fuzz the legacy fork's deckhouse branch independently of the v3 wrapper above.
image: {{ $.ModuleName }}/{{ $.ImageName }}-fuzz
from: registry.flant.com/deckhouse/ssdlc/ci-images/fuzz-go:34fdc16d905326c2fd7097363059baa398c9a1c0
fromLatest: true
final: false
git:
  - url: {{ $.SOURCE_REPO }}/deckhouse/3p-distribution.git
    branch: deckhouse
    add: /
    to: /src/distribution
    stageDependencies:
      install:
        - '**/*'
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/Taskfile.fuzz.yml
    to: /src/distribution/Taskfile.yml
    stageDependencies:
      install:
        - Taskfile.fuzz.yml
secrets:
  - id: GOPROXY
    value: {{ $.GOPROXY }}
shell:
  install:
    - cd /src/distribution
    - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
    - rm -rf test/e2e tests/e2e tests/ginkgo
    - chmod -R a+rwX /src/distribution /fuzz/gomod
imageSpec:
  config:
    workingDir: /src/distribution
    labels:
      io.deckhouse.fuzz.engine: go
    env:
      FUZZ_WORKDIR: /src/distribution
      FUZZ_PACKAGES: ". ./registry ./registry/handlers ./registry/proxy"
      CGO_ENABLED: "0"
