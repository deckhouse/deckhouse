{{- $version := "flant-1.1.0"}}
{{- $repo := "deckhouse/cluster-and-infrastructure/fork/distribution.git" }}
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
fromImage: common/src-artifact
final: false
git:
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
    to: /src/scripts
    stageDependencies:
      install:
        - '**/*'
secrets:
  - id: CI_JOB_TOKEN
    env: CI_JOB_TOKEN
shell:
  install:
    - mkdir -m 1777 /src/tmp
    - chmod +x /src/scripts/*
    - git config --global advice.detachedHead false
    - git clone --depth 1 --single-branch --branch {{ $version }} https://gitlab-ci-token:$(cat /run/secrets/CI_JOB_TOKEN)@fox.flant.com/{{ $repo }} /src/distribution
    - rm -rf /src/distribution/.git
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
from: {{ index $.Images "builder/golang" }}
final: false
import:
  - image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
    add: /src/distribution
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
  - id: GOPROXY
    value: "{{ $.GOPROXY }}"
shell:
  install:
    - export GOPROXY=$(cat /run/secrets/GOPROXY)
    - export GOOS=linux
    - export GOARCH=amd64
    - export CGO_ENABLED=0
    - cd /src/distribution
    - |
      {{- $buildContext := deepCopy $ -}}
      {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
      {{- $_ := set $buildContext "BuildCommand" `make build binaries` -}}
      {{- include "image-build.build" $buildContext | indent 6 }}
    - chmod +x ./registry
    - mv ./bin/registry /registry
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}"
fromImage: common/distroless
import:
- image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
  add: /src/scripts
  to: /
  includePaths:
  - install
  - uninstall
  before: setup
- image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
  add: /src/tmp
  to: /tmp
  before: setup
- image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
  add: /registry
  to: /registry
  before: setup
- image: common/pause
  add: /pause
  to: /pause
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/registry"]
    cmd: ["serve", "/config/config.yaml"]
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
