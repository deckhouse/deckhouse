{{- $version := "v2.8.3-deckhouse.5"}}
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
fromImage: common/src-artifact
final: false
# The source lives in this repository now, under `src/`, rather than being cloned from a fork and patched
# at build time.
#
# What that clone cost: two changes carried as build steps rather than as code — `patches/*.patch`, whose
# context had to match the fork byte for byte (including a Cyrillic letter in a typo upstream, which this
# repository's own validation then refused), and `no-proxy-expiry.sh`, which rewrote two methods with awk
# and left their bodies unreachable behind an early return. Both are ordinary source edits here, readable
# and reviewable, and the fork is no longer a dependency of the build.
#
# `vendor/` is not carried: this module's other images build from `go.mod` with GOPROXY, and one style is
# better than two.
git:
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
    to: /src/scripts
    stageDependencies:
      install:
        - '**/*'
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
    to: /src/distribution
    stageDependencies:
      install:
        - '**/*'
shell:
  install:
    - mkdir -m 1777 /src/tmp
    - chmod +x /src/scripts/*
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
from: {{ index $.Images "builder/golang" }}
final: false
import:
  - image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
    add: /src/distribution
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
  - id: GOPROXY
    value: "{{ $.GOPROXY }}"
shell:
  install:
    - export GOPROXY=$(cat /run/secrets/GOPROXY)
    - export GOOS=linux
    - export GOARCH=amd64
    - export CGO_ENABLED=0
    - cd /src/distribution
    # `make binaries` builds the one command the image runs. The version is passed in because the tree
    # is a directory in this repository, not a checkout of the upstream one, so `git describe` finds
    # nothing here.
    - make binaries VERSION={{ $version }}
    - mv ./bin/registry /registry
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}"
fromImage: common/distroless
import:
- image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
  add: /src/scripts
  to: /
  includePaths:
  - install
  - uninstall
  before: setup
- image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
  add: /src/tmp
  to: /tmp
  before: setup
- image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
  add: /registry
  to: /registry
  before: setup
- image: common/pause
  add: /pause
  to: /pause
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/registry"]
    cmd: ["serve", "/config/config.yaml"]
