---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-nginx-artifact
  add: /relocate-pm/usr/sbin/nginx
  to: /usr/sbin/nginx
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-nginx-artifact
  add: /relocate-pm/usr/conf/mime.types
  to: /usr/conf/mime.types
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /src/registry-proxy-reloader
  to: /registry-proxy-reloader
  before: install
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/usr/sbin/nginx", "-g", "daemon off;"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
  - from: {{ .ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /src
    to: /src
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - cd /src
    - GOPROXY=$(cat /run/secrets/GOPROXY) GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o registry-proxy-reloader cmd/main.go
    - chown 64535:64535 registry-proxy-reloader
    - chmod 0700 registry-proxy-reloader
---
image: {{ .ModuleName }}/{{ $.ImageName }}-src-artifact
from: common/src-artifact
final: false
git:
  - add: /{{ $.ModulePath }}modules/038-{{ $.ModuleName }}/images/{{ $.ImageName }}/reloader
    to: /src
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-fuzz
from: registry.flant.com/deckhouse/ssdlc/ci-images/fuzz-go:34fdc16d905326c2fd7097363059baa398c9a1c0
fromLatest: true
final: false
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /src
    to: /src
    before: install
git:
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/Taskfile.fuzz.yml
    to: /src/Taskfile.yml
    stageDependencies:
      install:
        - Taskfile.fuzz.yml
secrets:
  - id: GOPROXY
    value: {{ $.GOPROXY }}
shell:
  install:
    - cd /src
    - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
    - rm -rf test/e2e tests/e2e tests/ginkgo
    - chmod -R a+rwX /src /fuzz/gomod
imageSpec:
  config:
    workingDir: /src
    labels:
      io.deckhouse.fuzz.engine: go
    env:
      FUZZ_WORKDIR: /src
      FUZZ_PACKAGES: "./src"
      CGO_ENABLED: "0"
{{- include "pm_binaries_artifact" (dict
      "Images" $.Images
      "name" (printf "%s/%s-nginx-artifact" $.ModuleName $.ImageName)
      "packages" "nginx"
      "binaries" "/usr/sbin/nginx"
      "post" `mkdir -p "$out/usr/conf"
cp /out/usr/conf/mime.types "$out/usr/conf/mime.types"
# Only the binary and mime.types are imported, so a pm nginx that stops being static
# would arrive without its libraries.
if patchelf --print-interpreter "$out/usr/sbin/nginx" >/dev/null 2>&1; then
  echo "FATAL: nginx from pm is no longer statically linked" >&2
  exit 1
fi`) }}
