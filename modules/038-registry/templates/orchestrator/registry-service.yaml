{{ $orchestrator := .Values.registry.internal.orchestrator }}
{{- if $orchestrator -}}
{{- $mode := ($orchestrator.state).registry_service -}}
{{- if $mode -}}

---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry")) | nindent 2 }}
  annotations:
    registry.deckhouse.io/config-hash: {{ $orchestrator.hash | quote }}
    # Survives the upgrade that stops rendering it, and is removed later by the current
    # implementation's controller once the node agent actually owns the container runtime
    # configuration on every node.
    #
    # Without this the object goes away on the first reconciliation of the release that no longer
    # renders it — and on a `Direct` cluster that is the object serving the address its nodes pull
    # through. Measured: the handover deleted this Service and the in-cluster proxy at 08:13, the
    # node's containerd was rewritten to the in-cluster name at 08:14 with no agent yet to answer
    # it, control-plane-manager updated etcd's manifest to a new digest at 08:16, and the pull
    # failed with `lookup registry.d8-system.svc: no such host`. etcd could not start, the API went
    # away, and with it bashible — so the agent that would have fixed the pull path could never be
    # installed. The cluster had to be repaired by hand.
    "helm.sh/resource-policy": keep
spec:
  clusterIP: None
  selector:
    component: registry-service
    type: {{ $mode }}
  ports:
    - name: registry
      port: 5001
      protocol: TCP
      targetPort: distribution

{{- end }}
{{- end }}
