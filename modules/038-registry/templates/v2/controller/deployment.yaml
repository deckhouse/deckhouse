{{- define "registry_controller_resources" }}
cpu: 10m
memory: 50Mi
{{- end }}

{{- if eq (include "registry_v2_manages" .) "true" }}

{{- if ($.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: registry-controller
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list $ (dict "app" "registry-controller" "workload-resource-policy.deckhouse.io" "master")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: registry-controller
  updatePolicy:
    updateMode: "Recreate"
  resourcePolicy:
    containerPolicies:
    - containerName: "registry-controller"
      minAllowed:
        {{- include "registry_controller_resources" $ | nindent 8 }}
      maxAllowed:
        cpu: 50m
        # The aggregated API of registry.deckhouse.io runs in the same process, and assembling the
        # images of a cache holds the indexes of every replica in memory for the request.
        memory: 256Mi
    # Every container of the pod, the proxy included. A container the autoscaler has no policy for
    # is still one it manages, only with no bounds: the proxy started with no requests at all, since
    # the template leaves them to the autoscaler, and nothing capped what it would recommend.
    {{- include "helm_lib_vpa_kube_rbac_proxy_resources" $ | nindent 4 }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: registry-controller
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list $ (dict "app" "registry-controller")) | nindent 2 }}
spec:
  maxUnavailable: {{ if include "registry_single_master" $ }}0{{ else }}1{{ end }}
  selector:
    matchLabels:
      app: registry-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-controller
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list $ (dict "app" "registry-controller")) | nindent 2 }}
spec:
  {{- include "helm_lib_deployment_on_master_strategy_and_replicas_for_ha" $ | nindent 2 }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: registry-controller
  template:
    metadata:
      labels:
        app: registry-controller
    spec:
      {{- include "helm_lib_priority_class" (tuple $ "system-cluster-critical") | nindent 6 }}
      {{- include "helm_lib_node_selector" (tuple $ "master") | nindent 6 }}
      {{- include "registry_master_tolerations" (dict "context" $ "leaveUnreachableNode" true) | nindent 6 }}
      {{- include "helm_lib_module_pod_security_context_run_as_user_deckhouse" $ | nindent 6 }}
      # One replica per master where the scheduler can manage it. Nothing used to keep two of them
      # off the same node: losing that master then took every replica at once, and until one came
      # back elsewhere nobody rewrote the nodes' layout — not even to point them away from a storage
      # leader that went down with the same master — and nobody replaced a cache replica.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: registry-controller
      automountServiceAccountToken: true
      serviceAccountName: registry-controller
      terminationGracePeriodSeconds: 10
      volumes:
      # Optional: the controller keeps the cache working, the listing it serves does not. Without the
      # Secret the pod starts anyway and its aggregated API waits for the files the kubelet writes in
      # once the Secret appears.
      - name: apiserver-tls
        secret:
          secretName: registry-controller-apiserver-tls
          optional: true
      # No imagePullSecrets, deliberately.
      #
      # Credentials for the registry this cluster pulls from live on the NODE, not in a pod spec: the
      # agent writes them into containerd's per-registry configuration, and before the agent exists
      # bashible writes them there from the module's own node configuration. A pod therefore needs no
      # secret of its own to pull.
      #
      # Removing it matters beyond tidiness. `deckhouse-registry` is the previous contour — written by
      # dhctl, rendered by module 002 — and this module's own components referencing it was the reason
      # it could not be retired: design ADR decision 22 asks for that contour to go, and a dependency
      # from here is a dependency the platform cannot remove.
      #
      # The secret stays where it is genuinely the only source, which is a cluster with this module
      # disabled: then nothing configures the node, and pods do need their own credentials.
      containers:
      - name: registry-controller
        image: {{ include "helm_lib_module_image" (list $ "registryController") }}
        imagePullPolicy: IfNotPresent
        # Within the restricted standard as it is, so the pod carries no SecurityPolicyException:
        # it needs nothing of the node, not even its network.
        {{- include "helm_lib_module_container_security_context_read_only_root_filesystem_capabilities_drop_all_pss_restricted" $ | nindent 8 }}
        args:
        # Leader election only where there is more than one replica to elect from.
        {{- /*
          No --leader-elect. Election is not optional here and the binary does not offer a switch
          for it: with it off, every reconciler runs on every replica, and the storage update
          controller then replaced two cache replicas at once on a three-master cluster — the guard
          that makes replacement safe is per-process. This used to pass `false` on a
          non-highly-available cluster, which the binary ignored, so the manifest described a
          control that did not exist.
        */}}
        - --logging-format=json
        {{- /*
          The same path the store's hostPath mounts, so that what an operator is told in
          RegistryStorage is the directory that actually holds the blobs. Decided by the
          hook, because it differs on a node whose root filesystem is read-only.
        */}}
        - --store-path={{ ((.Values.registry.internal).v2).storePath | default "/opt/deckhouse/registry" }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        # The metrics listener binds the loopback address, so it is not published here:
        # nothing reaches it but the kube-rbac-proxy in the same pod.
        - name: healthz
          containerPort: 4282
        # The aggregated API of registry.deckhouse.io — the images of the cache — which the
        # APIService routes to through the registry-controller Service.
        - name: apiserver
          containerPort: 4286
        volumeMounts:
        - name: apiserver-tls
          mountPath: /etc/registry-controller/apiserver
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" $ | nindent 12 }}
            {{- if not ($.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- include "registry_controller_resources" $ | nindent 12 }}
            {{- end }}
      # What the cluster scrapes. The controller's own listener is on loopback and
      # authenticates nobody; this decides who may read it, against the same API server
      # that decides everything else.
      - name: kube-rbac-proxy
        {{- include "helm_lib_module_container_security_context_read_only_root_filesystem_capabilities_drop_all_pss_restricted" $ | nindent 8 }}
        image: {{ include "helm_lib_module_common_image" (list $ "kubeRbacProxy") }}
        imagePullPolicy: IfNotPresent
        args:
        - "--secure-listen-address=$(KUBE_RBAC_PROXY_LISTEN_ADDRESS):4283"
        - "--v=2"
        - "--logtostderr=true"
        - "--stale-cache-interval=1h30m"
        env:
        - name: KUBE_RBAC_PROXY_LISTEN_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: KUBE_RBAC_PROXY_CONFIG
          value: |
            upstreams:
            - upstream: http://127.0.0.1:4281/metrics
              path: /metrics
              authorization:
                resourceAttributes:
                  namespace: d8-system
                  apiGroup: apps
                  apiVersion: v1
                  resource: deployments
                  subresource: prometheus-metrics
                  name: registry-controller
        ports:
        - name: https-metrics
          containerPort: 4283
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" $ | nindent 12 }}
            {{- if not ($.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- include "helm_lib_container_kube_rbac_proxy_resources" $ | nindent 12 }}
            {{- end }}
{{- end }}
