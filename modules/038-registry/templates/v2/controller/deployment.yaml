{{- define "registry_kube_rbac_proxy_resources" }}
cpu: 10m
memory: 25Mi
{{- end }}

{{- define "registry_controller_resources" }}
cpu: 10m
memory: 50Mi
{{- end }}

{{- if eq (include "registry_v2_manages" .) "true" }}

{{- if ($.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: registry-controller
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list $ (dict "app" "registry-controller")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: registry-controller
  updatePolicy:
    updateMode: "Recreate"
  resourcePolicy:
    containerPolicies:
    - containerName: "registry-controller"
      minAllowed:
        {{- include "registry_controller_resources" $ | nindent 8 }}
      maxAllowed:
        cpu: 50m
        memory: 128Mi
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: registry-controller
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list $ (dict "app" "registry-controller")) | nindent 2 }}
spec:
  maxUnavailable: {{ include "helm_lib_is_ha_to_value" (list $ 1 0) }}
  selector:
    matchLabels:
      app: registry-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-controller
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list $ (dict "app" "registry-controller")) | nindent 2 }}
spec:
  {{- include "helm_lib_deployment_on_master_strategy_and_replicas_for_ha" $ | nindent 2 }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: registry-controller
  template:
    metadata:
      labels:
        app: registry-controller
    spec:
      {{- include "helm_lib_priority_class" (tuple $ "system-cluster-critical") | nindent 6 }}
      {{- include "helm_lib_node_selector" (tuple $ "master") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple $ "any-node" "with-uninitialized") | nindent 6 }}
      {{- include "helm_lib_module_pod_security_context_run_as_user_deckhouse" $ | nindent 6 }}
      automountServiceAccountToken: true
      serviceAccountName: registry-controller
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
      - name: deckhouse-registry
      containers:
      - name: registry-controller
        image: {{ include "helm_lib_module_image" (list $ "registryController") }}
        imagePullPolicy: IfNotPresent
        {{- include "helm_lib_module_container_security_context_read_only_root_filesystem" $ | nindent 8 }}
        args:
        # Leader election only where there is more than one replica to elect from.
        - --leader-elect={{ include "helm_lib_is_ha_to_value" (list $ true false) }}
        - --logging-format=json
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        # The metrics listener binds the loopback address, so it is not published here:
        # nothing reaches it but the kube-rbac-proxy in the same pod.
        - name: healthz
          containerPort: 4282
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" $ | nindent 12 }}
            {{- if not ($.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- include "registry_controller_resources" $ | nindent 12 }}
            {{- end }}
      # What the cluster scrapes. The controller's own listener is on loopback and
      # authenticates nobody; this decides who may read it, against the same API server
      # that decides everything else.
      - name: kube-rbac-proxy
        {{- include "helm_lib_module_container_security_context_read_only_root_filesystem" $ | nindent 8 }}
        image: {{ include "helm_lib_module_common_image" (list $ "kubeRbacProxy") }}
        imagePullPolicy: IfNotPresent
        args:
        - "--secure-listen-address=$(KUBE_RBAC_PROXY_LISTEN_ADDRESS):4283"
        - "--v=2"
        - "--logtostderr=true"
        - "--stale-cache-interval=1h30m"
        env:
        - name: KUBE_RBAC_PROXY_LISTEN_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: KUBE_RBAC_PROXY_CONFIG
          value: |
            upstreams:
            - upstream: http://127.0.0.1:4281/metrics
              path: /metrics
              authorization:
                resourceAttributes:
                  namespace: d8-system
                  apiGroup: apps
                  apiVersion: v1
                  resource: deployments
                  subresource: prometheus-metrics
                  name: registry-controller
        ports:
        - name: https-metrics
          containerPort: 4283
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" $ | nindent 12 }}
            {{- if not ($.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- include "registry_kube_rbac_proxy_resources" $ | nindent 12 }}
            {{- end }}
{{- end }}
