{{- /*
  Who may read the metrics of this module's components.

  The kube-rbac-proxy beside each of them asks the API server this question, so the answer
  is here rather than in a flag: the listeners themselves authenticate nobody, and what
  decides who reaches them is the same thing that decides everything else in the cluster.

  Two resources because the components are two workloads, and named explicitly because the
  grant is for these and not for whatever else may come to live in d8-system.
*/ -}}
{{- if eq (include "registry_v2_manages" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-to-registry-prometheus-metrics
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry")) | nindent 2 }}
rules:
- apiGroups: ["apps"]
  resources: ["deployments/prometheus-metrics"]
  resourceNames: ["registry-controller"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["statefulsets/prometheus-metrics"]
  resourceNames: ["registry-storage"]
  verbs: ["get"]
{{- if (.Values.global.enabledModules | has "prometheus") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access-to-registry-prometheus-metrics
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: access-to-registry-prometheus-metrics
subjects:
- kind: User
  name: d8-monitoring:scraper
- kind: ServiceAccount
  name: prometheus
  namespace: d8-monitoring
{{- end }}
{{- end }}
