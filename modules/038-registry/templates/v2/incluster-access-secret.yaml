{{- /*
  The account and authority a pod reads the key with, `registry.d8-system.svc:5001`, now that the
  Service leads it to the store (templates/v2/storage/service.yaml). The global registry discovery puts
  them into `global.modulesImages.registry`, so a module that fetches from a pod by those values, such
  as operator-trivy, verifies the store and authenticates to it without changes of its own.

  The pods' account (UserPods in hooks/v2/pki): pull on the platform's image set and not on the module
  sources the store keeps beside it. From the global values it reaches the pull secrets of the modules'
  namespaces and the platform's module sources, where the upstream's account with the licence used to
  be. A container runtime is redirected to the node agent, which drops it, and so does Deckhouse.

  Only once the Service serves (hooks/v2/incluster_access.go) and the image address is published:
  every module converges on the change, so it is made once, and Deckhouse restarts with it.
*/ -}}
{{- if eq (include "registry_v2_manages" .) "true" }}
  {{- $v2 := .Values.registry.internal.v2 }}
  {{- $pki := $v2.pki }}
  {{- if and $v2.imageAddress $v2.inClusterAccess $pki (($pki.pods | default dict).name) }}
    {{- /* Host in go_lib/registry/const. */}}
    {{- $host := "registry.d8-system.svc:5001" }}
    {{- $auth := printf "%s:%s" $pki.pods.name $pki.pods.password | b64enc }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: registry-incluster-access
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry")) | nindent 2 }}
data:
  dockercfg: {{ dict "auths" (dict $host (dict "auth" $auth)) | toJson | b64enc | quote }}
  ca: {{ $pki.ca.cert | b64enc | quote }}
  {{- end }}
{{- end }}
