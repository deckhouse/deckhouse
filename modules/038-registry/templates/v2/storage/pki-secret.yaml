{{- /*
The certificates and credentials of the storage, rendered from what the hook
generated and persisted.

Split by reader, because what a secret holds is what everything allowed to read it
holds. The PKI secret is mounted by the storage pod and holds private keys. The access
secret is the storage pod's own: its syncer takes the sync account and the upload
signing secret from it, which no other component has any use for. The client secret is
what a client needs to talk to the storage, and nothing more — the controller reads it
to build the node layouts and the packages proxy to fetch while a node has no agent, and
it must give neither the storage's identity nor an account that can write.
*/ -}}
{{- if eq (include "registry_v2_caches" .) "true" }}
{{- $pki := (.Values.registry.internal.v2).pki }}
{{- if $pki }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: registry-storage-pki
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-storage")) | nindent 2 }}
data:
  ca.crt: {{ $pki.ca.cert | b64enc | quote }}
  distribution.crt: {{ $pki.distribution.cert | b64enc | quote }}
  distribution.key: {{ $pki.distribution.key | b64enc | quote }}
  auth.crt: {{ $pki.auth.cert | b64enc | quote }}
  auth.key: {{ $pki.auth.key | b64enc | quote }}
  # The token certificate without its key, so the registry can verify a token and not
  # issue one. The key is in registry-storage-auth-config, which only the auth container
  # mounts — the process that does issue them.
  #
  # This comment used to say the storage "only verifies tokens", which was not true of the
  # pod as a whole: the signer runs in it, as the auth container. Withholding the key from
  # everything in the pod left that container unable to start at all, and every pull then
  # failed with a 401 whose cause was two containers away.
  token.crt: {{ $pki.token.cert | b64enc | quote }}
  # The authority the write listener requires a client certificate from. A handshake
  # without one is refused, and so is one with a leaf this authority issued to anybody
  # but the ingress controller (registry-storage-ingress-client) or the syncer of the
  # same pod, which presents distribution.crt above (registry-storage). So the listener
  # on the node address takes a write only from an ingress controller presenting the
  # ingress certificate, or from the replica itself; the credentials are still checked
  # after that. Only the ingress's certificate makes the client address it forwards
  # believed.
  #
  # "Through the ingress, where `whitelistSourceRanges` applies" is what this means as
  # long as the only Ingress that names registry-storage-ingress-client is this module's.
  # The annotation takes a namespace/name, and a controller that lets an Ingress of
  # another namespace name a secret here presents the same certificate for that Ingress
  # too — to whatever backend it points at, under that Ingress's source ranges, not
  # this one's. Whether the controller allows that is its setting, not this module's.
  #
  # The same authority as ca.crt, under its own key because the reader is different:
  # this is what admits a client, that is what a client verifies the registry with.
  ingress-client-ca.crt: {{ $pki.ca.cert | b64enc | quote }}
---
{{- /*
  The whole generated state, so the hook can restore it after a module restart instead of
  regenerating an authority every node would have to be told about.

  Its own secret because it is the only object here with no reader inside the cluster: the
  hook reads it through the API and nothing mounts it. It used to be a key of the secret
  above, and that quietly undid the split this file is built on — `/pki/state.yaml` gave all
  three containers of the storage pod the certificate authority's private key, the token
  signing key that is deliberately withheld from the registry, the publication password and
  the ingress client key. The authority's key alone is enough to issue a certificate every
  node agent in the cluster trusts.
*/ -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: registry-storage-pki-state
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-storage")) | nindent 2 }}
data:
  state.yaml: {{ $pki | toYaml | b64enc | quote }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: registry-storage-access
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-storage")) | nindent 2 }}
data:
  ca.crt: {{ $pki.ca.cert | b64enc | quote }}
  # The read credentials. Kept here as well as in registry-storage-client below, because dhctl
  # reads them, with ca.crt, from this secret on two paths. From outside the cluster, with the
  # administrator's credentials, it also reads the addresses, to reach the store through a
  # tunnel. In the cluster, as terraform-auto-converger and terraform-state-exporter, it does
  # not read the addresses and pulls an air-gapped cluster's provider from the store's service.
  # Both callers can read either secret anyway: the administrator can read every secret, and
  # the Roles of the two service accounts grant every secret in d8-system, where they keep the
  # infrastructure state, so dhctl reading this one gives neither anything it did not have.
  username: {{ $pki.ro.name | b64enc | quote }}
  password: {{ $pki.ro.password | b64enc | quote }}
  # What a replica writes to its own store with — the fill, the replication and the garbage
  # collection's deletes.
  #
  # Beside the read pair, in the secret the syncer's environment is built from, and that is
  # also why the read pair is copied out rather than this pair moved away. The storage
  # StatefulSet is updated OnDelete, so a replica keeps the spec it was created with for as
  # long as nothing replaces it — on a single master with no upstream, that is indefinitely —
  # and its kubelet resolves these keys again on every container restart. Moving them would
  # leave such a replica unable to start its syncer after the next crash; copying what the
  # controller needs into a secret of its own takes the sync account out of the controller's
  # reach without touching anything a running replica depends on.
  #
  # It is a DIFFERENT account from the one the nodes pull with, and not the one the
  # publication endpoint is guarded by.
  sync-username: {{ $pki.sync.name | b64enc | quote }}
  sync-password: {{ $pki.sync.password | b64enc | quote }}
  http-secret: {{ $pki.httpSecret | b64enc | quote }}
  token-issuer: {{ "Registry server" | b64enc | quote }}
  # The addresses the replicas are actually reachable at.
  #
  # Node addresses, not the Service name. A node agent runs in the host network and
  # resolves through the host's resolver, where a cluster DNS name does not exist —
  # `registry.d8-system.svc:5001` is only ever a key that names the image set, never
  # something anybody dials. The serving certificate covers these same addresses,
  # which is why they are generated together with it.
  addresses: {{ ((.Values.registry.internal.v2).storageAddresses | default list) | join "," | b64enc | quote }}
---
{{- /*
  What the registry controller reads to tell the node agents how to reach the storage, and what the
  packages proxy reads to fetch from it while a node has no agent yet: the authority to verify it by,
  the read account and the replicas' addresses.

  A secret of its own rather than a read of registry-storage-access, which also carries the sync
  account and the secret that signs upload state. The Roles of both readers name this secret alone,
  so a compromised controller or proxy can read what every node already holds and nothing that can
  write into the store.

  The same values as the access secret above, rendered from the same state in the same release, so
  the two cannot disagree.
*/ -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: registry-storage-client
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-storage")) | nindent 2 }}
data:
  ca.crt: {{ $pki.ca.cert | b64enc | quote }}
  username: {{ $pki.ro.name | b64enc | quote }}
  password: {{ $pki.ro.password | b64enc | quote }}
  addresses: {{ ((.Values.registry.internal.v2).storageAddresses | default list) | join "," | b64enc | quote }}
---
{{- /*
  The token service configuration.

  Rendered here rather than by the syncer, unlike the registry's own configuration,
  because nothing in it depends on the desired state: the two accounts and the
  certificates that sign their tokens are facts about the cluster, and they change only
  when the PKI is reissued. The registry's configuration changes whenever the upstream
  does, which is why that one is derived on the node instead.
*/ -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: registry-storage-auth-config
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-storage")) | nindent 2 }}
stringData:
  # Only the auth container mounts this secret, which is why the signing key lives here and
  # not in the PKI the registry also reads.
  token.key: {{ $pki.token.key | quote }}
  auth_config.yaml: |
    server:
      # Loopback only. The registry fetches tokens on its clients' behalf, so this is
      # reachable from exactly one place: the process in this pod that needs it. It is
      # also why there is no second address to publish and no second certificate to
      # cover it.
      addr: "127.0.0.1:5051"
      real_ip_header: "X-Forwarded-For"
      certificate: "/pki/auth.crt"
      key: "/pki/auth.key"
    token:
      issuer: "Registry server"
      expiration: 900
      certificate: "/pki/token.crt"
      # The signing key, from this service's own secret rather than the shared PKI.
      #
      # This is the one process that signs tokens; the registry beside it only verifies
      # them, and it is the registry that answers the network. Keeping the key out of the
      # shared mount is what makes that difference real: a registry that is compromised
      # can serve and store, but it cannot mint a token granting more than it already has.
      key: "/auth/token.key"
      # Upstream distribution v3 trusts keys by RFC 7638 JWK thumbprint and looks a token's
      # `kid` up in that map; docker_auth's default is libtrust's legacy key ID, which is the
      # same key under a name v3 cannot find — every request then comes back 401 with
      # `token signed by untrusted key with ID`, from a registry holding the very key that signed
      # the tokens.
      disable_legacy_key_id: true
    users:
      # Passwords are bcrypt hashes; the plaintext is only ever handed to the clients
      # that authenticate with it, never to the service that verifies it.
      {{ $pki.ro.name | quote }}:
        password: {{ $pki.ro.passwordHash | quote }}
      {{ $pki.sync.name | quote }}:
        password: {{ $pki.sync.passwordHash | quote }}
      {{ $pki.rw.name | quote }}:
        password: {{ $pki.rw.passwordHash | quote }}
    acl:
      # Every account rule below is held to the platform's path, `system/deckhouse` and what is under it.
      #
      # Everything the store keeps lives there: the platform, its modules, and every other ModuleSource
      # under `system/deckhouse/module-sources/<source>`. Without the restriction each account reached
      # every repository name a client cared to ask for — the node account could pull through the cache
      # under any name, and the two that write could put anything anywhere.
      #
      # Between slashes, because docker_auth takes a pattern so written as a regular expression and any
      # other as a `path.Match` glob, where `*` never crosses a `/` and no single glob covers both the
      # path itself and every depth below it. Anchored at both ends, because the expression is matched
      # anywhere in the name otherwise: unanchored, `other/system/deckhouse` would pass, and so would
      # `system/deckhouse-extra`. A mistake here denies every pull in the cluster rather than failing
      # loudly, which is what the template test that evaluates these rules the way docker_auth does is
      # for.
      {{- $platformPath := "/^system/deckhouse(/.*)?$/" }}
      #
      # The account a replica fills and replicates with, which has to be able to WRITE.
      #
      # Its own identity and not one of the other two, because neither fits. The node account is on
      # every node and must never be able to change what a node pulls next. The publication account
      # is the one `d8 mirror push` uses through an internet-facing endpoint, and putting its
      # password into every replica on every master would multiply that exposure by the number of
      # masters.
      #
      # Catalogue listing included: counting what the store holds is how completeness is decided,
      # and it is the same client that does the writing.
      - match: { account: {{ $pki.sync.name | quote }}, type: "registry", name: "catalog" }
        actions: ["*"]
        comment: "counting what this replica holds"
      # And deleting: the garbage collection deletes what no kept release declares through this same
      # account, on the listener that does not proxy. Granted pull and push only, every DELETE came back
      # 401 — hundreds of manifests judged garbage on a full store, none of them removed. The account
      # could already overwrite what it fills; deleting is the other half of keeping the store, and it
      # stays on the one account the replicas hold, not the node one or the publication one.
      - match: { account: {{ $pki.sync.name | quote }}, name: {{ $platformPath | quote }} }
        actions: ["pull", "push", "delete"]
        comment: "a replica filling its own store, from an upstream or from the leader, and collecting it"
      # Listing the catalogue, which is a resource of its own and not covered by "pull".
      #
      # First among the read account's rules, because docker_auth takes the first matching rule and
      # the account rule below would otherwise match this request and grant it "pull", which is not
      # the action being asked for.
      #
      # Kept for the read account as well as the sync one: the node agents read a layout that names
      # this account, and a replica that has been restarted mid-transition may still be using it.
      - match: { account: {{ $pki.ro.name | quote }}, type: "registry", name: "catalog" }
        actions: ["*"]
        comment: "reading the catalogue, which is how a replica counts what it holds"
      - match: { account: {{ $pki.ro.name | quote }}, name: {{ $platformPath | quote }} }
        actions: ["pull"]
        comment: "the account every node pulls with, and replicas replicate with"
      # Pull and push, and nothing else.
      #
      # This is the account that publishes the platform, so replacing what is under its path is what it
      # is for, and whoever can read registry-storage-push can do exactly that. What it is not for is
      # deleting or listing: `d8 mirror push` only uploads — it first proves it may write by pushing a
      # small random image to `<path>:d8WriteCheck`, which it leaves behind, then asks whether a blob or
      # a manifest is already there and pushes what is not — and never sends a DELETE or reads
      # `_catalog`. Pull stays beside push because the client asks for both in one scope when it uploads.
      # Removing what no release needs is the garbage collection's job, done with the sync account from
      # inside the store; through this one it would be a way to empty the store from an internet-facing
      # endpoint.
      #
      # Granted wherever the token service is asked, so which listener a push with it lands on is
      # decided by the listeners, not here. Only the write listener (4283) takes one, and it admits
      # nobody without the ingress or syncer certificate. The serving listener (4281) refuses every
      # write, this account's and the sync one's above, in air-gap too, where it is the store
      # itself; only a replica whose pod predates that still takes a push there until replaced.
      - match: { account: {{ $pki.rw.name | quote }}, name: {{ $platformPath | quote }} }
        actions: ["pull", "push"]
        comment: "the account `d8 mirror push` writes with, reachable only through the publication endpoint"
      # Anything not matched above is denied, which is this service's default.
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: registry-storage-push
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-storage")) | nindent 2 }}
data:
  # The write credentials, kept in their own secret so that granting something the
  # ability to read the pull credentials does not also grant the ability to replace
  # images.
  username: {{ $pki.rw.name | b64enc | quote }}
  password: {{ $pki.rw.password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: registry-storage-ingress-client
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-storage")) | nindent 2 }}
data:
  # Presented by the ingress controller when it proxies a write to the storage. The write
  # listener refuses a handshake without it, so this is what `d8 mirror push` depends on.
  tls.crt: {{ $pki.ingressClient.cert | b64enc | quote }}
  # PKCS#8, and the only key of the module that has to be: nginx loads it with OpenSSL,
  # which reads a "PRIVATE KEY" block as PKCS#8 and nothing else, and one key it cannot
  # load fails the controller's whole configuration, every Ingress of the cluster with it.
  # The shared encoder writes PKCS#1 under that label, which only Go reads back; the hook
  # re-encodes this one from the stored key on every run (EnsureIngressClientKey).
  tls.key: {{ $pki.ingressClient.key | b64enc | quote }}
  # Not for verifying anything — the ingress does not verify the storage, see
  # `proxy-ssl-verify` in ingress.yaml — but without it the certificate above is never
  # presented. ingress-nginx writes the pair of a `proxy-ssl-secret` to disk, and renders
  # `proxy_ssl_certificate` for the location, only when the secret carries a `ca.crt`
  # (store/backend_ssl.go, getPemCertificate, in every controller from 1.9 to 1.13). Without
  # it the annotation is accepted, nothing is logged, and the upstream connection goes out
  # with no client certificate at all: harmless while the write listener only asked for
  # one, a refused handshake on every push once it requires one.
  ca.crt: {{ $pki.ca.cert | b64enc | quote }}
{{- end }}
{{- end }}
