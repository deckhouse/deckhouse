{{- define "registry_image_holder_resources" }}
cpu: 10m
memory: 10Mi
{{- end }}

{{- if eq (include "registry_v2_caches" .) "true" }}
{{- $images := dict
    "distribution" (include "helm_lib_module_image" (list $ "dockerDistribution"))
    "auth" (include "helm_lib_module_image" (list $ "dockerAuth"))
    "syncer" (include "helm_lib_module_image" (list $ "registrySyncer"))
    "kubeRbacProxy" (include "helm_lib_module_common_image" (list $ "kubeRbacProxy"))
}}
---
# The images the cache will be replaced with, brought onto the master nodes before it is.
#
# The circle this breaks: the storage's own images are pulled from the registry the storage
# serves. Replacing a replica deletes its pod first and pulls afterwards, so on the way to a new
# version the node has to fetch the new image from a cache that is, at that moment, the pod that
# was just deleted. With several replicas the others cover it — they are mirrors of each other in
# every node layout. With one replica and no upstream there is nothing to cover it at all, and an
# air-gapped cluster updating its cache would have no source of images left.
#
# So the new images are held here first. Each container does nothing but exist: kubelet pulls the
# image to start it, and `/pause` keeps it from exiting, which is the whole of the mechanism. By
# the time this DaemonSet is up on a node, that node has the images locally and the swap needs no
# registry — which is what makes the swap safe in the one case where nothing else would.
#
# The images are named the same way the StatefulSet names them, so a version that changes one
# changes both, and this one rolls out first: the update controller waits for the holder on a node
# before it replaces the storage pod there.
#
# Not merged into the StatefulSet as extra containers, deliberately. Held images have to arrive
# BEFORE the pod that uses them is replaced; a container inside that same pod arrives with it, one
# moment too late to be of any use.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: registry-storage-image-holder
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list $ (dict "app" "registry-storage-image-holder")) | nindent 2 }}
spec:
  selector:
    matchLabels:
      app: registry-storage-image-holder
  template:
    metadata:
      labels:
        app: registry-storage-image-holder
    spec:
      {{- include "helm_lib_priority_class" (tuple $ "system-cluster-critical") | nindent 6 }}
      # The master nodes, and only those: they are where the cache runs, and holding its images
      # anywhere else would occupy disk on every node in the cluster for nothing.
      {{- include "helm_lib_node_selector" (tuple $ "master") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple $ "any-node" "with-uninitialized") | nindent 6 }}
      imagePullSecrets:
      - name: deckhouse-registry
      containers:
      {{- range $name, $imageRef := $images }}
      - name: hold-{{ $name | kebabcase }}
        {{- include "helm_lib_module_container_security_context_read_only_root_filesystem" $ | nindent 8 }}
        image: {{ $imageRef }}
        command:
        - /pause
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" $ | nindent 12 }}
            {{- if not ($.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
              {{- include "registry_image_holder_resources" $ | nindent 12 }}
            {{- end }}
      {{- end }}
{{- end }}
