{{- /*
  Requests only, and no limits on any container — the platform's rule, and here also the only
  setting that does no harm. A CPU limit throttles the cache in the middle of serving a pull, which
  is the one moment it is needed. A memory limit on the registry kills it in the middle of a blob a
  node is reading, and on the syncer it kills the garbage collection, which runs in the syncer's own
  cgroup, partway through a sweep.

  These are the floor the VerticalPodAutoscaler below starts from, and they are written into the
  containers unconditionally, unlike the usual `if not VPA`: the storage comes up during bootstrap,
  well before the autoscaler does, and a pod created then would otherwise run with no requests at
  all — and under `Initial` it would keep running that way until it is next replaced.
*/ -}}
{{- define "registry_storage_distribution_resources" }}
cpu: 50m
memory: 150Mi
{{- end }}

{{- define "registry_storage_auth_resources" }}
cpu: 10m
memory: 30Mi
{{- end }}

{{- define "registry_storage_syncer_resources" }}
cpu: 25m
memory: 50Mi
{{- end }}

{{- /*
  One replica per master node. The cache is part of the control plane: putting it on every node
  would multiply the disk cost by the size of the cluster.

  Counted from clusterMasterCount, which counts exactly the nodes this StatefulSet is scheduled onto
  — the ones labelled `node-role.kubernetes.io/control-plane`, the same selector as its
  nodeSelector. The obvious-looking alternative, `d8SpecificNodeCountByRole.master`, is keyed by
  `node-role.deckhouse.io/<role>` labels, which master nodes do not carry under that name: the key is
  absent, the default applies, and a three-master cluster silently runs one replica. It did — with
  no redundancy and no replication happening at all, while the StatefulSet reported 1/1 ready and
  every check that compares ready against desired passed.

  A define because two places have to agree on it: the replica count and the disruption budget
  below. The budget used to follow the cluster's high-availability flag instead, which is a
  different question — `global.highAvailability: false` on three masters left three replicas behind
  a budget of zero, and every drain of a master stopped on the cache until it timed out.
*/ -}}
{{- define "registry_storage_replicas" -}}
{{ .Values.global.discovery.clusterMasterCount | default 1 }}
{{- end -}}

{{- /*
The storage of the controller-based implementation.

Rendered only under the implementation discriminator, so on a cluster still running
the legacy implementation none of this exists.

The registry reads its configuration once at startup, so a credential or certificate
change means the process has to come back — and the syncer brings it back by
signalling it, which needs a shared process namespace. The pod object is never
touched in the process, which is exactly what keeps such a change working while the
Deckhouse operator is down.
*/ -}}
{{- if eq (include "registry_v2_caches" .) "true" }}
{{- /*
  Where the blobs live on the node. Decided by the hook, because the answer differs by
  node kind: a master whose root filesystem is read-only has nowhere to put them under
  /opt. The default is only for a values tree written before that hook ran.
*/ -}}
{{- $storePath := ((.Values.registry.internal).v2).storePath | default "/opt/deckhouse/registry" }}
{{- $images := include "registry_storage_images" $ | fromYaml }}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list $ (dict "app" "registry-storage")) | nindent 2 }}
spec:
  # A headless service: the agents reach the storage through the node addresses the
  # controller puts into their layout, and replication addresses a specific replica.
  # The stable name is what every image reference in the cluster is built from.
  #
  # The port keeps the number in that name, `registry.d8-system.svc:5001`, which nothing
  # dials; the replicas serve on 4281. Being headless, the name resolves to the masters'
  # node addresses and a client dials the port it names itself: targetPort applies to none
  # of it. Two readers do dial the name, at 4281 (StorageHost in go_lib/registry/const):
  # dhctl in the cluster, whose terraform-manager auto-converger and state exporter run in
  # the pod network and read an air-gapped cluster's store from here, and
  # registry-packages-proxy, on a master that has no agent yet, fetching the agent's own
  # package (in practice the first master of an installation, since a joining master gets
  # the agent's authority before its kubelet starts). During the update to these ports a
  # replica on the previous pod spec still serves on 5001, and while no replica serves on
  # 4281 dhctl's reads fail until one is replaced, and retry.
  clusterIP: None
  selector:
    app: registry-storage
  ports:
  - name: registry
    port: 5001
    targetPort: 4281
    protocol: TCP
{{- if ($.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
{{- /*
  `Initial`, and not the in-place or recreating modes the other components use: the autoscaler's
  updater evicts a pod whenever it decides to, and here that decision belongs to the
  registry-storage-update controller alone. It replaces the replicas one at a time, followers
  first and the leader last, after checking that every other replica serves — an eviction knows
  none of that, and under a budget of one it can take the leader down in the middle of a fill.
  With `Initial` a recommendation is applied only to a pod being created anyway, which is a pod that
  controller chose to replace.

  The ceilings are small on purpose, and they are what bounds the risk of this mode: a replica
  recreated with a recommendation that no longer fits the master stays Pending, and on a single
  master in an air-gapped cluster a Pending storage is no images at all. Their CPU sum stays near
  400m, which a four-core master holds beside its control plane. And small against etcd and the
  API server too, not just small enough to fit: under contention the CPU is shared by request, so
  the more the cache asks for while it fills, the less is left for them.

  Sized from test clusters on four-core masters filling a store from scratch: the registry, the
  syncer and the token service averaged at most 0.18, 0.13 and 0.06 of a core over the fill, and
  none of them went past 100Mi of resident memory on one master or three. The syncer's memory
  ceiling leaves room for the garbage collection it runs as a child process.
*/}}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: registry-storage
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list $ (dict "app" "registry-storage" "workload-resource-policy.deckhouse.io" "master")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: StatefulSet
    name: registry-storage
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
    - containerName: distribution
      controlledValues: RequestsOnly
      minAllowed:
        {{- include "registry_storage_distribution_resources" $ | nindent 8 }}
      maxAllowed:
        cpu: 150m
        memory: 256Mi
    - containerName: auth
      controlledValues: RequestsOnly
      minAllowed:
        {{- include "registry_storage_auth_resources" $ | nindent 8 }}
      maxAllowed:
        cpu: 50m
        memory: 64Mi
    - containerName: syncer
      controlledValues: RequestsOnly
      minAllowed:
        {{- include "registry_storage_syncer_resources" $ | nindent 8 }}
      maxAllowed:
        cpu: 150m
        memory: 256Mi
    {{- include "helm_lib_vpa_kube_rbac_proxy_resources" $ | nindent 4 }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: registry-storage
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list $ (dict "app" "registry-storage")) | nindent 2 }}
spec:
  # From the number of replicas: see registry_storage_replicas. Not from the cluster's
  # high-availability flag, and not from the master count directly as the controller's budget is:
  # the two agree once the count is known, but before it is the StatefulSet still runs its one
  # replica, and a budget of one would let it go. One of several may be away at a time; the only one
  # may not, which is what every other single-replica component on a master asks for too. A drain of
  # the only master is not held up by it: node-manager does not drain a control-plane group of one
  # node.
  #
  # The budget does not stand in the way of updates either. The update controller deletes the pods
  # it replaces rather than evicting them, so the order it keeps is its own.
  maxUnavailable: {{ if gt (include "registry_storage_replicas" $ | int) 1 }}1{{ else }}0{{ end }}
  selector:
    matchLabels:
      app: registry-storage
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: registry-storage
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list $ (dict "app" "registry-storage")) | nindent 2 }}
spec:
  serviceName: registry
  # One replica per master node, counted from clusterMasterCount: see registry_storage_replicas,
  # which the disruption budget above reads too.
  replicas: {{ include "registry_storage_replicas" $ }}
  podManagementPolicy: Parallel
  # Replaced by the controller, one replica at a time, and never the leader first.
  #
  # A StatefulSet's own RollingUpdate goes by ordinal, highest first. Which ordinal holds the fill
  # lease is not a property of the ordinal, so the built-in order has an even chance of taking the
  # leader down first and handing the role over during an update that was about to restart the new
  # holder as well. What the design asks for instead is followers first and the leader last, which
  # no update strategy can express — the lease is not something a StatefulSet knows about.
  #
  # OnDelete makes the StatefulSet stop replacing pods on its own: it keeps the new revision ready
  # and waits. The registry-storage-update controller then deletes one pod at a time, checking that
  # every other replica is serving and that something can serve the replaced pod's new images while
  # it is away: the leader, a follower holding the whole set, the upstream — or, for the only
  # replica of an air-gapped cache, the node itself, once the image holder in image-holder.yaml
  # runs every image of this template there.
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: registry-storage
  template:
    metadata:
      labels:
        app: registry-storage
        security.deckhouse.io/security-policy-exception: registry-storage
    spec:
      {{- include "helm_lib_priority_class" (tuple $ "system-cluster-critical") | nindent 6 }}
      {{- include "helm_lib_node_selector" (tuple $ "master") | nindent 6 }}
      # Stays bound to an unreachable master: a Terminating replica counts as absent, and the
      # storage update controller then refuses to replace any other one.
      {{- include "registry_master_tolerations" (dict "context" $ "leaveUnreachableNode" false) | nindent 6 }}
      # Root, explicitly, and the same choice the previous implementation made for the same
      # component.
      #
      # Two things here need it. The registry reads its certificate material from a Secret
      # mount, whose files are owned by root with mode 0400 — a Secret volume has no other
      # owner to offer. And it writes the store to a hostPath on the node, which belongs to
      # root there. Left unset, the user comes from the base image, which is distroless and
      # runs as 64535: the registry then panics on "permission denied" opening its own token
      # bundle, and the pod crash-loops on a message about a file that is plainly present.
      #
      # Stated rather than inherited on purpose. An unset security context does not mean root;
      # it means whatever the base image happens to say, decided somewhere this file does not
      # mention.
      #
      # Root, but without a single capability: every container drops them all. What root is
      # needed for here is ownership, and that takes none — the Secret files and the store are
      # root's own, and the syncer signals a process running under its own UID, found through
      # a /proc/<pid>/cmdline anyone may read. What the pod needs beyond the restricted
      # standard is excepted, item by item, in security-policy-exception.yaml beside this file.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: true
      serviceAccountName: registry-storage
      # Room for the longest preStop below, the token service's 25 seconds, and for each container's
      # own stop after its wait. The registry stops at once on SIGTERM, since it is given no drain
      # timeout, and the token service only finishes the exchanges in flight. The syncer has no wait
      # and the whole period to itself.
      terminationGracePeriodSeconds: 45
      # One replica per node, since each one owns the store on its host.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: registry-storage
            topologyKey: kubernetes.io/hostname
      # The registry binds the node address, where the agents of other nodes and the
      # other replicas reach it, and that address exists only in the host network
      # namespace. It is also what lets the storage serve before the cluster network is
      # up, which matters because the network's own images come from here.
      #
      # Its ports are therefore the node's, and each one declared below is reserved on the
      # node by the scheduler: 4281, 4283 and the metrics' 4285 between nodes, inside the
      # 4200-4299 range the platform documents for host firewalls, and 5051 on the loopback.
      # The node agent's 127.0.0.1:5001 is not among them — the agent is a static pod of its
      # own.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # The syncer signals the registry process to make it re-read its
      # configuration.
      shareProcessNamespace: true
      # No imagePullSecrets, deliberately.
      #
      # Credentials for the registry this cluster pulls from live on the NODE, not in a pod spec: the
      # agent writes them into containerd's per-registry configuration, and before the agent exists
      # bashible writes them there from the module's own node configuration. A pod therefore needs no
      # secret of its own to pull.
      #
      # Removing it matters beyond tidiness. `deckhouse-registry` is the previous contour — written by
      # dhctl, rendered by module 002 — and this module's own components referencing it was the reason
      # it could not be retired: design ADR decision 22 asks for that contour to go, and a dependency
      # from here is a dependency the platform cannot remove.
      #
      # The secret stays where it is genuinely the only source, which is a cluster with this module
      # disabled: then nothing configures the node, and pods do need their own credentials.
      containers:
      - name: distribution
        image: {{ index $images "distribution" }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        args: ["serve", "/config/config.yaml"]
        # What the node agents pull through and what one replica replicates from another, on the
        # node address. The registry an installation from a bundle starts on the first master serves
        # on the same port, and that is relied on: while its static pod holds the port, this pod is
        # not scheduled onto that master, so the two never serve one directory at once.
        ports:
        - name: registry
          containerPort: 4281
        # The write endpoint: the same registry, the same store, a second listener with no cache in
        # front of it. It is what `d8 mirror push` writes to, what an operator publishing their own
        # modules writes to, and what this replica's own fill writes to.
        #
        # A second listener rather than a second container, which is how this was done before: a cache
        # refuses every write, so the writes need a non-proxying view of the store, and the registry
        # now serves one itself. Two
        # containers meant two rendered configurations that must not be swapped, and a store-wide flag
        # to stop each process from deleting the other's data on startup.
        #
        # A different port because the pod is host-networked, and because two listeners in one process
        # cannot share one either way. Reached from the nodes running the ingress controller.
        #
        # Being able to reach it is not enough: it refuses a handshake without a client certificate
        # from the module's authority, issued to the ingress controller or to the syncer below, and
        # checks the credentials after that. The port is open on the node address of every master,
        # and `whitelistSourceRanges` is applied by the ingress, not here.
        - name: registry-push
          containerPort: 4283
        # Ready only once the registry has read its configuration and serves. The syncer writes that
        # configuration into an emptyDir after the pod starts, so a fresh replica's registry used to
        # exit on a missing file and restart until it was there — and with no probe of its own the
        # pod read as ready between those restarts. The controller replaces the next replica as soon
        # as this one reads ready: measured on a three-master cluster, the leader was taken down while
        # the replica just replaced was in a restart back-off, two of three out of service at once. The
        # registry now waits for the file instead of exiting (awaitConfig in the wrapper), and this
        # probe is what still keeps the pod unready until the serving port opens.
        #
        # The serving port itself, which the registry opens only from a configuration that loaded. On
        # the node address, the probe's default here: that is where the registry listens, and the
        # loopback has nothing on this port.
        #
        # Not the debug listener's /debug/health on :5002. The wrapper does open that listener now —
        # upstream opens it from its `serve` command, which the wrapper does not run, and while it did
        # not, every replica probed there stayed unready — but it is the wrong place to ask. It listens
        # on loopback, 127.0.0.1:5002 as the syncer renders it, which a probe with no host never
        # reaches: the kubelet's default is the node address. It opens before the serving listener, so
        # an answer from it would say nothing about whether the serving one is up, and it is allowed to
        # fail without stopping the registry. And on a node still moving off the previous
        # implementation, the node's :5002 belongs to that implementation's proxy, which would answer
        # for a registry that is down.
        readinessProbe:
          tcpSocket:
            port: 4281
        # Restarted when the serving listener stops answering. Nothing else notices: the controller
        # builds the agents' addresses from the replicas' reports and the fill lease, not from pod
        # readiness, so a registry that hangs with its port open keeps being sent the cluster's pulls,
        # and each of them waits out the agent's response timeout of a minute.
        #
        # `/` on the serving port, by name. Upstream answers that path itself, ahead of the registry's
        # own handlers: 200, with no authentication and no access to the store. In front of it are
        # upstream's tracing wrapper, the module's middlewares (the client address, the token proxy,
        # settle), upstream's access log, its panic recovery and its health gate, which has no checks
        # configured here; none of them waits on the store or the upstream. HTTPS without a client
        # certificate, which the serving listener does not ask for. No host, for the same reason as
        # the readiness probe: the default is the node address, where the registry listens.
        #
        # So it catches a listener that has stopped answering, and nothing past it: a process that can
        # no longer accept a connection, finish a handshake or start a request — out of file
        # descriptors, say, or stalled as a whole. A hung handler it does not catch. Every request runs
        # on its own goroutine, so a deadlock in the registry's request path, a blob read stuck on the
        # disk or a miss stuck on the upstream leaves `/` answering 200, and the pulls that reach the
        # stuck path keep waiting out the agent's timeout with no restart.
        #
        # Not a path through those handlers instead. Each of them asks for a token first and answers
        # 401 without one, which the kubelet counts as a failure, and a token cannot be written into a
        # probe: the token service issues it signed and expiring. And the hangs most likely there are
        # the disk's and the upstream's, which a restart does not fix; the syncer is what watches the
        # store.
        #
        # Neither probe looks at the write endpoint. A registry that cannot take a push still serves
        # every pull, and restarting it for a failed push would turn that into an outage.
        livenessProbe:
          httpGet:
            path: /
            port: registry
            scheme: HTTPS
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        # The listener opens late, and legitimately so: the registry first waits for the syncer to
        # write its configuration, for as long as the API server keeps the syncer waiting, and then
        # walks the whole store to account for what it holds before admitting a single write. Both
        # happen on every start of the container, including the restart the syncer asks for on a
        # configuration change, and the walk of a large store takes minutes. Up to an hour before the
        # liveness probe takes over; a container that runs out of it restarts and waits again.
        startupProbe:
          httpGet:
            path: /
            port: registry
            scheme: HTTPS
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 360
        # Keeps serving for a while after the pod is told to go.
        #
        # The syncer beside it releases the fill lease at once, and until another full replica takes
        # the lease and the layout controller moves the nodes there, the nodes' Storage endpoint is
        # still this replica: with the lease empty the controller keeps the endpoint where it was
        # rather than send every node to whichever address sorts first. A follower tries for the
        # lease every five to eleven seconds (five with jitter), and the layouts are rewritten as
        # soon as it holds it. The agents ask nothing but that endpoint for the image set. Without
        # the wait the registry stopped in the same SIGTERM as the syncer, and in an air-gapped
        # cluster every pull failed until the agent read the new layout, up to about forty seconds
        # with its thirty-second poll.
        #
        # Twenty seconds covers the lease moving and the layouts being rewritten, so the replica
        # still serves while the nodes are moved away from it. An agent that has not read the new
        # layout by the time the registry stops reads it at once when a request here fails, so that
        # agent sees one failed request and not the rest of its poll.
        #
        # The cost is twenty seconds on every replacement of a replica, whose successor is created
        # only once this pod is gone. A node shutdown gives pods of this priority fifteen seconds in
        # all by default, which cuts the wait short there.
        lifecycle:
          preStop:
            sleep:
              seconds: 20
        volumeMounts:
        - name: config
          mountPath: /config
        - name: pki
          mountPath: /pki
        - name: data
          mountPath: /data
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" $ | nindent 12 }}
            {{- include "registry_storage_distribution_resources" $ | nindent 12 }}
      # The token service. The registry sends every client here to exchange
      # credentials for a scoped token, and fetches the token on the client's behalf
      # over the loopback address — which is why this listens on loopback only and
      # needs neither a published address nor a certificate covering one.
      #
      # Without it the registry would advertise a token endpoint that answers nowhere,
      # and every authenticated pull from the cache would fail at the exchange.
      - name: auth
        image: {{ index $images "auth" }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        args:
        - -logtostderr
        - /auth/auth_config.yaml
        # Declared although nothing outside the node reaches it, and declared for the scheduler.
        #
        # The previous implementation ran its registry on every master as the static pod
        # /etc/kubernetes/manifests/registry-nodeservices.yaml — the same file a bundle installation's
        # bootstrap registry is started from — over this same /opt/deckhouse/registry/local_data and
        # with a token service on this same 5051, which it declares. Its own manager removes that file
        # when the mode is turned off, and nothing of this implementation does. Ports of a
        # host-networked pod are the node's: while that static pod exists, this one is not scheduled
        # onto its node, and the kubelet refuses to admit it there even when the static pod's mirror is
        # missing from the API. Started beside it instead, the registry here would serve that
        # implementation's directory while it still did, and the syncer would fill and collect it.
        #
        # The registry's own port used to keep them apart, because both served on 5001. It moved
        # into the platform range and the two no longer collide there; this is what still does.
        ports:
        - name: auth
          containerPort: 5051
        livenessProbe:
          httpGet:
            path: /
            port: 5051
            scheme: HTTPS
            # Explicit, because the pod shares the host network and the default probe
            # host would be the node address, where this does not listen.
            host: 127.0.0.1
        readinessProbe:
          httpGet:
            path: /
            port: 5051
            scheme: HTTPS
            host: 127.0.0.1
        # Outlives the registry's wait by five seconds, so that the registry never serves a request
        # whose token exchange has nobody to answer it. With the same value the two would stop at
        # nearly the same moment, in no fixed order. The five seconds are added to every replacement
        # of a replica, on top of the registry's twenty.
        lifecycle:
          preStop:
            sleep:
              seconds: 25
        volumeMounts:
        - name: auth-config
          mountPath: /auth
          readOnly: true
        - name: pki
          mountPath: /pki
          readOnly: true
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" $ | nindent 12 }}
            {{- include "registry_storage_auth_resources" $ | nindent 12 }}
      # What the cluster scrapes, for both the registry and the syncer. Two upstreams
      # behind one proxy rather than two proxies: they are one pod, they are read by one
      # scraper, and the authorization decision is the same for both.
      #
      # The registry's own metrics endpoint is part of its debug listener, which also
      # serves pprof — so it binds loopback and nothing but this reaches it.
      - name: kube-rbac-proxy
        image: {{ index $images "kube-rbac-proxy" }}
        imagePullPolicy: IfNotPresent
        {{- include "helm_lib_module_container_security_context_read_only_root_filesystem_capabilities_drop_all" $ | nindent 8 }}
        args:
        - "--secure-listen-address=$(KUBE_RBAC_PROXY_LISTEN_ADDRESS):4285"
        - "--v=2"
        - "--logtostderr=true"
        - "--stale-cache-interval=1h30m"
        env:
        # The node address, because the pod shares the host network and has no address of
        # its own.
        - name: KUBE_RBAC_PROXY_LISTEN_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: KUBE_RBAC_PROXY_CONFIG
          value: |
            upstreams:
            - upstream: http://127.0.0.1:4284/metrics
              path: /metrics
              authorization:
                resourceAttributes:
                  namespace: d8-system
                  apiGroup: apps
                  apiVersion: v1
                  resource: statefulsets
                  subresource: prometheus-metrics
                  name: registry-storage
            - upstream: http://127.0.0.1:5002/metrics
              path: /registry/metrics
              authorization:
                resourceAttributes:
                  namespace: d8-system
                  apiGroup: apps
                  apiVersion: v1
                  resource: statefulsets
                  subresource: prometheus-metrics
                  name: registry-storage
        ports:
        - name: https-metrics
          containerPort: 4285
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" $ | nindent 12 }}
            {{- include "helm_lib_container_kube_rbac_proxy_resources" $ | nindent 12 }}
      # No preStop, unlike the registry and the token service: the syncer releases the fill lease on
      # SIGTERM, and a wait here would only hold the handover back by as long as theirs cover it.
      - name: syncer
        image: {{ index $images "syncer" }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        args:
        - --config-path=/config/config.yaml
        # Beside the configuration, on the writable emptyDir: /pki is a Secret mount and
        # the syncer has to be able to remove this file when the upstream stops carrying a CA.
        - --upstream-ca-path=/config/upstream-registry-ca.crt
        - --registry-process-name=registry
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # The data volume's directory on the node. The syncer sees the store only as /data, and needs
        # the node's name for it twice: its last directory is what tells a disk mounted for the store
        # from a directory of the node's own filesystem, and the whole path is what an operator has to
        # chown when the registry cannot write to it.
        - name: REGISTRY_STORE_HOST_PATH
          value: {{ $storePath }}/local_data
        # The identity of this replica's own registry, needed to fill it and to read
        # its catalogue. From the pod rather than from the custom resource: the
        # storage has to stay reachable even when the desired state cannot be read.
        - name: REGISTRY_HTTP_SECRET
          valueFrom:
            secretKeyRef:
              name: registry-storage-access
              key: http-secret
        - name: REGISTRY_TOKEN_ISSUER
          valueFrom:
            secretKeyRef:
              name: registry-storage-access
              key: token-issuer
        - name: REGISTRY_LOCAL_CA
          valueFrom:
            secretKeyRef:
              name: registry-storage-access
              key: ca.crt
        # The sync account, not the one the nodes pull with.
        #
        # This client both reads and WRITES: it fills the store from an upstream and replicates it
        # from the leader. The node account cannot write — deliberately, since it is on every node —
        # so a syncer holding it would ask for `pull,push`, be issued `pull` and have every reference
        # refused with "insufficient scope", while its status still reported that it was replicating.
        - name: REGISTRY_LOCAL_USER
          valueFrom:
            secretKeyRef:
              name: registry-storage-access
              key: sync-username
        - name: REGISTRY_LOCAL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: registry-storage-access
              key: sync-password
        volumeMounts:
        - name: config
          mountPath: /config
        - name: pki
          mountPath: /pki
        # The store, so that the garbage collection can reclaim the blobs its deletions leave
        # unreachable. The collector walks the filesystem directly, which is why reclaiming
        # cannot be done through the registry API alone.
        - name: data
          mountPath: /data
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" $ | nindent 12 }}
            {{- include "registry_storage_syncer_resources" $ | nindent 12 }}
      volumes:
      # The rendered configuration lives on an emptyDir: it is derived state,
      # rewritten by the syncer on every change, and must not survive as a stale
      # copy across a pod recreation.
      - name: config
        emptyDir: {}
      - name: pki
        secret:
          secretName: registry-storage-pki
          defaultMode: 0400
      - name: auth-config
        secret:
          secretName: registry-storage-auth-config
          defaultMode: 0400
      # The blobs live on the host, at the path the design fixes as a constant. Not
      # a persistent volume claim: the storage has to come up before any storage
      # provisioner does, since the provisioner's own images come from here.
      - name: data
        hostPath:
          path: {{ $storePath }}/local_data
          type: DirectoryOrCreate
{{- end }}
