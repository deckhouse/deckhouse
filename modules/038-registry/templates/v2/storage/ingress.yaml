{{- /*
The publication endpoint: the only way into the storage from outside the cluster, used by
`d8 mirror push`.

In air-gap as well. With no upstream the serving listener (4281) is not a cache in front of
an upstream but the store itself, and the registry serves it read-only to clients whenever
the write listener runs beside it, which in this module is always (servingConfiguration in
the docker-distribution wrapper). So a push sent straight at a node address, around this
Ingress and its `whitelistSourceRanges`, can only land on the write listener (4283), which
refuses a handshake without the ingress's or the syncer's certificate. A replica whose pod
predates that (the StatefulSet updates OnDelete) still takes a push on 4281 in air-gap until
it is replaced.

Rendered on every managed cluster, not only in air-gap.

It used to appear exactly when air-gap was asked for, which made the documented order
unwalkable: `d8 mirror push` needs this endpoint, the endpoint needed air-gap, and asking
for air-gap drops the upstream — so a bundle could never be in the store BEFORE the
transition it is meant to make safe. It also left an operator no way to put their own
modules into an ordinary cluster's store.

What makes this affordable now is that the push lands on the registry's write listener —
the same process and the same store, served without the cache in front of it (see
statefulset.yaml) — so accepting a write no longer means turning the cache off. The
ingress presents a client certificate from the module's authority: the write listener
refuses a handshake without one, and it is how the registry knows the real client address
behind the ingress rather than the controller's.

Waits for cert-manager, the same way the previous implementation's ingress does. Not a
statement about needing certificates: this module has weight 38 and cert-manager has 101,
so on the first converge of a new cluster cert-manager is not enabled yet, and the ingress
helpers refuse an https mode they cannot satisfy — loudly enough to fail the whole module
and, with it, the installation. The endpoint appears on a later converge instead.
*/ -}}
{{- if eq (include "registry_v2_caches" .) "true" }}
{{- $config := (.Values.registry.internal.v2).registryConfig | default dict }}
{{- $upstream := ($config.primary | default dict).upstream }}
{{- $pki := (.Values.registry.internal.v2).pki }}
{{- if and $pki .Values.global.modules.publicDomainTemplate (.Values.global.enabledModules | has "cert-manager") }}
---
apiVersion: v1
kind: Service
metadata:
  name: registry-push
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-storage")) | nindent 2 }}
spec:
  # A routable service, unlike the headless one the cluster pulls through: the ingress controller
  # needs an address to send a write to.
  #
  # And no selector: a push goes to the storage leader and to no other replica. The cluster reads
  # from the leader — agents ask it first, and its 404 does not fall through to the followers — and
  # replication runs from it to them, never back, so a push that landed on a follower sat in a store
  # nobody reads. The registry controller writes this Service's one EndpointSlice with the address of
  # the replica the election lease names, the same answer the agents get. With no leader it is empty,
  # and a push is refused rather than written where the cluster would not find it.
  ports:
  - name: registry-push
    # Only what the Ingress names; nothing dials the Service itself, so the number is kept as it was.
    port: 5001
    protocol: TCP
    # The write listener, not the one the cluster pulls through — that one refuses every write. A
    # number: without a selector there are no pods to resolve a port name against; the EndpointSlice
    # carries the same port.
    targetPort: 4283
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry-push
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-storage")) | nindent 2 }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    # The client certificate the write listener requires. Without it the handshake is refused
    # and every push through this endpoint fails, so the secret carries a `ca.crt` as well:
    # ingress-nginx presents the pair only from a secret that has one — see pki-secret.yaml.
    # The certificate is also what makes the registry believe the client address this ingress
    # forwards. Admission takes both: the certificate decides who may connect, the token service
    # and its ACL what the credentials may do, and the write credentials are separate from the
    # read ones.
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "d8-system/registry-storage-ingress-client"
    # The storage's certificate is not verified, as before. With the authority now in the secret
    # it could be, but that takes `proxy-ssl-name` too — nginx otherwise checks the certificate
    # against the name of its upstream block, which no certificate carries — and ingress-nginx
    # ranks that annotation high-risk. Left for a change of its own.
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    # An image layer has no meaningful size limit, and the default would reject the
    # large ones without saying why.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # Passed on as it arrives, not collected first. By default ingress-nginx reads the whole
    # request body into a temporary file on the controller's disk before it opens the upstream
    # connection, and a layer of `d8 mirror push` is one request of up to several gigabytes: that
    # is the controller pod's ephemeral storage, which can get it evicted, and a client waiting
    # for an answer while the whole layer is written twice. The write listener reads the body as
    # it comes, with no timeout on it (only on the headers).
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Idle timeouts, not limits on the transfer: nginx counts them between two successive reads
    # or writes, so a slow but steady upload of a large layer never reaches them. What they end
    # is a connection that stalls for ten minutes.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    {{- if .Values.registry.whitelistSourceRanges }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.registry.whitelistSourceRanges | join "," }}
    {{- end }}
  {{- if include "helm_lib_module_ingress_nginx_annotations_version_ge" (list $ "1.3.0") }}
    {{- if or (eq (include "helm_lib_module_https_mode" .) "CertManager") (eq (include "helm_lib_module_https_mode" .) "CustomCertificate") }}
    nginx.ingress.kubernetes.io/ingress-nginx-hsts: "true"
    {{- end }}
  {{- else }}
    {{- with (include "helm_lib_module_ingress_configuration_snippet" .) }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      {{- . | nindent 6 }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ include "helm_lib_module_ingress_class" . | quote }}
  rules:
  - host: {{ include "helm_lib_module_public_domain" (list . "registry") }}
    http:
      paths:
      - backend:
          service:
            name: registry-push
            port:
              number: 5001
        path: /
        pathType: Prefix
  {{- if (include "helm_lib_module_https_ingress_tls_enabled" .) }}
  tls:
  - hosts:
    - {{ include "helm_lib_module_public_domain" (list . "registry") }}
    secretName: {{ include "helm_lib_module_https_secret_name" (list . "registry-ingress-tls") }}
{{- if eq (include "helm_lib_module_https_mode" .) "CertManager" }}
---
# The certificate for the publish endpoint, which nothing else would ask for.
#
# An Ingress naming a TLS secret does not cause the secret to exist: in CertManager mode a module
# requests its own Certificate, and cert-manager fills the secret in. Without this the endpoint
# still serves HTTPS — with the ingress controller's own self-signed certificate — and it does so
# silently, on a cluster where every other name got a real one. That is the worst shape for it to
# be wrong in: this is the write endpoint of an air-gapped registry, reachable from outside, and
# the client that has to trust it is `d8 mirror push`.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registry-push
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-storage")) | nindent 2 }}
spec:
  certificateOwnerRef: false
  secretName: {{ include "helm_lib_module_https_secret_name" (list . "registry-ingress-tls") }}
  {{ include "helm_lib_module_generate_common_name" (list . "registry") | nindent 2 }}
  dnsNames:
  - {{ include "helm_lib_module_public_domain" (list . "registry") }}
  issuerRef:
    name: {{ include "helm_lib_module_https_cert_manager_cluster_issuer_name" . }}
    kind: ClusterIssuer
{{- end }}
  {{- end }}
{{- end }}
{{- end }}
