{{- /*
  The record that the switch to this implementation has happened.

  The gate that allows the switch asks a question about the state of the cluster at one
  moment — that the legacy implementation has let go of the pull path. That answer does
  not stay true afterwards, because the legacy state secret is left behind and keeps
  giving an answer about a cluster that has moved on. Without this record, a module
  restart would re-ask an expired question and could turn this implementation off under
  a running cluster.

  Deliberately without `helm.sh/resource-policy: keep`: setting `implementation` back to
  `Legacy` should remove it, so that switching forward again is gated again — by then the
  legacy implementation will have taken the pull path back.
*/}}
{{- if ((.Values.registry.internal).v2).enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-v2-switch
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry")) | nindent 2 }}
type: Opaque
{{- end }}
