{{- /*
  The legacy checker's state. Its own values path, written by its own hook, which is why the
  ownership condition has to be repeated here: clearing the legacy orchestrator's values does
  not clear these. See _ownership.tpl.
*/ -}}
{{- if eq (include "registry_legacy_owns_the_cluster" .) "true" -}}
{{- with .Values.registry.internal.checker -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-checker-state
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list $ (dict "app" "registry" "type" "checker-state" )) | nindent 2 }}
type: registry-checker/state
data:
  state: {{ .state | toYaml | b64enc }}
  params: {{ .params | toYaml | b64enc }}
{{- end }}
{{- end }}
