{{- $orchestrator := .Values.registry.internal.orchestrator -}}
{{- if and (($orchestrator).state).ingress_enabled (.Values.global.modules.publicDomainTemplate) (.Values.global.enabledModules | has "cert-manager") -}}
---
apiVersion: v1
kind: Service
metadata:
  name: registry-push
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry")) | nindent 2 }}
  annotations:
    registry.deckhouse.io/config-hash: {{ $orchestrator.hash | quote }}
spec:
  selector:
    component: registry-service
    type: node-services
  ports:
    - name: registry
      port: 5001
      protocol: TCP
      targetPort: distribution
{{- end }}
