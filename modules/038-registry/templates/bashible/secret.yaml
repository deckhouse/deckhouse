{{- /*
  What nodes are told about the registry.

  Written only while the controller-based implementation is active. The presence of `agent`
  in this secret is what silences the bashible step that would otherwise write per-registry
  drop-in directories under `/etc/containerd/registry.d` on every node.

  With the switch gate shut nothing renders here, and the secret keeps what it last held:
  it carries `helm.sh/resource-policy: keep`, so a release that stops rendering it does not
  delete it.
*/}}
{{- $config := "" }}
{{- if ((.Values.registry.internal).v2).enabled }}
  {{- $config = (.Values.registry.internal.v2).bashibleConfig }}
{{- end }}
{{- with $config }}
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-bashible-config
  namespace: d8-system
  annotations:
    helm.sh/resource-policy: keep
  {{- include "helm_lib_module_labels" (list $ (dict "app" "registry" "name" "registry-bashible-config")) | nindent 2 }}
data:
  config: {{ . | toYaml | b64enc }}
{{- end }}
