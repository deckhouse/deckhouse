{{- /*
  What nodes are told about the registry.

  One secret, two possible authors, and never both: the controller-based
  implementation when it is active, the legacy state machine otherwise. This is the
  single place that choice is made, and it is the choice that decides which writer owns
  `/etc/containerd/registry.d` on every node — the presence of `agent` in this secret
  is what silences the bashible step that would otherwise write per-registry drop-in
  directories there.

  Rendering both would not merge them; it would produce one secret whose content
  depended on template ordering.
*/}}
{{- $config := "" }}
{{- if ((.Values.registry.internal).v2).enabled }}
  {{- $config = (.Values.registry.internal.v2).bashibleConfig }}
{{- else }}
  {{- $config = (((.Values.registry.internal.orchestrator).state).bashible).config }}
{{- end }}
{{- with $config }}
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-bashible-config
  namespace: d8-system
  annotations:
    helm.sh/resource-policy: keep
  {{- include "helm_lib_module_labels" (list $ (dict "app" "registry" "name" "registry-bashible-config")) | nindent 2 }}
data:
  config: {{ . | toYaml | b64enc }}
{{- end }}
