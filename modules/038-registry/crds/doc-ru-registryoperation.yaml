spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Операция, которую каждая реплика кеша хранилища образов выполняет над своим хранилищем, по одной реплике за раз.

            Образы при этом продолжают отдаваться.

            Типов три:

            - `GarbageCollection` удаляет из кеша то, что оставили релизы, которые кластер уже прошёл.
            - `Verify` читает блобы хранилища и сверяет каждый с его digest: все блобы или только блобы образов из `spec.verify.digests`. Несовпадения записываются в `RegistryStorage.status.replicas[].corruptedBlobs`. Кроме того, каждая реплика примерно раз в час проверяет всё своё хранилище в фоне, поэтому `Verify` нужен, когда ответ нужен сейчас.
            - `Repair` проверяет образы из `spec.repair.digests` и заменяет их битые или недостающие блобы целыми копиями: с другой реплики кеша или, пока у кластера есть upstream, из upstream. Блоб скачивается рядом с хранилищем, сверяется с digest и только после этого встаёт на место, поэтому ни один образ не удаляется и ничего не теряется, если целой копии нигде нет. Для битых блобов, найденных репликой, модуль сам создаёт `Repair` с причиной `CorruptionDetected`.

            `Verify` и `Repair` читают с диска master не быстрее 32 МиБ/с, так что хранилище в 15 ГБ реплика проверяет примерно за восемь минут. Ни одна из них не ждёт окончания наполнения или `d8 mirror push`.

            Сборку мусора модуль создаёт сам:

            - по расписанию из `storage.garbageCollection` в настройках модуля;
            - когда кеш получил новый набор образов — после обновления Deckhouse Platform или после включения или обновления модуля;
            - когда хранилище отказывает в записи и поэтому новый набор не получит никогда — один раз на развёрнутый релиз Deckhouse Platform.

            При `storage.garbageCollection.enabled: false` модуль их не создаёт. Операция, созданная вручную, выполняется в любом случае.

            Сборку мусора реплика начинает, только когда в её хранилище ничего не пишется: пока кеш наполняется или в него загружается набор образов через `d8 mirror push`, реплика ждёт. Хранилище, которое отказывает в записи — вышло за бюджет или упёрлось в резерв места на своей файловой системе, — не ждёт: наполнение не продолжится, пока что-то не освободит место. Реплика, которая через час после принятия операции так и не взяла RegistryOperation или всё ещё ждёт своё хранилище, завершается с причиной `DeadlineExceeded`. Когда подходит очередь, реплика ещё раз проверяет хранилище: если за это время началось наполнение или загрузка, она уступает очередь и ждёт, пока запись закончится.

            Одновременно выполняется только одна операция. Операция, созданная, пока предыдущая не завершена, завершается с причиной `AnotherOperationActive`.

            Пропавшая реплика завершается с причиной `ReplicaLost`: реплика, которая собирала мусор, — если она пять минут не держит Lease `registry-storage-gc` в пространстве имён `d8-system`; реплика, которая ждала, — если её узел десять минут не в состоянии `Ready`.

            Чтобы отменить операцию, поставьте на неё лейбл `registry.deckhouse.io/cancel: "true"`. Реплика, которая ещё не начала сборку мусора, не начнёт, а реплика, которая выполняет операцию, остановится. Уже удалённое остаётся удалённым. Удаление объекта RegistryOperation тоже отменяет операцию, но реплику, которая уже начала, не останавливает.

            Завершённая операция удаляется через сутки после завершения.
          properties:
            spec:
              description: |
                После создания операции не меняется.
              properties:
                type:
                  description: |
                    Что делает операция.

                    - `GarbageCollection` — удалить из кеша то, что оставили релизы, которые кластер уже прошёл. Развёрнутый релиз, предыдущий, всё более новое и все теги, которые не являются версиями, сохраняются.
                    - `Verify` — прочитать блобы хранилища и сверить каждый с его digest. Несовпадения записываются, и их чинит `Repair`, который создаёт модуль.
                    - `Repair` — проверить образы из `spec.repair` и заменить их битые или недостающие блобы целыми копиями.
                cause:
                  description: |
                    Описание того, зачем создана операция.

                    Модуль заполняет это поле в операциях, которые создаёт сам.
                verify:
                  description: |
                    Что проверяет `Verify`. Если не задано — все блобы всех реплик.
                  properties:
                    digests:
                      description: |
                        Образы по digest манифеста или отдельные блобы по их digest. Образ проверяется вместе со всеми блобами, из которых он состоит. Пустой список — все блобы хранилища.

                        Digest образов показывает `kubectl get registryimages`.
                    nodes:
                      description: |
                        На каких репликах выполнять, по именам узлов. Пустой список — на всех. Операция, в которой указан узел без реплики кеша, завершается с причиной `UnknownNode`.
                repair:
                  description: |
                    Что чинит `Repair`. Обязательно для `Repair`.
                  properties:
                    digests:
                      description: |
                        Образы по digest манифеста или отдельные блобы по их digest. Образ чинится вместе со всеми блобами, из которых он состоит.

                        Digest образов показывает `kubectl get registryimages`, битые блобы — `RegistryStorage.status.replicas[].corruptedBlobs`.
                    nodes:
                      description: |
                        На каких репликах выполнять, по именам узлов. Пустой список — на всех. Операция, в которой указан узел без реплики кеша, завершается с причиной `UnknownNode`.
            status:
              properties:
                phase:
                  description: |
                    Фаза выполнения операции:

                    - `Pending` — ни одна реплика ещё не начала.
                    - `Running` — хотя бы одна реплика начала, и не все закончили.
                    - `Succeeded` — все реплики выполнили операцию.
                    - `Failed` — операция отклонена или какая-то реплика её не выполнила.
                    - `Canceled` — операция отменена до того, как все реплики закончили.
                reason:
                  description: |
                    Машиночитаемая причина фазы:

                    - `Pending`: `Accepted`.
                    - `Running`: `InProgress`.
                    - `Succeeded`: `Completed`.
                    - `Failed`: `NoCache` (кеш выключен), `NoReplicas` (ни одна реплика хранилища ещё не отчиталась), `AnotherOperationActive`, `UnknownNode` (в `nodes` указан узел без реплики), `ReplicaFailed`.
                    - `Canceled`: `Canceled`.
                message:
                  description: |
                    Человекочитаемое пояснение причины.
                acceptedAt:
                  description: |
                    Когда операция принята.
                deadline:
                  description: |
                    Когда реплика, которую держит запись в хранилище, прекращает ждать. Через час после `acceptedAt`.
                startedAt:
                  description: |
                    Когда первая реплика начала.
                finishedAt:
                  description: |
                    Когда операция перешла в конечную фазу. Через сутки после этого она удаляется.
                garbageCollection:
                  description: |
                    Что удалила операция `GarbageCollection`, в сумме по репликам.
                  properties:
                    removedManifests:
                      description: |
                        Сколько образов удалено по sha — тех, что наполнение пишет без тега и что составляет почти весь объём хранилища.
                    removedBlobs:
                      description: |
                        Сколько блобов удалила очистка — по подсчёту самого хранилища образов контейнеров.

                        Очистка удаляет и то, что не смогла удалить предыдущая, поэтому эти блобы не обязательно относятся к образам, удалённым в этом проходе. Нет значения, если очистка не запускалась.
                    removedVersions:
                      description: |
                        Удалённые релизы Deckhouse Platform.
                    reclaimedBytes:
                      description: |
                        На сколько байт уменьшилось хранилище: блобы и незавершённые загрузки, измеренные до сборки и после.

                        Нет значения, если хранилище не удалось измерить.
                replicas:
                  description: |
                    По одной записи на каждую реплику, которой передана операция.

                    Включаются все реплики хранилища, отчитавшиеся к моменту принятия операции.
                  items:
                    properties:
                      node:
                        description: |
                          Узел, на котором работает реплика.
                      phase:
                        description: |
                          На какой фазе находится реплика:

                          - `Pending` — реплика ещё не взяла операцию.
                          - `Waiting` — реплика ждёт; что её держит, указано в `reason`.
                          - `Running` — реплика выполняет операцию.
                          - `Succeeded` — реплика выполнила операцию.
                          - `Failed` — реплика не выполнила операцию.
                          - `Skipped` — реплика ушла из хранилища до начала.
                          - `Canceled` — операция отменена до того, как реплика закончила.
                      reason:
                        description: |
                          Машиночитаемая причина фазы:

                          - `Waiting`: `Filling` (кеш наполняется), `Pushing` (загружается набор образов через `d8 mirror push`), `Turn` (операцию выполняет другая реплика; или реплика прождала очередь целое окно и ждёт, пока в хранилище перестанут писать, чтобы встать в очередь снова).
                          - `Failed`: `OperationFailed` (для `Repair` — в том числе когда какой-то digest не удалось починить), `DeadlineExceeded` (к моменту `deadline` реплика не взяла операцию или в её хранилище всё ещё писали), `TimedOut` (реплика не сообщила результат за 24 часа), `ReplicaLost` (реплика пропала: перестала держать Lease сборки мусора во время сборки или её узел десять минут не был в состоянии `Ready`, пока она ждала).
                          - `Skipped`: `ReplicaGone`, `NoCache`.
                          - `Canceled`: `Canceled`.
                      message:
                        description: |
                          Человекочитаемое пояснение причины.
                      startedAt:
                        description: |
                          Когда реплика начала.
                      finishedAt:
                        description: |
                          Когда реплика закончила.
                      garbageCollection:
                        description: |
                          Что операция `GarbageCollection` удалила из хранилища реплики.
                        properties:
                          removedManifests:
                            description: |
                              Сколько образов удалено по sha — тех, что наполнение пишет без тега и что составляет почти весь объём хранилища.
                          removedBlobs:
                            description: |
                              Сколько блобов удалила очистка — по подсчёту самого хранилища образов контейнеров.

                              Очистка удаляет и то, что не смогла удалить предыдущая, поэтому эти блобы не обязательно относятся к образам, удалённым в этом проходе. Нет значения, если очистка не запускалась.
                          removedVersions:
                            description: |
                              Удалённые релизы Deckhouse Platform.
                          reclaimedBytes:
                            description: |
                              На сколько байт уменьшилось хранилище реплики: блобы и незавершённые загрузки, измеренные до сборки и после.

                              Нет значения, если хранилище не удалось измерить.
                      verify:
                        description: |
                          Что `Verify` нашла на реплике.
                        properties:
                          checkedBlobs:
                            description: Сколько блобов прочитано и сверено с digest.
                          checkedBytes:
                            description: Сколько байт прочитано.
                          corruptedBlobs:
                            description: Блобы, содержимое которых не совпадает с digest, по порядку, не больше 50.
                          corruptedCount:
                            description: Сколько битых блобов найдено, включая не попавшие в список.
                          missingDigests:
                            description: Digest из запроса, которых у реплики нет ни как образа, ни как блоба.
                      repair:
                        description: |
                          Что `Repair` сделала на реплике.
                        properties:
                          digests:
                            description: По записи на каждый digest операции.
                            items:
                              properties:
                                digest:
                                  description: Digest из операции.
                                outcome:
                                  description: |
                                    Что сделано.

                                    - `Intact` — все блобы совпадают с digest, ничего не менялось.
                                    - `Repaired` — битые или недостающие блобы заменены целыми копиями.
                                    - `NotHeld` — у реплики нет ни образа, ни блоба с этим digest.
                                    - `Failed` — блоб не удалось заменить, причина в `message`. Блоб остался как был.
                                repairedBlobs:
                                  description: Сколько блобов заменено.
                                message:
                                  description: Почему не удалось или откуда взяты целые копии.
