spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Операция, которую каждая реплика кеша хранилища образов выполняет над своим хранилищем, по одной реплике за раз.

            Образы при этом продолжают отдаваться.

            Тип пока один — `GarbageCollection`: удалить из кеша то, что оставили релизы, которые кластер уже прошёл. Модуль создаёт такие операции сам:

            - по расписанию из `storage.garbageCollection` в настройках модуля;
            - когда кеш получил новый набор образов — после обновления Deckhouse Platform или после включения или обновления модуля;
            - когда хранилище отказывает в записи и поэтому новый набор не получит никогда — один раз на развёрнутый релиз Deckhouse Platform.

            При `storage.garbageCollection.enabled: false` модуль их не создаёт. Операция, созданная вручную, выполняется в любом случае.

            Реплика начинает сборку мусора, только когда в её хранилище ничего не пишется: пока кеш наполняется или в него загружается набор образов через `d8 mirror push`, реплика ждёт. Хранилище, которое отказывает в записи — вышло за бюджет или упёрлось в резерв места на узле, — не ждёт: наполнение не продолжится, пока что-то не освободит место. Реплика, которая через час после принятия операции так и не взяла RegistryOperation или всё ещё ждёт своё хранилище, завершается с причиной `DeadlineExceeded`. Когда подходит очередь, реплика ещё раз проверяет хранилище: если за это время началось наполнение или загрузка, она уступает очередь и ждёт, пока запись закончится.

            Одновременно выполняется только одна операция. Операция, созданная, пока предыдущая не завершена, завершается с причиной `AnotherOperationActive`.

            Пропавшая реплика завершается с причиной `ReplicaLost`: реплика, которая собирала мусор, — если она пять минут не держит Lease `registry-storage-gc` в пространстве имён `d8-system`; реплика, которая ждала, — если её узел десять минут не в состоянии `Ready`.

            Чтобы отменить операцию, поставьте на неё лейбл `registry.deckhouse.io/cancel: "true"`. Реплика, которая ещё не начала сборку мусора, не начнёт, а реплика, которая выполняет операцию, остановится. Уже удалённое остаётся удалённым. Удаление объекта RegistryOperation тоже отменяет операцию, но реплику, которая уже начала, не останавливает.

            Завершённая операция удаляется через сутки после завершения.
          properties:
            spec:
              description: |
                После создания операции не меняется.
              properties:
                type:
                  description: |
                    Что делает операция.

                    - `GarbageCollection` — удалить из кеша то, что оставили релизы, которые кластер уже прошёл. Развёрнутый релиз, предыдущий, всё более новое и все теги, которые не являются версиями, сохраняются.
                cause:
                  description: |
                    Описание того, зачем создана операция.

                    Модуль заполняет это поле в операциях, которые создаёт сам.
            status:
              properties:
                phase:
                  description: |
                    Фаза выполнения операции:

                    - `Pending` — ни одна реплика ещё не начала.
                    - `Running` — хотя бы одна реплика начала, и не все закончили.
                    - `Succeeded` — все реплики выполнили операцию.
                    - `Failed` — операция отклонена или какая-то реплика её не выполнила.
                    - `Canceled` — операция отменена до того, как все реплики закончили.
                reason:
                  description: |
                    Машиночитаемая причина фазы:

                    - `Pending`: `Accepted`.
                    - `Running`: `InProgress`.
                    - `Succeeded`: `Completed`.
                    - `Failed`: `NoCache` (кеш выключен), `NoReplicas` (ни одна реплика хранилища ещё не отчиталась), `AnotherOperationActive`, `ReplicaFailed`.
                    - `Canceled`: `Canceled`.
                message:
                  description: |
                    Человекочитаемое пояснение причины.
                acceptedAt:
                  description: |
                    Когда операция принята.
                deadline:
                  description: |
                    Когда реплика, которую держит запись в хранилище, прекращает ждать. Через час после `acceptedAt`.
                startedAt:
                  description: |
                    Когда первая реплика начала.
                finishedAt:
                  description: |
                    Когда операция перешла в конечную фазу. Через сутки после этого она удаляется.
                garbageCollection:
                  description: |
                    Что удалила операция `GarbageCollection`, в сумме по репликам.
                  properties:
                    removedManifests:
                      description: |
                        Сколько образов удалено по sha — тех, что наполнение пишет без тега и что составляет почти весь объём хранилища.
                    removedBlobs:
                      description: |
                        Сколько блобов удалила очистка — по подсчёту самого хранилища образов контейнеров.

                        Очистка удаляет и то, что не смогла удалить предыдущая, поэтому эти блобы не обязательно относятся к образам, удалённым в этом проходе. Нет значения, если очистка не запускалась.
                    removedVersions:
                      description: |
                        Удалённые релизы Deckhouse Platform.
                    reclaimedBytes:
                      description: |
                        На сколько байт уменьшилось хранилище: блобы и незавершённые загрузки, измеренные до сборки и после.

                        Нет значения, если хранилище не удалось измерить.
                replicas:
                  description: |
                    По одной записи на каждую реплику, которой передана операция.

                    Включаются все реплики хранилища, отчитавшиеся к моменту принятия операции.
                  items:
                    properties:
                      node:
                        description: |
                          Узел, на котором работает реплика.
                      phase:
                        description: |
                          На какой фазе находится реплика:

                          - `Pending` — реплика ещё не взяла операцию.
                          - `Waiting` — реплика ждёт; что её держит, указано в `reason`.
                          - `Running` — реплика выполняет операцию.
                          - `Succeeded` — реплика выполнила операцию.
                          - `Failed` — реплика не выполнила операцию.
                          - `Skipped` — реплика ушла из хранилища до начала.
                          - `Canceled` — операция отменена до того, как реплика закончила.
                      reason:
                        description: |
                          Машиночитаемая причина фазы:

                          - `Waiting`: `Filling` (кеш наполняется), `Pushing` (загружается набор образов через `d8 mirror push`), `Turn` (операцию выполняет другая реплика; или реплика прождала очередь целое окно и ждёт, пока в хранилище перестанут писать, чтобы встать в очередь снова).
                          - `Failed`: `OperationFailed`, `DeadlineExceeded` (к моменту `deadline` реплика не взяла операцию или в её хранилище всё ещё писали), `TimedOut` (реплика не сообщила результат за 24 часа), `ReplicaLost` (реплика пропала: перестала держать Lease сборки мусора во время сборки или её узел десять минут не был в состоянии `Ready`, пока она ждала).
                          - `Skipped`: `ReplicaGone`, `NoCache`.
                          - `Canceled`: `Canceled`.
                      message:
                        description: |
                          Человекочитаемое пояснение причины.
                      startedAt:
                        description: |
                          Когда реплика начала.
                      finishedAt:
                        description: |
                          Когда реплика закончила.
                      garbageCollection:
                        description: |
                          Что операция `GarbageCollection` удалила из хранилища реплики.
                        properties:
                          removedManifests:
                            description: |
                              Сколько образов удалено по sha — тех, что наполнение пишет без тега и что составляет почти весь объём хранилища.
                          removedBlobs:
                            description: |
                              Сколько блобов удалила очистка — по подсчёту самого хранилища образов контейнеров.

                              Очистка удаляет и то, что не смогла удалить предыдущая, поэтому эти блобы не обязательно относятся к образам, удалённым в этом проходе. Нет значения, если очистка не запускалась.
                          removedVersions:
                            description: |
                              Удалённые релизы Deckhouse Platform.
                          reclaimedBytes:
                            description: |
                              На сколько байт уменьшилось хранилище реплики: блобы и незавершённые загрузки, измеренные до сборки и после.

                              Нет значения, если хранилище не удалось измерить.
