spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Объявляет хранилище образов контейнеров рядом с группой узлов, в котором лежит копия основного набора образов. Выбранные узлы загружают образы из него, а не из хранилища в кластере или upstream.

            Предназначен для узлов, далёких от control plane, например для рабочих узлов в другом регионе, которые загружают большие образы через медленный или дорогой канал. Зеркало разворачивает и наполняет администратор: проект proxy-cache или репликации в Harbor, хранилище, наполненное через `d8 mirror push`, или любое другое хранилище, отдающее набор образов по дайджесту. Кластер решает только, какие узлы обращаются к зеркалу и за каким образом.

            Агент на выбранном узле запрашивает у зеркала только манифесты и слои по дайджесту. Теги разрешаются там же, где и без зеркала, поэтому какая версия запускается, по-прежнему решает кластер. Любой ответ зеркала, кроме самого содержимого (промах, отказ, ошибка сервера, отсутствие ответа), отправляет запрос дальше в хранилище в кластере или в upstream, как и без зеркала. Содержимое, не совпавшее с дайджестом, не передаётся, и агент на час перестаёт запрашивать этот дайджест по этому адресу зеркала.

            Узел обслуживает не более одного зеркала. Объекты принимаются в порядке создания, начиная с созданного раньше всех. Объект, который выбирает узел, уже обслуживаемый более ранним объектом, не принимается совсем, ни на одном из выбранных им узлов. Сообщение его условия `Accepted` называет этот узел и объект, который его обслуживает.

            Применяется только в режиме `Managed` модуля, когда загрузки образов на узлах обслуживает агент registry. В остальных режимах контроллер, который пишет `status`, не работает, поэтому в `status` остаётся последнее записанное значение, включая `Accepted=True` и число узлов, хотя ни один узел зеркало не применяет.
          properties:
            spec:
              properties:
                nodeSelector:
                  description: |
                    Узлы, которые обращаются к зеркалу в первую очередь, выбранные по меткам.

                    Пустой селектор не выбирает ни одного узла, но всё равно принимается, а `status.matchedNodes` равен нулю: группа узлов, отмасштабированная в ноль, получит зеркало, когда в ней появятся узлы.
                  properties:
                    matchLabels:
                      description: |
                        Метки и их значения. Узел выбирается, если у него есть каждая из перечисленных меток с указанным значением.
                    matchExpressions:
                      description: |
                        Требования к меткам, которым должен соответствовать узел.
                      items:
                        properties:
                          key:
                            description: |
                              Имя метки.
                          operator:
                            description: |
                              Метод сравнения с `values`.
                          values:
                            description: |
                              Значения метки. Обязательны для `In` и `NotIn`, пусты для `Exists` и `DoesNotExist`.
                source:
                  description: |
                    Зеркало: где оно находится, под каким префиксом отдаёт набор образов и как к нему аутентифицироваться.

                    Префикс заменяет собственный префикс набора: образ, который кластер называет `registry.d8-system.svc:5001/system/deckhouse/<repository>@<digest>`, запрашивается у зеркала как `<host>/<path>/<repository>@<digest>`.
                  properties:
                    scheme:
                      description: |
                        Протокол подключения к зеркалу.
                    host:
                      description: |
                        Адрес зеркала. При необходимости указывается с портом.

                        IPv6-адрес записывается в квадратных скобках, после которых указывается порт.
                    path:
                      description: |
                        Префикс, под которым зеркало отдаёт набор образов. Обязательный параметр, т.к. образ встроенного модуля называет префикс набора своим репозиторием целиком, поэтому у зеркала, отдающего набор из корня, такой образ запросить нельзя.

                        Для проекта proxy-cache в Harbor, настроенного на `registry.deckhouse.io`, это имя проекта и путь редакции, например `/<project>/deckhouse/ee`. Для проекта, наполненного командой `d8 mirror push <bundle> harbor.example.com/<project>/<path>`, это `/<project>/<path>`.
                    ca:
                      description: |
                        PEM-сертификат удостоверяющего центра для проверки зеркала при использовании HTTPS-подключения.

                        Принимаются только блоки `CERTIFICATE`, и в каждом должен быть корректный сертификат X.509. Если в поле есть блок другого типа, например закрытый ключ, или сертификат, который не удаётся прочитать, зеркало не принимается: `Accepted=False` с причиной `InvalidSpec`.
                    auth:
                      description: |
                        Ключи доступа к зеркалу. Достаточно доступа на чтение.

                        Без ключей обращение к зеркалу будет анонимным. Если зеркало требует токен, как публичный проект в Harbor, агент получит анонимный токен. Учётные данные из `imagePullSecrets` подов зеркалу не передаются.

                        Чувствительные данные контроллер переносит в секрет модуля, и узлы, для которых настроено зеркало, читают их из этого секрета.
                      properties:
                        username:
                          description: |
                            Имя пользователя для базовой аутентификации.
                        password:
                          description: |
                            Пароль для базовой аутентификации.

                            Если у вызывающей стороны нет прав на подресурс `registrymirrors/sensitive`, API возвращает `<omitted>` вместо значения.
                        auth:
                          description: |
                            Закодированное значение `"username:password"` в Base64.

                            Имеет приоритет над `username` и `password`. Если заданы обе формы, они должны указывать одни и те же ключи доступа.

                            Если у вызывающей стороны нет прав на подресурс `registrymirrors/sensitive`, API возвращает `<omitted>` вместо значения.
                    mirrors:
                      description: |
                        Другие адреса, отдающие то же содержимое, что и зеркало. Опрашиваются по порядку после основого зеркала.
                      items:
                        properties:
                          scheme:
                            description: |
                              Протокол подключения к адресу.
                          host:
                            description: |
                              Адрес зеркала. При необходимости указывается с портом.

                              IPv6-адрес записывается в квадратных скобках, после которых указывается порт.
                          path:
                            description: |
                              Префикс, под которым отдаётся набор образов. Обязателен, как и `source.path`.
                          ca:
                            description: |
                              PEM-сертификат удостоверяющего центра для проверки адреса.
                          auth:
                            description: |
                              Ключи доступа к адресу.

                              Чувствительные данные контроллер переносит в секрет модуля, и узлы, для которых настроено зеркало, читают их из этого секрета.
                            properties:
                              username:
                                description: |
                                  Имя пользователя для базовой аутентификации.
                              password:
                                description: |
                                  Пароль для базовой аутентификации.

                                  Если у вызывающей стороны нет прав на подресурс `registrymirrors/sensitive`, API возвращает `<omitted>` вместо значения.
                              auth:
                                description: |
                                  Закодированное значение `"username:password"` в Base64.

                                  Если у вызывающей стороны нет прав на подресурс `registrymirrors/sensitive`, API возвращает `<omitted>` вместо значения.
            status:
              properties:
                observedGeneration:
                  description: |
                    Поколение `spec`, которое контроллер обработал последним.
                matchedNodes:
                  description: |
                    Количество узлов, для которых настроено зеркало. Значение равно нулю, пока объект не принят.
                conditions:
                  description: |
                    Результат арбитража с машиночитаемой причиной.

                    - `Accepted` — настроено ли зеркало для выбранных им узлов. Причина `NodeConflict` означает, что выбранный узел обслуживает более ранний объект, `InvalidSpec` — что поле в `spec` задано неверно.
                  items:
                    properties:
                      type:
                        description: |
                          Тип условия.
                      status:
                        description: |
                          Статус условия.
                      observedGeneration:
                        description: |
                          Поколение `spec`, для которого установлено условие.
                      lastTransitionTime:
                        description: |
                          Время последнего изменения условия.
                      reason:
                        description: |
                          Машиночитаемая причина условия.
                      message:
                        description: |
                          Пояснение для человека.
