spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает полную выкладку registry для одного узла, скомпилированную для его агента.

            По одному объекту на узел, имя совпадает с именем узла, `ownerReference` указывает на него. Объект пишет контроллер registry; `status` пишет только агент.

            Объект намеренно **плоский и самодостаточный**: ключи, сертификаты удостоверяющих центров и маршруты лежат внутри, без ссылок на другие объекты. Агент держит полную копию на диске и продолжает отдавать образы по ней при недоступном API-сервере — а в этот момент разыменовывать уже нечего. По той же причине контроллер компилирует все принятые [RegistryUpstream](cr.html#registryupstream) в `spec.additionalRoutes`, вместо того чтобы агент следил за N объектами: согласованность многих объектов при недоступном API гарантировать нельзя.

            Объект **не содержит per-node секретов**. Всё в нём — глобальная конфигурация, одинаковая на каждом узле. Именно поэтому его безопасно читать всей группе `system:nodes`, через которую агент получает доступ по kubeconfig кублета.
          properties:
            spec:
              properties:
                cache:
                  description: |
                    Ось кэша для этого узла.

                    `true` — агент идёт во внутрикластерное хранилище, `false` — напрямую в Primary upstream.
                backends:
                  description: |
                    Источники **основного** набора образов, по приоритету.

                    При включённом кэше это хранилище, а за ним upstream как запасной путь, пока кэш наполняется; запись upstream уходит из выкладки, когда кластер уходит в air-gap. При выключенном кэше — только upstream.
                  items:
                    properties:
                      name:
                        description: |
                          Роль бэкенда.

                          - `Storage` — внутрикластерный кэш.
                          - `Upstream` — Primary upstream: либо единственный бэкенд, либо запасной путь, пока наполняется кэш.
                      scheme:
                        description: |
                          Протокол подключения к бэкенду.
                      host:
                        description: |
                          Хост бэкенда, опционально с портом.
                      path:
                        description: |
                          Префикс пути к репозиторию внутри бэкенда.
                      ca:
                        description: |
                          PEM-сертификат удостоверяющего центра для проверки бэкенда.
                      auth:
                        description: |
                          Где хранятся ключи доступа к этому эндпоинту.

                          Указаны ссылкой, а не значением. Ресурс кластерного уровня, а роль узлового агента привязана к группе `system:nodes`, поэтому ключ, записанный здесь, был бы доступен через API kubelet'у любого узла — включая ключи к registry, откуда этот узел ничего не тянет. Компонент, который это читает, разрешает ссылку один раз и сохраняет результат, поэтому продолжает работать и при недоступном API-сервере.
                        properties:
                          secretRef:
                            description: |
                              Secret с ключами доступа и ключ внутри него.
                            properties:
                              name:
                                description: |
                                  Имя Secret'а в пространстве имён `d8-system`.
                              key:
                                description: |
                                  Ключ внутри него. Один Secret содержит все разрешённые модулем ключи доступа, по принадлежности.
                      mirrors:
                        description: |
                          Дополнительные адреса, отдающие тот же контент; используются при отказе.
                        items:
                          properties:
                            scheme:
                              description: |
                                Протокол подключения к зеркалу.
                            host:
                              description: |
                                Хост зеркала, опционально с портом.
                            path:
                              description: |
                                Префикс пути к репозиторию внутри зеркала.
                            ca:
                              description: |
                                PEM-сертификат удостоверяющего центра для проверки зеркала.
                            auth:
                              description: |
                                Где хранятся ключи доступа к этому эндпоинту.

                                Указаны ссылкой, а не значением. Ресурс кластерного уровня, а роль узлового агента привязана к группе `system:nodes`, поэтому ключ, записанный здесь, был бы доступен через API kubelet'у любого узла — включая ключи к registry, откуда этот узел ничего не тянет. Компонент, который это читает, разрешает ссылку один раз и сохраняет результат, поэтому продолжает работать и при недоступном API-сервере.
                              properties:
                                secretRef:
                                  description: |
                                    Secret с ключами доступа и ключ внутри него.
                                  properties:
                                    name:
                                      description: |
                                        Имя Secret'а в пространстве имён `d8-system`.
                                    key:
                                      description: |
                                        Ключ внутри него. Один Secret содержит все разрешённые модулем ключи доступа, по принадлежности.
                additionalRoutes:
                  description: |
                    Принятые объекты [RegistryUpstream](cr.html#registryupstream), скомпилированные контроллером.

                    Всегда транзит, никогда не кэшируется: агент проксирует загрузку и передаёт её потоком, не записывая на диск.
                  items:
                    properties:
                      match:
                        description: |
                          Хост registry, который перехватывается на этом узле.
                      scheme:
                        description: |
                          Протокол подключения к upstream.
                      host:
                        description: |
                          Хост upstream, опционально с портом.
                      path:
                        description: |
                          Префикс пути к репозиторию внутри upstream.
                      ca:
                        description: |
                          PEM-сертификат удостоверяющего центра для проверки upstream.
                      auth:
                        description: |
                          Где хранятся ключи доступа к этому эндпоинту.

                          Указаны ссылкой, а не значением. Ресурс кластерного уровня, а роль узлового агента привязана к группе `system:nodes`, поэтому ключ, записанный здесь, был бы доступен через API kubelet'у любого узла — включая ключи к registry, откуда этот узел ничего не тянет. Компонент, который это читает, разрешает ссылку один раз и сохраняет результат, поэтому продолжает работать и при недоступном API-сервере.
                        properties:
                          secretRef:
                            description: |
                              Secret с ключами доступа и ключ внутри него.
                            properties:
                              name:
                                description: |
                                  Имя Secret'а в пространстве имён `d8-system`.
                              key:
                                description: |
                                  Ключ внутри него. Один Secret содержит все разрешённые модулем ключи доступа, по принадлежности.
                      mirrors:
                        description: |
                          Дополнительные адреса, отдающие тот же контент.
                        items:
                          properties:
                            scheme:
                              description: |
                                Протокол подключения к зеркалу.
                            host:
                              description: |
                                Хост зеркала, опционально с портом.
                            path:
                              description: |
                                Префикс пути к репозиторию внутри зеркала.
                            ca:
                              description: |
                                PEM-сертификат удостоверяющего центра для проверки зеркала.
                            auth:
                              description: |
                                Где хранятся ключи доступа к этому эндпоинту.

                                Указаны ссылкой, а не значением. Ресурс кластерного уровня, а роль узлового агента привязана к группе `system:nodes`, поэтому ключ, записанный здесь, был бы доступен через API kubelet'у любого узла — включая ключи к registry, откуда этот узел ничего не тянет. Компонент, который это читает, разрешает ссылку один раз и сохраняет результат, поэтому продолжает работать и при недоступном API-сервере.
                              properties:
                                secretRef:
                                  description: |
                                    Secret с ключами доступа и ключ внутри него.
                                  properties:
                                    name:
                                      description: |
                                        Имя Secret'а в пространстве имён `d8-system`.
                                    key:
                                      description: |
                                        Ключ внутри него. Один Secret содержит все разрешённые модулем ключи доступа, по принадлежности.
            status:
              description: |
                Пишет только агент; сообщает факты со стороны containerd.

                Полноты хранилища здесь нет: это свойство хранилища, и живёт оно в [RegistryStorage](cr.html#registrystorage) `.status.replicas`. Любой узел может пропатчить `status` любого `RegistryNode`, поскольку RBAC не умеет ограничивать `list`/`watch` по field selector, — поэтому ничто здесь не является несущим для пути загрузки, это наблюдаемость.
              properties:
                observedGeneration:
                  description: |
                    Поколение `spec`, которое агент применил последним.
                reconciled:
                  description: |
                    Применил ли агент тот spec, который видит сейчас.
                proxyListening:
                  description: |
                    Отдаёт ли агент endpoint registry.
                activeBackends:
                  description: |
                    Бэкенды, которыми агент может пользоваться в данный момент.
                staleStorageDataBytes:
                  description: |
                    Сколько данных внутрикластерного кэша всё ещё лежит на этом узле, при том что кэш не настроен.

                    Блобы остаются намеренно: если кэш включить обратно, он дольётся из того, что уже есть, а не с нуля, и на медленном канале это разница в часы. Недопустимо было бы оставлять их молча — про занятое ими место больше не сказал бы никто, потому что хранилище, которое их записало, уже удалено. Поэтому агент их измеряет, а алерт об этом сообщает.

                    Чтобы освободить место, удалите `/opt/deckhouse/registry` на узле. Поля нет, пока кэш настроен, и на узле, где кэша никогда не было.
                conditions:
                  description: |
                    Детальное состояние, которое сообщает агент.

                    - `Reconciled` — применён ли spec. Причина отличает штатное согласование от применения по дисковой копии из-за недоступности API-сервера.
                  items:
                    properties:
                      type:
                        description: |
                          Тип состояния.
                      status:
                        description: |
                          Значение состояния.
                      observedGeneration:
                        description: |
                          Поколение `spec`, для которого выставлено состояние.
                      lastTransitionTime:
                        description: |
                          Время последнего изменения состояния.
                      reason:
                        description: |
                          Машиночитаемая причина состояния.
                      message:
                        description: |
                          Пояснение для человека.
