apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: registryoperations.deckhouse.io
  labels:
    heritage: deckhouse
    module: registry
spec:
  group: deckhouse.io
  scope: Cluster
  names:
    plural: registryoperations
    singular: registryoperation
    kind: RegistryOperation
    shortNames:
      - rop
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      # Lets an operator or a UI select by type or phase; field selectors on custom resources need these.
      selectableFields:
        - jsonPath: .spec.type
        - jsonPath: .status.phase
      additionalPrinterColumns:
        - name: Type
          type: string
          description: "What the operation does."
          jsonPath: .spec.type
        - name: Phase
          type: string
          description: "Where the operation is."
          jsonPath: .status.phase
        - name: Reason
          type: string
          description: "Why the operation is in its phase."
          jsonPath: .status.reason
        - name: Cause
          type: string
          description: "Why the operation was created."
          jsonPath: .spec.cause
          priority: 1
        - name: Started
          type: date
          description: "When the first replica started."
          jsonPath: .status.startedAt
        - name: Finished
          type: date
          description: "When the operation finished."
          jsonPath: .status.finishedAt
        - name: Reclaimed
          type: integer
          description: "How many bytes a garbage collection freed."
          jsonPath: .status.garbageCollection.reclaimedBytes
          priority: 1
        - name: Age
          type: date
          description: "Time since creation."
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: |
            An operation every replica of the registry cache performs on its own store, one replica at a time.

            Images keep being served throughout.

            Three types:

            - `GarbageCollection` removes from the cache what the releases the cluster has moved past left there.
            - `Verify` reads blobs of the store and compares each with its digest: every blob, or those of the images named in `spec.verify.digests`. What does not match is recorded in `RegistryStorage.status.replicas[].corruptedBlobs`. Besides, every replica checks its whole store in the background about once an hour, so a `Verify` is for when an answer is wanted now.
            - `Repair` checks the images named in `spec.repair.digests` and replaces their broken or missing blobs with whole copies, taken from another replica of the cache or, while the cluster has an upstream, from the upstream. A blob is downloaded beside the store, checked against its digest and only then put in place, so no image is removed and nothing is lost if no whole copy is found. The module creates a `Repair` itself for the broken blobs a replica finds, with the cause `CorruptionDetected`.

            `Verify` and `Repair` read at most 32 MiB/s from the disk of a master, so a store of 15 GB takes a replica about eight minutes. Neither waits for a fill or a `d8 mirror push` to finish.

            The module creates garbage collections itself:

            - on the schedule set in `storage.garbageCollection` of the module configuration;
            - once the cache holds a new image set — after a Deckhouse Platform update, or after a module is enabled or updated;
            - when the store refuses writes and so can never take in a new set — once per deployed Deckhouse Platform release.

            With `storage.garbageCollection.enabled: false` the module creates none of them. An operation created by hand runs either way.

            A garbage collection starts on a replica only when its store is not being written to: while the cache is being filled or an image set is being pushed with `d8 mirror push`, the replica waits. A store that refuses writes — over its budget, or down to the space kept free on its filesystem — is not waited for: a fill cannot go on until something frees room. A replica that has not picked the operation up, or is still held back by its store, an hour after the operation was accepted fails with the reason `DeadlineExceeded`. Once its turn comes, a replica looks at its store again: if a fill or a push has started meanwhile, it gives the turn back and waits for the store to go quiet.

            Only one operation runs at a time. An operation created while an older one is not finished fails with the reason `AnotherOperationActive`.

            A replica that is gone fails with the reason `ReplicaLost`: one that was collecting, when it has not held the Lease `registry-storage-gc` in the `d8-system` namespace for five minutes; one that was waiting, when its node has not been `Ready` for ten minutes.

            To cancel an operation, set the label `registry.deckhouse.io/cancel: "true"` on it. A replica that has not started does not start, and a replica that is running stops. What it has already removed stays removed. Deleting the object cancels an operation too, but does not stop a replica that has already started.

            A finished operation is deleted a day after it finished.
          x-doc-examples:
            - |
              ```yaml
              apiVersion: deckhouse.io/v1alpha1
              kind: RegistryOperation
              metadata:
                generateName: gc-manual-
              spec:
                type: GarbageCollection
                cause: Free space before pushing a new release.
              ```
            - |
              ```yaml
              apiVersion: deckhouse.io/v1alpha1
              kind: RegistryOperation
              metadata:
                generateName: verify-
              spec:
                type: Verify
                cause: Check the cache after a disk failure on master-1.
                verify:
                  nodes: ["master-1"]
              ```
            - |
              ```yaml
              apiVersion: deckhouse.io/v1alpha1
              kind: RegistryOperation
              metadata:
                generateName: repair-
              spec:
                type: Repair
                repair:
                  digests: ["sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]
              ```
          required:
            - spec
          properties:
            spec:
              type: object
              description: |
                Does not change once the operation is created.
              required:
                - type
              x-kubernetes-validations:
                # Every field by name: a field added to the spec has to be added here too. Spelled with
                # has() rather than optional equality, as in NodeOperation: comparing optionals loses the
                # maxLength bound, and the rule's estimated cost exceeds the CRD budget — the API server
                # refuses the CRD, and the module never becomes ready.
                - rule: >-
                    self.type == oldSelf.type &&
                    has(self.cause) == has(oldSelf.cause) &&
                    (!has(self.cause) || self.cause == oldSelf.cause) &&
                    has(self.verify) == has(oldSelf.verify) &&
                    has(self.repair) == has(oldSelf.repair)
                  message: the spec of an operation is immutable; create another operation instead
                - rule: "self.type == 'Repair' ? has(self.repair) : !has(self.repair)"
                  message: spec.repair is required for a Repair and allowed for nothing else
                - rule: "self.type == 'Verify' || !has(self.verify)"
                  message: spec.verify is allowed only for a Verify
              properties:
                type:
                  type: string
                  enum:
                    - GarbageCollection
                    - Verify
                    - Repair
                  description: |
                    What the operation does.

                    - `GarbageCollection` — remove from the cache what the releases the cluster has moved past left there. The deployed release, the previous one, anything newer and every tag that is not a version are kept.
                    - `Verify` — read blobs of the store and compare each with its digest. What does not match is recorded and repaired by a `Repair` the module creates.
                    - `Repair` — check the images named in `spec.repair` and replace their broken or missing blobs with whole copies.
                cause:
                  type: string
                  maxLength: 1024
                  description: |
                    Why the operation was created, for a person reading it.

                    The module sets it on the operations it creates itself.
                verify:
                  type: object
                  description: |
                    What a `Verify` checks. Absent means every blob of every replica.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: the spec of an operation is immutable; create another operation instead
                  properties:
                    digests:
                      type: array
                      maxItems: 50
                      description: |
                        Images, by the digest of their manifest, or single blobs, by their digest. An image is checked together with every blob it consists of. Empty means every blob of the store.

                        The digests of the images are listed by `kubectl get registryimages`.
                      items:
                        type: string
                        pattern: '^sha256:[a-f0-9]{64}$'
                    nodes:
                      type: array
                      maxItems: 16
                      description: |
                        The replicas to run on, by node. Empty means every replica. An operation that names a node without a replica of the cache fails with the reason `UnknownNode`.
                      items:
                        type: string
                        maxLength: 253
                repair:
                  type: object
                  description: |
                    What a `Repair` repairs. Required for a `Repair`.
                  required:
                    - digests
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: the spec of an operation is immutable; create another operation instead
                  properties:
                    digests:
                      type: array
                      minItems: 1
                      maxItems: 50
                      description: |
                        Images, by the digest of their manifest, or single blobs, by their digest. An image is repaired together with every blob it consists of.

                        The digests of the images are listed by `kubectl get registryimages`; the broken blobs, by `RegistryStorage.status.replicas[].corruptedBlobs`.
                      items:
                        type: string
                        pattern: '^sha256:[a-f0-9]{64}$'
                    nodes:
                      type: array
                      maxItems: 16
                      description: |
                        The replicas to run on, by node. Empty means every replica. An operation that names a node without a replica of the cache fails with the reason `UnknownNode`.
                      items:
                        type: string
                        maxLength: 253
            status:
              type: object
              x-kubernetes-validations:
                - rule: "!has(oldSelf.phase) || !(oldSelf.phase in ['Succeeded', 'Failed', 'Canceled']) || (has(self.phase) && self.phase == oldSelf.phase)"
                  message: a finished operation cannot be reopened
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed
                    - Canceled
                  description: |
                    Where the operation is.

                    - `Pending` — no replica has started yet.
                    - `Running` — at least one replica has started, and not every one has finished.
                    - `Succeeded` — every replica finished the operation.
                    - `Failed` — the operation was refused, or a replica did not finish it.
                    - `Canceled` — the operation was canceled before every replica finished.
                reason:
                  type: string
                  description: |
                    A machine-readable reason for the phase.

                    - `Pending`: `Accepted`.
                    - `Running`: `InProgress`.
                    - `Succeeded`: `Completed`.
                    - `Failed`: `NoCache` (the cache is turned off), `NoReplicas` (no replica of the storage has reported yet), `AnotherOperationActive`, `UnknownNode` (`nodes` names a node without a replica), `ReplicaFailed`.
                    - `Canceled`: `Canceled`.
                message:
                  type: string
                  description: |
                    A human-readable explanation of the reason.
                acceptedAt:
                  type: string
                  format: date-time
                  description: |
                    When the operation was accepted.
                deadline:
                  type: string
                  format: date-time
                  description: |
                    When a replica held back by a store that is being written to gives up.

                    An hour after `acceptedAt`.
                startedAt:
                  type: string
                  format: date-time
                  description: |
                    When the first replica started.
                finishedAt:
                  type: string
                  format: date-time
                  description: |
                    When the operation reached a terminal phase.

                    The operation is deleted a day later.
                garbageCollection:
                  type: object
                  description: |
                    What a `GarbageCollection` removed, summed over the replicas.
                  properties:
                    removedManifests:
                      type: integer
                      format: int32
                      description: |
                        How many images were deleted by digest — the images the fill writes with no tag, where nearly all of a store's weight is.
                    removedBlobs:
                      type: integer
                      format: int32
                      description: |
                        How many blobs the sweep removed, as the registry counts them.

                        A sweep also removes what an earlier one failed to, so these blobs need not belong to the images deleted in this run. Absent when the sweep did not run.
                    removedVersions:
                      type: array
                      description: |
                        The Deckhouse Platform releases removed.
                      items:
                        type: string
                    reclaimedBytes:
                      type: integer
                      format: int64
                      description: |
                        How many bytes the store shrank by: its blobs and uploads in progress, measured before the collection and after.

                        Absent when the store could not be measured.
                replicas:
                  type: array
                  description: |
                    One entry per replica the operation was handed to.

                    Every replica of the storage that had reported when the operation was accepted is included.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - node
                  items:
                    type: object
                    required:
                      - node
                      - phase
                    properties:
                      node:
                        type: string
                        description: |
                          The node the replica runs on.
                      phase:
                        type: string
                        enum:
                          - Pending
                          - Waiting
                          - Running
                          - Succeeded
                          - Failed
                          - Skipped
                          - Canceled
                        description: |
                          Where the replica is.

                          - `Pending` — the replica has not picked the operation up yet.
                          - `Waiting` — the replica is held back; `reason` says by what.
                          - `Running` — the replica is running the operation.
                          - `Succeeded` — the replica finished the operation.
                          - `Failed` — the replica did not finish the operation.
                          - `Skipped` — the replica left the storage before it started.
                          - `Canceled` — the operation was canceled before the replica finished.
                      reason:
                        type: string
                        description: |
                          A machine-readable reason for the phase.

                          - `Waiting`: `Filling` (the cache is being filled), `Pushing` (an image set is being pushed with `d8 mirror push`), `Turn` (another replica is running the operation; or the replica waited a whole window for its turn and waits for the store to go quiet before waiting again).
                          - `Failed`: `OperationFailed` (for a `Repair`, also when a digest could not be repaired), `DeadlineExceeded` (by `deadline`, the replica had not picked the operation up, or its store was still being written to), `TimedOut` (the replica did not report a result within 24 hours), `ReplicaLost` (the replica is gone: it stopped holding the collection lease while it collected, or its node was not `Ready` for ten minutes while it waited).
                          - `Skipped`: `ReplicaGone`, `NoCache`.
                          - `Canceled`: `Canceled`.
                      message:
                        type: string
                        description: |
                          A human-readable explanation of the reason.
                      startedAt:
                        type: string
                        format: date-time
                        description: |
                          When the replica started.
                      finishedAt:
                        type: string
                        format: date-time
                        description: |
                          When the replica finished.
                      garbageCollection:
                        type: object
                        description: |
                          What a `GarbageCollection` removed from the replica's store.
                        properties:
                          removedManifests:
                            type: integer
                            format: int32
                            description: |
                              How many images were deleted by digest — the images the fill writes with no tag, where nearly all of a store's weight is.
                          removedBlobs:
                            type: integer
                            format: int32
                            description: |
                              How many blobs the sweep removed, as the registry counts them.

                              A sweep also removes what an earlier one failed to, so these blobs need not belong to the images deleted in this run. Absent when the sweep did not run.
                          removedVersions:
                            type: array
                            description: |
                              The Deckhouse Platform releases removed.
                            items:
                              type: string
                          reclaimedBytes:
                            type: integer
                            format: int64
                            description: |
                              How many bytes the store shrank by: its blobs and uploads in progress, measured before the collection and after.

                              Absent when the store could not be measured.
                      verify:
                        type: object
                        description: |
                          What a `Verify` found on the replica.
                        properties:
                          checkedBlobs:
                            type: integer
                            format: int32
                            description: How many blobs were read and compared with their digests.
                          checkedBytes:
                            type: integer
                            format: int64
                            description: How many bytes were read.
                          corruptedBlobs:
                            type: array
                            description: The blobs whose content does not match their digest, sorted, at most 50.
                            items:
                              type: string
                          corruptedCount:
                            type: integer
                            format: int32
                            description: How many blobs were found broken, those past the limit of the list included.
                          missingDigests:
                            type: array
                            description: The digests asked about that the replica holds neither as an image nor as a blob.
                            items:
                              type: string
                      repair:
                        type: object
                        description: |
                          What a `Repair` did on the replica.
                        properties:
                          digests:
                            type: array
                            description: One entry per digest of the operation.
                            items:
                              type: object
                              required:
                                - digest
                                - outcome
                              properties:
                                digest:
                                  type: string
                                  description: The digest the operation names.
                                outcome:
                                  type: string
                                  enum:
                                    - Intact
                                    - Repaired
                                    - NotHeld
                                    - Failed
                                  description: |
                                    What was done.

                                    - `Intact` — every blob matches its digest; nothing was changed.
                                    - `Repaired` — broken or missing blobs were replaced with whole copies.
                                    - `NotHeld` — the replica holds neither an image nor a blob by this digest.
                                    - `Failed` — a blob could not be replaced; `message` says why. The blob stays as it was.
                                repairedBlobs:
                                  type: integer
                                  format: int32
                                  description: How many blobs were replaced.
                                message:
                                  type: string
                                  description: Why it failed, or where the whole copies came from.
