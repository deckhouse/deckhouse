spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает результирующую конфигурацию хранилища образов контейнеров кластера.

            В штатном режиме объект рендерится модулем из [ModuleConfig/registry](configuration.html). Объект — контракт, а не собственность Deckhouse: администратор может править его напрямую, когда оператор Deckhouse недоступен, и правка применяется на лету контроллером хранилища образов контейнеров и синкером хранилища, без перегенерации helm.

            Используется единственный объект с именем `registry`.
          properties:
            spec:
              properties:
                mode:
                  description: |
                    Управляет ли модуль путём загрузки образов.

                    - `Managed` — модуль владеет путём загрузки и создаёт свои компоненты.
                    - `Unmanaged` — модуль не владеет ничем, компоненты не создаются.
                primary:
                  description: |
                    Единственный авторитетный источник образов компонентов Deckhouse.

                    Дополнительные хранилища образов контейнеров объявляются отдельными объектами [RegistryUpstream](cr.html#registryupstream). Несколько разных Primary не поддерживается: тогда были бы неоднозначны и «полон ли кеш», и «из чего наполняется кеш в air-gap».
                  properties:
                    upstream:
                      description: |
                        Хранилище образов контейнеров, из которого загружаются образы компонентов Deckhouse.

                        Если не задан, кластер считается air-gap: внутрикластерный кеш становится авторитетным и наполняется извне командой `d8 mirror push`. Отсутствие параметра требует `storage.cache: true`.
                      properties:
                        scheme:
                          description: |
                            Протокол подключения к хранилищу образов контейнеров.

                            Используйте `HTTP` только для незащищённых доверенных хранилищ образов контейнеров.
                        host:
                          description: |
                            Хост хранилища образов контейнеров, опционально с портом.
                        path:
                          description: |
                            Префикс пути к репозиторию внутри хранилища образов контейнеров.
                        ca:
                          description: |
                            PEM-сертификат удостоверяющего центра для проверки хранилища образов контейнеров при `scheme: HTTPS`.

                            Если не задан, используется системное хранилище доверенных сертификатов.
                        auth:
                          description: |
                            Ключи доступа к хранилищу образов контейнеров.

                            **Чувствительные данные.** Ключи хранятся внутри объекта, а не по ссылке на секрет, — так агент на узле остаётся самодостаточным при недоступном API-сервере. Ограничивайте доступ к ресурсам хранилища образов контейнеров соответствующим образом.
                          properties:
                            username:
                              description: |
                                Имя пользователя для базовой аутентификации.
                            password:
                              description: |
                                Пароль для базовой аутентификации.
                            auth:
                              description: |
                                Заранее закодированное значение `base64("username:password")`.

                                Имеет приоритет над `username` и `password`, если задано.
                        mirrors:
                          description: |
                            Дополнительные адреса, отдающие **тот же** контент, что и основное хранилище образов контейнеров, — для отказоустойчивости и балансировки.

                            Зеркала не являются отдельными источниками. Хранилище кеширует один дедуплицированный набор независимо от того, с какого зеркала образы были загружены.
                          items:
                            properties:
                              scheme:
                                description: |
                                  Протокол подключения к зеркалу.
                              host:
                                description: |
                                  Хост зеркала, опционально с портом.
                              path:
                                description: |
                                  Префикс пути к репозиторию внутри зеркала.
                              ca:
                                description: |
                                  PEM-сертификат удостоверяющего центра для проверки зеркала.
                              auth:
                                description: |
                                  Ключи доступа к зеркалу.

                                  **Чувствительные данные.** См. `primary.upstream.auth`.
                                properties:
                                  username:
                                    description: |
                                      Имя пользователя для базовой аутентификации.
                                  password:
                                    description: |
                                      Пароль для базовой аутентификации.
                                  auth:
                                    description: |
                                      Заранее закодированное значение `base64("username:password")`.
                storage:
                  description: |
                    Настройки внутрикластерного кеша хранилища образов контейнеров.
                  properties:
                    cache:
                      description: |
                        Идут ли загрузки через внутрикластерный кеш на master-узлах.

                        Это первая из двух осей конфигурации. Вторая — задан ли `primary.upstream`. Вместе они заменяют прежнюю стейт-машину режимов:

                        - `cache: false` с заданным upstream — агент форвардит загрузки напрямую в upstream, хранилище не нужно.
                        - `cache: true` с заданным upstream — сквозной кеш, наполняется из upstream.
                        - `cache: true` без upstream — air-gap: кеш авторитетен и наполняется командой `d8 mirror push`.
                    size:
                      description: |
                        Размер персистентного хранилища под кеш.
                    source:
                      description: |
                        Набор образов, который должен оказаться в кеше.

                        Обязателен в air-gap: без upstream, к которому можно откатиться, полнота должна быть вычислимой, прежде чем отдавать образы только из кеша.
                      properties:
                        bundleRef:
                          description: |
                            Имя набора образов, например bundle, залитого командой `d8 mirror push`.
                        expectedDigests:
                          description: |
                            Количество уникальных дайджестов в наборе.
            status:
              properties:
                observedGeneration:
                  description: |
                    Поколение `spec`, на которое контроллер отреагировал последним.
                effectiveUpstreamAuthDigest:
                  description: |
                    Опознаёт действующие ключи доступа, не раскрывая их.

                    Нужен потому, что вопрос «изменилась ли конфигурация» обязан учитывать ключи: смена лицензии при неизменном адресе — ровно тот случай, который нужно проверить пробой до переключения кластера. Ключи здесь больше не хранятся, и сравнение с дайджестом настроенных — то, что оставляет этот вопрос разрешимым.
                effectiveUpstream:
                  description: |
                    Upstream, который фактически действует, — не обязательно тот, что задан в конфигурации.

                    Это собственная запись контроллера о последнем upstream, прошедшем preflight-пробу, и именно она делает неудачное изменение переживаемым: если ввести нерабочие ключи или переключиться на лицензию без доступа, это поле — а вместе с ним и кластер — остаётся на прежнем рабочем upstream, а состояние `UpstreamValid` сообщает причину.

                    Оно же держит upstream во время ухода в air-gap, когда конфигурация уже говорит «нет», а кеш ещё не полон.

                    Пусто означает, что никакой upstream не действует: либо кластер в air-gap, либо ничего ещё не настроено.
                  properties:
                    scheme:
                      description: |
                        Протокол подключения к хранилищу образов контейнеров.
                    host:
                      description: |
                        Хост хранилища образов контейнеров, опционально с портом.
                    path:
                      description: |
                        Префикс пути к репозиторию внутри хранилища образов контейнеров.
                    ca:
                      description: |
                        PEM-сертификат удостоверяющего центра для проверки хранилища образов контейнеров.
                    mirrors:
                      description: |
                        Дополнительные адреса, отдающие тот же контент.
                      items:
                        properties:
                          scheme:
                            description: |
                              Протокол подключения к зеркалу.
                          host:
                            description: |
                              Хост зеркала, опционально с портом.
                          path:
                            description: |
                              Префикс пути к репозиторию внутри зеркала.
                          ca:
                            description: |
                              PEM-сертификат удостоверяющего центра для проверки зеркала.
                conditions:
                  description: |
                    Сводка здоровья, которую пишет контроллер хранилища образов контейнеров.

                    - `Valid` — результирующая конфигурация согласована.
                    - `UpstreamValid` — результат preflight-пробы Primary upstream: достижимость, приём ключей, наличие sentinel-контента. Значение `False` означает, что контроллер держит последний рабочий upstream и **не** переключился, — так испорченная лицензия или неверный адрес не роняют кластер.
                    - `StorageConverged` — хранилище пришло в состояние, которого требует конфигурация.
                  items:
                    properties:
                      type:
                        description: |
                          Тип состояния.
                      status:
                        description: |
                          Значение состояния.
                      observedGeneration:
                        description: |
                          Поколение `spec`, для которого выставлено состояние.
                      lastTransitionTime:
                        description: |
                          Время последнего изменения состояния.
                      reason:
                        description: |
                          Машиночитаемая причина состояния.
                      message:
                        description: |
                          Пояснение для человека.
