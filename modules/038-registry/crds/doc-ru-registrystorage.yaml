spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает, как работает внутрикластерное хранилище registry, и сообщает его фактическое состояние.

            Объект пишет контроллер хранилища образов контейнеров, а читает контейнер-синкер, который перенастраивает `distribution` на лету. Именно этот путь позволяет смене ключей или сертификата примениться при неработающем операторе Deckhouse: он никогда не проходит через перегенерацию helm.

            У объекта есть настоящий `spec`, а не только зеркало факта, потому что `distribution` нужно сообщать, что делать, а не только наблюдать за ним.

            Используется единственный объект с именем `registry`.
          properties:
            spec:
              properties:
                upstream:
                  description: |
                    Primary upstream, спроецированный сюда контроллером.

                    Задан — сквозной кеш. Не задан — кеш авторитетен (air-gap).

                    Контроллер убирает это поле **только после того, как лидер полон**, поэтому узлы никогда не остаются без источника образов — даже если пользователь уже убрал upstream из конфигурации.
                  properties:
                    scheme:
                      description: |
                        Протокол подключения к хранилищу образов контейнеров.
                    host:
                      description: |
                        Хост хранилища образов контейнеров, опционально с портом.
                    path:
                      description: |
                        Префикс пути к репозиторию внутри хранилища образов контейнеров.
                    ca:
                      description: |
                        PEM-сертификат удостоверяющего центра для проверки хранилища образов контейнеров.
                    auth:
                      description: |
                        Где хранятся ключи доступа к этому эндпоинту.

                        Указаны ссылкой, а не значением. Ресурс кластерного уровня, а роль узлового агента привязана к группе `system:nodes`, поэтому ключ, записанный здесь, был бы доступен через API kubelet'у любого узла — включая ключи к registry, откуда этот узел ничего не тянет. Компонент, который это читает, разрешает ссылку один раз и сохраняет результат, поэтому продолжает работать и при недоступном API-сервере.
                      properties:
                        secretRef:
                          description: |
                            Секрет с ключами доступа и ключ внутри него.
                          properties:
                            name:
                              description: |
                                Имя секрета в неймспейсе `d8-system`.
                            key:
                              description: |
                                Ключ внутри него. Один секрет содержит все разрешённые модулем ключи доступа, по принадлежности.
                    mirrors:
                      description: |
                        Дополнительные адреса, отдающие тот же контент. Синкер загружает с любого доступного и хранит один дедуплицированный набор.
                      items:
                        properties:
                          scheme:
                            description: |
                              Протокол подключения к зеркалу.
                          host:
                            description: |
                              Хост зеркала, опционально с портом.
                          path:
                            description: |
                              Префикс пути к репозиторию внутри зеркала.
                          ca:
                            description: |
                              PEM-сертификат удостоверяющего центра для проверки зеркала.
                          auth:
                            description: |
                              Где хранятся ключи доступа к этому эндпоинту.

                              Указаны ссылкой, а не значением. Ресурс кластерного уровня, а роль узлового агента привязана к группе `system:nodes`, поэтому ключ, записанный здесь, был бы доступен через API kubelet'у любого узла — включая ключи к registry, откуда этот узел ничего не тянет. Компонент, который это читает, разрешает ссылку один раз и сохраняет результат, поэтому продолжает работать и при недоступном API-сервере.
                            properties:
                              secretRef:
                                description: |
                                  Секрет с ключами доступа и ключ внутри него.
                                properties:
                                  name:
                                    description: |
                                      Имя секрета в неймспейсе `d8-system`.
                                  key:
                                    description: |
                                      Ключ внутри него. Один секрет содержит все разрешённые модулем ключи доступа, по принадлежности.
                source:
                  description: |
                    Набор образов, который должен оказаться в хранилище.
                  properties:
                    bundleRef:
                      description: |
                        Имя набора образов.
                    expectedDigests:
                      description: |
                        Количество уникальных дайджестов в наборе.
                store:
                  description: |
                    Где `distribution` хранит блобы.
                  properties:
                    path:
                      description: |
                        Путь на узле. Задаётся модулем, а не пользователем: `/var/lib/deckhouse/registry`, если у NodeGroup master-узлов `systemType: Immutable`, иначе `/opt/deckhouse/registry`.
                    size:
                      description: |
                        Бюджет хранилища каждой реплики, берётся из `storage.size` в ModuleConfig: сколько могут занимать его блобы и незавершённые загрузки. Если не задан, бюджета нет; резерв на файловой системе хранилища (см. `status.replicas[].store.reserveBytes`) действует в любом случае.
                publish:
                  description: |
                    Публиковать ли защищённую авторизацией точку записи (Ingress) для `d8 mirror push`.

                    Ключи на запись отличаются от ключей на чтение. Точка записи — это второй слушатель того же хранилища образов контейнеров: то же хранилище, но без кеша перед ним, поэтому её публикация ничего не стоит адресу, через который кластер тянет образы. Один слушатель не может одновременно проксировать upstream и принимать push.
                airGapRequested:
                  description: |
                    Запрошена ли работа без upstream — независимо от того, отключён ли upstream уже фактически.

                    Это окно перехода: air-gap запрошен, upstream ещё удерживается, чтобы кластер продолжал работать, а образы приходят через `d8 mirror push`, которых синкер не видит. Именно по этому признаку решается, что полноту нужно измерять чтением хранилища, а не подсчётом скопированного. Различие существенно: сквозной кеш пишет в собственное хранилище на каждом промахе, поэтому то же измерение на кеширующем кластере считало бы образы, которые кластер просто подтянул.
                auth:
                  description: |
                    Bearer-токен, защищающий хранилище.

                    **Чувствительные данные.** Авторизация не отключается никогда — в том числе в air-gap, где кеш отдаёт образы только на чтение.
                garbageCollection:
                  description: |
                    Настройки сборки мусора.

                    Определяют, освобождает ли реплика диск, занятый релизами, которые кластер уже прошёл, и время запуска сборки мусора.

                    Сборка мусора потому, что никакие другие компоненты не удаляют из хранилища данные ни при каких условиях: каждый релиз добавляет свой срез репозитория, поэтому, при отсуствии сборки мусора, кластер, работающий долгое время, заполняет хранилище и перестаёт быть способным загружать образы.

                    Во время сборки мусора загрузка образов из хранилища не блокируется: реплика продолжает отдавать все образы, которые держит. Сборка мусора не начинается, пока хранилище наполняется или идёт `d8 mirror push`. Во время сборки мусора реплика не наполняет своё хранилище. `d8 mirror push`, начатый во время сборки, может завершиться ошибкой, и его нужно повторить. Сборка мусора одновременно работает только на одной реплике, поэтому остальные не затронуты.
                  properties:
                    enabled:
                      description: |
                        Запускается ли сборка мусора (создаются ли операции `RegistryOperation`) контроллером автоматически: по расписанию, после смены набора образов и когда хранилище отказывает в записи.

                        Операция `RegistryOperation`, созданная вручную, выполняется в любом случае.
                    schedule:
                      description: |
                        Cron-выражение из пяти полей, в UTC.

                        По умолчанию — ночной час или начало окна обслуживания NodeGroup `master`, если оно задано: этот час оператор уже объявил допустимым для перерывов.
                needSync:
                  description: |
                    Так контроллер выдаёт синкерам задание на наполнение или репликацию.

                    Выставлено, пока хотя бы одной реплике не хватает ожидаемого набора образов: лидер наполняется из upstream или follower ещё не догнал лидера. Снимается, когда набор есть у всех реплик; до следующего изменения набора ничего не копируется.
            status:
              properties:
                observedGeneration:
                  description: |
                    Поколение `spec`, на которое контроллер отреагировал последним.
                authoritative:
                  description: |
                    Снят ли upstream и стал ли кеш единственным источником образов.
                phase:
                  description: |
                    Краткая сводка состояния наполнения.

                    - `Idle` — задание на наполнение или проверку не выполняется.
                    - `Filling` — лидер наполняется.
                    - `Verifying` — содержимое проверяется против `spec.source`.
                    - `Ready` — лидер содержит ожидаемый набор.
                    - `Failed` — задание на наполнение или проверку завершилось ошибкой. В этом состоянии upstream **не** снимается.
                fill:
                  description: |
                    Прогресс текущего задания на наполнение.
                  properties:
                    filled:
                      description: |
                        Сколько дайджестов записано на текущий момент.
                    total:
                      description: |
                        Сколько дайджестов ожидается.
                safeToDropUpstream:
                  description: |
                    Содержит ли **лидер** ожидаемый набор и не осталось ли на платформе ссылок на upstream — вместе это условие ухода в air-gap.

                    Намеренно только лидер, а не все реплики: реплики доливаются заранее и параллельно, поэтому ожидание всех задержало бы переход, не добавив безопасности.

                    Полный кеш не заменяет отсутствия ссылок: ссылку на образ, которая называет upstream по его собственному имени, кеш не обслуживает, когда upstream снят. Подробнее — в описании `upstreamReferences`.

                    `full` лидера учитывается, только если его записал синкер, работающий на узле лидера сейчас, после того как прочитал своё хранилище (см. `replicas[].syncerStartedAt`). После перезапуска синкера лидера здесь `false` до его первого прохода, обычно не дольше двух минут.
                upstreamReferences:
                  description: |
                    Количество объектов в неймспейсах платформы, образы которых всё ещё ссылаются на upstream, удерживаемый хранилищем.

                    Каждый объект считается отдельно: шаблоны Deployment, DaemonSet, StatefulSet и CronJob, ещё не запущенные поды, поды, которые при следующем запуске будут скачивать образ заново, и реплики самого хранилища — после снятия upstream им неоткуда скачать собственный образ. Deployment в процессе обновления добавляет единицу за шаблон и по единице за каждый такой под.

                    Учитываются только неймспейсы `kube-system` и `d8-*`. Нагрузки в других неймспейсах, образы которых ссылаются на адрес upstream, переход не удерживают, и после снятия upstream им неоткуда скачать образы. Переведите их на адрес внутри кластера до того, как убрать upstream.

                    Считается, пока лидер полон и upstream ещё удерживается. Если поля нет, подсчёт не проводился, и `safeToDropUpstream` равно `false`, как при ненулевом значении.
                allReplicasFull:
                  description: |
                    Содержат ли ожидаемый набор все реплики — тогда потеря лидера ничего не стоит.
                leader:
                  description: |
                    Узел, который в данный момент держит lease лидера хранилища.

                    Это не обычные выборы: за lease борется только реплика, которая держит весь ожидаемый набор образов, а реплика, которая его держит, уступает, когда набор появляется у другой. Роль лидера несимметрична — именно из него реплицируют все follower'ы, и именно его полнота открывает переход в air-gap.

                    Без этого условия air-gap-кластер может застрять. `d8 mirror push` приходит через endpoint публикации и попадает на ту реплику, которую выбрал ingress, а не обязательно на лидера; пустому лидеру не из чего наливаться, follower'ы реплицируют его пустоту, а реплика с образами простаивает. Исключение — кластер, где полной реплики ещё нет ни одной, то есть состояние, с которого начинается любой кластер: тогда кто-то должен стать лидером, чтобы наливка вообще началась.
                replicas:
                  description: |
                    Состояние наполнения по репликам.

                    Это **единственное** место, где сообщается полнота хранилища. [RegistryNode](cr.html#registrynode) намеренно её не несёт: полнота — свойство хранилища, а не узла.
                  items:
                    properties:
                      node:
                        description: |
                          Узел, на котором работает реплика.
                      role:
                        description: |
                          Роль реплики в репликации.

                          - `Leader` — наполняется из upstream либо командой `d8 mirror push` в air-gap и раздаёт задания на репликацию.
                          - `Follower` — наполняется от лидера заранее, поэтому потеря лидера не означает наполнения с нуля.
                      full:
                        description: |
                          Содержит ли эта реплика ожидаемый набор.

                          Вычисляется по тому, что синкер фактически **записал**, и никогда пробой пути выдачи: на промахе сквозной кеш сам подтянул бы образ из upstream и отчитался об успехе на пустом хранилище. В air-gap самонаполнение невозможно, поэтому там честно читать каталог и сравнивать с `spec.source.expectedDigests`.
                      verifiedDigests:
                        description: |
                          Сколько дайджестов **из набора** подтверждено на месте.

                          Набор — это то, что объявляют релизы кластера и сохраняемые модули, то есть дайджесты, известные deckhouse-controller. Поэтому это число напрямую сопоставимо с `full` и именно по нему принимается решение о переходе в air-gap. Всё остальное, что оказалось в хранилище, учитывается в `totalDigests`.
                      totalDigests:
                        description: |
                          Сколько различных дайджестов эта реплика хранит **всего**.

                          Это другая величина, чем `verifiedDigests`, и по ней ничего не решается. Она нужна, чтобы хранилище, содержащее больше, чем требуется этому кластеру — загруженный bundle с другими модулями, другими редакциями, аттестациями — выглядело именно так, а не как недостача относительно `spec.source.expectedDigests`.
                      declaredDigests:
                        description: |
                          Каков **размер** набора — то, из чего берётся `verifiedDigests`.

                          Сообщается репликой, потому что размер набора знает только та реплика, которая его вычисляет, и по этому числу ничего не решается. Пока его не было, единственным знаменателем для статуса оставался `spec.source.expectedDigests`, который оператор указывает при объявлении air-gap и не указывает в остальных случаях — поэтому кластер с upstream всю свою самую длинную фазу показывал `filled: 0, total: 0`, пока копировались гигабайты. Полнота по-прежнему выражается через `full`, а переход в air-gap по-прежнему решается по `spec.source.expectedDigests`: объявление оператора не подменяется числом, которое кластер вычислил про себя.
                      address:
                        description: |
                          Адрес, на котором отвечает эта реплика, в виде `host:port`.

                          Сообщает сама реплика — чтобы follower мог реплицировать с лидера, не разрешая имя узла в адрес.
                      source:
                        description: |
                          Реплика, от которой наполняется эта. Пусто для лидера.
                      syncerStartedAt:
                        description: |
                          Когда запущен процесс синкера, записавший эту запись, с точностью до секунды. Выставляется, только когда этот процесс сам пересчитал своё хранилище, скопировал в него или перепроверил его; до того поля нет.

                          Запись переживает процесс, который её написал. Лидер, чей под пересоздан на том же узле, сразу забирает lease обратно, и пока новый процесс не прочитал хранилище, его запись говорит то, что нашёл предыдущий, включая `full`, даже если хранилище стёрто вместе с подом. Поэтому upstream снимается, только если запись держателя lease помечена не раньше запуска контейнера `syncer` в его Ready-поде. Оба времени берутся по часам этого узла.
                      error:
                        description: |
                          Почему последнее задание на наполнение или проверку завершилось ошибкой — по отчёту синкера этой реплики. Пусто, если последнее задание прошло успешно.

                          Если последнее задание не завершилось ошибкой, здесь же повторяется то, что сообщает `healthError`.

                          Безопасность от этого поля не зависит: упавшая реплика просто не `full`, а upstream снимается только когда лидер **полон**. Поле нужно, чтобы оператор мог отличить «ещё наполняется» от «сломалось», чего счётчики наполнения сами по себе не выражают.
                      healthError:
                        description: |
                          Почему реплика не может отдавать то, что хранит: её хранилище образов не отвечает пять минут или её диск две минуты отказывает в записи. Пусто, пока и то и другое работает.

                          Синкер проверяет и то и другое раз в полминуты независимо от наполнения и снимает ошибку, когда хранилище образов снова отвечает, а диск принимает запись; `full` при этом не меняется и с этого момента снова учитывается. Лидер с такой ошибкой передаёт lease реплике, у которой есть весь ожидаемый набор, если такая есть; если нет, он остаётся лидером и только сообщает об ошибке.

                          Пока ни у одной реплики нет всего набора и ни одна не лидирует, синкеры реплик сами выбирают, какая из них станет лидером и начнёт наполнение: ту, у которой больше всего образов. Реплику с такой ошибкой они пропускают. Пропускают и реплику, чьё хранилище упёрлось в бюджет или в резерв узла (`store.writable` равно `false`), если только так не у всех реплик. Одна лишь ошибка в `error`, например неудачное копирование с лидера, которого уже нет, выбору реплики не мешает.
                      verifiedSet:
                        description: |
                          Отпечаток набора, для которого реплика в последний раз признана полной (`full`): версии платформы и модули кластера, каждый со своей версией и источником.

                          `full` верен только для того набора, по которому он измерен, а набор меняется: устанавливается модуль, обновляется платформа. Значение сообщает каждая реплика вместе со своим `full`. Лидер сравнивает своё с набором, который нужен кластеру сейчас. Если они расходятся, лидер снимает `full` и перепроверяет хранилище, прежде чем на него сможет опереться переход в air-gap. `full` для другого набора не учитывается, когда реплики решают, кому быть лидером. Пусто, пока `full` не установлен.
                      aheadSet:
                        description: |
                          Части того, что идёт впереди набора и тоже есть у этой реплики: следующая версия платформы, на которую обновится кластер, и каждое обновление модуля, которое он вот-вот применит. Указываются ключами частей через запятую, по порядку.

                          Часть выставляется, когда копирование наперёд перенесло её целиком. Отдельно от `verifiedSet`, потому что копируется отдельно: после набора, в фоне, по возможности. По частям, чтобы один модуль, который так и не появился, не мешал учесть остальное. Фолловер копирует части, которые есть у лидера и нет у него, поэтому обновление, попавшее только на лидера (например, через `d8 mirror push`), доходит до остальных реплик. Пусто, если ничего не ожидает обновления или ожидающее ещё не скопировано.
                      store:
                        description: |
                          Сколько места на диске узла занимает хранилище этой реплики и принимает ли оно запись. Отсутствует, пока реплика не выполнила замер.

                          Оба предела registry соблюдает сам, при каждой записи. Здесь те же величины в подсчёте синкера — для статуса и алертов. Размеры округлены до 16 МиБ: занятое вверх, свободное и размер файловой системы вниз, чтобы общая с узлом файловая система не переписывала статус на каждом проходе.
                        properties:
                          usedBytes:
                            description: |
                              Сколько занимают блобы хранилища и незавершённые загрузки.
                          budgetBytes:
                            description: |
                              `storage.size` из настроек модуля. Отсутствует, если параметр не задан; тогда действует только резерв.
                          reserveBytes:
                            description: |
                              Сколько места на файловой системе хранилище оставляет свободным. Считается от текущего размера файловой системы, округлённого вверх до целого ГиБ. Если файловая система общая с узлом, это мягкий порог выселения kubelet (10%, не больше 40 ГиБ) плюс запас для других процессов, пишущих на неё (10%, не больше 20 ГиБ). Если у хранилища своя файловая система (см. `dedicatedFilesystem`), остаётся только запас.
                          filesystemFreeBytes:
                            description: |
                              Свободное место на файловой системе хранилища. Если отдельного диска нет, это та же файловая система, которой пользуются kubelet и containerd.
                          filesystemCapacityBytes:
                            description: |
                              Текущий размер файловой системы хранилища. Если файловую систему расширили при работающем хранилище, здесь виден новый размер, и резерв пересчитывается от него.
                          dedicatedFilesystem:
                            description: |
                              `true`, если у хранилища своя файловая система: диск смонтирован в каталог хранилища или в каталог хранилища уровнем выше, и на нём нет каталогов kubelet и containerd. Реплика определяет это по своим точкам монтирования при запуске. Отсутствует, если файловая система общая с узлом или это не удалось определить: такая файловая система считается общей.
                          writable:
                            description: |
                              `false`, пока хранилище отклоняет новые записи. Чтение не отклоняется никогда: полное хранилище отдаёт всё, что в нём есть, а образ, который сохранить не удалось, отдаётся потоком из upstream. Исключение — `reason: NotWritable`: тогда registry отвечает на такую загрузку ошибкой, потому что его каталоги отказывают в записи раньше, чем проверяются пределы.
                          reason:
                            description: |
                              Причина, по которой отклоняются записи.

                              - `BudgetExhausted` — хранилище заняло всё, что разрешает `storage.size`;
                              - `ReserveExhausted` — на файловой системе хранилища осталось только место, которое должно оставаться свободным, см. `reserveBytes`;
                              - `NotWritable` — registry не может создавать файлы в своём дереве в хранилище: в `docker/registry/v2` и каталогах под ним, а пока этого дерева нет — в каталоге хранилища. Мешают владелец или права этих каталогов, атрибут immutable, монтирование только для чтения или модуль безопасности. Предел здесь ни при чём, и ни сборка мусора, ни больший `storage.size` не помогут. Каталог и команда, которая это исправляет, указаны в `error` реплики. Имеет приоритет над обоими пределами.
                conditions:
                  description: |
                    Детальное состояние хранилища.
                  items:
                    properties:
                      type:
                        description: |
                          Тип состояния.
                      status:
                        description: |
                          Значение состояния.
                      observedGeneration:
                        description: |
                          Поколение `spec`, для которого выставлено состояние.
                      lastTransitionTime:
                        description: |
                          Время последнего изменения состояния.
                      reason:
                        description: |
                          Машиночитаемая причина состояния.
                      message:
                        description: |
                          Пояснение для человека.
