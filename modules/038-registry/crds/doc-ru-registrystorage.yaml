spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает, как работает внутрикластерное хранилище registry, и сообщает его фактическое состояние.

            Объект пишет контроллер registry, а читает контейнер-синкер, который перенастраивает `distribution` на лету. Именно этот путь позволяет смене ключей или сертификата примениться при неработающем операторе Deckhouse: он никогда не проходит через перегенерацию helm.

            У объекта есть настоящий `spec`, а не только зеркало факта, потому что `distribution` нужно сообщать, что делать, а не только наблюдать за ним.

            Используется единственный объект с именем `registry`.
          properties:
            spec:
              properties:
                upstream:
                  description: |
                    Primary upstream, спроецированный сюда контроллером.

                    Задан — сквозной кэш. Не задан — кэш авторитетен (air-gap).

                    Контроллер убирает это поле **только после того, как лидер полон**, поэтому узлы никогда не остаются без источника образов — даже если пользователь уже убрал upstream из конфигурации.
                  properties:
                    scheme:
                      description: |
                        Протокол подключения к registry.
                    host:
                      description: |
                        Хост registry, опционально с портом.
                    path:
                      description: |
                        Префикс пути к репозиторию внутри registry.
                    ca:
                      description: |
                        PEM-сертификат удостоверяющего центра для проверки registry.
                    auth:
                      description: |
                        Где хранятся ключи доступа к этому эндпоинту.

                        Указаны ссылкой, а не значением. Ресурс кластерного уровня, а роль узлового агента привязана к группе `system:nodes`, поэтому ключ, записанный здесь, был бы доступен через API kubelet'у любого узла — включая ключи к registry, откуда этот узел ничего не тянет. Компонент, который это читает, разрешает ссылку один раз и сохраняет результат, поэтому продолжает работать и при недоступном API-сервере.
                      properties:
                        secretRef:
                          description: |
                            Secret с ключами доступа и ключ внутри него.
                          properties:
                            name:
                              description: |
                                Имя Secret'а в пространстве имён `d8-system`.
                            key:
                              description: |
                                Ключ внутри него. Один Secret содержит все разрешённые модулем ключи доступа, по принадлежности.
                    mirrors:
                      description: |
                        Дополнительные адреса, отдающие тот же контент. Синкер загружает с любого доступного и хранит один дедуплицированный набор.
                      items:
                        properties:
                          scheme:
                            description: |
                              Протокол подключения к зеркалу.
                          host:
                            description: |
                              Хост зеркала, опционально с портом.
                          path:
                            description: |
                              Префикс пути к репозиторию внутри зеркала.
                          ca:
                            description: |
                              PEM-сертификат удостоверяющего центра для проверки зеркала.
                          auth:
                            description: |
                              Где хранятся ключи доступа к этому эндпоинту.

                              Указаны ссылкой, а не значением. Ресурс кластерного уровня, а роль узлового агента привязана к группе `system:nodes`, поэтому ключ, записанный здесь, был бы доступен через API kubelet'у любого узла — включая ключи к registry, откуда этот узел ничего не тянет. Компонент, который это читает, разрешает ссылку один раз и сохраняет результат, поэтому продолжает работать и при недоступном API-сервере.
                            properties:
                              secretRef:
                                description: |
                                  Secret с ключами доступа и ключ внутри него.
                                properties:
                                  name:
                                    description: |
                                      Имя Secret'а в пространстве имён `d8-system`.
                                  key:
                                    description: |
                                      Ключ внутри него. Один Secret содержит все разрешённые модулем ключи доступа, по принадлежности.
                source:
                  description: |
                    Набор образов, который должен оказаться в хранилище.
                  properties:
                    bundleRef:
                      description: |
                        Имя набора образов.
                    expectedDigests:
                      description: |
                        Количество уникальных digest'ов в наборе.
                store:
                  description: |
                    Где `distribution` хранит блобы.
                  properties:
                    path:
                      description: |
                        Путь на узле. Константа модуля, не пользовательская настройка.
                    size:
                      description: |
                        Размер персистентного хранилища, берётся из ModuleConfig.
                publish:
                  description: |
                    Публиковать ли защищённую авторизацией точку записи (Ingress) для `d8 mirror push`.

                    Ключи на запись отличаются от ключей на чтение. Точка записи — это отдельный экземпляр distribution поверх той же директории данных, поэтому её публикация ничего не стоит экземпляру, через который кластер тянет образы: один экземпляр не может одновременно проксировать upstream и принимать push.
                airGapRequested:
                  description: |
                    Запрошена ли работа без upstream — независимо от того, отключён ли upstream уже фактически.

                    Это окно перехода: air-gap запрошен, upstream ещё удерживается, чтобы кластер продолжал работать, а образы приходят через `d8 mirror push`, которых синкер не видит. Именно по этому признаку решается, что полноту нужно измерять чтением хранилища, а не подсчётом скопированного. Различие существенно: сквозной кэш пишет в собственное хранилище на каждом промахе, поэтому то же измерение на кэширующем кластере считало бы образы, которые кластер просто подтянул.
                auth:
                  description: |
                    Bearer-токен, защищающий хранилище.

                    **Чувствительные данные.** Авторизация не отключается никогда — в том числе в air-gap, где кэш отдаёт образы только на чтение.
                needSync:
                  description: |
                    Так контроллер выдаёт синкеру задание на наполнение или репликацию.
            status:
              properties:
                observedGeneration:
                  description: |
                    Поколение `spec`, на которое контроллер отреагировал последним.
                authoritative:
                  description: |
                    Снят ли upstream и стал ли кэш единственным источником образов.
                phase:
                  description: |
                    Краткая сводка состояния наполнения.

                    - `Idle` — задание на наполнение или проверку не выполняется.
                    - `Filling` — лидер наполняется.
                    - `Verifying` — содержимое проверяется против `spec.source`.
                    - `Ready` — лидер содержит ожидаемый набор.
                    - `Failed` — задание на наполнение или проверку завершилось ошибкой. В этом состоянии upstream **не** снимается.
                fill:
                  description: |
                    Прогресс текущего задания на наполнение.
                  properties:
                    filled:
                      description: |
                        Сколько digest'ов записано на текущий момент.
                    total:
                      description: |
                        Сколько digest'ов ожидается.
                safeToDropUpstream:
                  description: |
                    Содержит ли **лидер** ожидаемый набор — это условие ухода в air-gap.

                    Намеренно только лидер, а не все реплики: реплики доливаются заранее и параллельно, поэтому ожидание всех задержало бы переход, не добавив безопасности.
                allReplicasFull:
                  description: |
                    Содержат ли ожидаемый набор все реплики — тогда потеря лидера ничего не стоит.
                leader:
                  description: |
                    Узел, который в данный момент держит lease лидера хранилища.

                    Это не обычные выборы: за lease борется только реплика, которая держит весь ожидаемый набор образов, а реплика, которая его держит, уступает, когда набор появляется у другой. Роль лидера несимметрична — именно из него реплицируют все follower'ы, и именно его полнота открывает переход в air-gap.

                    Без этого условия air-gap-кластер может застрять. `d8 mirror push` приходит через endpoint публикации и попадает на ту реплику, которую выбрал ingress, а не обязательно на лидера; пустому лидеру не из чего наливаться, follower'ы реплицируют его пустоту, а реплика с образами простаивает. Исключение — кластер, где полной реплики ещё нет ни одной, то есть состояние, с которого начинается любой кластер: тогда кто-то должен стать лидером, чтобы наливка вообще началась.
                replicas:
                  description: |
                    Состояние наполнения по репликам.

                    Это **единственное** место, где сообщается полнота хранилища. [RegistryNode](cr.html#registrynode) намеренно её не несёт: полнота — свойство хранилища, а не узла.
                  items:
                    properties:
                      node:
                        description: |
                          Узел, на котором работает реплика.
                      role:
                        description: |
                          Роль реплики в репликации.

                          - `Leader` — наполняется из upstream либо командой `d8 mirror push` в air-gap и раздаёт задания на репликацию.
                          - `Follower` — наполняется от лидера заранее, поэтому потеря лидера не означает наполнения с нуля.
                      full:
                        description: |
                          Содержит ли эта реплика ожидаемый набор.

                          Вычисляется по тому, что синкер фактически **записал**, и никогда пробой пути выдачи: на промахе сквозной кэш сам подтянул бы образ из upstream и отчитался об успехе на пустом хранилище. В air-gap самонаполнение невозможно, поэтому там честно читать каталог и сравнивать с `spec.source.expectedDigests`.
                      verifiedDigests:
                        description: |
                          Сколько digest'ов **из набора** подтверждено на месте.

                          Набор — это то, что объявляют релизы кластера и сохраняемые модули, то есть digest'ы, известные deckhouse-controller. Поэтому это число напрямую сопоставимо с `full` и именно по нему принимается решение о переходе в air-gap. Всё остальное, что оказалось в хранилище, учитывается в `totalDigests`.
                      totalDigests:
                        description: |
                          Сколько различных digest'ов эта реплика хранит **всего**.

                          Это другая величина, чем `verifiedDigests`, и по ней ничего не решается. Она нужна, чтобы хранилище, содержащее больше, чем требуется этому кластеру — загруженный бандл с другими модулями, другими редакциями, аттестациями — выглядело именно так, а не как недостача относительно `spec.source.expectedDigests`.
                      address:
                        description: |
                          Адрес, на котором отвечает эта реплика, в виде `host:port`.

                          Сообщает сама реплика — чтобы follower мог реплицировать с лидера, не разрешая имя узла в адрес, и чтобы синкерам вообще не требовалось читать объекты Node.
                      source:
                        description: |
                          Реплика, от которой наполняется эта. Пусто для лидера.
                      error:
                        description: |
                          Почему последнее задание на наполнение или проверку завершилось ошибкой — по отчёту синкера этой реплики. Пусто, если последнее задание прошло успешно.

                          Безопасность от этого поля не зависит: упавшая реплика просто не `full`, а upstream снимается только когда лидер **полон**. Поле нужно, чтобы оператор мог отличить «ещё наполняется» от «сломалось», чего счётчики наполнения сами по себе не выражают.
                conditions:
                  description: |
                    Детальное состояние хранилища.
                  items:
                    properties:
                      type:
                        description: |
                          Тип состояния.
                      status:
                        description: |
                          Значение состояния.
                      observedGeneration:
                        description: |
                          Поколение `spec`, для которого выставлено состояние.
                      lastTransitionTime:
                        description: |
                          Время последнего изменения состояния.
                      reason:
                        description: |
                          Машиночитаемая причина состояния.
                      message:
                        description: |
                          Пояснение для человека.
