spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Объявляет дополнительное хранилище образов контейнеров, в которое кластер маршрутизирует загрузки, помимо основного.

            Это штатный способ для модуля, администратора или пользователя добавить своё хранилище образов контейнеров. Модуль создаёт объект с `ownerReference` на себя, поэтому объект удаляется сборщиком мусора вместе с модулем; GitOps-инструмент, ведущий ModuleConfig, не конкурирует за владение полями, потому что каждый upstream — отдельный объект.

            Трафик через такие upstream — **всегда транзит**: агент проксирует загрузку, подставляя ключи и сертификат удостоверяющего центра, и передаёт её потоком, не записывая ни на диск, ни в кеш. Место под кеш ограничено и отдано под компоненты Deckhouse — тем более в air-gap, где кеш является единственным источником образов.

            Значение `match`, уже занятое другим объектом, или затеняющее путь Primary, отклоняется, а не сливается молча. См. `status.conflict`.

            Объекты принимаются в порядке создания, начиная с самого старого. Все принятые объекты вместе ограничены 256 объектами и 256 КиБ `spec` (в JSON): объект, который не помещается, отклоняется, а ранее принятый объект более новым никогда не вытесняется.

            Если модуль выключен или работает в режиме `Unmanaged`, агента на узлах нет. Тогда объекты по тем же правилам разбирает `node-manager`: он заполняет `status` и передаёт принятые объекты узлам. Узлы применяют их напрямую в конфигурацию среды выполнения контейнеров: среда выполнения загружает образы из upstream и его зеркал без прокси. Значение `match`, совпадающее с registry какого-либо `ModuleSource`, принимается: на узлах Immutable объект заменяет этот registry вместе с его сертификатом удостоверяющего центра, а на узлах, которые настраивает bashible (кроме узлов с containerd v1, описанных ниже), registry остаётся таким, как его настраивает `ModuleSource`. Пока модуль не настраивает узлы — он выключен или работает в режиме `Unmanaged`, — узлы с containerd v1 (`Containerd`) не применяют upstream с `path`, а также upstream, чей registry уже настроен на узле или указан в объекте дважды. Такой объект остаётся принятым, а сообщение его условия `Accepted` называет группы узлов, которые его не применяют, и причину.
          properties:
            spec:
              properties:
                match:
                  description: |
                    Хост хранилища образов контейнеров, который перехватывается на узлах.
                upstream:
                  description: |
                    Куда фактически отправляются перехваченные загрузки.
                  properties:
                    scheme:
                      description: |
                        Протокол подключения к хранилищу образов контейнеров.
                    host:
                      description: |
                        Хост хранилища образов контейнеров, опционально с портом. IPv6-адрес записывается в квадратных скобках, после которых указывается порт.
                    path:
                      description: |
                        Префикс пути к репозиторию внутри хранилища образов контейнеров.
                    ca:
                      description: |
                        PEM-сертификат удостоверяющего центра для проверки хранилища образов контейнеров при `scheme: HTTPS`.

                        Принимаются только блоки `CERTIFICATE`, и каждый из них должен разбираться.
                    auth:
                      description: |
                        Ключи доступа к хранилищу образов контейнеров.

                        **Чувствительные данные.** Ключи хранятся внутри объекта, а не по ссылке на секрет, — так агент на узле остаётся самодостаточным при недоступном API-сервере.
                      properties:
                        username:
                          description: |
                            Имя пользователя для базовой аутентификации.
                        password:
                          description: |
                            Пароль для базовой аутентификации.
                        auth:
                          description: |
                            Заранее закодированное значение `base64("username:password")`.

                            Имеет приоритет над `username` и `password`, если задано. Если заданы обе формы, они должны задавать одни и те же ключи доступа.
                    mirrors:
                      description: |
                        Дополнительные адреса, отдающие **тот же** контент, что и хранилище образов контейнеров, — для отказоустойчивости.
                      items:
                        properties:
                          scheme:
                            description: |
                              Протокол подключения к зеркалу.
                          host:
                            description: |
                              Хост зеркала, опционально с портом. IPv6-адрес записывается в квадратных скобках, после которых указывается порт.
                          path:
                            description: |
                              Префикс пути к репозиторию внутри зеркала.
                          ca:
                            description: |
                              PEM-сертификат удостоверяющего центра для проверки зеркала.
                          auth:
                            description: |
                              Ключи доступа к зеркалу.

                              **Чувствительные данные.** См. `upstream.auth`.
                            properties:
                              username:
                                description: |
                                  Имя пользователя для базовой аутентификации.
                              password:
                                description: |
                                  Пароль для базовой аутентификации.
                              auth:
                                description: |
                                  Заранее закодированное значение `base64("username:password")`.
            status:
              properties:
                observedGeneration:
                  description: |
                    Поколение `spec`, на которое контроллер отреагировал последним.
                accepted:
                  description: |
                    Скомпилировал ли контроллер этот upstream в выкладку по узлам.
                conflict:
                  description: |
                    Почему объект отклонён: какой объект уже занял `match`, что `match` затеняет путь Primary, какое поле `spec` некорректно или что объект не помещается в ограничения на все принятые объекты.

                    Пусто, если объект принят.
                conditions:
                  description: |
                    Результат арбитража с машиночитаемой причиной.

                    - `Accepted` — входит ли upstream в выкладку по узлам.
                  items:
                    properties:
                      type:
                        description: |
                          Тип состояния.
                      status:
                        description: |
                          Значение состояния.
                      observedGeneration:
                        description: |
                          Поколение `spec`, для которого выставлено состояние.
                      lastTransitionTime:
                        description: |
                          Время последнего изменения состояния.
                      reason:
                        description: |
                          Машиночитаемая причина состояния.
                      message:
                        description: |
                          Пояснение для человека.
