- name: d8.registry.storage-update
  rules:
  # An hour, because the case that resolves on its own takes a while legitimately: a follower copying
  # a whole release from the leader on a slow disk. The cases that do not resolve on their own read
  # the same in the meantime, and the reason label is what tells them apart.
  #
  # `and on()`, so that the reason survives into the description: see D8RegistryUpstreamProbeFailing.
  - alert: D8RegistryStorageUpdateBlocked
    expr: |
      max by (reason) (d8_registry_storage_update_blocked) > 0
      and on() max(d8_registry_managed) > 0
    for: 1h
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The in-cluster registry cache cannot be updated to its new revision.
      description: |-
        The `registry-storage` StatefulSet has a new revision, and the controller that replaces its
        replicas has refused to replace the next one for an hour. Existing replicas remain running,
        but the cache update cannot proceed. The `reason` label identifies what is blocking it.

        Reason: `{{ $labels.reason }}`

        - `HolderNotReady` — the cache has one replica and no upstream, so its new images must be on
          its master before it is replaced. The `registry-storage-image-holder` DaemonSet keeps them
          there and has not got all of them yet. If its pod on the master is in `ImagePullBackOff`,
          the cache does not hold an image: push the Deckhouse Platform release the cluster is updating to with
          `d8 mirror push`, and the holder pulls it on its next retry. If the pod is in
          `CrashLoopBackOff` or `CreateContainerError`, the holder has the image but cannot run it,
          and a push does not help: the cause is in the events of the pod. Otherwise it is still
          rolling or pulling, and there is nothing to do.
        - `SingleReplicaWithoutHolder` — the same, and the DaemonSet has no pod on that master at all.
          For a moment this is normal while the DaemonSet creates its pod there; lasting an hour, it means
          the DaemonSet does not schedule a pod there. Find out why with
          `d8 k -n d8-system describe daemonset registry-storage-image-holder`.
        - `LeaderWithoutFullFollower` — only the leader is left to replace, and no follower holds the
          whole image set to take over from it. If the leader holds the set, the followers are copying
          it and the update continues once one of them finishes. If the leader reports that it does not
          hold it, the followers cannot complete the set either, since they copy it from the leader:
          pull the Deckhouse Platform release and the modules the cluster uses with `d8 mirror pull`,
          as described in the [air-gapped update guide](https://deckhouse.io/products/kubernetes-platform/documentation/v1/guides/airgapped-update.html),
          and push them into the cache with `d8 mirror push`, as in step 2 of
          [Going air-gapped](https://deckhouse.io/modules/registry/examples.html#going-air-gapped).
          If the leader has not reported yet, reports an error or cannot tell which set the cluster
          needs, pushing does not help: the cause is in the log of the `syncer` container of the
          leader's pod.
        - `LeaderNotServing` — the storage lease names a master where no serving replica runs. The
          replicas move the lease on their own once it expires.
        - `StorageUnknown` — the `RegistryStorage` resource does not exist. The controller creates it;
          check the log of `registry-controller`.

        The event on the StatefulSet says which replica and what it is waiting for:

        ```
        d8 k -n d8-system get events --field-selector involvedObject.name=registry-storage,reason=UpdateBlocked
        ```

        And the two things it is waiting on:

        ```
        d8 k -n d8-system get pods -l app=registry-storage-image-holder -o wide
        d8 k get registrystorage registry -o jsonpath='{.status.replicas}' | jq
        ```
