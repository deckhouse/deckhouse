- name: d8.registry.migration
  rules:
  - alert: D8RegistryMigrationPending
    expr: max by (reason) (d8_registry_migration_pending) > 0
    for: 5m
    labels:
      severity_level: "8"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The registry module is held on its v1 implementation.
      description: |-
        This cluster still pulls images the way the v1 implementation of the
        `registry` module arranged it, and the handover to the current implementation
        has not happened. This alert does not resolve on its own while the reason
        stays, and the following DP releases stay blocked by the
        `registryImplementation` requirement.

        Reason: `{{ $labels.reason }}`

        The handover waits because both implementations configure the same thing on
        every node: which registry the container runtime asks, and with which
        credentials. Running both would not merge those two answers, it would race
        them. So the current implementation takes over only from a state it can take
        over from.

        What to do depends on the reason:

        - The reason names the **`Direct`** mode. This release can take over on its own
          once it knows where images come from: set `mode: Managed` in the `registry`
          ModuleConfig together with `primary.upstream`. Take the values from the
          `registry.direct` section of the `deckhouse` ModuleConfig, as the module's FAQ
          shows for the `Direct` mode: `imagesRepo` splits into `host` and `path`, the
          credentials stay the same, plus `ca` if the registry requires one. The handover
          happens on the module's next reconciliation and this alert clears.

        - The reason names the **`Proxy`** or **`Local`** mode, says the v1
          implementation is **transitioning**, has **not recorded a mode**, or that its
          state or node configuration **cannot be read**. This state is not supported.
          A cluster gets here only through an update that bypassed the
          `registryImplementation` release requirement: a forced release, an edited
          image, or a jump from a release older than DP 1.77.1. DP 1.78 has no code that
          can manage or migrate this state.

          DP 1.78 does not deploy the v1 implementation, and the update removed the
          components that managed its node services on the masters. Depending on the
          timing of the update, those services were stopped, or keep running with
          nothing to manage them or renew their certificates. The nodes keep the
          registry configuration the v1 implementation gave them. Images already on a
          node keep working; pulling any other image may fail.

          Do not change the `registry` or `deckhouse` ModuleConfigs and do not delete
          the `registry-*` secrets in `d8-system`: those secrets keep the handover
          closed, so that the current implementation is not deployed next to what the
          v1 implementation left. Contact Deckhouse Platform technical support.

        To see the mode the v1 implementation recorded:

        ```
        d8 k -n d8-system get secret registry-state -o jsonpath='{.data.state}' | base64 -d | head
        ```

        If that secret is gone, the node configuration the v1 implementation left still
        shows the mode. This prints the mode and the proxy endpoints only, without
        credentials:

        ```
        d8 k -n d8-system get secret registry-bashible-config -o jsonpath='{.data.config}' | base64 -d \
          | awk '/^(agent|mode):/ {print; next} /^proxyEndpoints:/ {p=1; print; next} p && /^ *- / {print; next} {p=0}'
        ```

  # Its own alert rather than a line in the migration one: this is not about migrating, it is about a
  # cluster that already runs this implementation and has a node whose next ordinary bashible run will
  # stop converging. An operator who reads it has minutes of work to do and, usually, hours before the
  # consequence — which is exactly the gap the alert exists to close.
  - alert: D8RegistryNodeForeignRegistryConfig
    expr: max by (node) (d8_registry_node_foreign_registry_config) > 0
    for: 5m
    labels:
      severity_level: "5"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: Node {{ $labels.node }} carries container runtime registry configuration the registry module did not write.
      description: |-
        Node `{{ $labels.node }}` has a file under `/etc/containerd/conf.d/` (containerd v1) or
        `/etc/containerd/conf2.d/` (containerd v2) that configures a registry, and the `registry`
        module manages this cluster's registry configuration. Two writers of that configuration is
        not a state the platform supports, so bashible refuses to merge such a file.

        One exception for now: on containerd v1 with the module in the `Unmanaged` mode, a
        `conf.d` file is still merged. The refusal described below starts there once the module is
        switched to `mode: Managed`, so fix the file before that switch.

        **Right now nothing is broken, and that is the danger.** The refusal happens inside the
        bashible step that builds the container runtime configuration, and that step only runs when
        something makes it run. Until then the file has no effect at all: bashible compares the
        node's configuration checksum, finds it unchanged and reports "Configuration is in sync,
        nothing to do".

        The step does run on its own, though: a node re-applies its whole configuration
        periodically (roughly every four hours), and also on any registry change, platform upgrade
        or reboot. At that point the step fails with

        ```
        Failed to merge /etc/containerd/conf.d/<file>: it contains custom registry fields,
        configure them in /etc/containerd/registry.d instead
        ```

        and retries, so the node stops applying configuration entirely — hours after the change
        that caused it, and with nothing else to connect the two.

        What to do, before that happens:

        1. Find the file on the node:

           ```
           ls /etc/containerd/conf.d/ /etc/containerd/conf2.d/ 2>/dev/null
           grep -l registry /etc/containerd/conf.d/*.toml /etc/containerd/conf2.d/*.toml 2>/dev/null
           ```

        2. Move the registry part of it to a host directory, which is where this platform
           configures registries and where the module's node agent leaves other people's entries
           alone:

           ```
           /etc/containerd/registry.d/<registry host>/hosts.toml
           ```

        3. Remove the registry section from the `conf.d` file (anything non-registry in it can
           stay), and remove the `NodeGroupConfiguration` that writes it if that is where it comes
           from.

        Doing it across a fleet with a `NodeGroupConfiguration` has one catch worth knowing in
        advance: give it a **weight below 32**. The step that refuses the file is
        `032_configure_containerd`, and a node stops at the step that fails — so a repair placed at
        a later weight never runs on the nodes that need it most. Measured: a cleanup
        configuration at weight 10 reached both nodes and cleared the label in 90 seconds.

        A node already stuck in the retry loop recovers on its own once the file is gone: measured,
        the configuration checksum returned in 75 seconds.
