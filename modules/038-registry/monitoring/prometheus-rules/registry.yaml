- name: d8.registry.data-plane
  rules:
  # Rules about what the module is managing are guarded by `d8_registry_managed`, because a
  # cluster where it manages nothing has no cache to be incomplete and no nodes to be
  # unconverged — an alert firing on that would be firing at a module doing exactly what it
  # was told.
  #
  # Three are deliberately not guarded. `D8RegistryStaleCacheData` is about precisely the
  # unmanaged case, so guarding it would silence the only state it describes. The other two
  # read gauges the controller sets only while it is running, so the guard would add nothing.
  #
  # Everything aggregates away the `pod` label. The exporter runs on every controller
  # replica rather than only the one holding the lease, so that the picture of the cluster
  # does not depend on the health of the pod most likely to be in trouble; duplicate series
  # are the price, and this is where it is paid.

  - alert: D8RegistryConfigInvalid
    expr: |
      max(d8_registry_managed) > 0
      and max(d8_registry_config_valid) == 0
    for: 5m
    labels:
      severity_level: "4"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The registry configuration was rejected.
      description: |-
        The `registry` module cannot use its configuration, so the cluster keeps whatever
        arrangement it already had. Nothing has broken yet; nothing new will take effect
        either.

        What was wrong is in the resource:

        ```
        d8 k get registryconfig registry -o jsonpath='{.status.conditions}' | jq
        ```

  - alert: D8RegistryNodeNotConverged
    expr: |
      max(d8_registry_managed) > 0
      and count(max by (node) (d8_registry_node_reconciled) == 0) > 0
    for: 20m
    labels:
      severity_level: "5"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: Some nodes have not applied their registry configuration.
      description: |-
        The agent on one or more nodes has not applied the layout it was given. Those nodes
        keep pulling images the way they were configured before, so this is not an outage —
        but a change made to the registry configuration has not reached them, and the next
        one will not either.

        Which nodes, and what their agents say:

        ```
        d8 k get registrynodes -o custom-columns=\
        NODE:.metadata.name,GEN:.metadata.generation,APPLIED:.status.observedGeneration,OK:.status.reconciled
        d8 k -n kube-system logs -l component=registry-agent --tail=50
        ```

        Twenty minutes, because the agent re-reads its layout on a timer and a node that is
        merely slow or briefly unreachable resolves this on its own.

  - alert: D8RegistryNodeRunningFromDisk
    expr: |
      max(d8_registry_managed) > 0
      and count(max by (node) (d8_registry_node_layout_from_disk) > 0) > 0
    for: 1h
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: Some nodes are routing pulls from their on-disk copy of the configuration.
      description: |-
        The agent on one or more nodes read its layout from the API server and could not use
        it, so it is routing pulls from the copy it keeps on disk. Most often the credentials
        the layout references cannot be read; a read that failed while the status write after
        it went through looks the same. That is the copy working as designed — those nodes
        pull images normally, which is exactly why this is worth saying out loud: from every
        other angle it looks like success, and their configuration can drift arbitrarily far
        behind the cluster's.

        An hour, because a node that falls back for a pass or two is not news; a node that
        has not come off the copy since is.

        ```
        d8 k get registrynodes -o json | jq -r '
          .items[] | select(.status.conditions[]? | select(.type=="Reconciled" and .reason=="AppliedFromCache"))
          | .metadata.name'
        d8 k -n kube-system logs -l component=registry-agent --tail=200 | grep 'cannot resolve the credentials'
        ```

        What this alert cannot see is an agent that cannot write its status at all, since
        that write is how it reports the fallback. A node cut off from the API server is the
        main case: the agent reaches the API server the way the kubelet does, so the node
        shows as `NotReady` and is reported as such. An agent whose own access is refused is
        the other, and while its node stays `Ready` nothing reports it.

  # The agent's health as the kubelet sees it, rather than as the agent reports it. A crashed
  # agent reports nothing, a frozen one cannot, and a node whose manifest is gone has no agent to
  # report anything: RegistryNode keeps the status it was last given, and the agent's own metrics
  # stop with it. The kubelet's probes and kube-state-metrics see all three.
  #
  # Every node with a RegistryNode is expected to run one, and a node with no Ready mirror pod
  # called registry-agent-<node> is the alert — so a pod that is missing altogether counts, not
  # only one that is failing. A node that is not Ready is left out: its kubelet cannot update the
  # mirror pod, and the node itself is the bigger news. A node is kept when kube-state-metrics says
  # it is Ready rather than dropped when it says NotReady, so with kube-state-metrics disabled or
  # down the alert stays silent instead of firing on every node. kube_pod_info is reduced to one
  # series per pod because a static pod whose manifest changed comes back under the same name with
  # a new UID, and for a while both are in the lookback.
  #
  # Not covered: an agent that serves pulls but cannot reach the API server answers its probes and
  # is Ready, so this alert says nothing about it.
  - alert: D8RegistryAgentNotReady
    expr: |
      max by (node) (d8_registry_node_reconciled)
      unless on (node) max by (node) (
        (kube_pod_status_ready{namespace="kube-system", pod=~"registry-agent-.+", condition="true"} == 1)
        * on (namespace, pod) group_left (node)
        max by (namespace, pod, node) (kube_pod_info{namespace="kube-system", pod=~"registry-agent-.+"})
      )
      and on (node) max by (node) (kube_node_status_condition{condition="Ready", status="true"} == 1)
      and on () max(d8_registry_managed) > 0
    for: 15m
    labels:
      severity_level: "4"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The registry agent on node {{ $labels.node }} is not ready.
      description: |-
        The registry agent on node `{{ $labels.node }}` is not answering, or is not running at
        all. Every pull on the node goes through it, and without it containerd pulls straight
        from the registry an image names. Images of the platform itself, and of registries that
        need the cluster's credentials or certificate authority, then fail on that node; other
        images still pull, bypassing the in-cluster cache and any `RegistryUpstream`.

        The kubelet restarts an agent that stops answering for a minute, so a state that lasts
        this long is one a restart does not fix: an agent that fails on start, or one that is
        not on the node at all.

        What the pod says:

        ```
        d8 k -n kube-system get pod registry-agent-{{ $labels.node }} -o wide
        d8 k -n kube-system describe pod registry-agent-{{ $labels.node }}
        d8 k -n kube-system logs registry-agent-{{ $labels.node }} --previous --tail=50
        ```

        An agent that exits on start names in its log what it could not use, usually its
        certificate material under `/etc/kubernetes/registry-agent/pki` or containerd's
        drop-in directory.

        No such pod means either that the kubelet has no manifest for it — on a node bashible
        configures, that is `/etc/kubernetes/manifests/registry-agent.yaml` — or that the API
        server refused the mirror pod, in which case the agent may well be running. The
        kubelet's log on the node says which:

        ```
        journalctl -u kubelet --since "1 hour ago" | grep registry-agent
        ```

        A node of a NodeGroup with `systemType: DeckhouseEngine` has no SSH: start a debug pod on it
        with `d8 k debug node/{{ $labels.node }} -it --image=ubuntu` and run `chroot /host`
        first.

        Fifteen minutes, so that a node taking over the agent after the module starts managing
        it, or an update that replaces the agent on every node, does not raise it.

  # Readiness alone misses an agent that keeps coming back: one that runs for a while, fails, and
  # is restarted is Ready most of the time, and each restart drops the pulls in flight on its
  # node. Five restarts an hour is past what an update, or one bad moment, explains.
  #
  # Five or more, not more than five: increase extrapolates to the ends of the window, so five
  # restarts usually read a little above five and read exactly five only when the samples line up
  # with the window. "> 5" fired at about the fifth restart, which "more than five" did not
  # describe; ">= 5" fires at the fifth however the samples fall.
  - alert: D8RegistryAgentRestartingTooOften
    expr: |
      max by (node) (
        increase(kube_pod_container_status_restarts_total{namespace="kube-system", pod=~"registry-agent-.+", container="registry-agent"}[1h])
        * on (namespace, pod) group_left (node)
        max by (namespace, pod, node) (kube_pod_info{namespace="kube-system", pod=~"registry-agent-.+"})
      ) >= 5
      and on () max(d8_registry_managed) > 0
    for: 5m
    labels:
      severity_level: "5"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The registry agent on node {{ $labels.node }} keeps restarting.
      description: |-
        The registry agent on node `{{ $labels.node }}` has restarted five times or more in
        the last hour. Each restart drops every pull in flight on the node, and until the agent
        is back containerd pulls without it, where images of the platform cannot be pulled.

        Either the agent exits on its own, or the kubelet kills it because it stopped answering
        its liveness probe for a minute. The last state of the container says which:

        ```
        d8 k -n kube-system get pod registry-agent-{{ $labels.node }} -o jsonpath='{.status.containerStatuses[0].lastState}' | jq
        d8 k -n kube-system logs registry-agent-{{ $labels.node }} --previous --tail=100
        d8 k -n kube-system get events --field-selector involvedObject.name=registry-agent-{{ $labels.node }}
        ```

        `Liveness probe failed` in the events is an agent that hung: the log before the restart
        shows what it was doing. An exit code with an error in the log is an agent that gave
        up: the log names what it could not use.

  - alert: D8RegistryStorageIncomplete
    expr: |
      max(d8_registry_managed) > 0
      and max(d8_registry_storage_replicas) > 0
      and count(
        (max by (node) (d8_registry_storage_replica_full) == 0)
        unless on (node) (max by (node) (d8_registry_store_writable{reason="NotWritable"}) == 0)
      ) > 0
    for: 2h
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: Some registry cache replicas do not hold the whole image set.
      description: |-
        One or more replicas of the in-cluster cache are still filling, or have stopped
        short. While an upstream is configured this costs nothing at pull time — a node
        falls back to it — but it does mean the cluster could not survive losing that
        upstream, and it is what holds an air-gap transition back.

        Two hours, because filling a cache over a slow link legitimately takes that long.

        A replica that reports an `error` counts as not holding the set, whatever it holds: the
        error says why — a store that is not on the disk meant for it, for one. A replica whose
        store the registry cannot write to is left out: it is neither filling nor going to,
        and `D8RegistryStoreWritesRefused` reports it with what to do.

        ```
        d8 k get registrystorage registry -o json | jq '.status.replicas[] | {node, full, error}'
        ```

  - alert: D8RegistryAirGapTransitionHeld
    expr: max(d8_registry_air_gap_transition_held) > 0
    for: 6h
    labels:
      severity_level: "5"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The registry upstream cannot be removed yet.
      description: |-
        The configuration has no upstream, so the cluster is meant to be air-gapped, and the
        module is still holding the previous upstream: either the cache is not complete
        enough to stand alone, or the cache leader's report was not written by the `syncer`
        running on its node now, or workloads in the platform namespaces (`kube-system` and
        `d8-*`) still reference the upstream and would have nowhere to pull from without it.
        Workloads in other namespaces are not counted and do not hold the transition.

        This is the safe outcome and the cluster is pulling images normally. It is also the
        one transition in this module that could cut every node off from images, which is
        why it waits rather than proceeds — and why a wait this long is worth looking at:
        nothing about it resolves on its own if the cache has stopped filling, or if a
        rollout onto the in-cluster address is stuck.

        Check the cache and the current count of references to the upstream
        (`upstreamReferences`):

        ```
        d8 k get registrystorage registry -o jsonpath='{.status}' | jq '{phase,fill,safeToDropUpstream,upstreamReferences,leader}'
        d8 k get registryconfig registry -o jsonpath='{.status.effectiveUpstream}' | jq
        ```

        The `registry-controller` log names up to five of the referencing objects each time
        the count changes. To see the last such line:

        ```
        d8 k -n d8-system logs -l app=registry-controller -c registry-controller --prefix --tail=-1 | grep 'still names the upstream' | tail -1
        ```

        If the leader is full and `upstreamReferences` is `0`, the upstream is held on the
        leader's report: its `syncerStartedAt` is missing or earlier than the start of the
        `syncer` container in the leader's storage pod. The `syncer` stamps its report once it
        has read its store, normally within two minutes of starting. The hold does not end
        while the leader's storage pod is not Ready, or while that pod runs a `syncer` from
        before `syncerStartedAt` existed (during a module update), which stamps nothing. To
        see the leader's report and the controller's reason:

        ```
        d8 k get registrystorage registry -o json | jq '.status as $s | $s.replicas[] | select(.node == $s.leader) | {node,full,error,syncerStartedAt}'
        d8 k -n d8-system logs -l app=registry-controller -c registry-controller --prefix --tail=-1 | grep 'the upstream is held' | tail -1
        ```

        Deleting the leader's storage pod is safe while the upstream is held: the replacement
        `syncer` reads its store and stamps its report, normally within two minutes.

  # `and on()` and not a bare `and`: the left side keeps its labels so the description can
  # name which of the three failures it is, and vector matching against a label-less
  # aggregate would otherwise find nothing to match and the rule would never fire.
  - alert: D8RegistryUpstreamProbeFailing
    expr: |
      max by (outcome) (increase(d8_registry_upstream_probes_total{outcome!="accepted"}[30m])) > 0
      and on() max(d8_registry_managed) > 0
    for: 15m
    labels:
      severity_level: "4"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The configured registry upstream does not pass its preflight check.
      description: |-
        A change to the primary upstream was refused, and the cluster is still using the
        last one that worked. Nothing is degraded — that is what holding the previous
        upstream is for — but the change has not taken effect and will not until the check
        passes.

        The `outcome` label says which of three things is wrong, and they are not the same
        problem:

        - `unreachable` — the registry did not answer at all: network, firewall, or the
          registry itself.
        - `auth` — it answered and rejected the credentials. Usually an expired or wrong
          license key.
        - `sentinel` — it answered and accepted the credentials, but does not hold the
          Deckhouse images. Usually the wrong repository path.

        Current outcome: `{{ $labels.outcome }}`

        ```
        d8 k get registryconfig registry -o jsonpath='{.status.conditions}' | jq
        ```

  - alert: D8RegistryUpstreamRejected
    expr: max by (reason) (d8_registry_upstreams_rejected) > 0
    for: 15m
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: An additional registry was refused.
      description: |-
        A `RegistryUpstream` resource was not accepted, so pulls for the registry it names
        are not intercepted on any node. Whatever asked for it — a module, or an operator —
        is not getting it.

        Reason: `{{ $labels.reason }}`

        ```
        d8 k get registryupstreams -o custom-columns=\
        NAME:.metadata.name,MATCH:.spec.match,ACCEPTED:.status.conditions[0].status,REASON:.status.conditions[0].reason
        ```

  - alert: D8RegistryStaleCacheData
    expr: max by (node) (d8_registry_storage_stale_data_bytes) > 0
    for: 24h
    labels:
      severity_level: "8"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: A node still holds registry cache data that nothing uses.
      description: |-
        Node `{{ $labels.node }}` holds data of the in-cluster registry cache while no cache
        is configured. Nothing reads it, and nothing will unless the cache is turned back
        on.

        It is kept on purpose. Turning the cache back on refills from what is already there
        rather than from scratch, and over a slow link that difference is hours — so the
        module does not delete it, because that would make the decision irreversible in the
        one direction that hurts. What it will not do is keep it quietly, which is what this
        alert is.

        Nothing is wrong and nothing needs doing urgently. To reclaim the space, remove the
        contents of the directory the store kept its blobs in: `/var/lib/deckhouse/registry`
        on a node of a NodeGroup with `systemType: DeckhouseEngine`, `/opt/deckhouse/registry` on
        other nodes. Keep the directory itself: the agent has it mounted, and once it is
        removed the agent no longer sees the node's directory, so data a cache leaves there
        later goes unreported until the agent restarts. With the cache off there is no
        RegistryStorage left to ask, so the command below looks at both.

        Open a root shell on the node over SSH. A node of a NodeGroup with
        `systemType: DeckhouseEngine` has no SSH: start a debug pod on it and switch to the node's
        root filesystem:

        ```
        d8 k debug node/{{ $labels.node }} -it --image=ubuntu
        chroot /host
        ```

        Then remove the data, keeping the directories themselves:

        ```
        for dir in /opt/deckhouse/registry /var/lib/deckhouse/registry; do
          [ -d "$dir" ] && du -sh "$dir" && find "$dir" -mindepth 1 -delete
        done
        ```

        Twenty-four hours, so that turning the cache off and on again in one working session
        never raises it.

  # The collection is the only thing that ever removes anything from the store. A cluster where
  # it has stopped is on a path that ends with a full disk and a registry that cannot be
  # written to — which, in air-gap, is a cluster that cannot be updated.
  # The third line is the one that makes this honest, and it is here because without it this
  # alert fired on every healthy new cluster. `last_collection` is a registered gauge, so it is
  # exposed as 0 from the first scrape and stays 0 until a collection finishes — and
  # `time() - 0` is the whole Unix epoch, which is past any threshold. So a cluster that had
  # simply never collected yet was indistinguishable from one that stopped collecting a week ago,
  # and with an hour's patience the alert arrived an hour after boot.
  #
  # Asking how long the replica has been ABLE to collect fixes both readings at once: a store
  # that has never been reclaimed and has had a week in which to do it is worth a word, and one
  # that is younger than that is not.
  - alert: D8RegistryStorageNotReclaimed
    expr: |
      max(d8_registry_managed) > 0
      and max(d8_registry_storage_replicas) > 0
      and time() - max(d8_registry_storage_started_timestamp_seconds) > 604800
      and (
        time() - max(d8_registry_storage_last_collection_timestamp_seconds) > 604800
        or absent(d8_registry_storage_last_collection_timestamp_seconds)
      )
    for: 1h
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The registry cache has not reclaimed its disk for a week.
      description: |-
        No replica of the in-cluster cache has finished a garbage collection in the last week.
        Nothing is broken yet: the cache serves images normally, and it will keep doing so until
        the disk fills.

        It is worth attention because the collection is the only thing that ever removes
        anything. Every release adds a slice of the repository, so a store nobody reclaims grows
        in one direction — and a full store cannot be written to, which in an air-gapped cluster
        means it cannot be updated.

        Where to look:

        ```
        d8 k get registryoperation -o wide
        d8 k get registrystorage registry -o jsonpath='{.status.replicas}' | jq \
          'map({node, collectedAt, collectionError})'
        d8 k get registrystorage registry -o jsonpath='{.spec.garbageCollection}' | jq
        ```

        The likely reasons, in the order they are worth checking:

        - the collection is turned off in the `registry` ModuleConfig under
          `storage.garbageCollection.enabled`;
        - the schedule has not come round yet, or names an hour that never arrives — an
          unreadable expression is refused rather than guessed at — and the image set has not
          changed either;
        - the collections are created and fail: the `RegistryOperation` objects of type
          `GarbageCollection` say why in `status.replicas`, for a day after they finish;
        - no release is deployed, which is the one input that justifies deleting anything: every
          deletion is "older than what the cluster runs", and without that there is nothing to
          compare against;
        - `collectionError` on a replica, which says what its own last attempt hit.

        One reading tells the first two apart from the rest. The controller logs every collection
        it creates and every firing of the schedule it skips, so their absence means none was ever
        started — a different problem from one that is started and failing:

        ```
        d8 k -n d8-system logs -l app=registry-controller -c registry-controller --tail=-1 | grep -iE "garbage collection|schedule fired"
        ```

        Collecting is not an outage — the replica keeps serving every image it holds — but it
        pauses filling the replica's store and can fail a `d8 mirror push` started meanwhile, so
        the schedule belongs at a quiet hour, which is where it defaults to.

  # The store's two limits, and a store directory the registry cannot write to. The registry enforces
  # the limits itself, synchronously, on every write — these alerts are not what keeps the node alive,
  # and could not be: between "fine" and "full" there are minutes. They say that it has happened, and
  # what to do about it. A directory that refuses writes is not a limit at all, and no other alert
  # reports it: the registry answers each write with a 500 that names no file, and only the replica's
  # error says why.
  #
  # Two minutes, not zero, because the syncer decides writability from one measurement per pass
  # and a store at the very edge can read either way for a pass. The refusal itself is not
  # transient: once here, it stays until somebody acts or a collection runs.
  - alert: D8RegistryStoreWritesRefused
    expr: |
      (max by (node, reason) (d8_registry_store_writable) == 0)
      and on() (max(d8_registry_managed) > 0)
    for: 2m
    labels:
      severity_level: "4"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The registry cache on node {{ $labels.node }} does not accept writes ({{ $labels.reason }}).
      description: |-
        The in-cluster registry cache on node `{{ $labels.node }}` has stopped accepting writes,
        because `{{ $labels.reason }}`. It keeps serving every image it holds. What stops is
        everything that ADDS to it: filling the next release, replicating from the leader,
        `d8 mirror push`. In an air-gapped cluster a release that is not in the cache cannot be
        installed.

        What the replica measured, and the error it reports:

        ```
        d8 k get registrystorage registry -o json | jq '.status.replicas[] | {node, store, error}'
        ```

        `BudgetExhausted` — the store holds as much as `storage.size` allows. The node is safe:
        this is the limit doing its job, and images the store cannot keep are streamed from the
        upstream while there is one. Either raise `storage.size` in the `registry` ModuleConfig,
        if the disk has room for it, or let the garbage collection reclaim what no deployed
        release needs any more: it runs on `storage.garbageCollection.schedule` and keeps the
        deployed release, the previous one and everything newer.

        `ReserveExhausted` — the filesystem under the store is down to the space kept free on it.
        The node is safe for the same reason, and images are streamed the same way.
        `storage.size` is not what stops it, the disk is. On a filesystem shared with the node
        (`dedicatedFilesystem` absent from the replica's `store`) that is the kubelet's eviction
        threshold plus a margin: free space on the node, or — which is what fixes it for good —
        give the store a disk of its own, sized for `storage.size`. On a disk of the store's own
        (`dedicatedFilesystem: true`) it is the margin alone, and the disk itself is full: grow
        it — the reserve follows without a restart — or let the garbage collection reclaim what
        no deployed release needs, as for `BudgetExhausted`.

        `NotWritable` — the registry cannot create files in its tree in the store, whatever room
        the store has: `docker/registry/v2` and the directories under it, or the store's directory
        while that tree does not exist yet. It runs as root without capabilities, so those
        directories have to belong to root and let their owner write. Other causes are the
        immutable attribute, a read-only mount, or a security module such as SELinux or
        AppArmor. No limit is involved: neither the garbage collection nor a larger
        `storage.size` helps, and the collection does not start for it. Until it is fixed, a
        pull the cache would keep from the upstream fails with an error instead of being
        streamed. The replica's `error` names the directory on the node, its owner and mode, and
        the command that fixes it:

        ```
        d8 k get registrystorage registry -o json | jq -r '.status.replicas[] | select(.store.reason == "NotWritable") | "\(.node): \(.error)"'
        ```

        `NotWritable` takes precedence over a limit the store is also at. Once it is fixed, the
        replica says so within a minute, and the alert clears or names the limit.

  # Nearly, and not yet: a store already refusing writes is D8RegistryStoreWritesRefused's to report,
  # and firing both for one full store — which is what a live cluster did — is two alerts for one
  # fix.
  - alert: D8RegistryStoreNearlyFull
    expr: |
      (
        max by (node) (d8_registry_store_used_bytes)
          / max by (node) (d8_registry_store_budget_bytes > 0)
        > 0.85
      )
      unless on(node) (max by (node) (d8_registry_store_writable) == 0)
      and on() (max(d8_registry_managed) > 0)
    for: 5m
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The registry cache on node {{ $labels.node }} holds over 85% of storage.size.
      description: |-
        The in-cluster registry cache on node `{{ $labels.node }}` holds more than 85% of its
        budget, `storage.size` in the `registry` ModuleConfig. Nothing is refused yet. The next
        release may not fit: once the budget is reached, the cache stops accepting writes and
        `D8RegistryStoreWritesRefused` follows.

        ```
        d8 k get registrystorage registry -o json | jq '.status.replicas[] | {node, store}'
        ```

        Raise `storage.size` if the disk under the store has room — `filesystemFreeBytes` above
        `reserveBytes` is what is left — or check that the garbage collection runs: it is the only
        thing that reclaims space, and `D8RegistryStorageNotReclaimed` says when it has not.

  - alert: D8RegistryStoreUnbounded
    expr: |
      (max by (node) (d8_registry_store_budget_bytes) == 0)
      and on() (max(d8_registry_managed) > 0)
    for: 1h
    labels:
      severity_level: "7"
      tier: cluster
      d8_module: registry
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_create_group_if_not_exists__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_registry_alerts: "D8RegistryAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The registry cache has no storage.size, so only the node's disk limits it.
      description: |-
        The in-cluster registry cache is on, and `storage.size` is not set in the `registry`
        ModuleConfig. The node is still protected: the store never takes the space kept free for
        the kubelet. But that is the only limit, so the store may grow until it leaves the node
        exactly that and no more — and on a master that shares its disk with the store, everything
        else on it then works with the minimum.

        Set `storage.size` to what the store may take on each master: enough for three releases of
        the image set together with the modules and the module catalog, and no more than fits on the
        disk under the store above the reserve:

        ```
        d8 k get registrystorage registry -o json | jq '.status.replicas[] | {node, store}'
        ```

        An hour, so that turning the cache on and setting the size in two steps does not raise it.
