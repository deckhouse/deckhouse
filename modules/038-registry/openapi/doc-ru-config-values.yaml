type: object
properties:
  mode:
    description: |
      Управляет ли модуль тем, как кластер загружает образы.

      - `Unmanaged` — модуль не управляет ничем. Компоненты не создаются, конфигурация узлов не пишется; кластер продолжает загружать образы из того хранилища образов контейнеров, с которым был установлен. Это значение по умолчанию, поэтому включение модуля само по себе ничего не меняет.

        Переход в `Unmanaged` на кластере, которым модуль управлял, происходит не мгновенно: ссылки на образы по всему кластеру указывают на внутреннее хранилище образов контейнеров и переезжают на внешнее по мере того, как релиз каждого модуля рендерится заново. Поэтому модуль сразу перестаёт публиковать свой адрес, но продолжает его обслуживать, пока на него ссылается хоть что-нибудь — обычно это несколько минут. На кластере, который устанавливался с уже включённым модулем, он дополнительно записывает в реквизиты доступа к хранилищу образов контейнеров тот адрес, с которого сам загружал образы: иначе в кластере не останется записи о том, откуда брать образы, поскольку установщик записал туда внутренний адрес. До этого момента его компоненты продолжают работать, а алерт `D8RegistryDrainStuck` сообщает о переходе, который не может завершиться.
      - `Managed` — модуль владеет путём загрузки образов: настраивает container runtime на каждом узле через свой агент и, при необходимости, поднимает внутрикластерный кеш.

      Выбора реализации нет. Кластер, в котором предыдущая реализация модуля никогда не работала, всегда использует текущую; кластер, в котором работала, использует предыдущую до перевода её в состояние `Unmanaged`, после чего миграция завершается сама.
  primary:
    description: |
      Единственный авторитетный источник образов компонентов DP. Действует только при `mode: Managed`: если параметр задан при значении `mode`, отличном от `Managed`, конфигурация будет отклонена с сообщением об ошибке.

      Если его не указать, кластер считается изолированным (air-gap): единственным источником становится внутрикластерный кеш, который наполняется командой `d8 mirror push`.

      Дополнительные хранилища образов контейнеров объявляются отдельными ресурсами [RegistryUpstream](cr.html#registryupstream), а не здесь: модулю или пользователю, который приносит своё хранилище образов контейнеров, не должно требоваться править чужой ModuleConfig.
    properties:
      upstream:
        description: |
          Хранилище образов контейнеров, из которого загружаются образы компонентов DP.

          Если не задан, кластер считается air-gap: внутрикластерный кеш становится авторитетным и наполняется командой `d8 mirror push`. Отсутствие параметра требует `storage.cache: true` и `storage.source`.
        properties:
          scheme:
            description: |
              Протокол подключения к хранилищу образов контейнеров.

              Используйте `HTTP` только для незащищённых доверенных хранилищ образов контейнеров.
          host:
            description: |
              Хост хранилища образов контейнеров, опционально с портом.
          path:
            description: |
              Префикс пути к репозиторию внутри хранилища образов контейнеров.
          ca:
            description: |
              PEM-сертификат удостоверяющего центра для проверки хранилища образов контейнеров при `scheme: HTTPS`.

              Если не указан, используется системное хранилище доверенных сертификатов.
          auth: &registryAuthRu
            description: |
              Ключи доступа к хранилищу образов контейнеров.
            properties:
              license:
                description: |
                  Лицензионный ключ DP.

                  Сокращённая запись пары `username`/`password` для `registry.deckhouse.io`. Взаимоисключающий с ними.

                  Смена лицензии меняет ключи доступа к хранилищу образов контейнеров, поэтому она проходит через ту же preflight-пробу, что и смена адреса: новые ключи проверяются до переключения кластера, а при неудачной пробе остаются последние рабочие.
              username:
                description: |
                  Имя пользователя для базовой аутентификации.
              password:
                description: |
                  Пароль для базовой аутентификации.
          mirrors:
            description: |
              Дополнительные адреса, отдающие **тот же** контент, что и основное хранилище образов контейнеров, — для отказоустойчивости и балансировки.

              Зеркала не являются отдельными источниками: кеш хранит один дедуплицированный набор независимо от того, с какого зеркала пришли образы. Хранилище образов контейнеров с другим контентом — это дополнительный upstream, и его место в ресурсе [RegistryUpstream](cr.html#registryupstream).
            items:
              properties:
                scheme:
                  description: |
                    Протокол подключения к зеркалу.
                host:
                  description: |
                    Хост зеркала, опционально с портом.
                path:
                  description: |
                    Префикс пути к репозиторию внутри зеркала.
                ca:
                  description: |
                    PEM-сертификат удостоверяющего центра для проверки зеркала.
                auth:
                  <<: *registryAuthRu
  storage:
    description: |
      Внутрикластерный кеш хранилища образов контейнеров. Действует только при `mode: Managed`: если параметр задан при значении `mode`, отличном от `Managed`, конфигурация будет отклонена с сообщением об ошибке.
    properties:
      garbageCollection:
        description: |
          Когда кеш освобождает диск, занятый релизами, которые кластер уже прошёл.

          Нужна потому, что больше ничто ничего не удаляет: каждый релиз добавляет свой срез репозитория, поэтому кластер, живущий годами, заполняет хранилище и перестаёт быть способным загружать образы.

          На время сборки одна реплика переводится в режим только для чтения. Она продолжает отдавать все образы, которые держит; чего она не может — сохранить результат промаха кеша или принять `d8 mirror push`. Одновременно собирает только одна реплика, поэтому остальные не затронуты.
        properties:
          enabled:
            description: |
              Освобождает ли кеш свой диск вообще.

              Выключение оставляет хранилище расти без предела, и это осмысленно только при диске, размер которого делает это неважным.
          schedule:
            description: |
              Cron-выражение из пяти полей, в собственном часовом поясе реплик.

              По умолчанию — ночной час. Если у группы узлов `master` задано окно обслуживания, вместо этого берётся начало этого окна: время, которое оператор уже объявил безопасным для нарушения работы.
      cache:
        description: |
          Идут ли загрузки через внутрикластерный кеш на master-узлах.

          Это одна из двух осей конфигурации, вторая — задан ли `primary.upstream`. Вместе они покрывают все поддерживаемые схемы:

          - `cache: false` с заданным upstream — узлы загружают образы напрямую из upstream, кеш не разворачивается.
          - `cache: true` с заданным upstream — сквозной кеш, наполняется из upstream.
          - `cache: true` без upstream — air-gap: кеш является единственным источником образов и наполняется командой `d8 mirror push`.

          Включение и выключение кеша — безопасная идемпотентная перенастройка. Единственный переход с условием — снятие upstream при включённом кеше: оно вступает в силу только после того, как лидер кеша содержит весь ожидаемый набор образов, поэтому узлы никогда не остаются отрезанными.
      size:
        description: |
          Размер персистентного хранилища под кеш.
      source:
        description: |
          Набор образов, который должен оказаться в кеше.

          Обязателен в air-gap: без upstream, к которому можно откатиться, полнота должна быть вычислимой, прежде чем кешу можно доверять как единственному источнику.
        properties:
          bundleRef:
            description: |
              Имя набора образов, например bundle, залитого командой `d8 mirror push`.
          expectedDigests:
            description: |
              Количество уникальных дайджестов в наборе.
  whitelistSourceRanges:
    description: "Список адресов в формате CIDR, которым разрешено подключение к хранилищу образов контейнеров. Если не указано, то разрешено подключение с любых адресов."
  ingressClass:
    description: |
      Класс Ingress-контроллера, который используется для хранилища образов контейнеров.

      Опциональный параметр, по умолчанию используется глобальное значение `modules.ingressClass`.
  https:
    description: |
      Тип используемого сертификата.

      При использовании этого параметра полностью переопределяются глобальные настройки `global.modules.https`.
    properties:
      mode:
        description: |
          Режим работы HTTPS.

          Возможные значения:

          - `CertManager` — доступ по HTTPS с заказом сертификата согласно ClusterIssuer, заданному в параметре `certManager.clusterIssuerName`.
          - `CustomCertificate` — доступ по HTTPS с использованием сертификата из пространства имен `d8-system`.
          - `Disabled` — доступ только по HTTP.
          - `OnlyInURI` — доступ по HTTP, подразумевая, что перед ingress-контроллером находится внешний HTTPS-балансировщик, который терминирует HTTPS-трафик. Балансировщик должен обеспечивать перенаправление с HTTP на HTTPS.
      certManager:
        description: "Настройки для certmanager."
        properties:
          clusterIssuerName:
            description: |
              Тип ClusterIssuer'а, используемого для заказа SSL-сертификата (в данный момент доступны `letsencrypt`, `letsencrypt-staging`, `selfsigned`, но возможно определить свои).
      customCertificate:
        description: Настройки для использования пользовательского сертификата.
        properties:
          secretName:
            description: |
              Имя секрета в неймспейсе `d8-system`, который будет использовать ingress registry.

              Секрет должен быть в формате [kubernetes.io/tls](https://kubernetes.github.io/ingress-nginx/user-guide/tls/#tls-secrets).
