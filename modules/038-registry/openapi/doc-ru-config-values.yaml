type: object
properties:
  mode:
    description: |
      Управляет ли модуль тем, как кластер загружает образы.

      - `Unmanaged` — модуль не управляет ничем. Компоненты не создаются, конфигурация узлов не пишется; кластер продолжает загружать образы из того registry, с которым был установлен. Это значение по умолчанию, поэтому включение модуля само по себе ничего не меняет.
      - `Managed` — модуль владеет путём загрузки образов: настраивает container runtime на каждом узле через свой агент и, при необходимости, поднимает внутрикластерный кэш.

      Выбора реализации нет. Кластер, в котором предыдущая реализация модуля никогда не работала, всегда использует текущую; кластер, в котором работала, использует предыдущую до перевода её в состояние `Unmanaged`, после чего миграция завершается сама.
  primary:
    description: |
      Единственный авторитетный источник образов компонентов Deckhouse. Действует только при `implementation: V2`.

      Дополнительные registry объявляются отдельными ресурсами [RegistryUpstream](cr.html#registryupstream), а не здесь: модулю или пользователю, который приносит свой registry, не должно требоваться править чужой ModuleConfig.
    properties:
      upstream:
        description: |
          Registry, из которого загружаются образы компонентов Deckhouse.

          Если не задан, кластер считается air-gap: внутрикластерный кэш становится авторитетным и наполняется командой `d8 mirror push`. Отсутствие параметра требует `storage.cache: true` и `storage.source`.
        properties:
          scheme:
            description: |
              Протокол подключения к registry.

              Используйте `HTTP` только для незащищённых доверенных registry.
          host:
            description: |
              Хост registry, опционально с портом.
          path:
            description: |
              Префикс пути к репозиторию внутри registry.
          ca:
            description: |
              PEM-сертификат удостоверяющего центра для проверки registry при `scheme: HTTPS`.

              Если не указан, используется системное хранилище доверенных сертификатов.
          auth: &registryAuthRu
            description: |
              Ключи доступа к registry.
            properties:
              license:
                description: |
                  Лицензионный ключ Deckhouse.

                  Сокращённая запись пары `username`/`password` для `registry.deckhouse.io`. Взаимоисключающий с ними.

                  Смена лицензии меняет ключи доступа к registry, поэтому она проходит через ту же preflight-пробу, что и смена адреса: новые ключи проверяются до переключения кластера, а при неудачной пробе остаются последние рабочие.
              username:
                description: |
                  Имя пользователя для базовой аутентификации.
              password:
                description: |
                  Пароль для базовой аутентификации.
          mirrors:
            description: |
              Дополнительные адреса, отдающие **тот же** контент, что и основной registry, — для отказоустойчивости и балансировки.

              Зеркала не являются отдельными источниками: кэш хранит один дедуплицированный набор независимо от того, с какого зеркала пришли образы. Registry с другим контентом — это дополнительный upstream, и его место в ресурсе [RegistryUpstream](cr.html#registryupstream).
            items:
              properties:
                scheme:
                  description: |
                    Протокол подключения к зеркалу.
                host:
                  description: |
                    Хост зеркала, опционально с портом.
                path:
                  description: |
                    Префикс пути к репозиторию внутри зеркала.
                ca:
                  description: |
                    PEM-сертификат удостоверяющего центра для проверки зеркала.
                auth:
                  <<: *registryAuthRu
  storage:
    description: |
      Внутрикластерный кэш registry. Действует только при `implementation: V2`.
    properties:
      cache:
        description: |
          Идут ли загрузки через внутрикластерный кэш на master-узлах.

          Это одна из двух осей конфигурации, вторая — задан ли `primary.upstream`. Вместе они покрывают все поддерживаемые схемы:

          - `cache: false` с заданным upstream — узлы загружают образы напрямую из upstream, кэш не разворачивается.
          - `cache: true` с заданным upstream — сквозной кэш, наполняется из upstream.
          - `cache: true` без upstream — air-gap: кэш является единственным источником образов и наполняется командой `d8 mirror push`.

          Включение и выключение кэша — безопасная идемпотентная перенастройка. Единственный переход с условием — снятие upstream при включённом кэше: оно вступает в силу только после того, как лидер кэша содержит весь ожидаемый набор образов, поэтому узлы никогда не остаются отрезанными.
      size:
        description: |
          Размер персистентного хранилища под кэш.
      source:
        description: |
          Набор образов, который должен оказаться в кэше.

          Обязателен в air-gap: без upstream, к которому можно откатиться, полнота должна быть вычислимой, прежде чем кэшу можно доверять как единственному источнику.
        properties:
          bundleRef:
            description: |
              Имя набора образов, например бандла, залитого командой `d8 mirror push`.
          expectedDigests:
            description: |
              Количество уникальных digest'ов в наборе.
  whitelistSourceRanges:
    description: "Список адресов в формате CIDR, которым разрешено подключение к registry. Если не указано, то разрешено подключение с любых адресов."
  ingressClass:
    description: |
      Класс Ingress-контроллера, который используется для registry.

      Опциональный параметр, по умолчанию используется глобальное значение `modules.ingressClass`.
  https:
    description: |
      Тип используемого сертификата.

      При использовании этого параметра полностью переопределяются глобальные настройки `global.modules.https`.
    properties:
      mode:
        description: |
          Режим работы HTTPS:
          - `CertManager` — доступ по HTTPS с заказом сертификата согласно ClusterIssuer, заданному в параметре `certManager.clusterIssuerName`.
          - `CustomCertificate` — доступ по HTTPS с использованием сертификата из пространства имен `d8-system`.
          - `Disabled` — доступ только по HTTP.
          - `OnlyInURI` — доступ по HTTP, подразумевая, что перед ingress-контроллером находится внешний HTTPS-балансировщик, который терминирует HTTPS-трафик. Балансировщик должен обеспечивать перенаправление с HTTP на HTTPS.
      certManager:
        description: "Настройки для certmanager."
        properties:
          clusterIssuerName:
            description: |
              Тип ClusterIssuer'а, используемого для заказа SSL-сертификата (в данный момент доступны `letsencrypt`, `letsencrypt-staging`, `selfsigned`, но возможно определить свои).
      customCertificate:
        description: Настройки для использования пользовательского сертификата.
        properties:
          secretName:
            description: |
              Имя секрета в пространстве имен `d8-system`, который будет использовать ingress registry.

              Секрет должен быть в формате [kubernetes.io/tls](https://kubernetes.github.io/ingress-nginx/user-guide/tls/#tls-secrets).
