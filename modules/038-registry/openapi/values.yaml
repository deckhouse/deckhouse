x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    properties:
      # Internal values of the controller-based implementation.
      #
      # Deliberately a separate branch alongside `orchestrator`, with no shared
      # keys: the two implementations must never be able to read each other's
      # state. The old implementation stays in the tree as inert ballast rather
      # than a translator, and this separation is what keeps it inert.
      #
      # Removed together with `orchestrator` when the legacy implementation is
      # dropped.
      v2:
        type: object
        default: {}
        properties:
          enabled:
            type: boolean
            default: false
            description: |
              Whether the current implementation is active.

              Not a setting: there is no choice of implementation. True unless the
              previous implementation is still managing the cluster, which it does
              until it has been brought to its `Unmanaged` state.

              Every template of the current implementation is rendered under this
              value, and the templates of the previous one under its negation, so
              both owning the pull path at once is impossible by construction
              rather than by care. See `templates/_ownership.tpl`.
          switchBlockedReason:
            type: string
            description: |
              Why the cluster is still on the previous implementation, when it is.
              Raised as an alert, since a module cannot write its own ModuleConfig
              status.

              Empty once the handover has happened.
          registryConfig:
            type: object
            default: {}
            description: |
              The resolved primary configuration helm renders RegistryConfig from.

              Built by a hook out of ModuleConfig, with `auth.license` already
              resolved into a username/password pair, so the template stays free
              of resolution logic.
            properties:
              mode:
                type: string
                enum: [Managed, Unmanaged]
              primary:
                type: object
                properties:
                  upstream:
                    type: object
                    properties:
                      scheme:
                        type: string
                        enum: [HTTP, HTTPS]
                      host:
                        type: string
                      path:
                        type: string
                      ca:
                        type: string
                      auth: &v2Auth
                        type: object
                        properties:
                          username:
                            type: string
                          password:
                            type: string
                          auth:
                            type: string
                      mirrors:
                        type: array
                        items:
                          type: object
                          properties:
                            scheme:
                              type: string
                              enum: [HTTP, HTTPS]
                            host:
                              type: string
                            path:
                              type: string
                            ca:
                              type: string
                            auth:
                              <<: *v2Auth
              storage:
                type: object
                properties:
                  cache:
                    type: boolean
                  size:
                    type: string
                  source:
                    type: object
                    properties:
                      bundleRef:
                        type: string
                      expectedDigests:
                        type: integer
                        format: int32
                  garbageCollection:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      schedule:
                        type: string
          storageAddresses:
            type: array
            items:
              type: string
            description: |
              The addresses the storage replicas are reachable at.

              Node addresses, not the Service name. Everything that talks to the
              storage does so from a node — the agent pulling, a replica
              replicating — in the host network, where a cluster DNS name does not
              exist. `registry.d8-system.svc:5001` is what image references are
              built from and what a request is matched against, but nothing dials
              it.

              The same set the serving certificate is issued for, which is why the
              two are produced together.
          imageAddress:
            type: string
            description: |
              The address container image references may be rendered from, published
              for the platform in the `registry-image-address` ConfigMap.

              The same in-cluster address nodes are given as `bashibleConfig.imagesBase`,
              but held back until every node's agent is applying the layout the cluster
              gave it. Nothing resolves this address except through that agent: no DNS
              record answers it and no pull secret carries credentials for it. A node
              learns it through a bashible rollout that takes minutes, while the platform
              renders every image reference in the cluster in one pass — so rendering it
              too early points every workload at something nothing can pull yet.

              Empty until then, and once set it stays set: taking it away because one
              node's agent fell behind would re-render the whole cluster back onto the
              upstream, which in an air-gapped cluster answers nothing at all. It is
              withdrawn by the mode leaving `Managed` or the module being disabled.
          bashibleConfig:
            type: object
            description: |
              What nodes are told, rendered into the `registry-bashible-config`
              secret that the bashible apiserver reads.

              The field that matters most in it is `agent`: its presence is what
              silences the bashible step that writes per-registry drop-in
              directories, handing `/etc/containerd/registry.d` to the node agent.

              Absent in two cases, and in both the bashible apiserver falls back
              to the `deckhouse-registry` secret and points the container runtime
              straight at the registry the cluster was installed with: while the
              previous implementation is still managing the cluster, and while the
              mode is `Unmanaged`.
            x-required-for-helm:
              - agent
            properties:
              agent:
                type: object
                properties:
                  endpoint:
                    type: string
                    description: |
                      Where the agent serves the container runtime, as `host:port`.
                  dropInFile:
                    type: string
                    description: |
                      The file the agent writes for the container runtime.

                      Carried to the node so that a step which has to wait for the
                      agent waits on the path the agent actually writes.
                  layout:
                    type: string
                    description: |
                      A marshalled RegistryNodeSpec: the routing the agent uses
                      until the API server answers for the first time.

                      Needed because a node joining a cluster has to pull the
                      control plane before there is a control plane to ask how.
                      Holds registry credentials.
              mode:
                type: string
              version:
                type: string
              imagesBase:
                type: string
              proxyEndpoints:
                type: array
                items:
                  type: string
              hosts:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    mirrors:
                      type: array
                      items:
                        type: object
                        properties:
                          host:
                            type: string
                          scheme:
                            type: string
                          ca:
                            type: string
                          auth:
                            type: object
                            properties:
                              username:
                                type: string
                              password:
                                type: string
                              auth:
                                type: string
                          rewrites:
                            type: array
                            items:
                              type: object
                              properties:
                                from:
                                  type: string
                                to:
                                  type: string
          pki:
            type: object
            description: |
              Certificates and credentials of the in-cluster storage, generated and
              persisted by the module hook.

              Separate from the agent PKI, which is generated on the node at
              bootstrap and never leaves it: the agent's only relying party is the
              containerd on the same node, so there is nothing to agree with the
              cluster, and neither half has to wait for the other.

              Read credentials are used by the node agents and by replication
              between replicas; write credentials guard the publication endpoint
              used by `d8 mirror push` and are deliberately different, since that
              endpoint is reachable from outside the cluster.
            properties:
              ca: &v2CertKey
                type: object
                properties:
                  cert:
                    type: string
                  key:
                    type: string
              distribution:
                <<: *v2CertKey
              auth:
                <<: *v2CertKey
              token:
                <<: *v2CertKey
              ingressClient:
                <<: *v2CertKey
              httpSecret:
                type: string
                description: |
                  Signs the state carried in upload URLs. Identical across replicas,
                  otherwise an upload started against one replica cannot be finished
                  against another — which is what happens behind an ingress.
              ro: &v2User
                type: object
                properties:
                  name:
                    type: string
                  password:
                    type: string
                  passwordHash:
                    type: string
              rw:
                <<: *v2User
      customCertificateData:
        type: object
        properties:
          tls.crt:
            type: string
            x-examples:
              - plainstring
          tls.key:
            type: string
            x-examples:
              - plainstring
          ca.crt:
            type: string
            x-examples:
              - plainstring

      orchestrator:
        type: object
        default: {}
        properties:
          ready:
            type: boolean
          hash:
            type: string
          state:
            type: object
            default: {}
            properties:
              target_mode:
                type: string
                enum: [Unmanaged, Direct, Proxy, Local]
              mode:
                type: string
                enum: [Unmanaged, Direct, Proxy, Local]
              init_params:
                type: object
                properties:
                  generation:
                    format: int64
                    type: integer
                  mode:
                    type: string
                  images_repo:
                    type: string
                  user_name:
                    type: string
                  password:
                    type: string
                  ttl:
                    type: string
                  scheme:
                    type: string
                  ca:
                    type: string
                  check_mode:
                    type: string
              pki:
                type: object
                properties:
                  ca: &certKey
                    type: object
                    properties:
                      cert:
                        type: string
                      key:
                        type: string
                  token:
                    <<: *certKey
              secrets:
                type: object
                properties:
                  http:
                    type: string
              users:
                type: object
                properties:
                  ro: &user
                    type: object
                    properties:
                      name:
                        type: string
                      password:
                        type: string
                      password_hash:
                        type: string
                  rw:
                    <<: *user
                  mirror_puller:
                    <<: *user
                  mirror_pusher:
                    <<: *user
              bashible:
                type: object
                properties:
                  unmanaged_params:
                    type: object
                    properties:
                      imagesRepo:
                        type: string
                      scheme:
                        type: string
                      ca:
                        type: string
                      username:
                        type: string
                      password:
                        type: string
                  actual_params:
                    type: object
                    properties:
                      mode:
                        type: string
                        enum: [Unmanaged, Direct, Proxy, Local]
                      proxy:
                        type: object
                        properties:
                          ca:
                            type: string
                          username:
                            type: string
                          password:
                            type: string
                      local:
                        type: object
                        properties:
                          ca:
                            type: string
                          username:
                            type: string
                          password:
                            type: string
                      unmanaged:
                        type: object
                        properties:
                          imagesRepo:
                            type: string
                          scheme:
                            type: string
                          ca:
                            type: string
                          username:
                            type: string
                          password:
                            type: string
                      direct:
                        type: object
                        properties:
                          imagesRepo:
                            type: string
                          scheme:
                            type: string
                          ca:
                            type: string
                          username:
                            type: string
                          password:
                            type: string
                  config:
                    type: object
                    additionalProperties: true
                    x-kubernetes-preserve-unknown-fields: true
              in_cluster_proxy:
                type: object
                properties:
                  config:
                    type: object
                    properties:
                      version:
                        type: string
                      config:
                        type: object
                        properties:
                          ca:
                            type: string
                          auth_cert:
                            type: string
                          auth_key:
                            type: string
                          token_cert:
                            type: string
                          token_key:
                            type: string
                          distribution_cert:
                            type: string
                          distribution_key:
                            type: string
                          http_secret:
                            type: string
                          upstream:
                            type: object
                            properties:
                              scheme:
                                type: string
                              host:
                                type: string
                              path:
                                type: string
                              ca:
                                type: string
                              user:
                                <<: *user
              node_services:
                type: object
                properties:
                  run:
                    type: boolean
                    default: false
                  nodes:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        config:
                          type: object
                          additionalProperties: true
                          x-kubernetes-preserve-unknown-fields: true
                        version:
                          type: string
              ingress_enabled:
                type: boolean
              registry_service:
                type: string
              conditions:
                x-kubernetes-patch-strategy: merge
                x-kubernetes-patch-merge-key: type
                type: array
                default: []
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    lastTransitionTime:
                      format: date-time
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
      checker:
        type: object
        default: {}
        properties:
          initialized:
            type: boolean
            default: false
          params:
            type: object
            default: {}
            properties:
              registries:
                type: object
                additionalProperties:
                  type: object
                  required: ["address", "scheme"]
                  properties:
                    address:
                      type: string
                    scheme:
                      type: string
                      enum: [HTTP, HTTPS]
                      default: "HTTPS"
                    ca:
                      type: string
                    username:
                      type: string
                    password:
                      type: string
              version:
                type: string
              checkMode:
                type: string
                enum: [Default, Relax]
                default: Default
          state:
            type: object
            default: {}
            properties:
              queues:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    processed:
                      type: integer
                      format: int
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          image:
                            type: string
                          info:
                            type: string
                          error:
                            type: string
                    retry:
                      type: array
                      items:
                        type: object
                        properties:
                          image:
                            type: string
                          info:
                            type: string
                          error:
                            type: string
                    last_attempt:
                      type: string
                      format: date-time
                    params_hash:
                      type: string
              version:
                type: string
              ready:
                type: boolean
                default: false
              message:
                type: string
