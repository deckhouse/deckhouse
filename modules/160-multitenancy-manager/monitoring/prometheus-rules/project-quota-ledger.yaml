- name: d8.multitenancy-manager.project-quota-ledger
  rules:
  - alert: D8ProjectQuotaLedgerDown
    expr: |
      (
        (sum(d8_multitenancy_quota_ledger_leader) or vector(0)) < 1
        or (sum(d8_multitenancy_quota_ledger_synced) or vector(0)) < 1
      )
      and on() max(max_over_time(d8_multitenancy_project_quota_enforcement{mode="Enforce"}[1h])) > 0
      and on() max(max_over_time(d8_multitenancy_project_quotas[1h])) > 0
      unless on() max(d8_multitenancy_project_quota_enforcement{mode="NotSupported"}) > 0
    for: 2m
    labels:
      severity_level: "4"
      tier: cluster
      d8_module: multitenancy-manager
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: No replica of the project quota ledger answers.
      description: |-
        No replica of the `quota-ledger` container of the `multitenancy-manager` module holds its lease with synced informers. Creating the objects a ProjectQuota counts in the namespaces of projects with a quota fails with `project quota ledger unavailable`, or with `failed calling webhook "quota-ledger.multitenancy-manager.deckhouse.io"`. Deletions, running objects and other namespaces are not affected.

        1. Check the pods, the lease and the route:

           ```bash
           d8 k -n d8-multitenancy-manager get pods,lease,endpointslices
           d8 k -n d8-multitenancy-manager logs deploy/multitenancy-manager -c quota-ledger --tail=200
           ```

           The logs say whether the ledger is `fenced` (its lease renewals are late) or `syncing`.

        1. If the cause cannot be removed quickly, delete the webhook as `system:sudouser`. While no replica holds the route, the API servers reach none of them, so suspending the ledger with the `quota-ledger-suspend` ConfigMap does not help here. The sum check stops at once; Deckhouse puts the webhook back within about 4 minutes, so this buys time rather than switching the check off. Disabling the `multitenancy-manager` module removes the check together with the rest of the module.

           ```bash
           d8 k --as=system:sudouser delete validatingwebhookconfiguration d8-multitenancy-manager-quota-ledger
           ```

  - alert: D8ProjectQuotaLedgerCanaryFailing
    expr: |
      count(
        sum by (apiserver) (rate(d8_multitenancy_quota_ledger_canary_result_total{result="ours"}[2m]))
        / sum by (apiserver) (rate(d8_multitenancy_quota_ledger_canary_result_total[2m])) > 0.5
      ) > count(sum by (apiserver) (rate(d8_multitenancy_quota_ledger_canary_result_total[2m]))) / 2
      and on() max(max_over_time(d8_multitenancy_project_quotas[1h])) > 0
    for: 2m
    labels:
      severity_level: "4"
      tier: cluster
      d8_module: multitenancy-manager
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: Most API servers do not reach the leader of the project quota ledger.
      description: |-
        The canary writes of the ledger do not reach its webhook through most of the API servers. The leader hands the lease over when another replica is ready; this alert says it could not, or that the new leader is not reached either. Check the network from the master nodes to the pods of `d8-multitenancy-manager` and the CNI on the masters. The steps of `D8ProjectQuotaLedgerDown` apply.

  - alert: D8ProjectQuotaLedgerUnreachableFromAPIServer
    expr: |
      sum by (apiserver) (rate(d8_multitenancy_quota_ledger_canary_result_total{result="ours"}[5m]))
      / sum by (apiserver) (rate(d8_multitenancy_quota_ledger_canary_result_total[5m])) > 0.5
      and on() max(max_over_time(d8_multitenancy_project_quotas[1h])) > 0
    for: 5m
    labels:
      severity_level: "5"
      tier: cluster
      d8_module: multitenancy-manager
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: The API server {{ $labels.apiserver }} does not reach the project quota ledger.
      description: |-
        The canary writes through the API server `{{ $labels.apiserver }}` fail on the webhook of the ledger, while the other API servers reach it. Counted creates that land on this API server in the namespaces of projects with a quota wait for the webhook timeout and fail. Check the network of that master node to the pods of `d8-multitenancy-manager`; the webhooks of other modules are likely affected the same way.

  - alert: D8ProjectQuotaWebhookErrors
    expr: |
      sum(rate(apiserver_admission_webhook_rejection_count{name="quota-ledger.multitenancy-manager.deckhouse.io",error_type="calling_webhook_error"}[5m])) > 0
      and on() max(max_over_time(d8_multitenancy_project_quotas[1h])) > 0
    for: 10m
    labels:
      severity_level: "5"
      tier: cluster
      d8_module: multitenancy-manager
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: The API servers fail to call the project quota ledger.
      description: |-
        For 10 minutes the API servers have been failing to call the webhook of the ledger: connections refused, timeouts or TLS errors. A change of the leader causes such errors for a second or two only. The steps of `D8ProjectQuotaLedgerDown` apply.

  - alert: D8ProjectQuotaWebhookMisconfigured
    expr: |
      (
        max(d8_multitenancy_project_quota_enforcement{mode=~"WebhookMissing|WebhookMisconfigured"}) > 0
        or sum(increase(d8_multitenancy_quota_ledger_canary_result_total{result="no_nonce"}[5m])) > 0
      )
      and on() max(max_over_time(d8_multitenancy_project_quotas[1h])) > 0
    for: 2m
    labels:
      severity_level: "4"
      tier: cluster
      d8_module: multitenancy-manager
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: The webhook of the project quota ledger is missing or misconfigured.
      description: |-
        The `d8-multitenancy-manager-quota-ledger` ValidatingWebhookConfiguration is missing, does not carry the CA of the `quota-ledger-certs` Secret, is changed so that writes of `d8-project-quota` do not reach the ledger (its rules, `namespaceSelector`, `objectSelector`, `matchConditions`, `failurePolicy` or service), or the API servers let the canary writes through without calling it. The sum of the project quotas is not checked; the `Enforced` condition of every ProjectQuota names the reason (`WebhookMissing`, `WebhookMisconfigured` or `WebhookNotCalled`) and the field or the API servers. Deckhouse puts the webhook back within about 4 minutes; if it does not, contact Deckhouse technical support. Compare the CA:

        ```bash
        d8 k get validatingwebhookconfiguration d8-multitenancy-manager-quota-ledger -o jsonpath='{.webhooks[0].clientConfig.caBundle}' | base64 -d | openssl x509 -noout -subject
        d8 k -n d8-multitenancy-manager get secret quota-ledger-certs -o jsonpath='{.data.ca\.crt}' | base64 -d | openssl x509 -noout -subject
        ```

  - alert: D8ProjectQuotaLedgerSlow
    expr: |
      histogram_quantile(0.99, sum by (le) (rate(apiserver_admission_webhook_admission_duration_seconds_bucket{name="quota-ledger.multitenancy-manager.deckhouse.io"}[5m]))) > 0.1
      and on() max(max_over_time(d8_multitenancy_project_quotas[1h])) > 0
    for: 5m
    labels:
      severity_level: "5"
      tier: cluster
      d8_module: multitenancy-manager
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: The project quota ledger answers slowly.
      description: |-
        The 99th percentile of the calls of the ledger webhook, as the API servers see them, is above 100 ms. The ledger answers within 25 ms of its own, so the delay comes from the network or from the CPU of the `quota-ledger` container. Check the CPU of the master nodes and of the container, the `d8_multitenancy_quota_ledger_inflight` and `d8_multitenancy_quota_ledger_requests_total{result="busy"}` series, and other webhooks on `resourcequotas/status`.

  - alert: D8ResourceQuotaAdmissionDegraded
    expr: |
      histogram_quantile(0.99, sum by (le) (rate(apiserver_admission_controller_admission_duration_seconds_bucket{name="ResourceQuota"}[5m]))) > 1
      and on() max(max_over_time(d8_multitenancy_project_quotas[1h])) > 0
    for: 2m
    labels:
      severity_level: "4"
      tier: cluster
      d8_module: multitenancy-manager
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: The quota admission of the API servers is slow.
      description: |-
        The 99th percentile of the ResourceQuota admission plugin is above one second. The plugin has a few workers for all creates in the cluster, so this slows down creates everywhere. The cause may be a slow webhook on `resourcequotas/status` (the project quota ledger or another one) or a slow etcd. Find the slow webhook by `apiserver_admission_webhook_admission_duration_seconds` and check `etcd_disk_wal_fsync_duration_seconds`.

  - alert: D8ProjectQuotaLeaderFlapping
    expr: |
      sum(increase(d8_multitenancy_quota_ledger_handover_total[10m])) > 3
      and on() max(max_over_time(d8_multitenancy_project_quotas[1h])) > 0
    labels:
      severity_level: "5"
      tier: cluster
      d8_module: multitenancy-manager
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: The leader of the project quota ledger changes too often.
      description: |-
        The lease of the ledger changed hands more than three times in ten minutes; every change refuses counted creates for a second or more. The `reason` label of `d8_multitenancy_quota_ledger_handover_total` says why: `expired` points at late renewals (the API server, the `leader-election` priority level), `stepdown` at the canary, `graceful` at restarts of the pods (rollouts, evictions).

  - alert: D8ProjectQuotaOvershoot
    expr: |
      max by (project) (d8_multitenancy_project_quota_state{state="overshoot"}) > 0
    labels:
      severity_level: "5"
      tier: cluster
      d8_module: multitenancy-manager
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: Usage of project `{{ $labels.project }}` has grown past its ProjectQuota.
      description: |-
        The usage of project `{{ $labels.project }}` grew past its quota. The ledger allows that only for a status write of a quota saved long after it was approved (a change of the ledger leader at that moment, a stalled etcd, another slow webhook) or when kube-controller-manager recounts a quota, and then by at most a tenth of a limit. The `Exceeded` condition of the ProjectQuota names the keys, the difference and the probable cause. Nothing running is evicted; creating more of these resources is denied until the usage is back within the quota.

  - alert: D8ProjectQuotaLedgerDrift
    expr: |
      max(d8_multitenancy_quota_ledger_drift) > 0
    for: 5m
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: multitenancy-manager
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: The project quota ledger differs from the API server.
      description: |-
        The ledger holds the usage of some quota differently from a quorum read of the same version of it. The state of the ledger is inconsistent. Save the logs of the `quota-ledger` container, then restart the pod of the leader once so that another replica takes over. Do not restart it in a loop.

  - alert: D8ProjectQuotaSuspended
    expr: |
      max(d8_multitenancy_project_quota_enforcement{mode="Suspended"}) > 0
    for: 15m
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: multitenancy-manager
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: The project quota ledger is suspended.
      description: |-
        The `quota-ledger-suspend` ConfigMap in `d8-multitenancy-manager` suspends the ledger: every write passes and the sum of the project quotas is not checked. Find who created it in the audit log and delete it when the reason is gone:

        ```bash
        d8 k -n d8-multitenancy-manager delete configmap quota-ledger-suspend
        ```
