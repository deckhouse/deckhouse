x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    properties:
      admissionWebhookCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      quotaLedgerCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      storageFoundationShipsStorageClassGrant:
        type: boolean
        default: false
        description: |
          Whether the storage-foundation module is enabled at a version that registers the StorageClass
          grant (v1.0.3 and later), set by hooks/storage_foundation_storageclass_grant.go. While it is
          false, the module renders its own copy of the grant.
      grantWebhookRules:
        type: array
        default: []
        description: |
          Resources the cluster-objects grant webhooks intercept, one (group, resource) pair per item,
          derived from GrantableClusterResourceReference objects by hooks/grant_webhook_rules.go.
        x-examples:
          - [{"apiGroup": "rbac.authorization.k8s.io", "resource": "rolebindings"}]
        items:
          type: object
          required: ["apiGroup", "resource"]
          properties:
            apiGroup:
              type: string
            resource:
              type: string

