type: object
properties:
  allowNamespacesWithoutProjects:
    type: boolean
    default: true
    deprecated: true
    description: |
      Deprecated and ignored: every non-system namespace outside a project is now adopted into a project of its own, whatever this parameter says. It is kept for one release so existing ModuleConfigs keep applying, and is removed in the next minor release; a ModuleConfig that still sets it will then fail validation. While it is set, the `MultitenancyManagerDeprecatedConfigParameter` alert fires. Remove the parameter.

  highAvailability:
    type: boolean
    x-examples: [true]
    description: |
      Manually enable the high availability mode.

      By default, Deckhouse automatically decides whether to enable the HA mode. Click [here](/products/kubernetes-platform/documentation/v1/reference/api/global.html#parameters) to learn more about the HA mode for modules.
