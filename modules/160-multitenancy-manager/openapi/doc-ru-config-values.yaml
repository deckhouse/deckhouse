type: object
properties:
  allowNamespacesWithoutProjects:
    description: |
      Устарел и игнорируется: каждый несистемный неймспейс вне проекта теперь становится отдельным проектом независимо от значения параметра. Он сохранён на один релиз, чтобы существующие ModuleConfig продолжали применяться, и удаляется в следующем минорном релизе — ModuleConfig, где он останется, перестанет проходить валидацию. Пока параметр задан, срабатывает алерт `MultitenancyManagerDeprecatedConfigParameter`. Удалите параметр.

  highAvailability:
    description: |
      Ручное управление режимом отказоустойчивости.

      По умолчанию режим отказоустойчивости определяется автоматически. [Подробнее](/products/kubernetes-platform/documentation/v1/reference/api/global.html#параметры) про режим отказоустойчивости.
