type: object
properties:
  allowNamespacesWithoutProjects:
    description: |
      Можно ли создавать неймспейсы напрямую, вне Project.

      Если `true`, неймспейс может создать напрямую (`d8 k create namespace`) любой, у кого есть на это право, и контроллер превращает такой неймспейс в отдельный проект (см. [Автоматическое создание проектов для неймспейсов](./#автоматическое-создание-проектов-для-неймспейсов)).

      Если `false`, пользователи создают окружения как объекты Project, а дополнительные неймспейсы проекта — как объекты ProjectNamespace. Напрямую неймспейсы создают только администраторы кластера (группа `system:masters` и `system:sudouser`), Deckhouse, контроллер модуля и системные компоненты; полный список приведён в разделе [«Кто обходит валидацию»](usage.html#кто-обходит-валидацию). Неймспейс `default` может создать любой пользователь. Проверку выполняет ValidatingAdmissionPolicy, которую API-сервер вычисляет сам, поэтому она не зависит от доступности контроллера модуля.

  highAvailability:
    description: |
      Ручное управление режимом отказоустойчивости.

      По умолчанию режим отказоустойчивости определяется автоматически. [Подробнее](/products/kubernetes-platform/documentation/v1/reference/api/global.html#параметры) про режим отказоустойчивости.
