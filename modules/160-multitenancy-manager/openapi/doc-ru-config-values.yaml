type: object
properties:
  allowNamespacesWithoutProjects:
    description: |
      Устарел и игнорируется: каждый неймспейс вне проекта, который не системный, теперь становится отдельным проектом. Параметр сохранён на один релиз, чтобы существующие ModuleConfig продолжали применяться, и будет удалён в следующем.

  highAvailability:
    description: |
      Ручное управление режимом отказоустойчивости.

      По умолчанию режим отказоустойчивости определяется автоматически. [Подробнее](/products/kubernetes-platform/documentation/v1/reference/api/global.html#параметры) про режим отказоустойчивости.
