  labels:
    heritage: deckhouse
    module: multitenancy-manager
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: grantableclusterresourcedefinitions.multitenancy.deckhouse.io
spec:
  group: multitenancy.deckhouse.io
  names:
    kind: GrantableClusterResourceDefinition
    listKind: GrantableClusterResourceDefinitionList
    plural: grantableclusterresourcedefinitions
    shortNames:
    - gcrd
    singular: grantableclusterresourcedefinition
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.grantedResource.kind
      name: Granted
      type: string
    - jsonPath: .spec.enforcement
      name: Enforcement
      type: string
    - jsonPath: .spec.defaultAvailability
      name: Default
      type: string
    - jsonPath: .status.referenceCount
      name: References
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Registers a type of cluster-wide resource for managing project access to it.

          GrantableClusterResourceDefinition defines a cluster-wide resource for which access can be configured using ClusterResourceGrantPolicy, as well as the baseline rules for its availability and use of a default value.

          The resource can register both Kubernetes objects, such as StorageClass or ClusterRole, and values that are not represented by separate Kubernetes objects.

          Places where the cluster-wide resource is used in other Kubernetes resources are registered separately using GrantableClusterResourceReference.

          GrantableClusterResourceDefinition is created by DP or a module developer. Custom definitions can be created to manage access to additional types of cluster-wide resources.

          For more information, refer to ["Usage examples"](usage.html#managing-access-to-cluster-wide-resources).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
            x-doc-skip: true
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
            x-doc-skip: true
          metadata:
            type: object
            x-doc-skip: true
          spec:
            description: GrantableClusterResourceDefinition parameters.
            properties:
              catalogFields:
                description: |-
                  Fields of the cluster-wide resources shown to projects in AvailableClusterResource.

                  For each available resource, the controller reads the value of every listed field from the resource and puts it into [`status.available[].fields`](cr.html#availableclusterresource-v1alpha1-status-available-fields) of AvailableClusterResource under the specified name.

                  Rules:

                  - Applies only to definitions with `grantedResource`, which must be cluster-scoped. For values that are not represented by Kubernetes objects, the parameter is not allowed.
                  - At most 10 fields can be listed.
                  - A field whose value is missing in the resource is not shown.
                  - A value longer than 512 bytes in JSON serialization is not shown.
                  - If `status.available` of one AvailableClusterResource with the fields of all resources would take more than 512 KiB in JSON serialization, no fields are shown in it.

                  The paths are checked when the object is created or updated, and an invalid entry is refused. The result for the stored object is shown in the `CatalogFieldsValid` condition. Values left out for their size are reported by `CatalogFieldsSkipped` warning events on the GrantableClusterResourceDefinition.

                  > **Warning.** The values are visible to all users of every project the resource is available to. List only non-secret data.
                items:
                  description: Field of the cluster-wide resource shown to projects.
                  properties:
                    name:
                      description: Name of the field in [`status.available[].fields`](cr.html#availableclusterresource-v1alpha1-status-available-fields) of AvailableClusterResource, in lowerCamelCase (for example, `reclaimPolicy`).
                      maxLength: 63
                      pattern: ^[a-z][a-zA-Z0-9]*$
                      type: string
                    path:
                      description: |-
                        Path to the value in the cluster-wide resource, for example `$.provisioner`.

                        Must be an RFC 9535 JSONPath singular query that selects exactly one value: member names and array indexes only, without wildcards (`*`), descendant segments (`..`), slices or filters.

                        Paths that read `metadata.managedFields` or the `kubectl.kubernetes.io/last-applied-configuration` annotation, or a parent that contains them (for example, `$.metadata`), are not allowed: these fields hold a copy of the whole resource.
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - name
                  - path
                  type: object
                maxItems: 10
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              defaultAvailability:
                default: All
                description: |-
                  Baseline availability of cluster-wide resources to projects.

                  Allowed values:

                  - `All`: Resources are available by default.
                  - `None`: Resources are unavailable by default.

                  The value applies if availability is not determined by ClusterResourceGrantPolicy.
                enum:
                - All
                - None
                type: string
              defaultFrom:
                description: |-
                  Settings for determining the cluster-wide resource used by default.

                  The resource is identified by the specified annotation carrying the value `true` (compared case-insensitively; `false` marks a resource that is not the default, as the Kubernetes convention for `storageclass.kubernetes.io/is-default-class` does) and is used as the default value if one is not specified using ClusterResourceGrantPolicy. When more than one resource carries `true`, there is no default.
                properties:
                  annotationKey:
                    description: Key of the annotation that marks the cluster-wide resource used by default; only the value `true` counts.
                    type: string
                type: object
              enforcement:
                default: Managed
                description: |-
                  Method for checking cluster-wide resource availability.

                  Allowed values:

                  - `Managed`: The check is performed by `multitenancy-manager` webhooks.
                  - `External`: The check is performed by an external mechanism, such as a module webhook.
                enum:
                - Managed
                - External
                type: string
              excluded:
                description: |-
                  Filters for excluded cluster-wide resources that are always unavailable to projects regardless of ClusterResourceGrantPolicy settings.

                  A resource is considered excluded if it matches at least one of the specified filters.
                items:
                  description: Filter for cluster-wide resources by name and labels.
                  properties:
                    matchExpressions:
                      description: |-
                        List of label selector expressions for cluster-wide resources.

                        All expressions must match.
                      items:
                        description: |-
                          Label selector expression.
                        properties:
                          key:
                            description: Label key to which the expression applies.
                            type: string
                          operator:
                            description: |-
                              Operator that defines the relationship between the key and the set of values.
                            type: string
                          values:
                            description: |-
                              List of label values.

                              For the `In` and `NotIn` operators, the list must contain at least one value. For the `Exists` and `DoesNotExist` operators, the list must be empty.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                        - key
                        - operator
                        type: object
                      type: array
                    matchLabels:
                      additionalProperties:
                        type: string
                      description: |-
                        Set of labels for cluster-wide resources.

                        All specified labels must match.
                      type: object
                    names:
                      description: List of cluster-wide resource names.
                      items:
                        type: string
                      type: array
                  type: object
                type: array
              grantedResource:
                description: |-
                  Kubernetes cluster-wide resource for which access is configured.

                  Must be a cluster-scoped resource: a namespaced one (for example, Secret) is refused when the object is created or updated, and a definition stored with one is not processed, which the `GrantedResourceValid` condition shows. A resource that is not served yet (its CRD is not installed) is accepted and checked once it is served.

                  If the parameter is not specified, access management applies to values that are not represented by separate Kubernetes objects.
                properties:
                  apiGroup:
                    description: |-
                      API group of the cluster-wide resource.

                      For the core API group, specify an empty string (`""`).
                    type: string
                  kind:
                    description: Kind of the cluster-wide resource (for example, StorageClass).
                    type: string
                type: object
            type: object
          status:
            description: GrantableClusterResourceDefinition status.
            properties:
              conditions:
                description: |-
                  Current state of the GrantableClusterResourceDefinition.

                  - `GrantedResourceValid`: whether `spec.grantedResource` can be processed. `True` with the reason `ClusterScoped` for a cluster-scoped resource or `ValueBacked` for a definition without `grantedResource`. `False` with the reason `Namespaced` for a namespaced resource: the definition is not processed, no project gets its AvailableClusterResource, and the grant webhooks skip the references to it: their values are not checked. `Unknown` with the reason `KindNotServed` while the resource is not served (for example, its CRD is not installed yet), or `MappingFailed` if its scope could not be determined.
                  - `CatalogFieldsValid`: whether `spec.catalogFields` pass the checks applied when the object is created or updated: the paths are valid singular queries that do not read `metadata.managedFields` or the `kubectl.kubernetes.io/last-applied-configuration` annotation, and the definition has `grantedResource` (reasons `Valid`, `InvalidCatalogFields`; the message lists all problems). A definition without `catalogFields` has the condition `True`. `False` means the object was stored bypassing these checks; the invalid entries are not shown in AvailableClusterResource.
                items:
                  description: Information about one aspect of the current resource state.
                  properties:
                    lastTransitionTime:
                      description: |-
                        Time when the condition last changed.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        Message with additional information about the condition state.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        Resource generation on which the condition state is based.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        Reason for the last change in the condition state.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Condition state.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: Latest resource generation processed by the controller.
                format: int64
                type: integer
              referenceCount:
                description: Number of GrantableClusterResourceReference resources associated with this definition.
                type: integer
              references:
                description: |-
                  List of GrantableClusterResourceReference resources associated with this definition.
                items:
                  description: Information about a GrantableClusterResourceReference associated with this definition.
                  properties:
                    name:
                      description: Name of the GrantableClusterResourceReference.
                      type: string
                    resources:
                      description: Types of Kubernetes resources that contain registered references to the cluster-wide resource.
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
