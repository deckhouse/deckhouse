                  Allowed values:

                  - `All`: Resources are available by default.
                  - `None`: Resources are unavailable by default.

                  The value applies if availability is not determined by ClusterResourceGrantPolicy.
                enum:
                - All
                - None
                type: string
              defaultFrom:
                description: |-
                  Settings for determining the cluster-wide resource used by default.

                  The resource is identified by the presence of the specified annotation and is used as the default value if one is not specified using ClusterResourceGrantPolicy.
                properties:
                  annotationKey:
                    description: Key of the annotation that marks the cluster-wide resource used by default.
                    type: string
                type: object
              enforcement:
                default: Managed
                description: |-
                  Method for checking cluster-wide resource availability.

                  Allowed values:

                  - `Managed`: The check is performed by `multitenancy-manager` webhooks.
                  - `External`: The check is performed by an external mechanism, such as a module webhook.
                enum:
                - Managed
                - External
                type: string
              excluded:
                description: |-
                  Filters for excluded cluster-wide resources that are always unavailable to projects regardless of ClusterResourceGrantPolicy settings.

                  A resource is considered excluded if it matches at least one of the specified filters.
                items:
                  description: Filter for cluster-wide resources by name and labels.
                  properties:
                    matchExpressions:
                      description: |-
                        List of label selector expressions for cluster-wide resources.

                        All expressions must match.
                      items:
                        description: |-
                          Label selector expression.
                        properties:
                          key:
