                        required:
                        - key
                        - operator
                        type: object
                      type: array
                    matchLabels:
                      additionalProperties:
                        type: string
                      description: |-
                        Set of labels for cluster-wide resources.

                        All specified labels must match.
                      type: object
                    names:
