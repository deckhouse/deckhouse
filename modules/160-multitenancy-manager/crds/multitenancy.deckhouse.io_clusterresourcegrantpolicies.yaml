          The cluster-wide resource type is specified using `spec.resources[].resourceName`, which references the corresponding GrantableClusterResourceDefinition.

          The policy is created by a cluster administrator.

          For configuration examples, refer to [Usage examples](usage.html#for-cluster-administrators).
