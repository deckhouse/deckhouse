spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает шаблон проекта.

            На этот ресурс ссылается кастомный ресурс [Project](cr.html#project).

            Версия устарела. Шаблон создаётся через `deckhouse.io/v1alpha2`, а создание через `deckhouse.io/v1alpha1` отклоняется. Шаблоны, созданные через `deckhouse.io/v1alpha1` раньше, читаются, меняются и удаляются через эту версию, как и прежде.
          properties:
            spec:
              properties:
                description:
                  description: |
                    Произвольное описание назначения шаблона. Укажите пустую строку, если описание не требуется.
                parametersSchema:
                  description: |
                    Схема параметров проекта.

                    Поддерживается только `openAPIV3Schema`.
                  properties:
                    openAPIV3Schema:
                      description: |
                        Спецификация OpenAPI для [параметров](cr.html#project-v1alpha3-spec-parameters).

                        Используется для проверки правильности параметров, передаваемых при создании нового проекта.
                resourcesTemplate:
                  description: |
                    Шаблон, определяющий ресурсы в формате [`go template`](https://pkg.go.dev/text/template), создаваемые при настройке нового проекта.

                    Шаблоны полностью совместимы со всеми [функциями `helm`](https://helm.sh/docs/chart_template_guide/function_list/).

                    Подробнее — [в разделе «Перевод шаблона с Helm-текста»](usage.html#перевод-шаблона-с-helm-текста).

                    В шаблонах доступны следующие параметры:
                    - `{{ .projectName }}` — имя `Project`, для которого рендерится шаблон.
                    - `{{ .projectTemplateName }}` — имя `ProjectTemplate`.
                    - `{{ .parameters }}` — словарь пользовательских значений, описанных в параметре [.spec.parametersSchema](cr.html#projecttemplate-v1alpha1-spec-parametersschema) и определённых в параметре [.spec.parameters](cr.html#project-v1alpha3-spec-parameters).

                    `.metadata.namespace` объекта указывать необязательно: объект без него создаётся в основном неймспейсе проекта.
            status:
              properties:
                message:
                  description: Сообщение, указывающее на причину появления текущего статуса.
                ready:
                  description: Готовность шаблона к использованию. Указывает на то, что шаблон успешно прошёл проверку.
    - name: v1alpha2
      schema:
        openAPIV3Schema:
          description: |
            Описывает шаблон проекта как набор структурированных декларативных полей.

            На этот ресурс ссылается кастомный ресурс [Project](cr.html#project). Поля `resources` и `grantPolicies` превращаются в объекты [ClusterResourceGrantPolicy](cr.html#clusterresourcegrantpolicy), которые применяются к проектам этого шаблона. Остальные поля превращаются в объекты в неймспейсах проектов.

            Объекты, которые не описывает ни одно структурированное поле, создаются из `manifests`. Вместо полей, которые рендерят объекты, шаблон, созданный через `deckhouse.io/v1alpha1`, может содержать Helm-шаблон в `resourcesTemplate`. Такая форма устарела, и ни один шаблон не может получить новое `resourcesTemplate`.
          properties:
            spec:
              properties:
                title:
                  description: Краткое человекочитаемое имя шаблона.
                description:
                  description: |
                    Произвольное описание назначения шаблона.
                    
                    Укажите пустую строку, если описание не требуется.
                resources:
                  description: |
                    Правила доступа к cluster-wide-ресурсам для проектов шаблона.

                    Контроллер превращает их в ClusterResourceGrantPolicy `template-<TEMPLATE_NAME>-inline`, которая применяется к неймспейсам проектов этого шаблона.
                  items:
                    description: |
                      Настройки доступа к одному типу cluster-wide-ресурсов.
                    properties:
                      resourceName:
                        description: Имя GrantableClusterResourceDefinition, который регистрирует тип cluster-wide-ресурсов.
                      allowed:
                        description: |
                          Список имён cluster-wide-ресурсов, доступных проектам.

                          Объединяется с ресурсами, выбранными с помощью `allowedSelector`.
                      allowedSelector:
                        description: |
                          Селектор лейблов cluster-wide-ресурсов, доступных проектам.

                          Объединяется с ресурсами из `allowed`. Применяется только к cluster-wide-ресурсам, которые представлены объектами Kubernetes.
                        properties:
                          matchLabels:
                            description: |
                              Набор лейблов cluster-wide-ресурсов.

                              Должны совпадать все указанные лейблы.
                          matchExpressions:
                            description: |
                              Список выражений селектора лейблов.

                              Должны выполняться все выражения.
                            items:
                              properties:
                                key:
                                  description: Ключ лейбла, к которому применяется выражение.
                                operator:
                                  description: Оператор, задающий отношение между ключом и набором значений.
                                values:
                                  description: Список значений лейбла.
                      denied:
                        description: |
                          Список имён cluster-wide-ресурсов, недоступных проектам.

                          Запрещающие правила имеют приоритет над `allowed` и `allowedSelector`.
                      deniedSelector:
                        description: |
                          Селектор лейблов cluster-wide-ресурсов, недоступных проектам.

                          Запрещающие правила имеют приоритет над `allowed` и `allowedSelector`.
                        properties:
                          matchLabels:
                            description: |
                              Набор лейблов cluster-wide-ресурсов.

                              Должны совпадать все указанные лейблы.
                          matchExpressions:
                            description: |
                              Список выражений селектора лейблов.

                              Должны выполняться все выражения.
                            items:
                              properties:
                                key:
                                  description: Ключ лейбла, к которому применяется выражение.
                                operator:
                                  description: Оператор, задающий отношение между ключом и набором значений.
                                values:
                                  description: Список значений лейбла.
                      default:
                        description: |
                          Имя cluster-wide-ресурса, который проекты используют по умолчанию.

                          Переопределяет значение, определённое с помощью `defaultFrom` в GrantableClusterResourceDefinition.
                      availabilityDefault:
                        description: |
                          Доступность cluster-wide-ресурсов этого типа, которые не указаны в `allowed`, `allowedSelector`, `denied` и `deniedSelector`.

                          Переопределяет `defaultAvailability` в GrantableClusterResourceDefinition. Если задан `allowed` или `allowedSelector`, а это поле не задано, остальные ресурсы этого типа проектам недоступны.
                grantPolicies:
                  description: |
                    Ссылки на библиотечные объекты ClusterResourceGrantPolicy (созданные без `projectSelector` и `namespaceSelector`).

                    Для каждой ссылки контроллер создаёт и поддерживает отдельную управляемую политику, копирует в неё ресурсы библиотечной политики и привязывает их к неймспейсам, созданным по этому шаблону.
                podSecurityStandard:
                  description: |
                    Профиль Pod Security Standard, применяемый к неймспейсам проекта.

                    - `Privileged` — политика без ограничений.
                    - `Baseline` — минимально ограничивающая политика, которая предотвращает известные способы повышения привилегий.
                    - `Restricted` — строго ограничивающая политика, которая следует современным практикам защиты подов.

                    Литеральная строка (`Privileged`/`Baseline`/`Restricted`) или ссылка на параметр
                    `{fromParam: "<name>"}`, указывающая на свойство `parametersSchema`. Литерал вне трёх значений
                    и ссылку на необъявленный параметр или параметр другого типа вебхук отклоняет.
                networkPolicy:
                  description: Сетевая изоляция неймспейсов проекта.
                  properties:
                    mode:
                      description: |
                        Режим сетевой изоляции неймспейсов проекта.

                        - `Isolated` — в каждом неймспейсе проекта создаётся NetworkPolicy `isolated`. Она разрешает входящий трафик только из неймспейсов проекта, от Prometheus, контроллера ingress-nginx и агента service-with-healthchecks, а исходящий — только в неймспейсы проекта и к DNS в `kube-system`.
                        - `NotRestricted` — NetworkPolicy не создаётся.

                        Если поле не задано, NetworkPolicy тоже не создаётся.

                        Литеральная строка (`Isolated`/`NotRestricted`) или ссылка на параметр `{fromParam: "<name>"}`.
                        Литерал вне двух значений вебхук отклоняет.
                nodeSelector:
                  description: |
                    Селектор узлов для подов основного неймспейса проекта. Литеральная карта лейблов или ссылка на параметр `{fromParam: "<name>"}`.

                    Задаётся аннотацией `scheduler.alpha.kubernetes.io/node-selector` основного неймспейса и объединяется с селектором узлов каждого пода в нём. Под с конфликтующим селектором отклоняется. Дополнительные неймспейсы проекта его не получают.
                tolerations:
                  description: |
                    Tolerations по умолчанию для подов основного неймспейса проекта.

                    Литеральный список tolerations или ссылка на параметр `{fromParam: "<name>"}`. Задаются аннотацией `scheduler.alpha.kubernetes.io/defaultTolerations` основного неймспейса. Дополнительные неймспейсы проекта их не получают.
                namespaceMetadata:
                  description: Дополнительные лейблы и аннотации для неймспейсов проекта.
                  properties:
                    labels:
                      description: |
                        Литеральная карта лейблов или ссылка на параметр `{fromParam: "<name>"}`.

                        Лейблы ставятся на все неймспейсы проекта, включая дополнительные, и перечисляются в аннотации `projects.deckhouse.io/template-labels` каждого из них.

                        Лейблы, которыми управляет модуль (`heritage`, `app.kubernetes.io/managed-by`, `projects.deckhouse.io/*`, `multitenancy.deckhouse.io/*`, лейблы профиля безопасности, мониторинга и сканирования), и лейбл `kubernetes.io/metadata.name` в этом поле задать нельзя. Шаблон, который задаёт такой лейбл здесь, отклоняется, как и Project, параметры которого передают такой лейбл в это поле. Шаблон или Project, в котором такой лейбл уже есть, можно изменять, пока лейбл остаётся прежним. Лейбл не применяется, и ответ API предупреждает об этом.

                        Лейблы отслеживания GitOps (`app.kubernetes.io/instance`, `argocd.argoproj.io/*`, `kustomize.toolkit.fluxcd.io/*`, `helm.toolkit.fluxcd.io/*`, `kapp.k14s.io/*`) ставятся только на основной неймспейс. Собственный ключ отслеживания наследуется, как любой другой лейбл.

                        Когда неймспейс становится проектом автоматически, его собственные лейблы не копируются в Project и в это поле не попадают. Лейбл, заданный в `spec.parameters.namespace.labels` ресурса Project, попадает в это поле через встроенные шаблоны и наследуется.
                    annotations:
                      description: |
                        Литеральная карта аннотаций или ссылка на параметр `{fromParam: "<name>"}`.

                        Аннотации ставятся только на основной неймспейс проекта.
                features:
                  description: Опциональные возможности проекта.
                  properties:
                    monitoring:
                      description: |
                        Включить расширенный мониторинг для проекта.
                        
                        Литеральное булево значение или ссылка на параметр `{fromParam: "<name>"}`.
                    vulnerabilityScanning:
                      description: |
                        Включить периодическое сканирование уязвимостей (Trivy) для проекта.
                        
                        Литеральное булево значение или ссылка на параметр `{fromParam: "<name>"}`.
                logShipping:
                  description: Перенаправление логов проекта в кластерное хранилище логов.
                  properties:
                    clusterDestinationRef:
                      description: |
                        Имя ClusterLogDestination для отправки логов.
                        
                        Литеральная строка или ссылка на параметр `{fromParam: "<name>"}`.
                allowedUIDs:
                  description: |
                    Диапазон идентификаторов пользователей, допустимых в контейнерах проекта.
                    
                    Литеральный объект `{min, max}` или ссылка на параметр `{fromParam: "<name>"}`.
                allowedGIDs:
                  description: |
                    Диапазон идентификаторов групп, допустимых в контейнерах проекта.
                    
                    Литеральный объект `{min, max}` или
                    ссылка на параметр `{fromParam: "<name>"}`.
                runtimeAudit:
                  description: Правила аудита обращений к ядру; действуют только при заданных allowedUIDs/allowedGIDs.
                  properties:
                    enabled:
                      description: |
                        Литеральное булево значение или ссылка на параметр `{fromParam: "<name>"}`.
                parametersSchema:
                  description: |
                    Схема OpenAPI v3 для [параметров](cr.html#project-v1alpha3-spec-parameters) проекта.

                    Булев параметр `requiredRequests`, объявленный здесь, читается по имени: если для проекта он равен `true`, поды во всех неймспейсах проекта должны задавать запросы CPU и памяти (OperationPolicy в режиме `Deny`).
                  properties:
                    openAPIV3Schema:
                      description: |
                        Спецификация OpenAPI, по которой проверяются параметры проекта при его создании и изменении.
                manifests:
                  description: |
                    Шаблон в формате [`go template`](https://pkg.go.dev/text/template) с [функциями `helm`](https://helm.sh/docs/chart_template_guide/function_list/), который создаёт объекты в неймспейсах проекта рядом с объектами из структурированных полей.

                    Шаблон получает имя проекта в `{{ .projectName }}`, имя шаблона в `{{ .projectTemplateName }}` и [параметры проекта](cr.html#project-v1alpha3-spec-parameters), дополненные значениями по умолчанию из `parametersSchema`, в `{{ .parameters }}`, то есть те же значения, что и `resourcesTemplate`. Проект, параметры которого превращаются в объекты или ключи отрендеренных манифестов, а не в значения, отклоняется, поэтому заключайте в кавычки каждую подстановку.

                    Контроллер применяет объекты через server-side apply от имени пользователя `system:multitenancy-manager:project:<PROJECT_NAME>`, а ProjectRoleBinding `d8-manifests` проекта выдаёт этому пользователю роль `d8:project:admin`. Поэтому объект получает только то, что эта роль разрешает в неймспейсах проекта, а не права контроллера. AuthorizationRule с уровнем доступа `Admin` отклоняется, когда манифесты создают его или повышают до этого уровня уже существующий, хотя роль это разрешает. Администраторы проекта задаются в [`.spec.administrators`](cr.html#project-v1alpha3-spec-administrators) объекта Project. Объекты применяются, когда эта привязка в состоянии Ready, а условие `ManifestsApplied` проекта показывает, применены ли объекты, и называет объекты, которые отклонил API-сервер, с кодом каждого отказа, например 403.

                    Объект без `metadata.namespace` создаётся в основном неймспейсе проекта, а неймспейс, который указывает объект, должен принадлежать проекту. Объекты уровня кластера, объекты в неймспейсах вне проекта и объекты с лейблом `heritage: multitenancy-manager` или `heritage: deckhouse` отклоняются. На объекты ставятся лейбл `projects.deckhouse.io/project` с именем проекта и лейбл `projects.deckhouse.io/source: manifests`, а `.status.manifestObjects` проекта перечисляет их. Объект, который шаблон больше не создаёт, удаляется.

                    Объект, который перевод проекта с Helm-текста оставил на месте и перечислил в `.status.keptObjects`, переходит под управление `manifests`, когда шаблон создаёт объект того же типа с тем же неймспейсом и именем. После этого объект содержит то, что создаёт `manifests`, а поле, которое задал Helm-текст и не задаёт `manifests`, удаляется, в том числе аннотации Helm. Любой другой уже существующий объект, который создали не `manifests`, меняется, только если на нём есть оба лейбла, а иначе его называет условие `ManifestsApplied`.

                    В отличие от объектов из структурированных полей, эти объекты может изменить и удалить любой, кто может записывать их в неймспейсах проекта, в том числе администраторы проекта. Через некоторое время контроллер применяет их снова и возвращает поля, которые задаёт шаблон, и удалённые объекты, а поле, которое кто-то добавил, остаётся. Поэтому то, что проект не должен менять, описывайте структурированными полями. Шаблон проекта могут прочитать и пользователи без доступа к его проектам, в том числе пользователи с уровнем доступа `User`, поэтому не помещайте в `manifests` секретные значения.

                    Поле нельзя задать вместе с `resourcesTemplate`. В `deckhouse.io/v1alpha1` для него нет места, поэтому запись шаблона с этим полем через `deckhouse.io/v1alpha1` отклоняется. Подробнее в разделе [«Описание других объектов в manifests»](usage.html#описание-других-объектов-в-manifests).
                resourcesTemplate:
                  description: |
                    Шаблон в формате [`go template`](https://pkg.go.dev/text/template) с [функциями `helm`](https://helm.sh/docs/chart_template_guide/function_list/), который рендерит объекты проекта.

                    Поле устарело и сохраняется для шаблонов, созданных через `deckhouse.io/v1alpha1`. Описывайте новые шаблоны структурированными полями и `manifests`. Ни один шаблон не может получить новое `resourcesTemplate` ни через одну из версий: создание шаблона с непустым полем и изменение, которое задаёт поле шаблону без него, отклоняются, а создание через `deckhouse.io/v1alpha1` отклоняется целиком. Шаблон, у которого поле есть, сохраняет его, и его можно менять через любую из двух версий, пока `deckhouse.io/v1alpha1` может описать весь шаблон. Поэтому шаблон с Helm-текстом нельзя создать заново, например из резервной копии или из Git: сначала переведите его на структурированные поля и `manifests`. Поле уйдёт из `deckhouse.io/v1alpha2` вместе с `deckhouse.io/v1alpha1` в одном из следующих релизов. Подробнее в разделе [«Перевод шаблона с Helm-текста»](usage.html#перевод-шаблона-с-helm-текста).

                    Если поле не пустое, шаблон рендерится из него. Его нельзя задать вместе с полями, которые рендерят объекты в неймспейсы проекта (`podSecurityStandard`, `networkPolicy`, `namespaceMetadata`, `manifests` и остальные), а `resources` и `grantPolicies` действуют в обоих случаях. Шаблон, который используют проекты, сохраняет непустое `resourcesTemplate`, пока изменение не задаст такие поля или `manifests` вместо него.

                    После такого изменения, как и после перевода проекта на структурированный шаблон, объекты AuthorizationRule и ResourceQuota из Helm-текста, которые заменяют `.spec.administrators` и `.spec.quota` проекта, удаляются, когда эти поля заработают, а AuthorizationRule, в котором больше нет никого из `.spec.administrators`, удаляется сразу. Каждый другой объект Helm-текста, который новые поля не создают с тем же типом и именем, остаётся на месте и перечисляется в `.status.keptObjects` проекта, пока `manifests` не создаст объект того же типа с тем же неймспейсом и именем и не возьмёт его под управление. Подробнее в разделе [«Переход проекта с Helm-текста»](usage.html#переход-проекта-с-helm-текста).

                    Шаблон получает имя проекта в `{{ .projectName }}`, имя шаблона в `{{ .projectTemplateName }}` и [параметры проекта](cr.html#project-v1alpha3-spec-parameters), дополненные значениями по умолчанию из `parametersSchema`, в `{{ .parameters }}`. Если `parametersSchema` объявляет параметры `administrators` и `resourceQuota`, в них передаются [администраторы](cr.html#project-v1alpha3-spec-administrators) и [квота](cr.html#project-v1alpha3-spec-quota) проекта в том виде, в каком их содержит Project `deckhouse.io/v1alpha2`. Проект, параметры которого превращаются в объекты или ключи отрендеренных манифестов, а не в значения, отклоняется, поэтому заключайте в кавычки каждую подстановку.

                    Объект без `metadata.namespace` или в неймспейсе вне проекта создаётся в основном неймспейсе проекта. Лейблы, которые шаблон ставит на основной неймспейс, кроме лейблов модуля и лейблов отслеживания GitOps, перечисляются в его аннотации `projects.deckhouse.io/template-labels` и ставятся также на дополнительные неймспейсы.
            status:
              properties:
                message:
                  description: Сообщение, указывающее на причину появления текущего статуса.
                ready:
                  description: Готовность шаблона к использованию. Указывает на то, что шаблон успешно прошёл проверку.
