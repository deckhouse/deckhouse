spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает шаблон проекта.

            На этот ресурс ссылается другой пользовательский ресурс — [Project](cr.html#project).
          properties:
            spec:
              properties:
                description:
                  description: |
                    Произвольное описание назначения шаблона. Укажите пустую строку, если описание не требуется.
                parametersSchema:
                  description: |
                    Одна из схем параметров для валидации параметров проекта.

                    На данный момент поддерживается только схема OpenAPI v3.
                  properties:
                    openAPIV3Schema:
                      description: |
                        Спецификация OpenAPI для [параметров шаблона](#project-v1alpha2-spec-parameters).

                        Используется для проверки правильности параметров, передаваемых при создании нового проекта.
                resourcesTemplate:
                  description: |
                    Шаблон, определяющий ресурсы в формате [`go template`](https://pkg.go.dev/text/template), создаваемые при настройке нового проекта.

                    Шаблоны полностью совместимы со всеми [функциями `helm`](https://helm.sh/docs/chart_template_guide/function_list/).

                    Узнайте больше о [создании изолированной среды...](usage.html#создание-проекта)

                    В шаблонах доступны следующие параметры:
                    - `{{ .projectName }}` — имя `Project`, для которого рендерится шаблон.
                    - `{{ .projectTemplateName }}` — имя `ProjectTemplate`.
                    - `{{ .parameters }}` — словарь пользовательских значений, описанных в параметре [.spec.parametersSchema](cr.html#projecttemplate-v1alpha1-spec-parametersschema) и определенных в параметре [.spec.parameters](cr.html#project-v1alpha2-spec-parameters).

                    > **Примечание!** Указание полей `.metadata.namespace` для объектов является необязательным,
                    > так как в это поле автоматически устанавливается значение с именем созданного проекта.
            status:
              properties:
                message:
                  description: Сообщение, указывающее на причину появления текущего статуса.
                ready:
                  description: Готовность шаблона к использованию. Указывает на то, что шаблон успешно прошел проверку.
    - name: v1alpha2
      schema:
        openAPIV3Schema:
          description: |
            Описывает шаблон проекта как набор структурированных декларативных полей.

            На этот ресурс ссылается другой пользовательский ресурс — [Project](cr.html#project). Поля доступности кластерных ресурсов (`resources`, `grantPolicies`) материализуются в объекты [ClusterResourceGrantPolicy](cr.html#clusterresourcegrantpolicy), привязанные к проектам этого шаблона; остальные поля рендерятся в объекты внутри неймспейсов.

            Объекты, которые не описывает ни одно структурированное поле, создаются из `manifests`. Вместо полей, которые рендерят объекты, шаблон, записанный через `deckhouse.io/v1alpha1`, может содержать Helm-шаблон в `resourcesTemplate`. Такая форма устарела.
          properties:
            spec:
              properties:
                title:
                  description: Краткое человекочитаемое имя шаблона.
                description:
                  description: |
                    Произвольное описание назначения шаблона.
                    
                    Укажите пустую строку, если описание не требуется.
                resources:
                  description: |
                    Встроенные правила выдачи кластерных ресурсов.
                    
                    Контроллер материализует их в управляемый ClusterResourceGrantPolicy, привязанный к проектам этого шаблона.
                  items:
                    description: |
                      Одна запись allow-листа/дефолта для ресурса, ссылающаяся на GrantableClusterResourceDefinition.
                    properties:
                      resourceName:
                        description: Имя GrantableClusterResourceDefinition, которую настраивает эта запись.
                      allowed:
                        description: Явный список выданных имён объектов (объединяется с allowedSelector).
                      allowedSelector:
                        description: Выдаёт все объекты выданного ресурса, чьи метки совпадают (объединяется с allowed).
                      denied:
                        description: Имена объектов, явно исключённые для подходящих проектов (перекрывает allowed).
                      deniedSelector:
                        description: Исключает выданные объекты, чьи метки совпадают (перекрывает allowed/allowedSelector).
                      default:
                        description: Имя дефолта для проекта (перекрывает defaultFrom регистрации).
                      availabilityDefault:
                        description: Перекрывает defaultAvailability ресурса (All/None) для подходящих проектов.
                grantPolicies:
                  description: |
                    Ссылки на библиотечные объекты ClusterResourceGrantPolicy (созданные без `projectSelector` и `namespaceSelector`).

                    Для каждой ссылки контроллер создаёт и поддерживает отдельную управляемую политику, копирует в неё ресурсы библиотечной политики и привязывает их к неймспейсам, созданным по этому шаблону.
                podSecurityStandard:
                  description: |
                    Профиль Pod Security Standard, применяемый к неймспейсам проекта.

                    Возможные значения:

                    - Privileged — неограниченная политика.
                    - Baseline — минимально ограничивающая политика, предотвращающая известные эскалации привилегий.
                    - Restricted — сильно ограниченная политика, актуальные практики hardening подов.

                    Литеральная строка (`Privileged`/`Baseline`/`Restricted`) или ссылка на параметр
                    `{fromParam: "<name>"}`, указывающая на свойство `parametersSchema`. Литерал вне трёх значений
                    и ссылка на необъявленный или не того типа параметр отклоняются admission webhook (поле в схеме нетипизировано, поэтому CEL-правила не несёт).
                networkPolicy:
                  description: Сетевая изоляция неймспейсов проекта по умолчанию.
                  properties:
                    mode:
                      description: |
                        - Isolated — по умолчанию запрещать весь трафик, кроме внутрипроектного, DNS, сбора метрик Prometheus и ingress-nginx.
                        - NotRestricted — по умолчанию разрешать весь трафик.

                        Литеральная строка (`Isolated`/`NotRestricted`) или ссылка на параметр `{fromParam: "<name>"}`.
                        Литерал вне двух значений отклоняется admission webhook.
                nodeSelector:
                  description: |
                    Ограничивает поды проекта узлами с указанными метками. Литеральная карта меток или ссылка на параметр `{fromParam: "<name>"}`.
                tolerations:
                  description: |
                    Tolerations по умолчанию, применяемые к подам проекта.
                    
                    Литеральный список tolerations или ссылка на параметр `{fromParam: "<name>"}`.
                namespaceMetadata:
                  description: Дополнительные метки и аннотации для неймспейсов проекта.
                  properties:
                    labels:
                      description: |
                        Литеральная карта лейблов или ссылка на параметр `{fromParam: "<name>"}`.

                        Лейблы ставятся на все неймспейсы проекта, включая дополнительные, и перечисляются в аннотации `projects.deckhouse.io/template-labels` каждого из них.

                        Лейблы, которыми управляет модуль (`heritage`, `app.kubernetes.io/managed-by`, `projects.deckhouse.io/*`, `multitenancy.deckhouse.io/*`, лейблы профиля безопасности, мониторинга и сканирования), и лейбл `kubernetes.io/metadata.name` в этом поле задать нельзя. Шаблон, который задаёт такой лейбл здесь, отклоняется, как и Project, параметры которого передают такой лейбл в это поле. Шаблон или Project, в котором такой лейбл уже есть, можно изменять, пока лейбл остаётся прежним. Лейбл не применяется, и ответ API предупреждает об этом.

                        Лейблы отслеживания GitOps (`app.kubernetes.io/instance`, `argocd.argoproj.io/*`, `kustomize.toolkit.fluxcd.io/*`, `helm.toolkit.fluxcd.io/*`, `kapp.k14s.io/*`) ставятся только на основной неймспейс. Собственный ключ отслеживания наследуется, как любой другой лейбл.

                        Когда неймспейс становится проектом автоматически, его собственные лейблы не копируются в Project и в это поле не попадают. Лейбл, заданный в `spec.parameters.namespace.labels` ресурса Project, попадает в это поле через встроенные шаблоны и наследуется.
                    annotations:
                      description: |
                        Литеральная карта аннотаций или ссылка на параметр `{fromParam: "<name>"}`.

                        Аннотации ставятся только на основной неймспейс проекта.
                features:
                  description: Опциональные возможности проекта.
                  properties:
                    monitoring:
                      description: |
                        Включить расширенный мониторинг для проекта.
                        
                        Литеральное булево значение или ссылка на параметр `{fromParam: "<name>"}`.
                    vulnerabilityScanning:
                      description: |
                        Включить периодическое сканирование уязвимостей (Trivy) для проекта.
                        
                        Литеральное булево значение или ссылка на параметр `{fromParam: "<name>"}`.
                logShipping:
                  description: Перенаправление логов проекта в кластерное хранилище логов.
                  properties:
                    clusterDestinationRef:
                      description: |
                        Имя ClusterLogDestination для отправки логов.
                        
                        Литеральная строка или ссылка на параметр `{fromParam: "<name>"}`.
                allowedUIDs:
                  description: |
                    Диапазон идентификаторов пользователей, допустимых в контейнерах проекта.
                    
                    Литеральный объект `{min, max}` или ссылка на параметр `{fromParam: "<name>"}`.
                allowedGIDs:
                  description: |
                    Диапазон идентификаторов групп, допустимых в контейнерах проекта.
                    
                    Литеральный объект `{min, max}` или
                    ссылка на параметр `{fromParam: "<name>"}`.
                runtimeAudit:
                  description: Правила аудита обращений к ядру; действуют только при заданных allowedUIDs/allowedGIDs.
                  properties:
                    enabled:
                      description: |
                        Литеральное булево значение или ссылка на параметр `{fromParam: "<name>"}`.
                parametersSchema:
                  description: |
                    Схема OpenAPI v3 для валидации [параметров](#project-v1alpha2-spec-parameters) проекта.
                  properties:
                    openAPIV3Schema:
                      description: |
                        Спецификация OpenAPI, используемая для проверки правильности параметров, передаваемых при создании нового проекта.
                manifests:
                  description: |
                    Шаблон в формате [`go template`](https://pkg.go.dev/text/template) с [функциями `helm`](https://helm.sh/docs/chart_template_guide/function_list/), который создаёт объекты в неймспейсах проекта рядом с объектами из структурированных полей.

                    Шаблон получает имя проекта в `{{ .projectName }}`, имя шаблона в `{{ .projectTemplateName }}` и [параметры проекта](cr.html#project-v1alpha3-spec-parameters), дополненные значениями по умолчанию из `parametersSchema`, в `{{ .parameters }}`, то есть те же значения, что и `resourcesTemplate`. Проект, параметры которого превращаются в объекты или ключи отрендеренных манифестов, а не в значения, отклоняется, поэтому заключайте в кавычки каждую подстановку.

                    Контроллер применяет объекты через server-side apply от имени пользователя `system:multitenancy-manager:project:<PROJECT_NAME>`, а ProjectRoleBinding `d8-manifests` проекта выдаёт этому пользователю роль `d8:project:admin`. Поэтому объект получает только то, что эта роль разрешает в неймспейсах проекта, а не права контроллера. Объекты применяются, когда эта привязка в состоянии Ready, а условие `ManifestsApplied` проекта показывает, применены ли объекты, и называет объекты, которые отклонил API-сервер, с кодом каждого отказа, например 403.

                    Объект без `metadata.namespace` создаётся в основном неймспейсе проекта, а неймспейс, который указывает объект, должен принадлежать проекту. Объекты уровня кластера, объекты в неймспейсах вне проекта и объекты с лейблом `heritage: multitenancy-manager` или `heritage: deckhouse` отклоняются. На объекты ставятся лейбл `projects.deckhouse.io/project` с именем проекта и лейбл `projects.deckhouse.io/source: manifests`, а `.status.manifestObjects` проекта перечисляет их. Объект, который шаблон больше не создаёт, удаляется.

                    Объект, который перевод проекта с Helm-текста оставил на месте и перечислил в `.status.keptObjects`, переходит под управление `manifests`, когда шаблон создаёт объект того же типа с тем же неймспейсом и именем. После этого объект содержит то, что создаёт `manifests`, а поле, которое задал Helm-текст и не задаёт `manifests`, удаляется, в том числе аннотации Helm. Любой другой уже существующий объект, который создали не `manifests`, меняется, только если на нём есть оба лейбла, а иначе его называет условие `ManifestsApplied`.

                    В отличие от объектов из структурированных полей, эти объекты может изменить и удалить любой, кто может записывать их в неймспейсах проекта, в том числе администраторы проекта. Через некоторое время контроллер применяет их снова и возвращает поля, которые задаёт шаблон, и удалённые объекты, а поле, которое кто-то добавил, остаётся. Поэтому то, что проект не должен менять, описывайте структурированными полями. Шаблон проекта могут прочитать и пользователи без доступа к его проектам, в том числе пользователи с уровнем доступа `User`, поэтому не помещайте в `manifests` секретные значения.

                    Поле нельзя задать вместе с `resourcesTemplate`. В `deckhouse.io/v1alpha1` для него нет места, поэтому запись шаблона с этим полем через `deckhouse.io/v1alpha1` отклоняется.
                resourcesTemplate:
                  description: |
                    Шаблон в формате [`go template`](https://pkg.go.dev/text/template) с [функциями `helm`](https://helm.sh/docs/chart_template_guide/function_list/), который рендерит объекты проекта.

                    Поле устарело и сохраняется для шаблонов, записанных через `deckhouse.io/v1alpha1`. Описывайте новые шаблоны структурированными полями и `manifests`. Запись через `deckhouse.io/v1alpha2` не может добавить шаблону новое `resourcesTemplate`, поэтому создание шаблона с непустым полем и изменение, которое задаёт поле шаблону без него, отклоняются. Шаблон, у которого поле есть, сохраняет его, и его можно менять через любую из двух версий. Шаблон, которому ещё нужен Helm-текст, создаётся через `deckhouse.io/v1alpha1`, а его `title`, `resources` или `grantPolicies` добавляются после этого через `deckhouse.io/v1alpha2`. Поле уйдёт из `deckhouse.io/v1alpha2` вместе с `deckhouse.io/v1alpha1` в одном из следующих релизов.

                    Если поле не пустое, шаблон рендерится из него. Его нельзя задать вместе с полями, которые рендерят объекты в неймспейсы проекта (`podSecurityStandard`, `networkPolicy`, `namespaceMetadata`, `manifests` и остальные), а `resources` и `grantPolicies` действуют в обоих случаях. Шаблон, который используют проекты, сохраняет непустое `resourcesTemplate`, пока изменение не задаст такие поля или `manifests` вместо него.

                    После такого изменения, как и после перевода проекта на структурированный шаблон, объекты AuthorizationRule и ResourceQuota из Helm-текста, которые заменяют `.spec.administrators` и `.spec.quota` проекта, удаляются, когда эти поля заработают, а AuthorizationRule, в котором больше нет никого из `.spec.administrators`, удаляется сразу. Каждый другой объект Helm-текста, который новые поля не создают с тем же типом и именем, остаётся на месте и перечисляется в `.status.keptObjects` проекта, пока `manifests` не создаст объект того же типа с тем же неймспейсом и именем и не возьмёт его под управление. Подробнее в разделе [Переход проекта с Helm-текста](usage.html#переход-проекта-с-helm-текста).

                    Шаблон получает имя проекта в `{{ .projectName }}`, имя шаблона в `{{ .projectTemplateName }}` и [параметры проекта](cr.html#project-v1alpha3-spec-parameters), дополненные значениями по умолчанию из `parametersSchema`, в `{{ .parameters }}`. Если `parametersSchema` объявляет параметры `administrators` и `resourceQuota`, в них передаются [администраторы](cr.html#project-v1alpha3-spec-administrators) и [квота](cr.html#project-v1alpha3-spec-quota) проекта в том виде, в каком их содержит Project `deckhouse.io/v1alpha2`. Проект, параметры которого превращаются в объекты или ключи отрендеренных манифестов, а не в значения, отклоняется, поэтому заключайте в кавычки каждую подстановку.

                    Объект без `metadata.namespace` или в неймспейсе вне проекта создаётся в основном неймспейсе проекта. Лейблы, которые шаблон ставит на основной неймспейс, кроме лейблов модуля и лейблов отслеживания GitOps, перечисляются в его аннотации `projects.deckhouse.io/template-labels` и ставятся также на дополнительные неймспейсы.
            status:
              properties:
                message:
                  description: Сообщение, указывающее на причину появления текущего статуса.
                ready:
                  description: Готовность шаблона к использованию. Указывает на то, что шаблон успешно прошел проверку.
