spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Read-only каталог доступных кластерных ресурсов для проекта (механизм грантов модуля `multitenancy-manager`). `metadata.name` совпадает с именем грантуемого ресурса (см. [`GrantableClusterResourceDefinition`](cr.html#grantableclusterresourcedefinition)).

            **Кто создаёт:** только контроллер `multitenancy-manager` (автоматически, по одному объекту на каждое определение в неймспейсе каждого совпавшего проекта).
            **Ручное создание:** запрещено — отклоняется вебхуком `/protect`.
            **Назначение:** пользователи проекта (тенанты) читают его, чтобы узнать, какие имена кластерных ресурсов доступны и какой является дефолтом. Данные содержатся только в `status` (`available` — список доступных имён с флагом дефолта; `default` — дефолт проекта; `grantedResourceKind` — справочно).

            Просмотр: `d8 k get available -n <проект>` (список) или `d8 k get available storageclasses -n <проект> -o yaml` (детали).

            Подробности — в разделе [«Для пользователей проекта (тенантов)»](usage_ru.html#для-пользователей-проекта-тенантов).
