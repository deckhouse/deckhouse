spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Ресурс модуля multitenancy-manager (механизм грантов на кластерные объекты).
          properties:
            status:
              properties:
                available:
                  description: |
                    Имена, доступные проекту, с пометкой дефолтного.
                  items:
                    properties:
                      name:
                        description: |
                          Имя выданного объекта, доступное в проекте.
                      default:
                        description: |
                          `true` у дефолтного имени проекта. Если у проекта нет применимого дефолта, флага нет ни
                          у одной записи — это штатное состояние, см. описание `status.default`.
                default:
                  description: |
                    Дефолтное имя проекта: подставляется, когда ссылающееся поле оставлено пустым (или содержит
                    значение, недоступное проекту).

                    Пусто, когда у проекта нет применимого дефолта. Это штатное состояние, а не сбой: в политике
                    не задан `default`, а в регистрации нет `defaultFrom`; либо ресурс value-backed, к которому
                    `defaultFrom` не применяется; либо `defaultFrom` задан, но объектов с его аннотацией не ровно
                    один; либо дефолт задан, но недоступен этому проекту — тогда он сбрасывается, чтобы
                    подстановка не заполнила значение, которое отвергнет валидация.
                grantedResourceKind:
                  description: |
                    Kind выданного ресурса (информационно).
                availableCount:
                  description: |
                    Количество доступных имён. Вынесено в колонку, потому что полный список бывает длинным
                    (например, десятки кластерных ролей) и ломает таблицу; сами имена — в
                    `status.available[*].name`.
                observedGeneration:
                  description: |
                    Поколение контроллера, которое сформировало этот статус.
