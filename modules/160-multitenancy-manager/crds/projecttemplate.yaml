---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    heritage: deckhouse
    module: multitenancy-manager
    backup.deckhouse.io/cluster-config: "true"
  name: projecttemplates.deckhouse.io
spec:
  group: deckhouse.io
  names:
    kind: ProjectTemplate
    listKind: ProjectTemplateList
    plural: projecttemplates
    singular: projecttemplate
  scope: Cluster
  versions:
    - name: v1alpha1
      # Served and deprecated. Templates created as v1alpha1 Helm strings, by hand or by the tools
      # that generate them, keep being written at this version, and the Helm text survives the trip
      # to storage because v1alpha2 carries resourcesTemplate too. A template is created through
      # v1alpha2 only: the d8-multitenancy-manager-v1alpha1-template-create admission policy refuses
      # a create through this version, and the template webhook refuses a write through either
      # version that sets a Helm text where the stored template has none. The structured fields
      # (resources, grantPolicies, podSecurityStandard, manifests and the rest) exist in v1alpha2
      # only, and a write through v1alpha1 would erase them, so the template webhook refuses one to a
      # template that has them.
      served: true
      storage: false
      deprecated: true
      deprecationWarning: deckhouse.io/v1alpha1 ProjectTemplate is deprecated; use deckhouse.io/v1alpha2 with the structured fields and manifests, which v1alpha1 cannot describe
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.ready
          name: Ready
          type: boolean
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
        - jsonPath: .spec.description
          name: Description
          type: string
      schema:
        openAPIV3Schema:
          description: |
            Describes the project template.

            This resource is referenced by the [Project](cr.html#project) custom resource.

            The version is deprecated. A template is created through `deckhouse.io/v1alpha2`, and a create through `deckhouse.io/v1alpha1` is refused. The templates created through `deckhouse.io/v1alpha1` earlier are read, changed and deleted through it as before.
          properties:
            spec:
              required: ["parametersSchema", "resourcesTemplate"]
              properties:
                description:
                  description: |
                    Arbitrary description of the template's purpose. Specify an empty string if no description is required.
                  type: string
                parametersSchema:
                  type: object
                  required: ["openAPIV3Schema"]
                  description: |
                    Schema of the project parameters.

                    Only `openAPIV3Schema` is supported.
                  properties:
                    openAPIV3Schema:
                      type: object
                      additionalProperties:
                        x-kubernetes-preserve-unknown-fields: true
                      description: |
                        OpenAPI specification for [parameters](cr.html#project-v1alpha3-spec-parameters).

                        This is used to check the validity of the parameters that are passed when creating a new project.
                resourcesTemplate:
                  description: |
                    A template that defines resources in the [`go template`](https://pkg.go.dev/text/template) format to be created when setting up a new project.

                    Templates are fully compatible with all [`helm` functions](https://helm.sh/docs/chart_template_guide/function_list/).

                    See [Moving a template from a Helm text](usage.html#moving-a-template-from-a-helm-text).

                    The following parameters are available in templates:
                    - `{{ .projectName }}` — the name of the `Project` for which the template is being rendered.
                    - `{{ .projectTemplateName }}` — the name of the `ProjectTemplate`.
                    - `{{ .parameters }}` — a dictionary of custom values, described in the [.spec.parametersSchema](cr.html#projecttemplate-v1alpha1-spec-parametersschema) and defined in the [.spec.parameters](cr.html#project-v1alpha3-spec-parameters).

                    `.metadata.namespace` of an object is optional: an object without it is created in the main namespace of the project.
                  type: string
              type: object
            status:
              properties:
                message:
                  description: Message indicating the cause of the current status.
                  type: string
                ready:
                  description: Whether the template is ready to use. Indicates that the template has been successfully validated.
                  type: boolean
              type: object
          type: object
    - name: v1alpha2
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.ready
          name: Ready
          type: boolean
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
        - jsonPath: .spec.title
          name: Title
          type: string
        - jsonPath: .spec.description
          name: Description
          type: string
      schema:
        openAPIV3Schema:
          description: |
            Describes the project template as a set of structured, declarative fields.

            This resource is referenced by the [Project](cr.html#project) custom resource. The
            `resources` and `grantPolicies` fields become [ClusterResourceGrantPolicy](cr.html#clusterresourcegrantpolicy)
            objects that apply to the projects of this template. The other fields become objects in the
            namespaces of the projects.

            Objects that no structured field describes are rendered from `manifests`. Instead of the
            fields that render objects, a template created through `deckhouse.io/v1alpha1` can carry a
            Helm template in `resourcesTemplate`. This form is deprecated, and no template can get a
            new `resourcesTemplate`.
          type: object
          properties:
            spec:
              type: object
              properties:
                title:
                  description: Short human-readable name of the template.
                  type: string
                description:
                  description: |
                    Arbitrary description of the template's purpose. Specify an empty string if no description is required.
                  type: string
                resources:
                  description: |
                    Rules of access to cluster-wide resources for the projects of the template.

                    The controller turns them into the `template-<TEMPLATE_NAME>-inline` ClusterResourceGrantPolicy, which applies to the namespaces of the projects of this template.
                  type: array
                  items:
                    description: |
                      Access settings for one type of cluster-wide resource.
                    type: object
                    required:
                      - resourceName
                    properties:
                      resourceName:
                        description: Name of the GrantableClusterResourceDefinition that registers the type of cluster-wide resource.
                        type: string
                      allowed:
                        description: |
                          List of names of cluster-wide resources available to the projects.

                          Combined with the resources selected with `allowedSelector`.
                        type: array
                        items:
                          type: string
                      allowedSelector:
                        description: |
                          Label selector of cluster-wide resources available to the projects.

                          Combined with the resources listed in `allowed`. Applies only to cluster-wide resources represented by Kubernetes objects.
                        type: object
                        x-kubernetes-map-type: atomic
                        properties:
                          matchLabels:
                            description: |
                              Set of labels of cluster-wide resources.

                              All specified labels must match.
                            type: object
                            additionalProperties:
                              type: string
                          matchExpressions:
                            description: |
                              List of label selector expressions.

                              All expressions must match.
                            type: array
                            x-kubernetes-list-type: atomic
                            items:
                              type: object
                              required:
                                - key
                                - operator
                              properties:
                                key:
                                  description: Label key to which the expression applies.
                                  type: string
                                operator:
                                  description: Operator that defines the relationship between the key and the set of values.
                                  type: string
                                values:
                                  description: List of label values.
                                  type: array
                                  x-kubernetes-list-type: atomic
                                  items:
                                    type: string
                      denied:
                        description: |
                          List of names of cluster-wide resources unavailable to the projects.

                          Deny rules take precedence over `allowed` and `allowedSelector`.
                        type: array
                        items:
                          type: string
                      deniedSelector:
                        description: |
                          Label selector of cluster-wide resources unavailable to the projects.

                          Deny rules take precedence over `allowed` and `allowedSelector`.
                        type: object
                        x-kubernetes-map-type: atomic
                        properties:
                          matchLabels:
                            description: |
                              Set of labels of cluster-wide resources.

                              All specified labels must match.
                            type: object
                            additionalProperties:
                              type: string
                          matchExpressions:
                            description: |
                              List of label selector expressions.

                              All expressions must match.
                            type: array
                            x-kubernetes-list-type: atomic
                            items:
                              type: object
                              required:
                                - key
                                - operator
                              properties:
                                key:
                                  description: Label key to which the expression applies.
                                  type: string
                                operator:
                                  description: Operator that defines the relationship between the key and the set of values.
                                  type: string
                                values:
                                  description: List of label values.
                                  type: array
                                  x-kubernetes-list-type: atomic
                                  items:
                                    type: string
                      default:
                        description: |
                          Name of the cluster-wide resource used by default in the projects.

                          Overrides the value determined with `defaultFrom` in the GrantableClusterResourceDefinition.
                        type: string
                      availabilityDefault:
                        description: |
                          Availability of the cluster-wide resources of this type that `allowed`, `allowedSelector`, `denied` and `deniedSelector` do not name.

                          Overrides `defaultAvailability` of the GrantableClusterResourceDefinition. If `allowed` or `allowedSelector` is set and this field is not, all other resources of this type are unavailable to the projects.
                        type: string
                        enum:
                          - All
                          - None
                grantPolicies:
                  description: |
                    References to library ClusterResourceGrantPolicy objects (created without `projectSelector` and `namespaceSelector`).

                    The controller creates and maintains one managed policy per reference, copying its resources and binding them to the namespaces rendered from this template.
                  type: array
                  items:
                    type: string
                podSecurityStandard:
                  description: |
                    Pod Security Standard profile applied to the project namespaces.

                    - `Privileged`: Unrestricted policy.
                    - `Baseline`: Minimally restrictive policy that prevents known privilege escalations.
                    - `Restricted`: Heavily restricted policy that follows current pod hardening best practices.

                    A literal string (`Privileged`/`Baseline`/`Restricted`) or a parameter reference
                    `{fromParam: "<name>"}` pointing at a `parametersSchema` property. The webhook refuses a literal outside
                    the three values and a reference to an undeclared or mistyped parameter.
                  x-kubernetes-preserve-unknown-fields: true
                networkPolicy:
                  description: Network isolation of the project namespaces.
                  type: object
                  properties:
                    mode:
                      description: |
                        Network isolation mode of the project namespaces.

                        - `Isolated`: Every namespace of the project gets the `isolated` NetworkPolicy. It allows incoming traffic only from the project namespaces, Prometheus, the ingress-nginx controller and the service-with-healthchecks agent, and outgoing traffic only to the project namespaces and to DNS in `kube-system`.
                        - `NotRestricted`: No NetworkPolicy is created.

                        If the field is not set, no NetworkPolicy is created either.

                        A literal string (`Isolated`/`NotRestricted`) or a parameter reference `{fromParam: "<name>"}`.
                        The webhook refuses a literal outside the two values.
                      x-kubernetes-preserve-unknown-fields: true
                nodeSelector:
                  description: |
                    Node selector of the pods in the main namespace of the project. A literal label map or a
                    parameter reference `{fromParam: "<name>"}`.

                    It is set as the `scheduler.alpha.kubernetes.io/node-selector` annotation of the main namespace and is merged into the node selector of every pod there. A pod whose selector conflicts with it is rejected. The additional namespaces of the project do not get it.
                  x-kubernetes-preserve-unknown-fields: true
                tolerations:
                  description: |
                    Default tolerations of the pods in the main namespace of the project. A literal list of tolerations or a
                    parameter reference `{fromParam: "<name>"}`.

                    They are set as the `scheduler.alpha.kubernetes.io/defaultTolerations` annotation of the main namespace. The additional namespaces of the project do not get them.
                  x-kubernetes-preserve-unknown-fields: true
                namespaceMetadata:
                  description: Extra labels and annotations for the project namespaces.
                  type: object
                  properties:
                    labels:
                      description: |
                        A literal label map or a parameter reference `{fromParam: "<name>"}`.

                        The labels are set on every namespace of the project, including the additional ones, and are listed in the `projects.deckhouse.io/template-labels` annotation of each.

                        Labels that the module manages (`heritage`, `app.kubernetes.io/managed-by`, `projects.deckhouse.io/*`, `multitenancy.deckhouse.io/*`, and the pod security, monitoring and scanning labels) and the `kubernetes.io/metadata.name` label cannot be set in this field. A template that sets one here is refused, and so is a Project whose parameters put one here. A template or Project that already has such a label can still be changed while it keeps the label as it is. The label is not applied, and the response warns about it.

                        GitOps tracking labels (`app.kubernetes.io/instance`, `argocd.argoproj.io/*`, `kustomize.toolkit.fluxcd.io/*`, `helm.toolkit.fluxcd.io/*`, `kapp.k14s.io/*`) are set on the main namespace only. A custom tracking key is inherited like any other label.

                        When a namespace becomes a project automatically, its own labels are not copied into the Project and do not reach this field. A label declared in `spec.parameters.namespace.labels` of the Project reaches it through the built-in templates and is inherited.
                      x-kubernetes-preserve-unknown-fields: true
                    annotations:
                      description: |
                        A literal annotation map or a parameter reference `{fromParam: "<name>"}`.

                        The annotations are set on the main namespace of the project only.
                      x-kubernetes-preserve-unknown-fields: true
                features:
                  description: Optional project capabilities.
                  type: object
                  properties:
                    monitoring:
                      description: |
                        Enable extended monitoring for the project. A literal boolean or a parameter
                        reference `{fromParam: "<name>"}`.
                      x-kubernetes-preserve-unknown-fields: true
                    vulnerabilityScanning:
                      description: |
                        Enable periodic vulnerability scans (Trivy) for the project. A literal boolean or
                        a parameter reference `{fromParam: "<name>"}`.
                      x-kubernetes-preserve-unknown-fields: true
                logShipping:
                  description: Forwarding of the project logs to a cluster log destination.
                  type: object
                  properties:
                    clusterDestinationRef:
                      description: |
                        Name of the ClusterLogDestination to ship logs to. A literal string or a parameter
                        reference `{fromParam: "<name>"}`.
                      x-kubernetes-preserve-unknown-fields: true
                allowedUIDs:
                  description: |
                    Range of user IDs allowed in the project containers. A literal `{min, max}` object or a
                    parameter reference `{fromParam: "<name>"}`.
                  x-kubernetes-preserve-unknown-fields: true
                allowedGIDs:
                  description: |
                    Range of group IDs allowed in the project containers. A literal `{min, max}` object or a
                    parameter reference `{fromParam: "<name>"}`.
                  x-kubernetes-preserve-unknown-fields: true
                runtimeAudit:
                  description: Runtime audit rules; effective only when allowedUIDs/allowedGIDs are set.
                  type: object
                  properties:
                    enabled:
                      description: |
                        A literal boolean or a parameter reference `{fromParam: "<name>"}`.
                      x-kubernetes-preserve-unknown-fields: true
                parametersSchema:
                  type: object
                  required: ["openAPIV3Schema"]
                  description: |
                    OpenAPI v3 schema of the [parameters](cr.html#project-v1alpha3-spec-parameters) of a project.

                    A boolean `requiredRequests` parameter declared here is read by name: when it is `true` for a project, the pods in every namespace of the project must have CPU and memory requests (an OperationPolicy in the `Deny` mode).
                  properties:
                    openAPIV3Schema:
                      type: object
                      additionalProperties:
                        x-kubernetes-preserve-unknown-fields: true
                      description: |
                        OpenAPI specification that the parameters of a project are validated against when the project is created or changed.
                manifests:
                  description: |
                    A template in the [`go template`](https://pkg.go.dev/text/template) format with the [`helm` functions](https://helm.sh/docs/chart_template_guide/function_list/) that renders objects into the namespaces of a project, next to the objects that the structured fields render.

                    The template gets the project name in `{{ .projectName }}`, the template name in `{{ .projectTemplateName }}` and the [project parameters](cr.html#project-v1alpha3-spec-parameters) completed with the defaults of `parametersSchema` in `{{ .parameters }}`, the same values as `resourcesTemplate`. A project whose parameters turn into objects or keys of the rendered manifests instead of values is refused, so quote every substitution.

                    The controller applies the objects with server-side apply as the `system:multitenancy-manager:project:<PROJECT_NAME>` user, and the `d8-manifests` ProjectRoleBinding of the project grants this user the `d8:project:admin` role. So an object gets only what this role allows in the namespaces of the project, not the rights of the controller. An AuthorizationRule of the `Admin` access level is refused when the manifests create it or raise an existing one to this level, although the role allows it. The administrators of a project are set in [`.spec.administrators`](cr.html#project-v1alpha3-spec-administrators) of the Project. The objects are applied once the binding is Ready, and the `ManifestsApplied` condition of the project says whether they are applied and names the objects that the API server refused with the code of each refusal, such as 403.

                    An object without `metadata.namespace` is created in the main namespace of the project, and a namespace that an object names has to be a namespace of the project. A cluster-scoped object, an object in a namespace outside the project and an object with the `heritage: multitenancy-manager` or `heritage: deckhouse` label are refused. The objects get the `projects.deckhouse.io/project` label with the project name and the `projects.deckhouse.io/source: manifests` label, and `.status.manifestObjects` of the project lists them. An object that the template does not render any more is deleted.

                    An object that a switch of the project from a Helm text left in place and listed in `.status.keptObjects` is taken over when `manifests` renders an object of the same kind, namespace and name. The object then has what `manifests` renders, and a field that the Helm text set and `manifests` leaves out is removed, the annotations of Helm included. Any other object that exists already and that `manifests` did not create is changed only when it has the two labels, and otherwise the `ManifestsApplied` condition names it.

                    Unlike the objects that the structured fields render, these objects can be changed and deleted by whoever may write them in the namespaces of the project, the project administrators included. The controller applies them again after a while, which puts back the fields that the template sets and an object that somebody deleted, while a field that somebody added stays. So describe what the project must not change with the structured fields. A project template can be read by users who have no access to its projects, the ones with the `User` access level included, so do not put secret values into `manifests`.

                    The field cannot be set together with `resourcesTemplate`. `deckhouse.io/v1alpha1` has no place for it, so a write of a template that has it through `deckhouse.io/v1alpha1` is refused. See [Describing other objects in manifests](usage.html#describing-other-objects-in-manifests).
                  type: string
                resourcesTemplate:
                  description: |
                    A template in the [`go template`](https://pkg.go.dev/text/template) format with the [`helm` functions](https://helm.sh/docs/chart_template_guide/function_list/) that renders the objects of a project.

                    The field is deprecated and is kept for the templates created through `deckhouse.io/v1alpha1`. Describe new templates with the structured fields and `manifests`. No template can get a new `resourcesTemplate` through either version: a create with a non-empty one and an update that sets one on a template that has none are refused, and a create through `deckhouse.io/v1alpha1` is refused as a whole. A template that has one keeps it, and it can be changed through either version while `deckhouse.io/v1alpha1` can describe the whole template. So a template with a Helm text cannot be created again, for example from a backup or from Git; move it to the structured fields and `manifests` first. The field leaves `deckhouse.io/v1alpha2` together with `deckhouse.io/v1alpha1` in a future release. See [Moving a template from a Helm text](usage.html#moving-a-template-from-a-helm-text).

                    When the field is not empty, the template is rendered from it. It cannot be set together with the fields that render objects into the project namespaces (`podSecurityStandard`, `networkPolicy`, `namespaceMetadata`, `manifests` and the others), while `resources` and `grantPolicies` apply in either case. A template that projects use keeps a non-empty `resourcesTemplate` until a change sets such fields or `manifests` in its place.

                    After such a change, as after a move of a project to a structured template, the AuthorizationRule and ResourceQuota objects of the Helm text that `.spec.administrators` and `.spec.quota` of the project replace are deleted once these fields work, and an AuthorizationRule that names nobody from `.spec.administrators` any more is deleted at once. Every other object of the Helm text that the new fields do not render under the same kind and name is left in place and listed in `.status.keptObjects` of the project, until `manifests` renders an object of the same kind, namespace and name and takes it over. See [Switching a project from a Helm text](usage.html#switching-a-project-from-a-helm-text).

                    The template gets the project name in `{{ .projectName }}`, the template name in `{{ .projectTemplateName }}` and the [project parameters](cr.html#project-v1alpha3-spec-parameters) completed with the defaults of `parametersSchema` in `{{ .parameters }}`. When `parametersSchema` declares the `administrators` and `resourceQuota` parameters, they hold the [administrators](cr.html#project-v1alpha3-spec-administrators) and the [quota](cr.html#project-v1alpha3-spec-quota) of the project, laid out as in a `deckhouse.io/v1alpha2` Project. A project whose parameters turn into objects or keys of the rendered manifests instead of values is refused, so quote every substitution.

                    An object without `metadata.namespace` or in a namespace outside the project is created in the main namespace of the project. The labels the template puts on the main namespace, except the ones the module manages and the GitOps tracking labels, are listed in its `projects.deckhouse.io/template-labels` annotation and are set on the additional namespaces too.
                  type: string
            status:
              type: object
              properties:
                message:
                  description: Message indicating the cause of the current status.
                  type: string
                ready:
                  description: Whether the template is ready to use. Indicates that the template has been successfully validated.
                  type: boolean
