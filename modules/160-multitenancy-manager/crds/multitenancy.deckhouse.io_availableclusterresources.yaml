          The resource is automatically created and updated by the `multitenancy-manager` controller in the project namespace for each registered GrantableClusterResourceDefinition.
          The AvailableClusterResource name matches the name of the corresponding GrantableClusterResourceDefinition. 

          Information about available cluster-wide resources and the default value is stored in the `status` field.

          For more information about viewing available cluster-wide resources, refer to [Usage examples](usage.html#for-project-users).

          > **Warning.** The resource is read-only. Manual creation of AvailableClusterResource is prohibited.
