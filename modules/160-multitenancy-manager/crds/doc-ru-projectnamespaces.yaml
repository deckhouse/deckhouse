spec:
  versions:
    - name: v1alpha3
      schema:
        openAPIV3Schema:
          description: |
            ProjectNamespace заказывает дополнительный неймспейс внутри проекта.

            Ресурс должен создаваться в основном неймспейсе проекта (неймспейс, имя которого
            совпадает с именем проекта). Контроллер создаёт неймспейс `<project>-<spec.name>`, проставляет
            ему метки принадлежности проекту и добавляет его в `Project.status.namespaces` с типом `Additional`.
            Удаление ProjectNamespace удаляет этот неймспейс.
          properties:
            spec:
              properties:
                name:
                  description: |
                    Суффикс итогового неймспейса.
                    
                    Создаётся неймспейс `<project>-<name>`, где
                    `<project>` — основной неймспейс, в котором создан этот объект.
                features:
                  description: |
                    Необязательное подмножество функций проекта для включения в неймспейс.
                    
                    Передаётся как
                    есть: ресурс Project в этом коде пока не моделирует функции, поэтому валидация «подмножество
                    функций проекта» — заглушка без эффекта до появления функций проекта.
            status:
              properties:
                namespace:
                  description: |
                    Неймспейс, который контроллер создал для этого ProjectNamespace.
