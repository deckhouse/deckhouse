spec:
  versions:
    - name: v1alpha3
      schema:
        openAPIV3Schema:
          description: |
            Описывает дополнительный неймспейс проекта.

            Ресурс должен создаваться в основном неймспейсе проекта (неймспейс, имя которого
            совпадает с именем проекта). Контроллер создаёт неймспейс `<project>-<spec.name>`, ставит на него
            лейблы принадлежности проекту и добавляет его в `Project.status.namespaces` с типом `Additional`.
            Удаление ProjectNamespace удаляет этот неймспейс.
          properties:
            spec:
              properties:
                name:
                  description: |
                    Суффикс итогового неймспейса.
                    
                    Создаётся неймспейс `<project>-<name>`, где
                    `<project>` — основной неймспейс, в котором создан этот объект.

                    Итоговое имя неймспейса `<project>-<name>` должно быть не длиннее 63 символов.
            status:
              properties:
                namespace:
                  description: |
                    Неймспейс, который контроллер создал для этого ProjectNamespace.
                observedGeneration:
                  description: Последнее поколение объекта, обработанное контроллером.
                conditions:
                  description: Текущее состояние объекта.
                  items:
                    properties:
                      type:
                        description: Тип условия.
                      status:
                        description: "Состояние условия: `True`, `False` или `Unknown`."
                      message:
                        description: Сообщение с подробностями о состоянии условия.
                      lastTransitionTime:
                        description: Время последнего изменения условия.
                      lastProbeTime:
                        description: Время последней проверки условия.
