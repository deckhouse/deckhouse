spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Регистрирует кластерный ресурс как управляемый грантами (механизм грантов на кластерные ресурсы модуля `multitenancy-manager`).

            **Кто создаёт:** разработчики модулей или платформа (поставляется по умолчанию из Helm-чарта модуля).
            **Ручное создание:** разрешено — для регистрации собственных кастомных кластерных ресурсов.
            **Назначение:** определяет, какой кластерный ресурс контролируется (object-backed, с реальным k8s-объектом, или value-backed, без него — значения полей), режим валидации (`enforcement`: `Managed` — вебхуки платформы, или `External` — собственный вебхук модуля), базовую доступность (`defaultAvailability`: `All` — доступен, пока политика не сузит; `None` — закрыт по умолчанию), жёстко исключаемые объекты (`excluded` — hard deny независимо от политик) и способ определения кластерного дефолта (`defaultFrom` — аннотация, помечающая дефолт-объект).

            Пути, где ресурс используется (валидация/дефолтинг полей), описываются отдельными ресурсами [`GrantableClusterResourceReference`](cr.html#grantableclusterresourcereference) — определение отделено от владельца ссылок.

            Подробности — в разделе [«Управление доступом к кластерным ресурсам»](usage_ru.html#управление-доступом-к-кластерным-ресурсам-гранты).
