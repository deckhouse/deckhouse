spec:
  versions:
    - name: v1alpha2
      schema:
        openAPIV3Schema:
          description: |
            Описывает проект — изолированное окружение для приложений.

            Проект состоит из основного неймспейса с именем проекта, дополнительных неймспейсов ([ProjectNamespace](#projectnamespace)), если они есть, а также настроек, политик и объектов, которые описывает его шаблон [ProjectTemplate](#projecttemplate). См. [Создание проекта](usage.html#создание-проекта).
          properties:
            spec:
              properties:
                description:
                  description: |
                    Произвольное описание назначения проекта. Укажите пустую строку, если описание не требуется.
                projectTemplateName:
                  description: |
                    Имя [ProjectTemplate](cr.html#projecttemplate), по которому создаётся проект.

                    Шаблон `simple` создаёт только неймспейс проекта.
                parameters:
                  description: |
                    Значения параметров, которые шаблон объявляет в [`parametersSchema`](cr.html#projecttemplate-v1alpha2-spec-parametersschema).

                    Структурированные поля шаблона получают их через `{fromParam: <NAME>}`. `manifests` и `resourcesTemplate` получают их в `{{ .parameters }}`, дополненными значениями по умолчанию из `parametersSchema`. Значения проверяются по `parametersSchema.openAPIV3Schema` шаблона при создании и изменении проекта.
            status:
              properties:
                namespaces:
                  description: Неймспейсы проекта.
                observedGeneration:
                  description: Последнее поколение проекта, обработанное контроллером.
                templateGeneration:
                  description: Поколение шаблона, по которому проект был отрендерен последним.
                resources:
                  description: Список отрендеренных и пропущенных ресурсов.
                  additionalProperties:
                    additionalProperties:
                      properties:
                        installed:
                          description: Указывает, что ресурсы успешно отрендерены.
                        names:
                          description: Список имён ресурсов.
                conditions:
                  description: |
                    Текущее состояние проекта.

                    Типы условий описаны в разделе [«Статус и диагностика проекта»](usage.html#статус-и-диагностика-проекта).
                  items:
                    properties:
                      type:
                        description: Тип условия.
                      status:
                        description: "Состояние условия: `True`, `False` или `Unknown`."
                      message:
                        description: Сообщение с подробностями о состоянии условия.
                      lastTransitionTime:
                        description: Время последнего изменения условия.
                      lastProbeTime:
                        description: Время последней проверки условия.
                keptObjects:
                  description: |
                    Объекты релиза проекта, отрендеренные из Helm-текста `resourcesTemplate`, которые остались на месте вместо удаления, когда проект перешёл на структурированные поля или когда `.spec.quota` перестало покрывать квоту, сохранённую на время передачи. Релиз ими больше не управляет, на них стоит лейбл `projects.deckhouse.io/kept-from-helm-template: "true"`, и пока он стоит, менять и удалять их может только тот, кто может сделать то же во всём кластере. Объект исчезает из списка, когда его удаляют, снимают с него этот лейбл или релиз снова его рендерит. Когда проект удаляют, объекты уровня кластера, на которых ещё стоит этот лейбл, удаляются вместе с ним.
                  items:
                    properties:
                      apiVersion:
                        description: Версия API объекта.
                      kind:
                        description: Тип объекта.
                      namespace:
                        description: Неймспейс объекта, пустой для объекта уровня кластера.
                      name:
                        description: Имя объекта.
                manifestObjects:
                  description: |
                    Объекты, которые контроллер применил из [`manifests`](cr.html#projecttemplate-v1alpha2-spec-manifests) шаблона проекта от имени пользователя `system:multitenancy-manager:project:<PROJECT_NAME>`. На них стоят лейбл `projects.deckhouse.io/project` с именем проекта и лейбл `projects.deckhouse.io/source: manifests`. Объект, который шаблон больше не создаёт, удаляется и исчезает из списка. Объект, с которого к этому времени сняли один из этих лейблов или неймспейс которого больше не принадлежит проекту, исчезает из списка и остаётся на месте.
                  items:
                    properties:
                      apiVersion:
                        description: Версия API объекта.
                      kind:
                        description: Тип объекта.
                      namespace:
                        description: Неймспейс объекта.
                      name:
                        description: Имя объекта.
                state:
                  description: "Состояние проекта: `Deployed` или `Error`. Подробности приведены в условиях и их сообщениях."
    - name: v1alpha3
      schema:
        openAPIV3Schema:
          description: |
            Описывает проект — изолированное окружение для приложений.

            Проект состоит из основного неймспейса с именем проекта, дополнительных неймспейсов ([ProjectNamespace](#projectnamespace)), если они есть, а также настроек, политик и объектов, которые описывает его шаблон [ProjectTemplate](#projecttemplate). См. [Создание проекта](usage.html#создание-проекта).
          properties:
            spec:
              properties:
                description:
                  description: |
                    Произвольное описание назначения проекта.
                    
                    Укажите пустую строку, если описание не требуется.
                projectTemplateName:
                  description: |
                    Имя [ProjectTemplate](cr.html#projecttemplate), по которому создаётся проект.

                    Шаблон `simple` создаёт только неймспейс проекта.
                administrators:
                  description: |
                    Пользователи и группы, получающие административный доступ к проекту.

                    Контроллер выдаёт им роль `d8:project:admin` через ProjectRoleBinding `d8-administrators`. Для `User` имя — это имя пользователя (`User.spec.email`), для `Group` — `Group.spec.name`.

                    Нельзя задавать вместе с `parameters.administrators`.
                  items:
                    properties:
                      kind:
                        description: Тип субъекта.
                      name:
                        description: Имя субъекта. Для `User` — имя пользователя (`User.spec.email`). Для `Group` — `Group.spec.name` (имя в токене), а не `metadata.name`. Имя не может содержать управляющие символы и переводы строк и не может начинаться с `system:multitenancy-manager:`, префикса пользователей, от имени которых действует контроллер. Обновление, которое оставляет такое имя прежним, принимается с предупреждением.
                quota:
                  description: |
                    Квота ресурсов проекта, которая применяется как ResourceQuota `d8-project-quota` в основном неймспейсе проекта.

                    Ключи и значения соответствуют формату `ResourceQuota.spec.hard`, например `requests.cpu: "100"`.
                    Для memory и storage нужна явная единица измерения (например `requests.memory: 2Gi`);
                    числа без единицы измерения интерпретируются как байты, поэтому вебхук отклоняет такое число, кроме 0.
                    Обновление, которое оставляет такое значение прежним, принимается с предупреждением, как и создание через `deckhouse.io/v1alpha2`, в котором такое значение приходит из `parameters.resourceQuota`.

                    Нельзя задавать вместе с `parameters.resourceQuota`.
                parameters:
                  description: |
                    Значения параметров, которые шаблон объявляет в [`parametersSchema`](cr.html#projecttemplate-v1alpha2-spec-parametersschema).

                    Структурированные поля шаблона получают их через `{fromParam: <NAME>}`. `manifests` и `resourcesTemplate` получают их в `{{ .parameters }}`, дополненными значениями по умолчанию из `parametersSchema`. Значения проверяются по `parametersSchema.openAPIV3Schema` шаблона при создании и изменении проекта.
            status:
              properties:
                namespaces:
                  description: Неймспейсы, принадлежащие проекту.
                  items:
                    properties:
                      name:
                        description: Имя неймспейса.
                      kind:
                        description: Тип неймспейса (Main или Additional).
                usage:
                  description: Текущее использование квоты проекта.
                observedGeneration:
                  description: Последнее поколение проекта, обработанное контроллером.
                templateGeneration:
                  description: Поколение шаблона, по которому проект был отрендерен последним.
                resources:
                  description: Список отрендеренных и пропущенных ресурсов.
                  additionalProperties:
                    additionalProperties:
                      properties:
                        installed:
                          description: Указывает, что ресурсы успешно отрендерены.
                        names:
                          description: Список имён ресурсов.
                conditions:
                  description: |
                    Текущее состояние проекта.

                    Типы условий описаны в разделе [«Статус и диагностика проекта»](usage.html#статус-и-диагностика-проекта).
                  items:
                    properties:
                      type:
                        description: Тип условия.
                      status:
                        description: "Состояние условия: `True`, `False` или `Unknown`."
                      message:
                        description: Сообщение с подробностями о состоянии условия.
                      lastTransitionTime:
                        description: Время последнего изменения условия.
                      lastProbeTime:
                        description: Время последней проверки условия.
                keptObjects:
                  description: |
                    Объекты релиза проекта, отрендеренные из Helm-текста `resourcesTemplate`, которые остались на месте вместо удаления, когда проект перешёл на структурированные поля или когда `.spec.quota` перестало покрывать квоту, сохранённую на время передачи. Релиз ими больше не управляет, на них стоит лейбл `projects.deckhouse.io/kept-from-helm-template: "true"`, и пока он стоит, менять и удалять их может только тот, кто может сделать то же во всём кластере. Объект исчезает из списка, когда его удаляют, снимают с него этот лейбл или релиз снова его рендерит. Когда проект удаляют, объекты уровня кластера, на которых ещё стоит этот лейбл, удаляются вместе с ним.
                  items:
                    properties:
                      apiVersion:
                        description: Версия API объекта.
                      kind:
                        description: Тип объекта.
                      namespace:
                        description: Неймспейс объекта, пустой для объекта уровня кластера.
                      name:
                        description: Имя объекта.
                manifestObjects:
                  description: |
                    Объекты, которые контроллер применил из [`manifests`](cr.html#projecttemplate-v1alpha2-spec-manifests) шаблона проекта от имени пользователя `system:multitenancy-manager:project:<PROJECT_NAME>`. На них стоят лейбл `projects.deckhouse.io/project` с именем проекта и лейбл `projects.deckhouse.io/source: manifests`. Объект, который шаблон больше не создаёт, удаляется и исчезает из списка. Объект, с которого к этому времени сняли один из этих лейблов или неймспейс которого больше не принадлежит проекту, исчезает из списка и остаётся на месте.
                  items:
                    properties:
                      apiVersion:
                        description: Версия API объекта.
                      kind:
                        description: Тип объекта.
                      namespace:
                        description: Неймспейс объекта.
                      name:
                        description: Имя объекта.
                state:
                  description: "Состояние проекта: `Deployed` или `Error`. Подробности приведены в условиях и их сообщениях."
