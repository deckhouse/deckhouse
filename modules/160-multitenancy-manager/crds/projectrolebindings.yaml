---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    heritage: deckhouse
    module: multitenancy-manager
    backup.deckhouse.io/cluster-config: "true"
  name: projectrolebindings.deckhouse.io
spec:
  group: deckhouse.io
  names:
    kind: ProjectRoleBinding
    listKind: ProjectRoleBindingList
    plural: projectrolebindings
    singular: projectrolebinding
    shortNames:
      - prb
  scope: Namespaced
  versions:
    - name: v1alpha3
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .spec.roleRef.name
          name: Role
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      schema:
        openAPIV3Schema:
          type: object
          description: |
            ProjectRoleBinding grants a role to subjects across all namespaces of a single project.

            It must be created in the project's main namespace (the namespace whose name equals the project name).
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - subjects
                - roleRef
              x-kubernetes-validations:
                - rule: "self.roleRef.kind == 'ClusterRole'"
                  message: "roleRef.kind must be ClusterRole."
              properties:
                subjects:
                  description: |
                    Subjects (users, groups or service accounts) the role is granted to.
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - kind
                      - name
                    properties:
                      kind:
                        description: Kind of the subject.
                        type: string
                        enum:
                          - User
                          - Group
                          - ServiceAccount
                      name:
                        description: |
                          Name of the subject: the user name (`User.spec.email`) for `User`, `Group.spec.name` for `Group`, the ServiceAccount name for `ServiceAccount`.
                        type: string
                        minLength: 1
                      namespace:
                        description: |
                          Namespace of the ServiceAccount.

                          If omitted, the binding names the ServiceAccount with this name in each namespace of the project.
                        type: string
                      apiGroup:
                        description: "API group of the subject: `rbac.authorization.k8s.io` for `User` and `Group`, empty for `ServiceAccount`."
                        type: string
                roleRef:
                  description: |
                    Reference to the granted ClusterRole. Allowed prefixes: `d8:project:*`, `d8:namespace:*`, `d8:project-capability:*`, `d8:namespace-capability:*`, `d8:custom:*`.
                  type: object
                  required:
                    - kind
                    - name
                  properties:
                    kind:
                      description: Kind of the granted role.
                      type: string
                      enum:
                        - ClusterRole
                    name:
                      description: Name of the granted ClusterRole.
                      type: string
                      minLength: 1
            status:
              type: object
              properties:
                observedGeneration:
                  description: Last generation of the object processed by the controller.
                  type: integer
                conditions:
                  description: Current state of the object.
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        description: Condition type.
                        type: string
                      status:
                        description: "Condition state: `True`, `False` or `Unknown`."
                        type: string
                      message:
                        description: Message with details of the condition state.
                        type: string
                      lastTransitionTime:
                        description: Time when the condition last changed.
                        format: date-time
                        type: string
                      lastProbeTime:
                        description: Time of the last check of the condition.
                        format: date-time
                        type: string
