spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Регистрирует места использования cluster-wide-ресурса в других ресурсах Kubernetes.

            GrantableClusterResourceReference определяет ресурсы Kubernetes и поля, содержащие ссылки на cluster-wide-ресурс, зарегистрированный с помощью GrantableClusterResourceDefinition. Для таких полей можно настроить проверку доступности указанного cluster-wide-ресурса и автоматическую подстановку значения по умолчанию.

            Один GrantableClusterResourceDefinition может быть связан с несколькими GrantableClusterResourceReference, если cluster-wide-ресурс используется в разных ресурсах или полях.

            GrantableClusterResourceReference создаётся разработчиком модуля при добавлении ссылки на зарегистрированный cluster-wide-ресурс.

            Подробнее о регистрации ссылок на cluster-wide-ресурсы — [в разделе «Примеры использования»](usage.html#для-разработчиков-модулей).
          properties:
            spec:
              description: Параметры GrantableClusterResourceReference.
              properties:
                fieldPaths:
                  description: |-
                    Список полей ресурсов Kubernetes, содержащих ссылки на cluster-wide-ресурс.

                    Для каждого поля можно ограничить применимость определёнными ресурсами, API-группами и версиями, задать условие проверки и настроить подстановку значения по умолчанию.

                    Требуется указать хотя бы один элемент. Значения `resources`, `apiGroups` и `apiVersions` элемента должны входить в соответствующие списки `spec.rule` (`*` в `spec.rule` допускает любое значение). Каждое сочетание API-группы, версии и ресурса, которому соответствует `spec.rule`, должно покрываться хотя бы одним элементом, иначе запросы для него не проверялись бы вовсе. Для этого либо задайте элементы для каждого такого сочетания, либо добавьте элемент без `resources`, `apiGroups` и `apiVersions`, который будет применяться в остальных случаях. Объект, нарушающий любое из этих правил, отклоняется.
                  items:
                    description: |-
                      Настройки поля, содержащего ссылку на cluster-wide-ресурс.

                      Если запросу соответствуют несколько элементов, применяется наиболее специфичный: `resources` имеет приоритет над `apiGroups`, а `apiGroups` — над `apiVersions`. Значение `*` в `resources`, `apiGroups` или `apiVersions` не ограничивает элемент и не делает его более специфичным. Если несколько элементов одинаково специфичны, применяется первый из них в списке. Элемент без ограничений используется в остальных случаях.
                    properties:
                      apiGroups:
                        description: |-
                          API-группы, для которых применяются настройки поля.

                          Если параметр не задан, настройки применяются ко всем API-группам, соответствующим `spec.rule`.
                      apiVersions:
                        description: |-
                          Версии API, для которых применяются настройки поля.

                          Если параметр не задан, настройки применяются ко всем версиям API, соответствующим `spec.rule`.
                      defaulting:
                        description: |-
                          Режим подстановки значения по умолчанию.

                          Допустимые значения:

                          - `None` — значение не подставляется, выполняется только проверка доступности указанного cluster-wide-ресурса;
                          - `FillEmpty` — значение по умолчанию подставляется при создании объекта, если поле не заполнено;
                          - `Coerce` — значение по умолчанию подставляется при создании объекта, если поле не заполнено или указанный cluster-wide-ресурс недоступен проекту.

                          Режимы `FillEmpty` и `Coerce` требуют, чтобы `path` указывал на одно поле, поэтому принимается только простой путь по именам полей, например `$.spec.storageClassName` или `$.metadata.annotations['cert-manager.io/cluster-issuer']`. Путь с подстановочным знаком, индексом массива или фильтром с этими режимами отклоняется и может использоваться только с `None`.
                      match:
                        description: |-
                          Условие применения настроек поля.

                          Если условие не выполняется, проверка доступности и подстановка значения для этого поля не выполняются.
                        properties:
                          equals:
                            description: Значение, которому должно соответствовать поле, указанное в `fieldPath`.
                          fieldPath:
                            description: |-
                              JSONPath к полю, значение которого проверяется условием.

                              Должен быть корректным JSONPath по RFC 9535; объект с путём, который не разбирается, отклоняется.
                          in:
                            description: Список допустимых значений поля, указанного в `fieldPath`.
                      path:
                        description: |-
                          JSONPath к строковому полю, содержащему имя cluster-wide-ресурса.

                          Путь может указывать в том числе на аннотацию, например `$.metadata.annotations['cert-manager.io/cluster-issuer']`.

                          Должен быть корректным JSONPath по RFC 9535; объект с путём, который не разбирается, отклоняется при любом значении `defaulting`. Имя поля, которое не является простым идентификатором (содержит `-`, `.` или `/` либо начинается с цифры), записывается в скобках, например `$.spec['foo-bar']`.

                          При проверке доступности JSONPath вычисляется полностью, включая подстановочные знаки, индексы массивов и фильтры. При подстановке значения по умолчанию — нет: с `defaulting: FillEmpty` или `defaulting: Coerce` принимается только простой путь по именам полей.
                      resources:
                        description: |-
                          Имена ресурсов Kubernetes во множественном числе, например `pods` или `cronjobs`, для которых применяются настройки поля.

                          Если параметр не задан, настройки применяются ко всем ресурсам, соответствующим `spec.rule`. Значение `*` действует так же, как отсутствие параметра: не ограничивает элемент и не делает его более специфичным.
                grantableClusterResourceName:
                  description: Имя ресурса GrantableClusterResourceDefinition, регистрирующего cluster-wide-ресурс, на который ссылаются поля.
                rule:
                  description: Правило выбора ресурсов Kubernetes, к которым применяется GrantableClusterResourceReference.
                  properties:
                    apiGroups:
                      description: |-
                        API-группы ресурсов Kubernetes. Core-группа задаётся пустой строкой.

                        `*` не принимается: admission webhook регистрируется только на перечисленные группы, и подстановочный знак молча не перехватывал бы ничего.
                    apiVersions:
                      description: |-
                        Версии API ресурсов Kubernetes.

                        Используйте `*`, чтобы выбрать все версии.
                    resources:
                      description: Имена ресурсов Kubernetes во множественном числе (например, `ingresses`).
            status:
              description: Состояние GrantableClusterResourceReference
              properties:
                bound:
                  description: Означает, что GrantableClusterResourceDefinition, указанный в `spec.grantableClusterResourceName`, существует.
                conditions:
                  description: |-
                    Текущее состояние GrantableClusterResourceReference.

                    - `Bound` — существует ли GrantableClusterResourceDefinition, указанный в `spec.grantableClusterResourceName` (причины `Resolved`, `UnknownResource`).
                    - `FieldPathsValid` — проходят ли `spec.fieldPaths` проверки, выполняемые при создании и изменении объекта: пути корректны, пути с подстановкой значения по умолчанию указывают на одно поле, ограничения элементов входят в `spec.rule`, и каждое сочетание, которому соответствует `spec.rule`, покрыто (причины `Valid`, `InvalidFieldPaths`; в сообщении перечислены все проблемы). `False` означает, что объект сохранён в обход этих проверок; некорректные пути при проверке доступности пропускаются.
                  items:
                    description: Информация об одном из аспектов текущего состояния ресурса.
                    properties:
                      lastTransitionTime:
                        description: |-
                          Время последнего изменения состояния условия.
                      message:
                        description: |-
                          Сообщение с дополнительной информацией о состоянии условия.
                      observedGeneration:
                        description: |-
                          Поколение ресурса, на основе которого сформировано состояние условия.
                      reason:
                        description: |-
                          Причина последнего изменения состояния условия.
                      status:
                        description: Состояние условия.
                      type:
                        description: Тип условия.
                observedGeneration:
                  description: Последнее поколение ресурса, обработанное контроллером.
