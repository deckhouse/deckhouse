# Golden fixture of webhooks/conversion/projecttemplates, function v1alpha1_to_v1alpha2.
# Each case is one ConversionReview: objects is request.objects as the apiserver sends it, converted is
# the response.convertedObjects the hook has to answer with, in the same order.

- name: bumps the version of a helm template and keeps everything else
  objects:
    - apiVersion: deckhouse.io/v1alpha1
      kind: ProjectTemplate
      metadata:
        name: custom
        resourceVersion: "2001"
        labels:
          team: platform
        annotations:
          example.com/owner: platform-team
      spec:
        description: A copy of the default template
        parametersSchema:
          openAPIV3Schema:
            type: object
            properties:
              size:
                type: string
        resourcesTemplate: |
          ---
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: all-pods
          spec:
            hard:
              requests.cpu: {{ .parameters.size | quote }}
      status:
        ready: true
        message: ""
  converted:
    - apiVersion: deckhouse.io/v1alpha2
      kind: ProjectTemplate
      metadata:
        name: custom
        resourceVersion: "2001"
        labels:
          team: platform
        annotations:
          example.com/owner: platform-team
      spec:
        description: A copy of the default template
        parametersSchema:
          openAPIV3Schema:
            type: object
            properties:
              size:
                type: string
        resourcesTemplate: |
          ---
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: all-pods
          spec:
            hard:
              requests.cpu: {{ .parameters.size | quote }}
      status:
        ready: true
        message: ""

- name: keeps a helm string byte for byte
  objects:
    - apiVersion: deckhouse.io/v1alpha1
      kind: ProjectTemplate
      metadata:
        name: spaced
      spec:
        parametersSchema:
          openAPIV3Schema: {}
        resourcesTemplate: "\n  # café — naïve ☃\n---\nkind: Namespace\n  \n"
  converted:
    - apiVersion: deckhouse.io/v1alpha2
      kind: ProjectTemplate
      metadata:
        name: spaced
      spec:
        parametersSchema:
          openAPIV3Schema: {}
        resourcesTemplate: "\n  # café — naïve ☃\n---\nkind: Namespace\n  \n"

- name: keeps an empty string
  objects:
    - apiVersion: deckhouse.io/v1alpha1
      kind: ProjectTemplate
      metadata:
        name: empty
        annotations:
          example.com/owner: platform-team
      spec:
        parametersSchema:
          openAPIV3Schema: {}
        resourcesTemplate: ""
  converted:
    - apiVersion: deckhouse.io/v1alpha2
      kind: ProjectTemplate
      metadata:
        name: empty
        annotations:
          example.com/owner: platform-team
      spec:
        parametersSchema:
          openAPIV3Schema: {}
        resourcesTemplate: ""

- name: does not conjure a missing resourcesTemplate
  objects:
    - apiVersion: deckhouse.io/v1alpha1
      kind: ProjectTemplate
      metadata:
        name: none
      spec:
        description: No resources
        parametersSchema:
          openAPIV3Schema: {}
  converted:
    - apiVersion: deckhouse.io/v1alpha2
      kind: ProjectTemplate
      metadata:
        name: none
      spec:
        description: No resources
        parametersSchema:
          openAPIV3Schema: {}

- name: does not conjure a missing spec
  objects:
    - apiVersion: deckhouse.io/v1alpha1
      kind: ProjectTemplate
      metadata:
        name: bare
  converted:
    - apiVersion: deckhouse.io/v1alpha2
      kind: ProjectTemplate
      metadata:
        name: bare

- name: leaves an object at another version alone
  objects:
    - apiVersion: deckhouse.io/v1alpha1
      kind: ProjectTemplate
      metadata:
        name: old
      spec:
        parametersSchema:
          openAPIV3Schema: {}
        resourcesTemplate: "kind: Namespace\n"
    - apiVersion: deckhouse.io/v1alpha2
      kind: ProjectTemplate
      metadata:
        name: current
      spec:
        parametersSchema:
          openAPIV3Schema: {}
        resourcesTemplate: "kind: Namespace\n"
  converted:
    - apiVersion: deckhouse.io/v1alpha2
      kind: ProjectTemplate
      metadata:
        name: old
      spec:
        parametersSchema:
          openAPIV3Schema: {}
        resourcesTemplate: "kind: Namespace\n"
    - apiVersion: deckhouse.io/v1alpha2
      kind: ProjectTemplate
      metadata:
        name: current
      spec:
        parametersSchema:
          openAPIV3Schema: {}
        resourcesTemplate: "kind: Namespace\n"
