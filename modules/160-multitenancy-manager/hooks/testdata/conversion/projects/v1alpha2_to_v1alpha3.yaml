# The templates of the previous release test each quota value with "with", which takes the number 0
# for no value, so it rendered no key and set no limit. In spec.quota it is a hard limit of 0, and one
# on requests.cpu refuses every pod, so a quota with the number 0 anywhere stays in the parameters.
- name: leaves a quota with the number 0 in the parameters
  objects:
    - apiVersion: deckhouse.io/v1alpha2
      kind: Project
      metadata:
        name: requests
      spec:
        projectTemplateName: default
        parameters:
          administrators:
            - subject: User
              name: alice@example.com
          resourceQuota:
            requests:
              cpu: 0
              memory: 5Gi
            limits:
              memory: 5Gi
    - apiVersion: deckhouse.io/v1alpha2
      kind: Project
      metadata:
        name: limits
      spec:
        projectTemplateName: default
        parameters:
          resourceQuota:
            requests:
              cpu: "1"
            limits:
              cpu: 0
    - apiVersion: deckhouse.io/v1alpha2
