  objects:
    - apiVersion: deckhouse.io/v1alpha2
      kind: Project
      metadata:
        name: string
      spec:
        projectTemplateName: custom
        parameters:
          resourceQuota: 10Gi
    - apiVersion: deckhouse.io/v1alpha2
      kind: Project
      metadata:
        name: list
      spec:
        projectTemplateName: custom
        parameters:
          resourceQuota:
            - requests:
                cpu: 1
    - apiVersion: deckhouse.io/v1alpha2
      kind: Project
      metadata:
        name: unset
      spec:
        projectTemplateName: custom
        parameters:
          resourceQuota: false
  converted:
    - apiVersion: deckhouse.io/v1alpha3
      kind: Project
      metadata:
        name: string
      spec:
        projectTemplateName: custom
        parameters:
          resourceQuota: 10Gi
    - apiVersion: deckhouse.io/v1alpha3
      kind: Project
      metadata:
        name: list
      spec:
        projectTemplateName: custom
        parameters:
          resourceQuota:
