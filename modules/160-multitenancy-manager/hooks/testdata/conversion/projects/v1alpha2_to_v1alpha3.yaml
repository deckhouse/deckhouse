# The schema refuses C0 and DEL only. Whatever else a name holds is for admission to judge, and the
# conversion has to give back whatever storage holds.
- name: lifts a name the v1alpha3 schema accepts
  objects:
    - apiVersion: deckhouse.io/v1alpha2
      kind: Project
      metadata:
        name: unicode
      spec:
        projectTemplateName: custom
        parameters:
          administrators:
            - subject: User
              name: "\u0430\u043B\u0438\u0441\u0430@\u043F\u0440\u0438\u043C\u0435\u0440.\u0440\u0444"
            - subject: Group
              name: "a\u00A0b\u0085c\u2028d"
  converted:
    - apiVersion: deckhouse.io/v1alpha3
      kind: Project
      metadata:
        name: unicode
      spec:
        projectTemplateName: custom
        administrators:
          - kind: User
            name: "\u0430\u043B\u0438\u0441\u0430@\u043F\u0440\u0438\u043C\u0435\u0440.\u0440\u0444"
          - kind: Group
            name: "a\u00A0b\u0085c\u2028d"
        parameters: {}

# The whole review used to fail on these.
