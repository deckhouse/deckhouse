# Golden fixture of webhooks/conversion/projects, function v1alpha3_to_v1alpha2, for projects as the
# controller writes them back. Each case is one ConversionReview. objects is request.objects as the
# apiserver sends it, converted is the response.convertedObjects the hook has to answer with, in the
# same order.
#
# A Helm resourcesTemplate of the v1alpha2 layout renders from the spec.parameters a v1alpha2 reader
# gets, and the controller computes them in Go (validate.V1alpha2Parameters) rather than through the
# conversion. Two tests hold the two to this file. conversion_projects_parameters_test.go runs the
# conversion over every case with every jq engine, and the validate tests of the controller run the
# Go copy over the spec of every object and compare it with the parameters the object converts to.
#
# Every spec is what storage holds once the controller has written the project back, so every quota
# value is spelled as its canonical string, and the controller test checks that. The file has a
# directory of its own, since every file of the projects directory is a conversion path of the hook.

- name: administrators and a quota
  objects:
    - apiVersion: deckhouse.io/v1alpha3
      kind: Project
      metadata:
        name: team
      spec:
        projectTemplateName: default
        administrators:
          - kind: User
            name: alice@example.com
          - kind: Group
            name: team
        quota:
          requests.cpu: "2"
          requests.memory: 4Gi
          requests.storage: 10Gi
          limits.cpu: "4"
          limits.memory: 8Gi
        parameters:
          networkPolicy: Isolated
  converted:
    - apiVersion: deckhouse.io/v1alpha2
      kind: Project
      metadata:
        name: team
      spec:
        projectTemplateName: default
        parameters:
          networkPolicy: Isolated
          administrators:
            - subject: User
              name: alice@example.com
            - subject: Group
              name: team
          resourceQuota:
            requests:
              cpu: "2"
              memory: 4Gi
              storage: 10Gi
            limits:
              cpu: "4"
              memory: 8Gi

- name: a fraction in its canonical form
