{{- if and (include "helm_lib_kind_exists" (list . "ValidatingAdmissionPolicy")) (include "helm_lib_kind_exists" (list . "ValidatingAdmissionPolicyBinding")) }}
{{- $policyName := "d8-multitenancy-manager" }}
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $policyName }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "multitenancy-manager") ) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   ["*"]
        apiVersions: ["*"]
        # CREATE is here for the same reason as the other two. The binding matches objects that carry
        # this module's heritage label, and until now anybody could create one: the label is what the
        # module and this policy use to tell a project's own objects apart, so a hand-made object
        # wearing it was accepted as one of them and then protected from everyone by the rules below.
        operations:  ["CREATE", "UPDATE", "DELETE"]
        resources:   ["*"]
        scope: "*"
  matchConditions:
    # Only cluster components are excluded, and deliberately so: a template-owned object belongs to
    # the project controller alone. Cluster administrators are exempt from the other protections
    # around project namespaces (see the user-authz system-resource webhook) but not from this one —
    # to change such an object, change the ProjectTemplate or the Project.
    - name: 'exclude-groups'
      expression: '!(["system:nodes", "system:serviceaccounts:kube-system", "system:serviceaccounts:d8-system"].exists(e, (e in request.userInfo.groups)))'
    - name: 'exclude-users'
      expression: '!(["system:sudouser", "system:apiserver", "system:kube-controller-manager", "system:kube-scheduler", "system:volume-scheduler", "dhctl", "observability"].exists(e, (e == request.userInfo.username)))'
    - name: 'exclude-restartedAt'
      # This condition exempts a rollout restart, which needs two objects to compare; on CREATE
      # there is only one. Said outright rather than left to the has() chain below, which reaches
      # the same answer only because a presence test on a null oldObject is false rather than an
      # error.
      expression: 'oldObject == null || !((has(object.spec) && has(object.spec.template) && has(object.spec.template.metadata)
          && has(oldObject.spec) && has(oldObject.spec.template) && has(oldObject.spec.template.metadata))
          && ((!has(oldObject.spec.template.metadata.annotations) && has(object.spec.template.metadata.annotations)
          && "kubectl.kubernetes.io/restartedAt" in object.spec.template.metadata.annotations)
          || (has(oldObject.spec.template.metadata.annotations) && has(object.spec.template.metadata.annotations)
          && !("kubectl.kubernetes.io/restartedAt" in oldObject.spec.template.metadata.annotations)
          && "kubectl.kubernetes.io/restartedAt" in object.spec.template.metadata.annotations)
          || (has(oldObject.spec.template.metadata.annotations) && has(object.spec.template.metadata.annotations)
          && "kubectl.kubernetes.io/restartedAt" in oldObject.spec.template.metadata.annotations
          && "kubectl.kubernetes.io/restartedAt" in object.spec.template.metadata.annotations
          && oldObject.spec.template.metadata.annotations["kubectl.kubernetes.io/restartedAt"]
          != object.spec.template.metadata.annotations["kubectl.kubernetes.io/restartedAt"])))'
  variables:
    # DELETE carries no object, so the one to name in the message is whichever of the two is there.
    # A messageExpression that fails is not an error the apiserver reports: it falls back to the
    # static message, and a denied delete would lose the name of the project it belongs to.
    - name: subject
      expression: 'object == null ? oldObject : object'
    # The labels and annotations of a project namespace that the module owns: the controller or its
    # Helm release sets them from the Project and its template, so a direct edit would be undone or
    # would lie about the project. Everything else on the namespace -- istio-injection, a Pod
    # Security label, an Argo CD tracking annotation, kubectl's last-applied-configuration -- belongs
    # to whoever runs the cluster, and the rule below lets them change it. Spelled out as literals
    # rather than derived from the label map: iterating an unbounded map does not fit the CEL cost
    # budget, and a fixed list is what a reader of the denial needs anyway. The Go side of the list is
    # naming.ManagedNamespaceLabels/ManagedNamespaceAnnotations; a test keeps the two identical.
    - name: managedLabels
      expression: '["heritage", "app.kubernetes.io/managed-by", "kubernetes.io/metadata.name", "projects.deckhouse.io/project", "projects.deckhouse.io/project-template", "projects.deckhouse.io/project-namespace", "projects.deckhouse.io/namespace-role", "multitenancy.deckhouse.io/project-managed-by-namespace", "security.deckhouse.io/pod-policy", "extended-monitoring.deckhouse.io/enabled", "security-scanning.deckhouse.io/enabled"]'
    - name: managedAnnotations
      expression: '["meta.helm.sh/release-name", "meta.helm.sh/release-namespace", "scheduler.alpha.kubernetes.io/node-selector", "scheduler.alpha.kubernetes.io/defaultTolerations", "projects.deckhouse.io/template-labels"]'
    - name: isNamespaceUpdate
      expression: 'object != null && oldObject != null && request.kind.kind == "Namespace" && request.operation == "UPDATE"'
    - name: oldLabels
      expression: 'oldObject != null && has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}'
    - name: newLabels
      expression: 'object != null && has(object.metadata.labels) ? object.metadata.labels : {}'
    - name: oldAnnotations
      expression: 'oldObject != null && has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}'
    - name: newAnnotations
      expression: 'object != null && has(object.metadata.annotations) ? object.metadata.annotations : {}'
    # A managed key is untouched when it is present on both sides with the same value or absent on both.
    - name: managedLabelsUntouched
      expression: 'variables.managedLabels.all(k, (k in variables.oldLabels) == (k in variables.newLabels) && (!(k in variables.oldLabels) || variables.oldLabels[k] == variables.newLabels[k]))'
    - name: managedAnnotationsUntouched
      expression: 'variables.managedAnnotations.all(k, (k in variables.oldAnnotations) == (k in variables.newAnnotations) && (!(k in variables.oldAnnotations) || variables.oldAnnotations[k] == variables.newAnnotations[k]))'
    # The namespace itself (spec.finalizers) and its finalizers stay the controller's: a user may
    # relabel a project namespace, not reshape it.
    - name: namespaceBodyUntouched
      expression: '(has(object.spec) ? object.spec : {}) == (has(oldObject.spec) ? oldObject.spec : {}) && (has(object.metadata.finalizers) ? object.metadata.finalizers : []) == (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : [])'
    - name: namespaceMetadataEdit
      expression: 'variables.isNamespaceUpdate && variables.namespaceBodyUntouched && variables.managedLabelsUntouched && variables.managedAnnotationsUntouched'
  validations:
    # Two doors: the controller, and -- on a project namespace only -- a metadata edit that leaves the
    # keys the module owns alone. Adoption turns every user namespace into a project namespace, so
    # without the second door `kubectl label ns` and every GitOps re-apply of a Namespace manifest
    # would be refused to cluster administrators for the life of the cluster.
    # An update that drops the heritage label itself is not seen here at all (the binding selects a
    # Namespace by the labels of the NEW object); the namespace-ownership policy below refuses it.
    - expression: 'request.userInfo.username == "system:serviceaccount:d8-multitenancy-manager:multitenancy-manager" || variables.namespaceMetadataEdit'
      reason: Forbidden
      message: 'This resource is managed by the multitenancy-manager module. Manual modification is forbidden.'
      # A cluster-scoped object has no namespace to name, and now that CREATE is matched it reaches
      # this expression as well.
      messageExpression: 'variables.subject.kind == ''Namespace'' ? (variables.isNamespaceUpdate
            ? ''The namespace belongs to the '' + variables.subject.metadata.name + '' Project: its spec, finalizers and the labels and annotations the module sets (heritage, projects.deckhouse.io/*, security.deckhouse.io/pod-policy, extended-monitoring.deckhouse.io/enabled, security-scanning.deckhouse.io/enabled, app.kubernetes.io/managed-by, meta.helm.sh/*, scheduler.alpha.kubernetes.io/node-selector, scheduler.alpha.kubernetes.io/defaultTolerations) are changed through the Project and its ProjectTemplate. Other labels and annotations may be changed directly.''
            : ''This resource is managed by '' + variables.subject.metadata.name + '' Project. Manual modification is forbidden.'')
            : (has(variables.subject.metadata.namespace) && variables.subject.metadata.namespace != ''''
            ? ''This resource is managed by '' + variables.subject.metadata.namespace + '' Project. Manual modification is forbidden.''
            : ''This resource is managed by the multitenancy-manager module. Manual modification is forbidden.'')'
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicyBinding") }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $policyName }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "multitenancy-manager") ) | nindent 2 }}
spec:
  policyName: {{ $policyName }}
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        heritage: multitenancy-manager
    objectSelector:
      matchLabels:
        heritage: multitenancy-manager
---
# The objects a switch of a project from a Helm text leaves in place (status.keptObjects) lose the
# heritage label, so the policy above no longer holds them, and the project no longer manages them.
# They may still be what keeps the project in bounds, such as a NetworkPolicy, a LimitRange or a
# quota the text rendered, so the users of the project must not be the ones to change them. While an
# object carries the kept-from-helm-template label, only a requester who may make the same change to
# its kind across the cluster may change or delete it. A cluster administrator may, a holder of a role
# in the project namespaces may not. Removing the label is such a change too, and it hands the object
# over to the project. CREATE is matched so that nobody else puts the label on an object either.
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $policyName }}-kept-objects
  {{- include "helm_lib_module_labels" (list . (dict "app" "multitenancy-manager") ) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   ["*"]
        apiVersions: ["*"]
        operations:  ["CREATE", "UPDATE", "DELETE"]
        resources:   ["*"]
        scope: "*"
  # The cluster components of the policy above, and the controller, which leaves the objects, takes
  # them back and deletes the cluster-scoped ones with the project.
  matchConditions:
    - name: 'exclude-groups'
      expression: '!(["system:nodes", "system:serviceaccounts:kube-system", "system:serviceaccounts:d8-system"].exists(e, (e in request.userInfo.groups)))'
    - name: 'exclude-users'
      expression: '!(["system:serviceaccount:d8-multitenancy-manager:multitenancy-manager", "system:sudouser", "system:apiserver", "system:kube-controller-manager", "system:kube-scheduler", "system:volume-scheduler", "dhctl", "observability"].exists(e, (e == request.userInfo.username)))'
    # The manifests of a template take a left object over as the user of the project, which has rights
    # in the project namespaces only. They hand the fields of the release over and apply the object
    # while it still carries the label, and the controller takes the label off after that. The prefix is
    # that of every user the controller acts as, which only the controller may bind, as the
    # reserved-users policy below holds.
    - name: 'exclude-manifests-users'
      expression: '!request.userInfo.username.startsWith("system:multitenancy-manager:")'
  variables:
    # A patch reaches admission as UPDATE, and the API server authorizes it as patch. A requester
    # allowed to patch but not to update across the cluster is refused here, on the strict side.
    - name: verb
      expression: 'request.operation == "CREATE" ? "create" : (request.operation == "DELETE" ? "delete" : "update")'
  validations:
    # Without a namespace the check asks about every namespace, which a RoleBinding does not grant.
    - expression: 'authorizer.group(request.resource.group).resource(request.resource.resource).check(variables.verb).allowed()'
      reason: Forbidden
      messageExpression: '''This object was left in place when its project moved off a Helm text. Only a requester who may '' + variables.verb + '' '' + request.resource.resource + '' across the cluster may change it, and a cluster administrator hands it over to the project by removing the projects.deckhouse.io/kept-from-helm-template label.'''
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicyBinding") }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $policyName }}-kept-objects
  {{- include "helm_lib_module_labels" (list . (dict "app" "multitenancy-manager") ) | nindent 2 }}
spec:
  policyName: {{ $policyName }}-kept-objects
  validationActions: [Deny, Audit]
  matchResources:
    objectSelector:
      matchLabels:
        projects.deckhouse.io/kept-from-helm-template: "true"
---
# The projects.deckhouse.io/project label on a Namespace is the ownership mark the controller reads
# to decide whose namespace it is. Only the controller (and Deckhouse itself, which installs the
# module) may put it there or change it: a namespace created by hand with the label of a project
# was neither adopted nor reconciled nor protected -- it merely looked owned -- and a label change
# could hand a namespace to another project. Nobody else is exempt, cluster administrators
# included; a namespace without the label is not this policy's business, so `kubectl create ns`
# keeps working and adoption picks the namespace up.
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $policyName }}-namespace-ownership
  {{- include "helm_lib_module_labels" (list . (dict "app" "multitenancy-manager") ) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["namespaces"]
  matchConditions:
    - name: 'exclude-owners'
      expression: '!(request.userInfo.username in ["system:serviceaccount:d8-multitenancy-manager:multitenancy-manager", "system:serviceaccount:d8-system:deckhouse"])'
  variables:
    - name: newOwner
      expression: 'has(object.metadata.labels) && "projects.deckhouse.io/project" in object.metadata.labels ? object.metadata.labels["projects.deckhouse.io/project"] : ""'
    - name: oldOwner
      expression: 'oldObject != null && has(oldObject.metadata.labels) && "projects.deckhouse.io/project" in oldObject.metadata.labels ? oldObject.metadata.labels["projects.deckhouse.io/project"] : ""'
    # The heritage policy above cannot guard the module-owned keys of a Namespace on its own: its
    # binding selects the namespace by the heritage label, and for a Namespace object the API server
    # evaluates that selector against the labels of the object under review -- the NEW object. An
    # update that drops the heritage label therefore falls outside the binding and is never seen by
    # that policy. This policy has no selector, so it is the one that holds the module-owned keys of
    # a namespace the module owned before the request. Same lists as above; the Go side is
    # naming.ManagedNamespaceLabels/ManagedNamespaceAnnotations and a test keeps every copy identical.
    - name: managedLabels
      expression: '["heritage", "app.kubernetes.io/managed-by", "kubernetes.io/metadata.name", "projects.deckhouse.io/project", "projects.deckhouse.io/project-template", "projects.deckhouse.io/project-namespace", "projects.deckhouse.io/namespace-role", "multitenancy.deckhouse.io/project-managed-by-namespace", "security.deckhouse.io/pod-policy", "extended-monitoring.deckhouse.io/enabled", "security-scanning.deckhouse.io/enabled"]'
    - name: managedAnnotations
      expression: '["meta.helm.sh/release-name", "meta.helm.sh/release-namespace", "scheduler.alpha.kubernetes.io/node-selector", "scheduler.alpha.kubernetes.io/defaultTolerations", "projects.deckhouse.io/template-labels"]'
    - name: oldLabels
      expression: 'oldObject != null && has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}'
    - name: newLabels
      expression: 'has(object.metadata.labels) ? object.metadata.labels : {}'
    - name: oldAnnotations
      expression: 'oldObject != null && has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}'
    - name: newAnnotations
      expression: 'has(object.metadata.annotations) ? object.metadata.annotations : {}'
    - name: wasModuleOwned
      expression: 'oldObject != null && "heritage" in variables.oldLabels && variables.oldLabels["heritage"] == "multitenancy-manager"'
    - name: managedKeysUntouched
      expression: 'variables.managedLabels.all(k, (k in variables.oldLabels) == (k in variables.newLabels) && (!(k in variables.oldLabels) || variables.oldLabels[k] == variables.newLabels[k])) && variables.managedAnnotations.all(k, (k in variables.oldAnnotations) == (k in variables.newAnnotations) && (!(k in variables.oldAnnotations) || variables.oldAnnotations[k] == variables.newAnnotations[k]))'
  validations:
    # Setting the label where there was none, or changing its value, is the controller's alone.
    # Removing it from a namespace the module does not own is not refused: an orphan namespace that
    # never got a project heals that way.
    - expression: 'variables.newOwner == "" || variables.newOwner == variables.oldOwner'
      reason: Forbidden
      messageExpression: '''The projects.deckhouse.io/project label is set by the multitenancy-manager controller when it creates or adopts a namespace; it cannot be set to "'' + variables.newOwner + ''" by hand. Create a Project, or a ProjectNamespace inside one, instead.'''
    # On a namespace the module owned before this request, the keys the module sets stay as they are.
    - expression: '!variables.wasModuleOwned || variables.managedKeysUntouched'
      reason: Forbidden
      messageExpression: '''The namespace belongs to the '' + variables.oldOwner + '' Project: the labels and annotations the module sets (heritage, projects.deckhouse.io/*, security.deckhouse.io/pod-policy, extended-monitoring.deckhouse.io/enabled, security-scanning.deckhouse.io/enabled, app.kubernetes.io/managed-by, meta.helm.sh/*, scheduler.alpha.kubernetes.io/node-selector, scheduler.alpha.kubernetes.io/defaultTolerations) are changed through the Project and its ProjectTemplate. Other labels and annotations may be changed directly.'''
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicyBinding") }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $policyName }}-namespace-ownership
  {{- include "helm_lib_module_labels" (list . (dict "app" "multitenancy-manager") ) | nindent 2 }}
spec:
  policyName: {{ $policyName }}-namespace-ownership
  validationActions: [Deny, Audit]
---
# The controller applies spec.manifests of a ProjectTemplate as a user of each project,
# system:multitenancy-manager:project:<project>, with the rights the d8-manifests ProjectRoleBinding
# of the project grants that user and nothing else. A binding that anybody else makes for such a user
# would hand the objects of a template the rights of that binding, wherever it is, so the users under
# the prefix are bound by the controller alone. The Go side of the prefix is
# naming.ReservedUserPrefix, and a test keeps the two the same.
#
# The policy looks at the subjects of the object a request writes, so an update that takes such a
# subject out of a binding passes, and a delete is not matched at all. The garbage collector updates a
# fanned-out binding whose owner goes without adding a subject, and is left alone: it runs as its own
# service account, or as kube-controller-manager on a cluster without use-service-account-credentials.
# Every other service account of kube-system is checked. system:sudouser is left alone too, as in the
# other policies of the module, so that an administrator can still get past it deliberately, which the
# audit log shows.
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $policyName }}-reserved-users
  {{- include "helm_lib_module_labels" (list . (dict "app" "multitenancy-manager") ) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   ["rbac.authorization.k8s.io"]
        apiVersions: ["*"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["rolebindings", "clusterrolebindings"]
      - apiGroups:   ["deckhouse.io"]
        apiVersions: ["*"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["projectrolebindings", "clusterprojectrolebindings", "authorizationrules", "clusterauthorizationrules"]
  matchConditions:
    - name: 'exclude-the-controller'
      expression: 'request.userInfo.username != "system:serviceaccount:d8-multitenancy-manager:multitenancy-manager"'
    - name: 'exclude-the-garbage-collector'
      expression: '!(request.userInfo.username in ["system:serviceaccount:kube-system:generic-garbage-collector", "system:kube-controller-manager"])'
    - name: 'exclude-sudouser'
      expression: 'request.userInfo.username != "system:sudouser"'
  variables:
    # RBAC bindings carry their subjects at the top, the bindings and rules of Deckhouse in spec.
    - name: subjects
      expression: 'request.kind.group == "rbac.authorization.k8s.io" ? (has(object.subjects) ? object.subjects : []) : (has(object.spec) && has(object.spec.subjects) ? object.spec.subjects : [])'
    - name: reservedPrefix
      expression: '"system:multitenancy-manager:"'
    - name: reserved
      expression: 'variables.subjects.filter(s, has(s.name) && s.name.startsWith(variables.reservedPrefix)).map(s, s.name)'
  validations:
    - expression: 'size(variables.reserved) == 0'
      reason: Forbidden
      message: 'Only the multitenancy-manager controller binds the users whose names start with system:multitenancy-manager:, the users it acts as.'
      messageExpression: '''The '' + variables.reserved[0] + '' subject is a user that the multitenancy-manager controller acts as, and only the controller binds the users whose names start with '' + variables.reservedPrefix'
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicyBinding") }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $policyName }}-reserved-users
  {{- include "helm_lib_module_labels" (list . (dict "app" "multitenancy-manager") ) | nindent 2 }}
spec:
  policyName: {{ $policyName }}-reserved-users
  validationActions: [Deny, Audit]
{{- end }}
