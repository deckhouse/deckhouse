apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: multitenancy-manager
    rbac.deckhouse.io/aggregate-to-iam-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.multitenancy-manager.manage_quotas"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-multitenancy-manager
  name: d8:system-capability:multitenancy-manager:manage_quotas
  annotations:
    en.meta.deckhouse.io/title: "Module multitenancy-manager: manage project quotas"
    ru.meta.deckhouse.io/title: "Модуль multitenancy-manager: управление квотами проектов"
    en.meta.deckhouse.io/description: "Set the quotas of projects: spec.quota of a Project."
    ru.meta.deckhouse.io/description: "Задание квот проектов: поле spec.quota у Project."
rules:
# A quota is set apart from the right to create and change projects, so that whoever creates projects
# for themselves does not choose their own quota. The Project webhook asks for the update verb on the
# quota subresource of the project, projects/quota, when a write changes spec.quota. The API server serves
# no such subresource: the right is only asked about. The ProjectQuotaStatus the controller makes from
# spec.quota is the controller's alone and is not granted here.
- apiGroups:
  - deckhouse.io
  resources:
  - projects/quota
  verbs:
  - update
