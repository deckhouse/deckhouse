apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: multitenancy-manager
    rbac.deckhouse.io/aggregate-to-deckhouse-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-multitenancy-manager
  name: d8:manage:permission:module:multitenancy-manager:edit
rules:
# ProjectTemplate is deliberately free-form: spec.resourcesTemplate is an arbitrary Helm template, and
# the release it renders into is applied by the module's ServiceAccount, which is bound to cluster-admin.
# Authoring one is therefore equivalent to holding cluster-admin, and is not granted here — it stays with
# the legacy ClusterAdmin access level and kubeadm:cluster-admins, both of which can already write RBAC.
# Reading templates stays in the view role, and creating a Project on an existing template stays here.
- apiGroups:
  - deckhouse.io
  resources:
  - projects
  verbs:
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - deckhouse.io
  resourceNames:
  - multitenancy-manager
  resources:
  - moduleconfigs
  verbs:
  - create
  - update
  - patch
  - delete
# Cluster operators author the per-project availability policies. The registrations and reference paths
# (grantableclusterresource{definitions,references}) are shipped by the module and are not creatable —
# read-only via the view role. The catalog (availableclusterresources) is controller-rendered too.
- apiGroups:
  - multitenancy.deckhouse.io
  resources:
  - clusterresourcegrantpolicies
  verbs:
  - create
  - update
  - patch
  - delete
  - deletecollection
