apiVersion: v1
kind: Secret
metadata:
  name: admission-webhook-certs
  namespace: d8-multitenancy-manager
  {{- include "helm_lib_module_labels" (list . (dict "app" "multitenancy-manager")) | nindent 2 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.multitenancyManager.internal.admissionWebhookCert.crt | default "" | b64enc | quote }}
  tls.key: {{ .Values.multitenancyManager.internal.admissionWebhookCert.key | default "" | b64enc | quote }}
  ca.crt: {{ .Values.multitenancyManager.internal.admissionWebhookCert.ca  | default "" | b64enc | quote }}
