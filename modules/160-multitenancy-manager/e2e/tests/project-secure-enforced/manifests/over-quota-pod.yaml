apiVersion: v1
kind: Pod
metadata:
  name: e2e-mtm-over-quota
  namespace: e2e-mtm-sec
spec:
  tolerations:
    - operator: Exists
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: greedy
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["pause"]
      resources:
        requests:
          cpu: "3"
          memory: 64Mi
        limits:
          cpu: "3"
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
