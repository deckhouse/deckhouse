apiVersion: v1
kind: Pod
metadata:
  name: e2e-mtm-privileged
  namespace: e2e-mtm-sec
spec:
  tolerations:
    - operator: Exists
  containers:
    - name: privileged
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["pause"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        privileged: true
