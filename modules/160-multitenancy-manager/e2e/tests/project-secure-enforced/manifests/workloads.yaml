apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: e2e-mtm-sec
  labels:
    app: e2e-mtm-server
spec:
  tolerations:
    - operator: Exists
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: netexec
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["netexec", "--http-port=8080", "--udp-port=-1"]
      ports:
        - containerPort: 8080
      # A TCP probe: the /healthz endpoint of netexec answered 412 on the e2e cluster and kept the
      # server from becoming Ready.
      readinessProbe:
        tcpSocket:
          port: 8080
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: e2e-mtm-sec
spec:
  tolerations:
    - operator: Exists
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["pause"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
