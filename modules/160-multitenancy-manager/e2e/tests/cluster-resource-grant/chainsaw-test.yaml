apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cluster-resource-grant
spec:
  description: >-
    A ClusterResourceGrantPolicy narrows the StorageClasses and LoadBalancer classes a project may
    use: the AvailableClusterResource catalog of the project lists only the granted names with the
    catalog fields, a PersistentVolumeClaim with a class that is not granted is coerced to the
    project default with a warning, a Service with a class that is not granted is refused, and a
    Service without a class gets the project default. A volume claim template of a StatefulSet and an
    ephemeral volume of a Deployment are refused with a class that is not granted, admitted with a
    granted class and with an empty one, and without a class are refused while the cluster default
    StorageClass is not available to the project and admitted while it is or while the cluster has
    none. Removing a GrantableClusterResourceDefinition removes its AvailableClusterResource from the
    project.
  concurrent: false
  catch:
    - description: Show the policy, the catalog and the registrations on failure
      script:
        content: |
          kubectl get clusterresourcegrantpolicy e2e-mtm-grant -o yaml || true
          kubectl -n e2e-mtm-grant get availableclusterresources -o yaml || true
          kubectl get grantableclusterresourcedefinitions || true
    - description: Show the multitenancy-manager controller logs on failure
      podLogs:
        namespace: d8-multitenancy-manager
        selector: app=multitenancy-manager
        container: multitenancy-manager
        tail: 200
  steps:
    - name: prerequisites
      description: Make sure the multitenancy-manager and user-authz modules are enabled and converged
      try:
        - description: Ensure the multitenancy-manager module is Ready
          script:
            timeout: 20m
            content: bash ../common/scripts/ensure-module.sh multitenancy-manager
        - description: Ensure the user-authz module is Ready (it aggregates the d8:project:admin role)
          script:
            timeout: 20m
            content: bash ../common/scripts/ensure-module.sh user-authz
        - description: Assert the module registers StorageClasses and LoadBalancer classes
          assert:
            resource:
              apiVersion: multitenancy.deckhouse.io/v1alpha1
              kind: GrantableClusterResourceReference
              metadata:
                name: storageclasses-pvc
              status:
                bound: true
        - description: Assert the module registers StorageClasses in volume claim templates
          assert:
            resource:
              apiVersion: multitenancy.deckhouse.io/v1alpha1
              kind: GrantableClusterResourceReference
              metadata:
                name: storageclasses-statefulset-claims
              status:
                bound: true
        - description: Assert the module registers StorageClasses in ephemeral volumes of workloads
          assert:
            resource:
              apiVersion: multitenancy.deckhouse.io/v1alpha1
              kind: GrantableClusterResourceReference
              metadata:
                name: storageclasses-apps-ephemeral
              status:
                bound: true

    - name: grant
      description: Create the StorageClasses, the project and the policy that grants one class of each kind
      try:
        - description: Create the e2e-mtm-sc-allowed and e2e-mtm-sc-denied StorageClasses
          create:
            file: manifests/storageclasses.yaml
        - description: Create the e2e-mtm-grant project
          create:
            file: manifests/project.yaml
        - description: Assert the project is Deployed
          assert:
            resource:
              apiVersion: deckhouse.io/v1alpha3
              kind: Project
              metadata:
                name: e2e-mtm-grant
              status:
                state: Deployed
        - description: Create the e2e-mtm-grant ClusterResourceGrantPolicy
          create:
            file: manifests/policy.yaml
        - description: Assert the catalog of the project lists only the granted names, the defaults and the StorageClass fields
          assert:
            timeout: 4m
            file: asserts/catalog.yaml
        - description: Wait until RBAC lets the project administrator create PVCs, Services, StatefulSets and Deployments, so the results below come from the grant webhooks
          script:
            timeout: 3m
            content: |
              for attempt in $(seq 1 30); do
                pvc="$(kubectl auth can-i create persistentvolumeclaims -n e2e-mtm-grant --as e2e-mtm-grant-admin@example.com 2>/dev/null || true)"
                svc="$(kubectl auth can-i create services -n e2e-mtm-grant --as e2e-mtm-grant-admin@example.com 2>/dev/null || true)"
                sts="$(kubectl auth can-i create statefulsets.apps -n e2e-mtm-grant --as e2e-mtm-grant-admin@example.com 2>/dev/null || true)"
                deploy="$(kubectl auth can-i create deployments.apps -n e2e-mtm-grant --as e2e-mtm-grant-admin@example.com 2>/dev/null || true)"
                if [ "${pvc}" = "yes" ] && [ "${svc}" = "yes" ] && [ "${sts}" = "yes" ] && [ "${deploy}" = "yes" ]; then
                  exit 0
                fi
                sleep 5
              done
              echo "the project administrator may not create PVCs (${pvc}), Services (${svc}), StatefulSets (${sts}) or Deployments (${deploy})"
              exit 1

    - name: enforce
      description: The grant webhooks coerce, refuse and default the references of a project user
      try:
        - description: Assert a PVC with a class that is not granted is coerced to the project default with a warning
          script:
            bindings:
              - name: expected
                value: '[multitenancy] PersistentVolumeClaim "e2e-mtm-pvc": $.spec.storageClassName "e2e-mtm-sc-denied" is not available to project "e2e-mtm-grant" and was replaced with the project default "e2e-mtm-sc-allowed"'
            content: >-
              kubectl create --dry-run=server -f manifests/pvc-denied-class.yaml
              --as e2e-mtm-grant-admin@example.com -o jsonpath='{.spec.storageClassName}'
            check:
              ($error == null): true
              ($stdout): e2e-mtm-sc-allowed
              (contains($stderr, $expected)): true
        - description: Assert a PVC with an explicitly empty class keeps it
          script:
            content: >-
              kubectl create --dry-run=server -f manifests/pvc-empty-class.yaml
              --as e2e-mtm-grant-admin@example.com -o jsonpath='{.spec.storageClassName}'
            check:
              ($error == null): true
              ($stdout): ''
        - description: Assert a PVC without a class gets the project default even when the project may use the cluster default
          script:
            timeout: 5m
            content: |
              set -euo pipefail
              cluster_default="$(kubectl get storageclasses -o json | jq -r '[.items[] | select(.metadata.annotations["storageclass.kubernetes.io/is-default-class"] == "true" or .metadata.annotations["storageclass.beta.kubernetes.io/is-default-class"] == "true")] | sort_by(.metadata.creationTimestamp, .metadata.name) | if length == 0 then "" else (map(.metadata.creationTimestamp) | max) as $newest | map(select(.metadata.creationTimestamp == $newest)) | first.metadata.name end')"
              if [ -z "${cluster_default}" ]; then
                echo "the cluster has no default StorageClass, nothing to check"
                exit 0
              fi
              kubectl patch clusterresourcegrantpolicy e2e-mtm-grant --type json \
                -p "[{\"op\":\"add\",\"path\":\"/spec/resources/0/allowed/-\",\"value\":\"${cluster_default}\"}]"
              available=false
              for attempt in $(seq 1 60); do
                if kubectl get availableclusterresource storageclasses -n e2e-mtm-grant -o json \
                  | jq -e --arg sc "${cluster_default}" '.status.available | map(.name) | index($sc) != null' >/dev/null; then
                  available=true
                  break
                fi
                sleep 5
              done
              if [ "${available}" != true ]; then
                echo "the cluster default ${cluster_default} never became available to project e2e-mtm-grant"
                exit 1
              fi
              warnings="$(mktemp)"
              class="$(kubectl create --dry-run=server -f manifests/pvc-no-class.yaml \
                --as e2e-mtm-grant-admin@example.com -o jsonpath='{.spec.storageClassName}' 2>"${warnings}")"
              if [ "${class}" != "e2e-mtm-sc-allowed" ]; then
                echo "the claim got ${class}, the cluster default is ${cluster_default}, the project default is e2e-mtm-sc-allowed"
                exit 1
              fi
              if grep -q '\[multitenancy\]' "${warnings}"; then
                echo "the claim named no class, so no replacement must be reported:"
                cat "${warnings}"
                exit 1
              fi
        - description: Assert the StorageClass registration reports the cluster default it finds
          script:
            timeout: 2m
            content: |
              set -euo pipefail
              marked="$(kubectl get storageclasses -o json | jq '[.items[] | select(.metadata.annotations["storageclass.kubernetes.io/is-default-class"] == "true" or .metadata.annotations["storageclass.beta.kubernetes.io/is-default-class"] == "true")] | length')"
              case "${marked}" in
                0) expected=NoDefault ;;
                1) expected=Found ;;
                *) expected=SeveralDefaults ;;
              esac
              reason=""
              for attempt in $(seq 1 20); do
                reason="$(kubectl get grantableclusterresourcedefinition storageclasses \
                  -o jsonpath='{.status.conditions[?(@.type=="DefaultFromResolved")].reason}')"
                if [ "${reason}" = "${expected}" ]; then
                  exit 0
                fi
                sleep 5
              done
              echo "DefaultFromResolved reason is ${reason}, want ${expected}: ${marked} StorageClasses are marked as the default"
              exit 1
        - description: Assert a PVC with a class that is not granted in the volume.beta.kubernetes.io/storage-class annotation is refused
          script:
            bindings:
              - name: expected
                value: '[multitenancy] PersistentVolumeClaim "e2e-mtm-pvc-beta" references "e2e-mtm-sc-denied" which is not available to project "e2e-mtm-grant"'
            content: >-
              kubectl create --dry-run=server -f manifests/pvc-beta-annotation-denied.yaml
              --as e2e-mtm-grant-admin@example.com
            check:
              ($error != null): true
              (contains($stderr, $expected)): true
        - description: Assert a PVC with a granted class in the volume.beta.kubernetes.io/storage-class annotation is accepted
          script:
            content: >-
              kubectl create --dry-run=server -f manifests/pvc-beta-annotation-allowed.yaml
              --as e2e-mtm-grant-admin@example.com -o jsonpath='{.metadata.annotations.volume\.beta\.kubernetes\.io/storage-class}'
            check:
              ($error == null): true
              ($stdout): e2e-mtm-sc-allowed
        - description: Assert a LoadBalancer Service with a class that is not granted is refused
          script:
            bindings:
              - name: expected
                value: '[multitenancy] Service "e2e-mtm-lb" references "e2e-mtm-lb-denied" which is not available to project "e2e-mtm-grant". Ask the cluster administrator to grant it.'
            content: >-
              kubectl create --dry-run=server -f manifests/service-denied-class.yaml
              --as e2e-mtm-grant-admin@example.com
            check:
              ($error != null): true
              (contains($stderr, $expected)): true
        - description: Assert a LoadBalancer Service without a class gets the project default
          script:
            content: >-
              kubectl create --dry-run=server -f manifests/service-no-class.yaml
              --as e2e-mtm-grant-admin@example.com -o jsonpath='{.spec.loadBalancerClass}'
            check:
              ($error == null): true
              ($stdout): e2e-mtm-lb-allowed

    - name: enforce-templates
      description: >-
        The grant webhooks check the class in the volume claim templates that kube-controller-manager
        turns into PersistentVolumeClaims, and the cluster default StorageClass a template without a
        class gets
      try:
        - description: Assert a StatefulSet with a class that is not granted in a volume claim template is refused
          script:
            bindings:
              - name: expected
                value: '[multitenancy] StatefulSet "e2e-mtm-sts" references "e2e-mtm-sc-denied" which is not available to project "e2e-mtm-grant".'
            content: >-
              kubectl create --dry-run=server -f manifests/statefulset-denied-class.yaml
              --as e2e-mtm-grant-admin@example.com
            check:
              ($error != null): true
              (contains($stderr, $expected)): true
        - description: Assert a StatefulSet with a granted class in a volume claim template is admitted
          script:
            content: >-
              kubectl create --dry-run=server -f manifests/statefulset-allowed-class.yaml
              --as e2e-mtm-grant-admin@example.com
            check:
              ($error == null): true
        - description: Assert a StatefulSet with an empty class in a volume claim template is admitted
          script:
            content: >-
              kubectl create --dry-run=server -f manifests/statefulset-empty-class.yaml
              --as e2e-mtm-grant-admin@example.com
            check:
              ($error == null): true
        - description: Assert a Deployment with a class that is not granted in an ephemeral volume is refused
          script:
            bindings:
              - name: expected
                value: '[multitenancy] Deployment "e2e-mtm-deploy" references "e2e-mtm-sc-denied" which is not available to project "e2e-mtm-grant".'
            content: >-
              kubectl create --dry-run=server -f manifests/deployment-ephemeral-denied-class.yaml
              --as e2e-mtm-grant-admin@example.com
            check:
              ($error != null): true
              (contains($stderr, $expected)): true
        - description: Assert a Deployment with a granted class in an ephemeral volume is admitted
          script:
            content: >-
              kubectl create --dry-run=server -f manifests/deployment-ephemeral-allowed-class.yaml
              --as e2e-mtm-grant-admin@example.com
            check:
              ($error == null): true
        - description: >-
            Assert a StatefulSet and a Deployment without a class in a volume claim template are refused
            while the cluster default StorageClass is not available to the project, and admitted on a
            cluster without a default StorageClass
          script:
            shell: bash
            shellArgs: ["-c"]
            timeout: 5m
            content: |
              set -euo pipefail
              cluster_default="$(kubectl get storageclasses -o json | jq -r '[.items[] | select(.metadata.annotations["storageclass.kubernetes.io/is-default-class"] == "true" or .metadata.annotations["storageclass.beta.kubernetes.io/is-default-class"] == "true")] | sort_by(.metadata.creationTimestamp, .metadata.name) | if length == 0 then "" else (map(.metadata.creationTimestamp) | max) as $newest | map(select(.metadata.creationTimestamp == $newest)) | first.metadata.name end')"
              if [ -z "${cluster_default}" ]; then
                echo "the cluster has no default StorageClass, so a template without a class keeps no class and is admitted"
                for manifest in statefulset deployment-ephemeral; do
                  kubectl create --dry-run=server -f "manifests/${manifest}-no-class.yaml" --as e2e-mtm-grant-admin@example.com
                done
                exit 0
              fi
              kubectl patch clusterresourcegrantpolicy e2e-mtm-grant --type json \
                -p '[{"op":"replace","path":"/spec/resources/0/allowed","value":["e2e-mtm-sc-allowed"]}]'
              for object in statefulset:StatefulSet:e2e-mtm-sts deployment-ephemeral:Deployment:e2e-mtm-deploy; do
                IFS=: read -r manifest kind name <<<"${object}"
                bash ../common/scripts/eventually-denied.sh 120 \
                  "[multitenancy] ${kind} \"${name}\" leaves the StorageClass unset where one is expected, so it gets the cluster default StorageClass \"${cluster_default}\", which is not available to project \"e2e-mtm-grant\"" \
                  kubectl create --dry-run=server -f "manifests/${manifest}-no-class.yaml" --as e2e-mtm-grant-admin@example.com
              done
        - description: >-
            Assert a StatefulSet and a Deployment without a class in a volume claim template are admitted
            while the cluster default StorageClass is available to the project (skipped on a cluster
            without one)
          script:
            timeout: 5m
            content: |
              set -euo pipefail
              cluster_default="$(kubectl get storageclasses -o json | jq -r '[.items[] | select(.metadata.annotations["storageclass.kubernetes.io/is-default-class"] == "true" or .metadata.annotations["storageclass.beta.kubernetes.io/is-default-class"] == "true")] | sort_by(.metadata.creationTimestamp, .metadata.name) | if length == 0 then "" else (map(.metadata.creationTimestamp) | max) as $newest | map(select(.metadata.creationTimestamp == $newest)) | first.metadata.name end')"
              if [ -z "${cluster_default}" ]; then
                echo "the cluster has no default StorageClass, nothing to check"
                exit 0
              fi
              kubectl patch clusterresourcegrantpolicy e2e-mtm-grant --type json \
                -p "[{\"op\":\"add\",\"path\":\"/spec/resources/0/allowed/-\",\"value\":\"${cluster_default}\"}]"
              for manifest in statefulset deployment-ephemeral; do
                admitted=false
                for attempt in $(seq 1 24); do
                  if kubectl create --dry-run=server -f "manifests/${manifest}-no-class.yaml" --as e2e-mtm-grant-admin@example.com; then
                    admitted=true
                    break
                  fi
                  sleep 5
                done
                if [ "${admitted}" != true ]; then
                  echo "manifests/${manifest}-no-class.yaml was not admitted although the cluster default ${cluster_default} is available to project e2e-mtm-grant"
                  exit 1
                fi
              done

    - name: definition-removal
      description: Removing a GrantableClusterResourceDefinition removes its AvailableClusterResource from the project
      try:
        - description: Create the e2e-mtm-widgets registration
          create:
            file: manifests/definition.yaml
        - description: Assert the project gets the AvailableClusterResource of the registration
          assert:
            timeout: 3m
            resource:
              apiVersion: multitenancy.deckhouse.io/v1alpha1
              kind: AvailableClusterResource
              metadata:
                name: e2e-mtm-widgets
                namespace: e2e-mtm-grant
        - description: Delete the e2e-mtm-widgets registration
          delete:
            ref:
              apiVersion: multitenancy.deckhouse.io/v1alpha1
              kind: GrantableClusterResourceDefinition
              name: e2e-mtm-widgets
        - description: Assert the AvailableClusterResource is removed from the project
          error:
            timeout: 3m
            resource:
              apiVersion: multitenancy.deckhouse.io/v1alpha1
              kind: AvailableClusterResource
              metadata:
                name: e2e-mtm-widgets
                namespace: e2e-mtm-grant
