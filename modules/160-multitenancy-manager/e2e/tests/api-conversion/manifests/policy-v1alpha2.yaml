# Selects no project: neither label exists in the cluster.
apiVersion: multitenancy.deckhouse.io/v1alpha2
kind: ClusterResourceGrantPolicy
metadata:
  name: e2e-mtm-conv
spec:
  projectSelector:
    matchLabels:
      e2e-mtm/conversion: project
  namespaceSelector:
    matchLabels:
      e2e-mtm/conversion: namespace
  resources:
    - resourceName: loadbalancerclasses
      allowed:
        - e2e-mtm-conv-lb
