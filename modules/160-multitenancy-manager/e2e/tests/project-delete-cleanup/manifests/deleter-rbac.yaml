# A user who may delete projects but no namespace of them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: e2e-mtm-project-deleter
rules:
  - apiGroups: ["deckhouse.io"]
    resources: ["projects"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-mtm-project-deleter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: e2e-mtm-project-deleter
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: e2e-mtm-deleter@example.com
