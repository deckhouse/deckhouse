---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /src/multitenancy-manager
  to: /multitenancy-manager
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src/templates
  to: /templates
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src/helmlib
  to: /helmlib
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: [ "/multitenancy-manager" ]
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/src" }}
final: false
git:
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
    to: /src
    includePaths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '**/helmlib/*.yaml'
      - '**/helmlib/*.tpl'
      - '**/templates/*.yaml'
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /src
    to: /src
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - export GOPROXY=$(cat /run/secrets/GOPROXY)
    - cd /src
    - export CGO_ENABLED=0 GOOS=linux
    - |
      {{- $buildContext := deepCopy $ -}}
      {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
      {{- /* The edition werf builds is written into the binary: in CE a project has only its main namespace (internal/edition). */ -}}
      {{- $_ := set $buildContext "BuildCommand" (printf "go build -ldflags '-s -w -X controller/internal/edition.built=%s' -o multitenancy-manager ./cmd/main.go" $.Env) -}}
      {{- include "image-build.build" $buildContext | indent 6 }}
    - chown 64535:64535 multitenancy-manager
    - chmod 0700 multitenancy-manager
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
