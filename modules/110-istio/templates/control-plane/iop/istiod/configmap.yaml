apiVersion: v1
kind: ConfigMap
metadata:
  name: istiod-service-accounts
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list $ (dict "app" "istiod" "control-plane-manager.deckhouse.io/extra-audit-policy-config" "")) | nindent 2 }}
data:
  basicAuditPolicy: |
    serviceAccounts:
{{- range $version, $versionInfo := .Values.istio.internal.versionMap }}
    - "system:serviceaccount:d8-{{ $.Chart.Name }}:istiod-{{ $versionInfo.revision }}"
{{- end }}
