{{- $moduleGateway := dict }}
{{- include "helm_lib_module_gateway" (list . $moduleGateway) }}
{{- $ingressEnabled := eq (include "helm_lib_module_ingress_enabled" .) "true" }}
{{- $gatewayEnabled := eq (include "helm_lib_module_gateway_enabled" .) "true" }}
{{- if and .Values.istio.internal.deployDexAuthenticator (or $ingressEnabled $gatewayEnabled) }}
---
apiVersion: deckhouse.io/v1
kind: DexAuthenticator
metadata:
  name: "istio"
  namespace: "d8-istio"
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex-authenticator" "name" "istio" )) | nindent 2 }}
  annotations:
    dexauthenticator.deckhouse.io/allow-access-to-kubernetes: "true"
spec:
  applicationDomain: {{ include "helm_lib_module_public_domain" (list . "istio") }}
  {{- if and $ingressEnabled (include "helm_lib_module_https_ingress_tls_enabled" .) }}
  applicationIngressCertificateSecretName: {{ include "helm_lib_module_https_secret_name" (list . "istio-ingress-tls") }}
  {{- end }}
  {{- if and $gatewayEnabled (include "helm_lib_module_https_route_tls_enabled" .) }}
  gatewayAPI:
    applicationHTTPRouteListenerSetName: "istio"
  {{- end }}
  applicationIngressClassName: {{ include "helm_lib_module_ingress_class" . | quote }}
  signOutURL: "/logout"
  sendAuthorizationHeader: true
  {{- with .Values.istio.auth.allowedUserEmails }}
  allowedEmails:
  {{- . | toYaml | nindent 2 }}
  {{- end }}
  {{- with .Values.istio.auth.allowedUserGroups }}
  allowedGroups:
  {{- . | toYaml | nindent 2 }}
  {{- end }}
  {{- if (include "helm_lib_ha_enabled" .) }}
  highAvailability: true
  {{- else }}
  highAvailability: false
  {{- end }}
{{- end }}
