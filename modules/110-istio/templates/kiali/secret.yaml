{{- $moduleGateway := dict }}
{{- include "helm_lib_module_gateway" (list . $moduleGateway) }}
{{- $ingressEnabled := eq (include "helm_lib_module_ingress_enabled" .) "true" }}
{{- $gatewayEnabled := eq (include "helm_lib_module_gateway_enabled" .) "true" }}
{{- if and (or (not .Values.istio.auth.externalAuthentication ) (eq (include "helm_lib_module_https_mode" .) "Disabled")) (or $ingressEnabled $gatewayEnabled) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kiali-basic-auth
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "kiali")) | nindent 2 }}
type: Opaque
data:
  auth: {{ print "admin:{PLAIN}" .Values.istio.internal.auth.password | b64enc | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kiali-kube-rbac-proxy-tls
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "kiali")) | nindent 2 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ .Values.istio.internal.kialiRBACProxyTLS.ca | b64enc | quote }}
  tls.crt: {{ .Values.istio.internal.kialiRBACProxyTLS.crt | b64enc | quote }}
  tls.key: {{ .Values.istio.internal.kialiRBACProxyTLS.key | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kiali-signing-key
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "kiali")) | nindent 2 }}
type: Opaque
data:
  key: {{ .Values.istio.internal.kialiSigningKey | b64enc | quote }}
