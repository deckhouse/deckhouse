apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: istio
    rbac.deckhouse.io/aggregate-to-namespace-as: admin
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "namespace-capability.istio.admin"
    rbac.deckhouse.io/scope: namespace
  name: d8:namespace-capability:istio:admin
  annotations:
    en.meta.deckhouse.io/title: "Module istio: admin"
    ru.meta.deckhouse.io/title: "Модуль istio: администрирование"
    en.meta.deckhouse.io/description: "Manage istio Telemetry and WasmPlugin resources in a namespace."
    ru.meta.deckhouse.io/description: "Управление ресурсами Telemetry и WasmPlugin модуля istio в пространстве имён."
rules:
- apiGroups:
  - telemetry.istio.io
  resources:
  - telemetries
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
- apiGroups:
  - extensions.istio.io
  resources:
  - wasmplugins
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
