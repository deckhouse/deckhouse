apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: istio
    rbac.deckhouse.io/aggregate-to-namespace-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "namespace-capability.istio.edit"
    rbac.deckhouse.io/scope: namespace
  name: d8:namespace-capability:istio:edit
  annotations:
    en.meta.deckhouse.io/title: "Module istio: edit"
    ru.meta.deckhouse.io/title: "Модуль istio: редактирование"
    en.meta.deckhouse.io/description: "Manage istio resources in a namespace."
    ru.meta.deckhouse.io/description: "Управление ресурсами модуля istio в пространстве имён."
rules:
- apiGroups:
  - networking.istio.io
  resources:
  - destinationrules
  - virtualservices
  - serviceentries
  - gateways
  - sidecars
  - workloadentries
  - workloadgroups
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
- apiGroups:
  - security.istio.io
  resources:
  - peerauthentications
  - authorizationpolicies
  - requestauthentications
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
- apiGroups:
  - network.deckhouse.io
  resources:
  - waypointinstances
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
