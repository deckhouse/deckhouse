positive:
  configValues:
    - controlPlane:
        replicasManagement:
          mode: Static
          static:
            replicas: 3
        resourcesManagement:
          vpa:
            memory:
              max: "2.000G"
              min: "1.123G"
    - controlPlane:
        replicasManagement:
          mode: HPA
          hpa:
            minReplicas: 2
            maxReplicas: 5
            metrics:
            - type: CPU
              targetAverageUtilization: 80
        resourcesManagement:
          static:
            requests:
              memory: "2G"
    - sidecar:
        resourcesManagement:
          static:
            limits:
              cpu: 2000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
    - ambient:
        enabled: false
    - ambient:
        enabled: true
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin
    - ambient:
        enabled: true
      multicluster:
        enabled: true
        mode: Sidecar
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin
    - ambient:
        enabled: true
      multicluster:
        enabled: true
        mode: Ambient
      globalVersion: "1.29"
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # The schema accepts both gateway blocks in either mode; in the Ambient mode
  # ingressGateway is unused.
    - ambient:
        enabled: true
      multicluster:
        enabled: true
        mode: Ambient
      globalVersion: "1.29"
      alliance:
        ingressGateway:
          advertise:
          - address: 172.16.0.5
            port: 15443
        ambientGateway:
          advertise:
          - address: 172.16.0.5
            port: 15008
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # ... and two independent load balancers, which one shared advertise list
  # could not have expressed.
    - ambient:
        enabled: true
      multicluster:
        enabled: true
        mode: Ambient
      globalVersion: "1.29"
      alliance:
        ingressGateway:
          advertise:
          - address: 172.16.0.5
            port: 15443
        ambientGateway:
          advertise:
          - address: 172.16.0.6
            port: 15008
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # An IPv6 address for the ambient gateway.
    - ambient:
        enabled: true
      multicluster:
        enabled: true
        mode: Ambient
      globalVersion: "1.29"
      alliance:
        ambientGateway:
          advertise:
          - address: "2001:db8::1"
            port: 15008
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # A DNS name for the ambient gateway, which is what a load balancer class that
  # hands out names gives you. Peer ztunnels resolve it themselves.
    - ambient:
        enabled: true
      multicluster:
        enabled: true
        mode: Ambient
      globalVersion: "1.29"
      alliance:
        ambientGateway:
          advertise:
          - address: somehost.example.com
            port: 15008
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # The same name as an operator is liable to write it: the spelling is normalised
  # on the way out, so neither the case nor the root dot has to be got right here.
    - ambient:
        enabled: true
      multicluster:
        enabled: true
        mode: Ambient
      globalVersion: "1.29"
      alliance:
        ambientGateway:
          advertise:
          - address: SomeHost.Example.COM.
            port: 15008
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # ... and one load balancer fronting both gateways under a single name, each at
  # its own port.
    - ambient:
        enabled: true
      multicluster:
        enabled: true
        mode: Ambient
      globalVersion: "1.29"
      alliance:
        ingressGateway:
          advertise:
          - address: istio-ew.example.com
            port: 15443
        ambientGateway:
          advertise:
          - address: istio-ew.example.com
            port: 15008
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # ambient multicluster with the NodePort inlet, with a static node port for
  # each east-west gateway.
    - ambient:
        enabled: true
      multicluster:
        enabled: true
        mode: Ambient
      globalVersion: "1.29"
      alliance:
        ingressGateway:
          inlet: NodePort
          nodePort:
            port: 30001
        ambientGateway:
          inlet: NodePort
          nodePort:
            port: 30002
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # Different inlets per gateway: the sidecar gateway on node ports, the
  # ambient one on a load balancer.
    - ambient:
        enabled: true
      multicluster:
        enabled: true
        mode: Ambient
      globalVersion: "1.29"
      alliance:
        ingressGateway:
          inlet: NodePort
          nodePort:
            port: 30001
        ambientGateway:
          inlet: LoadBalancer
          serviceAnnotations:
            service.beta.kubernetes.io/aws-load-balancer-type: nlb
          loadBalancerClass: service.k8s.aws/nlb
          nodeSelector:
            node-role.deckhouse.io/istio-ambient-gateway: ""
          tolerations:
          - operator: Exists
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # The Sidecar mode works alongside federation, and needs no ambient.
    - multicluster:
        enabled: true
        mode: Sidecar
      federation:
        enabled: true

  # The Ambient mode with federation explicitly off.
    - ambient:
        enabled: true
      multicluster:
        enabled: true
        mode: Ambient
      globalVersion: "1.29"
      federation:
        enabled: false
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # sidecar multicluster keeps honouring advertise on its own.
    - multicluster:
        enabled: true
      alliance:
        ingressGateway:
          advertise:
          - address: 172.16.0.5
            port: 15443

    - telemetryAPI:
        enabled: true
    - configAnalysis:
        enabled: false
    - jwksResolverAdditionalRootCA: |
        -----BEGIN CERTIFICATE-----
        MIIDXTCCAkWgAwIBAgIJAN...
        -----END CERTIFICATE-----
    - dataPlane:
        extensionProviders:
        - name: authservice-grpc
          envoyExtAuthzGrpc:
            service: authservice.d8-istio.svc.cluster.local
            port: 10003
    - dataPlane:
        extensionProviders:
        - name: oauth2-proxy
          envoyExtAuthzHttp:
            service: oauth2-proxy.oauth2-proxy.svc.cluster.local
            port: 4180
            pathPrefix: /oauth2/auth
            timeout: 5s
            failOpen: false
            statusOnError: "503"
            includeRequestHeadersInCheck: ["authorization", "cookie", "x-forwarded-*"]
            includeAdditionalHeadersInCheck:
              x-ext-authz-source: istio
            headersToUpstreamOnAllow: ["authorization", "x-auth-request-*"]
            headersToDownstreamOnDeny: ["content-type", "set-cookie"]
            headersToDownstreamOnAllow: ["set-cookie"]
        - name: otel-grpc
          opentelemetry:
            service: opentelemetry-collector.observability.svc.cluster.local
            port: 4317
            maxTagLength: 512
            grpc:
              timeout: 5s
              initialMetadata:
              - name: x-scope-orgid
                value: tenant-a
            resourceDetectors:
              environment: {}
        - name: otel-http
          opentelemetry:
            service: opentelemetry-collector.observability.svc.cluster.local
            port: 4318
            http:
              path: /v1/traces
              timeout: 10s
              headers:
              - name: x-scope-orgid
                value: tenant-a
        - name: zipkin
          zipkin:
            service: zipkin.tracing.svc.cluster.local
            port: 9411
            maxTagLength: 512
            enable64bitTraceId: true
            path: /api/v2/spans
    - dataPlane:
        extensionProviders:
        - name: authservice-grpc
          envoyExtAuthzGrpc:
            service: authservice.d8-istio.svc.cluster.local
            port: 10003
            timeout: 1m30s
        - name: oauth2-proxy
          envoyExtAuthzHttp:
            service: oauth2-proxy.oauth2-proxy.svc.cluster.local
            port: 4180
            timeout: 500ms
        - name: otel-grpc
          opentelemetry:
            service: opentelemetry-collector.observability.svc.cluster.local
            port: 4317
            grpc:
              timeout: 2.5s
  # service formats and statusOnError codes
    - dataPlane:
        extensionProviders:
        - name: authservice-grpc
          envoyExtAuthzGrpc:
            service: d8-istio/authservice.d8-istio.svc.cluster.local
            port: 10003
            statusOnError: "403"
        - name: oauth2-proxy
          envoyExtAuthzHttp:
            service: oauth2-proxy.oauth2-proxy.svc.cluster.local
            port: 4180
            statusOnError: "511"
        - name: otel
          opentelemetry:
            service: otel-collector
            port: 4317
        - name: zipkin
          zipkin:
            service: Zipkin.Example.com
            port: 9411
  # zipkin address
    - tracing:
        collector:
          zipkin:
            address: jaeger-collector.tracing.svc.cluster.local:9411
    - tracing:
        collector:
          zipkin:
            address: 10.0.0.10:65535
    - tracing:
        collector:
          opentelemetry:
            service: opentelemetry-collector.observability.svc.cluster.local
            port: 4318
            http:
              timeout: 10s
    - tracing:
        collector:
          opentelemetry:
            service: observability/opentelemetry-collector.observability.svc.cluster.local
            port: 4317
    - ca:
        secretRef:
          name: my-istio-ca
          namespace: my-pki
    - ca:
        secretRef:
          name: my-istio-ca
    - ca:
        cert: "---CERT PEM---"
        key: "---KEY PEM---"
    - ca:
        cert: "---CERT PEM---"
        key: "---KEY PEM---"
        chain: "---CHAIN PEM---"
        root: "---ROOT PEM---"
    - ca: {}
  values:
    - {}
negative:
  configValues:
  # globalVersion with unsupported version
    - globalVersion: "1.99"
  # additionalVersions with unsupported version
    - additionalVersions: ["1.5"]
  # additionalVersions mixing supported and unsupported versions
    - additionalVersions: ["1.29", "1.88"]
  #Bad cpu limit value
    - sidecar:
        resourcesManagement:
          static:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
    - ambient:
        enabled: true
    - ambient:
        enabled: true
      dataPlane:
        trafficRedirectionSetupMode: InitContainer

  # multicluster.mode=Ambient without ambient.enabled
    - ambient:
        enabled: false
      multicluster:
        enabled: true
        mode: Ambient
      globalVersion: "1.29"
    - multicluster:
        enabled: true
        mode: Ambient
      globalVersion: "1.29"

  # multicluster.mode=Ambient without multicluster.enabled
    - ambient:
        enabled: true
      multicluster:
        mode: Ambient
      globalVersion: "1.29"
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin
    - ambient:
        enabled: true
      multicluster:
        enabled: false
        mode: Ambient
      globalVersion: "1.29"
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # multicluster.mode=Ambient together with federation
    - ambient:
        enabled: true
      multicluster:
        enabled: true
        mode: Ambient
      globalVersion: "1.29"
      federation:
        enabled: true
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # multicluster.mode=Ambient without an explicit globalVersion
    - ambient:
        enabled: true
      multicluster:
        enabled: true
        mode: Ambient
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # multicluster.mode=Ambient with a globalVersion that has no ambient multicluster
    - ambient:
        enabled: true
      multicluster:
        enabled: true
        mode: Ambient
      globalVersion: "1.27"
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # multicluster.mode only takes the listed values
    - multicluster:
        enabled: true
        mode: Both

  # The switch multicluster.mode replaced is gone
    - ambient:
        enabled: true
        multicluster:
          enabled: true
      multicluster:
        enabled: true
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # ambientGateway.nodePort.port out of range
    - alliance:
        ambientGateway:
          inlet: NodePort
          nodePort:
            port: 70000

  # ambientGateway.advertise[].port out of range
    - alliance:
        ambientGateway:
          advertise:
          - address: 172.16.0.5
            port: 70000

  # ambientGateway.advertise[] without a port, which has no Service port to fall back on
    - alliance:
        ambientGateway:
          advertise:
          - address: 172.16.0.5

  # A DNS name has to be a fully qualified one - a peer resolves it with its own
  # resolver, where a short name means something else or nothing - and has to be a
  # name the Gateway object carrying it can hold.
    - alliance:
        ambientGateway:
          advertise:
          - address: somehost
            port: 15008
    - alliance:
        ambientGateway:
          advertise:
          - address: lb_1.example.com
            port: 15008
    - alliance:
        ambientGateway:
          advertise:
          - address: "*.example.com"
            port: 15008
    - alliance:
        ambientGateway:
          advertise:
          - address: -somehost.example.com
            port: 15008
    - alliance:
        ambientGateway:
          advertise:
          - address: somehost..example.com
            port: 15008

  # The IPv4-in-IPv6 notation cannot be advertised: write the plain IPv4 address instead.
    - alliance:
        ambientGateway:
          advertise:
          - address: "::ffff:172.16.0.5"
            port: 15008

  # Address-shaped but not an address. Each of these is what a hand-written regex
  # lets through and `format: ipv4|ipv6` does not.
    - alliance:
        ambientGateway:
          advertise:
          - address: "999.999.999.999"
            port: 15008
    - alliance:
        ambientGateway:
          advertise:
          - address: "::::"
            port: 15008
    - alliance:
        ambientGateway:
          advertise:
          - address: "ffff"
            port: 15008
    - alliance:
        ambientGateway:
          advertise:
          - address: "172.16.0.5/32"
            port: 15008

    - dataPlane:
        extensionProviders:
        - name: authservice-grpc
          envoyExtAuthzGrpc:
            service: authservice.istio-system.svc.cluster.local
            port: "10003"
  # reserved provider names
    - dataPlane:
        extensionProviders:
        - name: d8-main
          envoyExtAuthzGrpc:
            service: authservice.istio-system.svc.cluster.local
            port: 10003
    - dataPlane:
        extensionProviders:
        - name: deckhouse-tracing
          zipkin:
            service: zipkin.tracing.svc.cluster.local
            port: 9411
    - dataPlane:
        extensionProviders:
        - name: prometheus
          opentelemetry:
            service: opentelemetry-collector.observability.svc.cluster.local
            port: 4317
  # a provider must set exactly one provider type
    - dataPlane:
        extensionProviders:
        - name: no-provider
    - dataPlane:
        extensionProviders:
        - name: two-providers
          zipkin:
            service: zipkin.tracing.svc.cluster.local
            port: 9411
          opentelemetry:
            service: opentelemetry-collector.observability.svc.cluster.local
            port: 4317
  # opentelemetry http and grpc are mutually exclusive
    - dataPlane:
        extensionProviders:
        - name: otel
          opentelemetry:
            service: opentelemetry-collector.observability.svc.cluster.local
            port: 4317
            http:
              path: /v1/traces
            grpc:
              timeout: 5s
  # opentelemetry http requires path
    - dataPlane:
        extensionProviders:
        - name: otel
          opentelemetry:
            service: opentelemetry-collector.observability.svc.cluster.local
            port: 4318
            http:
              timeout: 10s
  # zipkin requires port
    - dataPlane:
        extensionProviders:
        - name: zipkin
          zipkin:
            service: zipkin.tracing.svc.cluster.local
  # envoyExtAuthzHttp pathPrefix must begin with /
    - dataPlane:
        extensionProviders:
        - name: oauth2-proxy
          envoyExtAuthzHttp:
            service: oauth2-proxy.oauth2-proxy.svc.cluster.local
            port: 4180
            pathPrefix: oauth2/auth
  # statusOnError must be an HTTP status code
    - dataPlane:
        extensionProviders:
        - name: authservice-grpc
          envoyExtAuthzGrpc:
            service: authservice.istio-system.svc.cluster.local
            port: 10003
            statusOnError: "Forbidden"
    - dataPlane:
        extensionProviders:
        - name: oauth2-proxy
          envoyExtAuthzHttp:
            service: oauth2-proxy.oauth2-proxy.svc.cluster.local
            port: 4180
            statusOnError: "5000"
  # statusOnError must be a code that Envoy supports
    - dataPlane:
        extensionProviders:
        - name: authservice-grpc
          envoyExtAuthzGrpc:
            service: authservice.istio-system.svc.cluster.local
            port: 10003
            statusOnError: "599"
    - dataPlane:
        extensionProviders:
        - name: oauth2-proxy
          envoyExtAuthzHttp:
            service: oauth2-proxy.oauth2-proxy.svc.cluster.local
            port: 4180
            statusOnError: "419"
  # service must be [<namespace>/]<hostname>
    - dataPlane:
        extensionProviders:
        - name: authservice-grpc
          envoyExtAuthzGrpc:
            service: authservice.istio-system.svc.cluster.local:10003
            port: 10003
    - dataPlane:
        extensionProviders:
        - name: oauth2-proxy
          envoyExtAuthzHttp:
            service: http://oauth2-proxy.oauth2-proxy.svc.cluster.local
            port: 4180
    - dataPlane:
        extensionProviders:
        - name: otel
          opentelemetry:
            service: opentelemetry_collector.observability.svc.cluster.local
            port: 4317
    - dataPlane:
        extensionProviders:
        - name: zipkin
          zipkin:
            service: "*/zipkin.tracing.svc.cluster.local"
            port: 9411
    - dataPlane:
        extensionProviders:
        - name: zipkin
          zipkin:
            service: zipkin..tracing.svc.cluster.local
            port: 9411
    - dataPlane:
        extensionProviders:
        - name: oauth2-proxy
          envoyExtAuthzHttp:
            service: oauth2-proxy.oauth2-proxy.svc.cluster.local.
            port: 4180
  # fields of newer Istio versions are not supported
    - dataPlane:
        extensionProviders:
        - name: zipkin
          zipkin:
            service: zipkin.tracing.svc.cluster.local
            port: 9411
            traceContextOption: USE_B3_WITH_W3C_PROPAGATION
  # timeouts must be Go durations
    - dataPlane:
        extensionProviders:
        - name: authservice-grpc
          envoyExtAuthzGrpc:
            service: authservice.istio-system.svc.cluster.local
            port: 10003
            timeout: 5 seconds
    - dataPlane:
        extensionProviders:
        - name: oauth2-proxy
          envoyExtAuthzHttp:
            service: oauth2-proxy.oauth2-proxy.svc.cluster.local
            port: 4180
            timeout: "5"
    - dataPlane:
        extensionProviders:
        - name: otel
          opentelemetry:
            service: opentelemetry-collector.observability.svc.cluster.local
            port: 4318
            http:
              path: /v1/traces
              timeout: 10sec
    - dataPlane:
        extensionProviders:
        - name: otel
          opentelemetry:
            service: opentelemetry-collector.observability.svc.cluster.local
            port: 4317
            grpc:
              timeout: 1d
    - tracing:
        collector:
          opentelemetry:
            service: opentelemetry-collector.observability.svc.cluster.local
            port: 4318
            http:
              timeout: PT10S
  # zipkin address must be <host>:<port>
    - tracing:
        collector:
          zipkin:
            address: jaeger-collector.tracing.svc.cluster.local
    - tracing:
        collector:
          zipkin:
            address: jaeger-collector.tracing.svc.cluster.local:zipkin
    - tracing:
        collector:
          zipkin:
            address: http://jaeger-collector.tracing.svc.cluster.local:9411
    - tracing:
        collector:
          zipkin:
            address: jaeger-collector.tracing.svc.cluster.local:0
    - tracing:
        collector:
          zipkin:
            address: jaeger-collector.tracing.svc.cluster.local:65536
    - tracing:
        collector:
          zipkin:
            address: tracing/jaeger-collector.tracing.svc.cluster.local:9411
  # tracing opentelemetry service must be [<namespace>/]<hostname>
    - tracing:
        collector:
          opentelemetry:
            service: opentelemetry-collector.observability.svc.cluster.local:4317
            port: 4317
    - tracing:
        collector:
          opentelemetry:
            service: http://opentelemetry-collector.observability.svc.cluster.local
            port: 4317
  # cert and secretRef are mutually exclusive
    - ca:
        cert: "---CERT PEM---"
        key: "---KEY PEM---"
        secretRef:
          name: my-istio-ca
  # secretRef requires name
    - ca:
        secretRef:
          namespace: my-pki
  # inline cert requires key
    - ca:
        cert: "---CERT PEM---"
  # inline key requires cert
    - ca:
        key: "---KEY PEM---"
  # chain/root without cert are not allowed
    - ca:
        chain: "---CHAIN PEM---"
        root: "---ROOT PEM---"
  # secretRef must not be combined with any inline field
    - ca:
        root: "---ROOT PEM---"
        secretRef:
          name: my-istio-ca
