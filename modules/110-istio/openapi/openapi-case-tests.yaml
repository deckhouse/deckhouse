positive:
  configValues:
    - controlPlane:
        replicasManagement:
          mode: Static
          static:
            replicas: 3
        resourcesManagement:
          vpa:
            memory:
              max: "2.000G"
              min: "1.123G"
    - controlPlane:
        replicasManagement:
          mode: HPA
          hpa:
            minReplicas: 2
            maxReplicas: 5
            metrics:
            - type: CPU
              targetAverageUtilization: 80
        resourcesManagement:
          static:
            requests:
              memory: "2G"
    - sidecar:
        resourcesManagement:
          static:
            limits:
              cpu: 2000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
    - ambient:
        enabled: false
    - ambient:
        enabled: true
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin
    - ambient:
        enabled: true
        multicluster:
          enabled: false
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin
    - ambient:
        enabled: true
        multicluster:
          enabled: true
      multicluster:
        enabled: true
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # One external load balancer in front of both gateways: its address is named
  # in both advertise lists, each at that gateway's own port.
    - ambient:
        enabled: true
        multicluster:
          enabled: true
      multicluster:
        enabled: true
      alliance:
        ingressGateway:
          advertise:
          - address: 172.16.0.5
            port: 15443
        ambientGateway:
          advertise:
          - address: 172.16.0.5
            port: 15008
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # ... and two independent load balancers, which one shared advertise list
  # could not have expressed.
    - ambient:
        enabled: true
        multicluster:
          enabled: true
      multicluster:
        enabled: true
      alliance:
        ingressGateway:
          advertise:
          - address: 172.16.0.5
            port: 15443
        ambientGateway:
          advertise:
          - address: 172.16.0.6
            port: 15008
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # An IPv6 address for the ambient gateway.
    - ambient:
        enabled: true
        multicluster:
          enabled: true
      multicluster:
        enabled: true
      alliance:
        ambientGateway:
          advertise:
          - address: "2001:db8::1"
            port: 15008
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # ambient multicluster with the NodePort inlet: each east-west gateway gets a
  # static node port of its own.
    - ambient:
        enabled: true
        multicluster:
          enabled: true
      multicluster:
        enabled: true
      alliance:
        ingressGateway:
          inlet: NodePort
          nodePort:
            port: 30001
        ambientGateway:
          inlet: NodePort
          nodePort:
            port: 30002
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # Different inlets per gateway: the sidecar gateway on node ports, the
  # ambient one on a load balancer.
    - ambient:
        enabled: true
        multicluster:
          enabled: true
      multicluster:
        enabled: true
      alliance:
        ingressGateway:
          inlet: NodePort
          nodePort:
            port: 30001
        ambientGateway:
          inlet: LoadBalancer
          serviceAnnotations:
            service.beta.kubernetes.io/aws-load-balancer-type: nlb
          loadBalancerClass: service.k8s.aws/nlb
          nodeSelector:
            node-role.deckhouse.io/istio-ambient-gateway: ""
          tolerations:
          - operator: Exists
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # sidecar multicluster keeps honouring advertise on its own.
    - multicluster:
        enabled: true
      alliance:
        ingressGateway:
          advertise:
          - address: 172.16.0.5
            port: 15443

    - telemetryAPI:
        enabled: true
    - configAnalysis:
        enabled: false
    - jwksResolverAdditionalRootCA: |
        -----BEGIN CERTIFICATE-----
        MIIDXTCCAkWgAwIBAgIJAN...
        -----END CERTIFICATE-----
    - dataPlane:
        extensionProviders:
        - name: authservice-grpc
          envoyExtAuthzGrpc:
            service: authservice.d8-istio.svc.cluster.local
            port: 10003
    - ca:
        secretRef:
          name: my-istio-ca
          namespace: my-pki
    - ca:
        secretRef:
          name: my-istio-ca
    - ca:
        cert: "---CERT PEM---"
        key: "---KEY PEM---"
    - ca:
        cert: "---CERT PEM---"
        key: "---KEY PEM---"
        chain: "---CHAIN PEM---"
        root: "---ROOT PEM---"
    - ca: {}
  values:
    - {}
negative:
  configValues:
  # globalVersion with unsupported version
    - globalVersion: "1.99"
  # additionalVersions with unsupported version
    - additionalVersions: ["1.5"]
  # additionalVersions mixing supported and unsupported versions
    - additionalVersions: ["1.29", "1.88"]
  #Bad cpu limit value
    - sidecar:
        resourcesManagement:
          static:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
    - ambient:
        enabled: true
    - ambient:
        enabled: true
      dataPlane:
        trafficRedirectionSetupMode: InitContainer

  # ambient.multicluster.enabled=true without ambient.enabled
    - ambient:
        enabled: false
        multicluster:
          enabled: true
      multicluster:
        enabled: true

  # ambient.multicluster.enabled=true without multicluster.enabled
    - ambient:
        enabled: true
        multicluster:
          enabled: true
      dataPlane:
        trafficRedirectionSetupMode: CNIPlugin

  # ambientGateway.nodePort.port out of range
    - alliance:
        ambientGateway:
          inlet: NodePort
          nodePort:
            port: 70000

  # ambientGateway.advertise[].port out of range
    - alliance:
        ambientGateway:
          advertise:
          - address: 172.16.0.5
            port: 70000

  # ambientGateway.advertise[] without a port, which has no Service port to fall back on
    - alliance:
        ambientGateway:
          advertise:
          - address: 172.16.0.5

  # A DNS name cannot be advertised for the ambient gateway: the ambient data
  # plane writes the address straight into a Workload and never resolves it.
    - alliance:
        ambientGateway:
          advertise:
          - address: somehost.example.com
            port: 15008

  # ... nor the IPv4-in-IPv6 notation: write the plain IPv4 address instead.
    - alliance:
        ambientGateway:
          advertise:
          - address: "::ffff:172.16.0.5"
            port: 15008

  # Address-shaped but not an address. Each of these is what a hand-written regex
  # lets through and `format: ipv4|ipv6` does not.
    - alliance:
        ambientGateway:
          advertise:
          - address: "999.999.999.999"
            port: 15008
    - alliance:
        ambientGateway:
          advertise:
          - address: "::::"
            port: 15008
    - alliance:
        ambientGateway:
          advertise:
          - address: "ffff"
            port: 15008
    - alliance:
        ambientGateway:
          advertise:
          - address: "172.16.0.5/32"
            port: 15008

    - dataPlane:
        extensionProviders:
        - name: authservice-grpc
          envoyExtAuthzGrpc:
            service: authservice.istio-system.svc.cluster.local
            port: "10003"
  # cert and secretRef are mutually exclusive
    - ca:
        cert: "---CERT PEM---"
        key: "---KEY PEM---"
        secretRef:
          name: my-istio-ca
  # secretRef requires name
    - ca:
        secretRef:
          namespace: my-pki
  # inline cert requires key
    - ca:
        cert: "---CERT PEM---"
  # inline key requires cert
    - ca:
        key: "---KEY PEM---"
  # chain/root without cert are not allowed
    - ca:
        chain: "---CHAIN PEM---"
        root: "---ROOT PEM---"
  # secretRef must not be combined with any inline field
    - ca:
        root: "---ROOT PEM---"
        secretRef:
          name: my-istio-ca
