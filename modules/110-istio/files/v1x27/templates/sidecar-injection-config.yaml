{{- $ := index . 0 -}}
{{- $revision := index . 1 -}}
{{- $fullVersion := index . 3 -}}
defaultTemplates:
- sidecar
policy: enabled
alwaysInjectSelector: []
neverInjectSelector:
- matchExpressions:
  - key: job-name
    operator: Exists
injectedAnnotations:
  istio.deckhouse.io/full-version: {{ $fullVersion | quote }}
template: '{{`{{ Template_Version_And_Istio_Version_Mismatched_Check_Installation }}`}}'
templates:
  sidecar: |
{{ include "istioRequiredChartFile" (list $ (printf "files/%s/static/sidecar-injection-template.yaml" $revision)) | trim | indent 4 }}
  gateway: |
{{ include "istioRequiredChartFile" (list $ (printf "files/%s/static/gateway-injection-template.yaml" $revision)) | trim | indent 4 }}
  # Deprecated no-op, remove in 1.79
  d8-seccomp: |
    spec: {}
  d8-hold-istio-proxy-termination-until-application-stops: |
    spec:
      containers:
      - name: istio-proxy
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "curl -X POST 'localhost:15000/drain_listeners?inboundonly&graceful&skip_exit'; while [ $(ss -Htlp state all | grep -vE '(envoy|pilot-agent|TIME-WAIT)' | wc -l | xargs ) -ne 0 ]; do sleep 1; done"]
