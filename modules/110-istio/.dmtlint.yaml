linters-settings:
  container:
    exclude-rules:
      read-only-root-filesystem:
        - kind: Deployment
          name: kiali
      readiness-probe:
        - kind: Deployment
          name: operator-1x25
          container: operator
      liveness-probe:
        - kind: Deployment
          name: operator-1x25
          container: operator
      no-new-privileges:
        - kind: DaemonSet
          name: istio-cni-node
          container: install-cni
  templates:
    exclude-rules:
      service-port:
        - name: istiod
          port: http-monitoring
        - name: istiod
          port: grpc-xds
        - name: istiod
          port: https-dns
        - name: istiod
          port: https-webhook
        - name: ingressgateway
          port: tls
        - name: metadata-exporter
          port: http
        - name: api-proxy
          port: https
  module:
    conversions:
      disable: true
  rbac:
    exclude-rules:
      wildcards:
        - kind: ClusterRole
          name: d8:istio:multicluster:api-proxy
      placement:
        - kind: ServiceAccount
          name: operator-1x25  
