linters-settings:
  no-cyrillic:
    exclude-rules:
      directories:
        # The RBACv2 templates carry the localized title and description of every role and
        # capability they ship. That is product text, not a source comment: the console shows it
        # to whoever is choosing what to grant, and `d8:namespace-capability:kubernetes:view_logs`
        # on its own tells that person nothing.
        - templates/rbacv2
  container:
    exclude-rules:
      check-run-as-non-root:
        - kind: Deployment
          name: kiali
      read-only-root-filesystem:
        - kind: Deployment
          name: kiali
        - kind: DaemonSet
          name: ingressgateway
          container: istio-proxy
      controller-security-context:
        - kind: Deployment
          name: kiali
      security-context:
        - kind: Deployment
          name: kiali
      readiness-probe:
        - kind: Deployment
          name: operator-1x21
          container: operator
        - kind: Deployment
          name: operator-1x25
          container: operator
        - kind: Deployment
          name: metadata-exporter
          container: metadata-discovery
      liveness-probe:
        - kind: Deployment
          name: operator-1x21
          container: operator
        - kind: Deployment
          name: operator-1x25
          container: operator
        - kind: Deployment
          name: metadata-exporter
          container: metadata-discovery
      no-new-privileges:
        - kind: DaemonSet
          name: istio-cni-node
          container: install-cni
  templates:
    exclude-rules:
      service-port:
        - name: istiod
          port: http-monitoring
        - name: istiod
          port: grpc-xds
        - name: istiod
          port: https-dns
        - name: istiod
          port: https-webhook
        - name: ingressgateway
          port: tls
        - name: metadata-exporter
          port: http
        - name: api-proxy
          port: https
      pdb:
        - kind: Deployment
          name: operator-1x21
          container: operator
        - kind: Deployment
          name: operator-1x25
          container: operator
        - kind: DaemonSet
          name: istio-cni-node
          container: kube-rbac-proxy
  module:
    conversions:
      disable: true
  rbac:
    exclude-rules:
      wildcards:
        - kind: ClusterRole
          name: d8:istio:multicluster:api-proxy
      placement:
        - kind: ServiceAccount
          name: operator-1x21
        - kind: ServiceAccount
          name: operator-1x25  
