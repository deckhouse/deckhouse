linters-settings:
  container:
    exclude-rules:
      readiness-probe:
        - kind: Deployment
          name: operator-1x25
          container: operator
      liveness-probe:
        - kind: Deployment
          name: operator-1x25
          container: operator
        - kind: Deployment
          name: istiod-1x27
          container: discovery
        - kind: DaemonSet
          name: ztunnel
          container: istio-proxy
      no-new-privileges:
        - kind: DaemonSet
          name: istio-cni-node
          container: install-cni
      host-network-ports:
        - kind: DaemonSet
          name: istio-cni-node
          container: install-cni
  module:
    conversions:
      disable: true
  rbac:
    exclude-rules:
      wildcards:
        - kind: ClusterRole
          name: d8:istio:multicluster:api-proxy
      placement:
        - kind: ServiceAccount
          name: operator-1x25  
