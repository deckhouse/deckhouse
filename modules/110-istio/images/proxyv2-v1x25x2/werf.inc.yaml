---
{{- $istioVersion := include "get_oss_version_by_id" (list "istio-1-25" $ ) }}
{{- $istioImageVersion := (printf "v%s" (replace "." "x" $istioVersion)) }} {{- /* 1.25.2 -> v1x25x2 */}}
{{- $istioProxyCacheRev := "v1.25.2-abc32af61f354196bc8d1a011faf8dacc4dc12d7-v1" }}
{{- $istioProxyDepsRev := "v1.25.2-abc32af61f354196bc8d1a011faf8dacc4dc12d7-v1" }}
{{- $protocVersion := "22.3" }}
{{- $bazelVersion := "6.5.0" }}
#  false - start from an empty bazel disk cache and keep /tmp/bazel-cache in the
#  build-envoy-artifact image so it can be exported as a new cache revision.
#  Deps are always prepared: the build runs with --nofetch and never fetches.
#  See modules/110-istio/images/README.md for the regeneration procedure.
{{- $buildWithPreparedCache := true }}
---
# Based on https://github.com/istio/istio/blob/1.25.2/docker/Dockerfile.base
#      and https://github.com/istio/istio/blob/1.25.2/pilot/docker/Dockerfile.proxyv2
image: {{ .ModuleName }}/{{ .ImageName }}
from: common/distroless
import:
- from: {{ .ModuleName }}/common-{{ $istioImageVersion }}-src-artifact
  add: /src/istio/tools/packaging/common/envoy_bootstrap.json
  to: /var/lib/istio/envoy/envoy_bootstrap_tmpl.json
  owner: 1337
  group: 1337
  after: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-agent-artifact
  add: /src/istio/out/pilot-agent
  to: /usr/local/bin/pilot-agent
  owner: 1337
  group: 1337
  after: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-build-envoy-artifact
  add: /src/proxy/bin/envoy
  to: /usr/local/bin/envoy
  owner: 1337
  group: 1337
  after: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-glibc-artifact
  add: /out/lib64/libc.so.6
  to: /lib64/libc.so.6
  before: install
- from: {{ $.ModuleName }}/{{ $.ImageName }}-glibc-artifact
  add: /out/lib64/libm.so.6
  to: /lib64/libm.so.6
  before: install
- from: {{ $.ModuleName }}/{{ $.ImageName }}-glibc-artifact
  add: /out/lib64/ld-linux-x86-64.so.2
  to: /lib64/ld-linux-x86-64.so.2
  before: install
- from: {{ $.ModuleName }}/{{ $.ImageName }}-pm-artifact
  add: /relocate-pm
  to: /
  before: setup
- from: registrypackages/iptables-static-artifact
  add: /
  to: /sbin
  includePaths:
  - xtables-legacy-multi
  - xtables-nft-multi
  before: setup
- from: common/iptables-wrapper
  add: /iptables-wrapper
  to: /sbin/iptables-wrapper
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    env: 
      ISTIO_META_ISTIO_PROXY_SHA: "istio-proxy:78bd2d9b284978e170a49cd13decd5f952544489"
      ISTIO_META_ISTIO_VERSION: {{ $istioVersion }}
    workingDir: "/"
    entrypoint: ["/usr/local/bin/pilot-agent"]
---
#=====================================================================================================
---
image: {{ .ModuleName }}/{{ .ImageName }}-agent-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
- from: {{ .ModuleName }}/common-{{ $istioImageVersion }}-src-artifact
  add: /src/istio
  to: /src/istio
  before: setup
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  beforeInstall:
  - pm install git binutils
  setup:
  - cd /src/istio/
  - echo {{ $istioVersion }} > version
  - export VERSION={{ $istioVersion }}
  - export BUILDINFO=$(mktemp)
  - |
    cat > "${BUILDINFO}" <<EOF
    istio.io/istio/pkg/version.buildVersion={{ $istioVersion }}
    istio.io/istio/pkg/version.buildGitRevision={{ $istioVersion }}
    istio.io/istio/pkg/version.buildStatus=Clean
    istio.io/istio/pkg/version.buildTag={{ $istioVersion }}
    istio.io/istio/pkg/version.buildHub=docker.io/istio
    istio.io/istio/pkg/version.buildOS=linux
    istio.io/istio/pkg/version.buildArch=amd64
    EOF
  - export GOPROXY=$(cat /run/secrets/GOPROXY) GOOS=linux GOARCH=amd64
  - export LDFLAGS='-extldflags -static -s -w'
  - go mod vendor
  - common/scripts/gobuild.sh /src/istio/out/ -tags=agent,disable_pgv /src/istio/pilot/cmd/pilot-agent
  #
  - strip /src/istio/out/pilot-agent
  #
  - chmod 0555 /src/istio/out/pilot-agent
  - chown 1337:1337 /src/istio/out/pilot-agent
---
image: {{ .ModuleName }}/{{ .ImageName }}-build-envoy-artifact
from: {{ $.ModuleName }}/{{ .ImageName }}-build-image-artifact
final: false
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /git-sources.json
  to: /src/proxy-git-sources.json
  before: install
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/proxy
  to: /src/proxy
  before: install
mount:
{{ include "mount points for golang builds" . }}
- from: tmp_dir
  to: /root/.cache/bazel
{{- if $buildWithPreparedCache }}
- from: tmp_dir
  to: /tmp/bazel-cache
{{- end }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
  #envs
  - export GOROOT=/usr/local/go GOPATH=/go
  - export PATH=${PATH}:${GOROOT}/bin:${GOPATH}/bin
  - export GO_VERSION=${GOLANG_VERSION} GOPROXY=$(cat /run/secrets/GOPROXY)
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - export TARGETARCH=amd64 ARCH="x86_64"
  - export BAZEL_VERSION="{{ $bazelVersion }}" USE_BAZEL_VERSION="{{ $bazelVersion }}"
  - cd /src/proxy
  - export BAZEL_OUTPUT_BASE=$(bazel info output_base)
  # deps: always prepared, so the build never needs the network
  - git lfs install
  - git clone --depth 1 --branch {{ $istioProxyDepsRev }} $(cat /run/secrets/SOURCE_REPO)/istio/envoy-build-deps.git /tmp/bazel-deps
  - mkdir -p ${BAZEL_OUTPUT_BASE}/external
  - tar -zxf /tmp/bazel-deps/external.tar.gz -C ${BAZEL_OUTPUT_BASE}/external
  - rm -rf /tmp/bazel-deps
  # cache: prepared, or empty and kept for export
  {{- if $buildWithPreparedCache }}
  - git clone --depth 1 --branch {{ $istioProxyCacheRev }} $(cat /run/secrets/SOURCE_REPO)/istio/envoy-build-cache.git /tmp/bazel-cache
  - rm -rf /tmp/bazel-cache/.git
  {{- else }}
  - mkdir -v -p /tmp/bazel-cache
  {{- end }}
  - |
    cat >> /src/proxy/user.bazelrc <<'EOF'
    build --nofetch
    build --disk_cache=/tmp/bazel-cache
    build --stamp
    build --config=release
    EOF
  - go mod download
  - |
    BUILD_SCM_REVISION="$(python3 - /src/proxy {{ $istioVersion }} <<'PY'
    import json, re, sys
    with open("/src/proxy-git-sources.json") as metadata:
        sources = json.load(metadata)
    matches = [s for s in sources if s["to"] == sys.argv[1] and s["tag"] == sys.argv[2]]
    if len(matches) != 1 or not re.fullmatch(r"[0-9a-f]{40}", matches[0]["commit"]):
        sys.exit("Expected exactly one Git source with a full commit SHA for " + sys.argv[1])
    print(matches[0]["commit"])
    PY
    )" || exit 1
    export BUILD_SCM_REVISION BUILD_SCM_STATUS=Clean
  - bazel build //:envoy
  # done while ${BAZEL_OUTPUT_BASE} is still in scope - each werf stage is a
  # separate shell, so it is empty in setup
  - mkdir /src/proxy/bin && mv /src/proxy/bazel-bin/envoy /src/proxy/bin/
  setup:
  - rm -rf /src/proxy/bazel-bin/envoy
  - rm -rf /src/proxy/.git
---
#=====================================================================================================
---
image: {{ .ModuleName }}/{{ .ImageName }}-golang-artifact
from: {{ index $.Images "builder/golang-alpine" }}
final: false
---
image: {{ $.ModuleName }}/{{ .ImageName }}-build-image-artifact
git:
- url: {{ $.SOURCE_REPO }}/grpc/grpc-go.git
  tag: cmd/protoc-gen-go-grpc/v1.3.0
  add: /
  to: /src/grpc-go
- url: {{ $.SOURCE_REPO }}/protocolbuffers/protobuf-go.git
  tag: v1.30.0
  add: /
  to: /src/protobuf-go
- url: {{ $.SOURCE_REPO }}/mitchellh/protoc-gen-go-json.git
  tag: v1.1.0
  add: /
  to: /src/protoc-gen-go-json
- url: {{ $.SOURCE_REPO }}/pseudomuto/protoc-gen-doc.git
  tag: v1.5.1
  add: /
  to: /src/protoc-gen-doc
from: {{ index $.Images "builder/golang-bookworm" }}
final: false
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-golang-artifact
  add: /usr/local/go
  to: /usr/local/go
  before: install
- from: common/alt-p11-artifact
  add: /root/.ssh
  to: /root/.ssh
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  beforeInstall:
  {{- include "debian packages proxy" . | nindent 2 }}
  - export DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC
  - ln -snf /usr/share/zoneinfo/${TZ} /etc/localtime && echo ${TZ} > /etc/timezone
  - |
    apt-get install -y \
    clang-14 lld-14 \
    git git-lfs cmake ninja-build \
    libtool automake autoconf make \
    curl gnupg lsb-release \
    python3 python3-pip python3-venv \
    libc++-14-dev libc++abi-14-dev \
    libssl-dev libz-dev libunwind-14-dev unzip
  # apt clean
  - apt-get autoclean && apt-get clean
  install:
  - ln -s -f /usr/lib/llvm-14/bin/clang /usr/bin/clang
  - ln -s -f /usr/lib/llvm-14/bin/clang++ /usr/bin/clang++
  # Install Go
  - export GOROOT=/usr/local/go GOPATH=/go
  - export PATH=${PATH}:${GOROOT}/bin:${GOPATH}/bin
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - export GO_VERSION=${GOLANG_VERSION} GOPROXY=$(cat /run/secrets/GOPROXY)
  - go version
  # Install protoc and plugins
  - git archive --remote "$(cat /run/secrets/SOURCE_REPO)/envoyproxy/envoyproxy_deps.git" HEAD "protoc/v{{ $protocVersion }}/protoc-{{ $protocVersion }}-linux-x86_64.zip" | tar -C /tmp -xvf -
  - unzip /tmp/protoc/v{{ $protocVersion }}/protoc-{{ $protocVersion }}-linux-x86_64.zip -x readme.txt -d /usr/local && rm -r /tmp/protoc
  - chmod o+rx /usr/local/bin/protoc && chmod o+rX -R /usr/local/include/google/
  - cd /src/grpc-go/cmd/protoc-gen-go-grpc && go install
  - cd /src/protobuf-go/cmd/protoc-gen-go && go install
  - cd /src/protoc-gen-go-json && go install
  - cd /src/protoc-gen-doc/cmd/protoc-gen-doc && go install
  - cd /src
  - rm -rf /src/grpc-go
  - rm -rf /src/protobuf-go
  - rm -rf /src/protoc-gen-go-json
  - rm -rf /src/protoc-gen-doc
  - git archive --remote "$(cat /run/secrets/SOURCE_REPO)/envoyproxy/envoyproxy_deps.git" HEAD "bazel/{{ $bazelVersion }}/bazel-{{ $bazelVersion }}-linux-x86_64" | tar -C /tmp -xvf -
  - mv "/tmp/bazel/{{ $bazelVersion }}/bazel-{{ $bazelVersion }}-linux-x86_64" "/usr/local/bin/bazel"
  - chmod +x "/usr/local/bin/bazel"
  - rm -r /tmp/bazel
imageSpec:
  config:
    env: {"GOROOT": "/usr/local/go", "GOPATH": "/go", "PATH": "${PATH}:${GOROOT}/bin:${GOPATH}/bin", "GOOS": "linux", "GOARCH": "amd64"}
---
#=====================================================================================================
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
git:
- url: {{ $.SOURCE_REPO }}/istio/proxy.git
  tag: {{ $istioVersion }}
  add: /
  to: /src/proxy
from: common/src-artifact
final: false
shell:
  setup:
  - printf '%s\n' "${WERF_GIT_SOURCES:?}" > /git-sources.json
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-glibc-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
shell:
  beforeInstall:
  - pm install libc@2.43 -d /out
{{- include "pm_binaries_artifact" (dict
      "Images" $.Images
      "name" (printf "%s/%s-pm-artifact" $.ModuleName $.ImageName)
      "packages" "bash coreutils curl findutils grep iproute2"
      "binaries" "/usr/bin/bash:/bin/bash /usr/bin/sh:/bin/sh /usr/bin/ss:/usr/sbin/ss /usr/bin/echo /usr/bin/sleep /usr/bin/wc /usr/bin/grep /usr/bin/xargs /usr/bin/curl"
      "post" (`mkdir -p "$out/sbin" /sbin
# The targets live in the final image, not here, and werf drops a symlink it cannot
# resolve inside the artifact — so each one gets a placeholder to point at. Nothing
# under /sbin is imported; only $out is.
touch /sbin/xtables-nft-multi /sbin/xtables-legacy-multi
for cmd in iptables iptables-save iptables-restore ip6tables ip6tables-save ip6tables-restore; do
  ln -sf /sbin/xtables-nft-multi "$out/sbin/${cmd}"
done
for mode in legacy nft; do
  for basecmd in iptables ip6tables; do
    for cmd in ${basecmd}-${mode} ${basecmd}-${mode}-save ${basecmd}-${mode}-restore; do
      ln -sf /sbin/xtables-${mode}-multi "$out/sbin/${cmd}"
    done
  done
done`)) }}
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
