---
{{- $istioVersion := include "get_oss_version_by_id" (list "istio-1-21" $ ) }}
{{- $istioImageVersion := (printf "v%s" (replace "." "x" $istioVersion)) }} {{- /* 1.21.6 -> v1x21x6 */}}
{{- $istioProxyCacheRev := "v1.21.6-5c3dc559371181d5baa4a7533c36f2370fc97581-bookworm-v1" }}
{{- $istioProxyDepsRev := "v1.21.6-5c3dc559371181d5baa4a7533c36f2370fc97581-bookworm-v1" }}
{{- $protocVersion := "22.3" }}
{{- $bazelVersion := "6.3.2" }}
{{- $iptables_version := "1.8.9" }}
{{- $iptables_image_version := $iptables_version | replace "." "-" }}
#  to force manual creation of fresh build cache. If false - /tmp/bazel-cache & /tmp/bazel-deps will stay in build-envoy-artifact image
{{- $buildWithPreparedCacheAndDeps := false }}
---
# Based on https://github.com/istio/istio/blob/1.21.6/docker/Dockerfile.base
#      and https://github.com/istio/istio/blob/1.21.6/pilot/docker/Dockerfile.proxyv2
image: {{ .ModuleName }}/{{ .ImageName }}
fromImage: common/distroless
import:
- image: {{ .ModuleName }}/common-{{ $istioImageVersion }}-src-artifact
  add: /src/istio/tools/packaging/common/envoy_bootstrap.json
  to: /var/lib/istio/envoy/envoy_bootstrap_tmpl.json
  owner: 1337
  group: 1337
  after: setup
- image: {{ .ModuleName }}/common-{{ $istioImageVersion }}-src-artifact
  add: /src/istio/tools/packaging/common/gcp_envoy_bootstrap.json
  to: /var/lib/istio/envoy/gcp_envoy_bootstrap_tmpl.json
  owner: 1337
  group: 1337
  after: setup
- image: {{ .ModuleName }}/{{ .ImageName }}-agent-artifact
  add: /src/istio/out/pilot-agent
  to: /usr/local/bin/pilot-agent
  owner: 1337
  group: 1337
  after: setup
- image: {{ .ModuleName }}/{{ .ImageName }}-build-envoy-artifact
  add: /src/proxy/bin/envoy
  to: /usr/local/bin/envoy
  owner: 1337
  group: 1337
  after: setup
- from: {{ index $.Images "libs/glibc-v2.41" }}
  add: /lib64/libm.so.6
  to: /lib64/libm.so.6
  before: install
- from: {{ index $.Images "libs/glibc-v2.41" }}
  add: /lib64/libc.so.6
  to: /lib64/libc.so.6
  before: install
- from: {{ index $.Images "libs/glibc-v2.41" }}
  add: /lib64/ld-linux-x86-64.so.2
  to: /lib64/ld-linux-x86-64.so.2
  before: install
- image: {{ .ModuleName }}/{{ .ImageName }}-binaries-artifact
  add: /relocate
  to: /
  before: setup
- image: registrypackages/iptables-artifact-{{ $iptables_image_version }}
  add: /
  to: /sbin
  includePaths:
  - xtables-legacy-multi
  - xtables-nft-multi
  before: setup
- image: common/iptables-wrapper
  add: /iptables-wrapper
  to: /sbin/iptables-wrapper
  before: setup
- from: {{ index $.Images "tools/bash" }}
  add: /usr/bin
  to: /bin
  includePaths:
  - bash
  - sh
  before: setup
- from: {{ index $.Images "tools/iproute2" }}
  add: /sbin/ss
  to: /usr/sbin/ss
  before: setup
- from: {{ index $.Images "tools/coreutils" }}
  add: /usr/bin
  to: /usr/bin
  includePaths:
  - echo
  - sleep
  - wc
  before: setup
- from: {{ index $.Images "tools/grep" }}
  add: /usr/bin/grep
  to: /usr/bin/grep
  before: setup
- from: {{ index $.Images "tools/findutils" }}
  add: /usr/bin/xargs
  to: /usr/bin/xargs
  before: setup
- image: registrypackages/d8-curl-artifact-8-9-1
  add: /d8-curl
  to: /usr/bin/curl
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    user: "1337:1337"
    env: { "ISTIO_META_ISTIO_PROXY_SHA": "istio-proxy:78bd2d9b284978e170a49cd13decd5f952544489", "ISTIO_META_ISTIO_VERSION": "{{ $istioVersion }}" }
    workingDir: "/"
    entrypoint: ["/usr/local/bin/pilot-agent"]
---
#=====================================================================================================
---
image: {{ .ModuleName }}/{{ .ImageName }}-agent-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
- image: {{ .ModuleName }}/common-{{ $istioImageVersion }}-src-artifact
  add: /src/istio
  to: /src/istio
  before: setup
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  beforeInstall:
  - pm install git binutils
  setup:
  - cd /src/istio/
  - echo {{ $istioVersion }} > version
  - export VERSION={{ $istioVersion }}
  - export BUILDINFO=$(mktemp)
  - |
    cat > "${BUILDINFO}" <<EOF
    istio.io/istio/pkg/version.buildVersion={{ $istioVersion }}
    istio.io/istio/pkg/version.buildGitRevision={{ $istioVersion }}
    istio.io/istio/pkg/version.buildStatus=Clean
    istio.io/istio/pkg/version.buildTag={{ $istioVersion }}
    istio.io/istio/pkg/version.buildHub=docker.io/istio
    istio.io/istio/pkg/version.buildOS=linux
    istio.io/istio/pkg/version.buildArch=amd64
    EOF
  - export GOOS=linux GOARCH=amd64
  - export LDFLAGS='-extldflags -static -s -w'
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod vendor
  - common/scripts/gobuild.sh /src/istio/out/ -tags=agent,disable_pgv /src/istio/pilot/cmd/pilot-agent
  #
  - strip /src/istio/out/pilot-agent
  #
  - chmod 0555 /src/istio/out/pilot-agent
  - chown 1337:1337 /src/istio/out/pilot-agent
---
image: {{ .ModuleName }}/{{ .ImageName }}-build-envoy-artifact
fromImage: {{ $.ModuleName }}/{{ .ImageName }}-build-image-artifact
final: false
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/proxy
  to: /src/proxy
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
  #envs
  - export GOROOT=/usr/local/go GOPATH=/go
  - export PATH=${PATH}:${GOROOT}/bin:${GOPATH}/bin
  - export GO_VERSION=${GOLANG_VERSION} GOPROXY=$(cat /run/secrets/GOPROXY)
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - export TARGETARCH=amd64 ARCH="x86_64"
  - export BAZEL_VERSION="{{ $bazelVersion }}" USE_BAZEL_VERSION="{{ $bazelVersion }}"
  # The upstream 1.21.6 tag of istio/proxy references a broken envoy revision, pin a working one.
  - cd /src/proxy
  - sed -i 's|ENVOY_SHA = "94aa5f7f82fb543e7fbc011ea398ac12cc396817"|ENVOY_SHA = "5c3dc559371181d5baa4a7533c36f2370fc97581"|' WORKSPACE
  - sed -i 's|ENVOY_SHA256 = "092784be59d19e99343afc095c1a65eca916b0b3f218d48545a6f0d43cdd5885"|ENVOY_SHA256 = "17f36c4267570e64123e3f08cdf8fc9442634572c5dc87f3f4192d953a4d29bf"|' WORKSPACE
  # cache
  - export BAZEL_OUTPUT_BASE=$(bazel info output_base)
  {{- if $buildWithPreparedCacheAndDeps }}
  - git clone --depth 1 --branch {{ $istioProxyCacheRev }} $(cat /run/secrets/SOURCE_REPO)/istio/envoy-build-cache.git /tmp/bazel-cache
  - rm -rf /tmp/bazel-cache/.git
  - git lfs install
  - git clone --depth 1 --branch {{ $istioProxyDepsRev }} $(cat /run/secrets/SOURCE_REPO)/istio/envoy-build-deps.git /tmp/bazel-deps
  - mkdir -p ${BAZEL_OUTPUT_BASE}/external
  - tar -zxf /tmp/bazel-deps/external.tar.gz -C ${BAZEL_OUTPUT_BASE}/external
  - rm -rf /tmp/bazel-deps
  - |
    cat >> /src/proxy/user.bazelrc <<'EOF'
    build --nofetch
    EOF
  {{- else }}
  - mkdir -v -p /tmp/bazel-cache
  - mkdir -p ${BAZEL_OUTPUT_BASE}/external
  {{- end }}
  - |
    cat >> /src/proxy/user.bazelrc <<'EOF'
    build --disk_cache=/tmp/bazel-cache
    build --stamp
    build --config=release
    EOF
  - go mod download
  - bazel build //:envoy
  setup:
  - mkdir /src/proxy/bin && mv /src/proxy/bazel-bin/envoy /src/proxy/bin/
  {{- if $buildWithPreparedCacheAndDeps }}
  - rm -rf /tmp/bazel-cache
  - rm -rf ${BAZEL_OUTPUT_BASE}/external
  {{- end }}
  - rm -rf /src/proxy/bazel-bin/envoy
  - rm -rf /src/proxy/.git
---
image: {{ .ModuleName }}/{{ .ImageName }}-binaries-artifact
fromImage: common/relocate-artifact
final: false
shell:
  beforeInstall:
  - apt-get update && apt-get install -y ca-certificates
  - update-ca-trust
  - apt-get clean
  - rm -rf  /var/log/*log /var/lib/apt/lists/* /var/log/apt/* /var/lib/dpkg/*-old /var/cache/debconf/*-old
  install:
  - mkdir -p /relocate/sbin
  - |
    for cmd in iptables iptables-save iptables-restore ip6tables ip6tables-save ip6tables-restore; do
      ln -sf /sbin/xtables-nft-multi "/relocate/sbin/${cmd}"
    done
    # broken symlinks are not imported from the artifact
    touch /sbin/iptables-wrapper
  - |
    for mode in legacy nft; do
      for basecmd in iptables ip6tables; do
        for cmd in ${basecmd}-${mode} ${basecmd}-${mode}-save ${basecmd}-${mode}-restore; do
          ln -sf /sbin/xtables-${mode}-multi "/relocate/sbin/${cmd}"
        done
      done
    done
---
#=====================================================================================================
---
image: {{ .ModuleName }}/{{ .ImageName }}-golang-artifact
from: {{ index $.Images "builder/golang-alpine" }}
final: false
---
image: {{ $.ModuleName }}/{{ .ImageName }}-build-image-artifact
from: {{ index $.Images "builder/golang-bookworm" }}
final: false
mount:
{{ include "mount points for golang builds" . }}
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-golang-artifact
  add: /usr/local/go
  to: /usr/local/go
  before: install
- image: common/alt-p11-artifact
  add: /root/.ssh
  to: /root/.ssh
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  beforeInstall:
  {{- include "debian packages proxy" . | nindent 2 }}
  - export DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC
  - ln -snf /usr/share/zoneinfo/${TZ} /etc/localtime && echo ${TZ} > /etc/timezone
  - |
    apt-get install -y \
    clang-14 lld-14 \
    git git-lfs cmake ninja-build \
    libtool automake autoconf make \
    curl gnupg lsb-release \
    python3 python3-pip python3-venv \
    libc++-14-dev libc++abi-14-dev \
    libssl-dev libz-dev libunwind-14-dev unzip
  # apt clean
  - apt-get autoclean && apt-get clean
  install:
  - ln -s -f /usr/lib/llvm-14/bin/clang /usr/bin/clang
  - ln -s -f /usr/lib/llvm-14/bin/clang++ /usr/bin/clang++
  # Install Go
  - export GOROOT=/usr/local/go GOPATH=/go
  - export PATH=${PATH}:${GOROOT}/bin:${GOPATH}/bin
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - export GO_VERSION=${GOLANG_VERSION} GOPROXY=$(cat /run/secrets/GOPROXY)
  - go version
  # Install protoc and plugins
  - git archive --remote "$(cat /run/secrets/SOURCE_REPO)/envoyproxy/envoyproxy_deps.git" HEAD "protoc/v{{ $protocVersion }}/protoc-{{ $protocVersion }}-linux-x86_64.zip" | tar -C /tmp -xvf -
  - unzip /tmp/protoc/v{{ $protocVersion }}/protoc-{{ $protocVersion }}-linux-x86_64.zip -x readme.txt -d /usr/local && rm -r /tmp/protoc
  - chmod o+rx /usr/local/bin/protoc && chmod o+rX -R /usr/local/include/google/
  - git clone --depth 1 --branch cmd/protoc-gen-go-grpc/v1.3.0 $(cat /run/secrets/SOURCE_REPO)/grpc/grpc-go.git /src/grpc-go
  - git clone --depth 1 --branch v1.30.0 $(cat /run/secrets/SOURCE_REPO)/protocolbuffers/protobuf-go.git /src/protobuf-go
  - git clone --depth 1 --branch v1.1.0 $(cat /run/secrets/SOURCE_REPO)/mitchellh/protoc-gen-go-json.git /src/protoc-gen-go-json
  - git clone --depth 1 --branch v1.5.1 $(cat /run/secrets/SOURCE_REPO)/pseudomuto/protoc-gen-doc.git /src/protoc-gen-doc
  - cd /src/grpc-go/cmd/protoc-gen-go-grpc && go install
  - cd /src/protobuf-go/cmd/protoc-gen-go && go install
  - cd /src/protoc-gen-go-json && go install
  - cd /src/protoc-gen-doc/cmd/protoc-gen-doc && go install
  - cd /src
  - rm -rf /src/grpc-go
  - rm -rf /src/protobuf-go
  - rm -rf /src/protoc-gen-go-json
  - rm -rf /src/protoc-gen-doc
  - git archive --remote "$(cat /run/secrets/SOURCE_REPO)/envoyproxy/envoyproxy_deps.git" HEAD "bazel/{{ $bazelVersion }}/bazel-{{ $bazelVersion }}-linux-x86_64" | tar -C /tmp -xvf -
  - mv "/tmp/bazel/{{ $bazelVersion }}/bazel-{{ $bazelVersion }}-linux-x86_64" "/usr/local/bin/bazel"
  - chmod +x "/usr/local/bin/bazel"
  - rm -r /tmp/bazel
imageSpec:
  config:
    env: {"GOROOT": "/usr/local/go", "GOPATH": "/go", "PATH": "${PATH}:${GOROOT}/bin:${GOPATH}/bin", "GOOS": "linux", "GOARCH": "amd64"}
---
#=====================================================================================================
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
fromImage: common/src-artifact
final: false
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
  - git clone --depth 1 --branch {{ $istioVersion }} $(cat /run/secrets/SOURCE_REPO)/istio/proxy.git /src/proxy
  - cd /src/proxy/
  - git apply --verbose /patches/*.patch
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
