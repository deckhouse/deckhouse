{{- range $instance := .Values.prometheusPushgateway.instances }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $instance | quote }}
  namespace: kube-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list $ (dict "name" $instance "app" "prometheus-pushgateway")) | nindent 2 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http-metrics
    port: 9091
    targetPort: http-metrics
  selector:
    app: {{ $instance | quote }}
{{- end }}
