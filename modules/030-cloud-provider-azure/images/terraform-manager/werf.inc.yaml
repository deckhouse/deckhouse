{{- $version := include "get_oss_version_by_id" (list "terraform-provider-azure" $) }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: scratch
git:
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi
  to: /candi
  excludePaths:
  - '**/terraform_versions.yml'
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi/terraform_versions.yml
  to: /terraform-manager/terraform_versions.yml
import:
- from: terraform-provider-azure
  add: /terraform-provider-azurerm
  to: /terraform-manager/terraform-provider-azurerm
  before: setup
{{ include "image_spec_for_infrastructure_manager" . }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/src" }}
git:
- url: {{ $.SOURCE_REPO }}/hashicorp/terraform-provider-azurerm.git
  tag: v{{ $version }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src
  - rm -rf vendor/
  - rm -rf examples/
  - git apply /patches/*.patch --verbose
---
image: terraform-provider-azure
final: false
from: {{ index $.Images "builder/golang" }}
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  beforeInstall:
  - pm install git ssh-static
  install:
    - cd /src
    - export GOPROXY=$(cat /run/secrets/GOPROXY)
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -extldflags \"-static\"" -o /terraform-provider-azurerm .
    - strip /terraform-provider-azurerm
    - chmod -R 755 /terraform-provider-azurerm
    - chown 64535:64535 /terraform-provider-azurerm
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName )) }}
