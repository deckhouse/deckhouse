image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
git:
- add: /{{ $.ModulePath }}modules/800-{{ $.ModuleName }}/images/{{ $.ImageName }}/nginx.conf
  to: /usr/conf/nginx.conf
import:
  - from: {{ .ModuleName }}/{{ .ImageName }}-nginx-artifact
    add: /relocate-pm/usr/sbin/nginx
    to: /usr/sbin/nginx
    before: setup
  - from: {{ .ModuleName }}/{{ .ImageName }}-nginx-artifact
    add: /relocate-pm/usr/conf/mime.types
    to: /usr/conf/mime.types
    before: setup
  - from: {{ .ModuleName }}/{{ .ImageName }}-artifact
    add: /app
    to: /app
    before: setup
imageSpec:
  config:
    entrypoint: [ "/usr/sbin/nginx", "-g", "daemon off;" ]
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/src" }}
git:
- add: /{{ $.ModulePath }}modules/800-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
  to: /src/src
  stageDependencies:
    setup:
    - '**/*'
- add: /{{ $.ModulePath }}modules/800-{{ $.ModuleName }}/images/{{ $.ImageName }}/static
  to: /src/static
  stageDependencies:
    setup:
    - '**/*'
secrets:
- id: DECKHOUSE_PRIVATE_REPO
  value: {{ .DECKHOUSE_PRIVATE_REPO }}
shell:
  setup:
  - git clone --depth 1 --branch {{ .CandiVersionMap.d8.d8CliVersion }} git@$(cat /run/secrets/DECKHOUSE_PRIVATE_REPO):deckhouse/runtime/deckhouse-cli.git /src/deckhouse-cli
  - cd /src/deckhouse-cli
  - git describe --tags > VERSION
  - sed -i "s|sh:\ git describe --tags|sh:\ cat VERSION|" Taskfile.yml
  - rm -rf /src/deckhouse-cli/.git
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
final: false
from: {{ index $.Images "builder/golang" }}
import:
  - from: {{ .ModuleName }}/{{ .ImageName }}-frontend-artifact
    add: /app/dist
    to: /app
    before: install
  - from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
    add: /src/static
    to: /static
    before: install
  - from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
    add: /src/deckhouse-cli
    to: /src
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
- id: DECKHOUSE_PRIVATE_REPO
  value: {{ .DECKHOUSE_PRIVATE_REPO }}
shell:
  beforeInstall:
    - pm install git ssh-static make coreutils findutils file jq pkgconf gnu-glibc-devel btrfs-progs-devel task
  install:
    - export GOPROXY=$(cat /run/secrets/GOPROXY)
    - export PRIVATE_REPO=$(cat /run/secrets/DECKHOUSE_PRIVATE_REPO)
    - export GOPRIVATE="flant.internal"
    - git config --global url."ssh://git@${PRIVATE_REPO}/".insteadOf "https://flant.internal/"
    - git config --global --add safe.directory '*'
    - mkdir -p ~/.ssh
    - touch ~/.ssh/known_hosts
    - ssh-keyscan -H ${PRIVATE_REPO} >> ~/.ssh/known_hosts

    - cd /src
    # Build with the pinned version: git describe in the clone can pick another tag on the same commit.
    - task build:dist:all version={{ .CandiVersionMap.d8.d8CliVersion }}
    - mkdir -p /app/files/d8-cli
    - mv dist/{{ .CandiVersionMap.d8.d8CliVersion }}/* /app/files/d8-cli
    - jq '[.[] | .version="{{ .CandiVersionMap.d8.d8CliVersion }}"]' /static/tools.json > /app/tools.json
    - mv /static/robots.txt /app
    - rm ~/.gitconfig # Prevent PRIVATE_REPO_TOKEN from leaking into the image layer
---
image: {{ .ModuleName }}/{{ .ImageName }}-frontend-artifact
final: false
from: {{ .Images.BASE_NODE_20_ALPINE }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/src
  to: /app
  before: setup
mount:
- from: tmp_dir
  to: /app/node_modules
- from: tmp_dir
  to: /root/.npm/_cacache
- from: tmp_dir
  to: /tmp/node-complile-cache
shell:
  setup:
  {{- include "node packages proxy" . | nindent 2 }}
  - cd /app
  - npm install
  - npm run build
  - chown 64535:64535 /app
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName )) }}
{{- include "pm_binaries_artifact" (dict
      "Images" $.Images
      "name" (printf "%s/%s-nginx-artifact" $.ModuleName $.ImageName)
      "packages" "nginx"
      "binaries" "/usr/sbin/nginx"
      "post" `mkdir -p "$out/usr/conf"
cp /out/usr/conf/mime.types "$out/usr/conf/mime.types"
# Only the binary and mime.types are imported, so a pm nginx that stops being static
# would arrive without its libraries.
if patchelf --print-interpreter "$out/usr/sbin/nginx" >/dev/null 2>&1; then
  echo "FATAL: nginx from pm is no longer statically linked" >&2
  exit 1
fi`) }}
