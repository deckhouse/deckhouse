{{- $moduleGateway := dict }}
{{- include "helm_lib_module_gateway" (list . $moduleGateway) }}
{{- $ingressEnabled := eq (include "helm_lib_module_ingress_enabled" .) "true" }}
{{- $gatewayEnabled := eq (include "helm_lib_module_gateway_enabled" .) "true" }}
{{- if and (not (.Values.global.enabledModules | has "user-authn")) .Values.global.clusterIsBootstrapped (or $ingressEnabled (and $gatewayEnabled $moduleGateway)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: tools-basic-auth
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "deckhouse-tools")) | nindent 2 }}
type: Opaque
data:
  auth: {{ print "admin:{PLAIN}" .Values.deckhouseTools.internal.auth.password | b64enc | quote }}
{{- end }}
