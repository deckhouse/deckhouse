properties:
  nodeSelector:
    description: |
      Структура, аналогичная `spec.nodeSelector` пода Kubernetes.

      Если значение не указано или указано `false`, будет использоваться [автоматика](https://deckhouse.ru/products/kubernetes-platform/documentation/v1/#выделение-узлов-под-определенный-вид-нагрузки).
  tolerations:
    description: |
      Структура, аналогичная `spec.tolerations` пода Kubernetes.

      Если значение не указано или указано `false`, будет использоваться [автоматика](https://deckhouse.ru/products/kubernetes-platform/documentation/v1/#выделение-узлов-под-определенный-вид-нагрузки).
  logLevel:
    description: |
      Уровень логирования компонентов VPA: recommender, updater и admission-controller.

      Каждый уровень включает сообщения менее подробных уровней. Некоторые информационные сообщения и предупреждения, например сообщения при запуске, записываются в лог при любом уровне.

      Поддерживаются следующие значения:

      - `Error` — ошибки и важные сообщения, которые VPA пишет на уровне info, например о неудачных вытеснениях и in-place обновлениях;
      - `Warning` — предупреждения, версия компонента при запуске и вытеснения подов из-за нехватки ресурсов на узле, которые обрабатывает recommender (по умолчанию);
      - `Info` — действия с подами, например вытеснение, изменение ресурсов in-place и установка ресурсов создаваемым подам;
      - `Debug` — ход каждого цикла recommender и подробная информация о решениях по каждому поду и контейнеру, например почему под не был обновлён. Создаёт очень большой объём логов, поэтому используйте его только для диагностики проблем;
      - `Trace` — каждый запрос к Kubernetes API. Используйте его, только если для поиска проблемы не хватает `Debug`.
