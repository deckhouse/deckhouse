---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
vex: {{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/known_vulnerabilities.vex
import:
- from: {{ .ModuleName }}/vertical-pod-autoscaler-artifact
  add: /recommender
  to: /recommender
  before: setup
imageSpec:
  config:
    entrypoint: ["/recommender"]
