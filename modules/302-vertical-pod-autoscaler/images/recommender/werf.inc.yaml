---
image: {{ .ModuleName }}/{{ .ImageName }}
from: common/distroless
import:
- from: {{ .ModuleName }}/vertical-pod-autoscaler-artifact
  add: /recommender
  to: /recommender
  before: setup
imageSpec:
  config:
    entrypoint: ["/recommender"]
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName )) }}
