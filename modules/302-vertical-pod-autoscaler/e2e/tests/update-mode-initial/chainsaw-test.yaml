apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vpa-update-mode-initial
spec:
  description: Checks that a VerticalPodAutoscaler in the Initial update mode applies its recommendation only to pods created after the recommendation exists, so the two running pods of an idle Deployment keep their requests with no evictions and no in-place resizes, while the pod added by scaling the Deployment up carries the recommendation. A control Deployment with a Recreate VerticalPodAutoscaler in the same namespace has its pods evicted and recreated. The control VerticalPodAutoscaler is created only after the subject has a recommendation, so every control eviction happened in an updater cycle that already saw the subject's recommendation.
  namespace: e2e-vpa-update-mode-initial
  steps:
    - name: prepare-namespace
      description: Prepare the test namespace and remove it at the end
      use:
        template: ../common/steps/test-namespace.yaml
    - name: check-vpa-components
      description: The cluster runs Kubernetes 1.33 or newer, the vertical-pod-autoscaler module is enabled and its components are available
      use:
        template: ../common/steps/vpa-components-ready.yaml
    - name: create-subject-deployment
      description: Create the idle Deployment subject with two replicas and wait until they are available
      use:
        template: ../common/steps/idle-deployment-available.yaml
    - name: create-control-deployment
      description: Create the idle Deployment control with two replicas and wait until they are available
      use:
        template: ../common/steps/idle-deployment-available.yaml
        with:
          bindings:
            - name: workload
              value: control
    - name: create-subject-vpa
      description: Create the VerticalPodAutoscaler subject in the Initial update mode
      use:
        template: ../common/steps/create-vpa.yaml
        with:
          bindings:
            - name: updateMode
              value: Initial
    - name: wait-subject-recommendation
      description: The VerticalPodAutoscaler subject gets a recommendation above the requests of the workload
      use:
        template: ../common/steps/wait-recommendation.yaml
    - name: create-control-vpa
      description: Create the control VerticalPodAutoscaler in the Recreate update mode, only now that the subject has a recommendation
      use:
        template: ../common/steps/create-vpa.yaml
        with:
          bindings:
            - name: workload
              value: control
            - name: updateMode
              value: Recreate
    - name: wait-control-pods-recreated
      description: The updater evicts the pods of the Deployment control, the ReplicaSet controller recreates them and the admission controller sets their requests and the vpaUpdates annotation
      try:
        - description: Assert both control pods are running and carry the vpaUpdates annotation
          assert:
            timeout: 8m
            resource:
              (x_k8s_list($client, 'v1', 'Pod', $namespace).items[?metadata.labels.app == 'control' && metadata.deletionTimestamp == null]):
                (length(@)): 2
                (length([?status.phase == 'Running'])): 2
                (length([?metadata.annotations.vpaUpdates != null])): 2
    - name: check-subject-pods-unchanged
      description: The pods of the Deployment subject are the original ones, created before the VerticalPodAutoscaler subject, keep their requests, have no VPA annotations and are not restarted
      try:
        - description: Assert both subject pods were created before the VerticalPodAutoscaler subject, so no pod was evicted and recreated, keep the original requests, have no vpaUpdates and vpaInPlaceUpdated annotations and no restarts
          assert:
            bindings:
              - name: vpaCreated
                value: (x_k8s_get($client, 'autoscaling.k8s.io/v1', 'VerticalPodAutoscaler', $namespace, 'subject').metadata.creationTimestamp)
            resource:
              (x_k8s_list($client, 'v1', 'Pod', $namespace).items[?metadata.labels.app == 'subject' && metadata.deletionTimestamp == null]):
                (length(@)): 2
                (length([?spec.containers[0].resources.requests.cpu == '10m' && spec.containers[0].resources.requests.memory == '16Mi'])): 2
                (length([?metadata.annotations.vpaUpdates == null && metadata.annotations.vpaInPlaceUpdated == null])): 2
                (length([?status.containerStatuses[0].restartCount < `1`])): 2
                (length([?time_before(metadata.creationTimestamp, $vpaCreated)])): 2
    - name: scale-subject-to-three
      description: Scale the Deployment subject up to three replicas so that one new pod is created after the recommendation exists
      try:
        - description: Patch the Deployment subject to three replicas
          patch:
            file: files/subject-replicas-3.yaml
        - description: Assert the Deployment has three replicas
          assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: subject
              spec:
                replicas: 3
    - name: wait-subject-new-pod
      description: The new pod of the Deployment subject carries the recommendation while the two original pods keep the original requests
      try:
        - description: Assert three subject pods are running, exactly one carries the vpaUpdates annotation and a changed cpu request, and two keep the original requests without the annotation
          assert:
            resource:
              (x_k8s_list($client, 'v1', 'Pod', $namespace).items[?metadata.labels.app == 'subject' && metadata.deletionTimestamp == null]):
                (length(@)): 3
                (length([?status.phase == 'Running'])): 3
                (length([?metadata.annotations.vpaUpdates != null && spec.containers[0].resources.requests.cpu != '10m'])): 1
                (length([?metadata.annotations.vpaUpdates == null && spec.containers[0].resources.requests.cpu == '10m'])): 2
    - name: check-no-eviction-for-subject
      description: The updater has not evicted any pod of the Deployment subject
      try:
        - description: Assert no EvictedByVPA event is recorded for a pod of the Deployment subject
          error:
            resource:
              apiVersion: v1
              kind: Event
              reason: EvictedByVPA
              involvedObject:
                kind: Pod
                (starts_with(name, 'subject-')): true
    - name: check-no-resize-for-subject
      description: The updater has not resized any pod of the Deployment subject in place
      try:
        - description: Assert no InPlaceResizedByVPA event is recorded for a pod of the Deployment subject
          error:
            resource:
              apiVersion: v1
              kind: Event
              reason: InPlaceResizedByVPA
              involvedObject:
                kind: Pod
                (starts_with(name, 'subject-')): true
