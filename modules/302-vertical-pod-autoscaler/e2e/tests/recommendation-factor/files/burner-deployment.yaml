# CPU burner: it keeps its 100m CPU limit busy, so the recommender sees real usage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: burner
  template:
    metadata:
      labels:
        app: burner
    spec:
      # The busy loop ignores SIGTERM, so the pod would otherwise hold the namespace deletion for the default 30 seconds.
      terminationGracePeriodSeconds: 1
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: burner
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          command: ["sh", "-c", "while :; do :; done"]
          resources:
            requests:
              cpu: 100m
              memory: 16Mi
            limits:
              cpu: 100m
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
