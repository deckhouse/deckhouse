apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: burner
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: burner
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: burner
        recommendationFactor:
          cpu: "2"
