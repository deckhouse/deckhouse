# VerticalPodAutoscaler with a recommendationFactor for the container app. It is applied with the bindings:
#   vpa - the VerticalPodAutoscaler name;
#   factor - the recommendationFactor map, for example {cpu: "1.5"}.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ($vpa)
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: absent
  resourcePolicy:
    containerPolicies:
      - containerName: app
        recommendationFactor: ($factor)
