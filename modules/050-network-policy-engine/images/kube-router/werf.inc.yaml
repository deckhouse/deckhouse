{{- $kuberouterVersion := include "get_oss_version_by_id" (list "kuberouter" $ ) }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/src" }}
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
git:
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
    to: /patches
    stageDependencies:
      install:
        - '**/*'
shell:
  install:
  - git clone --depth 1 --branch v{{ $kuberouterVersion }} $(cat /run/secrets/SOURCE_REPO)/cloudnativelabs/kube-router.git /src
  - cd /src
  - git apply /patches/001-fix-cve-gomod.patch
  - git describe --tags --dirty > GIT_COMMIT
  - rm -rf .git
---
image: {{ .ModuleName }}/kube-router-artifact
final: false
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
from: {{ index $.Images "builder/golang" }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src
  - GIT_COMMIT=$(cat GIT_COMMIT)
  - BUILD_DATE=$(date +%Y-%m-%dT%H:%M:%S%z)
  - export GOPROXY=$(cat /run/secrets/GOPROXY)
  - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-X github.com/cloudnativelabs/kube-router/v2/pkg/version.Version=${GIT_COMMIT} -X github.com/cloudnativelabs/kube-router/v2/pkg/version.BuildDate=${BUILD_DATE}" -o kube-router cmd/kube-router/kube-router.go
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-pm-artifact
  add: /relocate-pm
  to: /
  before: setup
- from: {{ .ModuleName }}/kube-router-artifact
  add: /src/kube-router
  to: /opt/bin/kube-router
  before: setup
{{- include "image mount points" . }}
shell:
  setup:
  - /usr/bin/unlink /sbin
imageSpec:
  config:
    entrypoint: ["/opt/bin/kube-router"]
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
{{- include "pm_binaries_artifact" (dict
      "Images" $.Images
      "name" (printf "%s/%s-pm-artifact" $.ModuleName $.ImageName)
      "packages" "coreutils ipset conntrack-tools iproute2 libc"
      "binaries" "/usr/bin/unlink /usr/sbin/ipset /usr/sbin/conntrack /usr/bin/ip") }}
