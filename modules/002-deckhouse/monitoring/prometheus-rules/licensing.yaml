# Metric contract for the rules below.
#
#   * d8_license_limit                  - the current quota of a metric, +Inf
#                                         while the metric is unlimited. A
#                                         comparison against +Inf is silent,
#                                         which is what an unlimited metric
#                                         should do; 0 would fire on the
#                                         customers who bought the most.
#   * d8_license_nodes{billing}         - the node allocation. The unlicensed
#                                         group is the only way the license can
#                                         be exceeded: nodes that do not fit the
#                                         server licences fall through to the
#                                         pool, so no single metric is ever
#                                         "over" on its own.
#   * d8_license_over_limit_seconds     - how long unlicensed nodes have been
#                                         there, 0 while every node is covered.
#   * d8_license_key_expires_in_seconds - absent for a key that never expires.
#                                         It reaches 0 and stops, it never goes
#                                         negative.
- name: d8.deckhouse.licensing
  rules:
  - alert: D8LicenseUnlicensedNodes
    expr: d8_license_nodes{billing="Unlicensed"} > 0
    for: 1h
    labels:
      severity_level: "5"
      tier: cluster
      d8_module: deckhouse
      d8_component: deckhouse
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: Some nodes are not covered by the cluster license.
      description: |
        The cluster runs more nodes than the license key covers.

        The alert waits for one hour on purpose: adding a replacement node before draining the old one
        briefly leaves a node uncovered, and that is a normal rotation, not a violation.

        After seven days of uninterrupted excess the cluster moves into violation. Check how long it has
        been going on and which nodes are affected:

        ```bash
        d8 k get effectivelicense deckhouse-platform -o jsonpath='{.status.allocation}{"\n"}{.status.overLimitSince}{"\n"}'
        d8 system licenses nodes
        ```

        Either reduce the cluster, or reissue the license key for the current size.

  # d8_license_compliance_state carries a `reason` label, and it is what keeps
  # these two rules honest. A cluster that was never registered sits in
  # Violation/Unregistered from its first boot: that is the state of every
  # cluster before the first key is installed, it is plainly visible in
  # EffectiveLicense, and paging somebody about it at 3am is noise. In phase 1
  # an unregistered cluster therefore never alerts; it becomes an alert only
  # once rights that did exist ran out.
  - alert: D8LicenseComplianceGrace
    expr: d8_license_compliance_state == 2
    for: 10m
    labels:
      severity_level: "5"
      tier: cluster
      d8_module: deckhouse
      d8_component: deckhouse
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_labels_as_annotations: "reason"
      summary: The cluster license is in the grace period.
      description: |
        The license rights of the cluster have run out and the grace period is running.
        When it ends, the cluster moves into violation.

        Install a valid license key:

        ```bash
        d8 system licenses
        ```

  - alert: D8LicenseComplianceViolation
    expr: d8_license_compliance_state{reason!="Unregistered"} == 3
    for: 1h
    labels:
      severity_level: "4"
      tier: cluster
      d8_module: deckhouse
      d8_component: deckhouse
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      plk_labels_as_annotations: "reason"
      summary: The cluster license is violated.
      description: |
        The license of the cluster is violated: either the rights ran out and the grace period is over,
        or nodes have been uncovered for seven days without interruption.

        Workloads keep running: the platform is not blocked. Reissue the license key — loading a new key
        is the way out of the violation.

  - alert: D8LicenseKeyExpiresSoon
    # The lower bound is not cosmetic: the series reaches 0 at the expiry, and
    # an already expired key is the business of D8LicenseComplianceGrace and
    # D8LicenseComplianceViolation, not of an "expires soon" warning.
    expr: (d8_license_key_expires_in_seconds > 0) and (d8_license_key_expires_in_seconds < 30 * 24 * 3600)
    for: 1h
    labels:
      severity_level: "7"
      tier: cluster
      d8_module: deckhouse
      d8_component: deckhouse
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: The cluster license expires soon.
      description: |
        The license key of the cluster expires within 30 days.

        Reissue it before the date shown in:

        ```bash
        d8 k get effectivelicense deckhouse-platform -o jsonpath='{.status.key.validUntil}{"\n"}'
        ```

  - alert: D8LicenseRejectedRecords
    expr: sum(d8_license_records{status!~"accepted|UnsupportedType|Renewed|Superseded|Expired|NotYetValid"}) > 0
    for: 30m
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: deckhouse
      d8_component: deckhouse
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: "markdown"
      summary: There are rejected license records.
      description: |
        At least one record of an installed license key was rejected for a reason that does not resolve
        by itself: a cluster mismatch, a revocation, a duplicate or a malformed record.

        Records that are merely renewed, superseded, expired, not yet valid or of an unknown type are
        excluded — those are normal states.

        Find the rejected records and their reasons:

        ```bash
        d8 system licenses --keys
        ```
