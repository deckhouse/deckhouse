- name: d8.deckhouse.image
  rules:
  - alert: D8DeckhouseIsNotOnReleaseChannel
    expr: max by (release_channel) (deckhouse_release_channel{release_channel=""} == 1) > 0
    labels:
      severity_level: "9"
      d8_module: deckhouse
      d8_component: deckhouse
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      summary: |
        Deckhouse isn't subscribed to any regular release channels.
      description: |
        Deckhouse in this cluster isn't subscribed to any of the regular release channels: `Alpha`, `Beta`, `EarlyAccess`, `Stable`, or `RockSolid`.

        To resolve this issue, follow these steps:

        1. Check the current release channel used in the cluster:

           ```bash
           d8 k -n d8-system  get deploy deckhouse -o json | jq '.spec.template.spec.containers[0].image' -r
           ```

        1. Subscribe to one of the regular release channels by adjusting the [`deckhouse` module configuration](https://deckhouse.io/modules/deckhouse/configuration.html#parameters-releasechannel).

  - alert: DeckhouseReleaseIsWaitingManualApproval
    expr: sum by (name) (d8_release_info{manualApproval="true", releaseQueueDepth=~"(nil|0|1)"})
    labels:
      severity_level: "9"
      d8_module: deckhouse
      d8_component: deckhouse
      tier: cluster
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      plk_ignore_labels: "name"
      summary: |
        A new Deckhouse release is awaiting manual approval.
      description: |
        A new Deckhouse release is available but requires manual approval before it can be applied.

        To approve the release, run the following command:

        ```bash
        d8 k patch DeckhouseRelease {{ $labels.name }} --type=merge -p='{"approved": true}'
        ```

  - alert: DeckhouseReleaseIsWaitingManualApproval
    expr: sum by (name) (d8_release_info{manualApproval="true", releaseQueueDepth="2"})
    labels:
      severity_level: "6"
      d8_module: deckhouse
      d8_component: deckhouse
      tier: cluster
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      plk_ignore_labels: "name"
      summary: |
        A new Deckhouse release is awaiting manual approval.
      description: |
        A new Deckhouse release is available but requires manual approval before it can be applied.

        To approve the release, run the following command:

        ```bash
        d8 k patch DeckhouseRelease {{ $labels.name }} --type=merge -p='{"approved": true}'
        ```

  - alert: DeckhouseReleaseIsWaitingManualApproval
    expr: sum by (name) (d8_release_info{manualApproval="true", releaseQueueDepth="3"})
    labels:
      severity_level: "3"
      d8_module: deckhouse
      d8_component: deckhouse
      tier: cluster
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      plk_ignore_labels: "name"
      summary: |
        A new Deckhouse release is awaiting manual approval.
      description: |
        A new Deckhouse release is available but requires manual approval before it can be applied.

        To approve the release, run the following command:

        ```bash
        d8 k patch DeckhouseRelease {{ $labels.name }} --type=merge -p='{"approved": true}'
        ```

  - alert: DeckhouseReleaseIsBlocked
    expr: sum by (name) (d8_release_info{requirementsNotMet="true"})
    labels:
      severity_level: "5"
      d8_module: deckhouse
      d8_component: deckhouse
      tier: cluster
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      summary: |
        Deckhouse release requirements haven't been met.
      description: |
        The requirements for the Deckhouse release haven't been met.

        To check the details, run the following command:

        ```bash
        d8 k describe DeckhouseRelease {{ $labels.name }}
        ```

  - alert: DeckhouseReleaseDisruptionApprovalRequired
    expr: sum by (name) (d8_release_info{disruptionApproval="true"})
    labels:
      severity_level: "4"
      d8_module: deckhouse
      d8_component: deckhouse
      tier: cluster
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      summary: |
        Deckhouse release disruption approval required.
      description: |
        The new Deckhouse release includes a disruptive update that requires manual approval.

        To check the details, run the following command:

        ```bash
        d8 k describe DeckhouseRelease {{ $labels.name }}
        ```

        To approve the disruptive update, run the following command:

        ```bash
        d8 k annotate DeckhouseRelease {{ $labels.name }} release.deckhouse.io/disruption-approved=true
        ```

  - alert: ModuleReleaseIsWaitingManualApproval
    expr: sum by (name, module) (d8_module_release_info{manualApproval="true"} * on(module) group_left sum by (module) (deckhouse_mm_module_info{enabled="true"}))
    labels:
      severity_level: "6"
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      plk_ignore_labels: "name"
      summary: |
        A new release for module `{{ $labels.module }}` is awaiting manual approval.
      description: |
        A new release for module `{{ $labels.module }}` is available but requires manual approval before it can be applied.

        To approve the module release, run the following command:

        ```bash
        d8 k annotate mr {{ $labels.name }} modules.deckhouse.io/approved="true"
        ```

  - alert: ModuleReleaseIsOutdated
    expr: sum by (name, module) (d8_module_release_info{manualApproval="true", releaseQueueDepth="1"} * on(module) group_left deckhouse_mm_module_info{enabled="true"})
    labels:
      severity_level: "9"
      d8_module: deckhouse
      d8_component: module-releases
      tier: cluster
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      plk_ignore_labels: "name"
      summary: |
        Module `{{ $labels.module }}` is 1 minor version behind the latest available release.
      description: |
        Module `{{ $labels.module }}` is running 1 minor version behind the latest available release.
        Consider updating to maintain compatibility and security.

        To approve the module release update, run the following command:

        ```bash
        d8 k annotate mr {{ $labels.name }} modules.deckhouse.io/approved="true"
        ```

  - alert: ModuleReleaseIsOutdated
    expr: sum by (name, module) (d8_module_release_info{manualApproval="true", releaseQueueDepth="2"} * on(module) group_left deckhouse_mm_module_info{enabled="true"})
    labels:
      severity_level: "7"
      d8_module: deckhouse
      d8_component: module-releases
      tier: cluster
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      plk_ignore_labels: "name"
      summary: |
        Module `{{ $labels.module }}` is 2 minor versions behind the latest available release.
      description: |
        Module `{{ $labels.module }}` is running 2 minor versions behind the latest available release.
        Updating is recommended to maintain compatibility and access to latest features.

        To approve the module release update, run the following command:

        ```bash
        d8 k annotate mr {{ $labels.name }} modules.deckhouse.io/approved="true"
        ```

  - alert: ModuleReleaseIsOutdated
    expr: sum by (name, module) (d8_module_release_info{manualApproval="true"} * on(module) group_left deckhouse_mm_module_info{enabled="true"})
      and on(name, module) sum by (name, module) (d8_module_release_info{releaseQueueDepth!="nil"})
      and on(name, module) sum by (name, module) (d8_module_release_info{releaseQueueDepth!="1", releaseQueueDepth!="2"})
    labels:
      severity_level: "5"
      d8_module: deckhouse
      d8_component: module-releases
      tier: cluster
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      plk_ignore_labels: "name"
      summary: |
        Module `{{ $labels.module }}` is {{ $labels.versionLag }} or more minor versions behind the latest available release.
      description: |
        Module `{{ $labels.module }}` is running {{ $labels.versionLag }} or more minor versions behind the latest available release.
        This module is significantly outdated and may have compatibility issues.

        To approve the module release update, run the following command:

        ```bash
        d8 k annotate mr {{ $labels.name }} modules.deckhouse.io/approved="true"
        ```

  - alert: ModuleIsInMaintenanceMode
    expr: sum(deckhouse_mm_module_maintenance{state="NoResourceReconciliation"}) by (module) > 0
    labels:
      severity_level: "6"
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      plk_ignore_labels: "name"
      summary: |
        Module `{{ $labels.module }}` is running in maintenance mode.
      description: |
        Module `{{ $labels.module }}` is running in maintenance mode. In this mode, its state is not reconciled, which prevents configuration or hook changes from being applied automatically.

        To switch the module back to normal mode, edit the corresponding ModuleConfig resource with the following command:

        ```bash
        d8 k patch moduleconfig {{ $labels.module }} --type=json -p='[{"op": "remove", "path": "/spec/maintenance"}]'
        ```

  - alert: ApplicationIsInMaintenanceMode
    expr: sum(deckhouse_application_maintenance{state="NoResourceReconciliation"}) by (namespace, name) > 0
    labels:
      severity_level: "6"
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      summary: |
        Application `{{ $labels.name }}` in namespace `{{ $labels.namespace }}` is running in maintenance mode.
      description: |
        Application `{{ $labels.name }}` in namespace `{{ $labels.namespace }}` is running in maintenance mode. In this mode, its state is not reconciled, which prevents configuration or hook changes from being applied automatically.

        To switch the application back to normal mode, edit the corresponding Application resource with the following command:

        ```bash
        d8 k patch application {{ $labels.name }} -n {{ $labels.namespace }} --type=json -p='[{"op": "remove", "path": "/spec/maintenance"}]'
        ```

  - alert: DeckhouseReleaseNotificationNotSent
    expr: sum by (name) (d8_release_info{notificationNotSent="true"})
    labels:
      severity_level: "4"
      d8_module: deckhouse
      d8_component: deckhouse
      tier: cluster
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      summary: |
        Deckhouse release notification webhook hasn't been sent.
      description: |
        The Deckhouse release notification webhook failed to send.

        To check the notification webhook address, run the following command:

        ```bash
        d8 k get mc deckhouse -o yaml
        ```

  - alert: ModuleReleaseIsBlockedByRequirements
    expr: sum by (name, module) (d8_module_release_info{requirementsNotMet="true"} * on(module) group_left sum by (module) (deckhouse_mm_module_info{enabled="true"}))
    labels:
      severity_level: "6"
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      plk_ignore_labels: "name"
      summary: |
        A new release for module `{{ $labels.module }}` has been blocked due to unmet requirements.
      description: |
        A new release for module `{{ $labels.module }}` has been blocked because it doesn't meet the required conditions.

        To check the requirements, run the following command:

        ```bash
        d8 k  get mr {{ $labels.name }} -o json | jq .spec.requirements
        ```

  - alert: D8HasModuleConfigAllowedToDisable
    expr: max by (module) (d8_moduleconfig_allowed_to_disable) >= 1
    for: 3m
    labels:
      severity_level: "4"
      d8_module: deckhouse
      d8_component: deckhouse
      tier: cluster
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      summary: |
        The ModuleConfig annotation for allowing module disabling is set.
      description: |
        The ModuleConfig is pending module disabling.

        It is recommended that you keep your module configurations clean by removing unnecessary approval annotations.

        If you ignore this alert and do not clear the annotation, the module may be accidentally removed from the cluster, potentially leading to irreversible consequences.

        To resolve this issue and stop the alert, run the following command:

        ```bash
        d8 k annotate moduleconfig {{ $labels.module }} modules.deckhouse.io/allow-disabling-
        ```

  - alert: ModuleAtConflict
    expr: max by (module) (d8_module_at_conflict) >= 1
    labels:
      severity_level: "4"
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      summary: |
        Conflict detected for module {{ $labels.module }}.
      description: |
        Deckhouse has detected conflicting sources for the {{ $labels.module }} module: it is available from more than one ModuleSource and no source is selected, so the module is not deployed.

        To resolve this issue, follow these steps:

        1. List the sources that provide the module:

           ```bash
           d8 k get module {{ $labels.module }} -o jsonpath='{.properties.availableSources}{"\n"}'
           ```

        1. Compare what each source offers, so you pick the one you actually want:

           ```bash
           d8 k get modulerelease -l module={{ $labels.module }}
           ```

        1. Select the source in the module configuration:

           ```bash
           d8 k patch moduleconfig {{ $labels.module }} --type=merge -p '{"spec":{"source":"<SOURCE_NAME>"}}'
           ```

        1. Verify that the module has left the `Conflict` phase. The `SOURCE` and `PHASE` columns show the result:

           ```bash
           d8 k get module {{ $labels.module }}
           ```

  - alert: ModuleConfigObsoleteVersion
    expr: max by (name, version, latest) (d8_module_config_obsolete_version) >= 1
    labels:
      severity_level: "4"
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      summary: |
        ModuleConfig `{{ $labels.name }}` uses obsolete settings version {{ $labels.version }}, the latest one is {{ $labels.latest }}.
      description: |
        Deckhouse has detected that ModuleConfig `{{ $labels.name }}` has `spec.version: {{ $labels.version }}`, while the latest settings schema version of the `{{ $labels.name }}` module is {{ $labels.latest }}.

        Deckhouse converts `spec.settings` from version {{ $labels.version }} to version {{ $labels.latest }} on the fly, so the module keeps working, but the stored configuration remains outdated. Support for version {{ $labels.version }} may be dropped in a future release.

        To resolve this issue, follow these steps:

        1. Review the migration notes for the `{{ $labels.name }}` module settings, one line per conversion step:

           ```bash
           d8 k get modulesettingsdefinition {{ $labels.name }} -o jsonpath='{range .spec.versions[*].conversions[*]}{.descriptions.en}{"\n"}{end}'
           ```

        1. Migrate `spec.settings` accordingly and set `spec.version` to {{ $labels.latest }}:

           ```bash
           d8 k edit moduleconfig {{ $labels.name }}
           ```

        1. Verify that the version has been updated and no warnings are left:

           ```bash
           d8 k get moduleconfig {{ $labels.name }} -o jsonpath='{.spec.version}{"\t"}{.status.message}{"\n"}'
           ```

  - alert: ModuleHasDeprecatedUpdatePolicy
    expr: max by (module, updatePolicy) (d8_deprecated_update_policy) >= 1
    labels:
      severity_level: "4"
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      summary: |
        Module `{{ $labels.module }}` is matched by the deprecated update policy `{{ $labels.updatePolicy }}`.
      description: |-
        Deckhouse has detected that the module `{{ $labels.module }}` is using the deprecated update policy `{{ $labels.updatePolicy }}`. The `v1alpha1` policy has a selector that no longer functions.

        To specify the update policy in the module configuration, run the following command:

        ```bash
        d8 k patch moduleconfig {{ $labels.module }} --type='json' -p='[{"op": "add", "path": "/spec/updatePolicy", "value": "{{ $labels.updatePolicy }}"}]'
        ```

        After resolving all alerts related to the update policy `{{ $labels.updatePolicy }}`, clear the selector by running the following command:

        ```bash
        d8 k patch moduleupdatepolicies.v1alpha1.deckhouse.io {{ $labels.updatePolicy }} --type='json' -p='[{"op": "replace", "path": "/spec/moduleReleaseSelector/labelSelector/matchLabels", "value": {"": ""}}]'
        ```

  - alert: DeckhouseHighMemoryUsage
    expr: max by (pod, node) (container_memory_working_set_bytes{namespace="d8-system", container="deckhouse"} / container_spec_memory_limit_bytes{namespace="d8-system", container="deckhouse"} > 0.85)
    for: 30s
    labels:
      severity_level: "3"
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      description: |
        Deckhouse pod `{{ $labels.pod }}` on node `{{ $labels.node }}` has high memory usage.

        Please, if possible, get the dumps for debugging purposes (it will take around 30 seconds):

        ```bash
        curl -s "http://$(d8 k -n d8-system get pod {{ $labels.pod }} -o jsonpath='{.status.hostIP}'):4222/debug/pprof/heap" -o /tmp/heap.pprof
        curl -s "http://$(d8 k -n d8-system get pod {{ $labels.pod }} -o jsonpath='{.status.hostIP}'):4222/debug/pprof/goroutine" -o /tmp/goroutine.pprof
        curl -s "http://$(d8 k -n d8-system get pod {{ $labels.pod }} -o jsonpath='{.status.hostIP}'):4222/debug/pprof/profile?seconds=30" -o /tmp/cpu.pprof
        ```

        and send these files (/tmp/heap.pprof, /tmp/cpu.pprof and /tmp/goroutine.pprof) to the support team.
      summary: |
        Deckhouse memory usage is too high.

  - alert: D8ModuleOutdatedByMajorVersion
    expr: sum by (name, module, majorReleaseName, fromToName) (d8_module_release_info{majorReleaseDepth!~"(nil|0)", majorReleaseName!="nil"} * on(module) group_left deckhouse_mm_module_info{enabled="true"})
    labels:
      severity_level: "9"
      d8_module: deckhouse
      d8_component: module-releases
      tier: cluster
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      plk_ignore_labels: "name,majorReleaseName,fromToName"
      summary: |
        Module `{{ $labels.module }}` is running {{ $labels.majorReleaseDepth }} major versions behind.
      description: |
        Module `{{ $labels.module }}` is running {{ $labels.majorReleaseDepth }} major versions behind on major version releases.
        Major version updates may contain breaking changes and require immediate attention and careful planning.

        To check the module releases status, run the following command:

        ```bash
        d8 k get mr -l module={{ $labels.module }}
        ```{{ if ne $labels.majorReleaseName "nil" }}{{ if ne $labels.fromToName "nil" }}

        This major release has from-to version constraints that must be met before applying the update.
        To check the update instructions (from-to versions), run the following command:

        ```bash
        d8 k get mr {{ $labels.name }} -o jsonpath='{.spec.update.versions[*]}'
        ```

        This will show you the update paths including the from-to versions defined in the release.{{ end }}

        To approve the module major release update, run the following command:

        ```bash
        d8 k annotate mr {{ $labels.name }} modules.deckhouse.io/approved="true"
        ```{{ end }}

  - alert: ModuleIsDeprecated
    expr: d8_telemetry_is_deprecated_module_enabled >= 1
    labels:
      severity_level: "9"
      d8_module: deckhouse
      d8_component: deckhouse
      tier: cluster
    annotations:
      plk_markup_format: "markdown"
      plk_protocol_version: "1"
      summary: |
        Module `{{ $labels.module }}` is deprecated.
      description: |
        The module `{{ $labels.module }}` is deprecated and will not receive new updates. The module may be removed in a future release, so disable it in a controlled manner rather than waiting for it to disappear.

        To resolve this issue, follow these steps:

        1. Check the module state before changing anything. The `STAGE` column reads `Deprecated`, and the conditions show whether anything still runs:

           ```bash
           d8 k get module {{ $labels.module }}
           ```

        1. Find out whether other modules declare a dependency on it:

           ```bash
           d8 k get modules -o json | jq -r '.items[] | select(.properties.requirements.modules | has("{{ $labels.module }}")) | .metadata.name'
           ```

        1. Once nothing depends on it and its workloads are no longer needed, disable the module:

           ```bash
           d8 k patch moduleconfig {{ $labels.module }} --type=merge -p '{"spec":{"enabled":false}}'
           ```
