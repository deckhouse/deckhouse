x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    x-required-for-helm:
    - currentReleaseImageName
    properties:
      namespaces:
        type: array
        default: []
        items:
          type: string
        x-examples:
        - ["test1", "test2"]
      chrootMode:
        type: boolean
        default: false
      releaseVersionImageHash:
        type: string
      currentReleaseImageName:
        type: string
        pattern: '^[a-zA-Z0-9\.\/@:\-_]+$'
        x-examples: ["registry.example.com/deckhouse:imageHash-deckhouse"]
      webhookHandlerCert:
        type: object
        default: {}
        x-required-for-helm:
        - crt
        - key
        - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      admissionWebhookCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      configMapName:
        type: string
        x-examples: ["deckhouse"]
      registry:
        type: object
        default: {}
        properties:
          v2Active:
            type: boolean
            default: false
            description: |
              Whether the registry module runs its current implementation on this
              cluster, read from the presence of its handover record.

              What it gates: the legacy registry contour (`d8-system/registry-config`),
              which this module renders out of `deckhouse.registry.*`. On a cluster that
              has switched, nothing writes those settings any more, so the secret keeps
              describing the registry the cluster was migrated from — and dhctl preferred
              it over the cluster's own configuration. See
              `hooks/legacy_registry_contour.go`.
          mode:
            type: string
