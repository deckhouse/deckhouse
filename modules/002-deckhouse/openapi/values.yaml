x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    x-required-for-helm:
    - currentReleaseImageName
    properties:
      namespaces:
        type: array
        default: []
        items:
          type: string
        x-examples:
        - ["test1", "test2"]
      chrootMode:
        type: boolean
        default: false
      reservedPublicHosts:
        type: object
        default: {}
        description: |
          The one-time record of the hostnames a tenant already served under the platform's domain
          when the reservation was first written, produced by hooks/snapshot_reserved_public_hosts.go
          and rendered into the d8-reserved-public-hosts ConfigMap, which is also where the hook
          reads it back from.
        properties:
          recorded:
            type: boolean
            default: false
            description: |
              Whether the snapshot has been taken. Once true it is never recomputed, which is what
              keeps the grandfathering from widening itself on every restart.
          hosts:
            type: array
            default: []
            description: |
              The hostnames recorded, lowercase and without a root dot, spelled the way the policies
              compare them. A wildcard is admitted here and nowhere else in this schema: the
              reservation covers the wildcard form of the template, so a tenant that already held it
              has to be recordable.
            items:
              type: string
              pattern: '^(\*\.)?[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
        x-examples:
        - recorded: true
          hosts: ["shop.example.com", "*.example.com"]
      releaseVersionImageHash:
        type: string
      currentReleaseImageName:
        type: string
        pattern: '^[a-zA-Z0-9\.\/@:\-_]+$'
        x-examples: ["registry.example.com/deckhouse:imageHash-deckhouse"]
      webhookHandlerCert:
        type: object
        default: {}
        x-required-for-helm:
        - crt
        - key
        - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      admissionWebhookCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      configMapName:
        type: string
        x-examples: ["deckhouse"]
      registry:
        type: object
        default: {}
        properties:
          mode:
            type: string
