  - registry:
      mode: Unmanaged
  - registry:
      mode: Unmanaged
      unmanaged:
        imagesRepo: registry.deckhouse.io/test
  - registry:
      mode: Unmanaged
      unmanaged:
        imagesRepo: registry.deckhouse.io/test
        license: "somekey"
  - registry:
      mode: Unmanaged
      unmanaged:
        imagesRepo: registry.deckhouse.io/test
        username: "u"
        password: "p"

  - reservedPublicHosts: {}
  - reservedPublicHosts:
      mode: Template
      additionalHosts: ["admin.example.com", "billing.corp.example.com"]
