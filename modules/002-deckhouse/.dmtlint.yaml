linters-settings:
  no-cyrillic:
    exclude-rules:
      directories:
        # The RBACv2 templates carry the localized title and description of every role and
        # capability they ship. That is product text, not a source comment: the console shows it
        # to whoever is choosing what to grant, and `d8:namespace-capability:kubernetes:view_logs`
        # on its own tells that person nothing.
        - templates/rbacv2
  module:
    exclude-rules:
      license:
        directories:
          # test files
          - images/webhook-handler/operator/internal/controller/testdata
  openapi:
    exclude-rules:
      enum:
        - "properties.license.properties.edition"
  container:
    exclude-rules:
      read-only-root-filesystem:
        - kind: Deployment
          name: deckhouse
          container: init-downloaded-modules
      liveness-probe:
        - kind: Deployment
          name: deckhouse
          container: deckhouse
      readiness-probe:
        - kind: Deployment
          name: webhook-handler
          container: handler
      image-digest:
        - kind: Deployment
          name: deckhouse
          container: deckhouse
  rbac:
    exclude-rules:
      wildcards:
        - kind: ClusterRole
          name: d8:deckhouse:webhook-handler
      placement:
        - kind: ClusterRole
          name: d8:rbac-proxy
        - kind: ClusterRoleBinding
          name: d8-sudouser
