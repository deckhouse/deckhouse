{{- $shellOperatorVersion := "v1.20.6" }}
{{- $prometheusVersion := "v2.55.1" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
{{- /*
  The tools this image runs on used to come one by one from candi/base_images.yml —
  tools/bash, tools/jq, tools/sed, tools/grep, tools/gawk, tools/findutils,
  tools/semver, tools/yq, and tools/coreutils with a hundred and eight paths listed by
  hand. They now come from container-factory through pm_binaries_artifact, which carries the
  libraries of the dynamic ones next to them.

  tini is not among them: it was the entrypoint of the base image this one inherited, and
  nothing has run it since entrypoint.sh started exec'ing webhook-operator directly.

  Of coreutils only the file and text tools are taken.
*/}}
- from: {{ .ModuleName }}/{{ .ImageName }}-pm-artifact
  add: /relocate-pm
  to: /
  before: install
- from: {{ $.ModuleName }}/{{ $.ImageName }}-wheel-artifact
  add: /
  to: /
  before: install
  includePaths:
  - usr/bin/python3*
  - usr/lib/python3*
  - usr/lib/lib*.so*
  excludePaths:
  - usr/lib/python*/site-packages/pip-25.3*
  - usr/lib/python*/test
{{- /*
  Only the hook frameworks are taken from the shell-operator checkout. The binary used to
  come with them, and so did the Go build that produced it, but nothing runs it: the line
  that did — exec /usr/bin/tini -- /shell-operator — is commented out in entrypoint.sh,
  which ends on exec /webhook-operator, and webhook-operator links shell-operator as a Go
  library rather than executing it. That commented line was the only mention of either
  path in the tree.

  shell_lib.sh and frameworks stay: shell_lib/hook.sh overrides
  frameworks/shell/hook.sh#hook::run and PYTHONPATH points at /frameworks/python.
*/}}
- from: {{ .ModuleName }}/{{ .ImageName }}-shell-operator-src-artifact
  add: /src/shell_lib.sh
  to: /shell_lib.sh
  owner: "64535"
  group: "64535"
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-shell-operator-src-artifact
  add: /src/frameworks
  to: /frameworks
  owner: "64535"
  group: "64535"
  before: setup
{{- $k8sVersion := index (index .k8sVersions 0) "kubectl" }}
{{- $image_version := printf "%s.%d" $k8sVersion (index $.CandiVersionMap "k8s" $k8sVersion "patch") | replace "." "-" }}
- from: common/kubernetes-artifact-{{ $image_version }}
  add: /src/_output/bin/kubectl
  to: /usr/bin/kubectl
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-promtool-artifact
  add: /promtool
  to: /usr/local/bin/promtool
  before: setup
- from: {{ $.ModuleName }}/{{ .ImageName }}-label-converter-artifact
  add: /label-converter
  to: /usr/local/bin/label-converter
  before: setup
- from: {{ $.ModuleName }}/{{ .ImageName }}-webhook-operator-artifact
  add: /webhook-operator
  to: /
  before: setup
{{- include "image mount points" . }}
git:
- add: /{{ .ModulePath }}
  to: /available_hooks
  includePaths:
  - 'modules/*/webhooks/'
  - 'ee/modules/*/webhooks/'
  - 'ee/se/modules/*/webhooks'
# - 'ee/fe/modules/*/webhooks/'
  excludePaths:
    - '**/*_test*.py'
    - '**/*_test.go'
    - '**/testdata'
- add: /{{ .ModulePath }}modules/002-deckhouse/images/webhook-handler/src/entrypoint.sh
  to: /entrypoint.sh
{{- /*
  webhook-operator starts it once and hands it the Python hooks, so that a request costs a fork
  instead of an interpreter start-up; see operator/internal/hookrunner.
*/}}
- add: /{{ .ModulePath }}modules/002-deckhouse/images/webhook-handler/src/python_hook_server.py
  to: /python-hook-server.py
- add: /{{ .ModulePath }}shell_lib/semver.sh
  to: /{{ .ModulePath }}frameworks/shell/semver.sh
- add: /{{ .ModulePath }}python_lib
  to: /frameworks/python
- add: /{{ .ModulePath }}modules/002-deckhouse/images/webhook-handler/operator/internal/controller/templates
  to: /internal/controller/templates
shell:
  install:
{{- /*
  The root filesystem is read-only at runtime, so Python cannot cache bytecode for a module that
  ships without it and compiles it again in every process: sitecustomize.py, and pprint.py, which
  the deckhouse library imports, cost about 3 ms per hook start that way. The top level of the
  standard library is compiled here (2.7 MB); packages already ship their bytecode. checked-hash
  keeps a file that a later git patch changes correct: its bytecode no longer matches and is ignored.
*/}}
  - python3 -m compileall -q -l --invalidation-mode checked-hash /usr/lib/python3.12 /frameworks/python
imageSpec:
  config:
    env: {"PYTHONPATH": "/frameworks/python"}
    entrypoint: ["/entrypoint.sh"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-label-converter-src-artifact
final: false
from: {{ index $.Images "builder/src" }}
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/src/label-converter
  to: /src
  includePaths:
  - '**/*.go'
  - '**/go.mod'
  - '**/go.sum'
---
image: {{ .ModuleName }}/{{ .ImageName }}-label-converter-artifact
final: false
from: {{ index $.Images "builder/golang" }}
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-label-converter-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - export GOPROXY=$(cat /run/secrets/GOPROXY)
    - cd /src
    - CGO_ENABLED=0 GOOS=linux go build -ldflags '-s -w -extldflags "-static"' -o /label-converter label_converter.go
    - chown 64535:64535 /label-converter
    - chmod 755 /label-converter
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-wheel-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/src/requirements.txt
  to: /requirements.txt
  stageDependencies:
    install:
    - '**/*'
import:
- from: common/wheel-artifact
  add: /wheels
  to: /wheels
  before: install
shell:
  beforeInstall:
  - pm install python@3.12
  install:
  - pip3 install -f file:///wheels --no-index --upgrade pip
  - pip3 install -f file:///wheels --no-index -r /requirements.txt
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName )) }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-webhook-operator-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-webhook-operator-src-artifact
    add: /src
    to: /operator
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - cd /operator
    - export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
    - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
    - go build -o /webhook-operator ./cmd/main.go
    - chown 64535:64535 /webhook-operator
    - chmod 0700 /webhook-operator
---
image: {{ .ModuleName }}/{{ .ImageName }}-webhook-operator-src-artifact
from: {{ index $.Images "builder/src" }}
final: false
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/operator
  to: /src
  includePaths:
  - '**/*.go'
  - '**/*.mod'
  - '**/*.sum'
---
{{- include "pm_binaries_artifact" (dict
      "Images" $.Images
      "name" (printf "%s/%s-pm-artifact" $.ModuleName $.ImageName)
      "packages" "bash findutils gawk grep sed jq yq semver coreutils"
      "binaries" (print
        "/usr/bin/bash:/bin/bash"
        " /usr/bin/find /usr/bin/xargs /usr/bin/awk /usr/bin/gawk"
        " /usr/bin/egrep /usr/bin/fgrep /usr/bin/grep /usr/bin/pcre2grep /usr/bin/sed"
        " /usr/bin/jq /usr/bin/yq /usr/bin/semver"
        " /usr/bin/base64 /usr/bin/basename /usr/bin/cat /usr/bin/chmod /usr/bin/chown /usr/bin/cp"
        " /usr/bin/cut /usr/bin/date /usr/bin/df /usr/bin/dirname /usr/bin/du /usr/bin/env"
        " /usr/bin/expr /usr/bin/head /usr/bin/id /usr/bin/ln /usr/bin/ls /usr/bin/mkdir"
        " /usr/bin/mktemp /usr/bin/mv /usr/bin/printf /usr/bin/pwd /usr/bin/readlink"
        " /usr/bin/realpath /usr/bin/rm /usr/bin/rmdir /usr/bin/seq /usr/bin/sleep /usr/bin/sort"
        " /usr/bin/stat /usr/bin/tail /usr/bin/tee /usr/bin/timeout /usr/bin/touch /usr/bin/tr"
        " /usr/bin/truncate /usr/bin/uniq /usr/bin/wc /usr/bin/whoami")
      "post" "ln -sf bash /relocate-pm/bin/sh") }}
{{- /*
  What the hooks use of coreutils was read off the sources: cat, cut, base64, tr, date, id,
  seq, sleep, cp and expr in the shell hooks and shell_lib, and nothing at all from the
  python ones, which only shell out to kubectl. The rest of the list is the ordinary file
  toolbox, kept because shell-operator's own hook framework is upstream and not visible
  from here.
*/}}
---
{{- /*
  Moved here from modules/000-common/images/shell-operator, which had this one importer.
*/}}
image: {{ .ModuleName }}/{{ .ImageName }}-shell-operator-src-artifact
git:
- url: {{ $.SOURCE_REPO }}/flant/shell-operator.git
  tag: {{ $shellOperatorVersion }}
  add: /
  to: /src
final: false
from: {{ index $.Images "builder/src" }}
---
{{- /*
  Moved here from modules/000-common/images/promtool, which had this one importer. promtool
  validates the Prometheus rules the hooks receive.
*/}}
image: {{ .ModuleName }}/{{ .ImageName }}-promtool-src-artifact
final: false
from: {{ index $.Images "builder/src" }}
git:
- url: {{ $.SOURCE_REPO }}/prometheus/prometheus.git
  tag: {{ $prometheusVersion }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ImagePath }}/patches/promtool
  to: /patches
  includePaths:
  - '*.patch'
  stageDependencies:
    install:
    - '*.patch'
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
---
image: {{ .ModuleName }}/{{ .ImageName }}-promtool-artifact
final: false
from: {{ index $.Images "builder/golang-1.25" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-promtool-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GOPROXY=$(cat /run/secrets/GOPROXY) CGO_ENABLED=0 GOOS=linux GOARCH=amd64
  - cd /src
  # The version stamp promu info used to supply: VERSION is where promu read it from, and
  # with .git removed promu reported the revision as "non-git".
  - |
    go build -tags "netgo,stringlabels" -ldflags="\
      -X github.com/prometheus/common/version.Version=$(cat VERSION) \
      -X github.com/prometheus/common/version.Revision=non-git \
      -X github.com/prometheus/common/version.Branch=HEAD \
      -X github.com/prometheus/common/version.BuildUser=root@unknown \
      -extldflags '-static'" \
      -o /promtool ./cmd/promtool
  - chown 64535:64535 /promtool
  - chmod 0700 /promtool
