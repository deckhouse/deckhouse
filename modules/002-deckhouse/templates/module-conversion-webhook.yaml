{{- /* Module v2 stores Modules in v1beta1, which carries no properties; the webhook fills v1alpha1 from it */}}
{{- if .Values.deckhouse.enableModuleV2 }}
---
apiVersion: deckhouse.io/v1alpha1
kind: ConversionWebhook
metadata:
  # webhook-operator takes the name for the name of the CRD and derives the API group from it.
  name: modules.deckhouse.io
  {{- include "helm_lib_module_labels" (list . (dict "app" "webhook-handler")) | nindent 2 }}
# The methods of every conversion are in the file the first handler embeds. webhook-operator pastes
# the handlers of all conversions into one class, so the file is the handler of the first conversion
# and the other carries none.
conversions:
  - from: v1beta1
    to: v1alpha1
    handler:
      python: |
        {{- (required "webhooks/conversion/modules.py is missing" (.Files.Get "webhooks/conversion/modules.py")) | nindent 8 }}
  - from: v1alpha1
    to: v1beta1
    handler: {}
{{- end }}
