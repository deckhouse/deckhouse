---
apiVersion: deckhouse.io/v1alpha1
kind: ValidationWebhook
metadata:
  name: public-domain-template
  {{- include "helm_lib_module_labels" (list . (dict "app" "webhook-handler")) | nindent 2 }}
validationObject:
  name: publicdomaintemplate-policy.deckhouse.io
  group: main
  rules:
  - apiGroups:   ["deckhouse.io"]
    apiVersions: ["*"]
    operations:  ["CREATE", "UPDATE"]
    resources:   ["moduleconfigs"]
    scope:       "Cluster"
context:
  - name: d8-kube-dns-cm-wh
    kubernetes:
      apiVersion: v1
      kind: ConfigMap
      nameSelector:
        matchNames:
        - d8-kube-dns
      namespace:
        nameSelector:
          matchNames:
          - kube-system
      jqFilter: |-
        {
          "kube-dns-conf": .data.Corefile,
        }
  - name: d8-cluster-configuration
    kubernetes:
      apiVersion: v1
      kind: Secret
      nameSelector:
        matchNames:
        - d8-cluster-configuration
      namespace:
        nameSelector:
          matchNames:
          - kube-system
      jqFilter: |-
        {
          "clusterDomain": ( .data."cluster-configuration.yaml" // "" | @base64d | [match("[ ]*clusterDomain:[ ]+(.+)")] | if length > 0 then .[0].captures[0].string else "" end ),
        }
  - name: kube-dns-module
    kubernetes:
      apiVersion: deckhouse.io/v1alpha1
      kind: Module
      nameSelector:
        matchNames:
        - kube-dns
      jqFilter: |-
        {
          "status": .status.status,
        }
  - name: d8-control-plane-manager-module-config
    kubernetes:
      apiVersion: deckhouse.io/v1alpha1
      kind: ModuleConfig
      nameSelector:
        matchNames:
        - control-plane-manager
      jqFilter: |-
        {
          "clusterDomain": (.spec.settings.network.clusterDomain // ""),
        }
handler:
  python: |
    import re

    def validate(ctx: DotMap) -> tuple[Optional[str], bool]:
        mc_name = ctx.review.request.object.metadata.name
        if mc_name != "global":
            return None, True

        module_kube_dns_snapshots = ctx.snapshots.get("kube-dns-module", [])
        module_status = None
        for snap in module_kube_dns_snapshots:
            module_status = snap.filterResult.get("status")

        if module_status == "Ready":
            kube_dns_snapshots = ctx.snapshots.get("d8-kube-dns-cm-wh", [])
            kube_dns_conf = ""
            for snap in kube_dns_snapshots:
                kube_dns_conf = snap.filterResult.get("kube-dns-conf", "")
            dns_domains = re.findall(r'(?<=kubernetes )(.*?)(?=ip6\.arpa)', kube_dns_conf)
        else:
            # clusterDomain resolves the same way everywhere: ModuleConfig control-plane-manager
            # wins, the deprecated ClusterConfiguration field is the fallback.
            mc_snapshots = ctx.snapshots.get("d8-control-plane-manager-module-config", [])
            mc_domain = ""
            for snap in mc_snapshots:
                mc_domain = snap.filterResult.get("clusterDomain", "")

            dns_domains = []
            if mc_domain:
                dns_domains.append(mc_domain)
            else:
                cluster_config_snapshots = ctx.snapshots.get("d8-cluster-configuration", [])
                for snap in cluster_config_snapshots:
                    domain = snap.filterResult.get("clusterDomain", "")
                    if domain:
                        dns_domains.append(domain)

            if not dns_domains:
                # Neither document sets clusterDomain, so take the domain the cluster resolved:
                # a cluster without the ClusterConfiguration Secret discovers it from CoreDNS.
                dns_domains.append("{{ .Values.global.discovery.clusterDomain }}")

        public_domain_template = ctx.review.request.object.spec.settings.modules.get(
            "publicDomainTemplate", ""
        )
        if public_domain_template:
            public_domain_template = public_domain_template.replace("%s.", "")

        for domain in dns_domains:
            domain = domain.strip()
            if public_domain_template == domain:
                domain_list = " ".join(d.strip() for d in dns_domains)
                return (
                    f'The publicDomainTemplate "%s.{public_domain_template}" MUST NOT '
                    f'match the one specified in the clusterDomain/clusterDomainAliases '
                    f'parameters of the resource: ["{domain_list}"].',
                    False
                )
        return None, True
