{{- if $.Values.global.modulesImages.registry.dockercfg }}
---
apiVersion: v1
kind: Secret
metadata:
  name: deckhouse-registry
  namespace: d8-system
  annotations:
    helm.sh/resource-policy: keep
{{- /*
  Helm checks changes only in .dockerconfigjson field, so if other field changes, helm don't
  change secret. Checksum resolve this.

  Every field of this secret that can change has to be in here, and `fetchBase` is one of
  them: it is where the Deckhouse controller fetches from, and it moves onto the node agent
  once the registry module has taken over the pull path. Left out, the move would be rendered
  and never applied, and the controller would go on fetching from the registry the cluster was
  installed with while everything else had moved.

  With an explicit format string, because the value being formatted is not one: this read
  `printf $dockercfg $address ...`, which makes a base64 blob the format and carries the rest
  only as Go's `%!(EXTRA ...)` suffix. It did include them, by accident.
*/}}
    checksum: {{ printf "%s|%s|%s|%s|%s|%s" $.Values.global.modulesImages.registry.dockercfg $.Values.global.modulesImages.registry.address $.Values.global.modulesImages.registry.path $.Values.global.modulesImages.registry.scheme $.Values.global.modulesImages.registry.CA $.Values.global.modulesImages.registry.fetchBase | sha256sum }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry" "name" "deckhouse-registry")) | nindent 2 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $.Values.global.modulesImages.registry.dockercfg }}
  address:           {{ $.Values.global.modulesImages.registry.address | b64enc }}
  {{- if $.Values.global.modulesImages.registry.path }}
  path:              {{ $.Values.global.modulesImages.registry.path | b64enc }}
  {{- end }}
  scheme:            {{ $.Values.global.modulesImages.registry.scheme | b64enc }}
  {{- if $.Values.global.modulesImages.registry.CA }}
  ca:                {{ $.Values.global.modulesImages.registry.CA | b64enc }}
  {{- end }}
  clusterIsBootstrapped: {{ $.Values.global.clusterIsBootstrapped | quote | b64enc }}
{{- /*
  `fetchBase`, not `base`. The two hold the same value on a cluster whose pull path the
  registry module does not manage, and differ on one that it does.

  `base` is where container image references point, and those are resolved by the container
  runtime, which is handed a drop-in that redirects any registry to the node agent — so it
  can name a service that nothing dials. This field is read by the Deckhouse controller's
  own HTTP client, which has no such redirection and has to dial: `fetchBase` names the
  agent on this node directly.

  Going through the agent is what makes a registry change reach the controller at all.
  Nothing writes this secret from the new configuration — the module moves the pull path by
  reconfiguring the agents, not by rewriting registry addresses — so a controller reading
  an address from here would keep fetching from the registry the cluster was installed with
  forever.
*/}}
  imagesRegistry: {{ $.Values.global.modulesImages.registry.fetchBase | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: deckhouse-registry
  namespace: kube-system
  annotations:
    helm.sh/resource-policy: keep
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $.Values.global.modulesImages.registry.dockercfg }}
---
apiVersion: v1
kind: Secret
metadata:
  name: deckhouse-registry
  namespace: d8-monitoring
  annotations:
    helm.sh/resource-policy: keep
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $.Values.global.modulesImages.registry.dockercfg }}
{{- end }}
