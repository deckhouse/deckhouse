{{- if $.Values.global.modulesImages.registry.dockercfg }}
---
apiVersion: v1
kind: Secret
metadata:
  name: deckhouse-registry
  namespace: d8-system
  annotations:
    helm.sh/resource-policy: keep
{{- /*
  Helm checks changes only in .dockerconfigjson field, so if other field changes, helm don't
  change secret. Checksum resolve this.

  Every field of this secret that can change has to be in here, and `base` is one of them: it
  is where the Deckhouse controller fetches from, and the registry module moves it onto the
  in-cluster registry once it has taken over the pull path. Left out, the move would be
  rendered and never applied, and the controller would go on fetching from the registry the
  cluster was installed with while everything else had moved.

  With an explicit format string, because the value being formatted is not one: this read
  `printf $dockercfg $address ...`, which makes a base64 blob the format and carries the rest
  only as Go's `%!(EXTRA ...)` suffix. It did include them, by accident.
*/}}
    checksum: {{ printf "%s|%s|%s|%s|%s|%s" $.Values.global.modulesImages.registry.dockercfg $.Values.global.modulesImages.registry.address $.Values.global.modulesImages.registry.path $.Values.global.modulesImages.registry.scheme $.Values.global.modulesImages.registry.CA $.Values.global.modulesImages.registry.base | sha256sum }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry" "name" "deckhouse-registry")) | nindent 2 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $.Values.global.modulesImages.registry.dockercfg }}
  address:           {{ $.Values.global.modulesImages.registry.address | b64enc }}
  {{- if $.Values.global.modulesImages.registry.path }}
  path:              {{ $.Values.global.modulesImages.registry.path | b64enc }}
  {{- end }}
  scheme:            {{ $.Values.global.modulesImages.registry.scheme | b64enc }}
  {{- if $.Values.global.modulesImages.registry.CA }}
  ca:                {{ $.Values.global.modulesImages.registry.CA | b64enc }}
  {{- end }}
  clusterIsBootstrapped: {{ $.Values.global.clusterIsBootstrapped | quote | b64enc }}
{{- /*
  The registry as somebody outside the cluster sees it, which is what this field has to stay.

  It is not only the Deckhouse controller that reads it: dhctl reads it too, from wherever it
  is run, and refuses to touch the cluster unless the docker config above carries credentials
  for the host it names. So an address that only resolves inside the cluster — let alone a
  loopback one — makes the cluster unmanageable: `dhctl destroy` and `dhctl converge` both stop
  at "docker config doesn't contain ... registry credentials" before doing anything at all.
*/}}
  imagesRegistry: {{ printf "%s%s" $.Values.global.modulesImages.registry.address $.Values.global.modulesImages.registry.path | b64enc }}
{{- /*
  And where the Deckhouse controller running IN the cluster fetches from, which is a different
  question with a different answer.

  Its own key rather than a different value in the one above, because the two have different
  readers and only one of them is in the cluster. Where the registry module manages the pull
  path this names the in-cluster registry, and the controller translates that to the node agent
  on the loopback address at the moment it dials — the loopback belongs in nothing that is
  recorded, since it is node-local and a cluster-wide object naming it is wrong even where it
  happens to work.

  Going through the agent is what makes a change of registry reach the controller at all:
  nothing writes a registry address into this secret from the new configuration, so a controller
  that took one from here would keep fetching from the registry the cluster was installed with,
  forever.

  Equal to the field above on every cluster whose pull path is not managed.
*/}}
  fetchRegistry: {{ $.Values.global.modulesImages.registry.base | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: deckhouse-registry
  namespace: kube-system
  annotations:
    helm.sh/resource-policy: keep
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $.Values.global.modulesImages.registry.dockercfg }}
---
apiVersion: v1
kind: Secret
metadata:
  name: deckhouse-registry
  namespace: d8-monitoring
  annotations:
    helm.sh/resource-policy: keep
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $.Values.global.modulesImages.registry.dockercfg }}
{{- end }}
