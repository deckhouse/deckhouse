{{/* KubeDNS is not installed on the bootstrap phase and kube-apiserver will fail on a DNS resolution request */}}
{{/*   because it doesn't know `deckhouse.d8-system.svc` address yet.*/}}
{{- if .Values.global.clusterIsBootstrapped }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: deckhouse-webhook
  {{- include "helm_lib_module_labels" (list . (dict "app" "deckhouse-webhook")) | nindent 2 }}
  annotations:
    werf.io/deploy-dependency-deployment: state=present,kind=Deployment,name=deckhouse,namespace=d8-system
    werf.io/deploy-dependency-service: state=present,kind=Service,name=deckhouse,namespace=d8-system
webhooks:
  - name: deckhouse-registry.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - "*"
        resources:
          - "secrets"
        scope: "Namespaced"
        operations:
          - CREATE
          - UPDATE
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: d8-system
    objectSelector:
      matchLabels:
        name: deckhouse-registry
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1/deckhouse-registry-secret
  - name: modules.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - "deckhouse.io"
        apiVersions:
          - "v1alpha1"
        resources:
          - "modules"
        operations:
          - CREATE
          - UPDATE
          - DELETE
        scope: Cluster
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Ignore
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1alpha1/modules
  - name: module-configs.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - "deckhouse.io"
        apiVersions:
          - "v1alpha1"
        resources:
          - "moduleconfigs"
        operations:
          - CREATE
          - UPDATE
          - DELETE
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1alpha1/module-configs
  - name: applications.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - "deckhouse.io"
        apiVersions:
          - "v1alpha1"
        resources:
          - "applications"
        operations:
          - CREATE
          - UPDATE
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1alpha1/applications
  - name: update-policies.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - "deckhouse.io"
        apiVersions:
          - "v1alpha2"
        resources:
          - "moduleupdatepolicies"
        operations:
          - DELETE
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1alpha1/update-policies
  - name: cluster-configuration.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - "*"
        resources:
          - "secrets"
        scope: "Namespaced"
        operations:
          - CREATE
          - UPDATE
          - DELETE
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    objectSelector:
      matchLabels:
        name: d8-cluster-configuration
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1/configuration-secret
  # kube-system/d8-cluster-kubernetes is the only durable record of maxUsedKubernetesVersion —
  # the floor that stops a cluster from being downgraded below what it has ever run.
  # update-observer recreates a deleted ConfigMap, but from its own container environment, so the
  # history would be gone. DELETE only: hand edits of data.spec are rewritten on the next reconcile.
  #
  # objectSelector, not a name match: without it failurePolicy: Fail would apply to every ConfigMap
  # in kube-system and an unavailable webhook would take the cluster with it. The label is stamped
  # by dhctl at bootstrap and re-asserted by update-observer on every write.
  - name: cluster-kubernetes-configmap.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - "*"
        resources:
          - "configmaps"
        scope: "Namespaced"
        operations:
          - DELETE
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    objectSelector:
      matchLabels:
        name: d8-cluster-kubernetes
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1/cluster-kubernetes-configmap
  - name: provider-configuration.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - "*"
        resources:
          - "secrets"
        scope: "Namespaced"
        operations:
          - CREATE
          - UPDATE
          - DELETE
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    objectSelector:
      matchLabels:
        name: d8-provider-cluster-configuration
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1/provider-configuration-secret
  - name: static-configuration.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - "*"
        resources:
          - "secrets"
        scope: "Namespaced"
        operations:
          - CREATE
          - UPDATE
          - DELETE
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    objectSelector:
      matchLabels:
        name: d8-static-cluster-configuration
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1/static-configuration-secret
  - name: deckhouse-releases.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - "deckhouse.io"
        apiVersions:
          - "v1alpha1"
        resources:
          - "deckhousereleases"
        operations:
          - CREATE
          - UPDATE
        scope: Cluster
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1alpha1/deckhouse-releases
{{- end }}
