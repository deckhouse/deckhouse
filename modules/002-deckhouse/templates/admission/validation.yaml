{{/* KubeDNS is not installed on the bootstrap phase and kube-apiserver will fail on a DNS resolution request */}}
{{/*   because it doesn't know `deckhouse.d8-system.svc` address yet.*/}}
{{- if .Values.global.clusterIsBootstrapped }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: deckhouse-webhook
  {{- include "helm_lib_module_labels" (list . (dict "app" "deckhouse-webhook")) | nindent 2 }}
  annotations:
    werf.io/deploy-dependency-deployment: state=present,kind=Deployment,name=deckhouse,namespace=d8-system
    werf.io/deploy-dependency-service: state=present,kind=Service,name=deckhouse,namespace=d8-system
webhooks:
  - name: deckhouse-registry.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - "*"
        resources:
          - "secrets"
        scope: "Namespaced"
        operations:
          - CREATE
          - UPDATE
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: d8-system
    objectSelector:
      matchLabels:
        name: deckhouse-registry
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1/deckhouse-registry-secret
{{/* Modules are served in two versions, each validated by its own webhook below. */}}
{{/*   matchPolicy must stay Exact on both: with Equivalent the API server converts */}}
{{/*   a request for one version and delivers it to the other version's webhook too, */}}
{{/*   so both would fire on every write and the stricter verdict would always win. */}}
  - name: modules.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - "deckhouse.io"
        apiVersions:
          - "v1alpha1"
        resources:
          - "modules"
        operations:
          - CREATE
          - UPDATE
          - DELETE
        scope: Cluster
    admissionReviewVersions:
      - v1
    matchPolicy: Exact
    failurePolicy: Ignore
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1alpha1/modules
{{/* DELETE is listed although neither rule below is about deletion: kubectl resolves */}}
{{/*   `module` to v1alpha2, so leaving it out would let `kubectl delete module X` */}}
{{/*   uninstall a module that the v1alpha1 webhook above still refuses to delete. */}}
  - name: modules-v1alpha2.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - "deckhouse.io"
        apiVersions:
          - "v1alpha2"
        resources:
          - "modules"
        operations:
          - CREATE
          - UPDATE
          - DELETE
        scope: Cluster
    admissionReviewVersions:
      - v1
    matchPolicy: Exact
{{/* Fail, unlike the v1alpha1 webhook above: an unreadable module config is served */}}
{{/*   as an error, and only Fail keeps it from passing for an absent module config. */}}
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1alpha2/modules
  - name: module-configs.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - "deckhouse.io"
        apiVersions:
          - "v1alpha1"
        resources:
          - "moduleconfigs"
        operations:
          - CREATE
          - UPDATE
          - DELETE
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1alpha1/module-configs
  - name: applications.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - "deckhouse.io"
        apiVersions:
          - "v1alpha1"
        resources:
          - "applications"
        operations:
          - CREATE
          - UPDATE
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1alpha1/applications
  - name: update-policies.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - "deckhouse.io"
        apiVersions:
          - "v1alpha2"
        resources:
          - "moduleupdatepolicies"
        operations:
          - DELETE
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1alpha1/update-policies
  - name: cluster-configuration.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - "*"
        resources:
          - "secrets"
        scope: "Namespaced"
        operations:
          - CREATE
          - UPDATE
          - DELETE
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    objectSelector:
      matchLabels:
        name: d8-cluster-configuration
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1/configuration-secret
  - name: provider-configuration.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - "*"
        resources:
          - "secrets"
        scope: "Namespaced"
        operations:
          - CREATE
          - UPDATE
          - DELETE
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    objectSelector:
      matchLabels:
        name: d8-provider-cluster-configuration
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1/provider-configuration-secret
  - name: static-configuration.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - "*"
        resources:
          - "secrets"
        scope: "Namespaced"
        operations:
          - CREATE
          - UPDATE
          - DELETE
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    objectSelector:
      matchLabels:
        name: d8-static-cluster-configuration
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1/static-configuration-secret
  - name: deckhouse-releases.deckhouse-webhook.deckhouse.io
    rules:
      - apiGroups:
          - "deckhouse.io"
        apiVersions:
          - "v1alpha1"
        resources:
          - "deckhousereleases"
        operations:
          - CREATE
          - UPDATE
        scope: Cluster
    admissionReviewVersions:
      - v1
    matchPolicy: Equivalent
    failurePolicy: Fail
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.deckhouse.internal.admissionWebhookCert.ca | b64enc }}
      service:
        name: deckhouse
        namespace: d8-system
        port: 4223
        path: /validate/v1alpha1/deckhouse-releases
{{- end }}
