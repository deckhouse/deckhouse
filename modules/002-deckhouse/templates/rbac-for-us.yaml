---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deckhouse
  namespace: d8-system
  annotations:
    helm.sh/resource-policy: keep
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
automountServiceAccountToken: false
# RBAC for bashible - access to registry secret
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: bashible-apiserver-readregsecret
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "bashible-apiserver")) | nindent 2 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "watch", "list"]
---
# To read secrets in d8-system
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: bashible-apiserver-readregsecret
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "bashible-apiserver")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bashible-apiserver-readregsecret
subjects:
  - kind: ServiceAccount
    name: bashible-apiserver
    namespace: d8-cloud-instance-manager

# RBAC for registry-packages-proxy - access to registry secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-packages-proxy
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-packages-proxy")) | nindent 2 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - deckhouse-registry
      # How to read the cluster's own store, which the packages proxy needs in the window where a node
      # has no agent yet — the agent itself is installed from a package fetched through that proxy.
      #
      # Named here because a resourceNames Role is silent when it is short: a watch the proxy is not
      # allowed to make returns nothing rather than an error, so the whole path would simply never
      # engage and every fetch would fail with the installer's certificate instead.
      - registry-storage-access
      # `registry-bashible-config` is deliberately NOT here. The proxy used to read it as a last resort —
      # what nodes are told, which names an upstream and carries credentials for it — and that path is
      # gone: the installer now puts the agent on the first master, so a node never has to reach an
      # upstream from here. Granting a read it no longer needs would only keep that door open.
    verbs:
      - get
      - list
      - watch
# To read secrets in d8-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-packages-proxy
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-packages-proxy")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-packages-proxy
subjects:
  - kind: ServiceAccount
    name: registry-packages-proxy
    namespace: d8-cloud-instance-manager
