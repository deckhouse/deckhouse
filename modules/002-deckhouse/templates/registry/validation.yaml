{{- /*
  `registry.mode: Proxy` and `Local` in this module's ModuleConfig name the previous implementation of
  the registry module, and nothing acts on them any more: the installer refuses them, the release
  requirement keeps a cluster running them from updating to this release, and no hook or template
  renders them. The values stay in the schema until 1.79, so that a ModuleConfig already stored with
  one keeps validating; this policy is what stops them from being written again, on any cluster.

  Only a newly written value is refused: a CREATE with one, or an UPDATE that changes the mode to one.
  An UPDATE that keeps a stored value passes, so that the controller can still remove its finalizer
  when the ModuleConfig is deleted, and labels or re-applies of unrelated settings are not blocked.
  At bootstrap dhctl creates this ModuleConfig before the policy exists and refuses the modes itself;
  CREATE here catches a ModuleConfig deleted and created again in a running cluster.
*/ -}}
{{- if and (include "helm_lib_kind_exists" (list . "ValidatingAdmissionPolicy")) (include "helm_lib_kind_exists" (list . "ValidatingAdmissionPolicyBinding")) }}
{{- $policyName := "deckhouse-module-registry-validation" }}
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $policyName }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "deckhouse")) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   ["deckhouse.io"]
      apiVersions: ["v1alpha1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["moduleconfigs"]
  matchConditions:
  - name: 'deckhouse-mc'
    expression: 'object.metadata.name == "deckhouse"'
  validations:
  - expression: |
      !(
        object.?spec.?settings.?registry.?mode.orValue("") in ["Proxy", "Local"] &&
        (
          request.operation == "CREATE" ||
          oldObject.?spec.?settings.?registry.?mode.orValue("") !=
          object.?spec.?settings.?registry.?mode.orValue("")
        )
      )
    message: >-
      The registry modes Proxy and Local of the `deckhouse` ModuleConfig
      (`spec.settings.registry.mode`) belong to the previous implementation
      of the registry module and are not supported. Set
      `spec.settings.registry.mode` to `Unmanaged` or remove the
      `spec.settings.registry` section, and configure the registry in the
      `registry` ModuleConfig instead: `mode: Managed` with
      `primary.upstream`, and `storage.cache` for an in-cluster cache.
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicyBinding") }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $policyName }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "deckhouse")) | nindent 2 }}
spec:
  policyName: {{ $policyName }}
  validationActions: [Deny]
{{- end }}
