{{- /*
  The previous implementation's registry contour, and it is rendered only while that implementation is
  the one configuring nodes.

  `deckhouse.internal.registry.v2Active` is set by legacy_registry_contour.go from the presence of the
  registry module's handover record. On a cluster that has switched, this secret describes whatever
  registry the cluster was migrated FROM — nothing writes `deckhouse.registry.*` any more — and dhctl
  used to prefer it over the cluster's own configuration. See the hook for what that was measured to be.

  No `helm.sh/resource-policy: keep` here, deliberately: helm removing this object when the condition
  goes false is the whole mechanism, and there is nothing left on such a cluster that reads it.
*/ -}}
{{- if not ((.Values.deckhouse.internal).registry).v2Active }}
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-config
  namespace: d8-system
  annotations:
    version: "1"
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry" "name" "registry-deckhouse-config" "type" "registry-config" )) | nindent 2 }}
type: registry/config
data:
  mode: {{ .Values.deckhouse.registry.mode | b64enc }}
  {{- if eq .Values.deckhouse.registry.mode "Direct" }}
    {{- with .Values.deckhouse.registry.direct }}
  imagesRepo: {{ .imagesRepo | b64enc }}
  scheme: {{ .scheme | b64enc }}
      {{- with .ca }}
  ca: {{ . | b64enc }}
      {{- end }}
      {{- if .license }}
  username: {{ "license-token" | b64enc }}
  password: {{ .license | b64enc }}
      {{- else if and .username .password }}
  username: {{ .username | b64enc }}
  password: {{ .password | b64enc }}
      {{- end }}
  checkMode: {{ .checkMode | b64enc }}
    {{- end }}
  {{- else if eq .Values.deckhouse.registry.mode "Unmanaged" }}
    {{- with .Values.deckhouse.registry.unmanaged }}
  imagesRepo: {{ .imagesRepo | b64enc }}
  scheme: {{ .scheme | b64enc }}
      {{- with .ca }}
  ca: {{ . | b64enc }}
      {{- end }}
      {{- if .license }}
  username: {{ "license-token" | b64enc }}
  password: {{ .license | b64enc }}
      {{- else if and .username .password }}
  username: {{ .username | b64enc }}
  password: {{ .password | b64enc }}
      {{- end }}
  checkMode: {{ .checkMode | b64enc }}
    {{- end }}
  {{- else if eq .Values.deckhouse.registry.mode "Proxy" }}
    {{- with .Values.deckhouse.registry.proxy }}
  imagesRepo: {{ .imagesRepo | b64enc }}
  scheme: {{ .scheme | b64enc }}
      {{- with .ca }}
  ca: {{ . | b64enc }}
      {{- end }}
      {{- if .license }}
  username: {{ "license-token" | b64enc }}
  password: {{ .license | b64enc }}
      {{- else if and .username .password }}
  username: {{ .username | b64enc }}
  password: {{ .password | b64enc }}
      {{- end }}
  checkMode: {{ .checkMode | b64enc }}
      {{- with .ttl }}
  ttl: {{ . | b64enc }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
