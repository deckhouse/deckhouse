---
apiVersion: deckhouse.io/v1alpha1
kind: ModuleSource
metadata:
  name: deckhouse
  {{- include "helm_lib_module_labels" (list . (dict "app" "deckhouse")) | nindent 2 }}
spec:
  registry:
    {{- if $.Values.global.modulesImages.registry.CA }}
    ca: | {{ $.Values.global.modulesImages.registry.CA | nindent 6 }}
    {{- end }}
    dockerCfg: {{ $.Values.global.modulesImages.registry.dockercfg }}
    {{- /*
      `fetchBase`, not `base`. The two hold the same value on a cluster whose pull path the
      registry module does not manage, but they answer different questions: `base` is where
      image references point, resolved by the container runtime through the node agent it
      was redirected to. This repository is fetched by the Deckhouse controller itself, over
      HTTP, and it has to dial — so it names the agent on this node directly.

      The certificate authority above is left as the cluster knows it. It is not the one that
      verifies the agent: the agent's is generated on each node and never leaves it, so no
      cluster object can carry it, and the controller reads it from the node instead.
    */}}
    repo: {{ printf "%s/modules" $.Values.global.modulesImages.registry.fetchBase }}
    scheme: {{ $.Values.global.modulesImages.registry.scheme | upper }}
