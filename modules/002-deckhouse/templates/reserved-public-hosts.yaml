{{- /*
  Admission for reserved public hosts is not rendered in this patch.

  Template mode reserved every hostname a publicDomainTemplate of the form
  "%s-cluster.example.com" can produce, which is also how tenant Ingresses on
  that cluster are named, and blocked ordinary deploys.

  settings.reservedPublicHosts stays in the ModuleConfig schema so a cluster
  that already wrote those fields keeps validating. The settings are ignored
  here. Helm rendering nothing for this template deletes the policies and the
  ConfigMap that a previous patch installed.
*/ -}}
