type: object
properties:
  ingressClass:
    type: string
    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
    description: |
      Class of the Ingress controller of the documentation web UI.

      An optional parameter; by default, the `modules.ingressClass` global value is used.
  highAvailability:
    type: boolean
    x-examples: [true, false]
    description: |
      Manually enable the high availability mode.

      By default, Deckhouse Platform automatically decides whether to enable the HA mode. Learn more about the [high availability mode for modules](/products/kubernetes-platform/documentation/v1/reference/api/global.html#parameters).

      In the HA mode the documentation runs in two replicas on different nodes; the "High availability mode" section of the usage page of the module tells what it needs and why S3 helps.
  auth:
    type: object
    default: {}
    description: |
      Parameters to authenticate and authorize access to the documentation web interface.
    properties:
      externalAuthentication:
        type: object
        description: |
          Parameters to enable external authentication based on the Ingress NGINX [external-auth](https://kubernetes.github.io/ingress-nginx/examples/auth/external-auth/) mechanism that uses the Nginx [auth_request](https://nginx.org/en/docs/http/ngx_http_auth_request_module.html) module.

          > External authentication is enabled automatically if the [user-authn](https://deckhouse.io/modules/user-authn/) module is enabled.
        properties:
          authURL:
            type: string
            default: ""
            description: |
              URL of the authentication service.

              If the user is authenticated, the service should return an HTTP 200 response code.
            x-examples:
              - https://documentation-dex-authenticator.d8-system.svc.cluster.local/dex-authenticator/auth
          authSignInURL:
            type: string
            default: ""
            description: |
              URL to redirect the user for authentication (if the authentication service returned a non-200 HTTP response).
            x-examples:
              - https://$host/dex-authenticator/sign_in
      allowedUserEmails:
        type: array
        items:
          type: string
        description: |
          Array of emails of users that can access module's public web interfaces.

          This parameter is used if the `user-authn` module is enabled or the `externalAuthentication` parameter is set.
      allowedUserGroups:
        type: array
        items:
          type: string
        default: []
        description: |
          Array of groups whose users can browse the documentation.

          This parameter is used if the `user-authn` module is enabled or the `externalAuthentication` parameter is set.

          > **Caution!** If the module works together with the `user-authn` module, add the allowed groups to the DexProvider configuration.
        x-examples:
          - ["admin", "users"]
          - []
  https:
    type: object
    x-examples:
      - mode: Disabled
      - mode: OnlyInURI
      - mode: CustomCertificate
        customCertificate:
          secretName: "foobar"
      - mode: CertManager
        certManager:
          clusterIssuerName: letsencrypt
    description: |
      What certificate type to use.

      This parameter completely overrides the `global.modules.https` settings.
    properties:
      mode:
        type: string
        default: "CertManager"
        description: |
          HTTPS usage mode:
          - `CertManager` — the web UI is accessed over HTTPS using a certificate obtained from a clusterIssuer specified in the `certManager.clusterIssuerName` parameter.
          - `CustomCertificate` — the web UI is accessed over HTTPS using a certificate from the `d8-system` namespace.
          - `Disabled` — in this mode, the documentation web UI can only be accessed over HTTP.
          - `OnlyInURI` — HTTP access with an external HTTPS balancer. The balancer terminates HTTPS, and all links in [`user-authn`](/modules/user-authn/) are generated with the HTTPS scheme. The balancer must provide redirection from HTTP to HTTPS.
        enum:
          - "Disabled"
          - "CertManager"
          - "CustomCertificate"
          - "OnlyInURI"
      certManager:
        type: object
        description: |
          Parameters for certmanager.
        properties:
          clusterIssuerName:
            type: string
            default: "letsencrypt"
            x-examples: ["letsencrypt"]
            description: |
              What ClusterIssuer to use for getting an SSL certificate (currently, `letsencrypt`, `letsencrypt-staging`, `selfsigned` are available; also, you can define your own).
      customCertificate:
        type: object
        default: {}
        description: |
          Parameters for custom certificate usage.
        properties:
          secretName:
            type: string
            description: |
              Name of the Secret in the `d8-system` namespace to use with the documentation web UI.

              This secret must have the [kubernetes.io/tls](https://kubernetes.github.io/ingress-nginx/user-guide/tls/#tls-secrets) format.
  nodeSelector:
    type: object
    additionalProperties:
      type: string
    x-kubernetes-preserve-unknown-fields: true
    x-examples:
      - disktype: ssd
    description: |
      Same as in the pods' `spec.nodeSelector` parameter in Kubernetes.

      If the parameter is omitted or `false`, it will be determined [automatically](https://deckhouse.io/products/kubernetes-platform/documentation/v1/#advanced-scheduling).
  tolerations:
    type: array
    items:
      type: object
      properties:
        effect:
          type: string
        key:
          type: string
        operator:
          type: string
        tolerationSeconds:
          type: integer
          format: int64
        value:
          type: string
    x-examples:
      - - key: "key1"
          operator: "Equal"
          value: "value1"
          effect: "NoSchedule"
    description: |
      Same as in the pods' `spec.tolerations` parameter in Kubernetes;

      If the parameter is omitted or `false`, it will be determined [automatically](https://deckhouse.io/products/kubernetes-platform/documentation/v1/#advanced-scheduling).
  moduleStorage:
    type: object
    default: {}
    description: |
      Storage of the documentation of module versions, prepared when a version is opened for the first time.
    properties:
      s3:
        type: object
        default: {}
        description: |
          Where the prepared documentation of module versions is kept besides the cache of the documentation pod.
        # The external section is required with type: External.
        anyOf:
          - properties:
              type:
                enum: ["Disabled", "System"]
          - required: [external]
        properties:
          type:
            type: string
            enum: ["Disabled", "System", "External"]
            default: "Disabled"
            description: |
              - `Disabled` — only in the pod: after a restart of the pod the versions are prepared again when opened. In the high availability mode each replica prepares and keeps the versions on its own, with twice the CPU and the requests to the registry; turn S3 on for that mode.
              - `System` — also in the system S3 storage of the [system-s3](https://deckhouse.io/modules/system-s3/) module: after a restart of the pod the versions open from it in a fraction of a second. The module creates a 5 GiB bucket for it. Requires the `system-s3` module to be enabled: without it the versions are kept in the pod only, and the `D8DocumentationSystemS3Disabled` alert fires.
              - `External` — also in an S3 storage of your own, set in the `external` section.
          external:
            type: object
            required: [secretRef]
            description: |
              S3 storage of your own for `type: External`. The connection and the keys are taken from a Secret; the keys it holds are listed in the "S3 storage of your own" section of the usage page of the module.
            properties:
              secretRef:
                type: object
                required: [namespace, name]
                description: |
                  Secret with the connection and the keys of the S3 storage, in any namespace.

                  Deckhouse Platform copies it into the `documentation-s3-connection` Secret in `d8-system`. The documentation pod uses that Secret. After the Secret is created or changed, the documentation pod restarts within 5 minutes. Until the Secret appears, the versions are kept in the pod only.
                properties:
                  namespace:
                    type: string
                    maxLength: 63
                    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    x-examples: ["d8-system", "documentation-storage"]
                    description: |
                      Namespace of the Secret.
                  name:
                    type: string
                    maxLength: 253
                    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                    x-examples: ["documentation-s3"]
                    description: |
                      Name of the Secret.
              prefix:
                type: string
                default: "documentation/"
                pattern: '^([A-Za-z0-9][A-Za-z0-9._-]*/)+$'
                x-examples: ["documentation/", "clusters/main/documentation/"]
                description: |
                  Part of the bucket the module uses: every object it reads, writes or deletes has a key starting with this prefix. Other objects of the bucket stay untouched, so the bucket may be shared.
              size:
                type: string
                default: "5Gi"
                pattern: '^[1-9][0-9]*(Mi|Gi|Ti)$'
                x-examples: ["5Gi", "20Gi"]
                description: |
                  How much of the bucket the module may take under the prefix. Above 80% of it the module deletes stored versions until 60% is left, in this order:

                  1. Copies replaced after an update of the documentation template.
                  2. Versions opened by readers.
                  3. Versions used by the search.

                  Within each group the versions stored longest ago go first.
