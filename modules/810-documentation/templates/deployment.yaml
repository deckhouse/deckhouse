{{- if and .Values.global.modules.publicDomainTemplate .Values.global.clusterIsBootstrapped }}
{{- $s3 := include "documentation_s3" . }}
{{- /* The cache volume: 2 GiB of versions readers open, the rest for the pinned versions and the renders in progress. */}}
{{- $cacheSize := "4Gi" }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: documentation
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "documentation")) | nindent 2 }}
spec:
  {{- /* Replicas share only S3 (moduleStorage.s3.type: System or External); a user is pinned to one by a cookie (ingress.yaml). */}}
  {{- include "helm_lib_deployment_strategy_and_replicas_for_ha" . | nindent 2 }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: documentation
  template:
    metadata:
      labels:
        app: documentation
        app.kubernetes.io/part-of: deckhouse-docs
      # nginx gets its config with subPath and docs-builder reads the S3
      # connection once: a change of them restarts the pod. The ConfigMap of
      # system-s3 is not rendered here: hooks/s3_connection.go keeps its
      # checksum.
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if eq $s3 "External" }}
        checksum/s3-connection: {{ include (print $.Template.BasePath "/s3-connection.yaml") . | sha256sum }}
        {{- else if and (eq $s3 "System") .Values.documentation.internal.s3ConnectionChecksum }}
        checksum/s3-connection: {{ .Values.documentation.internal.s3ConnectionChecksum | quote }}
        {{- end }}
    spec:
      {{- include "helm_lib_node_selector" (tuple . "system") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple . "system") | nindent 6 }}
      {{- /* revisionScoped: a rollout on one suitable node does not wait forever for a second node. */}}
      {{- include "helm_lib_pod_anti_affinity_for_ha" (list . (dict "app" "documentation") (dict "revisionScoped" true)) | nindent 6 }}
      {{- include "helm_lib_priority_class" (tuple . "cluster-low") | nindent 6 }}
      {{ include "helm_lib_module_pod_security_context_run_as_user_deckhouse" . | nindent 6 }}
        fsGroup: 64535
      imagePullSecrets:
      - name: deckhouse-registry
      serviceAccountName: documentation
      # The ServiceAccount reads registry credentials (rbac-for-us.yaml). nginx
      # serves pages from third-party module images, so its container gets no
      # token: the kube-api-access volume goes to the builder and
      # kube-rbac-proxy only.
      automountServiceAccountToken: false
      containers:
      - name: web
        image: {{ include "helm_lib_module_image" (list $ "web") }}
        {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 8 }}
        ports:
          - containerPort: 8080
            name: http
            protocol: TCP
        lifecycle:
          preStop:
            exec:
              command: ["/usr/sbin/nginx", "-s", "quit"]
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_logs_with_extra" 10 | nindent 12 }}
            {{- include "web_resources" . | nindent 12 }}
          limits:
            cpu: 200m
            memory: 100Mi
        volumeMounts:
          - name: config
            mountPath: /app/config
          - name: nginx-config
            mountPath: /usr/conf/nginx.conf
            subPath: nginx.conf
          - mountPath: /tmp
            name: tmp
          - mountPath: /app/ondemand
            name: ondemand-cache
            readOnly: true
      - name: builder
        image: {{ include "helm_lib_module_image" (list $ "docsBuilder") }}
        {{ include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 8 }}
        args:
          # The API and the metrics stay on the loopback: nginx and
          # kube-rbac-proxy of this pod are their only clients.
          - --address=127.0.0.1:8081
          - --metrics-address=127.0.0.1:9090
          # Module versions rendered on demand; nginx serves them from this volume.
          - --ondemand-cache-dir=/app/ondemand
          - --ondemand-cache-size={{ $cacheSize }}
          {{- if eq $s3 "System" }}
          # The connection of the system S3 bucket and the token to get keys with.
          - --ondemand-s3-dir=/etc/system-s3
          - --ondemand-s3-size={{ include "documentation_s3_size" . }}
          {{- else if eq $s3 "External" }}
          # The connection and the static keys of the user's bucket; the
          # module keeps to its prefix there.
          - --ondemand-s3-dir=/etc/documentation-s3
          - --ondemand-s3-size={{ include "documentation_s3_size" . }}
          - --ondemand-s3-prefix={{ .Values.documentation.moduleStorage.s3.external.prefix }}
          {{- end }}
          {{- if ne (include "documentation_s3" .) "Disabled" }}
          # With S3 one replica reads the registry (the Lease
          # docs-builder-ondemand-leader); the other takes the versions from
          # S3 this often.
          - --ondemand-follow-interval=1m
          {{- end }}
        env:
          - name: HUGO_ENVIRONMENT
            value: production
          - name: GOMEMLIMIT
            value: "1800MiB"
          - name: HUGO_MEMORYLIMIT
            value: "1"
          - name: HUGO_NUMWORKERMULTIPLIER
            value: "2"
          - name: HUGO_D8_EDITION
            value: {{ $.Values.global.deckhouseEdition | quote }}
          {{- if eq .Values.global.deckhouseEdition "CSE" }}
          - name: HUGO_PARAMS_LINKREWRITEENABLE
            value: "true"
          {{- end }}
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
        # Probed through kube-rbac-proxy: the kubelet does not reach the loopback.
        # A restarting proxy should not restart a healthy builder, so the
        # liveness probe waits 100 seconds.
        livenessProbe:
          httpGet:
            path: /builder/healthz
            port: 8443
            scheme: HTTPS
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /builder/readyz
            port: 8443
            scheme: HTTPS
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_logs_with_extra" 10 | nindent 12 }}
            {{- include "builder_resources" . | nindent 12 }}
          limits:
            # VPA scales the limits with the requests; see vertical-pod-autoscaler.yaml.
            cpu: "1"
            memory: 2Gi
        volumeMounts:
          - mountPath: /tmp
            name: tmp
          - mountPath: /app/ondemand
            name: ondemand-cache
          - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            name: kube-api-access
            readOnly: true
          {{- if eq $s3 "System" }}
          - mountPath: /etc/system-s3/connection
            name: s3-connection
            readOnly: true
          - mountPath: /etc/system-s3/token
            name: s3-token
            readOnly: true
          {{- else if eq $s3 "External" }}
          - mountPath: /etc/documentation-s3/connection
            name: s3-connection
            readOnly: true
          {{- end }}
      - name: kube-rbac-proxy
        {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 8 }}
        image: {{ include "helm_lib_module_common_image" (list . "kubeRbacProxy") }}
        args:
          - "--secure-listen-address=$(KUBE_RBAC_PROXY_LISTEN_ADDRESS):8443"
          - "--client-ca-file=/etc/kube-rbac-proxy/ca.crt"
          - "--v=2"
          - "--logtostderr=true"
          - "--stale-cache-interval=1h30m"
          - "--livez-path=/livez"
        env:
          - name: KUBE_RBAC_PROXY_LISTEN_ADDRESS
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: KUBE_RBAC_PROXY_CONFIG
            value: |
              excludePaths:
              - /builder/healthz
              - /builder/readyz
              upstreams:
              - upstream: http://127.0.0.1:8081/healthz
                path: /builder/healthz
              - upstream: http://127.0.0.1:8081/readyz
                path: /builder/readyz
              - upstream: http://127.0.0.1:9090/metrics
                path: /metrics
                authorization:
                  resourceAttributes:
                    namespace: d8-system
                    apiGroup: apps
                    apiVersion: v1
                    resource: deployments
                    subresource: prometheus-metrics
                    name: documentation
              - upstream: http://127.0.0.1:8080/
                path: /
                authorization:
                  resourceAttributes:
                    namespace: d8-system
                    apiGroup: apps
                    apiVersion: v1
                    resource: deployments
                    subresource: http
                    name: documentation
        ports:
          - containerPort: 8443
            name: https
        livenessProbe:
          httpGet:
            path: /livez
            port: 8443
            scheme: HTTPS
        readinessProbe:
          httpGet:
            path: /livez
            port: 8443
            scheme: HTTPS
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 12 }}
            {{- include "helm_lib_container_kube_rbac_proxy_resources" . | nindent 12 }}
        volumeMounts:
          - name: kube-rbac-proxy-ca
            mountPath: /etc/kube-rbac-proxy
          - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            name: kube-api-access
            readOnly: true
      volumes:
        - name: config
          configMap:
            name: d8-deckhouse-version-info
        - name: nginx-config
          configMap:
            name: documentation-nginx-config
        - name: tmp
          emptyDir: {}
        # The same content the kubelet mounts when the token is automounted.
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        # Rendered module versions. docs-builder keeps the versions opened by
        # readers within 2 GiB and renders new ones next to them before
        # publishing. On top of that it keeps one pinned version of every
        # module for the search index and llms.txt. Measured on 2026-11-02:
        # 70 modules had documentation, 1.34 MB per version on average (both
        # languages), so 2 GiB holds about 1600 versions: 20 versions of 80
        # modules, or 5 versions of 300 modules. The other 2 GiB hold the
        # pinned versions and the renders in progress.
        - name: ondemand-cache
          emptyDir:
            sizeLimit: {{ $cacheSize }}
        {{- if eq $s3 "System" }}
        # Written by system-s3 once the bucket is ready; files, unlike
        # environment variables, appear in the running pod.
        - name: s3-connection
          configMap:
            name: documentation-s3-connection
            optional: true
        - name: s3-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: system-s3-sts
                  expirationSeconds: 3600
        {{- else if eq $s3 "External" }}
        # The copy of the Secret of the user (s3-connection.yaml); without it
        # the volume stays empty and the versions are kept in the pod only.
        - name: s3-connection
          secret:
            secretName: documentation-s3-connection
            optional: true
        {{- end }}
        - name: kube-rbac-proxy-ca
          configMap:
            defaultMode: 420
            name: kube-rbac-proxy-ca.crt
{{- end }}
