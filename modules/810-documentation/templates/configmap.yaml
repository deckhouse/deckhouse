{{- /* Compression of the pages that carry SSI includes. */ -}}
{{- define "documentation_gzip_after_ssi" -}}
# The pages carry SSI includes: a gzip copy sent as is would keep them
# unexpanded, without the header and the scripts. The pages are compressed
# after SSI instead.
gzip on;
gzip_types text/css application/javascript application/json text/plain image/svg+xml text/markdown application/xml text/xml;
gzip_vary on;
# Also behind a proxy that adds Via.
gzip_proxied any;
{{- end }}
{{- /*
  Documentation of a specific module version, rendered on demand by
  docs-builder into the cache volume shared with nginx (/app/ondemand). Under
  .site the volume mirrors the URL layout with links to the rendered versions,
  so nginx serves a rendered page as a plain file and reports the access over
  syslog: opened versions are evicted last. A page that is not there, and the
  list of module versions, go to docs-builder, which renders the version and
  answers with a placeholder meanwhile. Comes before the generic module
  location, which would take the version for a page path.
*/ -}}
{{- define "documentation_ondemand_locations" }}
location ~ ^/(ru|en)/modules/[a-z0-9-]+/(v[0-9]+\.[0-9]+\.[0-9]+[^/]*/|versions/$) {
  root /app/ondemand/.site;
  access_log syslog:server=127.0.0.1:5514,nohostname,tag=docs_ondemand ondemand_access;
  {{- include "documentation_gzip_after_ssi" . | nindent 2 }}
  try_files $uri $uri/ @ondemand_render;
}

location @ondemand_render {
  proxy_pass http://127.0.0.1:8081;
}

# The read-only API of on-demand rendering: render status for the placeholder
# page, the list of module versions and the menu of a module
# (/api/v2/modules/{module}/menu). The rest of the docs-builder API stays
# internal.
location ^~ /api/v2/ {
  limit_except GET { deny all; }
  proxy_pass http://127.0.0.1:8081;
}

# Pages of a directory of .site served at another address: a development
# branch of a module (ModulePullOverride, see documentation_ondemand_branch)
# and the version a module serves without a version in the address (see
# documentation_modules_locations).
location ^~ /ondemand-branch/ {
  internal;
  root /app/ondemand/.site;
  {{- include "documentation_gzip_after_ssi" . | nindent 2 }}
  rewrite ^/ondemand-branch(/.*)$ $1 break;
}
{{- end }}

{{- /* The URL of a development branch, /<lang>/modules/<module>/<branch>/, looks
  like a page of the module, so the generic module location first looks the
  branch up among the versions docs-builder has published. */}}
{{- define "documentation_ondemand_branch" -}}
set $ondemand_branch_dir "";
set $ondemand_branch_slash "";
set $ondemand_doc_dir "";
if ($uri ~ "^/(?<ondemand_lang>ru|en)/modules/(?<ondemand_module>[a-z0-9-]+)/(?<ondemand_tag>[a-z0-9_][a-z0-9_.-]*)(?<ondemand_rest>/.*)?$") {
  set $ondemand_branch_dir /app/ondemand/.site/$ondemand_lang/modules/$ondemand_module/$ondemand_tag;
  set $ondemand_doc_dir /app/ondemand/.site/$ondemand_lang/modules/$ondemand_module/stable/$ondemand_tag;
}
# A directory of the module pages wins over a branch of the same name.
if (-d $ondemand_doc_dir) {
  set $ondemand_branch_dir "";
}
# The branch typed without the trailing slash.
if ($ondemand_rest = "") {
  set $ondemand_branch_slash $ondemand_branch_dir;
  set $ondemand_branch_dir "";
}
if (-d $ondemand_branch_dir) {
  rewrite ^ /ondemand-branch$uri last;
}
if (-d $ondemand_branch_slash) {
  rewrite ^ $uri/ redirect;
}
{{- end }}
{{- /* The list of modules and the pages of a module without a version
  (/<lang>/modules/<module>/[<channel>/]<page>). docs-builder builds the list and links the
  version it serves for a module, the installed one or that of the most
  stable release channel of a disabled module, as
  .site/<lang>/modules/<module>/stable. A
  module docs-builder has not published yet goes to it: the list answers
  with a placeholder, a module page leads to its version. An embedded
  module comes with the image. */}}
{{- define "documentation_modules_locations" }}
location ~* ^/(?<list_lang>ru|en)/modules/$ {
  {{- include "documentation_gzip_after_ssi" . | nindent 2 }}
  try_files /ondemand/.index/$list_lang/modules/index.html @ondemand_render;
}

{{ include "documentation_ondemand_locations" . }}

location ~* ^/(?<module_lang>ru|en)/modules/(?<module>[^/]+)/((alpha|beta|early-access|stable|rock-solid|latest)/)?(?<doc_path>.*)$ {
  {{- include "documentation_ondemand_branch" . | nindent 2 }}

  set $embedded_module_path "embedded-modules/$module_lang/modules/$module";
  set $embedded_module_url "/embedded-modules/$module_lang/modules/$module/$doc_path";

  # A directory of the module typed without the trailing slash: the
  # relative links of its page need it, at the address as it was typed.
  set $module_dir "";
  if (-d /app/ondemand/.site/$module_lang/modules/$module/stable/$doc_path) {
    set $module_dir "1";
  }
  if ($uri ~ /$) {
    set $module_dir "";
  }
  if ($module_dir) {
    return 301 $uri/$is_args$args;
  }
  if (-d /app/ondemand/.site/$module_lang/modules/$module/stable) {
    rewrite ^ /ondemand-branch/$module_lang/modules/$module/stable/$doc_path last;
  }

  if (-d $document_root/$embedded_module_path) {
    # Use internal redirect to serve embedded modules
    rewrite ^ $embedded_module_url last;
  }

  # docs-builder leads to the version; its 404 gets the 404 page.
  proxy_intercept_errors on;
  proxy_pass http://127.0.0.1:8081;
}
{{- end }}
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: documentation-nginx-config
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "documentation")) | nindent 2 }}
data:
  nginx.conf: |-
{{- if eq .Values.global.deckhouseEdition "CSE" }}
    worker_processes 1;

    error_log /dev/stderr warn;
    pid       /tmp/nginx.pid;

    events {
      worker_connections 1024;
      multi_accept on;
    }

    http {
      include       /usr/conf/mime.types;
      default_type  application/octet-stream;

      # Add MIME type for ES modules (.mjs files)
      types {
        application/javascript mjs;
      }

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      access_log off;
      log_format ondemand_access '$uri';

      log_format json_combined escape=json '{ "time_local": "$time_local", '
        '"host": "$host", '
        '"remote_addr": "$remote_addr", '
        '"remote_user": "$remote_user", '
        '"request": "$request", '
        '"status": "$status", '
        '"body_bytes_sent": "$body_bytes_sent", '
        '"request_time": "$request_time", '
        '"http_referrer": "$http_referer", '
        '"http_user_agent": "$http_user_agent" }';

      keepalive_timeout  65;

      ssi on;
      gzip off;
      port_in_redirect off;
      absolute_redirect off;

      server {
        listen   127.0.0.1:8080;
        server_name _;

        root   /app;
        index  index.html readme.html;

        set $redirection_lang "ru";

        error_page 403 404 /$redirection_lang/404.html;

        charset utf-8;
        access_log     /dev/stdout json_combined;

        rewrite ^/$ /$redirection_lang/$is_args$args redirect;
        # There is no English language version of the documentation in CSE edition, so we always redirect.
        rewrite ^/en/(?<path>.*)$ /$redirection_lang/$path$is_args$args redirect;
        rewrite ^/(ru/)?modules$ /$redirection_lang/modules/$is_args$args redirect;
        rewrite ^/(ru/)?modules/[0-9]+-(?<module_doc>[^/]+/.*)$ /$1modules/$module_doc redirect;
        rewrite ^/(ru/)?modules/(?<module>[^/.]+)$ /$redirection_lang/modules/$module/$is_args$args redirect;
        rewrite ^/(ru/)?modules/(?<module>[^/.]+)/(?<channel>alpha|beta|early-access|stable|rock-solid)$ /ru/modules/$module/$channel/ redirect;
        # A module version or the versions page typed without the trailing slash.
        rewrite ^/ru/modules/(?<ondemand_module>[a-z0-9-]+)/(?<ondemand_version>v[0-9]+\.[0-9]+\.[0-9]+[^/]*|versions)$ /ru/modules/$ondemand_module/$ondemand_version/ redirect;
        rewrite ^/?!(ru/|en/|assets/|css/|js/|images/|presentations/|includes/|[a-z0-9]+\.[a-z0-9]+).*$ /$redirection_lang/$uri$is_args$args redirect;
        rewrite ^/modules/.*$ /$redirection_lang$uri$is_args$args redirect;
        rewrite ^/(products/kubernetes-platform/)?documentation/v[\d]+[^\/]*/(?<path>.*)?$ /$redirection_lang/$path$is_args$args redirect;
        rewrite ^/(ru/|en/)?(products/kubernetes-platform/)?documentation/v[\d]+[^\/]*/(?<path>.*)?$ /$redirection_lang/$path$is_args$args redirect;
        rewrite ^/(ru/|en/)?platform/(?<path>.+)$ /$redirection_lang/$path$is_args$args redirect;

        location /link_test_report.txt {
            deny all;
        }

        location = /healthz {
            access_log  off;
            add_header Content-Type text/plain;
            return 200;
        }

        location /config {
            try_files $uri $uri/ =404;
        }

        # Common assets
        location ~* ^(/ru|/en)?/((assets|css|js|images|presentations)/.+)$ {
            set $doc_path $2;
            try_files /docs-dkp/$doc_path /embedded-modules/$doc_path =404;
        }

        # Includes
        location ~* ^/(ru|en)/includes/.+$ {
            try_files /docs-dkp/$uri =404;
        }
        location ~* ^/includes/.+$ {
            try_files /docs-dkp/$redirection_lang/$uri =404;
        }

        # Search index for modules from sources
        location ~* ^/(ru|en)/modules/search-external-modules-index.json$  {
            # docs-builder writes a gzip copy next to its files.
            gzip_static on;
            gzip_vary on;
            # Also behind a proxy that adds Via.
            gzip_proxied any;
            try_files /ondemand/.index/$redirection_lang/search.json =404;
        }

        # Search index for embedder modules
        location ~* ^/(ru|en)/modules/search-embedded-modules-index.json$  {
            try_files /embedded-modules/$redirection_lang/search-embedded-modules-index.json =404;
        }

        {{- include "documentation_modules_locations" . | nindent 8 }}

        # Internal location for embedded modules
        location ~* ^/embedded-modules/(ru|en)/modules/.*$ {
            internal;
            try_files $uri $uri/index.html $uri/ =404;
        }

        location / {
            alias /app/docs-dkp/;
            try_files $uri $uri/ $redirection_lang/$uri $redirection_lang/$uri/ =404;
        }
      }
    }
{{- else }}
    worker_processes 1;

    error_log /dev/stderr warn;
    pid       /tmp/nginx.pid;

    events {
      worker_connections 1024;
      multi_accept on;
    }

    http {
      include       /usr/conf/mime.types;
      default_type  application/octet-stream;

      # Add MIME type for ES modules (.mjs files)
      # and for the per-page Markdown of the AI export (.md files).
      types {
        application/javascript mjs;
        text/markdown md;
      }

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      access_log off;
      log_format ondemand_access '$uri';

      log_format json_combined escape=json '{ "time_local": "$time_local", '
        '"host": "$host", '
        '"remote_addr": "$remote_addr", '
        '"remote_user": "$remote_user", '
        '"request": "$request", '
        '"status": "$status", '
        '"body_bytes_sent": "$body_bytes_sent", '
        '"request_time": "$request_time", '
        '"http_referrer": "$http_referer", '
        '"http_user_agent": "$http_user_agent" }';

      keepalive_timeout  65;

      ssi on;
      gzip off;
      port_in_redirect off;
      absolute_redirect off;

     # Validation map for lang from cookie - only accept "ru" or "en"
     map $cookie_lang $valid_cookie_lang {
         "~^(ru|en)$" $cookie_lang;  # Only accept exact "ru" or "en"
         default "";                 # Treat any other value as invalid/empty
     }

     # Extract the language from URI
      map $uri $uri_lang {
        "~^/ru/"      "ru";
        "~^/en/"      "en";
        default       "en";
      }

      # Parse Accept-Language header to get browser preference
      map $http_accept_language $preferred_browser_lang {
        default       "en";
        "~*ru"        "ru";
      }

      # Lang map 3 (final decision): Determine the final language priority: Cookie > URI > Browser > Default
      map $valid_cookie_lang $redirection_lang {
          # Priority 1: Use valid cookie if available
          "ru" "ru";
          "en" "en";

          # If cookie is not set, use browser language
          default $preferred_browser_lang;
      }

      # Set cookie only if not present
      map $cookie_lang $set_lang_cookie {
          "" "lang=$uri_lang; Path=/; Max-Age=31536000";
          default "";
      }

      server {
        listen   127.0.0.1:8080;
        server_name _;

        root   /app;
        index  index.html readme.html;
        error_page 403 404 /$redirection_lang/404.html;

        charset utf-8;
        # `charset` only appends the encoding to the types listed here, and the
        # default list has no text/markdown: the per-page Markdown of the AI
        # export would be served without a charset and a browser would guess it.
        charset_types text/xml text/plain text/vnd.wap.wml application/javascript application/rss+xml text/markdown;
        access_log     /dev/stdout json_combined;

        add_header Set-Cookie $set_lang_cookie;

        rewrite ^/$ /$redirection_lang/$is_args$args redirect;
        rewrite ^/(ru/|en/)?modules$ /$redirection_lang/modules/$is_args$args redirect;
        rewrite ^/(ru/|en/)?modules/[0-9]+-(?<module_doc>[^/]+/.*)$ /$1modules/$module_doc redirect;
        rewrite ^/(ru/|en/)?modules/(?<module>[^/.]+)$ /$redirection_lang/modules/$module/$is_args$args redirect;
        rewrite ^/(ru/|en/)?modules/(?<module>[^/.]+)/(?<channel>alpha|beta|early-access|stable|rock-solid)$ /modules/$module/$channel/ redirect;
        # A module version or the versions page typed without the trailing slash.
        rewrite ^/(?<ondemand_lang>ru|en)/modules/(?<ondemand_module>[a-z0-9-]+)/(?<ondemand_version>v[0-9]+\.[0-9]+\.[0-9]+[^/]*|versions)$ /$ondemand_lang/modules/$ondemand_module/$ondemand_version/ redirect;
        rewrite ^/?!(ru/|en/|assets/|css/|js/|images/|presentations/|includes/|[a-z0-9]+\.[a-z0-9]+).*$ /$redirection_lang/$uri$is_args$args redirect;
        rewrite ^/modules/.*$ /$redirection_lang$uri$is_args$args redirect;
        rewrite ^/(products/kubernetes-platform/)?documentation/v[\d]+[^\/]*/(?<path>.*)?$ /$redirection_lang/$path$is_args$args redirect;
        rewrite ^/(ru/|en/)?(products/kubernetes-platform/)?documentation/v[\d]+[^\/]*/(?<path>.*)?$ /$redirection_lang/$path$is_args$args redirect;
        rewrite ^/(ru/|en/)?platform/(?<path>.+)$ /$redirection_lang/$path$is_args$args redirect;

        location /link_test_report.txt {
            deny all;
        }

        location = /healthz {
            access_log  off;
            add_header Content-Type text/plain;
            return 200;
        }

        location /config {
            try_files $uri $uri/ =404;
        }

        # Common assets
        location ~* ^(/ru|/en)?/((assets|css|js|images|presentations)/.+)$ {
            set $doc_path $2;
            try_files /docs-dkp/$doc_path /embedded-modules/$doc_path =404;
        }

        # Includes
        location ~* ^/(ru|en)/includes/.+$ {
            try_files /docs-dkp/$uri =404;
        }
        location ~* ^/includes/.+$ {
            try_files /docs-dkp/$redirection_lang/$uri =404;
        }

        # Search index for modules from sources
        location ~* ^/(?<lang>ru|en)/modules/search-external-modules-index.json$  {
            # docs-builder writes a gzip copy next to its files.
            gzip_static on;
            gzip_vary on;
            # Also behind a proxy that adds Via.
            gzip_proxied any;
            try_files /ondemand/.index/$lang/search.json =404;
        }

        # Search index for embedder modules
        location ~* ^/(?<lang>ru|en)/modules/search-embedded-modules-index.json$  {
            try_files /embedded-modules/$lang/search-embedded-modules-index.json =404;
        }

        # AI export of the modules from sources (see internal/aiexport of docs-builder).
        # The per-page .md files are served by the generic module location below.
        location ~* ^/(?<lang>ru|en)/modules/embedded-llms\.txt$  {
            try_files /embedded-modules/$lang/embedded-llms.txt =404;
        }

        location ~* ^/(?<lang>ru|en)/modules/embedded-corpus\.json$  {
            try_files /embedded-modules/$lang/embedded-corpus.json =404;
        }

        location ~* ^/(?<lang>ru|en)/modules/external-llms\.txt$  {
            # docs-builder writes a gzip copy next to its files.
            gzip_static on;
            gzip_vary on;
            # Also behind a proxy that adds Via.
            gzip_proxied any;
            try_files /ondemand/.index/$lang/llms.txt =404;
        }

        location ~* ^/(?<lang>ru|en)/modules/external-corpus\.json$  {
            # docs-builder writes a gzip copy next to its files.
            gzip_static on;
            gzip_vary on;
            # Also behind a proxy that adds Via.
            gzip_proxied any;
            try_files /ondemand/.index/$lang/corpus.json =404;
        }

        {{- include "documentation_modules_locations" . | nindent 8 }}

        # Internal location for embedded modules
        location ~* ^/embedded-modules/(ru|en)/modules/.*$ {
            internal;
            try_files $uri $uri/index.html $uri/ =404;
        }

        location / {
            alias /app/docs-dkp/;
            try_files $uri $uri/ $redirection_lang/$uri $redirection_lang/$uri/ =404;
        }
      }
    }
{{- end }}
