{{- if and .Values.global.modules.publicDomainTemplate  .Values.global.clusterIsBootstrapped }}
---
kind: Service
apiVersion: v1
metadata:
  name: documentation
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "documentation")) | nindent 2 }}
spec:
  ports:
  - name: https
    port: 443
    targetPort: https
    protocol: TCP
  - name: pprof
    port: 6060
    targetPort: pprof
    protocol: TCP
  selector:
    app: documentation
{{- end }}
