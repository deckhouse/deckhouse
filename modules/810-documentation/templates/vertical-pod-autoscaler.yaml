{{- define "web_resources" }}
cpu: 25m
memory: 50Mi
{{- end }}

{{- define "builder_resources" }}
cpu: 250m
memory: 256Mi
{{- end }}

{{- if (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: documentation
  namespace: d8-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "documentation")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: documentation
  updatePolicy:
    updateMode: "InPlaceOrRecreate"

  resourcePolicy:
    containerPolicies:
    - containerName: "web"
      minAllowed:
        {{- include "web_resources" . | nindent 8 }}
      maxAllowed:
        cpu: 200m
        memory: 100Mi
    # VPA scales the limits with the requests in the proportion set in the
    # deployment (CPU 250m:1, memory 256Mi:2Gi). The CPU request is kept at
    # 250m, so the limit stays one core: rendering a module version on demand
    # is CPU-bound, and the idle builder made VPA lower the request to 100m,
    # the limit to 400m. Measured 2026-11-03: the builder was throttled in 60%
    # of the CFS periods, a render took 2.9 times longer than on one core.
    # Memory is not scaled: a limit below GOMEMLIMIT would get the full site
    # build OOM-killed.
    - containerName: "builder"
      minAllowed:
        cpu: 250m
        memory: 256Mi
      maxAllowed:
        cpu: 250m
        memory: 256Mi
    {{- include "helm_lib_vpa_kube_rbac_proxy_resources" . | nindent 4 }}
{{- end }}
