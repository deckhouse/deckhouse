relativeURLs: false
params:
  mode: module
  # Turn on/off link rewriting in rendered HTML (see layouts/_markup/render-link.html).
  # Turned on for the CSE edition in ENV in the modules/810-documentation/templates/deployment.yaml
  linkRewriteEnable: false
  linkRewrite:
    # Allowed hosts. Applied only to absolute http(s) URLs: for a link whose host
    # is not listed here (and is not a subdomain of a listed host), the <a> tag
    # is unwrapped — the tag is dropped, the link text stays. Non-http(s) URLs
    # (relative paths, mailto:, tel:, #anchor) and links with title "keep-link"
    # skip the whitelist check.
    whitelistHosts:
      - deckhouse.ru
      - deckhouse.io
      - flant.com
      - flant.ru
    # Regex substitutions applied to every link (both relative and absolute) BEFORE
    # the whitelist check. First matching rule wins. A rule may rewrite an absolute
    # URL into a relative one — the result then skips the whitelist check.
    # Uses Go regexp syntax (RE2); use $1, $2 for capture groups in the replacement.
    # Don't forget to put changes also in the modules/810-documentation/images/web/_config_cse.yml for internal modules docs build.
    replace:
      - from: '^(.*)/platform/(.*)$'
        to: '$1/$2'
      - from: '^.*/deckhouse-configure-global.html(.*)$'
        to: '/ru/reference/api/global.html$1'
      - from: '^(.*/modules/)[0-9]+-([^/]+/.*)$'
        to: '$1$2'
    # Regex patterns for explicit link removal. Applied AFTER replace, BEFORE the
    # whitelist check, to every link (relative or absolute). A link whose href
    # matches ANY of these patterns gets its <a> tag unwrapped (text stays).
    # Uses Go regexp syntax (RE2).
    # Don't forget to put changes also in the modules/810-documentation/images/web/_config_cse.yml for internal modules docs build.
    remove:
    - '^.*(/products/kubernetes-platform/documentation/(latest|v[0-9]+(\.[0-9]+)?)?/)?architecture/.*$'
    - '^.*(/products/kubernetes-platform/documentation/(latest|v[0-9]+(\.[0-9]+)?)?/)?user/.*$'
    - '^.*(/products/kubernetes-platform/documentation/(latest|v[0-9]+(\.[0-9]+)?)?/)?admin/.*$'
    - '^.*(/products/kubernetes-platform/documentation/(latest|v[0-9]+(\.[0-9]+)?)?/)?reference/(release-channels\.html|oss_info\.html|supported_versions\.html).*$'
    - '^\./(release-channels\.html|oss_info\.html).*$'
    - '^.*/products/kubernetes-platform/features/.*$'
    - '^.*/cloud-provider-gcp/.*$'
    - '^.*/cloud-provider-yandex/.*$'
    - '^.*/cloud-provider-aws/.*$'
    - '^.*/cloud-provider-azure/.*$'
    - '^.*/cloud-provider-vsphere/.*$'
    - '^.*/cloud-provider-openstack/.*$'
    - '^.*/modules/openvpn/.*$'
    - '^.*/cni-flannel/.*$'
    - '^.*/prometheus-pushgateway/.*$'
    - '^.*/csi-s3/.*$'
    - '^.*/csi-vsphere/.*$'
    - '^.*/sds-replicated-volume/.*$'
    - '^.*/state-snapshotter/.*$'
    - '^.*/sds-elastic/.*$'

markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    duplicateResourceFiles: true

languages:
  en:
    disabled: false
    title: Deckhouse modules
    weight: 0
    baseURL: /en/
    params:
      description: "Kubernetes is flexibly and rapidly expanded by Deckhouse modules."
  ru:
    disabled: false
    weight: 1
    title: Модули Deckhouse
    baseURL: /ru/
    params:
      description: "Kubernetes гибко и быстро расширяется модулями Deckhouse."
