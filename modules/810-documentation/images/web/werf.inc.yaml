{{- $_ := set . "Env" (.Env | default "EE") }}

{{- $_ := set . "Mode" "production" }}
{{- $_ := set . "Edition" "EE" }}
{{- if or (eq $.Env "CE") (eq $.Env "BE") (eq $.Env "SE") (eq $.Env "SE-plus") (eq $.Env "EE") (eq $.Env "CSE") -}}
  {{- $_ := set . "Edition" $.Env }}
{{- else if eq $.Env "FE"  }}
  {{- $_ := set . "Edition" "EE" }}
{{- else }}
  {{- $_ := set . "Mode" $.Env }}
{{- end }}

---
# Nginx for serving documentation static files
# Image documentation/web (for website)
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-nginx-artifact
  add: /relocate-pm/usr/sbin/nginx
  to: /usr/sbin/nginx
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-nginx-artifact
  add: /relocate-pm/usr/conf/mime.types
  to: /usr/conf/mime.types
  before: setup
{{- include "image mount points" . }}
- from: {{ .ModuleName }}/{{ .ImageName }}/static
  add: /app/_site/documentation
  to: /app/docs-dkp
  before: setup
  excludePaths:
  - '*/gs/'
  - search-index.json
  - '*/sitemap*.xml'
  - '*/robots.txt'
- from: {{ .ModuleName }}/modules-embedded/static-artifact
  add: /app/_site/
  to: /app/embedded-modules
  before: setup
  includePaths:
{{- if ne .Edition "CSE" }}
  - en
{{- end }}
  - ru
imageSpec:
  config:
    entrypoint: [ "/usr/sbin/nginx", "-e", "/dev/stderr", "-g", "daemon off;" ]
{{- include "pm_binaries_artifact" (dict
      "Images" .Images
      "name" (printf "%s/%s-nginx-artifact" .ModuleName .ImageName)
      "packages" "nginx"
      "binaries" "/usr/sbin/nginx"
      "post" `mkdir -p "$out/usr/conf"
cp /out/usr/conf/mime.types "$out/usr/conf/mime.types"
# Only the binary and mime.types are imported, so a pm nginx that stops being static
# would arrive without its libraries.
if patchelf --print-interpreter "$out/usr/sbin/nginx" >/dev/null 2>&1; then
  echo "FATAL: nginx from pm is no longer statically linked" >&2
  exit 1
fi`) }}
---
{{ tpl (.Files.Get (printf "%sdocs/documentation/werf-documentation-static.inc.yaml" .ModulePath)) . }}
{{ tpl (.Files.Get (printf "%sdocs/documentation/werf-modules-static.inc.yaml" .ModulePath)) . }}
{{ tpl (.Files.Get (printf "%sdocs/documentation/werf-jekyll-base.inc.yaml" .ModulePath)) . }}
