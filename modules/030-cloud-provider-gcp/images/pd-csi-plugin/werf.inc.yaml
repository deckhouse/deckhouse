{{- $csiFilter := list
      "/usr/bin/chmod" "/usr/bin/mkdir" "/usr/bin/rmdir" "/usr/bin/mount" "/usr/bin/umount" "/usr/bin/findmnt" "/usr/bin/lsblk"
      "/usr/sbin/blkid" "/usr/sbin/blkdiscard" "/usr/sbin/blockdev" "/usr/sbin/dumpe2fs" "/usr/sbin/e2fsck" "/usr/sbin/e2label"
      "/usr/sbin/findfs" "/usr/sbin/fstrim" "/usr/sbin/fsfreeze" "/usr/sbin/fsck" "/usr/sbin/fsck.ext2" "/usr/sbin/fsck.ext3" "/usr/sbin/fsck.ext4"
      "/usr/sbin/mke2fs" "/usr/sbin/mkfs" "/usr/sbin/mkfs.ext2" "/usr/sbin/mkfs.ext3" "/usr/sbin/mkfs.ext4" "/usr/sbin/resize2fs"
      "/usr/sbin/parted"
      "/usr/bin/fsck.xfs" "/usr/bin/mkfs.xfs" "/usr/bin/xfs_growfs" "/usr/bin/xfs_repair" "/usr/bin/xfs_io"
      "/usr/bin/btrfs" "/usr/bin/btrfstune" "/usr/bin/mkfs.btrfs"
      "/usr/sbin/nvme" "/usr/lib/udev/scsi_id:/lib/udev_containerized/scsi_id"
      "/usr/lib/libparted-fs-resize.so.0" }}
{{- $version_map := include "get_oss_version_map_by_id_and_condition_key" (list "csi-gcp" "k8s" $) | fromYaml }}
{{- range $key, $value := $version_map }}
  {{- $image_version := toString $key | replace "." "-" }}
  {{- $version := toString $value }}
  {{- if $version }}
    {{- $patches := (printf "/%smodules/%s-%s/images/%s" $.ModulePath $.ModulePriority $.ModuleName $.ImageName) }}
    {{- $patch := false }}
    {{- range $path, $_ := $.Files.Glob (printf "%s/patches/%s/*.patch" $patches $version) }}
        {{- $patch = true }}
    {{- end }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /src/bin/gce-pd-csi-driver
  to: /gce-pd-csi-driver
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-pm-artifact
  add: /relocate-pm
  to: /
  before: install
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /src/deploy/kubernetes/udev/google_nvme_id
  to: /lib/udev_containerized/google_nvme_id
  before: setup
imageSpec:
  config:
    entrypoint: ["/gce-pd-csi-driver"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/src" }}
git:
  - url: {{ $.SOURCE_REPO }}/kubernetes-sigs/gcp-compute-persistent-disk-csi-driver.git
    tag: {{ $version }}
    add: /
    to: /src
    stageDependencies:
      install: ['**/*']
{{- if $patch }}
  - add: {{ $patches }}/patches/{{ $version }}
    to: /patches
    stageDependencies:
      install:
        - '**/*'
{{- end }}
shell:
  install:
  - cd /src
  {{- if $patch}}
  - git apply /patches/*.patch --verbose
  {{- end}}
  - rm -rf vendor
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/golang" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" $ }}
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
shell:
  install:
  - cd /src
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
  setup:
  - cd /src
  - mkdir -p bin
  - CGO_ENABLED=0 go build -ldflags "-extldflags=static -X main.version={{ $version }}" -o bin/gce-pd-csi-driver ./cmd/gce-pd-csi-driver/
---
{{- include "vex mitigation" (list $ (printf "%s/%s-%s" $.ModuleName $.ImageName $image_version )) }}
{{- end }}
{{- end }}
{{- include "pm_binaries_artifact" (dict
      "Images" $.Images
      "name" (printf "%s/%s-pm-artifact" $.ModuleName $.ImageName)
      "packages" "coreutils e2fsprogs xfsprogs util-linux parted btrfs-progs nvme-cli udev"
      "binaries" (join " " $csiFilter)) }}
