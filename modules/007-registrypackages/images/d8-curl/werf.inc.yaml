---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /
  to: /
  includePaths:
  - opt/deckhouse
  - install
  - uninstall
  before: install
imageSpec:
  config:
    labels: { "distro": "all", "version": "all" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /{{ $.ModulePath }}modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
  to: /
  stageDependencies:
    install:
    - '**/*'
shell:
  beforeInstall:
  - pm install file findutils patchelf
  install:
  # -n, because without it pm consults the builder's own package index and skips whatever
  # is already installed there — glibc among it. The tree under /src then comes out without
  # /src/lib64, so the package ships no loader at all and nothing in it starts on a node.
  - pm install -n curl -d /src
  - mkdir -p /opt/deckhouse/bin /opt/deckhouse/lib
  - cp -pr /src/usr/bin/curl /opt/deckhouse/bin/d8-curl
  - cp -pr /src/usr/lib64/*.so* /opt/deckhouse/lib
  - cp -pr /src/usr/lib/*.so* /opt/deckhouse/lib
  - cp -pr /src/lib64/*.so* /opt/deckhouse/lib
  {{- include "relocate_and_verify" (dict "smoke" (list "/opt/deckhouse/bin/d8-curl --version")) | nindent 2 }}
