{{- $version := "08.04.25" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "builder/scratch" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /
  to: /
  includePaths:
  - kubernetes-api-proxy.tar
  - install
  - uninstall
  before: setup
imageSpec:
  config:
    labels: {"distro": "all", "version": "all", "kubernetes-api-proxy": "{{ $version }}" }
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
from: {{ index $.Images "builder/golang-alpine" }}
final: false
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/scripts
  to: /
  stageDependencies:
    setup:
    - '**/*'
import:
- from: common/crane
  add: /crane
  to: /crane
  before: setup
- from: {{ index $.Images "tools/jq" }}
  add: /usr/bin/jq
  before: setup
dependencies:
- image: node-manager/kubernetes-api-proxy
  before: setup
  imports:
  - type: ImageDigest
    targetEnv: IMAGE_DIGEST
  - type: ImageRepo
    targetEnv: IMAGE_REPO
secrets:
- id: REGISTRY_USER
  env: REGISTRY_USER
- id: REGISTRY_PASSWORD
  env: REGISTRY_PASSWORD
shell:
  setup:
  - export param="--insecure"
  - /crane pull --format oci 172.17.0.2:5000/deckhouse3@$IMAGE_DIGEST $param /tmp/image
  - rm -f ~/.docker/config.json
  - jq '.manifests[0].annotations = {"org.opencontainers.image.ref.name":"deckhouse.local/images:kubernetes-api-proxy"}' /tmp/image/index.json > /tmp/index.updated.json && mv /tmp/index.updated.json /tmp/image/index.json
  - tar -C /tmp/image -cf /kubernetes-api-proxy.tar .
  - rm -rf /tmp/image
