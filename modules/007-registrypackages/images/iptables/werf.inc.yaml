{{/*
  Important! The xtables binaries from this file are also used by kube-proxy,
  cni-simple-bridge, cni-cilium, cni-flannel, node-local-dns, istio, openvpn,
  network-policy-engine, network-gateway, debug-container and cni-migration-controller.

  Two builds, because the two kinds of consumer need different things:

    registrypackages/iptables-static-artifact — /xtables-*-multi for images, linked
      statically against glibc. Most images get iptables through
      helm_lib_module_init_container_iptables_wrapper, which hands the main container nothing
      but the binaries copied into a shared /sbin emptyDir: a dynamic binary arrives
      there without its loader and libraries and fails with "no such file or directory".
      A static one runs in any container as it is.

    registrypackages/iptables-artifact        — /opt/deckhouse/{bin,lib} for nodes,
      taken from pm and repointed and checked by relocate_and_verify the way every other node
      package is.
*/}}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: scratch
import:
- image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /
  to: /
  includePaths:
  - opt/deckhouse
  - install
  - uninstall
  before: install
imageSpec:
  config:
    labels: { "distro": "all", "version": "all" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
  to: /
  includePaths:
  - install
  - uninstall
  stageDependencies:
    install:
    - '**/*'
shell:
  beforeInstall:
  - pm install file findutils patchelf
  install:
  # libc is asked for by name: the iptables package alone brings its own libraries but no
  # glibc, and -n keeps pm from skipping what the builder already has.
  - pm install -n iptables libc -d /src
  - mkdir -p /opt/deckhouse/bin /opt/deckhouse/lib
  - cp -pr /src/usr/bin/xtables-legacy-multi /src/usr/bin/xtables-nft-multi /opt/deckhouse/bin
  {{- include "relocate_and_verify" (dict "resolve" "/src" "smoke" (list "/opt/deckhouse/bin/xtables-nft-multi iptables --version" "/opt/deckhouse/bin/xtables-legacy-multi iptables --version")) | nindent 2 }}
{{- $iptables_version := include "get_oss_version_by_id" (list "iptables" $ ) }}
{{- $libmnl_version := include "get_oss_version_by_id" (list "libmnl" $ ) }}
{{- $libnftnl_version := include "get_oss_version_by_id" (list "libnftnl" $ ) }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/src" }}
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
  - git clone -b libmnl-{{ $libmnl_version }} --depth 1 $(cat /run/secrets/SOURCE_REPO)/netfilter/libmnl /src/libmnl
  - rm -rf /src/libmnl/.git
  - git clone -b libnftnl-{{ $libnftnl_version }} --depth 1 $(cat /run/secrets/SOURCE_REPO)/netfilter/libnftnl /src/libnftnl
  - rm -rf /src/libnftnl/.git
  - git clone -b v{{ $iptables_version }} --depth 1 $(cat /run/secrets/SOURCE_REPO)/netfilter/iptables /src/iptables
  - rm -rf /src/iptables/.git
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-static-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
shell:
  beforeInstall:
  - pm install autoconf m4 automake libtool build-base linux-headers pkgconf file
  install:
  # libmnl and libnftnl go to a private prefix, so iptables links the static copies built
  # here and never a shared one from the builder.
  - export PKG_CONFIG_PATH=/build/lib/pkgconfig
  - cd /src/libmnl
  - ./autogen.sh
  - ./configure --enable-static --disable-shared --prefix=/build
  - make && make install
  - cd /src/libnftnl
  - ./autogen.sh
  - ./configure --enable-static --disable-shared --prefix=/build
  - make && make install
  - cd /src/iptables
  - ./autogen.sh
  - ./configure --enable-static --disable-shared --prefix=/build
  - make LDFLAGS='-all-static'
  - strip ./iptables/xtables-legacy-multi ./iptables/xtables-nft-multi
  - mv ./iptables/xtables-legacy-multi ./iptables/xtables-nft-multi /
  - |
    set -eu
    for f in /xtables-legacy-multi /xtables-nft-multi; do
      if ! file "$f" | grep -qE "statically linked|static-pie linked"; then
        echo "FATAL: $f is not static: $(file "$f")" >&2
        exit 1
      fi
      "$f" iptables --version
    done
