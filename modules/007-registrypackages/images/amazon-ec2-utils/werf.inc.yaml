{{- if ne $.Env "CSE" }}
{{- $version := include "get_oss_version_by_id" (list "amazon-ec2-utils" $ )  -}}
{{- $image_version := $version | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/src" }}
git:
- add: /{{ $.ModulePath }}/modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
  to: /src/scripts
  stageDependencies:
    install:
    - '**/*'
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
  - git clone -b v{{ $version }} --depth 1 $(cat /run/secrets/SOURCE_REPO)/amazonlinux/amazon-ec2-utils.git /src/amazon-ec2-utils
  - rm -rf /src/amazon-ec2-utils/.git
  - cp /src/amazon-ec2-utils/ebsnvme-id /ebsnvme-id
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: scratch
import:
# ebsnvme-id is a symlink upstream since v2.3.0: import the copy made in the src stage, not the link
- image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /ebsnvme-id
  to: /ebsnvme-id
  before: setup
- image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src/scripts
  to: /
  before: setup
imageSpec:
  config:
    labels: { "distro": "all", "version": "all", "growpart": "{{ $version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
{{- end }}
