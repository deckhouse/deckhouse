---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: scratch
import:
- image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /
  to: /
  includePaths:
  - opt/deckhouse
  - install
  - uninstall
  before: install
imageSpec:
  config:
    labels: { "distro": "all", "version": "all" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
  to: /
  includePaths:
  - install
  - uninstall
  stageDependencies:
    install:
    - '**/*'
shell:
  beforeInstall:
  - pm install file findutils patchelf
  install:
  # -n, because without it pm consults the builder's own package index and skips whatever
  # is already installed there. nvme happens to be static today, but the flag is what keeps
  # that from silently mattering if it ever stops being.
  - pm install -n nvme-cli -d /src
  - mkdir -p /opt/deckhouse/bin
  - cp -pr /src/usr/sbin/nvme /opt/deckhouse/bin
  {{- include "relocate_and_verify" (dict "resolve" "/src" "smoke" (list "/opt/deckhouse/bin/nvme version")) | nindent 2 }}
