# Two test system extensions that prove the node enforces roothash signatures.
#
# They carry the same trivial payload — one oneshot unit that drops a marker in
# /run — and differ in exactly one thing: who signed the dm-verity roothash.
#
#   bob-signed   signed by the Olcedar signer, the same path every platform
#                extension takes. Expected to merge and run its unit.
#   bob          signed by a throwaway key generated during the build, so the
#                artifact is well formed and the signature is valid PKCS#7 —
#                it is simply not trusted by the kernel's keyring. Expected to
#                be refused with "Required key not available".
#
# The pair is what makes the test conclusive. An extension with no .p7s at all
# is refused earlier and by somebody else (nodelet, for a missing sidecar), so
# it proves nothing about the kernel. Only a correctly shaped, wrongly signed
# image exercises CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG.
#
# They are delivered by NodeExtensionRequest, not by images_digests.json: the
# NER carries the digest directly, so nothing here has to be wired into the
# platform digest table.

---
image: {{ $.ModuleName }}/{{ $.ImageName }}-signed-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
# The signing tools come in as imports, so this list has to be open before the
# define appends its entries to it.
import:
{{- include "olcedar sysext sign imports" $ }}
git:
- add: /{{ $.ModulePath }}modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/sysext
  to: /scripts
  includePaths:
  - extension-release.bob
  - bob.service
  stageDependencies:
    install:
    - extension-release.bob
    - bob.service
{{- include "olcedar sysext sign secrets" . }}
shell:
  beforeInstall:
  - pm install erofs-utils coreutils cryptsetup
  - mkdir -p /out
  install:
  - mkdir -p /sysext/usr/lib/extension-release.d /sysext/usr/lib/systemd/system
  - cp -f /scripts/bob.service /sysext/usr/lib/systemd/system/bob-signed.service
  # The extension-release file name must match the extension name systemd sees,
  # which is the image basename: bob-signed.raw -> extension-release.bob-signed.
  - cp -f /scripts/extension-release.bob /sysext/usr/lib/extension-release.d/extension-release.bob-signed
  - mkfs.erofs -L _sysext -U 00000000-0000-0000-0000-000000000000 -z lzma,9 /out/bob-signed.raw sysext/
  - veritysetup format /out/bob-signed.raw /out/bob-signed.verity --root-hash-file=roothash.txt
  - tr -d ' \n' < roothash.txt > /out/bob-signed.roothash
  - veritysetup verify /out/bob-signed.raw /out/bob-signed.verity "$(cat /out/bob-signed.roothash)"
{{- include "olcedar sysext sign" "bob-signed" }}

---
image: {{ $.ModuleName }}/{{ $.ImageName }}-signed
from: {{ index $.Images "builder/scratch" }}
import:
- image: {{ $.ModuleName }}/{{ $.ImageName }}-signed-artifact
  add: /out
  to: /
  includePaths:
  - '**/*'
  before: setup
imageSpec:
  config:
    labels: { "distro": "olcedar", "sysext_level": "1.0", "purpose": "signature-enforcement-test", "signer": "olcedar" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]

---
image: {{ $.ModuleName }}/{{ $.ImageName }}-untrusted-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
# The signing tools come in as imports, so this list has to be open before the
# define appends its entries to it.
import:
{{- include "olcedar sysext sign imports" $ }}
git:
- add: /{{ $.ModulePath }}modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/sysext
  to: /scripts
  includePaths:
  - extension-release.bob
  - bob.service
  stageDependencies:
    install:
    - extension-release.bob
    - bob.service
shell:
  beforeInstall:
  - pm install erofs-utils coreutils cryptsetup openssl
  - mkdir -p /out
  install:
  - mkdir -p /sysext/usr/lib/extension-release.d /sysext/usr/lib/systemd/system
  - cp -f /scripts/bob.service /sysext/usr/lib/systemd/system/bob.service
  - cp -f /scripts/extension-release.bob /sysext/usr/lib/extension-release.d/extension-release.bob
  # A different payload than bob-signed, deliberately: the admission webhook
  # rejects two NodeExtensionRequests carrying the same digest, and identical
  # content would produce one.
  - echo "this extension is signed by a key the node does not trust" > /sysext/usr/lib/extension-release.d/bob-untrusted-note
  - mkfs.erofs -L _sysext -U 00000000-0000-0000-0000-000000000000 -z lzma,9 /out/bob.raw sysext/
  - veritysetup format /out/bob.raw /out/bob.verity --root-hash-file=roothash.txt
  - tr -d ' \n' < roothash.txt > /out/bob.roothash
  - veritysetup verify /out/bob.raw /out/bob.verity "$(cat /out/bob.roothash)"
  # The untrusted signature. Same shape as the real one — detached PKCS#7 over
  # the roothash bytes — from a key that exists only for the length of this
  # build, so no keyring anywhere will ever carry it. This is the whole point:
  # the artifact is valid in every respect except whose key signed it.
  - |
    set -eo pipefail
    openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
      -subj "/CN=bob untrusted test signer" \
      -keyout /tmp/untrusted.key -out /tmp/untrusted.pem 2>/dev/null
    openssl dgst -sha256 -sign /tmp/untrusted.key -out /tmp/roothash.sig /out/bob.roothash
    /usr/lib/systemd/systemd-keyutil pkcs7 \
      --certificate=/tmp/untrusted.pem \
      --signature=/tmp/roothash.sig \
      --hash-algorithm=sha256 \
      --output=/out/bob.roothash.p7s
    # Well formed, and that is exactly what is being asserted: the node must
    # refuse it on trust, not on shape.
    openssl smime -verify -inform der -in /out/bob.roothash.p7s -content /out/bob.roothash -noverify -out /dev/null
    echo "signed roothash with an untrusted key - $(cat /out/bob.roothash)"

---
image: {{ $.ModuleName }}/{{ $.ImageName }}-untrusted
from: {{ index $.Images "builder/scratch" }}
import:
- image: {{ $.ModuleName }}/{{ $.ImageName }}-untrusted-artifact
  add: /out
  to: /
  includePaths:
  - '**/*'
  before: setup
imageSpec:
  config:
    labels: { "distro": "olcedar", "sysext_level": "1.0", "purpose": "signature-enforcement-test", "signer": "untrusted" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
