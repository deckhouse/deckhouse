{{- $version := include "get_oss_version_by_id" (list "cfssl" $ )  -}}
{{- $image_version := $version | replace "." "-" }}
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}"
from: {{ index $.Images "builder/src" }}
final: false
git:
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
    to: /src/scripts
    stageDependencies:
      install:
        - '**/*'
secrets:
  - id: SOURCE_REPO
    value: "{{ $.SOURCE_REPO }}"
shell:
  install:
    - git clone --depth 1 --single-branch --branch v{{ $version }} $(cat /run/secrets/SOURCE_REPO)/cloudflare/cfssl.git /src/cfssl
    - rm -rf /src/cfssl/.git
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}"
from: {{ index $.Images "builder/golang" }}
final: false
import:
  - image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}"
    add: /src/cfssl
    to: /src
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
  - id: GOPROXY
    value: "{{ $.GOPROXY }}"
shell:
  install:
    - export GOPROXY=$(cat /run/secrets/GOPROXY)
    - export GOOS=linux
    - export GOARCH=amd64
    - export CGO_ENABLED=0
    - cd /src
    - go mod vendor
    - make
    - chmod +x ./bin/*
    - mv ./bin/* /
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}"
from: scratch
import:
  - image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}"
    add: /src/scripts
    to: /
    includePaths:
    - install
    - uninstall
    before: setup
  - image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}"
    add: /
    to: /
    includePaths:
    - cfssl
    - cfssl-bundle
    - cfssl-certinfo
    - cfssl-newkey
    - cfssl-scan
    - cfssljson
    before: setup
imageSpec:
  config:
    labels:
      distro: all
      version: all
      cfssl: {{ $version }}
      cfssl-bundle: {{ $version }}
      cfssl-certinfo: {{ $version }}
      cfssl-newkey: {{ $version }}
      cfssl-scan: {{ $version }}
      cfssljson: {{ $version }}
