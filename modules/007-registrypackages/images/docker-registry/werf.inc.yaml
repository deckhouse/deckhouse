{{- $docker_version := include "get_oss_version_by_id" (list "docker" $ )  -}}
{{- $docker_auth_version := include "get_oss_version_by_id" (list "docker-auth" $ )  -}}

{{- $image_version := $docker_version | replace "." "-" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/src" }}
git:
- url: {{ .SOURCE_REPO }}/cesanta/docker_auth.git
  tag: {{ $docker_auth_version }}
  add: /
  to: /src/docker_auth
  stageDependencies:
    install: ['**/*']
- url: {{ .SOURCE_REPO }}/distribution/distribution.git
  tag: v{{ $docker_version }}
  add: /
  to: /src/distribution
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}/modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/scripts
  to: /src/scripts
  stageDependencies:
    install:
    - '**/*'
- add: /{{ .ModulePath }}modules/{{ $.ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches/
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src/docker_auth
  - git apply /patches/docker_auth/*.patch --verbose
---
image: {{ .ModuleName }}/{{ .ImageName }}-{{ $image_version }}
from: scratch
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact-{{ $image_version }}
  add: /
  to: /
  includePaths:
  - registry
  - auth_server
  - install
  - uninstall
  before: setup
imageSpec:
  config:
    labels: { "distro": "all", "version": "all", "docker": "{{ $docker_version }}", "cesanta_auth": "{{ $docker_auth_version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/golang" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  beforeInstall:
  - pm install make git
  setup:
  - export GOPROXY=$(cat /run/secrets/GOPROXY) CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GO111MODULE=auto
  - cd /src/docker_auth/auth_server
  - make build
  - mv ./auth_server /auth_server
  - mkdir -p /go/src/github.com/docker/
  - mv /src/distribution /go/src/github.com/docker/
  - cd /go/src/github.com/docker/distribution
  - make
  - mv bin/registry /
  - mv /src/scripts/* /
  - chmod +x /auth_server /registry /install /uninstall
