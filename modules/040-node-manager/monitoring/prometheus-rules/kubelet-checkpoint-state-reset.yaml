- name: d8.kubelet-checkpoint-state-reset
  rules:
    - alert: D8KubeletCheckpointStateUnpinnedContainers
      # A gauge, so this is the live state and not a trace of an event: it resolves when the container is gone,
      # whoever made it go, and it survives a kubelet restart because kubelet keeps the list on the Node.
      expr: |
        max by (node, namespace, pod, container) (
          kubelet_checkpoint_state_unpinned_containers{job="kubelet"}
        ) > 0
      for: 10m
      labels:
        tier: cluster
        severity_level: "4"
      annotations:
        plk_markup_format: markdown
        plk_protocol_version: "1"
        plk_create_group_if_not_exists__d8_kubelet_unpinned_containers: "D8KubeletCheckpointStateUnpinnedContainers,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
        plk_grouped_by__d8_kubelet_unpinned_containers: "D8KubeletCheckpointStateUnpinnedContainers,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
        summary: Container {{ $labels.container }} in Pod {{ $labels.namespace }}/{{ $labels.pod }} may run in a NUMA zone other than the one kubelet recorded for it.
        description: |
          Kubelet on Node `{{ $labels.node }}` reset the memory manager checkpoint and recorded a new NUMA zone for container `{{ $labels.container }}` of Pod `{{ $labels.namespace }}/{{ $labels.pod }}`. Kubelet sets the zone only when it creates a container, so the container keeps running in the zone it had before the reset, which may be a different one.

          Kubelet may then give the zone the container really uses to another Guaranteed Pod, and both Pods share its memory. With the Topology Manager enabled, the container's CPUs may also be moved to the recorded zone while its memory stays in the old one.

          Kubelet does not stop such a container by itself. Restoring the isolation means recreating it, and whether this Pod may be restarted, and when, is a decision about the workload rather than about the Node.

          What to do, whichever suits the workload:

          - Delete the Pod, or drain the Node, so the container is recreated in a zone from the current state.
          - If the Pod is a virtual machine, you can also live migrate it to another Node. The machine keeps running and gets its resources assigned again on arrival.

          The alert resolves by itself within a few minutes of the container going away. No kubelet restart is needed.
