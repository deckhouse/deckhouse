- name: d8.kubelet-checkpoint-state-reset
  rules:
    - alert: D8KubeletCheckpointStateUnpinnedContainers
      # A gauge, so this is the live state and not a trace of an event: it resolves when the container is gone,
      # whoever made it go, and it survives a kubelet restart because kubelet keeps the list on the Node.
      # By Pod, not by container: the fix is recreating the Pod, and that is decided for the Pod as a whole.
      expr: |
        max by (node, namespace, pod) (
          kubelet_checkpoint_state_unpinned_containers{job="kubelet"}
        ) > 0
      for: 10m
      labels:
        tier: cluster
        severity_level: "4"
      annotations:
        plk_markup_format: markdown
        plk_protocol_version: "1"
        plk_create_group_if_not_exists__d8_kubelet_unpinned_containers: "D8KubeletCheckpointStateUnpinnedContainers,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
        plk_grouped_by__d8_kubelet_unpinned_containers: "D8KubeletCheckpointStateUnpinnedContainers,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
        summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} may run in a NUMA zone other than the one kubelet recorded for it.
        description: |
          Kubelet on Node `{{ $labels.node }}` reset the memory manager checkpoint and recorded new NUMA zones for the containers of Pod `{{ $labels.namespace }}/{{ $labels.pod }}`. Kubelet sets the zone only when it creates a container, so the containers keep running in the zones they had before the reset, which may be different ones.

          Kubelet may then give the zone the Pod really uses to another Guaranteed Pod, and both Pods share its memory. With the Topology Manager enabled, the Pod's CPUs may also be moved to the recorded zone while its memory stays in the old one.

          Kubelet does not stop such a Pod by itself. Restoring the isolation means recreating it, and whether this Pod may be restarted, and when, is a decision about the workload rather than about the Node.

          What to do, whichever suits the workload:

          - Delete the Pod, or drain the Node, so its containers are recreated in zones from the current state.
          - If the Pod is a virtual machine, you can also live migrate it to another Node. The machine keeps running and gets its resources assigned again on arrival.

          The alert resolves by itself within a few minutes of the Pod being recreated. No kubelet restart is needed.
