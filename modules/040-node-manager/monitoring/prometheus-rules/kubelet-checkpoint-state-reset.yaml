- name: d8.kubelet-checkpoint-state-reset
  rules:
    - alert: D8KubeletCheckpointStateUnpinnedContainers
      expr: |
        max by (node, namespace, pod) (
          kubelet_checkpoint_state_unpinned_containers{job="kubelet"}
        ) > 0
      for: 10m
      labels:
        tier: cluster
        severity_level: "4"
      annotations:
        plk_markup_format: markdown
        plk_protocol_version: "1"
        plk_create_group_if_not_exists__d8_kubelet_checkpoint_state_reset: "D8KubeletCheckpointStateResetAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
        plk_grouped_by__d8_kubelet_checkpoint_state_reset: "D8KubeletCheckpointStateResetAlerts,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
        summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} may run in a NUMA zone other than the one kubelet recorded for it.
        description: |
          Kubelet on Node `{{ $labels.node }}` reset the memory manager checkpoint and recorded new NUMA zones for Pod `{{ $labels.namespace }}/{{ $labels.pod }}`. Zones are applied only when a container is created, so the running containers stay in their old zones, which may differ from the recorded ones.

          As a result, the zone the Pod really uses may be given to another Guaranteed Pod, and both Pods share its memory. The Pod's CPUs and memory may also end up in different NUMA zones, which slows down its memory access.

          The Pod is not restarted automatically: when to do it is up to the workload. To restore isolation:

          - Delete the Pod or drain the Node, so its containers are recreated in the current zones.
          - For a virtual machine, you can live migrate it to another Node instead, without stopping it.

          The alert resolves within a few minutes after the Pod is recreated. No kubelet restart is needed.
