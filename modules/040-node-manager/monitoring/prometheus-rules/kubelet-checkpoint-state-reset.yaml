- name: d8.kubelet-checkpoint-state-reset
  rules:
    - alert: D8KubeletCheckpointStateReset
      # A reset happens only while kubelet starts, so a non-zero counter already means this kubelet reset a
      # checkpoint. increase() would need a sample from before the reset and misses one after a long Node downtime.
      expr: |
        max by (node, manager, reason) (
          kubelet_checkpoint_state_reset_total{job="kubelet"}
        ) > 0
        and on (node)
        (
          time() - max by (node) (process_start_time_seconds{job="kubelet"})
        ) < 3600
      for: 5m
      labels:
        tier: cluster
        severity_level: "6"
      annotations:
        plk_markup_format: markdown
        plk_protocol_version: "1"
        summary: Kubelet on Node {{ $labels.node }} reset the {{ $labels.manager }} manager checkpoint.
        description: |
          Kubelet on Node `{{ $labels.node }}` was started less than an hour ago and, while starting, found the `{{ $labels.manager }}` manager checkpoint unusable (reason `{{ $labels.reason }}`). It reset the checkpoint instead of refusing to start.

          Running containers that held exclusive CPUs or NUMA memory zones in the reset state were stopped, so kubelet recreates them and assigns the resources again. Expect restarts of Guaranteed Pods on this Node.

          A reset right after a Node reboot is expected, for example, because of per-NUMA memory drift. Repeated resets, or resets on many Nodes at once, may indicate a kubelet configuration problem.

          The alert is resolved an hour after this kubelet start, or earlier if kubelet restarts without a reset.

          To find the affected Pods:

          ```shell
          d8 k get events -A --field-selector reason=NUMACheckpointReset
          ```

          The details are also stored on the Node in `/var/lib/kubelet/d8-numa-selfheal.json`.

    - alert: D8KubeletCheckpointStateResetStopFailed
      expr: |
        max by (node, manager) (
          kubelet_checkpoint_state_reset_stop_failures_total{job="kubelet"}
        ) > 0
      for: 5m
      labels:
        tier: cluster
        severity_level: "4"
      annotations:
        plk_markup_format: markdown
        plk_protocol_version: "1"
        summary: Kubelet on Node {{ $labels.node }} failed to stop containers after a {{ $labels.manager }} manager checkpoint reset.
        description: |
          After resetting the `{{ $labels.manager }}` manager checkpoint on Node `{{ $labels.node }}`, kubelet failed to stop some containers that held exclusive CPUs or NUMA memory zones.

          Such a container keeps running with the resources it had before the reset, while kubelet has assigned it resources again from the reset state. The new assignment may not match what the container actually uses, so the same CPUs or NUMA zone may end up assigned to another Guaranteed Pod.

          To find the affected Pods:

          ```shell
          d8 k get events -A --field-selector reason=NUMACheckpointResetFailed
          ```

          The details are also stored on the Node in `/var/lib/kubelet/d8-numa-selfheal.json`.

          Delete the affected Pods or drain the Node, so their containers are recreated with new assignments. The alert is resolved after kubelet restarts on the Node:

          ```shell
          systemctl restart kubelet
          ```
