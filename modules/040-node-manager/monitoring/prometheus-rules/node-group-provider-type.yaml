- name: d8.node-group-provider-type
  rules:
    - alert: NodeGroupProviderTypeIsInvalid
      expr: |
        max by (name, node_type, provider_type) (d8_node_group_provider_type_invalid) > 0
      for: 10m
      labels:
        tier: cluster
        severity_level: "4"
      annotations:
        plk_markup_format: markdown
        plk_protocol_version: "1"
        summary: The `spec.providerType` field is set incorrectly in NodeGroup {{ $labels.name }}.
        description: |
          The `spec.providerType` field of NodeGroup `{{ $labels.name }}` is set to `{{ $labels.provider_type }}`,
          which is not the cloud provider the nodes of the group run in.

          To resolve this issue, set the field to a correct value:

          - If the nodes of the group run in a cloud, set the field to the `type` of that cloud provider,
            as published in its registration secret:

            ```bash
            kubectl -n kube-system get secrets -l cloud-provider.deckhouse.io/registration -o json \
            | jq -r '.items[] | .data.type | @base64d'
            ```

          - If the cluster is static, or the NodeGroup has `nodeType: Static`, set the field to `None`
            or leave it empty:

            ```bash
            kubectl patch nodegroup {{ $labels.name }} --type=merge -p '{"spec":{"providerType":"None"}}'
            ```
