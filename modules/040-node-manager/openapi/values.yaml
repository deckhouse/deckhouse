        description: |
          Private key for API server used by bashible.

      customMIGNames:
        type: object
        default: {}
        description: |
          Resolved MIG configuration names for node groups with custom MIG partitions.
        additionalProperties:
          type: string
        x-examples:
          - worker-gpu-custom: custom-worker-gpu-custom-12345678

      instancePrefix:
        type: string
        x-examples:
          - "myprefix"
        description: |
          Prefix for instance name.

      cloudProvider:
        type: object
        additionalProperties: true
        description: |
          Settings specific for cloud provider: access, zones, regions, etc.
        properties:
          type:
            type: string
            description: |
              Cloud provider ID as published by the cloud-provider-* module in the `d8-node-manager-cloud-provider` secret: `aws`, `openstack`, `vcd`, etc.

              The pattern is an injection guard, not a list of known providers: it keeps the characters that stay inert inside a YAML plain scalar and drops the ones that do not — whitespace and line breaks, and the indicators `:`, `#`, `,`, `[`, `]`, `{`, `}`, `&`, `*`, `!`, `|`, `>`, `%`, `@`, `` ` `` and quotes. The first character must be alphanumeric, so the value cannot be read as a document marker (`---`, `...`) or a sequence entry either. A value read out of the secret therefore cannot close the scalar it is rendered into, start a comment or a flow collection, or open a `{{` action in the files templates render through `tpl`. Any new or out-of-tree provider ID fits it as it is.
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          region:
            type: string
          zones:
            type: array
            items:
              type: string
          instanceClassKind:
            type: string
          instanceClassAPIVersion:
            type: string
            description: |
              Served version of the InstanceClass CRD, published by the cloud provider module.
              node-controller reads the InstanceClass through it and never resolves a version itself:
              the value decides the instance-class checksum, which names an immutable MachineTemplate.
              Change it only after the new version and its conversions are in place.
          machineClassKind:
            type: string
        x-examples:
          - type: aws
            machineClassKind: AWSInstanceClass
            aws:
              providerAccessKeyId: myprovaccesskeyid
              providerSecretAccessKey: myprovsecretaccesskey
              region: myregion
              loadBalancerSecurityGroupID: mylbsecuritygroupid
              keyName: mykeyname
              instances:
                iamProfileName: myiamprofilename
                additionalSecurityGroups:
                  - ["mysecgroupid1", "mysecgroupid2"]
              internal:
                zoneToSubnetIdMap:
                  zonea: mysubnetida
                  zoneb: mysubnetidb
              tags:
                aaa: aaa
      fencing:
        type: object
        default: {}
        description: |
          Internal values of fencing. Hooks write `nodeGroups` and `migrationFrom10`, one hook for each path. The other values stay at the defaults of this schema and change only with a release. The memberlist key is not a value: its hook keeps the key in a Secret.
        properties:
          nodeGroups:
            type: object
            default: {}
            description: |
              Fencing mode and the Engine flag of every NodeGroup by group name. The mode is normalized: `Watchdog` is `Slow`, and `off`, `Notify` and unknown values are `Disabled`.
            additionalProperties:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: ["Disabled", "Normal", "Slow", "Critical"]
                engine:
                  type: boolean
                  description: |
                    The NodeGroup runs on Deckhouse Engine (`spec.systemType: Immutable`).
            x-examples:
              - workers:
                  mode: Slow
          minFullPollInterval:
            type: string
            default: 10s
            pattern: '^([5-9]|[1-5][0-9]|60)s$'
            description: |
              Lower bound of the period of the full poll in the freeze state. A whole number of seconds from 5s to 60s.
          peerListRefreshInterval:
            type: string
            default: 5m
            pattern: '^(0|[1-9][0-9]*(s|m|h))$'
            description: |
              Period of the safety LIST of neighbors. `0` turns the LIST off.
          commonTimings:
            type: object
            default: {}
            description: |
              Timings of the fencing agent that are the same for all profiles. The agent reads them from its ConfigMap. The agent rejects values with `2 * roundTimeout + confirmTimeout` less than 600ms and keeps the previous values.
            properties:
              roundTimeout:
                type: string
                default: 150ms
                pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                description: |
                  Timeout of one round of the poll of the control plane state.
              confirmTimeout:
                type: string
                default: 600ms
                pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                description: |
                  Timeout of the confirming round, which repeats the poll once for all silent nodes.
              fastReadAfter:
                type: string
                default: 1.2s
                pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                description: |
                  Age of the last successful probe. When the age is larger, the agent reads `/upstreams` of kubernetes-api-proxy more often.
          migrationFrom10:
            type: boolean
            default: false
            description: |
              The cluster still has traces of fencing 1.0: a Node with the fencing 1.0 label or an agent pod of version 1.
      clusterAutoscalerPriorities:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
      nodeGroups:
        type: array
        description: |
          Array of available NodeGroups.
        items:
          type: object
          properties:
            name:
              type: string
              description: |
                A name of the NodeGroup.
            engine:
              type: string
              enum: ["None", "MCM", "CAPI"]
              description: |
                Effective machinery selected for this NodeGroup.
            nodeType:
              # See NodeGroup in candi/openapi/node_group.yaml
              type: string
              enum: ["CloudEphemeral", "CloudPermanent", "CloudStatic", "Static"]
            cloudProviderType:
              type: string
              description: |
                Cloud provider whose node configuration scripts are applied to the nodes of this
                group.
              x-examples:
                - "aws"
            gpu:
              # This is a copy from NodeGroup object. We trust that hook will not change it.
              type: object
              additionalProperties: true
            cloudInstances:
              # This is a copy from NodeGroup object. We trust that hook will not change it.
              type: object
              additionalProperties: true
        x-examples:
          - - name: worker
              nodeType: CloudEphemeral
              cloudInstances:
                classReference:
                  kind: AWSInstanceClass
                  name: worker
                maxPerZone: 1
                minPerZone: 1
                zones:
                  - zonea
      upmeterDiscovery:
        type: object
        required:
          - ephemeralNodeGroupNames
        properties:
          ephemeralNodeGroupNames:
            type: array
            items:
              type: string
