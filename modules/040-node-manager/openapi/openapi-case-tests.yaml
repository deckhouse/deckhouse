defaults:
  internal: &internalDefault
    clusterMasterAddresses: ["10.0.0.1:6443", "10.0.0.2:6443", "10.0.0.3:6443"]
    clusterMasterEndpoints:
      - address: 10.0.0.1
        kubeApiPort: 6443
        rppServerPort: 4219
        rppBootstrapServerPort: 4282
      - address: 10.0.0.2
        kubeApiPort: 6443
        rppServerPort: 4219
        rppBootstrapServerPort: 4282
      - address: 10.0.0.3
        kubeApiPort: 6443
        rppServerPort: 4219
        rppBootstrapServerPort: 4282
    bashibleApiServerCA: myapiserverca
    bashibleApiServerCrt: myapiservercrt
    bashibleApiServerKey: myapiserverprivkey

positive:
  configValues:
    - {}
  values:
    - { internal: {} }
    - internal:
        <<: *internalDefault
        standbyNodeGroups:
          - name: worker
            reserveCPU: 12m
            reserveMemory: 30%
        cloudProvider:
          type: aws
          machineClassKind: AWSInstanceClass
          aws:
            providerAccessKeyId: myprovaccesskeyid
            providerSecretAccessKey: myprovsecretaccesskey
            region: myregion
            loadBalancerSecurityGroupID: mylbsecuritygroupid
            keyName: mykeyname
            instances:
              iamProfileName: myiamprofilename
            internal:
              zoneToSubnetIdMap:
                zonea: mysubnetida
                zoneb: mysubnetidb
            tags:
              aaa: aaa

    - internal:
        fencing:
          nodeGroups:
            workers:
              mode: Slow
              engine: true
            master:
              mode: Disabled
              engine: false
          minFullPollInterval: 5s
          peerListRefreshInterval: "0"
          migrationFrom10: true
    - internal:
        fencing:
          minFullPollInterval: 60s
    - internal:
        fencing:
          commonTimings:
            roundTimeout: 200ms
            confirmTimeout: 700ms
            fastReadAfter: 1.5s

negative:
  configValues:
    # The setting of the second network of fencing exists only in EE, FE and CSE.
    - fencing:
        systemNetworkFallback:
          systemNetworkName: sysnet-a
  values:
    - internal:
        <<: *internalDefault
        clusterMasterAddresses: "10.0.0.1:6443"
    - internal:
        fencing:
          minFullPollInterval: 2s
    - internal:
        fencing:
          minFullPollInterval: 90s
    - internal:
        fencing:
          peerListRefreshInterval: often
    - internal:
        fencing:
          commonTimings:
            roundTimeout: fast
    - internal:
        fencing:
          commonTimings:
            pollTimeout: 1s
    - internal:
        fencing:
          nodeGroups:
            workers:
              mode: Watchdog
    - internal:
        fencing:
          nodeGroups:
            workers:
              mode: Slow
              engine: "yes"
    - internal:
        fencing:
          memberlistKey: ZGgtdGVzdC1zZWNyZXQtMDEyMzQ1Njc4
