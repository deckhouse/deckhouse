apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodestaticpodrequests.deckhouse.io
  labels:
    heritage: deckhouse
    module: node-manager
spec:
  group: deckhouse.io
  scope: Cluster
  names:
    plural: nodestaticpodrequests
    singular: nodestaticpodrequest
    kind: NodeStaticPodRequest
    shortNames:
      - nspr
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          jsonPath: .status.phase
          type: string
        - name: Matched
          jsonPath: .status.matchedNodes
          type: integer
        - name: Applied
          jsonPath: .status.appliedNodes
          type: integer
        - name: Failed
          jsonPath: .status.failedNodes
          type: integer
        - name: Age
          jsonPath: .metadata.creationTimestamp
          type: date
      schema:
        openAPIV3Schema:
          type: object
          description: |
            Resource for running a static pod on selected nodes without using the Kubernetes scheduler.

            Kubelet starts a static pod from a manifest stored on the node's disk. This allows the pod to run before the API server becomes available and before CNI is initialized. This can be used for components required to pull container images.

            Node-controller adds the manifest to `spec.staticPods` of the NodeConfig resource for each matching node and tracks the results of applying the manifest on the nodes.

            Resource contains only the pod manifest. The node ensures that the image is available in containerd and that the manifest file is present on disk. The pod must obtain any other required resources on its own. For example, the pod can issue its own certificates, use the node's kubeconfig, and mount directories for persistent state using `hostPath` with the `DirectoryOrCreate` type.

            A user with permission to create NodeStaticPodRequest resources can run arbitrary manifests with root privileges on all selected nodes. By default, permission to create these resources is granted only to platform components.
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - manifest
              properties:
                nodeGroupSelector:
                  type: object
                  description: |
                    Restricts the pod to nodes in the specified NodeGroups. If no groups are specified, all NodeGroups with `systemType: Immutable` are selected.

                    For these groups, the node agent writes the manifest from the corresponding node's NodeConfig. NodeGroups that use bashible are not selected because they do not use NodeConfig.
                  properties:
                    matchNames:
                      type: array
                      items:
                        type: string
                      description: |
                        Names of NodeGroups on whose nodes the pod must run.
                manifest:
                  type: string
                  minLength: 1
                  maxLength: 32768
                  description: |
                    Complete pod manifest.

                    The `metadata.name` and `metadata.namespace` fields must not be empty and are independent of the NodeStaticPodRequest resource name. The resource name is used as the manifest file name on the node, while kubelet determines the mirror pod name from the manifest.

                    When the manifest is written to disk, the `$MY_IP` substring is replaced with the node's IP address, similarly to control plane component manifests.

                    Multiple NodeStaticPodRequest resources cannot define a pod with the same `metadata.namespace` and `metadata.name`. If a conflict is detected, the resource created later is rejected with the `Conflict` reason in the `Ready` condition. This ensures that the manifest being applied does not depend on the order of entries in NodeConfig.

                    Maximum manifest size is 32 KiB. A node can run no more than 16 static pods defined using NodeStaticPodRequest resources. In addition, the resulting NodeConfig must not exceed the API server request size limit.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                  description: |
                    Generation of `spec` that corresponds to the current `status`.
                phase:
                  type: string
                  enum: ["Ready", "Degraded"]
                  description: |
                    Current phase of static pod application.

                    Possible values:

                    - `Ready`: Manifest was successfully processed and accepted by the selected nodes.
                    - `Degraded`: Manifest cannot be applied. The reason is specified in the `Ready` condition: `InvalidName`, `ReservedName`, `InvalidManifest`, `Conflict`, `LimitExceeded`, or `RefusedByNodes`.

                    The `InvalidName` reason indicates that the NodeStaticPodRequest resource name does not conform to the DNS label format with a maximum length of 63 characters, which is required for using the name in the node configuration.

                    The `ReservedName` reason indicates that either the NodeStaticPodRequest resource name or the combination of `metadata.namespace` and `metadata.name` from the pod manifest is already used by a manifest created by the node agent or a bashible step.

                    The `LimitExceeded` reason indicates that the limit of 16 static pods has been exceeded for at least one selected NodeGroup. In this case, this resource, as one of the resources created later, is not added to the node configuration.
                matchedNodeGroups:
                  type: array
                  items:
                    type: string
                  description: |
                    NodeGroups that match the current selector.
                appliedNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of selected nodes that reported that the manifest was successfully written.
                failedNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of selected nodes that reported a failure to apply the manifest.
                matchedNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of nodes in the selected NodeGroups.
                pendingNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of selected nodes that have not yet reported either successful manifest application or a failure.
                failureMessage:
                  type: string
                  description: |
                    Error message received from one of the nodes on which the manifest could not be applied.
                conditions:
                  type: array
                  description: |
                    Detailed information about the static pod application status.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$'
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      message:
                        type: string
                        maxLength: 32768
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
