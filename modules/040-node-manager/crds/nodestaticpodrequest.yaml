apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodestaticpodrequests.deckhouse.io
  labels:
    heritage: deckhouse
    module: node-manager
spec:
  group: deckhouse.io
  scope: Cluster
  names:
    plural: nodestaticpodrequests
    singular: nodestaticpodrequest
    kind: NodeStaticPodRequest
    shortNames:
      - nspr
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          jsonPath: .status.phase
          type: string
        - name: Matched
          jsonPath: .status.matchedNodes
          type: integer
        - name: Applied
          jsonPath: .status.appliedNodes
          type: integer
        - name: Failed
          jsonPath: .status.failedNodes
          type: integer
        - name: Age
          jsonPath: .metadata.creationTimestamp
          type: date
      schema:
        openAPIV3Schema:
          type: object
          description: |
            Request to run a static pod on the selected nodes without using the Kubernetes scheduler.

            `node-manager` adds the manifest to `spec.staticPods` of the NodeConfig of each selected node. The node writes the manifest to disk, and kubelet runs the pod from it. The request reports whether the nodes wrote the manifest. It does not report whether the pod runs.

            A user with permission to create NodeStaticPodRequests can run arbitrary manifests with root privileges on all selected nodes.
          x-doc-examples:
          - |
              ```yaml
              # A node-local agent on the nodes of the worker NodeGroup.
              apiVersion: deckhouse.io/v1alpha1
              kind: NodeStaticPodRequest
              metadata:
                name: node-local-agent
              spec:
                nodeGroupSelector:
                  matchNames:
                    - worker
                manifest: |
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: node-local-agent
                    namespace: kube-system
                  spec:
                    hostNetwork: true
                    priorityClassName: system-node-critical
                    containers:
                      - name: agent
                        image: deckhouse.local/images:node-local-agent
                        args:
                          - --listen-address=$MY_IP:5002
                        env:
                          - name: NODE_NAME
                            valueFrom:
                              fieldRef:
                                fieldPath: spec.nodeName
                        volumeMounts:
                          - name: state
                            mountPath: /var/lib/node-local-agent
                    volumes:
                      - name: state
                        hostPath:
                          path: /var/lib/node-local-agent
                          type: DirectoryOrCreate
              ```
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - manifest
              properties:
                nodeGroupSelector:
                  type: object
                  description: |
                    Restricts the pod to nodes in the specified NodeGroups. If no groups are specified, all NodeGroups are selected.

                    The node agent writes the manifest from the NodeConfig of each selected node. On nodes managed by bashible, a resource named `registry-agent` or describing the `kube-system/registry-agent` pod is not applied, because bashible writes that manifest itself. If the resource reaches no other node, the `Ready` condition reports the `ServedByBashible` reason.
                  properties:
                    matchNames:
                      type: array
                      maxItems: 64
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        maxLength: 63
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      description: |
                        Names of NodeGroups on whose nodes the pod must run.
                manifest:
                  type: string
                  minLength: 1
                  maxLength: 32768
                  description: |
                    Complete pod manifest.

                    Requirements for the manifest:

                    - `metadata.name` is a DNS subdomain (RFC 1123), `metadata.namespace` is a DNS label (RFC 1123).
                    - The namespace is `kube-system` or starts with `d8-`.
                    - `spec.nodeName` is not set.
                    - The pod does not reference API objects. Not allowed: `spec.serviceAccountName`, volumes of the `secret`, `configMap`, `persistentVolumeClaim` and `projected` types, `envFrom` and `env[].valueFrom` with `secretKeyRef` or `configMapKeyRef` in containers and init containers.

                    A manifest that does not meet these requirements is rejected on creation and update.

                    When the manifest is written to disk, the `$MY_IP` substring is replaced with the node's IP address.

                    Maximum manifest size is 32 KiB. A node can run no more than 16 static pods defined by NodeStaticPodRequests.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                  description: |
                    Generation of `spec` that corresponds to the current `status`.
                phase:
                  type: string
                  enum: ["Pending", "Ready", "Degraded"]
                  description: |
                    Summary of the conditions.

                    - `Pending`: The selected nodes are still writing the manifest (the `Ready` condition has the `RolloutInProgress` reason).
                    - `Ready`: The `Ready` condition is `True`.
                    - `Degraded`: `node-manager` did not accept the request (the `Accepted` condition is `False`), or nodes refused the manifest (the `Ready` condition has the `RefusedByNodes` reason).
                matchedNodeGroups:
                  type: array
                  items:
                    type: string
                  description: |
                    NodeGroups that match the current selector.
                appliedNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of selected nodes that reported the current manifest written.
                failedNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of selected nodes that refused the manifest.
                matchedNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of nodes in the selected NodeGroups to which the node agent writes the manifest. Nodes of NodeGroups on which bashible writes the manifest itself are not counted.
                pendingNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of selected nodes that have not yet reported either the current manifest written or a failure.
                nodes:
                  type: array
                  maxItems: 32
                  description: |
                    Selected nodes that have not written the current manifest, at most 32.
                  items:
                    type: object
                    required:
                      - name
                      - state
                    properties:
                      name:
                        type: string
                        description: |
                          Node name.
                      state:
                        type: string
                        enum: ["Pending", "Failed"]
                        description: |
                          `Failed` if the node refused the manifest or `Pending` if it has not answered yet.
                      message:
                        type: string
                        maxLength: 4096
                        description: |
                          Why the node refused the manifest or what it waits for.
                conditions:
                  type: array
                  description: |
                    Conditions of the request: `Accepted` and `Ready`.

                    `Accepted` shows whether `node-manager` accepted the request. It is `True` with the `Accepted` reason or `False` with one of these reasons:

                    - `InvalidName`: The request name is not a DNS label (RFC 1123) of at most 63 characters.
                    - `ReservedName`: The request name, or the `metadata.namespace` and `metadata.name` of the pod, is already used by a static pod of the platform.
                    - `InvalidManifest`: The manifest does not meet the requirements of `spec.manifest`.
                    - `Conflict`: An older request already defines a pod with the same `metadata.namespace` and `metadata.name`.
                    - `LimitExceeded`: At least one selected NodeGroup already has 16 static pods from older requests. Only the nodes of the other selected NodeGroups get the manifest.

                    `Ready` shows whether the selected nodes wrote the current manifest:

                    - `True` with the `AllNodesApplied` reason: Every selected node wrote it.
                    - `True` with the `NoNodesSelected` reason: The selector matches no existing NodeGroup, or the selected NodeGroups have no nodes.
                    - `True` with the `ServedByBashible` reason: The selected NodeGroups are managed by bashible, which writes the `registry-agent` manifest on their nodes itself.
                    - `False` with the `RolloutInProgress` reason: Some selected nodes have not written the current manifest yet.
                    - `False` with the `RefusedByNodes` reason: At least one node refused the manifest.
                    - `False` with the `NotAccepted` reason: The `Accepted` condition is `False`.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$'
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      message:
                        type: string
                        maxLength: 32768
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
