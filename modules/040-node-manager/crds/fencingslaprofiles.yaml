apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fencingslaprofiles.node-manager.deckhouse.io
  labels:
    heritage: deckhouse
    module: node-manager
spec:
  group: node-manager.deckhouse.io
  scope: Cluster
  names:
    plural: fencingslaprofiles
    singular: fencingslaprofile
    kind: FencingSLAProfile
    shortNames:
      - fsp
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Goal
          type: string
          jsonPath: .spec.reactionGoal
        - name: Detection
          type: string
          jsonPath: .spec.detectionWindowTarget
        - name: Probe
          type: string
          jsonPath: .spec.memberlist.probeInterval
        - name: FallbackTTL
          type: string
          jsonPath: .spec.fallback.ttl
        - name: EvacuationDelay
          type: string
          jsonPath: .spec.evacuation.delay
        - name: Rejoin
          type: string
          jsonPath: .spec.rejoin.interval
        - name: Watchdog
          type: string
          jsonPath: .spec.watchdog.timeout
      schema:
        openAPIV3Schema:
          type: object
          description: |
            SLA profile for fencing. A profile is a named, reusable set of timing parameters that control how fast a failed node is detected, how long a fallback heartbeat protects the node from a false eviction, how long the controller waits before evacuating pods, and how the watchdog behaves.

            Profiles are cluster-scoped configuration objects. They carry no runtime state, so the resource has no `status` and no status subresource.

            The built-in profiles `critical`, `medium`, `moderate` and `slow` are shipped by the `node-manager` module. In the first version only built-in profiles can be referenced, and `FencingFailedNodeState.spec.profileRef.name` is restricted to them by an enum.

            Profile names are referenced in the API in capitalized form (`Critical`, `Medium`, `Moderate`, `Slow`), while the objects themselves are named in lower case, because a Kubernetes object name cannot contain capital letters. A reference is resolved by lower-casing it.
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: |
                Timing parameters of the profile.
              required:
                - reactionGoal
                - detectionWindowTarget
                - memberlist
                - fallback
                - rejoin
                - evacuation
                - watchdog
              x-kubernetes-validations:
                - rule: duration(self.memberlist.probeTimeout) + duration(self.memberlist.probeTimeout) < duration(self.memberlist.probeInterval)
                  message: memberlist.probeTimeout must be less than half of memberlist.probeInterval.
                - rule: duration(self.fallback.heartbeat) < duration(self.fallback.ttl)
                  message: fallback.heartbeat must be less than fallback.ttl.
                - rule: duration(self.fallback.heartbeat) >= duration('1ms')
                  message: fallback.heartbeat must be at least 1ms.
                - rule: duration(self.fallback.kubernetesAPITimeout) < duration(self.fallback.ttl)
                  message: fallback.kubernetesAPITimeout must be less than fallback.ttl.
                - rule: duration(self.rejoin.interval) <= duration(self.rejoin.maxInterval)
                  message: rejoin.interval must be less than or equal to rejoin.maxInterval.
                - rule: duration(self.watchdog.feedInterval) + duration(self.watchdog.feedInterval) <= duration(self.watchdog.timeout)
                  message: watchdog.feedInterval must be at most half of watchdog.timeout.
                - rule: duration(self.watchdog.timeout) >= duration('2s')
                  message: watchdog.timeout must be at least 2s.
                - rule: duration(self.watchdog.timeout).getMilliseconds() % 1000 == 0
                  message: watchdog.timeout must be a whole number of seconds.
                - rule: duration(self.fallback.kubernetesAPITimeout) + duration(self.watchdog.timeout) + duration('500ms') <= duration(self.evacuation.delay)
                  message: evacuation.delay must be at least fallback.kubernetesAPITimeout + watchdog.timeout + 500ms.
                - rule: "(duration(self.fallback.heartbeat) > duration(self.fallback.kubernetesAPITimeout) ? duration(self.fallback.heartbeat) : duration(self.fallback.kubernetesAPITimeout)) + duration(self.fallback.kubernetesAPITimeout) + duration(self.watchdog.timeout) + duration('500ms') <= duration(self.fallback.ttl)"
                  message: fallback.ttl must be at least max(fallback.heartbeat, fallback.kubernetesAPITimeout) + fallback.kubernetesAPITimeout + watchdog.timeout + 500ms.
              properties:
                reactionGoal:
                  type: string
                  description: |
                    Human-readable full reaction goal, for example `2-3s` or `30s`. Used for documentation and printer columns only, not parsed as a duration.
                detectionWindowTarget:
                  type: string
                  description: |
                    Human-readable memberlist detection target, for example `0.8-1.2s`. Used for documentation and to sanity-check calculations, not parsed as a duration.
                memberlist:
                  type: object
                  description: |
                    memberlist and Lifeguard parameters that control peer probing, suspicion and gossip. The agent derives the remaining memberlist timings from the profile.
                  required:
                    - probeInterval
                    - probeTimeout
                    - suspicionMult
                    - suspicionMaxTimeoutMult
                    - indirectChecks
                    - awarenessMaxMultiplier
                    - gossipInterval
                    - retransmitMult
                    - gossipToTheDeadTime
                  properties:
                    probeInterval:
                      type: string
                      pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                      description: |
                        How often peer nodes are actively probed. Shorter interval means faster detection but linearly higher probe traffic.
                    probeTimeout:
                      type: string
                      pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                      description: |
                        How long to wait for a probe response. Must be above the p99 network RTT and less than half of `probeInterval`: a nack from an indirect prober arrives about two probe timeouts after the probe starts, and a nack that misses the probe deadline counts against the Lifeguard health of the probing node.
                    suspicionMult:
                      type: integer
                      format: int32
                      minimum: 1
                      description: |
                        Multiplier of the Lifeguard/memberlist suspicion window before a peer is marked dead.
                    suspicionMaxTimeoutMult:
                      type: integer
                      format: int32
                      minimum: 1
                      description: |
                        Upper bound of the suspicion timer when confirmations are missing.
                    indirectChecks:
                      type: integer
                      format: int32
                      minimum: 1
                      description: |
                        Number of indirect checks performed when direct connectivity to a peer is in doubt.
                    awarenessMaxMultiplier:
                      type: integer
                      format: int32
                      minimum: 1
                      description: |
                        Maximum slowdown of the probe interval for a locally degraded agent (Lifeguard awareness).
                    gossipInterval:
                      type: string
                      pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                      description: |
                        Interval at which gossip events are disseminated.
                    retransmitMult:
                      type: integer
                      format: int32
                      minimum: 1
                      description: |
                        Retransmit multiplier for gossip broadcasts: `retransmitMult * ceil(log10(N + 1))`.
                    gossipToTheDeadTime:
                      type: string
                      pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                      description: |
                        How long a dead node still receives gossip, giving it a chance to refute after recovery.
                fallback:
                  type: object
                  description: |
                    Fallback heartbeat parameters used by a node that lost gossip quorum but still reaches the Kubernetes API.
                  required:
                    - heartbeat
                    - ttl
                    - kubernetesAPITimeout
                  properties:
                    heartbeat:
                      type: string
                      pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                      description: |
                        How often an isolated node that still sees the Kubernetes API writes a fallback heartbeat. Must be noticeably less than `ttl`, and at least `1ms`: a shorter interval serializes into a sub-millisecond unit that the `heartbeatInterval` field of `FencingFailedNodeState` rejects, so every heartbeat write would fail, and the agent refuses to start rather than leave the node silently unprotected.
                    ttl:
                      type: string
                      pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                      description: |
                        Freshness window of a fallback heartbeat. While the last heartbeat is newer than this TTL, evacuation is not allowed.

                        Must be at least max(`heartbeat`, `kubernetesAPITimeout`) + `kubernetesAPITimeout` + `watchdog.timeout` + 500ms. A node that stops reaching the Kubernetes API stops feeding the watchdog after one failed heartbeat, and it must be reset before its last heartbeat goes stale. The 500ms absorb clock skew between the node and the fencing controller.
                    kubernetesAPITimeout:
                      type: string
                      pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                      description: |
                        Upper bound of a single Kubernetes API call by the agent. It bounds:

                        - every request for `FencingFailedNodeState` objects, including the fallback heartbeat write;
                        - the read of the agent's own Node in a join or rejoin attempt;
                        - every memberlist TCP exchange, through `TCPTimeout` = max(`kubernetesAPITimeout`, `1s`).

                        Must be less than `ttl`, and enters the lower bounds of `ttl` and `evacuation.delay`: an isolated node spends the whole budget on the heartbeat attempt that fails first, and only then stops feeding the watchdog.
                rejoin:
                  type: object
                  description: |
                    Parameters of the agent's join attempts: the startup join and the rejoin loop, which runs while the node has no gossip quorum or while a `FencingFailedNodeState` created after the agent started records this node as failed.
                  required:
                    - interval
                    - maxInterval
                  properties:
                    interval:
                      type: string
                      pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                      description: |
                        Initial delay between join and rejoin attempts.
                    maxInterval:
                      type: string
                      pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                      description: |
                        Upper bound of the exponential backoff between join and rejoin attempts. Must be greater than or equal to `interval`. The time between the starts of two attempts also includes the attempt itself: up to `fallback.kubernetesAPITimeout` for the read of the agent's own Node and about one to two memberlist TCP timeouts for the join. It is also the takeover step after which the next agent in line records a failed peer that the designated writer has not recorded, and how long a peer's failed record about the agent's own node must stay before the agent's fencing state writer pauses; a record that peers remove and re-create sooner restarts that wait.
                evacuation:
                  type: object
                  description: |
                    Evacuation parameters used by the fencing controller.
                  required:
                    - delay
                  properties:
                    delay:
                      type: string
                      pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                      description: |
                        Delay before pods are deleted after a fast-path failure, counted from `status.failed.detectedAt`.

                        Must be at least `fallback.kubernetesAPITimeout` + `watchdog.timeout` + 500ms. A node cut off from both the gossip network and the Kubernetes API stops feeding the watchdog after one failed heartbeat, and it must be reset before its pods are deleted. The 500ms absorb clock skew between the nodes and the fencing controller. The time the isolated node needs to notice its own quorum loss is not included: it grows with the size of the NodeGroup.
                watchdog:
                  type: object
                  description: |
                    Watchdog parameters used as a safety net on the node.
                  required:
                    - feedInterval
                    - timeout
                  properties:
                    feedInterval:
                      type: string
                      pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                      description: |
                        How often the watchdog is fed and quorum/fallback is re-checked. Must be at most half of `timeout`, usually one quarter to one tenth of it.
                    timeout:
                      type: string
                      pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                      description: |
                        Time until the watchdog panics the node after feeding stops. A whole number of seconds, at least 2s: the watchdog device takes whole seconds, and the agent would round a fraction up. `evacuation.delay` and `fallback.ttl` must leave room for it.
