spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Запрашивает применение системного расширения (образа sysext, при необходимости с модулями ядра) к узлам, которые оно выбирает.

            Образ адресуется так же, как registry-packages-proxy адресует любой пакет: имя, digest и необязательные репозиторий и путь. node-controller передаёт их напрямую в extension объекта NodeConfig, который скачивает агент на узле, и ничего не ищет ни в модулях, ни в ModuleSource.
          properties:
            spec:
              properties:
                sysext:
                  description: |
                    Определяет образ системного расширения для применения — так же, как registry-packages-proxy определяет любой пакет.
                  properties:
                    name:
                      description: |
                        Имя sysext: сопоставляется с extension-release внутри образа и устанавливается на узле как `<name>.raw`.
                    digest:
                      description: |
                        Digest манифеста образа sysext.
                    repository:
                      description: |
                        Ключ, по которому registry-packages-proxy подбирает учётные данные (его `--rpp-repository`), например `spec.registry.repo` объекта ModuleSource. Если поле пустое, образ скачивается из основного registry кластера.
                    path:
                      description: |
                        Путь к образу внутри репозитория (`--rpp-path` прокси). Если поле пустое, используется корень репозитория.
                nodeGroupSelector:
                  description: |
                    Ограничивает расширение узлами перечисленных NodeGroup.
                  properties:
                    matchNames:
                      description: |
                        Набор имён NodeGroup, к которым применяется расширение.
                nodeSelector:
                  description: |
                    Ограничивает расширение узлами с указанными лейблами.
                  properties:
                    matchLabels:
                      description: |
                        Набор лейблов, которые должен нести узел, чтобы попасть под выбор.
                kernelModules:
                  description: |
                    Модули, которые нужно загрузить после применения расширения.
                  items:
                    properties:
                      name:
                        description: |
                          Имя модуля ядра.
                      params:
                        description: |
                          Параметры модуля, передаваемые строками вида `key=value`.
            status:
              properties:
                observedGeneration:
                  description: |
                    Поколение spec, которому соответствует текущий status.
                phase:
                  description: |
                    `Ready` — sysext разрешился в образ, который выбранные узлы могут скачать; `Degraded` — не разрешился, причина указана в condition `Ready`.
                matchedNodeGroups:
                  description: |
                    NodeGroup, которым сейчас соответствуют селекторы.
                conditions:
                  description: |
                    Подробности о ходе выполнения запроса.
