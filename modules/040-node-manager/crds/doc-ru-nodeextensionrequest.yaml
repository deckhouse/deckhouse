spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Запрос на установку расширения на выбранные узлы: системного расширения (образа sysext, при необходимости с модулями ядра) или registry-пакета.

            Вид расширения автор запроса указывает в `spec.extension.kind`. Registry-пакет (`Package`) устанавливается на выбранные узлы под управлением bashible, системное расширение (`SystemExtension`) — на выбранные узлы Deckhouse Engine. По образу вид не определяется. Если ни одна из выбранных групп не устанавливает расширения такого вида, в состоянии `Accepted` указывается причина `NotDeliverable`.

            Образ задаётся так же, как любой пакет в registry-packages-proxy: имя, дайджест и необязательные репозиторий и путь. node-controller без изменений переносит эти поля в `spec.extensions` объекта NodeConfig, и агент узла устанавливает расширение. Образ по модулю или ModuleSource не ищется.
          properties:
            spec:
              properties:
                extension:
                  description: |
                    Образ для установки и его вид. Образ задаётся так же, как любой пакет в registry-packages-proxy.
                  properties:
                    name:
                      description: |
                        Имя расширения.

                        Образ системного расширения должен содержать файл extension-release для этого имени.

                        Имена `containerd`, `kubelet`, `kubernetes-cni`, `nodelet` и `qemu-guest-agent` принадлежат расширениям платформы и не принимаются.
                    digest:
                      description: |
                        Дайджест манифеста образа.
                    kind:
                      description: |
                        Вид образа.

                        - `Package` — registry-пакет. Агент узла устанавливает его на выбранных узлах под управлением bashible.
                        - `SystemExtension` — системное расширение. Агент узла подключает его на выбранных узлах Deckhouse Engine.

                        Узлы групп другого типа образ не получают. Если ни одна из выбранных групп не устанавливает расширения такого вида, в состоянии `Accepted` указывается причина `NotDeliverable`.

                        Поле нельзя изменить после создания. Чтобы сменить вид, удалите запрос и создайте его заново.
                    repository:
                      description: |
                        Ключ, по которому registry-packages-proxy подбирает учётные данные (его `--rpp-repository`), например `spec.registry.repo` объекта ModuleSource. Если поле пустое, образ скачивается из основного registry кластера.
                    path:
                      description: |
                        Путь к образу внутри репозитория (`--rpp-path` прокси). Если поле пустое, используется корень репозитория.
                    kernelModules:
                      description: |
                        Модули ядра, которые агент узла загружает после подключения системного расширения, в указанном порядке. Допускаются только при виде `SystemExtension`. Каждый модуль указывается один раз.

                        Зависимости автоматически не загружаются, поэтому перечислите все модули, которые нужны расширению, и укажите каждый модуль после модулей, от которых он зависит.

                        Добавление модуля прерывает работу каждого выбранного узла, поэтому узел ждёт одобренной операции NodeOperation типа `Disruption`.
                      items:
                        properties:
                          name:
                            description: |
                              Имя модуля ядра.
                          params:
                            description: |
                              Параметры модуля, передаваемые строками вида `key=value`.
                nodeGroupSelector:
                  description: |
                    Ограничивает расширение узлами перечисленных NodeGroup.
                  properties:
                    matchNames:
                      description: |
                        Набор имён NodeGroup, к которым применяется расширение.
                nodeSelector:
                  description: |
                    Ограничивает расширение узлами с указанными лейблами.
                  properties:
                    matchLabels:
                      description: |
                        Набор лейблов, которые должен нести узел, чтобы попасть под выбор.
            status:
              properties:
                observedGeneration:
                  description: |
                    Поколение spec, которому соответствует текущий status.
                phase:
                  description: |
                    Сводка по условиям.

                    - `Pending` — выбранные узлы ещё устанавливают расширение (у условия `Ready` причина `RolloutInProgress`).
                    - `Ready` — условие `Ready` равно `True`.
                    - `Degraded` — `node-manager` не принял запрос (условие `Accepted` равно `False`) или узлы отклонили расширение (у условия `Ready` причина `RefusedByNodes`).
                matchedNodeGroups:
                  description: |
                    Выбранные NodeGroup, узлы которых устанавливают такой образ: группы Deckhouse Engine для системного расширения, группы под управлением bashible для registry-пакета.
                appliedNodes:
                  description: |
                    Количество выбранных узлов, которые сообщили, что расширение установлено с дайджестом этого запроса.
                failedNodes:
                  description: |
                    Количество выбранных узлов, которые отклонили расширение с дайджестом запроса.
                matchedNodes:
                  description: |
                    Количество узлов в группах из `matchedNodeGroups`, которые выбраны селекторами.
                pendingNodes:
                  description: |
                    Количество выбранных узлов, которые ещё не сообщили ни об установке расширения с дайджестом запроса, ни об отказе.
                nodes:
                  description: |
                    Выбранные узлы, которые ещё не применили запрос, не больше 32.
                  items:
                    properties:
                      name:
                        description: |
                          Имя узла.
                      state:
                        description: |
                          `Failed`, если узел отклонил запрос, или `Pending`, если узел ещё не ответил.
                      message:
                        description: |
                          Причина отказа или то, чего ждёт узел.
                conditions:
                  description: |
                    Условия запроса: `Accepted` и `Ready`.

                    `Accepted` показывает, принял ли `node-manager` запрос. Условие равно `True` с причиной `Accepted` или `False` с одной из причин:

                    - `InvalidExtension` — у расширения не указано имя или дайджест.
                    - `ReservedName` — имя принадлежит расширению платформы.
                    - `Conflict` — более ранний запрос того же вида уже использует это имя или дайджест, либо платформа устанавливает на те же узлы registry-пакет с этим именем или дайджестом.
                    - `KernelModuleConflict` — более ранний запрос уже загружает один из модулей ядра с другими параметрами.
                    - `NotDeliverable` — ни одна из выбранных NodeGroup не устанавливает расширения такого вида.

                    `Ready` показывает, работают ли выбранные узлы с дайджестом запроса:

                    - `True` с причиной `AllNodesApplied` — работают все выбранные узлы.
                    - `True` с причиной `NoNodesSelected` — запрос не выбирает ни одного узла. Выбранные NodeGroup не существуют, в них нет узлов или нет узлов, подходящих под `nodeSelector`.
                    - `False` с причиной `RolloutInProgress` — часть выбранных узлов ещё не перешла на дайджест запроса.
                    - `False` с причиной `RefusedByNodes` — хотя бы один узел отклонил расширение.
                    - `False` с причиной `NotAccepted` — условие `Accepted` равно `False`.
