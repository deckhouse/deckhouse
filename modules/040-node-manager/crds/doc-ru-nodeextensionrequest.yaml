spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Запрашивает применение системного расширения (образа sysext, при необходимости с модулями ядра) к узлам, которые оно выбирает.

            Образ адресуется так же, как registry-packages-proxy адресует любой пакет: имя, дайджест и необязательные репозиторий и путь. node-controller передаёт их напрямую в extension объекта NodeConfig, который скачивает агент на узле; никакой модуль и ModuleSource не разрешаются.
          properties:
            spec:
              properties:
                sysext:
                  description: |
                    Определяет образ системного расширения для применения — так же, как registry-packages-proxy определяет любой пакет.
                  properties:
                    name:
                      description: |
                        Имя sysext: сопоставляется с extension-release внутри образа и устанавливается на узле как `<name>.raw`.
                    digest:
                      description: |
                        Дайджест манифеста образа sysext.
                    repository:
                      description: |
                        Ключ, по которому registry-packages-proxy подбирает учётные данные (его `--rpp-repository`), например `spec.registry.repo` объекта ModuleSource. Если пусто — образ скачивается из основного реестра кластера.
                    path:
                      description: |
                        Путь образа внутри репозитория (`--rpp-path` прокси). Если пусто — используется корень репозитория.
                nodeGroupSelector:
                  description: |
                    Ограничивает расширение узлами перечисленных NodeGroup.
                  properties:
                    matchNames:
                      description: |
                        Набор имён NodeGroup, к которым применяется расширение.
                nodeSelector:
                  description: |
                    Ограничивает расширение узлами с указанными метками.
                  properties:
                    matchLabels:
                      description: |
                        Набор меток, которые должен нести узел, чтобы быть выбранным.
                kernelModules:
                  description: |
                    Модули, которые нужно загрузить после применения расширения.
                  items:
                    properties:
                      name:
                        description: |
                          Имя модуля ядра.
                      params:
                        description: |
                          Параметры модуля, передаваемые строками вида `key=value`.
            status:
              properties:
                observedGeneration:
                  description: |
                    Поколение spec, которому соответствует текущий status.
                phase:
                  description: |
                    `Ready`, когда sysext разрешился в образ, который выбранные узлы могут скачать; `Degraded`, когда не разрешился (причина — в condition `Ready`).
                matchedNodeGroups:
                  description: |
                    NodeGroup, которым сейчас соответствуют селекторы.
                conditions:
                  description: |
                    Подробности о ходе выполнения запроса.
