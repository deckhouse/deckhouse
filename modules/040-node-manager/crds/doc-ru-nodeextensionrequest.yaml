spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Запрашивает применение системного расширения (образа sysext модуля, при необходимости с модулями ядра) к узлам, которые оно выбирает.

            Образ — это sysext модуля. Он не задаётся полной ссылкой: registry-packages-proxy уже умеет обращаться в репозиторий модуля с учётными данными реестра кластера, поэтому запрос указывает только дайджест и путь в репозитории (по умолчанию — `modules/<module>`), а node-controller записывает разрешённый `path@digest` в status.
          properties:
            spec:
              properties:
                sysext:
                  description: |
                    Определяет образ системного расширения модуля для применения.
                  properties:
                    name:
                      description: |
                        Имя sysext: сопоставляется с extension-release внутри образа и устанавливается на узле как `<name>.raw`.
                    digest:
                      description: |
                        Дайджест манифеста образа sysext.
                    path:
                      description: |
                        Путь образа в реестре кластера. По умолчанию — `modules/<module>` из метки `module.deckhouse.io/name` на запросе.
                nodeGroupSelector:
                  description: |
                    Ограничивает расширение узлами перечисленных NodeGroup.
                  properties:
                    matchNames:
                      description: |
                        Набор имён NodeGroup, к которым применяется расширение.
                nodeSelector:
                  description: |
                    Ограничивает расширение узлами с указанными метками.
                  properties:
                    matchLabels:
                      description: |
                        Набор меток, которые должен нести узел, чтобы быть выбранным.
                kernelModules:
                  description: |
                    Модули, которые нужно загрузить после применения расширения.
                  items:
                    properties:
                      name:
                        description: |
                          Имя модуля ядра.
                      params:
                        description: |
                          Параметры модуля, передаваемые строками вида `key=value`.
            status:
              properties:
                observedGeneration:
                  description: |
                    Поколение spec, которому соответствует текущий status.
                resolvedImage:
                  description: |
                    `repo/path@digest`, до которого разрешился sysext.
                matchedNodeGroups:
                  description: |
                    NodeGroup, которым сейчас соответствуют селекторы.
                conditions:
                  description: |
                    Подробности о ходе выполнения запроса.
