spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Запрос на установку расширения на выбранные узлы: системного расширения (образа sysext, при необходимости с модулями ядра) или registry-пакета.

            Вид расширения автор запроса указывает в `spec.extension.kind`. Registry-пакет (`Package`) устанавливается на выбранные узлы под управлением bashible, системное расширение (`SystemExtension`) — на выбранные узлы Deckhouse Engine. По образу вид не определяется. Если ни одна из выбранных групп не устанавливает расширения такого вида, в состоянии `Ready` указывается причина `NotDeliverable`.

            Образ задаётся так же, как любой пакет в registry-packages-proxy: имя, дайджест и необязательные репозиторий и путь. node-controller без изменений переносит эти поля в `spec.extensions` объекта NodeConfig, и агент узла устанавливает расширение. Образ по модулю или ModuleSource не ищется.
          properties:
            spec:
              properties:
                extension:
                  description: |
                    Образ для установки и его вид. Образ задаётся так же, как любой пакет в registry-packages-proxy.
                  properties:
                    name:
                      description: |
                        Имя расширения. Без изменений переносится в имя записи в `spec.extensions` объекта NodeConfig.

                        Системное расширение сверяется с файлом extension-release внутри образа и устанавливается как `<name>.raw`. Registry-пакет учитывается в `/var/cache/registrypackages/<name>`.

                        Имена `containerd`, `kubelet`, `kubernetes-cni` и `nodelet` зарезервированы.
                    digest:
                      description: |
                        Дайджест манифеста образа.
                    kind:
                      description: |
                        Вид образа.

                        - `Package` — registry-пакет. Агент узла устанавливает его на выбранных узлах под управлением bashible.
                        - `SystemExtension` — системное расширение. Агент узла подключает его на выбранных узлах Deckhouse Engine.

                        Узлы групп другого типа образ не получают. Если ни одна из выбранных групп не устанавливает расширения такого вида, в состоянии `Ready` указывается причина `NotDeliverable`.

                        Поле нельзя изменить после создания. Чтобы сменить вид, удалите запрос и создайте его заново.
                    repository:
                      description: |
                        Ключ, по которому registry-packages-proxy подбирает учётные данные (его `--rpp-repository`), например `spec.registry.repo` объекта ModuleSource. Если поле пустое, образ скачивается из основного registry кластера.
                    path:
                      description: |
                        Путь к образу внутри репозитория (`--rpp-path` прокси). Если поле пустое, используется корень репозитория.
                nodeGroupSelector:
                  description: |
                    Ограничивает расширение узлами перечисленных NodeGroup.
                  properties:
                    matchNames:
                      description: |
                        Набор имён NodeGroup, к которым применяется расширение.
                nodeSelector:
                  description: |
                    Ограничивает расширение узлами с указанными лейблами.
                  properties:
                    matchLabels:
                      description: |
                        Набор лейблов, которые должен нести узел, чтобы попасть под выбор.
                kernelModules:
                  description: |
                    Модули ядра, которые нужно загрузить после подключения системного расширения. Registry-пакет модули ядра загрузить не может, поэтому такой запрос не попадает ни на один узел.
                  items:
                    properties:
                      name:
                        description: |
                          Имя модуля ядра.
                      params:
                        description: |
                          Параметры модуля, передаваемые строками вида `key=value`.
            status:
              properties:
                observedGeneration:
                  description: |
                    Поколение spec, которому соответствует текущий status.
                phase:
                  description: |
                    - `Ready` — расширение попадает на выбранные узлы.
                    - `Degraded` — расширение не попадает на выбранные узлы. Причина указана в состоянии `Ready`.
                matchedNodeGroups:
                  description: |
                    Выбранные NodeGroup, узлы которых устанавливают такой образ: группы Deckhouse Engine для системного расширения, группы под управлением bashible для registry-пакета.
                appliedNodes:
                  description: |
                    Количество выбранных узлов, которые сообщили, что расширение установлено с дайджестом из их NodeConfig. Пока узел ждёт слота обновления, в его NodeConfig остаётся прежний дайджест запроса.

                    Значение складывается из отчётов самих узлов. Запрос может получить причину `Resolved` и при этом быть отклонён на каждом узле, куда он попал.
                failedNodes:
                  description: |
                    Количество выбранных узлов, которые сообщили, что отклонили расширение.
                matchedNodes:
                  description: |
                    Количество узлов в группах из `matchedNodeGroups`, которые выбраны селекторами.
                pendingNodes:
                  description: Количество выбранных узлов, которые ещё не сообщили ни об установке расширения, ни об отказе.
                failureMessage:
                  description: |
                    Что узлы говорят об отказе; берётся с одного из них.
                conditions:
                  description: |
                    Подробности о ходе выполнения запроса.

                    Состояние `Ready` показывает, попадает ли расширение на свои узлы. Причина `Resolved` означает, что попадает. Остальные причины объясняют, почему нет: `InvalidExtension`, `ReservedName`, `Conflict`, `KernelModuleConflict`, `NotDeliverable` (ни одна выбранная группа не устанавливает такой образ) и `RefusedByNodes`.
