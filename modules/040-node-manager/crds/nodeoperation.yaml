apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeoperations.deckhouse.io
  labels:
    heritage: deckhouse
    module: node-manager
spec:
  group: deckhouse.io
  scope: Cluster
  names:
    plural: nodeoperations
    singular: nodeoperation
    kind: NodeOperation
    shortNames:
      - nop
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      # Lets a node watch only its own live operations and an operator select by
      # node, phase or type; field selectors on custom resources need these.
      selectableFields:
        - jsonPath: .spec.nodeName
        - jsonPath: .status.phase
        - jsonPath: .spec.type
      additionalPrinterColumns:
        - name: Phase
          jsonPath: .status.phase
          type: string
        - name: Type
          jsonPath: .spec.type
          type: string
        - name: Node
          jsonPath: .spec.nodeName
          type: string
        - name: Age
          jsonPath: .metadata.creationTimestamp
          type: date
      schema:
        openAPIV3Schema:
          type: object
          description: |
            Describes an operation on a node that interrupts its work.

            The `spec` of an existing operation cannot be changed, except `.spec.approved`. To approve a `Disruption` operation, run:

            ```shell
            d8 k patch nodeoperation <OPERATION_NAME> --type=merge -p '{"spec":{"approved":true}}'
            ```

            In the command, replace `<OPERATION_NAME>` with the name of the operation.

            Operations for a deleted Cluster API Machine carry the label `node-manager.deckhouse.io/machine-uid`. Only `node-manager` can set it.
          x-doc-examples:
            - |
              ```yaml
              # Reboot a node.
              apiVersion: deckhouse.io/v1alpha1
              kind: NodeOperation
              metadata:
                name: reboot-worker-1
              spec:
                type: Reboot
                nodeName: worker-1
              ```
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - type
                - nodeName
              x-kubernetes-validations:
                # Every field but approved, by name: a field added to the spec has to be added here too.
                # Spelled with has() rather than optional equality: comparing optionals loses
                # the maxLength bound and the rule's estimated cost exceeds the CRD budget.
                - rule: >-
                    self.type == oldSelf.type && self.nodeName == oldSelf.nodeName &&
                    self.?configGeneration == oldSelf.?configGeneration &&
                    has(self.nodeConfigUID) == has(oldSelf.nodeConfigUID) &&
                    (!has(self.nodeConfigUID) || self.nodeConfigUID == oldSelf.nodeConfigUID) &&
                    has(self.drain) == has(oldSelf.drain) &&
                    (!has(self.drain) || self.drain == oldSelf.drain) &&
                    has(self.cause) == has(oldSelf.cause) &&
                    (!has(self.cause) || self.cause == oldSelf.cause)
                  message: the spec of an operation is immutable except .spec.approved. Create another operation instead
                - rule: "!oldSelf.?approved.orValue(false) || self.?approved.orValue(false)"
                  message: an approval cannot be withdrawn
                - rule: "self.type != 'Disruption' || (has(self.configGeneration) && has(self.nodeConfigUID))"
                  message: Disruption requires .spec.configGeneration and .spec.nodeConfigUID
                - rule: "self.type == 'Disruption' || !has(self.configGeneration)"
                  message: .spec.configGeneration is only meaningful for Disruption
                - rule: "self.type != 'Drain' || !has(self.drain)"
                  message: .spec.drain is not allowed for Drain
              properties:
                type:
                  type: string
                  enum:
                    - Reboot
                    - Drain
                    - Disruption
                  description: |
                    Operation to perform on the node.

                    * `Reboot`: Reboot the node. Only the nodes of a NodeGroup with `systemType: Immutable` perform this operation. A node that bashible manages refuses it, and the operation fails with the reason `NodeRefused`.
                    * `Drain`: Evict the workload from the node. The node stays unschedulable until an operator makes it schedulable again. `node-manager` also creates a `Drain` for the node of a deleted Cluster API Machine. `.spec.cause` names the machine.

                      To cancel a running `Drain`, delete it. `node-manager` withdraws its eviction request from the node before the object is gone. The cordon the eviction placed stays: make the node schedulable again yourself.
                    * `Disruption`: Interrupt the node's work so that the node can apply a new configuration.

                    `node-manager` creates `Disruption` operations. Creating one by hand is refused. `Reboot` and `Drain` are meant for an operator.
                nodeName:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                  description: |
                    The name of the node the operation applies to.
                configGeneration:
                  type: integer
                  format: int64
                  minimum: 1
                  description: |
                    Revision of the node's NodeConfig this disruption is for (`.metadata.generation` of the NodeConfig object).

                    Allowed only for `Disruption`. The API server rejects the field for other types. If the NodeConfig moves to a newer generation before the operation is approved, `node-manager` deletes the operation.
                nodeConfigUID:
                  type: string
                  maxLength: 36
                  description: |
                    NodeConfig object this disruption is for (`.metadata.uid` of the node's NodeConfig).

                    Only meaningful for `Disruption`. Other types ignore it.
                approved:
                  type: boolean
                  description: |
                    Whether the interruption may go ahead. If the field is not set, the operation is not approved.

                    Only meaningful for `Disruption`. `Reboot` and `Drain` ignore it.

                    In the `Manual` approval mode of the NodeGroup (`spec.disruptions.approvalMode`), `node-manager` sets it to `false`, and an operator sets it to `true`. In the other modes, `node-manager` sets it to `true` on creation. An approval cannot be withdrawn.
                drain:
                  type: object
                  description: |
                    How to evict the workload before the node is interrupted.

                    Allowed for `Reboot` and `Disruption`. The API server rejects the field for `Drain`.
                  properties:
                    skip:
                      type: boolean
                      default: false
                      description: |
                        Interrupt the node without evicting its workload first.

                        When `node-manager` creates a `Disruption`, it sets the field to `true` for these nodes:

                        - The single node of the `master` NodeGroup
                        - The node of the Deckhouse pod, while fewer than two nodes of its group are `Ready`
                        - Every node of a NodeGroup with `spec.disruptions.automatic.drainBeforeApproval: false`
                cause:
                  type: string
                  maxLength: 1024
                  description: |
                    Why the node is interrupted.

                    For a `Disruption`, `node-manager` sets it on creation. For `Reboot` and `Drain`, an operator may set it.
            status:
              type: object
              x-kubernetes-validations:
                - rule: "!has(oldSelf.phase) || !(oldSelf.phase in ['Completed', 'Failed']) || (has(self.phase) && self.phase == oldSelf.phase)"
                  message: a finished operation cannot be reopened
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Approved
                    - InProgress
                    - Completed
                    - Failed
                  description: |
                    Current phase of the operation, set by `node-manager`.

                    * `Pending`: The operation is queued or waits for approval.
                    * `Approved`: The operation may go ahead. The workload is being evicted from the node before the node receives the operation.
                    * `InProgress`: For `Drain`, the workload is being evicted. For the other types, the node has been prepared and can perform the operation.
                    * `Completed`: The operation finished successfully.
                    * `Failed`: The operation failed.
                reason:
                  type: string
                  maxLength: 128
                  pattern: '^[A-Za-z][A-Za-z0-9]*$'
                  description: |
                    Reason for the current phase of the operation.

                    * `Pending`: `Queued` (nothing has been done yet), `WaitingForApproval`.
                    * `Approved`: `Draining` (the workload is being evicted from the node), `WaitingForOperation` (another eviction of the node is running, and `message` names who requested it).
                    * `InProgress`: `Draining` and `WaitingForOperation` (for `Drain`), `WaitingForNode` (the node has received the operation and has not reported yet), `Rebooting` (the node is rebooting and has not come back yet).
                    * `Completed`: `Succeeded`, `Released` (the node gave up on the NodeConfig revision the `Disruption` is for), `Drained` (for `Drain`).
                    * `Failed`: `NodeFailed` and `NodeRefused` (reported by the node), `PreparationTimedOut` (the workload did not leave the node in time), `NodeTimedOut` (the node did not report back or did not come back after a reboot in time), `NodeNotFound`, `NodeGroupMissing`, `MachineDeleted` (the machine of the node is being deleted).
                message:
                  type: string
                  maxLength: 32768
                  description: |
                    Human-readable explanation of `reason`.
                deadline:
                  type: string
                  format: date-time
                  description: |
                    Time when the current stage of the operation times out and the operation fails.

                    The node gets 30 minutes from `startedAt` to report the result or to come back after a reboot. The eviction gets the drain timeout of the NodeGroup (`nodeDrainTimeoutSecond`) plus 30 minutes.
                startedAt:
                  type: string
                  format: date-time
                  description: |
                    When the node was handed the operation. The wait for the node is measured from here.
                finishedAt:
                  type: string
                  format: date-time
                  description: |
                    When the operation reached a terminal phase. A finished operation is kept as the
                    record of what was done to the node and is collected once it is a day old.
                bootID:
                  type: string
                  maxLength: 64
                  description: |
                    Boot ID of the node (`status.nodeInfo.bootID` of the Node object) when the reboot started.
                nodeWasUnschedulable:
                  type: boolean
                  description: |
                    Whether the node was already out of the scheduler when the operation reached it.

                    Releasing the node at the end of the operation restores this value instead of making the node schedulable, so an operation does not quietly undo a cordon an operator put there by hand.
                drainDeadline:
                  type: string
                  format: date-time
                  description: |
                    When the eviction this operation asked for runs out of the time it was given.

                    On the `Drain` of a deleted machine, the operation fails with `PreparationTimedOut` at this moment, and the machine is deleted with the pods that did not leave. The field is not set for a `Static` or `CloudStatic` NodeGroup without `nodeDrainTimeoutSecond`, and such a `Drain` has no time limit.

                    It is pinned at the moment the eviction is requested, from the NodeGroup's `nodeDrainTimeoutSecond` as it stood then, because that is the bound the draining controller itself started running to. Deriving it again later would let a change to the NodeGroup cut short a drain that is still running.
                conditions:
                  type: array
                  maxItems: 8
                  description: |
                    Latest details of the operation's progress:

                    * `Drained`: Written by `node-manager`. While the workload is being evicted, the condition is `False` with the reason `Draining`. Once the workload has left, it is `True` with the reason `Drained`. When the operation skips the eviction, it is `True` with the reason `DrainSkipped`.
                    * `EvictionBlocked`: Written by `node-manager` while evictions of the workload are refused, for example by a PodDisruptionBudget. The condition is `True` with the reason `EvictionRefused`, and its `message` lists the refusals as the eviction reports them, one per pod. The same text is in the operation's `message`. The condition is removed once the refusals stop or the eviction ends. A finished operation keeps the refusals it ended on.
                    * `NodeReported`: Written by the node. The condition is `True` with the reason `Succeeded`, `Released`, `Failed`, `Refused` or `RebootStarted`.
                    * `Retry`: Written by `node-manager` on a failed `Disruption`. The condition says whether `node-manager` makes another attempt for the same NodeConfig revision.

                    Reasons of the `Retry` condition:

                    * `Created` (`True`): The next attempt exists, and `message` names it.
                    * `Scheduled` (`True`): `node-manager` creates the next attempt at the time given in `message`.
                    * `AttemptsExhausted` (`False`): 3 attempts for the same revision have failed. `node-manager` makes no new attempt until the NodeConfig changes or the oldest failed attempt is deleted.
                    * `Superseded` (`False`): The NodeConfig has moved to another generation or has been recreated.
                    * `NotRequested` (`False`): The node no longer asks to be interrupted for this revision.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$'
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      message:
                        type: string
                        maxLength: 32768
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
