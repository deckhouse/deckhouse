                    - `APIEndpointsReachable`
                    - `SysctlApplied`
                    - `KernelModulesLoaded`
                    - `MountsReady`
                    - `ExtensionsReady`
                    - `ContainerdReady`
                    - `KubeletReady`
                    - `StaticPodsReady`
                    - `UnitsRunning`
                    - `OSImageUpToDate`
                    - `ControlPlaneBootstrapped`

