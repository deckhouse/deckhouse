apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    heritage: deckhouse
    module: node-manager
  name: nodeconfigs.internal.deckhouse.io
spec:
  group: internal.deckhouse.io
  names:
    kind: NodeConfig
    listKind: NodeConfigList
    plural: nodeconfigs
    shortNames:
    - nc
    singular: nodeconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.systemType
      name: SystemType
      priority: 1
      type: string
    - jsonPath: .metadata.labels.node\.deckhouse\.io/group
      name: Group
      priority: 1
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.appliedGeneration
      name: Applied
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodeConfig is the desired state of one node and the node agent's report on it.

          The node agent (nodelet) applies `spec`.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Desired state of the node.
            properties:
              apiServerEndpoints:
                description: Kubernetes API server URLs with scheme and port, for
                  example `https://10.0.0.1:6443`.
                items:
                  maxLength: 253
                  pattern: ^https://(\[[0-9A-Fa-f:]+\]|[A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?([.][A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?)*):(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})/?$
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              containerRuntime:
                description: ContainerRuntime holds containerd configuration.
                properties:
                  maxConcurrentDownloads:
                    description: |-
                      Maximum number of image layers downloaded in parallel.

                      `0` means no limit. Defaults to `8` when unset.
                    minimum: 0
                    type: integer
                  registryConfigOwner:
                    description: |-
                      Component that writes the containerd `registry.d` directory.

                      - `Nodelet`: The node agent writes the configuration from `spec.registry` to the
                        directory and removes everything else in it.
                      - `RegistryAgent`: The registry agent static pod owns the directory.

                      Defaults to `Nodelet` when unset. Set by `node-manager`.
                    enum:
                    - Nodelet
                    - RegistryAgent
                    type: string
                  sandboxImage:
                    description: |-
                      The `pause` image used for pod sandboxes.

                      If not specified, the pause image imported by the containerd system extension is used.
                    maxLength: 1024
                    pattern: ^[^[:space:]]+$
                    type: string
                type: object
              extensions:
                description: |-
                  Extensions the node installs, each pinned by digest.

                  On an Immutable node an entry is a signed dm-verity system extension image.
                  On a Mutable node an entry is a registry package: the node agent runs the
                  package's own `install` script as root.

                  An entry named `nodelet` updates the node agent itself.
                items:
                  description: |-
                    Extension is a signed verity sysext built from a release channel, fetched
                    from the registry-packages-proxy by digest. Optional repository selects the
                    proxy's per-registry config; optional path is its "path" parameter.
                  properties:
                    digest:
                      description: Digest is the sha256 digest of the sysext image.
                      pattern: ^sha256:[a-f0-9]{64}$
                      type: string
                    name:
                      description: Name is the extension name (also the sysext image
                        basename).
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    path:
                      description: Path to the artifact inside the registry.
                      maxLength: 512
                      type: string
                    repository:
                      description: Repository optionally selects the proxy's per-registry
                        client config.
                      maxLength: 1024
                      pattern: ^[^[:space:]]+$
                      type: string
                    requestedBy:
                      description: |-
                        Object that requested the extension.

                        Unset for an extension of the platform itself.
                      properties:
                        kind:
                          description: Kind of the object.
                          enum:
                          - NodeExtensionRequest
                          - NodeStaticPodRequest
                          type: string
                        name:
                          description: Name of the object.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                  required:
                  - digest
                  - name
                  type: object
                maxItems: 128
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              featureGates:
                additionalProperties:
                  type: boolean
                description: |-
                  Node agent features to switch on or off, keyed by feature name.

                  A feature missing from this map is on for an Immutable node if the node type
                  supports it, and off for a Mutable node. A Mutable node runs only the features
                  switched on here.

                  The node rejects a document that names an unknown feature or switches on a
                  feature its node type does not support.

                  Set by node-controller.
                maxProperties: 32
                type: object
                x-kubernetes-validations:
                - message: a feature name is a DNS label
                  rule: self.all(k, size(k) <= 63 && k.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'))
              internalNetworkCIDRs:
                description: |-
                  InternalNetworkCIDRs are the subnets the cluster's own traffic runs on.
                  The node picks the interface holding an address inside one of them and
                  registers with that address; a node with one NIC needs none of this.
                  The pattern is StaticClusterConfiguration's own
                  (candi/openapi/static_cluster_configuration.yaml): IPv4 only.
                items:
                  maxLength: 43
                  pattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(3[0-2]|[1-2][0-9]|[0-9]))$
                  type: string
                maxItems: 64
                type: array
              kernel:
                description: Kernel holds sysctl settings and kernel modules to load.
                properties:
                  modules:
                    description: |-
                      Kernel modules to load, in this order.

                      Dependencies are not loaded automatically: list each module after the modules it
                      depends on. Do not list a driver built into the kernel: `KernelModulesLoaded`
                      becomes `False`.

                      A module added to the list is loaded only after the disruption is approved.
                    items:
                      description: KernelModule is a module to load with optional
                        parameters.
                      properties:
                        name:
                          maxLength: 64
                          minLength: 1
                          type: string
                        params:
                          items:
                            maxLength: 256
                            type: string
                          maxItems: 32
                          type: array
                      required:
                      - name
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  sysctl:
                    additionalProperties:
                      description: SysctlValue bounds a single sysctl value for predictable
                        CRD CEL cost.
                      maxLength: 1024
                      type: string
                    maxProperties: 256
                    type: object
                    x-kubernetes-validations:
                    - message: vm.overcommit_memory is required to be 1
                      rule: '!(''vm.overcommit_memory'' in self) || self[''vm.overcommit_memory'']
                        == ''1'''
                    - message: sysctl keys must use dotted notation
                      rule: self.all(key, key.matches('^[A-Za-z0-9_-]+([.][A-Za-z0-9_-]+)+$'))
                    - message: sysctl values must not be empty or whitespace
                      rule: self.all(key, self[key].trim() != '')
                type: object
              kubelet:
                description: Kubelet holds kubelet configuration parameters.
                properties:
                  bootstrapToken:
                    description: |-
                      BootstrapToken is the bootstrap token used by kubelet to obtain its
                      client certificate on first boot.
                    maxLength: 4096
                    type: string
                  clusterCABundle:
                    description: PEM bundle of the cluster CA.
                    maxLength: 65536
                    type: string
                  clusterDNS:
                    description: ClusterDNS is the list of DNS server IP addresses
                      for the cluster.
                    items:
                      maxLength: 45
                      type: string
                    maxItems: 8
                    type: array
                    x-kubernetes-validations:
                    - message: clusterDNS entries must be valid IP addresses
                      rule: self.all(address, isIP(address))
                  clusterDomain:
                    description: ClusterDomain is the DNS domain for this cluster
                      (e.g. "cluster.local").
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  containerLogMaxFiles:
                    description: |-
                      Number of rotated log files kept per container.

                      Defaults to `4` when unset.
                    maximum: 1000
                    minimum: 1
                    type: integer
                  containerLogMaxSize:
                    description: |-
                      Maximum size of a container log file before it is rotated.

                      Defaults to `50Mi` when unset.
                    maxLength: 64
                    type: string
                    x-kubernetes-validations:
                    - message: containerLogMaxSize must be a positive Kubernetes quantity
                      rule: isQuantity(self) && sign(quantity(self)) > 0
                  externalCloudProvider:
                    description: |-
                      ExternalCloudProvider enables --cloud-provider=external so the
                      cloud-controller-manager manages the node (zone, region, providerID).
                    type: boolean
                  kubernetesVersion:
                    description: |-
                      KubernetesVersion is the cluster's minor version, e.g. "1.34". It decides
                      which feature gates kubelet is started with (bashible turns DRA gates on
                      by version); without it DRA workloads cannot run on immutable nodes.
                    maxLength: 16
                    pattern: ^[0-9]+\.[0-9]+$
                    type: string
                  maxPods:
                    description: |-
                      Maximum number of pods on the node.

                      Defaults to `120` when unset.
                    maximum: 1000
                    minimum: 1
                    type: integer
                  nodeLabels:
                    additionalProperties:
                      description: |-
                        NodeLabelValue carries a label value unvalidated: a NodeGroup takes any
                        string (crds/node_group.yaml:1915), and refusing one here costs the group its
                        whole configuration instead of costing the node one label.
                      type: string
                    description: |-
                      NodeLabels are labels added to the node object when kubelet registers.
                      A NodeGroup caps neither their number nor their shape
                      (crds/node_group.yaml:1915), so neither does this.
                    type: object
                  registerWithTaints:
                    description: |-
                      RegisterWithTaints is a list of taints to add to the node object when
                      kubelet registers itself. Only takes effect on initial registration.
                    items:
                      description: |-
                        Taint represents a Kubernetes taint applied to a node during registration.
                        Key, value and effect take what a NodeGroup takes (crds/node_group.yaml:1944):
                        bare strings and an optional effect, so a taint copied from one still fits.
                      properties:
                        effect:
                          enum:
                          - NoSchedule
                          - PreferNoSchedule
                          - NoExecute
                          type: string
                        key:
                          type: string
                        value:
                          type: string
                      required:
                      - key
                      type: object
                    type: array
                  resourceReservation:
                    description: |-
                      ResourceReservation controls how much CPU, memory and disk are held back
                      from pods for the system itself (kubeReserved).
                    properties:
                      mode:
                        description: |-
                          Reservation policy.

                          - `Auto`: Computed from the node's capacity.
                          - `Off`: Nothing is reserved.

                          Defaults to `Auto` when unset.
                        enum:
                        - Auto
                        - "Off"
                        type: string
                    type: object
                  serverTLSBootstrap:
                    description: |-
                      ServerTLSBootstrap makes kubelet request a serving certificate from the
                      cluster instead of signing its own. Default true. The zero master sets it
                      to false: nothing approves serving CSRs until Deckhouse is installed.
                    type: boolean
                type: object
              network:
                description: Network holds hostname, DNS, NTP, interfaces and routes.
                properties:
                  dns:
                    description: DNS resolver configuration.
                    properties:
                      search:
                        items:
                          maxLength: 253
                          type: string
                        maxItems: 16
                        type: array
                      servers:
                        description: Name server IP addresses.
                        items:
                          maxLength: 45
                          type: string
                        maxItems: 16
                        type: array
                        x-kubernetes-validations:
                        - message: DNS servers must be IP addresses
                          rule: self.all(address, isIP(address))
                    type: object
                  hostname:
                    description: Host name of the node.
                    maxLength: 253
                    type: string
                  interfaces:
                    description: Network interfaces, keyed by name.
                    items:
                      description: NetworkInterface describes a single NIC.
                      properties:
                        addresses:
                          description: Static addresses in CIDR notation, used when
                            `dhcp` is `false`.
                          items:
                            maxLength: 43
                            type: string
                          maxItems: 16
                          type: array
                          x-kubernetes-validations:
                          - message: interface addresses must be in CIDR notation
                            rule: self.all(address, isCIDR(address))
                        cluster:
                          description: |-
                            Cluster names this NIC the one the cluster's traffic runs on, for a
                            machine whose addressing spec.internalNetworkCIDRs cannot tell apart.
                          type: boolean
                        dhcp:
                          description: DHCP enables DHCPv4 on the interface.
                          type: boolean
                        gateway:
                          description: Default gateway IP address.
                          maxLength: 45
                          type: string
                          x-kubernetes-validations:
                          - message: the gateway must be an IP address
                            rule: isIP(self)
                        name:
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - dhcp
                      - name
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                    x-kubernetes-validations:
                    - message: at most one interface may be marked cluster
                      rule: self.filter(i, has(i.cluster) && i.cluster).size() <=
                        1
                  ntp:
                    description: NTP time-sync configuration.
                    properties:
                      servers:
                        items:
                          maxLength: 253
                          type: string
                        maxItems: 16
                        type: array
                    type: object
                  routes:
                    items:
                      description: Route is a static route.
                      properties:
                        gateway:
                          description: Gateway IP address.
                          maxLength: 45
                          type: string
                          x-kubernetes-validations:
                          - message: the gateway must be an IP address
                            rule: isIP(self)
                        name:
                          maxLength: 253
                          type: string
                        networks:
                          description: Destination networks in CIDR notation.
                          items:
                            maxLength: 43
                            type: string
                          maxItems: 16
                          type: array
                          x-kubernetes-validations:
                          - message: route networks must be in CIDR notation
                            rule: self.all(network, isCIDR(network))
                      type: object
                    maxItems: 64
                    type: array
                type: object
              nodeName:
                description: |-
                  Name of the Kubernetes node this configuration applies to.

                  Equals `metadata.name` and cannot be changed.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
                x-kubernetes-validations:
                - message: spec.nodeName cannot be changed
                  rule: self == oldSelf
              osImage:
                description: |-
                  Operating system image to use on the node.

                  To determine whether an update is required, the node compares the image `digest` with the value saved to `/config/os-digest` during installation. The digest identifies a specific image publication and may change when the same content is republished.

                  Required when `systemType` is `Immutable`.
                properties:
                  digest:
                    description: |-
                      Operating system image digest.

                      Identifies a specific image and is used by the node to determine whether an update is required. During installation, the node saves the digest and compares it with the specified value during subsequent checks.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  path:
                    description: Path to the image inside the registry.
                    maxLength: 512
                    type: string
                  repository:
                    description: |-
                      Address of the container registry from which the operating system image is downloaded.

                      The value is passed to `registry-packages-proxy` as the `repository` parameter.

                      If the parameter is not specified, `repository` is not passed and `registry-packages-proxy` uses its default container registry.
                    maxLength: 1024
                    pattern: ^[^[:space:]]+$
                    type: string
                  rootHash:
                    description: |-
                      Dm-verity root hash of the root filesystem inside the image, in ASCII hexadecimal format.

                      Used to determine whether the actual image content has changed. Unlike `digest`, which may change when an image is republished, `rootHash` remains the same if the root filesystem content has not changed.

                      Deckhouse Platform obtains the value from an image label. If the value cannot be obtained from the label, the node determines the root hash after downloading the image.
                    pattern: ^[a-f0-9]{64}$
                    type: string
                required:
                - digest
                type: object
              registry:
                description: |-
                  Registry is the container registry the node talks to directly, without
                  the registry-packages-proxy. A node bootstrapping a control plane has no
                  proxy yet but must pull images and sysexts; workers leave this empty.
                properties:
                  address:
                    description: |-
                      Address is the registry host, optionally with a port, e.g.
                      "registry.deckhouse.io" or "registry.example.com:5000".
                    maxLength: 1024
                    minLength: 1
                    pattern: ^[^[:space:]]+$
                    type: string
                  auth:
                    description: |-
                      Auth is the base64-encoded "user:password" pair, as it appears in the
                      "auth" field of a docker config.
                    format: byte
                    maxLength: 4096
                    type: string
                  caBundle:
                    description: PEM bundle of the CA certificates the registry is
                      verified with.
                    maxLength: 65536
                    type: string
                  path:
                    description: Path is the repository path within the registry,
                      e.g. "/deckhouse/ce".
                    maxLength: 1024
                    type: string
                  scheme:
                    description: |-
                      Protocol the node uses to connect to the registry.

                      Defaults to `HTTPS` when unset.
                    enum:
                    - HTTPS
                    - HTTP
                    type: string
                required:
                - address
                type: object
              registryPackagesProxy:
                description: |-
                  How the node reaches `registry-packages-proxy`, which serves it extensions and
                  operating system images.
                properties:
                  accessToken:
                    description: |-
                      Bearer token the node presents to the proxy.

                      Base64-encoded in the object.
                    format: byte
                    maxLength: 4096
                    type: string
                  endpoints:
                    description: |-
                      `registry-packages-proxy` URLs with scheme and port.

                      When unset, the node uses port `4219` of the `apiServerEndpoints` hosts. Set
                      only in the initial configuration of the first master node.
                    items:
                      maxLength: 253
                      pattern: ^https?://(\[[0-9A-Fa-f:]+\]|[A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?([.][A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?)*):(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})/?$
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                type: object
              staticPods:
                description: |-
                  Manifests of static pods that kubelet runs without using the Kubernetes scheduler.

                  The node writes the manifests to `/etc/kubernetes/manifests`. Static pods must obtain any other required resources on their own. For example, a pod can issue its own certificates, use the node's kubeconfig, and mount directories for persistent state using `hostPath` with the `DirectoryOrCreate` type.

                  Control plane component manifests created by the node agent are not included in `spec.staticPods` and are not modified when this parameter is processed.
                items:
                  description: Static pod.
                  properties:
                    manifest:
                      description: |-
                        Complete pod manifest.

                        When the manifest is written to disk, the `$MY_IP` substring is replaced with the node's IP address, similarly to control plane component manifests.
                      maxLength: 32768
                      minLength: 1
                      type: string
                    name:
                      description: |-
                        Manifest file name without an extension.

                        Used as the list item key and is independent of `metadata.name` of the pod in the manifest. Kubelet determines the mirror pod name from the manifest rather than the file name.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    requestedBy:
                      description: |-
                        Object that requested the static pod.

                        Unset for a static pod of the platform itself.
                      properties:
                        kind:
                          description: Kind of the object.
                          enum:
                          - NodeExtensionRequest
                          - NodeStaticPodRequest
                          type: string
                        name:
                          description: Name of the object.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                  required:
                  - manifest
                  - name
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              statusToken:
                description: |-
                  StatusToken is the bearer presented to the node's :50000 status port.
                  Whoever writes the document mints it (dhctl, or the NodeConfigTemplate
                  render for a hand-installed machine); the cluster carries it over
                  untouched, having no way to tell the node a new one. Deliberately not
                  marked sensitive: the apiserver would answer "<omitted>" and the
                  carry-over would write that back, destroying the token.
                maxLength: 4096
                type: string
              storage:
                description: |-
                  Disk the operating system is installed on, and additional filesystems.

                  The installation disk cannot be changed once set.
                properties:
                  device:
                    description: |-
                      Device is the whole-disk block device to install onto, e.g. "/dev/sda",
                      "/dev/nvme0n1", or a stable "/dev/disk/by-id/..." path. Ignored when
                      diskSelector is set.
                    maxLength: 1024
                    pattern: ^/dev/[A-Za-z0-9._/-]+$
                    type: string
                    x-kubernetes-validations:
                    - message: spec.storage.device names the disk this system was
                        installed on and cannot change
                      rule: self == oldSelf
                  diskSelector:
                    description: |-
                      Selects the installation disk by attributes instead of a fixed path.

                      All specified fields must match.
                    properties:
                      busPath:
                        description: BusPath matches the hardware bus path (glob).
                        maxLength: 253
                        type: string
                      model:
                        description: Model matches the device model (glob), e.g. "Samsung*".
                        maxLength: 253
                        type: string
                      name:
                        description: Name matches the kernel device name (glob), e.g.
                          "nvme0n1".
                        maxLength: 253
                        type: string
                      rotational:
                        description: Rotational matches spinning (true) vs solid-state
                          (false) disks.
                        type: boolean
                      serial:
                        description: Serial matches the disk serial number (glob).
                        maxLength: 253
                        type: string
                      size:
                        description: |-
                          Size matches the disk capacity, optionally with a comparison operator,
                          e.g. ">=100Gi", ">1Ti", "512Gi".
                        maxLength: 253
                        type: string
                      type:
                        description: Type matches the disk kind.
                        enum:
                        - SSD
                        - HDD
                        - NVMe
                        - SD
                        type: string
                      wwid:
                        description: WWID matches the World Wide Identifier (glob).
                        maxLength: 253
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: spec.storage.diskSelector names the disk this system
                        was installed on and cannot change
                      rule: self == oldSelf
                  mounts:
                    description: |-
                      Mounts are additional filesystems the node makes available, at /mnt/<name>
                      or wherever bindTo names. Nothing here is partitioned: only existing
                      partitions and blank whole disks are formatted (when empty) and mounted.
                    items:
                      description: |-
                        Mount is one additional filesystem, at /mnt/<name> unless bindTo says
                        otherwise. Exactly one of device or partitionSelector names the partition; an
                        empty one is formatted (label = name), an existing filesystem mounted as is.
                      properties:
                        bindTo:
                          description: |-
                            BindTo mounts the filesystem at this path instead of /mnt/<name>, for a
                            directory something else knows by name (/var/lib/etcd). The directory must
                            be empty: mounting over files hides them, and hidden etcd data is lost data.
                          maxLength: 1024
                          pattern: ^/[A-Za-z0-9._/-]+$
                          type: string
                        device:
                          description: |-
                            Device is the partition to use, e.g. "/dev/sdb1" or a stable
                            "/dev/disk/by-id/...-part1" path.
                          maxLength: 1024
                          pattern: ^/dev/[A-Za-z0-9._/-]+$
                          type: string
                        filesystem:
                          description: |-
                            Filesystem to create on an empty partition.

