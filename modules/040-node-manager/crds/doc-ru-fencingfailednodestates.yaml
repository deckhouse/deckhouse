apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fencingfailednodestates.node-manager.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Инцидент fencing одного узла.

            Имя объекта совпадает с именем отказавшего узла. Объект содержит ровно одну owner reference на этот узел, поэтому сборщик мусора Kubernetes удаляет его вместе с объектом Node. Если UID в owner reference не совпадает с UID узла с этим именем, например узел создан заново под тем же именем, контроллер ничего не делает по такому объекту. У здорового узла объекта `FencingFailedNodeState` нет: объект существует, только пока у узла есть активный инцидент.

            Объект создаёт fencing-agent. Создать его может агент любого узла, в том числе агент на узле группы в режиме `Disabled`. Создатель записывает `spec`, после этого `spec` изменить нельзя. У каждой части `status` один владелец. fencing-controller читает объект и решает, нужно ли эвакуировать узел.

            Объект удаляется в следующих случаях:

            - Отказавший узел вернулся с тем же boot ID до фазы `Proven`. Тогда объект удаляют агенты fencing.
            - Node в состоянии `Ready` и у него новый boot ID. Тогда fencing-controller снимает с Node taint `node.kubernetes.io/out-of-service` и удаляет объект.
            - Объект Node удалён. Тогда объект удаляет сборщик мусора Kubernetes.

            Не создавайте объект вручную. Не изменяйте `spec` и `status`.
          properties:
            spec:
              description: |
                Неизменяемое описание инцидента. Создатель объекта записывает его при создании, изменить его потом нельзя.
              properties:
                source:
                  description: |
                    Источник инцидента — кто создал объект:

                    - `MemberlistDead` — fencing-agent, который увидел узел мёртвым в сети memberlist кластера;
                    - `DeclareSuicide` — fencing-agent, получивший сообщение `DeclareSuicide` от узла. Этот агент — свидетель;
                    - `NodeLeaseStale` — fencing-controller, потому что Lease узла устарел. Текущая версия контроллера не создаёт объекты с этим источником.
                detectedBy:
                  description: |
                    Имя узла, агент которого создал объект. Если объект создал fencing-controller, значение — `fencing-controller`.
                detectedAt:
                  description: |
                    Время, когда создатель обнаружил отказ, с точностью до микросекунд.

                    Значение справочное. Сроки fencing-controller отсчитывает от собственных наблюдений.
                bootID:
                  description: |
                    Boot ID отказавшего узла на момент отказа. fencing-agent берёт его из метаданных узла в memberlist. Для источника `NodeLeaseStale` контроллер берёт его из `status.nodeInfo.bootID` объекта Node.
                armed:
                  description: |
                    `true`, если watchdog отказавшего узла был вооружён на момент отказа. fencing-agent берёт значение из метаданных узла в memberlist.
                profileRef:
                  description: |
                    Профиль SLA группы узлов отказавшего узла на момент создания объекта. Группа — значение метки `node.deckhouse.io/group` объекта Node. Профиль выбирает режим группы. Если группа в режиме `Disabled`, значение — профиль сети memberlist кластера.

                    Поле задаётся, только если `armed` равно `true`. Тайминги отказавшего узла fencing-controller берёт только из этого профиля.
                  properties:
                    name:
                      description: |
                        Имя встроенного профиля SLA. Допустимы только имена встроенных профилей.

                        Соответствующий объект `FencingSLAProfile` называется этим значением в нижнем регистре, так как имя объекта Kubernetes не может содержать заглавные буквы. Чтобы найти профиль, контроллер приводит значение к нижнему регистру.
            status:
              description: |
                Наблюдаемое состояние инцидента. У каждой части статуса один владелец:

                - `attestation` — fencing-agent узла-свидетеля;
                - `contact` — fencing-agent, получивший сообщение о контакте с отказавшим узлом. Текущая версия агента эту секцию не записывает;
                - `fallback` — fencing-agent отказавшего узла;
                - `phase`, `correlation` и `conditions` — fencing-controller. Текущая версия контроллера не записывает `correlation`.

                Статус — подресурс. Создатель объекта не может задать его в запросе на создание.
              properties:
                attestation:
                  description: |
                    Аттестация отказа. Свидетель — узел, агент которого получил сообщение `DeclareSuicide` от отказавшего узла. Агент свидетеля записывает имя своего узла.
                  properties:
                    witness:
                      description: |
                        Имя узла-свидетеля.
                    at:
                      description: |
                        Время аттестации с точностью до микросекунд.
                contact:
                  description: |
                    Последний контакт с отказавшим узлом. Секцию записывает fencing-agent, получивший сообщение о контакте с узлом.
                  properties:
                    at:
                      description: |
                        Время последнего контакта с отказавшим узлом с точностью до микросекунд.
                    reportedBy:
                      description: |
                        Имя узла, сообщившего о контакте.
                fallback:
                  description: |
                    Свидетельство работоспособности от отказавшего узла. Секцию записывает только fencing-agent отказавшего узла и только через API Kubernetes, поэтому она появляется, только если узел видел API.

                    fencing-controller держит фазу `FallbackAlive`, пока последний heartbeat не старше `2 * heartbeat.interval + heartbeat.apiTimeout` из профиля.
                  properties:
                    lastHeartbeatAt:
                      description: |
                        Время последнего heartbeat узла с точностью до микросекунд.

                        Если свежие heartbeat прекратились, это признак того, что узел не видит API.
                phase:
                  description: |
                    Фаза инцидента:

                    - `Suspected` — отказ узла подозревается;
                    - `FallbackAlive` — узел пишет heartbeat через API Kubernetes. Например, ACL или межсетевой экран блокирует сеть между узлами, но API узлу доступен;
                    - `Proven` — отказ доказан. Контроллер доказывает отказ одним из двух способов:
                      - аттестация: свидетель подтвердил остановку узла, и после того, как контроллер увидел аттестацию, прошло время `watchdog.timeout` + `watchdog.margin` из профиля. После аттестации узел не писал heartbeat;
                      - молчание узла: после последнего признака жизни узла прошло время `controlPlaneLostAfter` + 0.2s + `watchdog.timeout` + `watchdog.margin` + 0.9s из профиля. Последний признак жизни — более поздний из двух моментов: когда контроллер впервые увидел объект и когда он увидел последний heartbeat, плюс `heartbeat.interval`.

                      Пока условие `Fencing` у Node не `True`, контроллер не записывает `Proven`, и объект остаётся в фазе `Suspected`;
                    - `Unproven` — отказ входит в коррелированный отказ и не имеет аттестации. Текущая версия контроллера эту фазу не выставляет;
                    - `Queued` — эвакуация ждёт. Причину указывает условие `Queued`. Текущая версия контроллера эту фазу не использует;
                    - `Evicting` — на узле стоит taint `node.kubernetes.io/out-of-service`, эвакуация идёт. Если эвакуация не завершилась за 60 секунд, причину указывает условие `Progressing`;
                    - `Evicted` — эвакуация завершена: контроллер удалил поды узла, и у узла не осталось объектов `VolumeAttachment`.

                    Контроллер записывает `Evicted` до того, как удаляет Node или Machine узла, который заменяет облако. Удаление Node удаляет и этот объект. Если запись `Evicted` не прошла, контроллер не удаляет ни Node, ни Machine. Если удаление не прошло, контроллер повторяет его в фазе `Evicted`.

                    Объект с `armed: false` никогда не получает фазу `Proven`. Он остаётся в фазе `Suspected` или `FallbackAlive`, и taint на узел не ставится.

                    Пустая фаза означает, что контроллер ещё не обработал объект. Считайте её фазой `Suspected`.

                    Ошибка — не фаза. Контроллер сообщает об ошибке в `conditions` и сохраняет фазу.
                correlation:
                  description: |
                    Корреляция инцидента с инцидентами других узлов. Текущая версия контроллера эту секцию не записывает.
                  properties:
                    episode:
                      description: |
                        Идентификатор эпизода коррелированных отказов, в который входит этот инцидент.
                conditions:
                  description: |
                    Условия инцидента. Условие не заменяет фазу, поэтому контроллер может сообщить об одной и той же проблеме в любой фазе.

                    Условие `ConfigurationError` со статусом `True` и причиной `ProfileUnavailable` контроллер выставляет, пока не может прочитать нужные ему тайминги из профиля SLA, указанного в `spec.profileRef.name`. Причину указывает `message` условия. В этом состоянии узел не эвакуируется. Статус `False` с причиной `ProfileResolved` означает, что контроллер нашёл профиль. Инциденту с `armed: false` профиль не нужен, у него тоже этот статус.

                    Условие `Queued` со статусом `True` указывает, почему эвакуация ждёт в фазе `Queued`. Причины — `ConcurrencyLimit` и `MassFailure`. Текущая версия контроллера это условие не использует.

                    Условие `Progressing` со статусом `False` контроллер выставляет, когда эвакуация в фазе `Evicting` не завершилась за 60 секунд. Контроллер продолжает проверять узел. Значение `reason` указывает, что мешает эвакуации сейчас, а `message` — подробности:

                    - `VolumesAttached` — у узла остались объекты `VolumeAttachment`, поэтому тома его подов недоступны другим узлам. Их имена указывает `message`;
                    - `PodsRemaining` — контроллер не смог удалить поды узла или эвакуации мешает другая ошибка API. Поды и ошибки указывает `message`;
                    - `TooManyUnhealthyMachines` — контроллер не удаляет Node облачной машины CAPI, так как MachineHealthCheck сейчас не заменит машину: нездоровы более 50 % машин или у кластера нет MachineHealthCheck, который показывает свои машины. Числа указывает `message`.

                    Когда эвакуация завершена, фаза становится `Evicted`, и контроллер снимает условие `Progressing`.
                  items:
                    properties:
                      type:
                        description: |
                          Тип условия.
                      status:
                        description: |
                          Статус условия.
                      observedGeneration:
                        description: |
                          Поколение ресурса, для которого было установлено условие.
                      lastTransitionTime:
                        description: |
                          Время последнего изменения статуса условия.
                      reason:
                        description: |
                          Машиночитаемая причина последнего изменения.
                      message:
                        description: |
                          Описание последнего изменения в свободной форме.
