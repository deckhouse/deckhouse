spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Просит kubelet запустить под мимо планировщика на узлах, которые выбирает объект.

            kubelet запускает такой под из манифеста на диске, поэтому под работает до того, как отвечает API-сервер, и до того, как поднялся CNI — именно это нужно поду, который сам стоит на пути скачивания любого образа. node-controller компилирует объект в `spec.staticPods` NodeConfig каждого подходящего узла и сообщает обратно, что эти узлы с ним сделали.

            Объект несёт только манифест. Узел готовит поду две вещи — образ в containerd и файл на диске — и ничего не знает о том, что внутри: сертификаты под выпускает себе сам, kubeconfig берёт узловой, каталоги состояния монтирует через `hostPath` с `DirectoryOrCreate`.

            Тот, кто может создать такой объект, запускает произвольный манифест root'ом на каждом выбранном узле. Права на создание по умолчанию есть только у платформы.
          properties:
            spec:
              properties:
                nodeGroupSelector:
                  description: |
                    Ограничивает под узлами перечисленных NodeGroup. Если не указана ни одна группа, выбираются все NodeGroup с `systemType: Immutable`: агент узла пишет манифест из NodeConfig этого узла, а у bashible-групп NodeConfig нет.
                  properties:
                    matchNames:
                      description: |
                        Набор имён NodeGroup, на которых запускается под.
                manifest:
                  description: |
                    Полный документ Pod. Поля `metadata.name` и `metadata.namespace` должны быть непустыми; с именем этого объекта они никак не связаны — имя объекта становится именем файла манифеста на узле, а имя зеркальному поду kubelet берёт из документа, а не из файла. Подстрока `$MY_IP` при записи на диск заменяется на адрес узла, так же как в манифестах control plane.

                    Два объекта, чьи манифесты называют один под (`namespace/metadata.name`), положили бы в один NodeConfig две записи на один под, а такой документ узел отвергает целиком. Поэтому младший по времени создания отвергается здесь, с причиной `Conflict` в condition `Ready`.

                    Ограничение — 32 КиБ, девять размеров манифеста registry-агента: узел принимает не больше шестнадцати таких подов, и весь NodeConfig обязан уместиться в лимит запроса API-сервера.
            status:
              properties:
                observedGeneration:
                  description: |
                    Поколение spec, которому соответствует текущий status.
                phase:
                  description: |
                    `Ready` — под разрешился и узлы его приняли; `Degraded` — нет, причина указана в condition `Ready`: `InvalidName`, `ReservedName`, `InvalidManifest`, `Conflict`, `LimitExceeded` или `RefusedByNodes`. `InvalidName` означает, что имя самого объекта не является DNS-меткой длиной не больше 63 символов, а именно такое имя принимает поле в конфигурации узла. `ReservedName` означает, что имя объекта или под из его манифеста (пространство имён и имя) уже принадлежит манифесту, который пишет агент узла или шаг bashible. `LimitExceeded` означает, что одну из его групп узлов выбирают больше 16 статических подов, и этот, как один из самых новых, в конфигурацию узлов не попал.
                matchedNodeGroups:
                  description: |
                    NodeGroup, которым сейчас соответствует селектор.
                appliedNodes:
                  description: |
                    Сколько выбранных узлов сообщают, что манифест записан.
                failedNodes:
                  description: |
                    Сколько выбранных узлов сообщают об отказе по манифесту.
                matchedNodes:
                  description: Сколько узлов в выбранных группах.
                pendingNodes:
                  description: Сколько из этих узлов ещё не сообщили ни о применении, ни об отказе.
                failureMessage:
                  description: |
                    Что узлы говорят об отказе; берётся с одного из них.
                conditions:
                  description: |
                    Подробности о ходе выполнения.
