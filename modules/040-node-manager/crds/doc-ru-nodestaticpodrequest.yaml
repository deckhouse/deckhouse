spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Ресурс для запуска статического пода на выбранных узлах без участия планировщика.

            Kubelet запускает такой под на основе манифеста на диске, поэтому под работает до того, как отвечает API-сервер, и до того, как запущен CNI. Это позволяет использовать статический под для компонентов, от которых зависит загрузка образов контейнеров.

            Node-controller добавляет манифест в `spec.staticPods` ресурса NodeConfig каждого подходящего узла и отслеживает результаты его применения на узлах.

            Ресурс содержит только манифест пода. На узле обеспечивается наличие образа в containerd и файла манифеста на диске. Остальные необходимые ресурсы под должен получать самостоятельно. Например, сертификаты выпускаются самим подом, kubeconfig — использоваться с узла, а каталоги для хранения состояния — монтироваться через `hostPath` с типом `DirectoryOrCreate`.

            Пользователь с правами на создание NodeStaticPodRequest может запускать произвольные манифесты с правами `root` на всех выбранных узлах. По умолчанию права на создание таких ресурсов есть только у Deckhouse Platform.
          properties:
            spec:
              properties:
                nodeGroupSelector:
                  description: |
                    Ограничивает под узлами перечисленных NodeGroup.

                    Если не указана ни одна группа, выбираются все NodeGroup с `systemType: Immutable`. Для таких групп агент узла записывает манифест из NodeConfig соответствующего узла. NodeGroup, использующие bashible, не выбираются, поскольку для них NodeConfig не используется.
                  properties:
                    matchNames:
                      description: |
                        Набор имён NodeGroup, на которых запускается под.
                manifest:
                  description: |
                    Полный манифест пода.

                    Поля `metadata.name` и `metadata.namespace` не должны быть пустыми и не зависят от имени ресурса NodeStaticPodRequest. Имя ресурса используется как имя файла манифеста на узле, а имя зеркального пода kubelet определяет по манифесту.

                    При записи манифеста на диск подстрока `$MY_IP` заменяется на IP-адрес узла, так же как в манифестах компонентов control plane.

                    Несколько ресурсов NodeStaticPodRequest не могут определять под с одинаковыми `metadata.namespace` и `metadata.name`. При обнаружении конфликта ресурс, созданный позднее, отклоняется. В состоянии `Ready` для него указывается причина `Conflict`. Таким образом, выбор применяемого манифеста не зависит от порядка записей в NodeConfig.

                    Максимальный размер манифеста — 32 КиБ. На одном узле может быть запущено не более 16 статических подов, определённых с помощью NodeStaticPodRequest. Итоговый NodeConfig не должен превышать ограничение API-сервера на размер запроса.
            status:
              properties:
                observedGeneration:
                  description: |
                    Поколение `spec`, которому соответствует текущий `status`.
                phase:
                  description: |
                    Текущая фаза применения статического пода.

                    Возможные значения:

                    - `Ready` — манифест успешно обработан и принят выбранными узлами;
                    - `Degraded` — манифест не может быть применён. Причина указывается в состоянии `Ready`: `InvalidName`, `ReservedName`, `InvalidManifest`, `Conflict`, `LimitExceeded` или `RefusedByNodes`.

                    `InvalidName` означает, что имя ресурса NodeStaticPodRequest не соответствует формату DNS-метки длиной не более 63 символов, необходимому для использования имени в конфигурации узла.

                    `ReservedName` означает, что имя ресурса NodeStaticPodRequest или сочетание `metadata.namespace` и `metadata.name` пода из манифеста уже используется манифестом, создаваемым агентом узла или шагом bashible.

                    `LimitExceeded` означает, что хотя бы для одной из выбранных NodeGroup превышен лимит в 16 статических подов. В этом случае данный ресурс, как один из созданных позднее, не добавляется в конфигурацию узлов.
                matchedNodeGroups:
                  description: |
                    NodeGroup, соответствующие текущему селектору.
                appliedNodes:
                  description: |
                    Количество выбранных узлов, которые сообщили об успешной записи манифеста.
                failedNodes:
                  description: |
                    Количество выбранных узлов, которые сообщили об отказе применить манифест.
                matchedNodes:
                  description: Количество узлов в выбранных группах.
                pendingNodes:
                  description: Количество выбранных узлов, которые ещё не сообщили ни об успешном применении манифеста, ни об отказе.
                failureMessage:
                  description: |
                    Сообщение об ошибке, полученное от одного из узлов, на которых не удалось применить манифест.
                conditions:
                  description: |
                    Подробная информация о состоянии применения статического пода.
