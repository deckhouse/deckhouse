spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Запрос на запуск статического пода на выбранных узлах без участия планировщика.

            `node-manager` добавляет манифест в `spec.staticPods` объекта NodeConfig каждого выбранного узла. Узел записывает манифест на диск, а kubelet запускает по нему под. Запрос сообщает, записали ли узлы манифест, но не сообщает, работает ли под.

            Пользователь с правами на создание NodeStaticPodRequest может запускать произвольные манифесты с правами `root` на всех выбранных узлах.
          properties:
            spec:
              properties:
                nodeGroupSelector:
                  description: |
                    Ограничивает под узлами перечисленных NodeGroup.

                    Если не указана ни одна группа, выбираются все NodeGroup. Агент узла записывает манифест из NodeConfig каждого выбранного узла. На узлах, которыми управляет bashible, ресурс с именем `registry-agent` или с подом `kube-system/registry-agent` не применяется: этот манифест записывает сам bashible. Если ресурс не попадает ни на один другой узел, в состоянии `Ready` указывается причина `ServedByBashible`.
                  properties:
                    matchNames:
                      description: |
                        Набор имён NodeGroup, на которых запускается под.
                manifest:
                  description: |
                    Полный манифест пода.

                    Требования к манифесту:

                    - `metadata.name` — DNS-поддомен (RFC 1123), `metadata.namespace` — DNS-метка (RFC 1123).
                    - Неймспейс — `kube-system` или начинается с `d8-`.
                    - Поле `spec.nodeName` не задано.
                    - Под не ссылается на объекты API. Не допускаются `spec.serviceAccountName`, тома типов `secret`, `configMap`, `persistentVolumeClaim` и `projected`, а также `envFrom` и `env[].valueFrom` с `secretKeyRef` или `configMapKeyRef` в контейнерах и init-контейнерах.

                    Манифест, который не отвечает этим требованиям, отклоняется при создании и изменении запроса.

                    При записи манифеста на диск подстрока `$MY_IP` заменяется на IP-адрес узла.

                    Максимальный размер манифеста — 32 КиБ. На одном узле может быть запущено не более 16 статических подов, определённых с помощью NodeStaticPodRequest.
            status:
              properties:
                observedGeneration:
                  description: |
                    Поколение `spec`, которому соответствует текущий `status`.
                phase:
                  description: |
                    Сводка по условиям.

                    - `Pending` — выбранные узлы ещё записывают манифест (у условия `Ready` причина `RolloutInProgress`).
                    - `Ready` — условие `Ready` равно `True`.
                    - `Degraded` — `node-manager` не принял запрос (условие `Accepted` равно `False`) или узлы отклонили манифест (у условия `Ready` причина `RefusedByNodes`).
                matchedNodeGroups:
                  description: |
                    NodeGroup, соответствующие текущему селектору.
                appliedNodes:
                  description: |
                    Количество выбранных узлов, которые сообщили о записи текущего манифеста.
                failedNodes:
                  description: |
                    Количество выбранных узлов, которые отклонили манифест.
                matchedNodes:
                  description: Количество узлов в выбранных группах, на которые манифест записывает агент узла. Узлы NodeGroup, на которых манифест записывает сам bashible, не учитываются.
                pendingNodes:
                  description: Количество выбранных узлов, которые ещё не сообщили ни о записи текущего манифеста, ни об отказе.
                nodes:
                  description: |
                    Выбранные узлы, которые ещё не записали текущий манифест, не больше 32.
                  items:
                    properties:
                      name:
                        description: |
                          Имя узла.
                      state:
                        description: |
                          `Failed`, если узел отклонил манифест, или `Pending`, если узел ещё не ответил.
                      message:
                        description: |
                          Причина отказа или то, чего ждёт узел.
                conditions:
                  description: |
                    Условия запроса: `Accepted` и `Ready`.

                    `Accepted` показывает, принял ли `node-manager` запрос. Условие равно `True` с причиной `Accepted` или `False` с одной из причин:

                    - `InvalidName` — имя запроса не является DNS-меткой (RFC 1123) длиной не более 63 символов.
                    - `ReservedName` — имя запроса или сочетание `metadata.namespace` и `metadata.name` пода уже занято статическим подом платформы.
                    - `InvalidManifest` — манифест не отвечает требованиям из описания `spec.manifest`.
                    - `Conflict` — более ранний запрос уже определяет под с теми же `metadata.namespace` и `metadata.name`.
                    - `LimitExceeded` — хотя бы у одной выбранной NodeGroup уже есть 16 статических подов из более ранних запросов. Манифест получают только узлы остальных выбранных NodeGroup.

                    `Ready` показывает, записали ли выбранные узлы текущий манифест:

                    - `True` с причиной `AllNodesApplied` — записали все выбранные узлы.
                    - `True` с причиной `NoNodesSelected` — селектор не выбирает ни одной существующей NodeGroup или в выбранных NodeGroup нет узлов.
                    - `True` с причиной `ServedByBashible` — выбранными NodeGroup управляет bashible, и манифест `registry-agent` на их узлах он записывает сам.
                    - `False` с причиной `RolloutInProgress` — часть выбранных узлов ещё не записала текущий манифест.
                    - `False` с причиной `RefusedByNodes` — хотя бы один узел отклонил манифест.
                    - `False` с причиной `NotAccepted` — условие `Accepted` равно `False`.
