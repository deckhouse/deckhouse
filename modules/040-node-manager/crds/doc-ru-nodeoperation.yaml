spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает операцию над узлом, которая прерывает его работу.

            `spec` существующей операции изменить нельзя, кроме `.spec.approved`. Чтобы одобрить операцию `Disruption`, выполните:

            ```shell
            d8 k patch nodeoperation <OPERATION_NAME> --type=merge -p '{"spec":{"approved":true}}'
            ```

            В команде замените `<OPERATION_NAME>` на имя операции.

            Операции для удаляемой машины Cluster API несут метку `node-manager.deckhouse.io/machine-uid`. Ставить её может только `node-manager`.
          properties:
            spec:
              properties:
                type:
                  description: |
                    Операция, выполняемая над узлом.

                    * `Reboot` — перезагрузить узел. Эту операцию выполняют только узлы NodeGroup с `systemType: Immutable`. Узел, которым управляет bashible, отказывается её выполнять, и операция завершается неудачей с причиной `NodeRefused`.
                    * `Drain` — вытеснить рабочую нагрузку с узла. Узел остаётся недоступным для планировщика, пока оператор снова не сделает его доступным. `node-manager` также создаёт `Drain` для узла удаляемой машины Cluster API. Имя машины указано в `.spec.cause`.

                      Чтобы отменить выполняющийся `Drain`, удалите его. `node-manager` снимает с узла запрос на вытеснение до того, как объект будет удалён. Если вытеснение уже сделало узел недоступным для планировщика, таким он и останется: верните его в планировщик сами.
                    * `Disruption` — прервать работу узла, чтобы он мог применить новую конфигурацию.

                    Операции `Disruption` создаёт `node-manager`. Запрос на ручное создание такой операции отклоняется. Операции `Reboot` и `Drain` предназначены для оператора.
                nodeName:
                  description: |
                    Имя узла, к которому относится операция.
                configGeneration:
                  description: |
                    Ревизия NodeConfig узла, ради которой прерывается его работа (`.metadata.generation` объекта NodeConfig).

                    Допускается только для `Disruption`. Для остальных типов API-сервер отклоняет это поле. Если NodeConfig перешёл на более новое поколение до одобрения операции, `node-manager` удаляет операцию.
                nodeConfigUID:
                  description: |
                    Объект NodeConfig, ради которого прерывается работа узла (`.metadata.uid` объекта NodeConfig узла).

                    Имеет смысл только для `Disruption`. Остальные типы поле не читают.
                approved:
                  description: |
                    Можно ли прервать работу узла. Если поле не задано, операция не одобрена.

                    Имеет смысл только для `Disruption`. `Reboot` и `Drain` поле не читают.

                    В режиме одобрения `Manual` группы узлов (`spec.disruptions.approvalMode`) `node-manager` ставит `false`, а `true` ставит оператор. В остальных режимах `node-manager` ставит `true` при создании. Отозвать одобрение нельзя.
                drain:
                  description: |
                    Как вытеснять рабочую нагрузку с узла перед тем, как прервать его работу.

                    Допускается для `Reboot` и `Disruption`. Для `Drain` API-сервер отклоняет это поле.
                  properties:
                    skip:
                      description: |
                        Прервать работу узла, не вытесняя с него рабочую нагрузку.

                        Создавая операцию `Disruption`, `node-manager` ставит значение `true` для следующих узлов:

                        - единственного узла группы `master`;
                        - узла с подом Deckhouse, пока в его группе меньше двух узлов в статусе `Ready`;
                        - каждого узла NodeGroup с `spec.disruptions.automatic.drainBeforeApproval: false`.
                cause:
                  description: |
                    Причина, по которой прерывается работа узла.

                    Для `Disruption` поле заполняет `node-manager` при создании операции. Для `Reboot` и `Drain` поле может задать оператор.
            status:
              properties:
                phase:
                  description: |
                    Текущая фаза операции. Фазу ставит `node-manager`.

                    * `Pending` — операция стоит в очереди или ждёт одобрения.
                    * `Approved` — операцию можно выполнять. С узла вытесняется нагрузка, и только после этого узел получит операцию.
                    * `InProgress` — для операции `Drain` с узла вытесняется нагрузка. Для остальных типов узел подготовлен и может выполнять операцию.
                    * `Completed` — операция прошла успешно.
                    * `Failed` — операция завершилась неудачно.
                reason:
                  description: |
                    Причина текущей фазы операции.

                    * `Pending` — `Queued` (ещё ничего не сделано), `WaitingForApproval`.
                    * `Approved` — `Draining` (с узла вытесняется нагрузка), `WaitingForOperation` (с узла уже идёт другое вытеснение, и в `message` указано, кто его запросил).
                    * `InProgress` — `Draining` и `WaitingForOperation` (для `Drain`), `WaitingForNode` (операция передана узлу, и он ещё не сообщил результат), `Rebooting` (узел перезагружается и ещё не вернулся).
                    * `Completed` — `Succeeded`, `Released` (узел отказался от ревизии NodeConfig, для которой создана операция `Disruption`), `Drained` (для `Drain`).
                    * `Failed` — `NodeFailed` и `NodeRefused` (сообщает узел), `PreparationTimedOut` (нагрузка не покинула узел вовремя), `NodeTimedOut` (узел не отчитался или не вернулся после перезагрузки вовремя), `NodeNotFound`, `NodeGroupMissing`, `MachineDeleted` (машина узла удаляется).
                message:
                  description: |
                    Пояснение к `reason` для человека.
                deadline:
                  description: |
                    Момент, когда истекает текущий этап операции и она завершается неудачей.

                    Узлу даётся 30 минут с момента `startedAt`, чтобы сообщить результат или вернуться после перезагрузки. На вытеснение даётся время из параметра `nodeDrainTimeoutSecond` группы узлов плюс 30 минут.
                startedAt:
                  description: |
                    Момент передачи операции узлу.
                    
                    От него отсчитывается ожидание ответа узла.
                finishedAt:
                  description: |
                    Момент перехода операции в финальную фазу.
                    
                    Завершённая операция хранится как запись о том, что было сделано с узлом, и удаляется через сутки после завершения.
                bootID:
                  description: |
                    Идентификатор загрузки узла (`status.nodeInfo.bootID` объекта Node) в момент начала перезагрузки.
                nodeWasUnschedulable:
                  description: |
                    Был ли узел уже недоступен для планировщика в момент, когда операция до него дошла.

                    По завершении операции узлу возвращается именно это значение, а не «доступен» — чтобы операция без уведомления не отменила cordon, установленный оператором вручную.
                drainDeadline:
                  description: |
                    Момент, к которому должен завершиться drain, запрошенный этой операцией.

                    У операции `Drain` удаляемой машины в этот момент операция завершается с причиной `PreparationTimedOut`, и машина удаляется вместе с подами, которые не покинули узел. Для NodeGroup типа `Static` или `CloudStatic` без `nodeDrainTimeoutSecond` поле не задаётся, и время такой операции не ограничено.

                    Значение фиксируется в момент запроса: берётся `nodeDrainTimeoutSecond` группы, каким он был тогда, — именно с этой границей начал работать контроллер drain. Если вычислять границу заново, изменение NodeGroup оборвёт уже идущий drain.
                eviction:
                  description: |
                    Ход вытеснения, запрошенного этой операцией. Пишет `node-manager`, пока вытеснение идёт.

                    Поле появляется, когда составлен список подов для вытеснения, и обновляется раз в несколько секунд. Когда вытеснение завершается, поле удаляется. Операция, завершившаяся ошибкой, сохраняет значение, на котором остановилась.
                  properties:
                    remainingPods:
                      description: |
                        Сколько подов из списка вытеснения ещё остаётся на узле, включая завершающиеся. Поды DaemonSet, статические и завершившиеся поды вытеснение оставляет на узле, они не учитываются.
                    terminatingPods:
                      description: |
                        Поды, которые уже вытеснены, но ещё не остановились, в виде `<namespace>/<name>`.
                conditions:
                  description: |
                    Подробности о ходе выполнения операции:

                    * `Drained` — пишет `node-manager`. Пока нагрузку вытесняют с узла, условие имеет статус `False` с причиной `Draining`. Когда нагрузка покинула узел, условие получает статус `True` с причиной `Drained`. Если операция пропускает вытеснение, условие получает статус `True` с причиной `DrainSkipped`.
                    * `EvictionBlocked` — пишет `node-manager`, пока вытеснение нагрузки отклоняется, например из-за PodDisruptionBudget. Условие имеет статус `True` с причиной `EvictionRefused`, а в его `message` перечислены отказы в том виде, в каком их возвращает вытеснение, по одному на под. Тот же текст попадает в `message` операции. Условие снимается, когда отказы прекращаются или вытеснение завершается. Завершённая операция сохраняет отказы, на которых закончилась.
                    * `NodeReported` — пишет узел. Условие получает статус `True` с причиной `Succeeded`, `Released`, `Failed`, `Refused` или `RebootStarted`.
                    * `Retry` — пишет `node-manager` в операцию `Disruption`, завершившуюся ошибкой. Условие показывает, будет ли `node-manager` пробовать ещё раз для той же ревизии NodeConfig.

                    Причины условия `Retry`:

                    * `Created` (`True`) — следующая попытка уже создана, её имя указано в `message`.
                    * `Scheduled` (`True`) — `node-manager` создаст следующую попытку в момент, указанный в `message`.
                    * `AttemptsExhausted` (`False`) — 3 попытки для той же ревизии завершились ошибкой. `node-manager` не создаёт новых попыток, пока не изменится NodeConfig или не будет удалена самая старая неудачная попытка.
                    * `Superseded` (`False`) — NodeConfig перешёл на другое поколение или был пересоздан.
                    * `NotRequested` (`False`) — узел больше не просит прервать его работу для этой ревизии.
