spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает операцию над узлом, прерывающую его работу: перезагрузку, drain рабочей нагрузки или разрешение, которое нужно узлу, чтобы применить конфигурацию, применение которой требует паузы.

            Операция — это запись о намерении, а не переключатель: она создаётся один раз, проводится node-manager и агентом на узле через свои фазы и остаётся после завершения историей того, что с узлом делали и почему. Изменение spec существующей операции отклоняется — создайте новую.

            Через операции координируются disruptive-действия на узлах NodeGroup с `systemType: Immutable`; этот же ресурс доступен оператору, которому нужно вручную перезагрузить узел или выполнить на нём drain.
          properties:
            spec:
              properties:
                type:
                  description: |
                    Операция, выполняемая над узлом:

                    * `Reboot` — перезагрузить узел;
                    * `Drain` — выполнить drain узла и оставить его недоступным для планировщика. Операция завершается, как только нагрузка ушла; узел остаётся вне планировщика, пока его не вернёт оператор;
                    * `ApproveDisruption` — разрешить узлу применить конфигурацию, применение которой прерывает его работу (перезапуск kubelet или container runtime, пересборка оверлея системных расширений, смена образа системы).

                    Операцию `ApproveDisruption` обычно создаёт node-manager в ответ на запрос узла; остальные две предназначены для оператора.
                nodeName:
                  description: |
                    Имя узла, к которому относится операция.
                configGeneration:
                  description: |
                    Ревизия NodeConfig узла, на которую выдаётся разрешение (`.metadata.generation` объекта NodeConfig).

                    Разрешение намеренно узкое: оно санкционирует disruption, необходимый одной конкретной конфигурации, поэтому опубликованная следом конфигурация запросит разрешение заново. Имеет смысл только для `ApproveDisruption`.
                drain:
                  description: |
                    Как убирать рабочую нагрузку с узла перед тем, как прервать его работу.

                    Drain выполняет отдельная операция типа `Drain`, которую эта операция создаёт для себя и которой владеет: за такой операцией можно наблюдать, как за любой другой, и удаляется она вместе с родительской.
                  properties:
                    skip:
                      description: |
                        Прервать работу узла, не выполняя drain.

                        Нагрузка в этом случае прерывается вместе с узлом, а не переносится, поэтому параметр предназначен для узлов, поды которых переносить нельзя: группа из одного узла или узел с единственной репликой чего-то непереносимого.
            status:
              properties:
                phase:
                  description: |
                    Текущая фаза операции:

                    * `Pending` — операция поставлена в очередь, node-manager ещё не начал её выполнять;
                    * `InProgress` — узел подготовлен (drain выполнен, если не был пропущен) и выполняет операцию;
                    * `Completed` — операция прошла успешно;
                    * `Failed` — операция завершилась неудачно. За подробностями обратитесь к полю `conditions` и событиям.
                observedGeneration:
                  description: |
                    Поколение spec, которому соответствует текущий status.
                startedAt:
                  description: |
                    Момент передачи операции узлу. От него отсчитывается ожидание ответа узла.
                finishedAt:
                  description: |
                    Момент перехода операции в финальную фазу. Завершённая операция хранится как запись
                    о том, что было сделано с узлом, и удаляется через сутки после завершения.
                nodeWasUnschedulable:
                  description: |
                    Был ли узел уже недоступен для планировщика в момент, когда операция до него дошла.

                    По завершении операции узлу возвращается именно это значение, а не «доступен» — чтобы операция молча не отменила cordon, поставленный оператором вручную.
                drainDeadline:
                  description: |
                    Момент, к которому должен завершиться drain, запрошенный этой операцией.

                    Значение фиксируется в момент запроса: берётся `nodeDrainTimeoutSecond` группы, каким он был тогда, — именно с этой границей начал работать контроллер drain. Если вычислять границу заново, изменение NodeGroup оборвёт уже идущий drain.
                conditions:
                  description: |
                    Подробности о ходе выполнения операции.
