apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fencingslaprofiles.node-manager.deckhouse.io
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            SLA-профиль fencing. Профиль — это именованный переиспользуемый набор timing-параметров, которые определяют, как быстро обнаруживается отказавший узел, как долго свежий fallback heartbeat защищает узел от ложной эвакуации, сколько контроллер ждёт перед удалением подов и как ведёт себя watchdog.

            Профили являются cluster-scoped конфигурационными объектами. Они не содержат runtime-состояния, поэтому у ресурса нет `status` и нет status-субресурса.

            Встроенные профили `critical`, `medium`, `moderate` и `slow` поставляются модулем `node-manager`. Допускается использовать только встроенные профили.
            В API имена профилей указываются с заглавной буквы (`Critical`, `Medium`, `Moderate`, `Slow`), а сами объекты называются в нижнем регистре, так как имя объекта Kubernetes не может содержать заглавные буквы. Ссылка резолвится приведением к нижнему регистру.
          properties:
            spec:
              description: |
                Timing-параметры профиля.
              properties:
                reactionGoal:
                  description: |
                    Целевое полное время реакции в человекочитаемом виде, например `2-3s` или `30s`. Используется только для документации и printer columns и не парсится как duration.
                detectionWindowTarget:
                  description: |
                    Целевое окно memberlist detection в человекочитаемом виде, например `0.8-1.2s`. Используется для документации и проверки расчётов и не парсится как duration.
                memberlist:
                  description: |
                    Параметры memberlist и Lifeguard, управляющие probe-опросом peer-узлов, suspicion и gossip. Остальные тайминги memberlist (TCP-таймаут, интервал push/pull, время reclaim, таймаут ухода) агент выводит из этого профиля.
                  properties:
                    probeInterval:
                      description: |
                        Как часто активно опрашиваются peer-узлы. Меньше интервал — быстрее detection, но линейно выше probe-трафик.
                    probeTimeout:
                      description: |
                        Сколько ждать ответа на probe. Должен быть меньше `probeInterval` и выше p99 RTT сети.
                    suspicionMult:
                      description: |
                        Множитель окна suspicion Lifeguard/memberlist перед тем, как peer будет помечен как dead.
                    suspicionMaxTimeoutMult:
                      description: |
                        Верхняя граница таймера suspicion при недостатке подтверждений.
                    indirectChecks:
                      description: |
                        Количество indirect-проверок при сомнениях в прямой связности с peer.
                    awarenessMaxMultiplier:
                      description: |
                        Максимальное замедление probe interval для локально деградировавшего агента (Lifeguard awareness).
                    gossipInterval:
                      description: |
                        Интервал распространения gossip-событий. Вместе с `retransmitMult` задаёт, сколько останавливающийся агент ждёт отправки сообщения о своём уходе: `min(max(2 * retransmitMult * gossipInterval, 250ms), 4s)`.
                    retransmitMult:
                      description: |
                        Множитель retransmit для gossip broadcast: `retransmitMult * ceil(log10(N + 1))`. Вместе с `gossipInterval` задаёт, сколько останавливающийся агент ждёт отправки сообщения о своём уходе: `min(max(2 * retransmitMult * gossipInterval, 250ms), 4s)`.
                    gossipToTheDeadTime:
                      description: |
                        Сколько времени dead-узел ещё получает gossip, что даёт ему шанс refute после восстановления. Агент также выводит из этого значения два тайминга memberlist: интервал полного обмена состоянием (push/pull) `max(gossipToTheDeadTime, 2 * TCP-таймаут)`, где TCP-таймаут равен `max(fallback.kubernetesAPITimeout, 1s)` (в группах больше 32 узлов memberlist дополнительно увеличивает этот интервал), и время reclaim, равное этому значению, — после него пиры принимают dead-узел, вернувшийся под тем же именем с новым адресом. Меньше значение — быстрее выравниваются разошедшиеся картины и принимается новый адрес, но больше трафика push/pull.
                fallback:
                  description: |
                    Параметры fallback heartbeat узла, который потерял gossip quorum, но всё ещё видит API Kubernetes.
                  properties:
                    heartbeat:
                      description: |
                        Как часто изолированный узел, который всё ещё видит API Kubernetes, записывает fallback heartbeat. Должен быть заметно меньше `ttl` и не меньше `1ms`.
                    ttl:
                      description: |
                        Окно свежести fallback heartbeat. Пока последний heartbeat не старше этого TTL, эвакуация запрещена.
                    kubernetesAPITimeout:
                      description: |
                        Timeout каждого запроса агента к объектам `FencingFailedNodeState`, в том числе записи fallback heartbeat (она же проверка API в fallback-пути), и каждой из двух фаз чтения Node в попытке join или rejoin: сначала своей Node, затем до трёх Node-кандидатов параллельно. Также задаёт TCP-таймаут memberlist `max(kubernetesAPITimeout, 1s)`, который ограничивает каждый join и push/pull. Должен быть меньше `ttl`, чтобы проверка API не блокировала решение.
                rejoin:
                  description: |
                    Параметры попыток join агента: стартового join и rejoin loop, который работает, пока у узла нет gossip quorum или пока существует созданный после старта агента `FencingFailedNodeState`, в котором этот узел записан отказавшим. Попытка читает из API Kubernetes свою Node, затем до трёх Node-кандидатов и выполняет по одному `memberlist.Join` на каждый проверенный seed параллельно. Каждая неудачная попытка удваивает задержку перед следующей, от `interval` до `maxInterval`; в rejoin loop задержку так же удваивает и успешная попытка, после которой у узла по-прежнему нет gossip quorum или такой `FencingFailedNodeState` по-прежнему существует.
                  properties:
                    interval:
                      description: |
                        Начальная задержка между попытками join и rejoin. Backoff сбрасывается к этому значению, только когда у узла есть gossip quorum и нет собственной failed-записи. Также начальная задержка повторов записей агента в `FencingFailedNodeState`.
                    maxInterval:
                      description: |
                        Верхняя граница exponential backoff между попытками join и rejoin. Должна быть больше или равна `interval`. Время между началами двух попыток включает и саму попытку: до `fallback.kubernetesAPITimeout` на каждое из двух чтений Node и около одного–двух TCP-таймаутов memberlist на join. Также шаг передачи роли: после него следующий по очереди агент записывает отказавший пир, которого не записал designated writer. Столько же собственная failed-запись узла, созданная пиром, должна продержаться без перерыва и под одним UID, прежде чем writer агента встанет на паузу; пока пиры снимают эту запись раньше этого срока и пересоздают её, пауза не начинается.
                evacuation:
                  description: |
                    Параметры эвакуации, используемые контроллером fencing.
                  properties:
                    delay:
                      description: |
                        Задержка перед удалением подов после fast-path отказа, отсчитывается от `status.failed.detectedAt`.
                watchdog:
                  description: |
                    Параметры watchdog, используемые как safety-net на узле.
                  properties:
                    feedInterval:
                      description: |
                        Как часто кормится watchdog и перепроверяется quorum/fallback. Должен быть меньше `timeout`, обычно 1/4–1/10 от него.
                    timeout:
                      description: |
                        Время до срабатывания watchdog panic после прекращения кормления.
