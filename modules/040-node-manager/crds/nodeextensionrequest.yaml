apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeextensionrequests.deckhouse.io
  labels:
    heritage: deckhouse
    module: node-manager
spec:
  group: deckhouse.io
  scope: Cluster
  names:
    plural: nodeextensionrequests
    singular: nodeextensionrequest
    kind: NodeExtensionRequest
    shortNames:
      - ner
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Kind
          jsonPath: .spec.extension.kind
          type: string
        - name: Phase
          jsonPath: .status.phase
          type: string
        - name: Matched
          jsonPath: .status.matchedNodes
          type: integer
        - name: Applied
          jsonPath: .status.appliedNodes
          type: integer
        - name: Failed
          jsonPath: .status.failedNodes
          type: integer
        - name: Age
          jsonPath: .metadata.creationTimestamp
          type: date
      schema:
        openAPIV3Schema:
          type: object
          description: |
            Request to install an extension on the selected nodes: a system extension (a sysext image, optionally with kernel modules) or a registry package.

            The requester sets the kind in `spec.extension.kind`. A registry package (`Package`) is installed on the selected nodes that bashible configures. A system extension (`SystemExtension`) is installed on the selected Deckhouse Engine nodes. The kind is never inferred from the image. If none of the selected groups installs extensions of this kind, the `Ready` condition reports the `NotDeliverable` reason.

            The image is addressed the same way as any package in the registry-packages-proxy: a name, a digest, and an optional repository and path. node-controller copies these fields unchanged into `spec.extensions` of the NodeConfig, and the node agent installs the extension. node-controller does not look up the image by module or ModuleSource.
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - extension
              properties:
                extension:
                  type: object
                  required:
                    - name
                    - digest
                    - kind
                  description: |
                    Image to install and its kind. The image is addressed the same way as any package in the registry-packages-proxy.
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 63
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      description: |
                        Extension name. It is copied unchanged into the extension name in `spec.extensions` of the NodeConfig.

                        A system extension is checked against the extension-release file in the image and installed as `<name>.raw`. A registry package is recorded under `/var/cache/registrypackages/<name>`.

                        The names `containerd`, `kubelet`, `kubernetes-cni` and `nodelet` are reserved.
                    digest:
                      type: string
                      pattern: '^sha256:[a-f0-9]{64}$'
                      description: |
                        Image manifest digest.
                    kind:
                      type: string
                      enum: ["Package", "SystemExtension"]
                      description: |
                        Image kind.

                        - `Package`: a registry package. The node agent installs it on the selected nodes that bashible configures.
                        - `SystemExtension`: a system extension. The node agent merges it on the selected Deckhouse Engine nodes.

                        Nodes of groups of the other type do not receive the image. If none of the selected groups installs extensions of this kind, the `Ready` condition reports the `NotDeliverable` reason.

                        Cannot be changed after creation. To change the kind, delete the request and create it again.
                    repository:
                      type: string
                      description: |
                        The key the registry-packages-proxy resolves credentials by (its `--rpp-repository`), for example a ModuleSource's `spec.registry.repo`. Left empty, the image is pulled from the cluster's main registry.
                    path:
                      type: string
                      description: |
                        The image's path within the repository (the proxy's `--rpp-path`). Left empty, the repository root is used.
                nodeGroupSelector:
                  type: object
                  description: |
                    Narrows the extension to nodes of the named NodeGroups.
                  properties:
                    matchNames:
                      type: array
                      items:
                        type: string
                      description: |
                        The set of NodeGroup names the extension applies to.
                nodeSelector:
                  type: object
                  description: |
                    Narrows the extension to nodes carrying the given labels.
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                      description: |
                        The set of node labels a node must carry to be selected.
                kernelModules:
                  type: array
                  description: |
                    Kernel modules to load once the system extension is merged. A registry package cannot load kernel modules, so such a request is not delivered to any node.
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                        pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
                        description: |
                          The kernel module name.
                      params:
                        type: array
                        items:
                          type: string
                        description: |
                          The module parameters, passed as `key=value` strings.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                  description: |
                    The generation of the spec this status reflects.
                phase:
                  type: string
                  enum: ["Ready", "Degraded"]
                  description: |
                    - `Ready`: the extension is delivered to the selected nodes.
                    - `Degraded`: the extension is not delivered. The `Ready` condition gives the reason.
                matchedNodeGroups:
                  type: array
                  items:
                    type: string
                  description: |
                    The selected NodeGroups whose nodes install this kind of image: Deckhouse Engine groups for a system extension, groups bashible manages for a registry package.
                appliedNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of selected nodes that report the extension installed with the digest from their NodeConfig. While a node waits for a rollout slot, its NodeConfig still carries the request's previous digest.

                    The value comes from node reports. A request can have the `Resolved` reason and still be refused by every node it is delivered to.
                failedNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of selected nodes that report the extension refused.
                matchedNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of nodes in `matchedNodeGroups` that the selectors pick.
                pendingNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of selected nodes that have reported neither the extension installed nor a refusal yet.
                failureMessage:
                  type: string
                  description: |
                    What the nodes say about the refusal, taken from one of them.
                conditions:
                  type: array
                  description: |
                    Latest details of the request's progress.

                    The `Ready` condition shows whether the extension is delivered to its nodes. The `Resolved` reason means it is. The other reasons explain why it is not: `InvalidExtension`, `ReservedName`, `Conflict`, `KernelModuleConflict`, `NotDeliverable` (no selected group installs this kind of image), and `RefusedByNodes`.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$'
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      message:
                        type: string
                        maxLength: 32768
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
