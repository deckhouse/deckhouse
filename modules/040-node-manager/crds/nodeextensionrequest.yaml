apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeextensionrequests.deckhouse.io
  labels:
    heritage: deckhouse
    module: node-manager
spec:
  group: deckhouse.io
  scope: Cluster
  names:
    plural: nodeextensionrequests
    singular: nodeextensionrequest
    kind: NodeExtensionRequest
    shortNames:
      - ner
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Kind
          jsonPath: .spec.extension.kind
          type: string
        - name: Phase
          jsonPath: .status.phase
          type: string
        - name: Matched
          jsonPath: .status.matchedNodes
          type: integer
        - name: Applied
          jsonPath: .status.appliedNodes
          type: integer
        - name: Failed
          jsonPath: .status.failedNodes
          type: integer
        - name: Age
          jsonPath: .metadata.creationTimestamp
          type: date
      schema:
        openAPIV3Schema:
          type: object
          description: |
            Request to install an extension on the selected nodes: a system extension (a sysext image, optionally with kernel modules) or a registry package.

            The requester sets the kind in `spec.extension.kind`. A registry package (`Package`) is installed on the selected nodes that bashible configures. A system extension (`SystemExtension`) is installed on the selected Deckhouse Engine nodes. The kind is never inferred from the image. If none of the selected groups installs extensions of this kind, the `Accepted` condition reports the `NotDeliverable` reason.

            The image is addressed the same way as any package in the registry-packages-proxy: a name, a digest, and an optional repository and path. node-controller copies these fields unchanged into `spec.extensions` of the NodeConfig, and the node agent installs the extension. node-controller does not look up the image by module or ModuleSource.
          x-doc-examples:
          - |
              ```yaml
              # A system extension with kernel modules, fetched from the registry of a ModuleSource.
              apiVersion: deckhouse.io/v1alpha1
              kind: NodeExtensionRequest
              metadata:
                name: drbd
              spec:
                extension:
                  name: drbd
                  digest: sha256:4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945
                  kind: SystemExtension
                  repository: registry.example.com/deckhouse/modules
                  path: drbd/extensions
                  kernelModules:
                    - name: drbd
                      params:
                        - usermode_helper=disabled
                    - name: drbd_transport_tcp
                nodeGroupSelector:
                  matchNames:
                    - worker
              ---
              # A registry package from the cluster's main registry, on the nodes of every
              # group bashible configures that carry the label.
              apiVersion: deckhouse.io/v1alpha1
              kind: NodeExtensionRequest
              metadata:
                name: nvme-cli
              spec:
                extension:
                  name: nvme-cli
                  digest: sha256:9b2a6f2bb7e3c5f6d1a0e4c8b7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8
                  kind: Package
                nodeSelector:
                  matchLabels:
                    storage.example.com/nvme: "true"
              ```
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - extension
              properties:
                extension:
                  type: object
                  required:
                    - name
                    - digest
                    - kind
                  x-kubernetes-validations:
                    - rule: self.kind == oldSelf.kind
                      message: "kind cannot be changed: delete the request and create it again"
                    - rule: self.kind == 'SystemExtension' || !has(self.kernelModules)
                      message: kernel modules load from a SystemExtension only
                  description: |
                    Image to install and its kind. The image is addressed the same way as any package in the registry-packages-proxy.
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 63
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      description: |
                        Extension name.

                        The image of a system extension must contain the extension-release file for this name.

                        The names `containerd`, `kubelet`, `kubernetes-cni`, `nodelet` and `qemu-guest-agent` belong to platform extensions and are not accepted.
                    digest:
                      type: string
                      pattern: '^sha256:[a-f0-9]{64}$'
                      description: |
                        Image manifest digest.
                    kind:
                      type: string
                      enum: ["Package", "SystemExtension"]
                      description: |
                        Image kind.

                        - `Package`: a registry package. The node agent installs it on the selected nodes that bashible configures.
                        - `SystemExtension`: a system extension. The node agent merges it on the selected Deckhouse Engine nodes.

                        Nodes of groups of the other type do not receive the image. If none of the selected groups installs extensions of this kind, the `Accepted` condition reports the `NotDeliverable` reason.

                        Cannot be changed after creation. To change the kind, delete the request and create it again.
                    repository:
                      type: string
                      maxLength: 1024
                      pattern: '^[^[:space:]]+$'
                      description: |
                        The key the registry-packages-proxy resolves credentials by (its `--rpp-repository`), for example a ModuleSource's `spec.registry.repo`. Left empty, the image is pulled from the cluster's main registry.
                    path:
                      type: string
                      maxLength: 512
                      description: |
                        The image's path within the repository (the proxy's `--rpp-path`). Left empty, the repository root is used.
                    kernelModules:
                      type: array
                      maxItems: 32
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                        - name
                      description: |
                        Kernel modules the node agent loads after merging the system extension, in the listed order. Allowed only with the `SystemExtension` kind. Each module is listed once.

                        Dependencies are not loaded automatically: list every module the extension needs, each one after the modules it depends on.

                        Adding a module interrupts each selected node: the node waits for an approved `Disruption` NodeOperation.
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                            minLength: 1
                            maxLength: 64
                            pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
                            description: |
                              Kernel module name.
                          params:
                            type: array
                            maxItems: 32
                            items:
                              type: string
                              maxLength: 256
                            description: |
                              Module parameters, passed as `key=value` strings.
                nodeGroupSelector:
                  type: object
                  description: |
                    Narrows the extension to nodes of the named NodeGroups.
                  properties:
                    matchNames:
                      type: array
                      maxItems: 64
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        maxLength: 63
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      description: |
                        The set of NodeGroup names the extension applies to.
                nodeSelector:
                  type: object
                  description: |
                    Narrows the extension to nodes carrying the given labels.
                  properties:
                    matchLabels:
                      type: object
                      maxProperties: 16
                      additionalProperties:
                        type: string
                        maxLength: 63
                      description: |
                        The set of node labels a node must carry to be selected.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                  description: |
                    The generation of the spec this status reflects.
                phase:
                  type: string
                  enum: ["Pending", "Ready", "Degraded"]
                  description: |
                    Summary of the conditions.

                    - `Pending`: The selected nodes are still installing the extension (the `Ready` condition has the `RolloutInProgress` reason).
                    - `Ready`: The `Ready` condition is `True`.
                    - `Degraded`: `node-manager` did not accept the request (the `Accepted` condition is `False`), or nodes refused the extension (the `Ready` condition has the `RefusedByNodes` reason).
                matchedNodeGroups:
                  type: array
                  items:
                    type: string
                  description: |
                    The selected NodeGroups whose nodes install this kind of image: Deckhouse Engine groups for a system extension, groups bashible manages for a registry package.
                appliedNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of selected nodes that report the extension installed at the digest of this request.
                failedNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of selected nodes that refused the extension at the request's digest.
                matchedNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of nodes in `matchedNodeGroups` that the selectors pick.
                pendingNodes:
                  type: integer
                  format: int32
                  minimum: 0
                  description: |
                    Number of selected nodes that have reported neither the extension installed at the request's digest nor a refusal yet.
                nodes:
                  type: array
                  maxItems: 32
                  description: |
                    Selected nodes that have not applied the request, at most 32.
                  items:
                    type: object
                    required:
                      - name
                      - state
                    properties:
                      name:
                        type: string
                        description: |
                          Node name.
                      state:
                        type: string
                        enum: ["Pending", "Failed"]
                        description: |
                          `Failed` if the node refused the request or `Pending` if it has not answered yet.
                      message:
                        type: string
                        maxLength: 4096
                        description: |
                          Why the node refused the request or what it waits for.
                conditions:
                  type: array
                  description: |
                    Conditions of the request: `Accepted` and `Ready`.

                    `Accepted` shows whether `node-manager` accepted the request. It is `True` with the `Accepted` reason or `False` with one of these reasons:

                    - `InvalidExtension`: The extension has no name or no digest.
                    - `ReservedName`: The name belongs to a platform extension.
                    - `Conflict`: An older request of the same kind already uses this name or digest, or the platform installs a registry package with this name or digest on the same nodes.
                    - `KernelModuleConflict`: An older request already loads one of the kernel modules with different parameters.
                    - `NotDeliverable`: None of the selected NodeGroups installs extensions of this kind.

                    `Ready` shows whether the selected nodes run the request's digest:

                    - `True` with the `AllNodesApplied` reason: Every selected node runs it.
                    - `True` with the `NoNodesSelected` reason: The request selects no node. The selected NodeGroups do not exist, have no nodes, or have no nodes that match `nodeSelector`.
                    - `False` with the `RolloutInProgress` reason: Some selected nodes do not run it yet.
                    - `False` with the `RefusedByNodes` reason: At least one node refused the extension.
                    - `False` with the `NotAccepted` reason: The `Accepted` condition is `False`.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$'
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      message:
                        type: string
                        maxLength: 32768
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
