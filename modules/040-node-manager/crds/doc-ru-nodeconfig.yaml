spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Объект верхнего уровня, описывающий желаемое состояние immutable-узла Deckhouse.

            Один и тот же тип используется в двух местах: на узле он хранится в файле `/config/nodeconfig.yaml` и читается загрузчиком конфигурации, а в кластере представлен ресурсом группы `internal.deckhouse.io` версии `v1alpha1`.
          properties:
            spec:
              description: |
                Желаемое состояние узла.
              properties:
                nodeName:
                  description: |
                    Имя узла Kubernetes, к которому относится конфигурация.
                osImage:
                  description: |
                    Ссылка на образ системы, который, по мнению кластера, должен работать на этом узле.

                    Ни на что не влияет: узел загружается с того образа, на который DVPInstanceClass указывает его корневой диск, а nodelet только пишет это значение в журнал. Поле необязательное, чтобы один и тот же документ принимали и загрузчик на узле, и API: пока оно было обязательным здесь и необязательным в загрузчике, один и тот же YAML проходил на узле и отвергался сервером API.
                registry:
                  description: |
                    Registry, к которому узел обращается напрямую, минуя кластерный registry-packages-proxy.

                    Узлу, который поднимает control-plane, обращаться к прокси бессмысленно: прокси ещё нет, кластер поднимает как раз этот узел. Образы control-plane и собственные системные расширения ему при этом всё равно нужно скачать, поэтому адрес и учётные данные он должен знать сам. Остальные узлы оставляют поле пустым и работают через прокси.
                  properties:
                    address:
                      description: |
                        Хост registry, при необходимости с портом, например `registry.deckhouse.io` или `registry.example.com:5000`.
                    auth:
                      description: |
                        Пара `user:password` в кодировке base64 — в том же виде, в каком она хранится в поле `auth` файла docker config.
                    ca:
                      description: |
                        Набор сертификатов в формате PEM для проверки registry, подписанного собственным центром сертификации. В образе есть только набор Mozilla, поэтому без этого поля registry с самоподписанным сертификатом недоступен.
                    path:
                      description: |
                        Путь к репозиторию внутри registry, например `/deckhouse/ce`.
                    scheme:
                      description: |
                        Схема обращения к registry: `HTTPS` (по умолчанию) или `HTTP`.
                registryPackagesProxyAccessTokenB64:
                  description: |
                    Токен в кодировке base64 для аутентификации в registry-packages-proxy.

                    Это учётные данные, но, в отличие от `status.maintenanceToken`, поле намеренно НЕ помечено `x-kubernetes-sensitive-data`. Права на subresource `nodeconfigs/sensitive` выдаются на ресурс целиком, а не на отдельное поле, поэтому разрешить узлу читать этот токен можно только вместе с maintenance-токенами всех остальных узлов, — а читать этот токен узлу необходимо: контроллер расширений расшифровывает его, чтобы скачать каждый sysext. Открытость поля при этом ничего не стоит: токен прокси — один общий для кластера секрет (`registry-packages-proxy-token`), одинаковый на всех узлах, так что в копии соседа злоумышленник найдёт лишь то, что у него уже есть.
                apiServerEndpoints:
                  description: |
                    Список адресов серверов API, к которым подключается узел (через локальный на узле API-прокси).
                storage:
                  description: |
                    Выбор целевого диска для установки ОС. Разметка разделов фиксирована (boot/config/data), поэтому достаточно указать устройство диска целиком.
                  properties:
                    device:
                      description: |
                        Блочное устройство диска целиком, на которое выполняется установка, например `/dev/sda`, `/dev/nvme0n1` или стабильный путь вида `/dev/disk/by-id/...`. Игнорируется, если задан `diskSelector`.
                    diskSelector:
                      description: |
                        Выбор целевого диска по атрибутам вместо фиксированного пути. Имеет приоритет над `device` (семантика соответствует Talos). Должны совпасть все заданные условия; используется первый подошедший диск.
                      properties:
                        busPath:
                          description: |
                            Соответствие пути аппаратной шины (glob).
                        model:
                          description: |
                            Соответствие модели устройства (glob), например `Samsung*`.
                        name:
                          description: |
                            Соответствие имени устройства в ядре (glob), например `nvme0n1`.
                        rotational:
                          description: |
                            Соответствие типу накопителя: `true` — диск с вращающимися пластинами, `false` — твердотельный.
                        serial:
                          description: |
                            Соответствие серийному номеру диска (glob).
                        size:
                          description: |
                            Соответствие объёму диска, опционально с оператором сравнения, например `>=100Gi`, `>1Ti`, `512Gi`.
                        type:
                          description: |
                            Соответствие типу диска.
                        wwid:
                          description: |
                            Соответствие World Wide Identifier (glob).
                    wipe:
                      description: |
                        Определяет, будет ли уже размеченный диск очищен и размечен заново. По умолчанию `false`: настраивается только неразмеченный (или не соответствующий ожидаемой разметке) диск, поэтому корректная существующая разметка остаётся нетронутой, а перезагрузка никогда не приводит к потере данных.
                extensions:
                  description: |
                    Подписанные образы systemd-sysext с verity, подключаемые поверх корневой файловой системы.
                  items:
                    description: |
                      Подписанный образ systemd-sysext с verity, собранный из канала обновлений. Загружается из registry-packages-proxy по digest.

                      Необязательное поле `repository` (хост registry, например `cr.flant.com`) выбирает конфигурацию клиента прокси для конкретного registry; если поле пустое, берётся конфигурация прокси по умолчанию. Необязательное поле `additionalPath` (например, `deckhouse/sysext/containerd`) передаётся прокси в параметре запроса `path` и указывает, где искать артефакт внутри репозитория.
                    properties:
                      name:
                        description: |
                          Имя расширения (оно же — базовое имя образа sysext).
                      digest:
                        description: |
                          Digest образа sysext в формате `sha256:`.
                      repository:
                        description: |
                          Выбирает конфигурацию клиента прокси для конкретного registry.
                      additionalPath:
                        description: |
                          Передаётся прокси в параметре запроса `path`.
                      requestedBy:
                        description: |
                          Кто запросил расширение (например, `node-manager`).
                kernel:
                  description: |
                    Параметры sysctl и модули ядра, которые нужно загрузить.
                  properties:
                    modules:
                      items:
                        description: |
                          Модуль ядра, загружаемый с необязательными параметрами.
                    sysctl:
                      additionalProperties:
                        description: |
                          Значение параметра sysctl. Длина значения ограничена, чтобы стоимость вычисления CEL-выражений в CRD оставалась предсказуемой.
                network:
                  description: |
                    Имя хоста, DNS, NTP, сетевые интерфейсы и маршруты.
                  properties:
                    dns:
                      description: |
                        Параметры DNS-резолвера.
                    ntp:
                      description: |
                        Параметры синхронизации времени по NTP.
                    interfaces:
                      items:
                        description: |
                          Описание одного сетевого интерфейса.
                        properties:
                          addresses:
                            description: |
                              Статические адреса в формате CIDR (используются, если `dhcp` выключен).
                          dhcp:
                            description: |
                              Включает DHCPv4 на интерфейсе.
                    routes:
                      items:
                        description: |
                          Статический маршрут.
                kubelet:
                  description: |
                    Параметры kubelet.
                  properties:
                    bootstrapToken:
                      description: |
                        Bootstrap-токен, с помощью которого kubelet получает свой клиентский сертификат при первой загрузке.
                    caCert:
                      description: |
                        CA-сертификат кластера в кодировке base64, используемый в `bootstrap-kubelet.conf` для проверки сервера API.
                    clusterDNS:
                      description: |
                        Список IP-адресов DNS-серверов кластера.
                    clusterDomain:
                      description: |
                        DNS-домен кластера (например, `cluster.local`).
                    containerLogMaxFiles:
                      description: |
                        Количество сохраняемых файлов журналов с учётом ротации.
                    containerLogMaxSize:
                      description: |
                        Максимальный размер файла журнала, при достижении которого выполняется ротация (например, `50Mi`).
                    externalCloudProvider:
                      description: |
                        Включает `--cloud-provider=external`, чтобы узлом (зона, регион, providerID) управлял cloud-controller-manager.
                    kubernetesVersion:
                      description: |
                        Минорная версия Kubernetes в кластере, например `1.34`. От неё зависит, с какими feature gates запускается kubelet: bashible включает feature gates для DRA в зависимости от версии, и узел, которому версию не сообщили, сделать то же самое не сможет. Если версию не передать, DRA-нагрузка будет работать во всём кластере, кроме immutable-узлов.
                    maxPods:
                      description: |
                        Максимальное количество подов на узле.
                    nodeIP:
                      description: |
                        Адрес, который kubelet указывает при регистрации узла (`--node-ip`). Если поле пустое, kubelet выбирает адрес сам, а на узле с несколькими интерфейсами это не всегда тот адрес, на который кластер маршрутизирует трафик.
                    nodeLabels:
                      description: |
                        Лейблы, добавляемые к объекту узла при регистрации kubelet.
                      additionalProperties:
                        description: |
                          Значение лейбла, проверяемое в CRD по правилам Kubernetes.
                    registerWithTaints:
                      description: |
                        Список taint'ов, добавляемых к объекту узла при регистрации kubelet. Применяется только при первичной регистрации.
                      items:
                        description: |
                          Taint Kubernetes, добавляемый узлу при регистрации.
                    resourceReservation:
                      description: |
                        Определяет, сколько процессорного времени, памяти и дискового пространства резервируется под нужды самой системы и не отдаётся подам (kubeReserved).
                      properties:
                        mode:
                          description: |
                            Режим резервирования: `Auto` — рассчитать резерв по ёмкости узла, `Off` — не резервировать ничего.
                    serverTLSBootstrap:
                      description: |
                        Заставляет kubelet запрашивать серверный сертификат у кластера вместо того, чтобы подписывать его самому. По умолчанию `true`. На нулевом мастере значение `false`: пока Deckhouse не установлен, подписывать серверные CSR некому, а kubelet, который ждёт такой сертификат, так и не сообщит, что узел готов.
                containerRuntime:
                  description: |
                    Параметры containerd.
                  properties:
                    maxConcurrentDownloads:
                      description: |
                        Максимальное количество потоков одновременного скачивания слоёв образов.
                    sandboxImage:
                      description: |
                        Образ pause, используемый для песочниц подов.
                updatePolicy:
                  description: |
                    Определяет, как и когда обновляется узел.
                  properties:
                    mode:
                      description: |
                        Режим обновления.
                    window:
                      description: |
                        Окно обслуживания, в течение которого выполняются обновления.
                      properties:
                        days:
                          description: |
                            Дни недели, в которые действует окно.
                        from:
                          description: |
                            Время начала окна в формате `HH:MM` (24-часовой формат).
                        to:
                          description: |
                            Время окончания окна в формате `HH:MM` (24-часовой формат).
            status:
              description: |
                Состояние, публикуемое агентом на узле после каждого цикла согласования.
              properties:
                phase:
                  description: |
                    Сводка по узлу. `Ready` — узел исполняет опубликованную конфигурацию и здоров.
                    `Pending` — узел здоров, но ещё не исполняет опубликованную конфигурацию: удерживает её до выдачи разрешения на disruption.
                    `Degraded` — подсистема отказала, конфигурация отклонена или произошёл откат.
                observedGeneration:
                  description: |
                    Последнее поколение spec, которое узел обработал — увидел и принял решение.
                    Достигает нового поколения, как только узел его увидел, даже если оно ещё удерживается до одобрения и не исполняется (см. `appliedGeneration`).
                appliedGeneration:
                  description: |
                    Поколение spec, которое узел реально исполняет. Отстаёт от `observedGeneration`, пока прерывающая конфигурация удерживается.
                    Проверка «узел сошёлся» на стороне кластера — `appliedGeneration == metadata.generation`.
                conditions:
                  description: |
                    Результаты согласования на уровне узла (`ConfigurationApplied`, `DisruptionRequired`) и подсистем-гейтов (`APIEndpointsReachable`, `SysctlApplied`). Результаты по каждому расширению и юниту публикуются в `extensions` и `units` — по одной записи, а не единым агрегированным условием.
                  items:
                    description: |
                      Условие описывает одну сторону текущего состояния ресурса.
                    properties:
                      type:
                        description: |
                          Тип условия в формате CamelCase или `foo.example.com/CamelCase`.
                      status:
                        description: |
                          Статус условия: `True`, `False` или `Unknown`.
                      reason:
                        description: |
                          Программный идентификатор причины последнего перехода условия. Значение — строка в формате CamelCase; поле не может быть пустым.
                      message:
                        description: |
                          Человекочитаемое описание перехода. Может быть пустой строкой.
                      lastTransitionTime:
                        description: |
                          Момент последнего перехода условия из одного состояния в другое. Если он неизвестен, допустимо указать момент изменения самого поля.
                      observedGeneration:
                        description: |
                          Поколение `.metadata.generation`, на основании которого установлено условие. Если `.metadata.generation` равно 12, а здесь 9, условие устарело относительно текущего состояния объекта.
                extensions:
                  description: |
                    Результат по каждому настроенному системному расширению (sysext) — по одной записи на расширение, чтобы было видно, какое именно расширение отказало, а не единый агрегированный статус.

                    Публикуется заново на каждом проходе и остаётся пустым, если проход ничего не проверял. Пустой список означает именно это и никогда не означает, что «прежний результат ещё в силе».
                  items:
                    description: |
                      Результат согласования одного системного расширения.
                    properties:
                      name:
                        description: |
                          Имя расширения, совпадает с `spec.extensions[].name`.
                      digest:
                        description: |
                          Digest образа, который узел установил для этого расширения.
                      state:
                        description: |
                          `Ready` — расширение установлено и подключено (merge). `Pending` — расширение загружается или ожидает окна обновления. `Failed` — отказ, причина в `message`.
                      message:
                        description: |
                          Причина, когда `state` равно `Failed`.
                units:
                  description: |
                    Результат по каждому управляемому systemd-юниту (containerd, kubelet и каждый юнит, поставляемый расширением) — по одной записи на юнит.
                  items:
                    description: |
                      Результат согласования одного управляемого systemd-юнита.
                    properties:
                      name:
                        description: |
                          Имя systemd-юнита (например, `containerd.service`).
                      state:
                        description: |
                          `Active` — юнит запущен. `Pending` — юнит поставлен в очередь на запуск позже в этом цикле. `Failed` — отказ, причина в `message`.
                      message:
                        description: |
                          Причина, когда `state` равно `Failed`.
                lastReconcileTime:
                  description: |
                    Момент, когда узел в последний раз завершил проход согласования. Больше ничто в статусе не устаревает: у условий есть `lastTransitionTime`, но он сдвигается только при смене состояния. Поэтому узел, агент которого отказал в 02:00, так и остаётся с последним записанным статусом — и ни оператор, ни механизм выката (который сочтёт такой узел сошедшимся и освободит слот под следующий) не отличат этот узел от живого.

                    Значение обновляется не на каждом проходе, а не чаще раза в несколько минут: ежеминутная запись на каждый узел не даёт ничего по сравнению с более редким heartbeat. Поэтому об устаревании стоит судить в масштабе десятков минут, а не секунд.
                maintenanceToken:
                  description: |
                    Токен для аутентификации отправки конфигурации в maintenance-эндпоинт узла. Агент на узле генерирует его при старте и переопубликовывает здесь на каждом проходе, пока доступен API кластера. Когда узел теряет доступ к API и открывает порт `:50000`, оператор читает этот токен из последнего опубликованного статуса и передаёт его как `Authorization: Bearer <токен>` при отправке конфигурации.

                    Токен даёт право отправить узлу произвольную конфигурацию, поэтому поле помечено как чувствительное: API вырезает его из ответов на `get`, `list` и `watch` для всех, у кого нет прав на subresource `nodeconfigs/sensitive`. Узлы читают NodeConfig'и всего кластера (RBAC не умеет ограничить cluster-scoped ресурс собственным объектом узла) и этих прав намеренно НЕ получают — иначе один узел смог бы прочитать токен другого и отправить ему конфигурацию, как только тот потеряет доступ к API.
