spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Желаемое состояние одного узла и отчёт агента узла о нём.

            Агент узла (nodelet) применяет `spec`.
          properties:
            apiVersion:
              description: |
                Версионированная схема этого представления объекта. Серверы должны преобразовывать распознанные схемы в последнее внутреннее значение и могут отклонять нераспознанные значения.

                Подробнее — [в соглашениях об API Kubernetes](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources).
            kind:
              description: |
                Строка, которая обозначает REST-ресурс, представленный этим объектом. Серверы могут определить её по адресу, на который клиент отправляет запросы.

                Изменить значение нельзя. Записывается в CamelCase.

                Подробнее — [в соглашениях об API Kubernetes](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds).
            spec:
              description: |
                Желаемое состояние узла.
              properties:
                nodeName:
                  description: |
                    Имя узла Kubernetes, к которому относится конфигурация.

                    Совпадает с `metadata.name`, изменить его нельзя.
                systemType:
                  description: |
                    Способ управления узлом.

                    - `Immutable` — узел Deckhouse Engine. Агент узла настраивает весь узел.
                    - `Mutable` — узел, который настраивает bashible. Агент узла управляет только тем, что включено в `featureGates`.

                    Значение нельзя изменить.
                featureGates:
                  description: |
                    Функции агента узла, которые нужно включить или выключить. Ключ — имя функции.

                    Функция, которой нет в списке, на узле с `systemType: Immutable` включена, если тип узла её поддерживает. На узле с `systemType: Mutable` такая функция выключена: узел выполняет только функции, включённые в этом списке.

                    Узел отклоняет конфигурацию, если в ней указана неизвестная функция или включена функция, которую тип узла не поддерживает.

                    Значение задаёт node-controller.
                osImage:
                  description: |
                    Образ операционной системы, который должен использоваться на узле.

                    Узел сравнивает значение `digest` со значением, сохранённым при установке в `/config/os-digest`. Дайджест идентифицирует конкретную публикацию образа и может измениться при повторной публикации того же содержимого.

                    Обязателен, если `systemType` равен `Immutable`.
                  properties:
                    digest:
                      description: |-
                        Дайджест образа операционной системы.

                        Идентифицирует конкретный образ и используется узлом для определения необходимости обновления. При установке узел сохраняет дайджест и при последующих проверках сравнивает его с указанным значением.
                    path:
                      description: |
                        Путь к образу внутри хранилища образов контейнеров.
                    rootHash:
                      description: |-
                        Корневой хеш dm-verity файловой системы внутри образа в шестнадцатеричном формате ASCII.

                        Используется для определения фактического изменения содержимого образа.
                        В отличие от `digest`, значение которого может измениться при повторной публикации образа,
                        `rootHash` остаётся прежним, если содержимое корневой файловой системы не изменилось.

                        Deckhouse Platform заполняет это поле на основе лейбла образа.
                        Если получить значение из лейбла не удалось, узел определяет корневой хеш после скачивания образа.
                    repository:
                      description: |-
                        Адрес хранилища образов контейнеров, из которого загружается образ операционной системы.

                        Значение передаётся в `registry-packages-proxy` в параметре `repository`.

                        Если параметр не указан, `repository` не передаётся и `registry-packages-proxy` использует адрес хранилища, назначенный по умолчанию.
                registry:
                  description: |
                    Хранилище образов контейнеров, к которому узел обращается напрямую, минуя кластерный registry-packages-proxy.

                    Узлу, который разворачивает control-plane, обращаться к прокси бессмысленно: прокси ещё нет, кластер готовит как раз этот узел. Образы control-plane и собственные системные расширения ему при этом всё равно нужно скачать, поэтому адрес и учётные данные он должен знать сам. Остальные узлы оставляют поле пустым и работают через прокси.
                  properties:
                    address:
                      description: |
                        Хост хранилища образов контейнеров, при необходимости с портом, например `registry.deckhouse.io` или `registry.example.com:5000`.
                    auth:
                      description: |
                        Пара `user:password` в кодировке Base64 — в том же виде, в каком она хранится в поле `auth` файла docker config.
                    caBundle:
                      description: |
                        Набор сертификатов центров сертификации в формате PEM, по которому проверяется хранилище образов контейнеров.
                    path:
                      description: |
                        Путь к репозиторию внутри хранилища образов контейнеров, например `/deckhouse/ce`.
                    scheme:
                      description: |
                        Протокол, по которому узел подключается к хранилищу образов контейнеров.

                        По умолчанию `HTTPS`.
                registryPackagesProxy:
                  description: |
                    Параметры подключения узла к `registry-packages-proxy`, который отдаёт узлу расширения и образы операционной системы.
                  properties:
                    accessToken:
                      description: |
                        Bearer-токен, который узел предъявляет прокси.

                        В объекте хранится в кодировке Base64.
                    endpoints:
                      description: |
                        Адреса `registry-packages-proxy` со схемой и портом.

                        Если поле не задано, узел использует порт `4219` на хостах из `apiServerEndpoints`. Задаётся только в начальной конфигурации первого master-узла.
                statusToken:
                  description: |
                    Токен для аутентификации запроса статуса у порта `:50000` узла.

                    Токен генерирует тот, кто пишет документ: dhctl при бутстрапе или рендер NodeConfigTemplate для машины, которую ставят руками; кластер переносит значение из уже существующего NodeConfig как есть, потому что сообщить узлу новый токен ему нечем. В NodeConfigTemplate токен генерируется заново на каждое чтение — машине, которую ставят руками, брать его неоткуда.

                    В отличие от `status.maintenanceToken`, поле намеренно НЕ помечено `x-kubernetes-sensitive-data`: API отвечал бы `<omitted>`, и перенос значения записал бы эту строку обратно, уничтожив токен. Токен даёт право только читать статус, но не отправлять конфигурацию.
                apiServerEndpoints:
                  description: |
                    Адреса API-серверов Kubernetes со схемой и портом, например `https://10.0.0.1:6443`.
                internalNetworkCIDRs:
                  description: |
                    Внутренние сети кластера — подсети, в которых узлы адресуют друг друга и control-plane.

                    Узел выбирает интерфейс, адрес которого попадает в одну из этих сетей, и регистрируется с этим адресом. Узлу с единственным интерфейсом поле не нужно. Значение кластерное: контроллер публикует его на каждом проходе, беря из `StaticClusterConfiguration` статического кластера и из конфигурации облачного провайдера. Допускаются только адреса IPv4.
                storage:
                  description: |
                    Диск, на который установлена операционная система, и дополнительные файловые системы.

                    Заданный диск для установки изменить нельзя.
                  properties:
                    device:
                      description: |
                        Блочное устройство диска целиком, на которое выполняется установка.

                        Например `/dev/sda`, `/dev/nvme0n1` или стабильный путь вида `/dev/disk/by-id/...`. Игнорируется, если задан `diskSelector`.
                    diskSelector:
                      description: |
                        Выбор диска для установки по атрибутам вместо фиксированного пути.

                        Должны совпасть все заданные поля.
                      properties:
                        busPath:
                          description: |
                            Соответствие пути аппаратной шины (glob).
                        model:
                          description: |
                            Соответствие модели устройства (glob), например `Samsung*`.
                        name:
                          description: |
                            Соответствие имени устройства в ядре (glob), например `nvme0n1`.
                        rotational:
                          description: |
                            Соответствие типу накопителя: `true` — диск с вращающимися пластинами, `false` — твердотельный.
                        serial:
                          description: |
                            Соответствие серийному номеру диска (glob).
                        size:
                          description: |
                            Соответствие объёму диска, опционально с оператором сравнения, например `>=100Gi`, `>1Ti`, `512Gi`.
                        type:
                          description: |
                            Соответствие типу диска.
                        wwid:
                          description: |
                            Соответствие World Wide Identifier (glob).
                    mounts:
                      items:
                        properties:
                          filesystem:
                            description: |
                              Файловая система, которая создаётся на пустом разделе.

                              По умолчанию `Ext4`.
                    wipe:
                      description: |
                        Определяет, будет ли уже размеченный диск очищен и размечен заново.

                        По умолчанию `false`: настраивается только неразмеченный (или не соответствующий ожидаемой разметке) диск, поэтому корректная существующая разметка остаётся нетронутой, а перезагрузка никогда не приводит к потере данных.
                extensions:
                  description: |
                    Расширения, которые устанавливает узел. Каждое закреплено дайджестом.

                    На узле с `systemType: Immutable` запись — подписанный образ системного расширения с dm-verity. На узле с `systemType: Mutable` запись — registry-пакет: агент узла запускает скрипт `install` из пакета с правами `root`.

                    Запись с именем `nodelet` обновляет сам агент узла.
                  items:
                    description: |
                      Подписанный образ systemd-sysext с verity, собранный из канала обновлений.

                      Загружается из registry-packages-proxy по дайджесту.

                      Необязательное поле `repository` (хост registry, например `cr.flant.com`) выбирает конфигурацию клиента прокси для конкретного хранилища образов контейнеров. Если поле пустое, берётся конфигурация прокси по умолчанию. Необязательное поле `path` (например, `deckhouse/sysext/containerd`) передаётся прокси в параметре запроса `path` и указывает, где искать артефакт внутри репозитория.
                    properties:
                      name:
                        description: |
                          Имя расширения (оно же — базовое имя образа sysext).
                      digest:
                        description: |
                          Дайджест образа sysext в формате `sha256:`.
                      path:
                        description: |
                          Путь к артефакту внутри хранилища образов контейнеров.
                      repository:
                        description: |
                          Выбирает конфигурацию клиента прокси для конкретного registry.
                      requestedBy:
                        description: |
                          Объект, который запросил расширение.

                          У расширений самой платформы поле не задано.
                        properties:
                          kind:
                            description: |
                              Вид объекта.
                          name:
                            description: |
                              Имя объекта.
                staticPods:
                  description: |
                    Манифесты статических подов, которые kubelet запускает без участия планировщика Kubernetes.

                    Узел записывает манифесты в каталог `/etc/kubernetes/manifests`. Остальные необходимые ресурсы статический под должен получать самостоятельно. Например, под может выпускать собственные сертификаты, использовать kubeconfig узла и монтировать каталоги для хранения состояния через `hostPath` с типом `DirectoryOrCreate`.

                    Манифесты компонентов control plane, которые агент узла создаёт самостоятельно, в `spec.staticPods` не включаются и при обработке этого параметра не изменяются.
                  items:
                    description: |
                      Статический под.
                    properties:
                      name:
                        description: |
                          Имя файла манифеста без расширения.

                          Используется как ключ элемента списка и не связано с `metadata.name` пода в манифесте. Имя зеркального пода kubelet определяет по манифесту, а не по имени файла.
                      manifest:
                        description: |
                          Полный манифест пода.

                          При записи манифеста на диск подстрока `$MY_IP` заменяется IP-адресом узла аналогично манифестам компонентов control plane.
                      requestedBy:
                        description: |
                          Объект, который запросил статический под.

                          У статических подов самой платформы поле не задано.
                        properties:
                          kind:
                            description: |
                              Вид объекта.
                          name:
                            description: |
                              Имя объекта.
                kernel:
                  description: |
                    Параметры sysctl и модули ядра, которые нужно загрузить.
                  properties:
                    modules:
                      description: |
                        Модули ядра, которые нужно загрузить, в указанном порядке.

                        Зависимости автоматически не загружаются, поэтому указывайте каждый модуль после модулей, от которых он зависит. Не указывайте драйвер, встроенный в ядро: условие `KernelModulesLoaded` получит статус `False`.

                        Модуль, добавленный в список, загружается только после одобрения прерывания.
                      items:
                        description: |
                          Модуль ядра, загружаемый с необязательными параметрами.
                    sysctl:
                      additionalProperties:
                        description: |
                          Значение параметра sysctl. Длина значения ограничена, чтобы стоимость вычисления CEL-выражений в CRD оставалась предсказуемой.
                network:
                  description: |
                    Имя хоста, DNS, NTP, сетевые интерфейсы и маршруты.
                  properties:
                    hostname:
                      description: |
                        Имя хоста узла.
                    dns:
                      description: |
                        Параметры DNS-резолвера.
                      properties:
                        servers:
                          description: |
                            IP-адреса DNS-серверов.
                    ntp:
                      description: |
                        Параметры синхронизации времени по NTP.
                    interfaces:
                      description: |
                        Сетевые интерфейсы. Ключ элемента списка — имя интерфейса.
                      items:
                        description: |
                          Описание одного сетевого интерфейса.
                        properties:
                          addresses:
                            description: |
                              Статические адреса в формате CIDR. Используются, если `dhcp` равно `false`.
                          cluster:
                            description: |
                              Помечает интерфейс как кластерный — тот, по которому идёт трафик кластера.

                              Нужно машине, адресацию которой не получается различить по `spec.internalNetworkCIDRs`: например, когда несколько интерфейсов попадают в одну и ту же внутреннюю сеть. Пометить так можно не более одного интерфейса.
                          dhcp:
                            description: |
                              Включает DHCPv4 на интерфейсе.
                          gateway:
                            description: |
                              IP-адрес шлюза по умолчанию.
                    routes:
                      items:
                        description: |
                          Статический маршрут.
                        properties:
                          gateway:
                            description: |
                              IP-адрес шлюза.
                          networks:
                            description: |
                              Сети назначения в формате CIDR.
                kubelet:
                  description: |
                    Параметры kubelet.
                  properties:
                    bootstrapToken:
                      description: |
                        Bootstrap-токен, с помощью которого kubelet получает свой клиентский сертификат при первой загрузке.
                    clusterCABundle:
                      description: |
                        Набор сертификатов центра сертификации кластера в формате PEM.
                    clusterDNS:
                      description: |
                        Список IP-адресов DNS-серверов кластера.
                    clusterDomain:
                      description: |
                        DNS-домен кластера (например, `cluster.local`).
                    containerLogMaxFiles:
                      description: |
                        Количество файлов журнала с учётом ротации, которые сохраняются для каждого контейнера.

                        По умолчанию `4`.
                    containerLogMaxSize:
                      description: |
                        Размер файла журнала контейнера, при достижении которого выполняется ротация.

                        По умолчанию `50Mi`.
                    externalCloudProvider:
                      description: |
                        Включает `--cloud-provider=external`, чтобы узлом (зона, регион, providerID) управлял cloud-controller-manager.
                    kubernetesVersion:
                      description: |
                        Минорная версия Kubernetes в кластере, например `1.34`.

                        От неё зависит, с какими feature gates запускается kubelet: bashible включает feature gates для DRA в зависимости от версии, и узел, которому версию не сообщили, сделать то же самое не сможет. Если версию не передать, DRA-нагрузка будет работать во всём кластере, кроме immutable-узлов.
                    maxPods:
                      description: |
                        Максимальное количество подов на узле.

                        По умолчанию `120`.
                    nodeLabels:
                      description: |
                        Лейблы, добавляемые к объекту Node при регистрации kubelet.
                      additionalProperties:
                        description: |
                          Значение лейбла, проверяемое в CRD по правилам Kubernetes.
                    registerWithTaints:
                      description: |
                        Список taint'ов, добавляемых к объекту Node при регистрации kubelet. Применяется только при первичной регистрации.
                      items:
                        description: |
                          Taint Kubernetes, добавляемый узлу при регистрации.
                    resourceReservation:
                      description: |
                        Определяет, сколько процессорного времени, памяти и дискового пространства резервируется под нужды самой системы и не отдаётся подам (kubeReserved).
                      properties:
                        mode:
                          description: |
                            Режим резервирования.

                            - `Auto` — резерв рассчитывается по ёмкости узла.
                            - `Off` — ничего не резервируется.

                            По умолчанию `Auto`.
                    serverTLSBootstrap:
                      description: |
                        Заставляет kubelet запрашивать серверный сертификат у кластера вместо того, чтобы подписывать его самому.

                        По умолчанию `true`. На первом разворачиваемом master-узле в кластере значение `false`: пока DP не установлена, подписывать серверные CSR некому, а kubelet, который ждёт такой сертификат, так и не сообщит, что узел готов.
                containerRuntime:
                  description: |
                    Параметры containerd.
                  properties:
                    maxConcurrentDownloads:
                      description: |
                        Максимальное количество одновременно скачиваемых слоёв образов.

                        Значение `0` снимает ограничение. По умолчанию `8`.
                    sandboxImage:
                      description: |
                        Образ `pause`, используемый для песочниц подов.

                        Если параметр не задан, используется образ `pause`, импортированный системным расширением containerd.
                    registryConfigOwner:
                      description: |
                        Компонент, который записывает директорию `registry.d` containerd.

                        - `Nodelet` — агент узла записывает в директорию конфигурацию из `spec.registry` и удаляет всё остальное.
                        - `RegistryAgent` — директорией владеет статический под registry-агента.

                        По умолчанию `Nodelet`. Значение задаёт `node-manager`.
                updatePolicy:
                  description: |
                    Определяет, как и когда обновляется узел.
                  properties:
                    mode:
                      description: |
                        Режим обновления.
                    windows:
                      description: |
                        Временные окна в UTC, когда узел может скачивать и применять обновления.

                        Обновление разрешено, если подходит любое из окон. Если окон нет, обновление разрешено в любое время.
                      items:
                        description: |
                          Одно окно обновления в UTC.
                        properties:
                          days:
                            description: |
                              Дни недели, в которые действует окно.

                              Если список пуст, окно действует каждый день.
                          from:
                            description: |
                              Время начала окна в UTC в формате `H:MM` или `HH:MM` (24-часовой формат).
                          to:
                            description: |
                              Время окончания окна в том же формате, что и `from`.

                              Если время окончания раньше времени начала, окно переходит через полночь.
            status:
              description: |
                Состояние, публикуемое агентом на узле после каждого цикла согласования.
              properties:
                agent:
                  description: |
                    Сборка агента узла, которая записала этот статус.
                  properties:
                    version:
                      description: |
                        Версия сборки агента узла.
                phase:
                  description: |
                    Сводка по узлу.

                    - `Ready` — на узле работает опубликованная конфигурация, и все подсистемы исправны.
                    - `Pending` — узел исправен, но опубликованная конфигурация на нём ещё не работает.
                    - `Degraded` — хотя бы одно условие, кроме `AddressResolved`, сообщает об ошибке.
                observedGeneration:
                  description: |
                    Последнее поколение `spec`, которое узел обработал — обнаружил и принял решение.

                    Достигает нового поколения, как только узел его обнаружил, даже если оно ещё удерживается до одобрения и не исполняется (Подробнее — в параметре `appliedGeneration`).
                appliedGeneration:
                  description: |
                    Поколение `spec`, которое применил узел.

                    Узел применил текущую `spec`, когда `appliedGeneration` равно `metadata.generation` и условие `ConfigurationApplied` равно `True` для этого поколения. Значение отстаёт, пока прерывающее изменение ожидает одобрения и пока новая сборка агента, установленная для этого поколения, ещё не применила его.
                conditions:
                  description: |
                    Условия узла.

                    Условие со значением `False`, причина которого оканчивается на `Pending`, означает ожидание. Любая другая причина при `False`, а также значение `Unknown` означают ошибку. Условие `AddressResolved` не влияет на `phase`.

                    В условиях `Ready`, `ConfigurationApplied` и `DisruptionApproved` поле `observedGeneration` содержит поколение, которое обработал узел. В остальных условиях — поколение, которое работает на узле.

                    Типы условий:

                    - `Ready` — `True` с причиной `ReconcileSucceeded`, когда `phase` равно `Ready`. В остальных случаях `False`, причиной служит значение `phase`, а `message` называет условие, которое определило фазу.
                    - `ConfigurationApplied` — `True`, когда на узле работает опубликованная конфигурация.

                      При `True` причина — `ReconcileSucceeded` или `UnknownFields`, если в объекте есть поля, неизвестные этой сборке агента. Такие поля перечислены в `message`.

                      Причины при `False`, которые означают ожидание:

                      - `DisruptionApprovalPending`;
                      - `Pending`;
                      - `RestartPending`.

                      Причины при `False`, которые означают ошибку:

                      - `Rejected`;
                      - `RolledBackToLastKnownGood`;
                      - `RollbackFailed`;
                      - `PartiallyApplied`;
                      - `FieldsNotApplicable`.
                    - `DisruptionApproved` — одобрено ли прерывание работы, которого требует конфигурация узла.

                      Причины:

                      - `ApprovalPending` (`False`) — конфигурация, которая прерывает работу узла, ждёт одобрения;
                      - `AttemptsExhausted` (`False`) — попытки `node-manager` прервать работу узла не удались, и новых он пока не делает;
                      - `Approved` (`True`) — прерывание одобрено;
                      - `NoDisruptionPending` (`True`) — ничего не ждёт одобрения.
                    - `AddressResolved` — определил ли узел адрес, с которым он регистрируется.

                      Причины при `False`:

                      - `NoneInCIDR`, `Ambiguous` — узел не может выбрать адрес;
                      - `AddressDrift` — узел сохраняет адрес, с которым зарегистрирован, но этого адреса больше нет на машине или конфигурация теперь выбирает другой.
                    - Условия подсистем — по одному на каждую подсистему, которую проход запустил или пропустил:

                      - `APIEndpointsReachable`;
                      - `SysctlApplied`;
                      - `KernelModulesLoaded`;
                      - `MountsReady`;
                      - `ExtensionsReady`;
                      - `ContainerdReady`;
                      - `KubeletReady`;
                      - `StaticPodsReady`;
                      - `UnitsRunning`;
                      - `OSImageUpToDate`;
                      - `ControlPlaneBootstrapped`.

                      Значения условия подсистемы:

                      - `True` с причиной `ReconcileSucceeded`;
                      - `False` с причиной `Pending`, пока подсистема ждёт чего-то вне узла, или с причиной `ReconcileFailed` либо собственной причиной подсистемы в остальных случаях, описание причины — в `message`;
                      - `Unknown` с причиной `ReconcileSkipped`, если подсистема не запускалась в этом проходе.
                  items:
                    description: |
                      Условие описывает одну сторону текущего состояния ресурса.
                    properties:
                      type:
                        description: |
                          Тип условия в формате CamelCase или `foo.example.com/CamelCase`.
                      status:
                        description: |
                          Статус условия: `True`, `False` или `Unknown`.
                      reason:
                        description: |
                          Программный идентификатор причины последнего перехода условия.

                          Значение — строка в формате CamelCase. Поле не может быть пустым.
                      message:
                        description: |
                          Человекочитаемое описание перехода.

                          Может быть пустой строкой.
                      lastTransitionTime:
                        description: |
                          Момент последнего перехода условия из одного состояния в другое.

                          Это должен быть момент, когда изменилось само условие. Если он неизвестен, допустимо указать момент изменения поля API.
                      observedGeneration:
                        description: |
                          Поколение `.metadata.generation`, на основании которого установлено условие.

                          Если значение этого параметра меньше значения `.metadata.generation`, условие устарело относительно текущего состояния объекта.
                osImage:
                  description: |
                    Состояние образа операционной системы на узле. Заполняется узлом.
                  properties:
                    attemptsLeft:
                      description: |-
                        Количество оставшихся попыток загрузки с проверяемым образом до автоматического отката initramfs к предыдущему образу.
                    digest:
                      description: |-
                        Дайджест образа операционной системы, который в данный момент используется узлом. Значение считывается из конфигурационного раздела узла.

                        Может отсутствовать на узлах, установленных до появления механизма сохранения дайджеста.
                    failedDigest:
                      description: |-
                        Дайджест образа, после загрузки которого узел выполнил откат. Повторные попытки загрузки этого образа не выполняются.

                        Поскольку дайджест однозначно идентифицирует неизменяемое содержимое образа, исправленная версия образа будет иметь другой дайджест.
                    rootHash:
                      description: |-
                        Корневой хеш dm-verity образа, который в данный момент используется узлом. Значение считывается из активного A/B-раздела.

                        Позволяет определить фактическое содержимое корневой файловой системы независимо от дайджеста образа. Например, дайджесты требуемого и используемого образов могут различаться после повторной публикации, при этом одинаковые значения `rootHash` означают, что содержимое корневой файловой системы не изменилось.
                    slot:
                      description: A/B-раздел (`a` или `b`), содержащий образ, который в данный момент используется узлом.
                    trialDigest:
                      description: |-
                        Дайджест образа, подготовленного для следующей загрузки или проверяемого во время текущей загрузки.

                        Параметр устанавливается только во время обновления, пока `digest` содержит дайджест предыдущего образа.
                extensions:
                  description: |
                    Результат по каждому настроенному системному расширению (sysext) — по одной записи на расширение, чтобы было видно, какое именно расширение отказало, а не единый агрегированный статус.

                    Публикуется заново на каждом проходе и остаётся пустым, если проход ничего не проверял. Пустой список означает именно это и никогда не означает, что «прежний результат ещё в силе».
                  items:
                    description: |
                      Результат согласования одного системного расширения.
                    properties:
                      name:
                        description: |
                          Имя расширения: `spec.extensions[].name` или имя расширения, которое убрано из `spec`, но удалить его с узла с `systemType: Mutable` не удалось.
                      digest:
                        description: |
                          Зависит от `state`.

                          - `Ready` — дайджест, установленный на узле.
                          - `Pending` — устанавливаемый дайджест. Для записи самого агента — установленный дайджест, сборка с которым ещё не запущена.
                          - `Failed` — дайджест, который узел отклонил или не смог установить.
                      state:
                        description: |
                          Состояние расширения.

                          - `Ready` — расширение установлено (на узле с `systemType: Immutable` ещё и подключено).
                          - `Pending` — расширение загружается или ожидает окна обновления, либо агент перезапускается с новой сборкой самого себя (причина `RestartPending`).
                          - `Failed` — установка не удалась, причина указана в `message`.
                      message:
                        description: |
                          Причина, когда `state` равно `Failed`.
                features:
                  description: |
                    Функции, которые работали на узле в последнем цикле согласования, по алфавиту: функции, включённые в `spec.featureGates`, и функции, включённые по умолчанию для типа узла.

                    На узле Deckhouse Engine поле `spec.featureGates` обычно пустое: функции, которых в нём нет, там включены. Какие функции на самом деле работают на узле, показывает этот список.
                units:
                  description: |
                    Результат по каждому управляемому systemd-юниту (containerd, kubelet и каждый юнит, поставляемый расширением) — по одной записи на юнит.
                  items:
                    description: |
                      Результат согласования одного управляемого systemd-юнита.
                    properties:
                      name:
                        description: |
                          Имя systemd-юнита (например, `containerd.service`).
                      state:
                        description: |
                          `Active` — юнит запущен. `Pending` — юнит поставлен в очередь на запуск позже в этом цикле. `Failed` — отказ, причина в `message`.
                      message:
                        description: |
                          Причина, когда `state` равно `Failed`.
                staticPods:
                  description: |
                    Результаты обработки статических подов. Для каждого пода создаётся отдельная запись.

                    Значение формируется заново при каждом проходе и остаётся пустым, если статические поды во время прохода не проверялись.
                  items:
                    description: |
                      Результат обработки одного статического пода.
                    properties:
                      name:
                        description: |
                          Имя статического пода, соответствующее `spec.staticPods[].name`.
                      state:
                        description: |
                          Состояние обработки манифеста.

                          Возможные значения:

                          - `Written` — файл на диске соответствует манифесту из `spec`;
                          - `Failed` — файл не соответствует манифесту из `spec`. Причина указывается в поле `reason`.
                      reason:
                        description: |
                          Причина состояния `Failed`.

                          Возможные значения:

                          - `ManifestRejected` — узел отклонил манифест. Необходимо исправить манифест в ресурсе;
                          - `WriteFailed` — не удалось записать файл манифеста на узел. Необходимо проверить состояние узла;
                          - `RemoveFailed` — статический под удалён из `spec`, но соответствующий файл манифеста не удалось удалить с узла. Под продолжает работать.
                      message:
                        description: |
                          Подробная информация об ошибке, если `state` имеет значение `Failed`.
                      manifestDigest:
                        description: |
                          sha256 манифеста в том виде, в каком он опубликован в `spec`, в формате `sha256:<hex>`.

                          Заполняется при `state: Written`.
                network:
                  description: |
                    Адрес, с которым узел вошёл в кластер, и интерфейс, с которого этот адрес взят.

                    Пишет узел: он выбирает интерфейс по `spec.internalNetworkCIDRs` или по метке `cluster` и сообщает, чем закончился выбор. Кластер это значение только читает.
                  properties:
                    clusterInterface:
                      description: |
                        Интерфейс, с которого взят адрес.
                    address:
                      description: |
                        Адрес, с которым kubelet зарегистрировал узел.
                lastReconcileTime:
                  description: |
                    Момент, когда узел в последний раз завершил проход согласования.

                    Больше ничто в статусе не устаревает: у условий есть `lastTransitionTime`, но он сдвигается только при смене состояния. Поэтому узел, агент которого отказал в 02:00, так и остаётся с последним записанным статусом — и ни оператор, ни механизм выката (который сочтёт такой узел сошедшимся и освободит слот под следующий) не отличат этот узел от работающего.

                    Значение обновляется не на каждом проходе, а не чаще раза в несколько минут: ежеминутная запись на каждый узел не даёт ничего по сравнению с более редким heartbeat. Поэтому об устаревании стоит судить в масштабе десятков минут, а не секунд.
                maintenanceToken:
                  description: |
                    Токен для аутентификации отправки конфигурации в maintenance-эндпоинт узла.

                    Агент на узле генерирует его при старте и переопубликовывает здесь на каждом проходе, пока доступен API кластера. Когда узел теряет доступ к API и открывает порт `:50000`, оператор читает этот токен из последнего опубликованного статуса и передаёт его как `Authorization: Bearer <токен>` при отправке конфигурации.

                    Токен даёт право отправить узлу произвольную конфигурацию, поэтому поле помечено как чувствительное: API вырезает его из ответов на `get`, `list` и `watch` для всех, у кого нет прав на субресурс `nodeconfigs/sensitive`. Узлы читают NodeConfig'и всего кластера (RBAC не умеет ограничить cluster-scoped ресурс собственным объектом узла) и этих прав намеренно НЕ получают — иначе один узел смог бы прочитать токен другого и отправить ему конфигурацию, как только тот потеряет доступ к API.
