- name: Gardener Machine Controller Manager
  link: https://github.com/gardener/machine-controller-manager
  description: An operator that manages VMs as a kubernetes custom resource.
  logo: https://raw.githubusercontent.com/gardener/gardener/master/logo/gardener-large.png
  license: Apache License 2.0
  id: mcm
  version: v0.36.0

- name: Cluster API
  link: https://github.com/kubernetes-sigs/cluster-api
  description: Kubernetes Cluster API for declarative cluster lifecycle management.
  logo: /images/logos/kubernetes.svg
  license: Apache License 2.0
  id: cluster-api
  version: 1.12.11

- name: Cluster Autoscaler
  link: https://github.com/gardener/autoscaler
