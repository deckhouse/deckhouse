  logo: /images/logos/kubernetes.svg
  license: Apache License 2.0
  id: cluster-autoscaler
  versions:
    - condition:
        k8s: "1.33"
      version: v1.33.1
    - condition:
        k8s: "1.34"
      version: v1.34.1
    - condition:
        k8s: "1.35"
      version: v1.35.1
    - condition:
        k8s: "1.36"
      version: v1.36.0
    - condition:
        k8s: "1.37"
      version: v1.36.0
