apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: fencing-agent-e2e
spec:
  timeouts:
    apply: 30s
    assert: 5m
    error: 2m
    delete: 30s
    cleanup: 2m
    exec: 30s
  execution:
    failFast: true
    parallel: 1            # cluster-scoped resources must run sequentially
  discovery:
    testFile: chainsaw-test.yaml
  # A JUnit report with one entry per operation of every step, written to reports/ of the directory chainsaw runs in.
  report:
    format: JUNIT-OPERATION
    path: reports
    name: chainsaw-report
