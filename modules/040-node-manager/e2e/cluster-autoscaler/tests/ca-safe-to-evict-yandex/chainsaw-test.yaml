apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ca-safe-to-evict-yandex
spec:
  description: |
    Verifies that cluster-autoscaler correctly handles the safe-to-evict annotation
    on a Yandex Cloud (MCM) cluster. Scales up a node from zero, creates a standalone
    pod with safe-to-evict: "true", removes the workload, and asserts that scale-down
    proceeds (the standalone pod does not block it). The pod prefers the test node but
    fits on another node too: CA removes a node only if it can reschedule every pod on it.
  concurrent: false
  steps:
    - name: assert-yandexinstanceclass-worker-exists
      try:
        - description: Assert YandexInstanceClass worker resource exists
          assert:
            file: ../common/asserts/assert-yandex-instanceclass.yaml
      cleanup:
        - description: Wait until all test nodes are removed (runs last in cleanup chain)
          script:
            timeout: 15m
            content: |
              set -eu
              for i in $(seq 1 90); do
                NODES=$(kubectl get nodes -l app=e2e-autoscaler-test --no-headers 2>/dev/null | wc -l | tr -d ' ')
                if [ "$NODES" -eq 0 ]; then
                  exit 0
                fi
                sleep 10
              done
              echo "Timed out waiting for test nodes removal"
              exit 1
            check:
              ($error == null): true
        - description: Delete the Project that multitenancy-manager made of the test namespace
          script:
            timeout: 5m
            content: |
              set -u
              # With multitenancy-manager the test namespace becomes a Project and cannot be deleted
              # directly, which fails chainsaw's own namespace cleanup. Deleting the Project removes the
              # namespace. Without the module there is no Project and nothing to do.
              if kubectl get projects.deckhouse.io "$NAMESPACE" >/dev/null 2>&1; then
                kubectl delete projects.deckhouse.io "$NAMESPACE" --wait=true --timeout=4m
              fi
            check:
              ($error == null): true

    - name: cleanup-leftover-resources
      try:
        - description: Delete leftover NodeGroup e2e-safe-to-evict
          continueOnError: true
          delete:
            ref:
              apiVersion: deckhouse.io/v1
              kind: NodeGroup
              name: e2e-safe-to-evict
        - description: Delete leftover YandexInstanceClass e2e-worker-small
          continueOnError: true
          delete:
            ref:
              apiVersion: deckhouse.io/v1alpha1
              kind: YandexInstanceClass
              name: e2e-worker-small
        - description: Delete leftover blocking pod
          continueOnError: true
          delete:
            ref:
              apiVersion: v1
              kind: Pod
              name: e2e-blocking-pod

    - name: create-e2e-worker-small-instanceclass
      try:
        - description: Clone YandexInstanceClass 'worker' as 'e2e-worker-small' with reduced specs
          script:
            timeout: 60s
            content: |
              set -eu
              kubectl get yandexinstanceclass worker -o json | \
                jq '{
                  apiVersion: .apiVersion,
                  kind: .kind,
                  metadata: { name: "e2e-worker-small" },
                  spec: (.spec | .cores = 2 | .memory = 4096 | .diskSizeGB = 30)
                }' | kubectl apply -f -
            check:
              ($error == null): true
      cleanup:
        - description: Delete YandexInstanceClass e2e-worker-small
          delete:
            ref:
              apiVersion: deckhouse.io/v1alpha1
              kind: YandexInstanceClass
              name: e2e-worker-small

    - name: apply-nodegroup
      try:
        - description: Apply NodeGroup e2e-safe-to-evict manifest
          apply:
            file: ../common/manifests/nodegroup-safe-to-evict-yandex.yaml
      cleanup:
        - description: Delete NodeGroup e2e-safe-to-evict
          delete:
            ref:
              apiVersion: deckhouse.io/v1
              kind: NodeGroup
              name: e2e-safe-to-evict

    - name: assert-mcm-cluster-autoscaler-ready
      try:
        - description: Wait for the cluster-autoscaler Deployment with the mcm provider to serve the test NodeGroups
          script:
            timeout: 360s
            content: |
              set -eu
              # The test NodeGroups carry node.deckhouse.io/use-mcm. On a provider that also supports
              # CAPI (Deckhouse 1.77+), Deckhouse runs them in a separate cluster-autoscaler-mcm
              # Deployment; on older releases the only cluster-autoscaler runs with mcm.
              for i in $(seq 1 60); do
                CA_DEPLOY=$(kubectl get deployments -n d8-cloud-instance-manager -o json | \
                  jq -r '[.items[] | select([.spec.template.spec.containers[].args[]?] | index("--cloud-provider=mcm"))][0].metadata.name // empty')
                if [ -n "$CA_DEPLOY" ]; then
                  CA_ARGS=$(kubectl get deployment "$CA_DEPLOY" -n d8-cloud-instance-manager \
                    -o jsonpath='{.spec.template.spec.containers[0].args}')
                  if echo "$CA_ARGS" | grep -qE "[.-]e2e-safe-to-evict-"; then
                    kubectl rollout status deployment "$CA_DEPLOY" -n d8-cloud-instance-manager --timeout=120s
                    echo "cluster-autoscaler with the mcm provider: $CA_DEPLOY"
                    exit 0
                  fi
                fi
                sleep 5
              done
              echo "No cluster-autoscaler Deployment with --cloud-provider=mcm serves the test NodeGroups"
              kubectl get deployments -n d8-cloud-instance-manager
              # Deckhouse 1.77+ reports the engine of each NodeGroup; the test groups must be MCM.
              kubectl get nodegroups -o custom-columns='NAME:.metadata.name,ENGINE:.status.engine' || true
              exit 1
            check:
              ($error == null): true

    - name: restart-cluster-autoscaler
      try:
        - description: Rollout restart the mcm cluster-autoscaler and wait for readiness
          script:
            timeout: 180s
            content: |
              set -eu
              CA_DEPLOY=$(kubectl get deployments -n d8-cloud-instance-manager -o json | \
                jq -r '[.items[] | select([.spec.template.spec.containers[].args[]?] | index("--cloud-provider=mcm"))][0].metadata.name // empty')
              kubectl rollout restart deployment "$CA_DEPLOY" -n d8-cloud-instance-manager
              kubectl rollout status deployment "$CA_DEPLOY" -n d8-cloud-instance-manager --timeout=120s
            check:
              ($error == null): true

    - name: wait-for-ca-initialization
      try:
        - description: Sleep 15s for CA initialization
          sleep:
            duration: 15s

    - name: apply-deployment
      try:
        - description: Apply Deployment to trigger scale-up
          apply:
            file: ../common/manifests/deployment-safe-to-evict.yaml
      cleanup:
        - description: Delete e2e-nginx Deployment
          delete:
            ref:
              apiVersion: apps/v1
              kind: Deployment
              name: e2e-nginx

    - name: wait-for-deckhouse-processing
      try:
        - description: Sleep 30s for Deckhouse reconciliation
          sleep:
            duration: 30s

    - name: assert-pods-running
      try:
        - description: Wait until Deployment e2e-nginx has 1 ready replica
          script:
            timeout: 16m
            content: |
              set -u
              # Poll with kubectl instead of a chainsaw assert: an assert stops at the first failed API
              # request, so a single transient error would end a wait that lasts minutes.
              READY=0
              for i in $(seq 1 180); do
                READY=$(kubectl get deployment e2e-nginx -n "$NAMESPACE" \
                  -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)
                if [ "${READY:-0}" -ge 1 ]; then
                  exit 0
                fi
                sleep 5
              done
              echo "Deployment e2e-nginx has ${READY:-0}/1 ready replica after 15 minutes"
              kubectl get pods -n "$NAMESPACE" -o wide || true
              exit 1
            check:
              ($error == null): true
      catch:
        - description: Collect test namespace events on failure
          events: {}
        - description: Collect d8-cloud-instance-manager events on failure
          events:
            namespace: d8-cloud-instance-manager
        - description: Collect CA logs on failure
          podLogs:
            namespace: d8-cloud-instance-manager
            selector: app in (cluster-autoscaler, cluster-autoscaler-mcm)

    - name: apply-blocking-pod
      try:
        - description: Create standalone pod with safe-to-evict annotation
          apply:
            file: ../common/manifests/pod-blocking-safe-to-evict.yaml
      cleanup:
        - description: Delete blocking pod
          script:
            timeout: 30s
            content: |
              kubectl delete pod -n "$NAMESPACE" e2e-blocking-pod --ignore-not-found
            check:
              ($error == null): true

    - name: wait-for-blocking-pod-running
      try:
        - description: Wait for blocking pod to be scheduled and running
          script:
            timeout: 120s
            content: |
              set -eu
              for i in $(seq 1 24); do
                PHASE=$(kubectl get pod -n "$NAMESPACE" e2e-blocking-pod \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
                if [ "$PHASE" = "Running" ]; then
                  exit 0
                fi
                sleep 5
              done
              echo "Timed out waiting for blocking pod to be Running"
              exit 1
            check:
              ($error == null): true
        - description: Assert blocking pod runs on the test node
          script:
            timeout: 30s
            content: |
              set -eu
              NODE=$(kubectl get pod -n "$NAMESPACE" e2e-blocking-pod -o jsonpath='{.spec.nodeName}')
              if [ "$(kubectl get node "$NODE" -o jsonpath='{.metadata.labels.app}')" != "e2e-autoscaler-test" ]; then
                echo "Blocking pod runs on $NODE, not on the test node"
                exit 1
              fi
            check:
              ($error == null): true
        - description: Assert a node outside the test NodeGroup can host the blocking pod
          script:
            timeout: 30s
            content: |
              set -eu
              # CA removes the test node only if its scale-down simulation can place the pod elsewhere:
              # look for a Ready, schedulable non-test node whose taints the pod tolerates.
              HOSTS=$(kubectl get nodes -o json | jq -r '[.items[]
                | select(.metadata.labels.app != "e2e-autoscaler-test")
                | select(.spec.unschedulable != true)
                | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))
                | select(all(.spec.taints[]?; .effect == "PreferNoSchedule"
                    or (.key == "dedicated" and .value == "safe-to-evict" and .effect == "NoExecute")))
                | .metadata.name] | join(" ")')
              if [ -z "$HOSTS" ]; then
                echo "No node outside the test NodeGroup can host the blocking pod, so CA cannot remove the test node"
                kubectl get nodes -o custom-columns=NAME:.metadata.name,UNSCHEDULABLE:.spec.unschedulable,TAINTS:.spec.taints
                exit 1
              fi
              echo "Nodes that can host the blocking pod after scale-down: $HOSTS"
            check:
              ($error == null): true

    - name: delete-deployment-trigger-scale-down
      try:
        - description: Delete the Deployment to make the node underutilized
          delete:
            ref:
              apiVersion: apps/v1
              kind: Deployment
              name: e2e-nginx

    - name: assert-scale-down-completes
      try:
        - description: Wait for node to be removed (scale-down despite standalone pod)
          script:
            timeout: 1200s
            content: |
              set -eu
              for i in $(seq 1 120); do
                NODES=$(kubectl get nodes -l app=e2e-autoscaler-test --no-headers 2>/dev/null | wc -l | tr -d ' ')
                if [ "$NODES" -eq 0 ]; then
                  echo "Scale-down completed: node removed despite standalone pod presence"
                  exit 0
                fi
                sleep 10
              done
              echo "Timed out waiting for scale-down (node still present after 20 min)"
              exit 1
            check:
              ($error == null): true
      catch:
        - description: Collect CA logs on failure
          podLogs:
            namespace: d8-cloud-instance-manager
            selector: app in (cluster-autoscaler, cluster-autoscaler-mcm)
        - description: Show remaining nodes
          script:
            timeout: 30s
            content: |
              kubectl get nodes -l app=e2e-autoscaler-test -o wide 2>/dev/null || true
              kubectl get pods -n "$NAMESPACE" -o wide 2>/dev/null || true

    - name: assert-no-test-nodes
      try:
        - description: Assert no nodes exist with label app=e2e-autoscaler-test
          error:
            file: ../common/asserts/assert-no-test-nodes.yaml
