apiVersion: deckhouse.io/v1
kind: NodeGroup
metadata:
  name: e2e-safe-to-evict
  annotations:
    # Run the group on MCM even where the provider also supports CAPI.
    node.deckhouse.io/use-mcm: "true"
spec:
  cloudInstances:
    classReference:
      kind: YandexInstanceClass
      name: e2e-worker-small
    maxPerZone: 1
    minPerZone: 0
  nodeType: CloudEphemeral
  nodeTemplate:
    labels:
      app: e2e-autoscaler-test
    taints:
      - key: dedicated
        value: "safe-to-evict"
        effect: NoExecute
