apiVersion: v1
kind: Pod
metadata:
  name: e2e-blocking-pod
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.9
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
  affinity:
    nodeAffinity:
      # Preferred, not required: CA removes the test node only if its scale-down simulation
      # can place the pod on another node, so the pod must also fit outside the test NodeGroup.
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - e2e-autoscaler-test
  tolerations:
    - key: dedicated
      operator: Equal
      value: "safe-to-evict"
      effect: NoExecute
