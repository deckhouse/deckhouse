apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: e2e-nginx
  template:
    metadata:
      labels:
        app: e2e-nginx
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 1Gi
            limits:
              ephemeral-storage: 1Gi
      nodeSelector:
        node.deckhouse.io/group: e2e-worker-zones
      affinity:
        # One pod per node, so the scale-up needs three nodes. No zone spread on purpose: placing
        # them in different zones is left to --balance-similar-node-groups, which is under test.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - e2e-nginx
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: dedicated
          operator: Equal
          value: "zones"
          effect: NoExecute
