apiVersion: deckhouse.io/v1
kind: NodeGroup
metadata:
  name: e2e-worker-ephemeral
spec:
  cloudInstances:
    classReference:
      kind: DVPInstanceClass
      name: e2e-worker-ephemeral
    maxPerZone: 1
    minPerZone: 0
  nodeType: CloudEphemeral
  nodeTemplate:
    labels:
      app: e2e-autoscaler-test
    taints:
      - key: dedicated
        value: "ephemeral"
        effect: NoExecute
