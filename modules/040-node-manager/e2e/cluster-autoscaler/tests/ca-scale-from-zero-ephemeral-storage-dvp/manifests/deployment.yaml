apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-nginx
  template:
    metadata:
      labels:
        app: e2e-nginx
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            # The ephemeral-storage request is the point of the test: without the
            # ephemeral-disk annotation the template node has none, and the pod fails
            # NodeResourcesFit there.
            requests:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 1Gi
            limits:
              ephemeral-storage: 1Gi
      nodeSelector:
        node.deckhouse.io/group: e2e-worker-ephemeral
      tolerations:
        - key: dedicated
          operator: Equal
          value: "ephemeral"
          effect: NoExecute
