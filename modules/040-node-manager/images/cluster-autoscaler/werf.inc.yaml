{{- $version_map := include "get_oss_version_map_by_id_and_condition_key" (list "cluster-autoscaler" "k8s" $) | fromYaml }}
{{- range $key, $value := $version_map }}
  {{- $image_version := toString $key | replace "." "-" }}
  {{- $clusterAutoscalerVersion := toString $value }}
  {{- if $clusterAutoscalerVersion }}
    {{- /* Patches are kept per cluster-autoscaler minor, which may lag behind the Kubernetes minor (e.g. v1.35.x is built for 1.36). */ -}}
    {{- $semver := semver $clusterAutoscalerVersion }}
    {{- $patch_version := printf "%d.%d" $semver.Major $semver.Minor }}
    {{- $patches := (printf "/%smodules/%s-%s/images/%s" $.ModulePath $.ModulePriority $.ModuleName $.ImageName) }}
    {{- $patch := false }}
    {{- range $path, $_ := $.Files.Glob (printf "%s/patches/%s/*.patch" $patches $patch_version) }}
      {{- $patch = true }}
    {{- end }}
    {{- /* Since v1.36 gardener registers the mcm provider only under the "mcm" build tag (cloudprovider/router); clusterapi still comes from router_all.go. */ -}}
    {{- $buildTags := "" }}
    {{- if semverCompare ">=1.36" $clusterAutoscalerVersion }}
      {{- $buildTags = "-tags mcm " }}
    {{- end }}

---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}-src-artifact
from: {{ index $.Images "builder/src" }}
final: false
git:
- url: {{ $.SOURCE_REPO }}/gardener/autoscaler.git
  tag: {{ $clusterAutoscalerVersion }}
  add: /
  to: /tmp/autoscaler
  stageDependencies:
    install: ['**/*']
    {{- if $patch }}
- add: {{ $patches }}/patches/{{ $patch_version }}
  to: /patches
  stageDependencies:
    install:
    - '**/*'
    {{- end }}
shell:
  install:
  - mkdir -p /tmp/autoscaler
  - cd /tmp/autoscaler
    {{- if $patch }}
  - git apply /patches/*.patch --verbose
    {{- end }}
  - mv ./cluster-autoscaler/* /src
  - rm -rf /tmp/autoscaler /src/vendor
  - rm -rf /src/cloudprovider/azure/test
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
from: {{ index $.Images "builder/golang" }}
final: false
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" $ }}
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
shell:
  install:
  - cd /src
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
  - go build {{ $buildTags }}-ldflags='-s -w -extldflags "-static"' -o cluster-autoscaler
  - echo "{{ trimPrefix "v" $clusterAutoscalerVersion }}-flant" > VERSION
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: common/distroless
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /src
  to: /
  includePaths:
  - cluster-autoscaler
  - VERSION
  before: setup
imageSpec:
  config:
    env: { "container": "docker" }
    entrypoint: ["/cluster-autoscaler"]
  {{- end }}
---
{{- include "vex mitigation" (list $ (printf "%s/%s-%s" $.ModuleName $.ImageName $image_version)) }}
{{- end }}
