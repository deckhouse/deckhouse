# TEST FIXTURE. Minimal ModuleSource CRD: the NodeConfig controller watches this kind (a source's
# registry certificate authority becomes a route of spec.registry.upstreams), so every envtest
# manager needs the CRD present for that watch to start. The real one ships with Deckhouse
# (deckhouse-controller/crds/module-source.yaml). Cluster-scoped, schema-free on purpose.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modulesources.deckhouse.io
spec:
  group: deckhouse.io
  names:
    kind: ModuleSource
    listKind: ModuleSourceList
    plural: modulesources
    singular: modulesource
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
