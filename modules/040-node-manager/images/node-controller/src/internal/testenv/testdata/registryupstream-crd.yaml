# TEST FIXTURE. Minimal RegistryUpstream CRD: the NodeConfig controller watches this kind (the
# routes of spec.registry.upstreams come from it), so every envtest manager needs the CRD present
# for that watch to start. The real one is modules/038-registry/crds/registryupstream.yaml.
# Cluster-scoped, schema-free on purpose; the status subresource is what the controller writes.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: registryupstreams.deckhouse.io
spec:
  group: deckhouse.io
  names:
    kind: RegistryUpstream
    listKind: RegistryUpstreamList
    plural: registryupstreams
    singular: registryupstream
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
