apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VCDCluster
metadata:
  name: test-vapp
  namespace: d8-cloud-instance-manager
  labels:
    app: capcd-controller-manager
    heritage: deckhouse
    module: node-manager
spec:
  site: https://vcd.example
  org: test-org
  ovdc: test-ovdc
  ovdcNetwork: test-network
  useAsManagementCluster: false
  userContext:
    secretRef:
      name: capi-user-credentials
      namespace: d8-cloud-instance-manager
