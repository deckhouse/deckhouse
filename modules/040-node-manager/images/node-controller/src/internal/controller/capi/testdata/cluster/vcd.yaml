apiVersion: v1
kind: Secret # gitleaks:allow -- test fixture with placeholder credentials
metadata:
  name: capi-user-credentials
  namespace: d8-cloud-instance-manager
  labels:
    app: capcd-controller-manager
    heritage: deckhouse
    module: node-manager
type: Opaque
data:
  username: user
  password: pass
  refreshToken: token
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VCDCluster
metadata:
  name: test-vapp
  namespace: d8-cloud-instance-manager
  labels:
    app: capcd-controller-manager
    heritage: deckhouse
    module: node-manager
spec:
  site: https://vcd.example
  org: test-org
  ovdc: test-ovdc
  ovdcNetwork: test-network
  useAsManagementCluster: false
  userContext:
    secretRef:
      name: capi-user-credentials
      namespace: d8-cloud-instance-manager
