# TEST FIXTURE. Minimal DVPInstanceClass CRD: provider-owned in production, needed here so
# the derived-status checks can resolve and list the instance class kind. Schema-free.
#
# Two served versions on purpose. Real InstanceClass CRDs serve v1alpha1 and v1 side by side, and
# which one a read lands on decides the instance-class checksum; the version-pinning spec needs a
# kind where that choice is real. Storage stays v1alpha1, as in the DVP provider this fixture
# imitates.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dvpinstanceclasses.deckhouse.io
spec:
  group: deckhouse.io
  names:
    kind: DVPInstanceClass
    listKind: DVPInstanceClassList
    plural: dvpinstanceclasses
    singular: dvpinstanceclass
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
    - name: v1
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
