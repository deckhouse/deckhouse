# TEST FIXTURE. Minimal InstanceClass CRD standing in for a provider-owned one, so the consumer
# sync has a registered kind to write status.nodeGroupConsumers on. Schema-free.
#
# No `subresources` section, exactly like every real provider's InstanceClass: the status is part
# of the main resource, and a patch of the status subresource would not reach it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: d8testinstanceclasses.deckhouse.io
spec:
  group: deckhouse.io
  names:
    kind: D8TestInstanceClass
    listKind: D8TestInstanceClassList
    plural: d8testinstanceclasses
    singular: d8testinstanceclass
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
