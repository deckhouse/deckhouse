---
image: {{ .ModuleName }}/{{ .ImageName }}
from: common/distroless
imageSpec:
  config:
    entrypoint: ["/node-controller"]
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /node-controller
  to: /node-controller
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-crds-artifact
  add: /crds
  to: /crds
  before: setup
{{- include "image mount points" . }}
---
image: {{ .ModuleName }}/{{ $.ImageName }}-src-artifact
from: {{ index $.Images "builder/src" }}
final: false
git:
- add: /{{ $.ModulePath }}modules/040-{{ .ModuleName }}/images/{{ .ImageName }}/src
  to: /src
  excludePaths:
  - "**/*.md"
  - "**/*.yaml"
  - hack
- add: /{{ $.ModulePath }}go_lib/dependency/k8s/drain
  to: /go_lib/dependency/k8s/drain
  includePaths:
  - '**/*.go'
  - '**/*.mod'
  - '**/*.sum'
# The registry client the OS image root hash is read with. It is a separate module
# replaced by a relative path, so the build needs the sources here: the destination
# matches what that path resolves to from /src, the same way the drain module above
# does it.
- add: /{{ $.ModulePath }}pkg/registry
  to: /pkg/registry
  includePaths:
  - '**/*.go'
  - '**/*.mod'
  - '**/*.sum'
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
- from: {{ .ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
- from: {{ .ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /go_lib/dependency/k8s/drain
  to: /go_lib/dependency/k8s/drain
  before: install
- from: {{ .ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /pkg/registry
  to: /pkg/registry
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -o /node-controller cmd/main.go
  - chown 64535:64535 /node-controller
  - chmod 0700 /node-controller
---
image: {{ .ModuleName }}/{{ .ImageName }}-crds-artifact
from: {{ index $.Images "builder/src" }}
final: false
git:
- add: /{{ $.ModulePath }}modules/040-{{ .ModuleName }}/images/{{ .ImageName }}/crds
  to: /crds
  includePaths:
  - "*.yaml"
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
