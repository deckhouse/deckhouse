{{- $version := "v0.1.12" }}
{{- $kernelVersion := "v6.12.85-lvc19-signed" }}
{{- if ne $.Env "CSE" }}
---
# The four files a boot slot consists of, and nothing else. The node fetches an
# artifact as one layer, so the payload has to be the whole of it: the upstream
# image carries werf's own leftovers in trailing layers, and an agent reading the
# last layer got 167 bytes of them instead of the OS.
#
# efi.img is deliberately left behind: an update replaces the root, not the ESP,
# and nothing in this repository reads it.
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "builder/scratch" }}
import:
- from: dev-registry.deckhouse.io/container-factory/engine:{{ $version }}
  add: /
  to: /
  includePaths:
  - rootfs.erofs
  - rootfs.verity
  - rootfs.roothash
  - rootfs.roothash.p7s
  before: setup
imageSpec:
  config:
    labels: { "distro": "deckhouse-engine", "version": "{{ $version }}", "type": "rootfs" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-nocloud-qcow2
from: {{ index $.Images "builder/scratch" }}
import:
- from: dev-registry.deckhouse.io/container-factory/engine:{{ $version }}-nocloud-qcow2
  add: /disk
  to: /disk
  before: setup
imageSpec:
  config:
    labels: { "distro": "deckhouse-engine", "version": "{{ $version }}", "type": "nocloud-qcow2" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-metal-iso
from: {{ index $.Images "builder/scratch" }}
import:
- from: dev-registry.deckhouse.io/container-factory/engine:{{ $version }}-metal-iso
  add: /disk
  to: /disk
  before: setup
imageSpec:
  config:
    labels: { "distro": "deckhouse-engine", "version": "{{ $version }}", "type": "metal-iso" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ .ModuleName }}/kernel-{{$kernelVersion}}-devel
from: {{ index $.Images "builder/scratch" }}
import:
- from: dev-registry.deckhouse.io/container-factory/kernel:{{$kernelVersion}}-devel
  add: /src
  to: /src
  before: setup
imageSpec:
  config:
    labels: { "distro": "deckhouse-engine", "version": "{{ $version }}", "type": "kernel-devel" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
{{- end }}
