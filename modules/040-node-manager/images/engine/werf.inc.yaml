{{- $version := "v0.1.11" }}
{{- if ne $.Env "CSE" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
final: false
from: dev-registry.deckhouse.io/container-factory/engine:{{ $version }}
---
# The four files a boot slot consists of, and nothing else. The node fetches an
# artifact as one layer, so the payload has to be the whole of it: the upstream
# image carries werf's own leftovers in trailing layers, and an agent reading the
# last layer got 167 bytes of them instead of the OS.
#
# efi.img is deliberately left behind: an update replaces the root, not the ESP,
# and nothing in this repository reads it.
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "builder/scratch" }}
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /
  to: /
  includePaths:
  - rootfs.erofs
  - rootfs.verity
  - rootfs.roothash
  - rootfs.roothash.p7s
  before: setup
imageSpec:
  config:
    labels: { "distro": "deckhouse-engine", "version": "{{ $version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
# The bootable media of the same build: an ISO for bare metal and a nocloud qcow2
# for virtual machines. Republished here so an installation takes them from the
# platform registry it already has credentials and a mirror for.
image: {{ .ModuleName }}/{{ .ImageName }}-metal-iso-artifact
final: false
from: dev-registry.deckhouse.io/container-factory/engine:{{ $version }}-metal-iso
---
# /disk is not ours to choose: that is where DVP looks for the disk file when a
# VirtualImage names a container image as its source.
image: {{ .ModuleName }}/{{ .ImageName }}-metal-iso
from: {{ index $.Images "builder/scratch" }}
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-metal-iso-artifact
  add: /disk
  to: /disk
  includePaths:
  - metal.iso
  before: setup
imageSpec:
  config:
    labels: { "distro": "deckhouse-engine", "version": "{{ $version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-nocloud-qcow2-artifact
final: false
from: dev-registry.deckhouse.io/container-factory/engine:{{ $version }}-nocloud-qcow2
---
image: {{ .ModuleName }}/{{ .ImageName }}-nocloud-qcow2
from: {{ index $.Images "builder/scratch" }}
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-nocloud-qcow2-artifact
  add: /disk
  to: /disk
  includePaths:
  - nocloud.qcow2
  before: setup
imageSpec:
  config:
    labels: { "distro": "deckhouse-engine", "version": "{{ $version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
{{- end }}
