{{- $version := "v0.1.12-pre1" }}
{{- $kernelVersion := "v6.12.85-lvc19-signed" }}
{{- /*
  The engine release tags carry io.deckhouse.engine.rootfs.roothash. It survives
  inheritance - removeLabels in werf.yaml names what it strips rather than taking
  everything - so the images below that inherit directly carry it.

  The rootfs image is the exception and is repacked instead, for the reason next to
  it. Losing the label there costs nothing: the node controller reads the hash out
  of the artifact, which is what that image is. See engine/docs/os-image-identity.md.
*/ -}}
{{- if ne $.Env "CSE" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: dev-registry.deckhouse.io/container-factory/engine:{{ $version }}
---
# The four files a boot slot consists of, and nothing else. The node fetches an
# artifact as ONE layer - nodelet takes the last layer of the manifest
# (internal/registry/direct.go, resolveLayer) - so the payload has to be the whole
# of it. Inheriting from the engine image directly leaves werf's own leftovers in
# the trailing layers, and the agent downloads those instead of the root: 167 bytes
# the first time this was found, 169 the second, when this image was built with
# `from:` for a while so that it would inherit a label.
#
# Repacking costs that label, and costs nothing else: the node controller reads the
# root hash out of the artifact, which is precisely what this image is.
#
# efi.img is deliberately left behind: an update replaces the root, not the ESP,
# and nothing in this repository reads it.
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "builder/scratch" }}
import:
- image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /
  to: /
  includePaths:
  - rootfs.erofs
  - rootfs.verity
  - rootfs.roothash
  - rootfs.roothash.p7s
  before: setup
imageSpec:
  config:
    labels: { "distro": "deckhouse-engine", "version": "{{ $version }}", "type": "rootfs" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-nocloud-qcow2
from: dev-registry.deckhouse.io/container-factory/engine:{{ $version }}-nocloud-qcow2
imageSpec:
  config:
    labels: { "distro": "deckhouse-engine", "version": "{{ $version }}", "type": "nocloud-qcow2" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-metal-iso
from: dev-registry.deckhouse.io/container-factory/engine:{{ $version }}-metal-iso
imageSpec:
  config:
    labels: { "distro": "deckhouse-engine", "version": "{{ $version }}", "type": "metal-iso" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ .ModuleName }}/kernel-{{$kernelVersion}}-devel
from: dev-registry.deckhouse.io/container-factory/kernel:{{$kernelVersion}}-devel
imageSpec:
  config:
    labels: { "distro": "deckhouse-engine", "version": "{{ $version }}", "type": "kernel-devel" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
{{- end }}
