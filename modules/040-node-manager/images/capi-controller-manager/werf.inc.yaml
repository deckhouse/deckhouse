{{- $version := include "get_oss_version_by_id" (list "cluster-api" $ )  -}}
---
image: {{ .ModuleName }}/capi-controller-manager
from: common/distroless
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /capi-controller-manager
  to: /capi-controller-manager
  before: setup
{{- include "image mount points" . }}
---
image: {{ .ModuleName }}/{{ $.ImageName }}-src-artifact
from: common/src-artifact
final: false
git:
- url: {{ $.SOURCE_REPO }}/kubernetes-sigs/cluster-api.git
  tag: v{{ $version }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
  - rm -rf hack test
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
- from: {{ .ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  beforeInstall:
  - pm install git
  install:
  - export GOPROXY=$(cat /run/secrets/GOPROXY)
  - cd /src
  - export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
  - go build -trimpath -ldflags "-s -w -extldflags \"-static\"" -o bin/manager sigs.k8s.io/cluster-api
  - mv /src/bin/manager /capi-controller-manager
  - chown 64535:64535 /capi-controller-manager
  - chmod 0700 /capi-controller-manager
