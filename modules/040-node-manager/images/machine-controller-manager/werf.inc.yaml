{{- $mcmVersion := include "get_oss_version_by_id" (list "mcm" $ )  -}}
{{- if ne $.Env "CSE" }}

image: {{ .ModuleName }}/{{ .ImageName }}
from: common/distroless
fromCacheVersion: "2025.04.29.4"
imageSpec:
  config:
    env: { "WORKDIR": "/" }
    entrypoint: ["/machine-controller-manager"]
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /src/machine-controller-manager
  to: /machine-controller-manager
  before: setup
---
image: {{ .ModuleName }}/{{ $.ImageName }}-src-artifact
git:
- url: {{ $.SOURCE_REPO }}/deckhouse/mcm.git
  tag: {{ $mcmVersion }}-flant.26
  add: /
  to: /src
fromCacheVersion: "2026.07.21.1"
from: common/src-artifact
final: false
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
- from: {{ .ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src
  - export GOPROXY=$(cat /run/secrets/GOPROXY) CGO_ENABLED=0 GOOS=linux GOARCH=amd64
  - go build -o machine-controller-manager cmd/machine-controller-manager/controller_manager.go
  - chown 64535:64535 machine-controller-manager
  - chmod 0700 machine-controller-manager
{{- end }}
