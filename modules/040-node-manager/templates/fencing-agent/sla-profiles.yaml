{{- /* Built-in FencingSLAProfile objects shipped by the module. */}}
{{- /* They are cluster-scoped configuration objects with no runtime state, */}}
{{- /* so operators can inspect timings with `kubectl get/describe fencingslaprofiles`. */}}
---
apiVersion: node-manager.deckhouse.io/v1alpha1
kind: FencingSLAProfile
metadata:
  name: critical
  {{- include "helm_lib_module_labels" (list . (dict "app" "fencing-agent" "node-manager.deckhouse.io/builtin-profile" "true")) | nindent 2 }}
spec:
  reactionGoal: 2-3s
  detectionWindowTarget: 0.8-1.2s
  memberlist:
    probeInterval: 100ms
    probeTimeout: 50ms
    suspicionMult: 2
    suspicionMaxTimeoutMult: 6
    indirectChecks: 4
    awarenessMaxMultiplier: 8
    gossipInterval: 100ms
    retransmitMult: 4
    gossipToTheDeadTime: 2s
  fallback:
    heartbeat: 250ms
    ttl: 1s
    kubernetesAPITimeout: 500ms
  rejoin:
    interval: 500ms
    maxInterval: 3s
  evacuation:
    delay: 1.2s
  watchdog:
    feedInterval: 250ms
    timeout: 3s
---
