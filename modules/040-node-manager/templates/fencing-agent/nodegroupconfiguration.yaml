{{- if include "fencing_enabled" . }}
{{- range $name, $ng := .Values.nodeManager.internal.fencing.nodeGroups }}
  {{- if ne $ng.mode "Disabled" }}
---
apiVersion: deckhouse.io/v1alpha1
kind: NodeGroupConfiguration
metadata:
  name: "enable-watchdog-for-nodegroup-{{ $name }}.sh"
  {{- include "helm_lib_module_labels" (list $ (dict "app" "fencing-agent")) | nindent 2 }}
spec:
  weight: 99
  nodeGroups: [{{ $name | quote }}]
  bundles: ["*"]
  content: |
    bb-sync-file /etc/udev/rules.d/60-watchdog.rules - <<"EOF"
    KERNEL=="watchdog*", OWNER="64535", GROUP="root", MODE="0660"
    EOF

    bb-event-on 'nodegroup-watchdog-service-changed' '_nodegroup_watchdog_service'
    function _nodegroup_watchdog_service() {
      systemctl daemon-reload
      systemctl reload-or-restart nodegroup-watchdog.service
      systemctl enable --now nodegroup-watchdog.service
    }

    bb-sync-file /etc/systemd/system/nodegroup-watchdog.service - nodegroup-watchdog-service-changed <<"EOF"
    [Unit]
    Description=Nodegroup watchdog manager service
    After=multi-user.target

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=/opt/deckhouse/bin/nodegroup-watchdog.sh start
    ExecStop=/opt/deckhouse/bin/nodegroup-watchdog.sh stop
    ExecReload=/opt/deckhouse/bin/nodegroup-watchdog.sh start

    [Install]
    WantedBy=multi-user.target
    EOF

    bb-sync-file /opt/deckhouse/bin/nodegroup-watchdog.sh - nodegroup-watchdog-service-changed <<-"EOF"
    #!/bin/bash

    WD="/dev/watchdog"

    ensure_dev() {
      if [ -e "${WD}" ]; then
        chown 64535:root "${WD}"
        chmod 0660 "${WD}"
        return 0
      fi

      local minor
      minor=$(awk '/watchdog$/{print $1}' /proc/misc 2>/dev/null)
      if [ -n "${minor}" ]; then
        mknod "${WD}" c 10 "${minor}"
        chown 64535:root "${WD}"
        chmod 0660 "${WD}"
        return 0
      fi

      return 1
    }

    start_wd() {
      # The refcount is not 0 while the device is open or the timer runs.
      local refs
      refs=$(awk '$1=="softdog"{print $3}' /proc/modules)
      if [ "${refs}" = "0" ]; then
        # The soft_panic value cannot be read from sysfs, so an idle module always reloads.
        rmmod softdog || { echo "ERROR: cannot unload softdog" >&2; exit 1; }
      elif [ -n "${refs}" ]; then
        ensure_dev
        echo "softdog is in use, keeping the loaded module"
        return 0
      fi

      modprobe softdog soft_panic=1

      local retries=0
      while [ ! -e "${WD}" ] && [ "${retries}" -lt 10 ]; do
        sleep 0.5
        retries=$((retries + 1))
      done

      if ! ensure_dev; then
        echo "ERROR: ${WD} was not created after modprobe softdog" >&2
        exit 1
      fi
    }

    stop_wd() {
      while [[ $(lsof "${WD}" 2>/dev/null | tail -n +2 | wc -l) -ge 1 ]]; do
        fuser "${WD}" -k -TERM
        sleep 1
      done
      rmmod softdog
    }


    case "$1" in
        start)
            start_wd
            ;;
        stop)
            stop_wd
            ;;
        *)
            echo "Usage: $0 [start|stop]"
            exit 1
            ;;
    esac
    EOF

    chmod +x /opt/deckhouse/bin/nodegroup-watchdog.sh
  {{- end }}
{{- end }}
{{- end }}
{{- if include "fencing_enabled" . }}
---
apiVersion: deckhouse.io/v1alpha1
kind: NodeGroupConfiguration
metadata:
  name: fencing-agent-socket-directory.sh
  {{- include "helm_lib_module_labels" (list . (dict "app" "fencing-agent")) | nindent 2 }}
spec:
  weight: 99
  nodeGroups: ["*"]
  bundles: ["*"]
  content: |
    # The agent runs as uid 64535 and creates its local API socket in this directory.
    # The kubelet creates a missing hostPath directory as root, so the agent cannot use it.
    # systemd-tmpfiles creates the directory again at each boot, before the kubelet starts.
    bb-sync-file /etc/tmpfiles.d/fencing-agent.conf - <<"EOF"
    d /run/fencing-agent 0700 64535 root -
    EOF

    systemd-tmpfiles --create /etc/tmpfiles.d/fencing-agent.conf
{{- end }}
