{{- if or (.Values.global.discovery.apiVersions | has "deckhouse.io/v1alpha1/SecurityPolicyException") (.Capabilities.APIVersions.Has "deckhouse.io/v1alpha1/SecurityPolicyException") }}
{{- if include "fencing_enabled" . }}
{{- range $name, $ng := .Values.nodeManager.internal.fencing.nodeGroups }}
  {{- $armed := ne $ng.mode "Disabled" }}
---
apiVersion: deckhouse.io/v1alpha1
kind: SecurityPolicyException
metadata:
  name: "fencing-agent-{{ $name }}"
  namespace: d8-cloud-instance-manager
  {{- include "helm_lib_module_labels" (list $ (dict "app" "fencing-agent")) | nindent 2 }}
spec:
  {{- if $armed }}
  securityContext:
    appArmorProfile:
      allowedValues:
        - unconfined
      metadata:
        description: |
          The fencing agent needs the unconfined AppArmor profile to interact with host watchdog and socket resources
    seLinuxOptions:
      allowedValues:
        - level: s0
          type: spc_t
      metadata:
        description: |
          Allow the SELinux label used by the privileged fencing agent container
    privileged:
      allowedValue: true
      metadata:
        description: |
          Privileged mode required for watchdog device access
    allowPrivilegeEscalation:
      allowedValue: true
      metadata:
        description: |
          Required because the container runs in privileged mode
    capabilities:
      allowedValues:
        add:
          - NET_RAW
        drop:
          - ALL
      metadata:
        description: |
          NET_RAW is the only added capability; all other caps dropped
  {{- end }}
  network:
    hostNetwork:
      allowedValue: true
      metadata:
        description: |
          The fencing agent talks to the agents of the other nodes on the node IP
    hostPorts:
      - port: 4250
        protocol: TCP
        metadata:
          description: HTTPS metrics endpoint exposed through kube-rbac-proxy
  volumes:
    types:
      allowedValues:
        - hostPath
      metadata:
        description: hostPath volumes needed for watchdog and socket access
    hostPath:
      allowedValues:
        {{- if $armed }}
        - path: /dev/watchdog
          readOnly: false
          metadata:
            description: Access to the hardware watchdog device for node fencing.
        {{- end }}
        - path: /var/run/fencing-agent
          readOnly: false
          metadata:
            description: Shared host socket directory used by the fencing agent.
  {{- end }}
{{- end }}
{{- end }}
