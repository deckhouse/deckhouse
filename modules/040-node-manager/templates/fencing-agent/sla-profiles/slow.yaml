{{- /* Built-in FencingSLAProfile: a cluster-scoped object with only timings. The spec is a */}}
{{- /* named template, so the checksum of the profile (annotation and agent ConfigMap) is the */}}
{{- /* hash of the very text that the object renders. */}}
---
apiVersion: node-manager.deckhouse.io/v1alpha1
kind: FencingSLAProfile
metadata:
  name: slow
  {{- include "helm_lib_module_labels" (list . (dict "app" "fencing-agent" "node-manager.deckhouse.io/builtin-profile" "true")) | nindent 2 }}
  annotations:
    node-manager.deckhouse.io/fencing-profile-checksum: {{ include "fencing_profile_checksum" "slow" | quote }}
{{ include "fencing_profile_spec_slow" . }}
{{- define "fencing_profile_spec_slow" -}}
spec:
  controlPlaneLostAfter: 20.2s
  memberlist:
    probeInterval: 1s
    probeTimeout: 400ms
    suspicionMult: 4
    suspicionMaxTimeoutMult: 6
    indirectChecks: 3
    awarenessMaxMultiplier: 8
    gossipInterval: 500ms
    gossipNodes: 3
    retransmitMult: 4
    deadNodeReclaimTime: 1s
    gossipToTheDeadTime: 30s
  rejoin:
    interval: 5s
  poll:
    witnessFresherBy: 2.35s
  watchdog:
    timeout: 30s
    feedInterval: 2s
    margin: 1.5s
  heartbeat:
    interval: 5s
    apiTimeout: 10s
  eviction:
    writerWaveInterval: 5s
{{- end }}
