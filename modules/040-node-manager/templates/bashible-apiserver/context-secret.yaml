{{- /* Virtual control plane tenants only. A self-hosted cluster runs a node-controller Pod that
writes this Secret itself; a tenant has none, so bashible_context_vcp.go assembles the context
from the contract the host publishes and this renders it. */ -}}
{{- if and (not .Values.global.deckhouseSelfHosted) .Values.nodeManager.internal.bashibleContext }}
apiVersion: v1
kind: Secret
metadata:
  name: bashible-apiserver-context
  namespace: d8-cloud-instance-manager
  {{- include "helm_lib_module_labels" (list . (dict "app" "bashible-apiserver")) | nindent 2 }}
  annotations:
    node-manager.deckhouse.io/context-owner: node-manager
    node-manager.deckhouse.io/context-revision: {{ .Values.nodeManager.internal.bashibleContext | sha256sum | quote }}
type: Opaque
data:
  input.yaml: {{ .Values.nodeManager.internal.bashibleContext | b64enc | quote }}
{{- end }}
