{{- define "fencing_controller_resources" }}
cpu: 10m
memory: 50Mi
{{- end }}

{{- /* The controller uses the host network and occupies one port on the master. It serves the probes */}}
{{- /* and the metrics on 127.0.0.1, and kube-rbac-proxy serves only the metrics on the node IP. */}}
{{- $port := 4294 }}
{{- $masterOnEngine := dig "fencing" "nodeGroups" "master" "engine" false .Values.nodeManager.internal }}

{{- if include "fencing_enabled" . }}
  {{- if (.Capabilities.APIVersions.Has "autoscaling.k8s.io/v1/VerticalPodAutoscaler") }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: fencing-controller
  namespace: d8-cloud-instance-manager
  {{- include "helm_lib_module_labels" (list . (dict "app" "fencing-controller")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: fencing-controller
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
    - containerName: "fencing-controller"
      minAllowed:
        {{- include "fencing_controller_resources" . | nindent 8 }}
      maxAllowed:
        cpu: 50m
        memory: 128Mi
    {{- include "helm_lib_vpa_kube_rbac_proxy_resources" . | nindent 4 }}
  {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fencing-controller
  namespace: d8-cloud-instance-manager
  {{- include "helm_lib_module_labels" (list . (dict "app" "fencing-controller")) | nindent 2 }}
spec:
  maxUnavailable: {{ include "helm_lib_is_ha_to_value" (list . 1 0) }}
  selector:
    matchLabels:
      app: fencing-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fencing-controller
  namespace: d8-cloud-instance-manager
  {{- include "helm_lib_module_labels" (list . (dict "app" "fencing-controller")) | nindent 2 }}
spec:
  {{- include "helm_lib_deployment_on_master_strategy_and_replicas_for_ha" . | nindent 2 }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: fencing-controller
  template:
    metadata:
      labels:
        app: fencing-controller
        security.deckhouse.io/security-policy-exception: fencing-controller
    spec:
      {{- include "helm_lib_priority_class" (tuple . "system-cluster-critical") | nindent 6 }}
      {{- include "helm_lib_node_selector" (tuple . "master") | nindent 6 }}
      {{- /* The tolerations of helm_lib, without the two taints of a node that does not respond. */}}
      tolerations:
      {{- range (include "helm_lib_tolerations" (tuple . "any-node" "with-uninitialized") | fromYaml).tolerations }}
        {{- if not (has .key (list "node.kubernetes.io/not-ready" "node.kubernetes.io/unreachable")) }}
      {{- list . | toYaml | nindent 6 }}
        {{- end }}
      {{- end }}
      # The scheduler can put the controller on a master that is not ready. When a master fails or is
      # not ready, Kubernetes evicts the controller from it at once, and the controller starts again
      # on another master. No toleration of unreachable with NoSchedule: the scheduler does not use
      # tolerationSeconds, and a pod on a master with a kubelet that does not respond cannot start.
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoSchedule
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 0
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 0
      {{- include "helm_lib_pod_anti_affinity_for_ha" (list . (dict "app" "fencing-controller")) | nindent 6 }}
      {{- include "helm_lib_module_pod_security_context_run_as_user_deckhouse" . | nindent 6 }}
      automountServiceAccountToken: true
      serviceAccountName: fencing-controller
      terminationGracePeriodSeconds: 10
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
      - name: deckhouse-registry
      containers:
      - name: fencing-controller
        image: {{ include "helm_lib_module_image" (list . "fencingController") }}
        imagePullPolicy: IfNotPresent
        {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 8 }}
        command:
        - /fencing-controller
        args:
        - --metrics-bind-address=127.0.0.1:{{ $port }}
        # One replica also takes the Lease: only the leader makes decisions.
        - --leader-elect=true
        env:
        - name: LOG_LEVEL
          value: info
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- /* The local kubernetes-api-proxy sends each new connection only to a healthy API server. */}}
        {{- /* A master has no such proxy on Deckhouse Engine, or when control-plane-manager is disabled */}}
        {{- /* and bashible does not manage the masters. Then the controller uses the ClusterIP. */}}
        {{- if and (not $masterOnEngine) (has "control-plane-manager" .Values.global.enabledModules) }}
        - name: KUBERNETES_SERVICE_HOST
          value: "127.0.0.1"
        - name: KUBERNETES_SERVICE_PORT
          value: "6445"
        {{- end }}
        {{- /* client-go closes an HTTP/2 connection that does not answer a ping. A request on a dead */}}
        {{- /* connection fails in 5 seconds, before the renew deadline of the leader (10 seconds). */}}
        - name: HTTP2_READ_IDLE_TIMEOUT_SECONDS
          value: "3"
        - name: HTTP2_PING_TIMEOUT_SECONDS
          value: "2"
        livenessProbe:
          httpGet:
            host: 127.0.0.1
            path: /healthz
            port: {{ $port }}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            host: 127.0.0.1
            path: /readyz
            port: {{ $port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 12 }}
            {{- include "fencing_controller_resources" . | nindent 12 }}
      - name: kube-rbac-proxy
        {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 8 }}
        image: {{ include "helm_lib_module_common_image" (list . "kubeRbacProxy") }}
        args:
        - "--secure-listen-address=$(KUBE_RBAC_PROXY_LISTEN_ADDRESS):{{ $port }}"
        - "--v=2"
        - "--logtostderr=true"
        - "--stale-cache-interval=1h30m"
        - "--livez-path=/livez"
        env:
        - name: KUBE_RBAC_PROXY_LISTEN_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: KUBE_RBAC_PROXY_CONFIG
          value: |
            upstreams:
            - upstream: http://127.0.0.1:{{ $port }}/metrics
              path: /metrics
              authorization:
                resourceAttributes:
                  namespace: d8-cloud-instance-manager
                  apiGroup: apps
                  apiVersion: v1
                  resource: deployments
                  subresource: prometheus-metrics
                  name: fencing-controller
        ports:
        - containerPort: {{ $port }}
          name: https-metrics
        livenessProbe:
          httpGet:
            path: /livez
            port: {{ $port }}
            scheme: HTTPS
        readinessProbe:
          httpGet:
            path: /livez
            port: {{ $port }}
            scheme: HTTPS
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 12 }}
            {{- include "helm_lib_container_kube_rbac_proxy_resources" . | nindent 12 }}
{{- end }}
