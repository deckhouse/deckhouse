{{- if .Values.nodeManager.internal.cloudProvider.capiClusterName }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: d8-node-manager-capi-cluster-context
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
data:
  clusterMasterEndpoints: {{ .Values.nodeManager.internal.clusterMasterEndpoints | default (list) | toJson | quote }}
  clusterMasterAddresses: {{ .Values.nodeManager.internal.clusterMasterAddresses | default (list) | toJson | quote }}
{{- end }}
