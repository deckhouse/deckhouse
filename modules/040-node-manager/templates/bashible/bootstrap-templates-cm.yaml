{{- /* The bootstrap render moved from helm to node-controller; the templates it
       needs travel through this ConfigMap instead of being baked into the image,
       so a release ships the templates and the controller together. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: bashible-bootstrap-templates
  namespace: d8-cloud-instance-manager
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
data:
  {{- /* toJson, not a block scalar: `|` chomps every trailing newline but one,
         and `indent` pads past `|+`, so only a quoted scalar is byte-exact. */}}
  lib.sh.tpl: {{ .Files.Get "candi/bashible/lib.sh.tpl" | toJson }}
  01-bootstrap-prerequisites.sh.tpl: {{ .Files.Get "candi/bashible/bootstrap/01-bootstrap-prerequisites.sh.tpl" | toJson }}
  bb_node_ip.sh.tpl: {{ .Files.Get "candi/bashible/bb_node_ip.sh.tpl" | toJson }}
  {{- range $path, $_ := .Files.Glob "candi/cloud-providers/*/bashible/bootstrap-networks.sh.tpl" }}
  {{ printf "bootstrap-networks-%s.sh.tpl" (index (splitList "/" $path) 2) }}: {{ $.Files.Get $path | toJson }}
  {{- end }}
binaryData:
  minget: {{ .Files.Get "candi/bashible/bootstrap/minget" | b64enc }}
