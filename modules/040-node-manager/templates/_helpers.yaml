{{- define "machine_controller_manager_enabled" }}
  {{- if not .Values.nodeManager.mcmEmergencyBrake }}
    {{- if .Values.nodeManager.internal.machineControllerManagerEnabled }}
      not empty string
    {{- end }}
  {{- end }}
{{- end }}

{{- define "capi_controller_manager_enabled" }}
  {{- if not .Values.nodeManager.capiEmergencyBrake }}
    {{- if .Values.nodeManager.internal.capiControllerManagerEnabled }}
      not empty string
    {{- end }}
  {{- end }}
{{- end }}

{{- define "cluster_autoscaler_enabled" }}
  {{- if or .Values.nodeManager.internal.deployAutoscaler .Values.nodeManager.internal.deployAutoscalerMCM }}
    not empty string
  {{- else }}
    {{- range $ng := .Values.nodeManager.internal.nodeGroups }}
      {{- if eq $ng.nodeType "CloudEphemeral" }}
        {{- if lt (int $ng.cloudInstances.minPerZone) (int $ng.cloudInstances.maxPerZone) }}
          not empty string
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}

{{- define "cluster_autoscaler_split_mode" }}
  {{- if or (hasKey .Values.nodeManager.internal "deployAutoscaler") (hasKey .Values.nodeManager.internal "deployAutoscalerMCM") (hasKey .Values.nodeManager.internal "autoscalerNodes") (hasKey .Values.nodeManager.internal "autoscalerMCMNodes") }}
    not empty string
  {{- end }}
{{- end }}

{{- define "legacy_cluster_autoscaler_uses_capi" }}
  {{- if hasKey $.Values.nodeManager.internal "cloudProvider" }}
    {{- if or (hasKey $.Values.nodeManager.internal.cloudProvider "vcd") (hasKey $.Values.nodeManager.internal.cloudProvider "zvirt") (hasKey $.Values.nodeManager.internal.cloudProvider "dynamix") (hasKey $.Values.nodeManager.internal.cloudProvider "huaweicloud") (hasKey $.Values.nodeManager.internal.cloudProvider "dvp") (hasKey $.Values.nodeManager.internal.cloudProvider "baremetal") }}
      not empty string
    {{- end }}
  {{- end }}
{{- end }}

{{- define "cluster_autoscaler_mcm_enabled" }}
  {{- if .Values.nodeManager.internal.deployAutoscalerMCM }}
    not empty string
  {{- end }}
{{- end }}

{{- define "cluster_autoscaler_capi_enabled" }}
  {{- if .Values.nodeManager.internal.deployAutoscaler }}
    not empty string
  {{- end }}
{{- end }}

{{- /* The hook normalizes the modes in internal.fencing.nodeGroups: Watchdog is Slow, */}}
{{- /* and a mode this release does not know is Disabled. */}}
{{- /* fencing_enabled is not empty when at least one node group has a mode other than Disabled. */}}
{{- define "fencing_enabled" }}
  {{- range $ng := values (dig "fencing" "nodeGroups" dict .Values.nodeManager.internal) }}
    {{- if ne $ng.mode "Disabled" }}
      not empty string
    {{- end }}
  {{- end }}
{{- end }}

{{- /* fencing_agent_delete_dependencies gives the annotations of a binding of the agent. */}}
{{- /* They tell nelm to delete the binding only after each DaemonSet of the agent is gone. */}}
{{- /* When the module is disabled, a stopping armed agent must write AgentStopping to its */}}
{{- /* Node. If its rights go first, the watchdog stays armed and the node stops. */}}
{{- /* The annotation ID is the node group name: the key must not be longer than 63 characters. */}}
{{- /* external=false: nelm ignores a DaemonSet that is not in the release. */}}
{{- /* Without the DaemonSets there are no annotations. Usage: below metadata, indent 2. */}}
{{- define "fencing_agent_delete_dependencies" }}
  {{- if include "fencing_enabled" . }}
  annotations:
    {{- range $name := keys .Values.nodeManager.internal.fencing.nodeGroups | sortAlpha }}
    werf.io/delete-dependency-{{ $name }}: state=absent,kind=DaemonSet,group=apps,version=v1,name=fencing-agent-{{ $name }},namespace=d8-cloud-instance-manager,external=false
    {{- end }}
  {{- end }}
{{- end }}

{{- /* fencing_gossip_profile is the memberlist profile of the cluster. All fencing agents */}}
{{- /* form one memberlist network and run it with the profile of the fastest mode, because */}}
{{- /* memberlist detects failures correctly only when every member shares its timings. */}}
{{- define "fencing_gossip_profile" }}
  {{- $modes := list }}
  {{- range $ng := values .Values.nodeManager.internal.fencing.nodeGroups }}
    {{- $modes = append $modes $ng.mode }}
  {{- end }}
  {{- if has "Critical" $modes }}
    {{- "critical" }}
  {{- else if has "Normal" $modes }}
    {{- "normal" }}
  {{- else }}
    {{- "slow" }}
  {{- end }}
{{- end }}

{{- define "nvidia_gpu_enabled" }}
  {{- range $ng := .Values.nodeManager.internal.nodeGroups }}
    {{- if ($ng).gpu }}
      not empty string
    {{- end }}
  {{- end }}
{{- end }}

{{- define "nvidia_node_selector" }}
  {{- $context := index . 0 }} {{- /* Template context with .Values, .Chart, etc */ -}}
  {{- $strategy := index . 1 }} {{- /* strategy, one of "gfd" "mig-manager" "device-plugin" "any" */ -}}
  {{- $ng := index . 2 }} {{- /* NodeGroup name  */ -}}

  {{- if eq $strategy "gfd" }}
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: feature.node.kubernetes.io/pci-10de.present
              operator: In
              values:
                - "true"
        - matchExpressions:
            - key: feature.node.kubernetes.io/pci-0302_10de.present
              operator: In
              values:
                - "true"
        - matchExpressions:
            - key: feature.node.kubernetes.io/pci-0300_10de.present
              operator: In
              values:
                - "true"
        - matchExpressions:
            - key: nvidia.com/gpu.deploy.gpu-feature-discovery
              operator: In
              values:
                - "true"
nodeSelector:
  node.deckhouse.io/group: {{ $ng | quote }}
  {{- else if eq $strategy "device-plugin" }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.deploy.device-plugin
                    operator: In
                    values:
                    - "true"
              - matchExpressions:
                  - key: nvidia.com/gpu.count
                    operator: Gt
                    values:
                    - "0"
              - matchExpressions:
                  - key: node.deckhouse.io/group
                    operator: In
                    values:
                    - {{ $ng | quote }}
nodeSelector:
  node.deckhouse.io/group: {{ $ng | quote }}
  {{- else if eq $strategy "mig-manager" }}
nodeSelector:
  nvidia.com/mig.capable: "true"
  {{- else if eq $strategy "any" }}
nodeSelector:
  node.deckhouse.io/gpu: ""
  {{- end }}
{{- end }}

{{- /* The master count, not the HA flag, says whether a replica has anywhere else to go. */ -}}
{{- /* 0 is not one master: no Node has the control-plane label (CSE Managed), pods run on system nodes. */ -}}
{{- define "node_manager_single_master" }}
  {{- if eq (int .Values.global.discovery.clusterMasterCount) 1 }}
    not empty string
  {{- end }}
{{- end }}

{{- /* A single master is the only place to run, so its replica must never be evicted. */ -}}
{{- define "node_manager_master_controller_max_unavailable" }}
  {{- if include "node_manager_single_master" . }}0{{ else }}1{{ end }}
{{- end }}

{{- /* Explicit list, not helm_lib any-node (helm_lib/charts/deckhouse_lib_helm/templates/_node_affinity.tpl): masters-only replicas need no arbiter, autoscaler or custom taints. */ -}}
{{- /* Several masters: unreachable is NoExecute for 60s, so a replica leaves a powered-off master. */ -}}
{{- /* A single master is the only place to run: unreachable is tolerated forever, unschedulable too. */ -}}
{{- define "node_manager_master_controller_tolerations" }}
tolerations:
- key: node-role.kubernetes.io/master
- key: node-role.kubernetes.io/control-plane
- key: dedicated.deckhouse.io
  operator: Exists
- key: dedicated
  operator: Exists
- key: node.deckhouse.io/bashible-uninitialized
  operator: Exists
  effect: NoSchedule
- key: node.deckhouse.io/uninitialized
  operator: Exists
  effect: NoSchedule
- key: node.deckhouse.io/csi-not-bootstrapped
  operator: Exists
  effect: NoSchedule
- key: node.kubernetes.io/not-ready
- key: node.kubernetes.io/memory-pressure
- key: node.kubernetes.io/disk-pressure
- key: node.kubernetes.io/pid-pressure
- key: node.kubernetes.io/network-unavailable
  {{- if include "node_manager_single_master" . }}
- key: node.kubernetes.io/unreachable
- key: node.kubernetes.io/unschedulable
  operator: Exists
  effect: NoSchedule
  {{- else }}
- key: node.kubernetes.io/unreachable
  operator: Exists
  effect: NoExecute
  tolerationSeconds: 60
  {{- end }}
{{- end }}

{{- /* etcd quorum size, floor(N/2)+1: anti-affinity or hostNetwork allows one replica per master, and this many */ -}}
{{- /* still fit on the masters left when etcd is down to quorum. An even N is a master leaving or joining an odd */ -}}
{{- /* cluster and keeps the count of N+1, so the transition rolls nothing. Without HA or masters discovered, helm_lib decides. */ -}}
{{- define "node_manager_master_controller_strategy_and_replicas" }}
  {{- $masters := int .Values.global.discovery.clusterMasterCount }}
  {{- if or (eq $masters 0) (not (include "helm_lib_ha_enabled" .)) }}
    {{- include "helm_lib_deployment_on_master_strategy_and_replicas_for_ha" . }}
  {{- else }}
replicas: {{ add (div $masters 2) 1 }}
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
  {{- end }}
{{- end }}
