{{- define "machine_controller_manager_enabled" }}
  {{- if not .Values.nodeManager.mcmEmergencyBrake }}
    {{- if .Values.nodeManager.internal.machineControllerManagerEnabled }}
      not empty string
    {{- end }}
  {{- end }}
{{- end }}

{{- define "capi_controller_manager_enabled" }}
  {{- if not .Values.nodeManager.capiEmergencyBrake }}
    {{- if .Values.nodeManager.internal.capiControllerManagerEnabled }}
      not empty string
    {{- end }}
  {{- end }}
{{- end }}

{{- define "cluster_autoscaler_enabled" }}
  {{- if or .Values.nodeManager.internal.deployAutoscaler .Values.nodeManager.internal.deployAutoscalerMCM }}
    not empty string
  {{- else }}
    {{- range $ng := .Values.nodeManager.internal.nodeGroups }}
      {{- if eq $ng.nodeType "CloudEphemeral" }}
        {{- if lt (int $ng.cloudInstances.minPerZone) (int $ng.cloudInstances.maxPerZone) }}
          not empty string
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}

{{- define "cluster_autoscaler_split_mode" }}
  {{- if or (hasKey .Values.nodeManager.internal "deployAutoscaler") (hasKey .Values.nodeManager.internal "deployAutoscalerMCM") (hasKey .Values.nodeManager.internal "autoscalerNodes") (hasKey .Values.nodeManager.internal "autoscalerMCMNodes") }}
    not empty string
  {{- end }}
{{- end }}

{{- define "legacy_cluster_autoscaler_uses_capi" }}
  {{- if hasKey $.Values.nodeManager.internal "cloudProvider" }}
    {{- if or (hasKey $.Values.nodeManager.internal.cloudProvider "vcd") (hasKey $.Values.nodeManager.internal.cloudProvider "zvirt") (hasKey $.Values.nodeManager.internal.cloudProvider "dynamix") (hasKey $.Values.nodeManager.internal.cloudProvider "huaweicloud") (hasKey $.Values.nodeManager.internal.cloudProvider "dvp") }}
      not empty string
    {{- end }}
  {{- end }}
{{- end }}

{{- define "cluster_autoscaler_mcm_enabled" }}
  {{- if .Values.nodeManager.internal.deployAutoscalerMCM }}
    not empty string
  {{- end }}
{{- end }}

{{- define "cluster_autoscaler_capi_enabled" }}
  {{- if .Values.nodeManager.internal.deployAutoscaler }}
    not empty string
  {{- end }}
{{- end }}

{{- define "nvidia_gpu_enabled" }}
  {{- range $ng := .Values.nodeManager.internal.nodeGroups }}
    {{- if ($ng).gpu }}
      not empty string
    {{- end }}
  {{- end }}
{{- end }}

{{- define "nvidia_node_selector" }}
  {{- $context := index . 0 }} {{- /* Template context with .Values, .Chart, etc */ -}}
  {{- $strategy := index . 1 }} {{- /* strategy, one of "gfd" "mig-manager" "device-plugin" "any" */ -}}
  {{- $ng := index . 2 }} {{- /* NodeGroup name  */ -}}

  {{- if eq $strategy "gfd" }}
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: feature.node.kubernetes.io/pci-10de.present
              operator: In
              values:
                - "true"
        - matchExpressions:
            - key: feature.node.kubernetes.io/pci-0302_10de.present
              operator: In
              values:
                - "true"
        - matchExpressions:
            - key: feature.node.kubernetes.io/pci-0300_10de.present
              operator: In
              values:
                - "true"
        - matchExpressions:
            - key: nvidia.com/gpu.deploy.gpu-feature-discovery
              operator: In
              values:
                - "true"
nodeSelector:
  node.deckhouse.io/group: {{ $ng | quote }}
  {{- else if eq $strategy "device-plugin" }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.deploy.device-plugin
                    operator: In
                    values:
                    - "true"
              - matchExpressions:
                  - key: nvidia.com/gpu.count
                    operator: Gt
                    values:
                    - "0"
              - matchExpressions:
                  - key: node.deckhouse.io/group
                    operator: In
                    values:
                    - {{ $ng | quote }}
nodeSelector:
  node.deckhouse.io/group: {{ $ng | quote }}
  {{- else if eq $strategy "mig-manager" }}
nodeSelector:
  nvidia.com/mig.capable: "true"
  {{- else if eq $strategy "any" }}
nodeSelector:
  node.deckhouse.io/gpu: ""
  {{- end }}
{{- end }}

{{- /* helm_lib "with-uninitialized" tolerates node.kubernetes.io/unreachable forever, pinning the replica to a powered-off master. */ -}}
{{- /* Here unreachable is tolerated for NoExecute and 60s only, so a replacement never lands on the dead master. */ -}}
{{- define "node_manager_master_controller_tolerations" }}
{{- include "helm_lib_tolerations" (tuple . "any-node") }}
- key: node.deckhouse.io/bashible-uninitialized
  operator: Exists
  effect: NoSchedule
- key: node.deckhouse.io/uninitialized
  operator: Exists
  effect: NoSchedule
- key: node.deckhouse.io/csi-not-bootstrapped
  operator: Exists
  effect: NoSchedule
- key: node.kubernetes.io/not-ready
- key: node.kubernetes.io/memory-pressure
- key: node.kubernetes.io/disk-pressure
- key: node.kubernetes.io/pid-pressure
- key: node.kubernetes.io/network-unavailable
- key: node.kubernetes.io/unreachable
  operator: Exists
  effect: NoExecute
  tolerationSeconds: 60
{{- end }}
