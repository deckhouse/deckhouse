---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: node-controller-validating-webhook-configuration
  annotations:
    werf.io/deploy-dependency-deployment: state=ready,kind=Deployment,name=node-controller,namespace=d8-cloud-instance-manager
    werf.io/deploy-dependency-service: state=present,kind=Service,name=node-controller-webhook,namespace=d8-cloud-instance-manager
    werf.io/deploy-on: pre-install,pre-upgrade,pre-rollback
    werf.io/track-termination-mode: WaitUntilResourceReady
  {{- include "helm_lib_module_labels" (list . (dict "app" "node-controller")) | nindent 2 }}
webhooks:
- name: nodegroup.validation.node-controller.deckhouse.io
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ .Values.nodeManager.internal.nodeControllerWebhookCert.ca | b64enc }}
    service:
      name: node-controller-webhook
      namespace: d8-cloud-instance-manager
      path: /validate-deckhouse-io-v1-nodegroup
  failurePolicy: Fail
  matchPolicy: Equivalent
  sideEffects: None
  rules:
  - apiGroups:
    - deckhouse.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - nodegroups
    scope: Cluster
- name: nodeuser.validation.node-controller.deckhouse.io
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ .Values.nodeManager.internal.nodeControllerWebhookCert.ca | b64enc }}
    service:
      name: node-controller-webhook
      namespace: d8-cloud-instance-manager
      path: /validate-deckhouse-io-v1-nodeuser
  failurePolicy: Fail
  matchPolicy: Equivalent
  sideEffects: None
  rules:
  - apiGroups:
    - deckhouse.io
    apiVersions:
    - "*"
    operations:
    - CREATE
    - UPDATE
    resources:
    - nodeusers
    scope: Cluster
- name: staticinstance.validation.node-controller.deckhouse.io
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ .Values.nodeManager.internal.nodeControllerWebhookCert.ca | b64enc }}
    service:
      name: node-controller-webhook
      namespace: d8-cloud-instance-manager
      path: /validate-deckhouse-io-v1alpha1-staticinstance
  failurePolicy: Fail
  matchPolicy: Equivalent
  sideEffects: None
  rules:
  - apiGroups:
    - deckhouse.io
    apiVersions:
    - "*"
    operations:
    - CREATE
    - UPDATE
    resources:
    - staticinstances
    scope: Cluster
{{- if (((.Values.global).clusterConfiguration).cloud) }}
- name: instanceclass.validation.node-controller.deckhouse.io
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ .Values.nodeManager.internal.nodeControllerWebhookCert.ca | b64enc }}
    service:
      name: node-controller-webhook
      namespace: d8-cloud-instance-manager
      path: /validate-instanceclass-delete
  failurePolicy: Fail
  matchPolicy: Equivalent
  sideEffects: None
  rules:
  - apiGroups:
    - deckhouse.io
    apiVersions:
    - "*"
    operations:
    - DELETE
    resources:
    - {{ .Values.global.clusterConfiguration.cloud.provider | lower }}instanceclasses
    scope: Cluster
{{- end }}
- name: nodeconfig.validation.node-controller.deckhouse.io
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ .Values.nodeManager.internal.nodeControllerWebhookCert.ca | b64enc }}
    service:
      name: node-controller-webhook
      namespace: d8-cloud-instance-manager
      path: /validate-internal-deckhouse-io-v1alpha1-nodeconfig
  failurePolicy: Fail
  matchPolicy: Equivalent
  sideEffects: None
  matchConditions:
  # This webhook freezes what only the machine knows, against an operator
  # editing it. node-controller renders those same fields onto every node it
  # manages, and a denial of its own write is permanent: the node is never
  # configured again. The same carve-out validation.yaml makes for kubelets.
  - name: exclude-node-controller
    expression: 'request.userInfo.username != "system:serviceaccount:d8-cloud-instance-manager:node-controller"'
  rules:
  - apiGroups:
    - internal.deckhouse.io
    apiVersions:
    - v1alpha1
    operations:
    - UPDATE
    resources:
    - nodeconfigs
    scope: Cluster
- name: nodeextensionrequest.validation.node-controller.deckhouse.io
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ .Values.nodeManager.internal.nodeControllerWebhookCert.ca | b64enc }}
    service:
      name: node-controller-webhook
      namespace: d8-cloud-instance-manager
      path: /validate-deckhouse-io-v1alpha1-nodeextensionrequest
  failurePolicy: Fail
  matchPolicy: Equivalent
  sideEffects: None
  rules:
  - apiGroups:
    - deckhouse.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - nodeextensionrequests
    scope: Cluster
