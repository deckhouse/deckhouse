---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: node-controller-validating-webhook-configuration
  annotations:
    werf.io/deploy-dependency-deployment: state=ready,kind=Deployment,name=node-controller,namespace=d8-cloud-instance-manager
    werf.io/deploy-dependency-service: state=present,kind=Service,name=node-controller-webhook,namespace=d8-cloud-instance-manager
    werf.io/deploy-on: pre-install,pre-upgrade,pre-rollback
    werf.io/track-termination-mode: WaitUntilResourceReady
  {{- include "helm_lib_module_labels" (list . (dict "app" "node-controller")) | nindent 2 }}
webhooks:
- name: nodegroup.validation.node-controller.deckhouse.io
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ .Values.nodeManager.internal.nodeControllerWebhookCert.ca | b64enc }}
    service:
      name: node-controller-webhook
      namespace: d8-cloud-instance-manager
      path: /validate-deckhouse-io-v1-nodegroup
  failurePolicy: Fail
  matchPolicy: Equivalent
  sideEffects: None
  rules:
  - apiGroups:
    - deckhouse.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - nodegroups
    scope: Cluster
- name: nodeuser.validation.node-controller.deckhouse.io
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ .Values.nodeManager.internal.nodeControllerWebhookCert.ca | b64enc }}
    service:
      name: node-controller-webhook
      namespace: d8-cloud-instance-manager
      path: /validate-deckhouse-io-v1-nodeuser
  failurePolicy: Fail
  matchPolicy: Equivalent
  sideEffects: None
  rules:
  - apiGroups:
    - deckhouse.io
    apiVersions:
    - "*"
    operations:
    - CREATE
    - UPDATE
    resources:
    - nodeusers
    scope: Cluster
- name: staticinstance.validation.node-controller.deckhouse.io
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ .Values.nodeManager.internal.nodeControllerWebhookCert.ca | b64enc }}
    service:
      name: node-controller-webhook
      namespace: d8-cloud-instance-manager
      path: /validate-deckhouse-io-v1alpha1-staticinstance
  failurePolicy: Fail
  matchPolicy: Equivalent
  sideEffects: None
  rules:
  - apiGroups:
    - deckhouse.io
    apiVersions:
    - "*"
    operations:
    - CREATE
    - UPDATE
    resources:
    - staticinstances
    scope: Cluster
{{- if (((.Values.global).clusterConfiguration).cloud) }}
- name: instanceclass.validation.node-controller.deckhouse.io
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ .Values.nodeManager.internal.nodeControllerWebhookCert.ca | b64enc }}
    service:
      name: node-controller-webhook
      namespace: d8-cloud-instance-manager
      path: /validate-instanceclass-delete
  failurePolicy: Fail
  matchPolicy: Equivalent
  sideEffects: None
  rules:
  - apiGroups:
    - deckhouse.io
    apiVersions:
    - "*"
    operations:
    - DELETE
    resources:
    - {{ .Values.global.clusterConfiguration.cloud.provider | lower }}instanceclasses
    scope: Cluster
{{- end }}
- name: nodestaticpodrequest.validation.node-controller.deckhouse.io
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ .Values.nodeManager.internal.nodeControllerWebhookCert.ca | b64enc }}
    service:
      name: node-controller-webhook
      namespace: d8-cloud-instance-manager
      path: /validate-deckhouse-io-v1alpha1-nodestaticpodrequest
  failurePolicy: Fail
  matchPolicy: Equivalent
  sideEffects: None
  rules:
  - apiGroups:
    - deckhouse.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - nodestaticpodrequests
    scope: Cluster
{{- /* The setting of the SystemNetwork exists only in these editions. */}}
{{- if has .Values.global.deckhouseEdition (list "EE" "FE" "CSE") }}
- name: systemnetwork.validation.node-controller.deckhouse.io
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ .Values.nodeManager.internal.nodeControllerWebhookCert.ca | b64enc }}
    service:
      name: node-controller-webhook
      namespace: d8-cloud-instance-manager
      path: /validate-deckhouse-io-v1alpha1-moduleconfig-node-manager
  failurePolicy: Fail
  matchPolicy: Equivalent
  sideEffects: None
  timeoutSeconds: 10
  # The check runs only when systemNetworkName gets a new value that is not empty and not null, so a request
  # that does not change the network never depends on node-controller.
  matchConditions:
  - name: system-network-name-changed
    expression: |
      object.metadata.name == 'node-manager' &&
      object.?spec.?settings.?fencing.?systemNetworkFallback.?systemNetworkName.orValue('') != '' &&
      object.?spec.?settings.?fencing.?systemNetworkFallback.?systemNetworkName.orValue('') != null &&
      object.?spec.?settings.?fencing.?systemNetworkFallback.?systemNetworkName.orValue('') !=
        (oldObject == null ? '' : oldObject.?spec.?settings.?fencing.?systemNetworkFallback.?systemNetworkName.orValue(''))
  rules:
  - apiGroups:
    - deckhouse.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - moduleconfigs
    scope: Cluster
{{- end }}
