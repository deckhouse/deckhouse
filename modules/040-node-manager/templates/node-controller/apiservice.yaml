---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.templates.internal.deckhouse.io
  {{- include "helm_lib_module_labels" (list . (dict "app" "node-controller")) | nindent 2 }}
spec:
  caBundle: {{ .Values.nodeManager.internal.nodeControllerWebhookCert.ca | b64enc | quote }}
  group: templates.internal.deckhouse.io
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: node-controller-webhook
    namespace: d8-cloud-instance-manager
    port: 4293
  version: v1alpha1
