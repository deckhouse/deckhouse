apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: node-manager
    rbac.deckhouse.io/aggregate-to-infrastructure-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-cloud-instance-manager
  name: d8:manage:permission:module:node-manager:edit
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - instances
  - instancetypescatalogs
  - nodegroupconfigurations
  - nodegroups
  - nodeusers
  - sshcredentials
  - staticinstances
  - containerdintegritypolicies
  verbs:
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - deckhouse.io
  resourceNames:
  - node-manager
  resources:
  - moduleconfigs
  verbs:
  - create
  - update
  - patch
  - delete
# A rendered template carries a live bootstrap token, so reading one is the
# right to join a machine to the cluster. It belongs with the write verbs, not
# with the read-only role.
- apiGroups:
  - internal.deckhouse.io
  resources:
  - nodeconfigtemplates
  verbs:
  - get
  - list
