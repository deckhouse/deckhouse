apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: node-manager
    rbac.deckhouse.io/aggregate-to-cluster-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.node-manager.edit"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-cloud-instance-manager
  name: d8:system-capability:node-manager:edit
  annotations:
    en.meta.deckhouse.io/title: "Module node-manager: edit configuration"
    ru.meta.deckhouse.io/title: "Модуль node-manager: управление конфигурацией"
    en.meta.deckhouse.io/description: "Manage the node-manager module configuration."
    ru.meta.deckhouse.io/description: "Управление конфигурацией модуля node-manager."
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - instances
  - instancetypescatalogs
  - nodegroupconfigurations
  - nodegroups
  - nodeusers
  - sshcredentials
  - staticinstances
  - containerdintegritypolicies
  - nodeextensionrequests
  verbs:
  - create
  - update
  - patch
  - delete
  - deletecollection
# patch is how an operator approves a Disruption (spec.approved, the only
# field of the spec that can change); update would grant nothing patch does not.
- apiGroups:
  - deckhouse.io
  resources:
  - nodeoperations
  verbs:
  - create
  - patch
  - delete
- apiGroups:
  - deckhouse.io
  resourceNames:
  - node-manager
  resources:
  - moduleconfigs
  verbs:
  - create
  - update
  - patch
  - delete
# A rendered template carries a live bootstrap token, so reading one is the
# right to join a machine to the cluster. It belongs with the write verbs, not
# with the read-only role.
- apiGroups:
  - templates.internal.deckhouse.io
  resources:
  - nodeconfigtemplates
  verbs:
  - get
  - list
