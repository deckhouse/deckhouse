apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: node-manager
    rbac.deckhouse.io/aggregate-to-infrastructure-as: viewer
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-cloud-instance-manager
  name: d8:manage:permission:module:node-manager:view
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - instances
  - instancetypescatalogs
  - nodegroupconfigurations
  - nodegroups
  - nodeoperations
  - nodeusers
  - sshcredentials
  - staticinstances
  - containerdintegritypolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - deckhouse.io
  resourceNames:
  - node-manager
  resources:
  - moduleconfigs
  verbs:
  - get
  - list
  - watch
# The per-node answer to "where did my NodeStaticPodRequest land". Only the
# resource: status.maintenanceToken is masked there and NOT on the status
# subresource, so nodeconfigs/status must never be added here.
- apiGroups:
  - internal.deckhouse.io
  resources:
  - nodeconfigs
  verbs:
  - get
  - list
  - watch
