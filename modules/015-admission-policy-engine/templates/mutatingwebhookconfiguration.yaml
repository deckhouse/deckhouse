{{- if and (.Values.admissionPolicyEngine.internal.bootstrapped) (gt (len .Values.admissionPolicyEngine.internal.trackedMutateResources) 0) }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: d8-admission-policy-engine-config
  annotations:
    werf.io/deploy-dependency-deployment: state=ready,kind=Deployment,name=gatekeeper-controller-manager,namespace=d8-admission-policy-engine
    werf.io/deploy-dependency-service: state=present,kind=Service,name=gatekeeper-webhook-service,namespace=d8-admission-policy-engine
  {{- include "helm_lib_module_labels" (list . (dict "app" "gatekeeper" "control-plane" "controller-manager" "gatekeeper.sh/system" "yes")) | nindent 2 }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ .Values.admissionPolicyEngine.internal.webhook.ca | b64enc | quote }}
    service:
      name: gatekeeper-webhook-service
      namespace: d8-admission-policy-engine
      path: /v1/mutate
  failurePolicy: Ignore
  matchPolicy: Exact
  name: admission-policy-engine.deckhouse.io
  {{/*
    Mutations are scoped the same way validation is: namespaces named `d8-*` and `kube-*` hold the
    components of the platform itself and are never mutated. Selecting them by name replaces the
    former `heritage` label check, which missed `kube-*` because the label is set by the platform
    on its own namespaces only.
  */}}
  matchConditions:
  - name: 'exclude-system-namespaces'
    expression: '!({{ include "system_namespaces_cel" . }})'
  objectSelector: {}
  reinvocationPolicy: IfNeeded
  rules:
  {{- range $trackResource := .Values.admissionPolicyEngine.internal.trackedMutateResources }}
  - apiGroups:
      {{- $trackResource.apiGroups | toYaml | nindent 6 }}
    apiVersions:
    - '*'
    operations:
    - CREATE
    - UPDATE
    resources:
      {{- $trackResource.resources | toYaml | nindent 6 }}
  {{- end }}
  sideEffects: None
  timeoutSeconds: 3
{{- end }}
