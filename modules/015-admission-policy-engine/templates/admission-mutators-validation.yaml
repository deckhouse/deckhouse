# The Assign/AssignMetadata/ModifySet/AssignImage CRDs (crds/gatekeeper/*.yaml) are imported from
# upstream Gatekeeper as-is (see crds/gatekeeper/update.sh and the build-time diff check in
# images/gatekeeper/werf.inc.yaml), so none of the restrictions below can be expressed in the CRD
# schema itself. Gatekeeper's own mutation webhook enforces them anyway, but only *after* the object
# is persisted, with confusing parser errors and, for a missing `match.kinds`, with no error at all
# (see the `deny-mutator-without-match-kinds.deckhouse.io` policy below). These
# ValidatingAdmissionPolicies give the same feedback immediately, at `kubectl apply` time.
#
# Every expression below is guarded with `!has(object.spec) || ...` (or, for
# deny-mutator-without-match-kinds.deckhouse.io, a leading `has(object.spec) && ...`): `spec` is not
# `required` in the vendored CRDs, so a request without it is schema-valid and would otherwise crash
# every expression on `no such key: spec` instead of producing the intended message.
#
# The CEL expressions here are covered by a table test using cel-go directly in
# template_tests/admission_mutators_validation_cel_test.go — keep the two in sync.
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicy
metadata:
  name: "deny-invalid-assign-location.deckhouse.io"
  {{- include "helm_lib_module_labels" (list . (dict "app" "gatekeeper")) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["mutations.gatekeeper.sh"]
        apiVersions: ["v1", "v1alpha1", "v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["assign"]
  validations:
    - expression: |-
        !has(object.spec) || !has(object.spec.location) ||
        !object.spec.location.matches("^\\s*(metadata|\"metadata\"|'metadata')\\s*(\\.|$)")
      message: >-
        spec.location cannot target the "metadata" field (Gatekeeper limitation) - use the
        AssignMetadata resource to add labels or annotations instead
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicyBinding") }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: "deny-invalid-assign-location.deckhouse.io"
  {{- include "helm_lib_module_labels" (list . (dict "app" "gatekeeper")) | nindent 2 }}
spec:
  policyName: "deny-invalid-assign-location.deckhouse.io"
  validationActions: [Deny]
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicy
metadata:
  name: "deny-invalid-assignmetadata-location.deckhouse.io"
  {{- include "helm_lib_module_labels" (list . (dict "app" "gatekeeper")) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["mutations.gatekeeper.sh"]
        apiVersions: ["v1", "v1alpha1", "v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["assignmetadata"]
  validations:
    - expression: |-
        !has(object.spec) || !has(object.spec.location) ||
        object.spec.location.matches("^\\s*(metadata|\"metadata\"|'metadata')\\s*\\.\\s*(labels|annotations|\"labels\"|\"annotations\"|'labels'|'annotations')\\s*\\.\\s*([A-Za-z_-][A-Za-z0-9_-]*|\"(\\\\.|[^\"\\\\])*\"|'(\\\\.|[^'\\\\])*')\\s*$")
      message: >-
        spec.location must be exactly metadata.labels.<key> or metadata.annotations.<key> (an
        unquoted key cannot start with a digit and cannot contain characters other than letters,
        digits, "_" or "-"); if <key> contains such characters (for example a domain-prefixed key
        like app.kubernetes.io/name), wrap it in quotes, e.g. metadata.annotations."app.kubernetes.io/name"
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicyBinding") }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: "deny-invalid-assignmetadata-location.deckhouse.io"
  {{- include "helm_lib_module_labels" (list . (dict "app" "gatekeeper")) | nindent 2 }}
spec:
  policyName: "deny-invalid-assignmetadata-location.deckhouse.io"
  validationActions: [Deny]
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicy
metadata:
  name: "deny-invalid-assignmetadata-value.deckhouse.io"
  {{- include "helm_lib_module_labels" (list . (dict "app" "gatekeeper")) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["mutations.gatekeeper.sh"]
        apiVersions: ["v1", "v1alpha1", "v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["assignmetadata"]
  validations:
    - expression: |-
        !has(object.spec) || !has(object.spec.parameters) || !has(object.spec.parameters.assign) ||
        !has(object.spec.parameters.assign.value) || type(object.spec.parameters.assign.value) == string
      message: >-
        spec.parameters.assign.value must be a plain string for AssignMetadata (Gatekeeper limitation)
        - Kubernetes label and annotation values are strings
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicyBinding") }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: "deny-invalid-assignmetadata-value.deckhouse.io"
  {{- include "helm_lib_module_labels" (list . (dict "app" "gatekeeper")) | nindent 2 }}
spec:
  policyName: "deny-invalid-assignmetadata-value.deckhouse.io"
  validationActions: [Deny]
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicy
metadata:
  name: "deny-invalid-mutator-frommetadata-field.deckhouse.io"
  {{- include "helm_lib_module_labels" (list . (dict "app" "gatekeeper")) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["mutations.gatekeeper.sh"]
        apiVersions: ["v1", "v1alpha1", "v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["assign", "assignmetadata"]
  validations:
    - expression: |-
        !has(object.spec) || !has(object.spec.parameters) || !has(object.spec.parameters.assign) ||
        !has(object.spec.parameters.assign.fromMetadata) ||
        (has(object.spec.parameters.assign.fromMetadata.field) &&
         object.spec.parameters.assign.fromMetadata.field in ["namespace", "name"])
      message: >-
        spec.parameters.assign.fromMetadata requires field to be set to "namespace" or "name"
        (Gatekeeper limitation)
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicyBinding") }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: "deny-invalid-mutator-frommetadata-field.deckhouse.io"
  {{- include "helm_lib_module_labels" (list . (dict "app" "gatekeeper")) | nindent 2 }}
spec:
  policyName: "deny-invalid-mutator-frommetadata-field.deckhouse.io"
  validationActions: [Deny]
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicy
metadata:
  name: "deny-invalid-assignmetadata-externaldata-datasource.deckhouse.io"
  {{- include "helm_lib_module_labels" (list . (dict "app" "gatekeeper")) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["mutations.gatekeeper.sh"]
        apiVersions: ["v1", "v1alpha1", "v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["assignmetadata"]
  validations:
    - expression: |-
        !has(object.spec) || !has(object.spec.parameters) || !has(object.spec.parameters.assign) ||
        !has(object.spec.parameters.assign.externalData) ||
        !has(object.spec.parameters.assign.externalData.dataSource) ||
        object.spec.parameters.assign.externalData.dataSource == "Username"
      message: >-
        spec.parameters.assign.externalData.dataSource only supports "Username" for AssignMetadata
        (Gatekeeper limitation). The field defaults to "ValueAtLocation" when omitted, and that
        default is always rejected here too - set dataSource: Username explicitly, because a metadata
        mutation has no source value at `location` to read
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicyBinding") }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: "deny-invalid-assignmetadata-externaldata-datasource.deckhouse.io"
  {{- include "helm_lib_module_labels" (list . (dict "app" "gatekeeper")) | nindent 2 }}
spec:
  policyName: "deny-invalid-assignmetadata-externaldata-datasource.deckhouse.io"
  validationActions: [Deny]
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicy
metadata:
  name: "deny-mutator-without-match-kinds.deckhouse.io"
  {{- include "helm_lib_module_labels" (list . (dict "app" "gatekeeper")) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["mutations.gatekeeper.sh"]
        apiVersions: ["v1", "v1alpha1", "v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["assign", "assignmetadata", "modifyset", "assignimage"]
  validations:
    - expression: |-
        has(object.spec) && has(object.spec.match) && has(object.spec.match.kinds) && size(object.spec.match.kinds) > 0 &&
        object.spec.match.kinds.all(k,
          has(k.apiGroups) && size(k.apiGroups) > 0 &&
          has(k.kinds) && size(k.kinds) > 0 &&
          !('*' in k.kinds))
      message: >-
        spec.match.kinds is required and must not be empty, and every entry in it must set
        non-empty apiGroups and kinds without a "*" kind (Deckhouse-specific limitation): the
        d8-admission-policy-engine-config MutatingWebhookConfiguration rules are generated only
        from match.kinds across all mutators, resolving apiGroups/kinds through the Kubernetes
        REST mapper, so an entry that doesn't resolve to a concrete resource type silently never
        fires, even though Gatekeeper itself would still treat it as valid
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicyBinding") }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: "deny-mutator-without-match-kinds.deckhouse.io"
  {{- include "helm_lib_module_labels" (list . (dict "app" "gatekeeper")) | nindent 2 }}
spec:
  policyName: "deny-mutator-without-match-kinds.deckhouse.io"
  validationActions: [Deny]
