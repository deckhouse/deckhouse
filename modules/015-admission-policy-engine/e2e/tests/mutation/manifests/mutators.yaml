apiVersion: mutations.gatekeeper.sh/v1
kind: Assign
metadata:
  name: e2e-ape-grace-period
spec:
  applyTo:
    - groups: [""]
      kinds: ["Pod"]
      versions: ["v1"]
  match:
    scope: Namespaced
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["e2e-ape-mutation"]
  location: spec.terminationGracePeriodSeconds
  parameters:
    assign:
      value: 7
---
apiVersion: mutations.gatekeeper.sh/v1
kind: AssignMetadata
metadata:
  name: e2e-ape-label
spec:
  match:
    scope: Namespaced
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["e2e-ape-mutation"]
  location: metadata.labels.e2e-ape-mutated
  parameters:
    assign:
      value: "true"
