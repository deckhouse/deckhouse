- name: admission-policy-engine.boostrap
  rules:
    - alert: D8AdmissionPolicyEngineNotBootstrapped
      expr: d8_admission_policy_engine_not_bootstrapped == 1
      for: 10m
      labels:
        severity_level: "7"
        d8_module: admission-policy-engine
        d8_component: gatekeeper
      annotations:
        plk_protocol_version: "1"
        plk_markup_format: markdown
        summary: Not every ConstraintTemplate of the admission-policy-engine module is ready for 10 minutes.
        description: |-
          Some ConstraintTemplates of the admission-policy-engine module are missing or not processed by Gatekeeper. The constraints of a template are applied only once Gatekeeper has established its CRD.

          On a new installation, the module also renders no webhooks and no policies until every template is ready. In a cluster where the module has already worked, the webhooks and the constraints of the other templates stay in effect.
          
          Steps to troubleshoot:
          
          1. Verify that the module's components are up and running:
          
             ```bash
             d8 k get pods -n d8-admission-policy-engine
             ```
          
          2. Check logs for issues, such as missing constraint templates or incomplete CRD creation:
          
             ```bash
             d8 k logs -n d8-system -lapp=deckhouse --tail=1000 | grep admission-policy-engine
             ```
