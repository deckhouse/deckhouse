spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает операционную политику для кластера.

            Каждый ресурс `OperationPolicy` описывает правила для объектов в кластере.
          properties:
            status:
              properties:
                violations:
                  description: |
                    Сводка нарушений политики, зафиксированных последним циклом аудита.

                    Раздел заполняет модуль один раз за цикл аудита.
                    В нём находятся агрегированные счётчики и короткая выборка нарушений,
                    а полный список доступен в метрике `d8_gatekeeper_exporter_constraint_violations`.
                  properties:
                    lastUpdateTime:
                      description: |
                        Время последнего изменения сводки модулем.

                        Модуль перезаписывает раздел только при изменении его содержимого,
                        поэтому отметка времени не меняется, пока набор нарушений остаётся прежним.
                    total:
                      description: |
                        Общее количество нарушений политики.

                        Счётчик остаётся точным, даже если списки ниже сокращены.
                    truncated:
                      description: |
                        Количество нарушений, которые аудит не зафиксировал.

                        Значение больше нуля означает, что количество нарушений превысило лимит аудита,
                        поэтому `topNamespaces` и `sample` описывают только зафиксированную часть.
                    byEnforcement:
                      description: Количество нарушений в разбивке по действию, которое к ним применяется.
                      properties:
                        deny:
                          description: Количество нарушений, которые блокируют запуск нагрузки.
                        warn:
                          description: Количество нарушений, о которых сообщается без блокировки нагрузки.
                        dryrun:
                          description: Количество нарушений, которые только фиксируются.
                    topNamespaces:
                      description: |
                        Неймспейсы с наибольшим количеством нарушений.

                        Список содержит не более 10 записей и упорядочен по количеству нарушений.
                      items:
                        properties:
                          namespace:
                            description: Имя неймспейса.
                          count:
                            description: Количество нарушений в неймспейсе.
                    sample:
                      description: |
                        Выборка нарушений для предварительного просмотра в интерфейсе.

                        Список содержит не более 10 записей и не является полным отчётом.
                      items:
                        properties:
                          kind:
                            description: Тип объекта, нарушающего политику.
                          namespace:
                            description: Неймспейс объекта, нарушающего политику.
                          name:
                            description: Имя объекта, нарушающего политику.
                          rule:
                            description: Тип ограничения, зафиксировавшего нарушение.
                          enforcementAction:
                            description: Действие, применяемое к нарушению.
                          message:
                            description: Сообщение, поясняющее нарушение.
            spec:
              properties:
                enforcementAction:
                  description: |
                    Действие, которое будет выполнено по результатам проверки ограничений:
                    - `Deny` — запрет;
                    - `Dryrun` — отсутствие действия. Применяется при отладке. Информацию о событии можно посмотреть в Grafana в Dashboard `Security/Admission policy engine`;
                    - `Warn` — аналогично `Dryrun`, но дополнительно к информации о событии будет выведена информация о том, из-за какого ограничения (constraint) был бы запрет действия, если бы вместо `Warn` использовался `Deny`.
                policies:
                  properties:
                    allowedRepos:
                      description: |
                        Список префиксов, которые может иметь образ контейнера.
                    requiredResources:
                      description: |
                        Набор ресурсов, который требуют контейнеры.
                      properties:
                        limits:
                          description: "Список ограничений по выделяемым ресурсам, которые должны соблюдаться (по процессору, памяти или оба ограничения)."
                        requests:
                          description: "Список запросов на выделение ресурсов, которые должны быть выполнены (процессор, память или оба запроса)."
                    disallowedImageTags:
                      description: "Требует, чтобы образы контейнера имели тег, отличный от указанных в списке."
                    disallowedTolerations:
                      description: |
                        Запрещает создание подов с tolerations из указанного списка.

                        Больше информации [в документации Kubernetes](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).

                        Список шаблонов toleration (partial match по указанным полям: key/operator/value/effect).
                    requiredLabels:
                      description: |
                        Список лейблов, которые должен указать объект.
                      properties:
                        labels:
                          items:
                            properties:
                              key:
                                description: >-
                                  Требуемый лейбл.
                              allowedRegex:
                                description: >-
                                  Если указано, то содержит регулярное выражение, которому должно соответствовать значение лейбла. Значение должно содержать хотя бы одно совпадение с регулярным выражением.
                        watchKinds:
                          description: |
                            Список объектов Kubernetes в формате `$apiGroup/$kind` для просмотра лейблов.
                    requiredAnnotations:
                      description: |
                        Список аннотаций, которые должен указать объект.
                      properties:
                        annotations:
                          items:
                            properties:
                              key:
                                description: >-
                                  Требуемая аннотация.
                              allowedRegex:
                                description: >-
                                  Если указано, то содержит регулярное выражение, которому должно соответствовать значение аннотации. Значение должно содержать хотя бы одно совпадение с регулярным выражением.
                        watchKinds:
                          description: |
                            Список объектов Kubernetes в формате `$apiGroup/$kind` для просмотра аннотаций.
                    requiredProbes:
                      description: "Список проб, которые необходимы (например, `readinessProbe` и `livenessProbe`)."
                    maxRevisionHistoryLimit:
                      description: "Максимальное значение для истории ревизий."
                    priorityClassNames:
                      description: "Список возможных классов приоритета."
                    ingressClassNames:
                      description: "Список возможных классов ингресса."
                    storageClassNames:
                      description: "Список возможных классов хранилища."
                    imagePullPolicy:
                      description: "Требуемая политика скачивания образов для контейнеров."
                    checkHostNetworkDNSPolicy:
                      description: "Проверка, что dnsPolicy `ClusterFirstWithHostNet` установлена для подов с `hostNetwork: true`."
                    checkContainerDuplicates:
                      description: "Проверка имен контейнеров и переменных env на наличие дубликатов."
                    replicaLimits:
                      description: "Проверка диапазона разрешенных реплик. Значения включаются в диапазон."
                      properties:
                        minReplicas:
                          description: "Минимально разрешенное количество реплик, включительно."
                        maxReplicas:
                          description: "Максимально разрешенное количество реплик, включительно."
                    gpuResourceRestriction:
                      description: |
                        Ограничивает использование GPU-ресурсов в подах.

                        Поды, запрашивающие GPU-ресурсы, отклоняются, если на неймспейсе не установлен
                        указанный лейбл. Та же проверка выполняется для контроллеров, создающих поды,
                        поэтому контроллер, в шаблоне пода которого запрашиваются GPU-ресурсы, отклоняется
                        при создании и изменении. Проверяются `resources.requests` и `resources.limits` всех
                        контейнеров, init-контейнеров и ephemeral-контейнеров пода.

                        Лейбл неймспейса читается из кеша Gatekeeper. Пока неймспейс отсутствует в этом
                        кеше, например когда неймспейс и под применяются одновременно и неймспейс ещё
                        не попал в кеш, политика запрещает поды, запрашивающие GPU-ресурсы в этом неймспейсе.
                      properties:
                        namespaceLabel:
                          description: "Лейбл, который должен быть установлен на неймспейсе для разрешения использования GPU-ресурсов."
                          properties:
                            key:
                              description: "Ключ лейбла, который должен присутствовать на неймспейсе."
                            value:
                              description: "Ожидаемое значение лейбла."
                        gpuResourcePatterns:
                          description: |
                            Список регулярных выражений, с которыми сопоставляются имена GPU-ресурсов
                            в спецификации пода.

                            Ресурс, имя которого совпадает с любым из указанных шаблонов, считается
                            GPU-ресурсом. Шаблоны не привязываются к границам строки автоматически:
                            шаблон `nvidia.com/gpu` совпадёт и с именем ресурса `not-nvidia.com/gpu`.
                            Используйте `^` и `$`, чтобы сопоставлять имя ресурса целиком.
                match:
                  properties:
                    namespaceSelector:
                      description: Указывает селектор пространства имен для фильтрации объектов.
                      properties:
                        matchNames:
                          description: "Включать только определенный набор пространств имен."
                        excludeNames:
                          description: "Включить все пространства имен, кроме определенного набора."
                        labelSelector:
                          description: |
                            Указывает селектор лейблов для фильтрации пространств имен.

                            Больше информации [в документации](https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/).
                          properties:
                            matchLabels:
                              description: Список лейблов, которые должно иметь пространство имен.
                            matchExpressions:
                              description: Список выражений лейблов для пространств имен.
                    labelSelector:
                      description: |
                        Указывает селектор лейблов для фильтрации подов.

                        Больше информации [в документации](https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/).
                      properties:
                        matchLabels:
                          description: Список лейблов, которые должен иметь под.
                        matchExpressions:
                          description: Список выражений лейблов для подов.
