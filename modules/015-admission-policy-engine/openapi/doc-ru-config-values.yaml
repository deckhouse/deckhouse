type: object
properties:
  podSecurityStandards:
    description: "Настройки политик Pod Security Standards (PSS)."
    properties:
      defaultPolicy:
        description: |
          Определяет политику [Pod Security Standards](https://kubernetes.io/docs/concepts/security/pod-security-standards/) по умолчанию для всех **несистемных** неймспейсов:
          - `Privileged` — политика без ограничений. Данная политика допускает эскалацию привилегий;
          - `Baseline` — политика с минимальными ограничениями, ограничивающая использование эскалаций привилегий;
          - `Restricted` — политика с максимальными ограничениями, соответствующая актуальным рекомендациям по безопасному запуску приложений в кластере.
      enforcementAction:
        description: |
          Действие, которое будет выполнено по результатам проверки ограничений:
          - `Deny` — запрет;
          - `Dryrun` — отсутствие действия. Применяется при отладке. Информацию о событии можно посмотреть в веб-интерфейсе Deckhouse или с помощью `d8 k`;
          - `Warn` — аналогично `Dryrun`, но дополнительно к информации о событии будет выведена информация о том, из-за какого ограничения (constraint) был бы запрет действия, если бы вместо `Warn` использовался `Deny`.

          Действует в прикладных неймспейсах. Неймспейсы с именами `d8-*` и `kube-*` модуль обслуживает сам: нарушение там фиксируется, а нагрузка запускается, если владеющий неймспейсом модуль не включил принудительное применение.
      policies:
        description: "Определяет дополнительные параметры политик"
        properties:
          hostPorts:
            description: "Настройки ограничения HostPort."
            properties:
              knownRanges:
                description: "Список диапазонов портов, которые будут разрешены в привязке hostPort."
      controllerValidation:
        description: |
          Применяет ограничения к контроллерам, создающим поды (Deployment, StatefulSet,
          DaemonSet, Job, CronJob, ReplicationController), в дополнение к подам.

          Установите значение `true` (по умолчанию), чтобы проверять и поды, и контроллеры,
          либо `false` — чтобы проверять только поды и не проверять контроллеры.

          Как сообщается о нарушении в контроллере, задаёт параметр [controllerValidationEnforcement](#parameters-podsecuritystandards-controllervalidationenforcement).

          Параметр задаёт значение по умолчанию для всех ограничений, которые читают спецификацию пода,
          включая созданные из ресурсов OperationPolicy и SecurityPolicy.
          Политика переопределяет его собственной секцией `spec.controllerValidation`.
      controllerValidationEnforcement:
        description: |
          Действие для контроллера, создающего поды, который нарушает политику с `enforcementAction: Deny`.

          - `Warn` — контроллер принимается с предупреждением, а поды, которые он создаёт, запрещаются.
            Значение используется по умолчанию на переходный период, пока рабочие нагрузки приводятся в соответствие с проверкой контроллеров.
          - `Policy` — контроллер проверяется с действием политики, поэтому запрещающая политика запрещает и контроллер.
            После переходного периода это значение станет значением по умолчанию.

          Политика с другим действием сохраняет его для контроллеров: `Warn` предупреждает, а `Dryrun` только фиксирует нарушение.

          Параметр действует для Pod Security Standards и задаёт значение по умолчанию для ресурсов OperationPolicy и SecurityPolicy.
          Политика переопределяет его параметром `spec.controllerValidation.mode`.
          Параметр действует, если [controllerValidation](#parameters-podsecuritystandards-controllervalidation) равен `true`.
      controllerValidationExcludedPolicies:
        description: |
          Правила Pod Security Standards, которые проверяются только на подах.

          Правила называются так же, как параметры [SecurityPolicy](cr.html#securitypolicy),
          в виде которых стандарты опубликованы в объектах `d8-pod-security-baseline` и `d8-pod-security-restricted`.
          Исключённое правило проверяется только на подах в обоих стандартах.
          Параметр действует, если [controllerValidation](#parameters-podsecuritystandards-controllervalidation) имеет значение `true`.

          Некоторые правила проверяются одним ограничением и исключаются вместе: если указано любое правило группы,
          на подах проверяется вся группа. Группы правил: `allowHostPID` с `allowHostIPC`
          и `allowHostNetwork` с `allowedHostPorts`.
  denyVulnerableImages:
    description: |
      Настройки Trivy-провайдера.

      Trivy-провайдер запрещает создание ресурсов Pod, Deployment, StatefulSet и DaemonSet с образами, содержащими уязвимости, в неймспейсах с лейблом `security.deckhouse.io/trivy-provider: ""`.

      Проверяются образы всех контейнеров, включая init-контейнеры и ephemeral-контейнеры. Поэтому подключение ephemeral-контейнера командой `kubectl debug` будет отклонено, если его образ содержит уязвимости недопустимого уровня.

      **Устарело.** Эти настройки были перенесены в модуль `operator-trivy`. Мигрируйте конфигурацию.
    properties:
      enabled:
        description: Включить Trivy-провайдер.
      allowedSeverityLevels:
        description: |
          Список допустимых уровней критичности уязвимости.

          Не будут запрещены образы контейнеров, содержащие только уязвимости указанных уровней.
      storageClass:
        description: |-
          Имя StorageClass, который используется Trivy-провайдером.

          Если значение не задано, будет использоваться StorageClass, заданный в [глобальном параметре `settings.modules.storageClass`](/products/kubernetes-platform/documentation/v1/reference/api/global.html#parameters-modules-storageclass).

          Глобальный параметр `settings.modules.storageClass` применяется только при включении модуля. Изменение глобального параметра при включенном модуле не приведет к перезаказу диска.

          > **Внимание.** Если указать значение, отличное от текущего StorageClass, используемого существующим PersistentVolumeClaim, диск будет перезаказан, и все данные удалятся.

          Если указать `false`, вместо PVC будет принудительно использоваться `emptyDir`.
      registrySecrets:
        description: |
          Список дополнительных секретов для доступа к приватным хранилищам образов контейнеров.

          По умолчанию для загрузки образов для сканирования используется секрет `deckhouse-registry`.
  imageSignatureVerification:
    description: |
      Настройки проверки подписей образов, которая задаётся политикой `verifyImageSignatures` ресурса SecurityPolicy.
    properties:
      registryCredentialsCacheTTLSeconds:
        description: |
          Время в секундах, в течение которого учётные данные приватного хранилища образов, прочитанные из поля `dockerCfg` ресурса SecurityPolicy, хранятся в кеше.

          После изменения `dockerCfg` проверка подписей использует прежние учётные данные, пока не истечёт срок записи в кеше.
          Меньшее значение быстрее применяет новые учётные данные, но чаще читает секрет из Kubernetes API.
