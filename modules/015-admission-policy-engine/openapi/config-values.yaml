# /modules/015-admission-policy-engine/openapi/config-values.yaml
# /ee/cse/modules/015-admission-policy-engine/openapi/config-values.yaml
type: object
properties:
  podSecurityStandards:
    type: object
    default: {}
    description: "Pod Security Standards policy settings (PSS)."
    properties:
      defaultPolicy:
        type: string
        default: Baseline
        description: |
          Sets the default [Pod Security Standards](https://kubernetes.io/docs/concepts/security/pod-security-standards/) policy for all **non-system** namespaces:
          - `Privileged` — an unrestricted policy. Privilege escalation is possible with this policy;
          - `Baseline` — a policy with minimum restrictions that prevents privilege escalation;
          - `Restricted` — a policy with maximum restrictions that conforms to current best practices for securely running applications in a cluster.
        enum:
          - Privileged
          - Baseline
          - Restricted
      enforcementAction:
        type: string
        default: "Deny"
        description: |
          The enforcement action to control what to do with the result of the constraint.
          - `Deny` — Deny action.
          - `Dryrun` — No action. It is used when debugging. Information about the event can be viewed in the web-interface Deckhouse Platform or with `d8 k`.
          - `Warn` — Same as `Dryrun`. In addition to the event information, it provides some info on why that constraint would have been denied if you had set `Deny` instead of `Warn`.

          Applies to application namespaces. Namespaces named `d8-*` and `kube-*` are governed by the module itself: a violation is reported there and, unless the module that owns the namespace has opted it into enforcement, the workload still starts.
        enum:
          - Warn
          - Deny
          - Dryrun
      policies:
        type: object
        description: |
          Sets additional policy parameters.
        properties:
          hostPorts:
            type: object
            default: {}
            description: "HostPort constraint settings."
            properties:
              knownRanges:
                type: array
                description: "Set the range of known ports which will be allowed in a hostPort binding."
                items:
                  type: object
                  properties:
                    min:
                      type: integer
                    max:
                      type: integer
      controllerValidation:
        type: boolean
        default: true
        description: |
          Applies constraints to pod-creating controllers (Deployment, StatefulSet,
          DaemonSet, Job, CronJob, ReplicationController) in addition to Pods.

          Set to `true` (default) to validate both Pods and controllers,
          or to `false` to validate only Pods and leave controllers unchecked.

          How a violation in a controller is reported is set by [controllerValidationEnforcement](#parameters-podsecuritystandards-controllervalidationenforcement).

          The parameter is the default for every constraint that reads a pod spec, including
          the ones generated from OperationPolicy and SecurityPolicy resources.
          A policy overrides it with its own `spec.controllerValidation` section.
      controllerValidationEnforcement:
        type: string
        default: Warn
        enum:
          - Warn
          - Policy
        description: |
          Action on a pod-creating controller that violates a policy with `enforcementAction: Deny`.

          - `Warn` — the controller is accepted with a warning, and the Pods it creates are denied.
            The value is the default for a transition period, while workloads are brought in line with the controller-level checks.
          - `Policy` — the controller is checked with the action of the policy, so a denying policy denies the controller as well.
            The value is to become the default after the transition period.

          A policy with another action keeps it for controllers: `Warn` warns and `Dryrun` only records the violation.

          The parameter applies to the Pod Security Standards and is the default for OperationPolicy and SecurityPolicy resources.
          A policy overrides it with `spec.controllerValidation.mode`.
          The parameter takes effect when [controllerValidation](#parameters-podsecuritystandards-controllervalidation) is `true`.
      controllerValidationExcludedPolicies:
        type: array
        default: []
        description: |
          Pod Security Standards rules that are checked on Pods only.

          The rules are named as the [SecurityPolicy](cr.html#securitypolicy) parameters
          the standards are published with, in the `d8-pod-security-baseline` and `d8-pod-security-restricted` objects.
          An excluded rule is checked on Pods only in both standards.
          The parameter takes effect when [controllerValidation](#parameters-podsecuritystandards-controllervalidation) is `true`.

          Some rules are checked by one constraint and are excluded together: listing any rule of a group checks
          the whole group on Pods only. The groups are `allowHostPID` with `allowHostIPC`,
          and `allowHostNetwork` with `allowedHostPorts`.
        x-examples:
          - ["allowPrivilegeEscalation", "requiredDropCapabilities"]
        uniqueItems: true
        items:
          type: string
          enum:
            - allowPrivileged
            - allowPrivilegeEscalation
            - allowHostPID
            - allowHostIPC
            - allowHostNetwork
            - allowedHostPorts
            - allowedAppArmor
            - allowedCapabilities
            - requiredDropCapabilities
            - allowedHostPaths
            - allowedProcMount
            - seLinux
            - allowedUnsafeSysctls
            - seccompProfiles
            - allowedVolumes
            - runAsUser

  denyVulnerableImages:
    type: object
    default: {}
    x-doc-d8Editions:
      - ee
      - cse-lite
      - cse-pro
    description: |
      Trivy provider settings.

      The Trivy provider prevents creation of the Pod, Deployment, StatefulSet, and DaemonSet resources with images containing vulnerabilities in namespaces labeled with `security.deckhouse.io/trivy-provider: ""`.

      Images of every container are checked, including init containers and ephemeral containers. As a result, attaching an ephemeral container with `kubectl debug` is denied if its image contains vulnerabilities of a disallowed severity level.

      **Deprecated.** These settings have been moved to the `operator-trivy` module. Migrate your configuration.
    properties:
      enabled:
        type: boolean
        default: false
        description: Enable the Trivy provider.
      allowedSeverityLevels:
        type: array
        description: |
          List of allowed vulnerability severity levels.

          Images containing only vulnerabilities of the specified severity levels will not be blocked.
        items:
          type: string
          enum: ["UNKNOWN", "LOW", "MEDIUM", "HIGH", "CRITICAL"]
      storageClass:
        type: string
        x-examples: ["ceph-ssd", "false"]
        description: |-
          Name of the StorageClass used by the Trivy provider.

          If the value is not specified, the StorageClass set in the global [`settings.modules.storageClass`](/products/kubernetes-platform/documentation/v1/reference/api/global.html#parameters-modules-storageclass) parameter is used instead.

          The global `settings.modules.storageClass` parameter is only applied when the module is enabled. Changing the global parameter while the module is enabled will not trigger disk re-provisioning.

          > **Warning.** If you specify a value different from the current StorageClass used in the existing PersistentVolumeClaim, the disk will be re-provisioned, and all data will be deleted.

          If you set it to `false`, `emptyDir` will be forcibly used instead of a PVC.
      registrySecrets:
        type: array
        default: []
        description: |
          List of additional Secrets for accessing private registries.

          By default, the `deckhouse-registry` Secret is used to download images for scanning.
        items:
          type: object
          required:
            - name
            - namespace
          properties:
            name:
              type: string
            namespace:
              type: string
  imageSignatureVerification:
    type: object
    default: {}
    x-doc-d8Editions:
      - se+
      - ee
      - cse-lite
      - cse-pro
    description: |
      Settings of the image signature verification configured by the `verifyImageSignatures` policy of the SecurityPolicy resource.
    properties:
      registryCredentialsCacheTTLSeconds:
        type: integer
        default: 300
        minimum: 30
        maximum: 43200
        x-examples: [300, 3600]
        description: |
          Time in seconds for which the credentials of a private registry stay cached after being read from the `dockerCfg` field of a SecurityPolicy.

          After you change `dockerCfg`, the signature verification keeps using the previous credentials until the cache entry expires.
          A lower value applies the new credentials sooner, at the cost of more frequent reads of the Secret from the Kubernetes API.
