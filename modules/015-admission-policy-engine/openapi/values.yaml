x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    properties:
      bootstrapped:
        type: boolean
        default: false
      readyConstraintKinds:
        type: array
        description: |
          Kinds of Gatekeeper constraints whose ConstraintTemplates exist and whose CRDs are established.
          Only constraints of these kinds are rendered. The bootstrap hook always sets the value; without it, as in a render
          without the hook (tests, linters), every constraint is rendered.
        items:
          type: string
      podSecurityStandards:
        default: {}
        type: object
        properties:
          enforcementActions:
            type: array
            default: []
            items:
              type: string
              enum:
                - deny
                - dryrun
                - warn
      effectiveStorageClass:
        default: false
        oneOf:
          - type: string
          - type: boolean
      webhook:
        type: object
        default: {}
        properties:
          crt:
            type: string
            x-examples: ["dGVzdC12YWx1ZQ=="]
          key:
            type: string
            x-examples: ["dGVzdC12YWx1ZQ=="]
          ca:
            type: string
            x-examples: ["dGVzdC12YWx1ZQ=="]
      trackedConstraintResources:
        type: array
        default: []
        items:
          type: object
          properties:
            apiGroups:
              type: array
              items:
                type: string
            resources:
              type: array
              items:
                type: string
            operations:
              type: array
              items:
                type: string
      trackedMutateResources:
        type: array
        default: []
        items:
          type: object
          properties:
            apiGroups:
              type: array
              items:
                type: string
            resources:
              type: array
              items:
                type: string
            operations:
              type: array
              items:
                type: string
      operationPolicies:
        type: array
        default: []
        items:
          # this spec is validated by CRD's openapi spec
          type: object
          additionalProperties: true
      securityPolicies:
        type: array
        default: []
        items:
          # this spec is validated by CRD's openapi spec
          type: object
          additionalProperties: true
      trivyConfigData:
        type: object
        additionalProperties:
          type: string
        description: |
          Configuration for trivy. Fetched from the trivy config map.
      ratify:
        type: object
        default: {}
        properties:
          imageReferences:
            type: array
            items:
              type: object
              properties:
                reference:
                  type: string
                publicKeys:
                  type: array
                  items:
                    type: string
          webhook:
            type: object
            default: {}
            properties:
              crt:
                type: string
                x-examples: ["dGVzdC12YWx1ZQ=="]
              key:
                type: string
                x-examples: ["dGVzdC12YWx1ZQ=="]
              ca:
                type: string
                x-examples: ["dGVzdC12YWx1ZQ=="]
