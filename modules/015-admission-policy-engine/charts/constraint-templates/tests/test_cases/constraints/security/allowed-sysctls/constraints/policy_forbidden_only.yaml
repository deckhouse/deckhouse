# Denylist-only policy: the SecurityPolicy sets `forbiddenSysctls` and no
# `allowedUnsafeSysctls`, so the Helm define renders no `allowedSysctls` key at
# all. Everything the denylist does not name must stay allowed.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: D8AllowedSysctls
metadata:
  name: test-forbidden-only
spec:
  enforcementAction: "deny"
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
      - apiGroups: [""]
        kinds: ["ReplicationController"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
    namespaceSelector:
      matchLabels:
        custom-policy: example
  parameters:
    forbiddenSysctls:
      - kernel.msg*
