apiVersion: constraints.gatekeeper.sh/v1beta1
kind: D8AllowedSysctls
metadata:
  name: test
spec:
  enforcementAction: "deny"
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
      - apiGroups: [""]
        kinds: ["ReplicationController"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
    namespaceSelector:
      matchExpressions:
        - key: security.deckhouse.io/pod-policy
          operator: In
          values:
          - baseline
          - restricted
  parameters:
    allowedSysctls:
    - kernel.shm_rmid_forced
    - net.ipv4.ip_local_port_range
    - net.ipv4.ip_unprivileged_port_start
    - net.ipv4.tcp_syncookies
    - net.ipv4.ping_group_range
    - net.ipv4.ip_local_reserved_ports
    - net.ipv4.tcp_keepalive_time
    - net.ipv4.tcp_fin_timeout
    - net.ipv4.tcp_keepalive_intvl
    - net.ipv4.tcp_keepalive_probes
    # forbiddenSysctls is intentionally omitted here (not set to []) — this
    # mirrors the real rendered PSS baseline/restricted constraint
    # (templates/policies/pod-security-standards/baseline/constraint.yaml,
    # pss_baseline_params_allowed_sysctls), which never sets this key. A
    # missing key is *undefined* in Rego, not an empty array — see the
    # defensive object.get(...) defaulting in
    # charts/constraint-templates/templates/security/allowed-sysctls.yaml.
