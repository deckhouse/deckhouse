apiVersion: deckhouse.io/v1alpha1
kind: ConstraintTestMatrix
metadata:
  name: automount-service-account-token
spec:
  suiteName: d8-automount-service-account-token-pod
  outputTestDirectory: rendered
  defaultObjectBase: admissionPod
  defaultInventory:
  - ref: $TEST_ROOT/constraints/_test-samples/ns.yaml
  bases:
    admissionPod:
      document:
        apiVersion: v1
        kind: Pod
        metadata:
          namespace: testns
        spec:
          containers:
          - image: nginx
            name: nginx
    admissionDeployment:
      document:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          namespace: testns
        spec:
          template:
            spec:
              containers:
              - image: nginx
                name: nginx
  namedExceptions: {}
  blocks:
  - name: security-policy
    gatorBlock: security-policy
    defaultObjectBase: ''
    template: ../rendered/constraint-template.yaml
    constraint: constraints/policy_1.yaml
    cases:
    - name: 001-disallowed-automount-true
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.automountServiceAccountToken
        scenario: negative
      - path: spec.containers[].volumeMounts[].mountPath
        scenario: negative
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              app: nginx
            name: nginx
          spec:
            automountServiceAccountToken: true
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                name: serviceaccount-token
            - command:
              - sh
              - -c
              - sleep 3600
              image: busybox
              name: sidecar
            initContainers:
            - command:
              - sh
              - -c
              - echo init
              image: busybox
              name: init-bootstrap
              volumeMounts:
              - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                name: serviceaccount-token
            volumes:
            - name: serviceaccount-token
              secret:
                secretName: default-token
    - name: 002-allowed-automount-false
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.automountServiceAccountToken
        scenario: positive
      - path: spec.containers[].volumeMounts[].mountPath
        scenario: positive
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              app: nginx
            name: nginx
          spec:
            automountServiceAccountToken: false
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /var/lib/nginx
                name: data
            volumes:
            - emptyDir: {}
              name: data
    - name: 003-allowed-automount-absent
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.automountServiceAccountToken
        scenario: absent
      - path: spec.containers[].volumeMounts[].mountPath
        scenario: absent
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              app: nginx
            name: nginx
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /etc/nginx
                name: config
            volumes:
            - configMap:
                name: nginx-config
              name: config
    - name: 004-disallowed-multi-container-mountpath
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.containers[].volumeMounts[].mountPath
        scenario: multiContainer
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              app: nginx
            name: nginx
          spec:
            automountServiceAccountToken: true
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                name: serviceaccount-token
            - command:
              - sh
              - -c
              - sleep 3600
              image: busybox
              name: sidecar
            initContainers:
            - command:
              - sh
              - -c
              - echo init
              image: busybox
              name: init-bootstrap
              volumeMounts:
              - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                name: serviceaccount-token
            volumes:
            - name: serviceaccount-token
              secret:
                secretName: default-token
    - name: 005-disallowed-init-container-mountpath
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.containers[].volumeMounts[].mountPath
        scenario: initContainer
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              app: nginx
            name: nginx
          spec:
            automountServiceAccountToken: true
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                name: serviceaccount-token
            - command:
              - sh
              - -c
              - sleep 3600
              image: busybox
              name: sidecar
            initContainers:
            - command:
              - sh
              - -c
              - echo init
              image: busybox
              name: init-bootstrap
              volumeMounts:
              - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                name: serviceaccount-token
            volumes:
            - name: serviceaccount-token
              secret:
                secretName: default-token
    - name: 006-allowed-ephemeral-container-mountpath
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.containers[].volumeMounts[].mountPath
        scenario: ephemeralContainer
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              app: nginx
            name: nginx-ephemeral
          spec:
            automountServiceAccountToken: false
            containers:
            - image: nginx
              name: nginx
            ephemeralContainers:
            - command:
              - sh
              - -c
              - sleep 3600
              image: busybox
              name: debugger
              volumeMounts:
              - mountPath: /tmp/debug
                name: debug-data
            volumes:
            - name: debug-data
              emptyDir: {}
    - name: 007-disallowed-automount-false-with-sa-volume
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.automountServiceAccountToken
        scenario: negative
      - path: spec.containers[].volumeMounts[].mountPath
        scenario: negative
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              app: nginx
            name: nginx-false-sa-volume
          spec:
            automountServiceAccountToken: false
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                name: serviceaccount-token
            volumes:
            - name: serviceaccount-token
              secret:
                secretName: default-token
  - name: pss-controller-deployment
    gatorBlock: pss-controller-deployment
    template: ../rendered/constraint-template.yaml
    constraint: constraints/policy_1.yaml
    cases:
    - name: controller-allowed-automount-service-account-token
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.template.spec.automountServiceAccountToken
        scenario: positive
      object:
        base: admissionDeployment
        merge:
          metadata:
            name: controller-allowed-automount-service-account-token
          spec:
            template:
              spec:
                containers:
                - image: nginx
                  name: nginx
                automountServiceAccountToken: false
      exception: ''
      exceptionRef: ''
    - name: controller-disallowed-automount-true
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.template.spec.automountServiceAccountToken
        scenario: negative
      exception: ''
      exceptionRef: ''
      object:
        base: admissionDeployment
        merge:
          metadata:
            name: controller-disallowed-automount-true
          spec:
            template:
              spec:
                containers:
                - image: nginx
                  name: nginx
                automountServiceAccountToken: true
    # Regression: controller UPDATE must still be checked (N3).
    # The Pod-specific is_update guard must NOT skip controller UPDATEs.
    # This case uses a Deployment with automountServiceAccountToken: true,
    # simulating an UPDATE (helm upgrade / kubectl apply). If the rule
    # incorrectly uses the Pod is_update guard for controllers, this would
    # silently pass.
    - name: controller-disallowed-automount-true-on-update
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.template.spec.automountServiceAccountToken
        scenario: negative
      exception: ''
      exceptionRef: ''
      object:
        base: admissionDeployment
        merge:
          metadata:
            name: controller-disallowed-automount-true-on-update
          spec:
            template:
              spec:
                containers:
                - image: nginx
                  name: nginx
                automountServiceAccountToken: true
    # Regression: automountServiceAccountToken: false but SA volume mounted (N3).
    # This is the widened behavior — a workload that explicitly sets false but
    # still mounts the SA token volume is now a violation (was not before).
    - name: controller-disallowed-false-with-sa-volume
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.template.spec.automountServiceAccountToken
        scenario: positive
      - path: spec.template.spec.containers[].volumeMounts[].mountPath
        scenario: negative
      exception: ''
      exceptionRef: ''
      object:
        base: admissionDeployment
        merge:
          metadata:
            name: controller-disallowed-false-with-sa-volume
          spec:
            template:
              spec:
                containers:
                - image: nginx
                  name: nginx
                  volumeMounts:
                  - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                    name: serviceaccount-token
                automountServiceAccountToken: false
                volumes:
                - name: serviceaccount-token
                  secret:
                    secretName: default-token
