        scenario: speMismatch
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-var-lib-subpaths
          spec:
            volumes:
              hostPath:
                allowedValues:
                - path: /var/lib
                  readOnly: false
                  allowSubPaths: true
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: allow-var-lib-subpaths
            name: disallowed-by-exception-subpath-parent
          spec:
            containers:
            - image: nginx
