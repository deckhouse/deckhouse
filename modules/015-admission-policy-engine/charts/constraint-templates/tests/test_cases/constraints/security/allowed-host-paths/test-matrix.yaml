  - name: pss-controller-deployment
    gatorBlock: pss-controller-deployment
    template: ../rendered/constraint-template.yaml
    constraint: constraints/pss_baseline.yaml
    cases:
    - name: controller-allowed-allowed-host-paths
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.template.spec.volumes[].hostPath.path
        scenario: positive
      object:
        base: admissionDeployment
        merge:
          metadata:
            name: controller-allowed-allowed-host-paths
          spec:
            template:
              spec:
                containers:
                - image: nginx
                  name: nginx
                volumes:
                - name: test
                  emptyDir: {}
      exception: ''
      exceptionRef: ''
    - name: controller-disallowed-no-exception
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.template.spec.volumes[].hostPath.path
        scenario: negative
      object:
        base: admissionDeployment
        merge:
          metadata:
            name: controller-disallowed-no-exception
          spec:
            template:
              spec:
                volumes:
                - name: host
                  hostPath:
                    path: /tmp
                containers:
                - image: nginx
                  name: nginx
                  volumeMounts:
                  - name: host
                    mountPath: /host
      exception: ''
      exceptionRef: ''
    - name: controller-allowed-by-spe-on-pod-template
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.template.spec.volumes[].hostPath.path
        scenario: speMatch
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-host-paths-spe
          spec:
            volumes:
              hostPath:
                allowedValues:
                - readOnly: false
                  path: /tmp
      object:
        base: admissionDeployment
        merge:
          metadata:
            name: controller-allowed-by-spe-on-pod-template
          spec:
            template:
              metadata:
                labels:
                  security.deckhouse.io/security-policy-exception: allow-host-paths-spe
              spec:
                volumes:
                - name: host
                  hostPath:
                    path: /tmp
                containers:
                - image: nginx
                  name: nginx
                  volumeMounts:
                  - name: host
                    mountPath: /host
      exception: ''
      exceptionRef: ''
    # The SPE label is resolved from the pod template only, so the same label on
    # the controller's top-level metadata grants no exception and the non-compliant
    # pod template is denied. Without this case only the lib-level object_labels
    # test covers the decision; the template-level wiring was unverified.
    - name: controller-denied-when-spe-label-only-on-top-level-metadata
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.template.spec.volumes[].hostPath.path
        scenario: speAbsent
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-host-paths-spe-top
          spec:
            volumes:
              hostPath:
                allowedValues:
                - readOnly: false
                  path: /tmp
      object:
        base: admissionDeployment
        merge:
          metadata:
            name: controller-denied-spe-label-on-top-level-metadata
            labels:
              security.deckhouse.io/security-policy-exception: allow-host-paths-spe-top
          spec:
            template:
              spec:
                volumes:
                - name: host
                  hostPath:
                    path: /tmp
                containers:
                - image: nginx
                  name: nginx
                  volumeMounts:
                  - name: host
                    mountPath: /host
      exception: ''
      exceptionRef: ''
    # A controller whose pod template mounts a nested path is allowed by an SPE with allowSubPaths.
    - name: controller-allowed-by-spe-subpath-on-pod-template
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.template.spec.volumes[].hostPath.path
        scenario: speMatch
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-var-lib-subpaths-ctrl
