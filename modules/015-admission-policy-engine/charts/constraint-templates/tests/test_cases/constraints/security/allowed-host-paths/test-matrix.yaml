apiVersion: deckhouse.io/v1alpha1
kind: ConstraintTestMatrix
metadata:
  name: allowed-host-paths
spec:
  suiteName: d8-allowed-host-paths
  outputTestDirectory: rendered
  defaultObjectBase: admissionPod
  defaultInventory:
  - ref: $TEST_ROOT/constraints/_test-samples/ns.yaml
  bases:
    admissionPod:
      document:
        apiVersion: v1
        kind: Pod
        metadata:
          namespace: testns
        spec:
          containers:
          - image: nginx
            name: nginx
    admissionDeployment:
      document:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          namespace: testns
        spec:
          template:
            spec:
              containers:
              - image: nginx
                name: nginx
    securityPolicyException:
      document:
        apiVersion: deckhouse.io/v1alpha1
        kind: SecurityPolicyException
        metadata:
          namespace: testns
  namedExceptions: {}
  blocks:
  - name: pss-baseline
    gatorBlock: pss-baseline
    defaultObjectBase: ''
    template: ../rendered/constraint-template.yaml
    constraint: constraints/pss_baseline.yaml
    cases:
    - name: 001-allowed-no-hostpath-volumes
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.volumes[].hostPath.path
        scenario: absent
      - path: spec.volumes[].hostPath.readOnly
        scenario: absent
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            name: allowed-no-hostpath-volumes
    - name: 004-disallowed-hostpath-proc
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes[].hostPath.path
        scenario: negative
      - path: spec.volumes[].hostPath.readOnly
        scenario: absent
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            name: disallowed-hostpath-proc
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
            volumes:
            - hostPath:
                path: /proc
              name: proc-volume
    - name: 003-disallowed-hostpath-proc-ro
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes[].hostPath.path
        scenario: negative
      - path: spec.volumes[].hostPath.readOnly
        scenario: positive
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            name: disallowed-hostpath-proc-ro
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: true
            volumes:
            - hostPath:
                path: /proc/ro
              name: proc-volume
    - name: 002-disallowed-hostpath-etc
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes[].hostPath.path
        scenario: negative
      - path: spec.volumes[].hostPath.readOnly
        scenario: absent
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            name: disallowed-hostpath-etc
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-etc
                name: etc-volume
            volumes:
            - hostPath:
                path: /etc
              name: etc-volume
    - name: 005-disallowed-multiple-volumes-one-hostpath
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes[].hostPath.path
        scenario: negative
      - path: spec.volumes[].hostPath.readOnly
        scenario: absent
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            name: disallowed-multiple-volumes-one-hostpath
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /config
                name: config-volume
              - mountPath: /host-proc
                name: proc-volume
            volumes:
            - configMap:
                name: my-config
              name: config-volume
            - hostPath:
                path: /proc
              name: proc-volume
  - name: security-policy
    gatorBlock: security-policy
    defaultObjectBase: ''
    template: ../rendered/constraint-template.yaml
    constraint: constraints/policy_1.yaml
    cases:
    - name: 006-allowed-no-hostpath-volumes
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.volumes[].hostPath.path
        scenario: absent
      - path: spec.volumes[].hostPath.readOnly
        scenario: absent
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            name: allowed-no-hostpath-volumes
    - name: 007-allowed-proc-ro-readonly
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.volumes[].hostPath.path
        scenario: positive
      - path: spec.volumes[].hostPath.readOnly
        scenario: positive
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            name: allowed-proc-ro-readonly
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: true
            volumes:
            - hostPath:
                path: /proc/ro
              name: proc-volume
    - name: 008-allowed-proc-rw-readonly
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.volumes[].hostPath.path
        scenario: positive
      - path: spec.volumes[].hostPath.readOnly
        scenario: positive
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            name: allowed-proc-rw-readonly
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: true
            volumes:
            - hostPath:
                path: /proc/rw
              name: proc-volume
    - name: 009-allowed-proc-rw-readwrite
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.volumes[].hostPath.path
        scenario: positive
      - path: spec.volumes[].hostPath.readOnly
        scenario: negative
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            name: allowed-proc-rw-readwrite
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: false
            volumes:
            - hostPath:
                path: /proc/rw
              name: proc-volume
    - name: 010-allowed-proc-rw-subpath-readwrite
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.volumes[].hostPath.path
        scenario: positive
      - path: spec.volumes[].hostPath.readOnly
        scenario: negative
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            name: allowed-proc-rw-subpath-readwrite
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: false
            volumes:
            - hostPath:
                path: /proc/rw/subdir
              name: proc-volume
    - name: 013-disallowed-proc-ro-readwrite
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes[].hostPath.path
        scenario: positive
      - path: spec.volumes[].hostPath.readOnly
        scenario: negative
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            name: disallowed-proc-ro-readwrite
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: false
            volumes:
            - hostPath:
                path: /proc/ro
              name: proc-volume
    - name: 012-disallowed-proc-not-allowed-prefix
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes[].hostPath.path
        scenario: negative
      - path: spec.volumes[].hostPath.readOnly
        scenario: absent
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            name: disallowed-proc-not-allowed-prefix
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
            volumes:
            - hostPath:
                path: /proc/other
              name: proc-volume
    - name: 011-disallowed-etc-path
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes[].hostPath.path
        scenario: negative
      - path: spec.volumes[].hostPath.readOnly
        scenario: absent
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            name: disallowed-etc-path
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-etc
                name: etc-volume
            volumes:
            - hostPath:
                path: /etc
              name: etc-volume
  - name: security-policy-with-exception
    gatorBlock: security-policy-with-exception
    defaultObjectBase: ''
    template: ../rendered/constraint-template.yaml
    constraint: constraints/policy_1.yaml
    cases:
    - name: 015-018-allowed-by-exception-mismatch-but-constraint-allows
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speMismatch
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-multiple-paths
          spec:
            volumes:
              hostPath:
                allowedValues:
                - path: /proc/etc
                  readOnly: false
                - path: /etc/passwd
                  readOnly: true
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: allow-proc-etc
            name: allowed-by-exception-mismatch-but-constraint-allows
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: false
            volumes:
            - hostPath:
                path: /proc/rw
              name: proc-volume
    - name: 015-019-allowed-by-exception-multiple-paths
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speMatch
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-multiple-paths
          spec:
            volumes:
              hostPath:
                allowedValues:
                - path: /proc/etc
                  readOnly: false
                - path: /etc/passwd
                  readOnly: true
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: allow-multiple-paths
            name: allowed-by-exception-multiple-paths
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: false
              - mountPath: /host-passwd
                name: passwd-volume
                readOnly: true
            volumes:
            - hostPath:
                path: /proc/etc
              name: proc-volume
            - hostPath:
                path: /etc/passwd
              name: passwd-volume
    - name: 016-020-allowed-by-exception-proc-etc-readwrite
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speMatch
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-proc-etc
          spec:
            volumes:
              hostPath:
                allowedValues:
                - path: /proc/etc
                  readOnly: false
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: allow-proc-etc
            name: allowed-by-exception-proc-etc-readwrite
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: false
            volumes:
            - hostPath:
                path: /proc/etc
              name: proc-volume
    # A volume mounted read-only in one container and writable in another is
    # writable: an exception with readOnly: false covers it.
    - name: allowed-by-exception-mixed-readonly-mounts-readwrite
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speMatch
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-proc-etc
          spec:
            volumes:
              hostPath:
                allowedValues:
                - path: /proc/etc
                  readOnly: false
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: allow-proc-etc
            name: allowed-by-exception-mixed-readonly-mounts-readwrite
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: true
            - image: nginx
              name: writer
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
            volumes:
            - hostPath:
                path: /proc/etc
              name: proc-volume
    # readOnly: false is the CRD default and allows the path with read-only mounts too.
    - name: allowed-by-exception-default-readonly-covers-readonly-mounts
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speMatch
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-proc-etc-default
          spec:
            volumes:
              hostPath:
                allowedValues:
                - path: /proc/etc
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: allow-proc-etc-default
            name: allowed-by-exception-default-readonly-covers-readonly-mounts
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: true
            volumes:
            - hostPath:
                path: /proc/etc
              name: proc-volume
    - name: disallowed-by-exception-mixed-readonly-mounts-readonly
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speMismatch
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-proc-etc-ro
          spec:
            volumes:
              hostPath:
                allowedValues:
                - path: /proc/etc
                  readOnly: true
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: allow-proc-etc-ro
            name: disallowed-by-exception-mixed-readonly-mounts-readonly
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: true
            - image: nginx
              name: writer
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: false
            volumes:
            - hostPath:
                path: /proc/etc
              name: proc-volume
    - name: 016-022-disallowed-by-exception-path-mismatch
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speMismatch
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-proc-etc
          spec:
            volumes:
              hostPath:
                allowedValues:
                - path: /proc/etc
                  readOnly: false
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: allow-proc-etc
            name: disallowed-by-exception-path-mismatch
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: false
            volumes:
            - hostPath:
                path: /proc/other
              name: proc-volume
    # An exception that allows the path read-only does not cover a writable mount.
    - name: 016-023-disallowed-by-exception-readonly-mismatch
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speMismatch
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-proc-etc
          spec:
            volumes:
              hostPath:
                allowedValues:
                - path: /proc/etc
                  readOnly: true
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: allow-proc-etc
            name: disallowed-by-exception-readonly-mismatch
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: false
            volumes:
            - hostPath:
                path: /proc/etc
              name: proc-volume
    - name: 024-disallowed-no-exception-label
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speAbsent
      exception: ''
      exceptionRef: ''
      object:
        base: admissionPod
        merge:
          metadata:
            name: disallowed-no-exception-label
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
            volumes:
            - hostPath:
                path: /proc/etc
              name: proc-volume
    - name: 016-021-disallowed-by-exception-multiple-volumes-one-mismatch
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speMismatch
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-proc-etc
          spec:
            volumes:
              hostPath:
                allowedValues:
                - path: /proc/etc
                  readOnly: false
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: allow-proc-etc
            name: disallowed-by-exception-multiple-volumes-one-mismatch
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-proc
                name: proc-volume
                readOnly: false
              - mountPath: /host-other
                name: other-volume
                readOnly: false
            volumes:
            - hostPath:
                path: /proc/etc
              name: proc-volume
            - hostPath:
                path: /proc/other
              name: other-volume
    - name: 017-025-disallowed-by-exception-empty-spec
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speAbsent
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: empty-spec
          spec: {}
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: empty-spec
            name: disallowed-by-exception-empty-spec
          spec:
            volumes:
            - hostPath:
                path: /proc
              name: proc-volume
    # An exception with allowSubPaths: true allows a path nested under the allowed one.
    - name: 026-allowed-by-exception-subpath
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speMatch
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-var-lib-subpaths
          spec:
            volumes:
              hostPath:
                allowedValues:
                - path: /var/lib
                  readOnly: false
                  allowSubPaths: true
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: allow-var-lib-subpaths
            name: allowed-by-exception-subpath
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-data
                name: data-volume
                readOnly: false
            volumes:
            - hostPath:
                path: /var/lib/docker
              name: data-volume
    # Without allowSubPaths, an exception allows the exact path only.
    - name: 027-disallowed-by-exception-subpath-without-flag
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speMismatch
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-var-lib
          spec:
            volumes:
              hostPath:
                allowedValues:
                - path: /var/lib
                  readOnly: false
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: allow-var-lib
            name: disallowed-by-exception-subpath-without-flag
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-data
                name: data-volume
                readOnly: false
            volumes:
            - hostPath:
                path: /var/lib/docker
              name: data-volume
    # Paths are compared segment by segment, so /var/lib does not cover /var/libvirt.
    - name: 028-disallowed-by-exception-subpath-sibling-prefix
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speMismatch
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-var-lib-subpaths
          spec:
            volumes:
              hostPath:
                allowedValues:
                - path: /var/lib
                  readOnly: false
                  allowSubPaths: true
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: allow-var-lib-subpaths
            name: disallowed-by-exception-subpath-sibling-prefix
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-data
                name: data-volume
                readOnly: false
            volumes:
            - hostPath:
                path: /var/libvirt
              name: data-volume
    # An exception that allows subpaths read-only does not cover a writable mount.
    - name: 029-disallowed-by-exception-subpath-readonly-mismatch
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.volumes.hostPath.allowedValues
        scenario: speMismatch
      exception: ''
      exceptionRef: ''
      inventory:
      - base: securityPolicyException
        merge:
          metadata:
            name: allow-var-lib-subpaths-ro
          spec:
            volumes:
              hostPath:
                allowedValues:
                - path: /var/lib
                  readOnly: true
                  allowSubPaths: true
      object:
        base: admissionPod
        merge:
          metadata:
            labels:
              security.deckhouse.io/security-policy-exception: allow-var-lib-subpaths-ro
            name: disallowed-by-exception-subpath-readonly-mismatch
          spec:
            containers:
            - image: nginx
              name: nginx
              volumeMounts:
              - mountPath: /host-data
                name: data-volume
                readOnly: false
            volumes:
            - hostPath:
                path: /var/lib/docker
              name: data-volume
    # An exception that allows subpaths read-only covers a read-only mount.
    - name: 030-allowed-by-exception-subpath-readonly
      violations: 'no'
