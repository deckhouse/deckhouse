                  path: /var/lib
      object:
        base: admissionDeployment
        merge:
          metadata:
            name: controller-denied-by-spe-exact-path-on-pod-template
          spec:
            template:
              metadata:
                labels:
                  security.deckhouse.io/security-policy-exception: allow-var-lib-exact-ctrl
              spec:
                volumes:
                - name: host
                  hostPath:
                    path: /var/lib/docker
                containers:
                - image: nginx
                  name: nginx
                  volumeMounts:
                  - name: host
                    mountPath: /host
      exception: ''
