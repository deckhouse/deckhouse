      object:
        base: admissionDeployment
        merge:
          metadata:
            name: controller-allowed-by-spe-subpath-on-pod-template
          spec:
            template:
              metadata:
                labels:
                  security.deckhouse.io/security-policy-exception: allow-var-lib-subpaths-ctrl
              spec:
                volumes:
                - name: host
                  hostPath:
                    path: /var/lib/docker
                containers:
                - image: nginx
                  name: nginx
                  volumeMounts:
                  - name: host
                    mountPath: /host
      exception: ''
      exceptionRef: ''
    # Without allowSubPaths, the same SPE does not cover the nested path on a controller.
    - name: controller-denied-by-spe-exact-path-on-pod-template
      violations: 'yes'
