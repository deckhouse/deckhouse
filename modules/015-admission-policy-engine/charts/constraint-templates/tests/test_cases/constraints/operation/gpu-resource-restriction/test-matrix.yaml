apiVersion: deckhouse.io/v1alpha1
kind: ConstraintTestMatrix
metadata:
  name: gpu-resource-restriction
spec:
  suiteName: d8-gpu-resource-restriction
  outputTestDirectory: rendered
  defaultObjectBase: admissionPod
  defaultInventory: []
  bases:
    admissionPod:
      document:
        apiVersion: v1
        kind: Pod
        metadata:
          namespace: testns
        spec:
          containers:
            - image: nginx
              name: nginx
    namespaceWithGpuLabel:
      document:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: testns
          labels:
            gpu.deckhouse.io/enabled: "true"
    namespaceWithWrongGpuLabelValue:
      document:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: testns
          labels:
            gpu.deckhouse.io/enabled: "false"
    namespaceWithoutGpuLabel:
      document:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: testns
    namespaceWithCustomGpuLabel:
      document:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: testns
          labels:
            custom.io/gpu-allowed: "yes"
    admissionDeployment:
      document:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          namespace: testns
        spec:
          template:
            spec:
              containers:
                - image: nginx
                  name: nginx
    admissionCronJob:
      document:
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          namespace: testns
        spec:
          schedule: "* * * * *"
          jobTemplate:
            spec:
              template:
                spec:
                  containers:
                    - image: nginx
                      name: nginx
  namedExceptions: {}
  blocks:
    - name: operation-policy
      gatorBlock: operation-policy
      defaultObjectBase: ""
      template: ../../templates/operation/gpu-resource-restriction.yaml
      constraint: constraints/policy_1.yaml
      cases:
        # Allowed: Pod with GPU resources in namespace WITH the label
        - name: example-allowed-gpu-with-label
          violations: "no"
          assertionMessage: ""
          fields:
            - path: spec.containers[].resources
              scenario: positive
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: allowed
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        nvidia.com/gpu: 1
                      requests:
                        nvidia.com/gpu: 1
        # Denied: Pod with GPU resources in namespace WITHOUT the label
        - name: example-disallowed-gpu-without-label
          violations: "yes"
          assertionMessage: 'container <gpu-app> requests GPU resources <nvidia.com/gpu>, but namespace <testns> does not have label <gpu.deckhouse.io/enabled> set to <true>'
          fields:
            - path: spec.containers[].resources
              scenario: negative
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: disallowed
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        nvidia.com/gpu: 1
                      requests:
                        nvidia.com/gpu: 1
        # Denied: namespace has the label but with an unexpected value
        - name: example-disallowed-gpu-wrong-label-value
          violations: "yes"
          assertionMessage: 'container <gpu-app> requests GPU resources <nvidia.com/gpu>, but namespace <testns> does not have label <gpu.deckhouse.io/enabled> set to <true>'
          fields:
            - path: spec.containers[].resources
              scenario: negative
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithWrongGpuLabelValue
          object:
            base: admissionPod
            merge:
              metadata:
                name: disallowed-wrong-value
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        nvidia.com/gpu: 1
        # Denied: namespace is not present in the Gatekeeper cache (policy fails closed)
        - name: example-disallowed-gpu-namespace-not-cached
          violations: "yes"
          assertionMessage: 'container <gpu-app> requests GPU resources <nvidia.com/gpu>, but namespace <testns> is not present in the Gatekeeper cache, so the label <gpu.deckhouse.io/enabled> cannot be checked'
          fields:
            - path: spec.containers[].resources
              scenario: negative
          exception: ""
          exceptionRef: ""
          inventory: []
          object:
            base: admissionPod
            merge:
              metadata:
                name: disallowed-not-cached
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        nvidia.com/gpu: 1
        # Denied: several GPU resources in a single container are reported in one violation
        - name: example-disallowed-multiple-gpu-resources
          violations: "yes"
          assertionMessage: 'container <gpu-app> requests GPU resources <nvidia.com/gpu, nvidia.com/mig-1g.5gb>, but namespace <testns> does not have label <gpu.deckhouse.io/enabled> set to <true>'
          fields:
            - path: spec.containers[].resources
              scenario: negative
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: disallowed-multiple-resources
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        nvidia.com/gpu: 1
                        nvidia.com/mig-1g.5gb: 1
                      requests:
                        nvidia.com/mig-1g.5gb: 1
        # Allowed: Pod WITHOUT GPU resources in namespace WITHOUT the label
        - name: example-allowed-no-gpu-without-label
          violations: "no"
          assertionMessage: ""
          fields:
            - path: spec.containers[].resources
              scenario: positive
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: allowed-no-gpu
                namespace: testns
              spec:
                containers:
                  - name: cpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        cpu: 1
                        memory: 128Mi
                      requests:
                        cpu: 1
                        memory: 128Mi
        # Allowed: container without the resources field at all
        - name: example-allowed-without-resources
          violations: "no"
          assertionMessage: ""
          fields:
            - path: spec.containers[].resources
              scenario: absent
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: allowed-no-resources
                namespace: testns
              spec:
                containers:
                  - name: cpu-app
                    image: my.repo/app:latest
        # Allowed: resource name that does not match the configured patterns
        - name: example-allowed-non-matching-resource-name
          violations: "no"
          assertionMessage: ""
          fields:
            - path: spec.containers[].resources
              scenario: positive
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: allowed-non-matching
                namespace: testns
              spec:
                containers:
                  - name: cpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        not-nvidia.com/gpu: 1
                        example.com/fpga: 1
        # Denied: GPU resource in limits only
        - name: example-disallowed-gpu-limits-only
          violations: "yes"
          assertionMessage: 'container <gpu-app> requests GPU resources <nvidia.com/gpu>, but namespace <testns> does not have label <gpu.deckhouse.io/enabled> set to <true>'
          fields:
            - path: spec.containers[].resources
              scenario: negative
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: disallowed-limits
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        nvidia.com/gpu: 1
        # Denied: GPU resource in requests only
        - name: example-disallowed-gpu-requests-only
          violations: "yes"
          assertionMessage: 'container <gpu-app> requests GPU resources <nvidia.com/gpu>, but namespace <testns> does not have label <gpu.deckhouse.io/enabled> set to <true>'
          fields:
            - path: spec.containers[].resources
              scenario: negative
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: disallowed-requests
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      requests:
                        nvidia.com/gpu: 1
        # Denied: only one of several containers requests GPU resources
        - name: example-disallowed-gpu-multi-container
          violations: "yes"
          assertionMessage: 'container <gpu-app> requests GPU resources <nvidia.com/gpu>, but namespace <testns> does not have label <gpu.deckhouse.io/enabled> set to <true>'
          fields:
            - path: spec.containers[].resources
              scenario: multiContainer
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: disallowed-multi-container
                namespace: testns
              spec:
                containers:
                  - name: cpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        cpu: 1
                        memory: 128Mi
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        nvidia.com/gpu: 1
        # Denied: GPU resource in initContainers
        - name: example-disallowed-gpu-init-container
          violations: "yes"
          assertionMessage: 'container <gpu-init> requests GPU resources <nvidia.com/gpu>, but namespace <testns> does not have label <gpu.deckhouse.io/enabled> set to <true>'
          fields:
            - path: spec.containers[].resources
              scenario: initContainer
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: disallowed-init
                namespace: testns
              spec:
                containers:
                  - name: cpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        cpu: 1
                        memory: 128Mi
                      requests:
                        cpu: 1
                        memory: 128Mi
                initContainers:
                  - name: gpu-init
                    image: my.repo/init:latest
                    resources:
                      limits:
                        nvidia.com/gpu: 1
        # Denied: GPU resource in ephemeralContainers
        - name: example-disallowed-gpu-ephemeral-container
          violations: "yes"
          assertionMessage: 'container <gpu-eph> requests GPU resources <nvidia.com/gpu>, but namespace <testns> does not have label <gpu.deckhouse.io/enabled> set to <true>'
          fields:
            - path: spec.containers[].resources
              scenario: ephemeralContainer
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: disallowed-ephemeral
                namespace: testns
              spec:
                containers:
                  - name: cpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        cpu: 1
                        memory: 128Mi
                      requests:
                        cpu: 1
                        memory: 128Mi
                ephemeralContainers:
                  - name: gpu-eph
                    image: my.repo/eph:latest
                    resources:
                      limits:
                        nvidia.com/gpu: 1
        # Allowed: GPU resource requested with a zero quantity (numeric form)
        - name: example-allowed-zero-quantity-number
          violations: "no"
          assertionMessage: ""
          fields:
            - path: spec.containers[].resources
              scenario: positive
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: allowed-zero-number
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        nvidia.com/gpu: 0
                      requests:
                        nvidia.com/gpu: 0
        # Allowed: GPU resource requested with a zero quantity serialized as a string
        - name: example-allowed-zero-quantity-string
          violations: "no"
          assertionMessage: ""
          fields:
            - path: spec.containers[].resources
              scenario: positive
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: allowed-zero-string
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        nvidia.com/gpu: "0"
                      requests:
                        nvidia.com/gpu: "0"
        # Denied: non-zero quantity serialized as a string, as in a real AdmissionReview
        - name: example-disallowed-quantity-string
          violations: "yes"
          assertionMessage: 'container <gpu-app> requests GPU resources <nvidia.com/gpu>, but namespace <testns> does not have label <gpu.deckhouse.io/enabled> set to <true>'
          fields:
            - path: spec.containers[].resources
              scenario: negative
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: disallowed-quantity-string
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        nvidia.com/gpu: "1"
    - name: operation-policy-custom-parameters
      gatorBlock: operation-policy-custom-parameters
      defaultObjectBase: ""
      template: ../../templates/operation/gpu-resource-restriction.yaml
      constraint: constraints/policy_2.yaml
      cases:
        # Allowed: custom vendor pattern in a namespace with the custom label
        - name: example-allowed-custom-pattern-with-label
          violations: "no"
          assertionMessage: ""
          fields:
            - path: spec.containers[].resources
              scenario: positive
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithCustomGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: allowed-custom
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        amd.com/gpu: 1
        # Denied: custom vendor pattern without the custom label
        - name: example-disallowed-custom-pattern
          violations: "yes"
          assertionMessage: 'container <gpu-app> requests GPU resources <amd.com/gpu>, but namespace <testns> does not have label <custom.io/gpu-allowed> set to <yes>'
          fields:
            - path: spec.containers[].resources
              scenario: negative
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: disallowed-custom
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        amd.com/gpu: 1
        # Allowed: resource that is not covered by the configured patterns
        - name: example-allowed-resource-outside-custom-patterns
          violations: "no"
          assertionMessage: ""
          fields:
            - path: spec.containers[].resources
              scenario: absent
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: allowed-outside-patterns
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        nvidia.com/gpu: 1
    - name: operation-policy-unanchored-pattern
      gatorBlock: operation-policy-unanchored-pattern
      defaultObjectBase: ""
      template: ../../templates/operation/gpu-resource-restriction.yaml
      constraint: constraints/policy_3.yaml
      cases:
        # Denied: an unanchored pattern also matches a look-alike resource name
        - name: example-disallowed-unanchored-pattern-lookalike
          violations: "yes"
          assertionMessage: 'container <gpu-app> requests GPU resources <not-nvidia.com/gpu>, but namespace <testns> does not have label <gpu.deckhouse.io/enabled> set to <true>'
          fields:
            - path: spec.containers[].resources
              scenario: negative
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: disallowed-lookalike
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        not-nvidia.com/gpu: 1
        # Allowed: the same look-alike name in a namespace that permits GPU usage
        - name: example-allowed-unanchored-pattern-with-label
          violations: "no"
          assertionMessage: ""
          fields:
            - path: spec.containers[].resources
              scenario: positive
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithGpuLabel
          object:
            base: admissionPod
            merge:
              metadata:
                name: allowed-lookalike
                namespace: testns
              spec:
                containers:
                  - name: gpu-app
                    image: my.repo/app:latest
                    resources:
                      limits:
                        not-nvidia.com/gpu: 1
    # Controller-level checks: the same rule evaluated against a pod template
    # instead of a Pod. The pod spec is resolved by lib.common, so a Deployment
    # (spec.template.spec) and a CronJob (spec.jobTemplate.spec.template.spec)
    # must behave exactly like the equivalent Pod.
    - name: operation-policy-controller
      gatorBlock: operation-policy-controller
      defaultObjectBase: ""
      template: ../rendered/constraint-template.yaml
      constraint: constraints/policy_1.yaml
      cases:
        # Denied: a Deployment whose pod template requests a GPU in a namespace without the label
        - name: controller-disallowed-deployment-gpu-without-label
          violations: "yes"
          assertionMessage: 'container <gpu-app> requests GPU resources <nvidia.com/gpu>, but namespace <testns> does not have label <gpu.deckhouse.io/enabled> set to <true>'
          fields:
            - path: spec.template.spec.containers[].resources
              scenario: negative
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionDeployment
            merge:
              metadata:
                name: controller-disallowed-gpu-without-label
                namespace: testns
              spec:
                template:
                  spec:
                    containers:
                      - name: gpu-app
                        image: my.repo/app:latest
                        resources:
                          limits:
                            nvidia.com/gpu: 1
        # Allowed: the same Deployment in a namespace that permits GPU usage
        - name: controller-allowed-deployment-gpu-with-label
          violations: "no"
          assertionMessage: ""
          fields:
            - path: spec.template.spec.containers[].resources
              scenario: positive
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithGpuLabel
          object:
            base: admissionDeployment
            merge:
              metadata:
                name: controller-allowed-gpu-with-label
                namespace: testns
              spec:
                template:
                  spec:
                    containers:
                      - name: gpu-app
                        image: my.repo/app:latest
                        resources:
                          limits:
                            nvidia.com/gpu: 1
        # Allowed: a pod template that requests no GPU resources at all
        - name: controller-allowed-deployment-without-gpu
          violations: "no"
          assertionMessage: ""
          fields:
            - path: spec.template.spec.containers[].resources
              scenario: absent
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionDeployment
            merge:
              metadata:
                name: controller-allowed-without-gpu
                namespace: testns
              spec:
                template:
                  spec:
                    containers:
                      - name: app
                        image: my.repo/app:latest
                        resources:
                          limits:
                            cpu: 1
                            memory: 128Mi
        # Denied: only the initContainer of the pod template requests a GPU
        - name: controller-disallowed-deployment-init-container-gpu
          violations: "yes"
          assertionMessage: 'container <gpu-init> requests GPU resources <nvidia.com/gpu>, but namespace <testns> does not have label <gpu.deckhouse.io/enabled> set to <true>'
          fields:
            - path: spec.template.spec.initContainers[].resources
              scenario: initContainer
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionDeployment
            merge:
              metadata:
                name: controller-disallowed-init-container-gpu
                namespace: testns
              spec:
                template:
                  spec:
                    initContainers:
                      - name: gpu-init
                        image: my.repo/init:latest
                        resources:
                          limits:
                            nvidia.com/gpu: 1
                    containers:
                      - name: app
                        image: my.repo/app:latest
        # Denied: only the second container of a multi-container pod template requests a GPU
        - name: controller-disallowed-deployment-multi-container-gpu
          violations: "yes"
          assertionMessage: 'container <gpu-app> requests GPU resources <nvidia.com/gpu>, but namespace <testns> does not have label <gpu.deckhouse.io/enabled> set to <true>'
          fields:
            - path: spec.template.spec.containers[].resources
              scenario: multiContainer
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionDeployment
            merge:
              metadata:
                name: controller-disallowed-multi-container-gpu
                namespace: testns
              spec:
                template:
                  spec:
                    containers:
                      - name: sidecar
                        image: my.repo/sidecar:latest
                      - name: gpu-app
                        image: my.repo/app:latest
                        resources:
                          requests:
                            nvidia.com/gpu: 2
        # Allowed: a zero quantity means no device is requested, so it is not a GPU request
        - name: controller-allowed-deployment-zero-quantity
          violations: "no"
          assertionMessage: ""
          fields:
            - path: spec.template.spec.containers[].resources
              scenario: positive
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionDeployment
            merge:
              metadata:
                name: controller-allowed-zero-quantity
                namespace: testns
              spec:
                template:
                  spec:
                    containers:
                      - name: app
                        image: my.repo/app:latest
                        resources:
                          limits:
                            nvidia.com/gpu: 0
        # Denied: a CronJob pod template sits one level deeper than a Deployment one
        - name: controller-disallowed-cronjob-gpu-without-label
          violations: "yes"
          assertionMessage: 'container <gpu-app> requests GPU resources <nvidia.com/gpu>, but namespace <testns> does not have label <gpu.deckhouse.io/enabled> set to <true>'
          fields:
            - path: spec.jobTemplate.spec.template.spec.containers[].resources
              scenario: negative
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithoutGpuLabel
          object:
            base: admissionCronJob
            merge:
              metadata:
                name: controller-disallowed-cronjob-gpu
                namespace: testns
              spec:
                jobTemplate:
                  spec:
                    template:
                      spec:
                        containers:
                          - name: gpu-app
                            image: my.repo/app:latest
                            resources:
                              limits:
                                nvidia.com/gpu: 1
        # Allowed: the same CronJob in a namespace that permits GPU usage
        - name: controller-allowed-cronjob-gpu-with-label
          violations: "no"
          assertionMessage: ""
          fields:
            - path: spec.jobTemplate.spec.template.spec.containers[].resources
              scenario: positive
          exception: ""
          exceptionRef: ""
          inventory:
            - base: namespaceWithGpuLabel
          object:
            base: admissionCronJob
            merge:
              metadata:
                name: controller-allowed-cronjob-gpu
                namespace: testns
              spec:
                jobTemplate:
                  spec:
                    template:
                      spec:
                        containers:
                          - name: gpu-app
                            image: my.repo/app:latest
                            resources:
                              limits:
                                nvidia.com/gpu: 1
        # Denied: the namespace is absent from the Gatekeeper cache, so the check fails closed
        - name: controller-disallowed-deployment-namespace-not-cached
          violations: "yes"
          assertionMessage: 'container <gpu-app> requests GPU resources <nvidia.com/gpu>, but namespace <testns> is not present in the Gatekeeper cache, so the label <gpu.deckhouse.io/enabled> cannot be checked'
          fields:
            - path: spec.template.spec.containers[].resources
              scenario: negative
          exception: ""
          exceptionRef: ""
          inventory: []
          object:
            base: admissionDeployment
            merge:
              metadata:
                name: controller-disallowed-namespace-not-cached
                namespace: testns
              spec:
                template:
                  spec:
                    containers:
                      - name: gpu-app
