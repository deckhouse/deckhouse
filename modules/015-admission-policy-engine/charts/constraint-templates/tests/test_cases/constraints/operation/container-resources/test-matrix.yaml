apiVersion: deckhouse.io/v1alpha1
kind: ConstraintTestMatrix
metadata:
  name: container-resources
spec:
  suiteName: d8-container-resources
  outputTestDirectory: rendered
  defaultObjectBase: admissionPod
  defaultInventory: []
  bases:
    admissionPod:
      document:
        apiVersion: v1
        kind: Pod
        metadata:
          namespace: testns
        spec:
          containers:
          - image: nginx
            name: nginx
    admissionDeployment:
      document:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          namespace: testns
        spec:
          template:
            spec:
              containers:
              - image: nginx
                name: nginx
  namedExceptions: {}
  blocks:
  - name: operation-policy
    gatorBlock: operation-policy
    defaultObjectBase: ''
    template: ../../templates/operation/container-resources.yaml
    constraint: constraints/policy_1.yaml
    cases:
    - name: example-allowed
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.containers[].resources
        scenario: positive
      exception: ''
      exceptionRef: ''
      inventory: []
      object:
        base: admissionPod
        merge:
          metadata:
            name: allowed
            namespace: default
          spec:
            containers:
            - name: foo
              image: my.repo/app:latest
              resources:
                limits:
                  cpu: 1
                  memory: 128Mi
                requests:
                  cpu: 1
                  memory: 128Mi
    - name: example-disallowed
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.containers[].resources
        scenario: negative
      exception: ''
      exceptionRef: ''
      inventory: []
      object:
        base: admissionPod
        merge:
          metadata:
            name: disallowed
            namespace: default
          spec:
            containers:
            - name: foo
              image: gcr.io/app:latest
              resources:
                limits:
                  memory: 128Mi
                requests:
                  cpu: 1
                  memory: 128Mi
    - name: example-disallowed-2
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.containers[].resources
        scenario: negative
      exception: ''
      exceptionRef: ''
      inventory: []
      object:
        base: admissionPod
        merge:
          metadata:
            name: disallowed
            namespace: default
          spec:
            containers:
            - name: foo
              image: gcr.io/app:latest
              resources:
                limits:
                  cpu: 1
                requests:
                  cpu: 1
                  memory: 128Mi
    - name: example-disallowed-3
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.containers[].resources
        scenario: initContainer
      exception: ''
      exceptionRef: ''
      inventory: []
      object:
        base: admissionPod
        merge:
          metadata:
            name: disallowed
            namespace: default
          spec:
            containers:
            - name: foo
              image: gcr.io/app:latest
              resources:
                limits:
                  cpu: 1
                  memory: 128Mi
                requests:
                  cpu: 1
                  memory: 128Mi
            initContainers:
            - name: init
              image: gcr.io/init:latest
              resources:
                limits:
                  cpu: 1
                  memory: 128Mi
                requests:
                  memory: 128Mi
    - name: example-disallowed-4
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.containers[].resources
        scenario: ephemeralContainer
      exception: ''
      exceptionRef: ''
      inventory: []
      object:
        base: admissionPod
        merge:
          metadata:
            name: disallowed
            namespace: default
          spec:
            containers:
            - name: foo
              image: gcr.io/app:latest
              resources:
                limits:
                  cpu: 1
                  memory: 128Mi
                requests:
                  cpu: 1
                  memory: 128Mi
            ephemeralContainers:
            - name: eph
              image: gcr.io/eph:latest
              resources:
                limits:
                  cpu: 1
                  memory: 128Mi
                requests:
                  cpu: 1
  - name: pss-controller-deployment
    gatorBlock: pss-controller-deployment
    template: ../rendered/constraint-template.yaml
    constraint: constraints/policy_1.yaml
    cases:
    - name: controller-allowed-container-resources
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.template.spec.containers[].resources
        scenario: positive
      object:
        base: admissionDeployment
        merge:
          metadata:
            name: controller-allowed-container-resources
          spec:
            template:
              spec:
                containers:
                - image: nginx
                  name: nginx
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      cpu: 200m
                      memory: 256Mi
      exception: ''
      exceptionRef: ''
    - name: controller-allowed-deployment-without-resources
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.template.spec.containers[].resources
        scenario: absent
      exception: ''
      exceptionRef: ''
      object:
        base: admissionDeployment
        merge:
          metadata:
            name: controller-without-resources
          spec:
            template:
              spec:
                containers:
                - image: nginx
                  name: nginx
    - name: controller-allowed-deployment-with-empty-resources-object
      violations: 'no'
      assertionMessage: ''
      fields:
      - path: spec.template.spec.containers[].resources
        scenario: absent
      exception: ''
      exceptionRef: ''
      object:
        base: admissionDeployment
        merge:
          metadata:
            name: controller-with-empty-resources-object
          spec:
            template:
              spec:
                containers:
                - image: nginx
                  name: nginx
                  # A real apiserver always sends `resources: {}` for a
                  # container where the user set nothing — corev1.Container.Resources
                  # is a plain (non-pointer) struct, so the field is never actually
                  # absent from a live AdmissionReview the way it is from a
                  # hand-written test object above. This case pins that shape down.
                  resources: {}
    - name: controller-disallowed-deployment-partial-resources
      violations: 'yes'
      assertionMessage: ''
      fields:
      - path: spec.template.spec.containers[].resources
        scenario: negative
      exception: ''
      exceptionRef: ''
      object:
        base: admissionDeployment
        merge:
          metadata:
            name: controller-partial-resources
          spec:
            template:
              spec:
                containers:
                - image: nginx
                  name: nginx
                  resources:
                    limits:
                      memory: 128Mi
                    requests:
                      cpu: 1
                      memory: 128Mi
