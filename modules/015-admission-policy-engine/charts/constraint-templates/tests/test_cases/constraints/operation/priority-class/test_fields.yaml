apiVersion: deckhouse.io/v1alpha1
kind: ConstraintTestFields
metadata:
  name: priority-class
spec:
  objectKind: Pod
  objectKinds:
    - Pod
    - Deployment
  operations:
    - CREATE
    - UPDATE
  objectFields:
    - path: spec.priorityClassName
      level: pod
      description: Pod priorityClassName must be in allowed priorityClassNames list.
      requiredScenarios: [positive, negative, absent]
  applicableTracks:
    functional: true
    spePod: false
    speContainer: false
