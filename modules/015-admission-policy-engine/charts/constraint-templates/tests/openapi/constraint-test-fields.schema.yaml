$schema: "http://json-schema.org/draft-07/schema#"
title: ConstraintTestFields
description: Schema for test_fields.yaml consumed by constraint_testgen for field/scenario coverage checks.
type: object
required:
  - apiVersion
  - kind
  - metadata
  - spec
properties:
  apiVersion:
    type: string
    description: API version of the document.
    minLength: 1
  kind:
    type: string
    description: Document kind. Must be ConstraintTestFields.
    const: ConstraintTestFields
  metadata:
    type: object
    description: Standard Kubernetes-style metadata.
    required:
      - name
    properties:
      name:
        type: string
        description: Constraint name, usually equal to constraint directory name.
        minLength: 1
    additionalProperties: true
  spec:
    type: object
    description: Constraint field/scenario model used by coverage logic.
    required:
      - objectKind
      - objectFields
      - applicableTracks
    properties:
      objectKind:
        type: string
        description: Kubernetes object kind under test (for example Pod).
        minLength: 1
      objectFields:
        type: array
        description: Functional fields from target object and their required scenarios.
        minItems: 1
        items:
          $ref: "#/definitions/objectField"
      speFields:
        type: array
        description: Optional SecurityPolicyException fields and required SPE scenarios.
        items:
          $ref: "#/definitions/speField"
      objectKinds:
        type: array
        description: |
          Required Kubernetes object kinds that must be covered by test cases
          (e.g. Pod, Deployment, StatefulSet). The coverage tool cross-checks
          each declared kind against the actual kinds used in test-matrix cases.
          This catches missing controller-level test coverage (e.g. a rule that
          was extended to match Deployments but has no Deployment test case).
        items:
          type: string
          minLength: 1
        uniqueItems: true
      operations:
        type: array
        description: |
          Required admission operations that must be covered by test cases
          (CREATE, UPDATE, DELETE). The coverage tool reports missing
          operations until the test-matrix schema gains per-case operation
          fields. This catches the H3 class of bug (is_update guard skips
          controller-level UPDATE checks).
        items:
          type: string
          enum: [CREATE, UPDATE, DELETE]
        uniqueItems: true
      applicableTracks:
        type: object
        description: Enabled test tracks. At least one track must be explicitly true.
        properties:
          functional:
            type: boolean
            description: Enables functional track coverage.
          spePod:
            type: boolean
            description: Enables SPE pod-level track coverage.
          speContainer:
            type: boolean
            description: Enables SPE container-level track coverage.
        additionalProperties: false
        anyOf:
          - required: [functional]
            properties:
              functional:
                const: true
          - required: [spePod]
            properties:
              spePod:
                const: true
          - required: [speContainer]
            properties:
              speContainer:
                const: true
    additionalProperties: false
additionalProperties: false
definitions:
  objectField:
    type: object
    description: Functional field specification.
    required:
      - path
    properties:
      path:
        type: string
        description: Field path in tested object (for example spec.containers[].image).
        minLength: 1
      level:
        type: string
        description: Field level used by default scenario expansion/validation.
        enum:
          - pod
          - container
          - initContainer
      defaultBehavior:
        type: string
        description: |
          Policy behavior when the field is absent. When set to "undefined",
          the coverage tool auto-requires the "absent" scenario to catch
          regressions where object.get(..., "") turns a previously-undefined
          field into a concrete value that triggers a false-positive violation.
        enum:
          - Undefined
          - Violates
          - Passthrough
      containerScope:
        type: string
        description: |
          Which container arrays the rule iterates over. Used to verify that
          test cases exercise each declared scope. Catches the C1/H3 class
          of bug where input_containers silently expands from containers to
          containers+initContainers+ephemeralContainers.
        enum:
          - Containers
          - Containers+InitContainers
          - Containers+InitContainers+EphemeralContainers
          - Containers+SidecarInitContainers
      description:
        type: string
        description: Human-readable explanation of why this field matters.
      requiredScenarios:
        type: array
        description: Scenarios that must be covered by matrix cases for this field.
        items:
          type: string
          enum:
            - positive
            - negative
            - absent
            - multiContainer
            - initContainer
            - ephemeralContainer
        uniqueItems: true
    additionalProperties: false
  speField:
    type: object
    description: SecurityPolicyException field specification.
    required:
      - path
    properties:
      path:
        type: string
        description: SPE path used to override/permit specific behavior.
        minLength: 1
      level:
        type: string
        description: SPE field level.
        enum:
          - pod
          - container
      defaultBehavior:
        type: string
        description: Optional textual note about default SPE handling.
      description:
        type: string
        description: Human-readable explanation of this SPE field role.
      requiredScenarios:
        type: array
        description: SPE scenarios that must be covered by matrix cases.
        items:
          type: string
          enum:
            - speMatch
            - speMismatch
            - speAbsent
            - speContainerSpecific
        uniqueItems: true
    additionalProperties: false
