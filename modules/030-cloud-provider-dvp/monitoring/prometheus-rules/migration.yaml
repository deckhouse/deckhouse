- name: d8.cloud-provider-dvp.migration
  rules:
    - alert: D8CloudProviderDVPMigrationPending
      expr: |
        max(d8_cloud_provider_dvp_migration_pending) > 0
      for: 1m
      labels:
        severity_level: "6"
        tier: cluster
        d8_module: cloud-provider-dvp
      annotations:
        plk_markup_format: markdown
        plk_protocol_version: "1"
        summary: Migration of cloud-provider-dvp to ModuleConfig is required.
        description: |-
          The `cloud-provider-dvp` module detected the legacy `DVPClusterConfiguration`.
          Migration to ModuleConfig is mandatory; Deckhouse updates may be blocked until it is completed.

          Follow the documentation: [How to migrate a cloud provider to ModuleConfig-based configuration](https://deckhouse.io/products/kubernetes-platform/documentation/v1/faq.html#subsystem-cluster_infrastructure).
