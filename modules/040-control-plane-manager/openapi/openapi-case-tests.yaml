positive:
  configValues:
    - apiserver:
        publishAPI:
          loadBalancer:
            enabled: true
            sourceRanges:
            - 192.168.0.0/24
            port: 2533
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: nlb
    - etcd:
        backup:
          cronSchedule: "0 0 * * *"
          hostPath: "/var/backup/etcd"
    - resourcesRequests:
        cpu: "1000m"
        memory: "500Mi"
    - kubernetesVersion: "1.32"
    - kubernetesVersion: "1.36"
    # Default is the only sentinel this setting accepts.
    - kubernetesVersion: "Default"
  values:
    - internal:
        effectiveKubernetesVersion: "1.32"
        etcdServers:
        - 1.2.3.4
        - 4.3.2.1
        kubeSchedulerExtenders: []
negative:
  configValues:
    # Outside the supported window for this edition.
    - kubernetesVersion: "1.31"
    - kubernetesVersion: "1.37"
    # Automatic stays legal in ClusterConfiguration but never in ModuleConfig.
    - kubernetesVersion: "Automatic"
    # The sentinel is case-sensitive and must not accept free-form text.
    - kubernetesVersion: "automatic"
    - kubernetesVersion: "default"
    - kubernetesVersion: "latest"
