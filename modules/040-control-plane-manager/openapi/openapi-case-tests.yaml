positive:
  configValues:
    - apiserver:
        publishAPI:
          loadBalancer:
            enabled: true
            sourceRanges:
            - 192.168.0.0/24
            port: 2533
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: nlb
    - etcd:
        backup:
          cronSchedule: "0 0 * * *"
          hostPath: "/var/backup/etcd"
    - resourcesRequests:
        cpu: "1000m"
        memory: "500Mi"
  values:
    - internal:
        effectiveKubernetesVersion: "1.32"
        etcdServers:
        - 1.2.3.4
        - 4.3.2.1
        kubeSchedulerExtenders: []
    - internal:
        effectiveKubernetesVersion: "1.32"
        etcdServers:
        - 1.2.3.4
        kubeSchedulerExtenders:
        - urlPrefix: https://scheduler.test.svc.cluster.local:8080/scheduler
          weight: 5
          timeout: 500ms
          ignorable: true
          caData: ABCD=
          filterVerb: filter
          prioritizeVerb: prioritize
          preemptVerb: ""
