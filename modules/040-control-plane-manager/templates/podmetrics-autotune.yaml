{{- if (.Values.global.enabledModules | has "prometheus-metrics-adapter") }}
{{- /*
  Two PodMetrics (cpu/memory) for all control-plane static pods.
  <<.LabelMatchers>> supplies namespace+pod from the request; the hook selects
  the right pods via component=/tier=control-plane. Container is not hardcoded —
  static pods have a single real container (exclude the POD sandbox).

  DEBUG: lookback window = 7m (prod 7d). Must stay in sync with
  hooks/resources_requests_autotune.go comments.
  DEBUG PromQL: rate[1m] / subquery step 1m (prod rate[5m] / step 5m).
  Memory uses the same subquery form as cpu so short series after a pod
  restart still resolve (plain avg_over_time[window] is flakier).
*/}}
---
apiVersion: deckhouse.io/v1beta1
kind: PodMetric
metadata:
  name: d8-cpm-autotune-cpu
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "d8-control-plane-manager")) | nindent 2 }}
spec:
  query: |
    sum(
      avg_over_time(
        rate(
          container_cpu_usage_seconds_total{<<.LabelMatchers>>,container!="POD",container!=""}[1m]
        )[7m:1m]
      )
    ) by (<<.GroupBy>>)
---
apiVersion: deckhouse.io/v1beta1
kind: PodMetric
metadata:
  name: d8-cpm-autotune-memory
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "d8-control-plane-manager")) | nindent 2 }}
spec:
  query: |
    round(
      sum(
        avg_over_time(
          container_memory_working_set_bytes{<<.LabelMatchers>>,container!="POD",container!=""}[7m:1m]
        )
      ) by (<<.GroupBy>>)
      / 1000 / 1000
    )
{{- end }}
