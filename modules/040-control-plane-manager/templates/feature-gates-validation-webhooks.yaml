{{- /*
  The handlers are feature_gates_generated.py (the feature gate tables, generated by
  tools/generate_feature_gates.go) and k8s_version_common.py (the kubernetesVersion helpers),
  followed by the webhook file. The unit tests load them from webhooks/validating in the same order.
  A ValidationWebhook keeps no full objects in its snapshots, so every binding below has a jqFilter
  that returns the fields the handlers read.
  webhook-operator sets includeSnapshotsFrom of the webhook to every binding of its context, so the
  context of each webhook lists the snapshots its handler reads.
*/}}
{{- $generated := required "webhooks/validating/feature_gates_generated.py is missing" (.Files.Get "webhooks/validating/feature_gates_generated.py") }}
{{- $common := required "webhooks/validating/k8s_version_common.py is missing" (.Files.Get "webhooks/validating/k8s_version_common.py") }}
{{- $featureGates := required "webhooks/validating/feature_gates.py is missing" (.Files.Get "webhooks/validating/feature_gates.py") }}
{{- $k8sVersion := required "webhooks/validating/k8s_version_feature_gates.py is missing" (.Files.Get "webhooks/validating/k8s_version_feature_gates.py") }}
{{- define "cpm_feature_gates_cluster_configuration_binding" }}
- name: d8-cluster-configuration
  kubernetes:
    apiVersion: v1
    kind: Secret
    namespace:
      nameSelector:
        matchNames:
        - kube-system
    nameSelector:
      matchNames:
      - d8-cluster-configuration
    jqFilter: '{"data": .data}'
{{- end }}
{{- define "cpm_feature_gates_cluster_kubernetes_binding" }}
# spec.automaticVersion of this ConfigMap is what "Default" resolves to for the running Deckhouse
# build. It replaces deckhouseDefaultKubernetesVersion in the Secret above, which was only ever
# raised and therefore kept answering with a default that no longer exists after a Deckhouse
# downgrade. The Secret key stays as a fallback for the window before update-observer first writes
# this object.
- name: d8-cluster-kubernetes
  kubernetes:
    apiVersion: v1
    kind: ConfigMap
    namespace:
      nameSelector:
        matchNames:
        - kube-system
    nameSelector:
      matchNames:
      - d8-cluster-kubernetes
    jqFilter: '{"data": {"spec": .data.spec}}'
{{- end }}
---
# Warns about enabledFeatureGates of the control-plane-manager ModuleConfig that the effective
# Kubernetes version forbids, deprecates or does not know.
apiVersion: deckhouse.io/v1alpha1
kind: ValidationWebhook
metadata:
  name: cpm-moduleconfig-feature-gates
  {{- include "helm_lib_module_labels" (list . (dict "app" "webhook-handler")) | nindent 2 }}
validationObject:
  name: cpm-moduleconfig-feature-gates.deckhouse.io
  group: main
  matchConditions:
  - name: "only-control-plane-manager-module"
    expression: 'request.name == "control-plane-manager"'
  rules:
  - apiGroups:   ["deckhouse.io"]
    apiVersions: ["*"]
    operations:  ["CREATE", "UPDATE"]
    resources:   ["moduleconfigs"]
    scope:       "Cluster"
context:
{{- include "cpm_feature_gates_cluster_configuration_binding" . | indent 2 }}
{{- include "cpm_feature_gates_cluster_kubernetes_binding" . | indent 2 }}
handler:
  python: |
    {{- printf "%s\n%s\n%s" $generated $common $featureGates | nindent 4 }}
---
# Denies a change of kubernetesVersion in ClusterConfiguration when an enabled feature gate is
# deprecated in the new version or earlier.
apiVersion: deckhouse.io/v1alpha1
kind: ValidationWebhook
metadata:
  name: cpm-k8s-version-feature-gates
  {{- include "helm_lib_module_labels" (list . (dict "app" "webhook-handler")) | nindent 2 }}
validationObject:
  name: cpm-k8s-version-feature-gates.deckhouse.io
  group: cpm-feature-gates-validation
  namespace:
    labelSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
  labelSelector:
    matchLabels:
      name: d8-cluster-configuration
  rules:
  - apiGroups:   [""]
    apiVersions: ["v1"]
    operations:  ["UPDATE"]
    resources:   ["secrets"]
    scope:       "Namespaced"
# No d8-cluster-configuration snapshot: the handler takes the new configuration from the request.
context:
  - name: module-config-control-plane-manager
    kubernetes:
      apiVersion: deckhouse.io/v1alpha1
      kind: ModuleConfig
      nameSelector:
        matchNames:
        - control-plane-manager
      jqFilter: '{"spec": {"settings": .spec.settings}}'
{{- include "cpm_feature_gates_cluster_kubernetes_binding" . | indent 2 }}
handler:
  python: |
    {{- printf "%s\n%s\n%s" $generated $common $k8sVersion | nindent 4 }}
---
# The same check for kubernetesVersion set directly in the control-plane-manager ModuleConfig,
# without ever touching the d8-cluster-configuration Secret.
apiVersion: deckhouse.io/v1alpha1
kind: ValidationWebhook
metadata:
  name: cpm-k8s-version-feature-gates-mc
  {{- include "helm_lib_module_labels" (list . (dict "app" "webhook-handler")) | nindent 2 }}
validationObject:
  name: cpm-k8s-version-feature-gates-mc.deckhouse.io
  group: cpm-feature-gates-validation
  matchConditions:
  - name: "only-control-plane-manager-module"
    expression: 'request.name == "control-plane-manager"'
  rules:
  - apiGroups:   ["deckhouse.io"]
    apiVersions: ["*"]
    operations:  ["CREATE", "UPDATE"]
    resources:   ["moduleconfigs"]
    scope:       "Cluster"
context:
{{- include "cpm_feature_gates_cluster_configuration_binding" . | indent 2 }}
{{- include "cpm_feature_gates_cluster_kubernetes_binding" . | indent 2 }}
handler:
  python: |
    {{- printf "%s\n%s\n%s" $generated $common $k8sVersion | nindent 4 }}
