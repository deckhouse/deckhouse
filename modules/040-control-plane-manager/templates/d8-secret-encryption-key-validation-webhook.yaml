---
apiVersion: deckhouse.io/v1alpha1
kind: ValidationWebhook
metadata:
  name: d8-secret-encryption-key-configuration
  {{- include "helm_lib_module_labels" (list . (dict "app" "webhook-handler")) | nindent 2 }}
validationObject:
  name: d8-secret-encryption-key-secret.deckhouse.io
  group: main
  labelSelector:
    matchLabels:
      name: d8-secret-encryption-key
  rules:
  - apiGroups:   [""]
    apiVersions: ["v1"]
    operations:  ["*"]
    resources:   ["secrets"]
    scope:       "Namespaced"
handler:
  # The code of the hook is webhooks/validating/d8_secret_encryption_key_configuration.py, where its unit tests load it.
  python: |
    {{- (required "webhooks/validating/d8_secret_encryption_key_configuration.py is missing" (.Files.Get "webhooks/validating/d8_secret_encryption_key_configuration.py")) | nindent 4 }}
