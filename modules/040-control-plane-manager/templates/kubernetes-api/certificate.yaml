{{- $ingressEnabled := eq (include "helm_lib_module_ingress_enabled" .) "true" }}
{{- $gatewayEnabled := eq (include "helm_lib_module_gateway_enabled" .) "true" }}
{{- $publishAPIEnabled := .Values.controlPlaneManager.apiserver.publishAPI.ingress.enabled }}
{{- $mode := "" }}
{{- if $publishAPIEnabled }}
  {{- $mode = .Values.controlPlaneManager.apiserver.publishAPI.ingress.https.mode }}
{{- end }}
{{- if .Values.global.enabledModules | has "cert-manager" }}
{{- /*
  A SelfSigned certificate, like a CustomCertificate, has no per-mechanism issuance or validation
  (it's a local Issuer, not an ACME ClusterIssuer), so it's shared between Ingress and Gateway API
  and must be deployed whenever either one is enabled — not just Ingress.
*/ -}}
{{- $deployPrimaryCertificate := false }}
{{- if and $publishAPIEnabled $ingressEnabled (eq $mode "Global") (eq (include "helm_lib_module_https_mode" .) "CertManager") }}
  {{- $deployPrimaryCertificate = true }}
{{- else if and $publishAPIEnabled (or $ingressEnabled $gatewayEnabled) (eq $mode "SelfSigned") }}
  {{- $deployPrimaryCertificate = true }}
{{- end }}
{{- if $deployPrimaryCertificate }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "publish_api_certificate_name" . }}
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "kubernetes-configurator")) | nindent 2 }}
spec:
  certificateOwnerRef: false
  secretName: {{ include "publish_api_certificate_name" . }}
  {{ include "helm_lib_module_generate_common_name" (list . "api") | nindent 2 }}
  dnsNames:
  - {{ include "helm_lib_module_public_domain" (list . "api") }}
  issuerRef:
  {{- if eq $mode "Global" }}
    name: {{ include "helm_lib_module_https_cert_manager_cluster_issuer_name" . }}
    kind: ClusterIssuer
  {{- else if eq $mode "SelfSigned" }}
    name: kubernetes-api
    kind: Issuer
  {{- end }}
{{- end }}
{{- end }}
{{- if and $gatewayEnabled $publishAPIEnabled (eq $mode "Global") (eq (include "helm_lib_module_https_mode" .) "CertManager") }}
{{- $issuerName := include "helm_lib_module_https_cert_manager_cluster_issuer_name_for_gateway_api" . }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "publish_api_certificate_name" (list . "kubernetes-httproute-tls") }}
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "kubernetes-configurator")) | nindent 2 }}
spec:
  certificateOwnerRef: false
  secretName: {{ include "publish_api_certificate_name" (list . "kubernetes-httproute-tls") }}
  {{ include "helm_lib_module_generate_common_name" (list . "api") | nindent 2 }}
  dnsNames:
  - {{ include "helm_lib_module_public_domain" (list . "api") }}
  issuerRef:
    name: {{ $issuerName }}
    kind: ClusterIssuer
{{- end }}
