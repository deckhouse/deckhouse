{{- $ingressEnabled := eq (include "helm_lib_module_ingress_enabled" .) "true" }}
{{- $gatewayEnabled := eq (include "helm_lib_module_gateway_enabled" .) "true" }}
{{- if .Values.global.enabledModules | has "cert-manager" }}
{{- if and (include "publish_api_deploy_certificate" .) $ingressEnabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "publish_api_certificate_name" . }}
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "kubernetes-configurator")) | nindent 2 }}
spec:
  certificateOwnerRef: false
  secretName: {{ include "publish_api_certificate_name" . }}
  {{ include "helm_lib_module_generate_common_name" (list . "api") | nindent 2 }}
  dnsNames:
  - {{ include "helm_lib_module_public_domain" (list . "api") }}
  issuerRef:
  {{- if eq .Values.controlPlaneManager.apiserver.publishAPI.ingress.https.mode "Global" }}
    name: {{ include "helm_lib_module_https_cert_manager_cluster_issuer_name" . }}
    kind: ClusterIssuer
  {{- else if eq .Values.controlPlaneManager.apiserver.publishAPI.ingress.https.mode "SelfSigned" }}
    name: kubernetes-api
    kind: Issuer
  {{- end }}
{{- end }}
{{- end }}
{{- if and $gatewayEnabled .Values.controlPlaneManager.apiserver.publishAPI.ingress.enabled (eq .Values.controlPlaneManager.apiserver.publishAPI.ingress.https.mode "Global") (eq (include "helm_lib_module_https_mode" .) "CertManager") }}
{{- $issuerName := include "helm_lib_module_https_cert_manager_cluster_issuer_name_for_gateway_api" . }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "publish_api_http_route_certificate_name" . }}
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "kubernetes-configurator")) | nindent 2 }}
spec:
  certificateOwnerRef: false
  secretName: {{ include "publish_api_http_route_certificate_name" . }}
  {{ include "helm_lib_module_generate_common_name" (list . "api") | nindent 2 }}
  dnsNames:
  - {{ include "helm_lib_module_public_domain" (list . "api") }}
  issuerRef:
    name: {{ $issuerName }}
    kind: ClusterIssuer
{{- end }}
