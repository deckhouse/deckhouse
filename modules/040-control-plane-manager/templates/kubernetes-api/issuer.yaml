{{- $moduleGateway := dict }}
{{- include "helm_lib_module_gateway" (list . $moduleGateway) }}
{{- $ingressEnabled := eq (include "helm_lib_module_ingress_enabled" .) "true" }}
{{- $gatewayEnabled := eq (include "helm_lib_module_gateway_enabled" .) "true" }}
{{- $publicationEnabled := or $ingressEnabled $gatewayEnabled }}
{{- if and $publicationEnabled (.Values.controlPlaneManager.apiserver.publishAPI.ingress.enabled) (eq .Values.controlPlaneManager.apiserver.publishAPI.ingress.https.mode "SelfSigned") (.Values.global.enabledModules | has "cert-manager") }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kubernetes-api
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "kubernetes-configurator")) | nindent 2 }}
spec:
  ca:
    secretName: kubernetes-api-ca-key-pair
{{- end }}
{{- if and $publicationEnabled (.Values.controlPlaneManager.internal.selfSignedCA.cert) (.Values.controlPlaneManager.internal.selfSignedCA.key) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-api-ca-key-pair
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "kubernetes-configurator")) | nindent 2 }}
data:
  tls.crt: {{ .Values.controlPlaneManager.internal.selfSignedCA.cert | b64enc }}
  tls.key: {{ .Values.controlPlaneManager.internal.selfSignedCA.key | b64enc }}
{{- end }}
