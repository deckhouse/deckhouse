{{- if .Values.controlPlaneManager.internal.authn.enableBasicAuth }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: basic-auth-proxy
  namespace: d8-{{ .Chart.Name }}
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      {{ include "helm_lib_module_ingress_configuration_snippet" $ | nindent 6 }}
    nginx.ingress.kubernetes.io/rewrite-target: "/$2"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
  {{- if .Values.controlPlaneManager.apiserver.publishAPI.ingress.whitelistSourceRanges }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.controlPlaneManager.apiserver.publishAPI.ingress.whitelistSourceRanges | join "," }}
  {{- end }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "basic-auth-proxy")) | nindent 2 }}
spec:
  ingressClassName: {{ .Values.controlPlaneManager.apiserver.publishAPI.ingress.ingressClass | default (include "helm_lib_module_ingress_class" . | quote ) }}
  rules:
  - host: {{ include "helm_lib_module_public_domain" (list . "api") }}
    http:
      paths:
      - path: /basic-auth(\/?)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: basic-auth-proxy
            port:
              number: 7332
---
apiVersion: v1
kind: Service
metadata:
  name: basic-auth-proxy
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "basic-auth-proxy")) | nindent 2 }}
spec:
  type: ExternalName
  externalName: basic-auth-proxy.d8-user-authn.svc
{{- $moduleGateway := dict }}
{{- include "helm_lib_module_gateway" (list . $moduleGateway) }}
{{- if and $moduleGateway .Values.global.modules.publicDomainTemplate .Values.controlPlaneManager.apiserver.publishAPI.ingress.enabled (include "helm_lib_kind_exists" (list . "HTTPRoute")) }}
{{- $apiHost := include "helm_lib_module_public_domain" (list . "api") }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: basic-auth-proxy
  namespace: kube-system
  annotations:
    alb.network.deckhouse.io/buffer-max-request-bytes: "10485760"
  {{- if .Values.controlPlaneManager.apiserver.publishAPI.ingress.whitelistSourceRanges }}
    alb.network.deckhouse.io/whitelist-source-range: {{ .Values.controlPlaneManager.apiserver.publishAPI.ingress.whitelistSourceRanges | join "," }}
  {{- end }}
  {{- if or (eq (include "helm_lib_module_https_mode" .) "CertManager") (eq (include "helm_lib_module_https_mode" .) "CustomCertificate") }}
    alb.network.deckhouse.io/response-headers-to-add: '{"Strict-Transport-Security":"max-age=31536000; includeSubDomains"}'
  {{- end }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "basic-auth-proxy")) | nindent 2 }}
spec:
  hostnames:
  - {{ $apiHost }}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: control-plane-manager
    namespace: kube-system
    sectionName: api
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: basic-auth-proxy
      namespace: d8-user-authn
      port: 7332
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
      headers:
      - name: Authorization
        type: RegularExpression
        value: ^(.*)Basic(.*)$
{{- end }}
{{- end }}
