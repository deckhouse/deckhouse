{{- if or (.Values.global.discovery.apiVersions | has "deckhouse.io/v1alpha1/SecurityPolicyException") (.Capabilities.APIVersions.Has "deckhouse.io/v1alpha1/SecurityPolicyException") }}
---
apiVersion: deckhouse.io/v1alpha1
kind: SecurityPolicyException
metadata:
  name: control-plane-proxy
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list . (dict "app" "control-plane-proxy")) | nindent 2 }}
spec:
  network:
    hostNetwork:
      allowedValue: true
      metadata:
        description: |
          control-plane-proxy publishes loopback endpoints of the same node: control-plane
          metrics (controller-manager, scheduler, etcd) and the kube-scheduler simulate endpoint.
    hostPorts:
      - port: 4209
        protocol: TCP
        metadata:
          description: HTTPS endpoint of kube-rbac-proxy (metrics and the scheduler simulate endpoint).
{{- end }}
