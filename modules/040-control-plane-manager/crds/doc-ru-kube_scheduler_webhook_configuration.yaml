apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kubeschedulerwebhookconfigurations.deckhouse.io
  labels:
    heritage: deckhouse
    module: control-plane-manager
spec:
  group: deckhouse.io
  scope: Cluster
  names:
    plural: kubeschedulerwebhookconfigurations
    singular: kubeschedulerwebhookconfiguration
    kind: KubeSchedulerWebhookConfiguration
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: ['webhooks']
          description: |
            Определяет конфигурацию внешнего вебхука планировщика (kube-scheduler).

            Подключение внешнего вебхука к планировщику позволяет расширить возможности планировщика, и учитывать более сложные условия при планировании нагрузки в кластере.

            Метрики kube-scheduler и объяснения его решений (текст события `Scheduled` и журнал решений, в виде `extender/<имя>`) называют extender вебхука именем этого объекта. Если в объекте несколько вебхуков, к имени добавляется `/<n>`: номер вебхука в `webhooks`, начиная с 1.

            При симуляции kube-scheduler оценивает, на каких узлах мог бы разместиться под, без его фактического размещения. Запросы `filter` и `prioritize` к extender содержат поле `dryRun: true`, отсутствующее при обычном планировании. Получив `dryRun: true`, extender должен вычислить ответ как обычно и не выполнять побочных действий: не резервировать место или ресурсы для пода и не изменять своё состояние. Extender, который отклоняет неизвестные поля JSON (например, с помощью `DisallowUnknownFields` в Go), будет отвечать ошибкой на запросы симуляции; запросы обычного планирования это не затрагивает.
          properties:
            webhooks:
              type: array
              items:
                type: object
                required: ['weight', 'clientConfig']
                properties:
                  filterVerb:
                    type: string
                    description: |
                      Verb, который добавляется к `URLPrefix` при выполнении вызова `filter` к расширению планировщика (scheduler extender).
                      Если значение не задано, используется `filter`(для обратной совместимости, без необходимости не менять).
                      Укажите пустую строку `""`, чтобы отключить вызовы `filter` для этого расширения.
                  preemptVerb:
                    type: string
                    description: |
                      Verb, который добавляется к `URLPrefix` при выполнении вызова `preempt` к расширению планировщика (scheduler extender).
                      Оставьте пустую строку `""`, если не нужно выполнять вызовы `preempt` для этого расширения.
                  prioritizeVerb:
                    type: string
                    description: |
                      Verb, который добавляется к `URLPrefix` при выполнении вызова `prioritize` к расширению планировщика (scheduler extender).
                      Если значение не задано, используется `prioritize`(для обратной совместимости, без необходимости не менять).
                      Укажите пустую строку `""`, чтобы отключить вызовы `prioritize` для этого расширения.
                  weight:
                    type: integer
                    description: |
                      Числовой множитель для оценок узла, которые генерирует вызов расчета приоритезации.
                    minimum: 1
                  timeout:
                    type: string
                    description: |
                      Таймаут срабатывания вебхука: целое число с суффиксом `ms` или `s`, например `500ms` или `30s`. Допустимы значения от `1ms` до `60s`.

                      Имеет приоритет над `timeoutSeconds`. Если не задан, используется значение `timeoutSeconds`.
                  timeoutSeconds:
                    type: integer
                    description: |
                      Таймаут срабатывания вебхука в секундах.

                      Параметр устарел, используйте вместо него параметр `timeout`. Игнорируется, если задан `timeout`.
                    default: 5
                  failurePolicy:
                    type: string
                    enum: ['Fail', 'Ignore']
                    description: |
                      Политика реакции на событие, если вебхук вернул ошибку или недоступен:
                      - `Fail` — падать с ошибкой;
                      - `Ignore` — пропускать (игнорировать).
                    default: Fail
                  sendPlacements:
                    type: boolean
                    default: false
                    description: |
                      Передавать extender сведения о предварительном резервировании подов на узлах и отмене таких резервирований через поле `assumed` в запросах `prioritize`. Каждая запись содержит поля `uid`, `namespace`, `name`, `node` и `forget: true` для отменённого резервирования.

                      Требуется `prioritizeVerb`. Сведения старше 30 секунд не передаются. После неудачного запроса записи могут передаваться повторно. Extender должен обрабатывать повторы и `forget` для неизвестных ему подов, а при отсутствии `forget` самостоятельно удалять сведения о резервировании через 30 секунд.
                  clientConfig:
                    type: object
                    required: ['service', 'caBundle']
                    description: |
                      ClientConfig определяет параметры доступа к вебхуку.
                    properties:
                      service:
                        type: object
                        required: ['name', 'namespace', 'port', 'path']
                        description: |
                          Параметры доступа к вебхуку через сервис в кластере.
                        properties:
                          name:
                            type: string
                            description: |
                              Имя сервиса.
                          namespace:
                            type: string
                            description: |
                              Namespace сервиса.
                          port:
                            type: integer
                            description: |
                              Порт сервиса.
                          path:
                            type: string
                            description: |
                              URI путь.
                      caBundle:
                        type: string
                        description: |
                          caBundle - это пакет CA в PEM-кодировке, который будет использоваться для проверки сертификата сервера webhook.

