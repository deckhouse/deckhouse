apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    heritage: deckhouse
    module: control-plane-manager
  name: virtualcontrolplanes.control-plane.deckhouse.io
spec:
  group: control-plane.deckhouse.io
  names:
    kind: VirtualControlPlane
    listKind: VirtualControlPlaneList
    plural: virtualcontrolplanes
    shortNames:
    - vcp
    singular: virtualcontrolplane
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Desired Kubernetes version.
      jsonPath: .spec.kubernetesVersion
      name: Version
      type: string
    - description: Desired number of control plane replicas.
      jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - description: Published Kubernetes API endpoint.
      jsonPath: .status.endpoint
      name: Endpoint
      priority: 1
      type: string
    - description: Virtual control plane readiness.
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VirtualControlPlane describes a tenant Kubernetes control plane managed by the control-plane-manager module.

          Each VirtualControlPlane represents one tenant control plane and is used as
          the desired-state source for the resources required to run it in the management cluster.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: Desired state of the virtual control plane.
            properties:
              datastoreRef:
                description: |-
                  Reference to a datastore configuration used by the tenant control plane.

                  The exact datastore contract is intentionally kept small at this stage and can be extended when the
                  datastore implementation is introduced.
                properties:
                  name:
                    description: Datastore configuration name.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              expose:
                description: Kubernetes API exposure settings.
                properties:
                  type:
                    default: LoadBalancer
                    description: |-
                      How the tenant Kubernetes API is published. Only LoadBalancer is supported for
                      now (the per-VCP ALB uses a LoadBalancer inlet).
                    enum:
                    - LoadBalancer
                    type: string
                type: object
              kubernetesVersion:
                description: Desired Kubernetes version for the tenant control plane.
                minLength: 1
                pattern: ^[0-9]+\.[0-9]+(\.[0-9]+)?$
                type: string
              networking:
                description: |-
                  Tenant cluster's network configuration (Service/Pod CIDRs, cluster domain).

                  Required so that the `clusterDomain` default always applies and every field's immutability
                  rule always has a previous value to compare against.
                properties:
                  clusterDomain:
                    default: cluster.virtual
                    description: |-
                      Tenant cluster's DNS domain. Used to build the apiserver's `--service-account-issuer`
                      and the `kubernetes.default.svc.<clusterDomain>` certificate SAN.

                      Warning! Changing this parameter on a running tenant is extremely dangerous: the apiserver
                      serving certificate and `--service-account-issuer` are derived from it only once, at
                      creation. Create a new VirtualControlPlane and migrate workloads instead of changing it.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                    x-kubernetes-validations:
                    - message: clusterDomain is immutable. Create a new VirtualControlPlane and migrate workloads.
                      rule: self == oldSelf
                  podSubnetCIDR:
                    description: |-
                      Address space of the tenant cluster's Pods. Passed to kube-controller-manager as
                      `--cluster-cidr` and to cilium as the Kubernetes-IPAM Pod CIDR source.

                      Warning! Changing this parameter on a running tenant is extremely dangerous: existing
                      nodes and Pods already hold addresses from the current range, and switching it means
                      recreating every node. Create a new VirtualControlPlane and migrate workloads instead
                      of changing it.

                      Must be an IPv4 CIDR between /8 and /24, and shorter than `podSubnetNodeCIDRPrefix`
                      so that at least one node subnet fits.
                    pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/([89]|1[0-9]|2[0-4])$
                    type: string
                    x-kubernetes-validations:
                    - message: podSubnetCIDR is immutable. Create a new VirtualControlPlane and migrate workloads.
                      rule: self == oldSelf
                  podSubnetNodeCIDRPrefix:
                    description: |-
                      Prefix size of the Pod network allocated to each node out of `podSubnetCIDR`. Passed to
                      kube-controller-manager as `--node-cidr-mask-size`.

                      Warning! Changing this parameter on a running tenant is extremely dangerous: nodes that
                      already received a PodCIDR keep the previous prefix, silently fragmenting the Pod address
                      space. Create a new VirtualControlPlane and migrate workloads instead of changing it.

                      This is a policy choice, not a value derivable from `podSubnetCIDR`: the gap between the
                      two trades maximum node count against Pod addresses per node. With `podSubnetCIDR` of
                      `/16` — a `/23` prefix gives 128 nodes with 510 addresses each, `/24` gives 256 with 254,
                      `/25` gives 512 with 126.

                      The upper bound is `/25` because kubelet's `maxPods` is 120 for every prefix of `/24`
                      and above. A `/25` leaves 126 usable addresses and still fits those 120 Pods; a `/26`
                      leaves 62 and does not, so the scheduler would place Pods the node cannot address.
                    pattern: ^(1[6-9]|2[0-5])$
                    type: string
                    x-kubernetes-validations:
                    - message: podSubnetNodeCIDRPrefix is immutable. Create a new VirtualControlPlane and migrate workloads.
                      rule: self == oldSelf
                  serviceSubnetCIDR:
                    description: |-
                      Address space of the tenant cluster's Services. The tenant apiserver serving certificate
                      carries the range's 1st address as an IP SAN, and the tenant DNS Service is addressed at
                      the range's 10th address.

                      Warning! Changing this parameter on a running tenant is extremely dangerous and can lead
                      to complete tenant failure: existing Services keep ClusterIPs from the current range, the
                      apiserver serving certificate silently regenerates with a different SAN (dropping the old
                      `kubernetes.default` SAN), and the tenant DNS Service stays stranded at the old address.
                      Create a new VirtualControlPlane and migrate workloads instead of changing it.

                      Must be an IPv4 CIDR between /12 and /24. `/12` is the largest range kube-apiserver
                      accepts; `/24` leaves room for the `kubernetes` Service, the DNS Service and every
                      Deckhouse module Service.
                    pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(1[2-9]|2[0-4])$
                    type: string
                    x-kubernetes-validations:
                    - message: serviceSubnetCIDR is immutable. Create a new VirtualControlPlane and migrate workloads.
                      rule: self == oldSelf
                required:
                - serviceSubnetCIDR
                - podSubnetCIDR
                - podSubnetNodeCIDRPrefix
                type: object
                x-kubernetes-validations:
                - message: podSubnetNodeCIDRPrefix must be greater than the prefix length of podSubnetCIDR, otherwise no node subnet fits into the Pod address space
                  rule: int(self.podSubnetNodeCIDRPrefix) > cidr(self.podSubnetCIDR).prefixLength()
                - message: "podSubnetCIDR and serviceSubnetCIDR must not overlap: Pod addresses are allocated by cilium and Service addresses by kube-apiserver, and neither knows about the other's range"
                  rule: '!cidr(self.podSubnetCIDR).containsCIDR(self.serviceSubnetCIDR) && !cidr(self.serviceSubnetCIDR).containsCIDR(self.podSubnetCIDR)'
              replicas:
                default: 1
                description: Desired number of control plane replicas.
                minimum: 1
                type: integer
            required:
            - kubernetesVersion
            - networking
            type: object
          status:
            description: Observed state of the virtual control plane.
            properties:
              conditions:
                description: Current service state of the virtual control plane.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status to another.
                      format: date-time
                      type: string
                    message:
                      description: Human-readable message with details about the transition.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: The .metadata.generation value that the condition was set based upon.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: Machine-readable reason for the condition state.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Status of the condition.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Type of condition.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Kubernetes API endpoint exposed for users and tenant worker nodes.
                type: string
              kubeconfigSecretRef:
                description: Reference to a Secret with kubeconfig for accessing the tenant Kubernetes API.
                properties:
                  name:
                    description: Secret name.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: Secret namespace.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                - namespace
                type: object
              observedKubernetesVersion:
                description: Kubernetes version currently observed in the tenant control plane.
                type: string
            type: object
        required:
        - spec
        type: object
    subresources:
      status: {}
    served: true
    storage: true
