spec:
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |
          Описывает tenant control plane Kubernetes, которым управляет модуль `control-plane-manager`.

          Каждый объект VirtualControlPlane представляет один control plane тенанта и
          используется как источник желаемого состояния для ресурсов, необходимых для его запуска в управляющем кластере.
        properties:
          spec:
            description: |
              Желаемое состояние виртуального control plane.
            properties:
              kubernetesVersion:
                description: |
                  Желаемая версия Kubernetes для control plane тенанта.
              replicas:
                description: |
                  Желаемое количество реплик control plane.
              networking:
                description: |
                  Сетевая конфигурация control plane тенанта (CIDR сервисов и подов, домен кластера).

                  Блок обязателен, чтобы значение по умолчанию для `clusterDomain` всегда применялось,
                  а правило неизменяемости каждого поля всегда имело предыдущее значение для сравнения.
                properties:
                  serviceSubnetCIDR:
                    description: |
                      Адресное пространство сервисов кластера тенанта. Из первого адреса диапазона строится
                      IP SAN серверного сертификата apiserver, а из десятого — адрес Service DNS тенанта.

                      Внимание! Изменение этого параметра в работающем тенанте крайне опасно и может привести
                      к полному отказу тенанта: существующие Service сохраняют ClusterIP из текущего диапазона,
                      серверный сертификат apiserver будет молча перевыпущен с другим SAN (потеряв старый SAN
                      `kubernetes.default`), а DNS Service тенанта останется привязан к старому адресу. Вместо
                      изменения этого параметра создайте новый VirtualControlPlane и перенесите нагрузку.

                      Допустим только IPv4 CIDR с префиксом от /12 до /24. `/12` — максимальный диапазон,
                      который принимает kube-apiserver; `/24` оставляет место для Service `kubernetes`,
                      Service DNS и сервисов всех модулей Deckhouse.
                  podSubnetCIDR:
                    description: |
                      Адресное пространство подов кластера тенанта. Передаётся в kube-controller-manager как
                      `--cluster-cidr` и в cilium как источник Pod CIDR для режима Kubernetes IPAM.

                      Внимание! Изменение этого параметра в работающем тенанте крайне опасно: существующие узлы
                      и поды уже используют адреса из текущего диапазона, и смена диапазона означает пересоздание
                      всех узлов. Вместо изменения этого параметра создайте новый VirtualControlPlane и перенесите
                      нагрузку.

                      Допустим только IPv4 CIDR с префиксом от /8 до /24, при этом префикс должен быть короче
                      `podSubnetNodeCIDRPrefix`, иначе в адресное пространство подов не помещается ни одна
                      подсеть узла.
                  podSubnetNodeCIDRPrefix:
                    description: |
                      Размер префикса сети подов, выделяемой каждому узлу из `podSubnetCIDR`. Передаётся в
                      kube-controller-manager как `--node-cidr-mask-size`.

                      Внимание! Изменение этого параметра в работающем тенанте крайне опасно: узлы, уже получившие
                      PodCIDR, сохраняют прежний префикс, что молча фрагментирует адресное пространство подов.
                      Вместо изменения этого параметра создайте новый VirtualControlPlane и перенесите нагрузку.

                      Это самостоятельное решение, а не значение, выводимое из `podSubnetCIDR`: разница между
                      ними задаёт компромисс между максимальным числом узлов и числом адресов подов на узел.
                      При `podSubnetCIDR` размером `/16` префикс `/23` даёт 128 узлов по 510 адресов, `/24` —
                      256 узлов по 254 адреса, `/25` — 512 узлов по 126 адресов.

                      Верхняя граница — `/25`, потому что `maxPods` у kubelet равен 120 для любого префикса
                      от `/24` и мельче. В `/25` остаётся 126 доступных адресов, и эти 120 подов в них
                      помещаются; в `/26` остаётся 62 адреса, и планировщик разместит на узле поды, которым
                      не хватит адресов.
                  clusterDomain:
                    description: |
                      Домен DNS кластера тенанта. Используется для формирования `--service-account-issuer`
                      apiserver и SAN сертификата `kubernetes.default.svc.<clusterDomain>`.

                      Внимание! Изменение этого параметра в работающем тенанте крайне опасно: серверный сертификат
                      apiserver и `--service-account-issuer` вычисляются из него только один раз, при создании.
                      Вместо изменения этого параметра создайте новый VirtualControlPlane и перенесите нагрузку.
              datastoreRef:
                description: |
                  Ссылка на конфигурацию хранилища, используемого control plane тенанта.

                  На этом этапе контракт хранилища намеренно оставлен минимальным и может быть расширен после появления реализации datastore.
                properties:
                  name:
                    description: |
                      Имя конфигурации хранилища.
              expose:
                description: |
                  Настройки публикации Kubernetes API.
                properties:
                  type:
                    description: |
                      Как публикуется Kubernetes API тенанта. Пока поддерживается только `LoadBalancer`
                      (per-VCP ALB использует inlet типа LoadBalancer).
          status:
            description: |
              Наблюдаемое состояние виртуального control plane.
            properties:
              endpoint:
                description: |
                  Endpoint Kubernetes API для пользователей и worker-узлов тенанта.
              observedKubernetesVersion:
                description: |
                  Версия Kubernetes, фактически наблюдаемая в control plane тенанта.
              kubeconfigSecretRef:
                description: |
                  Ссылка на Secret с kubeconfig для доступа к Kubernetes API тенанта.
                properties:
                  name:
                    description: |
                      Имя Secret.
                  namespace:
                    description: |
                      Namespace Secret.
              conditions:
                description: |
                  Текущее состояние virtual control plane.

                  Основное условие — `Ready`.
                items:
                  properties:
                    type:
                      description: |
                        Тип условия.
                    status:
                      description: |
                        Статус условия.
                    reason:
                      description: |
                        Машиночитаемая причина текущего состояния условия.
                    message:
                      description: |
                        Человекочитаемое сообщение с деталями перехода.
                    observedGeneration:
                      description: |
                        Значение `.metadata.generation`, на основании которого было выставлено условие.
                    lastTransitionTime:
                      description: |
                        Время последнего изменения состояния условия.
