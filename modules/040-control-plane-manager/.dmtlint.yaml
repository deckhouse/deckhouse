linters-settings:
  no-cyrillic:
    exclude-rules:
      directories:
        # The RBACv2 templates carry the localized title and description of every role and
        # capability they ship. That is product text, not a source comment: the console shows it
        # to whoever is choosing what to grant, and `d8:namespace-capability:kubernetes:view_logs`
        # on its own tells that person nothing.
        - templates/rbacv2
      files:
        - hooks/audit_policy.go # Contain Russian descriptions of audit rules
  openapi:
    exclude-rules:
      enum:
        # Real Kubernetes ClusterRole names (lowercase by RBAC conventions),
        # set by reconcile_kubeadm_cluster_admins_binding hook; cannot be capitalized.
        - "properties.internal.properties.kubeadmClusterAdminsTargetRoleName"
        # Cryptographic algorithm names use technical format (RSA-2048, ECDSA-P256), not CamelCase.
        - "properties.encryptionAlgorithm"
  container:
    exclude-rules:
      controller-security-context:
        - kind: DaemonSet
          name: control-plane-proxy
      resources:
        - kind: DaemonSet
          name: control-plane-proxy
          container: kube-rbac-proxy
        - kind: DaemonSet
          name: d8-control-plane-manager
          container: image-holder-etcd
        - kind: DaemonSet
          name: d8-control-plane-manager
          container: image-holder-kube-scheduler
        - kind: DaemonSet
          name: d8-control-plane-manager
          container: image-holder-kube-controller-manager
        - kind: DaemonSet
          name: d8-control-plane-manager
          container: image-holder-kube-apiserver
      security-context:
        - kind: DaemonSet
          name: control-plane-proxy
        - kind: DaemonSet
          name: d8-control-plane-manager
          container: image-holder-etcd
        - kind: DaemonSet
          name: d8-control-plane-manager
          container: image-holder-kube-apiserver
        - kind: DaemonSet
          name: d8-control-plane-manager
          container: image-holder-kube-controller-manager
        - kind: DaemonSet
          name: d8-control-plane-manager
          container: image-holder-kube-scheduler
        - kind: DaemonSet
          name: d8-control-plane-manager
          container: image-holder-etcd
