{{- range $key, $value := .CandiVersionMap.k8s }}
  {{- $version := toString $key }}
  {{- $patch := toString $value.patch }}
  {{- $image_version := printf "%s.%s" $version $patch | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $version | replace "." "-" }}
from: {{ index $.Images "base/distroless" }}
vex: {{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/known_vulnerabilities.vex
import:
- from: common/pause
  add: /pause
  to: /pause
  before: setup
- from: common/kubernetes-artifact-{{ $image_version }}
  add: /src/_output/bin/kube-apiserver
  to: /usr/bin/kube-apiserver
  before: setup
{{- include "image mount points" $ }}
imageSpec:
  config:
    entrypoint: ["/usr/bin/kube-apiserver"]
{{- end }}
