apiVersion: deckhouse.io/v1alpha1
kind: ModuleConfig
metadata:
  name: deckhouse
  labels:
    heritage: deckhouse
spec:
  version: 1
  settings:
    bundle: Minimal
---
apiVersion: deckhouse.io/v1alpha1
kind: ModuleConfig
metadata:
  name: kube-dns
  labels:
    heritage: deckhouse
spec:
  enabled: true
---
apiVersion: deckhouse.io/v1alpha1
kind: ModuleConfig
metadata:
  name: operator-prometheus
  labels:
    heritage: deckhouse
spec:
  enabled: true
---
apiVersion: deckhouse.io/v1alpha1
kind: ModuleConfig
metadata:
  name: prometheus
  labels:
    heritage: deckhouse
spec:
  enabled: true
  version: 2
  settings:
    # TODO: Add cert-manager, ingress/alb modules
    https:
      mode: Disabled
