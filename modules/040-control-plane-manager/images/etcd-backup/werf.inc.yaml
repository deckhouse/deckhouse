---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
git:
- add: /{{ $.ModulePath }}/modules/040-{{ $.ModuleName }}/images/{{ $.ImageName }}/entrypoint.sh
  to: /entrypoint.sh
import:
{{- include "image mount points" . }}
- from: {{ .ModuleName }}/etcd-artifact
  add: /etcdctl
  to: /bin/etcdctl
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-pm-artifact
  add: /relocate-pm
  to: /
  before: setup
imageSpec:
  config:
    entrypoint: ["/entrypoint.sh"]
{{- include "pm_binaries_artifact" (dict
      "Images" $.Images
      "name" (printf "%s/%s-pm-artifact" $.ModuleName $.ImageName)
      "packages" "bash gzip tar gawk coreutils"
      "binaries" "/usr/bin/bash:/usr/bin/sh /usr/bin/gawk:/usr/bin/awk /usr/bin/gzip /usr/bin/tar /usr/bin/chmod /usr/bin/df /usr/bin/mv /usr/bin/sleep /usr/bin/tail") }}
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
