---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
git:
- add: /{{ $.ModulePath }}/modules/040-{{ $.ModuleName }}/images/{{ $.ImageName }}/entrypoint.sh
  to: /entrypoint.sh
import:
{{- include "image mount points" . }}
- from: {{ .ModuleName }}/etcd-artifact
  add: /etcdctl
  to: /bin/etcdctl
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /
  to: /
  includePaths:
  # Dynamically linked runtime libraries.
  - usr/lib/libc.so*
  - usr/lib/ld-linux-x86-64.so*
  # Programs used by entrypoint.sh.
  - usr/bin/sh
  - usr/bin/bash
  - usr/bin/awk
  - usr/bin/gawk
  - usr/bin/gzip # dynamic
  - usr/bin/tar
  - usr/bin/chmod
  - usr/bin/df
  - usr/bin/mv
  - usr/bin/sleep
  - usr/bin/tail
  before: setup
imageSpec:
  config:
    entrypoint: ["/entrypoint.sh"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
shell:
  beforeInstall:
  - pm install bash gzip tar gawk coreutils
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
