{{- $version := include "get_oss_version_by_id" (list "apiserver-network-proxy" $ ) }}
{{- $version = printf "v%s" $version }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
final: false
fromImage: common/src-artifact
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
  - git clone -b {{ $version }} --depth 1 $(cat /run/secrets/SOURCE_REPO)/kubernetes-sigs/apiserver-network-proxy.git /src
  - cd /src && rm -rf .git
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
mount:
{{ include "mount points for golang builds" . }}
shell:
  install:
  - cd /src
  - |
    GOPROXY=$(cat /run/secrets/GOPROXY) \
    GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
    go build -mod=vendor \
      -ldflags="-s -w -extldflags '-static'" \
      -o /proxy-agent \
      sigs.k8s.io/apiserver-network-proxy/cmd/agent
---
image: {{ .ModuleName }}/{{ .ImageName }}
fromImage: common/distroless
import:
- image: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /proxy-agent
  to: /proxy-agent
  before: install
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/proxy-agent"]
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
