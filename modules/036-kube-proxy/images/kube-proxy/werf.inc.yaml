{{- include "pm_binaries_artifact" (dict
      "Images" $.Images
      "name" (printf "%s/%s-pm-artifact" $.ModuleName $.ImageName)
      "packages" "conntrack-tools coreutils"
      "binaries" "/usr/sbin/conntrack /usr/sbin/conntrackd /usr/sbin/nfct /usr/bin/unlink") }}

  {{- range $key, $value := .CandiVersionMap.k8s }}
  {{- $version := toString $key }}
  {{- $patch := $value.patch | toString }}
  {{- $v := semver $version }}
  {{- $image_version := printf "%s.%s" $version $patch | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $version | replace "." "-" }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-pm-artifact
  add: /relocate-pm
  to: /
  before: setup
- from: common/kubernetes-artifact-{{ $image_version }}
  add: /src/_output/bin/kube-proxy
  to: /usr/local/bin/kube-proxy
  before: setup
{{- include "image mount points" $ }}
shell:
  setup:
  # prevent mounting to /usr/bin due to /sbin is a symlink to /usr/bin in a container
  - /usr/bin/unlink /sbin
imageSpec:
  config:
    entrypoint: ["/usr/bin/kube-proxy"]
---
{{- include "vex mitigation" (list $ (printf "%s/%s-%s" $.ModuleName $.ImageName ($version | replace "." "-"))) }}
{{- end }}
