linters-settings:
  no-cyrillic:
    exclude-rules:
      directories:
        # The RBACv2 templates carry the localized title and description of every role and
        # capability they ship. That is product text, not a source comment: the console shows it
        # to whoever is choosing what to grant, and `d8:namespace-capability:kubernetes:view_logs`
        # on its own tells that person nothing.
        - templates/rbacv2
  module:
    oss:
      disable: true
  container:
    exclude-rules:
      read-only-root-filesystem:
        - kind: DaemonSet
          name: d8-kube-proxy
          container: kube-proxy
        - kind: DaemonSet
          name: d8-kube-proxy
          container: nodeport-bind-address
      liveness-probe:
        - kind: DaemonSet
          name: d8-kube-proxy
          container: kube-proxy
      readiness-probe:
        - kind: DaemonSet
          name: d8-kube-proxy
          container: kube-proxy
  templates:
    exclude-rules:
      pdb:
        - kind: DaemonSet
          name: d8-kube-proxy
