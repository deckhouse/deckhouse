linters-settings:
  no-cyrillic:
    exclude-rules:
      directories:
        # The RBACv2 templates carry the localized title and description of every role and
        # capability they ship. That is product text, not a source comment: the console shows it
        # to whoever is choosing what to grant, and `d8:namespace-capability:kubernetes:view_logs`
        # on its own tells that person nothing.
        - templates/rbacv2
  container:
    exclude-rules:
      readiness-probe:
        - kind: Deployment
          name: dex-authenticator-dex-authenticator
          container: redis
        - kind: Deployment
          name: test-dex-authenticator
          container: redis
      liveness-probe:
        - kind: Deployment
          name: dex-authenticator-dex-authenticator
          container: redis
        - kind: Deployment
          name: test-dex-authenticator
          container: redis
  templates:
    exclude-rules:
      gateway-enablement:
        files:
          # The rule demands helm_lib_module_gateway_enabled, which also requires a resolvable
          # module Gateway. This route names its ListenerSet explicitly in parentRefs, so it has
          # no use for one: requiring it is exactly what kept DexAuthenticators from working in
          # clusters that publish applications through their own ListenerSets and have no
          # IngressClass at all. The gatewayAPI.enabled switches the rule cares about are still
          # honoured, through user_authn_gateway_api_enabled in templates/_helpers.tpl.
          - templates/dex-authenticator/httproute.yaml
  openapi:
    exclude-rules:
      enum:
        # These enums are kept in a user-friendly order.
        # `spec.saml.nameIDPolicyFormat` is a case-sensitive Dex token (e.g. `emailAddress`, `X509SubjectName`), so we exclude enum linting for it.
        - "spec.versions[*].schema.openAPIV3Schema.properties.spec.properties.github.properties.teamNameField"
        - "spec.versions[*].schema.openAPIV3Schema.properties.spec.properties.saml.properties.nameIDPolicyFormat"
