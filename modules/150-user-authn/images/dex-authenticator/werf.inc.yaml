---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-oauth2-proxy-artifact
  add: /src/oauth2-proxy
  to: /bin/oauth2_proxy
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-url-exec-prober-artifact
  add: /src/url-exec-prober
  to: /usr/local/bin/url-exec-prober
  before: setup
# The templates of the pages and the logo for --custom-sign-in-logo (see templates/dex-authenticator/deployment.yaml).
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /share
  to: /usr/share/dex-authenticator
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: [ "/bin/oauth2_proxy" ]
    cmd: [ "--upstream=http://0.0.0.0:8080/", "--http-address=0.0.0.0:4180" ]
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/src" }}
final: false
git:
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches/
    to: /patches
    stageDependencies:
      install:
        - '**/*'
  - url: {{ $.SOURCE_REPO }}/oauth2-proxy/oauth2-proxy.git
    to: /src
    tag: v{{include "get_oss_version_by_id" (list "oauth2-proxy" $ )}}
    stageDependencies:
      install:
        - '**/*.go'
        - '**/go.mod'
        - '**/go.sum'
  # The pages of DexAuthenticator take the theme of the Deckhouse Dex: its stylesheet, fonts and images are built
  # into the binary next to the static files of oauth2-proxy, so the pages load nothing from another origin.
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/dex/src/web/static
    to: /dex-static
    includePaths:
    - main.css
    - fonts/*.woff2
    - img/deckhouse-background-logo-theme-*.svg
    - img/deckhouse-logo-title.svg
    - img/favicon.svg
    - img/flant-logo-*.svg
    stageDependencies:
      install:
      - '**/*'
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/templates
    to: /share/templates
    stageDependencies:
      install:
      - '**/*'
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/url-exec-prober
    to: /src/url-exec-prober
    includePaths:
    - '**/*.go'
    - '**/go.mod'
    - '**/go.sum'
    stageDependencies:
      install:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
shell:
  install:
    - cd /src
    - git apply --verbose /patches/*.patch
    - rm -rf .git docs
    # go:embed static/* serves these under <proxy prefix>/static/; main.css finds the fonts and images by the same
    # relative paths as in Dex.
    - cp -r /dex-static/. /src/static/
    - cp /dex-static/img/deckhouse-logo-title.svg /share/deckhouse-logo-title.svg
---
image: {{ .ModuleName }}/{{ .ImageName }}-oauth2-proxy-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /src
    to: /src
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - export GOPROXY=$(cat /run/secrets/GOPROXY) CGO_ENABLED=0 GOOS=linux GOARCH=amd64
    - cd /src
    {{- $_ := set $ "ProjectName" (printf "%s/%s/oauth2-proxy" $.ModuleName $.ImageName ) }}
    {{- $oauth2ProxyVersion := printf "v%s" (include "get_oss_version_by_id" (list "oauth2-proxy" $ )) }}
    - |
      {{- include "image-build.build" (set $ "BuildCommand" (printf "go build -ldflags '-s -w -X github.com/oauth2-proxy/oauth2-proxy/v7/pkg/version.VERSION=%s' -o oauth2-proxy ." $oauth2ProxyVersion)) | indent 6 }}
    - chown 64535:64535 oauth2-proxy
    - chmod 0700 oauth2-proxy
---
image: {{ .ModuleName }}/{{ .ImageName }}-url-exec-prober-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src/url-exec-prober
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - export GOPROXY=$(cat /run/secrets/GOPROXY) CGO_ENABLED=0 GOOS=linux GOARCH=amd64
    - cd /src
    {{- $_ := set $ "ProjectName" (printf "%s/%s/url-exec-prober" $.ModuleName $.ImageName ) }}
    - |
      {{- $buildContext := deepCopy $ -}}
      {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
      {{- $_ := set $buildContext "BuildCommand" `go build -ldflags '-s -w' -o url-exec-prober main.go` -}}
      {{- include "image-build.build" $buildContext | indent 6 }}
    - chown 64535:64535 url-exec-prober
    - chmod 0700 url-exec-prober
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-fuzz
from: registry.flant.com/deckhouse/ssdlc/ci-images/fuzz-go:34fdc16d905326c2fd7097363059baa398c9a1c0
fromLatest: true
final: false
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /src
    to: /src
    before: install
git:
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/Taskfile.fuzz.yml
    to: /src/Taskfile.yml
    stageDependencies:
      install:
        - Taskfile.fuzz.yml
secrets:
  - id: GOPROXY
    value: {{ $.GOPROXY }}
shell:
  install:
    - cd /src
    - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
    - rm -rf test/e2e tests/e2e tests/ginkgo
    - chmod -R a+rwX /src /fuzz/gomod
imageSpec:
  config:
    workingDir: /src
    labels:
      io.deckhouse.fuzz.engine: go
    env:
      FUZZ_WORKDIR: /src
      FUZZ_PACKAGES: ". ./pkg/middleware ./pkg/sessions/persistence ./pkg/deckhouse/revocation"
      CGO_ENABLED: "0"
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
