---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /out
  to: /
  before: install
imageSpec:
  config:
    entrypoint: ["/usr/bin/redis-server"]
    # The image carries no glibc locale data, so any LANG/LC_* value other than "C"
    # makes redis fail on startup with "Failed to configure LOCALE for invalid locale name."
    env:
      LANG: "C"
      LC_ALL: "C"
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
shell:
  beforeInstall:
  # The version line is pinned: the redis-peers session store of dex-authenticator (patch 017 of
  # its image) relies on how Redis 7.4 copies a neighbour (REPLICAOF, LOADING, replica-read-only).
  # Another line is taken on purpose, with the integration tests of that patch run against it.
  # The dex-authenticator-app e2e case checks the version of the running Redis.
  - pm install redis@7.4 -d /out
  - rm -f /out/usr/bin/redis-cli
