{{- $dexVersion := include "get_oss_version_by_id" (list "dex" $ ) }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
fromImage: common/distroless
import:
- image: {{ $.ModuleName }}/{{ $.ImageName }}-dex-artifact
  add: /src/dex
  to: /usr/local/bin/dex
  before: setup
- image: {{ $.ModuleName }}/{{ $.ImageName }}-dex-src-artifact
  add: /web
  to: /web
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/usr/local/bin/dex", "serve", "/etc/dex/config.docker.yaml"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-dex-src-artifact
fromImage: common/src-artifact
fromCacheVersion: "2025-02-18.01"
final: false
git:
  - url: {{ $.SOURCE_REPO }}/dexidp/dex.git
    to: /src
    tag: v{{ $dexVersion }}
    stageDependencies:
      install:
        - '**/*.go'
        - '**/go.mod'
        - '**/go.sum'
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/crds/
    to: /module_crds
    stageDependencies:
      install:
        - '**/*'
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches/
    to: /patches
    stageDependencies:
      install:
        - '**/*'
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/src/web
    to: /web
    stageDependencies:
      install:
        - '**/*'
shell:
  install:
    - cd /src
    - git apply /patches/*.patch --verbose
    # Check after patches are applied: our patches may legitimately update Dex
    # source CRDs (e.g. additionalPrinterColumns for OfflineSessions); the
    # snapshot in modules/.../crds/external must match the post-patch source.
    - bash /module_crds/pull_dex_crds.sh --check --dex-dir /src/scripts/manifests/crds
    - rm -rf examples
---
image: {{ .ModuleName }}/{{ .ImageName }}-dex-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
  - image: {{ $.ModuleName }}/{{ $.ImageName }}-dex-src-artifact
    add: /src
    to: /src
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - export GOPROXY=$(cat /run/secrets/GOPROXY) CGO_ENABLED=0 GOOS=linux GOARCH=amd64
    - export LDFLAGS='-s -w -extldflags=-static -X main.version={{ $dexVersion }}'
    - cd /src
    - |
      {{- include "image-build.build" (set $ "BuildCommand" `go build -ldflags "${LDFLAGS}" -tags netgo -o dex ./cmd/dex`) | indent 6 }}
    - chown 64535:64535 dex
    - chmod 0700 dex
{{- if eq (env "FUZZ_BUILD_ENABLED" "false") "true" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-fuzz
from: registry.flant.com/deckhouse/ssdlc/ci-images/fuzz-go:34fdc16d905326c2fd7097363059baa398c9a1c0
fromLatest: true
final: false
import:
  - image: {{ $.ModuleName }}/{{ $.ImageName }}-dex-src-artifact
    add: /src
    to: /src
    before: install
git:
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/Taskfile.fuzz.yml
    to: /src/Taskfile.yml
    stageDependencies:
      install:
        - Taskfile.fuzz.yml
secrets:
  - id: GOPROXY
    value: {{ $.GOPROXY }}
shell:
  install:
    - cd /src
    - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
    - rm -rf test/e2e tests/e2e tests/ginkgo
    - chmod -R a+rwX /src /fuzz/gomod
imageSpec:
  config:
    workingDir: /src
    labels:
      io.deckhouse.fuzz.engine: go
    env:
      FUZZ_WORKDIR: /src
      FUZZ_PACKAGES: "./server"
      CGO_ENABLED: "0"
{{- end }}
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
