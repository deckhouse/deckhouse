---
apiVersion: deckhouse.io/v1
kind: DexAuthenticator
metadata:
  name: portal
  namespace: shop
  uid: 00000000-0000-4000-8000-000000000002
  creationTimestamp: '2026-01-01T00:00:02Z'
spec:
  sendAuthorizationHeader: true
  keepUsersLoggedInFor: 24h
  allowedEmails:
  - john.doe@example.com
  allowedGroups:
  - admins
  - group with spaces
  allowedProviders:
  - local
  - corp-ldap
  applicationDomain: portal.example.com
  applicationIngressClassName: nginx
  applicationIngressCertificateSecretName: portal-tls
  signOutURL: /logout
  whitelistSourceRanges:
  - 10.0.0.0/8
  - 192.168.42.0/24
  additionalApplications:
  - domain: admin.portal.example.com
    ingressClassName: internal
    signOutURL: /admin/sign-out
  - domain: api.portal.example.com
    ingressClassName: nginx
    ingressSecretName: api-tls
---
apiVersion: deckhouse.io/v1
kind: DexAuthenticator
metadata:
  name: routes
  namespace: gateway-apps
  uid: 00000000-0000-4000-8000-000000000003
  creationTimestamp: '2026-01-01T00:00:03Z'
spec:
  applicationDomain: routes.example.com
  applicationIngressCertificateSecretName: null
  gatewayAPI:
    applicationHTTPRouteListenerSetName: public
  signOutURL: /sign-out
  whitelistSourceRanges:
  - 10.0.0.0/8
  additionalApplications:
  - domain: both.example.com
    ingressClassName: nginx
    gatewayAPI:
      httpRouteListenerSetName: shared
      httpRouteListenerSetNamespace: d8-alb
      httpRouteListenerSetSectionName: https
  - domain: bare.example.com
---
