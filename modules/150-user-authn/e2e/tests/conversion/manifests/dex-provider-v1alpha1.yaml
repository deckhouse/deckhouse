# Disabled, so the module does not add it to the Dex configuration and Dex is not restarted.
apiVersion: deckhouse.io/v1alpha1
kind: DexProvider
metadata:
  name: e2e-authn-conv-github
spec:
  type: Github
  displayName: e2e conversion
  enabled: false
  github:
    clientID: e2e-authn-not-a-client
    clientSecret: e2e-authn-not-a-secret
    teamNameField: slug
