apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-authn-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-authn-app
  template:
    metadata:
      labels:
        app: e2e-authn-app
    spec:
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netexec
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-authn-app
spec:
  selector:
    app: e2e-authn-app
  ports:
    - name: http
      port: 80
      targetPort: http
