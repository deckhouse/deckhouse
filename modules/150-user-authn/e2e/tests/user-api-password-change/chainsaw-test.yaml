apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: user-authn-user-api-password-change
spec:
  description: >-
    user-api no longer serves POST /api/v1/password/reset (404). Its self-service password change at
    POST /api/v1/self/password-change refuses a request without a bearer token (401) and the token of
    a device signed in less than devices.trustedAfter ago (403), and creates no UserOperation then.
    The suite does not change devices.trustedAfter.
  concurrent: false

  catch:
    - description: Show user-api pods and the UserOperations on failure
      script:
        # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
        shell: bash
        shellArgs: ["-c"]
        content: |
          kubectl -n d8-user-authn get pods -l app=user-api -o wide
          kubectl get useroperations.deckhouse.io -o wide | grep -E 'NAME|e2e-authn-api-user' || true
    - description: Show user-api logs on failure
      podLogs:
        namespace: d8-user-authn
        selector: app=user-api
        tail: 100

  steps:
    - name: prerequisites
      description: Make sure the module is enabled and converged and Dex answers
      use:
        template: ../common/steps/ensure-user-authn.yaml

    - name: create-user-and-client
      description: Create the User and a DexClient; user-api runs while local users exist
      try:
        - description: Create User e2e-authn-api-user
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            content: |
              set -euo pipefail
              source ../../tests/common/scripts/lib.sh
              create_user user-api-password-change e2e-authn-api-user e2e-authn-api-user@example.com
        - description: Create DexClient e2e-authn-api-client
          create:
            file: manifests/dex-client.yaml
        - description: Wait for the client Secret and OAuth2Client
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            timeout: 11m
            env:
              - name: NS
                value: ($namespace)
            content: |
              set -euo pipefail
              source ../../tests/common/scripts/lib.sh
              wait_dex_client "${NS}" e2e-authn-api-client
        - description: Assert the user-api Deployment is available
          assert:
            timeout: 5m
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: user-api
                namespace: d8-user-authn
              status:
                (availableReplicas >= `1`): true
      cleanup:
        - description: Delete the User
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            content: kubectl delete users.deckhouse.io e2e-authn-api-user --ignore-not-found

    - name: self-service-password-change
      description: The user asks user-api for a password change with the ID token of a new device
      try:
        - description: Sign in to get an ID token
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            timeout: 6m
            env:
              - name: NS
                value: ($namespace)
            content: >-
              bash ../../tests/common/scripts/get-token.sh user-api-password-change "${NS}" e2e-authn-api-client
              e2e-authn-api-user e2e-authn-api-user@example.com
        - description: Call the removed endpoint, and the password change without a token and from a new device
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            timeout: 2m
            content: bash scripts/call-user-api.sh
