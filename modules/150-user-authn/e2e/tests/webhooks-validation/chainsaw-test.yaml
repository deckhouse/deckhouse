apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: user-authn-webhooks-validation
spec:
  description: >-
    The validating webhooks and CEL rules of the module refuse invalid objects with the messages
    from the module code: a User with a duplicate email (also in another case), an uppercase or
    "system:" email or the deprecated spec.groups; a change of the password hash; a Group with a
    duplicate spec.name, a "system:" name or a membership cycle; a UserOperation with a zero lock
    duration or a ResetPassword for an external target; a DexAuthenticator with an IP address as
    the domain, without a publishing method, with a dot in the name or with a domain another
    DexAuthenticator already serves.
  concurrent: false

  catch:
    - description: Show the Users and Groups of the test on failure
      script:
        # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
        shell: bash
        shellArgs: ["-c"]
        content: |
          kubectl get users.deckhouse.io -o custom-columns=NAME:.metadata.name,EMAIL:.spec.email | grep -E 'NAME|e2e-authn-hook' || true
          kubectl get groups.deckhouse.io -o yaml | grep -E -B2 -A12 'name: e2e-authn-hook' || true
    - description: Show the webhook handler logs on failure
      podLogs:
        namespace: d8-system
        selector: app=webhook-handler
        tail: 100

  steps:
    - name: prerequisites
      description: Make sure the module is enabled and converged and Dex answers
      use:
        template: ../common/steps/ensure-user-authn.yaml

    - name: create-existing-objects
      description: Create the objects the refused ones conflict with
      try:
        - description: Create User e2e-authn-hook-user1 with email e2e-authn-hook@example.com
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            content: |
              set -euo pipefail
              source ../../tests/common/scripts/lib.sh
              create_user webhooks-validation e2e-authn-hook-user1 e2e-authn-hook@example.com
        - description: Create Group e2e-authn-hook-group-a that names the future Group e2e-authn-hook-b as a member
          create:
            file: manifests/groups.yaml
        - description: Create DexAuthenticator e2e-authn-hook-first for domain e2e-authn-hooks.example.com
          create:
            file: manifests/dex-authenticator.yaml
        - description: Give the webhook snapshots time to receive the new objects
          sleep:
            duration: 10s
      cleanup:
        - description: Delete the objects the test may have left
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            env:
              - name: NS
                value: ($namespace)
            timeout: 6m
            content: |
              kubectl delete users.deckhouse.io e2e-authn-hook-user1 e2e-authn-hook-user2 e2e-authn-hook-user3 e2e-authn-hook-upper e2e-authn-hook-system e2e-authn-hook-groups --ignore-not-found
              kubectl delete groups.deckhouse.io e2e-authn-hook-group-a e2e-authn-hook-group-b e2e-authn-hook-group-c e2e-authn-hook-group-dup e2e-authn-hook-group-system --ignore-not-found
              kubectl delete useroperations.deckhouse.io e2e-authn-hook-zero-lock e2e-authn-hook-target-reset --ignore-not-found
              bash ../../tests/common/scripts/delete-dex-authenticator.sh "${NS}" e2e-authn-hook-first

    - name: user-webhook
      description: The users-unique webhook and the CEL rule of User refuse invalid Users
      try:
        - description: Refuse a second User with the same email
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/user-duplicate-email.yaml \
                'users.deckhouse.io "e2e-authn-hook-user2", user "e2e-authn-hook-user1" is already using email "e2e-authn-hook@example.com" (case-insensitive match)'
        - description: Refuse a User whose email differs from an existing one only in case
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/user-duplicate-email-case.yaml \
                'users.deckhouse.io "e2e-authn-hook-user3", user "e2e-authn-hook-user1" is already using email "e2e-authn-hook@example.com" (case-insensitive match)'
        - description: Refuse a new User with an uppercase email
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/user-uppercase-email.yaml \
                'users.deckhouse.io "e2e-authn-hook-upper", ".spec.email" must be lowercase. Use "e2e-authn-upper@example.com" instead'
        - description: >-
            Refuse a User whose email starts with system: the ValidatingAdmissionPolicy
            system-users.deckhouse.io (templates/validation.yaml) requires an email address and decides
            before the webhook
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/user-system-email.yaml \
                "ValidatingAdmissionPolicy 'system-users.deckhouse.io' with binding 'system-users.deckhouse.io' denied request"
        - description: Refuse a new User with the deprecated spec.groups
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/user-deprecated-groups.yaml \
                '".spec.groups" is deprecated, use the "Group" object.'
        - description: Refuse a change of the password hash of an existing User
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            check:
              ($error != null): true
              (contains($stderr, 'password is immutable; use the UserOperation resource or d8 iam user reset-password to reset the password')): true
            content: |
              kubectl patch users.deckhouse.io e2e-authn-hook-user1 --type merge -p '{"spec":{"password":"changed-value"}}'

    - name: group-webhook
      description: The groups webhook refuses duplicate names, system names and membership cycles
      try:
        - description: Refuse a Group with the spec.name of an existing Group
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/group-duplicate-name.yaml \
                'groups.deckhouse.io "e2e-authn-hook-a" already exists'
        - description: Refuse a Group that closes the cycle e2e-authn-hook-b -> e2e-authn-hook-a -> e2e-authn-hook-b
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/group-cycle.yaml \
                'Invalid group hierarchy: cycle detected! Path: groups.deckhouse.io("e2e-authn-hook-b" -> "e2e-authn-hook-a" -> "e2e-authn-hook-b"). Groups must form a tree without circular references.'
        - description: Refuse a Group that contains itself
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/group-self-cycle.yaml \
                'Invalid group hierarchy: cycle detected! Path: groups.deckhouse.io("e2e-authn-hook-c" -> "e2e-authn-hook-c")'
        - description: Refuse a Group whose spec.name starts with system
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/group-system-name.yaml \
                'groups.deckhouse.io "system:e2e-authn-hook" must not start with the "system:" prefix'

    - name: useroperation-rules
      description: The CEL rules of UserOperation refuse a zero lock duration and a ResetPassword for an external target
      try:
        - description: Refuse a Lock for 0s
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/useroperation-zero-lock.yaml \
                'lock.for must be "permanent" or a positive Go-style duration using s/m/h/d'
        - description: Refuse a ResetPassword for spec.target
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/useroperation-target-reset.yaml \
                'spec.target is only supported for Lock and Unlock operations; ResetPassword and Reset2FA apply to local users (spec.user) only.'

    - name: dex-authenticator-rules
      description: The DexAuthenticator webhook and CEL rules refuse invalid authenticators
      try:
        - description: Refuse an IP address as the application domain
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            env:
              - name: NS
                value: ($namespace)
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/dex-authenticator-ip-domain.yaml \
                "DexAuthenticator '${NS}/e2e-authn-hook-ip' is invalid: '.spec.applicationDomain' must be a DNS name, not an IP address ('10.0.0.1')" "${NS}"
        - description: Refuse an authenticator without applicationIngressClassName and gatewayAPI
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            env:
              - name: NS
                value: ($namespace)
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/dex-authenticator-no-publishing.yaml \
                'Specify applicationIngressClassName or gatewayAPI to publish the application.' "${NS}"
        - description: Refuse a name with a dot, which cannot be a part of a Service name
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            env:
              - name: NS
                value: ($namespace)
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/dex-authenticator-bad-name.yaml \
                'The DexAuthenticator name must start with a letter and contain only lowercase letters, digits and hyphens' "${NS}"
        - description: Refuse a second authenticator for the same domain and Ingress class
          script:
            # Chainsaw runs scripts with /bin/sh (dash on the master); the scripts are bash.
            shell: bash
            shellArgs: ["-c"]
            env:
              - name: NS
                value: ($namespace)
            content: |
              bash ../../tests/common/scripts/expect-denied.sh manifests/denied/dex-authenticator-conflict.yaml \
                "Desired DexAuthenticator '${NS}/e2e-authn-hook-second' conflicts with the existing DexAuthenticator '${NS}/e2e-authn-hook-first' for domain 'e2e-authn-hooks.example.com'" "${NS}"
