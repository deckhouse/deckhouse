# Its Ingress uses a class that no controller serves; the probe calls the shared dex-authenticator
# directly and names this applicationDomain in X-Original-URL.
apiVersion: deckhouse.io/v1
kind: DexAuthenticator
metadata:
  name: e2e-authn-ha
spec:
  applicationDomain: e2e-authn-ha.example.com
  applicationIngressClassName: e2e-authn-unused
