version: "3"

vars:
  CONFIG: ../../chainsaw-config.yaml

# Bindings are overridden after `--`, e.g. `task run -- --set hold=900 --set recovery=180`.
tasks:
  run:
    desc: Run the scenario against the current kubectl context with a JUnit report
    cmds:
      - mkdir -p ./reports
      - chainsaw test --test-dir . --config {{.CONFIG}} --parallel 1 --report-format JUNIT-STEP --report-path ./reports/ {{.CLI_ARGS}}

  run:quiet:
    desc: Run the scenario with suppressed output (only errors, failures, summary)
    cmds:
      - mkdir -p ./reports
      - chainsaw test --test-dir . --config {{.CONFIG}} --parallel 1 --report-format JUNIT-STEP --report-path ./reports/ --quiet {{.CLI_ARGS}}

  lint:
    desc: Validate the test and the configuration against the Chainsaw schema without a cluster
    cmds:
      - task: lint:test
      - task: lint:configuration

  lint:test:
    desc: Validate the test against the Chainsaw schema without a cluster
    cmds:
      - chainsaw lint test -f chainsaw-test.yaml

  lint:configuration:
    desc: Validate the configuration against the Chainsaw schema without a cluster
    cmds:
      - chainsaw lint configuration -f {{.CONFIG}}

  run:debug:
    desc: Run the scenario with a pause on failure and fail-fast
    cmds:
      - mkdir -p ./reports
      - chainsaw test --test-dir . --config {{.CONFIG}} --parallel 1 --report-format JUNIT-STEP --report-path ./reports/ --pause-on-failure --fail-fast {{.CLI_ARGS}}
