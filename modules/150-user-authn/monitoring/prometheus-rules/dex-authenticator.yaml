- name: d8.user-authn.dex-authenticator
  rules:
  - alert: D8DexAuthenticatorNamespaceUnusable
    expr: max by (name, namespace) (d8_user_authn_dex_authenticator_skipped) == 1
    for: 10m
    labels:
      severity_level: "7"
      tier: cluster
      d8_module: user-authn
      d8_component: dex-authenticator
    annotations:
      plk_markup_format: markdown
      plk_protocol_version: "1"
      plk_create_group_if_not_exists__d8_dex_authenticator_unusable: "D8DexAuthenticatorNamespaceUnusable,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_dex_authenticator_unusable: "D8DexAuthenticatorNamespaceUnusable,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: DexAuthenticator `{{ $labels.namespace }}/{{ $labels.name }}` is left out of the release because its namespace accepts no objects.
      description: |
        The `{{ $labels.namespace }}` namespace is terminating, so the API server refuses every create in it. The `user-authn` module leaves the DexAuthenticator `{{ $labels.name }}` out of its release: with it, the release would fail on the objects it cannot create and the Deckhouse main queue would stop behind the retrying module.

        A namespace does not finish terminating while something in it holds a finalizer, and the authenticator is usually that something. Check what keeps the namespace:

        ```bash
        kubectl get namespace {{ $labels.namespace }} -o jsonpath='{.status.conditions}'
        kubectl -n {{ $labels.namespace }} get dexauthenticator {{ $labels.name }} -o jsonpath='{.metadata.finalizers}'
        ```

        Let the deletion finish: remove the finalizer that holds the authenticator, or delete the object that owns it. The authenticator is deleted with its namespace; to keep it, recreate it in a live namespace. The alert resolves once the authenticator is gone.
