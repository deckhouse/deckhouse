- name: d8.user-authn.deprecation
  rules:
  - alert: D8DexProviderLDAPTLSConflict
    expr: max by (name, conflict) (d8_dex_provider_ldap_tls_conflict) == 1
    labels:
      severity_level: "8"
      tier: cluster
      d8_module: user-authn
      d8_component: dex
    annotations:
      plk_markup_format: markdown
      plk_protocol_version: "1"
      plk_create_group_if_not_exists__d8_user_authn_deprecations: "UserAuthnDeprecations,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_user_authn_deprecations: "UserAuthnDeprecations,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: DexProvider `{{ $labels.name }}` has a conflicting LDAP TLS configuration.
      description: |
        DexProvider `{{ $labels.name }}` combines mutually exclusive LDAP TLS settings: `{{ $labels.conflict }}`. Dex silently ignores the redundant flag, which masks misconfiguration:

        * `insecureNoSSL + startTLS`: TLS is disabled (ldap://, port 389), so `startTLS` is ignored.
        * `insecureNoSSL + insecureSkipVerify`: TLS is disabled, there is no certificate to verify.
        * `insecureNoSSL + rootCAData`: TLS is disabled, the CA chain is ignored.

        The CRD schema rejects this combination on create/update; this DexProvider was created before the validation was added and remains active.

        Update the DexProvider to remove the conflict:

        * Plaintext LDAP (port 389): keep `spec.ldap.insecureNoSSL: true`, remove `startTLS`, `insecureSkipVerify`, and `rootCAData`.
        * STARTTLS on port 389: set `spec.ldap.insecureNoSSL: false`, `spec.ldap.startTLS: true`. Use `insecureSkipVerify` or `rootCAData` as needed.
        * `ldaps://` on port 636: leave `insecureNoSSL` and `startTLS` at `false`. Use `insecureSkipVerify` or `rootCAData` as appropriate.

        Audit all LDAP DexProvider objects:

        ```bash
        kubectl get dexproviders.deckhouse.io -o yaml \
          | yq '.items[] | select(.spec.type=="LDAP") | {name: .metadata.name, ldap: .spec.ldap | pick(["insecureNoSSL","startTLS","insecureSkipVerify","rootCAData"])}'
        ```

  - alert: D8UserAuthnIDTokenTTLTooLong
    expr: d8_user_authn_id_token_ttl_too_long == 1
    for: 5m
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: user-authn
      d8_component: dex
    annotations:
      plk_markup_format: markdown
      plk_protocol_version: "1"
      plk_create_group_if_not_exists__d8_user_authn_deprecations: "UserAuthnDeprecations,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_user_authn_deprecations: "UserAuthnDeprecations,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: user-authn `idTokenTTL` is {{ $labels.id_token_ttl }}; the next settings version lowers it to `5h59m`.
      description: |
        The ModuleConfig `user-authn` sets `idTokenTTL: {{ $labels.id_token_ttl }}`, which is 6 hours or more.

        Dex is configured with `expiry.signingKeys: 6h`: every 6 hours it rotates the key used to sign ID tokens and keeps previous keys only while tokens signed with them can still be valid.

        `idTokenTTL` maps to Dex `expiry.idTokens`. If that lifetime is 6 hours or more, an ID token outlives the rotation of the key that signed it, and Dex keeps and publishes one more previous key for every 6 hours of `idTokenTTL`. That is why `idTokenTTL` should be less than `6h`.

        The next version of the module settings (`spec.version` of the ModuleConfig) accepts only values less than `6h`. When this ModuleConfig is converted to it, `idTokenTTL` is replaced with `5h59m`, which Dex and DexAuthenticator then use. The alert fires until the ModuleConfig itself sets a value less than `6h`.

        Lowering `idTokenTTL`, in the ModuleConfig or by this conversion, has the following effects:

        - DexAuthenticator sessions whose `keepUsersLoggedInFor` is less than the previous `idTokenTTL` become shorter. A session lasts `keepUsersLoggedInFor` or `idTokenTTL + 1s`, whichever is longer. For example, when `idTokenTTL` goes from `24h` to `5h59m`, a session with `keepUsersLoggedInFor: 12h` lasts 12 hours instead of 24 hours and 1 second.
        - ID tokens that Dex signed before the change with the signing key current at that moment can be rejected about 6 to 12 hours after the change, before they expire, because Dex then keeps a replaced signing key only for as long as the new `idTokenTTL` requires. A client that refreshes an ID token only when it expires, such as kubectl with `auth-provider: oidc` in the kubeconfig, keeps sending the rejected token until the token expires. To make such a client request a new token, remove `id-token` from its kubeconfig.

        To choose when this happens, lower `idTokenTTL` yourself, for example:

        ```yaml
        apiVersion: deckhouse.io/v1alpha1
        kind: ModuleConfig
        metadata:
          name: user-authn
        spec:
          version: 2
          settings:
            idTokenTTL: 1h
        ```
