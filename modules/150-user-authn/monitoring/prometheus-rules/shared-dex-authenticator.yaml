- name: d8.user-authn.shared-dex-authenticator
  rules:
  - alert: D8SharedDexAuthenticatorClientTableNotLoaded
    expr: |
      increase(
        oauth2_proxy_client_table_reload_duration_seconds_count{
          namespace="d8-user-authn",
          job="shared-dex-authenticator",
          result="error"
        }[10m]
      ) > 0
    for: 10m
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: user-authn
      d8_component: shared-dex-authenticator
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: markdown
      plk_create_group_if_not_exists__d8_shared_dex_authenticator_malfunctioning: "D8SharedDexAuthenticatorMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_shared_dex_authenticator_malfunctioning: "D8SharedDexAuthenticatorMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The pod `{{ $labels.pod }}` of the shared dex-authenticator `{{ $labels.instance_name }}` cannot load its table of clients.
      description: |-
        For more than 10 minutes, the pod `{{ $labels.pod }}` of the shared dex-authenticator instance `{{ $labels.instance_name }}` has failed to load its table of clients. The pod keeps serving the table it loaded before: a DexAuthenticator created or changed since then is not served by this pod, and a pod started without a table answers 403 for every application.

        Check that the table Secret exists and read the log of the pod:

        ```bash
        d8 k -n d8-user-authn get secret {{ $labels.instance_name }}-clients
        d8 k -n d8-user-authn logs {{ $labels.pod }} -c dex-authenticator
        ```
  - alert: D8SharedDexAuthenticatorSessionStoreUnavailable
    expr: |
      max by (namespace, pod, instance_name) (
        oauth2_proxy_session_store_redis_peers_mode{
          namespace="d8-user-authn",
          job="shared-dex-authenticator",
          mode="memory"
        }
      ) == 1
      or
      sum by (namespace, pod, instance_name) (
        increase(
          oauth2_proxy_session_store_redis_peers_loads_total{
            namespace="d8-user-authn",
            job="shared-dex-authenticator",
            step="unavailable"
          }[2m]
        )
      ) > 0
    for: 3m
    labels:
      severity_level: "4"
      tier: cluster
      d8_module: user-authn
      d8_component: shared-dex-authenticator
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: markdown
      plk_create_group_if_not_exists__d8_shared_dex_authenticator_malfunctioning: "D8SharedDexAuthenticatorMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_shared_dex_authenticator_malfunctioning: "D8SharedDexAuthenticatorMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The pod `{{ $labels.pod }}` of the shared dex-authenticator `{{ $labels.instance_name }}` answers 503 to signed-in users.
      description: |-
        For more than 3 minutes, the pod `{{ $labels.pod }}` of the shared dex-authenticator instance `{{ $labels.instance_name }}` has not reached a Redis that holds the sessions: neither the Redis in its pod nor that of the other pod answers. The pod answers 503 to every request whose session it cannot find. Signing in again does not help, since the session cookie is kept. Sessions come back once a Redis answers again.

        Check the Redis containers of both pods of the instance and the log of this pod:

        ```bash
        d8 k -n d8-user-authn get pods -l app=shared-dex-authenticator,instance={{ $labels.instance_name }} -o wide
        d8 k -n d8-user-authn logs {{ $labels.pod }} -c redis
        d8 k -n d8-user-authn logs {{ $labels.pod }} -c dex-authenticator
        ```
  - alert: D8SharedDexAuthenticatorClientTableAlmostFull
    expr: |
      max by (instance_name) (
        d8_user_authn_shared_dex_authenticator_table_bytes{namespace="d8-user-authn", job="dexclient-controller"}
      )
      / on () group_left ()
      max(d8_user_authn_shared_dex_authenticator_table_limit_bytes{namespace="d8-user-authn", job="dexclient-controller"})
      > 0.8
    for: 10m
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: user-authn
      d8_component: shared-dex-authenticator
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: markdown
      plk_create_group_if_not_exists__d8_shared_dex_authenticator_malfunctioning: "D8SharedDexAuthenticatorMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_shared_dex_authenticator_malfunctioning: "D8SharedDexAuthenticatorMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The table of clients of the shared dex-authenticator `{{ $labels.instance_name }}` is {{ $value | humanizePercentage }} full.
      description: |-
        The table of clients of the shared dex-authenticator instance `{{ $labels.instance_name }}` is {{ $value | humanizePercentage }} full. New DexAuthenticator objects are not served once it is full.

        Delete the DexAuthenticator objects that are no longer needed:

        ```bash
        d8 k get dexauthenticators -A
        ```
  - alert: D8SharedDexAuthenticatorClientTableFull
    expr: |
      max by (instance_name) (
        d8_user_authn_shared_dex_authenticator_objects_not_served{namespace="d8-user-authn", job="dexclient-controller", reason="TableFull"}
      ) > 0
    for: 5m
    labels:
      severity_level: "4"
      tier: cluster
      d8_module: user-authn
      d8_component: shared-dex-authenticator
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: markdown
      plk_create_group_if_not_exists__d8_shared_dex_authenticator_malfunctioning: "D8SharedDexAuthenticatorMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_shared_dex_authenticator_malfunctioning: "D8SharedDexAuthenticatorMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The table of clients of the shared dex-authenticator `{{ $labels.instance_name }}` is full, {{ $value }} DexAuthenticator objects did not fit into it.
      description: |-
        The table of clients of the shared dex-authenticator instance `{{ $labels.instance_name }}` is full. {{ $value }} DexAuthenticator objects are not served, or are served without their latest changes.

        Delete the DexAuthenticator objects that are no longer needed. The objects that did not fit:

        ```bash
        d8 k get dexauthenticators -A -o json | jq -r '.items[] | select(any(.status.conditions[]?; .type == "Served" and .reason == "TableFull")) | "\(.metadata.namespace)/\(.metadata.name)"'
        ```
  # A full table is reported once per instance by D8SharedDexAuthenticatorClientTableFull, which
  # tells how to find the objects that did not fit: an alert for each of them would say the same.
  - alert: D8DexAuthenticatorNotServed
    expr: |
      max by (dex_authenticator_namespace, dex_authenticator_name, instance_name, reason) (
        d8_user_authn_dex_authenticator_not_served{namespace="d8-user-authn", job="dexclient-controller", reason!~"WaitingForInstance|TableFull"}
      ) > 0
    for: 10m
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: user-authn
      d8_component: shared-dex-authenticator
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: markdown
      plk_create_group_if_not_exists__d8_shared_dex_authenticator_malfunctioning: "D8SharedDexAuthenticatorMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_shared_dex_authenticator_malfunctioning: "D8SharedDexAuthenticatorMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The DexAuthenticator `{{ $labels.dex_authenticator_namespace }}/{{ $labels.dex_authenticator_name }}` is not served, the reason is `{{ $labels.reason }}`.
      description: |-
        The DexAuthenticator `{{ $labels.dex_authenticator_name }}` in the namespace `{{ $labels.dex_authenticator_namespace }}` is not served, the reason is `{{ $labels.reason }}`. Users cannot sign in through it. An object that was served before works without its latest changes. An object that had a dex-authenticator of its own before the module update keeps it, and changes of `allowedGroups` and `allowedEmails` do not apply to it.

        Read the message of the condition:

        ```bash
        d8 k -n {{ $labels.dex_authenticator_namespace }} get dexauthenticator {{ $labels.dex_authenticator_name }} -o jsonpath='{.status.conditions[?(@.type=="Served")].message}'
        ```

        What to do by the reason:

        - `HostConflict`: The domain belongs to another DexAuthenticator. Change the domain, or the Ingress class if the domain is to be shared.
        - `InvalidRecord`: The object cannot be served as it is. Fix it as the message says.
        - `ClientNotCreated`: The module cannot register the application in Dex. The message gives the reason.
        - `ForeignObject`: The namespace has a Service, an Ingress or an HTTPRoute with a name the module needs. Rename or delete it.
        - `ObjectsNotWritten`: The API server refused the Service or a route of the object, for example by an admission policy. The message gives its answer.
        - `NamespaceShareFull`: The condition has the reason `TableFull`: the namespace has as many DexAuthenticator objects as one namespace may have. Delete the ones that are no longer needed.
  # An object waits for its instance for a minute or two after it is created or changed, so this
  # reason has an alert of its own with a longer wait. It keeps silent while the alert on the
  # table of the instance fires: that one names the cause.
  - alert: D8DexAuthenticatorWaitingForInstance
    expr: |
      max by (dex_authenticator_namespace, dex_authenticator_name, instance_name) (
        d8_user_authn_dex_authenticator_not_served{namespace="d8-user-authn", job="dexclient-controller", reason="WaitingForInstance"}
      ) > 0
      unless on (instance_name)
      ALERTS{alertname="D8SharedDexAuthenticatorClientTableNotLoaded", alertstate="firing"}
    for: 30m
    labels:
      severity_level: "6"
      tier: cluster
      d8_module: user-authn
      d8_component: shared-dex-authenticator
    annotations:
      plk_protocol_version: "1"
      plk_markup_format: markdown
      plk_create_group_if_not_exists__d8_shared_dex_authenticator_malfunctioning: "D8SharedDexAuthenticatorMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      plk_grouped_by__d8_shared_dex_authenticator_malfunctioning: "D8SharedDexAuthenticatorMalfunctioning,tier=cluster,prometheus=deckhouse,kubernetes=~kubernetes"
      summary: The DexAuthenticator `{{ $labels.dex_authenticator_namespace }}/{{ $labels.dex_authenticator_name }}` has been waiting for the shared dex-authenticator `{{ $labels.instance_name }}` for more than 30 minutes.
      description: |-
        For more than 30 minutes, the shared dex-authenticator instance `{{ $labels.instance_name }}` has not loaded the settings of the DexAuthenticator `{{ $labels.dex_authenticator_name }}` in the namespace `{{ $labels.dex_authenticator_namespace }}`. It normally takes a few minutes. Until then a new object is not served, and an object served before works without its latest changes.

        Check the pods of the instance and their log:

        ```bash
        d8 k -n d8-user-authn get pods -l app=shared-dex-authenticator,instance={{ $labels.instance_name }}
        d8 k -n d8-user-authn logs -l app=shared-dex-authenticator,instance={{ $labels.instance_name }} -c dex-authenticator --prefix --tail=-1
        ```
