x-config-version: 3
type: object
properties:
  publishAPI:
    type: object
    x-doc-deprecated: true
    default: {}
    description: |
      Obsolete. The module does not publish the Kubernetes API. The API is published with the [`apiserver.publishAPI`](/modules/control-plane-manager/configuration.html#parameters-apiserver-publishapi) parameter of the `control-plane-manager` module. Move existing settings there.

      For more information on how to expose the Kubernetes API, see [the `control-plane-manager` module documentation](/modules/control-plane-manager/#exposing-the-kubernetes-api).
    properties:
      enabled:
        type: boolean
        default: false
        description: 'Obsolete. Does not create an Ingress.'
      ingressClass:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
        description: 'The Ingress class that will be used to expose the Kubernetes API via Ingress.'
      whitelistSourceRanges:
        type: array
        description: 'An array of CIDRs that are allowed to connect to the API server.'
        items:
          type: string
          pattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(3[0-2]|[1-2][0-9]|[0-9]))?$'
      https:
        type: object
        default: {}
        description: 'The HTTPS mode for the API server Ingress.'
        x-examples:
        - mode: SelfSigned
        - mode: Global
          global:
            kubeconfigGeneratorMasterCA: plainstring
        properties:
          mode:
            type: string
            enum: ["SelfSigned", "Global"]
            default: "SelfSigned"
            description: |
              The mode of issuing certificates for the Ingress resource.

              In the `SelfSigned` mode, a CA-signed certificate will be issued for the Ingress resource.

              In the `Global` mode, the policies specified in the `global.modules.https.mode` global parameter will be applied. Thus, if the global parameter has the `CertManager` mode set (with `letsencrypt` as the ClusterIssuer), then the Let's Encrypt certificate will be issued for the Ingress resource.
          global:
            type: object
            description: 'An additional parameter for the `Global` mode.'
            properties:
              kubeconfigGeneratorMasterCA:
                type: string
                description: |
                  If there is an external load balancer in front of the Ingress that terminates HTTPS traffic using non-public CA, then you need to specify the CA so it will be included in kubectl-config.

                  If you are using certificates issued by the `cert-manager` module and Let's Encrypt in your cluster, you should set an empty string `""` as the value.

                  Also, you can set the external LB's certificate itself as a CA if you can't get the CA that signed it for some reason. Note that after the certificate is updated on the LB, all the previously generated kubeconfigs will stop working.
      addKubeconfigGeneratorEntry:
        type: boolean
        default: true
        description: 'Obsolete. Use the [`apiserver.publishAPI.ingress.addKubeconfigGeneratorEntry`](/modules/control-plane-manager/configuration.html#parameters-apiserver-publishapi-ingress-addkubeconfiggeneratorentry) parameter of the `control-plane-manager` module.'
  kubeconfigGenerator:
    type: array
    description: |
      An array in which additional possible methods for accessing the API server are specified.

      This option comes in handy if you prefer not to grant access to the cluster's API via Ingress but rather do it by other means (e.g., using a bastion host or over OpenVPN).
    items:
      type: object
      required: ["id", "masterURI"]
      properties:
        id:
          type: string
          description: 'The name of the method for accessing the API server (no spaces, lowercase letters).'
          pattern: '^[\@\.\:0-9a-z._-]+$'
        masterURI:
          type: string
          description: |
            API server address that kubeconfig files generated for this access method point to, for example `https://192.168.0.15:6443`.

            If clients reach the API server through a TCP proxy or a load balancer, add its address to the [`apiserver.certSANs`](/modules/control-plane-manager/configuration.html#parameters-apiserver-certsans) parameter of the `control-plane-manager` module.
        description:
          type: string
          description: |
            A couple of words how this authentication method differs from others.
        masterCA:
          type: string
          description: |
            A CA for accessing the API:
            * If the parameter is not set, Kubernetes CA is used.
            * We recommend using a self-signed certificate (and specify it as masterCA) if an HTTP proxy (that terminates HTTPS traffic) is used for exposing.
  passwordPolicy:
    type: object
    default: null
    description: |
      Password policy for local users.
    properties:
      complexityLevel:
        type: string
        enum:
          - "None"
          - "Low"
          - "Fair"
          - "Good"
          - "Excellent"
          - "Custom"
        default: "Fair"
        description: |
          Password complexity level.

          Depending on the complexity level, a password must meet the following minimum requirements:

          - `None`: 1 character.
          - `Low`: 8 characters.
          - `Fair`: 8 characters, 1 uppercase letter (`A`–`Z`), 1 lowercase letter (`a`–`z`), 1 digit.
          - `Good`: 8 characters, 1 uppercase letter (`A`–`Z`), 1 lowercase letter (`a`–`z`), 1 digit, 1 special character (`!@#$%^&*`).
          - `Excellent`: 8 characters, 1 uppercase letter (`A`–`Z`), 1 lowercase letter (`a`–`z`), 1 digit, 1 special character (`!@#$%^&*`), no more than 2 identical characters in a row.
          - `Custom`: requirements are defined by the `custom` field.
      custom:
        type: object
        description: |
          Custom password complexity rules.

          Applied only when `complexityLevel` is set to `Custom`. Any combination of the
          rules below can be enabled independently.
        properties:
          minLength:
            type: integer
            minimum: 1
            default: 8
            description: |
              Minimum number of characters in a password.
          specialCharacters:
            type: boolean
            default: false
            description: |
              If `true`, a password must contain at least one special character
              (anything that is neither a letter nor a digit).
          numbers:
            type: boolean
            default: false
            description: |
              If `true`, a password must contain at least one digit.
          capitalized:
            type: boolean
            default: false
            description: |
              If `true`, a password must contain at least one uppercase letter (`A`–`Z`).
          repeatedChars:
            type: boolean
            default: false
            description: |
              If `true`, a password must not contain more than 2 identical characters
              in a row (the same rule the `Excellent` level applies).
      passwordHistoryLimit:
        type: integer
        minimum: 0
        default: 5
        description: |
          Number of the user's previous passwords stored in history to prevent their reuse.
      rotation:
        type: object
        required: ["interval"]
        description: |
          Password rotation settings.
        properties:
          interval:
            type: string
            minLength: 2
            pattern: "^(?:(?:[1-9]|[1-9][0-9]+)d)?(?:(?:[1-9]|[1-9][0-9]+)h)?(?:(?:[1-9]|[1-9][0-9]+)m)?(?:(?:[1-9]|[1-9][0-9]+)s)?$"
            description: |
              Time interval after which the password must be changed. Can be set in seconds, minutes, hours or days: `10s`, `5m`, `1h`, `3d`.
      lockout:
        type: object
        required: ["maxAttempts", "lockDuration"]
        description: |
          Automatic temporary lockout after consecutive failed login attempts.

          This section only controls lockout after a failed password. An administrator
          lock via UserOperation (`d8 iam user lock`) works independently and does not
          require `passwordPolicy` or this `lockout` block.
        properties:
          maxAttempts:
            type: integer
            description: |
              Number of consecutive failed login attempts after which the user will be temporarily locked out.
          lockDuration:
            type: string
            minLength: 2
            pattern: "^(?:(?:[1-9]|[1-9][0-9]+)d)?(?:(?:[1-9]|[1-9][0-9]+)h)?(?:(?:[1-9]|[1-9][0-9]+)m)?(?:(?:[1-9]|[1-9][0-9]+)s)?$"
            description: |
              Temporary lockout duration. Can be set in seconds, minutes, hours, or days: `10s`, `5m`, `1h`, `3d`.
          applyToConnectors:
            type: array
            description: |
              External (non-local) connector types the lockout additionally applies to.

              The built-in `Local` connector is always covered by the lockout policy when this section is configured
              and does not need to be listed here.

              For the listed connector types, Dex counts failed attempts and locks each pair of a provider and a user
              separately. The UserAccount object of the user shows the counter and the lock.

              Manually unlocking a user is supported for every provider type via a UserOperation.
            uniqueItems: true
            items:
              type: string
              enum: ["LDAP", "Crowd"]
  rateLimit:
    type: object
    default: {}
    description: |
      Brute-force protection for the password endpoints of Dex.

      When enabled, Dex limits the failed requests from each client IP address to the following endpoints:

      - `/token`: Token endpoint: client authentication and the password grant. Other requests of an authenticated client,
        such as refresh-token requests, do not count.
      - `/auth/{connector}/login`: Sign-in form of the local, LDAP and Crowd providers.
      - `/password/change`: Password change page.
      - `/mfa` and the paths under it: Steps of two-factor authentication (2FA).

      The client IP address is taken from the `X-Real-IP` header that the platform Ingress controller sets.
      Dex trusts the header only from the proxies of the platform. The Ingress controller proves itself with its
      client certificate, which the platform CA issued for the `ingress-nginx:auth` organization. The controller
      presents it to any backend an Ingress asks it to, so whoever can create an Ingress with configuration snippets
      on that controller can set the address too. The Gateway sends a
      secret stored in the HTTPRoute object of the module in `d8-user-authn`: whoever can read it can set the address
      too. For any other request, for example from a pod that calls the Dex Service directly, Dex counts the address
      of the connection.
      Through the Gateway API (the `alb` module) Dex counts the last address of `X-Forwarded-For`: the address the ALB
      saw, or the one a balancer passed when the ALB instance trusts it in `originalIPDetection.setRealIPFrom`. Behind
      a balancer the ALB instance does not trust, every client is counted by the address of the balancer.
      Basic Authentication to the Kubernetes API through an LDAP provider is counted per address of the client
      that the platform Ingress controller or Gateway saw: basic-auth-proxy passes on the last hop of `X-Forwarded-For`.
      The Ingress controller has to see the address of the client itself: behind a balancer that replaces it, all
      users are counted together (see [Which client address does Dex see?](faq.html#which-client-address-does-dex-see)).

      The limit applies to **failed authentication attempts only**. Each request takes a token from the bucket of its IP address,
      and a successful response (HTTP `2xx` or `3xx`) returns the token. Successful logins and refresh-token exchanges
      do not consume the per-IP budget. When the bucket is empty, Dex answers with the `429` status code
      and the `Retry-After` header.

      Limits are tracked in memory in each Dex replica.
      In HA setups, the effective per-IP rate is multiplied by the number of replicas.
      Account lockout complements this limit.
    properties:
      enabled:
        type: boolean
        default: false
        description: |
          Enable per-IP rate limiting on Dex password endpoints.
      perIP:
        type: object
        default: {}
        description: |
          Per-source-IP token-bucket configuration.
          
          Both `requestsPerMinute` and `burst`
          parameters count failed authentication attempts only.
        properties:
          requestsPerMinute:
            type: integer
            default: 10
            minimum: 1
            description: |
              Maximum rate of failed authentication attempts tolerated
              per IP address (in attempts per minute).
              
              Successful logins and refresh-token exchanges
              do not consume the budget.
          burst:
            type: integer
            default: 10
            minimum: 1
            description: |
              Maximum bucket size defining the allowed number of failed authentication attempts from a single IP address
              before the throttling activates.
  staticUsers2FA:
    type: object
    default: {}
    required: [enabled]
    description: |
      Two-factor authentication for local users.
    properties:
      enabled:
        type: boolean
        default: false
        description: |
          If set to `true`, the local users will be required to use two-factor authentication (2FA) when logging in.
      issuerName:
        type: string
        default: "Deckhouse"
        description: |
          The issuer name for the two-factor authentication (2FA) tokens.
          This name is visible to users in the 2FA application (e.g., Google Authenticator).
  idTokenTTL:
    type: string
    pattern: '^([0-9]+h)?([0-9]+m)?([0-9]+s)?$'
    default: '10m'
    description: |
      TTL of the ID token.

      Set as a string specifying hours, minutes, or seconds: `30m`, `20s`, `2h30m10s`, `5h`.

      Must be greater than zero and strictly less than 6 hours (Dex signing keys rotate every 6 hours). A ModuleConfig of an earlier settings version (`spec.version` 1 or 2) with a value of 6 hours or more is still accepted: its value is converted to `5h59m`.

      Defines the minimum possible user session lifetime (via [`keepUsersLoggedInFor`](cr.html#dexauthenticator-v1-spec-keepusersloggedinfor) in the DexAuthenticator resource
      and parameters like `auth.sessionTTL`, for example, in the [`console`](/modules/console/configuration.html#parameters-auth-sessionttl) module).

      If the session TTL is less than or equal to `idTokenTTL`, the effective logout time is `idTokenTTL + 1s`.

      To force logout sooner than the default `idTokenTTL`, decrease this parameter value as well.
  refreshTokenAbsoluteLifetime:
    type: string
    pattern: '^([0-9]+h)?([0-9]+m)?([0-9]+s)?$'
    default: '4380h'
    description: |
      Maximum lifetime of refresh tokens (maps to Dex `expiry.refreshTokens.absoluteLifetime`).

      This setting controls how long user sessions can persist. After this period expires, users will need to re-authenticate, even if they have active refresh tokens.

      A refresh token that is not used for [`refreshTokenValidIfNotUsedFor`](#parameters-refreshtokenvalidifnotusedfor) expires earlier.

      The value must not be shorter than `idTokenTTL`.

      It is specified as a string containing the time unit in hours, minutes and seconds: 30m, 20s, 2h30m10s, 24h.
  refreshTokenValidIfNotUsedFor:
    type: string
    pattern: '^([0-9]+h)?([0-9]+m)?([0-9]+s)?$'
    default: '2190h'
    x-examples: ['2190h', '720h']
    description: |
      Time after which a refresh token that is not used expires (maps to Dex `expiry.refreshTokens.validIfNotUsedFor`).

      A kubeconfig file or an application that has not refreshed its tokens for this time signs in again. By default,
      about 3 months.

      The value must be greater than zero and not longer than `refreshTokenAbsoluteLifetime`.

      It is specified as a string containing the time unit in hours, minutes and seconds: 30m, 20s, 2h30m10s, 24h.
  sessions:
    type: object
    default: {}
    description: |
      Browser sessions of Dex.

      With sessions on, Dex remembers the user signed in to a browser:

      - The web interfaces of Deckhouse (the DexAuthenticator objects of the platform modules, such as the console or Grafana)
        share the sign-in: the user enters the password and the second factor once and opens the others without them (see `sso`).
        For a user of an external provider, this lasts while the stored user data is fresh (see `identityRefresh`).
      - The sign-in form shows the "Remember me" checkbox. With it, the session survives closing the browser.
      - Signing out of an application of a DexAuthenticator object ends the session: the browser is signed out of all the
        applications of DexAuthenticator objects it signed in to through this session within seconds.

      What does not change:

      - Access tokens for `kubectl` (kubeconfig, `d8 login`) and applications of the DexClient objects that request
        offline access are issued only after an interactive sign-in, never from a session of the browser. A DexClient
        with [`refreshTokenLifetime: Session`](cr.html#dexclient-v1-spec-refreshtokenlifetime) is the exception.
      - An application signed in through a DexAuthenticator stays signed in for
        [`keepUsersLoggedInFor`](cr.html#dexauthenticator-v1-spec-keepusersloggedinfor), even after the session of Dex
        expires. The session limits only signing in without a password.
      - Signing out of Dex does not sign the user out of an external OIDC provider unless the provider has
        [`upstreamLogout`](cr.html#dexprovider-v1-spec-oidc-upstreamlogout) enabled.
    properties:
      enabled:
        type: boolean
        default: false
        description: |
          Turns the browser sessions of Dex on.
      absoluteLifetime:
        type: string
        pattern: '^([0-9]+h)?([0-9]+m)?([0-9]+s)?$'
        default: '168h'
        description: |
          Maximum lifetime of a session, counted from the sign-in.

          However much the browser is used, the session ends after this time, and the next application asks for
          the password and the second factor again. By default, a user who works every day enters them once a week.

          Set as a string of whole hours, minutes, and seconds, in this order: `30m`, `2h30m`, `24h`.
      validIfNotUsedFor:
        type: string
        pattern: '^([0-9]+h)?([0-9]+m)?([0-9]+s)?$'
        default: '24h'
        description: |
          Time after which an unused session ends.

          A session is used when the browser signs in to an application through it, and when an application
          signed in through it refreshes its tokens: an application of a DexAuthenticator object or of a DexClient
          with `refreshTokenLifetime: Session`. Such an application refreshes its tokens while it is open and sends
          requests; an application closed, or open in a browser of a sleeping computer, does not use the session.
          While the browser uses the session, it lasts up to `absoluteLifetime`.

          With the default of a day, a session survives a night but not a weekend. For stricter
          requirements, set a shorter time, for example `1h`: the user then enters the password again after each
          break of an hour.

          Must not be longer than `absoluteLifetime`. When only `absoluteLifetime` is set and is shorter than a day,
          an unused session ends after `absoluteLifetime`.

          Set as a string of whole hours, minutes, and seconds, in this order: `30m`, `2h30m`, `24h`.
      rememberMeCheckedByDefault:
        type: boolean
        default: false
        description: |
          Whether the "Remember me" checkbox of the sign-in form is selected by default.

          Without "Remember me", the session ends when the browser is closed.
      sso:
        type: string
        enum: ["Platform", "None"]
        default: "Platform"
        description: |
          Sharing of the sign-in between applications.

          - `Platform`: The web interfaces of Deckhouse share the sign-in. These are the applications of the
            DexAuthenticator objects in the `d8-*` namespaces. User DexAuthenticator and DexClient objects do not share it.
          - `None`: Every application asks for the sign-in. A session only spares the password when the user signs in
            to the same application again.
      identityRefresh:
        type: object
        default: {}
        description: |
          Freshness of the user data that Dex stores at the sign-in, such as the groups of the user.

          With sessions on, Dex serves the stored data until it is older than `maxAge`, and then reads it from the
          provider again. If the provider answers that the user no longer exists or is no longer allowed in, Dex
          ends all the sessions and tokens of the user of this provider.
          The data of local users is read again every time.

          A sign-in from a session needs fresh data too. Dex keeps no credentials of a user of an external provider
          to read the data in the background, so once the data is older than `maxAge`, such a user signs in to the
          next application with the password again. Every sign-in and every refresh of the tokens of an application
          that reads the provider renews the data: a user who keeps working in an application of a DexAuthenticator
          keeps the single sign-on. To keep it through longer breaks, raise `maxAge`.
        properties:
          maxAge:
            type: string
            pattern: '^([0-9]+h)?([0-9]+m)?([0-9]+s)?$'
            description: |
              Age of the stored data after which Dex reads it from the provider again.

              Defaults to [`idTokenTTL`](#parameters-idtokenttl).

              Set as a string of whole hours, minutes, and seconds, in this order: `30m`, `2h30m`, `24h`.
          gracePeriod:
            type: string
            pattern: '^([0-9]+h)?([0-9]+m)?([0-9]+s)?$'
            default: '0s'
            description: |
              How much longer than `maxAge` Dex serves the stored data when the provider does not answer.

              After this period, Dex refuses to refresh the tokens of the user until the provider answers.

              Set as a string of whole hours, minutes, and seconds, in this order: `30s`, `5m`, `1h`.
  devices:
    type: object
    default: {}
    description: |
      Devices of a user: the browsers and the other clients (kubeconfig, `d8 login`) the user signed in from.
    properties:
      trustedAfter:
        type: string
        pattern: '^([0-9]+h)?([0-9]+m)?([0-9]+s)?$'
        minLength: 1
        default: '24h'
        x-examples: ['24h', '1h', '0s']
        description: |
          Time after which a device of the user is trusted, counted from the first sign-in from its browser
          (from the sign-in for a device without a browser).

          Only a trusted device lets the user sign out of all devices, of the other devices or of another device,
          and request a password change on their own. A device signed in more recently can sign the user out only
          of itself. Someone who has just signed in with a stolen password therefore can neither sign the owner out
          nor change the password, while the owner sees the new device on a trusted one and signs it out. A stolen
          session is not covered: a copied cookie of Dex or of the web interface has the age of the owner's device.
          The operations of an administrator are not limited.

          When an application reaches the limit of devices of a user, the devices that are not trusted yet are
          signed out of it first.

          `0s` trusts every device at once: any device can sign out the others and request a password change.

          Set as a string of whole hours, minutes, and seconds, in this order: `30m`, `2h30m`, `24h`.
      maxPerApplication:
        type: integer
        minimum: 1
        maximum: 1000
        default: 10
        x-examples: [10, 3]
        description: |
          How many devices of a user one application keeps signed in: refresh tokens of one user in one application
          (DexAuthenticator, DexClient, kubeconfig).

          A sign-in past it signs the device used longest ago out of this application, a device that is not trusted
          yet (see `trustedAfter`) first. Every new kubeconfig file is a device of its own.
      rememberedBrowsers:
        type: integer
        minimum: 0
        maximum: 1000
        default: 20
        x-examples: [20, 0]
        description: |
          How many browsers of a user Dex remembers with their first sign-in.

          A remembered browser that signs in again keeps its age: the time until it is trusted (`trustedAfter`) counts
          from its first sign-in. Past the limit, the browser seen longest ago is forgotten and counts as new at its
          next sign-in.

          `0` remembers no browser: every sign-in is a new device.
  retention:
    type: object
    default: {}
    description: |
      How long the records of the module are kept.
    properties:
      userOperations:
        type: string
        pattern: '^([0-9]+h)?([0-9]+m)?([0-9]+s)?$'
        default: '24h'
        x-examples: ['24h', '720h']
        description: |
          How long a [UserOperation](cr.html#useroperation) object is kept after its creation. Then it is deleted,
          and the history of operations of the web interface no longer shows it.

          Set as a string of whole hours, minutes, and seconds, in this order: `30m`, `2h30m`, `24h`.
      revocations:
        type: string
        pattern: '^([0-9]+h)?([0-9]+m)?([0-9]+s)?$'
        x-examples: ['24h']
        description: |
          How long a record of a revocation (the end of the sessions and tokens of a user by an operation or a sign-out)
          is kept for the components that end the sessions of the user from it: DexAuthenticator objects, Basic
          Authentication to the Kubernetes API, the authorization webhook.

          By default, and at least, [`idTokenTTL`](#parameters-idtokenttl) and an hour, but not less than 70 minutes:
          until every token issued before the revocation expired. A shorter value is raised to this minimum.

          Set as a string of whole hours, minutes, and seconds, in this order: `30m`, `2h30m`, `24h`.
  highAvailability:
    type: boolean
    x-examples: [true, false]
    description: |
      Manually enable the high availability mode.

      By default, Deckhouse automatically decides whether to enable the HA mode. Learn more about the [high availability mode for modules](/products/kubernetes-platform/documentation/v1/reference/api/global.html#parameters).
  nodeSelector:
    type: object
    additionalProperties:
      type: string
    x-kubernetes-preserve-unknown-fields: true
    description: |
      The same as in the Pods' `spec.nodeSelector` parameter in Kubernetes.

      If the parameter is omitted, it is determined [automatically](/products/kubernetes-platform/documentation/v1/#advanced-scheduling).
  tolerations:
    type: array
    items:
      type: object
      properties:
        effect:
          type: string
        key:
          type: string
        operator:
          type: string
        tolerationSeconds:
          type: integer
          format: int64
        value:
          type: string
    x-examples:
      -
        - key: "key1"
          operator: "Equal"
          value: "value1"
          effect: "NoSchedule"
    description: |
      The same as in the Pods' `spec.tolerations` parameter in Kubernetes.

      If the parameter is omitted, it is determined [automatically](/products/kubernetes-platform/documentation/v1/#advanced-scheduling).
  ingressClass:
    type: string
    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
    description: |
      The class of the Ingress controller that will be used for Dex.

      An optional parameter; by default, the `modules.ingressClass` global value is used.
  https:
    type: object
    x-examples:
      - mode: CustomCertificate
        customCertificate:
          secretName: "foobar"
      - mode: CertManager
        certManager:
          clusterIssuerName: letsencrypt
    description: |
      What certificate type to use with Dex.

      This parameter completely overrides the `global.modules.https` settings.
    properties:
      mode:
        type: string
        default: "Disabled"
        description: |
          The HTTPS usage mode:

          - `CertManager`: Dex uses HTTPS and gets a certificate from the ClusterIssuer set in the `certManager.clusterIssuerName` parameter.
          - `CustomCertificate`: Dex uses HTTPS with the certificate from the `d8-system` namespace.
          - `Disabled`: The module is turned off, because it works only with HTTPS.
          - `OnlyInURI`: Dex works over HTTP behind an external load balancer that terminates HTTPS. All `user-authn` links use the HTTPS scheme. The load balancer must redirect HTTP to HTTPS.

          If you set the `https` section without `mode`, `Disabled` applies and the module is turned off.
        enum:
          - "Disabled"
          - "CertManager"
          - "CustomCertificate"
          - "OnlyInURI"
      certManager:
        type: object
        description: Settings of the `CertManager` mode.
        properties:
          clusterIssuerName:
            type: string
            default: "letsencrypt"
            description: |
              What ClusterIssuer to use for Dex.

              Currently, `letsencrypt`, `letsencrypt-staging`, `selfsigned` are available. Also, you can define your own.
      customCertificate:
        type: object
        default: {}
        description: Settings of the `CustomCertificate` mode.
        properties:
          secretName:
            type: string
            description: |
              The name of the Secret in the `d8-system` namespace to use with Dex.

              This Secret must have the [kubernetes.io/tls](https://kubernetes.github.io/ingress-nginx/user-guide/tls/#tls-secrets) format.
            default: "false"
  controlPlaneConfigurator:
    type: object
    default: {}
    description: 'Parameters of the [`control-plane-manager`](/modules/control-plane-manager/) module for automatic configuration of `kube-apiserver`.'
    properties:
      enabled:
        type: boolean
        description: 'Defines if the `control-plane-manager` module should be used to configure OIDC for the `kube-apiserver`.'
        default: true
      dexCAMode:
        type: string
        enum: ['Custom','DoNotNeed', 'FromIngressSecret']
        default: 'DoNotNeed'
        description: |
          How to determine the CA that will be used when configuring `kube-apiserver`.

          * `Custom` — use the CA explicitly set via the `dexCustomCA` parameter (see below). This option comes in handy if you use an external HTTPS load balancer in front of Ingresses, and this load balancer relies on a self-signed certificate.
          * `DoNotNeed` — a CA is not required (e.g., when using a public LE or other TLS providers).
          * `FromIngressSecret` — extract the CA of certificate from the Secret that is used in the Ingress. This option comes in handy if you use self-signed certificates with Ingresses.
      dexCustomCA:
        type: string
        description: 'The CA to use if `dexCAMode` is `Custom`. Plain text (no base64).'

x-deckhouse-validations:
  - expression: |
      !has(self.idTokenTTL)
      ||
      duration(self.idTokenTTL) > duration("0s")
    message: "user-authn.idTokenTTL must be greater than zero (dex-authenticator refreshes sessions every idTokenTTL)"
  - expression: |
      !has(self.idTokenTTL)
      ||
      duration(self.idTokenTTL) < duration("6h")
    message: "user-authn.idTokenTTL must be less than 6h (Dex signing keys rotate every 6 hours)"
  - expression: |
      !has(self.sessions)
      ||
      !has(self.sessions.validIfNotUsedFor)
      ||
      duration(self.sessions.validIfNotUsedFor) > duration("0s")
      &&
      duration(has(self.sessions.absoluteLifetime) ? self.sessions.absoluteLifetime : "168h") >= duration(self.sessions.validIfNotUsedFor)
    message: "user-authn.sessions.validIfNotUsedFor must be greater than zero and not longer than sessions.absoluteLifetime"
  - expression: |
      !has(self.sessions)
      ||
      !has(self.sessions.absoluteLifetime)
      ||
      duration(self.sessions.absoluteLifetime) > duration("0s")
    message: "user-authn.sessions.absoluteLifetime must be greater than zero (Dex does not start with a zero session lifetime)"
  - expression: |
      !has(self.idTokenTTL) || !has(self.refreshTokenAbsoluteLifetime)
      ||
      duration(self.idTokenTTL) <= duration(self.refreshTokenAbsoluteLifetime)
    message: "user-authn.idTokenTTL must be less than or equal to user-authn.refreshTokenAbsoluteLifetime"
  - expression: |
      !has(self.refreshTokenValidIfNotUsedFor)
      ||
      duration(self.refreshTokenValidIfNotUsedFor) > duration("0s")
      &&
      duration(has(self.refreshTokenAbsoluteLifetime) ? self.refreshTokenAbsoluteLifetime : "4380h") >= duration(self.refreshTokenValidIfNotUsedFor)
    message: "user-authn.refreshTokenValidIfNotUsedFor must be greater than zero and not longer than user-authn.refreshTokenAbsoluteLifetime"
  - expression: |
      !has(self.retention) || !has(self.retention.userOperations)
      ||
      duration(self.retention.userOperations) > duration("0s")
    message: "user-authn.retention.userOperations must be greater than zero"
  - expression: |
      !has(self.passwordPolicy)
      ||
      !has(self.passwordPolicy.complexityLevel)
      ||
      self.passwordPolicy.complexityLevel != "Custom"
      ||
      has(self.passwordPolicy.custom)
    message: "user-authn.passwordPolicy.custom is required when passwordPolicy.complexityLevel is Custom"
  - expression: |
      !has(self.passwordPolicy)
      ||
      !has(self.passwordPolicy.custom)
      ||
      (has(self.passwordPolicy.complexityLevel) && self.passwordPolicy.complexityLevel == "Custom")
    message: "user-authn.passwordPolicy.custom is only allowed when passwordPolicy.complexityLevel is Custom"
