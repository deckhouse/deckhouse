positive:
  values:
  - kubeconfigGenerator:
    - id: abc-1
      masterURI: example.com
  - rateLimit:
      enabled: true
      perIP:
        requestsPerMinute: 30
        burst: 10
  - passwordPolicy:
      lockout:
        maxAttempts: 5
        lockDuration: 10m
        applyToConnectors: ["LDAP", "Crowd"]
  - passwordPolicy:
      complexityLevel: Custom
      custom:
        minLength: 10
        specialCharacters: true
        numbers: false
        capitalized: true
        repeatedChars: false
  - idTokenTTL: 5h59m
  - idTokenTTL: 1h
  # Accepted in 1.77 so that a cluster upgrading from 1.76 with such a value starts; the alert and
  # the release requirement ask for it to be lowered before 1.78, which rejects it.
  - idTokenTTL: 6h
  - idTokenTTL: 24h
negative:
  values:
  - kubeconfigGenerator:
    - id: ABC-1
      masterURI: example.com
  - rateLimit:
      enabled: true
      perIP:
        requestsPerMinute: 0
        burst: 10
  - passwordPolicy:
      lockout:
        maxAttempts: 5
        lockDuration: 10m
        applyToConnectors: ["okta"]
  - passwordPolicy:
      complexityLevel: Custom
  - passwordPolicy:
      complexityLevel: Fair
      custom:
        minLength: 10
