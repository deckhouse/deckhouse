positive:
  values:
  - devices:
      trustedAfter: 1h30m
  # Every device is trusted at once.
  - devices:
      trustedAfter: 0s
  - devices:
      maxPerApplication: 3
      rememberedBrowsers: 0
  - refreshTokenValidIfNotUsedFor: 720h
  - refreshTokenAbsoluteLifetime: 720h
    refreshTokenValidIfNotUsedFor: 720h
  - retention:
      userOperations: 168h
      revocations: 24h
  - kubeconfigGenerator:
    - id: abc-1
      masterURI: example.com
  - rateLimit:
      enabled: true
      perIP:
        requestsPerMinute: 30
        burst: 10
  - passwordPolicy:
      lockout:
        maxAttempts: 5
        lockDuration: 10m
        applyToConnectors: ["LDAP", "Crowd"]
  - passwordPolicy:
      complexityLevel: Custom
      custom:
        minLength: 10
        specialCharacters: true
        numbers: false
        capitalized: true
        repeatedChars: false
  - idTokenTTL: 5h59m
  - idTokenTTL: 1h
  - idTokenTTL: 10m
  - sessions:
      enabled: true
  # A session lives a week by default, so an unused one may last up to that.
  - sessions:
      validIfNotUsedFor: 168h
  # A lifetime shorter than the idle timeout of a day by default, set alone: the idle timeout yields to it.
  - sessions:
      enabled: true
      absoluteLifetime: 12h
  - sessions:
      enabled: true
      sso: None
      absoluteLifetime: 12h
      validIfNotUsedFor: 12h
      rememberMeCheckedByDefault: true
      identityRefresh:
        maxAge: 5m
        gracePeriod: 30s
  - internal:
      dexAuthenticatorRedisURL: "redis://127.0.0.1/"
  - internal:
      dexAuthenticatorRedisURL: "redis://localhost:6380/0"
  - internal:
      dexAuthenticatorRedisURL: "redis://dex-authenticator-redis.d8-user-authn:6379/"
  - twoFactor:
      enabled: true
  - twoFactor:
      enabled: true
      issuerName: Corp
      providerTypes: [Local, LDAP, Crowd]
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      webAuthn:
        rpID: example.com
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      webAuthn:
        rpID: dex.example.com
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      webAuthn:
        rpID: localhost
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      webAuthn:
        rpID: dex.corp.example.com
  # Both methods, the code and then the key.
  - twoFactor:
      enabled: true
      methods: [TOTP, WebAuthn]
      require: All
  # The users of LDAP providers use a key, the local users the default code.
  - twoFactor:
      enabled: true
      providerTypes: [Local, LDAP]
      providerTypeOverrides:
      - providerType: LDAP
        methods: [WebAuthn]
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      providerTypes: [Local, LDAP, Crowd]
      providerTypeOverrides:
      - providerType: Local
        methods: [TOTP, WebAuthn]
        require: All
      - providerType: Crowd
        methods: [TOTP]
negative:
  values:
  - devices:
      trustedAfter: 1d
  - devices:
      trustedAfter: -1h
  # An empty duration would leave user-api without its --min-device-age.
  - devices:
      trustedAfter: ""
  - devices:
      maxPerApplication: 0
  - devices:
      rememberedBrowsers: -1
  # An unused refresh token must not outlive the token (6 months by default).
  - refreshTokenValidIfNotUsedFor: 4381h
  - refreshTokenValidIfNotUsedFor: 0s
  - retention:
      userOperations: 0s
  - retention:
      revocations: a day
  # The address is an argument of a Deployment in the user's namespace: no credentials, and the
  # sidecar speaks neither TLS nor AUTH.
  - internal:
      dexAuthenticatorRedisURL: "redis://:password@localhost/"
  - internal:
      dexAuthenticatorRedisURL: "redis://user:password@redis.example.com:6379/"
  - internal:
      dexAuthenticatorRedisURL: "rediss://127.0.0.1/"
  - internal:
      dexAuthenticatorRedisURL: "redis://127.0.0.1/?password=secret"
  # A query or a fragment without the slash is no host either.
  - internal:
      dexAuthenticatorRedisURL: "redis://127.0.0.1?password=secret"
  - internal:
      dexAuthenticatorRedisURL: "redis://h:1 #x"
  - kubeconfigGenerator:
    - id: ABC-1
      masterURI: example.com
  - rateLimit:
      enabled: true
      perIP:
        requestsPerMinute: 0
        burst: 10
  - passwordPolicy:
      lockout:
        maxAttempts: 5
        lockDuration: 10m
        applyToConnectors: ["okta"]
  - passwordPolicy:
      complexityLevel: Custom
  - passwordPolicy:
      complexityLevel: Fair
      custom:
        minLength: 10
  - idTokenTTL: 6h
  - idTokenTTL: 24h
  # The second factor: a type of provider with no second factor, none at all, or the same one twice.
  - twoFactor:
      enabled: true
      providerTypes: [OIDC]
  - twoFactor:
      enabled: true
      providerTypes: []
  - twoFactor:
      enabled: true
      providerTypes: [LDAP, LDAP]
  - twoFactor:
      enabled: true
      methods: [SMS]
  # methods: none, the same twice, more than the two there are.
  - twoFactor:
      enabled: true
      methods: []
  - twoFactor:
      enabled: true
      methods: [TOTP, TOTP]
  # require is chosen explicitly with two methods, and means nothing with one.
  - twoFactor:
      enabled: true
      methods: [TOTP, WebAuthn]
  - twoFactor:
      enabled: true
      methods: [TOTP]
      require: All
  - twoFactor:
      enabled: true
      require: All
  # A choice of the user (Any) comes with the Dex patch that implements it.
  - twoFactor:
      enabled: true
      methods: [TOTP, WebAuthn]
      require: Any
  # An override names a type of providerTypes, once, with the rules of methods and require.
  - twoFactor:
      enabled: true
      providerTypeOverrides:
      - providerType: LDAP
        methods: [WebAuthn]
  - twoFactor:
      enabled: true
      providerTypes: [Local, LDAP]
      providerTypeOverrides:
      - providerType: LDAP
        methods: [WebAuthn]
      - providerType: LDAP
        methods: [TOTP]
  - twoFactor:
      enabled: true
      providerTypes: [LDAP]
      providerTypeOverrides:
      - providerType: LDAP
        methods: [TOTP, WebAuthn]
  - twoFactor:
      enabled: true
      providerTypes: [LDAP]
      providerTypeOverrides:
      - providerType: LDAP
        methods: [WebAuthn]
        require: All
  - twoFactor:
      enabled: true
      providerTypes: [LDAP]
      providerTypeOverrides:
      - providerType: LDAP
  - twoFactor:
      enabled: true
      providerTypes: [OIDC]
      providerTypeOverrides:
      - providerType: OIDC
        methods: [TOTP]
  # protocol.ValidateRPID of go-webauthn v0.18.2: a single label other than localhost is not a domain,
  # and a final label that is a number (decimal, or 0x/0b/0o) is refused. Dex does not start with either.
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      webAuthn:
        rpID: a
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      webAuthn:
        rpID: corp.123
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      webAuthn:
        rpID: example.0x1
  # A relying party ID is a domain name, the same one protocol.ValidateRPID of go-webauthn v0.18.2 accepts:
  # no empty label, no label that starts or ends with a hyphen, not an IP address, no scheme, port or path.
  # Dex refuses to start with a value it rejects.
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      webAuthn:
        rpID: https://example.com
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      webAuthn:
        rpID: example.com:443
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      webAuthn:
        rpID: Example.com
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      webAuthn:
        rpID: ""
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      webAuthn:
        rpID: a..b
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      webAuthn:
        rpID: a-.b
  - twoFactor:
      enabled: true
      methods: [WebAuthn]
      webAuthn:
        rpID: 1.2.3.4
  - idTokenTTL: 0s
  - idTokenTTL: 0m0s
  # An unused session must not outlive the session (a week by default).
  - sessions:
      validIfNotUsedFor: 169h
  - sessions:
      absoluteLifetime: 1h
      validIfNotUsedFor: 2h
  - sessions:
      validIfNotUsedFor: 0s
  # Dex refuses to start with a zero session lifetime.
  - sessions:
      absoluteLifetime: 0s
  - sessions:
      absoluteLifetime: 0m
  - sessions:
      enabled: true
      absoluteLifetime: 0h0m0s
  - sessions:
      sso: All
  - sessions:
      identityRefresh:
        maxAge: 1d
