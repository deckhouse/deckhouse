properties:
  publishAPI:
    description: |
      Устарел. Модуль не публикует API Kubernetes. API публикуется параметром [`apiserver.publishAPI`](/modules/control-plane-manager/configuration.html#parameters-apiserver-publishapi) модуля `control-plane-manager`. Перенесите существующие настройки туда.

      Подробнее о способах публикации API Kubernetes — [в документации модуля `control-plane-manager`](/modules/control-plane-manager/#публикация-api-kubernetes).
    properties:
      enabled:
        description: 'Устарел. Ingress не создаёт.'
      ingressClass:
        description: 'Ingress-класс, который будет использован для публикации API Kubernetes через Ingress.'
      whitelistSourceRanges:
        description: 'Список адресов в формате CIDR, которым разрешено подключение к API-серверу.'
      https:
        description: 'Режим работы HTTPS для Ingress API-сервера.'
        properties:
          mode:
            description: |
              Режим выдачи сертификатов для данного Ingress-ресурса.

              В случае использования режима `SelfSigned`, для Ingress-ресурса будет выпущен сертификат подписанный CA.

              В случае использования режима `Global` будут применены политики из глобальной настройки `global.modules.https.mode`. То есть если в глобальной настройке стоит режим `CertManager` с ClusterIssuer `letsencrypt`, для Ingress-ресурса будет заказан сертификат Let's Encrypt.
          global:
            description: 'Дополнительный параметр для режима `Global`.'
            properties:
              kubeconfigGeneratorMasterCA:
                description: |
                  Если перед Ingress-контроллером есть внешний балансировщик, который терминирует HTTPS-трафик с использованием непубличного сертификата, укажите цепочку CA в этом параметре. Она будет добавлена в сгенерированные файлы конфигурации kubectl.

                  Если вы используете в кластере сертификаты, выдаваемые c помощью модуля `cert-manager` и Let's Encrypt, следует в качестве значения установить пустую строку `""`.

                  В качестве CA допускается указать непосредственно сертификат внешнего балансировщика. В таком случае нужно помнить, что обновление сертификата на балансировщике повредит ранее сгенерированные файлы конфигурации kubectl.
      addKubeconfigGeneratorEntry:
        description: 'Устарел. Используйте параметр [`apiserver.publishAPI.ingress.addKubeconfigGeneratorEntry`](/modules/control-plane-manager/configuration.html#parameters-apiserver-publishapi-ingress-addkubeconfiggeneratorentry) модуля `control-plane-manager`.'
  kubeconfigGenerator:
    description: |
      Массив, в котором указываются дополнительные способы доступа к API-серверу.

      Параметр может быть полезен в случае, если вы хотите предоставить доступ к API-серверу не через Ingress, а другими способами (например, с bastion-хоста или через OpenVPN).
    items:
      properties:
        id:
          description: 'Имя способа доступа к API-серверу (без пробелов, маленькими буквами).'
        masterURI:
          description: |
            Адрес API-сервера, который указывается в kubeconfig для этого способа доступа, например `https://192.168.0.15:6443`.

            Если клиенты подключаются к API-серверу через TCP-прокси или балансировщик, добавьте его адрес в параметр [`apiserver.certSANs`](/modules/control-plane-manager/configuration.html#parameters-apiserver-certsans) модуля `control-plane-manager`.
        masterCA:
          description: |
            CA для доступа к API-серверу.

            Если данный параметр не указать, то будет автоматически использован Kubernetes CA.

            При публикации API-сервера через HTTP-прокси, который терминирует HTTPS-трафик, рекомендуется использовать самоподписанный сертификат, который нужно указать в параметре `masterCA`.
        description:
          description: |
            Текстовое описание, содержащее информацию о том, чем этот метод аутентификации отличается от других.
  passwordPolicy:
    description: |
      Политика паролей локальных пользователей.
    properties:
      complexityLevel:
        description: |
          Уровень сложности пароля.

          В зависимости от уровня сложности к паролю предъявляются следующие минимальные требования:

          - `None` — 1 символ.
          - `Low` — 8 символов.
          - `Fair` — 8 символов, 1 заглавная буква (`A`–`Z`), 1 строчная буква (`a`–`z`), 1 цифра.
          - `Good` — 8 символов, 1 заглавная буква (`A`–`Z`), 1 строчная буква (`a`–`z`), 1 цифра, 1 специальный символ (`!@#$%^&*`).
          - `Excellent` — 8 символов, 1 заглавная буква (`A`–`Z`), 1 строчная буква (`a`–`z`), 1 цифра, 1 специальный символ (`!@#$%^&*`), не более 2 одинаковых символов подряд.
          - `Custom` — требования задаются в поле `custom`.
      custom:
        description: |
          Пользовательские правила сложности пароля.

          Применяются только если `complexityLevel` равен `Custom`. Любое из правил ниже можно
          включать независимо.
        properties:
          minLength:
            description: |
              Минимальное количество символов в пароле.
          specialCharacters:
            description: |
              Если `true`, пароль должен содержать хотя бы один специальный символ
              (любой символ, не являющийся буквой или цифрой).
          numbers:
            description: |
              Если `true`, пароль должен содержать хотя бы одну цифру.
          capitalized:
            description: |
              Если `true`, пароль должен содержать хотя бы одну заглавную букву (`A`–`Z`).
          repeatedChars:
            description: |
              Если `true`, пароль не должен содержать более 2 одинаковых символов подряд
              (то же правило, что применяется на уровне `Excellent`).
      passwordHistoryLimit:
        description: |
          Количество предыдущих паролей пользователя, которые сохраняются в истории для предотвращения их повторного использования.
      rotation:
        description: |
          Настройки ротации паролей.
        properties:
          interval:
            description: |
              Интервал времени, после которого пароль необходимо изменить. Задается в секундах, минутах, часах или днях: `10s`, `5m`, `1h`, `3d`.
      lockout:
        description: |
          Автоматическая временная блокировка пользователя после нескольких неуспешных попыток входа.

          Эта секция управляет только блокировкой после неверного пароля. Блокировка администратором
          через UserOperation (`d8 iam user lock`) работает независимо и не требует
          `passwordPolicy` или этой секции `lockout`.
        properties:
          maxAttempts:
            description: |
              Количество последовательных неуспешных попыток входа, после которых пользователь будет временно заблокирован.
          lockDuration:
            description: |
              Длительность временной блокировки. Задается в секундах, минутах, часах или днях: `10s`, `5m`, `1h`, `3d`.
          applyToConnectors:
            description: |
              Типы внешних (нелокальных) провайдеров аутентификации, на которые дополнительно распространяется блокировка.

              Встроенный коннектор `Local` всегда подпадает под политику блокировки, когда секция настроена, и
              перечислять его в этом списке не требуется.

              Для перечисленных типов Dex считает неудачные попытки и блокирует каждую пару из провайдера и
              пользователя отдельно. Счётчик и блокировку показывает объект UserAccount пользователя.

              Ручная разблокировка пользователя для всех типов провайдеров выполняется через UserOperation.
  rateLimit:
    description: |
      Защита парольных эндпоинтов Dex от перебора.

      При включении Dex ограничивает неуспешные запросы с каждого IP-адреса клиента к следующим эндпоинтам:

      - `/token` — эндпоинт токенов: аутентификация клиента и вход по паролю через API. Остальные запросы аутентифицированного
        клиента, например обновление refresh-токенов, не учитываются;
      - `/auth/{connector}/login` — форма входа локальных провайдеров, LDAP и Crowd;
      - `/password/change` — страница смены пароля;
      - `/mfa` и вложенные пути — шаги двухфакторной аутентификации (2FA).

      IP-адрес клиента берётся из заголовка `X-Real-IP`, который устанавливает платформенный Ingress-контроллер.
      Dex доверяет заголовку только от прокси платформы. Ingress-контроллер подтверждает себя клиентским
      сертификатом, который выпустил CA платформы для организации `ingress-nginx:auth`. Контроллер предъявляет его
      любому бэкенду, для которого это запрошено в Ingress, поэтому тот, кто может создать Ingress со сниппетами
      конфигурации на этом контроллере, тоже может задать адрес. Gateway передаёт секрет,
      который хранится в объекте HTTPRoute модуля в `d8-user-authn`: тот, кто может его читать, тоже может задать
      адрес. Для остальных запросов, например от пода, который обращается к сервису Dex напрямую, Dex учитывает адрес
      соединения.
      Через Gateway API (модуль `alb`) Dex учитывает последний адрес из `X-Forwarded-For`: адрес, который видел ALB,
      или адрес, переданный балансировщиком, которому экземпляр ALB доверяет в `originalIPDetection.setRealIPFrom`.
      За балансировщиком, которому экземпляр ALB не доверяет, все клиенты учитываются по адресу балансировщика.
      Basic-аутентификация в API Kubernetes через LDAP-провайдер учитывается по адресу клиента,
      который видел платформенный Ingress-контроллер или Gateway: basic-auth-proxy передаёт последний адрес из `X-Forwarded-For`.
      Ingress-контроллер должен сам видеть адрес клиента: за балансировщиком, который его подменяет, все пользователи
      учитываются вместе (см. [Какой адрес клиента видит Dex?](faq.html#какой-адрес-клиента-видит-dex)).

      Ограничение применяется **только к неуспешным попыткам аутентификации**. Каждый запрос забирает токен из бакета
      своего IP-адреса, а успешный ответ (HTTP `2xx` или `3xx`) возвращает токен. Успешные логины и обновление
      refresh-токенов не расходуют квоту IP. Когда бакет пуст, Dex отвечает кодом `429` с заголовком `Retry-After`.

      Лимиты хранятся в памяти каждой реплики Dex.
      В HA-конфигурации эффективный лимит умножается на число реплик.
      Этот лимит дополняется блокировкой учётной записи.
    properties:
      enabled:
        description: |
          Включает ограничитель скорости запросов на парольных эндпоинтах Dex.
      perIP:
        description: |
          Параметры token bucket для каждого исходного IP-адреса.
          
          Оба параметра (`requestsPerMinute` и `burst`) учитывают только неуспешные попытки аутентификации.
        properties:
          requestsPerMinute:
            description: |
              Максимальная скорость неуспешных попыток аутентификации с одного IP-адреса (в попытках в минуту).

              Успешные логины и обновление refresh-токенов не учитываются.
          burst:
            description: |
              Максимальный размер бакета, определяющий допустимое количество неуспешных попыток аутентификации с одного IP-адреса до начала ограничения.
  staticUsers2FA:
    description: |
      Двухфакторная аутентификация локальных пользователей.
    properties:
      enabled:
        description: |
          Если указано `true`, локальные пользователи должны будут использовать двухфакторную аутентификацию (2FA) при входе в систему.
      issuerName:
        description: |
          Имя издателя для токенов двухфакторной аутентификации (2FA). Это имя отображается пользователям в приложении для 2FA (например, Google Authenticator).
  idTokenTTL:
    description: |
      Время жизни ID-токена.

      Задается в виде строки с указанием часов, минут и секунд: `30m`, `20s`, `2h30m10s`, `5h`.

      Должно быть больше нуля и строго меньше 6 часов (ключи подписи Dex ротируются каждые 6 часов). ModuleConfig предыдущей версии настроек (`spec.version` 1 или 2) со значением 6 часов и больше по-прежнему принимается: значение заменяется на `5h59m`.

      Задаёт минимально возможное время жизни пользовательской сессии ([параметр `keepUsersLoggedInFor`](cr.html#dexauthenticator-v1-spec-keepusersloggedinfor) ресурса DexAuthenticator
      и параметры вида `auth.sessionTTL`, например, [в модуле `console`](/modules/console/configuration.html#parameters-auth-sessionttl)).

      Если время жизни сессии меньше или равно `idTokenTTL`, фактическое время до выхода пользователя из системы составит `idTokenTTL + 1s`.

      Чтобы пользователь выходил из системы раньше значения `idTokenTTL` по умолчанию, уменьшите также значение этого параметра.
  refreshTokenAbsoluteLifetime:
    description: |
      Максимальное время жизни refresh-токенов (соответствует настройке Dex `expiry.refreshTokens.absoluteLifetime`).

      Этот параметр управляет продолжительностью пользовательских сессий. По истечении этого периода пользователи должны будут пройти повторную аутентификацию, даже при наличии активных refresh-токенов.

      Refresh-токен, который не используется в течение [`refreshTokenValidIfNotUsedFor`](#parameters-refreshtokenvalidifnotusedfor), истекает раньше.

      Значение не может быть меньше `idTokenTTL`.

      Задается в виде строки с указанием часов, минут и секунд: 30m, 20s, 2h30m10s, 24h.
  refreshTokenValidIfNotUsedFor:
    description: |
      Время, после которого неиспользуемый refresh-токен истекает (соответствует настройке Dex `expiry.refreshTokens.validIfNotUsedFor`).

      Файл kubeconfig или приложение, которое за это время ни разу не обновило свои токены, входит заново. По умолчанию —
      около 3 месяцев.

      Значение должно быть больше нуля и не больше `refreshTokenAbsoluteLifetime`.

      Задается в виде строки с указанием часов, минут и секунд: 30m, 20s, 2h30m10s, 24h.
  sessions:
    description: |
      Браузерные сессии Dex.

      При включённых сессиях Dex запоминает пользователя, вошедшего в браузере:

      - Веб-интерфейсы Deckhouse (объекты DexAuthenticator модулей платформы, например консоль или Grafana) используют
        общий вход: пользователь вводит пароль и второй фактор один раз и открывает остальные без них (см. `sso`).
        Для пользователя внешнего провайдера это работает, пока сохранённые данные пользователя актуальны
        (см. `identityRefresh`).
      - Форма входа показывает флажок «Запомнить меня». С ним сессия сохраняется после закрытия браузера.
      - Выход из приложения объекта DexAuthenticator завершает сессию: за несколько секунд браузер выходит из всех
        приложений объектов DexAuthenticator, в которые вошёл через эту сессию.

      Что не меняется:

      - Токены доступа для `kubectl` (kubeconfig, `d8 login`) и приложений объектов DexClient, запрашивающих
        офлайн-доступ, выдаются только после интерактивного входа и никогда — по сессии браузера. Исключение —
        DexClient с [`refreshTokenLifetime: Session`](cr.html#dexclient-v1-spec-refreshtokenlifetime).
      - Приложение, в которое пользователь вошёл через DexAuthenticator, остаётся доступным в течение
        [`keepUsersLoggedInFor`](cr.html#dexauthenticator-v1-spec-keepusersloggedinfor), даже после окончания сессии Dex.
        Сессия ограничивает только вход без пароля.
      - Выход из Dex не завершает сессию во внешнем OIDC-провайдере, если у провайдера не включён параметр
        [`upstreamLogout`](cr.html#dexprovider-v1-spec-oidc-upstreamlogout).
    properties:
      enabled:
        description: |
          Включает браузерные сессии Dex.
      absoluteLifetime:
        description: |
          Максимальное время жизни сессии с момента входа.

          Как бы активно ни использовался браузер, по истечении этого времени сессия завершается, и следующее
          приложение снова запрашивает пароль и второй фактор. По умолчанию пользователь, работающий каждый день,
          вводит их раз в неделю.

          Задаётся в виде строки с целым числом часов, минут и секунд, указанных именно в таком порядке: `30m`, `2h30m`, `24h`.
      validIfNotUsedFor:
        description: |
          Время, после которого неиспользуемая сессия завершается.

          Сессия используется, когда браузер входит через неё в приложение и когда приложение, вошедшее через неё,
          обновляет свои токены: приложение объекта DexAuthenticator или DexClient с `refreshTokenLifetime: Session`.
          Такое приложение обновляет токены, пока оно открыто и отправляет запросы; закрытое приложение или
          приложение в браузере спящего компьютера сессию не использует.
          Пока браузер использует сессию, она длится до `absoluteLifetime`.

          Со значением по умолчанию (сутки) сессия переживает ночь, но не выходные. Если требования строже, задайте
          меньшее время, например `1h`: тогда после каждого перерыва в час пользователь снова вводит пароль.

          Не может быть больше `absoluteLifetime`. Если задан только `absoluteLifetime` и он меньше суток,
          неиспользуемая сессия завершается через `absoluteLifetime`.

          Задаётся в виде строки с целым числом часов, минут и секунд, указанных именно в таком порядке: `30m`, `2h30m`, `24h`.
      rememberMeCheckedByDefault:
        description: |
          Установлен ли по умолчанию флажок «Запомнить меня» в форме входа.

          Без «Запомнить меня» сессия завершается при закрытии браузера.
      sso:
        description: |
          Общий вход в приложения.

          - `Platform` — веб-интерфейсы Deckhouse используют общий вход. Это приложения объектов DexAuthenticator в
            неймспейсах `d8-*`. Пользовательские объекты DexAuthenticator и DexClient общий вход не используют.
          - `None` — каждое приложение запрашивает вход. Сессия избавляет от ввода пароля только при повторном входе
            в то же приложение.
      identityRefresh:
        description: |
          Актуальность данных пользователя, которые Dex сохраняет при входе, например групп пользователя.

          При включённых сессиях Dex использует сохранённые данные, пока они не старше `maxAge`, а затем снова получает их
          у провайдера. Если провайдер отвечает, что пользователя больше нет или ему закрыт доступ, Dex завершает все
          сессии и токены этого пользователя этого провайдера.
          Данные локальных пользователей перечитываются каждый раз.

          Для входа по сессии данные тоже должны быть актуальны. Dex не хранит учётные данные пользователя внешнего
          провайдера, чтобы перечитывать данные в фоне, поэтому, как только данные старше `maxAge`, такой пользователь
          снова вводит пароль при входе в следующее приложение. Данные обновляют каждый вход и каждое обновление токенов
          приложения, при котором Dex обращается к провайдеру: пока пользователь работает в приложении объекта
          DexAuthenticator, общий вход сохраняется. Чтобы он сохранялся и после долгих перерывов, увеличьте `maxAge`.
        properties:
          maxAge:
            description: |
              Возраст сохранённых данных, после которого Dex снова получает их у провайдера.

              По умолчанию равен [`idTokenTTL`](#parameters-idtokenttl).

              Задаётся в виде строки с целым числом часов, минут и секунд, указанных именно в таком порядке: `30m`, `2h30m`, `24h`.
          gracePeriod:
            description: |
              Насколько дольше `maxAge` Dex использует сохранённые данные, если провайдер не отвечает.

              После этого срока Dex не обновляет токены пользователя, пока провайдер не ответит.

              Задаётся в виде строки с целым числом часов, минут и секунд, указанных именно в таком порядке: `30s`, `5m`, `1h`.
  devices:
    description: |
      Устройства пользователя: браузеры и другие клиенты (kubeconfig, `d8 login`), с которых пользователь вошёл.
    properties:
      trustedAfter:
        description: |
          Время, через которое устройство пользователя становится доверенным. Отсчитывается от первого входа из
          его браузера (для устройства без браузера — от входа).

          Только с доверенного устройства пользователь может сам выйти на всех устройствах, на остальных устройствах
          или на другом устройстве и запросить смену пароля. С устройства, на котором вход выполнен позже, можно
          выйти только на нём самом. Поэтому тот, кто только что вошёл с украденным паролем, не может ни выкинуть
          владельца, ни сменить пароль, а владелец видит новое устройство на доверенном и завершает его. От
          украденной сессии это не защищает: у скопированной cookie Dex или веб-интерфейса возраст устройства
          владельца. Операции администратора не ограничены.

          Когда приложение достигает лимита устройств пользователя, из него первыми выходят устройства, которые ещё
          не стали доверенными.

          `0s` — каждое устройство доверенное сразу: с любого можно завершить остальные и запросить смену пароля.

          Задаётся в виде строки с целым числом часов, минут и секунд, указанных именно в таком порядке: `30m`, `2h30m`, `24h`.
      maxPerApplication:
        description: |
          Сколько устройств пользователя одно приложение держит в системе: refresh-токенов одного пользователя в одном
          приложении (DexAuthenticator, DexClient, kubeconfig).

          Вход сверх лимита завершает вход в это приложение на устройстве, которое дольше всех им не пользовалось,
          в первую очередь — на ещё не доверенном (см. `trustedAfter`). Каждый новый файл kubeconfig — отдельное
          устройство.
      rememberedBrowsers:
        description: |
          Сколько браузеров пользователя Dex помнит вместе с их первым входом.

          Запомненный браузер при новом входе сохраняет свой возраст: срок до доверия (`trustedAfter`) отсчитывается от
          его первого входа. Сверх лимита забывается браузер, который дольше всех не появлялся; при следующем входе
          он считается новым.

          `0` — не помнить браузеры: каждый вход — новое устройство.
  retention:
    description: |
      Сколько хранятся записи модуля.
    properties:
      userOperations:
        description: |
          Сколько хранится объект [UserOperation](cr.html#useroperation) после создания. Затем он удаляется, и история
          операций в веб-интерфейсе его больше не показывает.

          Задаётся в виде строки с целым числом часов, минут и секунд, указанных именно в таком порядке: `30m`, `2h30m`, `24h`.
      revocations:
        description: |
          Сколько хранится запись об отзыве (завершении сессий и токенов пользователя операцией или выходом) для
          компонентов, которые по ней завершают сессии пользователя: объектов DexAuthenticator, базовой аутентификации
          в API Kubernetes, вебхука авторизации.

          По умолчанию и как минимум — [`idTokenTTL`](#parameters-idtokenttl) плюс час, но не меньше 70 минут: пока не
          истекут все токены, выданные до отзыва. Меньшее значение поднимается до этого минимума.

          Задаётся в виде строки с целым числом часов, минут и секунд, указанных именно в таком порядке: `30m`, `2h30m`, `24h`.
  highAvailability:
    description: |
      Ручное управление режимом отказоустойчивости.

      По умолчанию режим отказоустойчивости определяется автоматически. [Подробнее](/products/kubernetes-platform/documentation/v1/reference/api/global.html#параметры) про режим отказоустойчивости.
  nodeSelector:
    description: |
      Структура, аналогичная `spec.nodeSelector` пода Kubernetes.

      Если значение не указано, оно определяется [автоматически](/products/kubernetes-platform/documentation/v1/#выделение-узлов-под-определенный-вид-нагрузки).
  tolerations:
    description: |
      Структура, аналогичная `spec.tolerations` пода Kubernetes.

      Если значение не указано, оно определяется [автоматически](/products/kubernetes-platform/documentation/v1/#выделение-узлов-под-определенный-вид-нагрузки).
  ingressClass:
    description: |
      Класс Ingress-контроллера, который используется для Dex.

      Опциональный параметр, по умолчанию используется глобальное значение `modules.ingressClass`.
  https:
    description: |
      Тип сертификата, используемого для Dex.

      При использовании этого параметра полностью переопределяются глобальные настройки `global.modules.https`.
    properties:
      mode:
        description: |
          Режим работы HTTPS:

          - `CertManager` — Dex работает по HTTPS и заказывает сертификат с помощью ClusterIssuer, заданного в параметре `certManager.clusterIssuerName`;
          - `CustomCertificate` — Dex работает по HTTPS с сертификатом из неймспейса `d8-system`;
          - `Disabled` — модуль отключается, так как он работает только по HTTPS;
          - `OnlyInURI` — Dex работает по HTTP за внешним балансировщиком, который терминирует HTTPS. Все ссылки `user-authn` формируются со схемой HTTPS. Балансировщик должен перенаправлять HTTP на HTTPS.

          Если задать секцию `https` без `mode`, применяется `Disabled` и модуль отключается.
      certManager:
        description: Параметры режима `CertManager`.
        properties:
          clusterIssuerName:
            description: |
              ClusterIssuer, используемый для Dex.

              Доступны `letsencrypt`, `letsencrypt-staging`, `selfsigned`, но вы можете определить свои.
      customCertificate:
        description: Параметры режима `CustomCertificate`.
        properties:
          secretName:
            description: |
              Имя секрета в неймспейсе `d8-system`, который используется для Dex.

              Secret должен быть в формате [kubernetes.io/tls](https://kubernetes.github.io/ingress-nginx/user-guide/tls/#tls-secrets).
  controlPlaneConfigurator:
    description: 'Параметры [модуля `control-plane-manager`](/modules/control-plane-manager/) для автоматической настройки `kube-apiserver`.'
    properties:
      enabled:
        description: 'Использовать ли `control-plane-manager` для настройки OIDC в `kube-apiserver`.'
      dexCAMode:
        description: |
          Способ определения CA, который будет использован при настройке `kube-apiserver`:
          * `Custom` — использовать CA, указанный в параметре `dexCustomCA`. Этот вариант уместен, например, если вы используете внешний HTTPS-балансировщик перед Ingress-контроллером и на этом балансировщике используется самоподписанный сертификат.
          * `DoNotNeed` — CA не требуется (например, при использовании публичного TLS-провайдера Let’s Encrypt или других).
          * `FromIngressSecret` — извлечь CA или сам сертификат из Secret, который используется в Ingress. Подходит для самоподписанных сертификатов в Ingress.
      dexCustomCA:
        description: 'CA, который используется, если `dexCAMode` установлен в `Custom`. Указывается в открытом виде, без кодирования в Base64.'
