spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Создаваемое контроллером представление объектов Dex Password, OfflineSessions и UserIdentity для веб-интерфейса Deckhouse.

            Контроллер ведёт по одному объекту UserAccount на каждого локального пользователя и на каждого
            пользователя, входившего через любой внешний провайдер.

            Не создавайте и не изменяйте объекты UserAccount. Ими владеет контроллер `user-authn`.
            Источником истины для учётных данных и состояния сессий остаётся Dex.
          properties:
            spec:
              description: |
                Пустой объект. UserAccount принадлежит контроллеру и не содержит
                пользовательской спецификации.

                Не создавайте объекты UserAccount. Контроллер проецирует его из Dex.
            status:
              description: |
                Наблюдаемое состояние учётной записи, проецируемое из Dex.

                Это представление для веб-интерфейса Deckhouse. Учётные данные и секреты коннектора не хранятся.
              properties:
                email:
                  description: |
                    Email учётной записи, как его сообщает Dex.
                username:
                  description: |
                    Имя пользователя, как его сообщает Dex.
                userID:
                  description: |
                    Уникальный идентификатор пользователя из Dex.
                kind:
                  description: |
                    Тип учётной записи.
                    
                    Возможные значения:

                    * `Local` — Dex Password (статический пользователь);
                    * `External` — федеративная учётная запись из коннектора.
                connectorID:
                  description: |
                    Идентификатор коннектора Dex.
                    
                    Для локальных учётных записей — `local`;
                    для внешних — имя DexProvider.
                providerType:
                  description: |
                    Тип внешнего провайдера идентификации.

                    Совпадает со значением `spec.type` в DexProvider, например `LDAP`, `Crowd`, `OIDC`, `SAML` или `Github`.

                    Для локальных учётных записей поле пустое.
                incorrectLoginAttempts:
                  description: |
                    Количество последовательных неудачных попыток входа, зафиксированных в Dex.

                    Dex ведёт счётчик для локальных учётных записей, а также для учётных записей провайдеров LDAP
                    и Atlassian Crowd, тип которых указан в параметре модуля
                    [`passwordPolicy.lockout.applyToConnectors`](configuration.html#parameters-passwordpolicy-lockout-applytoconnectors).
                locked:
                  description: |
                    Признак того, что учётная запись в данный момент заблокирована.
                lockedUntil:
                  description: |
                    Время (в формате RFC3339), до которого учётная запись остаётся заблокированной.

                    После наступления этого времени блокировка снимается автоматически,
                    в том числе если её выставил администратор на ограниченный срок
                    (например, на час через UserOperation). Бессрочная блокировка записывается администратором
                    как далёкая дата в будущем.
                lockedByAdministrator:
                  description: |
                    Признак того, что текущая блокировка выставлена администратором
                    (в отличие от автоматической блокировки политикой паролей).

                    Не означает бессрочность: срок по-прежнему задаёт `lockedUntil`.
                userRef:
                  description: |
                    Имя связанного ресурса User.
                    
                    Заполняется для локальных учётных записей.
                expireAt:
                  description: |
                    Срок действия учётной записи в формате RFC3339.
                groups:
                  description: |
                    Список групп, связанных с учётной записью.
                lastLogin:
                  description: |
                    Время последнего входа через Dex в формате RFC3339.

                    Dex записывает его после прохождения всех шагов входа, включая 2FA. Базовая аутентификация
                    в API-сервере через LDAP-провайдер с `enableBasicAuth` тоже обновляет это время, потому что
                    проходит через Dex.

                    Для учётной записи, которая не входила с момента обновления на Deckhouse 1.78, это время её
                    последнего входа, при котором был выдан refresh-токен.
                twoFactor:
                  description: |
                    Состояние 2FA (TOTP) учётной записи в Dex, без секретов.

                    Заполняется после первого входа учётной записи через Dex.
                  properties:
                    enrolled:
                      description: |
                        Хранит ли Dex секрет TOTP для учётной записи.

                        Dex создаёт секрет, когда показывает пользователю QR-код при входе.
                    confirmed:
                      description: |
                        Ввёл ли пользователь код для секрета TOTP.

                        До этого при входе снова показывается QR-код. UserOperation с типом `Reset2FA` удаляет секрет.
                sessions:
                  description: |
                    Устройства, на которых выполнен вход в учётную запись. Первыми идут устройства с самой свежей
                    активностью.

                    Устройство — это одно из следующего:

                    * браузер, выполнивший вход в Dex при включённых
                      [сессиях](configuration.html#parameters-sessions) Dex, вместе с приложениями, refresh-токены
                      которых привязаны к его сессии (объекты DexAuthenticator и объекты DexClient
                      с `refreshTokenLifetime: Session`);
                    * refresh-токен, не привязанный к действующей сессии Dex в браузере: kubeconfig, вход через device
                      flow, приложение DexClient, базовая аутентификация в API-сервере, токен, сессия которого
                      закончилась, а приложение его сохранило, а при выключенных сессиях Dex — каждый вход
                      в приложение DexAuthenticator.

                    В списке не больше 50 устройств. Чтобы завершить вход на устройстве, создайте UserOperation
                    с типом `Logout` и укажите его `id` в `logout.session` (браузер) или в `logout.grant`
                    (refresh-токен).
                  items:
                    properties:
                      id:
                        description: |
                          Идентификатор устройства: для браузера — идентификатор сессии Dex (claim `sid` в его
                          токенах), для остальных устройств — идентификатор refresh-токена.
                      kind:
                        description: |
                          Вид устройства.

                          Возможные значения:

                          * `Browser` — браузер, выполнивший вход в Dex;
                          * `Grant` — refresh-токен, не привязанный к действующей сессии Dex в браузере.
                      clients:
                        description: |
                          Клиенты Dex (приложения), в которые выполнен вход на устройстве.
                      ipAddress:
                        description: |
                          Адрес клиента при последнем входе с устройства, каким его передал в Dex Ingress-контроллер.
                          Указывает на устройство лишь приблизительно: прокси, NAT или VPN меняют адрес. За
                          балансировщиком, который скрывает адрес клиента, это адрес балансировщика (подробнее — в разделе
                          [Какой адрес клиента видит Dex?](faq.html#какой-адрес-клиента-видит-dex)).
                      userAgent:
                        description: |
                          Заголовок User-Agent, который устройство отправило при последнем входе, обрезанный до
                          512 байт.

                          Заголовок задаёт само устройство. Выводите его как текст.
                      signedInAt:
                        description: |
                          Время входа с устройства в формате RFC3339.
                      knownSince:
                        description: |
                          Время, когда Dex впервые увидел вход в учётную запись из браузера этого устройства, в формате RFC3339.

                          Указывается, если раньше `signedInAt` больше чем на минуту: из браузера уже входили, выходили и вошли снова.
                          Dex узнаёт браузер по долгоживущей cookie, которую ставит при входе. Выход на остальных устройствах,
                          выход на всех устройствах и операции, которые завершают все сеансы пользователя, заставляют Dex
                          забыть браузеры. То же происходит, если это устройство завершили с другого устройства или это сделал администратор.
                      lastActivity:
                        description: |
                          Время последнего использования устройства в формате RFC3339, округлённое вниз до часа.
                          Для устройства, вошедшего меньше часа назад, указывается время входа.
                sessionsTruncated:
                  description: |
                    Признак того, что устройств у учётной записи больше, чем в `sessions`. Устройства с самой давней
                    активностью в список не попали.
