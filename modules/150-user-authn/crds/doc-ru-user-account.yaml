spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Проецируемое контроллером представление объектов Dex `Password` и `OfflineSessions` для консоли Deckhouse.

            Не создавайте и не изменяйте ресурсы UserAccount. Ими владеет контроллер user-authn.
            Источником истины для учётных данных и состояния сессий остаётся Dex.
          properties:
            spec:
              description: |
                Пустой объект. UserAccount принадлежит контроллеру и не содержит
                пользовательской спецификации.

                Не создавайте этот ресурс; контроллер проецирует его из Dex.
            status:
              description: |
                Наблюдаемое состояние учётной записи, проецируемое из Dex.
                Это представление для консоли; учётные данные и секреты коннектора не хранятся.
              properties:
                email:
                  description: |
                    Email учётной записи, как его сообщает Dex.
                username:
                  description: |
                    Имя пользователя, как его сообщает Dex.
                userID:
                  description: |
                    Уникальный идентификатор пользователя из Dex.
                kind:
                  description: |
                    Тип учётной записи. Возможные значения:

                    * `Local` — Dex Password (статический пользователь);
                    * `External` — федеративная учётная запись из коннектора.
                connectorID:
                  description: |
                    Идентификатор коннектора Dex. Для локальных учётных записей — `local`;
                    для внешних — имя DexProvider.
                providerType:
                  description: |
                    Тип внешнего провайдера идентификации. Типичные значения для внешних
                    учётных записей: `LDAP`, `Crowd`. Для локальных учётных записей пустое.
                incorrectLoginAttempts:
                  description: |
                    Количество последовательных неудачных попыток входа, зафиксированных
                    в Dex Password (локальные) или OfflineSessions (внешние).
                locked:
                  description: |
                    Признак того, что учётная запись в данный момент заблокирована.
                lockedUntil:
                  description: |
                    Время (в формате RFC3339), до которого учётная запись остаётся заблокированной.
                    После наступления этого времени блокировка снимается автоматически,
                    если учётная запись не заблокирована администратором.
                lockedByAdministrator:
                  description: |
                    Признак того, что учётная запись заблокирована администратором
                    (в отличие от автоматической блокировки).
                userRef:
                  description: |
                    Имя связанного ресурса User. Заполняется для локальных учётных записей.
                expireAt:
                  description: |
                    Срок действия учётной записи в формате RFC3339.
                groups:
                  description: |
                    Список групп, связанных с учётной записью.
