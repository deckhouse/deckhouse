apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: revocations.dex.coreos.com
spec:
  group: dex.coreos.com
  names:
    kind: Revocation
    listKind: RevocationList
    plural: revocations
    singular: revocation
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
    additionalPrinterColumns:
      - name: Type
        type: string
        jsonPath: .type
        description: |
          What was revoked: pair (everything issued to a user of a connector below Generation), session (a browser session) or grant (a refresh token).
      - name: Reason
        type: string
        jsonPath: .reason
        description: |
          Why the credentials were revoked.
      - name: Generation
        type: integer
        jsonPath: .generation
        description: |
          The new generation of the pair (pair only).
      - name: Age
        type: date
        jsonPath: .metadata.creationTimestamp
