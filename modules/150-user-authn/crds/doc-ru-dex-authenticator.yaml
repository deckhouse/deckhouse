spec:
  versions:
    - name: v1alpha1
      schema: &schema
        openAPIV3Schema:
          description: |-
            Аутентификация через Dex для веб-приложений в неймспейсе объекта.

            Собственных подов у DexAuthenticator нет. В неймспейсе объекта модуль создаёт Service `<NAME>-dex-authenticator`, на который указывает аннотация `auth-url` приложения, и публикует путь `https://<DOMAIN>/dex-authenticator` через Ingress или HTTPRoute.

            Условие `Served` в `status.conditions` показывает, обслуживает ли модуль объект.

            > **Внимание.** DexAuthenticator работает только по HTTPS. Ingress приложения должен иметь настроенный TLS.

            Имя DexAuthenticator должно быть не длиннее 63 символов, начинаться со строчной латинской буквы и содержать только строчные латинские буквы, цифры и дефисы (RFC 1035).
          properties:
            status:
              description: |-
                Состояние объекта, которое записывает модуль.
              properties:
                conditions:
                  description: |-
                    Условия объекта.

                    Условие `Served` показывает, обслуживает ли dex-authenticator модуля объект на всех доменах, указанных в объекте. Новый или изменённый объект начинает обслуживаться в течение нескольких минут. Если статус условия `False`, в `reason` указана одна из причин:

                    * `WaitingForInstance` — объект ещё не обслуживается.
                    * `HostConflict` — домен уже занят другим DexAuthenticator. Смените домен или Ingress-класс, если домен должен быть общим. На остальных доменах объект обслуживается.
                    * `InvalidRecord` — объект нельзя обслужить в таком виде, причина указана в `message`.
                    * `ClientNotCreated` — модуль не смог зарегистрировать приложение в Dex, причина указана в `message`.
                    * `ForeignObject` — в неймспейсе есть Service, Ingress или HTTPRoute с именем, которое нужно модулю. Переименуйте или удалите его.
                    * `ObjectsNotWritten` — API-сервер отказал в создании Service или маршрута объекта, например из-за политики допуска. Ответ API-сервера указан в `message`.
                    * `TableFull` — достигнут предел числа обслуживаемых DexAuthenticator в кластере или в неймспейсе. Подробности указаны в `message`.
                  items:
                    properties:
                      type:
                        description: Тип условия, например `Served`.
                      status:
                        description: Статус условия.
                      reason:
                        description: Причина статуса, например `HostConflict`.
                      message:
                        description: Подробности статуса.
                      lastTransitionTime:
                        description: Время последнего изменения статуса.
                      observedGeneration:
                        description: Поколение объекта, для которого установлено условие.
            spec:
              properties:
                applicationDomain:
                  description: |-
                    Адрес приложения (домен DNS для Ingress-ресурса), для которого необходима аутентификация.

                    > **Внимание.** Укажите DNS-имя, соответствующее требованиям RFC 1123 (subdomain), без HTTP-схемы. Использование IP-адресов не допускается.
                sendAuthorizationHeader:
                  description: |-
                    Флаг, который отвечает за отправку конечному приложению заголовка `Authorization: Bearer`.

                    При его включении в заголовке передаётся подписанный Dex ID-токен (`id_token`), содержащий email пользователя, его имя и список групп.

                    > **Внимание.** Включайте, только если приложение может обрабатывать такой заголовок, и настройте маршрут приложения, как описано в разделе [«Как передать приложению логин и группы пользователя»](faq.html#как-передать-приложению-логин-и-группы-пользователя).
                applicationIngressCertificateSecretName:
                  description: |
                    Имя секрета (Secret) с TLS-сертификатом для домена приложения, который используется в Ingress-ресурсе приложения. Секрет должен обязательно находиться в том же неймспейсе, что и DexAuthenticator.
                applicationIngressClassName:
                  description: |
                    Название Ingress-класса, которое будет использоваться в Ingress-ресурсе (должно совпадать с названием Ingress-класса для домена приложения).

                    Обязательно, если не указан `gatewayAPI`. Если класс не указан, Ingress-ресурсы для приложения не создаются. Можно указать оба поля.
                gatewayAPI:
                  description: |
                    Набор параметров для настройки создаваемого объекта HTTPRoute.

                    > **Внимание.** Используется только в кластерах с поддержкой Gateway API. Должен быть указан тот же объект ListenerSet, который используется для домена приложения.
                  properties:
                    applicationHTTPRouteListenerSetName:
                      description: |
                        Имя объекта ListenerSet из Gateway API, на который будет ссылаться создаваемый HTTPRoute.
                    applicationHTTPRouteListenerSetNamespace:
                      description: |
                        Имя неймспейса, в котором располагается объект ListenerSet из Gateway API, на который будет ссылаться создаваемый HTTPRoute.

                        Если не указано, используется неймспейс объекта `DexAuthenticator`.
                    applicationHTTPRouteListenerSetSectionName:
                      description: |
                        Имя секции объекта ListenerSet из Gateway API, на которую будет ссылаться создаваемый HTTPRoute.

                signOutURL:
                  description: |
                    URL приложения, запросы с которого перенаправляются на URL выхода `dex-authenticator`.

                    Используется в приложении для направления запросов на «Выход» (завершение сеанса). Для указанного URL будет создан отдельный Ingress-ресурс, запросы на который будут перенаправляться в `dex-authenticator`.

                    Значение не должно содержать переводы строк.
                keepUsersLoggedInFor:
                  description: |
                    Максимальное время бездействия пользователя, в течение которого его сессия остаётся активной.

                    Задаётся в виде строки с целым числом часов, минут и секунд, указанных именно в таком порядке: `30m`, `20s`, `2h30m10s`, `24h`.

                    Значение должно быть больше [`idTokenTTL`](configuration.html#parameters-idtokenttl), иначе сессия длится `idTokenTTL + 1s`. Чтобы пользователи выходили раньше, уменьшите `idTokenTTL`.
                allowedEmails:
                  description: |-
                    Email'ы пользователей, которым разрешено проходить аутентификацию.

                    Смена списка завершает сессии пользователей, которые больше не подходят, при следующем обновлении токена, в пределах `idTokenTTL`.

                    **По умолчанию** разрешено всем пользователям.

                    Значения не должны содержать переводы строк.
                allowedGroups:
                  description: |-
                    Группы, пользователям которых разрешено проходить аутентификацию.

                    Смена списка завершает сессии пользователей, которые больше не подходят, при следующем обновлении токена, в пределах `idTokenTTL`.

                    **По умолчанию** разрешено всем группам.

                    Значения не должны содержать переводы строк.
                allowedProviders:
                  description: |-
                    Имена объектов DexProvider, через которые пользователи могут входить в приложение.

                    Для пользователей встроенной базы паролей ([User](cr.html#user)) укажите `local`.

                    Провайдер вне списка не показывается на странице входа. Если в списке один провайдер, пользователи сразу направляются к нему. Смена списка завершает сессии пользователей, которые больше не подходят, при следующем обновлении токена, в пределах `idTokenTTL`.

                    Имя, которому не соответствует ни один DexProvider, принимается с предупреждением. Войти через него никто не сможет, пока провайдер не появится.

                    **По умолчанию** можно использовать всех провайдеров.
                  x-doc-default: Разрешены все провайдеры.
                whitelistSourceRanges:
                  description: |
                    Список адресов в формате CIDR, которым разрешено проходить аутентификацию. Если параметр не указан, аутентификацию разрешено проходить без ограничения по IP-адресу.
                podMetadata:
                  description: |-
                    Игнорируется, оставлено для совместимости.
                nodeSelector:
                  description: |-
                    Игнорируется, оставлено для совместимости.
                tolerations:
                  description: |-
                    Игнорируется, оставлено для совместимости.
                highAvailability:
                  description: |-
                    Игнорируется, оставлено для совместимости.
                resources:
                  description: |-
                    Игнорируется, оставлено для совместимости.
                additionalApplications:
                  description: |
                    Список дополнительных приложений, для которых необходима аутентификация.
                  items:
                    properties:
                      domain:
                        description: |-
                          Домен приложения (для использования в Ingress-ресурсе), запросы на который будут перенаправлены в Dex для аутентификации.

                          > **Внимание.** Укажите DNS-имя, соответствующее требованиям RFC 1123 (subdomain), без HTTP-схемы. Использование IP-адресов не допускается.
                      ingressSecretName:
                        description: |
                          Имя секрета (Secret) с TLS-сертификатом для домена приложения, который используется в Ingress-ресурсе приложения. Секрет должен обязательно находиться в том же неймспейсе, что и DexAuthenticator.
                      ingressClassName:
                        description: |
                          Название Ingress-класса, которое будет использоваться в Ingress-ресурсе (должно совпадать с названием Ingress-класса для домена приложения).

                          Обязательно, если не указан `gatewayAPI`. Если класс не указан, Ingress-ресурсы для приложения не создаются. Можно указать оба поля.
                      gatewayAPI:
                        description: |
                          Набор параметров для настройки создаваемого объекта HTTPRoute.

                          > **Внимание.** Используется только в кластерах с поддержкой Gateway API. Должен быть указан тот же объект ListenerSet, который используется для домена приложения.
                        properties:
                          httpRouteListenerSetName:
                            description: |
                              Имя объекта ListenerSet из Gateway API, на который будет ссылаться создаваемый HTTPRoute.
                          httpRouteListenerSetNamespace:
                            description: |
                              Имя неймспейса, в котором располагается объект ListenerSet из Gateway API, на который будет ссылаться создаваемый HTTPRoute.

                              Если не указано, используется неймспейс объекта `DexAuthenticator`.
                          httpRouteListenerSetSectionName:
                            description: |
                              Имя секции объекта ListenerSet из Gateway API, на которую будет ссылаться создаваемый HTTPRoute.
                      signOutURL:
                        description: |
                          URL приложения, запросы с которого перенаправляются на URL выхода `dex-authenticator`.

                          Используется в приложении для направления запросов на "Выход" (завершение сеанса). Для указанного URL будет создан отдельный Ingress-ресурс, запросы на который будут перенаправляться в `dex-authenticator`.

                          Значение не должно содержать переводы строк.
                      whitelistSourceRanges:
                        description: |
                          Список адресов в формате CIDR, которым разрешено проходить аутентификацию. Если параметр не указан, аутентификацию разрешено проходить без ограничения по IP-адресу.
