spec:
  versions:
    - name: v1alpha1
      schema: &schema
        openAPIV3Schema:
          description: |
            Позволяет приложениям, поддерживающим OIDC-аутентификацию, взаимодействовать с Dex.

            После появления в кластере объекта `DexClient`:
            * в Dex будет зарегистрирован клиент с идентификатором (**clientID**) `dex-client-<NAME>@<NAMESPACE>`, где `<NAME>` и `<NAMESPACE>` — `metadata.name` и `metadata.namespace` объекта DexClient соответственно;
            * в соответствующем namespace будет создан Secret `dex-client-<NAME>` (где `<NAME>` — `metadata.name` объекта DexClient), содержащий пароль доступа к клиенту (**clientSecret**).

            [Пример использования...](usage.html#настройка-oauth2-клиента-в-dex-для-подключения-приложения)
          properties:
            spec:
              properties:
                allowedEmails:
                  description: |-
                    Email'ы пользователей, которым разрешено проходить аутентификацию.

                    Проверяется при входе и при каждом обновлении refresh-токена. Изменение списка
                    запрещает дальнейшее обновление сессий, чей email больше не входит в список.

                    **По умолчанию** разрешено всем пользователям.

                    Значения не должны содержать переводы строк.
                allowedGroups:
                  description: |
                    Группы, пользователям которых разрешено проходить аутентификацию.

                    Проверяется при входе и при каждом обновлении refresh-токена. Изменение списка
                    запрещает дальнейшее обновление сессий, чьи сохранённые группы больше с ним не пересекаются.

                    **По умолчанию** разрешено всем группам.

                    Значения не должны содержать переводы строк.
                redirectURIs:
                  description: |
                    Список адресов, на которые допустимо редиректить Dex'у после успешного прохождения аутентификации.

                    Значения не должны содержать переводы строк.
                trustedPeers:
                  description: |
                    ID клиентов, которым позволена cross-аутентификация.

                    Значения не должны содержать переводы строк.

                    [Подробнее...](https://developers.google.com/identity/protocols/CrossClientAuth)
                postLogoutRedirectURIs:
                  description: |
                    Адреса, на которые Dex может вернуть браузер после выхода пользователя из Dex через приложение
                    (`post_logout_redirect_uri` в OpenID Connect RP-Initiated Logout).

                    Работает только при включённых [браузерных сессиях Dex](configuration.html#parameters-sessions).

                    Значения не должны содержать переводы строк.
                backchannelLogoutURI:
                  description: |
                    Адрес, на который Dex отправляет уведомление, когда заканчивается браузерная сессия, через которую
                    пользователь вошёл в приложение (OpenID Connect Back-Channel Logout): пользователь выходит из сессии
                    или провайдер пользователя отвечает, что пользователя больше нет или ему закрыт доступ. Завершение
                    сессии операцией UserOperation или через самообслуживание в веб-интерфейсе уведомления не отправляет.

                    Работает только при включённых [браузерных сессиях Dex](configuration.html#parameters-sessions). Dex отправляет
                    уведомление один раз, без повторов: приложение не может полагаться на него, чтобы завершить свою сессию.

                    Должен быть HTTPS-адресом, хост которого — имя с точкой: Dex отправляет уведомление изнутри кластера,
                    поэтому IP-адреса, `localhost`, имена без точки или с точкой в конце и имена в зонах `.svc`
                    и `.cluster.local` не принимаются. Короткое имя вида `<СЕРВИС>.<НЕЙМСПЕЙС>` не отличить от внешнего
                    имени: указывайте полное внешнее имя приложения.
                refreshTokenLifetime:
                  description: |
                    Время жизни refresh-токенов приложения при включённых [браузерных сессиях Dex](configuration.html#parameters-sessions).

                    - `Standalone` — токены действуют до истечения срока, что бы ни происходило с сессией браузера.
                      Приложение, запрашивающее офлайн-доступ, получает refresh-токен только после интерактивного входа.
                    - `Session` — токены перестают действовать, когда пользователь выходит из сессии Dex, через которую они выданы.
                      Такое приложение может впустить пользователя по сессии браузера.

                    Без параметра токены работают как `Standalone`.
                secretMetadata:
                  description: |
                    Лейблы и аннотации, которые добавляются в Secret `dex-client-<NAME>`.
                  properties:
                    labels:
                      description: |
                        Лейблы Secret.
                    annotations:
                      description: |
                        Аннотации Secret.
    - name: v1
      schema: *schema
