spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Содержит информацию о статическом пользователе.

            [Создание пользователя](usage.html#создание-пользователя)
          properties:
            spec:
              properties:
                email:
                  description: |
                    Email пользователя. Должен быть в нижнем регистре.

                    Чтобы выдать пользователю права, укажите значение `email` в качестве имени субъекта `User` в RoleBinding или ClusterRoleBinding [гранулярной ролевой модели](/modules/user-authz/#гранулярная-ролевая-модель).

                    **Важно!** Email-адреса проверяются на уникальность без учёта регистра. Dex автоматически преобразует email-адреса в нижний регистр при аутентификации. Для новых пользователей заглавные буквы в email-адресах не допускаются. Существующие пользователи с заглавными буквами в email могут быть обновлены без изменения поля email.
                password:
                  description: |
                    Хеш пароля пользователя в явном виде или закодированный в Base64.

                    Для получения хеша пароля в Base64 можно воспользоваться командой `echo -n '<PASSWORD>' | htpasswd -BinC 10 "" | cut -d: -f2 | tr -d '\n' | base64 -w0; echo`. Также можно создать пользователя командой `d8 iam user create`, которая вычисляет хеш локально.

                    > **Важно.** Если используется политика паролей с контролем сложности выше `None`, пользователь будет обязан сменить установленный таким образом пароль после первого успешного входа в систему.

                    > **Важно.** Поле неизменяемо после создания User. Изменение пароля через `kubectl edit` не обновляет учётные данные в Dex и будет отклонено. Для сброса пароля используйте ресурс [UserOperation](#useroperation) (или `d8 iam user`).
                userID:
                  description: |
                    Устарел и игнорируется. Идентификатором пользователя в Dex служит `metadata.name` объекта User.
                groups:
                  description: |
                    Список групп, в которых у пользователя есть членство.

                    Т.к. параметр устарел, добавление пользователя в группы теперь осуществляется через ресурс [Group](#group).
                ttl:
                  description: |
                    Время жизни учетной записи пользователя (TTL).

                    Задается в виде строки с указанием часов и минут: 30m, 1h, 2h30m, 24h.

                    Указать TTL можно только 1 раз. При повторном изменении TTL дата `expireAt` не обновляется.
            status:
              properties:
                expireAt:
                  description: |
                    Время окончания действия учётной записи. Задаётся, только если указан `spec.ttl`. В это время User удаляется и исключается из всех Group.
                groups:
                  description: |
                    Список групп, в которых у пользователя есть членство.
                lock:
                  description: |
                    Информация о блокировке учётной записи пользователя.
                    Если объект присутствует и `state: true`, пользователь не может аутентифицироваться
                    до указанного времени или пока блокировка не будет снята администратором.

                    Действия с учётной записью (блокировка, разблокировка, сброс пароля, принудительная
                    смена пароля, сброс 2FA, выход) выполняются через ресурс [UserOperation](#useroperation).
                    Блокировка, сброс пароля, сброс 2FA и выход сразу завершают сессии пользователя. После
                    сброса пароля или принудительной смены пароля при следующем успешном входе пользователю
                    показывается форма смены пароля. Секрет 2FA пользователя удаляет только сброс 2FA.
                  properties:
                    state:
                      description: |
                        Показывает, заблокирован ли в данный момент пользователь.
                        - `true` — учётная запись заблокирована.
                        - `false` — учётная запись активна.
                    reason:
                      description: |
                        Машиночитаемая причина блокировки учётной записи.
                        Используется для проверки политик и автоматических обработчиков.
                    message:
                      description: |
                        Человекочитаемое описание причины блокировки.
                    until:
                      description: |
                        Время (в формате RFC3339), до которого учётная запись будет оставаться заблокированной.
                        После наступления этого времени блокировка снимается автоматически.
