
spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Содержит информацию о статических группах.
          properties:
            spec:
              properties:
                name:
                  description: Уникальное имя группы, которое попадает в claim `groups` токена и в RBAC-субъекты. Это не `metadata.name`.
                members:
                  type: array
                  description: Список членов группы.
                  items:
                    properties:
                      kind:
                        description: Тип члена группы.
                      name:
                        description: Для kind User — metadata.name пользователя. Для kind Group — spec.name вложенной группы (имя в токене), не metadata.name.
