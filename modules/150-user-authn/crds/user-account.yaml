apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: useraccounts.deckhouse.io
  labels:
    heritage: deckhouse
    module: user-authn
spec:
  group: deckhouse.io
  scope: Cluster
  names:
    plural: useraccounts
    singular: useraccount
    kind: UserAccount
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            Controller-projected view of Dex Password, OfflineSessions, and UserIdentity objects for the Deckhouse web UI.

            The controller keeps one UserAccount for each local user and one for each user who has signed in
            through any external provider.

            Do not create or edit UserAccount objects. The `user-authn` controller owns them.
            The source of truth for login credentials and session state remains Dex.
          properties:
            spec:
              type: object
              description: |
                Empty. UserAccount is controller-owned and has no user-editable specification.

                Do not create UserAccount objects. The controller projects it from Dex.
            status:
              type: object
              description: |
                Observed account state projected from Dex.
                
                This is a Deckhouse web UI view only
                and does not store credentials or connector secrets.
              properties:
                email:
                  type: string
                  description: |
                    Account email as reported by Dex.
                username:
                  type: string
                  description: |
                    Account username as reported by Dex.
                userID:
                  type: string
                  description: |
                    Unique user identifier from Dex.
                kind:
                  type: string
                  enum:
                    - Local
                    - External
                  description: |
                    Account kind.
                    
                    Possible values:

                    * `Local`: Dex Password (static user).
                    * `External`: Federated identity from a connector.
                connectorID:
                  type: string
                  description: |
                    Dex connector identifier.
                    
                    `local` for local accounts; otherwise the DexProvider name.
                providerType:
                  type: string
                  description: |
                    External identity provider type.

                    Equals `spec.type` of the DexProvider, for example `LDAP`, `Crowd`, `OIDC`, `SAML`, or `Github`.

                    Empty for local accounts.
                incorrectLoginAttempts:
                  type: integer
                  format: int64
                  minimum: 0
                  description: |
                    Number of consecutive incorrect login attempts recorded in Dex.

                    Dex counts them for local accounts, and for accounts of LDAP and Atlassian Crowd providers
                    whose type is listed in the
                    [`passwordPolicy.lockout.applyToConnectors`](configuration.html#parameters-passwordpolicy-lockout-applytoconnectors)
                    module parameter.
                locked:
                  type: boolean
                  description: |
                    Whether the account is currently locked.
                lockedUntil:
                  type: string
                  format: date-time
                  description: |
                    Time until which the account remains locked, in RFC3339 format.

                    After this time the lock is lifted automatically, including an
                    administrator lock set for a limited duration (for example, one hour
                    via UserOperation). A permanent administrator lock is stored as a
                    far-future timestamp.
                lockedByAdministrator:
                  type: boolean
                  description: |
                    Whether the current lock was set by an administrator (as opposed to
                    an automatic password-policy lockout).
                    
                    This does not make the lock permanent. `lockedUntil` still defines when it expires.
                userRef:
                  type: string
                  description: |
                    Name of the related User resource.
                    
                    Set for local accounts.
                expireAt:
                  type: string
                  format: date-time
                  description: |
                    Account expiration time, in RFC3339 format.
                groups:
                  type: array
                  description: |
                    Groups associated with the account.
                  items:
                    type: string
                lastLogin:
                  type: string
                  format: date-time
                  description: |
                    Time of the last sign-in through Dex, in RFC3339 format.

                    Dex records it after the user passes every sign-in step, including 2FA. Basic Authentication to
                    the API server through an LDAP provider with `enableBasicAuth` updates it too, because it goes
                    through Dex.

                    For an account that has not signed in since the upgrade to Deckhouse 1.78, this is the time of
                    its last sign-in that issued a refresh token.
                twoFactor:
                  type: object
                  description: |
                    State of the 2FA (TOTP) of the account in Dex, without secrets.

                    Set after the first sign-in of the account through Dex.
                  properties:
                    enrolled:
                      type: boolean
                      description: |
                        Whether Dex keeps a TOTP secret for the account.

                        Dex creates the secret when it shows the user the QR code at a sign-in.
                    confirmed:
                      type: boolean
                      description: |
                        Whether the user has entered a code for the TOTP secret.

                        Until then, a sign-in shows the QR code again. A UserOperation of the `Reset2FA` type removes
                        the secret.
                sessions:
                  type: array
                  maxItems: 50
                  description: |
                    Devices signed in to the account, the most recently active first.

                    A device is one of the following:

                    * a browser signed in to Dex while the
                      [`sessions`](configuration.html#parameters-sessions) of Dex are enabled, together with the
                      applications whose refresh tokens are bound to its session (the DexAuthenticator objects, and
                      DexClient objects with `refreshTokenLifetime: Session`);
                    * a refresh token not bound to a live session of Dex in a browser: kubeconfig, a device flow, an
                      application of a DexClient, Basic Authentication to the API server, a token whose session has
                      ended while the application keeps it, and, while the sessions of Dex are disabled, every sign-in
                      to an application of a DexAuthenticator.

                    The list holds at most 50 devices. To sign a device out, create a UserOperation of the `Logout`
                    type with its `id` in `logout.session` (a browser) or `logout.grant` (a refresh token).
                  items:
                    type: object
                    required:
                      - id
                      - kind
                    properties:
                      id:
                        type: string
                        description: |
                          Identifier of the device: the identifier of the session of Dex (the `sid` claim of its
                          tokens) for a browser, the identifier of the refresh token for other devices.
                      kind:
                        type: string
                        enum:
                          - Browser
                          - Grant
                        description: |
                          Kind of the device.

                          Possible values:

                          * `Browser`: a browser signed in to Dex.
                          * `Grant`: a refresh token not bound to a live session of Dex in a browser.
                      clients:
                        type: array
                        description: |
                          Dex clients (applications) signed in on the device.
                        items:
                          type: string
                      ipAddress:
                        type: string
                        maxLength: 64
                        description: |
                          Client address of the last sign-in of the device, as the Ingress controller passed it to
                          Dex. It locates the device only approximately: a proxy, NAT, or VPN changes it. Behind a
                          balancer that hides the address of the client, it is the address of the balancer (for
                          details, see the [Which client address does Dex see?](faq.html#which-client-address-does-dex-see)
                          section).
                      userAgent:
                        type: string
                        maxLength: 512
                        description: |
                          User-Agent header the device sent at its last sign-in, cut to 512 bytes.

                          The device sets the header itself. Treat it as text.
                      signedInAt:
                        type: string
                        format: date-time
                        description: |
                          Time the device signed in, in RFC3339 format.
                      knownSince:
                        type: string
                        format: date-time
                        description: |
                          Time Dex first saw the browser of the device complete a sign-in to the account, in RFC3339 format.

                          Set when more than a minute earlier than `signedInAt`: the browser signed in before, signed out, and signed in again.
                          Dex recognizes the browser by a long-lived cookie it sets at sign-in. Signing out of the other devices
                          on the account, signing out everywhere, and the operations that end every session of the user make Dex
                          forget the browsers, and so does ending this device from another device or by an administrator.
                      lastActivity:
                        type: string
                        format: date-time
                        description: |
                          Time of the last use of the device, in RFC3339 format, rounded down to the hour.
                          A device that signed in less than an hour ago shows its sign-in time.
                sessionsTruncated:
                  type: boolean
                  description: |
                    Whether the account has more devices than `sessions` lists. The least recently active ones are
                    not listed.
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.email
          name: Email
          type: string
        - jsonPath: .status.kind
          name: Kind
          type: string
        - jsonPath: .status.connectorID
          name: Connector
          type: string
        - jsonPath: .status.incorrectLoginAttempts
          name: Attempts
          type: integer
        - jsonPath: .status.locked
          name: Locked
          type: boolean
        - jsonPath: .status.lockedUntil
          name: LockedUntil
          type: string
          format: date-time
        - jsonPath: .status.lastLogin
          name: LastLogin
          type: date
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
