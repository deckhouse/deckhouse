spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает конфигурацию подключения стороннего провайдера.

            С его помощью можно гибко настроить интеграцию каталога учетных записей с Kubernetes.

            [Пример использования...](usage.html#примеры-настройки-провайдера)
          properties:
            spec:
              properties:
                enabled:
                  description: |
                    Включает провайдер.

                    Выключенный провайдер не отображается на странице входа, и войти через него нельзя. DexProvider и его настройки сохраняются.
                type:
                  description: |
                    Тип внешнего провайдера.
                displayName:
                  description: |
                    Имя провайдера, которое будет отображено на странице выбора провайдера для аутентификации.

                    Если настроен всего один провайдер, страница выбора провайдера показываться не будет.
                allowedIdentities:
                  description: |
                    Ограничивает идентичности, которые этот провайдер может утвердить, независимо от его типа.

                    Dex отказывает во входе пользователю, чей email не входит в `emails` и `emailDomains`, если задан
                    хотя бы один из списков, и сужает claim `groups` до пересечения со списком `groups`, если он задан
                    (пустое пересечение — отказ во входе). Каждый список необязателен; отсутствующий или пустой список
                    ничего не ограничивает.

                    Dex проверяет ограничения также при каждом запросе с refresh-токеном и при базовой аутентификации
                    через LDAP-провайдер. Refresh-токен вне ограничений отзывается, и пользователю нужно войти заново.
                    Для провайдеров Crowd и OIDC basic-auth-proxy проверяет учётные данные напрямую у провайдера,
                    поэтому при базовой аутентификации ограничения не действуют.

                    Ограничения также определяют, кто может создать или изменить провайдер. Провайдер, способный
                    утвердить email или группу, которым в кластере уже назначены роли, может записать только тот, кому
                    разрешено назначать эти роли. Без ограничения по email провайдер может утвердить любой адрес, в том
                    числе с `SuperAdmin`, поэтому его запись требует `SuperAdmin`. С ограничениями по обоим признакам
                    учитываются только роли, выданные перечисленным идентичностям. Провайдер Crowd или OIDC с
                    `enableBasicAuth: true` считается провайдером без ограничения по email, потому что базовая
                    аутентификация выполняется в обход ограничений.
                  properties:
                    emails:
                      description: |
                        Точные email-адреса, которые провайдер может утвердить.

                        Сравнение без учёта регистра.
                    emailDomains:
                      description: |
                        Домены email, которые провайдер может утвердить, без `@`.

                        Сравнивается точно с частью адреса
                        после последнего `@`; поддомены перечисляются явно.
                    groups:
                      description: |
                        Имена групп, которые провайдер может утвердить.

                        Применяется поверх типоспецифичных фильтров
                        групп (`allowedGroups`, `groups`, `teams`, `orgs[].teams`), если они есть.
                github:
                  description: |
                    Параметры провайдера GitHub (можно указывать? только если `type: Github`).
                  properties:
                    clientID:
                      description: |
                        ID организации на GitHub.
                    clientSecret:
                      description: |
                        Secret организации на GitHub.
                    teamNameField:
                      description: |
                        Формат команд, которые будут получены из GitHub.

                        Если в организации `acme` есть группа `Site Reliability Engineers`, в случае:
                        * `name` будет получена группа с именем `['acme:Site Reliability Engineers']`;
                        * `slug` будет получена группа с именем `['acme:site-reliability-engineers']`;
                        * `both` будут получены группы с именами `['acme:Site Reliability Engineers', 'acme:site-reliability-engineers']`.
                    useLoginAsID:
                      description: |
                        Позволяет вместо использования внутреннего GitHub ID использовать имя пользователя.
                    orgs:
                      description: |
                        Массив названий организаций в GitHub.
                      items:
                        properties:
                          name:
                            description: |
                              Название организации.
                          teams:
                            description: |
                              Список команд, допустимых для приема из GitHub.

                              Токен пользователя будет содержать объединенное множество команд из GitHub и команд из этого списка. Если множество окажется пустым, авторизация не будет считаться успешной.

                              Если параметр не указан, токен пользователя будет содержать все команды из GitHub.
                gitlab: &gitlab
                  description: |
                    Параметры провайдера GitLab (можно указывать, только если `type: Gitlab`).
                  properties:
                    clientID:
                      description: |
                        ID приложения, созданного в GitLab (Application ID).
                    clientSecret:
                      description: |
                        Secret приложения, созданного в GitLab (Secret).
                    baseURL:
                      description: |
                        Адрес GitLab.
                    groups:
                      description: |
                        Список-фильтр групп (**пути групп — path**, а не имена), допустимых для приема из GitLab.

                        Токен пользователя будет содержать пересечение множеств групп из GitLab и групп из этого списка. Если множество окажется пустым, авторизация не будет считаться успешной.

                        Если параметр не указан, токен пользователя будет содержать все группы из GitLab.
                    useLoginAsID:
                      description: |
                        Позволяет вместо использования внутреннего GitLab ID, использовать имя пользователя.
                    rootCAData:
                      description: |
                        Цепочка сертификатов в формате PEM для проверки подлинности провайдера.
                bitbucketCloud: &bitbucketCloud
                  description: |
                    Параметры провайдера Bitbucket Cloud (можно указывать, только если `type: BitbucketCloud`).
                  properties:
                    clientID:
                      description: |
                        ID приложения, созданного в Bitbucket Cloud (Key).
                    clientSecret:
                      description: |
                        Secret приложения, созданного в Bitbucket Cloud (Secret).
                    teams:
                      description: |
                        Список-фильтр команд, допустимых для приема из Bitbucket Cloud.

                        Токен пользователя будет содержать пересечение множеств команд из Bitbucket Cloud и команд из этого списка. Если если множество окажется пустым, авторизация не будет считаться успешной.

                        Токен будет содержать команды пользователя в claim `groups`, как и у других провайдеров.
                    includeTeamGroups:
                      description: |
                        Включает в список команд все группы команды, в которых состоит пользователь.

                        Пример групп пользователя с включенной опцией:
                        ```yaml
                        groups=["my_team", "my_team/administrators", "my_team/members"]
                        ```
                crowd: &crowd
                  description: |
                    Параметры провайдера Crowd (можно указывать, только если `type: Crowd`).
                  properties:
                    clientID:
                      description: |
                        ID приложения, созданного в Crowd (Application Name).
                    clientSecret:
                      description: |
                        Пароль приложения, созданного в Crowd (Password).
                    baseURL:
                      description: |
                        Адрес Crowd.
                    groups:
                      description: |
                        Список-фильтр групп, допустимых для приема из Crowd.

                        Токен пользователя будет содержать пересечение множеств групп из Crowd и групп из этого списка. Если множество окажется пустым, авторизация не будет считаться успешной.

                        Если параметр не указан, токен пользователя будет содержать все группы из Crowd.
                    usernamePrompt:
                      description: |
                        Строка, которая будет отображаться возле поля для имени пользователя в форме ввода логина и пароля.
                    enableBasicAuth:
                      description: |
                        Включает базовую аутентификацию в API-сервере Kubernetes по логину и паролю пользователя Crowd.

                        Работает только при включённом параметре [`apiserver.publishAPI`](/modules/control-plane-manager/configuration.html#parameters-apiserver-publishapi) модуля `control-plane-manager`. Параметр `enableBasicAuth` может быть включён только в одном DexProvider кластера.

                        Базовая аутентификация выполняется в обход `spec.allowedIdentities`. Поэтому создать провайдер с включённым параметром или включить параметр в существующем провайдере может только `SuperAdmin`.

                        Успешная проверка кешируется вместе с группами пользователя на 2 минуты, неуспешная — на 10 секунд. Пользователь, у которого отозван доступ в провайдере, может обращаться к Kubernetes API до истечения кешированного результата.
                oidc: &oidc
                  description: |
                    Параметры провайдера OIDC (можно указывать, только если `type: OIDC`).
                  properties:
                    clientID:
                      description: |
                        ID приложения, созданного в OIDC-провайдере.
                    clientSecret:
                      description: |
                        Пароль приложения, созданного в OIDC-провайдере.
                    issuer:
                      description: |
                        Адрес OIDC-провайдера.
                    insecureSkipEmailVerified:
                      description: |
                        Игнорировать информацию о статусе подтверждения email пользователя.

                        Как именно подтверждается email, решает сам провайдер. В ответе от провайдера приходит лишь информация — подтвержден email или нет.
                    basicAuthUnsupported:
                      description: |
                        Использовать POST-запросы для общения с провайдером вместо добавления токена в Basic Authorization header.

                        В большинстве случаев Dex сам определяет, какой запрос ему нужно сделать, но иногда включение этого параметра может помочь.
                    getUserInfo:
                      description: |
                        Запрашивать дополнительные данные об успешно подключенном пользователе.

                        [Подробнее...](https://openid.net/specs/openid-connect-core-1_0.html#UserInfo)
                    userIDKey:
                      description: |
                        [Claim](https://openid.net/specs/openid-connect-core-1_0.html#Claims), который будет использован для получения ID пользователя.
                    userNameKey:
                      description: |
                        [Claim](https://openid.net/specs/openid-connect-core-1_0.html#Claims), который будет использован для получения имени пользователя.
                    claimMapping:
                      description: |
                        Некоторые провайдеры возвращают нестандартные claim'ы (например, mail). Claim mappings помогают Dex преобразовать их в [стандартные claim'ы OIDC](https://openid.net/specs/openid-connect-core-1_0.html#Claims).

                        Dex может преобразовать нестандартный claim в стандартный, только если id_token, полученный от OIDC-провайдера, не содержит аналогичный стандартный claim.
                      properties:
                        email:
                          description: |
                            [Claim](https://openid.net/specs/openid-connect-core-1_0.html#Claims), который будет использован для получения email пользователя.
                        groups:
                          description: |
                            [Claim](https://openid.net/specs/openid-connect-core-1_0.html#Claims), который будет использован для получения групп пользователя.
                        preferred_username:
                          description: |
                            [Claim](https://openid.net/specs/openid-connect-core-1_0.html#Claims), который будет использован для получения предпочтительного имени пользователя.
                    claimMappingOverride:
                      description: |
                        Если включено, сопоставление claim'ов (`claimMapping`) будет переопределять стандартные claim'ы OIDC.

                        По умолчанию сопоставление claim'ов будет использоваться только в том случае, если стандартные claim'ы OIDC отсутствуют, например, если в id_token нет claim'а `email`, будет использоваться `claimMapping.email`.
                    allowedGroups:
                      description: |
                        Список групп, которые должны быть у пользователя для успешной аутентификации.

                        Если список содержит группу, которой у пользователя нет, аутентификация будет отклонена.

                        Если параметр не задан, проверка принадлежности к группам не выполняется.
                    scopes:
                      description: |
                        Список [полей](https://github.com/dexidp/website/blob/main/content/docs/configuration/custom-scopes-claims-clients.md) для включения в ответ при запросе токена.

                        Scope — это одиночный токен, он не может содержать пробельные символы: протокол OAuth2 передаёт scope'ы списком, разделённым пробелами.
                    promptType:
                      description: |
                        Определяет — должен ли Issuer запрашивать подтверждение и давать подсказки при аутентификации.

                        По умолчанию будет запрошено подтверждение при первой аутентификации. Допустимые значения могут изменяться в зависимости от Issuer.
                    upstreamLogout:
                      description: |
                        Завершает сессию пользователя и у провайдера, когда пользователь выходит из Dex.

                        Работает только при включённых [браузерных сессиях Dex](configuration.html#parameters-sessions) и только если провайдер публикует `end_session_endpoint`.

                        По умолчанию выход из Dex не затрагивает сессию у провайдера: выход из одного приложения не завершает сессии пользователя в других приложениях. В этом случае провайдер может снова аутентифицировать пользователя без пароля. Чтобы пароль запрашивался при каждом входе, задайте `promptType: login`.
                    rootCAData:
                      description: |
                        Цепочка CA в формате PEM, используемая для валидации TLS.
                    insecureSkipVerify:
                      description: |
                        Не производить проверку подлинности провайдера с помощью TLS. Небезопасно, не рекомендуется использовать в production-окружениях.
                    enableBasicAuth:
                      description: |
                        Включает базовую аутентификацию в API-сервере Kubernetes по логину и паролю пользователя OIDC-провайдера.

                        Работает только при включённом параметре [`apiserver.publishAPI`](/modules/control-plane-manager/configuration.html#parameters-apiserver-publishapi) модуля `control-plane-manager`. Параметр `enableBasicAuth` может быть включён только в одном DexProvider кластера.

                        Базовая аутентификация выполняется в обход `spec.allowedIdentities`. Поэтому создать провайдер с включённым параметром или включить параметр в существующем провайдере может только `SuperAdmin`.

                        Успешная проверка кешируется вместе с группами пользователя на 2 минуты, неуспешная — на 10 секунд. Пользователь, у которого отозван доступ в провайдере, может обращаться к Kubernetes API до истечения кешированного результата.
                ldap: &ldap
                  description: |
                    Параметры провайдера LDAP.
                  properties:
                    host:
                      description: |
                        Адрес и порт (опционально) LDAP-сервера.
                    insecureNoSSL:
                      description: |
                        Подключаться к каталогу LDAP не по защищенному порту.

                        Несовместимо с `startTLS`, `insecureSkipVerify` и `rootCAData`: если `insecureNoSSL: true`, TLS отключён и эти параметры не имеют эффекта.
                    startTLS:
                      description: |
                        Использовать [STARTTLS](https://www.digitalocean.com/community/tutorials/how-to-encrypt-openldap-connections-using-starttls) для шифрования.

                        Несовместимо с `insecureNoSSL`.
                    usernamePrompt:
                      description: |
                        Строка, которая будет отображаться возле поля для имени пользователя в форме ввода логина и пароля.
                    rootCAData:
                      description: |
                        Цепочка CA в формате PEM, используемая для валидации TLS.

                        Не используется при `insecureNoSSL: true`.
                    insecureSkipVerify:
                      description: |
                        Не производить проверку подлинности провайдера с помощью TLS. Небезопасно, не рекомендуется использовать в production-окружениях.

                        Не используется при `insecureNoSSL: true`.
                    bindDN:
                      description: |
                        Путь до сервис-аккаунта приложения в LDAP.
                    bindPW:
                      description: |
                        Пароль сервисной учётной записи, заданной в `bindDN`.
                    userSearch:
                      description: |
                        Настройки фильтров пользователей, которые помогают сначала отфильтровать директории, в которых будет производиться поиск пользователей,
                        а затем найти пользователя по полям (его имени, адресу электронной почты или отображаемому имени).

                        [Подробнее](https://github.com/dexidp/dex/blob/3b7292a08fd2c61900f5e6c67f3aa2ee81827dea/Documentation/connectors/ldap.md#example-mapping-a-schema-to-a-search-config) о процессе фильтрации...
                      properties:
                        baseDN:
                          description: 'Откуда будет начат поиск пользователей.'
                        filter:
                          description: |
                            Позволяет добавить фильтр для директории с пользователями.
                        username:
                          description: |
                            Имя атрибута, из которого будет получен username пользователя.
                        idAttr:
                          description: |
                            Имя атрибута, из которого будет получен ID пользователя.
                        emailAttr:
                          description: |
                            Имя атрибута, из которого будет получен email пользователя.
                        nameAttr:
                          description: |
                            Атрибут отображаемого имени пользователя.
                    groupSearch:
                      description: |
                        Настройки фильтра для поиска групп для указанного пользователя.

                        [Подробнее](https://github.com/dexidp/dex/blob/3b7292a08fd2c61900f5e6c67f3aa2ee81827dea/Documentation/connectors/ldap.md#example-mapping-a-schema-to-a-search-config) о процессе фильтрации...
                      properties:
                        baseDN:
                          description: 'Откуда будет начат поиск групп'
                        filter:
                          description: |
                            Фильтр для директории с группами.
                        nameAttr:
                          description: |
                            Имя атрибута, в котором хранится уникальное имя группы.
                        userMatchers:
                          description: |
                            Список сопоставлений атрибута имени юзера с именем группы.
                          items:
                            properties:
                              userAttr:
                                description: |
                                  Имя атрибута, в котором хранится имя пользователя.
                              groupAttr:
                                description: |
                                  Имя атрибута, в котором хранятся имена пользователей, состоящих в группе.
                    enableBasicAuth:
                      description: |
                        Включает базовую аутентификацию в API-сервере Kubernetes по логину и паролю пользователя LDAP.

                        Работает только при включённом параметре [`apiserver.publishAPI`](/modules/control-plane-manager/configuration.html#parameters-apiserver-publishapi) модуля `control-plane-manager`. Параметр `enableBasicAuth` может быть включён только в одном DexProvider кластера.

                        Успешная проверка кешируется вместе с группами пользователя на 2 минуты, неуспешная — на 10 секунд. Пользователь, у которого отозван доступ в провайдере, может обращаться к Kubernetes API до истечения кешированного результата.
                    kerberos:
                      description: |
                        Опциональные настройки Kerberos (SPNEGO) SSO для LDAP.
                      properties:
                        enabled:
                          description: |
                            Включить поток аутентификации Kerberos SPNEGO для данного LDAP‑провайдера.
                        expectedRealm:
                          description: |
                            Необязательный требуемый realm (без учета регистра). Если указан и не совпадает с realm билета — вход отклоняется.
                        usernameFromPrincipal:
                          description: |
                            Способ сопоставления Kerberos principal с именем пользователя в LDAP: `Localpart`, `SAMAccountName` или `UserPrincipalName`.
                        fallbackToPassword:
                          description: |
                            Если `true`, при отсутствии/некорректном заголовке `Authorization: Negotiate` будет показана форма ввода логина/пароля вместо ответа 401 с `WWW-Authenticate: Negotiate`.
                        keytabSecretName:
                          description: |
                            Имя секрета в неймспейсе `d8-user-authn`, содержащего ключ `krb5.keytab`, который монтируется в под Dex.

                            Обязательно, если `enabled` равен `true`.
                        krb5ConfConfigMapName:
                          description: |
                            Не используется. Dex проверяет билеты Kerberos только по keytab, и модуль не монтирует этот ConfigMap.
                        krb5ConfSecretName:
                          description: |
                            Не используется. Dex проверяет билеты Kerberos только по keytab, и модуль не монтирует этот секрет.
                saml: &saml
                  description: |
                    Параметры провайдера SAML (можно указывать, только если `type: SAML`).
                  properties:
                    ssoURL:
                      description: |
                        URL для отправки SAML AuthnRequest (SSO URL провайдера).
                    rootCAData:
                      description: |
                        Цепочка CA в формате PEM, используемая для валидации TLS.
                    entityIssuer:
                      description: |
                        Значение Issuer, которое Dex передаёт в SAML AuthnRequest (идентификатор Dex как сервис-провайдера). Это же значение Dex ожидает в элементе Audience SAML-утверждения.

                        Если не задано, Issuer в запрос не добавляется, а в элементе Audience Dex ожидает URL callback.
                    ssoIssuer:
                      description: |
                        Значение Issuer, ожидаемое в SAML-ответе от IdP.

                        Если не задано, Issuer ответа не проверяется.
                    redirectURI:
                      description: |
                        URI обратного вызова.
                        
                        Переопределяет URL callback по умолчанию. Должен быть установлен в `https://<dex-domain>/callback`.
                    usernameAttr:
                      description: |
                        SAML-атрибут для маппинга в claim username.
                    emailAttr:
                      description: |
                        SAML-атрибут для маппинга в claim email.
                    groupsAttr:
                      description: |
                        SAML-атрибут для маппинга в claim groups.
                    groupsDelim:
                      description: |
                        Разделитель для разбиения значения атрибута groups, если оно является одной строкой.
                    allowedGroups:
                      description: |
                        Если задано, вход будет разрешён только членам хотя бы одной из перечисленных групп.
                    filterGroups:
                      description: |
                        Если `true`, коннектор будет фильтровать claim groups, оставляя только группы из списка `allowedGroups`.
                    nameIDPolicyFormat:
                      description: |
                        Формат NameIDPolicy для запроса к IdP.

                        Если параметр не задан, Dex запрашивает `persistent`.

                        [UserOperation](#useroperation) `Lock` со `spec.target` действует на идентификатор
                        пользователя, который Dex берёт из NameID. Чтобы такая блокировка работала, используйте
                        `persistent` или `emailAddress`. При значении `transient` IdP возвращает новый NameID при
                        каждом входе, и блокировка не действует при следующем входе пользователя.
                    insecureSkipSignatureValidation:
                      description: |
                        Пропустить проверку подписи SAML-ответов. Небезопасно, использовать только для тестирования.
    - name: v1
      schema:
        openAPIV3Schema:
          description: |
            Описывает конфигурацию подключения стороннего провайдера.

            С его помощью можно гибко настроить интеграцию каталога учетных записей с Kubernetes.

            [Пример использования...](usage.html#примеры-настройки-провайдера)

            **Внимание.** Запрещено использовать пользователей и группы с префиксом `system:`. Аутентификация таких пользователей или участников этих групп будет отклонена, а в логах `kube-apiserver` появится соответствующее предупреждение.
          properties:
            spec:
              properties:
                enabled:
                  description: |
                    Включает провайдер.

                    Выключенный провайдер не отображается на странице входа, и войти через него нельзя. DexProvider и его настройки сохраняются.
                type:
                  description: |
                    Тип внешнего провайдера.
                displayName:
                  description: |
                    Имя провайдера, которое будет отображено на странице выбора провайдера для аутентификации.

                    Если настроен всего один провайдер, страница выбора провайдера показываться не будет.
                allowedIdentities:
                  description: |
                    Ограничивает идентичности, которые этот провайдер может утвердить, независимо от его типа.

                    Dex отказывает во входе пользователю, чей email не входит в `emails` и `emailDomains`, если задан
                    хотя бы один из списков, и сужает claim `groups` до пересечения со списком `groups`, если он задан
                    (пустое пересечение — отказ во входе). Каждый список необязателен; отсутствующий или пустой список
                    ничего не ограничивает.

                    Dex проверяет ограничения также при каждом запросе с refresh-токеном и при базовой аутентификации
                    через LDAP-провайдер. Refresh-токен вне ограничений отзывается, и пользователю нужно войти заново.
                    Для провайдеров Crowd и OIDC basic-auth-proxy проверяет учётные данные напрямую у провайдера,
                    поэтому при базовой аутентификации ограничения не действуют.

                    Ограничения также определяют, кто может создать или изменить провайдер. Провайдер, способный
                    утвердить email или группу, которым в кластере уже назначены роли, может записать только тот, кому
                    разрешено назначать эти роли. Без ограничения по email провайдер может утвердить любой адрес, в том
                    числе с `SuperAdmin`, поэтому его запись требует `SuperAdmin`. С ограничениями по обоим признакам
                    учитываются только роли, выданные перечисленным идентичностям. Провайдер Crowd или OIDC с
                    `enableBasicAuth: true` считается провайдером без ограничения по email, потому что базовая
                    аутентификация выполняется в обход ограничений.
                  properties:
                    emails:
                      description: |
                        Точные email-адреса, которые провайдер может утвердить.

                        Сравнение без учёта регистра.
                    emailDomains:
                      description: |
                        Домены email, которые провайдер может утвердить, без `@`.

                        Сравнивается точно с частью адреса
                        после последнего `@`; поддомены перечисляются явно.
                    groups:
                      description: |
                        Имена групп, которые провайдер может утвердить.

                        Применяется поверх типоспецифичных фильтров
                        групп (`allowedGroups`, `groups`, `teams`, `orgs[].teams`), если они есть.
                github:
                  description: |
                    Параметры провайдера GitHub (можно указывать, только если `type: Github`).
                  properties:
                    clientID:
                      description: |
                        ID организации на GitHub.
                    clientSecret:
                      description: |
                        Secret организации на GitHub.
                    teamNameField:
                      description: |
                        Формат команд, которые будут получены из GitHub.

                        Если в организации `acme` есть группа `Site Reliability Engineers`, в случае:
                        * `Name` будет получена группа с именем `['acme:Site Reliability Engineers']`;
                        * `Slug` будет получена группа с именем `['acme:site-reliability-engineers']`;
                        * `Both` будут получены группы с именами `['acme:Site Reliability Engineers', 'acme:site-reliability-engineers']`.
                    useLoginAsID:
                      description: |
                        Позволяет вместо использования внутреннего GitHub ID использовать имя пользователя.
                    orgs:
                      description: |
                        Массив названий организаций в GitHub.
                      items:
                        properties:
                          name:
                            description: |
                              Название организации.
                          teams:
                            description: |
                              Список-фильтр команд, допустимых для приема из GitHub.

                              Токен пользователя будет содержать пересечение множеств команд из GitHub и команд из этого списка. Если множество окажется пустым, авторизация не будет считаться успешной.

                              Если параметр не указан, токен пользователя будет содержать все команды из GitHub.
                gitlab: *gitlab
                bitbucketCloud: *bitbucketCloud
                crowd: *crowd
                oidc: *oidc
                ldap: *ldap
                saml: *saml
