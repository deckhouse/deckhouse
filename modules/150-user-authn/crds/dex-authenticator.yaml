apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dexauthenticators.deckhouse.io
  labels:
    heritage: deckhouse
    module: user-authn
    backup.deckhouse.io/cluster-config: "true"
spec:
  group: deckhouse.io
  scope: Namespaced
  names:
    plural: dexauthenticators
    singular: dexauthenticator
    kind: DexAuthenticator
    shortNames:
      - dex-auth
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: false
      deprecated: true
      schema: &schema
        openAPIV3Schema:
          type: object
          required:
            - spec
          description: |-
            Authentication through Dex for web applications in the namespace of the object.

            A DexAuthenticator has no pods of its own. In the namespace of the object, the module creates the Service `<NAME>-dex-authenticator`, which the `auth-url` annotation of the application points at, and publishes the `https://<DOMAIN>/dex-authenticator` path through an Ingress or an HTTPRoute.

            The `Served` condition in `status.conditions` shows whether the module serves the object.

            > **Warning.** DexAuthenticator works only with HTTPS. The application Ingress must have TLS configured.

            The name of a DexAuthenticator must be at most 63 characters long, start with a lowercase Latin letter and contain only lowercase Latin letters, digits and hyphens (RFC 1035).
          x-doc-examples:
            - apiVersion: deckhouse.io/v1
              kind: DexAuthenticator
              metadata:
                name: app-name
                namespace: app-namespace
              spec:
                applicationDomain: "app-name.kube.my-domain.com"
                sendAuthorizationHeader: false
                applicationIngressCertificateSecretName: "ingress-tls"
                applicationIngressClassName: "nginx"
                keepUsersLoggedInFor: "720h"
                allowedGroups:
                  - everyone
                  - admins
                allowedProviders:
                  - local
                  - corp-ldap
                whitelistSourceRanges:
                  - 1.1.1.1/32
                  - 192.168.0.0/24
                additionalApplications:
                  - domain: "additional-app-name.kube.my-domain.com"
                    ingressSecretName: "ingress-tls"
                    ingressClassName: "nginx"
                    signOutURL: "/logout"
                    whitelistSourceRanges:
                      - 2.2.2.2/32
            - apiVersion: deckhouse.io/v1
              kind: DexAuthenticator
              metadata:
                name: app-alb
                namespace: app-namespace
              spec:
                applicationDomain: app.example.com
                gatewayAPI:
                  applicationHTTPRouteListenerSetName: app-listeners
          properties:
            metadata:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 63
                  x-kubernetes-validations:
                    - rule: "self.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')"
                      message: 'The DexAuthenticator name must start with a letter and contain only lowercase letters, digits and hyphens, because it is a part of the Service name.'
            status:
              type: object
              description: |-
                State of the object, written by the module.
              properties:
                conditions:
                  type: array
                  description: |-
                    Conditions of the object.

                    The `Served` condition shows whether the dex-authenticator of the module serves the object on every domain set in the object. A new or changed object is served within a few minutes. If the status of the condition is `False`, `reason` is one of the following:

                    * `WaitingForInstance`: The object is not served yet.
                    * `HostConflict`: A domain of the object belongs to another DexAuthenticator. Change the domain, or the Ingress class if the domain is to be shared. The object is served on its other domains.
                    * `InvalidRecord`: The object cannot be served as it is. `message` gives the reason.
                    * `ClientNotCreated`: The module cannot register the application in Dex. `message` gives the reason.
                    * `ForeignObject`: The namespace has a Service, Ingress or HTTPRoute with a name the module needs. Rename or delete it.
                    * `ObjectsNotWritten`: The API server refused to create the Service or a route of the object, for example, because of an admission policy. `message` gives the answer of the API server.
                    * `TableFull`: The limit of served DexAuthenticator objects is reached in the cluster or in the namespace. `message` gives the details.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        description: Type of the condition, such as `Served`.
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: Status of the condition.
                      reason:
                        type: string
                        description: Reason for the status, such as `HostConflict`.
                      message:
                        type: string
                        description: Details of the status.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: Time the status last changed.
                      observedGeneration:
                        type: integer
                        format: int64
                        description: Generation of the object that the condition was set for.
            spec:
              type: object
              required:
                - applicationDomain
              x-kubernetes-validations:
                - rule: "has(self.applicationIngressClassName) || has(self.gatewayAPI)"
                  message: "Specify applicationIngressClassName or gatewayAPI to publish the application."
              properties:
                applicationDomain:
                  type: string
                  description: |-
                    An address for the application (DNS domain for Ingress resource) from which the user request will be redirected for authentication in Dex.

                    > **Warning.** Specify a DNS name that complies with RFC 1123 (subdomain) and does not include an HTTP scheme. IP addresses are not allowed.
                  x-doc-examples: ['my-app.domain.com']
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                sendAuthorizationHeader:
                  type: boolean
                  description: |-
                    Request to application will be sent with `Authorization: Bearer` header when the option is switched to true.

                    When enabled, the header carries a signed Dex ID token (`id_token`) containing the user's email, name, and group membership.

                    > **Warning.** Enable it only if the application can process this header, and set up the route of the application as described in [How to pass the user's login and groups to an application](faq.html#how-to-pass-the-users-login-and-groups-to-an-application).
                applicationIngressCertificateSecretName:
                  type: string
                  description: |-
                    The name of the Secret containing the TLS certificate for the application domain (is used in the Ingress resource). The Secret must be located in the same namespace as the DexAuthenticator.
                  x-doc-examples: ['ingress-tls']
                  pattern: '^(|[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)$'
                applicationIngressClassName:
                  type: string
                  description: |
                    The name of the Ingress class to be used in the Ingress resource (it must match the Ingress class name for the application domain).

                    Required unless `gatewayAPI` is specified. If omitted, no Ingress resources are created for this application. Both fields may be specified.
                  x-doc-examples: ['nginx']
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                gatewayAPI:
                  type: object
                  required:
                  - applicationHTTPRouteListenerSetName
                  description: |-
                    A set of parameters to use in HTTPRoute object.
                    
                    > **Warning.** Only applicable in clusters with Gateway API support. Define the same ListenerSet object which is used to publish the application domain.
                  properties:
                    applicationHTTPRouteListenerSetName:
                      type: string
                      description: |
                        Name of the ListenerSet object from the Gateway API to be referred to from the HTTPRoute.
                      x-doc-examples: ['default-listenerset']
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                      maxLength: 253
                    applicationHTTPRouteListenerSetNamespace:
                      type: string
                      description: |
                        Namespace where the ListenerSet object from the Gateway API is deployed to be referred to from the HTTPRoute.

                        If not set, the namespace of the `DexAuthenticator` is used.
                      x-doc-examples: ['default']
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                      maxLength: 63
                    applicationHTTPRouteListenerSetSectionName:
                      type: string
                      description: |
                        Section name from the ListenerSet object in the Gateway API the HTTPRoute refers to.
                      x-doc-examples: ['default-listener']
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                      maxLength: 253
                signOutURL:
                  type: string
                  description: |-
                    The URL of the application from which requests will be redirected to the sign-out URL of the `dex-authenticator`.

                    It is used in the application to direct logout requests. A separate Ingress resource will be created for the specified URL, and requests to it will be redirected to `dex-authenticator`.

                    The value must not contain line breaks.
                  maxLength: 2048
                  pattern: '^[^\r\n]*$'
                keepUsersLoggedInFor:
                  type: string
                  pattern: '^([0-9]{1,5}h)?([0-9]{1,7}m)?([0-9]{1,9}s)?$'
                  description: |-
                    Maximum period of user inactivity during which the user session remains active.

                    Set as a string of whole hours, minutes, and seconds, in this order: `30m`, `20s`, `2h30m10s`, `24h`.

                    The value must be greater than [`idTokenTTL`](configuration.html#parameters-idtokenttl), otherwise the session lasts `idTokenTTL + 1s`. To sign users out sooner, decrease `idTokenTTL`.
                  x-doc-examples: ['24h']
                  x-doc-default: '168h'
                allowedEmails:
                  type: array
                  description: |-
                    A list of emails of users are allowed to connect to the client.

                    Changing the list ends the sessions of the users who no longer match it at their next token refresh, within `idTokenTTL`.

                    **By default**, all users can connect.

                    Values must not contain line breaks.
                  x-doc-default: 'All emails are allowed.'
                  items:
                    type: string
                    maxLength: 320
                    pattern: '^[^\r\n]*$'
                allowedGroups:
                  type: array
                  description: |-
                    A list of groups whose members are allowed to connect to the client.

                    Changing the list ends the sessions of the users who no longer match it at their next token refresh, within `idTokenTTL`.

                    **By default**, all groups can connect.

                    Values must not contain line breaks.
                  x-doc-default: 'All groups are allowed.'
                  items:
                    type: string
                    maxLength: 512
                    pattern: '^[^\r\n]*$'
                allowedProviders:
                  type: array
                  x-kubernetes-list-type: set
                  maxItems: 64
                  description: |-
                    Names of the DexProvider objects through which users can sign in to the application.

                    Use `local` for the users of the built-in password database ([User](cr.html#user)).

                    A provider outside the list is not offered on the sign-in page. If the list holds one provider, users go straight to it. Changing the list ends the sessions of the users who no longer match it at their next token refresh, within `idTokenTTL`.

                    A name that matches no DexProvider is accepted with a warning. Nobody can sign in through it until the provider appears.

                    **By default**, all providers can be used.
                  x-doc-default: 'All providers are allowed.'
                  items:
                    type: string
                    maxLength: 253
                    pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                whitelistSourceRanges:
                  type: array
                  description: |
                    CIDRs that are allowed to authenticate. Authentication is allowed without IP address restrictions, If not specified.
                  x-doc-examples: [['192.168.42.0/24']]
                  items:
                    type: string
                    pattern: '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/[0-9]{1,2}$'
                podMetadata:
                  type: object
                  description: |-
                    Ignored. Kept for compatibility.
                  x-doc-deprecated: true
                  properties:
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                nodeSelector:
                  additionalProperties:
                    type: string
                  x-kubernetes-preserve-unknown-fields: true
                  description: |-
                    Ignored. Kept for compatibility.
                  x-doc-deprecated: true
                  type: object
                tolerations:
                  description: |-
                    Ignored. Kept for compatibility.
                  x-doc-deprecated: true
                  items:
                    properties:
                      effect:
                        type: string
                        enum: ["NoSchedule", "PreferNoSchedule", "NoExecute"]
                      key:
                        type: string
                      operator:
                        type: string
                        enum: ["Exists", "Equal"]
                        x-doc-default: Equal
                      tolerationSeconds:
                        format: int64
                        type: integer
                      value:
                        type: string
                    type: object
                  type: array
                highAvailability:
                  type: boolean
                  description: |-
                    Ignored. Kept for compatibility.
                  x-doc-deprecated: true
                  x-doc-default: 'false'
                resources:
                  type: object
                  description: |-
                    Ignored. Kept for compatibility.
                  x-doc-deprecated: true
                  properties:
                    limits:
                      type: object
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    requests:
                      type: object
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    redis:
                      type: object
                      properties:
                        limits:
                          type: object
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                        requests:
                          type: object
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                additionalApplications:
                  type: array
                  description: |
                    A list of additional applications for which user authentication is required.
                  items:
                    type: object
                    required:
                      - domain
                    x-kubernetes-validations:
                      - rule: "has(self.ingressClassName) || has(self.gatewayAPI)"
                        message: "Specify ingressClassName or gatewayAPI to publish the application."
                    properties:
                      domain:
                        type: string
                        description: |-
                          An application domain from which the user request will be redirected for authentication in Dex.

                          > **Warning.** Specify a DNS name that complies with RFC 1123 (subdomain) and does not include an HTTP scheme. IP addresses are not allowed.
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                      ingressSecretName:
                        type: string
                        description: 'The name of the Secret containing the TLS certificate (from the domain) used in the applications Ingress resource. The Secret must be in the same namespace as DexAuthenticator.'
                        pattern: '^(|[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)$'
                      ingressClassName:
                        type: string
                        description: |-
                          The name of the Ingress class to be used in the Ingress resource (it must match the Ingress class name for the application domain).

                          Required unless `gatewayAPI` is specified. If omitted, no Ingress resources are created for this application. Both fields may be specified.
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                      gatewayAPI:
                        type: object
                        required:
                        - httpRouteListenerSetName
                        description: |-
                          A set of parameters to use in HTTPRoute object.

                          > **Warning.** Only applicable in clusters with Gateway API support. Define the same ListenerSet object which is used to publish the application domain.
                        properties:
                          httpRouteListenerSetName:
                            type: string
                            description: |
                              Name of the ListenerSet object from the Gateway API to be referred to from the HTTPRoute.
                            x-doc-examples: ['default-listener-set']
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                            maxLength: 253
                          httpRouteListenerSetNamespace:
                            type: string
                            description: |
                              Namespace where the ListenerSet object from the Gateway API is deployed to be referred to from the HTTPRoute.

                              If not set, the namespace of the `DexAuthenticator` is used.
                            x-doc-examples: ['default']
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                            maxLength: 63
                          httpRouteListenerSetSectionName:
                            type: string
                            description: |
                              Section name from the ListenerSet object in the Gateway API the HTTPRoute refers to.
                            x-doc-examples: ['web-listener']
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                            maxLength: 253
                      signOutURL:
                        type: string
                        description: |-
                          The URL of the application from which requests will be redirected to the sign-out URL of the `dex-authenticator`.

                          It is used in the application to direct logout requests. A separate Ingress resource will be created for the specified URL, and requests to it will be redirected to `dex-authenticator`.

                          The value must not contain line breaks.
                        maxLength: 2048
                        pattern: '^[^\r\n]*$'
                      whitelistSourceRanges:
                        type: array
                        description: |
                          CIDRs that are allowed to authenticate. Authentication is allowed without IP address restrictions, If not specified.
                        x-doc-examples: [['192.168.42.0/24']]
                        items:
                          type: string
                          pattern: '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/[0-9]{1,2}$'
      subresources: &subresources
        status: {}
      additionalPrinterColumns: &additionalPrinterColumns
        - jsonPath: .spec.applicationDomain
          name: Domain
          type: string
        - jsonPath: .status.conditions[?(@.type=="Served")].status
          name: Served
          type: string
    - name: v2alpha1
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          description: |-
            Authentication through Dex for web applications in the namespace of the object.

            A DexAuthenticator has no pods of its own. In the namespace of the object, the module creates the Service `<NAME>-dex-authenticator`, which the `auth-url` annotation of the application points at, and publishes the `https://<DOMAIN>/dex-authenticator` path through an Ingress or an HTTPRoute.

            The `Served` condition in `status.conditions` shows whether the module serves the object.

            > **Warning.** DexAuthenticator works only with HTTPS. The application Ingress must have TLS configured.

            The name of a DexAuthenticator must be at most 63 characters long, start with a lowercase Latin letter and contain only lowercase Latin letters, digits and hyphens (RFC 1035).
          properties:
            metadata:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 63
                  x-kubernetes-validations:
                    - rule: "self.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')"
                      message: 'The DexAuthenticator name must start with a letter and contain only lowercase letters, digits and hyphens, because it is a part of the Service name.'
            status:
              type: object
              description: |-
                State of the object, written by the module.
              properties:
                conditions:
                  type: array
                  description: |-
                    Conditions of the object.

                    The `Served` condition shows whether the dex-authenticator of the module serves the object on every domain set in the object. A new or changed object is served within a few minutes. If the status of the condition is `False`, `reason` is one of the following:

                    * `WaitingForInstance`: The object is not served yet.
                    * `HostConflict`: A domain of the object belongs to another DexAuthenticator. Change the domain, or the Ingress class if the domain is to be shared. The object is served on its other domains.
                    * `InvalidRecord`: The object cannot be served as it is. `message` gives the reason.
                    * `ClientNotCreated`: The module cannot register the application in Dex. `message` gives the reason.
                    * `ForeignObject`: The namespace has a Service, Ingress or HTTPRoute with a name the module needs. Rename or delete it.
                    * `ObjectsNotWritten`: The API server refused to create the Service or a route of the object, for example, because of an admission policy. `message` gives the answer of the API server.
                    * `TableFull`: The limit of served DexAuthenticator objects is reached in the cluster or in the namespace. `message` gives the details.
