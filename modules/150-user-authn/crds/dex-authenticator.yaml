apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dexauthenticators.deckhouse.io
  labels:
    heritage: deckhouse
    module: user-authn
    backup.deckhouse.io/cluster-config: "true"
spec:
  group: deckhouse.io
  scope: Namespaced
  names:
    plural: dexauthenticators
    singular: dexauthenticator
    kind: DexAuthenticator
    shortNames:
      - dex-auth
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: false
      deprecated: true
      schema: &schema
        openAPIV3Schema:
          type: object
          required:
            - spec
          description: |-
            After the `DexAuthenticator` object appears in the namespace, the following objects will be created:
            * Deployment containing OAuth2-Proxy and Redis containers;
            * Service, pointing to OAuth2-Proxy;
            * Ingress resource, configured to receive requests on `https://<applicationDomain>/dex-authenticator` and send it to a service side;
            * HTTPRoute resource (optional), configured to receive requests on `https://<applicationDomain>/dex-authenticator` and send it to a service side;
            * Secrets, needed to access Dex.

            **Warning.** DexAuthenticator only works with HTTPS. The application Ingress must have TLS configured.

            **Warning.** After restarting a pod with an OAuth2-Proxy, the current Access Token and ID Token will be queried (using the refresh token) and stored in a Redis memory.

            The name of a DexAuthenticator must be a DNS-1035 label of at most 63 characters: it starts with a lowercase letter and contains only lowercase letters, digits and hyphens. The name is a part of the name of its Service and a label value of the objects it creates.
          x-doc-examples:
            - apiVersion: deckhouse.io/v1
              kind: DexAuthenticator
              metadata:
                name: app-name
                namespace: app-namespace
              spec:
                applicationDomain: "app-name.kube.my-domain.com"
                sendAuthorizationHeader: false
                applicationIngressCertificateSecretName: "ingress-tls"
                applicationIngressClassName: "nginx"
                keepUsersLoggedInFor: "720h"
                allowedGroups:
                  - everyone
                  - admins
                allowedProviders:
                  - local
                  - corp-ldap
                whitelistSourceRanges:
                  - 1.1.1.1/32
                  - 192.168.0.0/24
                additionalApplications:
                  - domain: "additional-app-name.kube.my-domain.com"
                    ingressSecretName: "ingress-tls"
                    ingressClassName: "nginx"
                    signOutURL: "/logout"
                    whitelistSourceRanges:
                      - 2.2.2.2/32
            - apiVersion: deckhouse.io/v1
              kind: DexAuthenticator
              metadata:
                name: app-alb
                namespace: app-namespace
              spec:
                applicationDomain: app.example.com
                gatewayAPI:
                  applicationHTTPRouteListenerSetName: app-listeners
          properties:
            metadata:
              type: object
              properties:
                name:
                  type: string
                  # The name is a part of the name of the Service of the authenticator and a label value of its
                  # objects. The rules sit on the field, so an object created before them can still be updated.
                  maxLength: 63
                  x-kubernetes-validations:
                    - rule: "self.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')"
                      message: 'The DexAuthenticator name must start with a letter and contain only lowercase letters, digits and hyphens, because it is a part of the Service name.'
            status:
              type: object
              description: |-
                The state of the object. The module writes it.
              properties:
                conditions:
                  type: array
                  description: |-
                    Conditions of the object.

                    The `Served` condition shows whether the dex-authenticator of the module serves the object on every domain it names. When it does not, `reason` tells why:
                    * `WaitingForInstance` — the dex-authenticator has not loaded the settings of the object yet. This takes up to a few minutes after the object is created or changed;
                    * `HostConflict` — a domain of the object belongs to another DexAuthenticator: the one that is served on it already, or the oldest of those that name it. The object is served on its other domains;
                    * `InvalidRecord` — the object cannot be served as it is: `message` names the field;
                    * `ClientNotCreated` — the Dex client of the object could not be written;
                    * `ForeignObject` — a Service, an Ingress or an HTTPRoute with the name the module gives its own already exists in the namespace and was not created by the module;
                    * `TableFull` — the dex-authenticator serves as many objects as it can.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        description: Type of the condition, such as `Served`.
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: Status of the condition, `True`, `False` or `Unknown`.
                      reason:
                        type: string
                        description: Reason for the status, such as `HostConflict`.
                      message:
                        type: string
                        description: Details of the status.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: Time the status last changed.
                      observedGeneration:
                        type: integer
                        format: int64
                        description: Generation of the object that the condition was set for.
            spec:
              type: object
              required:
                - applicationDomain
              x-kubernetes-validations:
                - rule: "has(self.applicationIngressClassName) || has(self.gatewayAPI)"
                  message: "Specify applicationIngressClassName or gatewayAPI to publish the application."
              properties:
                applicationDomain:
                  type: string
                  description: |-
                    An address for the application (DNS domain for Ingress resource) from which the user request will be redirected for authentication in Dex.

                    > **Warning.** Specify a DNS name that complies with RFC 1123 (subdomain) and does not include an HTTP scheme. IP addresses are not allowed.
                  x-doc-examples: ['my-app.domain.com']
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                sendAuthorizationHeader:
                  type: boolean
                  description: |-
                    Request to application will be sent with `Authorization: Bearer` header when the option is switched to true.

                    When enabled, the header carries a signed Dex ID token (`id_token`) containing the user's email, name, and group membership. This is the only way to pass the user's groups to the application via DexAuthenticator: a separate `X-Auth-Request-Groups` header with groups is not sent.

                    > **Warning.** Enable it only if the application can process this header.
                    >
                    > When setting `sendAuthorizationHeader: true`, list all necessary headers in the application's Ingress resource (if the application is published through an Ingress) or in the HTTPRoute resource (if the application is published through an ALBInstance or ClusterALBInstance of the [`alb`](/modules/alb/) module).
                    >
                    > Also, if the application is published through an Ingress resource, when setting `sendAuthorizationHeader: true`, increase the header buffer size, since a JWT with many groups may not fit into the default buffer.
                    >
                    > For details on specifying the headers and increasing the buffer, see [How to pass the user's login and groups to an application](faq.html#how-to-pass-the-users-login-and-groups-to-an-application).
                applicationIngressCertificateSecretName:
                  type: string
                  description: |-
                    The name of the Secret containing the TLS certificate for the application domain (is used in the Ingress resource). The Secret must be located in the same namespace as the DexAuthenticator.
                  x-doc-examples: ['ingress-tls']
                  pattern: '^(|[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)$'
                applicationIngressClassName:
                  type: string
                  description: |
                    The name of the Ingress class to be used in the Ingress resource (it must match the Ingress class name for the application domain).

                    Required unless `gatewayAPI` is specified. If omitted, no Ingress resources are created for this application. Both fields may be specified.
                  x-doc-examples: ['nginx']
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                gatewayAPI:
                  type: object
                  required:
                  - applicationHTTPRouteListenerSetName
                  description: |-
                    A set of parameters to use in HTTPRoute object.
                    
                    > **Warning.** Only applicable in clusters with Gateway API support.
                    
                    > **Warning.** Define the same ListenerSet object which is used to publish the application domain. 
                  properties:
                    applicationHTTPRouteListenerSetName:
                      type: string
                      description: |
                        Name of the ListenerSet object from the Gateway API to be referred to from the HTTPRoute.
                      x-doc-examples: ['default-listenerset']
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                      maxLength: 253
                    applicationHTTPRouteListenerSetNamespace:
                      type: string
                      description: |
                        Namespace where the ListenerSet object from the Gateway API is deployed to be referred to from the HTTPRoute.

                        If not set, the namespace of the `DexAuthenticator` is used.
                      x-doc-examples: ['default']
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                      maxLength: 63
                    applicationHTTPRouteListenerSetSectionName:
                      type: string
                      description: |
                        Section name from the ListenerSet object in the Gateway API the HTTPRoute refers to.
                      x-doc-examples: ['default-listener']
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                      maxLength: 253
                signOutURL:
                  type: string
                  description: |-
                    The URL of the application from which requests will be redirected to the sign-out URL of the `dex-authenticator`.

                    It is used in the application to direct logout requests. A separate Ingress resource will be created for the specified URL, and requests to it will be redirected to `dex-authenticator`.

                    The value must not contain line breaks.
                  maxLength: 2048
                  pattern: '^[^\r\n]*$'
                keepUsersLoggedInFor:
                  type: string
                  pattern: '^([0-9]{1,5}h)?([0-9]{1,7}m)?([0-9]{1,9}s)?$'
                  description: |-
                    Maximum period of user inactivity during which the user session remains active.

                    Set as a string of whole hours, minutes, and seconds, in this order: `30m`, `20s`, `2h30m10s`, `24h`.

                    Specified value can't be shorter or equal to the [`idTokenTTL`](configuration.html#parameters-idtokenttl) value set in the module settings. If you set a value that is shorter or equal to `idTokenTTL`, the effective logout time will be `idTokenTTL + 1s`.

                    To force logout sooner than the default `idTokenTTL`, decrease the [`idTokenTTL`](configuration.html#parameters-idtokenttl) parameter value in the module settings as well.
                  x-doc-examples: ['24h']
                  x-doc-default: '168h'
                allowedEmails:
                  type: array
                  description: |-
                    A list of emails of users are allowed to connect to the client.

                    Checked on login and on every refresh-token request. Updating the list
                    denies further refresh for sessions whose email is no longer listed.

                    **By default**, all users can connect.

                    Values must not contain line breaks.
                  x-doc-default: 'All emails are allowed.'
                  items:
                    type: string
                    maxLength: 320
                    pattern: '^[^\r\n]*$'
                allowedGroups:
                  type: array
                  description: |-
                    A list of groups whose members are allowed to connect to the client.

                    Checked on login and on every refresh-token request. Updating the list
                    denies further refresh for sessions whose stored groups no longer intersect it.

                    **By default**, all groups can connect.

                    Values must not contain line breaks.
                  x-doc-default: 'All groups are allowed.'
                  items:
                    type: string
                    maxLength: 512
                    pattern: '^[^\r\n]*$'
                allowedProviders:
                  type: array
                  x-kubernetes-list-type: set
                  maxItems: 64
                  description: |-
                    Names of the DexProvider objects through which users can sign in to the application.

                    Use `local` for the users of the built-in password database ([User](cr.html#user)).

                    Checked on the sign-in page, on login, and on every refresh-token and token-exchange request. A provider outside the list is not offered on the sign-in page. If the list holds one provider, users go straight to it. Removing a provider from the list stops the refresh tokens that were issued through it.

                    A name that matches no DexProvider is accepted with a warning. Nobody can sign in through it until the provider appears.

                    **By default**, all providers can be used.
                  x-doc-default: 'All providers are allowed.'
                  items:
                    type: string
                    maxLength: 253
                    pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                whitelistSourceRanges:
                  type: array
                  description: |
                    CIDRs that are allowed to authenticate. Authentication is allowed without IP address restrictions, If not specified.
                  x-doc-examples: [['192.168.42.0/24']]
                  items:
                    type: string
                    pattern: '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/[0-9]{1,2}$'
                podMetadata:
                  type: object
                  description: |-
                    Additional labels and annotations for `dex-authenticator` pods.
                  properties:
                    labels:
                      type: object
                      description: |-
                        Additional labels for `dex-authenticator` pods.
                      additionalProperties:
                        type: string
                    annotations:
                      type: object
                      description: |-
                        Additional annotations for `dex-authenticator` pods.
                      additionalProperties:
                        type: string
                nodeSelector:
                  additionalProperties:
                    type: string
                  x-kubernetes-preserve-unknown-fields: true
                  description: |-
                    If specified, the `dex-authenticator` pods nodeSelector.

                    **Format**: the standard `nodeSelector` list. Instance pods inherit this field as is.
                  type: object
                tolerations:
                  description: |-
                    If specified the `dex-authenticator` pods tolerations.

                    **Format**: the standard [toleration](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/) list. Instance pods inherit this field as is.
                  items:
                    properties:
                      effect:
                        description: |
                          Defines the taint’s effect this toleration is associated with (it matches any effect if empty).
                        type: string
                        enum: ["NoSchedule", "PreferNoSchedule", "NoExecute"]
                      key:
                        description: |-
                          Defines the taint’s key this toleration is associated with (it matches any key if empty).

                          If the key is omitted (empty), then `operator` must be set to `Exists` (which means it matches any `value` and `key`).
                        type: string
                      operator:
                        description: |-
                          Defines how the key and its value are linked — whether the key must be `Equal` to the value or can have any value.

                          Setting it to `Exists` is equivalent to the value having any value so that the pod with the specified toleration can match the corresponding taint.
                        type: string
                        enum: ["Exists", "Equal"]
                        x-doc-default: Equal
                      tolerationSeconds:
                        description: |-
                          Specifies the period (in seconds) that the scheduler waits before evicting a Pod from a node if the toleration no longer matches the taint (**only** applicable to the `NoExecute` effect, otherwise ignored).

                          If the parameter **is not set**, the Pod will not be evicted from the node if the toleration no longer matches the taint. If the parameter **is set to zero** (or negative), the Pod will be evicted immediately if the toleration no longer matches the taint.

                          **The default is**: not set.
                        format: int64
                        type: integer
                      value:
                        description: |-
                          The value that the toleration must match.

                          Must be empty if the `operator` parameter is set to `Exists`.
                        type: string
                    type: object
                  type: array
                highAvailability:
                  type: boolean
                  description: |-
                    Enables high availability mode for `dex-authenticator`.

                    When this mode is enabled, multiple pod replicas will be deployed to ensure fault tolerance.
                  x-doc-default: 'false'
                resources:
                  type: object
                  description: |-
                    Container resources (CPU/memory) — requests/limits.

                    If this field is set, the specified values are applied and VPA is disabled for this instance. If the field is not set, behavior remains the same: when the VPA module is enabled, resources are managed by VPA, when it is disabled, default values are used.

                    Resources can be specified either directly for the `dex-authenticator` container (for backward compatibility) or in nested objects — separately for each container.
                  properties:
                    limits:
                      type: object
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      description: 'Upper limit of resources for the `dex-authenticator` container (CPU/memory). This field is kept for backward compatibility.' 
                    requests:
                      type: object
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      description: 'Guaranteed minimum resources for the `dex-authenticator` container (CPU/memory). This field is kept for backward compatibility.'
                    redis:
                      type: object
                      description: |-
                        Resources of the `redis` container (CPU/memory) — requests/limits.
                      properties:
                        limits:
                          type: object
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: 'Upper limit of resources for the `redis` container (CPU/memory)'
                        requests:
                          type: object
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: 'Guaranteed minimum resources for the `redis` container (CPU/memory).'
                additionalApplications:
                  type: array
                  description: |
                    A list of additional applications for which user authentication is required.
                  items:
                    type: object
                    required:
                      - domain
                    x-kubernetes-validations:
                      - rule: "has(self.ingressClassName) || has(self.gatewayAPI)"
                        message: "Specify ingressClassName or gatewayAPI to publish the application."
                    properties:
                      domain:
                        type: string
                        description: |-
                          An application domain from which the user request will be redirected for authentication in Dex.

                          > **Warning.** Specify a DNS name that complies with RFC 1123 (subdomain) and does not include an HTTP scheme. IP addresses are not allowed.
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                      ingressSecretName:
                        type: string
                        description: 'The name of the Secret containing the TLS certificate (from the domain) used in the applications Ingress resource. The Secret must be in the same namespace as DexAuthenticator.'
                        pattern: '^(|[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)$'
                      ingressClassName:
                        type: string
                        description: |-
                          The name of the Ingress class to be used in the Ingress resource (it must match the Ingress class name for the application domain).

                          Required unless `gatewayAPI` is specified. If omitted, no Ingress resources are created for this application. Both fields may be specified.
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                      gatewayAPI:
                        type: object
                        required:
                        - httpRouteListenerSetName
                        description: |-
                          A set of parameters to use in HTTPRoute object.

                          > **Warning.** Only applicable in clusters with Gateway API support.

                          > **Warning.** Define the same ListenerSet object which is used to publish the application domain.
                        properties:
                          httpRouteListenerSetName:
                            type: string
                            description: |
                              Name of the ListenerSet object from the Gateway API to be referred to from the HTTPRoute.
                            x-doc-examples: ['default-listener-set']
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                            maxLength: 253
                          httpRouteListenerSetNamespace:
                            type: string
                            description: |
                              Namespace where the ListenerSet object from the Gateway API is deployed to be referred to from the HTTPRoute.

                              If not set, the namespace of the `DexAuthenticator` is used.
                            x-doc-examples: ['default']
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                            maxLength: 63
                          httpRouteListenerSetSectionName:
                            type: string
                            description: |
                              Section name from the ListenerSet object in the Gateway API the HTTPRoute refers to.
                            x-doc-examples: ['web-listener']
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                            maxLength: 253
                      signOutURL:
                        type: string
                        description: |-
                          The URL of the application from which requests will be redirected to the sign-out URL of the `dex-authenticator`.

                          It is used in the application to direct logout requests. A separate Ingress resource will be created for the specified URL, and requests to it will be redirected to `dex-authenticator`.

                          The value must not contain line breaks.
                        maxLength: 2048
                        pattern: '^[^\r\n]*$'
                      whitelistSourceRanges:
                        type: array
                        description: |
                          CIDRs that are allowed to authenticate. Authentication is allowed without IP address restrictions, If not specified.
                        x-doc-examples: [['192.168.42.0/24']]
                        items:
                          type: string
                          pattern: '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/[0-9]{1,2}$'
      subresources: &subresources
        status: {}
      additionalPrinterColumns: &additionalPrinterColumns
        - jsonPath: .spec.applicationDomain
          name: Domain
          type: string
        - jsonPath: .status.conditions[?(@.type=="Served")].status
          name: Served
          type: string
    - name: v2alpha1
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            metadata:
              type: object
              properties:
                name:
                  type: string
                  # The name is a part of the name of the Service of the authenticator and a label value of its
                  # objects. The rules sit on the field, so an object created before them can still be updated.
                  maxLength: 63
                  x-kubernetes-validations:
                    - rule: "self.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')"
                      message: 'The DexAuthenticator name must start with a letter and contain only lowercase letters, digits and hyphens, because it is a part of the Service name.'
            status:
              type: object
              description: |-
                The state of the object. The module writes it.
              properties:
                conditions:
                  type: array
                  description: |-
                    Conditions of the object.

                    The `Served` condition shows whether the dex-authenticator of the module serves the object on every domain it names. When it does not, `reason` tells why:
                    * `WaitingForInstance` — the dex-authenticator has not loaded the settings of the object yet. This takes up to a few minutes after the object is created or changed;
                    * `HostConflict` — a domain of the object belongs to another DexAuthenticator: the one that is served on it already, or the oldest of those that name it. The object is served on its other domains;
                    * `InvalidRecord` — the object cannot be served as it is: `message` names the field;
                    * `ClientNotCreated` — the Dex client of the object could not be written;
                    * `ForeignObject` — a Service, an Ingress or an HTTPRoute with the name the module gives its own already exists in the namespace and was not created by the module;
                    * `TableFull` — the dex-authenticator serves as many objects as it can.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        description: Type of the condition, such as `Served`.
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: Status of the condition, `True`, `False` or `Unknown`.
                      reason:
                        type: string
                        description: Reason for the status, such as `HostConflict`.
                      message:
                        type: string
                        description: Details of the status.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: Time the status last changed.
                      observedGeneration:
                        type: integer
                        format: int64
                        description: Generation of the object that the condition was set for.
            spec:
              type: object
              required:
                - applications
              properties:
                applications:
                  type: array
                  description: |
                    A list of applications for which user authentication is required.
                  items:
                    type: object
                    required:
                      - domain
                    x-kubernetes-validations:
                      - rule: "has(self.ingressClassName) || has(self.gatewayAPI)"
                        message: "Specify ingressClassName or gatewayAPI to publish the application."
                    properties:
                      domain:
                        type: string
                        description: |-
                          An application domain (for Ingress resources) from which the user request will be redirected for authentication in Dex.

                          > **Warning.** Specify a DNS name that complies with RFC 1123 (subdomain) and does not include an HTTP scheme. IP addresses are not allowed.
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                      ingressSecretName:
                        type: string
                        description: |-
