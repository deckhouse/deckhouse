apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dexclients.deckhouse.io
  labels:
    heritage: deckhouse
    module: user-authn
spec:
  group: deckhouse.io
  scope: Namespaced
  names:
    plural: dexclients
    singular: dexclient
    kind: DexClient
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: false
      deprecated: true
      schema: &schema
        openAPIV3Schema:
          type: object
          description: |
            Allows applications that support OIDC authentication to interact with Dex.

            After the `DexClient` object appears in the cluster:
            * Dex will register a client with a `dex-client-<NAME>@<NAMESPACE>` **clientID**, where `<NAME>` and `<NAMESPACE>` are `metadata.name` and `metadata.namespace` of the DexClient object, respectively.
            * A `dex-client-<NAME>` Secret containing the client access password (**clientSecret**) will be created in the corresponding namespace (where `<NAME>` is `metadata.name` of the DexClient object).

            [Usage example...](usage.html#configuring-the-oauth2-client-in-dex-for-connecting-an-application)
          required:
            - spec
          properties:
            spec:
              type: object
              properties:
                allowedEmails:
                  type: array
                  description: |-
                    A list of emails of users are allowed to connect to the client.

                    Checked on login and on every refresh-token request. Updating the list
                    denies further refresh for sessions whose email is no longer listed.

                    **By default**, all users can connect.

                    Values must not contain line breaks.
                  x-doc-default: 'All users are allowed.'
                  items:
                    type: string
                    maxLength: 320
                    pattern: '^[^\r\n]*$'
                allowedGroups:
                  type: array
                  description: |
                    A list of groups whose members are allowed to connect to the client.

                    Checked on login and on every refresh-token request. Updating the list
                    denies further refresh for sessions whose stored groups no longer intersect it.

                    **By default**, all groups can connect.

                    Values must not contain line breaks.
                  items:
                    type: string
                    maxLength: 512
                    pattern: '^[^\r\n]*$'
                redirectURIs:
                  type: array
                  description: |
                    Array of URLs that Dex can redirect to after successful authentication.

                    Values must not contain line breaks.
                  items:
                    type: string
                    maxLength: 2048
                    pattern: '^[^\r\n]*$'
                trustedPeers:
                  type: array
                  description: |
                    OAuth2 client IDs that allowed cross authentication with the current client.

                    Values must not contain line breaks.

                    [Details...](https://developers.google.com/identity/protocols/CrossClientAuth)
                  items:
                    type: string
                    maxLength: 256
                    pattern: '^[^\r\n]*$'
                postLogoutRedirectURIs:
                  type: array
                  description: |
                    Addresses Dex may send the browser back to after the user signs out of Dex through the application
                    (`post_logout_redirect_uri` of OpenID Connect RP-Initiated Logout).

                    Works only with the [browser sessions of Dex](configuration.html#parameters-sessions) enabled.

                    Values must not contain line breaks.
                  items:
                    type: string
                    maxLength: 2048
                    pattern: '^[^\r\n]*$'
                backchannelLogoutURI:
                  type: string
                  maxLength: 2048
                  pattern: '^https://[^\r\n]*$'
                  x-kubernetes-validations:
                    # The host is matched on the address itself: CEL bounds the cost of a regular expression by the length of
                    # the string, and the length of url(self).getHost() is not known. The host must have a dot and not end
                    # with one: a single label or a trailing dot is resolved through the search domains of the pod of Dex.
                    - rule: |
                        isURL(self) && !self.matches("^https://[^/?#]*@") && self.matches("^https://[^/?#:]*\\.[^/?#:]*[^./?#:](:[0-9]+)?([/?#]|$)") && !self.matches("(?i)^https://(\\[[^]]*\\]|[0-9.]+|localhost|[^/?#:]*\\.localhost|[^/?#:]*\\.svc|[^/?#:]*\\.svc\\.[^/?#:]*|[^/?#:]*\\.cluster\\.local)(:[0-9]+)?([/?#]|$)")
                      message: "spec.backchannelLogoutURI must be an https address of an external host: a name with a dot, not an IP address, localhost or a name under .svc or .cluster.local, and without user information"
                  description: |
                    Address Dex notifies when a browser session through which the user signed in to the application ends
                    (OpenID Connect Back-Channel Logout): the user signs out of the session, or the provider of the user
                    answers that the user no longer exists or is no longer allowed in. An end of the session by a
                    UserOperation or through the self-service of the web interface sends no notification.

                    Works only with the [browser sessions of Dex](configuration.html#parameters-sessions) enabled. Dex sends the
                    notification once, without retries: the application cannot rely on it to end its own session.

                    Must be an HTTPS address whose host is a name with a dot: Dex sends the notification from inside the
                    cluster, so an IP address, `localhost`, a name without a dot or ending with one, and a name under `.svc` or
                    `.cluster.local` are not accepted. A short name such as `<SERVICE>.<NAMESPACE>` cannot be told from an
                    external name: use the full external name of the application.
                refreshTokenLifetime:
                  type: string
                  enum: ["Standalone", "Session"]
                  description: |
                    How long the refresh tokens of the application live, with the [browser sessions of Dex](configuration.html#parameters-sessions) enabled.

                    - `Standalone`: The tokens live until they expire, whatever happens to the session of the browser.
                      An application that requests offline access then gets a refresh token only after an interactive sign-in.
                    - `Session`: The tokens end when the user signs out of the session of Dex they were issued through.
                      Such an application can sign the user in from the session of the browser.

                    Without the parameter, the tokens are `Standalone`.
                secretMetadata:
                  type: object
                  description: 'Labels and annotations to add to the `dex-client-<NAME>` Secret.'
                  properties:
                    labels:
                      type: object
                      description: 'Labels of the Secret.'
                      additionalProperties:
                        type: string
                        maxLength: 63
                        pattern: '^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$'
                      maxProperties: 100
                      x-kubernetes-validations:
                        - rule: "self.all(key, key.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*(/[a-z0-9]([-a-z0-9]*[a-z0-9])?)?$'))"
                          message: "Label key must match the pattern '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*(/[a-z0-9]([-a-z0-9]*[a-z0-9])?)?$'"
                    annotations:
                      type: object
                      description: 'Annotations of the Secret.'
                      additionalProperties:
                        type: string
    - name: v1
      served: true
      storage: true
      schema: *schema
