apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: useroperations.deckhouse.io
  labels:
    heritage: deckhouse
    module: user-authn
spec:
  group: deckhouse.io
  scope: Cluster
  names:
    plural: useroperations
    singular: useroperation
    kind: UserOperation
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: false
      deprecated: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            Describes an operation to be applied to a user (password reset, 2FA reset, lock/unlock).

            For local users, the `ResetPassword` and `Lock` operations also delete the user's Dex
            RefreshToken objects. The sessions of the user in applications and kubeconfig files end when
            the current ID token expires, and the user has to authenticate again. These operations keep
            the user's 2FA secret. Only `Reset2FA` removes it, and it also deletes the user's Dex
            OfflineSessions and RefreshToken objects.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - user
                - type
              properties:
                user:
                  type: string
                  description: "Name (username) of the target User resource."
                  x-doc-examples: ['jane.doe']
                type:
                  type: string
                  enum:
                    - "ResetPassword"
                    - "Reset2FA"
                    - "Lock"
                    - "Unlock"
                  description: |
                    Type of the user operation. Possible values:
                    
                    * `ResetPassword`: Password reset.
                    * `Reset2FA`: Two-factor authentication reset.
                    * `Lock`: User lock.
                    * `Unlock`: User unlock.
                initiatorType:
                  type: string
                  description: |
                    Indicates who initiated the operation. Possible values:
 
                    * `admin`: By an administrator.
                    * `system`: Reserved. No component sets this value.
                    * `self`: By the user.
                resetPassword:
                  type: object
                  description: "Parameters for password reset."
                  properties:
                    newPasswordHash:
                      type: string
                      description: "Bcrypt hash of the new password."
                lock:
                  type: object
                  description: "Parameters for locking the user."
                  required:
                    - for
                  properties:
                    for:
                      type: string
                      description: |
                        Lock duration as a Go-style duration string (`30s`, `10m`, `1h`, `2h30m`, `7d`),
                        or `permanent` for an indefinite lock released only by `Unlock`.
                        `1d` equals `24h`.
                      pattern: '^(permanent|([0-9]+(\.[0-9]+)?(s|m|h|d))+)$'
                      x-kubernetes-validations:
                        # Self-sufficient: re-asserts shape (so garbage like "permanent7d" or
                        # "abc1d" cannot slip through if `pattern` ever regresses) and then
                        # requires at least one non-zero digit, which — combined with the
                        # all-segments-are-non-negative shape — guarantees a positive total
                        # ("30m" passes, "0s" / "0d0h" do not). We avoid CEL's `duration()`
                        # because it does not accept the "d" unit we surface here.
                        - rule: 'self == "permanent" || (self.matches("^([0-9]+(\\.[0-9]+)?(s|m|h|d))+$") && self.matches("[1-9]"))'
                          message: 'lock.for must be "permanent" or a positive Go-style duration using s/m/h/d (e.g. "30m", "1h", "2h30m", "7d").'
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: |
                    Current phase of the operation. Possible values:
 
                    * `Succeeded`: Operation completed successfully.
                    * `Failed`: Operation failed.
                  enum:
                    - "Succeeded"
                    - "Failed"
                message:
                  type: string
                  description: "Optional message about the result or failure of the operation."
                completedAt:
                  type: string
                  description: "Time when the operation was completed."
      subresources: &subresources
        status: {}
      additionalPrinterColumns: &additionalPrinterColumns
        - name: User
          type: string
          jsonPath: .spec.user
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: CompletedAt
          type: string
          jsonPath: .status.completedAt
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            Describes a single-use operation to be applied to a user (password reset, 2FA reset, lock/unlock).

            A UserOperation runs once, and changes to its spec after creation are ignored.
            The module processes the operation and writes the result to `status.phase`
            (`Succeeded` or `Failed`). Completed operations are automatically deleted after 24 hours.
            To perform a new action, create a new UserOperation.

            For local users, the `ResetPassword` and `Lock` operations also delete the user's Dex
            RefreshToken objects. The sessions of the user in applications and kubeconfig files end when
            the current ID token expires, and the user has to authenticate again. These operations keep
            the user's 2FA secret. Only `Reset2FA` removes it, and it also deletes the user's Dex
            OfflineSessions and RefreshToken objects.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - type
              oneOf:
                - required: [user]
                - required: [target]
              x-kubernetes-validations:
                # target identifies an account of an external provider and is
                # only meaningful for Lock/Unlock against its Dex UserIdentity.
                # ResetPassword and Reset2FA operate on a local user (spec.user).
                - rule: 'self.type in ["Lock", "Unlock"] || !has(self.target)'
                  message: 'spec.target is only supported for Lock and Unlock operations; ResetPassword and Reset2FA apply to local users (spec.user) only.'
              properties:
                user:
                  type: string
                  description: |
                    Name (username) of the target local User resource.

                    Used for operations on users that are managed
                    by DP via the User CRD (the built-in local connector).
                    
                    > Only one of the fields can be specified at the same time: `user` or `target`.
                  x-doc-examples: ['jane.doe']
                target:
                  type: object
                  description: |
                    Identifier of an account of an external authentication provider of any type.

                    The `Lock` and `Unlock` operations against `target` change the Dex UserIdentity object of
                    the user who signs in through the `connectorID` provider with this `email`. The lock applies
                    only to this provider and does not lock a local user or a user of another provider with the
                    same email. The operation fails if the user has never signed in through the provider or if
                    more than one user of the provider has this email.

                    The lock applies to the user ID that the provider returns at sign-in. A SAML provider must
                    return the same ID at every sign-in, with
                    [`nameIDPolicyFormat`](#dexprovider-v1-spec-saml-nameidpolicyformat) set to `persistent` or
                    `emailAddress` or not set. With `transient`, every sign-in gets a new ID, and the lock does
                    not apply to the next sign-in.
                    
                    > Only one of the fields can be specified at the same time: `user` or `target`.
                  required:
                    - connectorID
                    - email
                  properties:
                    connectorID:
                      type: string
                      description: |
                        ID of the DexProvider (connector) through which the user logs in.
                      x-doc-examples: ['my-ldap', 'my-crowd']
                    email:
                      type: string
                      description: |
                        Email of the external user, as reported by the provider at the user's last sign-in.

                        The comparison is case-insensitive.
                      x-doc-examples: ['jane.doe@example.org']
                type:
                  type: string
                  enum:
                    - "ResetPassword"
                    - "Reset2FA"
                    - "Lock"
                    - "Unlock"
                  description: |
                    Type of the user operation. Possible values:
                    
                    * `ResetPassword`: Password reset. Applies to local users (`spec.user`) only.
                    * `Reset2FA`: Two-factor authentication reset. Applies to local users (`spec.user`) only.
                    * `Lock`: User lock. Supports both local users (`spec.user`) and external users (`spec.target`).
                    * `Unlock`: User unlock. Supports both local users (`spec.user`) and external users (`spec.target`).
                initiatorType:
                  type: string
                  description: |
                    Indicates who initiated the operation. Possible values:
    
                    * `admin`: By an administrator (e.g. via `d8 iam user` CLI or a manual UserOperation).
                    * `system`: Reserved. No component sets this value (Dex locks a user after failed sign-in attempts without creating a UserOperation).
                    * `self`: By the user (self-service password reset in the DP authentication interface).
                resetPassword:
                  type: object
                  description: "Parameters for password reset."
                  properties:
                    newPasswordHash:
                      type: string
                      description: |
                        Bcrypt hash of the new password, without Base64 encoding.
                lock:
                  type: object
                  description: "Parameters for locking the user."
                  required:
                    - for
                  properties:
                    for:
                      type: string
                      description: |
                        Lock duration as a Go-style duration string (`30s`, `10m`, `1h`, `2h30m`, `7d`),
                        or `permanent` for an indefinite lock released only by `Unlock`.
                        `1d` equals `24h`.
                      pattern: '^(permanent|([0-9]+(\.[0-9]+)?(s|m|h|d))+)$'
                      x-kubernetes-validations:
                        # Self-sufficient: re-asserts shape (so garbage like "permanent7d" or
                        # "abc1d" cannot slip through if `pattern` ever regresses) and then
                        # requires at least one non-zero digit, which — combined with the
                        # all-segments-are-non-negative shape — guarantees a positive total
                        # ("30m" passes, "0s" / "0d0h" do not). We avoid CEL's `duration()`
                        # because it does not accept the "d" unit we surface here.
                        - rule: 'self == "permanent" || (self.matches("^([0-9]+(\\.[0-9]+)?(s|m|h|d))+$") && self.matches("[1-9]"))'
                          message: 'lock.for must be "permanent" or a positive Go-style duration using s/m/h/d (e.g. "30m", "1h", "2h30m", "7d").'
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: |
                    Current phase of the operation. Possible values:
 
                    * `Succeeded`: Operation was completed successfully.
                    * `Failed`: Operation failed.
                  enum:
                    - "Succeeded"
                    - "Failed"
                message:
                  type: string
                  description: "Optional message about the result or failure of the operation."
                completedAt:
                  type: string
                  description: |
                    Time when the operation was completed, in RFC 3339 format (e.g. `2025-01-15T10:30:00Z`).
                    Empty until the operation finishes processing.
      subresources: *subresources
      additionalPrinterColumns: *additionalPrinterColumns


