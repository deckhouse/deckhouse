spec:
  versions:
    - name: v1alpha1
      served: true
      storage: false
      deprecated: true
      schema:
        openAPIV3Schema:
          description: |
            Содержит информацию об операции над пользователем (сброс пароля, сброс 2FA, блокировка/разблокировка).

            Операции `Lock`, `ResetPassword` и `Reset2FA` сразу завершают сессии пользователя, как в `v1`.
            Секрет 2FA пользователя эти операции сохраняют. Удаляет его только `Reset2FA`, и эта операция
            также удаляет объект Dex OfflineSessions пользователя.
          properties:
            spec:
              properties:
                user:
                  description: |
                    Имя пользователя (ссылка на ресурс User).
                type:
                  description: |
                    Тип операции над пользователем. Возможные значения:

                    * `ResetPassword` — сброс пароля;
                    * `Reset2FA` — сброс двухфакторной аутентификации;
                    * `Lock` — блокировка пользователя;
                    * `Unlock` — разблокировка пользователя.
                initiatorType:
                  description: |
                    Указывает, кем инициирована операция. Возможные значения:

                    * `admin` — администратором;
                    * `system` — зарезервировано, ни один компонент это значение не устанавливает;
                    * `self` — самим пользователем.
                resetPassword:
                  description: |
                    Параметры операции по сбросу пароля.
                  properties:
                    newPasswordHash:
                      description: |
                        Новый пароль в виде bcrypt-хеша.  
                        Хеш должен быть получен заранее и передан в поле CR.
                lock:
                  description: |
                    Параметры операции по блокировке пользователя.
                  properties:
                    for:
                      description: |
                        Длительность блокировки в формате Go (`30s`, `10m`, `1h`, `2h30m`, `7d`)
                        либо `permanent` — бессрочная блокировка, снимается только `Unlock`.
                        `1d` равно `24h`.
            status:
              properties:
                phase:
                  description: |
                    Текущий статус выполнения операции. Возможные значения:

                    * `Succeeded` — операция успешно выполнена;
                    * `Failed` — операция завершилась ошибкой.
                message:
                  description: |
                    Дополнительное сообщение о результате выполнения операции или причине ошибки.
                completedAt:
                  description: |
                    Время завершения операции.
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: |
            Содержит информацию об одноразовой операции над пользователем (сброс пароля, сброс 2FA, блокировка/разблокировка, выход).

            UserOperation выполняется один раз, и изменения его спецификации после создания игнорируются.
            Модуль обрабатывает операцию и записывает результат в `status.phase`
            (`Succeeded` или `Failed`). Завершённые операции автоматически удаляются через 24 часа.
            Для нового действия нужно создать новый UserOperation.

            Операции `Lock`, `ResetPassword`, `Reset2FA` и `Logout` сразу завершают сессии пользователя. Модуль
            повышает поколение учётной записи пользователя в Dex (пары провайдера и идентификатора пользователя),
            записывает отзыв в объект Dex Revocation и удаляет принадлежащие пользователю объекты Dex AuthSession
            (сессии браузера) и RefreshToken. Dex отклоняет всё, что выдал этой учётной записи раньше, а
            dex-authenticator перестаёт принимать сессии пользователя в течение нескольких секунд. Секрет 2FA
            пользователя эти операции сохраняют. Удаляет его только `Reset2FA`, и эта операция также удаляет
            принадлежащий пользователю объект Dex OfflineSessions. `Unlock` и `RequirePasswordChange` сессии не
            завершают. Что отозвала операция, записывается в `status.revocation`.
          properties:
            spec:
              properties:
                user:
                  description: |
                    Имя локального пользователя (ссылка на ресурс User).

                    Используется для операций над пользователями,
                    которыми DP управляет через CRD User (встроенный локальный коннектор).

                    > Одновременно можно указать только одно из полей: `user` или `target`.
                target:
                  description: |
                    Идентификатор учётной записи внешнего провайдера аутентификации по email.

                    Операции `Lock`, `Unlock` и `Logout` для `target` применяются к учётной записи Dex (объекту
                    UserIdentity) пользователя, у которого при последнем входе был этот `email`. Поля `connectorID`
                    и `userID` сужают поиск до одного провайдера и одного идентификатора пользователя. Операция
                    завершается с ошибкой, если ни у одной учётной записи нет этого email (пользователь ни разу не
                    входил) или если подходят несколько учётных записей; тогда нужно указать `connectorID`, а если
                    у провайдера несколько пользователей с этим email, то и `userID`. Операция применяется только к
                    найденной учётной записи: блокировка не блокирует локального пользователя или пользователя
                    другого провайдера с тем же email. Локальный пользователь указывается только в `spec.user`.

                    Блокировка действует на идентификатор пользователя, который провайдер возвращает при входе.
                    SAML-провайдер должен возвращать один и тот же идентификатор при каждом входе, для этого
                    параметр [`nameIDPolicyFormat`](#dexprovider-v1-spec-saml-nameidpolicyformat) должен иметь
                    значение `persistent` или `emailAddress` либо не должен быть задан. При значении `transient`
                    каждый вход получает новый идентификатор, и блокировка не действует при следующем входе.
                    
                    > Одновременно можно указать только одно из полей: `user` или `target`.
                  properties:
                    connectorID:
                      description: |
                        Идентификатор DexProvider (коннектора), через который входит пользователь.
                    email:
                      description: |
                        Email пользователя, который провайдер сообщил при последнем входе пользователя.

                        Регистр букв при сравнении не учитывается.
                    userID:
                      description: |
                        Идентификатор пользователя, который провайдер возвращает при входе (`userID` объекта Dex
                        UserIdentity). Позволяет различить учётные записи провайдера с одинаковым email.
                type:
                  description: |
                    Тип операции над пользователем. Возможные значения:

                    * `ResetPassword` — сброс пароля. Применимо только к локальным пользователям (`spec.user`);
                    * `Reset2FA` — сброс двухфакторной аутентификации. Применимо только к локальным пользователям (`spec.user`);
                    * `Lock` — блокировка пользователя. Поддерживает как локальных (`spec.user`), так и внешних (`spec.target`) пользователей;
                    * `Unlock` — разблокировка пользователя. Поддерживает как локальных (`spec.user`), так и внешних (`spec.target`) пользователей;
                    * `Logout` — завершение сессий пользователя. Без [`logout`](#useroperation-v1-spec-logout) завершает
                      все сессии во всех приложениях и отзывает refresh-токены файлов kubeconfig. Поддерживает как
                      локальных (`spec.user`), так и внешних (`spec.target`) пользователей;
                    * `RequirePasswordChange` — пользователь должен задать новый пароль при следующем входе. Сессии не
                      завершает. Применимо только к локальным пользователям (`spec.user`).
                initiatorType:
                  description: |
                    Указывает, кем инициирована операция. Возможные значения:

                    * `admin` — администратором (например, через CLI `d8 iam user` или ручное создание UserOperation);
                    * `system` — зарезервировано, ни один компонент это значение не устанавливает (Dex блокирует пользователя после неудачных попыток входа без создания UserOperation);
                    * `self` — самим пользователем (выход на всех устройствах или смена пароля в веб-интерфейсе Deckhouse).
                resetPassword:
                  description: |
                    Параметры операции по сбросу пароля.
                  properties:
                    newPasswordHash:
                      description: |
                        Bcrypt-хеш нового пароля без кодирования в Base64.
                lock:
                  description: |
                    Параметры операции по блокировке пользователя.
                  properties:
                    for:
                      description: |
                        Длительность блокировки в формате Go (`30s`, `10m`, `1h`, `2h30m`, `7d`)
                        либо `permanent` — бессрочная блокировка, снимается только `Unlock`.
                        `1d` равно `24h`.
                logout:
                  description: |
                    Уточняет операцию `Logout`. Без этого поля `Logout` завершает все сессии пользователя.

                    Можно указать не больше одного поля. Поля `session` и `exceptSession` относятся к сессиям браузера
                    в Dex; если их нет, операция завершается с ошибкой.
                  properties:
                    session:
                      description: |
                        Идентификатор сессии браузера, которую нужно завершить (claim `sid` токенов, выданных в ней),
                        вместе с refresh-токенами, выданными в этой сессии. Операция завершается с ошибкой, если у
                        пользователя нет такой сессии.
                    exceptSession:
                      description: |
                        Идентификатор сессии браузера, которую нужно сохранить. Все остальные сессии браузера
                        пользователя завершаются, и все refresh-токены, выданные не в этой сессии, отзываются. Токен,
                        выданный во время выполнения операции, может сохраниться. Операция завершается с ошибкой, если
                        у пользователя нет такой сессии.
            status:
              properties:
                phase:
                  description: |
                    Текущий статус выполнения операции. Возможные значения:

                    * `Succeeded` — операция успешно выполнена;
                    * `Failed` — операция завершилась ошибкой.
                message:
                  description: |
                    Дополнительное сообщение о результате выполнения операции или причине ошибки.
                completedAt:
                  description: |
                    Время завершения операции в формате RFC 3339 (например, `2025-01-15T10:30:00Z`).
                    Пусто, пока операция не завершена.
                revocation:
                  description: |
                    Что отозвала операция. Заполняют операции `Lock`, `ResetPassword`, `Reset2FA` и `Logout`.
                  properties:
                    name:
                      description: |
                        Имя объекта Dex Revocation, который записала операция, или первого из них.
                    generation:
                      description: |
                        Новое поколение учётной записи пользователя в Dex. Всё, что выдано учётной записи с меньшим
                        поколением, отозвано. Не заполняется, если операция отозвала не всю учётную запись.
                    refreshTokensDeleted:
                      description: |
                        Число удалённых операцией объектов Dex RefreshToken пользователя.
                    authSessionsDeleted:
                      description: |
                        Число удалённых операцией объектов Dex AuthSession (сессий браузера) пользователя.


