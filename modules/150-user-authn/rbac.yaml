# The RBAC of the module, declared for the dmt rbac linter. `dmt lint --linter rbac --fix` writes the
# capabilities (templates/rbacv2/), the legacy roles (templates/user-authz-cluster-roles.yaml), the
# accounts (templates/<component>/rbac-for-us.yaml), the admin-kubeconfig access
# (templates/rbac-for-us.yaml), the access of other subjects (templates/<component>/rbac-to-us.yaml) and
# the Prometheus access of Dex (templates/dex/rbac-to-us.yaml) from this file, so a change to the rights
# of the module starts here.
#
# Lint also with --values-file template_tests/testdata/rbac-values-ldap-basic-auth.yaml: only a render
# with basic authentication for an LDAP provider has the Revocation access of basic-auth-proxy (the
# "revocations" access below). CI lints with the default values, so it does not check that entry.
#
# Not described here, hand-written as they are:
# - the account dexclient-controller (templates/dexclient-controller/rbac-for-us.yaml): several of its
#   rules depend on the API versions of the cluster (ValidatingAdmissionPolicy, Gateway API HTTPRoute and
#   ReferenceGrant), and rbac.yaml has no condition on a single rule;
# - the accounts dex-authenticator and dex-authenticator-system
#   (templates/shared-dex-authenticator/rbac-for-us.yaml): rendered inside {{ range }}.
#
# The account user-api mounts its token (automountServiceAccountToken: true) until its pods mount it
# themselves.
apiVersion: rbac.deckhouse.io/v1alpha1
resources:
  - group: deckhouse.io
    resource: dexauthenticators
    namespace:
      manager:
        - create
        - delete
        - deletecollection
        - patch
        - update
      viewer:
        - get
        - list
        - watch
    legacy:
      Editor:
        - create
        - delete
        - deletecollection
        - patch
        - update
      User:
        - get
        - list
        - watch
  - group: deckhouse.io
    resource: dexauthenticators/allow-access-to-kubernetes
    reason: 'the subresource carries the authority to let an OAuth2 client reach the Kubernetes API, delegated cluster-wide; the admission policy of the allow-access-to-kubernetes annotation checks it, and no controller serves it'
    system:
      manager:
        - create
    legacy:
      ClusterAdmin:
        - create
  - group: deckhouse.io
    resource: dexclients
    namespace:
      manager:
        - create
        - delete
        - deletecollection
        - patch
        - update
      viewer:
        - get
        - list
        - watch
    legacy:
      Editor:
        - create
