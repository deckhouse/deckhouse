  # The CA in the ConfigMap user-api-ca is public: every service account may read it, so that the
  # clients of user-api inside the cluster verify its certificate. Before this declaration the Role
  # and the RoleBinding were user-api-ca-reader in templates/user-api/rbac-for-us.yaml; the placement
  # rule keeps the access of other subjects in rbac-to-us.yaml under an access-to- name.
  - name: ca-reader
    path: user-api
    subjects:
      - kind: Group
        name: system:serviceaccounts
    labels:
      app: user-api
    namespaceRules:
      - apiGroups:
          - ""
        resources:
          - configmaps
        resourceNames:
          - user-api-ca
        verbs:
          - get
  # The proxy evicts the cached checks of an LDAP user whose credentials are revoked, as soon as the
  # Revocation object appears. Crowd and OIDC check passwords past Dex, and a revocation does not apply
  # to them, hence the condition. It is an access entry, not namespaceRules of the account, because the
  # account renders whenever the module does and the Role only for LDAP, and an account has one
  # condition for all its objects. Before this declaration the Role and the RoleBinding were
  # basic-auth-proxy in templates/basic-auth-proxy/rbac-for-us.yaml.
  - name: revocations
    path: basic-auth-proxy
    when: include "is_basic_auth_ldap_enabled" .
    subjects:
      - kind: ServiceAccount
        name: basic-auth-proxy
        namespace: d8-user-authn
    labels:
      app: basic-auth-proxy
    namespaceRules:
      - apiGroups:
          - dex.coreos.com
        resources:
          - revocations
        verbs:
          - get
          - list
          - watch
