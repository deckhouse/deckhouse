---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: User
  name: d8:user-authz:user-authn:user
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - dexclients
  - dexauthenticators
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: Editor
  name: d8:user-authz:user-authn:editor
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - dexclients
  - dexauthenticators
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    user-authz.deckhouse.io/access-level: ClusterAdmin
  name: d8:user-authz:user-authn:cluster-admin
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - users
  - groups
  - dexproviderchecks
  - dexproviders
  - useroperations
  verbs:
  - get
  - list
  - watch
  - create
  - delete
  - deletecollection
  - patch
  - update
# Read-only audit access to internal Dex storage CRDs. Deliberately without `get`:
# `passwords` contain bcrypt-hashed credentials, `offlinesessionses` carry refresh tokens —
# a named read would return the same secret material, so ClusterAdmin stays at the
# collection level (enough to enumerate sessions for incident response).
# `watch` is the same collection read delivered as a stream, so it discloses nothing `list`
# does not; without it every client — kubectl -w, any informer — has to poll instead.
# NOTE: plural is `offlinesessionses` (matches Dex CRD name in crds/external/offlinesessionses.yaml).
- apiGroups:
  - dex.coreos.com
  resources:
  - passwords
  - offlinesessionses
  verbs:
  - list
  - watch
