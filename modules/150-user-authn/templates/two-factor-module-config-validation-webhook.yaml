---
apiVersion: deckhouse.io/v1alpha1
kind: ValidationWebhook
metadata:
  name: user-authn-two-factor-module-config
  {{- include "helm_lib_module_labels" (list . (dict "app" "webhook-handler")) | nindent 2 }}
validationObject:
  name: twofactor-basic-auth-settings.deckhouse.io
  group: main
  rules:
  - apiGroups:   ["deckhouse.io"]
    apiVersions: ["*"]
    operations:  ["CREATE", "UPDATE"]
    resources:   ["moduleconfigs"]
    scope:       "Cluster"
context:
  # The DexProviders, read through v1 whatever version their authors used. The webhooks/validating/two_factor_module_config_test.py
  # keeps a copy of the jqFilter.
  - name: dexproviders
    kubernetes:
      apiVersion: deckhouse.io/v1
      kind: DexProvider
      queue: "dexproviders-list"
      jqFilter: |
        {
          "name": .metadata.name,
          "type": .spec.type,
          "enabled": (.spec.enabled != false),
          "basicAuth": ((if .spec.type == "LDAP" then .spec.ldap.enableBasicAuth elif .spec.type == "Crowd" then .spec.crowd.enableBasicAuth else false end) == true)
        }
handler:
  # The code of the hook is webhooks/validating/two_factor_module_config.py, where its unit tests import it.
  python: |
    {{- (required "webhooks/validating/two_factor_module_config.py is missing" (.Files.Get "webhooks/validating/two_factor_module_config.py")) | nindent 4 }}
