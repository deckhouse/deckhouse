apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: user-authn
    rbac.deckhouse.io/aggregate-to-security-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-user-authn
  name: d8:manage:permission:module:user-authn:edit
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - dexproviders
  - groups
  - users
  verbs:
  - create
  - update
  - patch
  - delete
  - deletecollection
# UserAccounts are created by the controller; this role is get/list/watch.
- apiGroups:
  - deckhouse.io
  resources:
  - useraccounts
  verbs:
  - get
  - list
  - watch
# DexProviderChecks and UserOperations are created on demand and not updated in place.
- apiGroups:
  - deckhouse.io
  resources:
  - dexproviderchecks
  - useroperations
  verbs:
  - create
- apiGroups:
  - deckhouse.io
  resources:
  - dexproviderchecks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - deckhouse.io
  resourceNames:
  - user-authn
  resources:
  - moduleconfigs
  verbs:
  - create
  - update
  - patch
  - delete
# No controller serves these subresources. They exist so that the authority to let an OAuth2 client
# reach the Kubernetes API can be delegated on its own, and the admission policy that gates the
# allow-access-to-kubernetes annotation checks exactly this permission.
- apiGroups:
  - deckhouse.io
  resources:
  - dexauthenticators/allow-access-to-kubernetes
  - dexclients/allow-access-to-kubernetes
  verbs:
  - create
