apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: user-authn
    rbac.deckhouse.io/aggregate-to-security-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.user-authn.edit"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-user-authn
  name: d8:system-capability:user-authn:edit
  annotations:
    en.meta.deckhouse.io/title: "Module user-authn: edit configuration"
    ru.meta.deckhouse.io/title: "Модуль user-authn: управление конфигурацией"
    en.meta.deckhouse.io/description: "Manage the user-authn module configuration."
    ru.meta.deckhouse.io/description: "Управление конфигурацией модуля user-authn."
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - dexproviders
  - groups
  - users
  verbs:
  - create
  - update
  - patch
  - delete
  - deletecollection
# UserAccounts are created by the controller; this role is get/list/watch.
- apiGroups:
  - deckhouse.io
  resources:
  - useraccounts
  verbs:
  - get
  - list
  - watch
# DexProviderChecks and UserOperations are created on demand and not updated in place.
- apiGroups:
  - deckhouse.io
  resources:
  - dexproviderchecks
  - useroperations
  verbs:
  - create
- apiGroups:
  - deckhouse.io
  resources:
  - dexproviderchecks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - deckhouse.io
  resourceNames:
  - user-authn
  resources:
  - moduleconfigs
  verbs:
  - create
  - update
  - patch
  - delete
# No controller serves these subresources. They exist so that the authority to let an OAuth2 client
# reach the Kubernetes API can be delegated on its own, and the admission policy that gates the
# allow-access-to-kubernetes annotation checks exactly this permission.
- apiGroups:
  - deckhouse.io
  resources:
  - dexauthenticators/allow-access-to-kubernetes
  - dexclients/allow-access-to-kubernetes
  verbs:
  - create
