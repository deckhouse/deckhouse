apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: user-authn
    rbac.deckhouse.io/aggregate-to-security-as: viewer
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.user-authn.view"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-user-authn
  name: d8:system-capability:user-authn:view
  annotations:
    en.meta.deckhouse.io/title: "Module user-authn: view configuration"
    ru.meta.deckhouse.io/title: "Модуль user-authn: просмотр конфигурации"
    en.meta.deckhouse.io/description: "Read-only access to the user-authn module configuration."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к конфигурации модуля user-authn."
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - dexproviderchecks
  - dexproviders
  - groups
  - useraccounts
  - users
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - deckhouse.io
  resourceNames:
  - user-authn
  resources:
  - moduleconfigs
  verbs:
  - get
  - list
  - watch
# The internal Dex storage CRDs (`passwords`, `offlinesessionses`) are deliberately absent.
# Restricting them to `list` is not a mitigation: a collection read returns whole objects, so
# it discloses `hash` and `previousHashes` — the current and historical bcrypt credentials of
# every local user, administrators included — plus refresh-token material. This role promises
# read access to configuration only, so use `deckhouse.io` users for the account inventory.
