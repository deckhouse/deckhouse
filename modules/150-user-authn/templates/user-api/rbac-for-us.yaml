---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-api
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-api")) | nindent 2 }}
---
# user-api creates self-service UserOperations and reads their status. What it may create is narrowed
# by the ValidatingAdmissionPolicy in validating-admission-policy.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:user-authn:user-api
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-api")) | nindent 2 }}
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - useroperations
  verbs:
  - create
  - get
- apiGroups:
  - dex.coreos.com
  resources:
  - passwords
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:user-authn:user-api
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-api")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: d8:user-authn:user-api
subjects:
- kind: ServiceAccount
  name: user-api
  namespace: d8-{{ .Chart.Name }}
---
# The CA in the ConfigMap user-api-ca is public: every service account may read it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: user-api-ca-reader
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-api")) | nindent 2 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - user-api-ca
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: user-api-ca-reader
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-api")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: user-api-ca-reader
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:serviceaccounts
