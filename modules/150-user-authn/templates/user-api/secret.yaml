{{- $tls := .Values.userAuthn.internal.userAPITLS | default dict }}
---
# The certificate of user-api, ordered by hooks/order_user_api_certificate.go, and the CA that user-api
# verifies the certificate of Dex with.
apiVersion: v1
kind: Secret
metadata:
  name: user-api-tls
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-api")) | nindent 2 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tls.crt | default "" | b64enc }}
  tls.key: {{ $tls.key | default "" | b64enc }}
{{- if $tls.ca }}
  ca.crt: {{ $tls.ca | b64enc }}
{{- end }}
  dex-ca.crt: {{ .Values.userAuthn.internal.dexTLS.ca | default "" | b64enc }}
