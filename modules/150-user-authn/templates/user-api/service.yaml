---
# user-api is the self-service API of users. The backend of the console calls it inside the cluster
# with the ID token of the user; users never reach it directly. The CA of its certificate is in the
# ConfigMap user-api-ca.
apiVersion: v1
kind: Service
metadata:
  name: user-api
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-api")) | nindent 2 }}
spec:
  type: ClusterIP
  selector:
    app: user-api
  ports:
  - name: https
    port: 443
    targetPort: https
    protocol: TCP
