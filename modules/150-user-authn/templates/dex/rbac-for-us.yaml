---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex")) | nindent 2 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:user-authn:dex:crd
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex")) | nindent 2 }}
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups: ["dex.coreos.com"]
  resources:
  - authcodes
  - authrequests
  - connectors
  - authsessions
  - devicerequests
  - devicetokens
  - oauth2clients
  - offlinesessionses
  - passwords
  - refreshtokens
  - signingkeies
  - useridentities
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
  - deletecollection
# Dex writes a Revocation at logout and at /token/revoke, and reads one by name to tell at introspection
# whether the session or the grant of a token ended. It lists the type at start, to check that the CRD
# is installed, and lists the revocations of the browser sessions others ended: it labels each one it
# claims (update) to send the back-channel logout of the session.
- apiGroups: ["dex.coreos.com"]
  resources: ["revocations"]
  verbs: ["get", "create", "list", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:user-authn:dex:crd
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: d8:user-authn:dex:crd
subjects:
- kind: ServiceAccount
  name: dex
  namespace: d8-{{ .Chart.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dex
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex")) | nindent 2 }}
rules:
- apiGroups: ["dex.coreos.com"]
  resources:
  - authcodes
  - authrequests
  - authsessions
  - connectors
  - oauth2clients
  - offlinesessionses
  - passwords
  - refreshtokens
  - signingkeies
  - useridentities
  verbs:
  - list
  - watch
  - create
  - update
  - patch
  - delete
  - deletecollection
# Dex writes a Revocation at logout and at /token/revoke, and reads one by name to tell at introspection
# whether the session or the grant of a token ended. It lists the type at start, to check that the CRD
# is installed, and lists the revocations of the browser sessions others ended: it labels each one it
# claims (update) to send the back-channel logout of the session.
- apiGroups: ["dex.coreos.com"]
  resources: ["revocations"]
  verbs: ["get", "create", "list", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dex
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dex
subjects:
- kind: ServiceAccount
  name: dex
  namespace: d8-{{ .Chart.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:user-authn:dex:rbac-proxy
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: d8:rbac-proxy
subjects:
  - kind: ServiceAccount
    name: dex
    namespace: d8-{{ $.Chart.Name }}
