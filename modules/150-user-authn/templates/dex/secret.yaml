---
apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-dex-client-app-secret
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex")) | nindent 2 }}
data:
  secret: {{ .Values.userAuthn.internal.kubernetesDexClientAppSecret | b64enc }}
{{- with .Values.userAuthn.internal.dexTrustedProxySecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dex-trusted-proxy-secret
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list $ (dict "app" "dex")) | nindent 2 }}
data:
  secret: {{ . | b64enc }}
{{- end }}
