{{- /*
Connector-level identity limits from DexProvider.spec.allowedIdentities. Dex enforces them in
finalizeLogin for every connector type (patch 020); the identity-assign webhook trusts the same
fields when it decides who may write the provider. Rendered right after the connector name.
*/ -}}
{{- /* The CA that signs the client certificate of the ingress-nginx controllers: the CA of kube-rbac-proxy. */ -}}
{{- define "dex_trusted_proxy_ca" -}}
  {{- dig "internal" "modules" "kubeRBACProxyCA" "cert" "" (.Values.global | default dict) -}}
{{- end -}}

{{- define "dex_connector_identity_limits" }}
  {{- with .allowedIdentities }}
    {{- if .emails }}
      allowedEmails:
      {{- range .emails }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- if .emailDomains }}
      allowedEmailDomains:
      {{- range .emailDomains }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- if .groups }}
      allowedGroups:
      {{- range .groups }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}

{{- define "dex_conf" }}
  {{- $context := . }}
  issuer: https://{{ include "helm_lib_module_public_domain" (list $context "dex") }}/
  storage:
    type: kubernetes
    config:
      inCluster: true
  web:
    https: 0.0.0.0:5556
    tlsKey: /etc/dex/certs/tls.key
    tlsCert: /etc/dex/certs/tls.crt
    # Dex takes the client address from X-Real-IP only from a trusted proxy. ingress-nginx proves itself
    # with its client certificate: the platform CA signed it for the ingress-nginx:auth organization. The
    # controller presents it to any backend an Ingress asks it to, so whoever can create an Ingress with
    # configuration snippets on that controller can set the address too. The Gateway sends the secret in X-Deckhouse-Trusted-Proxy instead (basic-auth-proxy too, from the global
    # logout change shipped with this one). The secret is readable by whoever can read the HTTPRoute of
    # d8-user-authn, so it keeps out a pod that merely reaches the Dex Service, not a reader of that object;
    # both only guard the address the rate limit counts and the sign-in log shows.
    clientRemoteIP:
      header: X-Real-IP
      {{- with .Values.userAuthn.internal.dexTrustedProxySecret }}
      trustedProxySecret: {{ . | quote }}
      {{- end }}
      {{- if include "dex_trusted_proxy_ca" . }}
      trustedProxyCAFile: /etc/dex/config/trusted-proxy-ca.crt
      trustedProxyCertOrganization: ingress-nginx:auth
      {{- end }}
  telemetry:
    http: 127.0.0.1:5558
  frontend:
    issuer: "Deckhouse"
    dir: /web
    extra:
      # TODO(nabokihms): make it configurable
      lang: en
  {{- with $context.Values.userAuthn.passwordPolicy }}
  {{ if . }}
  passwordPolicy:
    id: local
    complexityLevel: {{ .complexityLevel | quote }}
    {{- if and (eq .complexityLevel "Custom") .custom }}
    custom:
      minLength: {{ .custom.minLength | default 8 }}
      specialCharacters: {{ .custom.specialCharacters | default false }}
      numbers: {{ .custom.numbers | default false }}
      capitalized: {{ .custom.capitalized | default false }}
      repeatedChars: {{ .custom.repeatedChars | default false }}
    {{- end }}
    passwordHistoryLimit: {{ .passwordHistoryLimit }}
    {{- if .rotation }}
    rotation:
      interval: {{ .rotation.interval | quote }}
    {{- end }}
    {{- if .lockout }}
    lockout:
      maxAttempts: {{ .lockout.maxAttempts }}
      lockDuration: {{ .lockout.lockDuration | quote }}
      {{- if .lockout.applyToConnectors }}
      applyToConnectors:
        {{- /* Map module-level pretty names to the connector type used inside Dex.
              The built-in "local" connector is always covered by passwordPolicy.lockout
              and is intentionally not exposed in this list. */}}
        {{- range $name := .lockout.applyToConnectors }}
        {{- if eq $name "LDAP" }}
        - ldap
        {{- else if eq $name "Crowd" }}
        - atlassian-crowd
        {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- with $context.Values.userAuthn.rateLimit }}
  {{- if .enabled }}
  rateLimit:
    enabled: true
    perIP:
      requestsPerMinute: {{ .perIP.requestsPerMinute | default 10 }}
      burst: {{ .perIP.burst | default 10 }}
  {{- end }}
  {{- end }}
  {{- with $context.Values.userAuthn.staticUsers2FA }}
  {{- if .enabled }}
  {{- /* The authenticator ID is a contract: the user-authn controller and the transitional Dex patch keep the
         TOTP secret of a user under mfaSecrets["totp"]. Patch 210 lets MFA work without sessions. */}}
  mfa:
    authenticators:
    - id: totp
      type: TOTP
      config:
        issuer: {{ .issuerName | default "Deckhouse" | quote }}
      connectorTypes:
      - local
    defaultMFAChain:
    - totp
  {{- end }}
  {{- end }}
  signer:
    type: local
    config:
      keysRotationPeriod: "6h"
  expiry:
    authRequests: "10m"
    idTokens: {{ $context.Values.userAuthn.idTokenTTL | default "10m" | quote }}
    refreshTokens:
      reuseInterval: "2m"
      validIfNotUsedFor: {{ $context.Values.userAuthn.refreshTokenValidIfNotUsedFor | default "2190h" | quote }}
      absoluteLifetime: {{ $context.Values.userAuthn.refreshTokenAbsoluteLifetime | default "4380h" | quote }}
  # The devices of a user: at the limit of a client, the devices not trusted yet are signed out first.
  devices:
    trustedAfter: {{ dig "devices" "trustedAfter" "24h" $context.Values.userAuthn | quote }}
    maxPerClient: {{ dig "devices" "maxPerApplication" 10 $context.Values.userAuthn }}
    maxKnown: {{ dig "devices" "rememberedBrowsers" 20 $context.Values.userAuthn }}
  {{- with $context.Values.userAuthn.sessions }}
  {{- if .enabled }}
  {{- $identityRefresh := .identityRefresh | default dict }}
  {{- $absoluteLifetime := .absoluteLifetime | default "168h" }}
  {{- $validIfNotUsedFor := .validIfNotUsedFor | default "24h" }}
  {{- /* Dex refuses an idle timeout longer than the lifetime. The settings refuse it when both are set; the
         default idle timeout of a day yields to a shorter lifetime set alone. */}}
  {{- if gt (include "user_authn_duration_seconds" $validIfNotUsedFor | atoi) (include "user_authn_duration_seconds" $absoluteLifetime | atoi) }}
    {{- $validIfNotUsedFor = $absoluteLifetime }}
  {{- end }}
  {{- /* SSO goes only to the clients that list each other in ssoSharedWith: the DexAuthenticators of the platform
         with sso: Platform (templates/dex-authenticator/_helpers.tpl). */}}
  sessions:
    # __Host-: the browser takes the cookie only from Dex itself (secure, path /, no domain), so an
    # application on a sibling host of the same domain cannot plant a session cookie of its own.
    cookieName: __Host-dex_session
    absoluteLifetime: {{ $absoluteLifetime | quote }}
    validIfNotUsedFor: {{ $validIfNotUsedFor | quote }}
    rememberMeCheckedByDefault: {{ .rememberMeCheckedByDefault | default false }}
    ssoSharedWithDefault: none
    {{- with $context.Values.userAuthn.internal.dexSessionsCookieKey }}
    cookieEncryptionKey: {{ . | quote }}
    {{- end }}
    identityRefresh:
      maxAge: {{ $identityRefresh.maxAge | default $context.Values.userAuthn.idTokenTTL | default "10m" | quote }}
      gracePeriod: {{ $identityRefresh.gracePeriod | default "0s" | quote }}
  {{- end }}
  {{- end }}
  logger:
    level: info
    format: json
  {{- $passwordConnector := "" }}
  {{- range $provider := $context.Values.userAuthn.internal.providers }}
    {{- if and (eq $provider.type "LDAP") ($provider.ldap.enableBasicAuth) }}
      {{- if ne $passwordConnector "" }}
        {{- fail "enableBasicAuth option must be enabled ONLY in one provider" }}
      {{- end }}
      {{- $passwordConnector = $provider.id }}
    {{- end }}
  {{- end }}

  oauth2:
    responseTypes: ["code"]
    {{- if ne $passwordConnector "" }}
    passwordConnector: {{ $passwordConnector | quote }}
    {{- end }}
    {{- /* The second factor is a step of its own since Dex v2.46 and does not need the approval page. */}}
    skipApprovalScreen: true
  {{- if or ($context.Values.userAuthn.internal.dexUsersCRDs) (and (eq (len $context.Values.userAuthn.internal.dexUsersCRDs) 0) (eq (len $context.Values.userAuthn.internal.providers) 0)) }}
  enablePasswordDB: true
  {{- end }}
  {{- if $context.Values.userAuthn.internal.providers }}
  connectors:
    {{- range $provider := $context.Values.userAuthn.internal.providers }}
      {{- if eq $provider.type "Github" }}
    - type: github
      id: {{ $provider.id | quote }}
      name: {{ $provider.displayName | quote }}
      {{- include "dex_connector_identity_limits" $provider }}
      config:
        clientID: {{ $provider.github.clientID | quote }}
        clientSecret: {{ $provider.github.clientSecret | quote }}
        redirectURI: https://{{ include "helm_lib_module_public_domain" (list $context "dex") }}/callback
        orgs:
        {{- range $org := $provider.github.orgs }}
        - name: {{ $org.name | quote }}
          {{- if $org.teams }}
          teams:
            {{- range $team := $org.teams }}
          - {{ $team | quote }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- if $provider.github.teamNameField }}
        teamNameField: {{ $provider.github.teamNameField | lower }}
        {{- end }}
        useLoginAsID: {{ $provider.github.useLoginAsID | default false }}
        loadAllGroups: {{ $provider.github.loadAllGroups | default false }}
      {{- end }}

      {{- if eq $provider.type "Gitlab" }}
    - type: gitlab
      id: {{ $provider.id | quote }}
      name: {{ $provider.displayName | quote }}
      {{- include "dex_connector_identity_limits" $provider }}
      config:
        baseURL: {{ $provider.gitlab.baseURL | quote }}
        clientID: {{ $provider.gitlab.clientID | quote }}
        clientSecret: {{ $provider.gitlab.clientSecret | quote }}
        redirectURI: https://{{ include "helm_lib_module_public_domain" (list $context "dex") }}/callback
        useLoginAsID: {{ $provider.gitlab.useLoginAsID | default false }}
        {{- if $provider.gitlab.groups }}
        groups:
          {{- range $group := $provider.gitlab.groups }}
        - {{ $group | quote }}
          {{- end }}
        {{- end }}
        {{- if $provider.gitlab.rootCAData }}
        rootCAData: {{ $provider.gitlab.rootCAData | b64enc }}
        {{- end }}
      {{- end }}

      {{- if eq $provider.type "BitbucketCloud" }}
    - type: bitbucket-cloud
      id: {{ $provider.id | quote }}
      name: {{ $provider.displayName | quote }}
      {{- include "dex_connector_identity_limits" $provider }}
      config:
        clientID: {{ $provider.bitbucketCloud.clientID | quote }}
        clientSecret: {{ $provider.bitbucketCloud.clientSecret | quote }}
        redirectURI: https://{{ include "helm_lib_module_public_domain" (list $context "dex") }}/callback
        includeTeamGroups: {{ $provider.bitbucketCloud.includeTeamGroups | default false }}
        {{- if $provider.bitbucketCloud.teams }}
        teams:
          {{- range $team := $provider.bitbucketCloud.teams }}
        - {{ $team | quote }}
          {{- end }}
        {{- end }}
      {{- end }}


      {{- if eq $provider.type "LDAP" }}
    - type: ldap
      id: {{ $provider.id | quote }}
      name: {{ $provider.displayName | quote }}
      {{- include "dex_connector_identity_limits" $provider }}
      config:
        host: {{ $provider.ldap.host | quote }}
        {{- if $provider.ldap.insecureSkipVerify }}
        insecureSkipVerify: true
        {{- end }}
        {{- if $provider.ldap.insecureNoSSL }}
        insecureNoSSL: true
        {{- end }}
        {{- if $provider.ldap.rootCAData }}
        rootCAData: {{ $provider.ldap.rootCAData | b64enc }}
        {{- end }}
        {{- if $provider.ldap.bindDN  }}
        bindDN: {{ $provider.ldap.bindDN | quote }}
        {{- end }}
        {{- if $provider.ldap.bindPW  }}
        bindPW: {{ $provider.ldap.bindPW | quote }}
        {{- end }}
        {{- if $provider.ldap.startTLS }}
        startTLS: true
        {{- end }}
        userSearch:
          {{- $provider.ldap.userSearch | toYaml | nindent 10 }}
        {{- if $provider.ldap.groupSearch }}
        groupSearch:
          {{- $provider.ldap.groupSearch | toYaml | nindent 10 }}
        {{- end }}
        usernamePrompt: {{ $provider.ldap.usernamePrompt | default "LDAP username" | quote }}
        {{- if $provider.ldap.kerberos }}
        {{- /* Kerberos without a keytab stays off for this provider instead of failing the whole render. The CRD
               rejects such an object on save, so only objects stored before that rule get here. */}}
        {{- $kerberosEnabled := false }}
        {{- if and $provider.ldap.kerberos.enabled $provider.ldap.kerberos.keytabSecretName }}
          {{- $kerberosEnabled = true }}
        {{- end }}
        kerberos:
          enabled: {{ $kerberosEnabled }}
          {{- if $provider.ldap.kerberos.expectedRealm }}
          expectedRealm: {{ $provider.ldap.kerberos.expectedRealm | quote }}
          {{- end }}
          {{- if $provider.ldap.kerberos.usernameFromPrincipal }}
          usernameFromPrincipal: {{ $provider.ldap.kerberos.usernameFromPrincipal | quote }}
          {{- end }}
          fallbackToPassword: {{ $provider.ldap.kerberos.fallbackToPassword | default false }}
          # keytabPath is path in container derived from provider id; volume is mounted in deployment
          keytabPath: {{ (printf "/etc/dex/kerberos/%s/krb5.keytab" $provider.id) | quote }}
        {{- end }}
      {{- end }}

      {{- if eq $provider.type "OIDC" }}
    - type: oidc
      id: {{ $provider.id | quote }}
      name: {{ $provider.displayName | quote }}
      {{- include "dex_connector_identity_limits" $provider }}
      config:
        issuer: {{ $provider.oidc.issuer | quote }}
        clientID: {{ $provider.oidc.clientID | quote }}
        clientSecret: {{ $provider.oidc.clientSecret | quote }}
        redirectURI: https://{{ include "helm_lib_module_public_domain" (list $context "dex") }}/callback
        {{- if $provider.oidc.basicAuthUnsupported }}
        basicAuthUnsupported: true
        {{- end }}
        {{- if $provider.oidc.insecureSkipEmailVerified }}
        insecureSkipEmailVerified: true
        {{- end }}
        insecureEnableGroups: true
        {{- if $provider.oidc.getUserInfo }}
        getUserInfo: true
        {{- end }}
        userIDKey: {{ $provider.oidc.userIDKey | default "sub" | quote }}
        userNameKey: {{ $provider.oidc.userNameKey | default "name" | quote }}
        {{- if $provider.oidc.claimMapping }}
        claimMapping:
          email: {{ $provider.oidc.claimMapping.email | quote }}
          groups: {{ $provider.oidc.claimMapping.groups | quote }}
          preferred_username: {{ $provider.oidc.claimMapping.preferred_username | quote }}
        {{- end }}
        {{- if $provider.oidc.claimMappingOverride }}
        overrideClaimMapping: true
        {{- end }}
        {{- if $provider.oidc.allowedGroups }}
        allowedGroups:
          {{- range $group := $provider.oidc.allowedGroups }}
          - {{ $group | quote }}
          {{- end }}
        {{- end }}
        scopes:
        {{- if $provider.oidc.scopes }}
           {{- range $scope := $provider.oidc.scopes }}
        - {{ $scope | quote }}
           {{- end }}
        {{- else }}
        - openid
        - profile
        - email
        - groups
        - offline_access
        {{- end }}
        {{- if $provider.oidc.promptType }}
        promptType: {{ $provider.oidc.promptType | quote }}
        {{- end }}
        {{- if $provider.oidc.upstreamLogout }}
        upstreamLogout: true
        {{- end }}
        {{- if $provider.oidc.insecureSkipVerify }}
        insecureSkipVerify: true
        {{- end }}
        {{- if $provider.oidc.rootCAData }}
        rootCAs:
        - {{ $provider.oidc.rootCAData | quote }}
        {{- end }}
      {{- end }}

      {{- if eq $provider.type "Crowd" }}
    - type: atlassian-crowd
      id: {{ $provider.id | quote }}
      name: {{ $provider.displayName | quote }}
      {{- include "dex_connector_identity_limits" $provider }}
      config:
        baseURL: {{ $provider.crowd.baseURL | quote }}
        clientID: {{ $provider.crowd.clientID | quote }}
        clientSecret: {{ $provider.crowd.clientSecret | quote }}
        {{- if $provider.crowd.groups }}
        groups:
          {{- range $group := $provider.crowd.groups }}
        - {{ $group | quote }}
          {{- end }}
        {{- end }}
        usernamePrompt: {{ $provider.crowd.usernamePrompt | default "Crowd username" | quote }}
      {{- end }}

      {{- if eq $provider.type "SAML" }}
    - type: saml
      id: {{ $provider.id | quote }}
      name: {{ $provider.displayName | quote }}
      {{- include "dex_connector_identity_limits" $provider }}
      config:
        ssoURL: {{ $provider.saml.ssoURL | quote }}
        {{- if $provider.saml.rootCAData }}
        caData: {{ $provider.saml.rootCAData | b64enc }}
        {{- end }}
        {{- if $provider.saml.entityIssuer }}
        entityIssuer: {{ $provider.saml.entityIssuer | quote }}
        {{- end }}
        {{- if $provider.saml.ssoIssuer }}
        ssoIssuer: {{ $provider.saml.ssoIssuer | quote }}
        {{- end }}
        redirectURI: {{ $provider.saml.redirectURI | default (printf "https://%s/callback" (include "helm_lib_module_public_domain" (list $context "dex"))) | quote }}
        usernameAttr: {{ $provider.saml.usernameAttr | default "name" | quote }}
        emailAttr: {{ $provider.saml.emailAttr | default "email" | quote }}
        {{- if $provider.saml.groupsAttr }}
        groupsAttr: {{ $provider.saml.groupsAttr | quote }}
        {{- end }}
        {{- if $provider.saml.groupsDelim }}
        groupsDelim: {{ $provider.saml.groupsDelim | quote }}
        {{- end }}
        {{- if $provider.saml.allowedGroups }}
        allowedGroups:
          {{- range $provider.saml.allowedGroups }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
        {{- if $provider.saml.filterGroups }}
        filterGroups: {{ $provider.saml.filterGroups }}
        {{- end }}
        {{- if $provider.saml.nameIDPolicyFormat }}
        nameIDPolicyFormat: {{ $provider.saml.nameIDPolicyFormat | quote }}
        {{- end }}
        {{- if $provider.saml.insecureSkipSignatureValidation }}
        insecureSkipSignatureValidation: {{ $provider.saml.insecureSkipSignatureValidation }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dex
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex")) | nindent 2 }}
data:
  config.yaml: |-
    {{- include "dex_conf" . | b64enc | nindent 4 }}
  {{- with include "dex_trusted_proxy_ca" . }}
  trusted-proxy-ca.crt: {{ . | b64enc }}
  {{- end }}
