{{- $context := . }}
{{- if and ($context.Values.userAuthn.internal.publishAPI.enabled) ($context.Values.userAuthn.internal.publishAPI.addKubeconfigGeneratorEntry) }}
---
apiVersion: dex.coreos.com/v1
kind: OAuth2Client
metadata:
  name: {{ $context.Values.userAuthn.internal.kubeconfigPublishAPIEncodedName }}
  namespace: d8-{{ $context.Chart.Name }}
  {{- include "helm_lib_module_labels" (list $context (dict "app" "kubernetes-dex-clients")) | nindent 2 }}
id: kubeconfig-publish-api
name: kubeconfig-publish-api
secret: {{ $context.Values.userAuthn.internal.kubernetesDexClientAppSecret | quote }}
redirectURIs:
- http://localhost:8000
- http://localhost:18000
- /device/callback
{{- end }}
{{- if $context.Values.userAuthn.kubeconfigGenerator }}
  {{- /*
    The names come from hooks/generate_kubeconfig_encoded_names.go. addon-operator also renders the
    chart before the hooks run, to apply the ConversionWebhooks ahead of the release (ModuleEnsureHooks),
    with the names of the previous run or none: an entry without a name is left out there instead of
    failing the render.
  */}}
  {{- $encodedNames := $context.Values.userAuthn.internal.kubeconfigClientEncodedNames | default list }}
  {{- range $index, $cluster := $context.Values.userAuthn.kubeconfigGenerator }}
    {{- $slug := $cluster.id | replace "@" "-at-" | replace ":" "-" }}
    {{- if lt $index (len $encodedNames) }}
---
apiVersion: dex.coreos.com/v1
kind: OAuth2Client
metadata:
  name: {{ index $encodedNames $index | quote }}
  namespace: d8-{{ $context.Chart.Name }}
  {{- include "helm_lib_module_labels" (list $context (dict "app" "kubernetes-dex-clients")) | nindent 2 }}
id: kubeconfig-{{ $slug }}
name: kubeconfig-{{ $slug }}
secret: {{ $context.Values.userAuthn.internal.kubernetesDexClientAppSecret | quote }}
redirectURIs:
- http://localhost:8000
- http://localhost:18000
- /device/callback
    {{- end }}
  {{- end }}
{{- end }}
