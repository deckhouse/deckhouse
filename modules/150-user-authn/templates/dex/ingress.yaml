{{- if eq (include "helm_lib_module_ingress_enabled" .) "true" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dex
  namespace: d8-{{ .Chart.Name }}
  annotations:
    # ingress-nginx presents its client certificate to Dex, and Dex trusts the client address in
    # X-Real-IP only from a connection with that certificate (clientRemoteIP.trustedProxyCAFile).
  {{- if include "helm_lib_module_ingress_nginx_annotations_version_ge" (list $ "1.3.0") }}
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-use-controller-certificate: "true"
  {{- if or (eq (include "helm_lib_module_https_mode" .) "CertManager") (eq (include "helm_lib_module_https_mode" .) "CustomCertificate") }}
    nginx.ingress.kubernetes.io/ingress-nginx-hsts: "true"
  {{- end }}
  {{- else }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      {{- include "helm_lib_module_ingress_configuration_snippet" $ | nindent 6 }}
      proxy_ssl_certificate /etc/nginx/ssl/client.crt;
      proxy_ssl_certificate_key /etc/nginx/ssl/client.key;
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
  {{- end }}
    # A browser sign-in spans several requests. While an old and a new Dex pod run side by side
    # in a rollout they serve different paths, so a sign-in stays on the pod it started on.
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/session-cookie-name: d8-dex-affinity
    # One cookie for both Ingresses of Dex: without a path ingress-nginx scopes it to the path of the location,
    # and a sign-in that starts under /auth would pick its pod again for /mfa, /callback and the rest.
    nginx.ingress.kubernetes.io/session-cookie-path: /
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex")) | nindent 2 }}
spec:
  ingressClassName: {{ include "helm_lib_module_ingress_class" . | quote }}
  {{- if (include "helm_lib_module_https_ingress_tls_enabled" .) }}
  tls:
  - hosts:
    - {{ include "helm_lib_module_public_domain" (list . "dex") }}
    secretName: {{ include "helm_lib_module_https_secret_name" (list . "ingress-tls") }}
  {{- end }}
  rules:
  - host: {{ include "helm_lib_module_public_domain" (list . "dex") }}
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: dex
            port:
              number: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dex-auth
  namespace: d8-{{ .Chart.Name }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    # A browser sign-in spans several requests. While an old and a new Dex pod run side by side
    # in a rollout they serve different paths, so a sign-in stays on the pod it started on.
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/session-cookie-name: d8-dex-affinity
    # One cookie for both Ingresses of Dex: without a path ingress-nginx scopes it to the path of the location,
    # and a sign-in that starts under /auth would pick its pod again for /mfa, /callback and the rest.
    nginx.ingress.kubernetes.io/session-cookie-path: /
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
  {{- if include "helm_lib_module_ingress_nginx_annotations_version_ge" (list $ "1.3.0") }}
    nginx.ingress.kubernetes.io/proxy-ssl-use-controller-certificate: "true"
  {{- if or (eq (include "helm_lib_module_https_mode" .) "CertManager") (eq (include "helm_lib_module_https_mode" .) "CustomCertificate") }}
    nginx.ingress.kubernetes.io/ingress-nginx-hsts: "true"
  {{- end }}
  {{- else }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      {{- include "helm_lib_module_ingress_configuration_snippet" $ | nindent 6 }}
      proxy_ssl_certificate /etc/nginx/ssl/client.crt;
      proxy_ssl_certificate_key /etc/nginx/ssl/client.key;
  {{- end }}
    nginx.ingress.kubernetes.io/limit-rpm: "1000"
    # Works only for ingress-controllers >=0.40. It is here to not forget to add the annotation after upgrading ingress controller.
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    # Send alert only if dex doesn't work at all (resolves issue #204).
    # We use 101% here to switch off warnings because this threshold value is out of the range.
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex" "threshold.extended-monitoring.deckhouse.io/5xx-warning" "101" "threshold.extended-monitoring.deckhouse.io/5xx-critical" "100")) | nindent 2 }}
spec:
  ingressClassName: {{ include "helm_lib_module_ingress_class" . | quote }}
  {{- if (include "helm_lib_module_https_ingress_tls_enabled" .) }}
  tls:
  - hosts:
    - {{ include "helm_lib_module_public_domain" (list . "dex") }}
    secretName: {{ include "helm_lib_module_https_secret_name" (list . "ingress-tls") }}
  {{- end }}
  rules:
  - host: {{ include "helm_lib_module_public_domain" (list . "dex") }}
    http:
      paths:
      - path: /auth
        pathType: ImplementationSpecific
        backend:
          service:
            name: dex
            port:
              number: 443
      - path: /healthz
        pathType: ImplementationSpecific
        backend:
          service:
            name: dex
            port:
              number: 443
{{- end }}
