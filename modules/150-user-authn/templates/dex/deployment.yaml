{{- define "dex_resources" }}
cpu: 10m
memory: 25Mi
{{- end }}

{{- /* Dex opens every connector before it serves /healthz, and only OIDC does network I/O there: discovery
against the issuer, which Dex patch 400 bounds at 10s (discoveryTimeout, not set by the module). The
startupProbe (5s period) gets 60s for the rest of the start plus 15s for each OIDC provider whose issuer
may not answer. */}}
{{- define "dex_startup_failure_threshold" }}
  {{- $oidcProviders := 0 }}
  {{- range $provider := .Values.userAuthn.internal.providers }}
    {{- if eq $provider.type "OIDC" }}
      {{- $oidcProviders = add1 $oidcProviders }}
    {{- end }}
  {{- end }}
  {{- add 12 (mul 3 $oidcProviders) }}
{{- end }}

{{- if (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: dex
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: dex
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
    - containerName: dex
      minAllowed:
        {{- include "dex_resources" . | nindent 8 }}
      {{- /* A login checks a bcrypt hash and a refresh signs a token, so a cluster with steady login traffic
      needs hundreds of millicores for Dex. VPA follows the usage of the last days, not a short login wave;
      the probes below keep Dex running through a wave. */}}
      maxAllowed:
        cpu: 500m
        memory: 50Mi
    {{- include "helm_lib_vpa_kube_rbac_proxy_resources" . | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex")) | nindent 2 }}
spec:
  {{- include "helm_lib_deployment_strategy_and_replicas_for_ha" . | nindent 2 }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
      annotations:
        {{- if (dig "customLogo" "enabled" false .Values.userAuthn.internal) }}
        checksum/custom-logo: {{ .Values.userAuthn.internal.customLogo.checksum | quote }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/dex/config.yaml") . | sha256sum }}
        checksum/tls: {{ include (print $.Template.BasePath "/dex/secret-tls.yaml") . | sha256sum }}
    spec:
      {{- include "helm_lib_priority_class" (tuple . "cluster-low") | nindent 6 }}
      {{- include "helm_lib_node_selector" (tuple . "system") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple . "system") | nindent 6 }}
      {{- include "helm_lib_pod_anti_affinity_for_ha" (list . (dict "app" "dex")) | nindent 6 }}
      {{- include "helm_lib_module_pod_security_context_run_as_user_deckhouse" . | nindent 6 }}
      automountServiceAccountToken: true
      imagePullSecrets:
      - name: deckhouse-registry
      serviceAccountName: dex
      volumes:
      - name: original-config
        secret:
          secretName: dex
          items:
          - key: config.yaml
            path: config.yaml
          {{- if include "dex_trusted_proxy_ca" . }}
          - key: trusted-proxy-ca.crt
            path: trusted-proxy-ca.crt
          {{- end }}
      - name: tls
        secret:
          secretName: dex-tls
      {{- /* Mount Kerberos materials per LDAP provider, if configured */}}
      {{- range $p := .Values.userAuthn.internal.providers }}
      {{- if and (eq $p.type "LDAP") ($p.ldap) ($p.ldap.kerberos) ($p.ldap.kerberos.enabled) }}
      {{- if $p.ldap.kerberos.keytabSecretName }}
      - name: {{ printf "kerberos-keytab-%s" $p.id | trunc 63 | trimSuffix "-" | quote }}
        secret:
          secretName: {{ $p.ldap.kerberos.keytabSecretName | quote }}
      {{- end }}
      {{- /* krb5.conf is not required for offline AP-REQ validation */}}
      {{- end }}
      {{- end }}
      {{- if (dig "customLogo" "enabled" false .Values.userAuthn.internal) }}
      - name: whitelabel-logo
        configMap:
          defaultMode: 292
          name: whitelabel-custom-logo
          items:
            - key: dexLogo
              path: deckhouse-logo-icon.svg
      - name: whitelabel-logo-title
        configMap:
          defaultMode: 292
          name: whitelabel-custom-logo
          items:
            - key: dexTitle
              path: deckhouse-logo-title.svg
      {{- end }}
      containers:
      - name: dex
        {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 8 }}
        image: {{ include "helm_lib_module_image" (list . "dex") }}
        command: ["/usr/local/bin/dex", "serve", "/etc/dex/config/config.yaml"]
        env:
        - name: KUBERNETES_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DEX_EXPAND_ENV
          value: "false"
        - name: DEX_CONTINUE_ON_CONNECTOR_FAILURE
          value: "true"
        {{- if dig "sessions" "enabled" false .Values.userAuthn }}
        - name: DEX_SESSIONS_ENABLED
          value: "true"
        {{- end }}
        {{- include "helm_lib_envs_for_proxy" . | nindent 8 }}
        ports:
        - name: https
          containerPort: 5556
          protocol: TCP
        # Keep serving while the endpoint removal reaches kube-proxy, ingress-nginx and the API servers;
        # the server closes its listener on SIGTERM.
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        # Without a startup budget the liveness probe kills the pod while an unreachable OIDC issuer holds
        # the start, before DEX_CONTINUE_ON_CONNECTOR_FAILURE can skip the connector.
        startupProbe:
          httpGet:
            path: /healthz/live
            port: 5559
            scheme: HTTPS
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: {{ include "dex_startup_failure_threshold" . }}
        # On a node short of CPU both containers answer in seconds, not milliseconds. With the default
        # 1s timeout the kubelet restarts a Dex that is only slow, and the growing restart back-off keeps
        # logins down long after the node recovers.
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: 5559
            scheme: HTTPS
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 5559
            scheme: HTTPS
          timeoutSeconds: 5
        volumeMounts:
        - name: original-config
          mountPath: /etc/dex/config
        - name: tls
          mountPath: /etc/dex/certs
        {{- /* Mount Kerberos materials per LDAP provider, if configured */}}
        {{- range $p := .Values.userAuthn.internal.providers }}
        {{- if and (eq $p.type "LDAP") ($p.ldap) ($p.ldap.kerberos) ($p.ldap.kerberos.enabled) }}
        {{- if $p.ldap.kerberos.keytabSecretName }}
        - name: {{ printf "kerberos-keytab-%s" $p.id | trunc 63 | trimSuffix "-" | quote }}
          mountPath: {{ printf "/etc/dex/kerberos/%s" $p.id | quote }}
          readOnly: true
        {{- end }}
        {{- /* krb5.conf is not required for offline AP-REQ validation */}}
        {{- end }}
        {{- end }}
        {{- if (dig "customLogo" "enabled" false .Values.userAuthn.internal) }}
        - mountPath: /web/static/img/deckhouse-logo-icon.svg
          name: whitelabel-logo
          subPath: deckhouse-logo-icon.svg
        - mountPath: /web/static/img/deckhouse-logo-title.svg
          name: whitelabel-logo-title
          subPath: deckhouse-logo-title.svg
        {{- end }}
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_logs_with_extra" 10 | nindent 12 }}
{{- if not (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- include "dex_resources" . | nindent 12 }}
{{- end }}

      - name: kube-rbac-proxy
        {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 8 }}
        image: {{ include "helm_lib_module_common_image" (list . "kubeRbacProxy") }}
        args:
          - "--secure-listen-address=$(KUBE_RBAC_PROXY_LISTEN_ADDRESS):5559"
          - "--v=2"
          - "--logtostderr=true"
          - "--stale-cache-interval=1h30m"
          - "--livez-path=/livez"
        env:
        - name: KUBE_RBAC_PROXY_LISTEN_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: KUBE_RBAC_PROXY_CONFIG
          value: |
            excludePaths:
            - /healthz/live
            - /healthz/ready
            upstreams:
            - upstream: http://127.0.0.1:5558/
              path: /
              authorization:
                resourceAttributes:
                  namespace: d8-user-authn
                  apiGroup: apps
                  apiVersion: v1
                  resource: deployments
                  subresource: prometheus-metrics
                  name: dex
        ports:
        - containerPort: 5559
          name: https-metrics
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_logs_with_extra" 10 | nindent 12 }}
{{- if not ( .Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- include "helm_lib_container_kube_rbac_proxy_resources" . | nindent 12 }}
{{- end }}
        # Liveness is the proxy's own: a Dex that starts slowly or hangs later does not restart the
        # proxy. Readiness follows Dex, whose endpoints the proxy serves.
        livenessProbe:
          httpGet:
            path: /livez
            port: 5559
            scheme: HTTPS
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 5559
            scheme: HTTPS
          timeoutSeconds: 5
