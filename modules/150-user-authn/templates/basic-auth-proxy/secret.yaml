{{- if include "is_basic_auth_enabled" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth-cert
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "basic-auth-cert")) | nindent 2 }}
data:
  client.crt: {{ .Values.userAuthn.internal.basicAuthProxyCert | quote }}
  client.key: {{ .Values.userAuthn.internal.basicAuthProxyKey | quote }}
  {{- /* The internal CA of Dex; a hook of the module always issues it. */}}
  dex-ca.crt: {{ .Values.userAuthn.internal.dexTLS.ca | b64enc | quote }}
  {{- with .Values.userAuthn.internal.dexTrustedProxySecret }}
  # The secret Dex trusts X-Real-IP on: the proxy sends it with the address of the end client.
  dex-trusted-proxy-secret: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
