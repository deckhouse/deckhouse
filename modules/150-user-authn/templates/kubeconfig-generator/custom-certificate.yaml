{{- if eq (include "helm_lib_module_ingress_enabled" .) "true" }}
{{- include "helm_lib_module_https_copy_custom_certificate" (list . "d8-user-authn" "kubeconfig-ingress-tls") -}}
{{- end }}
{{- $moduleGateway := dict }}
