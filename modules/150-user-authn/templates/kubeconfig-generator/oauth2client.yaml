{{- $context := . }}
{{- if $context.Values.userAuthn.internal.publishAPI.enabled }}
---
apiVersion: dex.coreos.com/v1
kind: OAuth2Client
metadata:
  name: nn2wezldn5xgm2lhfvtwk3tfojqxi33szpzjzzeeeirsk  # kubeconfig-generator
  namespace: d8-{{ $context.Chart.Name }}
  {{- include "helm_lib_module_labels" (list $context (dict "app" "kubernetes-configurator")) | nindent 2 }}
id: kubeconfig-generator
name: kubeconfig-generator
secret: {{ $context.Values.userAuthn.internal.kubernetesDexClientAppSecret | quote }}
redirectURIs:
- http://localhost:8000
- http://localhost:18000
- /device/callback
{{- end }}

{{- if $context.Values.userAuthn.kubeconfigGenerator}}
  {{- /*
    The names come from hooks/generate_kubeconfig_encoded_names.go. addon-operator also renders the
    chart before the hooks run, to apply the ConversionWebhooks ahead of the release (ModuleEnsureHooks),
    with the names of the previous run or none: an entry without a name is left out there instead of
    failing the render.
  */}}
  {{- $encodedNames := $context.Values.userAuthn.internal.kubeconfigEncodedNames | default list }}
  {{- range $index, $cluster := $context.Values.userAuthn.kubeconfigGenerator }}
    {{- if lt $index (len $encodedNames) }}
---
apiVersion: dex.coreos.com/v1
kind: OAuth2Client
metadata:
  name: {{ index $encodedNames $index | quote}}
  namespace: d8-{{ $context.Chart.Name }}
  {{- include "helm_lib_module_labels" (list $context (dict "app" "kubernetes-configurator")) | nindent 2 }}
id: kubeconfig-generator-{{ $index }}
name: kubeconfig-generator-{{ $index }}
secret: {{ $context.Values.userAuthn.internal.kubernetesDexClientAppSecret | quote }}
redirectURIs:
- http://localhost:8000
- http://localhost:18000
- /device/callback
    {{- end }}
  {{- end }}
{{- end }}
