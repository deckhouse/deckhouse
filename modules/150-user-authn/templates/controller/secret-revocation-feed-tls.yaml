{{- $tls := .Values.userAuthn.internal.revocationFeedTLS | default dict }}
---
# The certificate of the revocation feed, from hooks/order_revocation_feed_certificate.go. Its CA is
# its own: dex-authenticator trusts it for the feed only, and the controller never gets the key of Dex.
apiVersion: v1
kind: Secret
metadata:
  name: revocation-feed-tls
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-authn-controller")) | nindent 2 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tls.crt | default "" | b64enc }}
  tls.key: {{ $tls.key | default "" | b64enc }}
{{- if $tls.ca }}
  ca.crt: {{ $tls.ca | b64enc }}
{{- end }}
