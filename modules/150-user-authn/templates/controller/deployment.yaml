{{- define "user_authn_controller_resources" }}
cpu: 20m
memory: 50Mi
{{- end }}

{{- if (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: user-authn-controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-authn-controller")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: user-authn-controller
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
    - containerName: "user-authn-controller"
      minAllowed:
        {{- include "user_authn_controller_resources" . | nindent 8 }}
      # The caches of AuthSession, Revocation, and the clients of DexAuthenticators, and the streams
      # of the revocation feed, come on top of the Dex objects of 1.78.
      maxAllowed:
        cpu: 100m
        memory: 256Mi
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-authn-controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-authn-controller")) | nindent 2 }}
spec:
  {{- include "helm_lib_deployment_strategy_and_replicas_for_ha" . | nindent 2 }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: user-authn-controller
  template:
    metadata:
      labels:
        app: user-authn-controller
      annotations:
        checksum/revocation-feed-tls: {{ include (print $.Template.BasePath "/controller/secret-revocation-feed-tls.yaml") . | sha256sum }}
    spec:
      {{- include "helm_lib_node_selector" (tuple . "system") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple . "system") | nindent 6 }}
      {{- include "helm_lib_priority_class" (tuple . "system-cluster-critical") | nindent 6 }}
      {{- include "helm_lib_pod_anti_affinity_for_ha" (list . (dict "app" "user-authn-controller")) | nindent 6 }}
      {{- include "helm_lib_module_pod_security_context_run_as_user_deckhouse" . | nindent 6 }}
      automountServiceAccountToken: true
      imagePullSecrets:
      - name: deckhouse-registry
      terminationGracePeriodSeconds: 60
      serviceAccountName: controller
      containers:
      - name: user-authn-controller
        {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 8 }}
        image: {{ include "helm_lib_module_image" (list . "userAuthnController") }}
        imagePullPolicy: 'IfNotPresent'
        ports:
        - containerPort: 9090
          name: healthz
          protocol: TCP
        - containerPort: 9091
          name: metrics
          protocol: TCP
        # The revocation feed of dex-authenticator, on every replica (Service revocation-feed).
        - containerPort: 8443
          name: feed
          protocol: TCP
        env:
        # Revocations are kept for the ID token lifetime and an hour.
        - name: ID_TOKEN_TTL
          value: {{ .Values.userAuthn.idTokenTTL | default "10m" | quote }}
        # The trusted devices are kept first when the device list of a UserAccount is cut.
        - name: MIN_DEVICE_AGE
          value: {{ dig "devices" "trustedAfter" "24h" .Values.userAuthn | quote }}
        - name: USER_OPERATION_RETENTION
          value: {{ dig "retention" "userOperations" "24h" .Values.userAuthn | quote }}
        {{- with dig "retention" "revocations" "" .Values.userAuthn }}
        # Never shorter than the ID token lifetime and an hour: the controller raises it to that.
        - name: REVOCATION_RETENTION
          value: {{ . | quote }}
        {{- end }}
        - name: REVOCATION_FEED_ADDR
          value: ":8443"
        - name: REVOCATION_FEED_TLS_DIR
          value: /etc/revocation-feed/tls
        volumeMounts:
        - name: revocation-feed-tls
          mountPath: /etc/revocation-feed/tls
          readOnly: true
        startupProbe:
          httpGet:
            path: /healthz
            port: 9090
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        # readyz runs two checks in sequence, cache-sync and api-access, each with a 2 s budget of
        # its own, and the handler does not stop at the first failure. The probe has to outlast
        # both, or a cold start against an unreachable API server times out before the body says
        # which check failed.
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9090
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 12 }}
{{- if not (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- include "user_authn_controller_resources" . | nindent 12 }}
{{- end }}
      volumes:
      - name: revocation-feed-tls
        secret:
          secretName: revocation-feed-tls
