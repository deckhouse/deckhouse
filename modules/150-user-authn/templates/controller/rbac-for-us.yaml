---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-authn-controller")) | nindent 2 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:user-authn:controller
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-authn-controller")) | nindent 2 }}
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - useraccounts
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - deckhouse.io
  resources:
  - useraccounts/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - deckhouse.io
  resources:
  - users
  verbs:
  - get
  - list
  - watch
  - delete
- apiGroups:
  - deckhouse.io
  resources:
  - users/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - deckhouse.io
  resources:
  - groups
  verbs:
  - get
  - list
  - watch
  - patch
  - update
- apiGroups:
  - deckhouse.io
  resources:
  - dexproviders
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - deckhouse.io
  resources:
  - dexproviderchecks
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - deckhouse.io
  resources:
  - dexproviderchecks/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - deckhouse.io
  resources:
  - useroperations
  verbs:
  - get
  - list
  - watch
  - update
  - patch
  - delete
- apiGroups:
  - deckhouse.io
  resources:
  - useroperations/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - dex.coreos.com
  resources:
  - passwords
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
  - delete
- apiGroups:
  - dex.coreos.com
  resources:
  - offlinesessionses
  verbs:
  - get
  - list
  - watch
  - patch
  - update
  - delete
- apiGroups:
  - dex.coreos.com
  resources:
  - refreshtokens
  verbs:
  - get
  - list
  - watch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:user-authn:controller
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-authn-controller")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: d8:user-authn:controller
subjects:
- kind: ServiceAccount
  name: controller
  namespace: d8-{{ .Chart.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-authn-controller")) | nindent 2 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "user-authn-controller")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: controller
subjects:
- kind: ServiceAccount
  name: controller
  namespace: d8-{{ .Chart.Name }}
