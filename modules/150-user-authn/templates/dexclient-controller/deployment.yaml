{{- define "dexclient_controller_resources" }}
cpu: 10m
memory: 25Mi
{{- end }}

{{- if (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: dexclient-controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "dexclient-controller")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: dexclient-controller
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
    - containerName: "dexclient-controller"
      minAllowed:
        {{- include "dexclient_controller_resources" . | nindent 8 }}
      maxAllowed:
        cpu: 50m
        memory: 128Mi
{{- end }}
---
# The DexClient reconciler of user-authn-controller, alone in its pod under a ServiceAccount of its
# own: it writes the Secrets of DexClients in every namespace, and the pod serves nothing on the
# network but health and metrics. user-authn-controller, which serves the revocation feed, cannot
# write Secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dexclient-controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "dexclient-controller")) | nindent 2 }}
spec:
  {{- include "helm_lib_deployment_strategy_and_replicas_for_ha" . | nindent 2 }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: dexclient-controller
  template:
    metadata:
      labels:
        app: dexclient-controller
    spec:
      {{- include "helm_lib_node_selector" (tuple . "system") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple . "system") | nindent 6 }}
      {{- include "helm_lib_priority_class" (tuple . "system-cluster-critical") | nindent 6 }}
      {{- include "helm_lib_pod_anti_affinity_for_ha" (list . (dict "app" "dexclient-controller")) | nindent 6 }}
      {{- include "helm_lib_module_pod_security_context_run_as_user_deckhouse" . | nindent 6 }}
      automountServiceAccountToken: true
      imagePullSecrets:
      - name: deckhouse-registry
      terminationGracePeriodSeconds: 30
      serviceAccountName: dexclient-controller
      containers:
      - name: dexclient-controller
        {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 8 }}
        image: {{ include "helm_lib_module_image" (list . "userAuthnController") }}
        imagePullPolicy: 'IfNotPresent'
        args:
        - dexclient
        ports:
        - containerPort: 9090
          name: healthz
          protocol: TCP
        - containerPort: 9091
          name: metrics
          protocol: TCP
        startupProbe:
          httpGet:
            path: /healthz
            port: 9090
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        # readyz runs cache-sync and api-access, 2 s each; the probe outlasts both.
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9090
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 12 }}
{{- if not (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- include "dexclient_controller_resources" . | nindent 12 }}
{{- end }}
