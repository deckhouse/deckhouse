{{- if and (include "shared_dex_authenticator_enabled" .) (.Values.global.enabledModules | has "operator-prometheus") }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: shared-dex-authenticator
  namespace: d8-monitoring
  {{- include "helm_lib_module_labels" (list . (dict "prometheus" "main")) | nindent 2 }}
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: shared-dex-authenticator
  namespaceSelector:
    matchNames:
    - d8-{{ $.Chart.Name }}
  podMetricsEndpoints:
  - port: metrics
    relabelings:
    - targetLabel: tier
      replacement: cluster
    # The instance, so that the metrics of the two are told apart; a not ready pod is scraped too: its metrics
    # tell why it is not ready.
    - sourceLabels: [__meta_kubernetes_pod_label_instance]
      targetLabel: instance_name
{{- end }}
