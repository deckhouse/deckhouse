{{- $context := . }}
{{- range $instance := include "shared_dex_authenticator_instances" . | fromYamlArray }}
    {{- /* The hook fills the passwords before the release. An empty one would render "requirepass" and "masterauth"
           without a value: Redis does not start on such a file, and the proxy takes an empty password and keeps the
           sessions in memory. So once the passwords are there, a missing or empty one fails the render, with the name
           of the value. A render before the hooks have run has none yet and goes on: addon-operator renders the
           whole chart for the ConversionWebhooks of the module ahead of the release, and a render that fails there
           stops the main queue. */}}
    {{- $passwords := dig "sharedDexAuthenticator" "redisPasswords" dict $context.Values.userAuthn.internal }}
    {{- $password := "" }}
    {{- if $passwords }}
      {{- $password = required (printf "userAuthn.internal.sharedDexAuthenticator.redisPasswords.%s is required: the password of the Redis of the instance" $instance) (index $passwords $instance) }}
    {{- end }}
---
# The Redis of the replicas of an instance talk to each other, and the proxy of each replica talks to all of them,
# with one password. It reaches Redis in its configuration file and the proxy in an environment variable, never
# in the arguments of a container, which the process list of the node shows.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $instance }}-redis
  namespace: d8-{{ $context.Chart.Name }}
  {{- include "helm_lib_module_labels" (list $context (dict "app" "shared-dex-authenticator" "instance" $instance)) | nindent 2 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
  {{- /* No disk: the sessions are restored from their cookies. A Redis that starts empty copies a neighbour
         without a file on either side, and keeps answering from its old data until the copy is loaded. */}}
  redis.conf: {{ printf "bind 0.0.0.0\nport 6379\nsave \"\"\nappendonly no\nrepl-diskless-sync yes\nrepl-diskless-sync-delay 0\nrepl-diskless-load swapdb\nrequirepass %s\nmasterauth %s\n" $password $password | b64enc | quote }}
{{- end }}
