{{- /* The pods of an instance take requests from whoever routes them (an ingress controller in hostNetwork has
       no pod address to name), and reach dex, the revocation feed and DNS. The Redis of a pod is reachable only
       from the pods of its own instance: the sessions there go without TLS. */}}
{{- $context := . }}
{{- range $instance := include "shared_dex_authenticator_instances" . | fromYamlArray }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $instance }}
  namespace: d8-{{ $context.Chart.Name }}
  {{- include "helm_lib_module_labels" (list $context (dict "app" "shared-dex-authenticator" "instance" $instance)) | nindent 2 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shared_dex_authenticator_pod_labels" $instance | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 8443
  - from:
    - podSelector:
        matchLabels:
          {{- include "shared_dex_authenticator_pod_labels" $instance | nindent 10 }}
    ports:
    - protocol: TCP
      port: 6379
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: d8-monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - podSelector:
        matchLabels:
          {{- include "shared_dex_authenticator_pod_labels" $instance | nindent 10 }}
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: dex
    ports:
    - protocol: TCP
      port: 5556
  - to:
    - podSelector:
        matchLabels:
          app: user-authn-controller
    ports:
    - protocol: TCP
      port: feed
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    # CoreDNS listens on 5353 behind the kube-dns Service.
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
{{- end }}
