{{- /*
  The certificate comes from the copy_custom_certificate hook. addon-operator also renders the chart
  before the hooks run, to apply the ConversionWebhooks ahead of the release (ModuleEnsureHooks), with
  the internal values of the previous run or none, and the helm_lib helper fails without the certificate.
  So the Secret is copied only once the certificate is there; when the hooks leave it out in the
  CustomCertificate mode, hooks/https/require_custom_certificate.go fails the module run instead.
*/}}
{{- $certificate := .Values.userAuthn.internal.customCertificateData | default dict }}
{{- if or (eq (include "helm_lib_module_ingress_enabled" .) "true") (eq (include "helm_lib_module_gateway_enabled" .) "true") }}
{{- if and (index $certificate "tls.crt") (index $certificate "tls.key") }}
{{- include "helm_lib_module_https_copy_custom_certificate" (list . "d8-user-authn" "ingress-tls") }}
{{- end }}
{{- end }}
