{{- if and (include "helm_lib_kind_exists" (list . "ValidatingAdmissionPolicy")) (include "helm_lib_kind_exists" (list . "ValidatingAdmissionPolicyBinding")) }}
{{- $policyName := "system-users.deckhouse.io" }}
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $policyName }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "deckhouse") ) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   ["deckhouse.io"]
        apiVersions: ["*"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["users"]
  validations:
    - expression: '!( request.userInfo.username != "system:serviceaccount:d8-system:deckhouse"
        && !object.spec.email.matches("^[\\w\\+\\-\\.]+@(?:[\\w-]+\\.)+[\\w-]{2,}$") )'
      reason: Forbidden
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicyBinding") }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $policyName }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "deckhouse") ) | nindent 2 }}
spec:
  policyName: {{ $policyName }}
  validationActions: [Deny]
{{- $allowAccessPolicyName := "dex-allow-access-to-kubernetes.deckhouse.io" }}
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $allowAccessPolicyName }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "deckhouse") ) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   ["deckhouse.io"]
        apiVersions: ["*"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["dexclients", "dexauthenticators"]
  # Platform components provision these objects on the cluster's behalf and are already privileged
  # by virtue of running in a system namespace, so gating them buys nothing and only breaks
  # provisioning flows. Tenants cannot place a workload in these namespaces to begin with.
  matchConditions:
    - name: 'exclude-groups'
      expression: '!(["system:nodes", "system:serviceaccounts:kube-system", "system:serviceaccounts:d8-system"].exists(e, (e in request.userInfo.groups)))'
    - name: 'exclude-users'
      expression: '!(["system:sudouser", "system:apiserver", "system:kube-controller-manager", "system:kube-scheduler", "system:volume-scheduler", "dhctl", "observability"].exists(e, (e == request.userInfo.username)))'
    - name: 'exclude-system-serviceaccounts'
      expression: '!(request.userInfo.username.startsWith("system:serviceaccount:d8-") || request.userInfo.username.startsWith("system:serviceaccount:kube-"))'
  variables:
    # The annotation is named after the kind it belongs to, so the key depends on the matched resource.
    - name: annotation
      expression: 'request.resource.resource == "dexclients"
        ? "dexclient.deckhouse.io/allow-access-to-kubernetes"
        : "dexauthenticator.deckhouse.io/allow-access-to-kubernetes"'
    - name: annotations
      expression: 'object.metadata.?annotations.orValue({})'
    - name: oldAnnotations
      expression: 'oldObject == null ? {} : oldObject.metadata.?annotations.orValue({})'
    # Presence of the key, not its value, is what the policy gates. Hook generations disagree on how
    # the value is read: some parse it with strconv.ParseBool and fail closed, older ones grant on
    # the mere presence of the key. Gating presence keeps the policy sound whichever hook is running
    # and removes the coupling to the hook's parsing altogether.
    - name: annotated
      expression: 'variables.annotation in variables.annotations'
    - name: annotatedBefore
      expression: 'variables.annotation in variables.oldAnnotations'
    # Truthiness is only used to decide whether an update makes an already annotated object more
    # permissive; it is never what allows the key to appear in the first place.
    - name: grantsAccess
      expression: 'variables.annotated
        && variables.annotations[variables.annotation].lowerAscii() in ["1", "t", "true"]'
    - name: grantedBefore
      expression: 'variables.annotatedBefore
        && variables.oldAnnotations[variables.annotation].lowerAscii() in ["1", "t", "true"]'
  validations:
    # Only a newly introduced or newly widened annotation is gated, so objects that already carry it
    # stay editable by their owners. Authority is a dedicated permission on a subresource that no
    # controller serves: it exists solely so that an administrator can delegate "may grant access to
    # the Kubernetes API" on its own, the way pods/exec or the escalate verb are delegated. Deriving
    # authority from write access to the user-authn ModuleConfig instead would demand ownership of
    # the whole authentication stack from every cluster provisioner, and the platform's own role
    # model keeps these apart: DexClient lives in use roles, ModuleConfig in manage roles.
    - expression: '!variables.annotated
        || (variables.annotatedBefore && (!variables.grantsAccess || variables.grantedBefore))
        || authorizer.group("deckhouse.io").resource(request.resource.resource).subresource("allow-access-to-kubernetes").namespace(request.namespace).check("create").allowed()'
      reason: Forbidden
      messageExpression: '"the " + variables.annotation + " annotation controls access to the Kubernetes API
        and may only be introduced or widened by a subject allowed to create the "
        + request.resource.resource + "/allow-access-to-kubernetes subresource"'
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicyBinding") }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $allowAccessPolicyName }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "deckhouse") ) | nindent 2 }}
spec:
  policyName: {{ $allowAccessPolicyName }}
  validationActions: [Deny]
{{- if .Values.userAuthn.passwordPolicy }}
{{- $passwordPolicyName := "user-password-immutable.deckhouse.io" }}
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $passwordPolicyName }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "deckhouse")) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   ["deckhouse.io"]
        apiVersions: ["*"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["users"]
  validations:
    - expression: "oldObject == null || object.spec.password == oldObject.spec.password"
      message: "password policy is enabled, user password field cannot be changed manually"
---
apiVersion: {{ include "helm_lib_get_api_version_by_kind" (list . "ValidatingAdmissionPolicy") }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $passwordPolicyName }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "deckhouse")) | nindent 2 }}
spec:
  policyName: {{ $passwordPolicyName }}
  validationActions: [Deny]
{{- end }}
{{- end }}
