{{- define "dex_authenticator_resources" }}
cpu: 10m
memory: 25Mi
{{- end }}

{{- define "redis_resources" }}
cpu: 10m
memory: 25Mi
{{- end }}

{{- $context := . }}
{{- $redisSidecar := include "dex_authenticator_redis_is_sidecar" $context }}
{{- $dexAuthenticatorNames := .Values.userAuthn.internal.dexAuthenticatorNames | default dict -}}
{{- range $crd := .Values.userAuthn.internal.dexAuthenticatorCRDs }}
  {{- $id := printf "%s@%s" $crd.name $crd.namespace }}
  {{- $info := index $dexAuthenticatorNames $id | default dict }}
  {{- $baseName := (default (printf "%s-dex-authenticator" $crd.name) (index $info "name")) }}
  {{- $truncated := (index $info "truncated") }}
  {{- $hash := (index $info "hash") }}
  {{- $secretName := (default (printf "dex-authenticator-%s" $crd.name) (index $info "secretName")) }}
  {{- /* spec.highAvailability of the DexAuthenticator overrides the high availability of the cluster. The rollout */}}
  {{- /* strategy and the PodDisruptionBudget follow the number of replicas it gives. */}}
  {{- $replicas := 1 }}
  {{- if ne $crd.spec.highAvailability nil }}
    {{- if $crd.spec.highAvailability }}
      {{- $replicas = 2 }}
    {{- end }}
  {{- else if (include "helm_lib_ha_enabled" $context) }}
    {{- $replicas = 2 }}
  {{- end }}
  {{- if and ($context.Values.global.enabledModules | has "vertical-pod-autoscaler") (not $crd.spec.resources) }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ $baseName }}
  namespace: {{ $crd.namespace | quote }}
  {{- $vpaLabels := dict "app" "dex-authenticator" "deckhouse.io/dex-authenticator-for" $crd.name }}
  {{- if $truncated }}
  {{- $_ := set $vpaLabels "deckhouse.io/name-truncated" "true" }}
  {{- $_ := set $vpaLabels "deckhouse.io/name-hash" $hash }}
  {{- end }}
  {{- include "helm_lib_module_labels" (list $context $vpaLabels) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: {{ $baseName }}
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
    - containerName: "dex-authenticator"
      minAllowed:
        {{- include "dex_authenticator_resources" . | nindent 8 }}
      maxAllowed:
        cpu: 20m
        memory: 50Mi
    {{- if $redisSidecar }}
    - containerName: "redis"
      minAllowed:
        {{- include "redis_resources" . | nindent 8 }}
      maxAllowed:
        cpu: 20m
        memory: 50Mi
    {{- end }}
  {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $baseName }}
  namespace: {{ $crd.namespace | quote }}
  {{- $pdbLabels := dict "app" "dex-authenticator" "deckhouse.io/dex-authenticator-for" $crd.name }}
  {{- if $truncated }}
  {{- $_ := set $pdbLabels "deckhouse.io/name-truncated" "true" }}
  {{- $_ := set $pdbLabels "deckhouse.io/name-hash" $hash }}
  {{- end }}
  {{- include "helm_lib_module_labels" (list $context $pdbLabels) | nindent 2 }}
spec:
  {{- /* A single replica may be evicted: a budget of 1 would block the drain of its node. */}}
  minAvailable: {{ if gt $replicas 1 }}1{{ else }}0{{ end }}
  selector:
    matchLabels:
      app: dex-authenticator
      name: {{ $crd.name | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $baseName }}
  namespace: {{ $crd.namespace | quote }}
  {{- $depLabels := dict "app" "dex-authenticator" "deckhouse.io/dex-authenticator-for" $crd.name }}
  {{- if $truncated }}
  {{- $_ := set $depLabels "deckhouse.io/name-truncated" "true" }}
  {{- $_ := set $depLabels "deckhouse.io/name-hash" $hash }}
  {{- end }}
  {{- include "helm_lib_module_labels" (list $context $depLabels) | nindent 2 }}
spec:
  replicas: {{ $replicas }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
    {{- if gt $replicas 1 }}
      {{- /* The other replica serves while one is replaced. */}}
      maxSurge: 0
      maxUnavailable: 1
    {{- else }}
      {{- /* A single replica serves until the new one is ready, so a rollout is not an outage. */}}
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      app: dex-authenticator
      name: {{ $crd.name | quote }}
  template:
    metadata:
      labels:
        {{- with $crd.spec.podMetadata }}
          {{- with .labels }}
{{ toYaml . | nindent 8 }}
          {{- end }}
        {{- end }}
        app: dex-authenticator
        name: {{ $crd.name | quote}}
      annotations:
        {{- with $crd.spec.podMetadata }}
          {{- with .annotations }}
{{ toYaml . | nindent 8 }}
          {{- end }}
        {{- end }}
        checksum/config: {{ $crd.credentials | toJson | b64enc | sha256sum }}
        {{- /* oauth2-proxy reads the CA of dex once, at startup. */}}
        checksum/dex-ca: {{ $context.Values.userAuthn.internal.dexTLS.ca | default "" | sha256sum }}
    spec:
{{- if $crd.spec.nodeSelector }}
      nodeSelector:
  {{- range $key, $value := $crd.spec.nodeSelector }}
        {{ $key | quote }}: {{ $value | quote }}
  {{- end }}
{{- else }}
      {{- include "helm_lib_node_selector" (tuple $context "system") | nindent 6 }}
{{- end }}
{{- if $crd.spec.tolerations }}
      tolerations: {{ $crd.spec.tolerations | toJson }}
{{- else }}
      {{- include "helm_lib_tolerations" (tuple $context "system") | nindent 6 }}
{{- end }}
      {{- include "helm_lib_priority_class" (tuple $context "cluster-low") | nindent 6 }}
      {{- include "helm_lib_pod_anti_affinity_for_ha" (list $context (dict "app" "dex-authenticator" "name" $crd.name) (dict "revisionScoped" true)) | nindent 6 }}
      {{- include "helm_lib_module_pod_security_context_run_as_user_deckhouse" . | nindent 6 }}
      imagePullSecrets:
      - name: registry-dex-authenticator
      volumes:
      - name: tls
        emptyDir: {}
      - name: dex-ca
        secret:
          secretName: {{ $secretName }}
          items:
          - key: dex-ca.crt
            path: ca.crt
      initContainers:
      - args:
        - "{{ $baseName }}.{{ $crd.namespace }}"
        - "{{ $baseName }}.{{ $crd.namespace }}.svc"
        image: {{ include "helm_lib_module_image" (list $context "selfSignedGenerator") }}
        name: self-signed-generator
        volumeMounts:
        - name: tls
          mountPath: "/certs"
        {{- /* Fixed, as for the identical init container of user-api. A ResourceQuota counts a pod */}}
        {{- /* as max(max(init), sum(app)), so literals are accounted exactly like the sum of the main */}}
        {{- /* container limits, and they cannot land below the requests whatever the CR asks for. */}}
        resources:
          requests:
            memory: 10Mi
            cpu: 10m
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 12 }}
          limits:
            memory: 25Mi
            cpu: 10m
        {{- include "helm_lib_module_container_security_context_read_only_root_filesystem_capabilities_drop_all_pss_restricted" . | nindent 8 }}
      containers:
      - name: dex-authenticator
        {{- include "helm_lib_module_container_security_context_read_only_root_filesystem_capabilities_drop_all_pss_restricted" . | nindent 8 }}
        image: {{ include "helm_lib_module_image" (list $context "dexAuthenticator") }}
        args:
        - --provider=oidc
        - "--client-id={{ include "dex_authenticator_client_id" $crd }}"
    {{- if ne (include "helm_lib_module_uri_scheme" $context ) "https" }}
        - --cookie-secure=false
    {{- end }}
        - --redirect-url=/dex-authenticator/callback
        - --oidc-issuer-url=https://{{ include "helm_lib_module_public_domain" (list $context "dex") }}/
        # Skip oidc issuer validation and discovery to avoid CrashLoopBackoffs
        - --skip-oidc-discovery
        - --redeem-url=https://dex.d8-user-authn/token
        - --login-url=https://{{ include "helm_lib_module_public_domain" (list $context "dex") }}/auth
        - --oidc-jwks-url=https://dex.d8-user-authn/keys
        # The token and keys of dex come over TLS that the authenticator checks against the CA of dex.
        - --provider-ca-file=/opt/dex-authenticator/dex-ca/ca.crt
        - --code-challenge-method=S256
    {{- if $crd.spec.sendAuthorizationHeader }}
        - --set-authorization-header=true
    {{- end }}
        - --set-xauthrequest
        - --scope=groups email openid profile offline_access{{- if $crd.allowAccessToKubernetes }} federated:id audience:server:client_id:kubernetes{{- end }}
        - --proxy-prefix=/dex-authenticator
        - --email-domain=*
    {{- range $app := $crd.spec.applications }}
        - --whitelist-domain={{ $app.domain }}
    {{- end }}
        - --upstream=file:///dev/null
        - --https-address=0.0.0.0:8443
        - --tls-cert-file=/opt/dex-authenticator/tls/tls.crt
        - --tls-key-file=/opt/dex-authenticator/tls/tls.key
        - --skip-provider-button
        - --silence-ping-logging
        - --logging-format=json
        # One CSRF cookie per sign-in flow: it holds the state and the PKCE verifier of the flow, so two
        # tabs that sign in at the same time no longer overwrite each other's verifier. A flow lives as
        # long as the sign-in at dex takes, so its cookie expires after 10 minutes, and at most 10 of them
        # are kept: the oldest go first.
        - --cookie-csrf-per-request=true
        - --cookie-csrf-per-request-limit=10
        - --cookie-csrf-expire=10m
        {{- include "dex_authenticator_session_store_args" $context | nindent 8 }}
    {{- $idTokenTTL := $context.Values.userAuthn.idTokenTTL | default "10m" }}
    {{- $keepUsersLoggedInFor := $crd.spec.keepUsersLoggedInFor | default "168h" }} # 7 days
    {{- $delta := now }}
        - --cookie-refresh={{ $idTokenTTL }}
    {{- if gt ($delta | mustDateModify $keepUsersLoggedInFor | unixEpoch) ($delta | mustDateModify $idTokenTTL | unixEpoch) }}
        - --cookie-expire={{ $keepUsersLoggedInFor }}
    {{- else }}
        - --cookie-expire={{ duration (add (sub ($delta | mustDateModify $idTokenTTL | unixEpoch) ($delta | unixEpoch)) 1) }}
    {{- end }}
        - --insecure-oidc-allow-unverified-email=true
        - --approval-prompt=basic
        - --reverse-proxy
        env:
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: cookie-secret
        volumeMounts:
        - name: tls
          mountPath: "/opt/dex-authenticator/tls"
          readOnly: true
        - name: dex-ca
          mountPath: "/opt/dex-authenticator/dex-ca"
          readOnly: true
        # Readiness checks the authenticator and its session store, not dex. A check of dex took every
        # authenticator out of its Service during a dex outage, and every protected application answered
        # 500, including users whose sessions need no dex call. /ready of oauth2-proxy also fails when
        # the Redis sidecar is gone.
        readinessProbe:
          httpGet:
            port: 8443
            scheme: HTTPS
            path: /ready
          initialDelaySeconds: 5
          periodSeconds: 5
        # Keep serving while the endpoint removal reaches kube-proxy, ingress-nginx and the API servers;
        # the server closes its listener on SIGTERM.
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        livenessProbe:
          httpGet:
            port: 8443
            scheme: HTTPS
            path: /ping
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_logs_with_extra" 10 | nindent 12 }}
          {{- if $crd.spec.resources }}
            {{- with $crd.spec.resources.requests }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
          {{- else if not ($context.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- include "dex_authenticator_resources" . | nindent 12 }}
          {{- end }}
          {{- with $crd.spec.resources }}
            {{- with .limits }}
          limits:
            {{ toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        ports:
        - name: dex-https
          containerPort: 8443
          protocol: TCP
      {{- if $redisSidecar }}
      - name: redis
        {{- include "helm_lib_module_container_security_context_read_only_root_filesystem_capabilities_drop_all_pss_restricted" . | nindent 8 }}
        image: {{ include "helm_lib_module_image" (list $context "redis") }}
        args:
          - "--save"
          - ""
          - "--appendonly"
          - "no"
          - "--bind"
          - "127.0.0.1"
        {{- with include "dex_authenticator_redis_sidecar_port" $context }}
          - "--port"
          - {{ . | quote }}
        {{- end }}
        # The session store has to outlive the authenticator, which keeps serving for 5 seconds after
        # SIGTERM; without Redis it would clear the sessions of the requests it still gets.
        lifecycle:
          preStop:
            sleep:
              seconds: 7
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 12 }}
          {{- if $crd.spec.resources }}
            {{- with $crd.spec.resources.redis }}
              {{- with .requests }}
            {{ toYaml . | nindent 12 }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if not ($context.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
            {{- if not $crd.spec.resources }}
              {{- include "redis_resources" . | nindent 12 }}
            {{- else if not $crd.spec.resources.redis }}
              {{- include "redis_resources" . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with $crd.spec.resources }}
            {{- with .redis }}
              {{- with .limits }}
          limits:
            {{ toYaml . | nindent 12 }}
              {{- end }}
            {{- end }}
          {{- end }}
      {{- end }}
{{- end }}
