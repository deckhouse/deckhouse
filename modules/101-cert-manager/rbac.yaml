capabilities:
  namespace.admin:
    title:
      en: 'Module cert-manager: admin'
      ru: 'Модуль cert-manager: администрирование'
    description:
      en: Manage cert-manager Issuers in a namespace.
      ru: Управление Issuer модуля cert-manager в пространстве имён.
serviceAccounts:
  - name: cainjector
    path: cainjector
    when: .Values.certManager.internal.enableCAInjector
    labels:
      app: cainjector
    clusterRules:
      - apiGroups:
          - cert-manager.io
        resources:
          - certificates
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - ""
        resources:
          - secrets
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - ""
        resources:
          - events
        verbs:
          - get
          - create
          - update
          - patch
