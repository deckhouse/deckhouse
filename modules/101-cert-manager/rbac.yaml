    path: cert-manager
    labels:
      app: cert-manager
    bindClusterRoles:
      - d8:rbac-proxy
    extraClusterRoles:
      - name: approve
        rules:
          - apiGroups:
              - cert-manager.io
            resources:
              - signers
            resourceNames:
              - issuers.cert-manager.io/*
              - clusterissuers.cert-manager.io/*
            verbs:
              - approve
      - name: certificates
        rules:
          - apiGroups:
              - cert-manager.io
            resources:
              - certificates
              - certificates/status
              - certificaterequests
              - certificaterequests/status
            verbs:
