x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    x-required-for-helm:
    - selfSignedCA
    - webhookCert
    properties:
      selfSignedCA:
        type: object
        default: {}
        properties:
          cert:
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
            type: string
          key:
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
            type: string

      webhookCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: [ "YjY0ZW5jX3N0cmluZwo=" ]
          key:
            type: string
            x-examples: [ "YjY0ZW5jX3N0cmluZwo=" ]
          ca:
            type: string
            x-examples: [ "YjY0ZW5jX3N0cmluZwo=" ]
          caBundle:
            type: string
            description: |
              CA certificates the webhook configurations trust, in PEM.
              The current CA and, while the webhook rolls out a new CA, the previous one.
          caRotationInProgress:
            type: boolean
            default: false
            description: |
              The webhook rolls out a new CA and the previous CA is still trusted.

      email:
        type: string
        format: email
        x-examples: ["example@example.com"]

      enableCAInjector:
        type: boolean
        default: false
        description: |
          Internal flag that controls CAInjector rendering.
          It is resolved from manual setting (`certManager.enableCAInjector`) or automatic resource discovery.

