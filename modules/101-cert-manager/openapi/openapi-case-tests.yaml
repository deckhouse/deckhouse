positive:
  configValues:
  # cert-manager 1.21 options
  - enableACMERenewalInfo: true
    http01WaitInsteadOfSelfCheck: "30s"
    certificateRequestMaximumBackoffDuration: "6h"
  - http01WaitInsteadOfSelfCheck: "0"
  - http01WaitInsteadOfSelfCheck: "1h2m3s"
  - certificateRequestMaximumBackoffDuration: "1h30m"
  - certificateRequestMaximumBackoffDuration: "9999h"
  # empty configuration is valid
  - {}

  # only node selector
  - nodeSelector: {"disk-type": "ssd"}

  # only tolerations
  - tolerations:
    - {"key":"dedicated.deckhouse.io","operator":"Equal","value":"cert-manager"}
    - {"key":"dedicated.deckhouse.io","operator":"Equal","value":"system"}

  # node selector with tolerations
  - nodeSelector: {"disk-type": "ssd"}
    tolerations:
      - { "key": "dedicated.deckhouse.io","operator": "Equal","value": "cert-manager" }
      - { "key": "dedicated.deckhouse.io","operator": "Equal","value": "system" }

  # high availability mode
  - highAvailability: true
  - highAvailability: false

  # cloudflare settings
  - cloudflareGlobalAPIKey: "key"
    cloudflareEmail: "example@example.com"
  - cloudflareAPIToken: "token"
    cloudflareEmail: "example@example.com"

  # route53 settings
  - route53AccessKeyID: "key id"
    route53SecretAccessKey: "key"
  # digital ocean creds
  - digitalOceanCredentials: "creds"

  # gcloud SA
  - cloudDNSServiceAccount: "eyJzYSI6ICJhYmNkZWZnaEBzZXJ2aWNlYWNjb3VudC5jb20iLCAicHJvamVjdF9pZCI6ImFhYWFhIn0="

  # yandex cloud dns
  - yandexFolderID: "b1gabcdefghijklmnopq"
    yandexServiceAccountJSON: "eyJpZCI6ImFqZSIsInNlcnZpY2VfYWNjb3VudF9pZCI6ImFqZSJ9"

  # all in
  - nodeSelector: { "disk-type": "ssd" }
    tolerations:
      - { "key": "dedicated.deckhouse.io","operator": "Equal","value": "cert-manager" }
      - { "key": "dedicated.deckhouse.io","operator": "Equal","value": "system" }
    cloudflareGlobalAPIKey: "key"
    cloudflareEmail: "example@example.com"
    route53AccessKeyID: "key id"
    route53SecretAccessKey: "key"
    digitalOceanCredentials: "creds"
    cloudDNSServiceAccount: 'eyJzYSI6ICJhYmNkZWZnaEBzZXJ2aWNlYWNjb3VudC5jb20iLCAicHJvamVjdF9pZCI6ImFhYWFhIn0='
    yandexFolderID: "b1gabcdefghijklmnopq"
    yandexServiceAccountJSON: "eyJpZCI6ImFqZSIsInNlcnZpY2VfYWNjb3VudF9pZCI6ImFqZSJ9"

  values:
  - internal:
      selfSignedCA:
        cert: string
        key: string
      webhookCert:
        ca: string
        key: string
        crt: string

negative:
  configValues:
  - http01WaitInsteadOfSelfCheck: "-30s"
  - http01WaitInsteadOfSelfCheck: ""
  - http01WaitInsteadOfSelfCheck: "30"
  - http01WaitInsteadOfSelfCheck: "3000000h"
  - certificateRequestMaximumBackoffDuration: "30m"
  - certificateRequestMaximumBackoffDuration: "90m"
  - certificateRequestMaximumBackoffDuration: "1h30m0s"
  - certificateRequestMaximumBackoffDuration: "1h60m"
  - certificateRequestMaximumBackoffDuration: "0h"
  - certificateRequestMaximumBackoffDuration: "3000000h"
  - enableACMERenewalInfo: "yes"
  - highAvailability: "must be boolean, not string"
  - nodeSelector: ["must be object, not array"]
  - tolerations: "must array of object, not string"
  - tolerations: ["must array of object, not array of strings"]
  - tolerations: [{"incorrect key": "val"}]
  - cloudflareEmail: "not email"
  - cloudDNSServiceAccount: "must be base64 encoded json-string with 'project_id' field"
  - yandexServiceAccountJSON: "must be base64 encoded json"
  - yandexFolderID: ""
    yandexServiceAccountJSON: "eyJpZCI6ImFqZSIsInNlcnZpY2VfYWNjb3VudF9pZCI6ImFqZSJ9"
  - yandexFolderID: "b1gabcdefghijklmnopq"
    yandexServiceAccountJSON: ""
