# /ee/cse/modules/101-cert-manager/openapi/config-values.yaml
type: object
description: The module does not have any mandatory parameters.
x-deckhouse-validations:
  - expression: "(!has(self.yandexFolderID) && !has(self.yandexServiceAccountJSON)) || (has(self.yandexFolderID) && has(self.yandexServiceAccountJSON))"
    message: "yandexFolderID and yandexServiceAccountJSON must be set together"
properties:
  nodeSelector:
    type: object
    additionalProperties:
      type: string
    description: |
      The same as in the pods' `spec.nodeSelector` parameter in Kubernetes.

      If the parameter is omitted or `false`, it will be determined [automatically](https://deckhouse.io/products/kubernetes-platform/documentation/v1/#advanced-scheduling).
    x-examples:
      - { "has-gpu": "true" }

  tolerations:
    description: |
      The same as in the pods' `spec.tolerations` parameter in Kubernetes.

      If the parameter is omitted or `false`, it will be determined [automatically](https://deckhouse.io/products/kubernetes-platform/documentation/v1/#advanced-scheduling).
    type: array
    items:
      type: object
      properties:
        effect:
          type: string
        key:
          type: string
        operator:
          type: string
        tolerationSeconds:
          format: int64
          type: integer
        value:
          type: string
    x-examples:
      - [
          {
            "key": "dedicated.deckhouse.io",
            "operator": "Equal",
            "value": "cert-manager",
          },
        ]

  highAvailability:
    type: boolean
    x-examples: [true, false]
    description: |
      Manually enable the high availability mode.

      By default, Deckhouse automatically decides whether to enable the HA mode. Click [here](/products/kubernetes-platform/documentation/v1/reference/api/global.html#parameters) to learn more about the HA mode for modules.

  cloudflareAPIToken:
    type: string
    x-examples: ["token"]
    description: |
      [API Tokens](https://cert-manager.io/docs/configuration/acme/dns01/cloudflare/#api-tokens) allow application-scoped keys bound to specific DNS zones.

      API Tokens are recommended for higher security, since they have more restrictive permissions and are more easily revocable.

      It allows you to verify that domains specified
      in the Certificate resource are managed by `cert-manager` and kept by the Cloudflare DNS provider.
      Verification is performed by adding special TXT records for
      the [ACME DNS01 Challenge Provider](https://cert-manager.io/docs/configuration/acme/dns01/) domain.

  cloudflareGlobalAPIKey:
    type: string
    description: |
      The Cloudflare Global API key for managing DNS records

      It allows you to verify that domains specified
      in the Certificate resource are managed by `cert-manager` and kept by the Cloudflare DNS provider.

      Verification is performed by adding special TXT records for
      the [ACME DNS01 Challenge Provider](https://cert-manager.io/docs/configuration/acme/dns01/) domain.
    x-examples: ["key"]

  cloudflareEmail:
    type: string
    format: email
    description: |
      The email used for accessing the Cloudflare platform.
    x-examples: ["example@example.com"]

  route53AccessKeyID:
    type: string
    description: |
      The Access Key ID of the user with the attached
      [Amazon Route53 IAM Policy](https://cert-manager.io/docs/configuration/acme/dns01/route53/)
      for managing domain records.
    x-examples: ["key_id"]

  route53SecretAccessKey:
    type: string
    description: |
      The Secret Access Key of the user with privileges to manage domain records.
    x-examples: ["secret"]

  digitalOceanCredentials:
    type: string
    description: |
      The Access Token for the Digital Ocean API (you can create it in the  `API` section).
    x-examples: ["creds"]

  cloudDNSServiceAccount:
    type: string
    format: byte
    description: |
      The Service Account for [Google Cloud](usage.html#issuing-a-dns-wildcard-certificate-using-google)
      for the same project that has the DNS Administrator role.
    x-examples:
      [
        "eyJzYSI6ICJhYmNkZWZnaEBzZXJ2aWNlYWNjb3VudC5jb20iLCAicHJvamVjdF9pZCI6ImFhYWFhIn0=",
      ]

  yandexFolderID:
    type: string
    minLength: 1
    description: |
      ID of the [Yandex Cloud](usage.html#issuing-a-dns-wildcard-certificate-using-yandex-cloud-dns) folder
      that contains the public DNS zone used for the ACME DNS-01 challenge.

      Must be set together with `yandexServiceAccountJSON`.
    x-examples: ["b1gabcdefghijklmnopq"]

  yandexServiceAccountJSON:
    type: string
    format: byte
    minLength: 1
    description: |
      Base64-encoded authorized key JSON for a Yandex Cloud service account
      with the `dns.editor` role (or equivalent) on the folder with the DNS zone.

      Must be set together with `yandexFolderID`.
      Details are available in [Issuing a DNS wildcard certificate using Yandex Cloud DNS](usage.html#issuing-a-dns-wildcard-certificate-using-yandex-cloud-dns).
    x-examples: ["eyJpZCI6ImFqZSIsInNlcnZpY2VfYWNjb3VudF9pZCI6ImFqZSJ9"]

  email:
    type: string
    format: email
    description: |
      The email used for sending notifications by LetsEncrypt.
    x-examples: ["example@example.com"]

  cleanupOrphanSecrets:
    type: boolean
    default: false
    description: |
      Delete a secret with a certificate automatically if the corresponding Certificate resource was deleted from the cluster.
    x-examples: [true, false]

  disableLetsencrypt:
    type: boolean
    description: |
      Disable `letsencrypt` and `letsencrypt-staging` ClusterIssuer objects (if set to `true`).
    x-examples: [true, false]

  maxConcurrentChallenges:
    type: integer
    format: int32
    minimum: 0
    description: |
      The maximum number of challenges that can be scheduled as 'processing' at once. (default 60)
    x-examples: [25]

  enableCAInjector:
    type: boolean
    default: false
    x-examples: [true, false]
    description: |
      Manually enable CAInjector.
      By default, CAInjector is enabled automatically when resources with CA injection annotations are detected (`cert-manager.io/inject-ca-from`, `cert-manager.io/inject-ca-from-secret`, `cert-manager.io/inject-apiserver-ca`).

  enableListenerSet:
    type: boolean
    default: false
    x-examples: [true, false]
    description: |
      Enable ListenerSet support in cert-manager by turning on the `ListenerSets` feature gate.

      Additionally, when Gateway API integration is enabled, this flag also enables ListenerSet integration for Gateway API if the ListenerSet CRD is installed in the cluster and serves the `v1` version.

      Gateway API integration is enabled automatically when the Gateway and HTTPRoute CRDs are installed in the cluster and serve the `v1` version.
  enableACMERenewalInfo:
    type: boolean
    default: false
    x-examples: [true, false]
    description: |
      Enable ACME Renewal Information (ARI, [RFC 9773](https://www.rfc-editor.org/rfc/rfc9773))
      by turning on the `ACMEUseARI` feature gate.

      With ARI, cert-manager asks the ACME server, for example Let's Encrypt,
      for the renewal window of every certificate it issued.
      If the server returns a window, cert-manager renews the certificate at a random moment inside it
      and ignores `renewBefore` and `renewBeforePercentage` of the Certificate resource.
      The renewal can therefore happen later than `renewBefore` requires.
      `spec.renewal` of the Certificate still applies on top of the window.
      If the server does not support ARI or the request fails, `renewBefore` applies as usual.

      The parameter affects every ACME Issuer and ClusterIssuer in the cluster, not only the ones of the module.
      The feature is in the alpha stage in cert-manager.
  http01WaitInsteadOfSelfCheck:
    type: string
    pattern: '^(0|[0-9]{1,4}h([0-9]{1,4}m)?([0-9]{1,4}s)?|[0-9]{1,4}m([0-9]{1,4}s)?|[0-9]{1,4}s)$'
    x-examples: ["30s", "2m"]
    description: |
      Time to wait instead of the self-check before asking the ACME server to validate
      an [HTTP-01](https://cert-manager.io/docs/configuration/acme/http01/) challenge.

      Applies to the `letsencrypt` and `letsencrypt-staging` ClusterIssuers, including their Gateway API variants.
      Before asking the ACME server, cert-manager checks that the challenge is reachable from inside the cluster.
      This self-check fails when the cluster cannot reach its own public address,
      for example behind NAT without hairpinning (when you cannot access your external IP address from inside the cluster) or with split-horizon DNS (when the same domain resolves to different IP addresses depending on where the DNS request originated: from inside the cluster or from outside),
      although the ACME server could validate the challenge.
      If the parameter is set, cert-manager skips the self-check and waits for the specified time instead.
      The value `0` asks the ACME server to validate right away and relies on its own retries.

      By default, the self-check is performed.
  certificateRequestMaximumBackoffDuration:
    type: string
    pattern: '^[1-9][0-9]{0,3}h([0-5]?[0-9]m)?$'
    x-examples: ["6h", "1h30m"]
    description: |
      Maximum delay between attempts to issue a certificate after a failed CertificateRequest.

      The delay starts at one hour and doubles after each consecutive failure, but does not exceed this value.
      A lower value makes cert-manager retry sooner once the issuer is available again,
      for example after maintenance of the CA.
      Specify the value in the `<HOURS>h` or `<HOURS>h<MINUTES>m` format, for example `6h` or `1h30m`.
      The number of hours is from 1 to 9999, the number of minutes is from 0 to 59.
      Other notations of the same duration, such as `90m` or `1h30m0s`, are not accepted.

      If the parameter is not set, the cert-manager default of 32 hours applies.
  ingressClassHttp01:
    type: string
    x-examples: ["nginx"]
    description: |
      The name of the `ingressClass` used to confirm ownership of domain using the [ACME HTTP-01](https://cert-manager.io/docs/configuration/acme/http01/) challenges method.
      If the parameter is omitted, the default `ingressClass` is used.

  recursiveSettings:
    type: object
    description: |
      Parameters for using recursive DNS servers, which are used to check the existence of a DNS record, before initiating the domain ownership verification process using the [ACME DNS-01](https://cert-manager.io/docs/configuration/acme/dns01/) method.
    x-examples:
      - nameservers: ["8.8.8.8:53", "https://1.1.1.1"]
        useOnlyRecursive: true
    x-kubernetes-validations:
      - rule: "self.useOnlyRecursive == false || size(self.nameservers) >= 1"
        message: "At least one nameserver must be specified when useOnlyRecursive is true"
    properties:
      nameservers:
        type: array
        description: |
          List of recursive DNS servers (IP:port or HTTPS URLs).
        items:
          type: string
          pattern: "^(?:[0-9]{1,3}(?:\\.[0-9]{1,3}){3}:\\d{1,5}|https?://[^\\s]+)$"
      useOnlyRecursive:
        type: boolean
        description: |
          When set to true, only the specified recursive DNS servers will be used to check for the existence of a record in the DNS before starting the domain ownership verification process.
        default: false
  letsencrypt:
    type: object
    default: {}
    description: |
      Settings for the `letsencrypt` ClusterIssuer.
    properties:
      resources:
        type: object
        default: {}
        description: |
          Resource requests and limits (CPU and memory) for the workload using the `letsencrypt` ClusterIssuer.
        properties:
          requests:
            type: object
            default: {}
            required:
              - cpu
              - memory
            properties:
              cpu:
                oneOf:
                  - type: string
                    pattern: "^[0-9]+m?$"
                  - type: number
                description: |
                  The same as in the pods' `spec.containers.resources.requests.cpu` parameter in Kubernetes.
                type: string
                default: "10m"
              memory:
                description: |
                  The same as in the pods' `spec.containers.resources.requests.memory` parameter in Kubernetes.
                oneOf:
                  - type: string
                    pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                  - type: number
                default: "32Mi"
            description: |
              Resource requests and limits (CPU and memory) for pods that create the `letsencrypt` ClusterIssuer for http01 challenges
          limits:
            type: object
            default: {}
            required:
              - cpu
              - memory
            properties:
              cpu:
                oneOf:
                  - type: string
                    pattern: "^[0-9]+m?$"
                  - type: number
                description: |
                  The same as in the pods' `spec.containers.resources.limits.cpu` parameter in Kubernetes.
                type: string
                default: "50m"
              memory:
                description: |
                  The same as in the pods' `spec.containers.resources.limits.memory` parameter in Kubernetes.
                oneOf:
                  - type: string
                    pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                  - type: number
                default: "64Mi"
        x-examples:
          - requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
  letsencryptStaging:
    type: object
    default: {}
    description: |
      Settings for the `letsencrypt-staging` ClusterIssuer.
    properties:
      resources:
        type: object
        default: {}
        description: |
          Resource requests and limits (CPU and memory) for pods that create the `letsencrypt-staging` ClusterIssuer for http01 challenges.
        properties:
          requests:
            type: object
            default: {}
            required:
              - cpu
              - memory
            properties:
              cpu:
                oneOf:
                  - type: string
                    pattern: "^[0-9]+m?$"
                  - type: number
                description: |
                  The same as in the pods' `spec.containers.resources.requests.cpu` parameter in Kubernetes.
                type: string
                default: "10m"
              memory:
                description: |
                  The same as in the pods' `spec.containers.resources.requests.memory` parameter in Kubernetes.
                oneOf:
                  - type: string
                    pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                  - type: number
                default: "32Mi"
          limits:
            type: object
            default: {}
            required:
              - cpu
              - memory
            properties:
              cpu:
                oneOf:
                  - type: string
                    pattern: "^[0-9]+m?$"
                  - type: number
                description: |
                  The same as in the pods' `spec.containers.resources.limits.cpu` parameter in Kubernetes.
                type: string
                default: "50m"
              memory:
                description: |
                  The same as in the pods' `spec.containers.resources.limits.memory` parameter in Kubernetes.
                oneOf:
                  - type: string
                    pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                  - type: number
                default: "64Mi"
        x-examples:
          - requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
