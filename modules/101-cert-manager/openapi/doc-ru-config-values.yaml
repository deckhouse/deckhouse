description: Обязательных настроек нет.
properties:
  nodeSelector:
    description: |
      Структура, аналогичная `spec.nodeSelector` пода Kubernetes.

      Если значение не указано или указано `false`, будет использоваться [автоматика](https://deckhouse.ru/products/kubernetes-platform/documentation/v1/#выделение-узлов-под-определенный-вид-нагрузки).
  tolerations:
    description: |
      Структура, аналогичная `spec.tolerations` пода Kubernetes.

      Если значение не указано или указано `false`, будет использоваться [автоматика](https://deckhouse.ru/products/kubernetes-platform/documentation/v1/#выделение-узлов-под-определенный-вид-нагрузки).
  highAvailability:
    description: |
      Ручное управление режимом отказоустойчивости.

      По умолчанию режим отказоустойчивости определяется автоматически. [Подробнее](/products/kubernetes-platform/documentation/v1/reference/api/global.html#параметры) про режим отказоустойчивости.
  cloudflareAPIToken:
    description: |
      [API Tokens](https://cert-manager.io/docs/configuration/acme/dns01/cloudflare/#api-tokens) позволяют использовать ключи, привязанные к определенным DNS-зонам.

      Рекомендуется использовать API Tokens для более высокой безопасности, поскольку они имеют более строгие разрешения и могут быть легко отозваны.

      Способ проверки того, что домены, указанные в ресурсе Certificate, для которых заказывается сертификат,
      находятся под управлением `cert-manager` у DNS-провайдера Cloudflare. Проверка происходит путем добавления специальных
      TXT-записей для домена [ACME DNS01 Challenge Provider](https://cert-manager.io/docs/configuration/acme/dns01/).
  cloudflareGlobalAPIKey:
    description: |
      Cloudflare Global API key для управления DNS-записями.

      Способ проверки того, что домены, указанные в ресурсе Certificate, для которых заказывается сертификат,
      находятся под управлением `cert-manager` у DNS-провайдера Cloudflare. Проверка происходит путем добавления специальных
      TXT-записей для домена [ACME DNS01 Challenge Provider](https://cert-manager.io/docs/configuration/acme/dns01/).
  cloudflareEmail:
    description: |
      Почтовый ящик проекта, на который выдавались доступы для управления Cloudflare.
  route53AccessKeyID:
    description: |
      Access Key ID пользователя с необходимыми правами.

      [Amazon Route53 IAM Policy](https://cert-manager.io/docs/configuration/acme/dns01/route53/)
      для управления доменными записями домена.
  route53SecretAccessKey:
    description: |
      Secret Access Key пользователя с необходимыми правами для управления доменными записями домена.
  digitalOceanCredentials:
    description: |
      Access Token от Digital Ocean API, который можно создать в разделе `API`.
  cloudDNSServiceAccount:
    description: |
      Service Account для [Google Cloud](usage.html#заказ-wildcard-сертификата-с-dns-в-google)
      из того же проекта с ролью Администратора DNS.
  yandexFolderID:
    description: |
      Идентификатор каталога [Yandex Cloud](usage.html#заказ-wildcard-сертификата-с-dns-в-yandex-cloud-dns),
      в котором расположена публичная DNS-зона для ACME DNS-01 challenge.

      Задаётся вместе с `yandexServiceAccountJSON`.
  yandexServiceAccountJSON:
    description: |
      Авторизованный ключ сервисного аккаунта Yandex Cloud в формате JSON, закодированный в Base64.
      Сервисному аккаунту нужна роль `dns.editor` (или эквивалентная) на каталог с DNS-зоной.

      Задаётся вместе с `yandexFolderID`.
      Подробности — в разделе [Заказ wildcard-сертификата с DNS в Yandex Cloud DNS](usage.html#заказ-wildcard-сертификата-с-dns-в-yandex-cloud-dns).
  email:
    description: |
      Email проекта, на который LetsEncrypt будет слать уведомления.
  cleanupOrphanSecrets:
    description: |
      Удалять Secret с сертификатом автоматически, если соответствующий ресурс Certificate удален из кластера.
  disableLetsencrypt:
    description: |
      Не создавать ClusterIssuer `letsencrypt` и `letsencrypt-staging` в кластере (если `true`).
  maxConcurrentChallenges:
    description: |
      Максимальное количество одновременных Challenges в статусе `Processing`
  enableCAInjector:
    description: |
      Включить CAInjector вручную.
      По умолчанию CAInjector включается автоматически, когда в кластере обнаруживаются ресурсы с аннотациями для инъекции CA (`cert-manager.io/inject-ca-from`, `cert-manager.io/inject-ca-from-secret`, `cert-manager.io/inject-apiserver-ca`).

  enableListenerSet:
    description: |
      Включить поддержку ListenerSet в cert-manager через feature gate `ListenerSets`.

      Также включает интеграцию ListenerSet для Gateway API, если включена интеграция Gateway API и в кластере установлен CRD ListenerSet, обслуживающий версию `v1`.

      Интеграция Gateway API включается автоматически, если в кластере установлены CRD Gateway и HTTPRoute, обслуживающие версию `v1`.
  enableACMERenewalInfo:
    description: |
      Включить ACME Renewal Information (ARI, [RFC 9773](https://www.rfc-editor.org/rfc/rfc9773))
      через feature gate `ACMEUseARI`.

      С ARI cert-manager запрашивает у ACME-сервера, например Let's Encrypt,
      окно перевыпуска каждого выпущенного им сертификата.
      Если сервер вернул окно, cert-manager перевыпускает сертификат в случайный момент внутри него
      и не учитывает `renewBefore` и `renewBeforePercentage` ресурса Certificate.
      Поэтому перевыпуск может произойти позже, чем требует `renewBefore`.
      Параметр `spec.renewal` ресурса Certificate по-прежнему применяется поверх окна.
      Если сервер не поддерживает ARI или запрос не удался, действует `renewBefore`, как обычно.

      Параметр влияет на все Issuer и ClusterIssuer типа ACME в кластере,
      а не только на созданные модулем.
      В cert-manager функция находится на стадии alpha.
  http01WaitInsteadOfSelfCheck:
    description: |
      Время ожидания вместо самопроверки перед запросом к ACME-серверу
      на проверку Challenge [HTTP-01](https://cert-manager.io/docs/configuration/acme/http01/).

      Применяется к ClusterIssuer `letsencrypt` и `letsencrypt-staging`, включая их варианты для Gateway API.
      Перед запросом к ACME-серверу cert-manager проверяет, что Challenge доступен изнутри кластера.
      Эта самопроверка не проходит, если кластер не может обратиться к своему публичному адресу,
      например из-за NAT без hairpinning (когда изнутри кластера нельзя обратиться к своему внешнему IP) или при split-horizon DNS (когда один и тот же домен резолвится в разные IP-адреса в зависимости от того, откуда пришёл DNS-запрос),
      хотя ACME-сервер смог бы проверить Challenge.
      Если параметр задан, cert-manager пропускает самопроверку и вместо неё ждёт указанное время.
      Значение `0` означает запрос к ACME-серверу сразу, с расчётом на его собственные повторные попытки.

      По умолчанию самопроверка выполняется.
  certificateRequestMaximumBackoffDuration:
    description: |
      Максимальная задержка между попытками выпустить сертификат после неудачного CertificateRequest.

      Задержка начинается с одного часа и удваивается после каждой неудачи подряд,
      но не превышает это значение.
      Меньшее значение позволяет cert-manager быстрее повторить выпуск, когда издатель снова доступен,
      например после обслуживания CA.
      Укажите значение в формате `<ЧАСЫ>h` или `<ЧАСЫ>h<МИНУТЫ>m`, например `6h` или `1h30m`.
      Число часов — от 1 до 9999, число минут — от 0 до 59.
      Другие записи той же длительности, например `90m` или `1h30m0s`, не принимаются.

      Если параметр не задан, действует значение cert-manager по умолчанию — 32 часа.
  ingressClassHttp01:
    type: string
    x-examples: ["nginx"]
    description: |
      Имя `ingressClass` используемого для подтверждения владения доменом методом [ACME HTTP-01](https://cert-manager.io/docs/configuration/acme/http01/).
      Если параметр не указан, то используется `ingressClass` по умолчанию.

  recursiveSettings:
    description: |
      Параметры использования рекурсивных DNS-серверов, которые применяются для проверки существования записи в DNS, перед запуском процесса подтверждения владения доменом методом [ACME DNS-01](https://cert-manager.io/docs/configuration/acme/dns01/).
    x-examples:
      - nameservers: ["8.8.8.8:53", "https://1.1.1.1"]
        useOnlyRecursive: true
    properties:
      nameservers:
        description: |
          Список рекурсивных DNS-серверов (IP:порт или HTTPS-URL).
      useOnlyRecursive:
        description: |
          Если значение true, для проверки существования записи в DNS перед запуском процесса подтверждения владения доменом будут использоваться только указанные рекурсивные DNS-серверы.
  letsencrypt:
    type: object
    description: |
      Настройки для ClusterIssuer `letsencrypt`.
    properties:
      resources:
        description: |
          Настройки ресурсов (requests/limits по CPU и памяти) для подов, создаваемых ClusterIssuer `letsencrypt` для процесса подтверждения владения доменом методом ACME HTTP-01.
          Структура, аналогичная `spec.containers[].resources` пода Kubernetes.  
        properties:
          requests:
            properties:
              cpu:
                description: |
                  Аналогично параметру `spec.containers[].resources.requests.cpu` в Kubernetes.
              memory:
                description: |
                  Аналогично параметру `spec.containers[].resources.requests.memory` в Kubernetes.
          limits:
            properties:
              cpu:
                description: |
                  Аналогично параметру `spec.containers[].resources.requests.cpu` в Kubernetes.
              memory:
                description: |
                  Аналогично параметру `spec.containers[].resources.requests.memory` в Kubernetes.          

  letsencryptStaging:
    description: |
      Настройки для ClusterIssuer `letsencrypt-staging`.
    properties:
      resources:
        description: |
          Настройки ресурсов (requests/limits по CPU и памяти) для подов, создаваемых ClusterIssuer `letsencrypt-staging` для процесса подтверждения владения доменом методом ACME HTTP-01.
          Структура, аналогичная `spec.containers[].resources` пода Kubernetes.  
        properties:
          requests:
            properties:
              cpu:
                description: |
                  Аналогично параметру `spec.containers[].resources.requests.cpu` в Kubernetes.
              memory:
                description: |
                  Аналогично параметру `spec.containers[].resources.requests.memory` в Kubernetes.          

          limits:
            properties:
              cpu:
                description: |
                  Аналогично параметру `spec.containers[].resources.limits.cpu` в Kubernetes.
              memory:
                description: |
                  Аналогично параметру `spec.containers[].resources.limits.memory` в Kubernetes.          

