linters-settings:
  no-cyrillic:
    exclude-rules:
      directories:
        # The RBACv2 templates carry the localized title and description of every role and
        # capability they ship. That is product text, not a source comment: the console shows it
        # to whoever is choosing what to grant, and `d8:namespace-capability:kubernetes:view_logs`
        # on its own tells that person nothing.
        - templates/rbacv2
      files:
        # rbac.yaml carries the same localized texts for the capabilities it declares. dmt skips
        # the file itself from deckhouse/dmt#479 on; drop this line once tools/dmt-lint.sh pins
        # that release.
        - rbac.yaml
  container:
    exclude-rules:
      readiness-probe:
        - kind: Deployment
          name: cainjector
          container: cainjector
        - kind: Deployment
          name: cert-manager
          container: cert-manager
      liveness-probe:
        - kind: Deployment
          name: cainjector
          container: cainjector
