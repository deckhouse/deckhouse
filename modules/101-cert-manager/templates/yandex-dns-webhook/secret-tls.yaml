{{- if include "cert_manager.yandex_dns_webhook_ready" . }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: yandex-dns-webhook-tls
  namespace: d8-cert-manager
  {{- include "helm_lib_module_labels" (list . (dict "app" "yandex-dns-webhook")) | nindent 2 }}
data:
  ca.crt: {{ .Values.certManager.internal.yandexWebhookCert.ca | b64enc }}
  tls.crt: {{ .Values.certManager.internal.yandexWebhookCert.crt | b64enc }}
  tls.key: {{ .Values.certManager.internal.yandexWebhookCert.key | b64enc }}
{{- end }}
