---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: cert-manager-webhook
  annotations:
    {{- /*
      During a CA rotation the bundle trusts both the previous and the new CA, and it has to reach the
      API server before the webhook pods switch certificates, so the configuration must not wait for
      the rollout of the webhook Deployment.
    */}}
    {{- if not .Values.certManager.internal.webhookCert.caRotationInProgress }}
    werf.io/deploy-dependency-deployment: state=ready,kind=Deployment,name=webhook,namespace=d8-cert-manager
    {{- end }}
    werf.io/deploy-dependency-service: state=present,kind=Service,name=cert-manager-webhook,namespace=d8-cert-manager
  {{- include "helm_lib_module_labels" (list . (dict "app" "webhook")) | nindent 2 }}
webhooks:
  - name: webhook.cert-manager.io
    timeoutSeconds: 30
    {{- /*
      The only mutating plugin of the webhook sets the requester identity on a new CertificateRequest
      and returns every other request unchanged. A wider rule sends every status update of the controller
      through one more webhook call, which doubles the admission work when the webhook is short of CPU.
    */}}
    rules:
      - apiGroups:
          - "cert-manager.io"
        apiVersions:
          - "v1"
        operations:
          - CREATE
        resources:
          - "certificaterequests"
    admissionReviewVersions:
    - v1
    # This webhook only accepts v1 cert-manager resources.
    # Equivalent matchPolicy ensures that non-v1 resource requests are sent to
    # this webhook (after the resources have been converted to v1).
    matchPolicy: Equivalent
    failurePolicy: Fail
    # Only include 'sideEffects' field in Kubernetes 1.12+
    sideEffects: None
    clientConfig:
      caBundle: {{ .Values.certManager.internal.webhookCert.caBundle | default .Values.certManager.internal.webhookCert.ca | b64enc }}
      service:
        name: cert-manager-webhook
        namespace: d8-cert-manager
        path: /mutate

