{{- if and (hasKey .Values.certManager "yandexFolderID") (hasKey .Values.certManager "yandexServiceAccountJSON") }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: yandex
  namespace: d8-cert-manager
  {{- include "helm_lib_module_labels" (list . (dict "app" "cert-manager")) | nindent 2 }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
  {{- if .Values.certManager.internal.email }}
    email: "{{ .Values.certManager.internal.email }}"
  {{- end }}
    privateKeySecretRef:
      name: yandex-tls-key
    solvers:
    - dns01:
        webhook:
          groupName: acme.cloud.yandex.com
          solverName: yandex-cloud-dns
          config:
            folder: {{ .Values.certManager.yandexFolderID | quote }}
            serviceAccountSecretRef:
              name: yandex
              key: iamkey.json
{{- end }}
