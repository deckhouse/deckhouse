---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:namespace-capability:cert-manager:admin
  {{- include "helm_lib_module_labels" (list . (dict "rbac.deckhouse.io/aggregate-to-namespace-as" "admin" "rbac.deckhouse.io/capability" "namespace-capability.cert-manager.admin" "rbac.deckhouse.io/kind" "capability" "rbac.deckhouse.io/scope" "namespace")) | nindent 2 }}
  annotations:
    en.meta.deckhouse.io/description: "Manage cert-manager Issuers in a namespace."
    en.meta.deckhouse.io/title: "Module cert-manager: admin"
    ru.meta.deckhouse.io/description: "Управление Issuer модуля cert-manager в пространстве имён."
    ru.meta.deckhouse.io/title: "Модуль cert-manager: администрирование"
rules:
- apiGroups:
  - cert-manager.io
  resources:
  - issuers
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
