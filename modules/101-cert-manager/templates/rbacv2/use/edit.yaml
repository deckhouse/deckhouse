---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:namespace-capability:cert-manager:edit
  {{- include "helm_lib_module_labels" (list . (dict "rbac.deckhouse.io/aggregate-to-namespace-as" "manager" "rbac.deckhouse.io/capability" "namespace-capability.cert-manager.edit" "rbac.deckhouse.io/kind" "capability" "rbac.deckhouse.io/scope" "namespace")) | nindent 2 }}
  annotations:
    en.meta.deckhouse.io/description: "Manage cert-manager resources in a namespace."
    en.meta.deckhouse.io/title: "Module cert-manager: edit"
    ru.meta.deckhouse.io/description: "Управление ресурсами модуля cert-manager в пространстве имён."
    ru.meta.deckhouse.io/title: "Модуль cert-manager: редактирование"
rules:
- apiGroups:
  - acme.cert-manager.io
  resources:
  - challenges
  verbs:
  - delete
  - deletecollection
- apiGroups:
  - acme.cert-manager.io
  resources:
  - orders
  verbs:
  - delete
  - deletecollection
- apiGroups:
  - cert-manager.io
  resources:
  - certificaterequests
  verbs:
  - delete
  - deletecollection
- apiGroups:
  - cert-manager.io
  resources:
  - certificates
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
