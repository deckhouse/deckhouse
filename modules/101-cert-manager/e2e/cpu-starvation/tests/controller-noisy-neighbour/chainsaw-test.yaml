apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cert-manager-controller-noisy-neighbour
spec:
  description: |
    A noisy neighbour takes the CPU of the node that runs the leader of the cert-manager controller.
    The stress pod requests all free allocatable CPU of the node and runs one busy loop per CPU, so
    the controller gets only the tiny share of its own request. A burst of Certificates issued under
    the pressure must become Ready within burstBudgetSeconds. The controller must not restart, must
    keep its lease, must not write more than before the pressure, and must issue Certificates again
    within recoverySeconds after the pressure ends.
  concurrent: false
  timeouts:
    apply: 60s
    assert: 3m
    delete: 5m
    exec: 5m

  # Override with `task run -- --set <name>=<value>`, for example `--set holdSeconds=900`.
  bindings:
    - name: holdSeconds
      value: (to_string($values.holdSeconds || `300`))
    - name: afterSeconds
      value: (to_string($values.afterSeconds || `300`))
    - name: recoverySeconds
      value: (to_string($values.recoverySeconds || `120`))
    - name: threadsFactor
      value: (to_string($values.threadsFactor || `1`))
    # 0 runs all busy loops in one pod; otherwise each stress pod runs threadsPerPod loops.
    - name: threadsPerPod
      value: (to_string($values.threadsPerPod || `0`))
    - name: maxStressPods
      value: (to_string($values.maxStressPods || `100`))
    - name: certificateCount
      value: (to_string($values.certificateCount || `30`))
    - name: burstBudgetSeconds
      value: (to_string($values.burstBudgetSeconds || `900`))
    # A small image with sh and seq, pinned by digest.
    - name: stressImage
      value: ($values.stressImage || 'mirror.gcr.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e')

  steps:
    - name: preflight
      use:
        template: ../common/step-templates/preflight.yaml
        with:
          bindings:
            - name: target
              value: controller

    - name: baseline
      use:
        template: ../common/step-templates/baseline.yaml

    - name: pressure
      use:
        template: ../common/step-templates/pressure.yaml

    - name: release
      use:
        template: ../common/step-templates/release.yaml

    - name: recovery
      use:
        template: ../common/step-templates/recovery.yaml

    - name: after-window
      use:
        template: ../common/step-templates/after-window.yaml

    - name: final-checks
      use:
        template: ../common/step-templates/final-checks.yaml
