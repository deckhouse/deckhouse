# duration 1h is the minimum the webhook accepts. renewBefore 59m schedules the renewal one
# minute after issuance, so the controller renews on its own without cmctl.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: e2e-cm-short-lived
spec:
  secretName: e2e-cm-short-lived-tls
  duration: 1h
  renewBefore: 59m
  dnsNames:
    - short-lived.e2e-cm.example.test
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned
