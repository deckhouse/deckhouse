apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cert-manager-selfsigned-ready
spec:
  description: >-
    A Certificate issued by the ClusterIssuer `selfsigned` becomes Ready within 60 seconds.
    The Secret holds a certificate with the requested DNS and IP subject alternative names,
    signed by the cluster CA `cluster-selfsigned-ca` that the module keeps in
    d8-cert-manager/selfsigned-ca-key-pair, and ca.crt is that very CA certificate.
  concurrent: false

  catch:
    - description: Show Certificates in the test namespace on failure
      get:
        apiVersion: cert-manager.io/v1
        kind: Certificate
    - description: Show CertificateRequests in the test namespace on failure
      get:
        apiVersion: cert-manager.io/v1
        kind: CertificateRequest
    - description: Show events in the test namespace on failure
      events: {}
    - description: Show cert-manager controller logs on failure
      podLogs:
        namespace: d8-cert-manager
        selector: app=cert-manager
        container: cert-manager
        tail: 200

  steps:
    - name: prerequisites
      description: Make sure the module is enabled, converged and its ClusterIssuers are Ready
      use:
        template: ../common/steps/ensure-cert-manager.yaml

    - name: issue-certificate
      description: Create the Certificate and wait until it is Ready
      try:
        - description: Create the Certificate with DNS and IP SANs referencing the ClusterIssuer selfsigned
          create:
            file: manifests/certificate.yaml
        - description: Assert the Certificate is Ready within 60 seconds
          assert:
            timeout: 60s
            resource:
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: e2e-cm-selfsigned
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                    reason: Ready
                revision: 1
        - description: Assert the Secret is of type kubernetes.io/tls and carries the issuer annotations
          assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Secret
              type: kubernetes.io/tls
              metadata:
                name: e2e-cm-selfsigned-tls
                annotations:
                  cert-manager.io/certificate-name: e2e-cm-selfsigned
                  cert-manager.io/issuer-kind: ClusterIssuer
                  cert-manager.io/issuer-name: selfsigned

    - name: inspect-certificate
      description: Check the issued certificate with openssl
      try:
        - description: >-
            Assert tls.crt has the requested SANs, is issued by cluster-selfsigned-ca, verifies against
            ca.crt, and ca.crt equals tls.crt of the module CA Secret
          script:
            timeout: 60s
            env:
              - name: E2E_NS
                value: ($namespace)
            content: >-
              bash ../../tests/common/scripts/check-cert.sh
              --namespace "$E2E_NS" --secret e2e-cm-selfsigned-tls
              --san "DNS:e2e-cm-selfsigned.example.test"
              --san "DNS:alt.e2e-cm-selfsigned.example.test"
              --san "IP Address:192.0.2.10"
              --san "IP Address:198.51.100.20"
              --issuer-cn cluster-selfsigned-ca
              --ca-equals d8-cert-manager/selfsigned-ca-key-pair/tls.crt
              --verify
