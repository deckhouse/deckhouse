apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-cm-metrics-reader
---
# kube-rbac-proxy of the controller authorizes /metrics with these resourceAttributes:
# namespace d8-cert-manager, apps/v1 deployments/prometheus-metrics, name cert-manager, verb get.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-cm-metrics-reader
  namespace: d8-cert-manager
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/prometheus-metrics"]
    resourceNames: ["cert-manager"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-cm-metrics-reader
  namespace: d8-cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-cm-metrics-reader
subjects:
  - kind: ServiceAccount
    name: e2e-cm-metrics-reader
    namespace: ($namespace)
