{{- $commit := include "get_oss_version_by_id" (list "cert-manager-webhook-yandex" $) -}}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: common/distroless
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /webhook
  to: /webhook
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/webhook"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/src" }}
git:
# 3p mirror: yandex-cloud/cert-manager-webhook-yandex
- url: {{ $.SOURCE_REPO }}/yandex-cloud/cert-manager-webhook-yandex.git
  commit: {{ $commit }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
  - rm -rf deploy testdata scripts
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/golang" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
mount:
{{ include "mount points for golang builds" . }}
shell:
  install:
  - cd /src
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
  setup:
  - cd /src
  - GOPROXY=$(cat /run/secrets/GOPROXY) go test ./...
  - GOPROXY=$(cat /run/secrets/GOPROXY) CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w -extldflags "-static"' -o /webhook .
  - chown 64535:64535 /webhook
  - chmod 0700 /webhook
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
