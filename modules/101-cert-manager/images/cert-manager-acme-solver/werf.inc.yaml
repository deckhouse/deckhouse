image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/cert-manager-controller-artifact
  add: /acmesolver-linux-amd64
  to: /bin/acmesolver
  before: setup
imageSpec:
  config:
    entrypoint: ["/bin/acmesolver"]
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
