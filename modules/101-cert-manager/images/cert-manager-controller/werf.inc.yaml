{{- $version := include "get_oss_version_by_id" (list "cert-manager" $ )  -}} # see in oss.yaml
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /controller-linux-amd64
  to: /bin/cert-manager-controller
  before: setup
imageSpec:
  config:
    entrypoint: ["/bin/cert-manager-controller"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $version | replace "." "-" }}
from: {{ index $.Images "builder/src" }}
final: false
git:
- add: /{{ $.ModulePath }}modules/101-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
- add: /{{ $.ModulePath }}modules/101-{{ $.ModuleName }}/crds
  to: /module_crds    
secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}
shell:
  install:
  - git clone -b "v{{ $version }}" --single-branch --depth=1 $(cat /run/secrets/SOURCE_REPO)/jetstack/cert-manager.git /src
  - cd /src
  - git apply /patches/*.patch --verbose --allow-empty
  - git describe --tags --always --match='v*' --abbrev=14 --dirty > VERSION
  - git describe --tags --always --match='v*' --abbrev=0 | grep -q '-' && echo true || echo false > IS_PRERELEASE
  - git rev-parse HEAD > GITCOMMIT
  - git show -s --format=%ct HEAD > GITEPOCH
  - rm -rf /src/.git
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-ci-validator
from: {{ index $.Images "builder/src" }}
final: false
git:
- add: /{{ $.ModulePath }}modules/101-{{ $.ModuleName }}/crds
  to: /module_crds
  stageDependencies:
    install:
    - '**/*'
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact-{{ $version | replace "." "-" }}
  add: /src/deploy/crds
  to: /src/deploy/crds
  before: install
shell:
  beforeInstall:
  - pm install yq
  install:
  # The module CRDs must be the upstream CRDs of this version after update.sh, which injects the Deckhouse
  # additions. The artifact image imports /crds-validated, so werf builds this check before every build of
  # the binaries; a non-final image that nothing imports is never built.
  - |
    echo "Checking if module crds are the same as cert-manager crds"
    DOWNLOAD=false CRD_FILE_PATH=/src/deploy/crds MODULE_VERSION=v{{ $version }} /module_crds/cert-manager/update.sh

    upstream="/src/deploy/crds"
    module="/module_crds/cert-manager"
    failed=0
    if [ "$(cd $upstream && ls *.yaml)" != "$(cd $module && ls *.yaml)" ]; then
      echo "ERROR: the CRD files of the module differ from the upstream ones"
      failed=1
    fi
    for f in $upstream/*.yaml; do
      base=$(basename "$f")
      yq -P 'sort_keys(..)' "$f" > /tmp/upstream.yaml
      yq -P 'sort_keys(..)' "$module/$base" > /tmp/module.yaml || { failed=1; continue; }
      if ! diff /tmp/upstream.yaml /tmp/module.yaml; then
        echo "ERROR: $module/$base differs from the upstream CRD, run crds/cert-manager/update.sh"
        failed=1
      fi
    done
    if [ "$failed" -ne 0 ]; then exit 1; fi
    touch /crds-validated
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
from: {{ index $.Images "builder/golang-1.26" }}
final: false
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-ci-validator
  add: /crds-validated
  to: /crds-validated
  before: install
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact-{{ $version | replace "." "-" }}
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  beforeInstall:
  - pm install jq
  install:
  - export GOPROXY=$(cat /run/secrets/GOPROXY) GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - cd /src
  - export RELEASE_VERSION="v{{ $version }}-flant"
  - export VERSION="$(cat VERSION)" IS_PRERELEASE="$(cat IS_PRERELEASE)" GITCOMMIT="$(cat GITCOMMIT)" GITEPOCH="$(cat GITEPOCH)" CTR=jq
  # The distroless builder has no curl and git. The server targets need neither, so skip the Makefile's required-tools check.
  - |
    {{- $buildContext := deepCopy $ -}}
    {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
    {{- $_ := set $buildContext "BuildCommand" `make missing= _bin/server/controller-linux-amd64 _bin/server/acmesolver-linux-amd64 _bin/server/webhook-linux-amd64 _bin/server/cainjector-linux-amd64` -}}
    {{- include "image-build.build" $buildContext | indent 4 }}
  - cp _bin/server/controller-linux-amd64 _bin/server/acmesolver-linux-amd64 _bin/server/webhook-linux-amd64 _bin/server/cainjector-linux-amd64 /
  - chown 64535:64535 /controller-linux-amd64 /acmesolver-linux-amd64 /webhook-linux-amd64 /cainjector-linux-amd64
  - chmod 700 /controller-linux-amd64 /acmesolver-linux-amd64 /webhook-linux-amd64 /cainjector-linux-amd64


---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName)) }}
