{{- define "local_path_provisioner_helper_spe_name" }}
  {{- $name := printf "helper-%s" . }}
  {{- if gt (len $name) 63 }}
    {{- $name = printf "helper-%s" (sha256sum . | trunc 16) }}
  {{- end }}
  {{- $name }}
{{- end }}

{{- $context := . }}
{{- if and ($context.Values.global.enabledModules | has "admission-policy-engine-crd") $context.Values.localPathProvisioner.internal.localPathProvisioners }}
---
apiVersion: deckhouse.io/v1alpha1
kind: SecurityPolicyException
metadata:
  name: {{ $context.Chart.Name }}
  namespace: d8-{{ $context.Chart.Name }}
  {{- include "helm_lib_module_labels" (list $context (dict "app" "local-path-provisioner")) | nindent 2 }}
spec:
  network:
    hostNetwork:
      allowedValue: true
      metadata:
        description: |
          The provisioner has run in the host network of the master nodes since the module was added,
          and this exception keeps it there. The container only connects to the Kubernetes API
          and does not listen on any port.
  {{- range $localPathProvisioner := $context.Values.localPathProvisioner.internal.localPathProvisioners }}
---
apiVersion: deckhouse.io/v1alpha1
kind: SecurityPolicyException
metadata:
  name: {{ include "local_path_provisioner_helper_spe_name" $localPathProvisioner.name }}
  namespace: d8-{{ $context.Chart.Name }}
  {{- include "helm_lib_module_labels" (list $context (dict "app" "local-path-provisioner")) | nindent 2 }}
spec:
  securityContext:
    runAsNonRoot:
      allowedValue: false
      metadata:
        description: |
          Helper pods of LocalPathProvisioner {{ $localPathProvisioner.name }} run as root: they create and
          remove volume directories under {{ $localPathProvisioner.spec.path }}, which is created on the node by root.
    runAsUser:
      allowedValues:
        - 0
      metadata:
        description: |
          UID 0 owns the root directory of the provisioner on the node.
    capabilities:
      allowedValues:
        add:
          - DAC_OVERRIDE
          - FOWNER
        drop:
          - ALL
      metadata:
        description: |
          On volume deletion the helper removes the whole volume directory, whose contents
          belong to the users of the workload and may be closed to others (DAC_OVERRIDE)
          or sit in sticky directories (FOWNER). All other capabilities are dropped.
  volumes:
    types:
      allowedValues:
        - hostPath
      metadata:
        description: |
          The provisioner mounts the parent directory of the volume into the helper pod to
          create or remove the volume directory on the node.
    hostPath:
      allowedValues:
        - path: {{ printf "%s/" (clean $localPathProvisioner.spec.path | trimSuffix "/") | quote }}
          readOnly: false
          metadata:
            description: |
              Root path of LocalPathProvisioner {{ $localPathProvisioner.name }} exactly as the provisioner mounts it
              into helper pods: the parent directory of the volume, with a trailing slash.
  {{- end }}
{{- end }}
