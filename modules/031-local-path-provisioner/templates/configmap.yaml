{{- $context := . }}
{{- range $localPathProvisioner := $context.Values.localPathProvisioner.internal.localPathProvisioners }}
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ $context.Chart.Name }}-{{ $localPathProvisioner.name }}
  namespace: d8-{{ $context.Chart.Name }}
  {{- include "helm_lib_module_labels" (list $context (dict "app" "local-path-provisioner")) | nindent 2 }}
data:
  {{- $config := dict
        "nodePathMap" (list (dict
          "node" "DEFAULT_PATH_FOR_NON_LISTED_NODES"
          "paths" (list $localPathProvisioner.spec.path)))
        "setupCommand" "/manager"
        "teardownCommand" "/manager" }}
  config.json: {{ $config | toPrettyJson | quote }}

  # we do not use deckhouse user here because root of sc directory was created by root
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
      {{- if $context.Values.global.enabledModules | has "admission-policy-engine-crd" }}
      labels:
        security.deckhouse.io/security-policy-exception: {{ include "local_path_provisioner_helper_spe_name" $localPathProvisioner.name }}
      {{- end }}
    spec:
{{- include "helm_lib_tolerations" (tuple $context "wildcard") | nindent 6 }}
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: helper-pod
        image: {{ include "helm_lib_module_image" (list $context "helper") }}
        imagePullPolicy: IfNotPresent
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - DAC_OVERRIDE
            - FOWNER
      imagePullSecrets:
      - name: deckhouse-registry
{{- end }}
