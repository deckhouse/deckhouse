{{- $localPathProvisionerVersion := "0.0.36"}}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: common/distroless
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /local-path-provisioner
  to: /usr/bin/local-path-provisioner
  after: install
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/usr/bin/local-path-provisioner"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
final: false
from: common/src-artifact
git:
- url: {{ $.SOURCE_REPO }}/rancher/local-path-provisioner.git
  tag: v{{$localPathProvisionerVersion}}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  includePaths:
  - '**/*.patch'
  stageDependencies:
    install:
    - '**/*.patch'
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
  - rm -rf vendor
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/golang" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
mount:
{{ include "mount points for golang builds" . }}
shell:
  install:
  - cd /src
  - GOPROXY=$(cat /run/secrets/GOPROXY) CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.VERSION={{$localPathProvisionerVersion}} -extldflags -static -s -w" -o /local-path-provisioner
  - chown -R 64535:64535 /local-path-provisioner
  - chmod 0700 /local-path-provisioner
