x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    properties:
      proxyAddresses:
        description: |
          Addresses clients connect to. The proxy pods run in the host network,
          so a pod IP is the address of the master node it runs on.
        type: array
        default: []
        items:
          type: string
        x-examples:
          - ["192.168.0.1", "192.168.0.2"]
      proxyCert:
        description: |
          The certificate kube-rbac-proxy serves on port 4219, and the CA that
          signs it. Clients verify the connection against that CA.
        type: object
        default: {}
        properties:
          ca:
            type: string
            x-examples:
              - plainstring
          crt:
            type: string
            x-examples:
              - plainstring
          key:
            type: string
            x-examples:
              - plainstring
      customCertificateData:
        type: object
        properties:
          tls.crt:
            type: string
            x-examples:
              - plainstring
          tls.key:
            type: string
            x-examples:
              - plainstring
          ca.crt:
            type: string
            x-examples:
              - plainstring
