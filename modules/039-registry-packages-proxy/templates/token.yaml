---
apiVersion: v1
kind: Secret
metadata:
  name: registry-packages-proxy-token
  namespace: d8-cloud-instance-manager
  # The app label keeps this Secret inside node-controller's namespace-scoped Secret informer,
  # so a change to the token re-triggers the bashible context assembly that carries it.
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-packages-proxy")) | nindent 2 }}
  annotations:
    kubernetes.io/service-account.name: registry-packages-proxy
type: kubernetes.io/service-account-token
