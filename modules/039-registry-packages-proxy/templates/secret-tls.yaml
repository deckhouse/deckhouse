{{- $cert := .Values.registryPackagesProxy.internal.proxyCert | default dict }}
{{- if and $cert.crt $cert.key }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: registry-packages-proxy-tls
  namespace: d8-cloud-instance-manager
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-packages-proxy")) | nindent 2 }}
data:
  ca.crt: {{ $cert.ca | b64enc }}
  tls.crt: {{ $cert.crt | b64enc }}
  tls.key: {{ $cert.key | b64enc }}
{{- end }}
