{{- if or (.Values.global.discovery.apiVersions | has "deckhouse.io/v1alpha1/SecurityPolicyException") (.Capabilities.APIVersions.Has "deckhouse.io/v1alpha1/SecurityPolicyException") }}
---
apiVersion: deckhouse.io/v1alpha1
kind: SecurityPolicyException
metadata:
  name: registry-packages-proxy
  namespace: d8-cloud-instance-manager
  {{- include "helm_lib_module_labels" (list . (dict "app" "registry-packages-proxy")) | nindent 2 }}
spec:
  network:
    hostNetwork:
      allowedValue: true
      metadata:
        description: |
          Allow registry-packages-proxy to run on the host network
    hostPorts:
      - port: 4219
        protocol: TCP
        metadata:
          description: HTTPS endpoint of registry-packages-proxy exposed through kube-rbac-proxy
      - port: 4282
        protocol: TCP
        metadata:
          description: HTTP endpoint of the package registry proxy server is required to download the rpp-get client during node bootstrap
  volumes:
    types:
      allowedValues:
        - hostPath
      metadata:
        description: |
          The agent's CA is written on the node, outside of any pod, so it cannot be replaced
          with pod-local storage.
    hostPath:
      {{- /*
        `readOnly: true` matches the mount: the exception applies only when its value equals
        the one on the volume mount, so `false` would leave this path unexcepted.
      */}}
      allowedValues:
        - path: /etc/kubernetes/registry-agent/pki
          readOnly: true
          metadata:
            description: |
              CA of the node-local registry agent, which this proxy fetches packages through
              and has to verify.
{{- end }}
