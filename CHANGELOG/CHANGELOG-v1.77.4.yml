chrony:
  fixes:
    - summary: Bump golang.org/x/net in chrony_exporter to fix CVE-2026-78669.
      pull_request: https://fox.flant.com/deckhouse/deckhouse/-/merge_requests/792
cilium-hubble:
  fixes:
    - summary: Fixed known vulnerabilities in the Hubble relay and UI images.
      pull_request: https://fox.flant.com/deckhouse/deckhouse/-/merge_requests/713
cloud-provider-aws:
  fixes:
    - summary: >-
        Allow bootstrapping clusters in AWS regions unknown to the bundled terraform-provider-aws, such
        as `ap-southeast-6`.
      pull_request: https://fox.flant.com/deckhouse/deckhouse/-/merge_requests/832
cloud-provider-dvp:
  fixes:
    - summary: >-
        A DVP cluster migrated to the new provider configuration format keeps its `networkPolicy - None`
        instead of silently switching to `Isolated`.
      pull_request: https://fox.flant.com/deckhouse/deckhouse/-/merge_requests/845
    - summary: >-
        Clusters with `networkPolicy - None` in the provider configuration no longer get NetworkPolicies
        created for LoadBalancer Services.
      pull_request: https://fox.flant.com/deckhouse/deckhouse/-/merge_requests/859
cloud-provider-yandex:
  fixes:
    - summary: >-
        Preemptible nodes are created as preemptible VMs and rotated before the 24h limit when a NodeGroup
        is managed by the CAPI engine.
      pull_request: https://fox.flant.com/deckhouse/deckhouse/-/merge_requests/771
      impact: >-
        Upgrade does not recreate any node. NodeGroups that already have preemptible: true under the CAPI
        engine keep their current regular VMs; Machines created after the upgrade (scale-up, replacement)
        are preemptible, so such NodeGroups run mixed VMs until a full rollout (any rollout-triggering
        InstanceClass change or the manual-rollout-id annotation). Preemptible VMs are rotated every ~20h.
    - summary: >-
        Preemptible nodes are created as preemptible VMs and rotated before the 24h limit when a NodeGroup
        is managed by the CAPI engine.
      pull_request: https://fox.flant.com/deckhouse/deckhouse/-/merge_requests/76
      impact: >-
        NodeGroups that already have preemptible: true under the CAPI engine keep their current regular
        VMs until the next rollout (any rollout-triggering InstanceClass change or manual-rollout-id);
        after that rollout their nodes become preemptible VMs and are rotated every ~20h.
