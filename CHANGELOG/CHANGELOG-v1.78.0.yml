      pull_request: https://github.com/deckhouse/deckhouse/pull/22748
    - summary: Fixed CVEs in the cloud-provider-aws module.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22851
    - summary: Run the csi-node DaemonSet under the dedicated `csi` ServiceAccount instead of `default`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22862
    - summary: >-
        Allow bootstrapping clusters in AWS regions unknown to the bundled terraform-provider-aws, such
        as `ap-southeast-6`.
