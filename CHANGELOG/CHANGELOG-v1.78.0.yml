candi:
  fixes:
    - summary: Bump base images to v4.0.17 and v0.5.88.
ci:
  fixes:
    - summary: Add Fomichev to codeowners for candi/base_images.yml
deckhouse-controller:
  fixes:
    - summary: >-
        Applications take the update mode and update windows only from their own `spec.update`, and update
        notifications only from the `deckhouse` module settings.
      impact: >-
        An application without `spec.update` is updated in the `Manual` mode, so a change of `spec.packageVersion`
        applies at once, without the update windows and notifications of the `deckhouse` module. The `spec.update.blockOnAlerts`
        field is removed from Application.
dhctl:
  fixes:
    - summary: >-
        dhctl opens the SSH connection to the cluster's registry storage only when it needs the storage,
        reaches it with `--ssh-legacy-mode` too, and does so in `terraform check` and in commander converge's
        check.
docs:
  fixes:
    - summary: >-
        Documented automatic application updates and version compatibility rules, including their defaults
        and `upgrade.from`.
global-hooks:
  fixes:
    - summary: >-
        Removed the `applications.update` global parameter; the update settings of an application are
        set only in its `spec.update`.
      impact: >-
        If the `global` ModuleConfig sets `applications.update`, remove the parameter before the update,
        otherwise the global settings fail validation.
multitenancy-manager:
  features:
    - summary: >-
        The ProjectQuota kind is renamed to ProjectQuotaStatus and becomes read-only; the project quota
        is set in Project.spec.quota only.
      impact: >-
        ProjectQuota objects can no longer be created by hand, and the controller is the only writer of
        ProjectQuotaStatus. Setting spec.quota of a Project needs the update verb on projects/quota in
        the deckhouse.io group instead of write access to projectquotas; the manage_quotas capability
        and the ClusterAdmin role grant it. Automatic legacy ProjectQuota objects are retired. Manually
        created legacy ProjectQuota objects are not migrated: their limits stop being enforced, namespace
        quota labels are removed, and the managed d8-project-quota ResourceQuota objects are deleted unless
        the limits are configured in Project.spec.quota. The projects.deckhouse.io/project-quota finalizer
        remains on manual objects and can block their deletion, including garbage collection with their
        Project. Before upgrading, transfer their spec.hard limits to Project.spec.quota and delete the
        manual ProjectQuota objects. If an object is already stuck terminating after the upgrade, preserve
        its limits in Project.spec.quota and manually remove only its projects.deckhouse.io/project-quota
        finalizer.
user-authn:
  features:
    - summary: >-
        The new User field requirePasswordChangeOnFirstLogin makes the user change the initial password
        at the first sign-in.
    - summary: >-
        UserOperation ResetPassword can keep the new password without a forced change at the next sign-in:
        set resetPassword.requirePasswordChange to false.
user-authz:
  fixes:
    - summary: >-
        Allow cluster bootstrap administrators to create Commander ClusterRoles while keeping role content
        validation.
