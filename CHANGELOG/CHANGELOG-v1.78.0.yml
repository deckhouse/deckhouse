cloud-provider-vsphere:
  features:
    - summary: Add custom CA bundle support for vSphere
      pull_request: https://github.com/deckhouse/deckhouse/pull/21245
    - summary: ship capv-controller-manager v1.15.3 with external CRDs and validating webhooks
      impact: >-
        Starting with this release, every newly created vSphere NodeGroup provisions its

        CloudEphemeral nodes via Cluster API (cluster-api-provider-vsphere, CAPV) instead

        of Machine Controller Manager. Existing NodeGroups keep running on MCM until

        explicitly migrated — see the FAQ "How to migrate node groups to Cluster API (CAPI)".


        Required cluster-side prerequisite: the vSphere cluster hosting CAPI nodes must

        have DRS enabled. CAPV relies on DRS for VM placement across hosts; the MCM

        pipeline tolerated clusters without DRS, CAPV does not. The same requirement

        already applied to master and CloudPermanent nodes (provisioned via Terraform).
  fixes:
    - summary: Run the legacy csi-node DaemonSet under the dedicated `csi` ServiceAccount instead of `default`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22862
    - summary: Fixed master node creation when the datastore is set as a path with parent folders.
cloud-provider-yandex:
  features:
    - summary: >-
        Added the `storageClass.provision` parameter, which allows creating additional StorageClasses
        and setting the block size of the disks they provision.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22311
    - summary: Migrated module configuration from YandexClusterConfiguration to ModuleConfig.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21653
      impact: >-
        Cloud provider configuration for DKP clusters deployed in Yandex Cloud needs to be migrated from
        YandexClusterConfiguration to ModuleConfig settings. For migration instructions, refer to "Cluster
        and Infrastructure" in the DKP FAQ.
    - summary: >-
        Validate that `network-ssd-nonreplicated` and `network-ssd-io-m3` disks are sized in multiples
        of 93 GiB.
    - summary: Add ru-central1-f zone support via explicit zone selection with a four-zone limit.
      impact: >-
        Existing clusters are unaffected; the default zone set (ru-central1-a, ru-central1-b, ru-central1-d,
        ru-central1-e) is statically pinned. To use ru-central1-f, list it in `zones` instead of one of
        the default zones; the dropped zone's subnet is replaced by a new subnet in ru-central1-f and
        the nodes in it are recreated.
  fixes:
    - summary: fix target group reconciliation
      pull_request: https://github.com/deckhouse/deckhouse/pull/21900
    - summary: >-
        A Node that cannot be resolved to a Yandex Instance no longer blocks target group synchronization
        for the whole cluster.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22310
    - summary: Fixed CVEs in the cloud-provider-yandex module.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22850
    - summary: Run the csi-node DaemonSet under the dedicated `csi` ServiceAccount instead of `default`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22862
    - summary: fix no-cyrillic exclude rules in cloud provider yandex
      pull_request: https://github.com/deckhouse/deckhouse/pull/23200
    - summary: fix "Address in use" failures when replacing nodes and when removing external IP addresses
      pull_request: https://github.com/deckhouse/deckhouse/pull/22236
    - summary: >-
        The validation webhook reaches the API server directly during cluster bootstrap before the CNI
        is ready.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23340
    - summary: >-
        Restored `additionalSubnets`, `networkType` and VM labels (`nodes.parameters.labels`, `additionalLabels`)
        for CAPI-managed Yandex nodes.
      impact: >-
        Machines are not recreated on update. Machines created before the update keep the standard network
        type and no labels until the NodeGroup is rolled out (change a rolling InstanceClass field or
        set the `manual-rollout-id` annotation on the NodeGroup). Machines stuck in provisioning because
        of `additionalSubnets` become ready without recreation.
    - summary: >-
        Preemptible nodes are created as preemptible VMs and rotated before the 24h limit when a NodeGroup
        is managed by the CAPI engine.
      impact: >-
        NodeGroups that already have preemptible: true under the CAPI engine keep their current regular
        VMs until the next rollout (any rollout-triggering InstanceClass change or manual-rollout-id);
        after that rollout their nodes become preemptible VMs and are rotated every ~20h.
cloud-provider-zvirt:
  features:
    - summary: >-
        The module is configured through ModuleConfig settings, NodeGroups, ZvirtInstanceClasses and a
        credentials Secret instead of ZvirtClusterConfiguration.
      impact: >-
        On clusters configured with `ZvirtClusterConfiguration`, the module keeps working from it and
        prepares the migration resources in the `d8-migration-resources` Secret of the `d8-cloud-provider-zvirt`
        namespace.

        The `D8CloudProviderZvirtMigrationPending` alert fires until these resources are applied; follow
        the alert description to complete the migration.

        The zVirt credentials move to the `d8-credentials` Secret. A validating webhook now checks the
        module ModuleConfig, NodeGroups, ZvirtInstanceClasses and the credentials Secret.

        CCM, CSI, cloud-data-discoverer and capz-controller-manager pods of the module may restart. Existing
        VMs and disks are not recreated.
  fixes:
    - summary: >-
        Prevent capz-controller-manager from crashlooping without diagnostics when zVirt tags cannot be
        created.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22279
    - summary: >-
        Resize the boot disk of a recreated VM, let a replaced VM actually power off, and recreate the
        VM when customNetworkConfig changes.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22926
    - summary: VMs are now actually removed from zVirt on NodeGroup scale-down and cluster destroy
    - summary: >-
        migrate legacy `IsDefault` storage domain key in discovery data to the lowercase `isDefault` before
        schema validation, unblocking Helm sync on clusters upgraded from pre-#13386 versions.
cni-cilium:
  features:
    - summary: Support network.deckhouse.io/networks-spec annotation
      pull_request: https://github.com/deckhouse/deckhouse/pull/21885
    - summary: >-
        Added an alert and a release requirement that block the Cilium update while CiliumNetworkPolicy
        or CiliumClusterwideNetworkPolicy objects use the `fromRequires` or `toRequires` fields.
    - summary: >-
        Added a CVE-2026-98432 mitigation that filters IPv4 TCP SYN packets with IP options in the host
        and pod network namespaces (`ipv4OptionsGuard`; `Enforce` for new clusters, `Audit` for existing
        ones).
      impact: >-
        Cilium agent pods will be restarted. With DSR, the DSR IPv4 option is stripped before the packet
        reaches the pod.
    - summary: Experimental Network Peering feature.
  fixes:
    - summary: Bump cel-go and gopacket dependencies to fix known CVEs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21861
      impact: The cni-cilium components (cilium agent, operator) will restart after the update.
    - summary: Cilium DHCP server is now sends MTU as option, so DHCP clients can apply it for their own
        interfaces
      pull_request: https://github.com/deckhouse/deckhouse/pull/21330
    - summary: >-
        Fix agent-wide deadlock in ipcache label injection and a nil-pointer crash in policy cache under
        identity churn.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22221
      impact: Cilium agent pods are restarted to apply the fixes.
    - summary: fixed private build
      pull_request: https://github.com/deckhouse/deckhouse/pull/22421
    - summary: >-
        Bumped golang.org/x/mod to v0.40.0 and github.com/cilium/ebpf to v0.22.0 (with an eBPF loader
        compat patch) to fix CVE-2026-56864, CVE-2026-56865 and CVE-2026-10722.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22418
    - summary: >-
        Fix cilium-envoy image build failing in airgapped/isolated environments on a missing Rust crate_universe
        dependency.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22600
      impact: >-
        Disable Rust crate repinning and skip Envoy's unused dynamic-modules Rust SDK repo to fix cilium-envoy
        builds in airgapped environments.
    - summary: >-
        Restore cilium-agent startup on nodes with BPF JIT hardening enabled by tolerating ErrRestrictedKernel
        in the eBPF probe.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22627
      impact: cilium-agent pods are restarted on all nodes.
    - summary: Fixed known vulnerabilities in the Cilium images.
      impact: Cilium agent and operator pods will be restarted.
    - summary: Fixed a known vulnerability in the Cilium images.
      impact: Cilium agent and operator pods will be restarted.
    - summary: Fixed file descriptor, connection and lock leaks in Cilium found by static analysis.
    - summary: >-
        Fixed CVE-2026-78661, CVE-2026-97045, CVE-2026-116585, CVE-2026-116586, and CVE-2026-116587 in
        the cilium agent, cilium-operator, safe-agent-updater, and egress-gateway-agent images.
      impact: The Cilium agent pods, cilium-operator, and egress-gateway-agent will restart after the
        update.
    - summary: >-
        The ipv4-options-guard sidecar no longer writes to the host `/etc`, so Cilium agents start on
        Deckhouse Engine nodes.
      impact: Cilium agent pods will be restarted.
cni-flannel:
  features:
    - summary: >-
        Added a CVE-2026-98432 mitigation that filters IPv4 TCP SYN packets with IP options in the host
        and pod network namespaces (`ipv4OptionsGuard`; `Enforce` for new clusters, `Audit` for existing
        ones).
      impact: Flannel pods will be restarted.
  fixes:
    - summary: Bump Go dependencies in the flanneld image to fix known CVEs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21822
      impact: The flanneld component will restart after the update.
    - summary: Fixed known vulnerabilities in the flanneld image.
      impact: cni-flannel pods will be restarted.
    - summary: >-
        The ipv4-options-guard sidecar no longer writes to the host `/etc`, so Flannel pods start on Deckhouse
        Engine nodes.
      impact: Flannel pods will be restarted.
cni-simple-bridge:
  features:
    - summary: >-
        Added a CVE-2026-98432 mitigation that filters IPv4 TCP SYN packets with IP options in the host
        and pod network namespaces (`ipv4OptionsGuard`; `Enforce` for new clusters, `Audit` for existing
        ones).
      impact: simple-bridge pods will be restarted.
  fixes:
    - summary: >-
        Removed the unused pip from the simple-bridge image to fix CVE-2026-1703, CVE-2026-3219, CVE-2026-6357
        and CVE-2026-8643.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22414
    - summary: >-
        The ipv4-options-guard sidecar no longer writes to the host `/etc`, so simple-bridge pods start
        on Deckhouse Engine nodes.
      impact: simple-bridge pods will be restarted.
common:
  features:
    - summary: >-
        Aggregated APIs that opt in with the `scope.deckhouse.io/resources` annotation on their APIService
        support scoped listings (`d8 k get -A --scope`).
      impact: kube-apiserver image is rebuilt; control-plane components restart during the update.
  fixes:
    - summary: fix cve
      pull_request: https://github.com/deckhouse/deckhouse/pull/21817
    - summary: >-
        Bump Go dependencies (cel-go, golang.org/x/net, golang.org/x/text, grpc) in the Kubernetes binaries
        to fix known CVEs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21833
      impact: >-
        The control-plane components (kube-apiserver, kube-controller-manager, kube-scheduler), kubelet,
        and kube-proxy will restart after the update.
    - summary: Projects a user has no access to are hidden instead of being listed to everyone.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21672
      impact: >-
        Applying the change restarts control-plane components.

        Listing projects without RBAC for them now returns the accessible subset instead of 403;

        a project is visible when any of its namespaces is.
    - summary: Fix CVEs in Kubernetes 1.32 control-plane images by updating vulnerable Go dependencies.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22191
    - summary: Prevented system Deployment rollouts from getting stuck during the transition from HA to
        non-HA.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21898
    - summary: >-
        Mask sensitive CRD fields (x-kubernetes-sensitive-data) in create/update/patch responses, not
        only reads.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22198
      impact: x-kubernetes-sensitive-data fix will restarts the kube-apiserver (control-plane) component.
    - summary: Bumped golang.org/x/mod to v0.40.0 in the CoreDNS build to fix CVE-2026-56864 and CVE-2026-56865.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22413
    - summary: >-
        Bump golang.org/x/net, golang.org/x/text, golang.org/x/sys and google.golang.org/grpc in CSI sidecar
        patches to fix the vulnerabilities they carry.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22596
    - summary: >-
        Fixed a kubelet panic when decreasing a container memory limit in place while pod-level memory
        usage stats are unavailable.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22608
    - summary: Add VEX for GO-2026-5932 in kube-rbac-proxy
      pull_request: https://github.com/deckhouse/deckhouse/pull/22806
    - summary: Fix kubelet podSandbox order
      pull_request: https://github.com/deckhouse/deckhouse/pull/23209
    - summary: fixed private build cni-migration-*
      pull_request: https://github.com/deckhouse/deckhouse/pull/23254
    - summary: >-
        kubelet no longer fails to start on an unusable CPU or memory manager checkpoint, and the new
        `D8KubeletCheckpointStateUnpinnedContainers` alert reports containers whose NUMA zone may no longer
        match.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22869
    - summary: Fix CVEs in the `kube-rbac-proxy` image.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23286
    - summary: >-
        Fixed a `kube-apiserver` panic on JSON Patch requests whose `add`/`replace` of the whole document
        or `test` operation lacks the `value` field; such requests are now rejected with a validation
        error.
    - summary: >-
        kube-apiserver returns a single short validation error for an invalid `fieldManager` instead of
        an error for every invalid character.
    - summary: >-
        Bumped CSI sidecars to newer upstream releases and updated `golang.org/x/net`, `golang.org/x/text`
        and `google.golang.org/grpc` in them to fix CVEs.
      impact: CSI controller and node pods of all storage drivers that use the common CSI sidecar images
        restart.
    - summary: >-
        Fix UTF-8 locale initialization and Cyrillic text handling in Deckhouse and installer container
        terminals.
    - summary: Fixed known vulnerabilities in the CNI migration images.
    - summary: >-
        Static pods (control plane, `kubernetes-api-proxy`) are no longer killed by kubelet on a Kubernetes
        minor version change.
      impact: >-
        During the update to this release, kubelet is reinstalled on all nodes and all static pods (`etcd`,
        `kube-apiserver`, `kube-controller-manager`, `kube-scheduler`, `kubernetes-api-proxy`) are restarted
        once without a graceful shutdown; on master nodes this causes an etcd leader election.
    - summary: >-
        Backported kubernetes#129079 to kubelet 1.33-1.36. With `full-pcpus-only`, a kubelet restart no
        longer rejects running pods with `SMTAlignmentError`.
    - summary: >-
        Scoped listings (`d8 k get -A --scope`) get their access boundary from one SelfScopedAccessReview,
        refuse the project scopes without multitenancy-manager, close a watch after 60 seconds without
        a refresh and no longer treat an unlabelled namespace as a project.
      impact: >-
        During the update to this version, while kube-apiserver is already updated and user-authz is not
        yet, scoped lists (`d8 k --scope` and the pages of the web interface that use it) can answer 403
        for a short time for users without a cluster-wide list permission. Administrators are not affected.
        In a cluster where control-plane-manager has a `webhookURL` set by hand to the user-authz webhook
        while `controlPlaneConfigurator` is off, a user limited by a ClusterAuthorizationRule gets 403
        instead of the filtered list. While permission-browser does not answer in time or is overloaded,
        a scoped request of a user without a cluster-wide permission gets 503 with `Retry-After` instead
        of 403; clients based on client-go, `d8 k` included, retry such an answer by themselves.
    - summary: >-
        In `hostNetwork` Pods `hostAliases` now take priority over the node `/etc/hosts`, so manual entries
        on the node no longer shadow them.
      impact: >-
        kubelet will be restarted on every node. Running `hostNetwork` Pods with `hostAliases` get the
        new `/etc/hosts` order after their containers restart.
    - summary: Fixed known vulnerabilities in the cni-migration-controller and cni-migration-init-checker
        images.
      impact: >-
        Pods of the kube-proxy, cni-cilium, cni-flannel, and cni-simple-bridge agent DaemonSets will be
        restarted because their cni-migration-init-checker init container image is updated.
    - summary: Fixed CVE-2026-78661 and CVE-2026-97045 in the CoreDNS image.
      impact: The CoreDNS pods of kube-dns and the node-local-dns DaemonSet pods will restart after the
        update.
    - summary: >-
        A SelfScopedAccessReview result that does not allow the action no longer grants its namespaces
        to scoped listings.
    - summary: >-
        Scoped listings (`d8 k get -A --scope`) of `roles` and `rolebindings` return the objects of the
        allowed namespaces instead of `403 Forbidden`.
      impact: kube-apiserver image is rebuilt; control-plane components restart during the update.
control-plane-manager:
  features:
    - summary: >-
        The cluster Kubernetes version moves from `ClusterConfiguration.kubernetesVersion` to `settings.kubernetesVersion`
        in ModuleConfig `control-plane-manager`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21828
    - summary: >-
        Control-plane components requests are autotuned daily from 7-day average usage instead of a fixed
        split of a combined budget; setting `resourcesRequests.cpu` or `.memory` in ModuleConfig disables
        autotune for that measurement.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21543
      impact: >-
        restart of control-plane static pods (`kube-apiserver`, `etcd`, `kube-controller-manager`, `kube-scheduler`).
    - summary: >-
        Cluster network parameters podSubnetCIDR, serviceSubnetCIDR, podSubnetNodeCIDRPrefix are migrated
        to mc control-plane-manager spec.settings.network; these parameters in `cluster-configuration`
        are deprecated.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22688
    - summary: >-
        `ControlPlaneNode` component conditions are now pod-based; new `<Component>InSync` and `<Component>PodReady`
        conditions, `kubectl get cpn` columns show `<Component>Ready`.
    - summary: >-
        A control plane component is updated on a node only after its new images are pulled there, so
        it no longer stays down while kubelet pulls them.
    - summary: >-
        The `etcd` dashboard is reworked to find the cause of slow `etcd` - disk, network, leader, `kube-apiserver`
        load or page cache.
    - summary: >-
        The basic audit policy logs Pod status updates from kubelet with the request body, so container
        terminations and their reasons get into the audit log.
    - summary: While the cluster does not have enough licenses, `kube-apiserver` adds a warning to API
        responses.
    - summary: >-
        ControlPlaneOperation status shows the diffs of files changed by the operation, except files that
        may contain sensitive data.
    - summary: >-
        kube-scheduler serves a dry-run scheduling endpoint through control-plane-proxy; access is granted
        by RBAC.
      impact: >-
        kube-scheduler restarts once to get the new environment variable. control-plane-proxy runs on
        master nodes also when the prometheus module is disabled. While a simulation runs, real scheduling
        on that replica waits for it.
    - summary: >-
        kube-scheduler exposes metrics of scheduler extender requests and the list of configured extenders,
        named after their KubeSchedulerWebhookConfiguration.
    - summary: >-
        kube-scheduler pauses calls to an ignorable scheduler extender for 30 seconds after 10 failed
        requests in a row.
      impact: >-
        A scheduler extender with `failurePolicy - Ignore` that fails 10 filter or prioritize requests
        in a row gets no filter and prioritize requests for 30 seconds; pods are scheduled without its
        filter and scores meanwhile.
    - summary: >-
        A scheduler extender can receive the pods kube-scheduler placed since its previous prioritize
        call (`sendPlacements` in KubeSchedulerWebhookConfiguration).
    - summary: >-
        kube-scheduler exposes which score plugin or extender decided each node choice, metrics of the
        simulate endpoint, and an opt-in decision log published as `/scheduler/decisions`.
  fixes:
    - summary: Fix kubectl exec through Kubernetes API published with Gateway API.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21680
    - summary: >-
        Fix dhctl bootstrap failing on CSE clusters with 'apiserver.signature Enforce' on control-plane-manager
        moduleConfig
      pull_request: https://github.com/deckhouse/deckhouse/pull/21958
    - summary: >-
        Update Go dependencies of `control-plane-manager` and `etcd` images and record VEX statements
        for `GO-2026-5932`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22122
    - summary: >-
        The publish API certificate hook no longer deletes the active TLS secret (kube-system/kubernetes-tls)
        on deckhouse restart.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21889
    - summary: >-
        Fix the `high-node-utilization` kube-scheduler profile, which spread pods across nodes instead
        of packing them onto the most loaded ones.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22511
      impact: >-
        kube-scheduler will be restarted on all control-plane nodes.


        Pod placement changes only for pods that explicitly set `schedulerName: high-node-utilization`;

        the `default-scheduler` profile is not affected. Pods using this profile must declare resource

        `requests` — the scheduler scores nodes using `NonZeroRequested`, substituting 100m CPU / 200Mi

        memory for containers without requests, which makes bin packing operate on synthetic numbers.
    - summary: Fix CVEs in the `etcd` and `control-plane-manager` images, `etcd` is updated to 3.6.15.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23349
    - summary: >-
        etcd backups on master nodes now start with a 15-minute offset from each other instead of running
        simultaneously.
    - summary: Keep `resource.k8s.io/v1beta1` enabled in `kube-apiserver` 1.34.
    - summary: >-
        In multi-master clusters kube-apiserver keeps serving for 15s after it is asked to stop, so clients
        move to other masters without errors during control-plane rollouts.
      impact: kube-apiserver restarts once on every master of a multi-master cluster.
    - summary: >-
        In multi-master clusters a kube-apiserver restart or crash no longer moves the kube-controller-manager
        and kube-scheduler leaders to another master; their leader lease is 30s.
      impact: kube-controller-manager and kube-scheduler restart once on every master of a multi-master
        cluster.
    - summary: >-
        In multi-master clusters control-plane-manager restarts one kube-apiserver at a time (a minority
        of masters), waits for it to be ready, updates kube-controller-manager and kube-scheduler only
        after all kube-apiservers, and restarts their leaders last.
    - summary: >-
        Disabled kube-scheduler profiling, which stayed enabled because the `--profiling=false` flag is
        ignored when the scheduler starts with `--config`.
      impact: >-
        Kube-scheduler stops serving `/debug/pprof/*` on port 10259 and no longer calls `runtime.SetBlockProfileRate(1)`.
        The scheduler static pod restarts once after the update.
    - summary: Fixed `check_etcd_peer_urls` picking a wrong etcd Pod and blocking the `main` queue.
    - summary: Updated Go dependencies of Kubernetes control plane components to fix known vulnerabilities.
      impact: Control plane components and kubelet will be restarted.
    - summary: >-
        In clusters with an etcd arbiter, `control-plane-manager` moves the etcd leadership to a master
        before it restarts the etcd leader, instead of letting it pass to the arbiter.
    - summary: >-
        The cluster-wide controllers of `control-plane-manager` run in a single pod regardless of the
        `highAvailability` setting or an etcd arbiter.
    - summary: kube-apiserver no longer rejects Dex tokens without the `name` claim.
      impact: kube-apiserver restarts on every master.
    - summary: >-
        Control plane components are no longer restarted in parallel when a node is NotReady or after
        a certificate renewal.
    - summary: >-
        Fixed a Deckhouse crash caused by a helm release `Secret` or `ConfigMap` with too short release
        data.
    - summary: removed unused executable files from the etcd-backup image
    - summary: Preserve etcd learners while new control-plane nodes are joining.
    - summary: >-
        In CSE, `availableVersions` in `d8-cluster-kubernetes` lists only Kubernetes versions that can
        be set.
    - summary: >-
        The requests of `kubernetes-api-proxy` no longer go to the authorization webhook, so the proxy
        does not mark a working kube-apiserver as not ready and keeps its list of upstreams up to date
        when the webhook is unavailable.
      impact: >-
        In clusters with the authorization webhook (`user-authz` multitenancy or `apiserver.authz.webhookURL`),
        kube-apiserver restarts on the master nodes to apply the new authorization configuration.
    - summary: >-
        The basic audit policy records an exec into a pod (`pods/exec`) in all namespaces again, as it
        did before Deckhouse 1.77.
    - summary: >-
        The `D8ControlPlaneComponentsResourcesInsufficientCapacity` alert now resolves once control-plane
        components no longer need a raise.
    - summary: Fixed a goroutine leak in the helm release deprecation scan when listing releases fails.
    - summary: >-
        The basic audit policy no longer writes kube-apiserver health probes (`/readyz`, `/livez`, `/healthz`)
        to the audit log. Requests to these paths that fail authentication are still logged.
      impact: >-
        With `basicAuditPolicyEnabled` (the default), authenticated and anonymous requests to `/readyz`,
        `/livez`, `/healthz` and their subpaths are not audited, even when a custom policy in the `audit-policy`
        Secret logs all requests. To audit these requests, disable `basicAuditPolicyEnabled` and define
        the full policy in the Secret. The kube-apiserver pods restart to apply the new policy.
    - summary: >-
        Updated go-jose, x/net and klauspost/compress in control plane components to fix known vulnerabilities.
      impact: >-
        Control plane components (kube-apiserver, kube-controller-manager, kube-scheduler, etcd) and kubelet
        will be restarted.
    - summary: Fixed the etcd backup job failing on missing gawk libraries.
    - summary: >-
        Only Deckhouse components may set `resource-quota-overrides.deckhouse.io/*` labels in Pod and
        PVC templates of workload controllers, so these labels no longer let users bypass ResourceQuota.
    - summary: Prevent unsupported feature gates from blocking staged Kubernetes upgrades.
    - summary: >-
        Added the `d8_module` label to etcd, kube-apiserver, kube-controller-manager, kube-scheduler and
        certificate alerts, so the console shows them among control plane alerts.
    - summary: Fixed ControlPlaneOperation failures on clusters whose root CAs have a non-default subject.
csi-vsphere:
  features:
    - summary: >-
        Adds Pod Security Standards labels and SecurityPolicyExceptions for CSI pods, and makes cloud-data-discoverer
        compliant with the restricted policy; CSI and cloud-data-discoverer pods restart once on upgrade.
  fixes:
    - summary: Run the legacy csi-node DaemonSet under the dedicated `csi` ServiceAccount instead of `default`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22862
deckhouse:
  features:
    - summary: >-
        Add a registry image availability command to the DeckhouseModuleUpdatingFailedModuleIsNotValid
        alert description.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21544
    - summary: Make packages nelm operation timeout configurable
      pull_request: https://github.com/deckhouse/deckhouse/pull/21604
    - summary: >-
        Propagate ModuleConfig settings, enabled intent and maintenance mode to the modulev2 package runtime.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21725
    - summary: Implement module v2 controller.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21857
    - summary: Add ModulePackage and ModulePackageVersion CRDs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21992
    - summary: expose module CRD GVKs as Platform.capabilities
      pull_request: https://github.com/deckhouse/deckhouse/pull/21961
    - summary: The `d8a5e-` object name prefix is reserved for the ansible module.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22411
    - summary: >-
        Read a legacy module's versions from its release history and stop at images without a module definition
      pull_request: https://github.com/deckhouse/deckhouse/pull/22246
    - summary: >-
        Package repository scan records the versions release channels point to in ModulePackage and ApplicationPackage
        status
      pull_request: https://github.com/deckhouse/deckhouse/pull/22671
    - summary: Enable Pod Security Standards restricted checks in warn mode on the d8-monitoring namespace.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22024
    - summary: Added repositoryName to usedBy for AP/MP.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22749
    - summary: >-
        Added the experimental `enableModuleV2` setting, which turns on the Module v2 controller and installs
        the Module v2 CRD.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23273
    - summary: The package runtime publishes hook metrics of applications and modules on `/metrics/hooks`.
    - summary: >-
        With `enableModuleV2`, deckhouse-controller runs modules on the package runtime without starting
        addon-operator.
    - summary: The last iteration of switching to modulev2.
    - summary: Auto-restart kubelet on resources added by hotplug
    - summary: Application.spec.resourceRequests is now honoured by default.
      impact: >-
        An Application that declares `spec.resourceRequests` is now installed from a chart

        rendered with the requested replicas and container resources applied, instead of

        from the package chart directly. Applications without `resourceRequests`, and all

        modules, are unaffected. Updating restarts the deckhouse Deployment.
    - summary: >-
        Packages can declare upgrade and downgrade compatibility limits; the Application webhook rejects
        incompatible version changes, with defaults allowing patch changes and upgrades to the next minor
        version.
    - summary: A ValidationWebhook handler can return several warnings.
    - summary: Makes CCM create NPs on every lb creation while using networkPolicy - Restricted
    - summary: >-
        Applications (and modules with EnableModuleV2) run on a new package engine that keeps the running
        version during updates, applies update windows to applications and does not reinstall packages
        on restart.
    - summary: >-
        webhook-handler runs Python webhooks on a long-lived interpreter, a request takes about 4 ms instead
        of 24-32 ms.
    - summary: Support application settings conversions.
    - summary: >-
        The package engine exports addon-operator's hook, helm, convergence and kube events metrics, traces
        package startup per hook, and converges faster.
    - summary: >-
        Applications in the `Auto` and `AutoPatch` update modes are updated automatically along a chain
        of compatible versions; the plan and the next version are shown in `status.update`.
    - summary: Migrated package release management to nelm v2 while keeping the v1 install and delete
        behaviour.
    - summary: The update plan of an Application is shown in its status in every update mode, including
        Manual.
    - summary: Modules enabled by the edition bundle are created automatically with their latest available
        version.
    - summary: >-
        With the experimental Module v2 enabled, `v1alpha1` Modules are served with basic properties,
        phase and conditions converted from `v1beta1`.
    - summary: >-
        Users can edit one-time credential Secrets of applications marked with the `packages.deckhouse.io/initial-secret`
        label.
    - summary: The `d8vt-` object name prefix is reserved for the virtualization-transfer module.
    - summary: >-
        Application replica overrides are refused for workloads annotated with `packages.deckhouse.io/scale-disabled`
        or `packages.deckhouse.io/scale-down-disabled`, reported under the `ScalingForbidden` reason.
    - summary: >-
        Deleting an application whose package requires disable confirmation now needs the `packages.deckhouse.io/allow-disabling`
        annotation; with Module v2 modules use the same annotation, which is removed once the module is
        disabled.
      impact: >-
        With Module v2 enabled, disabling a module that requires confirmation needs `packages.deckhouse.io/allow-disabling`
        instead of `modules.deckhouse.io/allow-disabling`.
    - summary: >-
        With the new package engine, a module runs from a registry tag set by the `packages.deckhouse.io/dev-tag`
        annotation; existing ModulePullOverrides are migrated to it.
    - summary: >-
        The `spec.resourceRequests` values of an Application are also applied to the HorizontalPodAutoscaler
        and VerticalPodAutoscaler deployed for the workload, so the autoscalers no longer override them.
    - summary: >-
        Application `status.urls` now includes endpoints of HTTPRoutes annotated with `packages.deckhouse.io/application-endpoint-description`.
    - summary: >-
        Application `spec.resourceRequests` accepts autoscaling ranges (`minReplicas`/`maxReplicas` and
        container `min`/`max`) that the package's HorizontalPodAutoscaler and VerticalPodAutoscaler apply;
        a range without an autoscaler falls back to fixed values and raises an alert.
    - summary: >-
        Added the `D8DeckhouseModuleImageDownloadInterrupted` alert that fires when the download of a
        module image is interrupted.
    - summary: >-
        Application packages can be granted to projects with ClusterResourceGrantPolicy; a project sees
        the packages available to it, and an Application of any other package is rejected.
      impact: >-
        With the `multitenancy-manager` module enabled, its webhooks check Application objects in project
        namespaces. While the module controller is unavailable, Application objects in project namespaces
        cannot be created or changed.
    - summary: Every authenticated user can read ApplicationPackageVersion objects.
    - summary: >-
        With the package runtime enabled, module settings are configured in the Module resource; ModuleConfig
        becomes a read-only mirror of it.
    - summary: >-
        With the package runtime enabled, a module moved out of the Deckhouse image keeps running from
        the deckhouse-modules repository after the upgrade.
    - summary: Module v2 gets its own Grafana dashboard and last-run, phase and hook lane metrics.
      impact: >-
        With enableModuleV2 the hook run metrics are labelled by package instead of module, and the task
        queue, compaction and helm operation metrics are no longer exported.
  fixes:
    - summary: ensure embedded modules keep the Embedded source
      pull_request: https://github.com/deckhouse/deckhouse/pull/21597
    - summary: Fix concurrent map write crash on controller startup during parallel embedded module load.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21539
    - summary: >-
        Skip the multiple CNI check in the enable_cni hook while a CNI migration is in progress to avoid
        a stuck Deckhouse queue.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21714
    - summary: Locate CRDs by repository contents.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21789
    - summary: explain which requirement is unmet when an Application is rejected
      pull_request: https://github.com/deckhouse/deckhouse/pull/21843
    - summary: Stop false drift detection reinstalling packages with helm hooks
      pull_request: https://github.com/deckhouse/deckhouse/pull/21836
    - summary: An unset `settings.update.mode` now defaults to `AutoPatch` instead of silently running
        as `Auto`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21903
    - summary: >-
        Fix a minor Deckhouse release being auto-applied as a patch when no Deployed release object is
        present.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21909
    - summary: limit the impact of a failed documentation build
      pull_request: https://github.com/deckhouse/deckhouse/pull/21968
    - summary: >-
        rename the application endpoint Ingress annotation to packages.deckhouse.io/application-endpoint-description
      pull_request: https://github.com/deckhouse/deckhouse/pull/22008
    - summary: Surface layer read errors instead of extracting a truncated image
      pull_request: https://github.com/deckhouse/deckhouse/pull/21915
    - summary: Do not inject source registry into a still-embedded module
      pull_request: https://github.com/deckhouse/deckhouse/pull/22035
    - summary: Prevent NELM resource monitor reflector retries and handle resource namespaces correctly.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22086
    - summary: Add verbosity to veritysetup format and delete damaged hash.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22127
    - summary: prefix application hook objects with d8a-
      pull_request: https://github.com/deckhouse/deckhouse/pull/22121
    - summary: fix values validation failing on the injected registry
      pull_request: https://github.com/deckhouse/deckhouse/pull/22165
    - summary: Accept YAML booleans in string-typed package manifest requirements.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22202
    - summary: Keep the initial scan full until a repository has been scanned through
      pull_request: https://github.com/deckhouse/deckhouse/pull/22090
    - summary: Fix RBAC permissions for deckhouse user.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22238
    - summary: >-
        Objects labeled `heritage: deckhouse` can no longer be modified by attaching changes to the pod
        template restart annotation or to a ModuleSource scan interval change.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22257
    - summary: Delete stale documentation for embedded modules.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22253
    - summary: fix the usedBy leak when deleting an application without owner references
      pull_request: https://github.com/deckhouse/deckhouse/pull/22276
    - summary: Forbid Application instance names longer than 32 characters
      pull_request: https://github.com/deckhouse/deckhouse/pull/22370
    - summary: bump addon-operator to run the module startup phase unconditionally
      pull_request: https://github.com/deckhouse/deckhouse/pull/22400
    - summary: Validate Application settings against the target package version during version updates.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22445
    - summary: >-
        The reserved public hosts policies no longer make every aggregated apiserver in the cluster watch
        all ConfigMaps, which left permission-browser-apiserver permanently unready and stopped namespace
        deletion cluster-wide.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22444
    - summary: Fix nelm tracking.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22541
    - summary: Guard PodMonitors on CRD availability.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22498
    - summary: Forbid Application instance names longer than 24 characters
      pull_request: https://github.com/deckhouse/deckhouse/pull/22528
    - summary: Fix nelm tracking for applications and modules.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22626
    - summary: Ensure module conversion webhooks before applying module Helm releases.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22602
    - summary: validate the hardlink target when extracting module and package images
      pull_request: https://github.com/deckhouse/deckhouse/pull/22628
    - summary: Fix an empty package status after a successful install
      pull_request: https://github.com/deckhouse/deckhouse/pull/22504
    - summary: Fix ModuleConfig admission rejecting a module with a disabled conditional dependency
      pull_request: https://github.com/deckhouse/deckhouse/pull/22640
    - summary: Gate the package status summary on the workload health report
      pull_request: https://github.com/deckhouse/deckhouse/pull/22714
    - summary: surface the cause of a canceled package run
      pull_request: https://github.com/deckhouse/deckhouse/pull/22315
    - summary: Exclude all Python test files from webhook image.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22778
    - summary: surface the cause of a timed-out package install
      pull_request: https://github.com/deckhouse/deckhouse/pull/22549
    - summary: Gate the module status summary on the workload health report
      pull_request: https://github.com/deckhouse/deckhouse/pull/22784
    - summary: >-
        The ModulePullOverride `modules.deckhouse.io/renew` annotation now forces a module to be re-pulled
        and redeployed even when its image digest is unchanged.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22716
    - summary: >-
        Configure the d8-system and d8-monitoring namespaces with the privileged Pod Security enforcement
        level.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22795
      impact: >-
        The d8-system and d8-monitoring namespaces will use the privileged Kubernetes Pod Security enforcement
        level. Access to create workloads in these namespaces must remain restricted.
    - summary: Keep `x-kubernetes-sensitive-data` on CRDs that have a conversion webhook.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22814
    - summary: >-
        Resolve container images of embedded module packages against the platform registry instead of
        the package repository.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22668
    - summary: >-
        Apply the settings conversion chain to a ModuleConfig that omits spec.version, instead of skipping
        it.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22668
    - summary: >-
        Default reservedPublicHosts.mode to List; Template no longer covers publicDomainTemplate values
        where %s is only a prefix of the first label.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22532
      impact: >-
        Clusters that never set mode now reserve only the platform service hostnames. Set mode Template
        for the wider reservation. A publicDomainTemplate like %s-cluster.example.com stays on List even
        if Template is asked for. kube-%s.example.com stays Template when Template is set.
    - summary: Allow editing and deleting the resources of an application under maintenance.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23107
    - summary: >-
        The `DeckhouseUpdatingFailed` alert no longer renders an empty version, and `ModuleConfigObsoleteVersion`
        now reports both the current and the latest settings schema version.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23187
    - summary: >-
        Module and Application status conditions now re-sync periodically, so a stale Scaled condition
        is repaired automatically instead of persisting until the workload changes.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23165
    - summary: set releaseChannel in CSE
      pull_request: https://github.com/deckhouse/deckhouse/pull/23221
    - summary: Fix setting Scaled before Installed.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23246
    - summary: >-
        The `Managed` condition of applications and modules becomes `False` with the `NoResourceReconciliation`
        reason once maintenance mode is applied.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23377
    - summary: Remove leftover symlink-backend entries when deploying packages with the erofs backend.
    - summary: Fix random startup failures with 'waitid - no child processes' when restoring erofs modules.
    - summary: Fix CVEs in deckhouse-cli.
    - summary: Update d8 CLI and operator dependencies to address known vulnerabilities
    - summary: Restore kubectl plugin lookup in d8 k and d8 kubectl
    - summary: Fix render modules` webhooks.
    - summary: >-
        Package schemas in `ApplicationPackageVersion` and `ModulePackageVersion` status are now tracked
        atomically, which keeps `managedFields` small.
    - summary: Fix package current version.
    - summary: Update runtime libraries and VEX exceptions for known vulnerabilities
    - summary: Bump containerd to v2.2.10 and dependencies to fix CVEs
    - summary: >-
        Templates that only mention ConversionWebhook (e.g. in a comment) are no longer rendered ahead
        of module hooks.
    - summary: Fixed rendering of embedded modules with Module v2 enabled after the switch to nelm v2.
    - summary: Wait for kube events.
    - summary: >-
        Fixed deletion of load balancers backed by ServiceWithHealthchecks, which failed because the child
        Service is protected by the `heritage - deckhouse` label in the parent cluster.
    - summary: >-
        The upgrade compatibility rules of a package version now limit how far it may be upgraded from,
        and a manual version change of an Application is checked from the running version, so no release
        and its migrations are skipped.
    - summary: >-
        Restore ClusterAdmin read access to ModuleSettingsDefinition so the console can show module settings
        again.
    - summary: Forbid scaling applications resources.
    - summary: Show the Terminating phase while package repositories are being deleted
    - summary: >-
        Exec, attach, port-forward and debug into Pods labeled `heritage: deckhouse`, and scaling Deployments,
        StatefulSets, ReplicaSets and ReplicationControllers with that label, are now denied for everyone
        but system users.
      impact: >-
        Users who run `kubectl exec`, `attach`, `cp`, `port-forward` or `debug` against Pods labeled `heritage:
        deckhouse`, or `kubectl scale` against Deployments, StatefulSets, ReplicaSets or ReplicationControllers
        labeled `heritage: deckhouse`, are now denied in every namespace, cluster administrators and superadmins
        included; only system users and the `system:masters` group (`super-admin.conf`) are exempt. Objects
        under maintenance can still be scaled. While webhook-handler is unavailable, these operations
        are denied for every target to everyone but the exempt users. Use `system:sudouser` where such
        access is needed.
    - summary: Update runtime dependencies and document unaffected vulnerability paths.
    - summary: >-
        Fixed a memory leak in webhook-handler, which kept the kubernetes monitors of replaced hooks running
        after every hook reload.
    - summary: >-
        With the package runtime enabled, the Helm release of a module removed from Deckhouse is deleted
        on start.
    - summary: >-
        A module whose deployed ModuleRelease is deleted is now shown as not installed instead of keeping
        the Ready status and the version of the removed release.
deckhouse-controller:
  features:
    - summary: Added a minor version filter for partial scanning of package versions.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22079
    - summary: Pre-create package repositories and module package versions from the old module stack at
        startup
      pull_request: https://github.com/deckhouse/deckhouse/pull/22467
    - summary: >-
        Add the `x-deckhouse-immutable` OpenAPI extension to mark settings fields as editable only at
        application creation.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22876
    - summary: >-
        Add the `x-deckhouse-ui-group` OpenAPI extension to render a settings field inside a named group
        in the web console form.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22975
    - summary: >-
        Gate the startup sync of module sources and releases into package objects behind DECKHOUSE_ENABLE_MODULE_PACKAGE_SYNC
      pull_request: https://github.com/deckhouse/deckhouse/pull/22941
    - summary: Validate x-deckhouse-immutable
      pull_request: https://github.com/deckhouse/deckhouse/pull/22933
    - summary: Fill Module v1alpha2 objects from the cluster resources under the package sync feature
        flag.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22981
    - summary: >-
        ModuleSource scans skip unchanged release channels using a cheap registry HEAD request instead
        of pulling the whole release image every cycle.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22475
    - summary: >-
        Per-workload replicas and container resources of an application can be overridden via `Application.spec.resourceRequests`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23099
    - summary: >-
        Add the x-deckhouse-enum-switch-settings extension to package settings schemas, letting module
        authors declare confirmation dialogs for oneOf discriminator switches.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23265
    - summary: >-
        When an Application is deleted, Deckhouse also deletes the objects of the kinds listed in the
        package's `orphanResources` value that the application left in its namespace.
    - summary: >-
        Added the `spec.update` parameter of the Application resource and the resolution of the application
        update settings.
    - summary: >-
        Application.spec.resourceRequests is applied via nelm render patches, and the release is installed
        from the package's own chart instead of a rebuilt one.
    - summary: >-
        Application package settings schemas support the x-deckhouse-ui-text-area and x-deckhouse-ui-secure-field
        UI marks.
    - summary: >-
        Built-in cluster licensing: the cluster checks the installed license key, covers the nodes by
        servers, cores and vCPU, and publishes the license state in EffectiveLicense/deckhouse-platform.
      impact: >-
        New cluster-scoped CRDs ClusterLicense and EffectiveLicense, d8_license_* metrics and five D8License*
        alerts. Nothing is blocked. CE has no licensing; FE turns it on with the annotation licensing.deckhouse.io/enabled
        on ModuleConfig/deckhouse.
    - summary: >-
        An Application ServiceAccount with the `packages.deckhouse.io/application-endpoint-description`
        annotation adds the in-cluster Kubernetes API address to `status.urls`.
    - summary: >-
        An application package version can set `versionCompatibilityRules.upgrade.from` in `package.yaml`,
        a SemVer constraint on the versions an Application may be upgraded to it from; the constraint
        takes priority over the `step` limits, and an invalid one forbids upgrading to the version.
    - summary: >-
        Under Module v2, readiness hooks no longer erase the Module status; a failed readiness probe sets
        `Ready=False` with reason `ReadinessProbeFailed` and marks the module `Degraded`.
  fixes:
    - summary: ModuleDocumentation will not be created for embedded modules.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21662
    - summary: Module releases rendered with nelm no longer raise false absent-resource alerts.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21796
    - summary: >-
        nelm now takes over fields left by the old Helm 3 engine, so stale fields get removed on module
        upgrade.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21796
    - summary: Restore pre-migration ClusterConfiguration defaultCRI validation (part of the
      pull_request: https://github.com/deckhouse/deckhouse/pull/21830
    - summary: >-
        The module-documentation build request timeout to docs-builder is configurable via DOCUMENTATION_BUILD_TIMEOUT
        (default 120s) instead of a fixed 10s that canceled healthy full-site builds.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22237
    - summary: Fixed a bug when PackageRepository always used a HTTPS scheme.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22481
    - summary: >-
        Honor a channel-level release suspend for clusters that reach the suspended version through a
        step-by-step update.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22656
      impact: >-
        A Deckhouse release suspended on its release channel is no longer applied by clusters that are
        behind and reach it through a step-by-step update. The suspend flag lives only in the release-channel
        image; previously it was dropped when the target release was built from its per-version image,
        so lagging clusters updated to a suspended release anyway.
    - summary: >-
        A failed package repository scan now reports a clear reason and puts the repository into phase
        `Error` instead of showing a raw error under `Active`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23044
    - summary: >-
        Stop the module source registry fan-out from replaying and flooding the main queue with duplicate
        moduleRun tasks.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23112
    - summary: >-
        Do not commit the package repository registry checksum when no application could be annotated,
        which left them all on stale registry settings.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23112
    - summary: >-
        Deleting an Application now also deletes objects with the `werf.io/ownership: anyone` annotation,
        such as Jobs deployed only on install, if the package lists their kinds in `orphanResources`.
    - summary: A module enabled in the bundle is no longer disabled when its ModuleConfig does not set
        `enabled`.
    - summary: Module sources now scan the registry every 30 minutes by default, reducing registry load
    - summary: >-
        Fixed the first release of a module getting stuck in `Pending` waiting for manual approval after
        an interrupted deploy.
    - summary: >-
        Prevent module hooks from running with unavailable snapshots while waiting for Deckhouse to restart
        after a module update
    - summary: Ignore auxiliary files when loading settings conversions and support versioned .yaml and
        .yml files.
    - summary: >-
        A pending module release no longer loses its Kubernetes, Deckhouse and module requirements, so
        an update that the cluster does not satisfy stays pending instead of disabling the module.
    - summary: >-
        Licensing names a license key from another issuer and a record for another cluster key with their
        own reasons: WrongIssuer, ClusterKeyMismatch and ClusterKeyMissing.
      impact: >-
        ClusterLicense gets the field status.issuer and two new record reasons. Records that were ClusterMismatch
        because of a cluster key now report ClusterKeyMismatch or ClusterKeyMissing.
    - summary: >-
        Fixed Deckhouse startup hanging or crash-looping when a module image download is interrupted or
        a partially built erofs image is left on the node.
    - summary: >-
        A license key whose records have all expired stays accepted in ClusterLicense status.accepted,
        as the field is documented.
      impact: ClusterLicense status.accepted and the Accepted column of an expired key change from false
        to true.
    - summary: >-
        The `change-registry` helper works again when run in the deckhouse pod as documented, and when
        the `registry` module is in the `Unmanaged` mode; in the `Managed` mode it refuses and explains
        how to change the registry in the `registry` ModuleConfig.
    - summary: >-
        A license key that starts after a break no longer counts as the key in force: the license validity
        date and the expiry warning follow the current key, and during the break the key that expired
        last is shown.
descheduler:
  features:
    - summary: Always run the descheduler with the upstream `EvictionsInBackground` feature gate enabled.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22794
      impact: >-
        The `descheduler` Deployment in `d8-descheduler` restarts once on upgrade to pick up the new argument.
        Descheduling behavior is unchanged for workloads that do not implement their own eviction policy.
    - summary: >-
        Added the `protectedStorageClasses` parameter to the Descheduler custom resource, which forbids
        evicting Pods that use a PersistentVolumeClaim from the listed StorageClasses.
    - summary: >-
        The LowNodeUtilization strategy of a Descheduler can count thresholds from the average node utilization
        (`useDeviationThresholds`) and limit evictions per node (`evictionLimits.node`).
    - summary: LowNodeUtilization evicts a pod only if kube-scheduler would place it on an underutilized
        node.
      impact: >-
        On clusters where control-plane-manager runs kube-scheduler, LowNodeUtilization skips pods whose
        target node is not underutilized, and pauses evictions while kube-scheduler does not answer.
  fixes:
    - summary: bump cel-go to v0.29.0 and add a vex statement for the unmaintained x/crypto/openpgp package
      pull_request: https://github.com/deckhouse/deckhouse/pull/22356
    - summary: Fix duplicate enabled key in doc-ru-deschedulers.yaml
      pull_request: https://github.com/deckhouse/deckhouse/pull/22373
    - summary: Fixed CVE-2026-81870 in descheduler by bumping OpenTelemetry Go modules to v1.45.0.
dhctl:
  features:
    - summary: >-
        Resolve the cloud prefix from the `global` ModuleConfig at bootstrap/converge/destroy without
        writing it into the in-cluster `d8-cluster-configuration` secret.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21533
    - summary: >-
        Added a preflight check that prevents static cluster bootstrap when pod or service CIDRs overlap
        with the target host network.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21815
    - summary: >-
        Bootstrap phases are driven by one declarative tree, with `--skip-phase`, per-cluster state-cache
        identities, and support for clusters without ClusterConfiguration; `bootstrap-phase abort` no
        longer destroys a running cluster.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22182
      impact: >-
        `dhctl bootstrap-phase abort` now always rolls back from the state cache and never deletes in-cluster
        resources, for CLI and gRPC clients alike. Use `dhctl destroy` to delete a running cluster. `--force-abort-from-cache`
        still parses but has no effect.


        The `bootstrap-phase` subcommands `execute-bashible-bundle` and `exec-post-bootstrap` are removed,
        along with `--internal-node-ip` and `--device-path`.


        The announced phase list changed for every operation (bootstrap gains 5 top-level phases, destroy
        gains 4, converge loses `ScaleToMultiMaster`), and `FirstMaster` / `WaitForControlPlaneManagerReadiness`
        moved from sub-phases to top-level phases. The gRPC message shape is unchanged; consumers with
        a hardcoded phase list or count need updating.


        Static and managed clusters now name their state-cache directory after the SSH host list instead
        of sharing one directory per machine. A static `bootstrap-phase abort` must be given the same
        `--ssh-host` set as its bootstrap.
    - summary: >-
        Bootstrap and destroy clusters whose first master runs an immutable OS — an SSH-less cloud-init
        payload, a one-shot kubeconfig handoff, and kubeconfig-only destroy.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21557
    - summary: >-
        dhctl gRPC operations accept a kubeconfig and can run against a cluster with no reachable master
        hosts.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22378
    - summary: >-
        dhctl gRPC operations that do not reach the nodes over SSH accept a kubeconfig with an empty connection
        config.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22616
    - summary: >-
        Bootstrap a static cluster whose masters run Deckhouse Engine. The payload is pushed to the machine's
        maintenance port instead of travelling in cloud-init, and the machines are named by --master-host.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22212
    - summary: >-
        Converge refuses the node phases for immutable NodeGroups and skips the bashible-delivered NodeUser
        when it runs over the Kubernetes API without SSH.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22212
    - summary: dhctl talks to an external cloud provider validator over gRPC instead of stdin/stdout JSON.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22241
    - summary: >-
        Added support for Yandex Cloud as an external cloud provider — its candi, OpenTofu plugin and
        validator are downloaded at runtime from the module bundle.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21653
      impact: >-
        Cloud provider configuration for DKP clusters deployed in Yandex Cloud needs to be migrated from
        YandexClusterConfiguration to ModuleConfig settings. For migration instructions, refer to "Cluster
        and Infrastructure" in the DKP FAQ.
    - summary: >-
        Resolve a cloud provider published as an external module at bootstrap, through ModuleSource, ModuleConfig
        and ModulePullOverride.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22842
    - summary: Refactor preflights in dhctl.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23020
    - summary: An Immutable first master can be bootstrapped with any registry mode, not only Unmanaged.
    - summary: >-
        Teach dhctl to accept and use cloud provider resources (the new format that replaces ProviderClusterConfiguration)
        in attach, check, converge, destroy and detach.
    - summary: >-
        Bootstrapping a Basis Dynamix cluster is refused when the platform is older than 4.6 or the storage
        policy is not visible to the cluster account.
    - summary: When the master cannot reach the registry or the cloud API, dhctl says whether it is DNS
        that fails.
    - summary: >-
        dhctl uses the SSH user certificate from <key>-cert.pub next to each --ssh-agent-private-keys
        key, so it can log in to servers and bastions that trust only an SSH CA.
  fixes:
    - summary: Refactor retries in dhctl.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21341
    - summary: >-
        The bootstrap readiness listings no longer hide resources whose name contains "cluster", and print
        each object in the same format as "Resources to create".
      pull_request: https://github.com/deckhouse/deckhouse/pull/21696
    - summary: Fix dhctl converge issues.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21751
    - summary: Read defaultCRI from ClusterConfiguration again during bootstrap (part of the
      pull_request: https://github.com/deckhouse/deckhouse/pull/21830
    - summary: >-
        Fixed destructive `dhctl converge` failures by isolating per-node readiness SSH clients and stopping
        them before node removal.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21328
    - summary: >-
        Bootstrap creates the CloudPermanent nodes and the additional masters for providers configured
        through ModuleConfig.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21948
    - summary: >-
        Fix the static-instances-ssh-access preflight check failing with "read-only file system" when
        the installer runs in a pod.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21957
    - summary: trim grpc check response, increase grpc message size
      pull_request: https://github.com/deckhouse/deckhouse/pull/21757
    - summary: bump x/crypto, x/net, x/text, grpc, otel and mongo-driver to clear 17 CVEs in dhctl
      pull_request: https://github.com/deckhouse/deckhouse/pull/22112
    - summary: Apply CloudPermanent NodeGroups and their instance classes before building the nodes.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22164
      impact: >-
        In the ModuleConfig flow (no ProviderClusterConfiguration, e.g. DVP) these objects reached the
        cluster only in the last phase of bootstrap, so until then the CloudPermanent NodeGroups described
        no replicas. A bootstrap interrupted before that phase left them that way, and the next converge
        read every replica count as zero and deleted the nodes of those groups, the control plane included.
    - summary: Allow scaling the master node group down to one replica.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22479
    - summary: >-
        Configure the d8-system namespace with the privileged Pod Security enforcement level during Deckhouse
        bootstrap.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22795
    - summary: >-
        Converge builds the control plane hook or fails loudly instead of silently replacing a master
        VM with no hook, treats an etcd learner as not yet returned, and detects a VM destroyed by a pure
        delete.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22212
    - summary: dhctl can bootstrap a cluster from a registry served over plain HTTP
      pull_request: https://github.com/deckhouse/deckhouse/pull/22818
    - summary: >-
        dhctl-server accepts Bootstrap and Converge requests with a kubeconfig and an empty connection
        config instead of refusing them.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22940
    - summary: Shell completion no longer initializes telemetry when tracing is enabled.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22557
    - summary: >-
        fixed DKP installation with registries that omit the Docker-Distribution-API-Version header by
        validating registry access through Deckhouse image resolution.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22261
    - summary: Fix dhctl UI/UX.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23133
    - summary: >-
        Install the external cloud provider module before waiting for Deckhouse readiness, so the bootstrap
        no longer times out on an uninitialized node taint.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22842
    - summary: Restoring of handling api_server_url and api_server_token in dhctl
      pull_request: https://github.com/deckhouse/deckhouse/pull/23292
    - summary: >-
        Increased the immutable control-plane node registration timeout to prevent bootstrap failures
        while nodes are still starting.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23370
    - summary: Migrate clusterDomain to moduleConfig fix for bootstrap
    - summary: >-
        Destroy and abort of a static cluster fail instead of reporting success when a master was not
        cleaned up because of an ssh error or a cleanup timeout.
    - summary: Fix bootstrap process to avoid race between RPP starting and cloud-permanent nodes bootstrapping.
    - summary: >-
        Provider-specific preflight checks are skipped when the cloud provider is configured through its
        ModuleConfig.
    - summary: >-
        dhctl treats `spec.enabled` of a ModuleConfig as optional and a ModuleConfig without it as disabled,
        which fixes terraform-auto-converger, terraform-state-exporter and `dhctl converge` on clusters
        whose provider ModuleConfig has no `spec.enabled`.
    - summary: >-
        Fixed the terraform-auto-converger init container failing on clusters already migrated to OpenTofu
        - the migration check now skips planning when no Terraform state is stored in the cluster.
    - summary: >-
        In commander mode dhctl reads the cluster settings that live in ModuleConfigs from the cluster,
        so a prefix set only in ModuleConfig global no longer fails with Empty ClusterPrefix.
    - summary: Fix cri preflight checks in dhctl.
    - summary: >-
        The `cloud-kube-data-device` preflight check no longer fails a resumed bootstrap when bashible
        has already set up the Kubernetes data disk.
    - summary: Fix CAPI machine drain timeout override during Deckhouse deletion
    - summary: Fixed dhctl converge failing to connect through a bastion host when separate SSH keys are
        used.
    - summary: >-
        Bumped lib-connection to v0.16.1. SSH commands no longer leak file descriptors and goroutines,
        and stopping an SSH client no longer kills every kubectl and d8 k proxy process on the node.
    - summary: Re-download the cloud provider bundle when its digest changes.
    - summary: >-
        Bootstrap of a cluster without ClusterConfiguration no longer requires podSubnetCIDR and serviceSubnetCIDR.
    - summary: Installation from a bundle no longer fails on images published as OCI image indexes.
    - summary: Update the OpenTelemetry log packages to close CVE-2026-81871 and CVE-2026-81872.
    - summary: >-
        dhctl unpacks every image it downloads (candi, opentofu, terraform-manager, provider bundle) into
        a directory named by the image digest and never trusts files left by another build.
      impact: >-
        A download directory shared between dhctl builds no longer serves stale or foreign candi, opentofu,
        plugins or provider bundles. `--download-dir` now applies to every command; `--download-cache-dir`
        is accepted and ignored. Do not share one download directory between this and an older dhctl release.
    - summary: >-
        dhctl config edit provider-cluster-configuration validates against the cluster's provider bundle
        again instead of failing with "schema not found".
    - summary: >-
        Avoid waiting for bootstrap Secret updates during regular master scale-up and refresh cloud configuration
        before destructive master VM replacement.
    - summary: Refresh control-plane SSH hosts from infrastructure states during master node converge.
    - summary: Detect conflicts with the reserved deckhouse UID/GID during preflight.
    - summary: Fixed the names of labels applied via "dhctl edit"
      impact: default
    - summary: >-
        A Deckhouse Engine bootstrap through a bastion no longer prints a `Get SSH client` block every
        5 seconds while it waits for the master.
    - summary: Fixed `dhctl destroy` hanging on CAPI Machines blocked by the node-manager pre-drain hook.
    - summary: >-
        dhctl bootstrap-phase install-deckhouse now restores releaseChannel and modules.https after installation.
    - summary: >-
        Bump golang.org/x/net, go-jose, klauspost/compress and golang.org/x/text to fix CVE-2026-78659,
        CVE-2026-78660, CVE-2026-78661, CVE-2026-78663, CVE-2026-78669, CVE-2026-97032, CVE-2026-97045,
        CVE-2026-116585, CVE-2026-116586, CVE-2026-116587, CVE-2026-63209 and CVE-2026-56851.
    - summary: The kernel module preflight check now works when sudo on the node asks for a password.
    - summary: >-
        When dhctl cannot pull the provider bundle from an air-gapped cluster's own store (for example
        during destroy), the error says that this dhctl may be of another release than the cluster or
        that the store lacks the image, and how to provide the bundle, instead of pointing at registry
        credentials from a configuration that was not given.
    - summary: >-
        dhctl no longer draws the live progress block or asks for confirmation when the `CI` environment
        variable is set; set `CI=false` to turn the check off.
    - summary: >-
        The bootstrap terminal no longer shows glued lines, FAILED for bashible step attempts that recovered,
        or "Unhandled Error" from client-go.
    - summary: >-
        An enabled cloud provider ModuleConfig without settings is no longer ignored during external provider
        validation.
