user-authn:
  features:
    - summary: >-
        Reconcile users, passwords, operations, and Dex provider checks in a dedicated controller instead
        of module hooks.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22151
    - summary: >-
        Update the Dex authentication page to the new Deckhouse branding, with light and dark themes selected
        by the user's system settings.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23093
    - summary: >-
        DexProvider gets spec.allowedIdentities (emails, emailDomains, groups); dex refuses sign-in outside
        the lists and reduces the groups claim to the intersection, for every provider type.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22694
      impact: >-
        Opt-in. A provider without the block behaves as before. With the block set,

        users outside the lists cannot sign in through that provider and their

        existing refresh tokens are revoked on the next refresh.
    - summary: >-
        DexAuthenticator logins, logouts, failed and denied logins, CSRF mismatches and failed session
        refreshes are delivered as security events when the `security-events-manager` module is enabled.
    - summary: >-
        DexAuthenticator runs oauth2-proxy 7.15.5, checks the TLS certificate of Dex, uses PKCE, and answers
        script requests without a session with `401` instead of a redirect to Dex.
      impact: >-
        All DexAuthenticator pods restart. While a DexAuthenticator rolls out, its old and new replicas
        cannot read each other's session cookies and sign-in state. A user whose request reaches an old
        replica after a new one served them is signed out once, and a sign-in in progress may end with
        the "Login Failed" page once; signing in again works. With two replicas this affects most active
        users of the DexAuthenticator once. During the rollout the authenticator logs "CSRF token mismatch"
        auth failures. A `fetch` or XHR request without a session gets `401` with the `{}` body instead
        of a redirect to Dex that failed with a CORS error. To send the user to sign in, the application
        must reload the page when it gets `401`.
    - summary: >-
        The module copies the 2FA (TOTP) secrets and locks of Dex users into Dex v2.46 UserIdentity objects
        and keeps a UserAccount for users of every identity provider.
      impact: >-
        UserAccount objects appear for users of OIDC, SAML, GitHub, GitLab, and Bitbucket Cloud providers,
        with `providerType` set to `spec.type` of the DexProvider.

        The controller creates UserIdentity objects (`useridentities.dex.coreos.com`) for users who have
        signed in; the `D8UserAuthnIdentityMigrationIncomplete` alert fires if it cannot copy their data
        for 30 minutes.
    - summary: Dex is updated to v2.46.0.
      impact: >-
        Dex pods restart. 2FA (TOTP) secrets, locks, and refresh tokens issued before the update keep
        working, so users keep their authenticator application, and kubeconfig files and applications
        behind DexAuthenticator do not require a new sign-in.

        With 2FA enabled, Dex no longer shows the consent screen at sign-in.

        UserAccount shows the time of the last sign-in and whether the user has set up 2FA.
    - summary: >-
        A UserOperation of the `Lock` type with `spec.target` locks a user of any identity provider, including
        OIDC, SAML, GitHub, GitLab, and Bitbucket Cloud.
      impact: >-
        The lock applies to one pair of a provider and a user and is checked at sign-in, at refresh-token
        requests, and at token exchange. The lock applies to the user ID that the provider returns, so
        a SAML provider must request NameID format `persistent` or `emailAddress` (`nameIDPolicyFormat`),
        not `transient`. Basic Authentication through a Crowd or OIDC provider does not go through Dex,
        so the lock does not apply to it.
    - summary: >-
        The `Lock` and `ResetPassword` operations no longer reset the user's two-factor authentication
        (2FA) secret.
      impact: >-
        Only `Reset2FA` (`d8 iam user reset2fa`) removes the 2FA secret. To make a user register the authenticator
        application again after `Lock` or `ResetPassword`, run `Reset2FA` too.
    - summary: >-
        Lock, password and 2FA resets, the new Logout operation and user deletion end the sessions of
        the user at once in Dex, DexAuthenticator, the Kubernetes API and Basic Authentication through
        LDAP, and cancel sign-ins in progress.
      impact: >-
        Dex, DexAuthenticator, user-authn-controller, user-api and basic-auth-proxy pods restart. Tokens
        issued before the update keep working until the first revocation of their user, so nobody has
        to sign in again.

        A `Lock` of an external user through `spec.target` now ends the user's sessions.

        Deleting a UserIdentity object by hand is refused. To remove a local user, delete the User; to
        reset 2FA or a lock, use a UserOperation.

        DexAuthenticator receives revocations from the `revocation-feed` Service in `d8-user-authn`. If
        a NetworkPolicy restricts egress in the namespace of a DexAuthenticator, allow traffic to the
        `user-authn-controller` pods on port `8443`; otherwise the `D8UserAuthnRevocationFeedNotConsumed`
        alert fires.
    - summary: New UserOperation types `Logout` and `RequirePasswordChange`; `spec.target` needs only
        `email`.
    - summary: >-
        Signing out of an application behind DexAuthenticator revokes the refresh token of the session
        in Dex.
    - summary: >-
        Added browser sessions of Dex (the `sessions` parameters, off by default) with single sign-on
        for the web interfaces of the platform and a sign-out that ends the session of the browser in
        every DexAuthenticator.
      impact: >-
        With `sessions.enabled`, kubeconfig and applications of DexClient objects that request offline
        access still get tokens only after an interactive sign-in. An application of a DexAuthenticator
        signs out with a navigation of the browser: a sign-out by a script request does not end the session
        of Dex.
    - summary: >-
        Added `postLogoutRedirectURIs`, `backchannelLogoutURI` and `refreshTokenLifetime` to DexClient
        and `upstreamLogout` to OIDC DexProvider.
    - summary: >-
        Added the devices of a user: `UserAccount.status.sessions`, `logout.grant` and `logout.exceptGrant`
        of the `Logout` UserOperation, and the user-api endpoints for listing the devices and signing
        out of one device or of the others.
      impact: >-
        A user signed in to one application in several browsers or with several kubeconfig files stays
        signed in on all of them, up to 10 per application; the 11th sign-in signs the least recently
        used device out of that application. During the update, a device other than the last one signed
        in to an application may have to sign in again once. In the web interface, signing out on all
        devices and changing the password are available only on a device whose browser first signed in
        to the account at least 24 hours ago; signing out and in again from the same browser keeps that
        time.
    - summary: >-
        Dex sends the back-channel logout of a browser session ended by a UserOperation, by the self-service
        of the web interface or by the deletion of the user.
    - summary: >-
        Dex gets a connector that serves token exchange only and checks the audience and required claims
        of the exchanged token.
      impact: >-
        A user of a DexProvider whose email or group starts with system: or peering: can no longer sign
        in to any application of the cluster; before, only the Kubernetes API refused such a user.
    - summary: >-
        Add TokenExchangeProvider, a trusted issuer whose tokens Dex exchanges for Dex tokens accepted
        by the Kubernetes API.
    - summary: >-
        Add the D8UserAuthnDexProviderTokenExchangeDeprecated alert for clusters that exchange tokens
        through a DexProvider.
      impact: >-
        Token exchange through a DexProvider is deprecated. If the alert fires, move the exchange to a
        TokenExchangeProvider as described in the CI/CD access documentation.
    - summary: >-
        Token exchange through a DexProvider is off by default and can only be turned off with `spec.tokenExchange.enabled`.
      impact: >-
        Existing clusters with a DexClient that has the dexclient.deckhouse.io/allow-access-to-kubernetes
        annotation keep token exchange through their OIDC and Gitlab DexProviders through the flag, which
        the module sets on the upgrade. Move the exchange to a TokenExchangeProvider and turn the flag
        off. The flag and token exchange through a DexProvider will be removed after the next LTS release.
    - summary: >-
        DexAuthenticator pages use the Deckhouse Dex design and the language of the browser (Russian or
        English).
      impact: All DexAuthenticator pods restart.
    - summary: >-
        DexClient and DexAuthenticator can limit the providers users sign in through with spec.allowedProviders.
    - summary: >-
        DexProvider of the LDAP type can follow nested groups (recursionGroupAttr) and take several attributes
        for the username (usernames).
    - summary: >-
        The second factor (TOTP) can be required from the users of LDAP and Crowd providers with the twoFactor
        parameter, and Reset2FA works for them.
      impact: >-
        The staticUsers2FA parameter is renamed twoFactor; the module converts it, so existing settings
        keep working. twoFactor.providerTypes with LDAP or Crowd is refused while a provider of that type
        has enableBasicAuth, and the other way round. Turning the second factor on does not end the sessions
        already issued: end them with a Logout UserOperation. A version without twoFactor refuses a version
        4 ModuleConfig of user-authn with twoFactor in its webhook, and Deckhouse stops with a Fatal error;
        before rolling back to such a version, switch the ModuleConfig to version 3 and remove twoFactor
        (staticUsers2FA sets the second factor of the local users there).
    - summary: >-
        A security key (WebAuthn) can be the second factor, alone or after the code (twoFactor.methods,
        require: All), for all users or by the type of provider; one key per account, and Reset2FA can
        remove one method.
    - summary: >-
        A DexProvider can put a prefix in front of every group it asserts (spec.groupPrefix); the groups
        of providers stay apart when every provider has its own prefix.
      impact: >-
        Setting or changing groupPrefix renames the groups of the provider and deletes its refresh tokens,
        so its users sign in again; rewrite the rules that name its groups before setting it.
    - summary: >-
        With twoFactor.require: Any each user chooses the second factor, a one-time code or a security
        key, and registers it at the first sign-in.
      impact: >-
        A version without require: Any refuses a ModuleConfig of user-authn that sets it, and Deckhouse
        stops with a Fatal error; before rolling back to such a version, switch require to All or keep
        one method.
    - summary: The Dex sign-in pages are shown in Russian or English, as the browser prefers.
    - summary: >-
        A user can register several passkeys, up to twoFactor.webAuthn.maxCredentials (3 by default):
        a key is added after a registered one confirms the sign-in.
    - summary: >-
        Every device in UserAccount `status.sessions` and in the user-api device list shows when its session
        ends (`endsAt`).
  fixes:
    - summary: >-
        Fix Dex token refresh with upstream providers that rotate refresh tokens (GitLab), which logged
        users out every `idTokenTTL`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21615
    - summary: ClusterAdmin can watch the Dex storage CRDs (passwords, offlinesessionses), not only list
        them.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21792
    - summary: fix cve
      pull_request: https://github.com/deckhouse/deckhouse/pull/21817
    - summary: >-
        basic-auth-proxy no longer forwards reserved `system:` groups and usernames from the external
        directory to kube-apiserver.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21896
      impact: >-
        Affects clusters where `publishAPI` is enabled together with `enableBasicAuth` on a

        Crowd, OIDC or LDAP `DexProvider`. Both are disabled by default, so a default

        installation is not affected.


        Previously the proxy copied directory group names into the `X-Remote-Group` header

        verbatim. Because kube-apiserver trusts that header from this proxy, a user in a

        directory group literally named `system:masters` was granted cluster-admin. Group

        names are chosen by the directory administrator, not by Kubernetes.


        After updating, any group whose name begins with `system:` is dropped before the

        request reaches kube-apiserver, and each drop is logged by the basic-auth-proxy pod

        with the user and the group name. A user authenticating with a `system:`-prefixed

        username is refused with `403 Forbidden`. This matches the `userValidationRules`

        already enforced on the OIDC/JWT path.


        Before updating, audit your directory for groups whose name begins with `system:`

        and check whether anyone currently relies on one to reach the Kubernetes API through

        basic auth. Such users will lose those privileges on update and must be granted

        access through a normal group bound by RBAC instead. Check the basic-auth-proxy logs

        after updating for `dropping group` messages.
    - summary: >-
        DexClient and DexAuthenticator now honour the value of the allow-access-to-kubernetes annotation
        instead of merely its presence.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21897
      impact: >-
        The `dexclient.deckhouse.io/allow-access-to-kubernetes` and

        `dexauthenticator.deckhouse.io/allow-access-to-kubernetes` annotations were previously

        evaluated by key presence, so any value — including "false" — granted the client the

        right to obtain tokens with `aud=kubernetes` and placed it into `trustedPeers` of the

        `kubernetes` OAuth2Client, whose tokens kube-apiserver accepts.


        The value is now parsed as a boolean. Only 1, t, T, TRUE, true and True grant the

        capability. Any other value, including "false", "0", "yes", "enabled" and an empty

        string, disables it; unparseable values are rejected with a warning in the

        deckhouse Pod log naming the object and the offending value.


        Affected: clusters with a DexClient or DexAuthenticator that carries the annotation

        with a value other than a boolean true. Those objects lose access to the Kubernetes

        API on update, which for most of them is the behaviour their author intended.


        Before updating, run

        `kubectl get dexclient,dexauthenticator -A -o json | jq -r '.items[] | select(.metadata.annotations
        | to_entries[]? | select(.key | endswith("deckhouse.io/allow-access-to-kubernetes")) | .value
        | ascii_downcase | IN("1","t","true") | not) | "\(.kind)/\(.metadata.namespace)/\(.metadata.name)"'`

        and, for every object listed, either set the annotation to "true" if it genuinely needs

        Kubernetes API access, or remove the annotation to confirm it does not.
    - summary: Cap idTokenTTL below 6h and make User.spec.password immutable.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21998
      impact: >-
        Existing ModuleConfigs with idTokenTTL >= 6h keep working but raise D8UserAuthnIDTokenTTLTooLong
        until the value is lowered below 6h.

        Patching User.spec.password after create is rejected; reset passwords via UserOperation or `d8
        iam user reset-password`.
    - summary: >-
        The legacy publish API certificate hook no longer deletes TLS secrets in d8-user-authn on deckhouse
        restart.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21889
    - summary: >-
        Quote DexProvider-derived values rendered into the basic-auth-proxy Deployment and the Dex configuration
        file to prevent YAML injection.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22214
    - summary: Reject whitespace in DexProvider OIDC scopes, which the OAuth2 protocol cannot represent.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22214
      impact: >-
        `spec.oidc.scopes` items are now validated against `^\S+$` in both served versions of DexProvider.
        A scope containing whitespace could never work, because OAuth2 passes scopes as a space-delimited
        list, but it was previously admitted and silently broke authentication. Stored objects are not
        invalidated, however a DexProvider holding such a value is rejected on its next write until the
        value is corrected, which also affects a GitOps flow that reapplies the object unchanged.
    - summary: >-
        Issue a dedicated OAuth2 client secret per DexAuthenticator instead of reusing the shared cluster
        client secret.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22216
      impact: >-
        On upgrade, every DexAuthenticator that carries the

        `dexauthenticator.deckhouse.io/allow-access-to-kubernetes` annotation gets a freshly generated
        client

        secret, because it previously received the client secret of the privileged `kubernetes` OAuth2
        client

        instead. Its pods roll once and users of those applications may have to sign in again. Each rotation
        is

        written to the Deckhouse log as `Rotating DexAuthenticator client secret that reused the shared
        kubernetes

        client secret`, with the authenticator name and namespace.


        If that annotation was ever used outside the `d8-*` and `kube-*` namespaces, the shared secret
        must be

        considered disclosed to anyone who could read Secrets in those namespaces, and has to be rotated
        by hand.

        Deleting the Secret alone does not rotate it: while the value is non-empty in memory the owning
        hook

        re-renders the same one. Rotate it as follows.


        1. If a GitOps tool syncs the `d8-user-authn` namespace, exclude
           `Secret/kubernetes-dex-client-app-secret` from that sync first, otherwise it is restored to
        the old
           value.
        2. Blank the stored value:
           `kubectl -n d8-user-authn patch secret kubernetes-dex-client-app-secret --type merge -p '{"data":{"secret":""}}'`
        3. Drop the in-memory copy: `kubectl -n d8-system rollout restart deployment/deckhouse`

        4. Check that `kubectl -n d8-user-authn get secret kubernetes-dex-client-app-secret -o jsonpath='{.data.secret}'`
           now differs from the previous value. If it does not, the module re-rendered the old value before
        the
           restart took effect; repeat steps 2 and 3.

        The blast radius of that rotation is wider than the `kubernetes` client alone. The same value
        is the client

        secret of the `kubeconfig-generator`, `kubeconfig-publish-api` and every `kubeconfig-<slug>` OAuth2
        client,

        and it is passed to basic-auth-proxy as `--ldap-client-secret`. In-cluster consumers are re-rendered
        and

        their pods roll automatically, but kubeconfig files already downloaded from the kubeconfig generator
        carry

        the old client secret and can no longer refresh their tokens, so their users must download a new

        kubeconfig. Already issued ID tokens keep working until they expire, at most `settings.idTokenTTL`.


        Deleting and recreating a DexAuthenticator is always a safe way to force a fresh per-authenticator
        secret:

        the credentials Secret is regenerated with the resource. Its content is owned by Deckhouse, so
        no GitOps

        change is needed for the per-authenticator rotation itself.
    - summary: Drop the dead per-DexAuthenticator redirect URI from the privileged kubernetes OAuth2 client.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22216
    - summary: >-
        Remove list access to Dex password and offline-session storage from the user-authn read-only and
        cluster-admin roles.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22215
      impact: >-
        Subjects holding only the user-authn view role or the legacy ClusterAdmin user-authn role can
        no longer list `passwords.dex.coreos.com` or `offlinesessionses.dex.coreos.com`. Use `User` objects
        for user inventory instead.
    - summary: >-
        Adding the allow-access-to-kubernetes annotation to a DexClient or a DexAuthenticator now requires
        cluster-level authority over the user-authn module.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22219
      impact: >-
        Only a subject allowed to update the user-authn ModuleConfig, or the Deckhouse service account,
        may add the `dexclient.deckhouse.io/allow-access-to-kubernetes` or `dexauthenticator.deckhouse.io/allow-access-to-kubernetes`
        annotation. Objects that already carry it keep working and stay editable by their owners as long
        as they are updated in place. A GitOps controller that deletes and recreates such an object instead
        of patching it will have the recreation denied, and the object will come back without access to
        the Kubernetes API unless the controller's service account is allowed to update the user-authn
        ModuleConfig.
    - summary: >-
        The policy gating the allow-access-to-kubernetes annotation no longer applies to platform components,
        and proves authority with a create permission on the dexclients/allow-access-to-kubernetes and
        dexauthenticators/allow-access-to-kubernetes subresources instead of write access to the user-authn
        ModuleConfig.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22388
      impact: >-
        Setting the annotation no longer requires write access to the user-authn ModuleConfig. Module
        administrators are unaffected, as their roles already carry the new permission, and so are the
        platform's own components in `d8-system` and `kube-system`. Any other subject that sets the annotation,
        a cluster provisioner in particular, has to be granted `create` on the subresource, which for
        a single namespace is:

            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: allow-access-to-kubernetes
              namespace: <namespace>
            rules:
            - apiGroups: ["deckhouse.io"]
              resources: ["dexclients/allow-access-to-kubernetes", "dexauthenticators/allow-access-to-kubernetes"]
              verbs: ["create"]

        bound to the subject with a RoleBinding in the same namespace, or with a ClusterRole and a ClusterRoleBinding
        to grant it cluster-wide.
    - summary: Commander releases older than 1.18 can grant Kubernetes API access on DexClient again.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22518
    - summary: Administrator lock now blocks login, password grant, and refresh without passwordPolicy.lockout.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22483
    - summary: DexClient and DexAuthenticator allow-lists are now enforced on password grant and token
        refresh.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22484
      impact: >-
        Changing allowedGroups or allowedEmails deletes refresh tokens that no longer match. Those users
        must sign in again.
    - summary: >-
        Documented `d8 iam` CLI commands and `UserOperation` resource (user/group management, access grants,
        manual YAML examples, lifecycle, FAQ)
      pull_request: https://github.com/deckhouse/deckhouse/pull/21956
    - summary: >-
        user-authn-controller always uses leader election, so two pods during a rolling update no longer
        write the same objects.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22992
      impact: >-
        HA clusters already elected a leader and see no change. On clusters without HA a Lease named

        user-authn-controller appears in d8-user-authn, and the pod now restarts if it cannot renew that

        lease for 40 seconds — that is, after a prolonged loss of the API server; a shorter absence is

        survived. Before, the single pod stayed up through any outage but two pods wrote the same objects

        during every rolling update. The RBAC grant on leases moves from the ClusterRole

        d8:user-authn:controller to the Role controller in d8-user-authn; the set of permissions is unchanged.
    - summary: >-
        user-authn-controller reports not ready when it cannot read the API, instead of staying Ready
        with synced-but-dead informers.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22992
      impact: >-
        Readiness now includes one uncached read per probe, and the probe timeout grows from 3 to 5 seconds.

        A controller whose access to the API server is lost becomes NotReady within a few seconds and
        Ready

        again once access returns.
    - summary: >-
        A DexAuthenticator whose namespace is terminating no longer stalls the Deckhouse queue; the `D8DexAuthenticatorNamespaceUnusable`
        alert points at it.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23131
      impact: >-
        Such an authenticator is left out of the module values, so the user-authn release stops failing
        on

        objects that the API server cannot create, and the main queue no longer stops behind the retrying

        module. The authenticator is exported as `d8_user_authn_dex_authenticator_skipped` and the

        `D8DexAuthenticatorNamespaceUnusable` alert fires after 10 minutes with the steps to finish the

        namespace deletion. The authenticator is deleted together with its namespace; to keep it, recreate

        it in a live namespace.
    - summary: >-
        Added settings version 3 of the user-authn ModuleConfig; an `idTokenTTL` of 6h or more in a ModuleConfig
        of version 1 or 2 is converted to `5h59m`, and version 3 refuses it.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23268
      impact: >-
        On a cluster whose user-authn ModuleConfig sets `idTokenTTL` to 6h or more, Dex issues ID tokens
        for 5h59m after the update, which also lowers the minimum user session lifetime (`keepUsersLoggedInFor`
        of a DexAuthenticator, `auth.sessionTTL` of the console) to that value. The `D8UserAuthnIDTokenTTLTooLong`
        alert goes from severity 6 to 4 and keeps firing until the ModuleConfig is updated to settings
        version 3 with an `idTokenTTL` below 6h.
    - summary: Allow DexAuthenticator applications using Gateway API to omit the Ingress class.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23226
      impact: >-
        Removing the Ingress class from an existing application configured with Gateway API removes its

        generated Ingress resources.


        An existing DexAuthenticator that specifies both an Ingress class and gatewayAPI now also gets
        an

        HTTPRoute in clusters where no Gateway is configured or discovered for the module. Previously
        such

        a route was not created at all. If the old behaviour was worked around with a hand-written route

        on /dex-authenticator, both now exist and Gateway API grants the match to the older one.


        A ListenerSet set for an application under additionalApplications before this release was dropped

        on write, because the field was missing from the v1 schema, which is the storage version. Adding

        the field does not restore the lost values: re-apply those DexAuthenticator manifests. The

        re-applied manifests are now also checked for domains already taken on the same ListenerSet, and

        for a domain repeated between additional applications.
    - summary: Fixed CVEs in the module images.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23290
    - summary: >-
        Render a valid Deployment for a DexAuthenticator whose `resources` limits are fractional or below
        the init container requests.
      impact: >-
        The `self-signed-generator` init container now carries the fixed `10m` / `25Mi` it was always

        meant to have, the same as the identical init container of `user-api`, instead of the sum of the

        main container limits. A DexAuthenticator that set large limits no longer gets that sum as burst:

        generating the self-signed certificate then takes 3 to 4 seconds instead of under a second. It

        happens once per pod start and needs no action.
    - summary: >-
        The Group webhook refuses only a membership cycle that the change itself creates; other Group
        changes are accepted with a warning that names an existing cycle, and removing a member of a cycle
        is allowed.
    - summary: >-
        The `D8UserAuthnIDTokenTTLTooLong` alert keeps severity 6, because the settings conversion already
        replaces an `idTokenTTL` of 6h or more with `5h59m` and only the ModuleConfig is left to update.
    - summary: >-
        Restrict the Job that issues the `basic-auth-proxy` certificate to the read-only front-proxy CA
        files and cover it with a SecurityPolicyException.
    - summary: >-
        A DexClient in a namespace whose name YAML reads as a number or a boolean no longer breaks the
        user-authn release.
    - summary: >-
        A DexAuthenticator with a name longer than 45 characters no longer logs its users out on every
        run of the hook.
    - summary: >-
        Errors the webhook scripts of user-authn, user-authz and multitenancy-manager write to stderr
        are logged as warnings instead of info messages.
    - summary: user-authn-controller logs only named levels, and its leader election messages are JSON.
    - summary: Protected applications keep serving users during a short dex outage and during restarts.
    - summary: >-
        The chart renders before the hooks fill the internal values, also with `kubeconfigGenerator` or
        the `CustomCertificate` HTTPS mode, so the converge after a Deckhouse start or a settings change
        is not blocked.
    - summary: >-
        A new DexAuthenticator whose name is not a DNS-1035 label of at most 63 characters (for example,
        starts with a digit or has a dot) is refused instead of breaking the user-authn release.
      impact: >-
        A new DexAuthenticator can no longer have a dot in its name, including a long name with a dot
        that worked before. An existing DexAuthenticator with such a name keeps working and can be updated.
    - summary: >-
        basic-auth-proxy reaches Dex through its Service and verifies the certificate of Dex, so Basic
        Authentication through an LDAP provider works in clusters where pods cannot reach the public address
        of Dex.
      impact: basic-auth-proxy pods restart.
    - summary: >-
        Fixed CVE-2026-78659, CVE-2026-78660, CVE-2026-78663, CVE-2026-78669 and CVE-2026-97032 in `golang.org/x/net`.
    - summary: >-
        dex-authenticator no longer writes the request headers, cookies included, to the log when the
        CSRF cookie is missing.
    - summary: >-
        Applications behind one DexAuthenticator can be signed in to in several tabs at the same time;
        every sign-in keeps its own CSRF cookie.
    - summary: >-
        A failed CSRF check on the DexAuthenticator callback no longer writes the request cookies, including
        the refresh token, to the log (GHSA-hhqp-vx7f-5c6m).
    - summary: >-
        A short Dex outage (no connection, a timeout, `429` or `5xx`) no longer signs users out of applications
        behind DexAuthenticator.
      impact: >-
        While Dex is unavailable, a request that needs a session refresh gets an error page instead of
        a redirect to sign in; a reload works once Dex is back.
    - summary: >-
        A DexAuthenticator with one replica, including one with `highAvailability: false` in a cluster
        with high availability, keeps serving while it rolls out.
    - summary: >-
        The API server rejects a new or changed DexAuthenticator with an invalid `keepUsersLoggedInFor`
        value, so such a value no longer fails the release of the whole `user-authn` module.
      impact: >-
        A DexAuthenticator saved earlier with an invalid value still fails the module release until the
        value is fixed.
    - summary: >-
        The module settings refuse a zero `idTokenTTL`; with it DexAuthenticator never checked sessions
        with Dex.
      impact: >-
        A ModuleConfig with a zero `idTokenTTL` (for example, `0s`) fails validation after the update.
        Set a positive value.
    - summary: >-
        Deleting a User, manually or by `ttl`, also deletes its 2FA (TOTP) secret, so a user created again
        with the same name does not inherit it.
    - summary: >-
        DexAuthenticator now gets its own NetworkPolicy, so sign-in works in projects with isolated network
        policies and an ingress controller in hostNetwork can reach the authenticator.
      impact: >-
        Authenticator pods now accept connections only on 8443 (plus the Istio ports 15008 and 15020 when
        the istio module is enabled) and may reach only dex, the revocation feed, istiod and DNS; a sidecar
        injected into them that needs other ports or destinations loses them.
    - summary: >-
        DexAuthenticator containers always have cpu and memory requests, so an authenticator runs in projects
        whose policies require requests (e.g. the default project template) and no longer fails the user-authn
        release there.
      impact: >-
        DexAuthenticator pods restart once where their requests change: with VPA enabled and no spec.resources,
        or for redis when spec.resources has no redis section.
    - summary: >-
        Dex answers a refresh-token request that the identity provider refuses with `invalid_grant` instead
        of a server error.
      impact: >-
        When the provider reports that the user no longer exists, has lost access or has left the groups
        the DexProvider requires, kubeconfig clients and applications behind DexAuthenticator ask the
        user to sign in again instead of failing with `500`. A sign-in refused for the provider groups
        shows a `403` page instead of `500`.
    - summary: A browser sign-in no longer lifts a lock set by an administrator.
    - summary: >-
        A user locked by an administrator sees that the account is locked by an administrator instead
        of the "Too Many Requests" page of an automatic lockout.
      impact: >-
        Dex answers a sign-in of such a user with `403` and the "Account locked by an administrator" page,
        and the token endpoint answers `access_denied` with `403`. An automatic lockout after failed password
        attempts keeps its `429` answers.
    - summary: >-
        The `rateLimit` parameter also limits failed attempts on the two-factor authentication (2FA) steps
        and on the password change page.
    - summary: >-
        The Dex password change page opens only inside the sign-in that led to it, in the same browser,
        and asks only for the new password.
      impact: >-
        After a forced password change, the sign-in continues to the application without a second sign-in.
        A link to the password change page outside a sign-in no longer works, and the page no longer redirects
        to an address taken from the request. The page states why the password must be changed: it was
        reset, it does not meet the password policy, or it has expired.
    - summary: >-
        With two-factor authentication (2FA) enabled, Dex asks for the code before the password change
        page, so a password alone is not enough to change it.
      impact: A user whose password must change enters the 2FA code first and then sets the new password.
    - summary: >-
        Fixed vulnerabilities in Dex (golang.org/x/net v0.60.0): CVE-2026-78659, CVE-2026-78660, CVE-2026-78663,
        CVE-2026-78669, CVE-2026-97032.
    - summary: >-
        The Dex password change page refuses an empty new password with any password policy, including
        `complexityLevel: None` and no `passwordPolicy`.
    - summary: >-
        The `Lock`, `ResetPassword` and `Reset2FA` operations of a local user no longer end the sessions
        of a user of another provider with the same name.
    - summary: >-
        Parallel Basic Authentication requests of one user through an LDAP provider no longer fail with
        `500`.
    - summary: >-
        With `rateLimit` enabled, Dex counts the client address only from the platform Ingress controller
        and Gateway, and refresh-token requests no longer count as failed attempts.
      impact: >-
        A pod that calls the Dex Service directly is counted by its own address and can no longer forge
        the address in the rate limit and in the sign-in log, unless it can read the HTTPRoute object
        of the module in `d8-user-authn` or create an Ingress with configuration snippets on the ingress-nginx
        controller. The Dex Ingresses make ingress-nginx present its client certificate to Dex; Dex asks
        every client for a certificate and requires none.
    - summary: >-
        user-api accepts only the ID tokens of the Deckhouse web interface and can only sign the user
        out everywhere or require a password change; the password reset endpoint is removed.
      impact: >-
        The Deckhouse web interface must use the new user-api endpoints for the password change and the
        sign-out on all devices.
    - summary: >-
        With `rateLimit` enabled, failed Basic Authentication attempts through an LDAP provider are counted
        per client instead of in one bucket for basic-auth-proxy.
    - summary: >-
        The credentials Secret and the OAuth2Client of a DexClient, and trustedPeers of the kubernetes
        OAuth2Client, are updated by the controllers of the module right after a DexClient or DexAuthenticator
        changes.
      impact: >-
        The Secret keeps its client secret on upgrade. It gets an ownerReference to the DexClient, and
        secretMetadata can no longer override the labels app, name, heritage and module. A DexClient whose
        secretMetadata overrode app or name no longer gets a new client secret on every change of any
        DexClient. The kubernetes OAuth2Client is also created when only a DexClient is allowed access
        to Kubernetes. A new Deployment dexclient-controller in d8-user-authn writes the credentials of
        DexClients; it is the only component of the module with rights on Secrets in other namespaces.
    - summary: >-
        Two DexAuthenticators whose name and namespace differ only in the position of a dash no longer
        break the release of the module.
      impact: >-
        Users of applications behind a DexAuthenticator have to sign in again once after the update; the
        refresh tokens issued under the old client ids are deleted, and UserAccount no longer lists them.
        The dex-authenticator Deployments restart. The aud claim of the ID tokens of a DexAuthenticator
        becomes dex-authenticator-NAME@NAMESPACE; an application that checks aud has to accept the new
        value.
    - summary: >-
        Dex no longer restarts in a loop or hangs at startup when the issuer of an OIDC provider is unreachable
        or does not answer; it skips that provider after 10 seconds and starts with the other providers
        and the local users, if there are any.
      impact: >-
        Dex logs "opening connector" with the connector ID before it opens each identity provider at startup.
        If no provider can be opened and there are no local users, Dex exits with "failed to open all
        connectors" instead of hanging.
    - summary: >-
        Users of an LDAP DexProvider for Active Directory with `idAttr: objectGUID` (or `mS-DS-ConsistencyGuid`)
        can sign in; their Dex user ID becomes the GUID string.
      impact: >-
        A user whose GUID happened to be valid UTF-8 and who could sign in before gets a new `sub` (an
        application that tells users apart by `sub` sees a new user) and enrolls TOTP again; for every
        other such user sign-in did not work before.
    - summary: >-
        A `ResetPassword` UserOperation keeps the replaced password in the history of `passwordPolicy`,
        so the user cannot set it again at the forced change after the reset.
    - summary: >-
        Dex is no longer restarted when it answers its probes slowly because its node is short of CPU,
        so logins recover as soon as the node does.
      impact: The `dex` pods restart.
    - summary: Local users keep the passwords they changed in Dex when the cluster updates from 1.76.
    - summary: >-
        Fixed CVE-2026-116585, CVE-2026-116586 and CVE-2026-116587 in `github.com/go-jose/go-jose/v4`
        and CVE-2026-78661 and CVE-2026-97045 in `golang.org/x/net`.
    - summary: >-
        Replicas of a DexAuthenticator with `spec.highAvailability` different from the cluster high availability
        mode are spread over different nodes.
      impact: >-
        Pods of DexAuthenticators whose `spec.highAvailability` differs from the cluster high availability
        mode are restarted.
    - summary: >-
        The kubeconfig clients can no longer exchange tokens of an upstream identity provider for Dex
        tokens.
    - summary: Fixed CVEs in `golang.org/x/net` and `go-jose` of dex-authenticator.
    - summary: >-
        Users are sent to sign in, instead of an HTTP 500 page on every reload, when the identity provider
        cannot refresh their session.
      impact: >-
        A session whose refresh Dex cannot complete now ends: at once when the identity provider refuses
        the refresh (for example, an OIDC provider that issued no refresh token), and one `idTokenTTL`
        after the first failure when the provider or Dex does not answer. Until then requests get 503,
        as before.
    - summary: >-
        DexAuthenticator shows the "The sign-in has expired" page with a "Sign in again" button, or with
        the Dex sessions on starts the sign-in again, instead of the 403 "Unable to find a valid CSRF
        token" page when the sign-in took longer than 10 minutes.
    - summary: >-
        Dex shows "The sign-in has expired" instead of "Requested resource does not exist" when a sign-in
        step comes more than 10 minutes after the sign-in started.
      impact: Dex restarts.
    - summary: >-
        Dex deletes expired refresh tokens on the kubernetes storage instead of logging "list refresh
        tokens: not implemented" every hour.
    - summary: In the authorization code flow, Dex accepts only the S256 PKCE method.
      impact: >-
        Dex rejects an authorization request with a code_challenge and the plain method, or with no method.
        A DexClient application that sends one has to switch to S256. Applications that send no PKCE and
        DexAuthenticator are not affected. The device flow is not affected.
    - summary: >-
        Dex does not start when an authenticator of the second factor cannot be built, instead of letting
        every login through without it.
    - summary: The CSE copies of the DexProvider CRD and of the values schema follow the module again.
    - summary: >-
        A user in no group can sign in through a SAML provider, an LDAP search without groups is a debug
        line, and the UserIdentity of a deleted DexProvider is deleted 30 days after the orphaned-since
        mark unless the account is locked or a revocation of the pair is still kept.
    - summary: >-
        DexAuthenticator pods are labeled `heritage` and are protected from exec, attach, port-forward
        and edits by namespace users.
      impact: >-
        Every DexAuthenticator restarts once. Users of the namespace of a DexAuthenticator can no longer
        exec, attach or port-forward into its pods or delete them; pod logs stay available.
    - summary: >-
        A DexClient with `allowedProviders` can exchange tokens through the TokenExchangeProviders that
        list it in `spec.clients`.
    - summary: >-
        Dex gets an API priority level of its own, so a burst of sign-ins or refreshes is no longer throttled
        together with every other service account.
    - summary: >-
        A refresh that Dex cannot serve because its storage does not answer keeps the session instead
        of ending it.
    - summary: >-
        A User with an email longer than 150 bytes, which could never sign in, is refused, and an existing
        one gets an `EmailTooLong` event instead of an endless reconcile error.
      impact: The User CRD refuses an email longer than 150 bytes.
    - summary: >-
        A DexAuthenticator refreshes a session once at a time under load instead of refreshing the same
        token again for every request of the session.
      impact: Dex and the pods of every DexAuthenticator restart.
    - summary: >-
        Dex reads its signing keys from memory until their rotation instead of from the Kubernetes API
        for every token, four requests less per sign-in and per token refresh.
      impact: Dex pods restart.
    - summary: A Logout of a session or grant the user does not have succeeds and says so, instead of
        failing.
    - summary: >-
        The user-authn controller no longer reads every Password at each pass of a user, so its start
        and every sign-in no longer slow down with the number of users.
    - summary: >-
        user-api reads UserAccounts from a cache instead of the API server and hides a device right after
        the user signs out of it.
    - summary: >-
        The handover hook of the module reads objects in lists instead of one by one, so a cluster with
        hundreds of DexClients no longer waits minutes for the module after every start of Deckhouse.
    - summary: >-
        Two applications of one user that sign in through an upstream Dex no longer send each other to
        the login every ten minutes, and providers that detect refresh token reuse no longer end the sessions
        of all applications of a user.
    - summary: >-
        Dex reads a user from an external provider again only when the stored data is older than `sessions.identityRefresh.maxAge`
        (`idTokenTTL` by default), with sessions on or off, so a user disabled at the provider is noticed
        within that time.
      impact: >-
        Dex pods restart. Without sessions, a user disabled at the external provider keeps refreshing
        tokens until the stored data is older than `sessions.identityRefresh.maxAge` (10 minutes by default)
        instead of being refused at the next refresh.
    - summary: >-
        Dex refuses the refresh of a locked user with `invalid_grant` (HTTP 400) instead of `access_denied`
        with HTTP 429 or 403, so that applications send the user to sign in, and a Dex that signs in through
        another Deckhouse Dex takes the old answer for a refusal too.
      impact: >-
        A client of Dex that expects HTTP 429 or 403 on the refresh of a locked user gets HTTP 400 `invalid_grant`
        with the same description. The password and token exchange grants and the sign-in pages answer
        as before.
    - summary: >-
        A Dex token refresh makes fewer requests to the Kubernetes API, eight instead of sixteen for a
        local user, so a wave of refreshes is answered faster.
      impact: Dex pods restart.
user-authz:
  features:
    - summary: >-
        Bindings of ClusterAuthorizationRule and AuthorizationRule are reconciled by the new `user-authz-controller`
        instead of the module Helm chart; rules get a status subresource with a `Ready` condition.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22828
      impact: >-
        The module deploys a new `user-authz-controller` Deployment in `d8-user-authz`. Existing bindings
        are adopted in place; access is not interrupted.

        `kubectl get clusterauthorizationrules` and `kubectl get authorizationrules` show READY and BINDINGS
        columns; a rule with an unsupported `accessLevel` or an invalid `additionalRoles` entry gets `Ready=False`
        instead of breaking the module and no longer blocks the other rules.

        Disabling the module now removes the bindings of the rules, as it did when the chart rendered
        them.


        The release that performs the migration costs one pass in which the release engine fetches every

        object of the previous manifest to see that the bindings must be kept. It is proportional to the

        number of bindings and happens exactly once. Up to about 5000 bindings it just makes that one

        release slower; above that it can exceed the 20-minute module release timeout, so run the upgrade

        with `HELM_TIMEOUT=60m` or on the previous release engine (`USE_NELM=false`) and put the setting

        back afterwards. Count with

        `kubectl get clusterrolebindings -l heritage=deckhouse,module=user-authz --no-headers | wc -l`.

        If the marks cannot be set the release does not start and the bindings are left untouched, which

        is deliberate: a release that ran without them would delete the bindings.
    - summary: >-
        Occupying an identity that already carries a grant, or writing a ClusterAuthorizationRule, now
        requires covering permissions or an explicit can-assign range.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22667
      impact: >-
        A subject who can manage Users or Groups cannot delete or recreate an identity

        whose email or group name already carries roles they cannot assign. The same

        subject cannot create or update a ClusterAuthorizationRule whose accessLevel

        or additionalRoles sit outside their can-assign range. A security subsystem

        manager can still assign ClusterAdmin and cannot assign SuperAdmin.

        The collision annotation does not bypass this check. GitOps ServiceAccounts

        that are not exempt cannot create a User after a SuperAdmin CAR for that email.
    - summary: >-
        Metrics and alerts for `user-authz-controller` — desired/actual bindings and their drift per kind,
        invalid rules by name, controller availability, aggregated custom roles that stay empty.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22837
      impact: >-
        New alerts: `D8UserAuthzControllerUnavailable`, `D8UserAuthzControllerTargetDown`, `D8UserAuthzControllerReconcileErrorsHigh`,
        `D8UserAuthzBindingsDrift`, `D8UserAuthzAuthorizationRulesInvalid`, `D8UserAuthzAuthorizationRuleInvalid`,
        `D8UserAuthzCustomRolesNotAggregated`.
    - summary: >-
        The authorization webhook and permission-browser read the multi-tenancy rules directly from the
        ClusterAuthorizationRules instead of a rendered config file.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22942
      impact: >-
        The user-authz webhook and permission-browser-apiserver are restarted on update. The webhook gains

        a kube-rbac-proxy sidecar for its metrics and occupies node ports 4233 and 4243 on master nodes.


        Permission Browser now treats `antiopa` and `loghouse` as system namespaces, which the

        authorization webhook already did. They disappear from the reported accessible namespaces of a

        user whose ClusterAuthorizationRule matched them without `allowAccessToSystemNamespaces`; the
        API

        server denied access to them either way, so what the report showed there was never granted.
    - summary: >-
        The RBACv2 role model is organised by scope, and the rights of a subject can be queried through
        the API.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21846
      impact: >-
        Built-in role names now say what they reach: `d8:namespace:<level>`, `d8:project:<level>`,

        `d8:subsystem:<subsystem>:<level>` and `d8:system:<level>` replace `d8:use:role:<level>` and

        `d8:manage:<subsystem|all>:<level>`. Rules live in capabilities that roles aggregate, so a module

        ships access to its own resources and a cluster administrator composes custom roles under the

        reserved `d8:custom:` prefix.


        Every old name keeps working for ONE release: it is served as an alias aggregating the same

        capabilities, marked `rbac.deckhouse.io/deprecated`, and the alerts

        D8UserAuthzDeprecatedRBACv2RoleInUse and D8UserAuthzDeprecatedRBACv2CapabilityInUse name the

        bindings that still reference it. Move those bindings to the new names before the next release
        --

        `roleRef` is immutable, so a binding has to be recreated rather than edited. One alias is narrower

        than the role it replaces: `d8:use:role:admin` no longer grants `serviceaccounts/token:create`
        and

        `impersonate`, which moved to superadmin.


        Admission now enforces what the model assumes: a ClusterRoleBinding may not carry a

        namespace/project-scoped role or a capability, a custom role may not aggregate system capabilities

        into a tenant scope, and objects marked `deckhouse.io/system-resource` inside user namespaces
        are

        editable only by superadmin.
    - summary: New authorization API answers who can perform an action and what a subject is allowed to
        do.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21846
      impact: >-
        The `authorization.deckhouse.io/v1alpha1` group serves BulkSubjectAccessReview (many access checks

        in one request), AccessibleNamespace (the namespaces a user may see, without cluster-wide

        `list namespaces`), WhoCan (the subjects allowed to perform an action) and SubjectAccessReport

        (everything a subject is allowed to do, with the origin of each row). Reports about other subjects

        require the `nonself` subresource, granted by dedicated checker roles.
    - summary: >-
        Resetting an occupied identity, deleting its ClusterAuthorizationRule, or connecting a DexProvider
        that can assert it now requires a can-assign range; levels are trusted only on platform-labelled
        roles.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22694
      impact: >-
        A subject who can create UserOperations cannot reset, lock, or unlock an

        identity whose email or group membership already carries roles they cannot

        assign. Nested Group membership counts. Deleting a ClusterAuthorizationRule

        is allowed only if the requester could assign those roles. Creating or

        reconnecting a DexProvider without spec.allowedIdentities on a cluster that

        already has a SuperAdmin grant requires SuperAdmin; ClusterAdmin and the

        security subsystem manager keep rotating secrets, toggling, renaming,

        narrowing and re-applying existing providers, and connect providers whose

        allowedIdentities reach only roles they can assign. GitOps that adds an

        unlimited provider or removes a SuperAdmin rule must run as a SuperAdmin.
    - summary: >-
        The `deprecatedRBACv2BindingsCount` release requirement blocks the release that removes the compatibility
        aliases of the pre-1.78 RBACv2 role names while a binding to such a name is still in the cluster;
        the `DeckhouseRelease` status lists the bindings to recreate.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23240
    - summary: >-
        The RBACv2 subsystem roles follow the DKP subsystem list `iam`, `security`, `cluster`, `delivery`,
        `network`, `storage`, `observability` and `managed-services`, and the in-tree modules carry the
        labels of their new subsystems.
      impact: >-
        The subsystem roles are `d8:subsystem:<subsystem>:<level>` for the eight subsystems. `deckhouse`,
        `infrastructure` and `kubernetes` are merged into `cluster`, `networking` is renamed to `network`,
        and user-authz, user-authn and multitenancy-manager move to `iam`, whose manager also assigns
        roles.

        The deprecated `d8:manage:deckhouse:*`, `d8:manage:infrastructure:*` and `d8:manage:kubernetes:*`
        roles keep the rights of the modules that were in these subsystems. Their replacement `d8:subsystem:cluster:*`
        grants more, so check which subsystem roles the subjects need before you recreate the bindings.

        A binding to the deprecated `d8:manage:security:<level>` role is replaced by bindings to both
        `d8:subsystem:iam:<level>` and `d8:subsystem:security:<level>`, because the rights for user-authn
        and user-authz and, at the `manager` level, the right to assign roles come with the `iam` role.

        A ClusterRoleBinding `user-authz:<rule>:additional-role:<role>` to a deprecated role is changed
        in `spec.additionalRoles` of the ClusterAuthorizationRule `<rule>`, and a binding that a project
        template renders is changed in the ProjectTemplate.

        No role of the new model collects the `rbac.deckhouse.io/aggregate-to-{deckhouse,infrastructure,kubernetes,networking}-as`
        labels. A custom capability or a module that still carries one reaches only the bindings to the
        deprecated names, and the `D8UserAuthzRetiredAggregationLabel` alert lists them.

        `d8:namespace:*` and `d8:project:*` do not collect the use capabilities of the previous scheme,
        `rbac.deckhouse.io/kind: use` with `rbac.deckhouse.io/aggregate-to-kubernetes-as`, nor the use
        roles of a module with a subsystem of its own, such as `d8:use:role:<level>:virtualization` with
        `rbac.deckhouse.io/aggregate-to-all-as`, and the `D8UserAuthzLegacyUseCapability` alert lists
        both. Until the module carries the new labels, give the subjects that need these rights a RoleBinding
        to the ClusterRole the alert names next to their RoleBinding to `d8:namespace:<level>`. Where
        the grants webhook of a project namespace refuses it, because the ClusterRole has no `rbac.deckhouse.io/delegatable`
        label, keep the RoleBinding on `d8:use:role:<level>`; it holds the next release until the module
        is updated.

        A ClusterRoleBinding to a deprecated `d8:manage:*` role keeps its `d8:use:viewer:binding:<name>`
        or `d8:use:user:binding:<name>` RoleBindings in the module namespaces while it refers to the old
        name. The deprecated `d8:use:role:<level>` and `d8:manage:all:<level>` roles keep the rights of
        the modules that still ship the old labels, such as log-shipper, prometheus-metrics-adapter and
        virtualization.

        The RoleBindings that the previous release created for a binding to a custom manage role of the
        old scheme are removed. Once the role is recreated as a `d8:custom:*` role of the system or subsystem
        scope, they come back in the namespaces of the modules that already carry the new labels. For
        a module that still carries the old labels, create RoleBindings in its namespace to `d8:namespace:<level>`
        and to the module ClusterRoles that the `D8UserAuthzLegacyUseCapability` alert names, and delete
        them once the module carries the new labels. A RoleBinding to `d8:use:role:<level>` there gives
        the same rights, but it holds the next release.

        A ClusterRole outside Deckhouse can no longer be created with `rbac.deckhouse.io/aggregate-to-all-as`,
        and an existing one can be updated only to remove that label.
    - summary: >-
        In multi-tenancy mode on Kubernetes 1.34 and later, the API server refuses ID tokens revoked by
        user-authn within seconds.
      impact: >-
        The new `D8UserAuthzRevocationCheckNotSynced` alert fires when a user-authz webhook instance has
        not loaded the revocations for 10 minutes; revoked Dex tokens keep working through that master
        until they expire.
    - summary: >-
        The SelfScopedAccessReview resource answers in one query where within a list scope (accessible,
        projects, system, project) the caller may perform actions: in the whole cluster, in how many namespaces
        and in which ones.
    - summary: The `antiopa` and `loghouse` namespaces are no longer system namespaces of ClusterAuthorizationRule.
      impact: >-
        In a cluster that still has the `antiopa` or `loghouse` namespace, a ClusterAuthorizationRule
        without `allowAccessToSystemNamespaces` now gives its subjects access to these namespaces when
        it has neither `limitNamespaces` nor `namespaceSelector`, or when a `limitNamespaces` pattern
        matches them (for example `.*`). Check with `kubectl get ns antiopa loghouse`. These namespaces
        are left from components that preceded Deckhouse; delete them if nothing uses them. To keep such
        a namespace closed, list the namespaces of the rule in `limitNamespaces` with patterns that do
        not match it. Do not use `namespaceSelector` for this: a selector replaces `limitNamespaces` and
        `allowAccessToSystemNamespaces` and opens every namespace it matches, system namespaces included.
    - summary: The revocation check denies every token issued through a revoked token-exchange connector.
    - summary: >-
        SelfScopedAccessReview answers reads of aggregated API resources opted in to scoped listings with
        the namespaces where they are allowed.
  fixes:
    - summary: fix cve
      pull_request: https://github.com/deckhouse/deckhouse/pull/21817
    - summary: >-
        Fix multitenancy validatiing webhook to read effective enableMultiTenancy from the Module `v1alpha2`
        CR
      pull_request: https://github.com/deckhouse/deckhouse/pull/21936
    - summary: A namespace denial no longer reveals whether the namespace exists.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21672
    - summary: Reject empty subject names in AuthorizationRule and ClusterAuthorizationRule.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21998
    - summary: Fix multitenancy check hooks
      pull_request: https://github.com/deckhouse/deckhouse/pull/22158
    - summary: >-
        Reject local Group names and User emails that collide with a subject already granted privileges
        by an authorization rule.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22218
      impact: >-
        Creating a `Group` or a `User`, or renaming an existing one, so that `Group.spec.name` matches
        a group subject or `User.spec.email` matches a user subject of an existing AuthorizationRule or
        ClusterAuthorizationRule is now rejected, preventing an unintended privilege grant. The email
        is compared after lowercasing, since that is the form that reaches the token. Set the `user-authz.deckhouse.io/allow-authorization-rule-collision`
        annotation to `"true"` on the object if the collision is intentional. Already existing objects
        keep working and only produce a warning. Any declarative flow that manages both the rule and the
        identity is affected, not only one that deletes and recreates the identity: a first-time apply
        denies the `Group` or `User` whenever the rule happens to be applied first, and nothing guarantees
        the order. Add the annotation to such objects before upgrading. Deleting a `Group` or a `User`
        whose name is still a subject of a rule now produces a warning, since the rule keeps granting
        that name.
    - summary: Remove node subresources from the RBACv2 viewer permission role
      pull_request: https://github.com/deckhouse/deckhouse/pull/22386
      impact: >-
        The `d8:manage:permission:subsystem:kubernetes:view_resources` role no longer grants `nodes/proxy`,

        `nodes/log`, `nodes/metrics` and `nodes/stats`. Users holding `d8:manage:kubernetes:viewer`,

        `d8:manage:infrastructure:viewer` or any role aggregating them lose access to the kubelet API
        through

        `/api/v1/nodes/<node>/proxy/...`. `nodes` themselves stay readable. Automation that relied on
        reaching

        the kubelet API with one of these roles must be granted a dedicated role explicitly.
    - summary: Documented `d8 iam access grant/revoke` CLI for managing authorization rules
      pull_request: https://github.com/deckhouse/deckhouse/pull/21956
    - summary: >-
        Documented the automatically-bound d8:use:dict read-only role for discovering reference cluster
        resources.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21952
    - summary: >-
        The identity collision check no longer applies to the platform's own identities, so a retried
        bootstrap creates the initial User again instead of timing out.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22868
      impact: >-
        The installer, the deckhouse ServiceAccount, holders of the cluster

        administrator kubeconfig and the kube-system / d8-system ServiceAccounts

        can create a User or a Group named by an existing authorization rule

        without the acknowledgement annotation. Every other requester is checked

        as before.
    - summary: Speed up permission-browser BulkSAR for users with namespace filters
      pull_request: https://github.com/deckhouse/deckhouse/pull/22731
    - summary: >-
        Grant custom ClusterRoles (annotated with `user-authz.deckhouse.io/access-level`) through one
        aggregated ClusterRole per access level, so the number of bindings per ClusterAuthorizationRule/AuthorizationRule
        no longer depends on the number of such roles.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22824
      impact: >-
        During the first `user-authz` release after the update the per-role bindings are protected from
        the release engine, the aggregated ones are created, and the per-role bindings are deleted right
        after the release. Permissions granted through annotated ClusterRoles stay in place throughout.

        The `user-authz.deckhouse.io/access-level` label is now set automatically on annotated ClusterRoles.

        In audit logs, access granted through annotated ClusterRoles is attributed to `user-authz:<level>:custom`
        instead of the individual ClusterRole.
    - summary: >-
        Create the user-authz-controller namespace and registry secret regardless of MultiTenancy, so
        the module converges with MultiTenancy disabled.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22921
    - summary: >-
        Group the module alerts under a group named apart from the alerts themselves, so the incident
        shelf accepts them.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22928
    - summary: >-
        Added missing RBAC v1 rules for pods/resize (Editor+), serviceaccounts/token (Admin+) and namespaces/finalize
        (ClusterAdmin).
      pull_request: https://github.com/deckhouse/deckhouse/pull/22470
      impact: >-
        Permission expansion for existing bindings.


        - Users already bound to Editor (and above) will gain in-place pod resource resize (pods/resize:
        get,patch), which changes container requests/limits on running pods without recreating them.

        - Users already bound to Admin (and above) will gain the ability to mint ServiceAccount tokens
        (serviceaccounts/token: create) in their namespaces."
    - summary: >-
        The D8UserAuthzRenderSlow and D8UserAuthzReleaseSlow alerts no longer fire on a single slow render
        or release, such as a cluster bootstrap under CPU pressure or the one-time migration pass.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22993
      impact: >-
        D8UserAuthzRenderSlow requires at least three renders averaging above 30 seconds over 30 minutes,

        D8UserAuthzReleaseSlow at least two releases averaging above 5 minutes over one hour, and both
        must

        hold for 15 minutes. Severities are one step lower (6 and 7). Their descriptions now point at
        CPU

        shortage on the node rather than at the number of ClusterAuthorizationRules, which does not affect

        render time.
    - summary: >-
        A request for a resource that does not exist answers 404 instead of 403 for users covered by a
        ClusterAuthorizationRule.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22943
      impact: >-
        The authorization webhook no longer denies a cluster-scoped request when discovery reports that

        the resource does not exist; RBAC answers and the API server returns 404, as it does for a user

        without a rule. A discovery failure still denies. Permission Browser reports the same.
    - summary: >-
        The authorization webhook is no longer restarted by its own liveness probe while the API server
        is restarting.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22943
      impact: >-
        Liveness stops depending on the API server, readiness takes that over, and every probe gets an

        explicit timeout. The webhook is restarted on update. On large clusters it now starts answering

        before its caches are filled, refusing requests with an error until they are, which is the same

        outcome as the closed port it used to present.
    - summary: >-
        A `limitNamespaces` entry containing an alternation is anchored on every branch, so a rule written
        as `a|b` no longer covers namespaces whose names merely end in `b`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22943
      impact: >-
        Patterns were anchored by concatenation, which left every branch but the first unanchored at the

        start: `team-.*|kube-system` also matched `attacker-kube-system`. Such a rule now covers fewer

        namespaces — the branches as written and nothing else. Nothing gains access.
    - summary: >-
        user-authz-controller reports not ready when it cannot read the API, instead of staying Ready
        with synced-but-dead informers.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22992
      impact: >-
        Readiness now includes one uncached read per probe, and the probe timeout grows from 3 to 5 seconds.

        A controller whose access to the API server is lost becomes NotReady within a few seconds and
        Ready

        again once access returns. The leader lease is renewed at 60 s / 40 s instead of 15 s / 10 s,
        so a

        short API-server absence no longer restarts the pod.
    - summary: >-
        A rollout of permission-browser-apiserver with one replica keeps the authorization.deckhouse.io
        API served.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22992
      impact: >-
        Outside HA the Deployment uses the default rolling update, which starts the new pod before removing

        the old one; in HA nothing changes.
    - summary: The authorization webhook logs SubjectAccessReview bodies only for denied requests.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22992
      impact: >-
        The full review body — identity, groups, resource, answer — is written for denials only; allowed

        and no-opinion answers are no longer logged. There is no configuration for this in the module.
    - summary: >-
        Subjects that hold a project role through ProjectRoleBinding or ClusterProjectRoleBinding receive
        the read-only dictionaries (d8:dict) like namespace-role holders; the exec webhook binding excludes
        the aggregation controller and the multitenancy-manager controller at the API server.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23022
    - summary: >-
        The deprecated d8:use:role:* aliases can no longer be the target of a new ProjectRoleBinding or
        ClusterProjectRoleBinding; existing RoleBindings to them keep working.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23022
      impact: >-
        A ProjectRoleBinding or ClusterProjectRoleBinding that names a `d8:use:role:*` alias is refused
        with a pointer to the `d8:namespace:*` role; migrate such bindings to the new names.
    - summary: >-
        The FAQ and README describe how ClusterAuthorizationRule, AuthorizationRule and RoleBinding permissions
        combine in multitenancy mode, which roles get the d8:dict binding, and what the identity collision
        check covers; the legacy-to-granular role mapping table is corrected.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23022
    - summary: >-
        A ClusterRole that carries a platform aggregation label without declaring itself a custom capability
        is now refused; such an object used to be merged into the platform role of that lineage for every
        holder in the cluster.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23124
    - summary: >-
        A ClusterRole that carries a platform aggregation label without being a custom capability is exported
        as `d8_user_authz_foreign_aggregation_label` and raises `D8UserAuthzForeignAggregationLabel`,
        since the webhook only refuses new writes of such a role.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23124
    - summary: Fixed CVEs in the `permission-browser-apiserver` image.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23287
    - summary: >-
        The RBACv2 migration guide describes what the compatibility aliases do not carry, and the README
        tells module authors that the system-resource marker is a label, not an annotation.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23180
    - summary: >-
        The FAQ and the `D8UserAuthzLegacyRBACv2CustomRoleFound` alert say that legacy RBACv2 custom roles
        hold back the release after DKP 1.78 through the `legacyRBACv2CustomRolesCount` requirement; the
        upgrade to 1.78 itself is not blocked.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23240
    - summary: >-
        rbacv2-migrate-module.sh migrates a module with a subsystem of its own, such as virtualization,
        to the 1.78 role model.
    - summary: >-
        The authorization webhook answers 500 and logs the real error instead of terminating when it cannot
        marshal a response.
    - summary: >-
        A limitNamespaces entry `^.*`, `.*$`, `^.+` or `.+$` counts as every namespace again, as in the
        authorization webhook before the shared rules library.
    - summary: A `kube-apiserver` health probes no longer fail when `authz-webhook` is unavailable.
    - summary: >-
        The identity-assign check treats an identity with every permission across the cluster, such as
        a subject of `cluster-admin` bound by a ClusterRoleBinding, as SuperAdmin.
      impact: >-
        Such identities can write ClusterAuthorizationRules, Users, Groups, UserOperations and DexProviders
        that reach `SuperAdmin` or `cluster-admin`. A ClusterAuthorizationRule gives this right only through
        its bindings, only without `namespaceSelector` and `limitNamespaces`, and, with multi-tenancy
        on, only with `allowAccessToSystemNamespaces: true`, even if it grants `cluster-admin`. Project
        role bindings never do.
    - summary: >-
        The `D8UserAuthzLegacyRBACv2CustomRoleFound` alert reports every custom role that still selects
        capabilities by the old `rbac.deckhouse.io/kind` label or by the aggregation label of a lineage
        no built-in role collects, whatever its name, no longer counts frozen roles and capabilities,
        and describes how to restore the access of such a role.
    - summary: >-
        Refuse to disable `enableMultiTenancy` while a ClusterAuthorizationRule sets only `namespaceSelector`.
    - summary: >-
        Managers who assign roles by range can again change DexProviders, UserOperations, Users and Groups
        of identities that hold a ClusterAuthorizationRule.
    - summary: The leader election messages of user-authz-controller are JSON with a level instead of
        plain text.
    - summary: >-
        The ClusterAuthorizationRule and system ClusterRole webhooks are ValidationWebhook resources in
        Python and always return a valid response, whatever the names in the object.
    - summary: The authorization webhook answers the requests in flight when it restarts instead of denying
        them.
    - summary: >-
        A custom system or subsystem role is projected into the namespaces of its modules as `viewer`
        at most; a higher `rbac.deckhouse.io/use-role` label is refused by the webhook and ignored by
        the controller with a `ProjectionCapped` event.
      impact: >-
        Custom system or subsystem roles labelled `rbac.deckhouse.io/use-role` above `viewer` are projected
        as `viewer` after the update; the `d8_user_authz_projection_capped` metric names them, and any
        later change of such a role is refused until the label is set to `viewer` (without the label the
        role is not projected). A capability not built into the platform no longer adds its `rbac.deckhouse.io/namespace`
        to a projection.
    - summary: >-
        The system and IAM managers assign roles up to the manager level and ClusterEditor, and cannot
        open the system namespaces through a ClusterAuthorizationRule.
      impact: >-
        Holders of `d8:system:manager`, `d8:subsystem:iam:manager` and the deprecated `d8:manage:all:manager`
        and `d8:manage:security:manager` can no longer write a ClusterAuthorizationRule with `Admin`,
        `ClusterAdmin` or `SuperAdmin` or one that opens the system namespaces (`allowAccessToSystemNamespaces`,
        `namespaceSelector.matchAny`, a `labelSelector` that does not name its namespaces by `kubernetes.io/metadata.name`,
        a rule for a request another such rule already lets in, the requester's own included, or any rule
        while multitenancy mode is disabled, so in CE no ClusterAuthorizationRule at all), cannot create
        Users, add Group members, run UserOperations or connect DexProviders for the identities of such
        rules, cannot add a member already let into the system namespaces to a Group with such a rule,
        need the range for the roles of the groups above a Group they write, cannot turn multitenancy
        mode off, cannot assign `admin` and `superadmin` roles of the granular model, and cannot write
        admission webhooks and policies. Existing rules stay; a ClusterAdmin or a SuperAdmin does these.
    - summary: >-
        Fixed CVE-2026-78659, CVE-2026-78660, CVE-2026-78663, CVE-2026-78669 and CVE-2026-97032 in `golang.org/x/net`
        and CVE-2026-56851 in `golang.org/x/text`.
    - summary: >-
        Scoped listings (`d8 k get -A --scope`) include the namespaces where a RoleBinding grants access
        to every authenticated user.
    - summary: >-
        Creating ModuleConfig user-authz without enableMultiTenancy no longer fails with an internal webhook
        error.
    - summary: >-
        Fixed CVE-2026-63209 in `github.com/klauspost/compress` and CVE-2026-78661 and CVE-2026-97045
        in `golang.org/x/net`.
    - summary: >-
        Only the Commander agent may create or change ClusterRoles named with the `d8:commander:` prefix;
        they are no longer exempt from the RBAC v2 admission checks for other users.
      impact: >-
        A `d8:commander:*` ClusterRole created or changed by anyone except system:serviceaccount:d8-commander-agent:commander-agent
        is now refused, including a re-apply of such a role by a GitOps tool or kubectl. Roles already
        in the cluster keep working and can still be deleted.
    - summary: >-
        Below the superadmin level, creating an object with the `deckhouse.io/system-resource` label,
        or putting the label into the pod template of a workload, is denied, as changing or deleting such
        an object already was.
    - summary: >-
        ServiceAccounts of all `d8-*` namespaces bypass the system-resource protection, not only those
        of `d8-system` and `kube-system`.
      impact: >-
        They may create, change and delete objects labeled `deckhouse.io/system-resource: "true"` and
        run `exec`, `attach` and `port-forward` in such pods. permission-browser reports them as superadmin
        in `SubjectAccessReport`.
    - summary: >-
        The policy that protects the webhook-handler configuration no longer denies collection deletes
        of ValidatingWebhookConfigurations.
vertical-pod-autoscaler:
  features:
    - summary: >-
        Add the recommendationFactor field to VerticalPodAutoscaler container policies to scale the CPU
        and memory recommendations of a workload.
  fixes:
    - summary: Reduce VPA memory recommendation rounding from 64Mi to 16Mi and round CPU recommendations
        up to 10m.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22509
      impact: >-
        The `vpa-recommender` pod is restarted and recommendations are recalculated with the new granularity.

        Memory recommendations will generally become lower (less over-provisioning), CPU recommendations
        become

        multiples of 10m. VPA objects with `updateMode: Auto`/`Recreate` may evict and recreate pods to
        apply

        the updated requests.
    - summary: >-
        On Kubernetes 1.33 and later, VPA objects without updateMode now use the InPlaceOrRecreate mode,
        as the documentation describes, instead of Recreate.
      impact: >-
        On Kubernetes 1.33 and later, new VerticalPodAutoscaler objects without spec.updatePolicy get
        updateMode set to InPlaceOrRecreate. VPA resizes their pods in place where possible and evicts
        pods only as a fallback. This includes running pods of single-replica workloads, which VPA did
        not update before. Existing VPA objects keep the update mode already stored in them. The vpa-recommender,
        vpa-updater and vpa-admission-controller pods are restarted.
    - summary: >-
        Fix a panic in vpa-updater and vpa-admission-controller when a pod with a container without resources
        is capped to a LimitRange of type Pod.
