  features:
    - summary: Periodic Istio configuration analysis monitoring (EE)
      pull_request: https://github.com/deckhouse/deckhouse/pull/21349
    - summary: Grafana dashboard for Istio configuration analysis health
      pull_request: https://github.com/deckhouse/deckhouse/pull/21827
    - summary: Added support for Istio 1.29.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21693
    - summary: >-
        Support providing a custom Istio CA via a Secret reference (`ca.secretRef`), with strict validation
        and safe rotation handling.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21219
    - summary: Bind multicluster peer CAs to the mesh trust domain
      pull_request: https://github.com/deckhouse/deckhouse/pull/22441
    - summary: Add experimental native ambient multicluster support.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23031
    - summary: Ship default waypoint injection template with Istio 1.29.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23031
    - summary: Kiali can be read by in-cluster clients over a verified TLS connection
    - summary: >-
        IstioFederation and IstioMulticluster report precise reasons for metadata exchange failures in
        status conditions.
    - summary: >-
        Added the experimental `multicluster.mode` setting to choose between sidecar and ambient multicluster.
    - summary: Use Kubernetes native sidecars for Istio 1.27+ by default.
      impact: >-
        istiod Pods for Istio 1.27+ restart. Pods created after the update get `istio-proxy` in `spec.initContainers`
        instead of `spec.containers`. Running Pods keep their sidecar type until they are recreated. Workloads
        with the `istio.deckhouse.io/auto-upgrade` label may be recreated automatically.

        New Pods don't start their application containers until istiod is available and the proxy is ready.

        The traffic of application init containers now goes through `istio-proxy` and follows the mesh
        rules: `outboundTrafficPolicyMode`, `Sidecar` egress settings, `AuthorizationPolicy` and mTLS.
        Before, in the `InitContainer` traffic redirection mode (the default), it bypassed the mesh. Check
        init containers that connect to services outside the mesh: with `outboundTrafficPolicyMode: RegistryOnly`,
        register these services with a `ServiceEntry`.

        Check scripts, admission policies, webhooks, alerts and dashboards that look for `istio-proxy`
        in `spec.containers` instead of `spec.initContainers`.

        The `istio-proxy` image for Istio 1.27+ no longer contains `bash`, `sh`, `curl`, `ss`, `grep`,
        `xargs`, `wc`, `sleep` and `echo`. Commands that run them in the `istio-proxy` container stop
        working.

        To temporarily keep regular sidecars, set `ENABLE_NATIVE_SIDECARS: "false"` in the `controlPlane.extraEnvs`
        parameter.
    - summary: Added `envoyExtAuthzHttp`, `opentelemetry` and `zipkin` types to `dataPlane.extensionProviders`.
  fixes:
    - summary: fixed build vex in cse
      pull_request: https://github.com/deckhouse/deckhouse/pull/21641
    - summary: Fix operator 1.25 startup with containerd v2 and RO rootfs
      pull_request: https://github.com/deckhouse/deckhouse/pull/21772
    - summary: Add missing tools to proxyv2 images so the application-aware proxy termination hook works
        correctly.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22046
    - summary: Fix graceful draining of established HTTP connections when application pods terminate.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22068
    - summary: >-
        Webhook `caBundle` now uses the root certificate (`ca.root`) instead of the signing certificate,
        matching istiod's advertised `root-cert.pem`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21219
      impact: >-
        On upgrade, clusters that use an inline **intermediate** CA (`ca.cert` is an intermediate, with
        a distinct `ca.root`) will have the mutating/validating webhook `caBundle` change from the intermediate
        to the root certificate, and istiod pods may restart if the mounted CA material differs. Self-signed
        and single-cert CAs are unaffected (`root` == `cert`).
    - summary: >-
        Inline `ca.*` CA material is now validated (single `CA:TRUE` cert, matching key, root anchoring
        the cert through the chain) and hard-blocks the module when invalid, instead of being copied verbatim
        to istiod.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21219
      impact: >-
        On upgrade, an existing inline CA that is malformed, incomplete (e.g. `key` without `cert`), or
        whose declared `root` does not anchor `cert` will now hard-block the istio module until corrected.
        Configurations with valid inline CA material are unaffected.
    - summary: Restore Istiod pod anti-affinity for Istio 1.25 installations managed by the Sail Operator.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22157
    - summary: Analysis issue fix
      pull_request: https://github.com/deckhouse/deckhouse/pull/21860
    - summary: Restrict metadata discovery server-side request forgery and pin remote cluster UUID
      pull_request: https://github.com/deckhouse/deckhouse/pull/22696
    - summary: Waypoints are no longer advertised as cross-network east-west gateways.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22770
    - summary: Enable Istio Gateway API deployment and gatewayclass controllers for istiod 1.27 and 1.29.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22768
    - summary: Do not restart kube-apiserver when the set of installed Istio versions changes.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22800
    - summary: >-
        Allow multicluster api-proxy to read ConfigMaps in `d8-istio`, so istiod can read the mesh config
        of remote clusters with Istio 1.29.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22902
    - summary: Document that ambient-mode workloads cannot take part in federation or multicluster.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22939
    - summary: >-
        Align the cluster ID used for multicluster peers with the one used by the

        local cluster, for better support of ambient in multicluster setups.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22884
      impact: >-
        Remote endpoints of multicluster peers may briefly disappear and come back

        during the upgrade.  Cross-cluster traffic served only by a remote peer can

        fail for a few seconds, so plan the upgrade accordingly if your multicluster

        setup is latency-sensitive.
    - summary: Fix default Prometheus datasource in the Istio Configuration Health dashboard
      pull_request: https://github.com/deckhouse/deckhouse/pull/23071
    - summary: Fix istio-cni SecurityPolicyException.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23045
    - summary: Fix istiod RBAC rules that drifted away from upstream.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23081
    - summary: Propagate clusterDomain to ztunnel in ambient mode.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23082
    - summary: >-
        Resolve the desired istio revision and application namespaces the same way the sidecar-injector
        webhooks do.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23238
    - summary: >-
        Detect terminating namespaces and objects by the `metadata.deletionTimestamp` field, not by an
        annotation.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23238
    - summary: >-
        Fix injected sidecars and gateways not getting a seccompProfile and an istio-proxy livenessProbe
        in some configurations.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23210
    - summary: Fix east-west gateway to track mesh config changes.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23031
    - summary: Sort east-west gateway addresses published to peer clusters.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23031
    - summary: Fix leaking istiod control plane after removing an Istio version or disabling the module.
    - summary: >-
        Deckhouse update requirements now take into account Istio control planes that are still being
        removed.
    - summary: The Istio operator now recovers Helm releases stuck in the `pending-*` or `uninstalling`
        state.
    - summary: >-
        metadata-exporter no longer serves private metadata to a cluster registered with another alliance
        kind and no longer discloses internal errors or cluster relationships in refusals.
    - summary: Peer clusters keep the last known gateway addresses when a gateway temporarily has no address.
    - summary: The default VPA memory maximum for ingress gateway and waypoint proxies is now `2048Mi`
        everywhere.
    - summary: Fixed image pulling for waypoint pods in namespaces without sidecar-injected workloads.
    - summary: >-
        Fix the Istio OpenAPI examples, and fix the DMT findings in istiod and the ambient east-west gateway.
    - summary: >-
        Users with the `User` access level can now view `WaypointInstance` resources, and users with the
        `Editor` access level can manage them.
    - summary: Added VEX for CVE-2026-85747 in pilot, proxyv2 and config-analyzer images.
    - summary: added limit paralle in common images
    - summary: Fixed Zipkin tracing in Telemetry API mode, which made istiod reject the whole mesh config.
      impact: >-
        `tracing.collector.zipkin.address` must now be in strict `<host>:<port>` format. Other values
        fail validation.

        In Telemetry API mode, the host must be the full service hostname, for example `zipkin.tracing.svc.cluster.local`.
    - summary: >-
        The `d8-main` Telemetry no longer references the `deckhouse-tracing` provider when the module
        doesn't register it.
    - summary: >-
        Fixed istio module installation with nelm v2 when Istio is managed by the istio operator (versions
        below 1.27).
    - summary: Fixed CVE-2026-63209 in istio images.
    - summary: >-
        Fixed `alliance-healthcheck` keeping the sidecar of the previous Istio version after a `globalVersion`
        change.
    - summary: >-
        Fixed ambient mode on nodes with legacy iptables, where `istio-cni-node` crashed on Istio 1.25
        and used nftables instead of legacy iptables on Istio 1.27 and later.
      impact: >-
        In ambient mode with Istio 1.27 or later, on nodes with legacy iptables, `istio-cni-node` switches
        from nftables to legacy iptables. Pods that were added to the mesh before the update keep their
        nftables rules. Restart these pods after the update. Otherwise, removing such a pod from the mesh
        without a restart leaves its old redirect rules in place, and the pod loses network connectivity.
    - summary: The Istio network name is now consistent in every mode, not only in ambient multicluster.
      impact: >-
        With ambient enabled, the ztunnel DaemonSet restarts. Until it has restarted on every node (and
        the same again on a rollback), traffic from nodes with the old ztunnel bypasses Service waypoints.
        AuthorizationPolicy, HTTPRoute, retries and timeouts on these waypoints are not applied during
        this time. Watch the ztunnel rollout until it finishes.

        In Services that mix sidecar-injected and non-injected pods, traffic distribution with `trafficDistribution:
        PreferClose` may change: non-injected pods now belong to the cluster network.
    - summary: >-
        Fixed requests to Services that exist only in a remote multicluster peer failing with 503 when
        that peer has no Istio 1.29 control plane.
    - summary: >-
        Fixed CVEs in go-jose and golang.org/x/net in Istio, Kiali and alliance images; migrated from
        go-jose v3 to v4.
      impact: >-
        Istio module components and ingress gateways will restart. Restart application pods to update
        Istio sidecars.
    - summary: >-
        The Istio network name of new installations no longer depends on the cluster domain and is always
        a valid label value. Existing installations keep their current name.
    - summary: Preserve the custom TLS certificate used by Kiali when multicluster is enabled.
    - summary: Close readiness probe response bodies in Istio API proxy.
keepalived:
  fixes:
    - summary: Fixed Python linking in the keepalived module image.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21610
kube-dns:
  fixes:
    - summary: >-
        Set resource limits for the `render-etc-hosts-with-cluster-domain-aliases` init container so that
        pods can be created in namespaces with a ResourceQuota on `limits.cpu`/`limits.memory`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23266
    - summary: Fixed known vulnerabilities in the CoreDNS and sts-pods-hosts-appender images.
      impact: CoreDNS pods will be restarted.
    - summary: Fixed a known vulnerability in the CoreDNS image.
      impact: CoreDNS pods will be restarted.
    - summary: Fixed CVE-2026-78661 and CVE-2026-97045 in the sts-pods-hosts-appender-webhook image.
kube-proxy:
  fixes:
    - summary: >-
        Bump Go dependencies in the kube-proxy init-container and document non-exploitable CVEs via VEX
        to fix known CVEs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21833
      impact: The kube-proxy DaemonSet pods will restart after the update.
    - summary: >-
        kube-proxy no longer races with node-manager when deciding which address to bind NodePort services
        to on a freshly created node.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22599
      impact: kube-proxy now waits for node-manager to finish applying the node template first, closing
        the race
    - summary: >-
        Fixed kube-proxy failing to start on Kubernetes 1.36 and higher because of the removed `TopologyAwareHints`
        feature gate.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23320
      impact: The `d8-kube-proxy` pods will be restarted on all nodes.
    - summary: Fixed known vulnerabilities in the kube-proxy init-container image.
      impact: kube-proxy pods will be restarted.
    - summary: Fixed known vulnerabilities in the kube-proxy images.
      impact: kube-proxy pods will be restarted.
local-path-provisioner:
  fixes:
    - summary: Fix CVEs in the Go dependencies of the `local-path-provisioner` image.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22332
      impact: The `local-path-provisioner` Deployment will be restarted.
    - summary: >-
        Helper pods drop all capabilities except `DAC_OVERRIDE` and `FOWNER`, and the provisioner and
        its helper pods are covered by SecurityPolicyExceptions to pass the restricted Pod Security policy
        for system namespaces.
    - summary: >-
        The provisioner is built with `golang.org/x/net` v0.60.0 and `golang.org/x/text` v0.42.0 to fix
        CVEs.
    - summary: >-
        `config.json` of the provisioner is serialized from a structure, and the CRD accepts in `spec.path`
        only an absolute path without quotes, backslashes, whitespace and control characters. A crafted
        path can no longer add manifests to the module release.
metallb:
  fixes:
    - summary: >-
        Fixed creation of `BGPPeer` objects on Kubernetes 1.36+, which blocked BGP sessions and LoadBalancer
        IP announcements in BGP mode.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23304
    - summary: Describe how to run metallb speakers on nodes with custom taints.
    - summary: Fixed known vulnerabilities in the MetalLB images.
      impact: metallb pods will be restarted.
    - summary: Fixed CVE-2026-78661 and CVE-2026-97045 in the metallb and l2lb images.
      impact: The metallb components (controller, speaker, l2lb) will restart after the update.
    - summary: >-
        Fixed BGP migration to preserve pool allocation flags and allow users to manage migrated resources
        after switching ModuleConfig to version 3.
multitenancy-manager:
  features:
    - summary: A project is a unit of access with its own bindings, additional namespaces and structured
        templates.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21846
      impact: >-
        ProjectRoleBinding grants a role across every namespace of one project, ClusterProjectRoleBinding

        across every project including future ones, and ProjectNamespace orders an additional namespace

        inside a project -- replacing per-namespace RoleBindings maintained by hand.


        Project v1alpha3 carries `spec.administrators` and `spec.quota` as fields instead of template

        parameters, and reports `status.usage` and `status.namespaces`. ProjectTemplate v1alpha2 describes

        a project through structured fields rendered natively instead of a Helm string; the free-form

        `resourcesTemplate` keeps working. ProjectTemplate v1alpha1 is no longer served, and Project

        v1alpha1 is retired -- objects are converted on read.


        The project list now also contains the virtual projects `deckhouse` and `default`, so every

        namespace of the cluster belongs to a project.
    - summary: >-
        Every namespace outside a project is adopted into a full project with a template inferred from
        the namespace, and the project managed by its namespace is gone.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22609
      impact: >-
        Breaking changes for clusters that relied on the previous model.


        - An auto-wrapped namespace used to be freely deletable, and deleting it deleted its project.
        Its namespace is an ordinary project namespace now, so the admission policy refuses to delete
        or edit it; delete the `Project` instead.

        - Namespaces that used to be orphans are project namespaces now, so the cluster-resource grant
        allow-list applies to them. RoleBindings to non-delegatable ClusterRoles in those namespaces start
        being denied.

        - The spec of a previously namespace-managed project is no longer controller-owned and can be
        edited directly; its labels and annotations are no longer mirrored from the namespace.

        - The `projects.deckhouse.io/adopt` annotation no longer does anything; adoption is automatic.

        - `allowNamespacesWithoutProjects` is deprecated and ignored, and will be removed in the next
        release.

        - A leftover wrap whose namespace is already gone or Terminating is deleted instead of Helm-recreating
        the namespace.
    - summary: >-
        ProjectTemplate v1alpha2 is structured-only; the Helm resourcesTemplate string is removed from
        the API and a template that carried one is parked for rewriting instead of being rendered.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23011
      impact: >-
        Breaking change for clusters with custom ProjectTemplates written as Helm strings.


        - `spec.resourcesTemplate` no longer exists in `ProjectTemplate` v1alpha2; a manifest that carries
        it is refused by the schema.

        - A template stored as v1alpha1 with a Helm string is converted without the string and marked
        with the `projects.deckhouse.io/legacy-helm-template: "true"` annotation. Projects of such a template
        switch to the `Error` state with the `ProjectTemplateUsable` condition and are not rendered; their
        existing objects are not touched. Rewrite the template with structured fields and remove the annotation
        to resume.

        - The built-in `simple` template renders the required-requests OperationPolicy only when the new
        `requiredRequests` parameter is `true`; existing projects on `simple` keep rendering the namespace
        only.

        - The `TemplateResourcesFiltered` and `TemplateRolesAllowed` project conditions and the `projects.deckhouse.io/unmanaged`
        and `projects.deckhouse.io/skip-heritage-label` labels are removed together with the Helm-string
        path.
    - summary: >-
        The MultitenancyManagerDeprecatedConfigParameter alert fires while a ModuleConfig still sets the
        deprecated and ignored allowNamespacesWithoutProjects parameter, which is removed in the next
        minor release.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23124
      impact: >-
        If your `multitenancy-manager` ModuleConfig sets `allowNamespacesWithoutProjects`, remove the
        parameter. It has no effect, and in the next minor release a ModuleConfig that still carries it
        will fail validation and stop applying.
    - summary: >-
        A GrantableClusterResourceReference field path can be scoped to specific resources, so paths that
        differ by resource within one API group and version no longer need a separate reference object.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23216
      impact: >-
        When several `spec.fieldPaths` entries of a GrantableClusterResourceReference match the same request,
        the most specific entry now applies (`resources` over `apiGroups` over `apiVersions`) instead
        of the first one in the list; a dimension listing `*` counts as unrestricted. A reference that
        relies on list order between two scoped entries may select a different path.
    - summary: >-
        AvailableClusterResource can show fields of the granted objects that the GrantableClusterResourceDefinition
        lists in catalogFields; the storageclasses catalog shows the provisioner, reclaim policy, volume
        binding mode and whether volume expansion is allowed.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23307
      impact: >-
        A GrantableClusterResourceDefinition must now name a cluster-scoped resource. A definition naming
        a namespaced one no longer resolves, and its AvailableClusterResource is removed from project
        namespaces, and the grant webhooks skip the references to it instead of failing the requests.
    - summary: >-
        A GrantableClusterResourceDefinition that names a namespaced resource or whose catalogFields cannot
        be evaluated is refused and reported in the GrantedResourceValid and CatalogFieldsValid conditions,
        and a catalog that would grow too large shows names without fields and raises a CatalogFieldsSkipped
        event.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23308
    - summary: >-
        ClusterResourceGrantPolicy v1alpha2 selects projects by Project labels and namespaces by a separate
        namespaceSelector; additional namespaces inherit the labels of the project template.
      impact: >-
        ClusterResourceGrantPolicy is stored as multitenancy.deckhouse.io/v1alpha2. A policy written through
        v1alpha1 keeps selecting the same namespaces: its projectSelector becomes the v1alpha2 namespaceSelector.
        To select projects by labels on the Project object, use spec.projectSelector of v1alpha2.

        When a policy manifest moves from v1alpha1 to v1alpha2, rename its projectSelector to namespaceSelector.
        A manifest that changes only its apiVersion keeps projectSelector, which v1alpha2 matches against
        the labels of the Project, so a selector by a label that only the namespace has matches nothing,
        and the policy stops applying to those namespaces.

        Labels a ProjectTemplate sets through namespaceMetadata.labels are now also set on additional
        namespaces, and namespaceMetadata.labels can no longer override the pod security, monitoring and
        scanning labels of the template.

        Each project is re-rendered once after the update; this resets hand edits of template labels on
        its main namespace.

        The projects.deckhouse.io/project and projects.deckhouse.io/project-template labels of a Project
        can no longer be pointed at another project or template. A manifest that replaces a whole Project
        may leave them out. Such an update is accepted with a warning, and the controller puts the labels
        back.

        During the update from 1.77, create or change ClusterResourceGrantPolicy through v1alpha1 only
        after the webhook-handler of the deckhouse module has rolled out: until it registers the conversion,
        such a write is stored with its selector read as a Project selector.

        All ClusterResourceGrantPolicy objects are stored as v1alpha2 soon after the update, because the
        controller writes their status. Deckhouse does not support downgrades: a manual rollback to a
        version without v1alpha2 makes every policy unreadable.
    - summary: >-
        The new `MultitenancyManagerHelmProjectTemplate` alert names every user ProjectTemplate that still
        renders its projects from a Helm `resourcesTemplate`, and says how to move it to structured fields
        and what a switch does to the objects of its projects.
    - summary: >-
        ProjectTemplate `deckhouse.io/v1alpha2` gets the `manifests` field, a template string whose namespaced
        objects the controller applies to each project as a user of the project with the `d8:project:admin`
        role, not with its own rights.
      impact: >-
        The objects of `manifests` get the `projects.deckhouse.io/project` and `projects.deckhouse.io/source:
        manifests` labels, are listed in `.status.manifestObjects` of the project and are deleted when
        the template stops rendering them. The `ManifestsApplied` condition of the project names the objects
        that are refused, with the code of each refusal. Cluster-scoped objects, objects in other namespaces
        and existing objects that are not the project's are not applied. An object that a switch from
        a Helm text left in place is taken over when `manifests` renders it under the same kind, namespace
        and name.


        A new `resourcesTemplate` can no longer be set through `deckhouse.io/v1alpha2`. A create with
        a non-empty one, and an update that sets one on a template that has none, are refused. A template
        that has a Helm text keeps it and can change it, and requests through `deckhouse.io/v1alpha1`
        work as before. A Helm-text template saved as `deckhouse.io/v1alpha2`, for example by `kubectl
        get -o yaml` or in a backup, is created again through `deckhouse.io/v1alpha1`, and its `title`,
        `resources` or `grantPolicies` are then added through `deckhouse.io/v1alpha2`.


        Only the multitenancy-manager controller and `system:sudouser` may bind users and groups whose
        names start with `system:multitenancy-manager:`, and such names are refused as project administrators.
    - summary: >-
        The objects of `manifests` of a project template cannot include an AuthorizationRule of the `Admin`
        access level, and a project template is created through `deckhouse.io/v1alpha2` only.
      impact: >-
        A ProjectTemplate can no longer be created through `deckhouse.io/v1alpha1`, and no template can
        get a new `resourcesTemplate` through either version. Existing templates with a Helm text keep
        working and can be changed, but a backup restore, a GitOps bootstrap or a re-creation of such
        a template is refused until it is moved to structured fields and `manifests`. The `MultitenancyManagerHelmProjectTemplate`
        alert names these templates.

        An AuthorizationRule of the `Admin` access level in `manifests` is refused when it is created
        or when an update raises a rule to this level, and the project switches to `Error`. A write of
        a project whose `manifests` render such a rule, and a write of a template whose `manifests` describe
        an AuthorizationRule, are admitted with a warning. Set the administrators of a project in `.spec.administrators`
        of the Project instead.
    - summary: >-
        ProjectQuota limits a project as a whole, with a ResourceQuota in every namespace of the project
        and the usage summed over them.
      impact: >-
        Project.spec.quota now applies in every namespace of a project, the additional ones included,
        and changing it needs the manage_quotas capability. A new namespace of a project with a quota
        refuses the objects of users for a few seconds until its ResourceQuota is calculated.
    - summary: >-
        In Enforce, creating an object that takes the usage of a whole project over its ProjectQuota is
        denied.
      impact: >-
        A new fail-closed webhook, quota-ledger.multitenancy-manager.deckhouse.io, checks the status writes
        of d8-project-quota. While no replica of multitenancy-manager answers, counted creates in the
        namespaces of projects with a quota fail with 503; deletions and other namespaces are not affected.
        multitenancy-manager runs two replicas where control-plane-manager is enabled.
    - summary: Alerts, a canary through every API server and an emergency switch-off for the project quota
        ledger.
    - summary: >-
        A ProjectQuota can limit the virtual machines of a project by their cores, guaranteed CPU, memory
        and GPUs.
    - summary: A ProjectQuota can limit the load balancers of a project by class, by pool and by external
        address.
    - summary: >-
        A Project can grant its namespaces cluster-wide resources of its own in spec.grants, on top of
        the grants of its template.
    - summary: >-
        A namespace that would stay outside every project cannot be created directly any more, and a namespace
        that stays without a project raises the D8NamespaceNotAdopted alert.
      impact: >-
        Creating a namespace whose name is longer than 61 characters, starts with upmeter- or is deckhouse,
        or putting the heritage: upmeter label on a namespace, is refused to everyone but system components,
        cluster administrators (system:masters) and system:sudouser, whatever allowNamespacesWithoutProjects
        says. A namespace that existed before and belongs to no project, for example one whose Project
        stays in Error because the namespace belongs to another Helm release, raises the D8NamespaceNotAdopted
        alert after the upgrade.
    - summary: >-
        The `manifests` of a ProjectTemplate can make additional namespaces of the project with ProjectNamespace
        objects and put objects into them; such objects are applied once the namespace exists.
    - summary: >-
        Objects that `spec.manifests` of a ProjectTemplate creates can be changed only through the template,
        as the objects of the structured fields can.
      impact: >-
        Project and cluster administrators can no longer change or delete objects labelled `projects.deckhouse.io/source`
        with the value `manifests`; change `spec.manifests` of the ProjectTemplate instead. Service accounts
        whose names start with system:serviceaccount:d8- may still change them. A rollout restart is still
        allowed when only the kubectl.kubernetes.io/restartedAt annotation of the pod template changes.
    - summary: >-
        GrantableClusterResourceDefinition gets the `reserved` field for resources that are unavailable
        to projects by default and are granted only by an explicit `allowed` or `allowedSelector` in ClusterResourceGrantPolicy.
    - summary: >-
        In the CE edition, a project has only its main namespace, and the creation of a ProjectNamespace
        is refused.
      impact: >-
        Additional namespaces of a project are available in the commercial editions. After a switch from
        a commercial edition to CE, the existing additional namespaces leave their projects: the controller
        stops managing them, the objects of the template in them stay as they are, and their RoleBindings
        only lose what a binding revokes.
    - summary: >-
        GrantableClusterResourceReference picks the `fieldPaths` item by its `match` condition too, and
        `fieldPaths[].message` adds a text to the rejection.
  fixes:
    - summary: A project parameter can no longer inject objects into the rendered project manifests.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21756
      impact: >-
        Values taken from `Project.spec.parameters` are now quoted where they are substituted into the

        shipped project templates, and a parameter that changes the structure of the rendered manifests

        rather than only their values is refused for any template, including custom ones. An administrator

        name may no longer contain control characters, and `clusterLogDestinationName` must be a Kubernetes

        object name or empty. Both are checked from the reconcile loop as well as at admission, so a

        project already carrying such a value goes into an error state on its next reconcile rather than

        at its next edit; the same holds for a custom template that turns a parameter into several objects

        or into YAML, which is refused when the project is created, edited, or reconciled with a change
        to

        apply. The module's admission policy now also matches CREATE, so objects labelled

        `heritage: multitenancy-manager` can only be created by the module itself.
    - summary: fix cve
      pull_request: https://github.com/deckhouse/deckhouse/pull/21817
    - summary: >-
        Project v1alpha1<->v1alpha2 conversion no longer depends on jq 1.7-only syntax, which silently
        disabled both conversions on older jq.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21895
    - summary: Quote digit-only Project administrator names in built-in templates.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21998
      impact: Prevents invalid YAML when an administrator name consists only of digits (for example 008).
    - summary: fix concurrent map writes panic in webhook when copying ProjectTemplate from cache
      pull_request: https://github.com/deckhouse/deckhouse/pull/22181
    - summary: The module manager role no longer grants authoring of project templates.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22307
      impact: >-
        `d8:manage:permission:module:multitenancy-manager:edit` no longer grants write access to

        `projecttemplates`. A `ProjectTemplate` renders into a release applied by a ServiceAccount bound

        to `cluster-admin`, and its `spec.resourcesTemplate` is arbitrary, so authoring one is equivalent

        to holding `cluster-admin` and is not a module-level permission.


        Reading templates stays in `d8:manage:permission:module:multitenancy-manager:view`, and creating
        a

        `Project` on an existing template stays in the edit role. The legacy `ClusterAdmin` access level

        and the `kubeadm:cluster-admins` group keep the right. A subject that authored templates through

        the manager role has to be granted one of those instead.
    - summary: Refresh grant webhook CA bundles after the admission certificate is rotated.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22793
    - summary: >-
        Documented the grants-on-cluster-resources mechanism and made the four grant CRDs visible in the
        public CR reference.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21952
    - summary: Rewrote the outdated grants guide in USAGE — the old text described a removed CRD and a
        renamed API.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21952
    - summary: A project parameter can no longer inject objects into the rendered project manifests.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21846
      impact: >-
        Values taken from `Project.spec.parameters` are quoted where they are substituted into the shipped

        project templates, and a parameter that changes the structure of the rendered manifests rather
        than

        only their values is refused for any template, including custom ones. An administrator name may
        no

        longer contain control characters, and `clusterLogDestinationName` must be a Kubernetes object
        name

        or empty. Both are checked from the reconcile loop as well as at admission, so a project already

        carrying such a value goes into an error state on its next reconcile rather than at its next edit;

        the same holds for a custom template that turns a parameter into several objects or into YAML,

        which is refused when the project is created, edited, or reconciled with a change to apply. The

        module's admission policy now also matches CREATE, so objects labelled

        `heritage: multitenancy-manager` can only be created by the module itself.
    - summary: >-
        The controller always elects a leader, so a rolling update no longer runs two reconcilers over
        the same project releases.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23022
    - summary: >-
        The ClusterResourceGrantPolicyViolation metric is computed by the controller with the same union-of-policies
        rule as the admission webhook, so an object allowed by one of several policies no longer raises
        a phantom alert.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23022
      impact: >-
        The `d8_cluster_objects_grant_violated` series is now scraped from the multitenancy-manager controller
        (port 9091, PodMonitor `multitenancy-manager`) instead of the module hook; the metric name, labels,
        alert and dashboard are unchanged.
    - summary: >-
        ClusterResourceGrantPolicy projectSelector matches the labels of the Project object as well as
        the namespace labels; a policy written against a Project label now covers the main and the additional
        namespaces of the project.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23022
      impact: >-
        The selector is evaluated against the union of Project and namespace labels, the namespace winning
        a shared key. Existing policies keyed on namespace labels (`projects.deckhouse.io/project`, `projects.deckhouse.io/project-namespace`,
        `projects.deckhouse.io/project-template`) behave as before.

        The CRDs now refuse `allowed: []`, an empty `allowedSelector`/`deniedSelector` and `apiGroups:
        ["*"]` in a GrantableClusterResourceReference; such objects were accepted before and either opened
        the resource or intercepted nothing. Existing objects are validated on their next write.

        `defaultFrom` counts only an annotation with the value `true`; a StorageClass carrying `storageclass.kubernetes.io/is-default-class:
        "false"` is no longer treated as the default.

        Policies carry a new `SelectorsValid` condition.
    - summary: >-
        Labels and annotations that the module does not own can be changed directly on a project namespace
        again; the project ownership label can be set only by the controller; the per-project catalog
        is protected fail-closed.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23022
      impact: >-
        On an adopted (or any project) namespace, `kubectl label`/`annotate` and GitOps re-applies are
        accepted for keys the module does not own; `heritage`, `projects.deckhouse.io/*`, the template-driven
        policy labels, the Helm ownership annotations, the node-selector and tolerations annotations,
        `spec`, finalizers and deletion are still refused and are changed through the Project and its
        template.

        Creating a namespace with a `projects.deckhouse.io/project` label, or changing that label, is
        refused for everyone but the controller — cluster administrators included; create a Project or
        a ProjectNamespace instead.

        `AvailableClusterResource` objects carry `heritage: multitenancy-manager` (relabelled in place)
        and are refused to everyone but the controller by the admission policy; a project with nothing
        available keeps an empty catalog object instead of none.
    - summary: >-
        A ProjectTemplate with a podSecurityStandard or networkPolicy.mode literal outside the accepted
        values is refused by the admission webhook instead of rendering into nothing.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23022
    - summary: >-
        ClusterProjectRoleBinding fan-out is rate-limited (20 writes/s, burst 40) and measured by the
        d8_multitenancy_cprb_fanout_duration_seconds histogram.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23022
    - summary: >-
        A ClusterResourceGrantPolicy reports an AllowedEffective condition when an allowed name is excluded
        by the resource registration (a ClusterRole without the delegatable label); the Coerce defaulting
        mode returns an admission warning naming the replaced value.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23022
      impact: >-
        Administrators see in the policy status why a binding to an allowed but non-delegatable ClusterRole
        is still refused; users see in kubectl output when their StorageClass was replaced with the project
        default.
    - summary: The controller's metrics endpoint is served through kube-rbac-proxy instead of plaintext.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23022
      impact: >-
        The d8_cluster_objects_grant_violated series name projects and the objects inside them; the endpoint
        now requires authentication and the get verb on deployments/prometheus-metrics of the multitenancy-manager
        deployment. Prometheus is allowed by the module itself; anything else scraping the port directly
        must be granted that permission.
    - summary: >-
        Deleting a Project now blocks until its namespace is actually gone, as deleting the namespace
        used to; the finalizer is kept while the namespace exists.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23124
    - summary: >-
        A user Project on the reserved `virtual` template is refused, and projects on that template are
        skipped by the ClusterProjectRoleBinding fan-out, which no longer fails on a namespace that never
        exists.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23124
    - summary: >-
        The Project and ProjectTemplate admission webhooks no longer exempt `system:masters`; cluster
        components and `system:sudouser` bypass them, as they do the heritage ValidatingAdmissionPolicy.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23124
      impact: >-
        Requests from `system:masters` to Project and ProjectTemplate are now validated like everyone
        else's (ProjectRoleBinding, ProjectNamespace and ClusterProjectRoleBinding always were). To bypass
        a Project or ProjectTemplate check deliberately, impersonate `system:sudouser` (`kubectl --as
        system:sudouser`).
    - summary: >-
        A GrantableClusterResourceReference whose field paths cannot be evaluated, cannot be defaulted,
        or leave part of its rule uncovered is now refused and reported in a new FieldPathsValid condition,
        and one broken reference no longer fails every request its rule matches.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23227
      impact: >-
        A GrantableClusterResourceReference whose `spec.fieldPaths` scopes list values outside `spec.rule`,
        or leave a resource of `spec.rule` without a matching entry, is now refused on create and on changes
        to its rule or field paths. An existing object keeps working and reports the problem as `FieldPathsValid=False`.
    - summary: >-
        The AvailableClusterResource of a deleted GrantableClusterResourceDefinition is now removed from
        project namespaces instead of remaining there with a stale list of values and a stale default.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23236
    - summary: Fixed vulnerabilities in the `multitenancy-manager` image.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23285
    - summary: >-
        The usage guide explains how `ClusterResourceGrantPolicy.projectSelector` matches projects (union
        of Project and namespace labels) and how to remove an adopted environment by deleting the Project.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23180
    - summary: >-
        The cache of parsed JSONPath expressions used by the grant webhooks is bounded and over-long expressions
        are refused before parsing, so requests with ever new or deeply nested paths can no longer exhaust
        the controller's memory or crash it; reference and definition paths are limited to 256 characters.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23335
    - summary: >-
        Changes to a library ClusterResourceGrantPolicy reach the policies of the project templates that
        reference it right away.
    - summary: >-
        Disabling the module now removes the cluster-objects grant webhooks, which used to stay behind
        and block writes in project namespaces.
      impact: >-
        The grant webhooks are now removed together with the module. On a cluster where `multitenancy-manager`
        is already disabled at the update, the `cluster-objects-grants-defaulting` and `cluster-objects-grants-validator`
        webhook configurations left by earlier versions stay, and writes to grantable resources in project
        namespaces (for example, removing a PVC finalizer) keep failing with `service "multitenancy-manager"
        not found`. Delete them by hand:

        `d8 k delete mutatingwebhookconfiguration cluster-objects-grants-defaulting`

        `d8 k delete validatingwebhookconfiguration cluster-objects-grants-validator`

        Nothing has to be done on clusters where the module is enabled.
    - summary: Fixed a vulnerability in the `multitenancy-manager` image.
    - summary: >-
        A project template renders the required-requests OperationPolicy only when it declares the `requiredRequests`
        parameter and the parameter is `true`.
      impact: >-
        Projects on templates that do not declare `requiredRequests`, including templates whose `resourcesTemplate`
        was empty, get no Deny policy requiring CPU and memory requests. Projects on the built-in templates
        are unchanged. On templates whose parameter schema sets `additionalProperties`, projects now get
        the declared parameters with their defaults and project values, so their render can change beyond
        the required-requests policy.
    - summary: >-
        A namespace adopted into a project keeps its Pod Security Standard; without the `security.deckhouse.io/pod-policy`
        label it stays under the admission-policy-engine default policy, and an existing label keeps its
        value.
    - summary: >-
        With `allowNamespacesWithoutProjects` set to `false`, namespaces are still created only as a part
        of a project. A ValidatingAdmissionPolicy now enforces it instead of the module webhook, the parameter
        is no longer deprecated, and the `MultitenancyManagerDeprecatedConfigParameter` alert is removed.
    - summary: >-
        The Project conversion to `v1alpha3` lifts `parameters.administrators` and `parameters.resourceQuota`
        into the standard fields only in shapes it can give back, and leaves any other shape in the parameters
        instead of failing the conversion, granting `d8:project:admin` to an entry with an `accessLevel`
        or dropping quota keys. A quota with the number `0`, which the 1.77 templates read as no limit,
        stays in the parameters too instead of becoming a hard limit of 0.
    - summary: >-
        A Project can no longer set `spec.administrators` together with `parameters.administrators`, or
        `spec.quota` together with `parameters.resourceQuota`. An update is checked only for the standard
        field values it changes, and a memory or storage quota of 0 needs no unit.
    - summary: >-
        Projects on custom templates whose `parametersSchema` still declares `administrators` and `resourceQuota`
        pass validation again, and a memory or storage quota value without a unit is accepted with a warning
        that it is read as bytes when an update keeps it or a create through `deckhouse.io/v1alpha2` writes
        it.
    - summary: >-
        ProjectTemplate v1alpha1 is served again as a deprecated version, and a template with a Helm `resourcesTemplate`
        keeps rendering the objects it rendered before the update.
      impact: >-
        `ProjectTemplate` v1alpha1 is served with a deprecation warning that points at v1alpha2, and v1alpha2
        carries `resourcesTemplate`. A template with a non-empty `resourcesTemplate` is rendered through
        Helm as before, from the project name, the template name and the project parameters. The form
        is deprecated; describe new templates with the structured fields.


        - A Helm template whose `parametersSchema` declares `administrators` or `resourceQuota` receives
        them from `spec.administrators` and `spec.quota`, in the layout of `Project` v1alpha2. Quota values
        arrive in canonical spelling (`1024Mi` as `1Gi`) unless the schema needs another one, and a zero
        arrives as the string "0".

        - A `Project` parameter `administrators` or `resourceQuota` that the template `parametersSchema`
        does not declare, as on the built-in templates, grants no access and sets no quota. `Project`
        admission refuses a new or changed value of such a parameter, except an empty list and a quota
        with no value other than the number 0, which pass with a warning. A value that an update keeps
        also passes with a warning, so a project that the conversion left them in keeps working. Set `spec.administrators`
        and `spec.quota` instead. In a v1alpha2 quota, leave out a limit of the number 0 to keep it unset,
        since the string "0" is a hard limit of zero.

        - The ResourceQuota and AuthorizationRule objects a Helm template renders are kept, next to `d8-project-quota`
        and `d8-administrators`. A pod has to fit every quota of its namespace.

        - The additional namespaces of a project on a Helm template are created and inherit the labels
        the template puts on the main namespace. Every Helm project release is upgraded once after the
        update.

        - `ProjectTemplate` admission refuses a non-empty `resourcesTemplate` together with fields that
        render objects. It refuses emptying the `resourcesTemplate` of a template that projects use, unless
        the same change sets such fields. It also refuses a write through v1alpha1 that would erase fields
        only v1alpha2 has.

        - A new administrator name cannot contain control characters or line breaks. A name that is already
        set is kept, with a warning.
    - summary: Deleting a project requires the right to delete each of its namespaces.
      impact: >-
        A user who may delete projects but not namespaces can no longer delete a project whose namespaces
        exist, and the refusal names the namespace. This affects holders of `d8:subsystem:deckhouse:manager`
        without `d8:subsystem:kubernetes:manager` or `d8:subsystem:infrastructure:manager`. Deleting a
        project deletes its namespaces with all workloads in them, so grant `delete` on `namespaces` to
        the users who remove projects. Only the delete of a Project is checked. A holder of the cluster-wide
        `d8:system-capability:multitenancy-manager:edit` can still delete the additional namespaces of
        a project through their ProjectNamespace objects.
    - summary: >-
        A ProjectNamespace whose namespace was created by someone else stays not ready instead of taking
        that namespace into the project.
    - summary: >-
        During a rollout, the controller waits up to 10 minutes for the pods of the previous revision
        to stop before it reconciles, so that two controller versions do not write the Helm releases of
        projects at the same time. After 10 minutes the controllers start anyway, and the new `MultitenancyManagerPreviousRevisionStillRunning`
        alert fires while pods of two revisions keep running.
    - summary: >-
        Project names reserve only the namespaces that ProjectNamespaces claim; a project named like an
        additional namespace of another project is allowed with a warning and reported by an event and
        an alert.
    - summary: >-
        A ProjectRoleBinding gives no rights to ServiceAccounts outside the namespaces of its project
        and reports them in the SubjectsBound condition, while the administrators in spec.administrators
        of a Project get the rights whatever namespace their ServiceAccounts are in; a new project or
        ProjectNamespace cannot take a name while a ClusterProjectRoleBinding, or a ProjectRoleBinding
        of another project that the name extends with a dash, still names ServiceAccounts of a namespace
        with that name.
    - summary: >-
        A namespace that becomes a project keeps its own labels and annotations, and the project release
        no longer reverts or restores them.
      impact: >-
        A namespace adopted into a project no longer has its own labels and annotations copied into the
        Project parameters.

        The project release neither reverts a direct change to such a label (for example `istio.io/rev`,
        `team`, Argo CD or Flux tracking labels) nor restores a removed one.

        The additional namespaces of the project do not inherit these labels; declare one in `spec.parameters.namespace.labels`
        of the Project, or set it on an additional namespace directly, where it is needed.

        The node-selector and tolerations annotations of an adopted namespace are still copied into `spec.parameters.namespace.annotations`
        and are changed there.

        `extended-monitoring.deckhouse.io/enabled` and `security-scanning.deckhouse.io/enabled` keep the
        value `"true"` the namespace had instead of being rewritten to `""`, and any other value, `"false"`
        included, becomes `""`.

        A ClusterResourceGrantPolicy that selects namespaces by such a label with `namespaceSelector`
        no longer covers the new additional namespaces of an adopted project; declare the label in `spec.parameters.namespace.labels`
        of the Project or select the project with `projectSelector`.
    - summary: >-
        A project whose release switches from a Helm `resourcesTemplate` to structured fields keeps the
        access of its administrators and its quota: the AuthorizationRule and ResourceQuota objects that
        the standard fields replace are deleted only once `d8-administrators` and `d8-project-quota` work,
        and the other objects of the Helm text are left in place.
      impact: >-
        After the update, every project on the built-in templates `default`, `secure` and `secure-with-dedicated-nodes`
        switches from their former Helm texts to structured fields. Its administrators move without a
        gap from AuthorizationRule objects with the `Admin` access level (`user-authz:admin` plus `user-authz:admin:custom`)
        to the `d8:project:admin` role of the `d8-administrators` ProjectRoleBinding, and its `all-pods`
        quota is replaced by `d8-project-quota`. The two roles do not grant the same permissions. In particular,
        custom ClusterRoles with the `user-authz.deckhouse.io/access-level` annotation no longer add to
        the access of these administrators; create a custom role and bind it with a ProjectRoleBinding
        instead.


        - While the old objects are kept, the Project has the `HandoverPending` condition. If they are
        still there after 30 minutes, the `MultitenancyManagerProjectHandoverStuck` alert fires.

        - On a later switch of a user template, every other object of the Helm text that the structured
        fields do not render (rules and bindings of other subjects, other quotas, network policies, workloads)
        is left in place instead of being deleted. It keeps working, is no longer managed by the project,
        carries the `projects.deckhouse.io/kept-from-helm-template` label, under which only a requester
        who may make the same change across the cluster may change or delete it, and is listed in `status.keptObjects`,
        and the `MultitenancyManagerProjectKeepsHelmTemplateObjects` alert fires until it is deleted,
        unlabelled or rendered by the template again.

        - Administrators and quotas that stay in `.spec.parameters` because they could not be moved to
        `.spec.administrators` and `.spec.quota` are not handed over, and a switch leaves their objects
        in place.
    - summary: >-
        multitenancy-manager logs only named levels, its leader election messages are JSON, and routine
        reconcile messages are logged at the debug level.
    - summary: >-
        The chart renders before the hooks fill the internal values, so the converge after a Deckhouse
        start is not blocked.
    - summary: >-
        A ProjectTemplate named `virtual`, the name reserved for the virtual projects, can no longer be
        created, and one created earlier can be deleted.
    - summary: >-
        Fixed CVE-2026-78659, CVE-2026-78660, CVE-2026-78663, CVE-2026-78669 and CVE-2026-97032 in `golang.org/x/net`.
    - summary: >-
        A user project with the projects.deckhouse.io/virtual-project label is no longer treated as virtual,
        and the label can no longer be added to one.
      impact: >-
        A user Project that already carries projects.deckhouse.io/virtual-project=true becomes an ordinary
        project: ClusterProjectRoleBinding extends to it, and ProjectRoleBinding and ProjectNamespace
        can be created in it. Creating a Project with the label is refused, including re-creating one
        from a backup or a GitOps manifest that still has it: remove the label from the manifest. An existing
        Project keeps the label with a warning.
    - summary: >-
        A namespace with an empty projects.deckhouse.io/project label is no longer counted towards the
        project of the same name, and the empty value can no longer be set by hand.
      impact: >-
        Grant policies stop selecting such a namespace by the labels of the same-name Project, and its
        AvailableClusterResource catalog is removed. The namespace is still not adopted into a project.
        Setting the empty value on a namespace by hand is refused, including re-creating a namespace from
        a manifest that has it.
    - summary: >-
        The main namespace of a project deleted past the admission policy is recreated, unless an owner
        of that namespace was deleted, and a ClusterProjectRoleBinding or ProjectRoleBinding reports its
        status even when a project namespace refuses the binding.
      impact: >-
        The controller recreates the main namespace of a Project once it is deleted directly past the

        admission policy, for example as `system:sudouser`, together with the objects of its template
        and of

        `manifests`. The other content of the namespace does not come back. A Project adopted from a namespace

        that has ownerReferences now carries the same owners, so the garbage collector deletes the Project

        together with the namespace and the namespace is not recreated. Only the controller and the

        identities the policy lets through may change the ownerReferences of a project namespace. An update

        that adds or changes an ownerReference of a Project or a ProjectNamespace is refused to everyone
        the

        multitenancy-manager webhooks validate, except the controller and Deckhouse.

        On the update, every Project that has lost its main namespace, or whose main namespace is stuck
        in

        Terminating, gets it back. Before the update, list these Projects and delete the ones you do not
        need.

        The list may also show Projects that are not restored: Projects in the Error state because their

        template is missing, and leftover Projects of the older model, which the controller deletes.

        d8 k get projects.deckhouse.io,namespaces -o json | jq -r '(INDEX(.items[] | select(.kind == "Namespace");
        .metadata.name)) as $ns | .items[] | select(.kind == "Project" and .metadata.labels["projects.deckhouse.io/virtual-project"]
        != "true" and .spec.projectTemplateName != "virtual" and .metadata.deletionTimestamp == null)
        | .metadata.name | select($ns[.] == null or $ns[.].metadata.deletionTimestamp != null)'
    - summary: >-
        Fixed CVE-2026-116585, CVE-2026-116586 and CVE-2026-116587 in `github.com/go-jose/go-jose/v4`,
        CVE-2026-63209 in `github.com/klauspost/compress` and CVE-2026-78661 and CVE-2026-97045 in `golang.org/x/net`.
    - summary: >-
        A ClusterProjectRoleBinding stays Ready while a namespace is being deleted and still updates a
        RoleBinding that is already there.
    - summary: >-
        The module becomes Ready again after it is disabled and enabled; the controller waits for the
        CRD conversion webhook itself instead of holding the Helm release.
    - summary: >-
        An object of `spec.manifests` of a ProjectTemplate moves to the field or template that renders
        it in one change, instead of putting the projects into `Error`.
    - summary: >-
        A rollout restart of a workload that the project release renders passes the heritage admission
        policy only when the restartedAt annotation of the pod template is the only change.
      impact: >-
        Before, an update of such a Deployment, StatefulSet or DaemonSet that set a new kubectl.kubernetes.io/restartedAt
        annotation skipped the d8-multitenancy-manager admission policy with every other change it carried.
        Now the policy refuses it unless that annotation is the only change, so a tool that restarts a
        workload and changes it in one update gets a refusal; change such a workload through the ProjectTemplate
        and restart it with kubectl rollout restart.
    - summary: >-
        A PersistentVolumeClaim restored from a snapshot or cloned from a volume keeps its StorageClass
        instead of getting the project default; an unavailable class is rejected with an explanation.
network-gateway:
  fixes:
    - summary: Fixed Python linking in the network-gateway module image.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21610
    - summary: Fix dnsmasq (DHCP) and snat containers crash-loop.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22132
    - summary: Fixed user and group in ConfigMap
      pull_request: https://github.com/deckhouse/deckhouse/pull/22295
      impact: network-gateway pod's will be restarted
    - summary: >-
        Removed the unused pip from the snat image to fix CVE-2026-1703, CVE-2026-3219, CVE-2026-6357
        and CVE-2026-8643.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22415
network-policy-engine:
  fixes:
    - summary: Bump Go dependencies in the kube-router image to fix known CVEs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21829
      impact: The kube-router component will restart after the update.
    - summary: >-
        Added VEX waivers for unreachable github.com/docker/docker CVEs (CVE-2026-33997, CVE-2026-34040,
        CVE-2026-41567, CVE-2026-41568, CVE-2026-42306) in the kube-router image.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22417
    - summary: Fixed known vulnerabilities in the kube-router image.
      impact: network-policy-engine pods will be restarted.
node-local-dns:
  fixes:
    - summary: Bump Go dependencies in the coredns helper image to fix known CVEs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21851
      impact: The node-local-dns DaemonSet pods will restart after the update.
    - summary: Bumped golang.org/x/sys to v0.44.0 in the iptables-loop image to fix CVE-2026-39824.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22413
    - summary: Fixed known vulnerabilities in the node-local-dns images.
      impact: node-local-dns pods will be restarted.
    - summary: Fixed DNS errors during node-local-dns pod restarts in clusters with Cilium.
    - summary: Fixed a known vulnerability in the node-local-dns CoreDNS image.
      impact: node-local-dns pods will be restarted.
    - summary: Node-local-dns safe updater logic was updated to match the Kubernetes logic.
      impact: Node-local-dns safe updater will be restarted.
    - summary: >-
        Fixed CVE-2026-78661 and CVE-2026-97045 in the coredns helper, safe-updater, and stale-dns-connections-cleaner
        images.
      impact: The node-local-dns DaemonSet pods and the node-local-dns components will restart after the
        update.
node-manager:
  features:
    - summary: migrate get_crds hook into node-controller and move machine objects along.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21372
    - summary: Migrate defaultCRI from ClusterConfiguration to node-manager ModuleConfig
      pull_request: https://github.com/deckhouse/deckhouse/pull/21482
    - summary: >-
        Migrate the cloud object prefix from `ClusterConfiguration.cloud.prefix` to the `global` ModuleConfig
        `spec.settings.prefix`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21533
      impact: >-
        On upgrade, node-manager runs a one-time migration that seeds `global` ModuleConfig `spec.settings.prefix`
        from the existing `ClusterConfiguration.cloud.prefix`; no manual action is required. In-cluster
        consumers (cloud-controller-manager, CAPI/MCM MachineDeployment names, cluster-autoscaler priorities)
        now read the prefix from the ModuleConfig. Changing `spec.settings.prefix` in a running cluster
        is rejected by a new validating admission webhook, because the value names existing cloud infrastructure
        and changing it would recreate cloud nodes and rename base infrastructure.
    - summary: Add cluster-autoscaler 1.35 support with ported Deckhouse patches and CVE dependency bumps.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21777
    - summary: >-
        CAPI machine templates use the v2 provider contract - one file per provider, generation-numbered
        names, and a rollout decision made by comparing InstanceClass values instead of hashing serialized
        bytes.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21793
    - summary: Added a release requirement that can block updates while nodes are still running containerd
        v1.x.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21994
    - summary: added olcedar image
      pull_request: https://github.com/deckhouse/deckhouse/pull/22059
    - summary: Add support for cloud-provider-specific Bashible lifecycle steps stored in Kubernetes Secrets.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22108
    - summary: >-
        NodeUser uid uniqueness, StaticInstance address uniqueness and InstanceClass deletion protection
        are now validated by the node-controller admission webhook instead of shell hooks.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21654
    - summary: >-
        Immutable OS (olcedar) node support — systemType on NodeGroup, NodeConfig/NodeBootstrapConfig/NodeOperation/NodeExtensionRequest
        resources, and a CAPI bootstrap provider.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21557
    - summary: Prevent deletion of CAPI Cluster resources in the d8-cloud-instance-manager namespace.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22551
    - summary: >-
        Serve NodeConfigTemplate from an aggregated API server, so a hand-installed immutable node can
        be handed the cluster's half of its configuration without a bootstrap token living in etcd.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22212
    - summary: >-
        An immutable node's cluster address follows one of its physical interfaces, chosen by the cluster
        interface mark, the cluster's internalNetworkCIDRs, the route to the apiserver or the only NIC,
        and pinned on the node; spec.kubelet.nodeIP is removed.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22212
    - summary: Alert when a NodeGroup uses the deprecated built-in GPU support while the `gpu` module
        is disabled.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22142
    - summary: >-
        Added spec.providerType field for NodeGroup to support future migration to per-NodeGroup provider
        resolution. Static groups no longer apply cloud provider scripts. Bashible-apiserver now resolves
        cloud provider configuration per NodeGroup.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22050
      impact: >-
        NodeGroups with `nodeType: Static` no longer get the cloud provider's node configuration scripts.

        Until now every NodeGroup in a cloud cluster, Static included, was configured with them.


        On AWS this removes `007_enable_ecr_credential_provider` from Static nodes: the kubelet unit is

        regenerated without `--image-credential-provider-config`, kubelet restarts and loses access to

        ECR. The same applies to any other provider step a Static node relied on.
    - summary: learn about shutdown without logind for engine
      pull_request: https://github.com/deckhouse/deckhouse/pull/23072
    - summary: Instance now references the NodeGroup that ordered it via `spec.nodeGroupRef`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23153
    - summary: >-
        NodeStaticPodRequest delivers a static pod to the nodes of selected Deckhouse Engine NodeGroups.
        The pause image comes with the containerd extension and is never pulled.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23158
      impact: >-
        Every Engine node's NodeConfig is re-rendered once, and containerd restarts once on every Engine
        node.
    - summary: Qemu guest agent/sysext
      pull_request: https://github.com/deckhouse/deckhouse/pull/23339
    - summary: >-
        Immutable nodes hand the containerd registry configuration over to the registry agent when their
        NodeConfig carries it.
    - summary: cluster-autoscaler for Kubernetes 1.36 and 1.37 is now built from gardener autoscaler v1.36.0.
      impact: The cluster-autoscaler Pod will restart in clusters running Kubernetes 1.36 or 1.37.
    - summary: >-
        Deckhouse Engine nodes move to Engine v0.1.16, whose kernel has the softdog watchdog built in
        for fencing.
    - summary: >-
        `spec.kubelet.topologyManager.policy` now selects a complete kubelet profile, and NUMA-dependent
        kubelet settings are calculated on each node.
      impact: >-
        The kubelet restarts on every node. NodeGroups with `spec.kubelet.topologyManager` can get CPU
        and memory pinning turned on or off, and their nodes can be drained:

        - Memory reservations and eviction thresholds are now calculated from the node memory rounded
        down to GiB, so the allocatable memory changes slightly on every node.

        - `topologyManager.enabled` is deprecated and ignored: the managers are controlled by `policy`
        alone.

        - Groups with `enabled: false` (explicit or the stored default) and a `policy` other than `None`
        start pinning. Find them before the update: `d8 k get ng -o json | jq -r '.items[] | select(.spec.kubelet.topologyManager.enabled
        == false and (.spec.kubelet.topologyManager.policy // "None") != "None") | .metadata.name'`. Set
        `policy: None` where pinning must stay off.

        - Groups with `enabled: true` and `policy: None` stop pinning: Guaranteed pods lose their exclusive
        CPUs when recreated. Set `policy: BestEffort` to keep pinning.

        - On nodes with a `policy` other than `None`, `reservedMemory` is split between NUMA nodes, so
        nodes with Guaranteed pods are drained according to `disruptions` (`Manual` waits for approval).

        - `Restricted` and `SingleNumaNode` now give whole physical cores: on nodes with SMT, Guaranteed
        containers with an odd CPU count are rejected with `SMTAlignmentError`. Fix their requests before
        the update.
    - summary: >-
        A NodeOperation shows in `status.eviction` how many pods its eviction still waits for and which
        of them are terminating.
    - summary: >-
        `kubernetes-api-proxy` starts its probe rounds on a fixed schedule (every second, as before),
        probes every 500ms for up to 30s while no kube-apiserver is ready, and shows the probe state in
        `/upstreams`.
      impact: >-
        The `kubernetes-api-proxy` container restarts on every node. While no kube-apiserver is ready,
        each node sends `/readyz` to every kube-apiserver up to 2 times a second for up to 30s. While
        a kube-apiserver answers slowly, each node probes every kube-apiserver up to 1.5 times as often
        as before.
    - summary: >-
        node-controller arbitrates `RegistryUpstream` objects without the registry agent and routes them
        through `NodeConfig`; nodelet applies them on both node types, bashible inline on containerd v1.
      impact: nodelet is updated to v0.1.21 and restarts on every node that runs it; workloads are not
        affected.
    - summary: >-
        Deckhouse Engine nodes get a maintenance web UI and console screen with a temporary network edit
        (nodelet v0.1.23, Engine image v0.1.20).
      impact: >-
        Deckhouse Engine nodes reboot into the new OS image by their NodeGroup update rules. On these
        nodes the new agent restarts containerd once.
    - summary: >-
        Node-controller supplies the chrony NTP servers to Deckhouse Engine master nodes for boot-time
        clock synchronization.
    - summary: >-
        Fencing 2.0 replaces fencing 1.0. The modes are Normal, Slow and Critical; Critical is available
        only in the commercial editions. Fencing evacuates a failed node only after the node is guaranteed
        to be stopped.
      impact: >-
        Fencing no longer deletes the pods of a node after 60 seconds without a confirmation that the
        node stopped. The fencing-controller sets the `node.kubernetes.io/out-of-service` taint only on
        a stopped node: after a witness confirms the stop, or after the node is silent for a delay of
        its profile. Then it deletes the pods of the node and the Node of a cloud Cluster API machine
        or the Machine of an MCM node.

        A node with fencing stops when it does not see the control plane longer than the threshold of
        its mode (4.15, 9.1 or 20.2 seconds). A loss of the control plane for the whole cluster that is
        longer than this stops all nodes with fencing.

        On update, Deckhouse replaces all fencing agents at the same time, the nodes do not reboot. The
        `Watchdog` mode works as `Slow`. The `spec.fencing.watchdog.timeout` parameter of NodeGroup is
        deprecated and ignored. A rollback to fencing 1.0 is not supported.

        You cannot turn fencing on in a cluster with one master node. You cannot change the fencing mode
        of a node group while a node of the group has a FencingFailedNodeState.

        To disable the `node-manager` module, turn fencing off in all node groups first and confirm the
        disabling.

        Open port 8500 TCP and UDP between all cluster nodes.
  fixes:
    - summary: Fix create_rbac_and_certificate_for_kubernetes_api_proxy hook behavior.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21622
    - summary: >-
        Revert defaultCRI migration to the node-manager ModuleConfig (#21482); ClusterConfiguration.defaultCRI
        is the source of truth again, fixing bootstrap hanging on "Waiting for Registry to become Ready"
        when defaultCRI is omitted.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21830
    - summary: Annotate CAPI MachineDeployments with CPU/memory capacity for scale-from-zero
      pull_request: https://github.com/deckhouse/deckhouse/pull/21820
    - summary: >-
        Read InstanceClass through the API version published by the cloud provider instead of resolving
        it from discovery.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21768
    - summary: Fix node-controller build broken by an undefined helper call in the CAPI machine-template
        v2 code.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21983
    - summary: >-
        node-controller no longer treats an unreadable source as an absent one, which could publish a
        NodeGroup without its instanceClass and re-run bashible on every node
      pull_request: https://github.com/deckhouse/deckhouse/pull/22103
    - summary: >-
        the validating webhook now enforces that kubelet.memorySwap.swapBehavior LimitedSwap requires
        cgroup v2, a check that never fired because the field was misspelled in the Go type
      pull_request: https://github.com/deckhouse/deckhouse/pull/22103
      impact: >-
        A NodeGroup created while the check was dead — `swapBehavior: LimitedSwap` with nodes that do
        not

        support cgroup v2 — is now rejected on every update, including the finalizer removal that a

        delete needs, so such a NodeGroup can hang in Terminating. Removing `swapBehavior: LimitedSwap`

        from its spec passes and unblocks it.
    - summary: Bump cluster-api to 1.12.11 to fix GHSA-gcjh-h69q-9w9g in github.com/google/cel-go.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22109
    - summary: Hide MCM and Cluster API resources from the node-manager ClusterAdmin role.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22060
      impact: >-
        Users can no longer read or modify MachineDeployments, MachineSets, Machines, machine classes
        and CAPI infrastructure objects directly; these APIs are controller-owned. Manage nodes through
        NodeGroup and StaticInstance.
    - summary: Validate NodeGroup InstanceClass kinds dynamically using installed cloud-provider registrations.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22018
    - summary: >-
        Bump vulnerable `golang.org/x/*` dependencies in the CSE `integrity-controller` and `integrity-containerd-configurator`
        images.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22281
    - summary: >-
        Fix CVEs in fencing-agent and cluster-autoscaler images (CVE-2026-56852, GHSA-hrxh-6v49-42gf,
        CVE-2026-46600).
      pull_request: https://github.com/deckhouse/deckhouse/pull/22377
    - summary: fixed private build
    - summary: >-
        Fix d8-shutdown-inhibitor failing to start on nodes where another package overrides the logind
        inhibit delay.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22513
    - summary: >-
        Hide the CAPS SSH key and sudo password in SSHCredentials from users without the `sshcredentials/sensitive`
        subresource.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22572
      impact: >-
        The SSH key and sudo password in `SSHCredentials` (used by CAPS to reach static nodes) are now

        returned as `<omitted>` to callers without `get` on the `sshcredentials/sensitive` subresource,

        masked in the audit log, and encrypted in etcd when `apiserver.encryptionEnabled` is on.

        `d8:manage:infrastructure:viewer` and `:manager` no longer see these values. CAPS still does,
        and

        so does every holder of a `deckhouse.io` wildcard, since `*` matches subresources: `SuperAdmin`,

        the `kubeadm:cluster-admins` group, and the `deckhouse` and `webhook-handler` SAs of `d8-system`.


        For masked readers the `last-applied-configuration` annotation disappears from `get -o yaml`,

        and creating an `SSHCredentials` with `<omitted>` fails with `422 Invalid` — editing still works.

        Treat previously exposed keys as leaked and rotate them. With `apiserver.encryptionEnabled` on,

        rewrite existing objects to encrypt them: `d8 k get sshcredentials -o json | d8 k replace -f -`.
    - summary: Fix NodeCapacity calculation.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22675
    - summary: >-
        Node drain runs under a cancellable context — removing the `draining` annotation stops the eviction
        and returns the node to the scheduler.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22567
    - summary: >-
        Move hook logic, bootstrap rendering and InstanceClass status.nodeGroupConsumers into node-controller.
        Fixes engine pinning with the use-mcm annotation, drain order for spot nodes, conversion caBundle
        rotation for the NodeGroup and Instance CRDs, and stale bootstrap Secrets after a release. The
        d8_node_group_configurations_total metric is removed.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22056
    - summary: Fix duplicate NVIDIA GPU dashboards when the gpu module is enabled.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22927
    - summary: An interrupted bootstrap of a static node is completed on the next attempt instead of being
        refused.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22944
    - summary: >-
        node-controller no longer removes taints set by other components on the first reconcile of Static
        and CloudPermanent nodes.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22958
    - summary: >-
        The node-controller aggregated API server serves OpenAPI v2, so kube-apiserver stops requeueing
        the spec download for templates.internal.deckhouse.io.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23154
    - summary: Approve only kubelet-serving CSRs in the kubelet_csr_approver hook.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22901
    - summary: >-
        Increase the capi-controller-manager VPA maximum memory recommendation to prevent health-check
        failures and restarts under memory pressure.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23184
    - summary: >-
        Stop caps-controller-manager from rewriting StaticInstance objects in a hot loop when a connectivity
        check fails, which caused a sustained load on etcd.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23104
      impact: >-
        A StaticInstance whose connectivity check fails now keeps its reservation for the whole bootstrap
        window instead of returning to the pool on every failed attempt, and the bootstrap (20 min) and
        cleanup (10 min) timeouts, which previously never fired, are now reachable.

        If nothing ever ran on the host, the bootstrap timeout returns the instance to the pool after
        20 minutes as before.

        If the host was already bootstrapped in part, the instance returns only through MachineHealthCheck
        remediation (nodeStartupTimeoutSeconds: 1200) plus the cleanup timeout, so it becomes available
        again roughly 20 + 10 minutes after the failure, and remediation reboots the host as part of the
        cleanup.
    - summary: >-
        The `manual-bootstrap-for-<NodeGroup>` Secrets list a new master right away, so `dhctl converge`
        no longer times out while adding masters.
    - summary: >-
        Hooks no longer fail when a NodeGroup, Node, Machine or MachineSet is deleted between the snapshot
        and the patch.
    - summary: >-
        Fixed cluster-autoscaler using node group names without the cluster prefix after a Deckhouse restart,
        which stopped autoscaling and triggered the `D8ClusterAutoscalerTooManyErrors` alert.
    - summary: >-
        Sped up installing Deckhouse Engine from the ISO - the installer no longer writes zeros over the
        whole system disk before partitioning it.
    - summary: A drain that fails or times out is no longer recorded as `drained`.
      impact: >-
        A node whose drain keeps failing now keeps the `draining` annotation, carries

        `update.node.deckhouse.io/drain-failed` with the error, and is retried. Its NodeGroup

        stops updating until the drain succeeds, instead of updating a node that still runs its

        pods. `NodeStuckInDraining` fires five minutes after the first failure and now covers

        drains requested by update approval, by a cloud spot termination and by hand. The

        `d8_node_draining` metric lost its `message` label, the error is read from the node.
    - summary: >-
        Fixed cluster-autoscaler stopping autoscaling of all node groups and restarting every two hours
        when an MCM node group has `minPerZone` equal to `maxPerZone`.
    - summary: >-
        The discover_standby_ng hook patches NodeGroup status only when the standby value changes and
        ignores changes of NodeGroups without standby.
    - summary: >-
        Hooks `discover_standby_ng` and `set_ng_priorities` run in the module queue, so one NodeGroup
        change no longer queues a second module run.
    - summary: Fixed CVE-2026-81870 in cluster-autoscaler by bumping OpenTelemetry Go modules to v1.45.0.
    - summary: >-
        A StaticInstance whose StaticMachine was deleted is returned to Pending and becomes available
        for bootstrapping again instead of staying out of the pool forever.
    - summary: >-
        Bump golang.org/x/crypto, gRPC and OpenTelemetry in bashible-apiserver, capi-controller-manager
        and node-controller to fix CVEs.
    - summary: >-
        kubernetes-api-proxy keeps slow kube-apiservers in rotation, stops sending connections to a kube-apiserver
        that is shutting down, restarting or hung, and closes client connections to a hung kube-apiserver
        so that clients reconnect to a live one.
      impact: >-
        The kubernetes-api-proxy container restarts on every node; for about a second connections to kube-apiserver
        through it on that node are refused and clients reconnect.
    - summary: >-
        A new kubernetes-api-proxy image now takes effect on containerd nodes when Deckhouse is updated,
        without a node reboot.
    - summary: >-
        Fixed the CAPI MachineHealthCheck replacing cloud nodes that take longer than 5 minutes to become
        Ready after registering, and limited remediation to when at most half of the CAPI machines are
        unhealthy.
      impact: >-
        The cloud MachineHealthCheck is updated in existing clusters. A node in Ready=False is replaced
        after 10 minutes instead of 5 (Ready=Unknown still after 5), and remediation stops while more
        than 50% of the cluster's CAPI machines are unhealthy.
    - summary: >-
        On a master node shutdown or reboot kubelet gives kube-apiserver, etcd and other node-critical
        pods 25s instead of 5s to stop.
    - summary: >-
        Fixed cluster-autoscaler not scaling CAPI node groups up from zero for pods requesting ephemeral
        storage, and putting the whole scale-up of a multi-zone node group into a single zone.
    - summary: >-
        refuse adding staticInstances.labelSelector to a NodeGroup when it would leave already-bound StaticInstances
        outside the new selector
    - summary: Updates otel, grpc and x/crypto dependencies of node-controller to fix CVEs.
    - summary: >-
        node-controller starts on a cluster upgraded from a main build before the NodeConfig contract
        freeze.
    - summary: >-
        node-controller creates the NodeConfig of every node managed by bashible, and nodelet there no
        longer registers it, so a deleted NodeConfig of a master or a static node comes back without a
        restart of nodelet.
    - summary: >-
        NodeGroup master can no longer be deleted, and a group deleted anyway is re-created with the same
        spec, labels and annotations instead of the template.
    - summary: >-
        The master NodeGroup of a Deckhouse Engine cluster is created Immutable, so the master no longer
        gets a Mutable NodeConfig during the bootstrap.
    - summary: >-
        kube-rbac-proxy in capi-controller-manager and node-controller no longer listens on all addresses
        of a node that has no addresses yet, so it does not take the controller's port.
    - summary: >-
        The `NodeGroup` CRD now rejects `spec.kubelet.containerLogMaxFiles` values below 2, which kubelet
        refuses to start with.
    - summary: >-
        Fixed known vulnerabilities in the integrity-controller and integrity-containerd-configurator
        images (CSE).
    - summary: >-
        `kubernetes-api-proxy` keeps serving `127.0.0.1:6445` for 3s after `SIGTERM`, so that kubelet
        and node-critical pods can write their last state on a node shutdown.
    - summary: >-
        `kubernetes-api-proxy` closes a stuck probe connection after the probe timeout, sends the client-go
        logs to its JSON log, and serves its health endpoints on `127.0.0.1:6480` by default, as in its
        static pod manifest.
    - summary: >-
        Master controllers leave an unreachable master after about 100 seconds, fit on the masters left
        and are not evicted from a single master.
    - summary: >-
        Master controllers no longer tolerate keys from `customTolerationKeys`, so a key that repeats
        a built-in one no longer blocks pod updates.
      impact: >-
        node-controller, capi-controller-manager, machine-controller-manager and bashible-apiserver do
        not run on a master tainted with a key from `global.modules.placement.customTolerationKeys`. Remove
        such taints from the master NodeGroup before the update.
    - summary: >-
        A node-manager release no longer waits for every capi-controller-manager replica on a bootstrapped
        cluster; new alerts report missing replicas.
    - summary: >-
        Bump golang.org/x/net, golang.org/x/text and klauspost/compress to fix CVE-2026-78659, CVE-2026-78660,
        CVE-2026-78661, CVE-2026-78663, CVE-2026-78669, CVE-2026-97032, CVE-2026-97045, CVE-2026-56851
        and CVE-2026-63209.
    - summary: Fixes x/crypto, x/net, x/sys and x/text CVEs in the caps-controller-manager image.
    - summary: >-
        nodelet v0.1.20 closes CVEs in its dependencies and scales the CPU reservation of Engine nodes
        with the number of cores.
      impact: >-
        On Engine nodes with `resourceReservation.mode` set to `Auto`, kubelet restarts once and allocatable
        CPU drops on larger nodes.
    - summary: >-
        A change of `ClusterConfiguration.proxy` on a running cluster now reaches the containerd and kubelet
        proxy settings on the nodes.
    - summary: Nodes trust the registry CA from a ModuleSource that has `dockerCfg` set again.
      impact: >-
        bashible-apiserver no longer skips such ModuleSources, so their CA is added to the node configuration.
        Bashible will be rerun on all nodes.
    - summary: Restricted bashible-apiserver to TLS 1.2 or later and modern cipher suites.
    - summary: NodeUser password hashes are now hidden from unauthorized API readers.
openvpn:
  fixes:
    - summary: Bump Go dependencies in the ovpn-admin and easyrsa-migrator images to fix known CVEs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21826
      impact: The openvpn components will restart after the update.
    - summary: Bumped golang.org/x/sys to v0.44.0 in the openvpn entrypoint to fix CVE-2026-39824.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22416
    - summary: Fixed known vulnerabilities in the ovpn-admin and easyrsa-migrator images.
pkg:
  features:
    - summary: Add tag/repository streaming, typed registry errors and multi-arch support to the registry
        library.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22894
    - summary: >-
        The `pkg/log` handler writes a record in one pass and uses 5–9 times less CPU per line with byte-for-byte
        the same output.
    - summary: The `pkg/metrics-storage` scrape takes about half the CPU and 85% fewer allocations.
    - summary: >-
        Add the kube-rbac-auth Go module that protects metrics endpoints without the kube-rbac-proxy sidecar.
registry:
  features:
    - summary: Migration part of new registry implementation.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22886
    - summary: >-
        New registry implementation — the pull path on every node is managed by an agent, with an optional
        in-cluster cache and an air-gap transition.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21788
      impact: >-
        Bring the registry to `Unmanaged` BEFORE updating.


        This release renders none of the previous registry implementation's objects. A cluster that

        arrives still in `Direct` or `Proxy` loses them on the first reconciliation — the in-cluster

        proxy, the `registry` Service and the per-node configuration they served — while its nodes go

        on pointing at that address. Images already on a node keep working; anything that has to be

        pulled does not, and the migration cannot be completed from that state. The way back is to

        return to the previous release, bring the cluster to `Unmanaged` there, and update again.


        A cluster already in `Unmanaged` is unaffected. The handover happens on its own, and the new

        implementation manages nothing until it is configured, so the update changes no behaviour.


        An air-gapped cluster in `Local` has a procedure of its own, which also starts before the

        update: an OCI registry stood up outside Deckhouse's namespaces, loaded with `d8 mirror pull`

        and `d8 mirror push`, declared as the upstream for the length of the migration and removed once

        the in-cluster storage holds the image set. It costs a second copy of that set on disk while it

        exists. See "How do I migrate an air-gapped Local cluster?" in the registry module's FAQ.


        From this release the platform records which implementation a cluster runs, so a later release

        can refuse to install on a cluster still running the previous one.
    - summary: >-
        Bound the cache store by `storage.size` and a node disk reserve, with alerts; fix fill, replication
        and push routing to the leader; describe a cluster pulling through the agent as the in-cluster
        registry only; stabilize multi-master bootstrap.
    - summary: The managed registry (cache, proxy, air-gap) now works on Deckhouse Engine (Immutable)
        nodes.
    - summary: >-
        Garbage collection of the registry cache now also runs once the cache holds a new image set and
        when the store refuses writes, and can be started by hand with a RegistryOperation object. Each
        storage replica exports an estimate of what a collection would free.
      impact: The `registry-controller` and `registry-storage` pods restart once.
    - summary: >-
        `RegistryUpstream` objects are applied on the nodes when the module is disabled or in `Unmanaged`
        mode.
    - summary: >-
        `RegistryUpstream` fields are validated the way the nodes read them and are size-limited; an invalid
        object gets `InvalidSpec`, one over the cluster budget gets `LimitExceeded`.
    - summary: >-
        The registry-agent's `d8_registry_agent_*` metrics are collected by Prometheus through the node
        exporter textfile collector (`job="node-exporter"`, label `node`).
    - summary: >-
        Removed the v1 registry implementation (used up to and including DP 1.77); the Proxy and Local
        modes of the deckhouse ModuleConfig can be neither installed nor updated to 1.78.
      impact: >-
        An update to 1.78 from DP 1.77.1 or later is blocked while the cluster runs Proxy or Local of
        the v1 registry implementation, or Direct without the registry ModuleConfig.

        Migrate the cluster to the registry module on 1.77 before updating (see the registry module FAQ),
        and update to 1.78 only from DP 1.77.1 or later.
    - summary: >-
        The images of the in-cluster cache are listed by the RegistryImage resource; the cache checks
        its blobs in the background and repairs broken ones on its own.
      impact: The registry cache replicas are recreated one at a time, and registry-controller restarts.
  fixes:
    - summary: Fix DKP bootstrap retry by keeping the `registry-init` secret.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21244
    - summary: bump x/net and x/text in nodeservices-manager to clear 23 CVEs
      pull_request: https://github.com/deckhouse/deckhouse/pull/22114
    - summary: bump docker-auth to v1.14.0-deckhouse.10 to clear 23 CVEs
      pull_request: https://github.com/deckhouse/deckhouse/pull/22120
    - summary: bump docker-distribution to v2.8.3-deckhouse.5 to clear 14 CVEs
      pull_request: https://github.com/deckhouse/deckhouse/pull/22119
    - summary: Fix the order in which the Unmanaged params are stored for the fallback to the Legacy mode.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22924
    - summary: Fix the security context in the registry module for CSE.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22945
    - summary: Tune registry agent for downloading a huge images.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23257
    - summary: >-
        The cluster goes air-gap only after no platform workload, including the registry storage itself,
        still pulls from the upstream registry.
    - summary: >-
        The registry storage update no longer replaces a replica while nothing can serve its image, and
        no longer counts a terminating replica as serving.
    - summary: Bump golang.org/x dependencies, gRPC and OpenTelemetry in the registry images to fix CVEs.
    - summary: >-
        The in-cluster cache keeps its storage leader through a short API server stall, and its update
        no longer takes two replicas down at once.
    - summary: Add SecurityPolicyException for registry v2
      impact: Registry storage will restart once ofter update
    - summary: The in-cluster cache's registry now exports its metrics; its debug listener was never opened.
    - summary: >-
        Require brackets around IPv6 upstream registry URL hosts and accept bracketed addresses with or
        without a port.
    - summary: >-
        registry-controller leaves an unreachable master after about 100 seconds, registry-storage stays
        on it, and neither is evicted from a single master.
    - summary: >-
        registry-controller and registry-storage no longer tolerate keys from `customTolerationKeys`,
        so a key that repeats a built-in one no longer blocks pod updates.
      impact: >-
        registry-controller and registry-storage do not run on a master tainted with a key from `global.modules.placement.customTolerationKeys`.
        Remove such taints from the master NodeGroup before the update.
    - summary: >-
        Bump golang.org/x/net, golang.org/x/text, go-jose and klauspost/compress to fix CVE-2026-78659,
        CVE-2026-78660, CVE-2026-78661, CVE-2026-78663, CVE-2026-78669, CVE-2026-97032, CVE-2026-97045,
        CVE-2026-56851, CVE-2026-116585, CVE-2026-116586, CVE-2026-116587 and CVE-2026-63209.
    - summary: >-
        Garbage collection of the registry cache now actually frees disk space. Its deletions were refused,
        its sweep failed on repositories filled through the cache, and blobs left by a failed sweep were
        never removed. It no longer removes the platform manifests of multi-arch images.
    - summary: >-
        The registry agent no longer waits for an unreachable cache leader on every pull. Recently failed
        registries are tried last, connections time out faster, and dead HTTP/2 connections are detected
        by pings.
    - summary: >-
        The registry agent no longer sends the node's cache credentials for repositories outside `system/deckhouse`
        requested by a cache replica address.
      impact: >-
        Pulls of images pushed into the in-cluster cache outside `system/deckhouse` as `<master IP>:5001/<repository>`
        are no longer authorized with the node's credentials and are refused.
    - summary: >-
        A RegistryOperation no longer stays active for 24 hours when a storage replica is gone mid-operation.
        A replica that stops holding the collection lease while it collects, or whose node is not Ready
        for ten minutes while it waits, fails with the reason `ReplicaLost`.
    - summary: >-
        The registry cache endpoint on nodes no longer moves to the first replica while the storage leader
        changes; it stays put until the new leader takes over.
    - summary: >-
        The store's reserve now follows the live size of its filesystem and is smaller on a dedicated
        disk. The replica status reports an unmounted store disk, and a store the registry cannot write
        to is reported as `NotWritable` and alerted on.
    - summary: >-
        The in-cluster registry cache can now be updated in an air-gapped cluster with a single master,
        and a blocked cache update is explained and alerted on.
      impact: >-
        A new DaemonSet `d8-system/registry-storage-image-holder` runs on every master while the cache
        is on (4 containers running `/pause`, 10m CPU / 10Mi memory each).

        On a single-master air-gapped cluster the cache replica is replaced once its new images are on
        the master. While it restarts, for a few tens of seconds, the cluster cannot pull images.

        The new alert `D8RegistryStorageUpdateBlocked` fires when the cache has not been updated for an
        hour, with the reason.
    - summary: >-
        The in-cluster cache elects a new storage leader when the leader's master is lost or its registry
        or disk stops working, instead of waiting for the Node or pod to be deleted.
    - summary: >-
        The in-cluster registry storage gets liveness and startup probes and a VPA in `Initial` mode,
        its disruption budget no longer lets the only replica be evicted while the master count is unknown,
        and the registry-controller VPA covers kube-rbac-proxy.
    - summary: >-
        The in-cluster registry cache accepts its accounts only under `system/deckhouse`, the publication
        account can no longer delete, and registry-controller and registry-packages-proxy no longer have
        access to the cache's write account.
      impact: >-
        Pulling through the cache under a repository outside `system/deckhouse` is refused. `d8 mirror
        push` must target `<publication endpoint>/system/deckhouse`, as documented.

        registry-controller and registry-packages-proxy read the new Secret `d8-system/registry-storage-client`
        instead of `registry-storage-access`.
    - summary: >-
        In `Managed` mode, the credentials of a `RegistryUpstream` whose `match` has a port are stored
        under a valid Secret key.
    - summary: >-
        registry-agent now reaches upstream registries through the proxy set in `ClusterConfiguration.proxy`.
      impact: >-
        When a proxy is configured, the registry-agent static pod restarts once on every node, and again
        whenever the proxy settings change.
    - summary: >-
        The registry storage on master nodes now serves on ports 4281/TCP (pulls by node agents and replication)
        and 4283/TCP (publishing through the `registry-push` Ingress) instead of 5001 and 5003.
      impact: >-
        The in-cluster registry storage (`registry` module, `Managed` mode with `storage.cache`) listens
        on the node address of master nodes on 4281/TCP instead of 5001/TCP and on 4283/TCP instead of
        5003/TCP. Both are in the 4200–4299 range that the documented host firewall rules already open.
        If inter-node traffic is filtered by explicit rules, allow 4281/TCP from all nodes to master nodes
        and between master nodes, and 4283/TCP from the nodes running the Ingress controller to master
        nodes. The registry agent stays on 127.0.0.1:5001 on every node, and image references (`registry.d8-system.svc:5001`)
        do not change. An installation from a bundle uses 4281/TCP on the first master for its bootstrap
        registry, and the bootstrap preflight now checks that ports 4281 and 4283 are free.
    - summary: >-
        The registry-agent static pod requests CPU and memory, and on nodes configured by bashible it
        now measures data the in-cluster cache left behind, so `D8RegistryStaleCacheData` can fire there.
      impact: >-
        The registry-agent restarts once on every node. After moving from the v1 registry implementation
        (DP up to and including 1.77) to the registry module without the in-cluster cache, `D8RegistryStaleCacheData`
        may fire on masters for the data left in `/opt/deckhouse/registry/local_data`.
    - summary: >-
        Registry credentials in RegistryConfig and RegistryUpstream are now hidden from unauthorized API
        readers.
registry-packages-proxy:
  fixes:
    - summary: >-
        The proxy serves `deckhouse-cli` and `deckhouse-cli/plugins/<name>` images from the registry root
        above the cluster's edition repository.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22324
    - summary: >-
        deckhouse-cli and plugin downloads now work in registries filled by `d8 mirror push`; the proxy
        probes the cluster repo first, then the edition-trimmed root, and remembers the working one.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22535
    - summary: >-
        Bump golang.org/x/{crypto,net,sys,text} to clear 24 CVEs, including CVE-2026-56854 (CRITICAL)
        and CVE-2026-25681, CVE-2026-39821, CVE-2026-46600 (HIGH).
      pull_request: https://github.com/deckhouse/deckhouse/pull/22753
    - summary: Allow node drains in non-HA mode and add a module-level high-availability override.
    - summary: Bump golang.org/x/crypto to fix CVE-2026-56855, CVE-2026-78662.
    - summary: >-
        Fixed registry-packages-proxy hanging after a cache error and serving corrupted packages, which
        blocked node updates.
    - summary: >-
        registry-packages-proxy leaves an unreachable master after about 100 seconds, runs a quorum of
        masters with HA on and is not evicted from a single master.
    - summary: registry-packages-proxy no longer tolerates keys from `customTolerationKeys`.
      impact: >-
        registry-packages-proxy does not run on a master tainted with a key from `global.modules.placement.customTolerationKeys`.
        Remove such taints from the master NodeGroup before the update.
    - summary: >-
        Bump golang.org/x/net, go-jose and klauspost/compress to fix CVE-2026-78659, CVE-2026-78660, CVE-2026-78661,
        CVE-2026-78663, CVE-2026-78669, CVE-2026-97032, CVE-2026-97045, CVE-2026-116585, CVE-2026-116586,
        CVE-2026-116587 and CVE-2026-63209.
    - summary: >-
        The bootstrap port serves the manifest and the layer of the rpp-get image, so a node can verify
        the binary it installs.
terraform-manager:
  fixes:
