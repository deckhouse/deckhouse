cloud-provider-aws:
  features:
    - summary: >-
        IMDS v2 support. The new `imdsv2` setting in `AWSClusterConfiguration` enforces token-based IMDSv2
        on all EC2 instances of the cluster.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21988
      impact: >-
        The new `imdsv2` setting in `AWSClusterConfiguration` is opt-in and does nothing until it is set

        explicitly, so existing clusters are unaffected until then.


        Once `imdsv2: true` is set, DKP also sets the IMDS hop limit of every instance it manages to `1`,

        lowering it if the AWS account defaults or the AMI provide a higher value. With a hop limit of
        `1`

        the instance metadata service becomes unreachable from Pods that do not use the host network,

        including Pods whose applications support IMDSv2. DKP components are not affected, they run in
        the

        host network. Removing the setting afterwards stops DKP from managing the metadata options, but
        it

        does not restore the previous hop limit on instances that already have it: that has to be done

        through the AWS API.


        Applying the setting to master, static and bastion nodes requires `dhctl converge`; CloudEphemeral

        nodes are re-created automatically, which rolls every node of every affected NodeGroup.
  fixes:
    - summary: >-
        Do not fail the node bootstrap or update when `linux-modules-extra` is unavailable for the running
        kernel.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21917
