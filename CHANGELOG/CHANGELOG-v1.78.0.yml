admission-policy-engine:
  features:
    - summary: >-
        Added the `gpuResourceRestriction` policy to `OperationPolicy`, which denies Pods requesting GPU
        resources in namespaces without the configured label.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22757
    - summary: Added a controller-level check to all rules that check pods.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21556
      impact: >-
        Security and operation policies now validate pod-creating controllers

        (Deployment, StatefulSet, DaemonSet, Job, CronJob, ReplicationController)

        in addition to Pods. Set `podSecurityStandards.controllerValidation` to

        `false` to validate only Pods, as before.


        Controller checks evaluate the un-mutated pod template, so a workload that

        passes at Pod level only because a mutating component fills a field in may

        be denied at the controller level.


        A workload carrying `security.deckhouse.io/skip-pss-check` only on its pod

        template is now checked at the controller level. Set the label on the

        controller's top-level `metadata.labels` as well to exempt it completely.


        The webhook now intercepts CREATE, UPDATE and DELETE for these kinds, so

        that a policy can forbid deleting a resource. While Gatekeeper is

        unavailable, deleting such a resource is blocked along with creating it.
    - summary: Report the availability of the module components with alerts.
    - summary: >-
        The default Pod Security Standards policy is `Baseline` regardless of the Deckhouse version the
        cluster was bootstrapped with.
      impact: >-
        The default Pod Security Standards policy for non-system namespaces is now always `Baseline`.

        Previously, clusters bootstrapped with a Deckhouse version lower than v1.55 or with an unknown
        bootstrap version used `Privileged`.

        In such clusters, pods that do not comply with `Baseline` are denied when recreated if `enforcementAction`
        is `Deny`.

        The update is blocked while `settings.podSecurityStandards.defaultPolicy` is not set in the `admission-policy-engine`
        ModuleConfig

        and the cluster uses the `Privileged` policy derived from the bootstrap version.

        Before updating, set `settings.podSecurityStandards.defaultPolicy` explicitly.

        To keep the current behavior, set it to `Privileged`.

        To switch to `Baseline` or `Restricted`, first make sure that the workloads in non-system namespaces
        comply with the chosen policy.
    - summary: Mutations limited by `spec.applyTo[].operations` no longer send other operations to Gatekeeper.
    - summary: >-
        Add the `imageSignatureVerification.registryCredentialsCacheTTLSeconds` parameter. Registry credentials
        of image signature verification are now cached for 5 minutes instead of 12 hours.
    - summary: >-
        Publish the rules of the Pod Security Standards as the SecurityPolicy objects `d8-pod-security-baseline`
        and `d8-pod-security-restricted`.
    - summary: >-
        Add per-rule controller validation settings, `podSecurityStandards.controllerValidationExcludedPolicies`
        for the Pod Security Standards and `spec.controllerValidation` for OperationPolicy and SecurityPolicy.
    - summary: >-
        The alerts on policy violations fire for each policy and namespace, and an alert on a namespaced
        object is shown in its namespace.
      impact: >-
        `PodSecurityStandardsViolation`, `OperationPolicyViolation` and `SecurityPolicyViolation` fire
        once for each policy and namespace with the `policy` and `namespace` labels instead of once for
        the cluster. With the observability module, an alert on a namespaced object is an ObservabilityAlert
        in that namespace instead of a ClusterObservabilityAlert; update the notification routing that
        relies on the cluster-wide alerts.
    - summary: >-
        Add the `allowSubPaths` parameter to SecurityPolicyException `hostPath` exceptions to allow paths
        nested under the specified one.
    - summary: Add namespace into provider request for VEX exclusions
  fixes:
    - summary: fix cve
      pull_request: https://github.com/deckhouse/deckhouse/pull/21817
    - summary: Admission policies are now evaluated for ephemeral containers added with `kubectl debug`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22398
      impact: >-
        Containers attached through the `pods/ephemeralcontainers` subresource were not seen by

        the module's webhook, so no policy was evaluated for them: SecurityPolicy, OperationPolicy,

        Pod Security Standards and image signature verification were all bypassed by `kubectl debug`.

        After the update these requests are validated.


        On clusters with restricted Pod Security Standards, `deny-exec` or strict SecurityPolicy,

        typical debug images (root user, writable root filesystem, interactive `-it`) will now be

        rejected. Adjust the policies or use a SecurityPolicyException for the namespaces where

        debugging must stay available.


        The webhook uses `failurePolicy: Fail`, so while Gatekeeper is unavailable `kubectl debug`

        will not work in user namespaces. System namespaces are excluded from the webhook and are

        not affected.
    - summary: >-
        Restrict SecurityPolicyException write access to ClusterAdmin, closing a tenant-to-node privilege
        escalation.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22412
      impact: >-
        Project administrators (user-authz Admin access level) can no longer create, update or delete
        SecurityPolicyException resources; the permission now requires ClusterAdmin. Clusters that granted
        accessLevel Admin to untrusted tenants over RBAC v1 were exposed to node-level privilege escalation.
        RBAC v2 use/manage roles were never affected.
    - summary: >-
        Reject Assign/AssignMetadata/ModifySet/AssignImage resources that violate Gatekeeper's own content
        restrictions (invalid `location`, missing `match.kinds`, etc.) at `kubectl apply` time instead
        of silently ignoring or failing them later.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22758
      impact: >-
        A pre-existing Assign/AssignMetadata/ModifySet/AssignImage resource that violates one of these
        restrictions (see the module FAQ) starts failing `kubectl apply`/`helm upgrade` after the upgrade.
        Fix the resource before upgrading, or drop it if it was already a silent no-op, most commonly
        a mutator missing `spec.match.kinds`, which never took effect anyway.
    - summary: >-
        Fixed D8AllowedSysctls ignoring a policy that sets only one of allowedUnsafeSysctls and forbiddenSysctls.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21556
      impact: >-
        A SecurityPolicy that set only one of the two keys denied nothing at all.

        It now denies the sysctls it lists, so workloads that used a forbidden

        sysctl and were admitted before will be rejected. Check `forbiddenSysctls`

        in your SecurityPolicy resources before updating.
    - summary: A SecurityPolicyException with several allowedValues now honours all of them, not only
        the first.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21556
    - summary: >-
        D8AutomountServiceAccountToken now denies a pod that mounts the service account token explicitly,
        even when automountServiceAccountToken is set to false.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21556
    - summary: >-
        The Trivy provider now checks images of ephemeral containers, so kubectl debug is denied for an
        image with disallowed vulnerabilities.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21556
    - summary: >-
        Restored the `Privileged` default PSS policy for clusters bootstrapped before v1.55 (without the
        `install-data` ConfigMap).
      pull_request: https://github.com/deckhouse/deckhouse/pull/23253
      impact: >-
        Clusters bootstrapped before v1.55 were switched to the `Baseline` default PSS policy in 1.77,
        which denies privileged workloads in user namespaces.

        After the update, the default policy on these clusters becomes less strict: it is switched back
        to `Privileged`, and privileged pods in user namespaces pass admission again.

        To keep the `Baseline` policy, set `settings.podSecurityStandards.defaultPolicy: Baseline` explicitly
        in the `admission-policy-engine` ModuleConfig.
    - summary: Scope policies in system namespaces by namespace name.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23003
      impact: >-
        A namespace named `d8-*` or `kube-*`, and a namespace labeled `heritage: deckhouse` whatever it
        is called, is treated as the platform's own. Such a namespace is checked against the `restricted`
        Pod Security Standard: a violation is reported in the audit and in Deckhouse Console and the workload
        still starts, unless the module that owns the namespace has opted it into enforcement. None of
        this is configurable.


        User policies only warn there. An OperationPolicy or a SecurityPolicy with `enforcementAction:
        Deny` reports a violation in a system namespace and does not block the workload, whatever the
        namespace is labeled with, including a namespace a module has opted into enforcement.


        Enforcement in `kube-*` namespaces is relaxed: previously the exclusion matched `d8-*` only, so
        `kube-system` and the other `kube-*` namespaces were subject to user policies in full.


        Enforcement in system namespaces no longer depends on `defaultPolicy`. With `defaultPolicy: Restricted`
        the restricted constraint was previously not created, and with `defaultPolicy: Privileged` the
        baseline one, so a namespace that had opted into enforcement was checked against the weaker standard
        only.


        Gatekeeper mutations no longer run in `d8-*` and `kube-*` namespaces.


        The name prefixes `d8-system-default-` and `d8-pod-security-` are reserved: creating or updating
        an OperationPolicy or SecurityPolicy with such a name is rejected, as is a name longer than 235
        characters, which would push a derived constraint name past the limit Kubernetes sets for an object
        name.


        Expect more audit data. Every pod in a system namespace is now measured against the full `restricted`
        set, and control-plane static pods violate most of it, so the constraints report violations that
        no constraint used to see. Each violation is one Prometheus series from `constraint-exporter`
        and one entry in the constraint status, up to the audit limit of 200 per constraint. None of it
        alerts: the audit rules fire on `deny` only.
    - summary: A SecurityPolicy that only forbids hostNetwork denies it again.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23003
      impact: >-
        A SecurityPolicy that set `allowHostNetwork` without `allowedHostPorts` stopped denying anything
        at all, including the `hostNetwork` it forbade. Such a policy is enforced again. Review the policies
        that set only `allowHostNetwork`: workloads that ran under them may start being denied.
    - summary: A SecurityPolicyException no longer requires the feature it permits.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23003
      impact: >-
        An exception permitting `hostNetwork`, `hostPID` or `hostIPC` denied every pod that did not use
        it, because the pod was compared against the exception alone. A module that enables such a feature
        only for certain settings could not ship a single exception: with the setting off, all of its
        pods were blocked. Not using a feature is no longer treated as a violation; an exception still
        decides whether the feature may be used.
    - summary: Fixed CVEs in the `gatekeeper` and `ratify` images.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23291
    - summary: Fixed docs of admission-policy-engine module.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23193
    - summary: Fixed Gatekeeper policies for `kubectl exec` and `kubectl attach` being skipped in user
        namespaces.
      impact: >-
        Exec and attach requests in user namespaces reach Gatekeeper again, as in Deckhouse 1.73 and 1.74.

        Every constraint that matches them is evaluated again, including a constraint without `match.kinds`

        or with `kinds: ["*"]` whose policy does not check `input.review.operation`.

        Before updating, check that such constraints do not deny `kubectl exec` and `kubectl attach`

        for users who need them.
    - summary: >-
        Disabling the module deletes the webhook configurations before Gatekeeper, so the uninstall no
        longer blocks `exec` and the Deckhouse queue.
    - summary: >-
        Enforce the SELinux part of Pod Security Standards, and accept SecurityPolicyException entries
        for sysctls, AppArmor `Localhost` profiles and shared hostPath volumes.
      impact: >-
        Pod Security Standards `baseline` and `restricted` now reject pods that set an SELinux `type`
        other than

        `container_t`, `container_init_t`, `container_kvm_t` or `container_engine_t`, or that set an SELinux
        `user` or `role`.

        Such pods were admitted before the update.

        A `SecurityPolicy` with `seLinux` entries now rejects an SELinux field that the matching entry
        does not list, except `level`.

        Before the update, review the workloads that set `seLinuxOptions` and cover the ones that need
        it with a `SecurityPolicyException`.

        A `SecurityPolicyException` for a hostPath with `readOnly: false` now also admits read-only mounts
        of the path.
    - summary: >-
        Policies stay enforced during an update that adds a constraint template or while Gatekeeper reprocesses
        its templates.
    - summary: The Gatekeeper webhook leaves an unreachable node after 30 seconds instead of five minutes.
    - summary: >-
        Fixed CVE-2026-78659, CVE-2026-78660, CVE-2026-78663, CVE-2026-78669 and CVE-2026-97032 in `golang.org/x/net`
        and CVE-2026-56851 in `golang.org/x/text`.
    - summary: >-
        Mutators (Assign, AssignImage, AssignMetadata, ModifySet), external data providers and connections
        now report their status per Gatekeeper pod.
    - summary: >-
        Fixed CVE-2026-114437 in `github.com/go-chi/chi/v5`, CVE-2026-116585, CVE-2026-116586 and CVE-2026-116587
        in `github.com/go-jose/go-jose/v4` and CVE-2026-78661 and CVE-2026-97045 in `golang.org/x/net`.
    - summary: Fixed CVE-2026-78661 and CVE-2026-97045 in `golang.org/x/net` of gatekeeper.
basic-auth:
  fixes:
    - summary: >-
        Restrict `whitelist` to IP addresses and subnets, restrict `location` to a single path segment,
        deny paths outside the configured locations, and serve `/healthz` on a port the `Service` does
        not publish.
      impact: >-
        The settings of the `basic-auth` module are converted to version 2. The conversion deletes the
        following values:

        - a `whitelist` element that is not an IPv4 or IPv6 address or subnet, for example `all` or a
        host name;
          a location left without addresses requires a password, or denies every request when it has no
        `users`;
        - a `location` that is neither `/` nor a single path segment of Latin letters, digits, `.`, `_`
        and `-`,
          or equals `htpasswd`;
        - a repeated location, such as `/test` next to `test`.

        To keep access without a password, replace such `whitelist` values with addresses or subnets before
        updating.

        The `/healthz` path and, when `locations` has no `/`, every path outside the configured locations

        no longer answer `200` without authentication on port `80` of the `basic-auth` service.

        The `nginx` pods in the `kube-basic-auth` namespace restart.
candi:
  features:
    - summary: Deprecate `ClusterConfiguration.cloud.prefix` and cap its length at 45 characters.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21533
    - summary: Added golang v1.27.0
      pull_request: https://github.com/deckhouse/deckhouse/pull/22452
    - summary: Base images updated to v3
      pull_request: https://github.com/deckhouse/deckhouse/pull/22986
    - summary: Added step to set the node.deckhouse.io/cloud-provider-type label.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22050
    - summary: >-
        Added support for Kubernetes 1.37 and discontinued support for Kubernetes 1.32. Default Kubernetes
        version was changed 1.34->1.35.
      impact: The minimum supported version of Kubernetes is now 1.33. All control plane components will
        restart.
    - summary: >-
        bashible installs nodelet on every node it manages, puts it back where it is missing, and waits
        for the platform's registry packages instead of installing them; static node cleanup removes the
        agent.
      impact: >-
        A new node's bootstrap installs nodelet and waits for its NodeGroup's NodeConfigTemplate, served
        by node-controller, before it requests the bashible bundle.
  fixes:
    - summary: A missing rpp-get package no longer prevents bashible from updating itself on a node.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21669
    - summary: Revert feature gate DRADeviceTaints
      pull_request: https://github.com/deckhouse/deckhouse/pull/21724
    - summary: Enable the DRADeviceTaints feature gate by default for Kubernetes 1.33–1.35.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21720
    - summary: >-
        Restore the `Containerd` schema default and non-deprecated status of `ClusterConfiguration.defaultCRI`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21830
    - summary: Install kubernetes-cni 1.9.1 on nodes.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21924
    - summary: bump opentofu to 1.12.5 and refresh its dependency patch, clearing 28 CVEs
      pull_request: https://github.com/deckhouse/deckhouse/pull/22113
    - summary: >-
        Explicitly set kubelet nodeStatusReportFrequency to 1m so the full Node object is no longer rewritten
        in etcd every 10s.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22175
      impact: >-
        Kubelet config is updated and kubelet is reloaded on all nodes. Node .status fields (capacity,
        allocatable, images, condition heartbeat timestamps) now refresh once per minute instead of every
        10s
    - summary: >-
        Node cleanup now removes the d8-shutdown-inhibitor logind drop-in under both its current and legacy
        names.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22513
    - summary: >-
        Fix a flaky containerd-integrity check that could trigger spurious full containerd wipes and reboots.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22597
    - summary: Fixed moduleSource vars injection in bashible steps.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22512
    - summary: >-
        Bump base images to v0.5.85, moving the Go builders to 1.25.13 and clearing Go stdlib CVEs in
        prebuilt images.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22672
    - summary: Fix hanging sysctl tuner on nodes with many loop and dm devices
      pull_request: https://github.com/deckhouse/deckhouse/pull/22750
    - summary: >-
        bashible now reports the failing step's own stderr in the Instance message, instead of the shell's
        exit status, so a broken step can be diagnosed without SSH to the node.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22275
    - summary: Prevent shell command injection through proxy settings in ClusterConfiguration.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22760
    - summary: >-
        Fix node bootstrap hanging forever when a systemd swap unit is regenerated while being stopped
        (zram-generator).
      pull_request: https://github.com/deckhouse/deckhouse/pull/22843
    - summary: >-
        containerd v2 no longer starts without the `erofs` snapshotter, and loads the `erofs` module before
        start.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22861
    - summary: A GPU problem no longer blocks node convergence.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22142
      impact: >-
        On a NodeGroup with `spec.gpu`, a failing GPU check used to abort the bashible run and be retried
        forever, so the node never configured kubelet and never received updates from any other module.
        Such a node now converges and only its GPU stays unusable. If `/usr/bin/nvidia-container-runtime`
        is absent, containerd is now configured with `runc` as the default runtime instead of `nvidia`;
        on a node whose configuration previously selected `nvidia` this changes the containerd config
        and therefore restarts containerd. Previously such a node could not start any container at all.
    - summary: GPU compute capability check no longer requires `bc`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22142
    - summary: >-
        Persist `net.core.bpf_jit_harden` for GPU nodes in an own sysctl drop-in instead of editing distribution
        files that may be absent.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22142
    - summary: >-
        Exclude the kubelet root dir from the partition resize step, so disks of foreign persistent volumes
        are no longer grown.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23138
    - summary: remove d8-bcheck in cleanup_static_node
    - summary: >-
        containerd integrity errors are written to `/var/log/containerd/containerd-integrity.log` on RED
        OS 8.
    - summary: Containerd configuration files under `/etc/containerd` are now readable by root only (`600`).
    - summary: Bashible now disables rpcbind regardless of its runtime state and compares node uptime
        numerically.
    - summary: >-
        Restored the lost `kubelet-disable-k-panic-check` patch for k8s 1.35 and 1.36, so kubelet no longer
        enforces `kernel.panic=10` on these versions.
    - summary: Svace enabled in builder/golang from base-images
    - summary: Bump opentofu to 1.13.1.
    - summary: >-
        New nodes reboot on the first bashible run again when a step requests it. Only the first master
        skips this reboot.
    - summary: >-
        The static node cleanup script now removes the `deckhouse` group, so the node can be bootstrapped
        again.
    - summary: >-
        Bashible keeps the configured node group when the `node.deckhouse.io/group` label is missing on
        the node.
    - summary: bashible replaces a node agent an older release installed.
    - summary: >-
        The first master bootstrap waits for `kube-apiserver` readiness instead of failing the control-plane
        step on `connection refused`.
    - summary: >-
        bashible verifies the rpp-get binary against the image digest from its bundle before running it;
        a substituted bootstrap proxy on a master can no longer hand a binary to the nodes.
      impact: >-
        A node that joins while a registry-packages-proxy pod of the previous release is still running
        on a master waits until a pod of this release answers.
    - summary: >-
        Fixed an intermittent bootstrap hang where kube-apiserver never started because kubelet read its
        manifest while it was being written.
    - summary: >-
        A new cloud node sets up the provider network before it installs bootstrap packages, so it can
        download them from a master in another zone.
cert-manager:
  features:
    - summary: Add first-class Yandex Cloud DNS ACME DNS-01 support via ModuleConfig settings.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22971
    - summary: >-
        Add the `highAvailability` parameter to control the HA mode of the module independently of the
        global setting.
    - summary: >-
        `cert-manager` uses the cluster-wide proxy server from the `proxy` parameter of `ClusterConfiguration`.
      impact: >-
        In a cluster with the `proxy` parameter of `ClusterConfiguration` set, the `cert-manager` controller
        and the Yandex Cloud DNS webhook

        send requests to the ACME server, HashiCorp Vault and the DNS provider APIs through the proxy
        server.

        The `HTTP-01` self-check also requests the domain through the proxy server.

        If the proxy server cannot reach the issuer or the public address of the cluster, add these addresses
        to `noProxy`.
    - summary: >-
        Update cert-manager to 1.21.2 and fix vulnerabilities in its images. The CRDs gain the fields
        of 1.20 and 1.21, such as Certificate renewal policies and `waitInsteadOfSelfCheck` of the ACME
        solvers.
      impact: >-
        The `cert-manager`, `cainjector` and `webhook` pods will be restarted.

        Issuers and ClusterIssuers that set `zoneType` of the Azure DNS solver must be applied again:
        the API server pruned the field before the update.

        With `enableCAInjector: true`, cainjector always uses server-side apply and takes over the managed
        fields of the objects annotated with `cert-manager.io/inject-ca-*`.
    - summary: >-
        Add the `enableACMERenewalInfo`, `http01WaitInsteadOfSelfCheck` and `certificateRequestMaximumBackoffDuration`
        parameters to enable ACME Renewal Information, skip the HTTP-01 self-check of the Let's Encrypt
        ClusterIssuers and cap the retry backoff of failed CertificateRequests.
  fixes:
    - summary: fix cve
      pull_request: https://github.com/deckhouse/deckhouse/pull/21817
    - summary: Move namespaced Issuer write from Editor to Admin.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22494
      impact: >-
        Users with the Editor role can no longer create, update, or delete

        namespaced Issuer objects. Use the Admin role to manage Issuers.

        Certificate objects and ClusterIssuer permissions are unchanged.

        Existing Issuer objects keep serving until edited.
    - summary: >-
        Restore the `cert-manager` and `cainjector` permissions that were lost against the upstream chart,
        including access to `ListenerSet` resources.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23066
    - summary: Fixed CVEs in the cert-manager images.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23289
    - summary: >-
        Gateway API integration is now enabled automatically when the Gateway and HTTPRoute CRDs are installed.
    - summary: >-
        The webhook keeps serving requests during a rollout and during a rotation of its CA, and the controller
        waits for the API server at startup instead of restarting.
    - summary: >-
        The `spec.certificateOwnerRef` field of a certificate no longer causes an endless Secret update
        loop when it differs from the global owner reference setting that `cleanupOrphanSecrets` enables
        in the `CertManager` HTTPS mode, and is applied to an already issued Secret.
    - summary: >-
        Fixed CVE-2026-78659, CVE-2026-78660, CVE-2026-78663, CVE-2026-78669 and CVE-2026-97032 in `golang.org/x/net`.
    - summary: >-
        Fix the build of the CRD check stage of cert-manager-controller: `pm` is not available in `builder/src`.
    - summary: >-
        The metrics proxy of the controller is no longer restarted by its liveness probe while its node
        is short of CPU.
      impact: The `cert-manager` controller pod restarts.
    - summary: >-
        The mutating webhook is called only for new CertificateRequests, so most writes of the controller
        cost one webhook call instead of two.
chrony:
  features:
    - summary: >-
        The `d8-chrony` namespace enforces the restricted Pod Security Standard, with a SecurityPolicyException
        for the chrony pods.
      impact: The `chrony` and `chrony-master` pods are restarted on all nodes.
    - summary: Master nodes check and correct their clocks from NTP before kubelet starts.
      impact: >-
        If the configured NTP servers are unreachable, a master boot can wait up to 30 seconds by default.
        On bashible nodes this limit can be raised to 60 seconds. Kubelet starts after the timeout and
        NodeTimeNotSynchronizedAtBoot fires after the failure metric is collected. For isolated clusters,
        configure reachable ntpServers or set earlyTimeSync.enabled to false.
  fixes:
    - summary: bump chrony_exporter to 0.14.0, clearing 23 CVEs and dropping its dependency patches
      pull_request: https://github.com/deckhouse/deckhouse/pull/22115
    - summary: >-
        revert chrony_exporter to 0.11.0 to stop the exporter crash-looping on failed probes, keeping
        the CVE fix as a dependency bump
      pull_request: https://github.com/deckhouse/deckhouse/pull/22170
      impact: On builds carrying
    - summary: Fixed the unit-detection condition in the `disable-ntp-on-node.sh` node step.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22777
    - summary: Bump golang.org/x/crypto in chrony_exporter to fix CVE-2026-56855, CVE-2026-78662.
    - summary: >-
        Bump golang.org/x/net in chrony_exporter to fix CVE-2026-78659, CVE-2026-78660, CVE-2026-78661,
