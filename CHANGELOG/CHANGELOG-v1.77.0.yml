        In the `metallb` module, BGP configuration was migrated from ModuleConfig to dedicated custom
        resources. Existing configuration is migrated automatically during the update. Before editing
        the generated resources, disable further migration by updating the ModuleConfig version. Afterwards,
        remove the obsolete BGP settings from the ModuleConfig. See the module documentation for details.
