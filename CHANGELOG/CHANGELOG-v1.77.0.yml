cloud-provider-dvp:
  features:
    - summary: Enabled the security policy check and added SecurityPolicyException for DVP CSI and CCM.
      pull_request: https://github.com/deckhouse/deckhouse/pull/18873
    - summary: Added oss.yaml files for cloud provider modules.
      pull_request: https://github.com/deckhouse/deckhouse/pull/18989
    - summary: Migrated cloud-provider RBAC v1 `user-authz` ClusterRoles to a shared `helm-lib` template.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19964
    - summary: Migrated remaining cloud-provider Go artifact builds to the unified `builder/golang` image.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20084
    - summary: Added live StorageClass migration for VM disks via DeckhouseMachine spec changes.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19919
    - summary: Cleaned up LoadBalancer and ServiceWithHealthchecks resources during DVP cluster deletion.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20078
    - summary: Add an option to disable the CCM LoadBalancer functionality via ConfigMap.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21296
    - summary: Migrated module configuration from ProviderClusterConfiguration to ModuleConfig.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20236
      impact: >-
        Cloud provider configuration for DKP clusters deployed in DVP needs to be migrated from ProviderClusterConfiguration
        to ModuleConfig settings. For migration instructions, refer to "Cluster and Infrastructure" in
        the DKP FAQ.
  fixes:
    - summary: >-
        Fixed LoadBalancer stuck in pending by retrying on conflict when updating ServiceWithHealthchecks
        and propagating IP to the child cluster service status.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19590
    - summary: >-
        Add skip storage class annotation handling to skip discovery of some storage classes from parent
        clusters, e.g., local disks.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19696
    - summary: Bumped helm_lib with liveness probe parameters for the CSI controller.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19694
    - summary: Restored correct service-lb-controller enablement in cloud-provider-dvp.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20177
    - summary: >-
        Always use WaitForFirstConsumer for child-cluster DVP StorageClasses and recreate incompatible
        managed classes during upgrade.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20116
    - summary: add labels to cloudinit secrets in the terraform
      pull_request: https://github.com/deckhouse/deckhouse/pull/20321
    - summary: Fixed CVEs in the cloud-provider-dvp module.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20796
    - summary: >-
        fix CSI vmBDA retry loop that caused x1580 retries and blocked new PVC mounts on static→dynamic
        node migration
      pull_request: https://github.com/deckhouse/deckhouse/pull/20145
    - summary: Fixed duplicate volume mounts in the DVP CSI driver on kubelet retries.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20714
    - summary: Stopped setting empty `dvp.deckhouse.io/cluster-uuid` and `dvp.deckhouse.io/hostname` labels.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21110
    - summary: Made cloud-init secrets immutable to prevent post-bootstrap data mutation.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20930
    - summary: Treated a missing VMBDA as success on disk detach.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21266
    - summary: fix dvp kubernetes dependency mismatch
      pull_request: https://github.com/deckhouse/deckhouse/pull/21367
    - summary: >-
        Added the d8_cloud_provider_dvp_migration_pending metric for the D8CloudProviderDVPMigrationPending
        alert.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21409
    - summary: >-
        Fixed ModuleConfig access for users with the d8:manage:infrastructure:viewer and d8:manage:infrastructure:manager
        roles.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21487
    - summary: >-
        Made the DVP CSI driver wait for VirtualDisk readiness in CreateVolume so provisioning errors
        are propagated instead of marking the PV as Bound.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20566
    - summary: Added mount points for the validation-webhook image so serving certificates persist correctly.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21526
    - summary: >-
        Bumped Go module dependencies to fix known CVEs in cloud-controller-manager, dvp-csi, capdvp,
        cloud-data-discoverer.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20780
    - summary: skip foreign nodes in cloud controller manager
      pull_request: https://github.com/deckhouse/deckhouse/pull/21780
