cloud-provider-aws:
  features:
    - summary: Added oss.yaml files for cloud provider modules.
      pull_request: https://github.com/deckhouse/deckhouse/pull/18989
    - summary: Migrated cloud-provider-aws builds to the unified builder with package manager and Go toolchain.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19616
    - summary: Migrated cloud-provider RBAC v1 `user-authz` ClusterRoles to a shared `helm-lib` template.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19964
    - summary: Migrated AWS to Cilium CNI by default for new clusters.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19774
  fixes:
    - summary: Added a new Bashible step to install `linux-modules-extra` on Ubuntu nodes.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19415
    - summary: Bumped helm_lib with liveness probe parameters for the CSI controller.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19694
    - summary: >-
        Adds SecurityPolicyException for CCM and CSI components, fixes VPA and PodMonitor module guards,
        migrates hand-written templates to helm_lib helpers.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21397
    - summary: >-
        Bumped Go module dependencies to fix known CVEs in terraform-manager, cloud-data-discoverer; documented
        GO-2026-5932 vulnerability via VEX.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20780
    - summary: >-
        Do not fail the node bootstrap or update when `linux-modules-extra` is unavailable for the running
        kernel.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21955
