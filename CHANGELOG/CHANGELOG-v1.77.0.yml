    - summary: Allow change labels and annotations for secret d8-secret-encryption-key
      pull_request: https://github.com/deckhouse/deckhouse/pull/20103
    - summary: >-
        calculate_resources_requests is now stable across the kubelet warm-up window — uses Node.Status.Capacity
        minus max(actual kubelet reservation, floor), so the second hook run does not re-render every
        CP static-pod manifest.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20094
    - summary: >-
        cpm DaemonSet now talks to apiserver via the local kubernetes-api-proxy static pod (127.0.0.1:6445),
        removing its dependency on cilium-initialised ClusterIP routing during bootstrap.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20094
    - summary: >-
        Leader election is now conditional (helm_lib_is_ha_to_value) — on for HA, off for single-master,
        where every cpm controller is already partitioned by spec.nodeName. Stops cpm from crashing with
        leader election lost when its very first reconcile rewrites apiserver/etcd.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20094
