    - summary: Hide namespace existence in access denials.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22077
    - summary: Harden authn/authz validations and quote digit-only Project administrator names.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22083
      impact: >-
        Existing ModuleConfigs with idTokenTTL >= 6h raise D8UserAuthnIDTokenTTLTooLong until lowered.

        User.spec.password patches after create are rejected; reset via UserOperation or d8 iam user reset-password.
    - summary: Fix multitenancy check hooks
      pull_request: https://github.com/deckhouse/deckhouse/pull/22178
