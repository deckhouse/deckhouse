multitenancy-manager:
  features:
    - summary: >-
        Grant kubeadm:cluster-admins group granular full access to module CRDs via dedicated ClusterRole
        d8:multitenancy-manager:admin-kubeconfig.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19420
    - summary: >-
        Cluster resource grants — control which cluster-scoped resources a project may use, set per-project
        defaults, and cap usage with object quotas.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20520
    - summary: >-
        Cluster resource grants — split governed-resource definitions from validation/defaulting reference
        paths so any module can register a path; object quota delegated to Kubernetes ResourceQuota.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20611
  fixes:
    - summary: >-
        Grant and project admission webhooks no longer deadlock the Deckhouse queue when the multitenancy-manager
        backend denies, is slow, or is unreachable.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20700
    - summary: fix cve
      pull_request: https://github.com/deckhouse/deckhouse/pull/21986
    - summary: A project parameter can no longer inject objects into the rendered project manifests.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22091
      impact: >-
        Values taken from `Project.spec.parameters` are now quoted where they are substituted into the

        shipped project templates, and a parameter that changes the structure of the rendered manifests

        rather than only their values is refused for any template, including custom ones. An administrator

        name may no longer contain control characters, and `clusterLogDestinationName` must be a Kubernetes

        object name or empty. Both are checked from the reconcile loop as well as at admission, so a

        project already carrying such a value goes into an error state on its next reconcile rather than

        at its next edit; the same holds for a custom template that turns a parameter into several objects

        or into YAML, which is refused when the project is created, edited, or reconciled with a change
        to

        apply. The module's admission policy now also matches CREATE, so objects labelled

        `heritage: multitenancy-manager` can only be created by the module itself.
    - summary: Harden authn/authz validations and quote digit-only Project administrator names.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22083
      impact: >-
        Existing ModuleConfigs with idTokenTTL >= 6h raise D8UserAuthnIDTokenTTLTooLong until lowered.

        User.spec.password patches after create are rejected; reset via UserOperation or d8 iam user reset-password.
