local-path-provisioner:
  fixes:
    - summary: >-
        Add wildcard tolerations to the helper pod template so PVC provisioning works on tainted nodes
        after local-path-provisioner v0.0.32+.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19447
    - summary: >-
        Grant the default kubeadm `kubernetes-admin` user (`kubeadm:cluster-admins` group) and the user-authz
        `User` / `ClusterEditor` access levels permissions on `LocalPathProvisioner` and the module's
        `ModuleConfig` so that `kubectl create -f` on a `LocalPathProvisioner` no longer fails with "Forbidden".
      pull_request: https://github.com/deckhouse/deckhouse/pull/20245
    - summary: >-
        Backport HelperPod template validation to `local-path-provisioner` v0.0.34 to fix CVE-2026-44543
        (HelperPod Template Injection, GHSA-7fxv-8wr2-mfc4, CVSS 8.7 High).
      pull_request: https://github.com/deckhouse/deckhouse/pull/20237
      impact: >-
        The `local-path-provisioner` Pod is restarted during the update. PV provisioning and teardown
        briefly pauses while the new Pod becomes `Ready`; existing volumes are not affected. If you use
        a custom `helperPod.yaml` template in the `local-path-config` ConfigMap, remove any unsupported
        security-sensitive settings before upgrading. Otherwise, the `local-path-provisioner` will reject
        the template after the update.
    - summary: >-
        Update local-path-provisioner to v0.0.36 to pick up the upstream fix for CVE-2026-44543 (HelperPod
        template injection, CVSS 8.7).
      pull_request: https://github.com/deckhouse/deckhouse/pull/20449
      impact: >-
        Unsafe custom HelperPod settings in the `local-path-config` ConfigMap are no longer accepted.
        Default DKP installations are unaffected.
