      pull_request: https://github.com/deckhouse/deckhouse/pull/20319
  fixes:
    - summary: Reject mutually exclusive LDAP TLS settings in DexProvider; alert on legacy objects.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19844
      impact: >-
        spec.ldap.insecureNoSSL combined with startTLS, insecureSkipVerify, or a non-empty rootCAData
        is now rejected by the CRD. Pre-existing DexProvider objects with such combinations keep working
        but trigger

        D8DexProviderLDAPTLSConflict until updated. Audit with: kubectl get dexproviders.deckhouse.io
        -o yaml | yq '.items[] | select(.spec.type=="LDAP") | {name: .metadata.name, ldap: .spec.ldap
        | pick(["insecureNoSSL","startTLS","insecureSkipVerify","rootCAData"])}'
    - summary: Improve basic-auth-proxy request handling, cache implementation, and shutdown behavior.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20076
    - summary: >-
        Fix CVE-2026-29181 in user-authn/dex and fix CVE-2026-39883 in user-authz/permission-browser-apiserver
      pull_request: https://github.com/deckhouse/deckhouse/pull/20100
    - summary: Fix user-api self-service password reset in closed-loop clusters and restrict it to local
        Dex users.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20371
    - summary: >-
        UserOperation no longer keeps the bcrypt password hash in spec.resetPassword.newPasswordHash after
        the operation completes.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20281
    - summary: Added the missing `kubeconfigPublishAPIEncodedName` field to CSE OpenAPI values.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20864
    - summary: >-
        Reconcile Dex Password objects directly in the hook so new local users can log in immediately
        and are not forced to rotate their password on first login.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20847
    - summary: Remove redundant bootstrapped check from enabled script.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21048
    - summary: Remove critical flag from user-authn module.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21183
    - summary: >-
        Fixed DexAuthenticator pod creation under ResourceQuota by setting init container CPU/memory limits
        to the sum of main container limits.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21313
    - summary: Gateway API certificate manifest is updated to support any cluster issuer.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21407
    - summary: >-
        Fix Dex token refresh with upstream providers that rotate refresh tokens (GitLab), which logged
        users out every `idTokenTTL`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21685
    - summary: >-
        basic-auth-proxy no longer forwards reserved `system:` groups and usernames from the external
        directory to kube-apiserver.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21978
      impact: >-
        Affects clusters where `publishAPI` is enabled together with `enableBasicAuth` on a

        Crowd, OIDC or LDAP `DexProvider`. Both are disabled by default, so a default

        installation is not affected.


        Previously the proxy copied directory group names into the `X-Remote-Group` header

        verbatim. Because kube-apiserver trusts that header from this proxy, a user in a

        directory group literally named `system:masters` was granted cluster-admin. Group

        names are chosen by the directory administrator, not by Kubernetes.


        After updating, any group whose name begins with `system:` is dropped before the

        request reaches kube-apiserver, and each drop is logged by the basic-auth-proxy pod

        with the user and the group name. A user authenticating with a `system:`-prefixed

        username is refused with `403 Forbidden`. This matches the `userValidationRules`

        already enforced on the OIDC/JWT path.


        Before updating, audit your directory for groups whose name begins with `system:`

        and check whether anyone currently relies on one to reach the Kubernetes API through

        basic auth. Such users will lose those privileges on update and must be granted

        access through a normal group bound by RBAC instead. Check the basic-auth-proxy logs

        after updating for `dropping group` messages.
    - summary: >-
        DexClient and DexAuthenticator now honour the value of the allow-access-to-kubernetes annotation
        instead of merely its presence.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21979
      impact: >-
        The `dexclient.deckhouse.io/allow-access-to-kubernetes` and

        `dexauthenticator.deckhouse.io/allow-access-to-kubernetes` annotations were previously

        evaluated by key presence, so any value — including "false" — granted the client the

        right to obtain tokens with `aud=kubernetes` and placed it into `trustedPeers` of the

        `kubernetes` OAuth2Client, whose tokens kube-apiserver accepts.


        The value is now parsed as a boolean. Only 1, t, T, TRUE, true and True grant the

        capability. Any other value, including "false", "0", "yes", "enabled" and an empty

        string, disables it; unparseable values are rejected with a warning in the

        deckhouse Pod log naming the object and the offending value.


        Affected: clusters with a DexClient or DexAuthenticator that carries the annotation

        with a value other than a boolean true. Those objects lose access to the Kubernetes

        API on update, which for most of them is the behaviour their author intended.


        Before updating, run

        `kubectl get dexclient,dexauthenticator -A -o json | jq -r '.items[] | select(.metadata.annotations
        | to_entries[]? | select(.key | endswith("deckhouse.io/allow-access-to-kubernetes")) | .value
        | ascii_downcase | IN("1","t","true") | not) | "\(.kind)/\(.metadata.namespace)/\(.metadata.name)"'`

        and, for every object listed, either set the annotation to "true" if it genuinely needs

        Kubernetes API access, or remove the annotation to confirm it does not.
    - summary: fix cve
      pull_request: https://github.com/deckhouse/deckhouse/pull/21986
    - summary: Harden authn/authz validations and quote digit-only Project administrator names.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22083
      impact: >-
        Existing ModuleConfigs with idTokenTTL >= 6h raise D8UserAuthnIDTokenTTLTooLong until lowered.

        User.spec.password patches after create are rejected; reset via UserOperation or d8 iam user reset-password.
