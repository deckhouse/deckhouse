admission-policy-engine:
  features:
    - summary: Refactored constraints and tests and added support for container-level SecurityPolicyException.
      pull_request: https://github.com/deckhouse/deckhouse/pull/18668
    - summary: >-
        Grant kubeadm:cluster-admins group granular full access to module CRDs via dedicated ClusterRole
        d8:admission-policy-engine:admin-kubeconfig.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19420
    - summary: Added a complex nodeAffinity selector for the Gatekeeper controller-manager.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20656
    - summary: Add user documentation about security-policy-exceptions
      pull_request: https://github.com/deckhouse/deckhouse/pull/20717
    - summary: >-
        Added a ValidatingAdmissionPolicy that forbids removing Deckhouse finalizers containing `deckhouse.io`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21217
  fixes:
    - summary: Security fix for CVE-2026-33186, CVE-2026-39883.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19461
    - summary: Changed the default PSS policy to Baseline for unrecognized Deckhouse versions.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19663
    - summary: >-
        Made Gatekeeper pods tolerate the csi-not-bootstrapped taint to prevent webhook deadlock during
        worker node replacement.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19383
    - summary: Refactor main documentation page
      pull_request: https://github.com/deckhouse/deckhouse/pull/20048
    - summary: Updated Gatekeeper to 3.22.2 to fix CVEs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20454
    - summary: Revert external data provider usage pattern for trivy-provider
      pull_request: https://github.com/deckhouse/deckhouse/pull/20088
    - summary: Changed the label for container SecurityPolicyExceptions.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20678
    - summary: Update FAQ documentation page
      pull_request: https://github.com/deckhouse/deckhouse/pull/20226
    - summary: Fixed the constraint-template check for the AssignImage CRD.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20782
    - summary: Bumped ratify to 1.4.1 and fixed DMT allowing multiple oss.yaml files.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20797
    - summary: Fix policies hook tests
      pull_request: https://github.com/deckhouse/deckhouse/pull/21073
    - summary: fix cve
      pull_request: https://github.com/deckhouse/deckhouse/pull/21986
candi:
  features:
    - summary: Added oss.yaml files for cloud provider modules.
      pull_request: https://github.com/deckhouse/deckhouse/pull/18989
    - summary: Migrated node-manager (candi) builds to the unified builder with package manager and Go
        toolchain.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19882
    - summary: Added x-kubernetes-sensitive-data masking for sensitive fields.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19634
    - summary: Added ClusterRoleBinding in 71 bashible step to see logs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20201
    - summary: >-
        Bashible: master-only step 035 pre-pulls a curated whitelist of node images via ctr so kubelet
        finds them already in the containerd store when pods schedule.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20225
    - summary: Add feature gate KubeletEnsureSecretPulledImages
      pull_request: https://github.com/deckhouse/deckhouse/pull/20413
    - summary: >-
        Added support for Kubernetes 1.36 and discontinued support for Kubernetes 1.31. The default Kubernetes
        version was changed from 1.33 to 1.34.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19623
      impact: >-
        The minimum supported version of Kubernetes is now 1.32. All control plane components will be
        restarted.
  fixes:
    - summary: Improve bootstrap logging and store bootstrap logs in /var/log/d8/bashible/bootstrap.log
      pull_request: https://github.com/deckhouse/deckhouse/pull/19231
    - summary: >-
        Removed the Python requirement from bashible bootstrap and switched Registry Packages Proxy package
        installation to static binaries.
      pull_request: https://github.com/deckhouse/deckhouse/pull/18626
    - summary: min get 1 wave fixes
      pull_request: https://github.com/deckhouse/deckhouse/pull/19601
    - summary: Retried kube API errors in rpp-get during registry packages discovery.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19673
    - summary: increase runtimeRequestTimeout for kubelet
      pull_request: https://github.com/deckhouse/deckhouse/pull/19570
    - summary: Set ownership of transferred binaries to root:root instead of deckhouse:deckhouse
      pull_request: https://github.com/deckhouse/deckhouse/pull/19796
    - summary: >-
        Bashible bundle: light-prep parallel groups, sub-step timing, early kubeadm:cluster-admins ClusterRoleBinding,
        skip first-run reboot.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20094
    - summary: >-
        kubelet config: fileCheckFrequency 20s -> 2s — kubelet picks up static-pod manifest changes on
        the next 2-second tick instead of the next 20-second tick.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20094
    - summary: >-
        kube-apiserver static pod: terminationGracePeriodSeconds=1 and aggressive startupProbe on bootstrap
        (runType=ClusterBootstrap); runtime keeps conservative values.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20094
    - summary: >-
        Bashible: d8 install deferred from step 004 to 062 (first real use); no longer blocks the install
        batch.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20225
    - summary: >-
        Bashible: disable unattended-upgrades via apt.conf kill switch + systemd mask + async stop instead
        of blocking disable --now / apt remove. Removes dpkg-lock stalls during bootstrap.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20225
    - summary: Fixed 01-bootstrap-prerequisites.sh.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20367
    - summary: >-
        Prefetch control-plane node images first during cloud bootstrap so install-control-plane no longer
        blocks on image pulls.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20373
    - summary: >-
        Fixed static node cleanup to wipe data on externally mounted volumes before unmounting, preventing
        stale data from causing re-bootstrap failures.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20066
    - summary: Added `Configuration is in sync, nothing to do` to the bashible log.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20484
    - summary: Changed the automatic Kubernetes version from 1.33 to 1.34.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20572
      impact: Automatic k8s version is changed to 1.34 from 1.33, automatic setting will result in upgrade.
    - summary: Used a short timeout for deleting MirrorPods.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20565
    - summary: Fixed containerd credential escaping by rendering username and password into the auth string.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20589
    - summary: >-
        Speed up first-master bootstrap by not blocking bashible's per-package prefetch wait on packages
        already present in the base image.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20631
    - summary: >-
        Run the cluster-bootstrap cleanup step last so the bashible "first run" marker is not written
        before all bootstrap steps complete.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20719
    - summary: Made the `005_integrate_kubernetes_data_device.sh.tpl` step idempotent.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21168
    - summary: >-
        kube-apiserver no longer caches watches for `ManifestCheckpointContentChunk` resources from `state-snapshotter`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21208
      impact: kube-apiserver static pod is reconfigured and restarts on the next control-plane sync.
    - summary: Removed hook which deleted old CPO and CPN
      pull_request: https://github.com/deckhouse/deckhouse/pull/20416
    - summary: Set PDPL level for d8-dhctl-converger on Astra Linux
      pull_request: https://github.com/deckhouse/deckhouse/pull/21508
    - summary: Improved static node IP discovery diagnostics for missing tools and internalNetworkCIDRs
        mismatch.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20978
    - summary: Added an exception for Oracle Linux UEK kernels to address CVE-2025-37999 in bashible.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21578
    - summary: Revert feature gate DRADeviceTaints
      pull_request: https://github.com/deckhouse/deckhouse/pull/21726
    - summary: Enable the DRADeviceTaints feature gate by default for Kubernetes 1.33–1.35.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21745
    - summary: A missing rpp-get package no longer prevents bashible from updating itself on a node.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21778
    - summary: Install kubernetes-cni 1.9.1 on nodes.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21963
