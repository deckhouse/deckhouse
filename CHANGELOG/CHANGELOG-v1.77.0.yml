        prior to 1.76.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20877
      impact: >-
        If your cluster was previously upgraded to DKP 1.76.0 from a version earlier than 1.76 and was
        not patched, `kubectl logs` and `kubectl exec` may fail cluster-wide for all users. Apply the
        manual workaround from the [PR description](https://github.com/deckhouse/deckhouse/pull/20877)
