admission-policy-engine:
  features:
    - summary: >-
        Added the `PodSecurityStandardsDefaultPolicyNotSet` alert that fires when the `install-data` ConfigMap
        is missing and the default PSS policy must be set explicitly in the ModuleConfig.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23269
  fixes:
    - summary: >-
        Restored the `Privileged` default PSS policy for clusters bootstrapped before v1.55 (without the
        `install-data` ConfigMap).
      pull_request: https://github.com/deckhouse/deckhouse/pull/23259
      impact: >-
        Clusters bootstrapped before v1.55 were switched to the `Baseline` default PSS policy in 1.77,
        which denies privileged workloads in user namespaces.

        After the update, the default policy on these clusters becomes less strict: it is switched back
        to `Privileged`, and privileged pods in user namespaces pass admission again.

        To keep the `Baseline` policy, set `settings.podSecurityStandards.defaultPolicy: Baseline` explicitly
        in the `admission-policy-engine` ModuleConfig.
    - summary: Fixed CVEs in the `gatekeeper` and `ratify` images.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23321
cert-manager:
  fixes:
    - summary: Fixed CVEs in the cert-manager images.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23333
chrony:
  fixes:
    - summary: Bump golang.org/x/crypto to v0.55.0 in chrony_exporter to fix CVE-2026-56854.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23301
ci:
  fixes:
    - summary: update werf to v2.74.2-dk.1
      pull_request: https://github.com/deckhouse/deckhouse/pull/23223
    - summary: Add allowed alerts for D8Monitoring for e2e which uses 1.77+
      pull_request: https://github.com/deckhouse/deckhouse/pull/23280
cloud-provider-dvp:
  fixes:
    - summary: >-
        Fixed the `D8CloudProviderDVPMigrationPending` alert that kept firing after the migration resources
        were applied.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23248
    - summary: Fixes CVE vulnerabilities in cloud-provider-dvp images.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23332
    - summary: >-
        Fixes cluster bootstrap getting stuck when `capdvp-controller-manager` and the validation webhook
        cannot reach the API server and DNS before the CNI is ready.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23357
cloud-provider-openstack:
  fixes:
    - summary: >-
        Fixes cluster bootstrap getting stuck when `capo-controller-manager` cannot reach the API server
        and DNS before the CNI is ready.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23357
cloud-provider-vcd:
  fixes:
    - summary: Batch VM cache refresh on cache miss
      pull_request: https://github.com/deckhouse/deckhouse/pull/23315
    - summary: >-
        Fixes cluster bootstrap getting stuck when `capcd-controller-manager` cannot reach the API server
        and DNS before the CNI is ready.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23357
cloud-provider-yandex:
  fixes:
    - summary: fix "Address in use" failures when replacing nodes and when removing external IP addresses
      pull_request: https://github.com/deckhouse/deckhouse/pull/23256
      impact: >-
        dhctl converge no longer deadlocks on master replacement or externalIPAddresses removal in Yandex
        Cloud; the terraform-manager provider release is patched to detach one-to-one NAT before deleting
        a reserved address.
common:
  fixes:
    - summary: Fix kubelet podSandbox order
      pull_request: https://github.com/deckhouse/deckhouse/pull/23215
    - summary: fixed private build cni-migration-*
      pull_request: https://github.com/deckhouse/deckhouse/pull/23255
    - summary: Fix CVEs in the `kube-rbac-proxy` image.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23325
deckhouse:
  fixes:
    - summary: set releaseChannel in CSE
      pull_request: https://github.com/deckhouse/deckhouse/pull/23235
    - summary: Fix setting Scaled before Installed.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23258
deckhouse-controller:
  features:
    - summary: >-
        Add the `x-deckhouse-immutable`, `x-deckhouse-ui-group`, and `x-deckhouse-enum-switch-settings`
        extensions to Application package settings schemas; the Application webhook rejects changes to
        `x-deckhouse-immutable` fields after the settings were applied.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23360
    - summary: >-
        Application resources get the `packages.deckhouse.io/package` and `packages.deckhouse.io/instance`
        labels; the Helm release of every Application is upgraded once to add them.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23360
  fixes:
    - summary: Fix the rejection of every Application whose package settings schema uses `x-deckhouse-validations`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23360
dhctl:
  fixes:
    - summary: Restoring of handling api_server_url and api_server_token in dhctl
      pull_request: https://github.com/deckhouse/deckhouse/pull/23293
    - summary: Bump google.golang.org/grpc to v1.83.2 to fix CVE-2026-84304 and CVE-2026-84445.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23298
    - summary: >-
        Fixed terraform-auto-converger, terraform-state-exporter and `dhctl converge` failing on cloud
        clusters whose `cloud-provider-<name>` ModuleConfig has no `spec.enabled` field. dhctl now treats
        `spec.enabled` as optional and a ModuleConfig without it as disabled.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23317
docs:
  features:
    - summary: >-
        Add user-authn-controller, user-api and basic-auth-proxy components to user-authn module architecture
        section.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23176
    - summary: Rename DKP->DP and replace PNG->SVG architecture section
      pull_request: https://github.com/deckhouse/deckhouse/pull/23271
    - summary: Fix links to architecture diagrams
      pull_request: https://github.com/deckhouse/deckhouse/pull/23296
    - summary: Add alb module architecture section.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23338
    - summary: Add managed services modules architecture documentation section.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23382
    - summary: Add sdn module architecture section.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23384
  fixes:
    - summary: Fixed FAQ section for ansible inventory.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23275
    - summary: >-
        Register the ports of csi-hitachi and csi-mind-ustor, list the registry storage ports, and drop
        storage ports that are no longer bound in the host network from the ports reference.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23277
kube-dns:
  fixes:
    - summary: >-
        Set resource limits for the `render-etc-hosts-with-cluster-domain-aliases` init container so that
        pods can be created in namespaces with a ResourceQuota on `limits.cpu`/`limits.memory`.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23295
kube-proxy:
  fixes:
    - summary: >-
        Fixed kube-proxy failing to start on Kubernetes 1.36 and higher because of the removed `TopologyAwareHints`
        feature gate.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23336
      impact: The `d8-kube-proxy` pods will be restarted on all nodes.
metallb:
  fixes:
    - summary: >-
        Fixed creation of `BGPPeer` objects on Kubernetes 1.36+, which blocked BGP sessions and LoadBalancer
        IP announcements in BGP mode.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23312
multitenancy-manager:
  fixes:
    - summary: The grant-violation hook re-evaluates policies on change again, not only on its two-minute
        schedule.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23213
      impact: >-
        Two Go hooks registered in one file shared a derived name, so the Kubernetes-binding half lost
        its bindings and the `d8_cluster_objects_grant_violated` series was recomputed only by the periodic
        scan. The series itself was never missing; it could lag a policy change by up to two minutes.
    - summary: Fixed vulnerabilities in the `multitenancy-manager` image.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23361
node-manager:
  fixes:
    - summary: >-
        Increase the capi-controller-manager VPA maximum memory recommendation to prevent health-check
        failures and restarts under memory pressure.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23203
    - summary: >-
        Stop caps-controller-manager from rewriting StaticInstance objects in a hot loop when a connectivity
        check fails, which caused a sustained load on etcd.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23207
      impact: >-
        A StaticInstance whose connectivity check fails now keeps its reservation for the whole bootstrap
        window instead of returning to the pool on every failed attempt, and the bootstrap (20 min) and
        cleanup (10 min) timeouts, which previously never fired, are now reachable.

        If nothing ever ran on the host, the bootstrap timeout returns the instance to the pool after
        20 minutes as before.

        If the host was already bootstrapped in part, the instance returns only through MachineHealthCheck
        remediation (nodeStartupTimeoutSeconds: 1200) plus the cleanup timeout, so it becomes available
        again roughly 20 + 10 minutes after the failure, and remediation reboots the host as part of the
        cleanup.
    - summary: Fix duplicate NVIDIA GPU dashboards when the gpu module is enabled.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23250
    - summary: >-
        Bump google.golang.org/grpc to v1.83.2 in bashible-apiserver to fix CVE-2026-84304 and CVE-2026-84445.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23299
    - summary: >-
        Bump golang.org/x/crypto to v0.55.0 and google.golang.org/grpc to v1.83.2 in capi-controller-manager
        to fix CVE-2026-56854, CVE-2026-84304 and CVE-2026-84445.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23300
    - summary: Fixes CVE vulnerabilities in caps-controller-manager.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23332
service-with-healthchecks:
  fixes:
    - summary: Fixed metrics endpoints being reachable without going through kube-rbac-proxy authorization.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23166
terraform-manager:
  fixes:
    - summary: >-
        Bump google.golang.org/grpc to v1.82.2 in opentofu to fix CVE-2026-84445. CVE-2026-84304 is not
        exploitable in opentofu and is covered by VEX.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23303
user-authn:
  fixes:
    - summary: >-
        An idTokenTTL of 6h or more no longer stops Deckhouse from starting; it raises the D8UserAuthnIDTokenTTLTooLong
        alert and blocks the update to the next minor release until it is lowered.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23267
      impact: >-
        A cluster still on 1.76 whose user-authn ModuleConfig sets idTokenTTL to 6h or more updates to
        this release without Deckhouse crash-looping, and stays on it until idTokenTTL is lowered below
        6h. A cluster already crash-looping on 1.77.0 or 1.77.1 does not recover by itself, since the
        release controller runs in the pod that is down; set failurePolicy Ignore on the module-configs.deckhouse-webhook.deckhouse.io
        webhook of the deckhouse-webhook ValidatingWebhookConfiguration, lower idTokenTTL below 6h, and
        restart the deckhouse pod.
    - summary: Fixed CVEs in the module images.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23373
user-authz:
  fixes:
    - summary: Fixed CVEs in the `permission-browser-apiserver` image.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23324
