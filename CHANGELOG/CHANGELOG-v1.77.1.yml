user-authn:
  features:
    - summary: >-
        Grant kubeadm:cluster-admins group granular full access to module CRDs via dedicated ClusterRole
        d8:user-authn:admin-kubeconfig.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19420
    - summary: >-
        Brute-force protection for Dex — per-IP rate limit on password endpoints and account lockout for
        LDAP/Crowd connectors.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19542
    - summary: >-
        Add Custom complexity level to password policy with per-rule overrides (minLength, specialCharacters,
        numbers, capitalized, repeatedChars).
      pull_request: https://github.com/deckhouse/deckhouse/pull/20149
    - summary: UserOperation supports permanent user locks via spec.lock.permanent.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20281
    - summary: >-
        UserOperation audit logs record the initiator admin's email from the deckhouse.io/initiator annotation,
        along with the operation type and the target user.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20281
    - summary: >-
        Add DexProviderCheck resource for on-demand connectivity and credential diagnostics of Dex authentication
        providers.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20319
  fixes:
    - summary: Reject mutually exclusive LDAP TLS settings in DexProvider; alert on legacy objects.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19844
      impact: >-
        spec.ldap.insecureNoSSL combined with startTLS, insecureSkipVerify, or a non-empty rootCAData
        is now rejected by the CRD. Pre-existing DexProvider objects with such combinations keep working
        but trigger

        D8DexProviderLDAPTLSConflict until updated. Audit with: kubectl get dexproviders.deckhouse.io
        -o yaml | yq '.items[] | select(.spec.type=="LDAP") | {name: .metadata.name, ldap: .spec.ldap
        | pick(["insecureNoSSL","startTLS","insecureSkipVerify","rootCAData"])}'
    - summary: Improve basic-auth-proxy request handling, cache implementation, and shutdown behavior.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20076
    - summary: >-
        Fix CVE-2026-29181 in user-authn/dex and fix CVE-2026-39883 in user-authz/permission-browser-apiserver
      pull_request: https://github.com/deckhouse/deckhouse/pull/20100
    - summary: Fix user-api self-service password reset in closed-loop clusters and restrict it to local
        Dex users.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20371
    - summary: >-
        UserOperation no longer keeps the bcrypt password hash in spec.resetPassword.newPasswordHash after
        the operation completes.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20281
    - summary: add forgotten field
      pull_request: https://github.com/deckhouse/deckhouse/pull/20864
    - summary: >-
        Reconcile Dex Password objects directly in the hook so new local users can log in immediately
        and are not forced to rotate their password on first login.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20847
    - summary: Remove redundant bootstrapped check from enabled script.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21048
    - summary: Remove critical flag from user-authn module.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21183
    - summary: >-
        Fixed DexAuthenticator pod creation under ResourceQuota by setting init container CPU/memory limits
        to the sum of main container limits.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21313
    - summary: Gateway API certificate manifest is updated to support any cluster issuer.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21407
user-authz:
  features:
    - summary: >-
        Grant kubeadm:cluster-admins group granular full access to module CRDs via dedicated ClusterRole
        d8:user-authz:admin-kubeconfig.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19420
    - summary: Alert and DKP 1.78 release requirement for custom roles of the legacy experimental RBACv2
        scheme.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21381
      impact: >-
        If the cluster has custom roles of the legacy experimental RBACv2 scheme (`custom:*` names with
        the

        `rbac.deckhouse.io/kind: manage` or `use` labels or aggregation selectors), the

        `D8UserAuthzLegacyRBACv2CustomRoleFound` alert fires. Such roles will stop aggregating permissions

        in DKP 1.78 (the aggregation label scheme changes and custom roles get no compatibility aliases),

        and the upgrade to DKP 1.78 will be blocked until they are migrated to the new `d8:custom:*` scheme.

        See the user-authz module FAQ, section "How do I migrate custom roles to the new scheme in DKP
        1.78?".
  fixes:
    - summary: Extend cluster-admin clusterrole  with kubelet-api-admin rights.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19878
    - summary: >-
        AuthorizationRule grants are now reflected in the accessiblenamespaces response from permission-browser-apiserver.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19992
    - summary: Delete orphaned automated use RoleBindings when a namespace drops out of a manage binding.
      pull_request: https://github.com/deckhouse/deckhouse/pull/20478
    - summary: >-
        user-authz-webhook now uses the node-local kube-apiserver endpoint for its discovery cache and
        liveness check, instead of resolving the "kubernetes.default" DNS name.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21066
      impact: >-
        Previously, a transient cluster DNS failure could cause the user-authz-webhook liveness probe
        to fail and restart the pod, which combined with the fail-closed authorization webhook (failurePolicy:
        Deny) could deny all API requests, including cluster-admins, until DNS recovered.
    - summary: Honor CAR-independent RBAC in webhook and permission-browser
      pull_request: https://github.com/deckhouse/deckhouse/pull/21243
      impact: >-
        With enableMultiTenancy, effective access is now the union of CAR (within its limitNamespaces/namespaceSelector),
        AuthorizationRules, and plain RoleBindings/ClusterRoleBindings. Previously the webhook denied
        requests outside the CAR scope even when RBAC explicitly granted them: such existing bindings
        for subjects with a CAR silently become effective after the upgrade — review them. The CAR access
        level still does not apply outside its namespace limits. AccessibleNamespaces reflects the same
        union.
