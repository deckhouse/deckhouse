local-path-provisioner:
  fixes:
    - summary: >-
        Add wildcard tolerations to the helper pod template so PVC provisioning works on tainted nodes
        after local-path-provisioner v0.0.32+.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19447
    - summary: >-
        Grant the default kubeadm `kubernetes-admin` user (`kubeadm:cluster-admins` group) and the user-authz
        `User` / `ClusterEditor` access levels permissions on `LocalPathProvisioner` and the module's
        `ModuleConfig` so that `kubectl create -f` on a `LocalPathProvisioner` no longer fails with "Forbidden".
      pull_request: https://github.com/deckhouse/deckhouse/pull/20245
    - summary: >-
        Backport HelperPod template validation to `local-path-provisioner` v0.0.34 to fix CVE-2026-44543
        (HelperPod Template Injection, GHSA-7fxv-8wr2-mfc4, CVSS 8.7 High).
      pull_request: https://github.com/deckhouse/deckhouse/pull/20237
      impact: >-
        The `local-path-provisioner` Pod is restarted during the update. PV provisioning/teardown briefly
        pauses while the new Pod becomes Ready; existing volumes are not affected. After the update the
        provisioner refuses to create a HelperPod whose template (loaded from the `local-path-config`
        ConfigMap) declares privileged containers, hostPath/custom volumes, host namespaces, added Linux
        capabilities or other security-sensitive fields, so any pre-existing manual override of `helperPod.yaml`
        that uses one of these fields must be removed before the upgrade.
    - summary: >-
        Update local-path-provisioner to v0.0.36 to pick up the upstream fix for CVE-2026-44543 (HelperPod
        template injection, CVSS 8.7).
      pull_request: https://github.com/deckhouse/deckhouse/pull/20449
      impact: >-
        Custom edits to the local-path-config ConfigMap that set unsafe HelperPod fields (privileged,
        capabilities, host namespaces, initContainers, custom volumes/volumeMounts, container probes/lifecycle,
        sysctls, etc.) will be rejected by the provisioner at startup. Default Deckhouse installations
        are unaffected.
metallb:
  features:
    - summary: Added RBACv1 roles (User and ClusterAdmin) for MetalLoadBalancerClass resource.
      pull_request: https://github.com/deckhouse/deckhouse/pull/19627
    - summary: >-
        Refactored BGP configuration to use dedicated CRDs (`MetalLoadBalancerPool`, `MetalLoadBalancerBGPPeer`,
        `MetalLoadBalancerConfiguration`) instead of ModuleConfig.
      pull_request: https://github.com/deckhouse/deckhouse/pull/18660
      impact: >-
        BGP configurations are no longer configured via the module's `ModuleConfig`. The old BGP configurations
        will be automatically migrated to the new Custom Resources upon platform update.

        **Important:** Because the migration hook auto-generates the new resources from your existing
        legacy `ModuleConfig`, after the platform update you must switch the `version` field in the `metallb`
        `ModuleConfig` (to disable migrations) *before* manually editing the newly generated BGP CRDs.
        If you fail to do so, the migration hook will keep overwriting your manual edits.

        After a successful update, you must also manually delete the obsolete BGP settings (`bgpPeers`,
        `addressPools`, `bgpCommunities`) from the `metallb` `ModuleConfig`. Please refer to the module's
        documentation for detailed instructions.
  fixes:
    - summary: Bump Go dependencies in the metallb and l2lb images to fix known CVEs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21391
      impact: The metallb components (controller, speaker, l2lb) will restart after the update.
