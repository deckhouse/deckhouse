      pull_request: https://github.com/deckhouse/deckhouse/pull/22807
service-with-healthchecks:
  fixes:
    - summary: Annotations and labels of a ServiceWithHealthchecks are now copied to the Service created
        for it.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22835
      impact: >-
        After the update, the controller adds the annotations and labels of every ServiceWithHealthchecks
        to the Service created for it.

        If a ServiceWithHealthchecks of the `LoadBalancer` type carries annotations that configure the
        load balancer

        (`network.deckhouse.io/load-balancer-ips`, `network.deckhouse.io/load-balancer-shared-ip-key`
        and similar),

        the load balancer controller applies them and may assign a different address to the service, which
        causes a short interruption of the connections.
    - summary: >-
        Stopped publishing terminated pods in EndpointSlices and started publishing pods being deleted
        as terminating endpoints.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22836
      impact: >-
        Endpoints for pods in a terminal phase (Failed/Succeeded) are no longer published. In DVP clusters
        this prevents traffic from being routed to a VirtualMachine IP that has been reused by another
        pod. Pods being deleted are now published with the serving and terminating conditions, which enables
        the graceful shutdown flow for consumers. Pod readiness is derived from the PodReady condition,
        and stale probe results are reset when a pod becomes not ready, is recreated, or changes its IP.
    - summary: Fixed a load balancer losing all its endpoints for good after a target pod was replaced.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22979
      impact: >-
        The `service-with-healthchecks` controller and agent are restarted.

        A `ServiceWithHealthchecks` that was left in `NotAllEndpointsAreReady` with no EndpointSlice

        recovers automatically once the updated agent starts, no manual action is needed.
user-authz:
  fixes:
    - summary: >-
        The identity collision check no longer applies to the platform's own identities, so a retried
        bootstrap creates the initial User again instead of timing out.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22871
      impact: >-
        The installer, the deckhouse ServiceAccount, holders of the cluster

        administrator kubeconfig and the kube-system / d8-system ServiceAccounts

        can create a User or a Group named by an existing authorization rule

        without the acknowledgement annotation. Every other requester is checked

        as before.
    - summary: >-
        Grant custom ClusterRoles (annotated with `user-authz.deckhouse.io/access-level`) through one
        aggregated ClusterRole per access level, so the number of bindings per ClusterAuthorizationRule/AuthorizationRule
        no longer depends on the number of such roles.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22967
      impact: >-
        During the first `user-authz` release after the update the per-role bindings are protected from
        the release engine, the aggregated ones are created, and the per-role bindings are deleted right
        after the release. Permissions granted through annotated ClusterRoles stay in place throughout.

        The `user-authz.deckhouse.io/access-level` label is now set automatically on annotated ClusterRoles.

        In audit logs, access granted through annotated ClusterRoles is attributed to `user-authz:<level>:custom`
        instead of the individual ClusterRole.
    - summary: >-
        Group the module alerts under a group named apart from the alerts themselves, so the incident
        shelf accepts them.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22994
    - summary: >-
        The D8UserAuthzRenderSlow and D8UserAuthzReleaseSlow alerts no longer fire on a single slow render
        or release, such as a cluster bootstrap under CPU pressure or the one-time migration pass.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23000
      impact: >-
        D8UserAuthzRenderSlow requires at least three renders averaging above 30 seconds over 30 minutes,

        D8UserAuthzReleaseSlow at least two releases averaging above 5 minutes over one hour, and both
        must

        hold for 15 minutes. Severities are one step lower (6 and 7). Their descriptions now point at
        CPU

        shortage on the node rather than at the number of ClusterAuthorizationRules, which does not affect

        render time.
