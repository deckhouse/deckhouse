node-manager:
  fixes:
    - summary: >-
        node-controller reads the CAPI instance-class checksum from a helm-rendered ConfigMap instead
        of a possibly stale MachineTemplate, so MachineDeployments follow InstanceClass changes and their
        bootstrap Secrets keep a valid token.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22909
      impact: >-
        CAPI NodeGroups whose MachineDeployment was stuck on an old MachineTemplate are rolled to the
        current InstanceClass after the update, within maxSurgePerZone/maxUnavailablePerZone. Groups already
        on the current template are not touched.
    - summary: >-
        node-controller no longer removes taints set by other components on the first reconcile of Static
        and CloudPermanent nodes.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22988
registry:
  fixes:
