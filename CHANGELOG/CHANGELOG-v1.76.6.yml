candi:
  fixes:
    - summary: Add exception for Oracle Linux UEK kernels for fix CVE-2025-37999 on bashible
      pull_request: https://github.com/deckhouse/deckhouse/pull/21599
cilium-hubble:
  fixes:
    - summary: >-
        Upgrade hubble-ui backend dependencies (cilium v1.17.16, Go 1.25.0) and switch build base image
        to fix known CVEs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21507
      impact: The cilium-hubble components (hubble-ui, hubble-relay) will restart after the update.
cloud-provider-dvp:
  fixes:
    - summary: Fix DVPInstanceClass access for users with user-authz ClusterAdmin role
      pull_request: https://github.com/deckhouse/deckhouse/pull/21483
      impact: >-
        Users with accessLevel ClusterAdmin in ClusterAuthorizationRule gain read and write access to
        DVPInstanceClass objects; previously all access was denied.
cloud-provider-dynamix:
  fixes:
    - summary: Fix DynamixInstanceClass access for users with user-authz ClusterAdmin role
      pull_request: https://github.com/deckhouse/deckhouse/pull/21483
      impact: >-
        Users with accessLevel ClusterAdmin in ClusterAuthorizationRule gain read and write access to
        DynamixInstanceClass objects; previously all access was denied.
cloud-provider-vsphere:
  fixes:
    - summary: >-
        fix missing default StorageClass annotation when a DatastoreCluster entry sorts before all Datastore
        entries
      pull_request: https://github.com/deckhouse/deckhouse/pull/21457
cni-cilium:
  fixes:
    - summary: Bump Go dependencies and backport upstream cilium security patches to fix known CVEs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21507
      impact: The cni-cilium components (cilium agent, operator) will restart after the update.
common:
  fixes:
    - summary: Fix curl in debug-container by shipping a static binary
      pull_request: https://github.com/deckhouse/deckhouse/pull/21523
    - summary: >-
        Bump Go dependencies in the cni-migration-controller and cni-migration-init-checker images to
        fix known CVEs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21575
deckhouse:
  fixes:
    - summary: atomically install modules and re-download incomplete versions
      pull_request: https://github.com/deckhouse/deckhouse/pull/21466
    - summary: Restore admin access to list moduleconfigs
      pull_request: https://github.com/deckhouse/deckhouse/pull/21531
    - summary: Fix hugo CVE.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21547
deckhouse-controller:
  fixes:
    - summary: >-
        Fix maintenance state tracking — module no longer gets stuck in Unmanaged after removing maintenance.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21428
    - summary: >-
        Force embedded modules back to the "Embedded" source on startup, healing a stale external source
        that previously stuck until the Module resource was deleted manually.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21473
docs:
  fixes:
    - summary: >-
        Added a note about the termination of support for Ubuntu 20.04 and replace the link to the Docker
        container registry.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21472
    - summary: Added a note about changing the name of the Docker container registry.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21591
documentation:
  fixes:
    - summary: Bump Hugo version to 0.163.3
      pull_request: https://github.com/deckhouse/deckhouse/pull/21540
ingress-nginx:
  fixes:
    - summary: Controller 1.10 image uid and gid are set to deckhouse.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21576
      impact: All ingress-nginx controller pods of v1.10 will be restarted.
metallb:
  fixes:
    - summary: Bump Go dependencies in the metallb and l2lb images to fix known CVEs.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21549
      impact: The metallb components (controller, speaker, l2lb) will restart after the update.
node-manager:
  fixes:
    - summary: Fix create_rbac_and_certificate_for_kubernetes_api_proxy hook behavior.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21631
user-authn:
  fixes:
    - summary: User-authn httproutes are refactored.
      pull_request: https://github.com/deckhouse/deckhouse/pull/21505
