deckhouse:
  fixes:
    - summary: >-
        Stop reserving platform public hostnames at admission; keep the ModuleConfig field so existing
        settings still validate.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22533
      impact: >-
        ValidatingAdmissionPolicy reserved-public-hosts-* is removed. Ingresses that were denied because
        they matched publicDomainTemplate are allowed again. settings.reservedPublicHosts in ModuleConfig
        deckhouse remains accepted and is ignored. Enforcement returns in a later release.
    - summary: >-
        Fixed goroutine and memory leak in upmeter-agent caused by per-request HTTP clients leaving idle
        keep-alive connections to Prometheus open forever.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22480
deckhouse-controller:
  fixes:
    - summary: Fixed a bug when PackageRepository always used a HTTPS scheme.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22564
docs:
  fixes:
    - summary: Add InPlaceOrRecreate to VPA modes list and move Auto to a warning alert.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22517
local-path-provisioner:
  fixes:
    - summary: >-
        Add wildcard tolerations to the helper pod template so PVC provisioning works on tainted nodes
        after local-path-provisioner v0.0.32+.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22585
user-authn:
  fixes:
    - summary: Commander releases older than 1.18 can grant Kubernetes API access on DexClient again.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22523
vertical-pod-autoscaler:
  fixes:
    - summary: Reduce VPA memory recommendation rounding from 64Mi to 16Mi and round CPU recommendations
        up to 10m.
      pull_request: https://github.com/deckhouse/deckhouse/pull/22529
      impact: >-
        The `vpa-recommender` pod is restarted and recommendations are recalculated with the new granularity.

        Memory recommendations will generally become lower (less over-provisioning), CPU recommendations
        become

        multiples of 10m. VPA objects with `updateMode: Auto`/`Recreate` may evict and recreate pods to
        apply

        the updated requests.
