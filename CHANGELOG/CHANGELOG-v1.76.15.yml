      impact: log-shipper
node-manager:
  fixes:
    - summary: >-
        Stop caps-controller-manager from rewriting StaticInstance objects in a hot loop when a connectivity
        check fails, which caused a sustained load on etcd.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23106
      impact: >-
        A StaticInstance whose connectivity check fails now keeps its reservation for the whole bootstrap
        window instead of returning to the pool on every failed attempt, and the bootstrap (20 min) and
        cleanup (10 min) timeouts, which previously never fired, are now reachable.

        If nothing ever ran on the host, the bootstrap timeout returns the instance to the pool after
        20 minutes as before.

        If the host was already bootstrapped in part, the instance returns only through MachineHealthCheck
        remediation (nodeStartupTimeoutSeconds: 1200) plus the cleanup timeout, so it becomes available
        again roughly 20 + 10 minutes after the failure, and remediation reboots the host as part of the
        cleanup.
tools:
  fixes:
    - summary: >-
        Bump d8-cli to v0.32.6 - `d8 mirror push` restores the release channel tags of the installer image,
        so `docker run <repo>/install:<channel>` works against a mirrored registry
      pull_request: https://github.com/deckhouse/deckhouse/pull/23033
    - summary: >-
        Bump d8-cli to v0.32.7 - closes the CVE findings in the bundled d8 binary (grpc 1.83.2, x/image
        0.45.0, x/crypto 0.55.0 and x/mod 0.40.0)
      pull_request: https://github.com/deckhouse/deckhouse/pull/23085
upmeter:
  fixes:
    - summary: Fixed ListenerSet upmeter namespace.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23217
user-authn:
  fixes:
    - summary: >-
        Render a valid Deployment for a DexAuthenticator whose `resources` limits are fractional or below
        the init container requests.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23181
      impact: >-
        The `self-signed-generator` init container now carries the fixed `10m` / `25Mi` it was always

        meant to have, the same as the identical init container of `user-api`, instead of the sum of the

        main container limits. A DexAuthenticator that set large limits no longer gets that sum as burst:

        generating the self-signed certificate then takes 3 to 4 seconds instead of under a second. It

        happens once per pod start and needs no action.
