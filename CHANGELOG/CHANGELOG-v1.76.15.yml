cert-manager:
  fixes:
    - summary: >-
        Restore the `cert-manager` and `cainjector` permissions that were lost against the upstream chart,
        including access to `ListenerSet` resources.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23077
chrony:
  fixes:
    - summary: Fixed the unit-detection condition in the `disable-ntp-on-node.sh` node step.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23035
cloud-provider-azure:
  fixes:
    - summary: >-
        Fix multimaster bootstrap by falling back to the `d8-masters-kubernetes-data-device-path` Secret
        when the master data device LUN is not provided via cloud-init.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23098
deckhouse:
  fixes:
    - summary: >-
        In upmeter, the `monitoring-and-autoscaling/alertmanager` probe is disabled by default and is
        turned on with the new `alertmanagerProbe.enabled` setting.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23123
deckhouse-controller:
  fixes:
    - summary: >-
        Stop the module source registry fan-out from replaying and flooding the main queue with duplicate
        moduleRun tasks.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23114
    - summary: >-
        Do not commit the package repository registry checksum when no application could be annotated,
        which left them all on stale registry settings.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23114
descheduler:
  fixes:
    - summary: Fix duplicate enabled key in doc-ru-deschedulers.yaml
      pull_request: https://github.com/deckhouse/deckhouse/pull/23147
docs:
  features:
    - summary: Add istio module architecture section.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23144
istio:
  fixes:
    - summary: Fix istiod RBAC rules that drifted away from upstream.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23103
log-shipper:
  fixes:
    - summary: Fixed an invalid VRL script generated by the `replaceValue` transformation.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23051
      impact: log-shipper
tools:
  fixes:
    - summary: >-
        Bump d8-cli to v0.32.6 - `d8 mirror push` restores the release channel tags of the installer image,
        so `docker run <repo>/install:<channel>` works against a mirrored registry
      pull_request: https://github.com/deckhouse/deckhouse/pull/23033
    - summary: >-
        Bump d8-cli to v0.32.7 - closes the CVE findings in the bundled d8 binary (grpc 1.83.2, x/image
        0.45.0, x/crypto 0.55.0 and x/mod 0.40.0)
      pull_request: https://github.com/deckhouse/deckhouse/pull/23085
