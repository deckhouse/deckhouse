deckhouse:
  fixes:
    - summary: >-
        In upmeter, the `monitoring-and-autoscaling/alertmanager` probe is disabled by default and is
        turned on with the new `alertmanagerProbe.enabled` setting.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23123
    - summary: >-
        Fixed the CVEs reported for the v1.76.14 scan slice across all Observability team module images
        by bumping grpc to v1.83.2, the OpenTelemetry family to v1.45.0, kin-openapi to v0.149.0, cel-go
        to v0.29.0, golang.org/x/crypto to v0.55.0 and the rest of the golang.org/x/* set, by moving pushgateway
        to 1.11.3 and image-availability-exporter to 0.16.0, and by building the log-shipper reloader
        with Go 1.25.13; advisories without a reachable fix are mitigated via VEX.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23169
deckhouse-controller:
  fixes:
    - summary: >-
        Stop the module source registry fan-out from replaying and flooding the main queue with duplicate
        moduleRun tasks.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23114
    - summary: >-
        Do not commit the package repository registry checksum when no application could be annotated,
        which left them all on stale registry settings.
      pull_request: https://github.com/deckhouse/deckhouse/pull/23114
