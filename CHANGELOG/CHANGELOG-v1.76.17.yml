candi:
  fixes:
    - summary: >-
        Restored the lost `kubelet-disable-k-panic-check` patch for k8s 1.35, so kubelet no longer enforces
        `kernel.panic=10` on this version.
ci:
  fixes:
    - summary: add skip docs validation label
    - summary: Delete tests registry images
cloud-provider-azure:
  fixes:
    - summary: use .normal.apiserverEndpoints in data device Secret fallback
cloud-provider-vsphere:
  fixes:
    - summary: Fixed master node creation when the datastore is set as a path with parent folders.
cloud-provider-yandex:
  features:
    - summary: Add support for the `ru-central1-e` zone in Yandex Cloud.
      impact: >-
        A diff will appear in the Terraform state for the base infrastructure: the E zone will be added.
        Because of this, the Terraform check will fail on the first master node. Run `dhctl converge`
        for the base infrastructure, and everything should get back to normal.
deckhouse:
  fixes:
    - summary: Restore kubectl plugin lookup in d8 k and d8 kubectl
dhctl:
  fixes:
    - summary: Prevent dhctl converge from panicking when kubeconfig is used without an SSH host.
docs:
  fixes:
    - summary: Removed mentions of Cilium from the inter-cluster cooperation documentation page.
    - summary: Added experimental module enable note to the lifecycle badge.
    - summary: Rendered all versions from oss.yaml versions array.
documentation:
  features:
    - summary: The in-cluster documentation now includes the guides.
istio:
  fixes:
    - summary: The Istio operator now recovers Helm releases stuck in the `pending-*` or `uninstalling`
        state.
