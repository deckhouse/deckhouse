type: object
properties:
  storageClass:
    description: |
      > **Устарел**. Используйте параметр [settings.modules.storageClass](#parameters-modules-storageclass).

      Имя StorageClass, который будет использоваться для всех компонентов Deckhouse Platform (Prometheus, Grafana, OpenVPN и т. д.).

        * Если значение не указано, то используется [StorageClass по умолчанию](https://kubernetes.io/docs/concepts/storage/storage-classes/#default-storageclass), установленный в кластере.
        * Этот параметр имеет смысл использовать только в исключительных ситуациях.
        * Этот параметр применяется в процессе включения модуля.
  defaultClusterStorageClass:
    type: string
    default: null
    description: |-
      Имя StorageClass, который DP определит как StorageClass используемый в кластере по умолчанию.

      DP запрещает вручную добавлять или изменять default-аннотацию (`storageclass.kubernetes.io/is-default-class='true'`) у StorageClass. Используйте параметр, чтобы определять или изменять StorageClass используемый в кластере по умолчанию.

      Если значение не указано, фактический StorageClass используемый в кластере по умолчанию будет определяться в следующем порядке:

       * StorageClass в кластере, имеющий default-аннотацию (`storageclass.kubernetes.io/is-default-class='true'`);
       * Первый (по алфавиту) StorageClass из создаваемых модулем облачного провайдера (если какой-либо модуль облачного провайдера используется).
  prefix:
    description: |
      Префикс объектов, создаваемых в облаке.

      Используется, например, для отличия объектов, создаваемых для разных кластеров, для настройки маршрутизации и т. д.

      Это новое расположение префикса, который ранее задавался в `ClusterConfiguration.cloud.prefix`. Если параметр не задан, используется значение из `ClusterConfiguration.cloud.prefix`.

      Префикс используется для именования облачных объектов, например дисков (вида `<prefix>-kubernetes-data-0`). Имена облачных объектов ограничены 63 символами, поэтому длина префикса ограничена 45 символами. В зависимости от провайдера и количества master-узлов фактический предел может быть меньше; это дополнительно проверяется preflight-проверкой при развёртывании.

      > **Внимание.** Это значение именует уже существующую облачную инфраструктуру (security-группы, таблицы маршрутизации, resource-группы, инстансы и т. д.). Оно должно совпадать с префиксом, с которым был развёрнут кластер, — установка другого значения нарушит работу интеграции с облаком. Не предназначено для изменения в работающем кластере.
  highAvailability:
    description: |
      Параметр глобального включения *режима отказоустойчивости* для модулей, которые его поддерживают.

      Если значение не указано, оно определяется автоматически как `true` для кластеров с более чем одним master-узлом. В остальных случаях значение определяется как `false`.
  prefix:
    description: |
      Префикс объектов, создаваемых в облаке.

      Используется, например, для отличия объектов, создаваемых для разных кластеров, для настройки маршрутизации и т. д.

      Это новое расположение префикса, который ранее задавался в `ClusterConfiguration.cloud.prefix`. Если параметр не задан, используется значение из `ClusterConfiguration.cloud.prefix`.

      Префикс используется для именования облачных объектов, например дисков (вида `<prefix>-kubernetes-data-0`). Имена облачных объектов ограничены 63 символами, поэтому длина префикса ограничена 45 символами. В зависимости от провайдера и количества master-узлов фактический предел может быть меньше; это дополнительно проверяется preflight-проверкой при развёртывании.

      > **Внимание.** Это значение именует уже существующую облачную инфраструктуру (security-группы, таблицы маршрутизации, resource-группы, инстансы и т. д.). Оно должно совпадать с префиксом, с которым был развёрнут кластер, — установка другого значения нарушит работу интеграции с облаком. Не предназначено для изменения в работающем кластере.
  modules:
    description: |
      Общие параметры модулей Deckhouse.
    properties:
      gatewayAPI:
        description: |
          Общие параметры использования Gateway API модулями DP.
        properties:
          enabled:
            description: |
              Включает использование ресурсов Gateway API (Gateway, HTTPRoute и т. д.) модулями DP, которые его поддерживают.

              В отличие от [ingressClass](#parameters-modules-ingress-ingressclass), встроенного Gateway по умолчанию не существует, поэтому Gateway API фактически используется модулем только если этот флаг включён **и** для него удалось определить Gateway — либо из параметра [gateway](#parameters-modules-gatewayAPI-gateway), либо из переопределения на уровне модуля, либо из Gateway, автоматически обнаруженного в кластере.

              Модули, поддерживающие Gateway API, могут переопределить этот параметр собственным параметром `gatewayAPI.enabled`.
          gateway:
            description: |
              Ссылка на объект Gateway (из Gateway API), используемый модулями DP при создании ресурсов Gateway API.

              Если параметр не указан, модули используют Gateway, автоматически обнаруженный в кластере (если он есть).
            properties:
              name:
                description: |
                  Имя объекта Gateway.
              namespace:
                description: |
                  Неймспейс объекта Gateway.
      gatewayAPIGateway:
        description: |
          > **Устарел**. Используйте параметр [settings.modules.gatewayAPI.gateway](#parameters-modules-gatewayAPI-gateway).
          
          Ссылка на объект Gateway (из Gateway API), используемый модулями DP при создании ресурсов Gateway API.

          Если параметр не указан, модули используют Gateway, автоматически обнаруженный в кластере (если он есть).
        properties:
          name:
            description: |
              Имя объекта Gateway.
          namespace:
            description: |
              Неймспейс объекта Gateway.
      ingress:
        description: |
          Общие параметры использования Ingress модулями DP.
        properties:
          ingressClass:
            description: |
              Имя класса Ingress-контроллера ([IngressClass](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class)), используемого модулями DP по умолчанию при создании Ingress-ресурсов.

              Некоторые модули поддерживают собственный параметр `ingressClass`, позволяющий использовать другой класс Ingress-контроллера вместо используемого по умолчанию.
          enabled:
            description: |
              Включает создание Ingress-ресурсов модулями DP, которые это поддерживают.

              Модули, поддерживающие Ingress, могут переопределить этот параметр собственным параметром `ingress.enabled`.
      ingressClass:
        description: |
          > **Устарел**. Используйте параметр [settings.modules.ingress.ingressClass](#parameters-modules-ingress-ingressClass).
          
          Имя класса Ingress-контроллера ([IngressClass](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class)), используемого модулями DP по умолчанию при создании Ingress-ресурсов.

          Некоторые модули поддерживают собственный параметр `ingressClass`, позволяющий использовать другой класс Ingress-контроллера вместо используемого по умолчанию.
      publicDomainTemplate:
        description: |
          Шаблон DNS-имен c ключом `%s` в качестве динамической части строки.

          Модули Deckhouse используют этот шаблон при создании Ingress-ресурсов.

          Например, для шаблона `%s.kube.company.my` модуль prometheus создаст Ingress-ресурс на адрес `grafana.kube.company.my` для доступа к Grafana.

          **Обратите внимание:**
          - Если параметр не указан, Ingress-ресурсы создаваться не будут.
          - Домен, указанный в шаблоне, не может совпадать или быть поддоменом домена, заданного в параметре [`clusterDomain`](/products/kubernetes-platform/documentation/v1/reference/api/cr.html#clusterconfiguration-clusterdomain). Мы не рекомендуем менять значение `clusterDomain` без особой необходимости.
          - Для корректной работы шаблона необходимо предварительно настроить службы DNS как в сетях, где будут располагаться узлы кластера, так и в сетях, из которых к служебным веб-интерфейсам платформы будут обращаться клиенты.
          - В случае, если шаблон совпадает с доменом сети узлов, используйте только А записи для назначения служебным веб-интерфейсам платформы адресов Frontend узлов. Например, для узлов заведена зона `company.my`, а шаблон имеет вид `%s.company.my`.
      placement:
        description: |
          Настройки, определяющие расположение компонентов модулей Deckhouse по умолчанию.
        properties:
          customTolerationKeys:
            description: |
              Список ключей пользовательских toleration.

              Необходимо указывать, чтобы позволить планировщику размещать критически важные компоненты Deckhouse, такие как cni и csi, на выделенных узлах.
      https:
        description: |
          Способ организации доступа по протоколу HTTPS для модулей экосистемы Deckhouse.
        properties:
          mode:
            description: |
              Режим работы HTTPS:

              * `CertManager` — модули работают по HTTPS и самостоятельно заказывают сертификаты с помощью ClusterIssuer, указанного [в параметре `certManager.clusterIssuerName`](#parameters-modules-https-certmanager-clusterissuername);
              * `CustomCertificate` — модули работают по HTTPS, используя сертификат из неймспейса `d8-system`;
              * `Disabled` — модули работают только по HTTP (при этом некоторые модули могут не работать — например, [`user-authn`](/modules/user-authn/));
              * `OnlyInURI` — модули работают по HTTP, подразумевая, что перед ними стоит внешний HTTPS-балансировщик, который терминирует HTTPS. Такой балансировщик должен обеспечивать перенаправление запросов с HTTP на HTTPS.
          certManager:
            properties:
              clusterIssuerName:
                description: |
                  Имя ClusterIssuer, используемого модулями для получения TLS-сертификатов.

                  Модуль [`cert-manager`](/modules/cert-manager/) предоставляет следующие ClusterIssuer:

                  - `letsencrypt`;
                  - `letsencrypt-staging`;
                  - `selfsigned`;
                  - `clouddns`;
                  - `cloudflare`;
                  - `digitalocean`;
                  - `route53`.

                  При необходимости вы можете использовать собственный `ClusterIssuer`.
          customCertificate:
            properties:
              secretName:
                description: |
                  Имя Secret в неймспейсе `d8-system`, содержащего TLS-сертификат, который будет использоваться модулями.

                  Указанный Secret должен быть в формате [`kubernetes.io/tls`](https://kubernetes.github.io/ingress-nginx/user-guide/tls/#tls-secrets).
      resourcesRequests:
        description: |
          Количество ресурсов (CPU и памяти), выделяемых для работы некоторых компонентов.

          [Подробнее](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#resource-units-in-kubernetes) про единицы измерения ресурсов.
        properties:
          controlPlane:
            description: |
              > **Устарело**. Вместо этого используйте параметр `.spec.settings.resourcesRequests` в конфигурации модуля `control-plane-manager`.

              Объём ресурсов (CPU и памяти), выделяемых для компонентов control plane на каждом master-узле кластера.

              Настройки не применяются, если control plane кластера управляется облачным провайдером (например, Google Kubernetes Engine или Azure Kubernetes Service).
            properties:
              cpu:
                description: |
                  > **Устарело**. Вместо этого используйте параметр `controlPlaneManager.spec.settings.resourcesRequests.cpu`.

                  Количество CPU, выделяемых для компонентов control plane, работающих на каждом master-узле кластера.
              memory:
                description: |
                  > **Устарело**. Вместо этого используйте параметр `controlPlaneManager.spec.settings.resourcesRequests.memory`.

                  Объем памяти, выделяемой для компонентов control plane, работающих на каждом master-узле кластера.
      storageClass:
        description: |
          Имя StorageClass, который будет использоваться для всех компонентов Deckhouse Platform (Prometheus, Grafana, OpenVPN и т. д.), если он не переопределен в конфигурации модуля.

          Если значение не указано, то используется [StorageClass по умолчанию](https://kubernetes.io/docs/concepts/storage/storage-classes/#default-storageclass), установленный в кластере.

          **Важные замечания:**

            * Этот параметр применяется только при включения модуля, при создании новых PVC.
            * Если для модуля уже существует PersistentVolumeClaim (PVC), то изменение этого параметра не влияет на существующий PVC и не приводит к пересозданию дисков. Модуль использует существующий PVC и его StorageClass.
            * Если в конфигурации модуля определен свой собственный параметр `storageClass`, то используется значение из конфигурации модуля, а этот параметр не применяется.
            * Этот параметр имеет смысл использовать только в исключительных ситуациях.
  applications:
    description: |
      Общие параметры приложений экосистемы Deckhouse.
    properties:
      ingressClass:
        description: |
          Имя класса Ingress-контроллера ([IngressClass](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class)), используемого приложениями экосистемы Deckhouse по умолчанию при создании Ingress-ресурсов.

          Некоторые приложения поддерживают собственный параметр `ingressClass`, позволяющий использовать другой класс Ingress-контроллера вместо используемого по умолчанию.
      publicDomainTemplate:
        description: |
          Шаблон DNS-имён с двумя ключами `%s` в качестве динамических частей строки.

          При формировании DNS-имени:

          - первый ключ заменяется на имя экземпляра приложения;
          - второй — на имя неймспейса;

          Приложения экосистемы Deckhouse используют этот шаблон при создании Ingress-ресурсов.

          Например, для шаблона `%s.%s.kube.company.my` экземпляр приложения `grafana`, работающий в неймспейсе `monitoring`, получит Ingress-ресурс на адрес `grafana.monitoring.kube.company.my`.

          **Особенности использования:**

          - Если параметр не указан, Ingress-ресурсы создаваться не будут.
          - Домен, указанный в шаблоне, не может совпадать или быть поддоменом домена, заданного в параметре [`clusterDomain`](cr.html#clusterconfiguration-clusterdomain). Не рекомендуется изменять значение `clusterDomain` без необходимости.
          - Перед использованием шаблона настройте службы DNS как в сетях, где будут располагаться узлы кластера, так и в сетях, из которых клиенты будут обращаться к служебным веб-интерфейсам.
          - Если домен шаблона совпадает с доменом сети узлов, используйте только А-записи для назначения служебным веб-интерфейсам платформы адресов frontend-узлов. Например, если для узлов заведена зона `company.my`, шаблон должен иметь вид `%s.%s.company.my`.
      https:
        description: |
          Способ организации доступа по протоколу HTTPS для приложений экосистемы Deckhouse.
        properties:
          mode:
            description: |
              Режим работы HTTPS:

              * `CertManager` — приложения работают по HTTPS и самостоятельно заказывают сертификаты с помощью ClusterIssuer, указанного [в параметре `certManager.clusterIssuerName`](#parameters-applications-https-certmanager-clusterissuername);
              * `CustomCertificate` — приложения работают по HTTPS, используя сертификат из неймспейса `d8-system`;
              * `Disabled` — приложения работают только по HTTP;
              * `OnlyInURI` — приложения работают по HTTP, подразумевая, что перед ними стоит внешний HTTPS-балансировщик, который терминирует HTTPS. Балансировщик должен обеспечивать перенаправление запросов с HTTP на HTTPS.
          certManager:
            properties:
              clusterIssuerName:
                description: |
                  Имя ClusterIssuer, используемого приложениями для получения TLS-сертификатов.

                  Модуль [`cert-manager`](/modules/cert-manager/) предоставляет следующие ClusterIssuer:

                  - `letsencrypt`;
                  - `letsencrypt-staging`;
                  - `selfsigned`;
                  - `clouddns`;
                  - `cloudflare`;
                  - `digitalocean`;
                  - `route53`.

                  При необходимости вы можете использовать собственный ClusterIssuer.
          customCertificate:
            properties:
              secretName:
                description: |
                  Имя Secret в неймспейсе `d8-system`, содержащего TLS-сертификат, который будет использоваться приложениями.

                  Указанный Secret должен быть в формате [`kubernetes.io/tls`](https://kubernetes.github.io/ingress-nginx/user-guide/tls/#tls-secrets).
      update:
        description: |
          Настройки обновления приложений экосистемы Deckhouse: режим обновления, окна обновлений, оповещения об обновлении и блокировка обновления при наличии алертов.

          Настройки используются приложениями, у которых не заданы собственные настройки [`spec.update`](cr.html#application-v1alpha1-spec-update). Настройки [оповещений](#parameters-applications-update-notification) используются и приложениями с собственными настройками обновления, так как для отдельного приложения оповещения не настраиваются.

          Если параметр не указан, приложения используют настройки обновления Deckhouse — параметр [`update`](/modules/deckhouse/configuration.html#parameters-update) модуля `deckhouse`.
        properties:
          mode:
            description: |
              Режим обновления приложений на выбранном для них [канале обновлений](cr.html#application-v1alpha1-spec-releasechannel).

              - `AutoPatch` — автоматический режим обновления для патч-версий.

                Для обновления минорной версии (например, с `v1.2.*` на `v1.3.*`) необходимо подтверждение.

                Обновление патч-версии (например, с `v1.3.1` на `v1.3.2`) применяется с учетом [окон обновлений](#parameters-applications-update-windows), если они заданы.
              - `Auto` — автоматический режим обновления для всех версий.

                Обновления минорной версии (например, с `v1.2.*` на `v1.3.*`) и патч-версии (например, с `v1.3.1` на `v1.3.2`) применяются с учетом [окон обновлений](#parameters-applications-update-windows), если они заданы.
              - `Manual` — ручной режим обновления для всех версий.

                Для обновления и минорной, и патч-версии необходимо подтверждение.
          windows:
            description: |
              Список окон обновлений в течение суток.
            items:
              properties:
                from:
                  description: |
                    Время начала окна обновления (в часовом поясе UTC).

                    Должно быть меньше времени окончания окна обновления.
                to:
                  description: |
                    Время окончания окна обновления (в часовом поясе UTC).

                    Должно быть больше времени начала окна обновления.
                days:
                  description: Дни недели, в которые применяется окно обновлений.
                  items:
                    description: День недели.
          notification:
            description: |
              Настройки оповещений о запланированном обновлении приложений.

              Имеет эффект **только** при установленном автоматическом [режиме обновления](#parameters-applications-update-mode).
            properties:
              webhook:
                description: |
                  URL-адрес вебхука.

                  Вызов вебхука произойдет после появления новой минорной версии приложения на его канале обновлений, но до момента ее применения в кластере.

                  > **Внимание.** При указании неверного адреса вебхука обновление приложений будет заблокировано.

                  Используйте параметр [`minimalNotificationTime`](#parameters-applications-update-notification-minimalnotificationtime) при необходимости установить минимальное время, которое должно пройти перед обновлением с момента появления новой минорной версии на канале обновлений.
              tlsSkipVerify:
                description: Пропустить валидацию TLS-сертификата при запросе вебхука.
              minimalNotificationTime:
                description: |
                  Минимальное время, которое должно пройти перед обновлением с момента появления новой минорной версии приложения на его канале обновлений.

                  Задается в виде строки с указанием часов и минут: 30m, 1h, 2h30m, 24h.

                  Механизм обновления гарантирует, что приложение не обновится, пока не пройдет указанный период времени.

                  При использовании окон обновлений обновление приложения произойдет в ближайшее возможное окно обновлений, но не ранее чем истечет указанное в `minimalNotificationTime` время.
              retryMinTime:
                description: |
                  Минимальный интервал между повторными попытками вызова вебхука при неуспешном запросе.

                  Задается в виде строки с указанием часов, минут или секунд: 30s, 1m, 1h, 2h30m.

                  Повторные попытки выполняются с экспоненциальной задержкой: каждый следующий интервал в два раза больше предыдущего. Например, при `retryMinTime = 2s` задержки будут: 2s, 4s, 8s, 16s, 32s.

                  По умолчанию — 2 секунды (если не указано).
              auth:
                description: |
                  Настройки аутентификации на вебхуке.

                  Если параметр не указан, вебхук вызывается без аутентификации.
                properties:
                  basic:
                    description: |
                      Настройки Basic-аутентификации на вебхуке.
                    properties:
                      username:
                        description: |
                          Имя пользователя для аутентификации на вебхуке.

                          Имя и пароль пользователя будут в заголовке `Authorization` в формате `Basic <base64(username:password)>`.
                      password:
                        description: |
                          Пароль для аутентификации на вебхуке.

                          Имя и пароль пользователя будут в заголовке `Authorization` в формате `Basic <base64(username:password)>`.
                  bearerToken:
                    description: |
                      Токен для аутентификации на вебхуке.

                      Токен будет в заголовке `Authorization` в формате `Bearer <token>`.
              releaseType:
                description: |
                  Определяет тип версии, о которой будет отправлено оповещение:

                  - `Minor` — только для обновления минорной версии.
                  - `All` — для любых обновлений, включая обновление патч-версии.
          blockOnAlerts:
            description: |
              Настройки блокировки обновления приложений при наличии алертов в кластере.
            properties:
              enabled:
                description: |
                  Если включено, обновление приложений блокируется, пока в кластере есть алерты с уровнем серьезности, равным указанному в параметре [`severity`](#parameters-applications-update-blockonalerts-severity) или выше.
              severity:
                description: |
                  Уровень серьезности алертов, которые блокируют обновление.

                  Уровень серьезности — число от 0 до 9, где 0 — наибольшая серьезность, а 9 — наименьшая.
