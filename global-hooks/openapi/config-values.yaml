x-config-version: 3
type: object
default: {}
additionalProperties: false
properties:
  storageClass:
    type: string
    default: null
    deprecated: true
    x-doc-deprecated: true
    description: |
      > **Deprecated**. Use [settings.modules.storageClass](#parameters-modules-storageclass) instead.

      The StorageClass to use with all Deckhouse Platform components (Prometheus, Grafana, OpenVPN, etc.).

        * If the value is not specified, the [default StorageClass](https://kubernetes.io/docs/concepts/storage/storage-classes/#default-storageclass) set in the cluster is used.
        * Use this parameter only in exceptional circumstances.
        * This parameter is applied during module activation.
  defaultClusterStorageClass:
    type: string
    default: null
    description: |-
      The name of the StorageClass that DP will define as the default StorageClass used in the cluster.

      DP prohibits manually adding or modifying the default annotation (`storageclass.kubernetes.io/is-default-class='true'`) for StorageClass. Use the parameter to define or change the StorageClass that is used as the default in the cluster.

      If the parameter is omitted, the default StorageClass is either:

       * A StorageClass in the cluster that has the default annotation (`storageclass.kubernetes.io/is-default-class='true'`);
       * The first (alphabetically) StorageClass created by the cloud provider module (if any cloud provider module is used).

      Use this parameter to change the default StorageClass in the cluster, as manually adding the default annotation to a StorageClass is not allowed.
  highAvailability:
    type: boolean
    description: |
      A global switch to enable the *high availability* mode for modules that support it.

      If not defined, the value is determined automatically as `true` for clusters with more than one master node. Otherwise, it is determined as`false`.
    x-examples: [ true, false ]
  prefix:
    type: string
    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
    maxLength: 45
    description: |
      A prefix of the objects to be created in the cloud.

      Is used, for example, to distinguish objects created for different clusters, to configure routing, etc.

      This is the new home for the prefix that was previously set in `ClusterConfiguration.cloud.prefix`. If not set, the value from `ClusterConfiguration.cloud.prefix` is used.

      The prefix is used to name cloud objects such as disks (e.g. `<prefix>-kubernetes-data-0`). Cloud object names are limited to 63 characters, so the prefix is capped at 45 characters to leave room for the generated suffix. Depending on the provider and the number of master nodes, the effective limit may be lower; this is additionally enforced by a bootstrap preflight check.

      > **Warning.** This value names existing cloud infrastructure (security groups, route tables, resource groups, instances, etc.). It must match the prefix the cluster was bootstrapped with — setting a different value will break cloud integration. It is not intended to be changed in a running cluster.
    x-examples:
      - "kube"
  modules:
    description: |
      Common parameters of Deckhouse modules.
    additionalProperties: false
    default: {}
    type: object
    properties:
      gatewayAPI:
        description: |
          Common parameters for Gateway API usage by DP modules.
        type: object
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            description: |
              Enables the use of Gateway API resources (Gateway, HTTPRoute, etc.) by the DP modules that support it.

              Unlike [ingressClass](#parameters-modules-ingress-ingressclass), there is no built-in default Gateway, so Gateway API is only actually used by a module if this flag is enabled **and** a Gateway can be resolved for it — either from this parameter's [gateway](#parameters-modules-gatewayAPI-gateway) field, a module-specific override, or a Gateway automatically discovered in the cluster.

              Modules that support Gateway API can override this setting with their own `gatewayAPI.enabled` parameter.
          gateway:
            description: |
              Reference to the Gateway object (from the Gateway API) used by DP modules when creating Gateway API resources.

              If not specified, modules use the Gateway automatically discovered in the cluster (if any).
            type: object
            required:
              - name
              - namespace
            properties:
              name:
                type: string
                description: |
                  Name of the Gateway object.
              namespace:
                type: string
                description: |
                  Namespace of the Gateway object.
      gatewayAPIGateway:
        type: object
        deprecated: true
        x-doc-deprecated: true
        properties:
          name:
            type: string
            description: |
              Name of the Gateway object.
          namespace:
            type: string
            description: |
              Namespace of the Gateway object.
        required:
          - name
          - namespace
        description: |
          > **Deprecated**. Use [settings.modules.gatewayAPI.gateway](#parameters-modules-gatewayAPI-gateway) instead.
          
          Reference to the Gateway object (from the Gateway API) used by DP modules when creating Gateway API resources.

          If not specified, modules use the Gateway automatically discovered in the cluster (if any).
      ingress:
        description: |
          Common parameters for Ingress usage by DP modules.
        default: {}
        type: object
        additionalProperties: false
        properties:
          ingressClass:
            type: string
            default: nginx
            description: |
              Default [IngressClass](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class) name used by DP modules when creating Ingress resources.

              Some modules support their own `ingressClass` parameter, which lets you use a different IngressClass instead of the default one.
          enabled:
            type: boolean
            default: true
            description: |
              Enables the creation of Ingress resources by the DP modules that support it.

              Modules that support Ingress can override this setting with their own `ingress.enabled` parameter.
      ingressClass:
        type: string
        deprecated: true
        default: nginx
        x-doc-deprecated: true
        description: |
          > **Deprecated**. Use [settings.modules.ingress.ingressClass](#parameters-modules-ingress-ingressClass) instead.
          
          Default [IngressClass](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class) name used by DP modules when creating Ingress resources.

          Some modules support their own `ingressClass` parameter, which lets you use a different IngressClass instead of the default one.
        x-examples: [ "nginx" ]
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
      publicDomainTemplate:
        type: string
        pattern: '^(%s([-a-z0-9]*[a-z0-9])?|[a-z0-9]([-a-z0-9]*)?%s([-a-z0-9]*)?[a-z0-9]|[a-z0-9]([-a-z0-9]*)?%s)(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
        description: |
          A DNS name template with the `%s` key used as a dynamic part of the string.

          Deckhouse modules use this template when creating Ingress resources.

          For example, given the template `%s.kube.company.my`, the `prometheus` module will create an Ingress resource at the address `grafana.kube.company.my` to provide access to Grafana.

          **Pay attention to the following:**
          - If this parameter is not specified, Ingress resources will not be created.
          - The domain specified in the template must not match or be a subdomain of the domain specified in the [`clusterDomain`](/products/kubernetes-platform/documentation/v1/reference/api/cr.html#clusterconfiguration-clusterdomain) parameter. It is not recommended to change the `clusterDomain` value unless absolutely necessary.
          - For the template to function correctly, you must first configure DNS services both in the networks where the cluster nodes will be located and in the networks from which clients will access the platform’s service web interfaces.
          - If the template matches the domain of the node network, use only A records to assign addresses of the nodes’ Frontend interfaces to the platform’s service web interfaces.
          For example, if the nodes are registered under the `company.my` zone and the template is `%s.company.my`.
        x-doc-examples: [ "%s.kube.company.my", "kube-%s.company.my" ]
        x-examples: [ "%s.kube.company.my" ]
      placement:
        description: |
          Parameters regulating the layout of Deckhouse module components.
        type: object
        additionalProperties: false
        default: {}
        properties:
          customTolerationKeys:
            description: |
              A list of custom toleration keys; use them to allow the deployment of some critical add-ons (such as cni and csi) on dedicated nodes.
            x-doc-example: |
              ```yaml
              customTolerationKeys:
              - dedicated.example.com
              - node-dedicated.example.com/master
              ```
            type: array
            items:
              type: string
            x-examples:
            - [ "dedicated.example.com" ]
      https:
        description: |
          HTTPS access implementation method used by the Deckhouse ecosystem modules.
        type: object
        additionalProperties: false
        default: {}
        x-examples:
        - certManager:
            clusterIssuerName: letsencrypt
          mode: CertManager
        - mode: Disabled
        - mode: OnlyInURI
        - mode: CustomCertificate
          customCertificate:
            secretName: plainstring
        properties:
          mode:
            type: string
            description: |
              HTTPS usage mode:

              * `CertManager`: Modules use HTTPS and obtain certificates automatically using the ClusterIssuer defined in the [`certManager.clusterIssuerName`](#parameters-modules-https-certmanager-clusterissuername) parameter.
              * `CustomCertificate`: Modules use HTTPS with the certificate from the `d8-system` namespace.
              * `Disabled`: Modules use HTTP only (some modules, such as [`user-authn`](/modules/user-authn/), may not work).
              * `OnlyInURI`: Modules use HTTP in the expectation that there is an external upstream HTTPS load balancer, which terminates HTTPS. This load balancer should be capable of redirecting requests from HTTP to HTTPS.
            default: CertManager
            enum:
            - Disabled
            - CertManager
            - CustomCertificate
            - OnlyInURI
          certManager:
            type: object
            additionalProperties: false
            default: {}
            properties:
              clusterIssuerName:
                type: string
                default: 'letsencrypt'
                x-doc-default: 'letsencrypt'
                description: |
                  ClusterIssuer name used by modules to obtain TLS certificates.

                  The [`cert-manager`](/modules/cert-manager/) module offers the following ClusterIssuer options:

                  - `letsencrypt`
                  - `letsencrypt-staging`
                  - `selfsigned`
                  - `clouddns`
                  - `cloudflare`
                  - `digitalocean`
                  - `route53`

                  You can use your own ClusterIssuer if necessary.
          customCertificate:
            type: object
            additionalProperties: false
            properties:
              secretName:
                type: string
                description: |
                  Name of the Secret in the `d8-system` namespace containing a TLS certificate for modules.

                  This Secret must be in the [`kubernetes.io/tls`](https://kubernetes.github.io/ingress-nginx/user-guide/tls/#tls-secrets) format.
                default: "false"
      resourcesRequests:
        description: |
          The amount of resources (CPU and memory) allocated to some components.

          More info in the [Kubernetes documentation](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#resource-units-in-kubernetes).
        type: object
        default: {}
        additionalProperties: false
        properties:
          controlPlane:
            type: object
            default: {}
            additionalProperties: false
            deprecated: true
            x-doc-deprecated: true
            description: |
              > **Deprecated**. Use `control-plane-manager` moduleconfig parameter `.spec.settings.resourcesRequests` instead.

              Amount of resources (CPU and memory) allocated to control-plane components on each master node.

              These settings do not apply if the cluster control plane is managed by a cloud provider (for example, Google Kubernetes Engine or Azure Kubernetes Service).
            x-examples:
              - cpu: 1000m
                memory: 500M
            properties:
              cpu:
                deprecated: true
                x-doc-deprecated: true
                description: |
                  > **Deprecated**. Use `controlPlaneManager.spec.settings.resourcesRequests.cpu` instead.

                  The combined CPU requests for control-plane components on each master node.
                oneOf:
                  - type: string
                    pattern: "^[0-9]+m?$"
                  - type: number
              memory:
                deprecated: true
                x-doc-deprecated: true
                description: |
                  > **Deprecated**. Use `controlPlaneManager.spec.settings.resourcesRequests.memory` instead.

                  The combined memory requests for control-plane components on each master node.
                type: string
                pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|K|Ei|Pi|Ti|Gi|Mi|Ki)?$'
      storageClass:
        type: string
        default: null
        description: |
          The StorageClass to use with all Deckhouse Platform components (Prometheus, Grafana, OpenVPN, etc.) unless it is overridden in the module configuration.

          If the value is not specified, the [default StorageClass](https://kubernetes.io/docs/concepts/storage/storage-classes/#default-storageclass) set in the cluster is used.

          **Important notes:**

            * If the module's configuration defines its own `storageClass` parameter, the module's value takes precedence and the global `modules.storageClass` is not used.
            * If a PersistentVolumeClaim (PVC) for a module already exists, changing this parameter does not affect the existing PVC or require disk recreation. The module uses the existing PVC and its StorageClass. See the [prometheus module example](/modules/prometheus/configuration.html#parameters-storageclass) for more details on how this parameter is applied.
            * This parameter is applied during module activation when creating new PVCs.
            * Use this parameter only in exceptional circumstances.
  applications:
    description: |
      Common parameters of the Deckhouse ecosystem applications.
    additionalProperties: false
    default: {}
    type: object
    properties:
      ingressClass:
        type: string
        default: nginx
        description: |
          Default [IngressClass](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class) name used by the Deckhouse ecosystem applications when creating Ingress resources.

          Some applications support their own `ingressClass` parameter, which lets you use a different IngressClass instead of the default one.
        x-examples: [ "nginx" ]
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
      publicDomainTemplate:
        type: string
        pattern: '^(%s([-a-z0-9]*[a-z0-9])?|[a-z0-9]([-a-z0-9]*)?%s([-a-z0-9]*)?[a-z0-9]|[a-z0-9]([-a-z0-9]*)?%s)\.(%s([-a-z0-9]*[a-z0-9])?|[a-z0-9]([-a-z0-9]*)?%s([-a-z0-9]*)?[a-z0-9]|[a-z0-9]([-a-z0-9]*)?%s)(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
        description: |
          DNS name template with two `%s` keys used as the dynamic parts of the string.

          Whenever a DNS is generated:

          - First key is replaced with the application instance name.
          - Second key is replaced with the application's namespace.

          The Deckhouse ecosystem applications use this template when creating Ingress resources.

          For example, given the template `%s.%s.kube.company.my`, the application instance named `grafana` running in the `monitoring` namespace will get an Ingress resource at the address `grafana.monitoring.kube.company.my`.

          **Usage notes:**

          - If this parameter is not specified, Ingress resources will not be created.
          - The domain specified in the template must not match or be a subdomain of the domain specified in the [`clusterDomain`](cr.html#clusterconfiguration-clusterdomain) parameter. Changing the `clusterDomain` value is not recommended unless necessary.
          - Before using the template, configure DNS services both in the networks where the cluster nodes will be located and in the networks from which clients will access the service web interfaces.
          - If the template domain matches the domain of the node network, use only A records to assign addresses of the frontend nodes to the platform service web interfaces.
          For example, if the nodes are registered under the `company.my` zone, the template must be `%s.%s.company.my`.
        x-doc-examples: [ "%s.%s.company.my", "%s.%s.kube.company.my" ]
        x-examples: [ "%s.%s.kube.company.my" ]
      https:
        description: |
          HTTPS access implementation method used by the Deckhouse ecosystem applications.
        type: object
        additionalProperties: false
        default: {}
        x-examples:
        - certManager:
            clusterIssuerName: letsencrypt
          mode: CertManager
        - mode: Disabled
        - mode: OnlyInURI
        - mode: CustomCertificate
          customCertificate:
            secretName: plainstring
        properties:
          mode:
            type: string
            description: |
              HTTPS usage mode:

              * `CertManager`: Applications use HTTPS and obtain certificates automatically using the ClusterIssuer defined in the [`certManager.clusterIssuerName`](#parameters-applications-https-certmanager-clusterissuername) parameter.
              * `CustomCertificate`: Applications use HTTPS with the certificate from the `d8-system` namespace.
              * `Disabled`: Applications use HTTP only.
              * `OnlyInURI`: Applications use HTTP in the expectation that there is an external upstream HTTPS load balancer, which terminates HTTPS. This load balancer should be capable of redirecting requests from HTTP to HTTPS.
            default: CertManager
            enum:
            - Disabled
            - CertManager
            - CustomCertificate
            - OnlyInURI
          certManager:
            type: object
            additionalProperties: false
            default: {}
            properties:
              clusterIssuerName:
                type: string
                default: 'letsencrypt'
                x-doc-default: 'letsencrypt'
                description: |
                  ClusterIssuer name used by applications to obtain TLS certificates.

                  The [`cert-manager`](/modules/cert-manager/) module offers the following ClusterIssuer options:

                  - `letsencrypt`
                  - `letsencrypt-staging`
                  - `selfsigned`
                  - `clouddns`
                  - `cloudflare`
                  - `digitalocean`
                  - `route53`

                  You can use your own ClusterIssuer if necessary.
          customCertificate:
            type: object
            additionalProperties: false
            properties:
              secretName:
                type: string
                description: |
                  Name of the Secret in the `d8-system` namespace containing a TLS certificate for applications.

                  This Secret must be in the [`kubernetes.io/tls`](https://kubernetes.github.io/ingress-nginx/user-guide/tls/#tls-secrets) format.
                default: "false"
      update:
        type: object
        additionalProperties: false
        description: |
          Update settings of the Deckhouse ecosystem applications: the update mode, update windows, update notifications, and blocking the update on alerts.

          The settings are used by applications that do not have their own [`spec.update`](cr.html#application-v1alpha1-spec-update) settings. The [notification](#parameters-applications-update-notification) settings are also used by applications that have their own update settings, because notifications cannot be configured for a single application.

          If the parameter is omitted, applications use the Deckhouse update settings: the [`update`](/modules/deckhouse/configuration.html#parameters-update) parameter of the `deckhouse` module.
        x-examples:
        - mode: AutoPatch
          windows:
          - from: "8:00"
            to: "15:00"
            days:
            - Tue
            - Sat
          notification:
            webhook: https://release-webhook.mydomain.com
            minimalNotificationTime: 6h
            auth:
              basic:
                username: user
                password: password
        properties:
          mode:
            type: string
            default: AutoPatch
            description: |
              Update mode of applications on the [release channel](cr.html#application-v1alpha1-spec-releasechannel) selected for them.

              - `AutoPatch`: Automatic update mode for patch versions.

                To change a minor version (for example, from `v1.2.*` to `v1.3.*`), confirmation is required.

                A patch version update (for example, from `v1.3.1` to `v1.3.2`) is applied taking into account the [update windows](#parameters-applications-update-windows), if they are set.
              - `Auto`: Automatic update mode for all versions.

                Minor version updates (for example, from `v1.2.*` to `v1.3.*`) and patch version updates (for example, from `v1.3.1` to `v1.3.2`) are applied taking into account the [update windows](#parameters-applications-update-windows), if they are set.
              - `Manual`: Manual update mode for all versions.

                Confirmation is required for updating both minor and patch versions.
            enum:
            - AutoPatch
            - Auto
            - Manual
          windows:
            type: array
            description: |
              List of update windows during the day.
            items:
              type: object
              additionalProperties: false
              required:
              - from
              - to
              properties:
                from:
                  type: string
                  pattern: '^(?:\d|[01]\d|2[0-3]):[0-5]\d$'
                  example: '13:00'
                  description: |
                    Start time of the update window (UTC timezone).

                    Should be less than the end time of the update window.
                to:
                  type: string
                  pattern: '^(?:\d|[01]\d|2[0-3]):[0-5]\d$'
                  example: '18:30'
                  description: |
                    End time of the update window (UTC timezone).

                    Should be more than the start time of the update window.
                days:
                  type: array
                  description: The days of the week on which the update window is applied.
                  example: ["Mon", "Wed"]
                  items:
                    type: string
                    description: Day of the week.
                    x-examples: [Mon]
                    enum:
                    - Mon
                    - Tue
                    - Wed
                    - Thu
                    - Fri
                    - Sat
                    - Sun
          notification:
            type: object
            additionalProperties: false
            description: |
              Settings for notifications of scheduled application updates.

              Has an effect **only** when an automatic [update mode](#parameters-applications-update-mode) is set.
            x-examples:
            - webhook: https://release-webhook.mydomain.com
              minimalNotificationTime: 8h
              retryMinTime: 2s
            properties:
              webhook:
                type: string
                pattern: "^https?://[^\\s/$.?#].[^\\s]*$"
                x-doc-example: 'https://webhook.site/#!/bc8f71ac-c182-4181-9159-6ba6950afffa'
                description: |
                  URL for an external webhook handler.

                  The POST request is sent to the webhook URL after a new minor version of an application appears on its release channel, before it is applied to the cluster.

                  > **Warning.** If you specify an invalid webhook address, application updates will be blocked.

                  Use the [`minimalNotificationTime`](#parameters-applications-update-notification-minimalnotificationtime) parameter if necessary to set the minimum time that must pass before updating from the moment a new minor version appears on the release channel.
              tlsSkipVerify:
                type: boolean
                default: false
                description: Skip TLS certificate verification while webhook request.
              minimalNotificationTime:
                type: string
                pattern: '^([0-9]+h([0-9]+m)?|[0-9]+m)$'
                x-doc-example: '6h'
                description: |
                  The minimum time that must pass before updating from the moment a new minor version of an application appears on its release channel.

                  It is specified as a string containing the time unit in hours and minutes: 30m, 1h, 2h30m, 24h.

                  The update mechanism ensures that an application will not be updated until the specified period of time has passed.

                  When using update windows, the application update will happen at the nearest possible update window but not before the time specified in `minimalNotificationTime` expires.
              retryMinTime:
                type: string
                pattern: '^([0-9]+h([0-9]+m)?|[0-9]+m|[0-9]+s)$'
                x-doc-example: '2s'
                description: |
                  The minimum time between webhook retry attempts when the webhook request fails.

                  It is specified as a string containing the time unit in hours, minutes, or seconds: 30s, 1m, 1h, 2h30m.

                  The retry mechanism uses exponential backoff: each subsequent retry attempt waits twice as long as the previous one.
                  For example, if `retryMinTime` is set to `2s`, the retry delays will be: 2s, 4s, 8s, 16s, 32s.

                  Default value is 2 seconds if not specified.
              auth:
                type: object
                additionalProperties: false
                oneOf:
                - required: [ basic ]
                - required: [ bearerToken ]
                description: |
                  Authentication settings for the webhook.

                  If the parameter is omitted, the webhook will be called without authentication.
                properties:
                  basic:
                    type: object
                    additionalProperties: false
                    description: |
                      Basic authentication settings for the webhook.
                    required:
                    - username
                    - password
                    properties:
                      username:
                        type: string
                        description: |
                          The username for the webhook.

                          The username and password will be sent in the `Authorization` header in the format `Basic <base64(username:password)>`.
                      password:
                        type: string
                        description: |
                          The password for the webhook.

                          The username and password will be sent in the `Authorization` header in the format `Basic <base64(username:password)>`.
                  bearerToken:
                    type: string
                    description: |
                      The token for the webhook.

                      The token will be sent in the `Authorization` header in the format `Bearer <token>`.
              releaseType:
                type: string
                description: |
                  Defines the type of version for which the notification will be sent:

                  - `Minor`: Only for updating the minor version.
                  - `All`: For any updates, including updating a patch version.
                x-examples: ["All"]
                enum:
                - All
                - Minor
                default: Minor
          blockOnAlerts:
            type: object
            additionalProperties: false
            default: {}
            description: |
              Settings for blocking application updates while there are alerts in the cluster.
            properties:
              enabled:
                type: boolean
                default: false
                description: |
                  If enabled, application updates are blocked while there are alerts in the cluster with a severity level equal to or higher than the one set in the [`severity`](#parameters-applications-update-blockonalerts-severity) parameter.
              severity:
                type: integer
                default: 4
                minimum: 0
                maximum: 9
                description: |
                  The severity level of the alerts that block the update.

                  The severity level is a number from 0 to 9, where 0 is the highest severity and 9 is the lowest severity.
