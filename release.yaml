# Channel canary settings
"canary":
  "alpha":
    enabled: true
    waves: 2
    interval: "5m"
  "beta":
    enabled: false
    waves: 1
    interval: "1m"
  "early-access":
    enabled: true
    waves: 6
    interval: "30m"
  "stable":
    enabled: true
    waves: 6
    interval: "30m"
  "rock-solid":
    enabled: false
    waves: 5
    interval: "5m"

# release requirements, don't forget to register check function in a file requirements.go
requirements:
  "k8s": "<autogenerated on the build stage>" # modules/040-control-plane-manager/requirements/check.go
  "disabledModules": "delivery,l2-load-balancer,ceph-csi" # specific key with comma-separated list of modules, which have to be disabled to deploy this release
  "migratedModules": "pod-reloader,runtime-audit-engine,dashboard,ingress-nginx,prometheus-pushgateway,extended-monitoring,monitoring-ping,prometheus-metrics-adapter,log-shipper,monitoring-custom,operator-prometheus,prometheus,loki,upmeter,monitoring-kubernetes,monitoring-applications,service-with-healthchecks" # specific key with comma-separated list of modules, which have to be migrated from embedded to external
  # autoK8sVersion must be equal to 'DefaultKubernetesVersion' in the 'dhctl/pkg/config/base.go'
  # it's used to block release with deprecated APIs when changing default kubernetes version
  "autoK8sVersion": "<autogenerated on the build stage>" #modules/040-control-plane-manager/requirements/auto_k8s_version.go
  "nodesMinimalOSVersionUbuntu": "18.04" # modules/040-node-manager/requirements/check.go
  "nodesMinimalOSVersionDebian": "10" # modules/040-node-manager/requirements/check.go
  "istioMinimalVersion": "1.25" # modules/110-istio/requirements/check.go
  "unmetCloudConditions": "true" # modules/040-node-manager/requirements/check.go
  "nodesMinimalLinuxKernelVersion": "5.8.0" # modules/021-cni-cilium/requirements/check.go
  # "ciliumReadyForUpgradeTo": "1.20" # modules/021-cni-cilium/requirements/check.go; uncomment in the release that upgrades Cilium to 1.19 or later (CNP/CCNP with fromRequires/toRequires break the new agent)
  # This is the release that removes the previous registry implementation, so it must not install on
  # a cluster still running it: such a cluster would lose the code that configures the container
  # runtime on its nodes, in a release that itself has to be pulled through that configuration.
  # The check is evaluated by the version already INSTALLED — it ships in 1.77, in
  # modules/038-registry/requirements/check.go — and this line is what finally asks it.
  # Release-engineering rule: it ships in 1.77.1, so a release older than 1.77.1 lets 1.78 through
  # whatever registry mode the cluster runs (an unregistered key passes). Regular channels reach
  # 1.78 only through the latest 1.77 patch, but an LTS hop or an update constraint can skip it: no
  # LTS step and no `update.versions` constraint may take a cluster below 1.77.1 to 1.78 or later,
  # and the latest 1.77 patch must not be suspended or skipped while 1.78 is on any channel. No
  # requirement key that 1.75, 1.76 or 1.77.0 already checks can express this: none of them reads
  # the registry mode, and none refuses an update by the version it starts from.
  "registryImplementation": "V2" # modules/038-registry/requirements/check.go
  # "checkContainerdV1NodesPresent": "false" # modules/040-node-manager/requirements/check.go; injected with 'true' only for CSE via .werf/werf-release-channel.yaml (CSE drops containerd v1)

# map of disruptions, associated with a specific release. You have to register check functions before specified release
disruptions:
