syntax = "proto3";

option go_package = "pb/dhctl";

package dhctl;

enum Continue {
  CONTINUE_UNSPECIFIED = 0;
  CONTINUE_NEXT_PHASE = 1;
  CONTINUE_STOP_OPERATION = 2;
  CONTINUE_ERROR = 3;
}

message Logs {
  repeated string logs = 1;
}

message Progress {
  message PhaseWithSubPhases {
    string phase = 1;
    repeated string sub_phases = 2;
    string action = 3;
  }

  string operation = 1;
  double progress = 2;
  string completed_phase = 3;
  string current_phase = 4;
  string next_phase = 8;
  string completed_sub_phase = 5;
  string current_sub_phase = 6;
  string next_sub_phase = 9;

  repeated PhaseWithSubPhases phases = 7;
}

message OperationOptions {
  repeated string skip_preflight_checks = 1;

  // Turns off every preflight check that can be turned off, the way
  // --preflight-skip-all-checks does on the command line. The few checks that
  // guard an assumption dhctl has no code path around are not affected.
  //
  // Without it a caller had to enumerate every check name, and the list changes
  // between releases.
  bool skip_all_preflight_checks = 2;
}
