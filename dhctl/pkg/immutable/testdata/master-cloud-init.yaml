- content: |
    apiVersion: internal.deckhouse.io/v1alpha1
    kind: NodeConfig
    metadata:
      labels:
        node.deckhouse.io/group: master
      name: example-master-0
    spec:
      apiServerEndpoints:
      - https://$MY_IP:6443
      containerRuntime:
        maxConcurrentDownloads: 3
        sandboxImage: dev-registry.deckhouse.io/sys/deckhouse-oss@sha256:4444444444444444444444444444444444444444444444444444444444444444
      extensions:
      - digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
        name: containerd
        requestedBy: node-manager
      - digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
        name: kubelet
        requestedBy: node-manager
      - digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
        name: kubernetes-cni
        requestedBy: node-manager
      kernel:
        sysctl:
          kernel.panic: "10"
          kernel.panic_on_oops: "1"
          net.ipv4.ip_forward: "1"
          vm.max_map_count: "262144"
      kubelet:
        clusterDNS:
        - 10.223.0.10
        clusterDomain: cluster.local
        containerLogMaxFiles: 4
        containerLogMaxSize: 50Mi
        externalCloudProvider: true
        kubernetesVersion: "1.34"
        maxPods: 120
        nodeLabels:
          node.deckhouse.io/cgroup: cgroup2fs
          node.deckhouse.io/group: master
          node.deckhouse.io/type: CloudPermanent
        resourceReservation:
          mode: Auto
        serverTLSBootstrap: false
      network:
        hostname: example-master-0
        interfaces:
        - dhcp: true
          name: eth0
      nodeName: example-master-0
      osImage: dev-registry.deckhouse.io/sys/deckhouse-oss/olcedar:v0.1
      registry:
        address: dev-registry.deckhouse.io
        auth: dXNlcjpwYXNzd29yZA==
        path: /sys/deckhouse-oss
        scheme: HTTPS
      storage:
        diskSelector:
          size: '>=20Gi'
        mounts:
        - bindTo: /var/lib/etcd
          mode: "0700"
          name: kubernetes-data
          partitionSelector:
            blank: true
            size: 10Gi
      updatePolicy:
        mode: Automatic
  path: /config/nodeconfig.yaml
- content: |
    apiVersion: internal.deckhouse.io/v1alpha1
    kind: ControlPlaneConfig
    metadata:
      name: example-master-0
    spec:
      bootstrap: true
      cluster:
        clusterDomain: cluster.local
        encryptionAlgorithm: ""
        serviceSubnetCIDR: 10.223.0.0/16
