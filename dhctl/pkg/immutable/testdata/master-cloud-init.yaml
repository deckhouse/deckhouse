      - content: |
          apiVersion: apiserver.config.k8s.io/v1beta1
          kind: AuthenticationConfiguration
          anonymous:
            enabled: true
            conditions:
            - path: /livez
            - path: /readyz
            - path: /healthz
        name: authentication-config.yaml
      handoff:
        clientCSR: <installer certificate request>
        serverCert: <handoff server certificate>
        serverKey: <handoff server key>
        token: <handoff token>
      manifests:
      - content: "apiVersion: v1\nkind: Pod\nmetadata:\n  annotations:\n    control-plane-manager.deckhouse.io/etcd.advertise-client-urls:
          https://$MY_IP:2379\n  labels:\n    component: etcd\n    tier: control-plane\n
          \ name: etcd\n  namespace: kube-system\nspec:\n  containers:\n  - command:\n
          \   - etcd\n    - --advertise-client-urls=https://$MY_IP:2379\n    - --cert-file=/etc/kubernetes/pki/etcd/server.crt\n
          \   - --client-cert-auth=true\n    - --data-dir=/var/lib/etcd\n    - --initial-advertise-peer-urls=https://$MY_IP:2380\n
          \   - --initial-cluster=example-master-0=https://$MY_IP:2380\n    - --watch-progress-notify-interval=5s\n
          \   - --quota-backend-bytes=2147483648\n    - --metrics=extensive\n    - --key-file=/etc/kubernetes/pki/etcd/server.key\n
          \   - --listen-client-urls=https://127.0.0.1:2379,https://$MY_IP:2379\n    -
          --listen-metrics-urls=http://127.0.0.1:2381\n    - --listen-peer-urls=https://$MY_IP:2380\n
          \   - --name=example-master-0\n    - --peer-cert-file=/etc/kubernetes/pki/etcd/peer.crt\n
          \   - --peer-client-cert-auth=true\n    - --peer-key-file=/etc/kubernetes/pki/etcd/peer.key\n
          \   - --peer-trusted-ca-file=/etc/kubernetes/pki/etcd/ca.crt\n    - --snapshot-count=10000\n
          \   - --trusted-ca-file=/etc/kubernetes/pki/etcd/ca.crt\n    env:\n    - name:
          ETCD_HEARTBEAT_INTERVAL\n      value: \"100\"\n    - name: ETCD_ELECTION_TIMEOUT\n
          \     value: \"1000\"  \n    image: dev-registry.deckhouse.io/sys/deckhouse-oss@sha256:5555555555555555555555555555555555555555555555555555555555555555\n
          \   imagePullPolicy: IfNotPresent\n    livenessProbe:\n      failureThreshold:
          8\n      httpGet:\n        host: 127.0.0.1\n        path: /livez\n        port:
          probe-port\n        scheme: HTTP\n      initialDelaySeconds: 10\n      periodSeconds:
          10\n      timeoutSeconds: 15\n    name: etcd\n    ports:\n    - containerPort:
          2381\n      name: probe-port\n      protocol: TCP\n    readinessProbe:\n      failureThreshold:
          3\n      httpGet:\n        host: 127.0.0.1\n        path: /health\n        port:
          2381\n        scheme: HTTP\n      periodSeconds: 1\n      timeoutSeconds: 15\n
          \   resources:\n      requests:\n        cpu: \"179m\"\n        memory: \"187904819\"\n
          \   securityContext:\n      capabilities:\n        drop:\n        - ALL\n      readOnlyRootFilesystem:
          true\n      runAsGroup: 0\n      runAsNonRoot: false\n      runAsUser: 0\n      seccompProfile:\n
          \       type: RuntimeDefault\n    startupProbe:\n      failureThreshold: 24\n
          \     httpGet:\n        host: 127.0.0.1\n        path: /readyz?exclude=non_learner\n
          \       port: 2381\n        scheme: HTTP\n      initialDelaySeconds: 10\n      periodSeconds:
          10\n      timeoutSeconds: 15\n    volumeMounts:\n    - mountPath: /var/lib/etcd\n
          \     name: etcd-data\n    - mountPath: /etc/kubernetes/pki/etcd\n      name:
          etcd-certs\n      readOnly: true\n  dnsPolicy: ClusterFirstWithHostNet\n  hostNetwork:
          true\n  priority: 2000001000\n  priorityClassName: system-node-critical\n  securityContext:\n
          \   seccompProfile:\n      type: RuntimeDefault\n  volumes:\n  - hostPath:\n
          \     path: /var/lib/etcd\n      type: DirectoryOrCreate\n    name: etcd-data\n
          \ - hostPath:\n      path: /etc/kubernetes/pki/etcd\n      type: DirectoryOrCreate\n
          \   name: etcd-certs\n"
        name: etcd.yaml
      - content: |
          apiVersion: v1
          kind: Pod
