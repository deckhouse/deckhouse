                  port: 6443
                  scheme: HTTPS
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 15
              name: kube-apiserver
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  host: $MY_IP
                  path: /healthz
                  port: 6443
                  scheme: HTTPS
                periodSeconds: 1
                timeoutSeconds: 15
              resources:
                requests:
                  cpu: "168m"
                  memory: "177167400"
              securityContext:
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 0
