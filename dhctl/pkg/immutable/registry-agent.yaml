apiVersion: v1
kind: Pod
metadata:
  annotations:
    # The image's digest, so that a new agent actually starts. The image is a local tag
    # the containerd extension imports on every boot, the same tag in every release, so
    # without this the manifest never changes: the new image is imported and the old
    # container keeps serving until the node reboots. As 053_configure_registry_agent does
    # on a bashible node.
    registry.deckhouse.io/agent-image-digest: "__REGISTRY_AGENT_IMAGE_DIGEST__"
  labels:
    component: registry-agent
    tier: control-plane
    security.deckhouse.io/security-policy-exception: registry-agent-engine
  name: registry-agent
  namespace: kube-system
spec:
  # Host networking because the runtime is configured to reach the agent on this
  # node's loopback, and it resolves that address in the host's network namespace.
  # The address is 127.0.0.1:5001 throughout; source of truth: ProxyHost in
  # go_lib/registry/const/registry.go, pinned by a template test.
  hostNetwork: true
  # The node's own resolver, never the cluster's. The names this has to resolve are
  # upstream registries outside the cluster, and cluster DNS cannot start until its
  # image is pulled — which is what this pod exists to make possible.
  dnsPolicy: Default
  priorityClassName: system-node-critical
  priority: 2000001000
  # A frozen agent cannot act on SIGTERM, so the kubelet kills it only when the grace
  # period ends: with the default 30 s, liveness gave up on it after a minute and the node
  # waited half a minute more. A running agent exits within a second of SIGTERM.
  terminationGracePeriodSeconds: 15
  containers:
  - name: registry-agent
    image: deckhouse.local/images:registry-agent
    imagePullPolicy: IfNotPresent
    args:
    - --listen-address=127.0.0.1:5001
    - --containerd-registry-dir=/run/etc/containerd/registry.d
    - --pki-dir=/etc/kubernetes/registry-agent/pki
    - --layout-cache=/var/lib/deckhouse/registry-agent/layout.json
    - --bootstrap-node-config=/config/nodeconfig.yaml
    # Measured, not written: the agent reports how much of the node's disk the store
    # is taking. The same path the store itself mounts, which on this kind of node is
    # not the one under /opt.
    - --store-path=/var/lib/deckhouse/registry
    # The agent's own metrics, for the node exporter to report: nothing scrapes the agent
    # itself, since a kube-rbac-proxy beside it would authenticate against the API server it
    # has to outlive. The node exporter reads every .prom file in this directory.
    - --metrics-textfile=/var/run/node-exporter-textfile/registry-agent.prom
    env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
      seccompProfile:
        type: RuntimeDefault
    # Requests, and no limits. Without requests the pod is BestEffort, the smallest CPU
    # weight on the node, and under load every pull on the node waits on an agent that gets
    # next to no CPU. A CPU limit would throttle the same path, since every byte of every
    # image crosses the agent's TLS; memory stays unlimited until the agent's peak under
    # parallel pulls is measured. AgentCPURequest and AgentMemoryRequest in
    # go_lib/registry/const, pinned by a template test.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    # Probed on the port the runtime pulls through, over TLS, rather than on the plain-HTTP
    # metrics listener: a probe that passes has completed the handshake every pull does.
    # Loopback, the only address the agent listens on, which the kubelet reaches in the host's
    # network namespace like the agent.
    #
    # Liveness restarts an agent that has not answered for a minute. A frozen agent completes
    # no handshake, so containerd waits out its handshake timeout on every pull and then pulls
    # without the agent, where platform images cannot be pulled; without liveness nothing
    # would restart it. A minute, not seconds, because a restart drops every pull in flight.
    # The startup probe holds liveness off for up to two minutes, so a slow start on a booting
    # node is not killed for it. Readiness is quicker and costs nothing to fail: the pod has
    # no Service, and its Ready is read only by the D8RegistryAgentNotReady alert. As
    # 053_configure_registry_agent does on a bashible node.
    startupProbe:
      httpGet:
        scheme: HTTPS
        host: 127.0.0.1
        port: 5001
        path: /healthz
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 24
    livenessProbe:
      httpGet:
        scheme: HTTPS
        host: 127.0.0.1
        port: 5001
        path: /healthz
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      httpGet:
        scheme: HTTPS
        host: 127.0.0.1
        port: 5001
        path: /healthz
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    volumeMounts:
    # Written by the agent, and by nothing else.
    - mountPath: /run/etc/containerd/registry.d
      name: containerd-registry-d
    # Not read-only, unlike the bashible node's: there the material is generated by
    # the step before the pod starts, and here the agent generates it itself.
    - mountPath: /etc/kubernetes/registry-agent
      name: agent-material
    - mountPath: /var/lib/deckhouse/registry-agent
      name: layout-cache
    # The node's own document: the registry it was installed from, which is the layout
    # the agent routes by until the API server first answers, and the cluster authority
    # and API address it reaches that API server with.
    #
    # The directory, not the file. nodelet rewrites the document by rename whenever the
    # cluster changes it, and a file mounted on its own stays bound to the inode it was
    # given: the agent went on reading the first master's install-time document, which
    # has no cluster authority because the master had not generated one yet, and never
    # reached the API server — while the file on the node had carried the authority for
    # twenty minutes. Measured on an Engine cluster on 2026-10-02.
    - mountPath: /config
      name: node-config
      readOnly: true
    # The kubelet's rotating client certificate, which is the identity the agent reads
    # this node's layout with. Nothing is distributed to the node for it.
    - mountPath: /var/lib/kubelet/pki
      name: kubelet-pki
      readOnly: true
    # Where the store keeps its blobs on this node, measured once the cache is turned off so
    # that data left behind is reported (staleStorageDataBytes). Without the mount the agent
    # measured an empty directory inside its own container and always reported zero.
    # Read-only: the agent measures it and never deletes anything there.
    - mountPath: /var/lib/deckhouse/registry
      name: store-data
      readOnly: true
      # So that a disk mounted on the directory after the agent started is what it
      # measures, rather than the empty directory under it.
      mountPropagation: HostToContainer
    # The node exporter's textfile directory, the one place on the node the agent writes
    # for someone else to read.
    - mountPath: /var/run/node-exporter-textfile
      name: metrics-textfile
  volumes:
  - hostPath:
      path: /run/etc/containerd/registry.d
      type: DirectoryOrCreate
    name: containerd-registry-d
  # DirectoryOrCreate, unlike the bashible node's Directory: nothing has created this
  # before the pod starts, and on this node nothing ever will — /etc/kubernetes is a
  # tmpfs and the agent is the only writer under here.
  - hostPath:
      path: /etc/kubernetes/registry-agent
      type: DirectoryOrCreate
    name: agent-material
  - hostPath:
      path: /var/lib/deckhouse/registry-agent
      type: DirectoryOrCreate
    name: layout-cache
  # Directory, not DirectoryOrCreate: an empty directory here would read as a node that
  # named no registry and no API server, and the agent would route from nothing while
  # reporting success. It holds what the node booted from, so it is there.
  - hostPath:
      path: /config
      type: Directory
    name: node-config
  - hostPath:
      path: /var/lib/kubelet/pki
      type: DirectoryOrCreate
    name: kubelet-pki
  # DirectoryOrCreate: a node that never held a store has nothing there, which measures as
  # nothing left behind.
  - hostPath:
      path: /var/lib/deckhouse/registry
      type: DirectoryOrCreate
    name: store-data
  # DirectoryOrCreate: the node exporter creates it too, and whichever starts first does.
  - hostPath:
      path: /var/run/node-exporter-textfile
      type: DirectoryOrCreate
    name: metrics-textfile
