---
# Disabling a module that was previously enabled (Enabled=True): the controller
# must drop MPV.Used to false, remove the allow-disabling annotation and delete
# the module documentation. The lifecycle status itself is left untouched — it
# is owned by the package status service.
apiVersion: deckhouse.io/v1alpha2
kind: Module
metadata:
  name: test-module
  annotations:
    modules.deckhouse.io/allow-disabling: "true"
spec:
  packageRepositoryName: test-source
  packageVersion: v1.0.0
  enabled: false
status:
  conditions:
  - status: "True"
    type: Enabled
  summary:
    state: Ready
---
apiVersion: deckhouse.io/v1alpha1
kind: ModulePackageVersion
metadata:
  name: test-source-test-module-v1.0.0
  labels:
    packages.deckhouse.io/repository: test-source
    packages.deckhouse.io/package: test-module
    packages.deckhouse.io/exist-in-registry: "true"
spec:
  packageName: test-module
  packageRepositoryName: test-source
  packageVersion: v1.0.0
status:
  used: true
---
apiVersion: deckhouse.io/v1alpha1
kind: ModuleDocumentation
metadata:
  name: test-module
