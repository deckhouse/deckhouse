apiVersion: deckhouse.io/v1alpha2
kind: Module
metadata:
  name: test-module
  annotations:
    modules.deckhouse.io/dev: "true"
    modules.deckhouse.io/hash: sha256:c0ffee
spec:
  packageRepositoryName: deckhouse
  packageVersion: main
