---
apiVersion: deckhouse.io/v1beta1
kind: Module
metadata:
  annotations:
    modules.deckhouse.io/embedded: "true"
  finalizers:
  - module.deckhouse.io/statistic-registered
  name: global
  ownerReferences:
  - apiVersion: deckhouse.io/v1alpha1
    blockOwnerDeletion: true
    controller: false
    kind: ModulePackageVersion
    name: embedded-global
    uid: embedded-version-uid
  - apiVersion: deckhouse.io/v1alpha1
    blockOwnerDeletion: true
    controller: false
    kind: ModulePackage
    name: global
    uid: package-uid
  resourceVersion: "3"
spec:
  packageRepositoryName: embedded
  packageVersion: v1.0.0
  settings:
    highAvailability: true
  settingsVersion: 1
status:
  lastAppliedConfiguration: null
  tracking: null
---
apiVersion: deckhouse.io/v1alpha1
kind: ModulePackage
metadata:
  name: global
  resourceVersion: "2"
  uid: package-uid
status:
  usedBy:
    repositoryName: embedded
    version: v1.0.0
---
apiVersion: deckhouse.io/v1alpha1
kind: ModulePackageVersion
metadata:
  name: embedded-global
  resourceVersion: "2"
  uid: embedded-version-uid
spec:
  packageName: global
  packageRepositoryName: embedded
  packageVersion: v1.0.0
status:
  used: true
