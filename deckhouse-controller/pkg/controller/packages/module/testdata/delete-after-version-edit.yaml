apiVersion: deckhouse.io/v1alpha2
kind: Module
metadata:
  name: test-module
  finalizers:
    - module.deckhouse.io/statistic-registered
  ownerReferences:
    - apiVersion: deckhouse.io/v1alpha1
      kind: ModulePackageVersion
      name: deckhouse-test-module-v1.0.1
      uid: version-uid
      controller: false
      blockOwnerDeletion: true
    - apiVersion: deckhouse.io/v1alpha1
      kind: ModulePackage
      name: test-module
      uid: package-uid
      controller: false
      blockOwnerDeletion: true
spec:
  packageRepositoryName: deckhouse
  packageVersion: v1.0.2
---
apiVersion: deckhouse.io/v1alpha1
kind: ModulePackage
metadata:
  name: test-module
  uid: package-uid
---
apiVersion: deckhouse.io/v1alpha1
kind: ModulePackageVersion
metadata:
  name: deckhouse-test-module-v1.0.1
  uid: version-uid
spec:
  packageName: test-module
  packageRepositoryName: deckhouse
  packageVersion: v1.0.1
status:
  used: true
---
apiVersion: deckhouse.io/v1alpha1
kind: ModulePackageVersion
metadata:
  name: deckhouse-test-module-v1.0.2
  uid: next-version-uid
spec:
  packageName: test-module
  packageRepositoryName: deckhouse
  packageVersion: v1.0.2
---
apiVersion: deckhouse.io/v1alpha1
kind: PackageRepository
metadata:
  name: deckhouse
spec:
  registry:
    scheme: https
    repo: registry.example.com/test
    dockerCfg: test-docker-cfg
    ca: test-ca
