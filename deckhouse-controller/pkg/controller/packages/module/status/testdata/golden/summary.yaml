- case: install/scheduler/Disabled
  message: 'Installation is blocked: the module is disabled'
  state: Pending
  tip: Enable the module to start the installation.
- case: install/scheduler/DisabledByBundle
  message: 'Installation is blocked: the module is disabled by the edition bundle'
  state: Pending
  tip: Enable the module explicitly to override the bundle default.
- case: install/scheduler/DisabledByScript
  message: 'Installation is blocked: the module is disabled by its enabled-script'
  state: Pending
  tip: The enabled-script evaluated to false. Check the cluster state the script depends
    on, or enable the module explicitly.
- case: install/scheduler/EnabledScriptError
  message: 'Installation failed: the module''s enabled-script failed'
  state: Failed
  tip: Check the Deckhouse controller logs for the script error. Fix the script or
    the cluster state it inspects.
- case: install/scheduler/DependencyNotEnabled
  message: 'Installation is blocked: a required module is not enabled'
  state: Pending
  tip: Enable the required module listed in the condition message. The installation
    will continue automatically.
- case: install/scheduler/DependencyVersionMismatch
  message: 'Installation is blocked: a required module version does not match'
  state: Pending
  tip: Update the required module to a version matching the constraint in the condition
    message.
- case: install/scheduler/AnyOfDependenciesUnmet
  message: 'Installation is blocked: none of the alternative required modules is enabled'
  state: Pending
  tip: Enable at least one of the modules listed in the condition message.
- case: install/scheduler/NoneOfDependenciesViolated
  message: 'Installation is blocked: a conflicting module is enabled'
  state: Pending
  tip: Disable the conflicting module listed in the condition message.
- case: install/scheduler/VersionLookupFailed
  message: 'Installation failed: a required module version could not be resolved'
  state: Failed
  tip: Check the required module's state and version. The scheduler will retry automatically.
- case: install/scheduler/CustomRuleReason
  message: 'Installation is blocked: CustomRuleReason'
  state: Pending
- case: install/RequirementsNotMet
  message: 'Installation is blocked: the module requirements are not met'
  state: Pending
  tip: Solve the requirements listed in the condition message. The installation will
    continue automatically.
- case: install/in progress
  message: Installation is in progress
  state: Pending
  tip: No action is required unless this state persists.
- case: install/AttachFailed
  message: 'Installation failed: module package could not be downloaded or mounted'
  state: Failed
  tip: Check network connectivity to the registry, verify imagePullSecret and package
    signature. Fix the issue — the controller will retry on the next reconcile.
- case: install/LoadFromFilesystemFailed
  message: 'Installation failed: module package on disk could not be loaded'
  state: Failed
  tip: The on-disk artifact is corrupted or has an invalid structure. Delete the cached
    package from the node disk and re-pull the image. The controller will retry on
    the next reconcile.
- case: install/SettingsInvalid
  message: 'Installation failed: module settings did not pass validation'
  state: Failed
  tip: Fix the ModuleConfig fields that fail OpenAPI validation. The controller will
    retry automatically after the config is changed.
- case: install/HookInitializationFailed
  message: 'Installation failed: hook synchronization phase failed'
  state: Failed
  tip: Check the hook pod/job logs (kubectl logs). Fix the hook code or its dependencies.
    Roll back the module version if needed.
- case: install/HookFailed
  message: 'Installation failed: startup or runtime hooks failed'
  state: Failed
  tip: Check the failed hook logs. Fix the configuration or hook code. The attempt
    will be retried on the next reconcile.
- case: install/ManifestsApplyFailed
  message: 'Installation failed: Helm could not apply manifests'
  state: Failed
  tip: Check helm history and events in the d8-system namespace. Resolve resource
    conflicts (namespace, CRD, RBAC). The controller will retry on the next reconcile.
- case: install/ScalingForbidden
  message: 'Installation failed: the module does not allow the requested replicas'
  state: Failed
  tip: The condition message names the workload. Change or remove its replicas in
    the module's resource requests; until then the replicas stay as they are.
- case: install/fallback
  message: 'Installation failed: ReleaseDeleteFailed'
  state: Failed
- case: install/complete
  message: ""
  state: Ready
- case: update/WaitingWindow
  message: Update is waiting for the update window; previous version is still running
  state: Updating
  tip: 'No action is required: the update starts in the next update window. Change
    the update windows or apply the release now to start it earlier.'
- case: update/RequirementsNotMet
  message: 'Update is blocked: the new version''s requirements are not met; previous
    version is still running'
  state: Updating
  tip: Solve the requirements listed in the condition message. The update will continue
    automatically.
- case: update/scheduler fallback
  message: 'Update is blocked: DependencyNotEnabled; previous version is still running'
  state: Updating
- case: update/AttachFailed
  message: 'Update is stalled: new version could not be downloaded; previous version
    is still running'
  state: Updating
  tip: Check registry connectivity, and image integrity. The previous version continues
    to work. After fixing, the controller will retry the download.
- case: update/LoadFromFilesystemFailed
  message: 'Update is stalled: new version could not be loaded from filesystem; previous
    version is still running'
  state: Updating
  tip: Delete the corrupted new version package from the node disk. The previous version
    continues to work. The controller will retry download and loading.
- case: update/SettingsInvalid
  message: 'Update is stalled: new settings did not pass validation; previous version
    is still running'
  state: Updating
  tip: Fix the module settings to match the new version's schema. The previous version
    continues to work. After fixing, the update will continue.
- case: update/preparing
  message: 'Update in progress: the new version is being applied; the previous version
    is still running'
  state: Updating
  tip: The previous version continues to run while the new version is applied. No
    action is required unless this state persists.
- case: update/HookInitializationFailed
  message: Update failed during hook synchronization; previous version is no longer
    running
  state: Failed
  tip: The module is not working. Check the new version's hook logs. Fix the hook/config
    or manually roll back the module version.
- case: update/HookFailed
  message: 'Update failed: startup or runtime hooks of the new version failed; previous
    version is no longer running'
  state: Failed
  tip: The module is not working. Check the new version's hook logs. Fix the hook/config
    or roll back the module version manually.
- case: update/ManifestsApplyFailed
  message: 'Update failed: Helm could not apply manifests for the new version; previous
    version is no longer running'
  state: Failed
  tip: Resources in the cluster are inconsistent. Check helm history and events in
    the d8-system namespace. Resolve resource conflicts. If needed, roll back manually
    via helm rollback.
- case: update/ScalingForbidden
  message: 'Update failed: the new version does not allow the requested replicas'
  state: Failed
  tip: The condition message names the workload. Change or remove its replicas in
    the module's resource requests; until then the replicas stay as they are.
- case: update/fallback
  message: 'Update failed: ReleaseDeleteFailed; previous version is no longer running'
  state: Failed
- case: update/Reconciling
  message: 'Update applied: the new version''s workload is rolling out'
  state: Updating
  tip: 'Wait for the rollout to finish. If it stalls, check pod status and events:
    a StatefulSet does not replace a pod that is not Ready, delete such a pod.'
- case: update/Degraded
  message: Update applied but the workload health monitor reports degraded
  state: Degraded
  tip: Check pod status and logs to identify the root cause. Roll back the module
    version if the new one cannot start.
- case: update/HealthUnknown
  message: 'Update applied: waiting for a workload the health monitor can confirm'
  state: Updating
  tip: Either no report has arrived yet, or the chart ships no Deployment or StatefulSet,
    the only kinds the health monitor watches.
- case: update/complete
  message: ""
  state: Ready
- case: reconcile/healthy
  message: ""
  state: Ready
- case: reconcile/Configuring
  message: 'Configuration in progress: new settings are being applied'
  state: Configuring
  tip: The module keeps working with the previous settings until the new ones are
    applied. No action is required unless this state persists.
- case: reconcile/SettingsInvalid
  message: 'Reconcile failed: new settings did not pass validation; previously applied
    configuration is still in effect'
  state: Degraded
  tip: The previous configuration continues to work. Fix the invalid fields in the
    module settings. After saving, the controller will re-apply the settings.
- case: reconcile/HookInitializationFailed
  message: 'Reconcile failed: hook synchronization phase failed; workload remains
    scaled but is no longer managed'
  state: Degraded
  tip: Pods are alive but the controller is not managing them. Check the failed hook
    logs. Fix the hook/config — the controller will retry reconcile.
- case: reconcile/HookFailed
  message: 'Reconcile failed: startup or runtime hooks failed; workload remains scaled
    but is no longer managed'
  state: Degraded
  tip: Pods are alive but the controller is not managing them. Check the failed hook
    logs. Fix the hook/config — the controller will retry reconcile.
- case: reconcile/ManifestsApplyFailed
  message: 'Reconcile failed: Helm could not apply manifests'
  state: Degraded
  tip: Check events in the d8-system namespace and helm history. Resolve resource
    conflicts (foreign ownership, finalizers, CRD mismatches). The controller will
    retry reconcile automatically.
- case: reconcile/ScalingForbidden
  message: 'Reconcile failed: the module does not allow the requested replicas; previously
    applied manifests stay in place'
  state: Degraded
  tip: The condition message names the workload. Change or remove its replicas in
    the module's resource requests; until then the replicas stay as they are.
- case: reconcile/fallback
  message: 'Reconcile failed: ReleaseDeleteFailed'
  state: Degraded
- case: reconcile/Reconciling
  message: 'Reconcile failed: workload is still reconciling'
  state: Degraded
  tip: 'Workload is still reconciling. Wait for the rollout to complete. If it stays
    in this state, check pod status and events: a StatefulSet does not replace a pod
    that is not Ready, delete such a pod.'
- case: reconcile/Degraded
  message: 'Reconcile failed: workload health monitor reports degraded'
  state: Degraded
  tip: Workload health monitor reports degraded. Check pod status and logs to identify
    the root cause.
- case: suspended/disabled
  message: 'Module is suspended: the module was disabled'
  state: Suspended
  tip: Enable the module to resume. The controller will restore all conditions and
    resume operation automatically.
- case: suspended/requirements
  message: 'Module is suspended: requirements unmet'
  state: Suspended
  tip: Solve the module requirements. After it, the controller will automatically
    restore all conditions and resume operation.
- case: suspended/failing disable
  message: 'Module is suspended: the module was disabled; the disable is failing:
    ReleaseDeleteFailed: boom'
  state: Suspended
  tip: Enable the module to resume. The controller will restore all conditions and
    resume operation automatically.
- case: deleting/uninstall failure
  message: 'Module is being deleted: HookFailed: boom'
  state: Deleting
  tip: No action is required. The resource disappears once its release is taken down.
