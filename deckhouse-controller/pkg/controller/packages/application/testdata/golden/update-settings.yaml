---
apiVersion: deckhouse.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - application.deckhouse.io/statistic-registered
  name: inherit-app
  namespace: foobar
  ownerReferences:
  - apiVersion: deckhouse.io/v1alpha1
    blockOwnerDeletion: true
    controller: false
    kind: ApplicationPackageVersion
    name: deckhouse-test-v1.0.1
    uid: version-uid
  - apiVersion: deckhouse.io/v1alpha1
    blockOwnerDeletion: true
    controller: false
    kind: ApplicationPackage
    name: test
    uid: package-uid
  resourceVersion: "3"
spec:
  packageName: test
  packageRepositoryName: deckhouse
  packageVersion: v1.0.1
status:
  lastAppliedConfiguration: null
  tracking: null
---
apiVersion: deckhouse.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - application.deckhouse.io/statistic-registered
  name: own-app
  namespace: foobar
  ownerReferences:
  - apiVersion: deckhouse.io/v1alpha1
    blockOwnerDeletion: true
    controller: false
    kind: ApplicationPackageVersion
    name: deckhouse-test-v1.0.1
    uid: version-uid
  - apiVersion: deckhouse.io/v1alpha1
    blockOwnerDeletion: true
    controller: false
    kind: ApplicationPackage
    name: test
    uid: package-uid
  resourceVersion: "3"
spec:
  packageName: test
  packageRepositoryName: deckhouse
  packageVersion: v1.0.1
  update:
    blockOnAlerts:
      enabled: true
      severity: 0
    mode: Manual
    windows:
    - days:
      - Sun
      from: "20:00"
      to: "23:30"
status:
  lastAppliedConfiguration: null
  tracking: null
---
apiVersion: deckhouse.io/v1alpha1
kind: ApplicationPackage
metadata:
  name: test
  resourceVersion: "3"
  uid: package-uid
status:
  availableRepositories:
  - deckhouse
  usedBy:
  - name: inherit-app
    namespace: foobar
    repositoryName: deckhouse
    version: v1.0.1
  - name: own-app
    namespace: foobar
    repositoryName: deckhouse
    version: v1.0.1
  usedByCount: 2
---
apiVersion: deckhouse.io/v1alpha1
kind: ApplicationPackageVersion
metadata:
  name: deckhouse-test-v1.0.1
  resourceVersion: "3"
  uid: version-uid
spec:
  packageName: test
  packageRepositoryName: deckhouse
  packageVersion: v1.0.1
status:
  usedBy:
  - name: inherit-app
    namespace: foobar
  - name: own-app
    namespace: foobar
  usedByCount: 2
---
apiVersion: deckhouse.io/v1alpha1
kind: PackageRepository
metadata:
  name: deckhouse
  resourceVersion: "1"
spec:
  registry:
    ca: test-ca
    dockerCfg: test-docker-cfg
    repo: registry.example.com/test
    scheme: https
status: {}
