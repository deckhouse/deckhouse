kind: ApplicationPackage
metadata:
  name: test
  resourceVersion: "1"
  uid: package-uid
status:
  availableRepositories:
  - deckhouse
  usedBy:
  - name: other-app
    namespace: foobar
    version: v1.0.1
  usedByCount: 1
---
apiVersion: deckhouse.io/v1alpha1
kind: ApplicationPackageVersion
