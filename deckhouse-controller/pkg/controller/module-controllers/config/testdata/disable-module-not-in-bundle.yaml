---
apiVersion: deckhouse.io/v1alpha1
kind: ModuleConfig
metadata:
  name: test-module
spec:
  version: 1
  settings:
    retentionDays: 15
---
apiVersion: deckhouse.io/v1alpha1
kind: Module
metadata:
  name: test-module
properties:
  source: test-source
  updatePolicy: Auto
  accessibility:
    editions:
      _default:
        available: true
        enabledInBundles:
          - Minimal
status:
  phase: Ready
  conditions:
    - type: EnabledByModuleConfig
      status: "True"
