---
apiVersion: deckhouse.io/v1alpha1
kind: ModuleConfig
metadata:
  name: test-module
spec:
  enabled: true
  updatePolicy: Auto
---
apiVersion: deckhouse.io/v1alpha1
kind: ModuleSource
metadata:
  name: test-source
spec:
  registry:
    repo: registry.example.com/modules
status:
  modules:
    - name: test-module
      version: v1.0.0
---
apiVersion: deckhouse.io/v1alpha1
kind: ModulePackage
metadata:
  name: test-module
status:
  availableRepositories:
    - test-source
