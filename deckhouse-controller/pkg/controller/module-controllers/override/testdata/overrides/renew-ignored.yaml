---
apiVersion: deckhouse.io/v1alpha2
kind: ModulePullOverride
metadata:
  name: test-module
  finalizers:
  - modules.deckhouse.io/mpo-finalizer
  annotations:
    modules.deckhouse.io/renew: "1"
spec:
  imageTag: main
  scanInterval: 15s
status:
  message: Ready
  imageDigest: sha256:cafe
---
apiVersion: deckhouse.io/v1alpha2
kind: Module
metadata:
  name: test-module
spec:
  packageRepositoryName: dev
  packageVersion: v1.0.0
status:
  conditions:
  - type: EnabledByModuleManager
    status: "True"
    reason: Enabled
    lastTransitionTime: "2000-01-01T00:00:00Z"
---
apiVersion: deckhouse.io/v1alpha1
kind: ModuleSource
metadata:
  name: dev
spec:
  registry:
    repo: registry.example.com/deckhouse/modules
    scheme: HTTPS
