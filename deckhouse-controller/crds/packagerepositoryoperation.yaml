---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: packagerepositoryoperations.deckhouse.io
spec:
  group: deckhouse.io
  names:
    kind: PackageRepositoryOperation
    listKind: PackageRepositoryOperationList
    plural: packagerepositoryoperations
    shortNames:
    - pro
    singular: packagerepositoryoperation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.packages.total
      name: Count
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Completed')].status
      name: Completed
      type: string
    - jsonPath: .status.conditions[?(@.type=='Completed')].message
      name: MSG
      type: string
    - jsonPath: .status.completionTime
      name: CompletionTime
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PackageRepositoryOperation represents an operation for scanning
          or updating a package repository.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.

              More info [in the Kubernetes documentation](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources)
            type: string
            x-doc-skip: true
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.

              More info [in the Kubernetes documentation](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds)
            type: string
            x-doc-skip: true
          metadata:
            type: object
            x-doc-skip: true
          spec:
            description: Package repository operation parameters.
            properties:
              packageRepositoryName:
                description: Name of the package repository for which the operation
                  is performed.
                type: string
                x-doc-examples:
                - deckhouse
              type:
                description: Operation type.
                enum:
                - Update
                type: string
              update:
                description: Update operation parameters.
                properties:
                  fullScan:
                    description: Indicates whether to perform a full scan of the package
                      repository.
                    type: boolean
                  timeout:
                    description: Operation timeout.
                    type: string
                    x-doc-examples:
                    - 5m
                type: object
            required:
            - packageRepositoryName
            - type
            type: object
          status:
            description: Current state of the package repository operation.
            properties:
              completionTime:
                description: Time when the operation completed.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions reflecting the current state of the operation.

                  The operation phase is determined by the `Completed` condition: while its status is `False`, the operation is in one of the intermediate phases (`Discover` or `Processing`). A `True` status indicates that the operation has completed with the `ScanSucceeded` or `ScanFailed` reason.
                items:
                  description: Condition reflecting an aspect of the current state
                    of the operation.
                  properties:
                    lastTransitionTime:
                      description: Time when the condition status last changed.
                      format: date-time
                      type: string
                    message:
                      description: Message with additional information about the condition.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        Value of `.metadata.generation` for which the condition was set.

                        Indicates whether the condition corresponds to the current generation of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        Programmatic identifier indicating the reason for the last condition status change.

                        For the `Completed` condition, possible values are `Discover`, `Processing`, `ScanSucceeded`, and `ScanFailed`.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                      x-doc-examples:
                      - Discover
                      - Processing
                      - Succeeded
                      - Failed
                    status:
                      description: Condition status.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        Condition type in CamelCase or in the format `foo.example.com/CamelCase`.

                        This resource uses the `Completed` condition, which indicates whether the operation has completed.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              packages:
                description: Information about packages processed during the operation.
                properties:
                  discovered:
                    description: |-
                      Packages discovered during the operation and awaiting processing.

                      The list is empty after the operation completes.
                    items:
                      properties:
                        name:
                          description: Name of the discovered package.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  failed:
                    description: Packages that could not be processed.
                    items:
                      properties:
                        errors:
                          description: Errors that occurred while processing the package.
                          items:
                            properties:
                              message:
                                description: Error message.
                                type: string
                              version:
                                description: Package version for which the error occurred.
                                type: string
                            required:
                            - message
                            - version
                            type: object
                          type: array
                        name:
                          description: Name of the package that could not be processed.
                          type: string
                      required:
                      - errors
                      - name
                      type: object
                    type: array
                  newVersionsOverall:
                    description: |-
                      Total number of new package versions discovered during the operation.

                      A version is considered new if the corresponding ApplicationPackageVersion or ModulePackageVersion did not exist in the cluster.

                      An ApplicationPackageVersion is also considered new if it was previously marked as missing from the container registry, but its image was discovered during the current operation.
                    type: integer
                  processed:
                    description: Successfully processed packages.
                    items:
                      properties:
                        foundVersions:
                          description: Number of package versions discovered during
                            the operation.
                          type: integer
                        name:
                          description: Name of the processed package.
                          type: string
                        newVersions:
                          description: |-
                            Number of new package versions discovered during the operation.

                            A version is considered new if the corresponding ApplicationPackageVersion or ModulePackageVersion did not exist in the cluster.

                            An ApplicationPackageVersion is also considered new if it was previously marked as missing from the container registry, but its image was discovered during the current operation.
                          type: integer
                        type:
                          description: Package type.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  processedOverall:
                    description: Total number of processed packages.
                    type: integer
                  total:
                    description: Total number of discovered packages.
                    type: integer
                type: object
              startTime:
                description: Time when the operation started.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
        x-doc-examples:
        - apiVersion: deckhouse.io/v1alpha1
          kind: PackageRepositoryOperation
          metadata:
            name: example
          spec:
            packageRepositoryName: deckhouse
            type: Update
            update:
              fullScan: false
              timeout: 5m
    served: true
    storage: true
    subresources:
      status: {}
