---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: applications.deckhouse.io
spec:
  group: deckhouse.io
  names:
    kind: Application
    listKind: ApplicationList
    plural: applications
    singular: application
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.packageName
      name: Package
      type: string
    - jsonPath: .status.currentVersion.version
      name: Version
      type: string
    - jsonPath: .spec.packageRepositoryName
      name: Repository
      priority: 1
      type: string
    - jsonPath: .status.summary.state
      name: State
      type: string
    - jsonPath: .status.conditions[?(@.type=='Installed')].status
      name: Installed
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      priority: 1
      type: string
    - jsonPath: .status.summary.message
      name: Message
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Application defines an installed application instance in a namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.

              More info [in the Kubernetes documentation](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources).
            type: string
            x-doc-skip: true
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.

              More info [in the Kubernetes documentation](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds).
            type: string
            x-doc-skip: true
          metadata:
            type: object
            x-doc-skip: true
          spec:
            description: Application configuration.
            properties:
              maintenance:
                description: |-
                  Application maintenance mode.

                  Supported modes:

                  - `NoResourceReconciliation`: A mode for developing or debugging the application.

                    In this mode:

                    - Configuration or hook changes are not reconciled, which prevents resources from being updated automatically.
                    - Resource monitoring is disabled, which prevents deleted resources from being restored.
                    - All the application's resources are labeled with `maintenance.deckhouse.io/no-resource-reconciliation`.
                    - The [`ApplicationIsInMaintenanceMode`](/products/kubernetes-platform/documentation/v1/reference/alerts.html#deckhouse-applicationisinmaintenancemode) alert is triggered.
                enum:
                - NoResourceReconciliation
                type: string
                x-doc-examples:
                - NoResourceReconciliation
              packageName:
                description: Name of the application package to install.
                type: string
                x-doc-examples:
                - console
              packageRepositoryName:
                description: Name of the PackageRepository object where the application
                  package is located.
                type: string
                x-doc-examples:
                - deckhouse
              packageVersion:
                description: Version of the application package to install.
                type: string
                x-doc-examples:
                - v1.0.0
              resourceRequests:
                description: |-
                  Resource settings and replica counts for workloads deployed by the application.

                  Specified values override the settings provided by the application package. Workloads and containers not listed in this parameter retain their settings from the package.

                  Each workload is identified by a combination of kind (`kind`) and name (`name`). Only one entry is allowed for each combination.
                items:
                  description: Resource settings and replica count for a single application
                    workload.
                  properties:
                    containers:
                      description: |-
                        Compute resources of the workload's containers.

                        If the specified container does not exist in the workload, the entry is ignored.
                      items:
                        description: Resource settings for a single workload container.
                        properties:
                          name:
                            description: Name of the container inside the workload.
                            minLength: 1
                            type: string
                            x-doc-examples:
                            - controller
                          resources:
                            description: |-
                              Container resource requests and limits.

                              Uses the same format as the `resources` field of a Pod container. Supports `cpu`, `memory`, and `ephemeral-storage`.

                              Specified values are merged with the settings from the application package separately for each resource. For example, if only `memory` is specified, the `cpu` value from the package is retained.

                              Resource requests or limits defined in the package cannot be removed. Their values can only be overridden.
                            properties:
                              claims:
                                description: |-
                                  List of resource claims used by the container.

                                  Each entry references a resource claim defined in `pod.spec.resourceClaims`. Requires the `DynamicResourceAllocation` feature gate to be enabled.

                                  This field is immutable. It can only be set for containers.
                                items:
                                  description: Resource claim used by the container.
                                  properties:
                                    name:
                                      description: |-
                                        Name of a ResourceClaim defined in `pod.spec.resourceClaims`.

                                        The referenced claim makes its resources available to the container.
                                      type: string
                                    request:
                                      description: |-
                                        Name of a request defined in the referenced resource claim.

                                        If specified, only the resources allocated for this request are made available to the container. If omitted, all resources allocated for the claim are made available.
                                      type: string
                                  required:
                                  - name
                                  type: object
                                type: array
                                x-kubernetes-list-map-keys:
                                - name
                                x-kubernetes-list-type: map
                              limits:
                                additionalProperties:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                description: Maximum amount of compute resources available
                                  to the container.
                                type: object
                              requests:
                                additionalProperties:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                description: |-
                                  Minimum amount of compute resources required by the container.

                                  If this parameter is not specified, the `limits` value is used if explicitly set. Otherwise, the value is implementation-defined.

                                  The `requests` value cannot exceed `limits`.
                                type: object
                            type: object
                        required:
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    kind:
                      description: Kind of workload for which resource settings are
                        specified.
                      enum:
                      - Deployment
                      - StatefulSet
                      - DaemonSet
                      - ReplicaSet
                      - Pod
                      - Job
                      - CronJob
                      type: string
                      x-doc-examples:
                      - Deployment
                    name:
                      description: Workload name as specified in the application package.
                      minLength: 1
                      type: string
                      x-doc-examples:
                      - controller
                    replicas:
                      description: |-
                        Number of workload replicas.

                        Applies only to workloads that support replica management: Deployment, StatefulSet, and ReplicaSet.
                      format: int32
                      minimum: 0
                      type: integer
                      x-doc-examples:
                      - 3
                  required:
                  - kind
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: replicas can only be set for Deployment, StatefulSet
                      and ReplicaSet
                    rule: 'has(self.replicas) ? self.kind in [''Deployment'',''StatefulSet'',''ReplicaSet'']
                      : true'
                type: array
                x-kubernetes-list-map-keys:
                - kind
                - name
                x-kubernetes-list-type: map
              settings:
                description: Configuration application settings.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              update:
                description: |-
                  Application update settings: update mode, update windows, and blocking updates when alerts are present.

                  If this parameter is not specified, the global [`applications.update`](global.html#parameters-applications-update) settings are used. If the global settings are also not specified, the Deckhouse Platform update settings are applied, as defined by the [`update`](/modules/deckhouse/configuration.html#parameters-update) parameter of the `deckhouse` module.

                  Update notifications cannot be configured separately for an application. If `applications.update` is configured, the global [`applications.update.notification`](global.html#parameters-applications-update-notification) settings are used. Otherwise, the Deckhouse Platform notification settings apply.
                properties:
                  blockOnAlerts:
                    description: Settings for blocking application updates while there
                      are alerts in the cluster.
                    properties:
                      enabled:
                        description: Indicates whether to block application updates
                          when the cluster has alerts with a severity level equal
                          to or higher than the value specified in the [`severity`](#application-v1alpha1-spec-update-blockonalerts-severity)
                          parameter.
                        type: boolean
                      severity:
                        default: 4
                        description: |-
                          Alert severity level at which updates are blocked.

                          Set as a value from `0` to `9`, where `0` is the highest severity and `9` is the lowest.
                        format: int32
                        maximum: 9
                        minimum: 0
                        type: integer
                    type: object
                  mode:
                    default: AutoPatch
                    description: |-
                      Update mode of the application on its [release channel](#application-v1alpha1-spec-releasechannel).

                      - `AutoPatch`: Automatic update mode for patch versions.

                        To change a minor version (for example, from `v1.2.*` to `v1.3.*`), confirmation is required.

                        A patch version update (for example, from `v1.3.1` to `v1.3.2`) is applied taking into account the [update windows](#application-v1alpha1-spec-update-windows), if they are set.

                      - `Auto`: Automatic update mode for all versions.

                        Minor version updates (for example, from `v1.2.*` to `v1.3.*`) and patch version updates (for example, from `v1.3.1` to `v1.3.2`) are applied taking into account the [update windows](#application-v1alpha1-spec-update-windows), if they are set.

                      - `Manual`: Manual update mode for all versions.

                        Confirmation is required for updating both minor and patch versions.
                    enum:
                    - AutoPatch
                    - Auto
                    - Manual
                    type: string
                    x-doc-examples:
                    - AutoPatch
                    - Auto
                    - Manual
                  windows:
                    description: List of application update windows.
                    items:
                      description: Time interval during the day when application updates
                        are allowed.
                      properties:
                        days:
                          description: |-
                            Days of the week on which the update window is applied.

                            If the parameter is omitted, the update window is applied every day.
                          items:
                            enum:
                            - Mon
                            - Tue
                            - Wed
                            - Thu
                            - Fri
                            - Sat
                            - Sun
                            type: string
                          type: array
                        from:
                          description: |-
                            Start time of the update window (UTC timezone).

                            Should be earlier than the end time of the update window.
                          pattern: ^(?:\d|[01]\d|2[0-3]):[0-5]\d$
                          type: string
                          x-doc-examples:
                          - "13:00"
                        to:
                          description: |-
                            End time of the update window (UTC timezone).

                            Should be later than the start time of the update window.
                          pattern: ^(?:\d|[01]\d|2[0-3]):[0-5]\d$
                          type: string
                          x-doc-examples:
                          - "18:30"
                      required:
                      - from
                      - to
                      type: object
                    type: array
                type: object
                x-doc-examples:
                - mode: Auto
                  windows:
                  - from: "8:00"
                    to: "15:00"
                    days:
                    - Tue
                    - Sat
                  blockOnAlerts:
                    enabled: true
                    severity: 2
            required:
            - packageName
            - packageVersion
            type: object
          status:
            description: Current state of the application.
            properties:
              conditions:
                description: Conditions reflecting the current state of the application.
                items:
                  description: Condition reflecting an aspect of the current state
                    of the application.
                  properties:
                    lastTransitionTime:
                      description: Time when the condition status last changed.
                      format: date-time
                      type: string
                    message:
                      description: Message with additional information about the condition.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        Value of `.metadata.generation` for which the condition was set.

                        Indicates whether the condition corresponds to the current generation of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: Programmatic identifier indicating the reason for
                        the last condition status change.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Condition status.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type in CamelCase or in the format `foo.example.com/CamelCase`.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentVersion:
                description: Information about the currently installed application
                  version.
                properties:
                  version:
                    description: Installed application version in SemVer format.
                    type: string
                type: object
              lastAppliedConfiguration:
                description: |-
                  Application configuration used during the last successful apply.

                  Includes user-defined settings and default values defined in the configuration schema.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              summary:
                description: |-
                  Summary of the application state, including messages and recommendations for the user.

                  The controller updates this information during each reconciliation. Each application has exactly one lifecycle state.

                  Use this information to display the application state in the web interface. Do not recalculate the state from conditions.
                properties:
                  message:
                    description: Description of the current application state.
                    type: string
                  state:
                    description: Current application lifecycle state.
                    type: string
                    x-doc-examples:
                    - Pending
                    - Failed
                    - Updating
                    - Configuring
                    - Ready
                    - Degraded
                    - Suspended
                    - Deleting
                  tip:
                    description: |-
                      Recommended action for the current application state.

                      May be empty if no additional action is required.
                    type: string
                type: object
              tracking:
                description: Nelm report on application status.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              urls:
                description: Application endpoint URLs obtained from Ingress resources
                  in the application chart with the `packages.deckhouse.io/application-endpoint-description`
                  annotation.
                items:
                  description: Application endpoint defined by an Ingress resource
                    in the application chart.
                  properties:
                    description:
                      description: |-
                        Endpoint description from the `packages.deckhouse.io/application-endpoint-description` annotation.

                        The description is empty if the annotation value is `"true"`.
                      type: string
                    url:
                      description: Application endpoint URL.
                      type: string
                  required:
                  - url
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
        x-doc-examples:
        - apiVersion: deckhouse.io/v1alpha1
          kind: Application
          metadata:
            name: example
          spec:
            maintenance: NoResourceReconciliation
            packageName: console
            packageRepositoryName: deckhouse
            packageVersion: v1.0.0
            releaseChannel: stable
    served: true
    storage: true
    subresources:
      status: {}
