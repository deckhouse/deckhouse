spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает установленный экземпляр приложения в неймспейсе.
          properties:
            apiVersion:
              description: |-
                Определяет версионированную схему этого представления объекта. Серверы должны преобразовывать распознанные схемы в последнее внутреннее значение и могут отклонять нераспознанные значения.

                Больше информации [в документации Kubernetes](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources).
            kind:
              description: |-
                Значение представляет REST-ресурс, который описывает данный объект. Серверы могут определить его по эндпоинту, к которому клиент отправляет запросы. Не может быть изменено. Используется в CamelCase.

                Больше информации [в документации Kubernetes](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds).
            spec:
              description: |
                Конфигурация приложения.
              properties:
                maintenance:
                  description: |
                    Режим обслуживания приложения.

                    Поддерживаемые режимы:

                    - `NoResourceReconciliation` — режим для разработки или отладки приложения.

                      В этом режиме:

                      - изменения в конфигурации или хуках приложения не синхронизируются, в результате чего ресурсы не обновляются автоматически;
                      - отключается мониторинг ресурсов приложения, в результате чего удалённые ресурсы не восстанавливаются;
                      - ко всем ресурсам приложения добавляется лейбл `maintenance.deckhouse.io/no-resource-reconciliation`;
                      - срабатывает [алерт `ApplicationIsInMaintenanceMode`](/products/kubernetes-platform/documentation/v1/reference/alerts.html#deckhouse-applicationisinmaintenancemode).
                packageName:
                  description: |
                    Имя пакета приложения, который нужно установить.
                packageRepositoryName:
                  description: |
                    Имя объекта PackageRepository, в котором находится пакет приложения.
                packageVersion:
                  description: |
                    Версия пакета приложения для установки.
                resourceRequests:
                  description: |
                    Настройки вычислительных ресурсов, количества реплик и размеров дисков нагрузок, развёртываемых приложением.

                    Указанные значения переопределяют настройки из пакета приложения. Для нагрузок, контейнеров и дисков, не перечисленных в этом параметре, сохраняются значения из пакета.

                    Каждая нагрузка определяется сочетанием типа (`kind`) и имени (`name`).
                    Для одного сочетания можно указать только одну запись.
                  items:
                    description: |
                      Настройки вычислительных ресурсов, количества реплик и размеров дисков одной нагрузки приложения.
                    properties:
                      kind:
                        description: |
                          Тип нагрузки, для которой задаются ресурсы.
                      name:
                        description: |
                          Имя нагрузки, указанное в пакете приложения.
                      replicas:
                        description: |
                          Количество реплик нагрузки.

                          Применяется только к нагрузкам, поддерживающим управление количеством реплик: Deployment, StatefulSet и ReplicaSet.

                          Если приложение развёртывает для нагрузки HorizontalPodAutoscaler, его параметрам `minReplicas` и `maxReplicas` присваивается это значение, поэтому количество реплик не меняется. Значение `0` применяется только к нагрузке: HorizontalPodAutoscaler не масштабирует нагрузку без реплик.
                      containers:
                        description: |
                          Настройки вычислительных ресурсов контейнеров нагрузки.

                          Если указанный контейнер отсутствует в нагрузке, запись игнорируется.
                        items:
                          description: |
                            Настройки вычислительных ресурсов одного контейнера нагрузки.
                          properties:
                            name:
                              description: |
                                Имя контейнера в составе нагрузки.
                            resources:
                              description: |
                                Вычислительные ресурсы, которые контейнер запрашивает и которыми ограничен.

                                Используется формат поля `resources` контейнера пода. Поддерживаются `cpu`, `memory` и `ephemeral-storage`.

                                Указанные значения объединяются с настройками из пакета приложения отдельно для каждого ресурса. Например, если указать только `memory`, значение `cpu` из пакета сохранится.

                                Удалить ограничение или запрос ресурсов, заданный в пакете, нельзя — можно только изменить его значение.

                                Если приложение развёртывает для нагрузки VerticalPodAutoscaler, указанные запросы `cpu` и `memory` записываются в его политику для контейнера одновременно как `minAllowed` и `maxAllowed`, поэтому VPA их не меняет. Если указаны ограничения `cpu` или `memory`, VPA не меняет ограничения контейнера (`controlledValues: RequestsOnly`).
                              properties:
                                claims:
                                  description: |-
                                    Список запросов ресурсов, используемых контейнером.

                                    Каждая запись ссылается на запрос ресурсов, определённый в `pod.spec.resourceClaims`. Для использования параметра необходимо включить feature gate `DynamicResourceAllocation`.

                                    Параметр неизменяемый и может быть указан только для контейнеров.
                                  items:
                                    description: |
                                      Запрос ресурсов, используемый контейнером.
                                    properties:
                                      name:
                                        description: |-
                                          Имя запроса ресурсов (ResourceClaim), определённого в `pod.spec.resourceClaims`.

                                          Ресурсы, выделенные по указанному запросу, становятся доступны контейнеру.
                                      request:
                                        description: |-
                                          Имя запроса, определённого в указанном ResourceClaim.

                                          Если параметр задан, контейнеру доступны только ресурсы, выделенные по этому запросу.
                                          Если параметр не указан, контейнеру доступны все ресурсы, выделенные по ResourceClaim.
                                requests:
                                  description: |
                                    Минимальный объём вычислительных ресурсов, который требуется контейнеру.

                                    Если параметр не указан, используется значение `limits`, если оно задано явно. В противном случае значение определяется реализацией.

                                    Значение `requests` не может превышать `limits`.
                                limits:
                                  description: |
                                    Максимальный объём вычислительных ресурсов, доступный контейнеру.
                      volumeClaimTemplates:
                        description: |
                          Размеры дисков, которые StatefulSet создаёт по шаблонам `volumeClaimTemplates`.

                          Применяется только к StatefulSet. Шаблон определяется именем — значением `metadata.name` элемента `spec.volumeClaimTemplates`. Если указанный шаблон отсутствует в StatefulSet, запись игнорируется.

                          Размер не может быть меньше размера существующих дисков: диск можно только расширить. Для расширения StorageClass дисков должен разрешать расширение томов (`allowVolumeExpansion: true`).
                        items:
                          description: |
                            Размер диска для одного шаблона `volumeClaimTemplates` StatefulSet.
                          properties:
                            name:
                              description: |
                                Имя шаблона в StatefulSet.
                            storage:
                              description: |
                                Размер диска, который создаётся по шаблону для каждой реплики StatefulSet.
                settings:
                  description: |
                    Настройки приложения.
                settingsVersion:
                  description: |
                    Версия схемы настроек, для которой написаны настройки. Не связана с `packageVersion`, которая выбирает пакет приложения.

                    Настройки более старой версии конвертируются в последнюю версию, которую предоставляет пакет. Если параметр не указан, используется версия 1.
                update:
                  description: |
                    Настройки обновления приложения: режим обновления, окна обновлений и блокировка обновлений при наличии алертов.

                    Если параметр не указан, приложение использует глобальные настройки [`applications.update`](global.html#parameters-applications-update). Если не заданы и они, используются настройки обновления Deckhouse Platform, заданные в параметре [`update`](/modules/deckhouse/configuration.html#parameters-update) модуля `deckhouse`.

                    Оповещения об обновлении для отдельного приложения не настраиваются. Если настроен `applications.update`, используются глобальные настройки
                    [`applications.update.notification`](global.html#parameters-applications-update-notification).
                    В противном случае применяются настройки оповещений Deckhouse Platform.
                  properties:
                    mode:
                      description: |
                        Режим обновления приложения на его [канале обновлений](#application-v1alpha1-spec-releasechannel).

                        - `AutoPatch` — автоматический режим обновления для патч-версий.

                          Для обновления минорной версии (например, с `v1.2.*` на `v1.3.*`) необходимо подтверждение.

                          Обновление патч-версии (например, с `v1.3.1` на `v1.3.2`) применяется с учетом [окон обновлений](#application-v1alpha1-spec-update-windows), если они заданы.

                        - `Auto` — автоматический режим обновления для всех версий.

                          Обновления минорной версии (например, с `v1.2.*` на `v1.3.*`) и патч-версии (например, с `v1.3.1` на `v1.3.2`) применяются с учетом [окон обновлений](#application-v1alpha1-spec-update-windows), если они заданы.

                        - `Manual` — ручной режим обновления для всех версий.

                          Для обновления и минорной, и патч-версии необходимо подтверждение.
                    windows:
                      description: |
                        Список окон обновления приложения.
                      items:
                        description: |
                          Интервал времени в течение суток, в который разрешено обновление приложения.
                        properties:
                          from:
                            description: |
                              Время начала окна обновления (в часовом поясе UTC).

                              Должно быть раньше времени окончания окна обновления.
                          to:
                            description: |
                              Время окончания окна обновления (в часовом поясе UTC).

                              Должно быть позже времени начала окна обновления.
                          days:
                            description: |
                              Дни недели, в которые применяется окно обновлений.

                              Если параметр не указан, окно обновлений действует ежедневно.
                    blockOnAlerts:
                      description: |
                        Настройки блокировки обновления приложения при наличии алертов в кластере.
                      properties:
                        enabled:
                          description: |
                            Указывает, блокировать ли обновления приложения при наличии в кластере алертов с уровнем критичности, равным значению параметра [`severity`](#application-v1alpha1-spec-update-blockonalerts-severity) или выше.
                        severity:
                          description: |
                            Уровень критичности алертов, которые блокируют обновления.

                            Указывается в виде значения от `0` до `9`, где `0` — наивысший уровень критичности, а `9` — наименьший.
            status:
              description: |
                Текущее состояние приложения.
              properties:
                tracking:
                  description: |
                    Отчёт Nelm о состоянии приложения.
                lastAppliedConfiguration:
                  description: |
                    Конфигурация приложения, использованная при последнем успешном применении.

                    Включает пользовательские настройки и значения по умолчанию, определённые в схеме конфигурации.
                summary:
                  description: |
                    Сводная информация о состоянии приложения, включая сообщения и рекомендации для пользователя.

                    Контроллер обновляет эту информацию при каждой синхронизации. Каждому приложению соответствует одно состояние жизненного цикла.

                    Используйте эти данные для отображения состояния приложения в веб-интерфейсе. Не вычисляйте состояние повторно на основе условий (`conditions`).
                  properties:
                    state:
                      description: |
                        Текущее состояние жизненного цикла приложения.
                    message:
                      description: |
                        Описание текущего состояния приложения.
                    tip:
                      description: |
                        Рекомендация по действиям в текущем состоянии приложения.

                        Может быть пустой, если дополнительные действия не требуются.
                conditions:
                  description: |
                    Условия, отражающие текущее состояние приложения.
                  items:
                    description: |
                      Условие, отражающее один из аспектов текущего состояния приложения.
                    properties:
                      lastTransitionTime:
                        description: |
                          Время последнего изменения статуса условия.
                      message:
                        description: |
                          Сообщение с дополнительной информацией об условии.
                      observedGeneration:
                        description: |
                          Значение `.metadata.generation`, для которого установлено условие.

                          Позволяет определить, соответствует ли условие текущей версии объекта.
                      reason:
                        description: |
                          Программный идентификатор причины последнего изменения статуса условия.
                      status:
                        description: |
                          Статус условия.
                      type:
                        description: |
                          Тип условия в CamelCase или в формате `foo.example.com/CamelCase`.
                currentVersion:
                  description: |
                    Информация о текущей установленной версии приложения.
                  properties:
                    version:
                      description: |
                        Версия установленного приложения в формате SemVer.
                update:
                  description: |
                    Обновление приложения: план обновления и версия, на которую автоматическое обновление перейдет следующей.

                    Пусто до установки первой версии.
                  properties:
                    plan:
                      description: |
                        Путь обновления после версии автоматического обновления в любом режиме обновления: каждый шаг — самая новая версия, на которую можно обновиться с предыдущей по ее правилам совместимости.
                    automaticVersion:
                      description: |
                        Версия, которую автоматическое обновление установит следующей. Меняется только после того, как предыдущая установлена и готова. Пусто в режиме обновления `Manual`.
                urls:
                  description: |
                    URL-адреса эндпоинтов приложения, полученные из Ingress-ресурсов чарта приложения с аннотацией `packages.deckhouse.io/application-endpoint-description`.
                  items:
                    description: |
                      Эндпоинт приложения, построенный на основе Ingress-ресурса чарта приложения.
                    properties:
                      description:
                        description: |
                          Описание эндпоинта из аннотации `packages.deckhouse.io/application-endpoint-description`.

                          Если значение аннотации равно `"true"`, описание отсутствует.
                      url:
                        description: |
                          URL-адрес эндпоинта приложения.
