spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Представляет экземпляр приложения в пространстве имён.
          properties:
            apiVersion:
              description: |-
                Определяет версионированную схему этого представления объекта. Серверы должны преобразовывать распознанные схемы в последнее внутреннее значение и могут отклонять нераспознанные значения.

                Больше информации [в документации Kubernetes](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources).
            kind:
              description: |-
                Значение представляет REST-ресурс, который описывает данный объект. Серверы могут определить его по эндпоинту, к которому клиент отправляет запросы. Не может быть изменено. Используется в CamelCase.

                Больше информации [в документации Kubernetes](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds).
            spec:
              description: |
                Определяет конфигурацию приложения.
              properties:
                maintenance:
                  description: |
                    Задаёт режим обслуживания приложения.

                    - `NoResourceReconciliation` — режим для разработки или отладки приложения.

                      В этом режиме:

                      - изменения в конфигурации или хуках приложения не синхронизируются, в результате чего ресурсы не обновляются автоматически;
                      - отключается мониторинг ресурсов приложения, в результате чего удалённые ресурсы не восстанавливаются;
                      - ко всем ресурсам приложения добавляется метка `maintenance.deckhouse.io/no-resource-reconciliation`;
                      - срабатывает [алерт `ApplicationIsInMaintenanceMode`](/products/kubernetes-platform/documentation/v1/reference/alerts.html#deckhouse-applicationisinmaintenancemode).
                packageName:
                  description: |
                    Имя пакета приложения, который нужно установить.
                packageRepositoryName:
                  description: |
                    Имя PackageRepository, в котором находится пакет.
                packageVersion:
                  description: |
                    Версия пакета приложения для установки.
                releaseChannel:
                  description: |
                    Канал обновлений пакета приложения.
                resourceRequests:
                  description: |
                    Ресурсный профиль нагрузок, которые разворачивает приложение: сколько реплик
                    работает у каждой нагрузки и сколько ресурсов разрешено потреблять её контейнерам.
                    Записи переопределяют то, что поставляется в пакете приложения; нагрузка или
                    контейнер, которых нет в списке, сохраняют значения из пакета.

                    Нагрузка адресуется парой «kind — name», поэтому на каждую пару приходится
                    не более одной записи.
                  items:
                    description: |
                      Ресурсный профиль одной нагрузки, которую разворачивает приложение.
                    properties:
                      kind:
                        description: |
                          Тип нагрузки, для которой задаются ресурсы.
                      name:
                        description: |
                          Имя нагрузки, для которой задаются ресурсы, — такое же, как в пакете приложения.
                      replicas:
                        description: |
                          Количество реплик нагрузки. Имеет смысл только для типов, у которых есть
                          счётчик реплик: `Deployment`, `StatefulSet` и `ReplicaSet`.
                      containers:
                        description: |
                          Вычислительные ресурсы контейнеров нагрузки. Контейнер, которого у нагрузки
                          нет, игнорируется.
                        items:
                          description: |
                            Вычислительные ресурсы одного контейнера внутри нагрузки.
                          properties:
                            name:
                              description: |
                                Имя контейнера внутри нагрузки.
                            resources:
                              description: |
                                Вычислительные ресурсы, которые контейнер запрашивает и которыми ограничен, —
                                в том же виде, что и `resources` у контейнера пода: `cpu`, `memory`
                                и `ephemeral-storage` для диска.

                                Значения объединяются с тем, что поставляется в пакете, по каждому
                                ресурсу отдельно: если задать только `memory`, `cpu` из пакета
                                останется. Убрать ресурс, объявленный в пакете, здесь нельзя —
                                можно только задать ему другое значение.
                              properties:
                                requests:
                                  description: |
                                    Минимальный объём вычислительных ресурсов, который требуется контейнеру.
                                    Если `requests` не указан, используется значение `limits`, если оно
                                    задано явно, иначе — значение, определяемое реализацией.
                                    `requests` не может превышать `limits`.
                                limits:
                                  description: |
                                    Максимальный объём вычислительных ресурсов, доступный контейнеру.
                settings:
                  description: |
                    Настройки приложения.
                update:
                  description: |
                    Настройки обновления приложения: режим обновления, окна обновлений и блокировка обновления при наличии алертов.

                    Если параметр не указан, приложение использует глобальные настройки [`applications.update`](global.html#parameters-applications-update). Если не заданы и они, используются настройки обновления Deckhouse — параметр [`update`](/modules/deckhouse/configuration.html#parameters-update) модуля `deckhouse`.

                    Оповещения об обновлении для отдельного приложения не настраиваются. Приложение всегда использует глобальные настройки: [`applications.update.notification`](global.html#parameters-applications-update-notification), если заданы глобальные настройки `applications.update`, и настройки оповещений Deckhouse в остальных случаях.
                  properties:
                    mode:
                      description: |
                        Режим обновления приложения на его [канале обновлений](#application-v1alpha1-spec-releasechannel).

                        - `AutoPatch` — автоматический режим обновления для патч-версий.

                          Для обновления минорной версии (например, с `v1.2.*` на `v1.3.*`) необходимо подтверждение.

                          Обновление патч-версии (например, с `v1.3.1` на `v1.3.2`) применяется с учетом [окон обновлений](#application-v1alpha1-spec-update-windows), если они заданы.
                        - `Auto` — автоматический режим обновления для всех версий.

                          Обновления минорной версии (например, с `v1.2.*` на `v1.3.*`) и патч-версии (например, с `v1.3.1` на `v1.3.2`) применяются с учетом [окон обновлений](#application-v1alpha1-spec-update-windows), если они заданы.
                        - `Manual` — ручной режим обновления для всех версий.

                          Для обновления и минорной, и патч-версии необходимо подтверждение.
                    windows:
                      description: |
                        Список окон обновлений в течение суток.
                      items:
                        description: |
                          Интервал времени в течение суток, в который приложение может обновляться.
                        properties:
                          from:
                            description: |
                              Время начала окна обновления (в часовом поясе UTC).

                              Должно быть меньше времени окончания окна обновления.
                          to:
                            description: |
                              Время окончания окна обновления (в часовом поясе UTC).

                              Должно быть больше времени начала окна обновления.
                          days:
                            description: |
                              Дни недели, в которые применяется окно обновлений.

                              Если параметр не указан, окно обновлений применяется каждый день.
                    blockOnAlerts:
                      description: |
                        Настройки блокировки обновления приложения при наличии алертов в кластере.
                      properties:
                        enabled:
                          description: |
                            Если включено, обновление приложения блокируется, пока в кластере есть алерты с уровнем серьезности, равным указанному в параметре [`severity`](#application-v1alpha1-spec-update-blockonalerts-severity) или выше.
                        severity:
                          description: |
                            Уровень серьезности алертов, которые блокируют обновление.

                            Уровень серьезности — число от 0 до 9, где 0 — наибольшая серьезность, а 9 — наименьшая.
            status:
              description: |
                Статус приложения.
              properties:
                tracking:
                  description: |
                    Отчёт Nelm об отслеживании ресурсов.
                lastAppliedConfiguration:
                  description: |
                    Конфигурация (пользовательские настройки с учётом значений по умолчанию
                    из схемы конфигурации), на основе которой было выполнено последнее успешное применение.
                summary:
                  description: |
                    Агрегированная сводка состояния приложения, сообщения и подсказки для пользователя.
                    Контроллер заполняет её при каждой синхронизации — каждое приложение соответствует
                    ровно одному состоянию жизненного цикла; это единый источник истины для UI:
                    клиентам не следует вычислять эти значения повторно из conditions.
                  properties:
                    state:
                      description: |
                        Высокоуровневое состояние жизненного цикла приложения.
                        Всегда одно из: Pending, Failed, Updating, Ready, Degraded, Suspended, Deleting.
                    message:
                      description: |
                        Описание текущего состояния.
                    tip:
                      description: |
                        Подсказка о том, что нужно сделать в текущем состоянии.
                        Пустая, если действий не требуется.
                conditions:
                  description: |
                    Условия, отражающие последние наблюдения за состоянием приложения.
                  items:
                    description: |
                      Условие, описывающее один аспект текущего состояния приложения.
                    properties:
                      lastTransitionTime:
                        description: |
                          Последнее время перехода условия из одного статуса в другой.
                      message:
                        description: |
                          Сообщение с деталями перехода.
                      observedGeneration:
                        description: |
                          Значение `.metadata.generation`, на котором было установлено условие.
                          Позволяет определить актуальность условия для текущего состояния ресурса.
                      reason:
                        description: |
                          Программный идентификатор причины последнего перехода условия.
                      status:
                        description: |
                          Статус условия. Может быть `True`, `False` или `Unknown`.
                      type:
                        description: |
                          Тип условия приложения в CamelCase или в формате `foo.example.com/CamelCase`.
                currentVersion:
                  description: |
                    Информация о текущей установленной версии.
                  properties:
                    channel:
                      description: |
                        Канал обновлений, из которого установлена версия.
                    version:
                      description: |
                        Версия установленного приложения в формате SemVer.
                urls:
                  description: |
                    URL эндпоинтов приложения, собранные из Ingress-ресурсов
                    чарта приложения с аннотацией `packages.deckhouse.io/application-endpoint-description`.
                  items:
                    description: |
                      Один эндпоинт приложения, построенный на основе Ingress-ресурса чарта приложения.
                    properties:
                      description:
                        description: |
                          Описание эндпоинта, взятое из значения аннотации
                          `packages.deckhouse.io/application-endpoint-description`.

                          Пустое, если значение аннотации равно `"true"`.
                      url:
                        description: |
                          URL-адрес эндпоинта приложения.
