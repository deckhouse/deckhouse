---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: packagerepositories.deckhouse.io
spec:
  group: deckhouse.io
  names:
    kind: PackageRepository
    listKind: PackageRepositoryList
    plural: packagerepositories
    singular: packagerepository
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lastScanTime
      name: Scan
      type: date
    - jsonPath: .spec.registry.repo
      name: Repository
      type: string
    - jsonPath: .status.packagesCount
      name: Packages
      type: integer
    - jsonPath: .status.conditions[?(@.type=='LastScanSucceeded')].message
      name: MSG
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PackageRepository defines a package repository available in Deckhouse
          Platform.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.

              More info [in the Kubernetes documentation](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources).
            type: string
            x-doc-skip: true
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.

              More info [in the Kubernetes documentation](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds).
            type: string
            x-doc-skip: true
          metadata:
            type: object
            x-doc-skip: true
          spec:
            description: Package repository configuration.
            properties:
              registry:
                description: Access parameters for the container registry where the
                  package repository is located.
                properties:
                  ca:
                    description: |-
                      Root certificate in PEM format used to verify the TLS certificate of the container registry when connecting over HTTPS.

                      Used if the registry uses self-signed SSL certificates.
                    type: string
                    x-doc-examples:
                    - <PEM-encoded CA certificate>
                  dockerCfg:
                    description: |-
                      Container registry access configuration in `~/.docker/config.json` format, encoded in Base64.

                      Leave this field empty for anonymous access.
                    type: string
                    x-doc-examples:
                    - <base64 encoded credentials>
                    x-kubernetes-sensitive-data: true
                  login:
                    description: Username for authenticating to the container registry.
                    type: string
                    x-doc-examples:
                    - admin
                    x-kubernetes-sensitive-data: true
                  password:
                    description: Password for authenticating to the container registry.
                    type: string
                    x-doc-examples:
                    - <password>
                    x-kubernetes-sensitive-data: true
                  repo:
                    description: Address of the package repository in the container
                      registry.
                    type: string
                    x-doc-examples:
                    - registry.example.io/packages
                  scheme:
                    description: Protocol used to access the package repository, for
                      example, `https`.
                    type: string
                    x-doc-examples:
                    - https
                required:
                - repo
                type: object
              scanInterval:
                description: Interval between automatic scans of the package repository
                  for discovering new packages and versions.
                pattern: ^(\d+h)?(\d+m)?(\d+s)?$
                type: string
                x-doc-default: 6h
                x-doc-examples:
                - 5m
                - 1h
                - 6h30m
            required:
            - registry
            type: object
          status:
            description: Current state of the package repository.
            properties:
              conditions:
                description: Conditions reflecting the current state of the package
                  repository.
                items:
                  description: Condition reflecting an aspect of the current state
                    of the package repository.
                  properties:
                    lastTransitionTime:
                      description: Time when the condition status last changed.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        Message with additional information about the condition.

                        May be empty.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        Value of `.metadata.generation` for which the condition was set.

                        Indicates whether the condition corresponds to the current generation of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: Programmatic identifier indicating the reason for
                        the last condition status change.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Condition status.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type in CamelCase or in the format `foo.example.com/CamelCase`.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastChangeTime:
                description: |-
                  Time of the last scan that discovered at least one new package version.

                  If no new versions are discovered, the value is not updated.
                format: date-time
                type: string
              lastNewVersions:
                description: |-
                  Number of new package versions discovered during the last scan.

                  Equals `0` if no new versions were discovered.
                type: integer
              lastScanTime:
                description: |-
                  Time of the last successfully completed scan.

                  If a scan fails, the value is not updated, and the error is reflected in the `LastScanSucceeded` condition.
                format: date-time
                type: string
              message:
                description: Message with additional information about the state of
                  the package repository.
                type: string
              packages:
                description: List of packages available in the repository.
                items:
                  properties:
                    name:
                      description: Package name.
                      type: string
                    type:
                      description: Package type.
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              packagesCount:
                description: Total number of packages in the repository.
                type: integer
              phase:
                description: Current phase of the repository.
                type: string
            type: object
        required:
        - spec
        type: object
        x-doc-examples:
        - apiVersion: deckhouse.io/v1alpha1
          kind: PackageRepository
          metadata:
            name: example
          spec:
            registry:
              ca: <PEM-encoded CA certificate>
              dockerCfg: <base64 encoded credentials>
              login: admin
              password: <password>
              repo: registry.example.io/packages
              scheme: https
            scanInterval: 5m
    served: true
    storage: true
    subresources:
      status: {}
