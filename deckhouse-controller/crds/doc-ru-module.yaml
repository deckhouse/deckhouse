spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает состояние модуля в кластере. Объект `Module` будет создан автоматически после настройки источника модулей ([ModuleSource](#modulesource)) и успешной синхронизации.

          properties:
            properties:
              properties:
                weight:
                  description: |
                    _Вес_ (приоритет) модуля.
                availableSources:
                  description: Доступные источники для скачивания модуля.
                source:
                  description: Источник, из которого скачан модуль (иначе пусто).
                namespace:
                  type: string
                  description: Пространство имен в котором работает модуль.
                subsystems:
                  type: array
                  description: Подсистемы в которые входит модуль.
                  items:
                    type: string
                releaseChannel:
                  description: Релизный канал модуля.
                updatePolicy:
                  description: Имя политики обновления модуля.
                stage:
                  description: Текущая стадия жизненного цикла модуля.
                critical:
                  description: Является ли модуль критичным.
                version:
                  description: Версия модуля.
                exclusiveGroup:
                  description: Принадлежность модуля к группе, где может быть активен только один модуль.
                disableOptions:
                  description: Параметры защиты от отключения модуля.
                  properties:
                    message:
                      description: |-
                        Устарело: используйте поле `messages` с локализованными значениями `ru`/`en`.
                    messages:
                      description: |-
                        Тексты предупреждений об отключении модуля на разных языках.
                        
                        Если для выбранного языка текст не задан, используется значение поля `message`.
                requirements:
                  description: Зависимости модуля — набор условий, которые должны выполняться чтобы Deckhouse Platform (DP) мог запустить модуль.
                  properties:
                    deckhouse:
                      description: Требование к версии Deckhouse.
                    kubernetes:
                      description: Требование к версии Kubernetes.
                    bootstrapped:
                      description: Требование к статусу установки кластера (только для встроенных модулей DP).
                    modules:
                      description: Список других включенных модулей, которые необходимы для работы модуля.
                accessibility:
                  type: object
                  description: Настройки доступности модуля.
                  properties:
                    editions:
                      description: Настройки работы модуля в редакциях Deckhouse.
            status:
              properties:
                hooksState:
                  description: Отчёт о состоянии хуков.
                phase:
                  description: Фаза модуля.
    - name: v1beta1
      schema:
        openAPIV3Schema:
          description: |
            Экземпляр модуля, управляемый через пакетную систему.
          properties:
            spec:
              description: |
                Определяет конфигурацию модуля.
              properties:
                enabled:
                  description: |
                    Включает или выключает модуль. Если не задано, решение принимает платформа.
                maintenance:
                  description: |
                    Задаёт режим обслуживания модуля.

                    - `NoResourceReconciliation` — автономный режим для разработки или отладки модуля.

                      В этом режиме:

                      - изменения в конфигурации или хуках модуля не синхронизируются, в результате чего ресурсы не обновляются автоматически;
                      - отключается мониторинг ресурсов модуля, в результате чего удалённые ресурсы не восстанавливаются;
                      - ко всем ресурсам модуля применяется лейбл `maintenance.deckhouse.io/no-resource-reconciliation`;
                      - срабатывает алерт `ModuleIsInMaintenanceMode`.
                packageRepositoryName:
                  description: |
                    Название репозитория, где находится пакет.
                    Если не указано, используется репозиторий по умолчанию.
                packageVersion:
                  description: |
                    Версия пакета модуля для установки.
                releaseChannel:
                  description: |
                    Канал релиза для пакета модуля.
                settings:
                  description: |
                    Настройки конфигурации для модуля.
                settingsVersion:
                  description: |
                    Версия схемы настроек. Не путать с `packageVersion`, который выбирает пакет модуля.
                update:
                  description: |
                    Настройки обновления модуля: режим обновления, окна обновлений и блокировка обновлений при наличии алертов.

                    Если параметр не указан, используются настройки обновления Deckhouse Platform.
                  properties:
                    mode:
                      description: |
                        Режим обновления модуля на его канале обновлений.

                        - `AutoPatch` — автоматический режим обновления для патч-версий.

                          Для обновления минорной версии (например, с `v1.2.*` на `v1.3.*`) необходимо подтверждение.

                          Обновление патч-версии (например, с `v1.3.1` на `v1.3.2`) применяется с учетом окон обновлений, если они заданы.

                        - `Auto` — автоматический режим обновления для всех версий.

                          Обновления минорной версии (например, с `v1.2.*` на `v1.3.*`) и патч-версии (например, с `v1.3.1` на `v1.3.2`) применяются с учетом окон обновлений, если они заданы.

                        - `Manual` — ручной режим обновления для всех версий.

                          Для обновления и минорной, и патч-версии необходимо подтверждение.
                    windows:
                      description: |
                        Список окон обновления модуля.
                      items:
                        description: |
                          Интервал времени в течение суток, в который разрешено обновление модуля.
                        properties:
                          from:
                            description: |
                              Время начала окна обновления (в часовом поясе UTC).

                              Должно быть раньше времени окончания окна обновления.
                          to:
                            description: |
                              Время окончания окна обновления (в часовом поясе UTC).

                              Должно быть позже времени начала окна обновления.
                          days:
                            description: |
                              Дни недели, в которые применяется окно обновлений.

                              Если параметр не указан, окно обновлений действует ежедневно.
                    blockOnAlerts:
                      description: |
                        Настройки блокировки обновления модуля при наличии алертов в кластере.
                      properties:
                        enabled:
                          description: |
                            Указывает, блокировать ли обновления модуля при наличии в кластере алертов с уровнем критичности, равным значению параметра `severity` или выше.
                        severity:
                          description: |
                            Уровень критичности алертов, которые блокируют обновления.

                            Указывается в виде значения от `0` до `9`, где `0` — наивысший уровень критичности, а `9` — наименьший.
            status:
              description: |
                Статус модуля.
              properties:
                enabled:
                  description: |
                    Показывает, включён ли модуль: итог решения по `spec.enabled` с учётом набора модулей редакции, enabled-скрипта и зависимостей модуля. Может отличаться от `spec.enabled` — например, явно включённый модуль остаётся выключенным, пока выключен модуль, от которого он зависит. Отсутствует до первого решения.
                tracking:
                  description: |
                    Отображение Nelm-трекинга.
                lastAppliedConfiguration:
                  description: |
                    Конфигурация (пользовательские настройки с учётом значений по умолчанию
                    из схемы конфигурации), на основе которой было выполнено последнее успешное применение.
                summary:
                  description: |
                    Агрегированная сводка состояния модуля, сообщения и подсказки для пользователя.
                    Контроллер заполняет её при каждой синхронизации — каждый модуль соответствует
                    ровно одному состоянию жизненного цикла; это единый источник истины для UI:
                    клиентам не следует вычислять эти значения повторно из conditions.
                    Отсутствует только до первого вычисления статуса.
                  properties:
                    state:
                      description: |
                        Высокоуровневое состояние жизненного цикла модуля.
                        Всегда одно из: Pending, Failed, Updating, Configuring, Ready, Degraded, Suspended, Deleting.
                    message:
                      description: |
                        Человеко-читаемое описание текущего состояния.
                    tip:
                      description: |
                        Человеко-читаемая инструкция о том, как разрешить текущее состояние.
                        Пустое значение, если действий не требуется.
                conditions:
                  description: |
                    Условия, отражающие последние наблюдения за состоянием модуля.
                  items:
                    description: |
                      Условие, описывающее один аспект текущего состояния модуля.
                    properties:
                      lastTransitionTime:
                        description: |
                          Последнее время перехода условия из одного статуса в другой.
                      message:
                        description: |
                          Человеко-читаемое сообщение, указывающее детали перехода.
                      observedGeneration:
                        description: |
                          Значение `.metadata.generation`, на котором было установлено условие.
                          Позволяет определить актуальность условия для текущего состояния ресурса.
                      reason:
                        description: |
                          Программный идентификатор причины последнего перехода условия.
                      status:
                        description: |
                          Статус условия. Может быть `True`, `False` или `Unknown`.
                      type:
                        description: |
                          Тип условия в CamelCase или в формате `foo.example.com/CamelCase`.
                currentVersion:
                  description: |
                    Информация о текущей установленной версии.
                  properties:
                    channel:
                      description: |
                        Канал релиза, из которого была установлена версия.
                    version:
                      description: |
                        Семантическая версия установленного модуля.
