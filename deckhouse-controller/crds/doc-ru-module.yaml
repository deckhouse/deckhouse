spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает состояние модуля в кластере. Объект `Module` будет создан автоматически после настройки источника модулей ([ModuleSource](#modulesource)) и успешной синхронизации.

          properties:
            properties:
              properties:
                weight:
                  description: |
                    _Вес_ (приоритет) модуля.
                availableSources:
                  description: Доступные источники для скачивания модуля.
                source:
                  description: Источник, из которого скачан модуль (иначе пусто).
                namespace:
                  type: string
                  description: Пространство имен в котором работает модуль.
                subsystems:
                  type: array
                  description: Подсистемы в которые входит модуль.
                  items:
                    type: string
                releaseChannel:
                  description: Релизный канал модуля.
                updatePolicy:
                  description: Имя политики обновления модуля.
                stage:
                  description: Текущая стадия жизненного цикла модуля.
                critical:
                  description: Является ли модуль критичным.
                version:
                  description: Версия модуля.
                exclusiveGroup:
                  description: Принадлежность модуля к группе, где может быть активен только один модуль.
                disableOptions:
                  description: Параметры защиты от отключения модуля.
                  properties:
                    messages:
                      description: |-
                        Тексты предупреждений об отключении модуля на разных языках.
                        
                        Если для выбранного языка текст не задан, используется значение поля `message`.
                requirements:
                  description: Зависимости модуля — набор условий, которые должны выполняться чтобы Deckhouse Kubernetes Platform (DKP) мог запустить модуль.
                  properties:
                    deckhouse:
                      description: Требование к версии Deckhouse.
                    kubernetes:
                      description: Требование к версии Kubernetes.
                    bootstrapped:
                      description: Требование к статусу установки кластера (только для встроенных модулей DKP).
                    modules:
                      description: Список других включенных модулей, которые необходимы для работы модуля.
                accessibility:
                  type: object
                  description: Настройки доступности модуля.
                  properties:
                    editions:
                      description: Настройки работы модуля в редакциях Deckhouse.
    - name: v1alpha2
      schema:
        openAPIV3Schema:
          description: |
            Представляет экземпляр модуля, управляемый через систему пакетов.
          properties:
            spec:
              description: |
                Определяет поведение модуля.
              properties:
                packageName:
                  description: |
                    Название пакета модуля для установки.
                packageRepositoryName:
                  description: |
                    Название репозитория, где находится пакет.
                    Если не указано, используется репозиторий по умолчанию.
                packageVersion:
                  description: |
                    Версия пакета модуля для установки.
                releaseChannel:
                  description: |
                    Канал релиза для пакета модуля.
                settings:
                  description: |
                    Настройки конфигурации для модуля.
            status:
              description: |
                Статус модуля.
              properties:
                conditions:
                  description: |
                    Условия, отражающие последние наблюдения за состоянием модуля.
                  items:
                    description: |
                      Условие, описывающее один аспект текущего состояния модуля.
                    properties:
                      lastTransitionTime:
                        description: |
                          Последнее время перехода условия из одного статуса в другой.
                      message:
                        description: |
                          Человеко-читаемое сообщение, указывающее детали перехода.
                      observedGeneration:
                        description: |
                          Значение `.metadata.generation`, на котором было установлено условие.
                          Позволяет определить актуальность условия для текущего состояния ресурса.
                      reason:
                        description: |
                          Программный идентификатор причины последнего перехода условия.
                      status:
                        description: |
                          Статус условия. Может быть `True`, `False` или `Unknown`.
                      type:
                        description: |
                          Тип условия в CamelCase или в формате `foo.example.com/CamelCase`.
                currentVersion:
                  description: |
                    Информация о текущей установленной версии.
                  properties:
                    channel:
                      description: |
                        Канал релиза, из которого была установлена версия.
                    version:
                      description: |
                        Семантическая версия установленного модуля.
                internalConditions:
                  description: |
                    Внутренние условия модуля.
                  items:
                    description: |
                      Условие, описывающее один аспект текущего состояния модуля.
                    properties:
                      lastTransitionTime:
                        description: |
                          Последнее время перехода условия из одного статуса в другой.
                      message:
                        description: |
                          Человеко-читаемое сообщение, указывающее детали перехода.
                      observedGeneration:
                        description: |
                          Значение `.metadata.generation`, на котором было установлено условие.
                          Позволяет определить актуальность условия для текущего состояния ресурса.
                      reason:
                        description: |
                          Программный идентификатор причины последнего перехода условия.
                      status:
                        description: |
                          Статус условия. Может быть `True`, `False` или `Unknown`.
                      type:
                        description: |
                          Тип условия в CamelCase или в формате `foo.example.com/CamelCase`.
                resourceConditions:
                  description: |
                    Условия, связанные с ресурсами модуля.
                  items:
                    description: |
                      Условие, описывающее один аспект текущего состояния модуля.
                    properties:
                      lastTransitionTime:
                        description: |
                          Последнее время перехода условия из одного статуса в другой.
                      message:
                        description: |
                          Человеко-читаемое сообщение, указывающее детали перехода.
                      observedGeneration:
                        description: |
                          Значение `.metadata.generation`, на котором было установлено условие.
                          Позволяет определить актуальность условия для текущего состояния ресурса.
                      reason:
                        description: |
                          Программный идентификатор причины последнего перехода условия.
                      status:
                        description: |
                          Статус условия. Может быть `True`, `False` или `Unknown`.
                      type:
                        description: |
                          Тип условия в CamelCase или в формате `foo.example.com/CamelCase`.