spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает пакет приложения, доступный для установки.
          properties:
            apiVersion:
              description: |-
                Определяет версионированную схему этого представления объекта. Серверы должны преобразовывать распознанные схемы в последнее внутреннее значение и могут отклонять нераспознанные значения.

                Больше информации [в документации Kubernetes](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources).
            kind:
              description: |-
                Значение представляет REST-ресурс, который описывает данный объект. Серверы могут определить его по эндпоинту, к которому клиент отправляет запросы. Не может быть изменено. Используется в CamelCase.

                Больше информации [в документации Kubernetes](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds).
            status:
              description: |
                Текущее состояние пакета приложения.
              properties:
                availableRepositories:
                  description: |
                    Список имён репозиториев, в которых доступен пакет приложения.
                releaseChannels:
                  description: |
                    Версии пакета приложения, связанные с каналами обновлений в каждом репозитории.

                    Ключ первого уровня — имя репозитория пакетов, второго — имя канала обновлений.
                usedBy:
                  description: |
                    Список приложений, установленных из данного пакета.
                  items:
                    description: |
                      Приложение, установленное из данного пакета.
                    properties:
                      name:
                        description: |
                          Имя экземпляра приложения.
                      namespace:
                        description: |
                          Неймспейс, в котором установлено приложение.
                      repositoryName:
                        description: Имя PackageRepository, из которого установлено приложение.
                        type: string
                      version:
                        description: |
                          Версия пакета, используемая приложением.
                usedByCount:
                  description: |
                    Количество приложений, установленных из этого пакета.

                    Соответствует количеству элементов в `usedBy`.
