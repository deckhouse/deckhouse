spec:
  group: deckhouse.io
  scope: Cluster
  names:
    kind: EffectiveLicense
    listKind: EffectiveLicenseList
    plural: effectivelicenses
    singular: effectivelicense
    shortNames:
    - el
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |
          Сводная лицензионная политика одного продукта.

          Объект целиком вычисляется контроллером по всем установленным ресурсам `ClusterLicense`,
          настроек у него нет. Экземпляр, описывающий саму платформу, называется `deckhouse-platform`.
          У лицензий на отдельные продукты будут свои объекты того же вида, вычисленные из тех же ключей:
          один ключ может нести записи нескольких продуктов, поэтому ключ и состояние продукта — разные
          объекты.

          Всё, что показывает Console, приходит отсюда уже посчитанным: Console не раскладывает узлы сама,
          иначе она и кластер разошлись бы.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          status:
            properties:
              allocation:
                description: |
                  Итоги раскладки узлов — числа, которые Console показывает рядом с каждой группой.

                  Ёмкость по-прежнему один пул, `vCPU + 2 * cores`; раскладка добавляет к нему привязку.
                  Каждый лицензируемый узел отнесён ровно к одной метрике, чтобы Console могла назвать
                  лицензию, которой покрыт конкретный узел. Узел не делится между двумя метриками: он
                  занимает `vCPU`, пока в `vCPU` есть место, и стекает в `cores` только когда места нет.
                properties:
                  cores:
                    description: |
                      Метрика `cores` — платит за узлы, уже не поместившиеся в `vCPU`. Узел стоит ей
                      `ceil(vCPU / 2)` по временному правилу «2 vCPU = 1 ядро».
                    properties:
                      limit:
                        description: |
                          Выданное число ядер. Отсутствует, если метрика безлимитна.
                        type: integer
                      unlimited:
                        description: |
                          Даёт ли ключ метрику без лимита. В этом случае `limit` отсутствует.
                        type: boolean
                      used:
                        description: Ядра, занятые узлами этой метрики.
                        type: integer
                    type: object
                  servers:
                    description: |
                      Лицензии на узел целиком. Применяются к самым крупным узлам; всё, что не поместилось,
                      стекает в `vCPU`, а затем в `cores`, поэтому саму эту метрику превысить нельзя.
                    properties:
                      limit:
                        description: |
                          Выданное число серверных лицензий. Отсутствует, если метрика безлимитна.
                        type: integer
                      unlimited:
                        description: |
                          Даёт ли ключ метрику без лимита. В этом случае `limit` отсутствует.
                        type: boolean
                      used:
                        description: Число узлов, занявших серверную лицензию.
                        type: integer
                    type: object
                  unlicensed:
                    description: |
                      Узлы, не поместившиеся ни в одну из трёх метрик. Непустая группа — единственный способ
                      нарушить лицензию; именно это делает лицензию бинарной для пользователя: она либо
                      действует, либо нет.
                    properties:
                      nodes:
                        description: Число узлов, не покрытых лицензией.
                        type: integer
                      vCPU:
                        description: vCPU узлов, не покрытых лицензией.
                        type: integer
                    type: object
                  vCPU:
                    description: |
                      Метрика `vCPU` — платит за узлы, оставшиеся после `servers`. Узел стоит ей все свои vCPU.
                    properties:
                      limit:
                        description: |
                          Выданное число vCPU. Отсутствует, если метрика безлимитна.
                        type: integer
                      unlimited:
                        description: |
                          Даёт ли ключ метрику без лимита. В этом случае `limit` отсутствует.
                        type: boolean
                      used:
                        description: vCPU, занятые узлами этой метрики.
                        type: integer
                    type: object
                type: object
              compliance:
                description: Сводное состояние соответствия лицензии.
                properties:
                  reason:
                    description: |
                      Что привело к состоянию, отличному от `Valid`.

                      * `Unregistered` — ключ никогда не устанавливался.
                      * `Expired` — все записи истекли.
                      * `Revoked` — запись отозвана по коммерческому основанию: grace-период не применяется.
                      * `UnlicensedNodes` — часть узлов не покрыта лицензией.
                      * `ExpiringSoon` — ключ истекает менее чем через 30 дней.
                    type: string
                  since:
                    description: |
                      Когда состояние было принято. `null`, пока контроллер не наблюдал ни одного перехода.
                    type: string
                  state:
                    description: |
                      * `Valid` — все узлы покрыты и ничто не истекает в ближайшее время.
                      * `Warning` — нелицензированные узлы появились менее 7 суток назад либо ключ истекает
                        менее чем через 30 дней. Кластер при этом лицензирован.
                      * `Grace` — все записи истекли, идёт grace-период.
                      * `Violation` — grace-период закончился, запись отозвана по коммерческому основанию
                        либо нелицензированные узлы держатся 7 суток непрерывно.
                      * `NoUpdateRight` — зарезервировано, в этом релизе не вычисляется.
                    type: string
                type: object
              consumption:
                description: |
                  Потребление кластера по лицензируемым узлам. Ровно эти числа уходят в файл данных кластера.
                properties:
                  cores:
                    description: '`ceil(vCPU / 2)`, считается на сумме, а не по узлам.'
                    type: integer
                  freeNodes:
                    description: |
                      Число узлов, не вошедших в метрики: узлы платформы без пользовательской нагрузки.
                    type: integer
                  servers:
                    description: Число лицензируемых узлов.
                    type: integer
                  vCPU:
                    description: Сумма vCPU лицензируемых узлов, каждый округлён вверх до целого.
                    type: integer
                type: object
              conditions:
                description: |
                  Условия отражают последние наблюдения за лицензионной политикой.

                  * `LimitsSatisfied` — все лицензируемые узлы покрыты.
                  * `KeyExpiring` — ключ истекает менее чем через 30 дней.
                  * `KeyRejected` — есть отклонённая запись или отклонённый ключ, с которым нужно разобраться.
                  * `SupersedeCycle` — записи гасят друг друга по циклу, поэтому исключены все.
                items:
                  properties:
                    lastTransitionTime:
                      description: Когда условие в последний раз изменило состояние.
                      type: string
                    message:
                      description: Подробности перехода, понятные человеку.
                      type: string
                    observedGeneration:
                      description: Поколение объекта, по которому вычислено условие.
                      type: integer
                    reason:
                      description: Машиночитаемая причина последнего перехода.
                      type: string
                    status:
                      description: Состояние условия — `True`, `False` или `Unknown`.
                      type: string
                    type:
                      description: Тип условия.
                      type: string
                  type: object
                type: array
              key:
                description: |
                  Действующий лицензионный ключ. Отсутствует, пока в кластере нет ни одного ключа.

                  Записи внутри ключа могут иметь разные сроки — так перевыпуск кодирует уже оплаченный
                  остаток рядом с новым. Здесь этого не видно: для пользователя лицензия действует до одной
                  даты.
                properties:
                  customerName:
                    description: Клиент, которому выдан ключ.
                    type: string
                  graceDays:
                    description: |
                      Grace-период в днях, взятый из записи, истекающей последней.
                    type: integer
                  jti:
                    description: Claim `jti` ключа.
                    type: string
                  name:
                    description: Имя объекта `ClusterLicense`, несущего ключ.
                    type: string
                  origin:
                    description: 'Происхождение ключа: `purchase`, `demo` или `self-service`.'
                    type: string
                  validUntil:
                    description: |
                      Максимальный срок истечения среди записей ключа. `null` для бессрочного ключа.
                    type: string
                type: object
              licensed:
                description: |
                  Бинарный ответ — единственное, что Console показывает крупно.

                  `true` при состоянии `Valid` и `Warning`, `false` при `Grace`, `Violation`
                  и `NoUpdateRight`.
                type: boolean
              limits:
                description: |
                  Квота, которую дают действующие прямо сейчас записи, просуммированная по метрикам
                  (ADR 14.3).
                properties:
                  grantedBy:
                    description: |
                      Все записи, стоящие за метрикой, по имени метрики. Служебное поле: показывает, какая
                      запись удержала квоту, когда истекла другая. В Console не показывается.
                    type: object
                  unlimited:
                    description: Метрики, оставшиеся без лимита.
                    type: array
                  values:
                    description: |
                      Суммарная квота по имени метрики: `servers`, `vCPU`, `cores` и всё, что добавит
                      более новый ключ.

                      `null` означает безлимит; отсутствующий ключ — что метрику не назвала ни одна
                      действующая запись.
                    type: object
                type: object
              nodes:
                description: |
                  Полная раскладка, включая бесплатные узлы, отсортированная по размеру внутри каждой группы.

                  Console показывает этот список как есть. Он же — то состояние, которое читает правило
                  устойчивости: узел, уже занявший серверную лицензию, сохраняет её, пока остаётся самым
                  крупным.
                items:
                  properties:
                    billing:
                      description: |
                        * `Free` — узел платформы без пользовательской нагрузки, причина в `reason`.
                        * `Server` — покрыт лицензией на узел целиком.
                        * `VCPU` — оплачен метрикой `vCPU`.
                        * `Cores` — оплачен метрикой `cores`.
                        * `Unlicensed` — не покрыт вовсе.
                      type: string
                    name:
                      description: Имя узла.
                      type: string
                    reason:
                      description: |
                        Почему узел бесплатен. Заполняется только для группы `Free`.
                      type: string
                    vCPU:
                      description: Мощность узла в vCPU, округлённая вверх до целого.
                      type: integer
                  type: object
                type: array
              overLimitSince:
                description: |
                  Когда появились нелицензированные узлы. `null`, пока покрыты все узлы.

                  Через семь суток после этого момента состояние становится `Violation`; обратно в `Valid`
                  оно возвращается с первого же пересчёта, нашедшего все узлы покрытыми.
                type: string
              registrationRequest:
                description: |
                  Файл данных кластера — голый compact JWT, который передают серверу лицензий файлом
                  `deckhouse-cluster-<первые 8 символов cluster_id>-<YYYYMMDD>.jwt`.

                  Пересобирается, когда меняются принятые записи, установленные ключи или потребление.
                  Несёт только числа: имена узлов и раскладка кластер не покидают.
                type: string
            type: object
        type: object
