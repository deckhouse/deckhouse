---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: applicationpackageversions.deckhouse.io
spec:
  group: deckhouse.io
  names:
    kind: ApplicationPackageVersion
    listKind: ApplicationPackageVersionList
    plural: applicationpackageversions
    shortNames:
    - apv
    singular: applicationpackageversion
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.packageName
      name: Package
      type: string
    - jsonPath: .spec.packageRepositoryName
      name: Repository
      type: string
    - jsonPath: .status.conditions[?(@.type=='MetadataLoaded')].status
      name: MetadataLoaded
      type: string
    - jsonPath: .status.usedByCount
      name: UsedBy
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=='MetadataLoaded')].lastTransitionTime
      name: TransitionTime
      priority: 1
      type: date
    - jsonPath: .status.conditions[?(@.type=='MetadataLoaded')].message
      name: Message
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ApplicationPackageVersion defines a version of an application
          package.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.

              More info [in the Kubernetes documentation](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources)
            type: string
            x-doc-skip: true
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.

              More info [in the Kubernetes documentation](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds)
            type: string
            x-doc-skip: true
          metadata:
            type: object
            x-doc-skip: true
          spec:
            description: Application package version parameters.
            properties:
              packageName:
                description: Name of the application package.
                minLength: 1
                type: string
                x-doc-examples:
                - console
                x-kubernetes-validations:
                - message: packageName is immutable
                  rule: self == oldSelf
              packageRepositoryName:
                description: Name of the package repository containing the package.
                minLength: 1
                type: string
                x-doc-examples:
                - deckhouse
                x-kubernetes-validations:
                - message: packageRepositoryName is immutable
                  rule: self == oldSelf
              packageVersion:
                description: Version of the application package.
                minLength: 1
                type: string
                x-doc-examples:
                - v1.0.0
                x-kubernetes-validations:
                - message: packageVersion is immutable
                  rule: self == oldSelf
            required:
            - packageName
            - packageRepositoryName
            - packageVersion
            type: object
          status:
            description: Current state of the application package version.
            properties:
              conditions:
                description: Conditions reflecting the current state of the application
                  package version.
                items:
                  description: Condition reflecting an aspect of the current state
                    of the package version.
                  properties:
                    lastTransitionTime:
                      description: Time when the condition status last changed.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        Message with additional information about the condition.

                        May be empty.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        Value of `.metadata.generation` for which the condition was set.

                        Indicates whether the condition corresponds to the current generation of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: Programmatic identifier indicating the reason for
                        the last condition status change.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Condition status.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type in CamelCase or in the format `foo.example.com/CamelCase`.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  Value of `.metadata.generation` for which the current status was calculated.

                  If the value is lower than the current `.metadata.generation`, the status does not yet reflect the latest changes to the instance.
                format: int64
                minimum: 0
                type: integer
              packageMetadata:
                description: Application package version metadata, including the description,
                  requirements, disable options, and version compatibility rules.
                properties:
                  category:
                    description: Application package category.
                    type: string
                  changelog:
                    description: Information about changes in this package version.
                    properties:
                      features:
                        description: List of new features in this package version.
                        items:
                          type: string
                        type: array
                      fixes:
                        description: List of bugs fixed in this package version.
                        items:
                          type: string
                        type: array
                    type: object
                  description:
                    description: Localized descriptions of the application package.
                    properties:
                      en:
                        description: English description of the application package.
                        type: string
                      ru:
                        description: Russian description of the application package.
                        type: string
                    type: object
                  disableOptions:
                    description: Parameters of package disable protection.
                    properties:
                      confirmation:
                        description: Indicates whether confirmation is required to
                          disable the application package.
                        type: boolean
                      messages:
                        description: Localized messages displayed when confirming
                          package disabling.
                        properties:
                          en:
                            description: Disable confirmation message in English.
                            type: string
                          ru:
                            description: Disable confirmation message in Russian.
                            type: string
                        type: object
                    type: object
                  licensing:
                    description: Application package licensing information for different
                      editions.
                    properties:
                      editions:
                        additionalProperties:
                          properties:
                            available:
                              description: Indicates whether the edition is available
                                for use.
                              type: boolean
                            enabledInBundles:
                              description: |-
                                Bundles in which the package is enabled by default in this edition.

                                Not used for application packages.
                              items:
                                type: string
                              type: array
                          type: object
                        description: Licensing settings for different application
                          package editions.
                        type: object
                    type: object
                  requirements:
                    description: System requirements for installing and running the
                      application.
                    properties:
                      deckhouse:
                        description: Required Deckhouse Platform version.
                        properties:
                          constraint:
                            description: Deckhouse Platform version constraint in
                              SemVer format.
                            type: string
                        type: object
                      kubernetes:
                        description: Required Kubernetes version.
                        properties:
                          constraint:
                            description: Kubernetes version constraint in SemVer format.
                            type: string
                        type: object
                      modules:
                        description: 'Deckhouse Platform module requirements: required
                          and optional dependencies, groups of alternative modules,
                          and groups of incompatible modules.'
                        properties:
                          anyOf:
                            description: |-
                              Groups of alternative modules.

                              At least one module in each group must be enabled. If a version constraint is specified for a module, its version must satisfy that constraint.

                              These groups do not add edges to the dependency graph.
                            items:
                              description: Group of alternative modules, at least
                                one of which must be enabled.
                              properties:
                                description:
                                  description: Human-readable description of the group's
                                    purpose.
                                  type: string
                                modules:
                                  description: Alternative modules in the group.
                                  items:
                                    description: |-
                                      Module with an optional version constraint in SemVer format.

                                      If no constraint is specified, any version is allowed.
                                    properties:
                                      constraint:
                                        description: Module version constraint in
                                          SemVer format.
                                        type: string
                                      name:
                                        description: Module name.
                                        minLength: 1
                                        type: string
                                    required:
                                    - name
                                    type: object
                                  type: array
                                name:
                                  description: Stable identifier used by the scheduler
                                    in diagnostics.
                                  minLength: 1
                                  type: string
                              required:
                              - modules
                              - name
                              type: object
                            type: array
                          conditional:
                            description: |-
                              Optional modules with version constraints.

                              The module does not have to be enabled. If it is enabled, its version must satisfy the specified constraint.

                              Replaces the deprecated `!optional` suffix from the v1 requirements format.
                            items:
                              description: |-
                                Optional module with a version constraint in SemVer format.

                                If no constraint is specified, any version is allowed.
                              properties:
                                constraint:
                                  description: Module version constraint in SemVer
                                    format.
                                  type: string
                                name:
                                  description: Module name.
                                  minLength: 1
                                  type: string
                              required:
                              - name
                              type: object
                            type: array
                          mandatory:
                            description: |-
                              Modules required for the application to run.

                              Each specified module must be enabled. If a version constraint is specified, the module version must satisfy it.
                            items:
                              description: |-
                                Required module with an optional version constraint in SemVer format.

                                If no constraint is specified, any version is allowed.
                              properties:
                                constraint:
                                  description: Module version constraint in SemVer
                                    format.
                                  type: string
                                name:
                                  description: Module name.
                                  minLength: 1
                                  type: string
                              required:
                              - name
                              type: object
                            type: array
                          noneOf:
                            description: |-
                              Groups of incompatible modules.

                              For the application to run, none of the modules in these groups may be enabled with an incompatible version.

                              If no version constraint is specified, all versions of the module are considered incompatible. If a constraint is specified, only versions satisfying that constraint are considered incompatible.

                              These groups do not add edges to the dependency graph.
                            items:
                              description: |-
                                Group of incompatible modules.

                                None of the listed modules may be enabled with an incompatible version.
                              properties:
                                description:
                                  description: Human-readable description of the group's
                                    purpose.
                                  type: string
                                modules:
                                  description: Incompatible modules in the group.
                                  items:
                                    description: |-
                                      Module with an optional version constraint in SemVer format.

                                      If no constraint is specified, all versions of the module are considered incompatible.
                                    properties:
                                      constraint:
                                        description: Module version constraint in
                                          SemVer format defining the range of incompatible
                                          versions.
                                        type: string
                                      name:
                                        description: Module name.
                                        minLength: 1
                                        type: string
                                    required:
                                    - name
                                    type: object
                                  type: array
                                name:
                                  description: Stable identifier used by the scheduler
                                    in diagnostics.
                                  minLength: 1
                                  type: string
                              required:
                              - modules
                              - name
                              type: object
                            type: array
                        type: object
                    type: object
                  stage:
                    description: Life cycle stage of the application package.
                    type: string
                    x-doc-examples:
                    - Experimental
                    - Preview
                    - General Availability
                    - Deprecated
                  versionCompatibilityRules:
                    default: {}
                    description: Version compatibility rules for upgrades and downgrades.
                    properties:
                      downgrade:
                        default:
                          step:
                            major: 0
                            minor: 0
                            patches: -1
                        description: Compatibility rules for downgrading from this
                          application version.
                        properties:
                          step:
                            description: Compatibility rule step.
                            properties:
                              major:
                                description: |-
                                  Number of major versions that can be skipped during a downgrade.

                                  The `-1` value removes all limits, `0` forbids the change.

                                  Defaults to `0`.
                                format: int32
                                minimum: -1
                                type: integer
                              minor:
                                description: |-
                                  Number of minor versions that can be skipped during a downgrade.

                                  The `-1` value removes all limits, `0` forbids the change.

                                  Defaults to `0`.
                                format: int32
                                minimum: -1
                                type: integer
                              patches:
                                description: |-
                                  Number of patch versions that can be skipped during a downgrade.

                                  The `-1` value removes all limits, `0` forbids the change.

                                  Defaults to `-1`.
                                format: int32
                                minimum: -1
                                type: integer
                            type: object
                        type: object
                      upgrade:
                        default:
                          step:
                            major: 0
                            minor: 1
                            patches: -1
                        description: Compatibility rules for upgrading to this application
                          version.
                        properties:
                          step:
                            description: Compatibility rule step.
                            properties:
                              major:
                                description: |-
                                  Number of major versions that can be skipped during an upgrade.

                                  The `-1` value removes all limits, `0` forbids the change.

                                  Defaults to `0`.
                                format: int32
                                minimum: -1
                                type: integer
                              minor:
                                description: |-
                                  Number of minor versions that can be skipped during an upgrade.

                                  The `-1` value removes all limits, `0` forbids the change.

                                  Defaults to `1`.
                                format: int32
                                minimum: -1
                                type: integer
                              patches:
                                description: |-
                                  Number of patch versions that can be skipped during an upgrade.

                                  The `-1` value removes all limits, `0` forbids the change.

                                  Defaults to `-1`.
                                format: int32
                                minimum: -1
                                type: integer
                            type: object
                        type: object
                    type: object
                type: object
              packageSchemas:
                description: OpenAPI schemas for validating user-defined application
                  settings and final values passed to package hooks and templates.
                properties:
                  settingsConversions:
                    description: |-
                      Conversions that bring settings written for an older settings schema version to the latest one, ordered by version.

                      Empty when the package has a single settings schema version.
                    items:
                      description: PackageSettingsConversion converts settings of
                        the previous settings schema version to Version.
                      properties:
                        descriptions:
                          description: Localized description of the changes in this
                            settings schema version.
                          properties:
                            en:
                              description: English description of the conversion.
                              type: string
                            ru:
                              description: Russian description of the conversion.
                              type: string
                          type: object
                        expr:
                          description: jq expressions applied to the settings in order.
                          items:
                            type: string
                          type: array
                        version:
                          description: Settings schema version the conversion produces;
                            it converts settings of the previous version.
                          type: integer
                      required:
                      - expr
                      - version
                      type: object
                    type: array
                  settingsSchema:
                    description: |-
                      OpenAPI v3 schema for validating user-defined application settings in `Application.spec.settings`.

                      The schema is stored as an opaque object because it has a recursive JSON Schema structure. The controller validates it when loading the package metadata.
                    type: object
                    x-kubernetes-map-type: atomic
                    x-kubernetes-preserve-unknown-fields: true
                  valuesSchema:
                    description: |-
                      OpenAPI v3 schema for validating the final set of `values` passed to package hooks and templates.

                      The final set is formed by merging default values with user-defined application settings.

                      The schema is stored as an opaque object because it has a recursive JSON Schema structure. The controller validates it when loading the package metadata.
                    type: object
                    x-kubernetes-map-type: atomic
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              usedBy:
                description: List of applications installed from this package version.
                items:
                  description: Application installed from the package version.
                  properties:
                    name:
                      description: Name of the application instance.
                      type: string
                    namespace:
                      description: Namespace where the application is installed.
                      type: string
                  type: object
                type: array
              usedByCount:
                description: |-
                  Number of applications installed from this package version.

                  Equals the number of entries in `usedBy`.
                format: int32
                minimum: 0
                type: integer
            type: object
        type: object
        x-doc-examples:
        - apiVersion: deckhouse.io/v1alpha1
          kind: ApplicationPackageVersion
          metadata:
            name: example
          spec:
            packageName: console
            packageRepositoryName: deckhouse
            packageVersion: v1.0.0
    served: true
    storage: true
    subresources:
      status: {}
