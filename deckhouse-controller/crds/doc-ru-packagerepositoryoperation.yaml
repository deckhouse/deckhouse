spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает операцию сканирования или обновления репозитория пакетов.
          properties:
            apiVersion:
              description: |-
                Определяет версионированную схему этого представления объекта. Серверы должны преобразовывать распознанные схемы в последнее внутреннее значение и могут отклонять нераспознанные значения.

                Больше информации [в документации Kubernetes](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources).
            kind:
              description: |-
                Значение представляет REST-ресурс, который описывает данный объект. Серверы могут определить его по эндпоинту, к которому клиент отправляет запросы. Не может быть изменено. Используется в CamelCase.

                Больше информации [в документации Kubernetes](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds).
            spec:
              description: |
                Параметры операции над репозиторием пакетов.
              properties:
                packageRepositoryName:
                  description: |
                    Имя репозитория пакетов, над которым выполняется операция.
                type:
                  description: |
                    Тип операции.
                update:
                  description: |
                    Параметры операции обновления.
                  properties:
                    fullScan:
                      description: |
                        Указывает, выполнять ли полное сканирование репозитория пакетов.
                    timeout:
                      description: |
                        Тайм-аут операции.
            status:
              description: |
                Текущее состояние операции над репозиторием пакетов.
              properties:
                completionTime:
                  description: |
                    Время завершения операции.
                conditions:
                  description: |
                    Условия, отражающие текущее состояние операции.

                    Фаза операции определяется условием `Completed`: пока его статус — `False`,
                    операция находится в одной из промежуточных фаз (`Discover` или `Processing`).
                    Статус `True` означает, что операция завершена с причиной `ScanSucceeded` или `ScanFailed`.
                  items:
                    description: |
                      Условие, описывающее один из аспектов текущего состояния операции.
                    properties:
                      lastTransitionTime:
                        description: |
                          Время последнего изменения статуса условия.
                      message:
                        description: |
                          Сообщение с дополнительной информацией об условии.
                      observedGeneration:
                        description: |
                          Значение `.metadata.generation`, для которого установлено условие.

                          Позволяет определить, соответствует ли условие текущей версии объекта.
                      reason:
                        description: |
                          Программный идентификатор причины последнего изменения статуса условия.

                          Для условия `Completed` используются значения `Discover`, `Processing`, `ScanSucceeded` и `ScanFailed`.
                      status:
                        description: |
                          Статус условия.
                      type:
                        description: |
                          Тип условия в CamelCase или в формате `foo.example.com/CamelCase`.

                          Для данного ресурса используется условие `Completed`, которое указывает, завершена ли операция.
                packages:
                  description: |
                    Информация о пакетах, обработанных во время операции.
                  properties:
                    discovered:
                      description: |
                        Пакеты, обнаруженные во время операции и ожидающие обработки.

                        После завершения операции список пуст.
                      items:
                        properties:
                          name:
                            description: |
                              Имя обнаруженного пакета.
                    failed:
                      description: |
                        Пакеты, которые не удалось обработать.
                      items:
                        properties:
                          errors:
                            description: |
                              Ошибки, возникшие при обработке пакета.
                            items:
                              properties:
                                message:
                                  description: |
                                    Сообщение об ошибке.
                                version:
                                  description: |
                                    Версия пакета, при обработке которой возникла ошибка.
                          name:
                            description: |
                              Имя пакета, который не удалось обработать.
                    processed:
                      description: |
                        Успешно обработанные пакеты.
                      items:
                        properties:
                          name:
                            description: |
                              Имя обработанного пакета.
                          type:
                            description: |
                              Тип пакета.
                          foundVersions:
                            description: |
                              Количество версий пакета, найденных в рамках операции.
                          newVersions:
                            description: |
                              Количество новых версий пакета, найденных в ходе операции.

                              Версия считается новой, если соответствующий ApplicationPackageVersion или ModulePackageVersion отсутствовал в кластере.

                              Версия ApplicationPackageVersion также считается новой, если ранее она была отмечена как отсутствующая в хранилище образов контейнеров, но её образ был обнаружен в ходе текущей операции.
                    processedOverall:
                      description: |
                        Общее количество обработанных пакетов.
                    total:
                      description: |
                        Общее количество обнаруженных пакетов.
                    newVersionsOverall:
                      description: |
                        Общее количество новых версий пакетов, найденных в ходе операции.

                        Версия считается новой, если соответствующий ApplicationPackageVersion или ModulePackageVersion отсутствовал в кластере.

                        Версия ApplicationPackageVersion также считается новой, если ранее она была отмечена как отсутствующая в хранилище образов контейнеров, но её образ был обнаружен в ходе текущей операции.
                startTime:
                  description: |
                    Время начала операции.
