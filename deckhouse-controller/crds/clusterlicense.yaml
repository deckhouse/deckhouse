---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterlicenses.deckhouse.io
  labels:
    heritage: deckhouse
    app.kubernetes.io/name: deckhouse
    app.kubernetes.io/part-of: deckhouse
spec:
  group: deckhouse.io
  scope: Cluster
  names:
    kind: ClusterLicense
    listKind: ClusterLicenseList
    plural: clusterlicenses
    singular: clusterlicense
    shortNames:
    - cl
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.accepted
      name: Accepted
      type: boolean
    - jsonPath: .status.superseded
      name: Superseded
      type: boolean
    - jsonPath: .status.message
      name: Message
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |
          Holds a single Deckhouse license key installed in the cluster.

          This is an internal object: it is not shown in the Console, and `d8 system licenses` only lists it
          with `--keys`. In normal operation a cluster holds exactly one key; a second one appears only for
          the moment a reissue is being installed. The controller deletes a key it superseded, and a key
          whose every record, of any type, is past `expireAt` plus its grace period (the record's
          `graceDays`, or the controller default when the record has none). Such a deletion is reported
          with a `KeyExpired` event on the `EffectiveLicense`. The controller also deletes a key whose every
          record another installed key carries verbatim (the same id and the same content), as a reissued
          key does with the records of the previous keys that are still in force or yet to come; this is
          reported with a `KeyCovered` event naming the covering key. Of two keys with the same records, the
          one issued last (`iat`, then `jti`) stays; a record that shares an id but differs in content covers
          nothing. A key in its grace period, a key with a perpetual record, a rejected key and the last
          expired key while no licence is in force (it keeps the cluster reporting the expiry) all stay.
          A deleted key reapplied by hand is deleted again.

          The aggregated policy computed from all keys is published in the `EffectiveLicense` resource named
          `deckhouse-platform`.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
            type: string
          metadata:
            type: object
          spec:
            properties:
              licenseKey:
                description: |
                  The license key: a bare compact JWT issued by the license server.

                  The key is bound to the cluster it was issued for and is useless in any other cluster,
                  so it needs no confidentiality and is not stored in a Secret.

                  Whitespace and line breaks inside and around the three segments are tolerated:
                  a key carried through a chat, a PDF or a terminal arrives wrapped, and the controller
                  strips them before verifying the signature.
                pattern: '^\s*[A-Za-z0-9_\-\s]+\.[A-Za-z0-9_\-\s]+\.[A-Za-z0-9_\-\s]+\s*$'
                type: string
            required:
            - licenseKey
            type: object
          status:
            properties:
              accepted:
                description: |
                  Whether the package signature and envelope are valid.

                  A key stays accepted even when none of its records contributes to the policy any more,
                  the per-record verdicts are published in `records`.
                type: boolean
              conditions:
                description: Conditions represent the latest available observations
                  of the license key state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - "Unknown"
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              customerName:
                description: Customer name carried by the package.
                type: string
              message:
                description: Human readable summary of the key state.
                type: string
              packageJti:
                description: The `jti` claim of the package, identifies the key itself.
                type: string
              records:
                description: |
                  Per-record verdict, one entry per record of the package.

                  An extinguished record stays here and is not garbage: it documents why the quota changed.
                items:
                  properties:
                    accepted:
                      description: |
                        Whether the record contributes to the effective policy now or in the future.
                      type: boolean
                    expireAt:
                      description: |
                        When the record stops being valid. Null for a perpetual record.
                      format: date-time
                      nullable: true
                      type: string
                    graceDays:
                      description: |
                        Grace period of the record, in days. Counted from `expireAt`.

                        Null when the record declares no grace period of its own: the controller
                        default applies then.
                      nullable: true
                      type: integer
                    grants:
                      additionalProperties:
                        format: int64
                        nullable: true
                        type: integer
                      description: |
                        The `resource_limits` delta this record adds to the effective limits, keyed by resource name.

                        `null` means the resource is unlimited; an absent key means no limit for this resource
                        has been granted.
                      type: object
                    id:
                      description: Record identifier, as issued by the license server.
                      type: string
                    message:
                      description: Human readable explanation of the reason.
                      type: string
                    origin:
                      description: |
                        Where the record comes from: `purchase`, `demo` or `self-service`.
                      type: string
                    reason:
                      description: |
                        Why the record is not accepted.

                        `Renewed`, `Superseded` and `NotYetValid` are normal states and not user errors:
                        such a record must not be removed.
                      enum:
                      - Renewed
                      - Superseded
                      - Expired
                      - Duplicate
                      - NotYetValid
                      - Revoked
                      - ClusterMismatch
                      - SchemaViolation
                      - UnsupportedType
                      type: string
                    supersededBy:
                      description: |
                        Identifier of the record that extinguished this one, for both `Superseded` and `Renewed`.
                      type: string
                    startAt:
                      description: |
                        When the record starts being valid. Null when the record was rejected
                        before its dates could be read.
                      format: date-time
                      nullable: true
                      type: string
                    type:
                      description: |
                        Record type, for example `Platform`. A type unknown to this version of Deckhouse
                        is ignored and never rejects the whole key.
                      type: string
                  required:
                  - id
                  type: object
                type: array
              superseded:
                description: |
                  Whether every record of this key has been extinguished by an accepted successor
                  whose start has already passed.

                  A superseded key contributes nothing now and nothing later, and the controller deletes it,
                  emitting a `KeySuperseded` event on the `EffectiveLicense`. A key whose records merely ran
                  out past their grace period is deleted with a `KeyExpired` event instead, and a key whose
                  every record another installed key carries verbatim with a `KeyCovered` event; a rejected
                  key and a key carrying a running record of a type this release does not support stay in
                  place.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
