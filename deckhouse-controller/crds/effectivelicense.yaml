---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: effectivelicenses.deckhouse.io
  labels:
    heritage: deckhouse
    app.kubernetes.io/name: deckhouse
    app.kubernetes.io/part-of: deckhouse
spec:
  group: deckhouse.io
  scope: Cluster
  names:
    kind: EffectiveLicense
    listKind: EffectiveLicenseList
    plural: effectivelicenses
    singular: effectivelicense
    shortNames:
    - el
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.compliance.state
      name: State
      type: string
    - jsonPath: .status.withinLimits
      name: Within limits
      type: boolean
    - jsonPath: .status.nextReduction.at
      name: Next reduction
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |
          The aggregated license policy of the cluster.

          The object is entirely computed by the controller from all `ClusterLicense` resources.
          The only instance is named `dkp`, and it has no settings: `spec` accepts no fields.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
            type: string
          metadata:
            type: object
          spec:
            description: |
              Not used. The resource is computed by the controller, it has no desired state to declare.

              Any field here is rejected rather than silently dropped: a setting that looks accepted
              and does nothing is worse than an error.
            maxProperties: 0
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            properties:
              compliance:
                description: The aggregated compliance verdict.
                properties:
                  reason:
                    description: |
                      Why the state is what it is. At `Valid` it is either absent or `LimitsApproaching`.

                      * `Unregistered` — no accepted `Workload` record has ever been installed.
                      * `Expired` — all records have expired, the state is `Grace` or `Violation` by time.
                      * `Revoked` — a record is revoked on commercial grounds.
                      * `LimitsExceeded` — consumption is above a limit: instant consumption above it at `Warning`,
                        instant consumption above it continuously for the sustained window (7 days by default)
                        at `Violation`. The state is left as soon as one observation comes back within the limit.
                      * `ExpiringSoon` — an active record expires within the warning window.
                      * `LimitsApproaching` — informational, present at `Valid`: instant consumption is at or above
                        the warning ratio of a limit (90% by default) but not above the limit itself.
                      * `ProjectedOverLimit` — the extrapolated consumption is above a limit.
                    enum:
                    - Unregistered
                    - Expired
                    - Revoked
                    - LimitsExceeded
                    - ExpiringSoon
                    - LimitsApproaching
                    - ProjectedOverLimit
                    type: string
                  since:
                    description: |
                      When the current state was entered. Null while the controller has not
                      observed a transition yet.
                    format: date-time
                    nullable: true
                    type: string
                  state:
                    description: |
                      * `Valid` — the policy is satisfied.
                      * `Warning` — the policy is satisfied, but something needs attention soon.
                      * `Grace` — the rights have run out and the grace period is running.
                      * `Violation` — the rights have run out and the grace period is over.
                      * `NoUpdateRight` — the cluster has no right to receive updates.
                    enum:
                    - Valid
                    - Warning
                    - Grace
                    - Violation
                    - NoUpdateRight
                    type: string
                type: object
              conditions:
                description: |
                  Conditions represent the latest available observations of the license policy.

                  The controller publishes the following condition types:

                  * `LimitsSatisfied` — `False` while instant consumption exceeds any limit;
                    `lastTransitionTime` marks when the exceedance started.
                  * `SomeRecordsExpiring` — `True` when an active, not-renewed record expires within
                    the warning window; the message names the record id and the RFC 3339 date.
                  * `RejectedRecords` — `True` when any record is rejected for a reason other than
                    `UnsupportedType`, `Renewed`, `Superseded` or `Expired`.
                  * `Registered` — `True` when at least one accepted `Workload` record exists.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - "Unknown"
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              counts:
                description: Composition of the installed key set.
                properties:
                  accepted:
                    description: Number of accepted records.
                    type: integer
                  packages:
                    description: Number of installed keys.
                    type: integer
                  records:
                    description: Total number of records in all keys.
                    type: integer
                  rejected:
                    description: Number of rejected records.
                    type: integer
                type: object
              effective:
                description: The quota currently in effect.
                properties:
                  grantedBy:
                    additionalProperties:
                      items:
                        type: string
                      type: array
                    description: |
                      Every record that contributes to a resource, keyed by resource name.

                      Listing all the grounds matters: when one of them expires, it must be visible
                      that the quota is still granted by another one.
                    type: object
                  limits:
                    additionalProperties:
                      format: int64
                      nullable: true
                      type: integer
                    description: |
                      The summed quota, keyed by resource name.

                      `null` means the resource is unlimited; an absent key means no limit for this
                      resource has been granted.
                    type: object
                  unlimited:
                    description: |
                      Whether at least one resource in `limits` ended up unlimited, that is, whether
                      any of its values is `null`.
                    type: boolean
                type: object
              metrics:
                additionalProperties:
                  properties:
                    avg_7d:
                      description: Mean over the observation window.
                      type: number
                    extrapolated:
                      description: |
                        Value projected to the nearest future expiration by linear regression
                        over the daily means of the observation window.

                        `null` means there are not enough observations to project from yet: the
                        journal is shorter than the sustained window (7 days by default).
                      nullable: true
                      type: number
                    instant:
                      description: Value of the last observation.
                      type: number
                  type: object
                description: Observed consumption, keyed by resource name.
                type: object
              nextReduction:
                description: |
                  The nearest point in time when the effective limits shrink. Null when no reduction is known.
                nullable: true
                properties:
                  at:
                    description: When the limits shrink.
                    format: date-time
                    type: string
                  in:
                    description: Human readable time left until the reduction, for
                      example `61d`.
                    type: string
                  limits:
                    additionalProperties:
                      properties:
                        from:
                          description: |
                            The current limit. `null` means the resource is currently unlimited.
                          format: int64
                          nullable: true
                          type: integer
                        to:
                          description: |
                            The limit after the reduction. `null` means the resource stays unlimited.
                          format: int64
                          nullable: true
                          type: integer
                      type: object
                    description: Change of every affected resource, keyed by resource
                      name.
                    type: object
                type: object
              registrationRequest:
                description: |
                  A bare compact JWT to paste into the license server to obtain or renew a key.

                  Regenerated hourly, so the consumption figures it carries stay fresh.
                type: string
              timeline:
                description: |
                  The effective limits over time, starting from the current segment.
                items:
                  properties:
                    from:
                      description: Start of the segment.
                      format: date-time
                      type: string
                    limits:
                      additionalProperties:
                        format: int64
                        nullable: true
                        type: integer
                      description: |
                        The effective quota during the segment, keyed by resource name.

                        `null` means the resource is unlimited; an absent key means no limit for this
                        resource has been granted.
                      type: object
                    state:
                      description: Compliance state during the segment.
                      enum:
                      - Valid
                      - Warning
                      - Grace
                      - Violation
                      - NoUpdateRight
                      type: string
                    to:
                      description: End of the segment. Null for the last, open ended
                        segment.
                      format: date-time
                      nullable: true
                      type: string
                  required:
                  - from
                  type: object
                type: array
              withinLimits:
                description: |
                  Whether every observed resource stays within its effective limit.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
