---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: effectivelicenses.deckhouse.io
  labels:
    heritage: deckhouse
    app.kubernetes.io/name: deckhouse
    app.kubernetes.io/part-of: deckhouse
spec:
  group: deckhouse.io
  scope: Cluster
  names:
    kind: EffectiveLicense
    listKind: EffectiveLicenseList
    plural: effectivelicenses
    singular: effectivelicense
    shortNames:
    - el
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.licensed
      name: Licensed
      type: boolean
    - jsonPath: .status.compliance.state
      name: State
      type: string
    - jsonPath: .status.key.validUntil
      name: Valid until
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |
          The aggregated license policy of one product.

          The object is computed by the controller from every installed `ClusterLicense`, it has no spec,
          and the instance describing the platform itself is named `deckhouse-platform`. Licenses for
          individual products get their own object of the same kind, computed from the same keys: one key
          may carry records of several products, so the key and the state of a product are different objects.

          Everything the Console shows comes from here, already computed: the Console never lays nodes out
          by itself, otherwise it and the cluster would disagree.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
            type: string
          metadata:
            type: object
          status:
            properties:
              allocation:
                description: |
                  Totals of the node allocation, the numbers shown next to each group in the Console.
                properties:
                  pool:
                    description: |
                      The shared pool of `vCPU` and `cores`. Its capacity is `vCPU + 2 * cores`
                      of the active records; the two metrics are one pool, not two.
                    properties:
                      capacityVCPU:
                        description: |
                          Capacity of the pool, in vCPU. Null when the pool is unbounded, that is,
                          when the key grants `vCPU` or `cores` without a limit.
                        format: int64
                        nullable: true
                        type: integer
                      nodes:
                        description: Number of nodes covered by the pool.
                        format: int64
                        type: integer
                      usedVCPU:
                        description: vCPU of the nodes covered by the pool.
                        format: int64
                        type: integer
                    type: object
                  servers:
                    description: |
                      Whole-node licences. They are applied to the largest nodes first; everything
                      that does not fit falls through to the pool, so this metric cannot be exceeded
                      on its own.
                    properties:
                      limit:
                        description: |
                          Granted number of server licences. Null when the metric is unlimited.
                        format: int64
                        nullable: true
                        type: integer
                      used:
                        description: Number of nodes holding a server licence.
                        format: int64
                        type: integer
                    type: object
                  unlicensed:
                    description: |
                      Nodes that fit neither into `servers` nor into the pool. A non-empty group is
                      the only way the license can be violated, which is what makes the licence
                      binary for the customer: it is either in force or it is not.
                    properties:
                      nodes:
                        description: Number of nodes not covered by the license.
                        format: int64
                        type: integer
                      vCPU:
                        description: vCPU of the nodes not covered by the license.
                        format: int64
                        type: integer
                    type: object
                type: object
              compliance:
                description: Aggregated compliance state of the license policy.
                properties:
                  reason:
                    description: |
                      What produced a state that is not `Valid`.

                      * `Unregistered` — no key has ever been installed.
                      * `Expired` — every record has expired.
                      * `Revoked` — a record was revoked on a commercial ground: no grace period applies.
                      * `UnlicensedNodes` — some nodes are not covered by the license.
                      * `ExpiringSoon` — the key expires within 30 days.
                    type: string
                  since:
                    description: |
                      When the state was entered. Null while the controller has not observed a transition yet.
                    format: date-time
                    nullable: true
                    type: string
                  state:
                    description: |
                      * `Valid` — every node is covered and nothing expires soon.
                      * `Warning` — unlicensed nodes appeared less than 7 days ago, or the key expires
                        within 30 days. The cluster is still licensed.
                      * `Grace` — every record has expired and the grace period is running.
                      * `Violation` — the grace period is over, a record was revoked commercially, or
                        unlicensed nodes have been there for 7 days without interruption.
                      * `NoUpdateRight` — reserved, not computed in this release.
                    enum:
                    - Valid
                    - Warning
                    - Grace
                    - Violation
                    - NoUpdateRight
                    type: string
                type: object
              consumption:
                description: |
                  What the cluster consumes, over its licensable nodes. These are exactly the numbers
                  that go into the cluster data file.
                properties:
                  cores:
                    description: '`ceil(vCPU / 2)`, taken on the sum and never per node.'
                    format: int64
                    type: integer
                  freeNodes:
                    description: |
                      Number of nodes left out of the metrics: platform nodes without user workload.
                    format: int64
                    type: integer
                  servers:
                    description: Number of licensable nodes.
                    format: int64
                    type: integer
                  vCPU:
                    description: Sum of the vCPU of the licensable nodes, each rounded up to a whole number.
                    format: int64
                    type: integer
                type: object
              key:
                description: |
                  The license key in force. Absent while the cluster holds no key.

                  The individual records of a key may have different terms, which is how a reissue encodes
                  the paid remainder next to the new one. None of that is shown here: for the customer a
                  licence is valid until one date.
                properties:
                  customerName:
                    description: Customer the key was issued to.
                    type: string
                  graceDays:
                    description: |
                      Grace period, in days, taken from the record that expires last.
                    nullable: true
                    type: integer
                  jti:
                    description: The `jti` claim of the key.
                    type: string
                  name:
                    description: Name of the `ClusterLicense` object carrying the key.
                    type: string
                  origin:
                    description: 'Where the key comes from: `purchase`, `demo` or `self-service`.'
                    type: string
                  validUntil:
                    description: |
                      The greatest expiration among the records of the key. Null for a key that never expires.
                    format: date-time
                    nullable: true
                    type: string
                type: object
              licensed:
                description: |
                  The binary answer, and the only thing the Console shows prominently.

                  True while the compliance state is `Valid` or `Warning`, false at `Grace`, `Violation`
                  and `NoUpdateRight`.
                type: boolean
              limits:
                description: |
                  The quota granted by the records active right now, summed per metric (ADR 14.3).
                properties:
                  grantedBy:
                    additionalProperties:
                      items:
                        type: string
                      type: array
                    description: |
                      Every record behind a metric, keyed by metric name. Diagnostics: it shows which
                      grant carried the quota when another one expired. Not shown in the Console.
                    type: object
                  unlimited:
                    description: Metrics that ended up without a limit.
                    items:
                      type: string
                    type: array
                  values:
                    additionalProperties:
                      format: int64
                      nullable: true
                      type: integer
                    description: |
                      The summed quota, keyed by metric name: `servers`, `vCPU`, `cores`, and whatever
                      a newer key adds.

                      `null` means the metric is unlimited; an absent key means no active record named it.
                    type: object
                type: object
              nodes:
                description: |
                  The full allocation, free nodes included, sorted by size inside each group.

                  The Console renders this list as is. It is also the state the tie-breaking rule reads
                  back: a node that already holds a server licence keeps it while it is the largest.
                items:
                  properties:
                    billing:
                      description: |
                        * `Free` — a platform node without user workload, see `reason`.
                        * `Server` — covered by a whole-node licence.
                        * `Pool` — covered by the shared `vCPU` and `cores` pool.
                        * `Unlicensed` — not covered at all.
                      enum:
                      - Free
                      - Server
                      - Pool
                      - Unlicensed
                      type: string
                    name:
                      description: Node name.
                      type: string
                    reason:
                      description: |
                        Why the node is free. Filled for the `Free` group only.
                      type: string
                    vCPU:
                      description: Capacity of the node in vCPU, rounded up to a whole number.
                      format: int64
                      type: integer
                  required:
                  - name
                  type: object
                type: array
              overLimitSince:
                description: |
                  When unlicensed nodes appeared. Null while every node is covered.

                  Seven days after this moment the compliance state becomes `Violation`; it goes back to
                  `Valid` on the first recomputation that finds every node covered again.
                format: date-time
                nullable: true
                type: string
              registrationRequest:
                description: |
                  The cluster data file: a bare compact JWT to hand to the license server as a `.jwt` file.

                  It is rebuilt whenever the accepted records, the installed keys or the consumption change.
                  It carries numbers only: node names and the allocation never leave the cluster.
                type: string
              conditions:
                description: |
                  Conditions represent the latest available observations of the license policy.

                  * `LimitsSatisfied` — every licensable node is covered.
                  * `KeyExpiring` — the key expires within 30 days.
                  * `KeyRejected` — a record or a key was rejected for a reason the customer has to act on.
                  * `SupersedeCycle` — records extinguish each other in a cycle, so all of them are excluded.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - "Unknown"
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
