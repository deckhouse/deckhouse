spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает репозиторий пакетов, доступный в Deckhouse Platform.
          properties:
            apiVersion:
              description: |-
                Определяет версионированную схему этого представления объекта. Серверы должны преобразовывать распознанные схемы в последнее внутреннее значение и могут отклонять нераспознанные значения.

                Больше информации [в документации Kubernetes](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources).
            kind:
              description: |-
                Значение представляет REST-ресурс, который описывает данный объект. Серверы могут определить его по эндпоинту, к которому клиент отправляет запросы. Не может быть изменено. Используется в CamelCase.

                Больше информации [в документации Kubernetes](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds).
            spec:
              description: |
                Конфигурация репозитория пакетов.
              properties:
                registry:
                  description: |
                    Параметры доступа к хранилищу образов контейнеров, в котором расположен репозиторий пакетов.
                  properties:
                    ca:
                      description: |
                        Корневой сертификат в формате PEM для проверки TLS-сертификата хранилища образов контейнеров при подключении по HTTPS.

                        Используется, если хранилище использует самоподписанные SSL-сертификаты.
                    dockerCfg:
                      description: |
                        Конфигурация доступа к хранилищу образов в формате `~/.docker/config.json`, закодированная в Base64.

                        Для анонимного доступа оставьте поле пустым.
                    login:
                      description: |
                        Имя пользователя для аутентификации в хранилище образов.
                    password:
                      description: |
                        Пароль для аутентификации в хранилище образов.
                    repo:
                      description: |
                        Адрес репозитория пакетов в хранилище образов.
                    scheme:
                      description: |
                        Протокол для доступа к репозиторию пакетов, например, `https`.
                scanInterval:
                  description: |
                    Интервал между автоматическими сканированиями репозитория пакетов для обнаружения новых пакетов и версий.
            status:
              description: |
                Текущее состояние репозитория пакетов.
              properties:
                conditions:
                  description: |
                    Условия, отражающие текущее состояние репозитория пакетов.
                  items:
                    description: |
                      Условие, описывающее один из аспектов текущего состояния репозитория пакетов.
                    properties:
                      lastTransitionTime:
                        description: |
                          Время последнего изменения статуса условия.
                      message:
                        description: |
                          Сообщение с дополнительной информацией об условии.

                          Может быть пустым.
                      observedGeneration:
                        description: |
                          Значение `.metadata.generation`, для которого установлено условие.

                          Позволяет определить, соответствует ли условие текущей версии объекта.
                      reason:
                        description: |
                          Программный идентификатор причины последнего изменения статуса условия.
                      status:
                        description: |
                          Статус условия.
                      type:
                        description: |
                          Тип условия в CamelCase или в формате `foo.example.com/CamelCase`.
                message:
                  description: |
                    Сообщение с дополнительной информацией о состоянии репозитория пакетов.
                packages:
                  description: |
                    Список пакетов, доступных в репозитории.
                  items:
                    properties:
                      name:
                        description: |
                          Имя пакета.
                      type:
                        description: |
                          Тип пакета.
                packagesCount:
                  description: |
                    Общее количество пакетов в репозитории.
                phase:
                  description: |
                    Текущая фаза репозитория пакетов.
                lastChangeTime:
                  description: |
                    Время последнего сканирования, в ходе которого была обнаружена хотя бы одна новая версия пакета.

                    Если новые версии не обнаружены, значение не обновляется.
                lastNewVersions:
                  description: |
                    Количество новых версий пакетов, обнаруженных при последнем сканировании.

                    Равно `0`, если новые версии не обнаружены.
                lastScanTime:
                  description: |
                    Время последнего успешно завершённого сканирования.

                    Если сканирование завершается с ошибкой, значение не обновляется, а ошибка отражается в условии `LastScanSucceeded`.
