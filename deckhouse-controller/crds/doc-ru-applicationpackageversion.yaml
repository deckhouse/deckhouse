spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Описывает версию пакета приложения.
          properties:
            apiVersion:
              description: |-
                Определяет версионированную схему этого представления объекта. Серверы должны преобразовывать распознанные схемы в последнее внутреннее значение и могут отклонять нераспознанные значения.

                Больше информации [в документации Kubernetes](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources).
            kind:
              description: |-
                Значение представляет REST-ресурс, который описывает данный объект. Серверы могут определить его по эндпоинту, к которому клиент отправляет запросы. Не может быть изменено. Используется в CamelCase.

                Больше информации [в документации Kubernetes](https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds).
            spec:
              description: |
                Параметры версии пакета приложения.
              properties:
                packageName:
                  description: |
                    Имя пакета приложения.
                packageRepositoryName:
                  description: |
                    Имя репозитория пакетов, в котором находится версия пакета.
                packageVersion:
                  description: |
                    Версия пакета приложения.
            status:
              description: |
                Текущее состояние версии пакета приложения.
              properties:
                observedGeneration:
                  description: |
                    Значение `.metadata.generation`, для которого сформирован текущий статус.

                    Если значение меньше текущего `.metadata.generation`, статус ещё не отражает
                    последние изменения объекта.
                conditions:
                  description: |
                    Условия, отражающие текущее состояние версии пакета приложения.
                  items:
                    description: |
                      Условие, отражающее один из аспектов текущего состояния версии пакета.
                    properties:
                      lastTransitionTime:
                        description: |
                          Время последнего изменения статуса условия.
                      message:
                        description: |
                          Сообщение с дополнительной информацией об условии.

                          Может быть пустым.
                      observedGeneration:
                        description: |
                          Значение `.metadata.generation`, для которого установлено условие.

                          Позволяет определить, соответствует ли условие текущей версии объекта.
                      reason:
                        description: |
                          Программный идентификатор причины последнего изменения статуса условия.
                      status:
                        description: |
                          Статус условия.
                      type:
                        description: |
                          Тип условия в CamelCase или в формате `foo.example.com/CamelCase`.
                packageMetadata:
                  description: |
                    Метаданные версии пакета приложения, включая описание, требования, условия отключения и правила совместимости версий.
                  properties:
                    category:
                      description: |
                        Категория пакета приложения.
                    changelog:
                      description: |
                        Информация об изменениях в этой версии пакета.
                      properties:
                        features:
                          description: |
                            Список новых возможностей в этой версии пакета.
                        fixes:
                          description: |
                            Список ошибок, исправленных в этой версии пакета.
                    description:
                      description: |
                        Локализованные описания пакета приложения.
                      properties:
                        en:
                          description: |
                            Описание пакета приложения на английском языке.
                        ru:
                          description: |
                            Описание пакета приложения на русском языке.
                    disableOptions:
                      description: |
                        Параметры защиты от отключения пакета приложения.
                      properties:
                        confirmation:
                          description: |
                            Указывает, требуется ли подтверждение для отключения пакета приложения.
                        messages:
                          description: |
                            Локализованные сообщения, отображаемые при подтверждении отключения.
                          properties:
                            en:
                              description: |
                                Сообщение подтверждения отключения на английском языке.
                            ru:
                              description: |
                                Сообщение подтверждения отключения на русском языке.
                    licensing:
                      description: |
                        Информация о лицензировании пакета приложения для разных редакций.
                      properties:
                        editions:
                          description: |
                            Параметры лицензирования для разных редакций пакета приложения.
                          additionalProperties:
                            properties:
                              available:
                                description: |
                                  Указывает, доступна ли эта редакция для использования.
                              enabledInBundles:
                                description: |
                                  Наборы модулей, в которых пакет включён по умолчанию в данной редакции.

                                  Для пакетов приложений не используется.
                    requirements:
                      description: |
                        Системные требования для установки и работы приложения.
                      properties:
                        deckhouse:
                          description: |
                            Требуемая версия Deckhouse Platform.
                          properties:
                            constraint:
                              description: |
                                Ограничение версии Deckhouse Platform в формате SemVer.
                        kubernetes:
                          description: |
                            Требуемая версия Kubernetes.
                          properties:
                            constraint:
                              description: |
                                Ограничение версии Kubernetes в формате SemVer.
                        modules:
                          description: |
                            Требования к модулям Deckhouse Platform: обязательные и условные зависимости,
                            группы альтернативных и несовместимых модулей.
                          properties:
                            mandatory:
                              description: |
                                Обязательные модули для работы приложения.

                                Каждый указанный модуль должен быть включён.
                                Если задано ограничение версии, модуль должен ему соответствовать.
                              items:
                                description: |
                                  Обязательный модуль с необязательным ограничением версии в формате SemVer.

                                  Если ограничение не задано, допускается любая версия.
                                properties:
                                  name:
                                    description: |
                                      Имя модуля.
                                  constraint:
                                    description: |
                                      Ограничение версии модуля в формате SemVer.
                            conditional:
                              description: |
                                Необязательные модули, для которых действуют ограничения версий.

                                Модуль не обязательно должен быть включён. Если он включён,
                                его версия должна соответствовать указанному ограничению.

                                Заменяет устаревший суффикс `!optional` из формата требований v1.
                              items:
                                description: |
                                  Необязательный модуль с ограничением версии в формате SemVer.

                                  Если ограничение не задано, допускается любая версия.
                                properties:
                                  name:
                                    description: |
                                      Имя модуля.
                                  constraint:
                                    description: |
                                      Ограничение версии модуля в формате SemVer.
                            anyOf:
                              description: |
                                Группы альтернативных модулей.

                                В каждой группе должен быть включён хотя бы один модуль.
                                Если для модуля задано ограничение версии, его версия должна
                                соответствовать этому ограничению.

                                Группы не создают связей в графе зависимостей.
                              items:
                                description: |
                                  Группа альтернативных модулей, из которых хотя бы один должен быть включён.
                                properties:
                                  name:
                                    description: |
                                      Стабильный идентификатор группы, используемый в диагностических сообщениях планировщика.
                                  description:
                                    description: |
                                      Описание назначения группы.
                                  modules:
                                    description: |
                                      Альтернативные модули в группе.
                                    items:
                                      description: |
                                        Модуль с необязательным ограничением версии в формате SemVer.

                                        Если ограничение не задано, допускается любая версия.
                                      properties:
                                        name:
                                          description: |
                                            Имя модуля.
                                        constraint:
                                          description: |
                                            Ограничение версии модуля в формате SemVer.
                            noneOf:
                              description: |
                                Группы несовместимых модулей.

                                Для работы приложения ни один модуль из этих групп
                                не должен быть включён в несовместимой версии.

                                Если ограничение версии не задано, несовместимы все версии модуля.
                                Если ограничение задано, несовместимы только версии,
                                соответствующие этому ограничению.

                                Группы не создают связей в графе зависимостей.
                              items:
                                description: |
                                  Группа несовместимых модулей.

                                  Ни один из перечисленных модулей не должен быть включён в несовместимой версии.
                                properties:
                                  name:
                                    description: |
                                      Стабильный идентификатор группы, используемый в диагностических сообщениях планировщика.
                                  description:
                                    description: |
                                      Описание назначения группы.
                                  modules:
                                    description: |
                                      Несовместимые модули в группе.
                                    items:
                                      description: |
                                        Модуль с необязательным ограничением версии в формате SemVer.

                                        Если ограничение не задано, несовместимы все версии модуля.
                                      properties:
                                        name:
                                          description: |
                                            Имя модуля.
                                        constraint:
                                          description: |
                                            Ограничение версии модуля в формате SemVer, задающее диапазон несовместимых версий.
                    stage:
                      description: |
                        Стадия жизненного цикла пакета приложения.
                    versionCompatibilityRules:
                      description: |
                        Правила совместимости версий при обновлении и откате приложения.
                      properties:
                        downgrade:
                          description: |
                            Правила совместимости для отката с этой версии приложения.
                          properties:
                            step:
                              description: |
                                Шаг правила совместимости.
                              properties:
                                major:
                                  description: |
                                    Количество major-версий, которые можно пропустить при откате.

                                    Значение `-1` снимает все ограничения, `0` — запрещает изменение.

                                    По умолчанию `0`.
                                minor:
                                  description: |
                                    Количество minor-версий, которые можно пропустить при откате.

                                    Значение `-1` снимает все ограничения, `0` — запрещает изменение.

                                    По умолчанию `0`.
                                patches:
                                  description: |
                                    Количество patch-версий, которые можно пропустить при откате.

                                    Значение `-1` снимает все ограничения, `0` — запрещает изменение.

                                    По умолчанию `-1`.
                        upgrade:
                          description: |
                            Правила совместимости для обновления с этой версии приложения.
                          properties:
                            step:
                              description: |
                                Шаг правила совместимости.
                              properties:
                                major:
                                  description: |
                                    Количество major-версий, которые можно пропустить при обновлении.

                                    Значение `-1` снимает все ограничения, `0` — запрещает изменение.

                                    По умолчанию `0`.
                                minor:
                                  description: |
                                    Количество minor-версий, которые можно пропустить при обновлении.

                                    Значение `-1` снимает все ограничения, `0` — запрещает изменение.

                                    По умолчанию `1`.
                                patches:
                                  description: |
                                    Количество patch-версий, которые можно пропустить при обновлении.

                                    Значение `-1` снимает все ограничения, `0` — запрещает изменение.

                                    По умолчанию `-1`.
                packageSchemas:
                  description: |
                    Схемы OpenAPI для валидации пользовательских настроек приложения и итоговых значений, передаваемых в хуки и шаблоны пакета.
                  properties:
                    settingsSchema:
                      description: |
                        Схема OpenAPI v3 для валидации пользовательских настроек приложения в `Application.spec.settings`.

                        Схема хранится как непрозрачный объект, поскольку имеет рекурсивную структуру JSON Schema. Контроллер проверяет её при загрузке метаданных пакета.
                    valuesSchema:
                      description: |
                        Схема OpenAPI v3 для проверки итогового набора `values`, передаваемого в хуки и шаблоны пакета.

                        Итоговый набор формируется из значений по умолчанию и пользовательских настроек приложения.

                        Схема хранится как непрозрачный объект, поскольку имеет рекурсивную структуру JSON Schema. Контроллер проверяет её при загрузке метаданных пакета.
                    settingsConversions:
                      description: |
                        Конверсии, приводящие настройки, написанные для более старой версии схемы настроек, к последней версии. Упорядочены по версии.

                        Пусто, если у пакета одна версия схемы настроек.
                      items:
                        description: |
                          Конверсия настроек предыдущей версии схемы в версию `version`.
                        properties:
                          version:
                            description: |
                              Версия схемы настроек, которую даёт конверсия; конвертируются настройки предыдущей версии.
                          expr:
                            description: |
                              jq-выражения, применяемые к настройкам по порядку.
                          descriptions:
                            description: |
                              Локализованное описание изменений в этой версии схемы настроек.
                            properties:
                              ru:
                                description: |
                                  Описание конверсии на русском языке.
                              en:
                                description: |
                                  Описание конверсии на английском языке.
                usedBy:
                  description: |
                    Список приложений, установленных из данной версии пакета.
                  items:
                    description: |
                      Приложение, установленное из данной версии пакета.
                    properties:
                      name:
                        description: |
                          Имя экземпляра приложения.
                      namespace:
                        description: |
                          Неймспейс, в котором установлено приложение.
                usedByCount:
                  description: |
                    Количество приложений, установленных из данной версии пакета.

                    Соответствует количеству элементов в `usedBy`.
