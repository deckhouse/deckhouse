---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: ironic-standalone-operator
    app.kubernetes.io/instance: leader-election-rolebinding
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rolebinding
    app.kubernetes.io/part-of: ironic-standalone-operator
  name: ironic-standalone-operator-leader-election-rolebinding
  namespace: d8-cloud-provider-metal3
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ironic-standalone-operator-leader-election-role
subjects:
- kind: ServiceAccount
  name: ironic-standalone-operator-controller-manager
  namespace: d8-cloud-provider-metal3
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: ironic-standalone-operator
    app.kubernetes.io/instance: manager-rolebinding
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: clusterrolebinding
    app.kubernetes.io/part-of: ironic-standalone-operator
  name: ironic-standalone-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ironic-standalone-operator-manager-role
subjects:
- kind: ServiceAccount
  name: ironic-standalone-operator-controller-manager
  namespace: d8-cloud-provider-metal3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ironic-standalone-operator-ironic-standalone-operator-config
  namespace: d8-cloud-provider-metal3
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/created-by: ironic-standalone-operator
    app.kubernetes.io/instance: webhook-service
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: service
    app.kubernetes.io/part-of: ironic-standalone-operator
  name: ironic-standalone-operator-webhook-service
  namespace: d8-cloud-provider-metal3
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: ironic-standalone-operator
    app.kubernetes.io/instance: controller-manager
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: deployment
    app.kubernetes.io/part-of: ironic-standalone-operator
    control-plane: controller-manager
  name: ironic-standalone-operator-controller-manager
  namespace: d8-cloud-provider-metal3
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      {{- include "helm_lib_node_selector" (tuple . "master") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple . "any-node" "with-uninitialized") | nindent 6 }}
      containers:
      - args:
        - --leader-elect
        command:
        - /manager
        envFrom:
        - configMapRef:
            name: ironic-standalone-operator-ironic-standalone-operator-config
        image: {{ include "helm_lib_module_image" (list . "ironicStandaloneOperator") }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          runAsGroup: 65532
          runAsUser: 65532
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ironic-standalone-operator-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: irso-webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/component: certificate
    app.kubernetes.io/created-by: ironic-standalone-operator
    app.kubernetes.io/instance: serving-cert
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: certificate
    app.kubernetes.io/part-of: ironic-standalone-operator
  name: ironic-standalone-operator-serving-cert
  namespace: d8-cloud-provider-metal3
spec:
  dnsNames:
  - ironic-standalone-operator-webhook-service.d8-cloud-provider-metal3.svc
  - ironic-standalone-operator-webhook-service.d8-cloud-provider-metal3.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: ironic-standalone-operator-selfsigned-issuer
  secretName: irso-webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/component: certificate
    app.kubernetes.io/created-by: ironic-standalone-operator
    app.kubernetes.io/instance: selfsigned-issuer
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: issuer
    app.kubernetes.io/part-of: ironic-standalone-operator
  name: ironic-standalone-operator-selfsigned-issuer
  namespace: d8-cloud-provider-metal3
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: d8-cloud-provider-metal3/ironic-standalone-operator-serving-cert
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/created-by: ironic-standalone-operator
    app.kubernetes.io/instance: validating-webhook-configuration
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: validatingwebhookconfiguration
    app.kubernetes.io/part-of: ironic-standalone-operator
  name: ironic-standalone-operator-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: ironic-standalone-operator-webhook-service
      namespace: d8-cloud-provider-metal3
      path: /validate-ironic-metal3-io-v1alpha1-ironic
  failurePolicy: Fail
  name: validate-ironic.ironic.metal3.io
  rules:
  - apiGroups:
    - ironic.metal3.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - ironics
  sideEffects: None
{{- end }}
