{{- $ironic := .Values.cloudProviderMetal3.ironic | default dict -}}
{{- if $ironic.enabled }}
{{- $provisioningNetwork := $ironic.provisioningNetwork | required "cloudProviderMetal3.ironic.provisioningNetwork is required when cloudProviderMetal3.ironic.enabled is true" -}}
{{- $dhcp := $ironic.dhcp | default dict -}}
{{- $external := $ironic.external | default dict -}}
{{- $externalDHCP := $external.dhcp | default dict -}}
{{- $api := $ironic.api | default dict -}}
{{- $imageServer := $ironic.imageServer | default dict -}}
{{- $imageServerPort := $imageServer.port | default 6180 -}}
{{- $deployRamdisk := $ironic.deployRamdisk | default dict -}}
{{- $ramdiskImage := $ironic.ramdiskImage | default dict -}}
{{- $externalRamdiskImage := $ramdiskImage.external | default dict -}}
{{- if and $dhcp $externalDHCP }}
{{- fail "cloudProviderMetal3.ironic.dhcp and cloudProviderMetal3.ironic.external.dhcp are mutually exclusive" }}
{{- end }}
---
apiVersion: ironic.metal3.io/v1alpha1
kind: Ironic
metadata:
  name: "ironic"
  namespace: d8-cloud-provider-metal3
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
spec:
  images:
    ironic: {{ include "helm_lib_module_image" (list . "ironic") | quote }}
  deployRamdisk:
    {{- if $deployRamdisk.sshKey }}
    sshKey: {{ $deployRamdisk.sshKey | quote }}
    {{- end }}
    disableDownloader: true
  overrides:
    agentImages:
    {{- if $externalRamdiskImage }}
    -
      {{- if $externalRamdiskImage.architecture }}
      architecture: {{ $externalRamdiskImage.architecture | quote }}
      {{- end }}
      kernel: {{ $externalRamdiskImage.kernelURL | quote }}
      initramfs: {{ $externalRamdiskImage.initramfsURL | quote }}
    {{- else }}
    -
      architecture: "x86_64"
      kernel: {{ printf "http://%s:%v/images/ironic-python-agent.kernel" $provisioningNetwork.ipAddress $imageServerPort | quote }}
      initramfs: {{ printf "http://%s:%v/images/ironic-python-agent.initramfs" $provisioningNetwork.ipAddress $imageServerPort | quote }}
    {{- end }}
  networking:
    interface: {{ $provisioningNetwork.interface | quote }}
    ipAddress: {{ $provisioningNetwork.ipAddress | quote }}
    {{- if $provisioningNetwork.ipAddressManager }}
    ipAddressManager: {{ $provisioningNetwork.ipAddressManager | quote }}
    {{- end }}
    {{- if $api.port }}
    apiPort: {{ $api.port }}
    {{- end }}
    {{- if $imageServer.port }}
    imageServerPort: {{ $imageServerPort }}
    {{- end }}
    {{- if $dhcp }}
    dhcp:
      networkCIDR: {{ $dhcp.networkCIDR | quote }}
      rangeBegin: {{ $dhcp.rangeBegin | quote }}
      rangeEnd: {{ $dhcp.rangeEnd | quote }}
      {{- if $dhcp.dnsAddress }}
      dnsAddress: {{ $dhcp.dnsAddress | quote }}
      {{- end }}
      {{- if $dhcp.gatewayAddress }}
      gatewayAddress: {{ $dhcp.gatewayAddress | quote }}
      {{- end }}
      {{- if hasKey $dhcp "serveDNS" }}
      serveDNS: {{ $dhcp.serveDNS }}
      {{- end }}
    {{- end }}
{{- end }}
