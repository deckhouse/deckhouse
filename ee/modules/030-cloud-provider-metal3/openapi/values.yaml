type: object
properties:
  ironic:
    type: object
    default: {}
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: false
      provisioningNetwork:
        type: object
        additionalProperties: false
        required:
        - interface
        - ipAddress
        properties:
          interface:
            type: string
          ipAddress:
            type: string
            pattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$'
          ipAddressManager:
            type: string
            enum:
            - keepalived
      api:
        type: object
        additionalProperties: false
        properties:
          port:
            type: integer
            minimum: 1
            default: 6385
      imageServer:
        type: object
        additionalProperties: false
        properties:
          port:
            type: integer
            minimum: 1
            default: 6180
      dhcp:
        type: object
        additionalProperties: false
        required:
        - networkCIDR
        - rangeBegin
        - rangeEnd
        properties:
          networkCIDR:
            type: string
            pattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(3[0-2]|[1-2][0-9]|[0-9]))$'
          rangeBegin:
            type: string
            pattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$'
          rangeEnd:
            type: string
            pattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$'
          dnsAddress:
            type: string
            pattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$'
          gatewayAddress:
            type: string
            pattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$'
          serveDNS:
            type: boolean
      external:
        type: object
        additionalProperties: false
        properties:
          dhcp:
            type: object
            additionalProperties: false
            required:
            - pxeBootServer
            properties:
              pxeBootServer:
                type: string
                pattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$'
              pxeBootFile:
                type: object
                additionalProperties: false
                properties:
                  bios:
                    type: string
                  uefi:
                    type: string
      deployRamdisk:
        type: object
        additionalProperties: false
        properties:
          sshKey:
            type: string
      ramdiskImage:
        type: object
        additionalProperties: false
        properties:
          external:
            type: object
            additionalProperties: false
            required:
            - kernelURL
            - initramfsURL
            properties:
              architecture:
                type: string
                enum:
                - x86_64
                - aarch64
              kernelURL:
                type: string
              initramfsURL:
                type: string
  hostManager:
    type: object
    default: {}
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: false
      targetNamespace:
        type: string
        default: d8-cloud-instance-manager
      defaultOnline:
        type: boolean
        default: true
      defaultDisableAutomatedCleaning:
        type: boolean
        default: false
  internal:
    type: object
    default: {}
    properties:
      providerDiscoveryData:
        type: object
        default: {}
        properties:
          zones:
            type: array
            items:
              type: string
