apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    heritage: deckhouse
    module: cloud-provider-metal3
  name: metal3ramdiskimages.deckhouse.io
spec:
  group: deckhouse.io
  names:
    kind: Metal3RamdiskImage
    listKind: Metal3RamdiskImageList
    plural: metal3ramdiskimages
    singular: metal3ramdiskimage
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Architecture
      type: string
      jsonPath: .spec.direct.architecture
    - name: Kernel
      type: string
      jsonPath: .spec.direct.kernelURL
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
            x-doc-skip: true
          kind:
            type: string
            x-doc-skip: true
          metadata:
            type: object
          spec:
            type: object
            required:
            - direct
            properties:
              direct:
                type: object
                required:
                - kernelURL
                - initramfsURL
                properties:
                  architecture:
                    type: string
                    default: x86_64
                    pattern: '^(x86_64|aarch64)$'
                  kernelURL:
                    type: string
                    pattern: '^https?://'
                  initramfsURL:
                    type: string
                    pattern: '^https?://'
