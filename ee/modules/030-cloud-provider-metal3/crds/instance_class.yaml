apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    heritage: deckhouse
    module: cloud-provider-metal3
  name: metal3instanceclasses.deckhouse.io
spec:
  group: deckhouse.io
  names:
    categories:
    - cloudinstanceclasses
    kind: Metal3InstanceClass
    listKind: Metal3InstanceClassList
    plural: metal3instanceclasses
    singular: metal3instanceclass
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: false
    additionalPrinterColumns:
    - name: Node Groups
      type: string
      description: NodeGroups which use this instance class.
      jsonPath: .status.nodeGroupConsumers
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
            x-doc-skip: true
          kind:
            type: string
            x-doc-skip: true
          metadata:
            type: object
          spec:
            type: object
            required:
            - imageRef
            properties:
              imageRef:
                type: object
                description: Reference to the Metal3Image deployed through Ironic.
                required:
                - kind
                - name
                properties:
                  kind:
                    type: string
                    enum:
                    - Metal3Image
                  name:
                    type: string
                    minLength: 1
              hostSelector:
                type: object
                description: BareMetalHost label selector used by CAPM3 to claim hosts.
                properties:
                  matchLabels:
                    type: object
                    additionalProperties:
                      type: string
                  matchExpressions:
                    type: array
                    items:
                      type: object
                      required:
                      - key
                      - operator
                      properties:
                        key:
                          type: string
                        operator:
                          type: string
                          enum:
                          - In
                          - NotIn
                          - Exists
                          - DoesNotExist
                        values:
                          type: array
                          items:
                            type: string
              disableAutomatedCleaning:
                type: boolean
                default: false
                description: Disables Ironic automated cleaning for claimed BareMetalHosts. By default metadata cleaning is enabled.
              nodeReuse:
                type: boolean
                default: false
                description: Enables CAPM3 host reuse during upgrades.
              capacity:
                type: object
                description: Node capacity used by cluster-autoscaler when scaling from zero.
                required:
                - cpu
                - memory
                properties:
                  cpu:
                    pattern: '^[0-9]+m?$'
                    x-kubernetes-int-or-string: true
                    x-doc-example: "4000m"
                  memory:
                    pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                    x-kubernetes-int-or-string: true
                    x-doc-example: "8Gi"
          status:
            type: object
            properties:
              nodeGroupConsumers:
                type: array
                items:
                  type: string
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Node Groups
      type: string
      description: NodeGroups which use this instance class.
      jsonPath: .status.nodeGroupConsumers
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
            x-doc-skip: true
          kind:
            type: string
            x-doc-skip: true
          metadata:
            type: object
          spec:
            type: object
            required:
            - imageRef
            properties:
              imageRef:
                type: object
                description: Reference to the Metal3Image deployed through Ironic.
                required:
                - kind
                - name
                properties:
                  kind:
                    type: string
                    enum:
                    - Metal3Image
                  name:
                    type: string
                    minLength: 1
              hostSelector:
                type: object
                description: BareMetalHost label selector used by CAPM3 to claim hosts.
                properties:
                  matchLabels:
                    type: object
                    additionalProperties:
                      type: string
                  matchExpressions:
                    type: array
                    items:
                      type: object
                      required:
                      - key
                      - operator
                      properties:
                        key:
                          type: string
                        operator:
                          type: string
                          enum:
                          - In
                          - NotIn
                          - Exists
                          - DoesNotExist
                        values:
                          type: array
                          items:
                            type: string
              disableAutomatedCleaning:
                type: boolean
                default: false
                description: Disables Ironic automated cleaning for claimed BareMetalHosts. By default metadata cleaning is enabled.
              nodeReuse:
                type: boolean
                default: false
                description: Enables CAPM3 host reuse during upgrades.
              capacity:
                type: object
                description: Node capacity used by cluster-autoscaler when scaling from zero.
                required:
                - cpu
                - memory
                properties:
                  cpu:
                    pattern: '^[0-9]+m?$'
                    x-kubernetes-int-or-string: true
                    x-doc-example: "4000m"
                  memory:
                    pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$'
                    x-kubernetes-int-or-string: true
                    x-doc-example: "8Gi"
          status:
            type: object
            properties:
              nodeGroupConsumers:
                type: array
                items:
                  type: string
