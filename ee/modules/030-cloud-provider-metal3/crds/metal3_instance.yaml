apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    heritage: deckhouse
    module: cloud-provider-metal3
  name: metal3instances.deckhouse.io
spec:
  group: deckhouse.io
  names:
    kind: Metal3Instance
    listKind: Metal3InstanceList
    plural: metal3instances
    singular: metal3instance
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: BMC
      type: string
      jsonPath: .spec.bmc.address
    - name: Boot MAC
      type: string
      jsonPath: .spec.bootMACAddress
    - name: BMH
      type: string
      jsonPath: .status.bareMetalHost.name
    - name: State
      type: string
      jsonPath: .status.bareMetalHost.state
    - name: Consumer
      type: string
      jsonPath: .status.bareMetalHost.consumer
    - name: Online
      type: boolean
      jsonPath: .status.bareMetalHost.online
    - name: Error
      type: string
      jsonPath: .status.bareMetalHost.error
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
            x-doc-skip: true
          kind:
            type: string
            x-doc-skip: true
          metadata:
            type: object
          spec:
            type: object
            required:
            - bmc
            properties:
              pool:
                type: string
                description: Pool label value added to the generated BareMetalHost.
              online:
                type: boolean
                description: Desired BareMetalHost online state.
              bootMACAddress:
                type: string
                pattern: '^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$'
                description: MAC address of the NIC used for PXE boot.
              disableAutomatedCleaning:
                type: boolean
                description: Disables Ironic automated cleaning on the generated BareMetalHost. By default metadata cleaning is enabled.
              bmc:
                type: object
                required:
                - address
                - credentialsName
                properties:
                  address:
                    type: string
                    description: Full BMC address accepted by BareMetalHost, for example redfish+https://10.0.5.17/redfish/v1/Systems/system.
                  credentialsName:
                    type: string
                    description: Name of the source Secret with type cloud-provider.deckhouse.io/credentials and username and password keys in the Metal3Instance namespace.
                  disableCertificateVerification:
                    type: boolean
                    description: Disables TLS certificate verification for BMC access.
                  bootMACAddress:
                    type: string
                    pattern: '^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$'
                    description: Deprecated compatibility field. Use spec.bootMACAddress.
                  online:
                    type: boolean
                    description: Deprecated compatibility field. Use spec.online.
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              bareMetalHost:
                type: object
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                  state:
                    type: string
                  consumer:
                    type: string
                  online:
                    type: boolean
                  error:
                    type: string
              credentialsSecret:
                type: object
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
              message:
                type: string
