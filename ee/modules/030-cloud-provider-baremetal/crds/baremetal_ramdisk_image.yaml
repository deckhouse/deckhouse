apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    heritage: deckhouse
    module: cloud-provider-baremetal
  name: baremetalramdiskimages.deckhouse.io
spec:
  group: deckhouse.io
  names:
    kind: BareMetalRamdiskImage
    listKind: BareMetalRamdiskImageList
    plural: baremetalramdiskimages
    singular: baremetalramdiskimage
  scope: Cluster
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Architecture
      type: string
      jsonPath: .spec.direct.architecture
    - name: Kernel
      type: string
      jsonPath: .spec.direct.kernelURL
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
            x-doc-skip: true
          kind:
            type: string
            x-doc-skip: true
          metadata:
            type: object
          spec:
            type: object
            required:
            - direct
            properties:
              direct:
                type: object
                required:
                - kernelURL
                - initramfsURL
                properties:
                  architecture:
                    type: string
                    default: x86_64
                    description: CPU architecture of the ramdisk. This is a closed set of supported values.
                    enum:
                    - x86_64
                    - aarch64
                  kernelURL:
                    type: string
                    pattern: '^https?://'
                  initramfsURL:
                    type: string
                    pattern: '^https?://'
