apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    heritage: deckhouse
    module: cloud-provider-baremetal
  name: baremetalipxefirmwares.deckhouse.io
spec:
  group: deckhouse.io
  names:
    kind: BareMetalIPXEFirmware
    listKind: BareMetalIPXEFirmwareList
    plural: baremetalipxefirmwares
    singular: baremetalipxefirmware
  scope: Cluster
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: BIOS URL
      type: string
      jsonPath: .spec.direct.bios.url
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          apiVersion: {type: string, x-doc-skip: true}
          kind: {type: string, x-doc-skip: true}
          metadata: {type: object}
          spec:
            type: object
            required: [direct]
            properties:
              direct:
                type: object
                required: [bios, uefiX86_64]
                properties:
                  bios:
                    type: object
                    required: [url, sha256]
                    properties:
                      url: {type: string, pattern: '^https://', maxLength: 2048}
                      sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                  uefiX86_64:
                    type: object
                    required: [url, sha256]
                    properties:
                      url: {type: string, pattern: '^https://', maxLength: 2048}
                      sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                  uefiArm64:
                    type: object
                    required: [url, sha256]
                    properties:
                      url: {type: string, pattern: '^https://', maxLength: 2048}
                      sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
