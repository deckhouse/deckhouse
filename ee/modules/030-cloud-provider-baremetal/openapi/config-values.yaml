type: object
additionalProperties: false
description: Describes the configuration of a bare-metal cloud provider.
properties:
  nodes:
    type: object
    additionalProperties: false
    required:
    - parameters
    properties:
      parameters:
        type: object
        additionalProperties: false
        required:
        - ironic
        properties:
          ironic:
            type: object
            additionalProperties: false
            oneOf:
            - required:
              - externalInstance
              not:
                anyOf:
                - required:
                  - provisioningNetwork
                - required:
                  - dhcp
                - required:
                  - ramdiskImageRef
            - required:
              - provisioningNetwork
              - dhcp
              not:
                required:
                - externalInstance
            properties:
              bmcProbeTimeoutSeconds:
                type: integer
                default: 15
                minimum: 1
                maximum: 300
                description: Timeout in seconds for a single BMC protocol probe.
              externalInstance:
                type: object
                additionalProperties: false
                required:
                - endpoint
                properties:
                  endpoint:
                    type: string
                    pattern: '^https?://.+/v1/?$'
                    maxLength: 2048
                    description: External provisioning API endpoint reachable by the host management operator.
                  credentialsRef:
                    type: object
                    additionalProperties: false
                    required:
                    - kind
                    - name
                    - namespace
                    properties:
                      kind:
                        type: string
                        enum:
                        - Secret
                      name:
                        type: string
                        minLength: 1
                        maxLength: 253
                      namespace:
                        type: string
                        pattern: '^d8-cloud-provider-baremetal$'
                  tls:
                    type: object
                    additionalProperties: false
                    properties:
                      caCertRef:
                        type: object
                        additionalProperties: false
                        required:
                        - kind
                        - name
                        - namespace
                        - key
                        properties:
                          kind:
                            type: string
                            enum:
                            - Secret
                          name:
                            type: string
                            minLength: 1
                            maxLength: 253
                          namespace:
                            type: string
                            pattern: '^d8-cloud-provider-baremetal$'
                          key:
                            type: string
                            minLength: 1
                            maxLength: 253
                      clientCertRef:
                        type: object
                        additionalProperties: false
                        required:
                        - kind
                        - name
                        - namespace
                        - certKey
                        - privateKey
                        properties:
                          kind:
                            type: string
                            enum:
                            - Secret
                          name:
                            type: string
                            minLength: 1
                            maxLength: 253
                          namespace:
                            type: string
                            pattern: '^d8-cloud-provider-baremetal$'
                          certKey:
                            type: string
                            minLength: 1
                            maxLength: 253
                          privateKey:
                            type: string
                            minLength: 1
                            maxLength: 253
                      insecure:
                        type: boolean
                        default: false
              provisioningNetwork:
                type: object
                additionalProperties: false
                required:
                - interface
                - ipAddress
                properties:
                  interface:
                    type: string
                    pattern: '^[A-Za-z0-9_.:-]{1,15}$'
                  ipAddress:
                    type: string
                    format: ipv4
              dhcp:
                type: object
                additionalProperties: false
                oneOf:
                - required:
                  - internal
                - required:
                  - external
                properties:
                  internal:
                    type: object
                    additionalProperties: false
                    not:
                      required:
                      - dnsAddress
                      - serveDNS
                      properties:
                        serveDNS:
                          enum:
                          - true
                    required:
                    - networkCIDR
                    - rangeBegin
                    - rangeEnd
                    properties:
                      networkCIDR:
                        type: string
                        format: cidr
                      rangeBegin:
                        type: string
                        format: ipv4
                      rangeEnd:
                        type: string
                        format: ipv4
                      dnsAddress:
                        type: string
                        format: ipv4
                      gatewayAddress:
                        type: string
                        format: ipv4
                      serveDNS:
                        type: boolean
                        default: false
                  external:
                    type: object
                    additionalProperties: false
                    required:
                    - pxeBootServer
                    properties:
                      pxeBootServer:
                        type: string
                        format: ipv4
                      pxeBootFile:
                        type: object
                        additionalProperties: false
                        properties:
                          bios:
                            type: string
                            minLength: 1
                            maxLength: 1024
                          uefi:
                            type: string
                            minLength: 1
                            maxLength: 1024
              ramdiskImageRef:
                type: object
                additionalProperties: false
                required:
                - kind
                - name
                properties:
                  kind:
                    type: string
                    enum:
                    - BareMetalRamdiskImage
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
