---
image: {{ $.ModuleName }}/{{ $.ImageName }}
fromImage: common/distroless
import:
  - image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
    add: /baremetal-instance-manager
    to: /baremetal-instance-manager
    before: setup
imageSpec:
  config:
    entrypoint: ["/baremetal-instance-manager"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
fromImage: common/src-artifact
git:
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
  to: /src
  stageDependencies:
    install:
      - go.mod
      - go.sum
      - "**/*.go"
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/golang" }}
mount:
  - fromPath: ~/go-pkg-cache
    to: /go/pkg
import:
  - image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /src
    to: /src
    before: install
shell:
  install:
    - export GOPROXY={{ $.GOPROXY }}
    - cd /src
    - go mod download
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o /baremetal-instance-manager ./cmd/baremetal-instance-manager
    - chown 64535:64535 /baremetal-instance-manager
    - chmod 0755 /baremetal-instance-manager
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName )) }}
