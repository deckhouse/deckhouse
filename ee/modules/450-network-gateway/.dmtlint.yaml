linters-settings:
  module:
    oss:
      disable: true
  container:
    exclude-rules:
      liveness-probe:
        - kind: DaemonSet
          name: snat
          container: snat
        - kind: StatefulSet
          name: dhcp
          container: dhcp
      readiness-probe:
        - kind: DaemonSet
          name: snat
          container: snat
        - kind: StatefulSet
          name: dhcp
          container: dhcp
