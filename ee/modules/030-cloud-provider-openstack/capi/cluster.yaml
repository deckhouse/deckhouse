version: v1
template: |
  {{- $provider := .provider | required "provider configuration is required" }}
  {{- $apiServerFloatingIP := true }}
  {{- if hasKey $provider "apiServerFloatingIP" }}
    {{- $apiServerFloatingIP = $provider.apiServerFloatingIP }}
  {{- end }}
  apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
  kind: OpenStackCluster
  metadata:
    namespace: {{ .cluster.namespace | quote }}
    name: {{ .cluster.name | quote }}
    labels:
      app: capo-controller-manager
  spec:
    apiServerLoadBalancer:
      enabled: false
  {{- if not $apiServerFloatingIP }}
    disableAPIServerFloatingIP: true
    {{- if hasKey . "controlPlane" }}
      {{- if gt (len .controlPlane.endpoints) 0 }}
        {{- $endpoint := first .controlPlane.endpoints }}
    controlPlaneEndpoint:
      host: {{ $endpoint.host | quote }}
      port: {{ $endpoint.port }}
      {{- end }}
    {{- end }}
  {{- end }}
    network:
      filter:
        name: {{ first $provider.internalNetworkNames | quote }}
  {{- if hasKey $provider "externalNetworkNames" }}
    {{- if gt (len $provider.externalNetworkNames) 0 }}
    externalNetwork:
      filter:
        name: {{ first $provider.externalNetworkNames | quote }}
    {{- else }}
    disableExternalNetwork: true
    {{- end }}
  {{- else }}
    disableExternalNetwork: true
  {{- end }}
    identityRef:
      cloudName: openstack
      name: capi-user-credentials
