version: v1
template: |
  {{- $provider := .provider | required "provider configuration is required" }}
  {{- /*
    The leading \n is load-bearing. The node-manager chart built this file with a `define`
    whose body started on the next line, so the rendered clouds.yaml began with an empty line
    and the base64 in the Secret was computed over those bytes. Dropping it changes the base64,
    which rewrites the Secret on every upgraded cluster and restarts capo-controller-manager
    for no reason. Keep it until the whole fleet is past the migration.
  */}}
  {{- $cloudsYAML := printf "\nclouds:\n  openstack:\n    auth:\n      auth_url: %s\n      username: %s\n      password: %s\n"
    ($provider.connection.authURL | quote)
    ($provider.connection.username | quote)
    ($provider.connection.password | quote)
  }}
  {{- with get $provider.connection "tenantName" }}
    {{- $cloudsYAML = printf "%s      project_name: %s\n" $cloudsYAML (. | quote) }}
  {{- end }}
  {{- with get $provider.connection "tenantID" }}
    {{- $cloudsYAML = printf "%s      project_id: %s\n" $cloudsYAML (. | quote) }}
  {{- end }}
  {{- $cloudsYAML = printf "%s      user_domain_name: %s\n      project_domain_name: %s\n    region_name: %s\n    identity_api_version: 3"
    $cloudsYAML
    ($provider.connection.domainName | quote)
    ($provider.connection.domainName | quote)
    ($provider.connection.region | quote)
  }}
  apiVersion: v1
  kind: Secret
  metadata:
    name: capi-user-credentials
    namespace: {{ .cluster.namespace | quote }}
    labels:
      app: capo-controller-manager
  type: Opaque
  data:
    {{- with get $provider.connection "caCert" }}
    cacert: {{ . | b64enc | quote }}
    {{- end }}
    clouds.yaml: {{ $cloudsYAML | b64enc | quote }}
