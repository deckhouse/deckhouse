version: v2

# InstanceClass fields whose change requires recreating the machines, carried over one to one from
# the v1 instance-class.checksum. `capacity` is deliberately absent: it is a hint for the
# cluster-autoscaler's scale-from-zero, not a property of the VM, and rolling the whole fleet when
# an operator corrects it would be pure harm.
rolloutFields:
  - flavorName
  - imageName
  - mainNetwork
  - additionalNetworks
  - rootDiskSize
  - additionalSecurityGroups
  - additionalTags

# failureDomain lives in the MachineDeployment, which node-controller builds itself — the provider
# template renders the machine template only. Under v1 this single field needed a whole extra
# file (machine-deployment-spec-patch.yaml) with ${zone} substituted into raw YAML.
machineDeployment:
  additionalFields:
    failureDomain: zone

# Optional fields are read with `get`/`hasKey`: the sandbox runs with missingkey=error, so a direct
# path to an absent key fails the render on purpose.
template: |
  apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
  kind: OpenStackMachineTemplate
  spec:
    template:
      spec:
        configDrive: true
        flavor: {{ .instanceClass.flavorName | quote}}
      {{- if hasKey .instanceClass "imageName" }}
        image:
          filter:
            name: {{ .instanceClass.imageName }}
      {{- else if hasKey .provider.instances "imageName" }}
        image:
          filter:
            name: {{ .provider.instances.imageName }}
      {{- else }}
        {{ fail "No imageName provided neither in cloud provider configuration nor in OpenStackInstanceClass" }}
      {{- end }}
    {{- if hasKey .provider "instances" }}
      {{- if hasKey .provider.instances "sshKeyPairName" }}
        sshKeyName: {{ .provider.instances.sshKeyPairName }}
      {{- end }}
    {{- end }}

      {{- $securityGroups := list }}
      {{- if hasKey .provider.instances "securityGroups" }}
        {{- $securityGroups = concat $securityGroups .provider.instances.securityGroups }}
      {{- end }}
      {{- if hasKey .instanceClass "additionalSecurityGroups" }}
        {{- $securityGroups = concat $securityGroups .instanceClass.additionalSecurityGroups }}
      {{- end }}
      {{- $networks := list }}
      {{- if hasKey .instanceClass "additionalNetworks" }}
        {{- range $additionalNetwork := .instanceClass.additionalNetworks }}
          {{- $networks = append $networks $additionalNetwork }}
       {{- end }}
      {{- else if hasKey .provider.instances "additionalNetworks" }}
        {{- range $additionalNetwork := .provider.instances.additionalNetworks }}
          {{- $networks = append $networks $additionalNetwork }}
        {{- end }}
      {{- end }}
      {{- if hasKey .instanceClass "mainNetwork" }}
        {{- $networks = prepend $networks .instanceClass.mainNetwork }}
      {{- else if hasKey .provider.instances "mainNetwork" }}
        {{- $networks = prepend $networks .provider.instances.mainNetwork }}
      {{- else}}
        {{ fail "No mainNetwork provided neither in cloud provider configuration nor in OpenStackInstanceClass" }}
      {{- end }}
      {{- if gt (len $securityGroups) 0 }}
        securityGroups:
        {{- range $securityGroups | uniq }}
        - filter:
            name: {{ . }}
      {{- end }}
      {{- end }}
      {{- if or (gt (len $securityGroups) 0) (eq .provider.podNetworkMode "DirectRoutingWithPortSecurityEnabled") }}
        ports:
        {{- range $networks | uniq }}
        - network:
            filter:
              name: {{ . | quote }}
          {{- if gt (len $securityGroups) 0 }}
          securityGroups:
          {{- range $securityGroups | uniq }}
          - filter:
              name: {{ . }}
          {{- end }}
          {{- end }}
          {{- if and (has . $.provider.internalNetworkNames) (eq $.provider.podNetworkMode "DirectRoutingWithPortSecurityEnabled") }}
          allowedAddressPairs:
          - ipAddress: {{ $.cluster.podSubnet | quote }}
          {{- end }}
      {{- end }}
    {{- end }}
      {{- if hasKey .instanceClass "rootDiskSize" }}
        rootVolume:
          sizeGiB: {{ .instanceClass.rootDiskSize }}
          availabilityZone:
            from: Machine
      {{- end }}
        tags:
        {{- $tags := dict }}
        {{- if get .provider "tags" }}
          {{- $tags = merge $tags .provider.tags }}
        {{- end }}
        {{- if hasKey .instanceClass "additionalTags" }}
          {{- $tags = mergeOverwrite $tags .instanceClass.additionalTags }}
        {{- end }}
        {{- range $k, $v := $tags }}
         - {{ (printf "%s=%s" $k $v) | quote }}
        {{- end }}
          # These tags are mandatory as the safety controller uses them to identify VMs created by this controller.
         - "deckhouse-{{ .cluster.uuid }}=1"
         - "role-deckhouse-{{ .nodeGroup.name }}-{{ .zone }}=1"
         - "use-cluster-api=1"
        schedulerHintAdditionalProperties:
        - name: deckhouse-zone
          value:
            type: String
            string: {{ .zone }}
