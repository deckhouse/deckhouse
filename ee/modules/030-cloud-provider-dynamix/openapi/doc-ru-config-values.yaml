properties:
  storageClass:
    description: |
      Автоматическое создание StorageClass'а для каждой storage policy, доступной аккаунту кластера.
    properties:
      exclude:
        description: |
          Полные имена (или regex выражения имен) StorageClass'ов, которые не будут созданы в кластере.
      default:
        description: |-
          Имя StorageClass'а, который модуль пометит как используемый по умолчанию среди создаваемых им.

          Параметр действует, только пока на роль default никто больше не претендует: StorageClass,
          уже имеющий default-аннотацию, её сохраняет, а `global.defaultClusterStorageClass`
          перекрывает оба варианта. То есть параметр задаёт default кластеру, у которого его ещё нет,
          и не переносит аннотацию в кластере, где default уже выбран.

          Если значение не указано, фактический StorageClass по умолчанию будет определен следующим образом:

          * произвольный StorageClass в кластере, имеющий default-аннотацию;
          * первый (по алфавиту) StorageClass из тех, что создаются модулем.

          > **Параметр устарел.** Вместо этого параметра используйте глобальный параметр [global.defaultClusterStorageClass](/products/kubernetes-platform/documentation/v1/reference/api/global.html#parameters-defaultclusterstorageclass).
