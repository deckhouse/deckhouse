version: v2

# InstanceClass fields whose change requires recreating the machines. All but the last are carried
# over one to one from the v1 instance-class.checksum; `storagePolicy` is new in Dynamix 4.6, and it
# belongs here for the same reason as the disk size: the platform picks where the boot disk lives
# when the VM is created and cannot move it afterwards, so a policy change reaches a node only by
# recreating it.
rolloutFields:
  - imageName
  - numCPUs
  - memory
  - rootDiskSizeGb
  - externalNetwork
  - storagePolicy

# The cluster-wide `storagePolicy` is the effective policy of every NodeGroup that does not override
# it in its InstanceClass, so changing it must recreate those machines just as the InstanceClass
# field does — and DynamixClusterConfiguration promises the user exactly that. Nothing else the
# module publishes into d8-node-manager-cloud-provider describes the VM.
#
# The comparison sees this field, not the effective policy, so the edit also recreates the machines
# of a NodeGroup that overrides it and whose rendered object does not change. Accepted: the
# alternative is an override that silently keeps a node in a policy nobody names any more.
providerRolloutFields:
  - storagePolicy

# Every field below except storagePolicy is read with `get` and gated on what it returns: the
# sandbox runs with missingkey=error, and `get` yields an empty value for an absent key — which is
# exactly the truthy test the v1 template did with a direct path.
#
# storagePolicy is the exception, rendered unconditionally, because the DynamixMachineTemplate CRD
# requires it (Dynamix 4.6 refuses to create a VM without a storage policy): the InstanceClass
# override if there is one, the cluster-wide value otherwise. With neither, `required` refuses the
# render — an empty policy is a VM the platform will not create — and the message says where to set
# the field, because node-controller wraps it with the NodeGroup and the zone and nothing else.
template: |
  apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
  kind: DynamixMachineTemplate
  spec:
    template:
      spec:
        {{- if get .instanceClass "imageName" }}
        imageName: {{ .instanceClass.imageName | quote }}
        {{- end }}
        storagePolicy: {{ get .instanceClass "storagePolicy" | default (get .provider "storagePolicy") | required "no storagePolicy: set it in the instance class, or cluster-wide in DynamixClusterConfiguration" | quote }}
        {{- if get .instanceClass "numCPUs" }}
        cpu: {{ .instanceClass.numCPUs }}
        {{- end }}
        {{- if get .instanceClass "memory" }}
        memory: {{ .instanceClass.memory }}
        {{- end }}
        {{- if get .instanceClass "rootDiskSizeGb" }}
        rootDiskSizeGb: {{ .instanceClass.rootDiskSizeGb }}
        {{- end }}
        {{- if get .instanceClass "externalNetwork" }}
        externalNetwork: {{ .instanceClass.externalNetwork }}
        {{- end }}
