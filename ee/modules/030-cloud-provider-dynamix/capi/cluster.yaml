version: v1
template: |
  {{- $prefix := .prefix | required "prefix is required" }}
  apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
  kind: DynamixCluster
  metadata:
    name: {{ .cluster.name | quote }}
    namespace: {{ .cluster.namespace | quote }}
    labels:
      app: capd-controller-manager
  spec:
    resourceGroup: {{ printf "%s-rg" $prefix | quote }}
