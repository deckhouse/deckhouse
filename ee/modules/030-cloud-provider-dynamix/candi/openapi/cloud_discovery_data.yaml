kind: DynamixCloudProviderDiscoveryData
apiVersions:
- apiVersion: deckhouse.io/v1
  openAPISpec:
    type: object
    additionalProperties: false
    required: [apiVersion, kind]
    properties:
      apiVersion:
        type: string
        enum: [deckhouse.io/v1]
      kind:
        type: string
        enum: [DynamixCloudProviderDiscoveryData]
      zones:
        type: array
        items:
          type: string
      storagePolicies:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
            limitIOPS:
              type: integer
              minimum: 0
        description: List of storage policies available to the account.
