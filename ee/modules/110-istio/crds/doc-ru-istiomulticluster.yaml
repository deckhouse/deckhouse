spec:
  scope: Cluster
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Ресурс для обозначения удалённого кластера как доверенного.
          properties:
            spec:
              properties:
                enableIngressGateway:
                  description: |
                    Использование IngressGateway для доступа к удалённым подам.

                    Если поды между кластерами могут быть напрямую связаны друг с другом (например, при использовании «плоской» сети — flat network), тогда использование дополнительного маршрута может быть неэффективным, и лучше избежать лишних переходов.
                  default: true
                metadataEndpoint:
                  description: |
                    HTTPS-эндпоинт c метаданными удалённого кластера.
                metadata:
                  properties:
                    ca:
                      description: |
                        HTTPS-сертификат удостоверяющего центра для чтения метаданных удалённого кластера.
                    insecureSkipVerify:
                      description: |
                        Включение или выключение проверки сертификата удостоверяющего центра для чтения метаданных удалённого кластера.
            status:
              properties:
                conditions:
                  description: |
                    Готовность обмена метаданными с удалённым кластером.

                    - `PublicMetadataExchangeReady` — удалённый `public.json` доступен и валиден.
                      Если `status.metadataCache.public.clusterUUID` уже задан, UUID из ответа endpoint должен с ним совпадать; иначе condition переходит в `False` с reason `ClusterUUIDMismatch`.
                    - `PrivateMetadataExchangeReady` — удалённые приватные метаданные доступны и валидны.
                    - `RemoteAPIServerReady` — удалённый API-хост multicluster (`apiHost`) отвечает на аутентифицированный `/api`.
                    - `DataplaneConnectionReady` — успешна межкластерная health-проверка dataplane к сервису `alliance-healthcheck`.
