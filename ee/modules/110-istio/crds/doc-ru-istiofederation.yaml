spec:
  scope: Cluster
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Ресурс для настройки удалённого кластера как доверенного.
          properties:
            spec:
              properties:
                trustDomain:
                  description: |
                    TrustDomain удалённого кластера.

                    Deckhouse использует это значение, чтобы сертификаты удалённого кластера были доверенными только для этого домена, а не для сервисов локального mesh.
                metadataEndpoint:
                  description: |
                   HTTPS-эндпоинт, который используется для публикации метаданных удаленного кластера.
                metadata:
                  properties:
                    insecureSkipVerify:
                      description: |
                        Исключение проверки HTTPS-сертификата на стороне клиента для URL, который используется для публикации метаданных удаленного кластера.
                    ca:
                      description: |
                        Сертификат для проверки HTTPS URL, который используется для публикации метаданных удаленного кластера.
