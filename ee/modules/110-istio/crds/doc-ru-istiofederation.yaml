spec:
  scope: Cluster
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Ресурс для настройки удалённого кластера как доверенного.
          properties:
            spec:
              properties:
                trustDomain:
                  description: |
                    TrustDomain удаленного кластера.
                   
                    Указание этого параметра является обязательным, однако на данный момент он не используется, так как текущая версия Istio не поддерживает привязку TrustDomain к корневому сертификату центра сертификации (CA).
                metadataEndpoint:
                  description: |
                   HTTPS-эндпоинт, который используется для публикации метаданных удаленного кластера.
                metadata:
                  properties:
                    insecureSkipVerify:
                      description: |
                        Исключение проверки HTTPS-сертификата на стороне клиента для URL, который используется для публикации метаданных удаленного кластера.
                    ca:
                      description: |
                        Сертификат для проверки HTTPS URL, который используется для публикации метаданных удаленного кластера.
            status:
              properties:
                conditions:
                  description: |
                    Готовность обмена метаданными с удалённым кластером.

                    - `PublicMetadataExchangeReady` — удалённый `public.json` доступен и валиден.
                      Если `status.metadataCache.public.clusterUUID` уже задан, UUID из ответа endpoint должен с ним совпадать; иначе condition переходит в `False` с reason `ClusterUUIDMismatch`.
                    - `PrivateMetadataExchangeReady` — удалённые приватные метаданные доступны и валидны.
                    - `DataplaneConnectionReady` — успешна межкластерная health-проверка dataplane к сервису `alliance-healthcheck`.
