---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: waypointinstances-ambient-enabled.deckhouse.io
  {{- include "helm_lib_module_labels" (list $) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   ["network.deckhouse.io"]
        apiVersions: ["v1alpha1"]
        operations:  ["CREATE"]
        resources:   ["waypointinstances"]
        scope:       "Namespaced"
  validations:
    - expression: "{{ .Values.istio.ambient.enabled }}"
      reason: Forbidden
      message: "WaypointInstance can only be created when ambient mesh is enabled. Enable spec.settings.ambient.enabled in the istio ModuleConfig."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: waypointinstances-ambient-enabled.deckhouse.io
  {{- include "helm_lib_module_labels" (list $) | nindent 2 }}
spec:
  policyName: waypointinstances-ambient-enabled.deckhouse.io
  validationActions: [Deny]
