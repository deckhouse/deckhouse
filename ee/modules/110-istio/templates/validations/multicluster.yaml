---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: istiomulticlusters-multicluster-enabled.deckhouse.io
  {{- include "helm_lib_module_labels" (list $) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   ["deckhouse.io"]
        apiVersions: ["v1alpha1"]
        operations:  ["CREATE"]
        resources:   ["istiomulticlusters"]
        scope:       "Cluster"
  validations:
    - expression: "{{ .Values.istio.multicluster.enabled }}"
      reason: Forbidden
      message: "IstioMulticlusters can only be created when multicluster is enabled. Enable spec.settings.multicluster.enabled in the istio ModuleConfig."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: istiomulticlusters-multicluster-enabled.deckhouse.io
  {{- include "helm_lib_module_labels" (list $) | nindent 2 }}
spec:
  policyName: istiomulticlusters-multicluster-enabled.deckhouse.io
  validationActions: [Deny]
