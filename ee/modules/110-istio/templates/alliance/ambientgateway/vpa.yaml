{{- if include "istioAmbientMulticlusterEnabled" . }}
{{- if (.Values.global.enabledModules | has "vertical-pod-autoscaler") }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ambientgateway
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict
    "app" "ambientgateway"
  )) | nindent 2 }}
spec:
  resourcePolicy:
    containerPolicies:
    - containerName: istio-proxy
      minAllowed:
        cpu: 100m
        memory: 128Mi
      maxAllowed:
        cpu: 1000m
        memory: 1024Mi
  targetRef:
    apiVersion: "apps/v1"
    kind: DaemonSet
    name: ambientgateway
  updatePolicy:
    updateMode: "Initial"
{{- end }}
{{- end }}
