{{- if include "istioAmbientMulticlusterEnabled" . }}
{{- $ambientGateway := .Values.istio.alliance.ambientGateway }}
{{- $ingressGateway := .Values.istio.alliance.ingressGateway }}
{{- if and (eq $ambientGateway.inlet "NodePort") (eq $ingressGateway.inlet "NodePort")
      $ambientGateway.nodePort.port (eq ($ambientGateway.nodePort.port | int) ($ingressGateway.nodePort.port | default 0 | int)) }}
  {{- fail (printf "istio: alliance.ingressGateway.nodePort.port and alliance.ambientGateway.nodePort.port are both %v, but the east-west gateways are separate Services and cannot share a node port" $ambientGateway.nodePort.port) }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ambientgateway
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict
    "app" "ambientgateway"
  )) | nindent 2 }}
  {{- with $ambientGateway.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  externalTrafficPolicy: Local
  ports:
  - name: hbone
    port: 15008
    protocol: TCP
  {{- if and (eq $ambientGateway.inlet "NodePort") $ambientGateway.nodePort.port }}
    nodePort: {{ $ambientGateway.nodePort.port }}
  {{- end }}
  selector:
    app: ambientgateway
  sessionAffinity: None
  {{- if eq $ambientGateway.inlet "NodePort" }}
  type: NodePort
  {{- else }}
  type: LoadBalancer
  {{- with $ambientGateway.loadBalancerClass }}
  loadBalancerClass: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
