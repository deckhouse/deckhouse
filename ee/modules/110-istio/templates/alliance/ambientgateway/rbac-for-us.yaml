{{- if include "istioAmbientMulticlusterEnabled" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alliance-ambientgateway
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict
    "app" "ambientgateway"
  )) | nindent 2 }}
automountServiceAccountToken: false
{{- end }}
