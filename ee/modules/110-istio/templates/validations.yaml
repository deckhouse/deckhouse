---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: public-services-federation.deckhouse.io
  {{- include "helm_lib_module_labels" (list $) | nindent 2 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["services"]
        scope:       "Namespaced"
  variables:
    - name: isPublicService
      expression: "has(object.metadata.labels) && 'federation.istio.deckhouse.io/public-service' in object.metadata.labels"
    - name: portsWithoutName
      expression: "has(object.spec.ports) ? object.spec.ports.filter(p, !has(p.name)) : []"
  validations:
    - expression: "!variables.isPublicService || object.spec.type != 'ExternalName'"
      reason: Forbidden
      message: "A service of ExternalName type cannot be published in federation."
    - expression: "!variables.isPublicService || has(object.spec.ports)"
      reason: Forbidden
      message: "A service without the '.spec.ports' field cannot be published in federation."
    - expression: "!variables.isPublicService || variables.portsWithoutName.size() == 0"
      reason: Forbidden
      messageExpression: >
        "Port \"" + variables.portsWithoutName[0].protocol + " " + string(variables.portsWithoutName[0].port) +
        "\" of the service has no 'name' field set and cannot be published. Please, define the port name " +
        "according to the following list of name suffixes supported by Istio: http, http2, https, tcp, tls, grpc, grpc-web."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: public-services-federation.deckhouse.io
  {{- include "helm_lib_module_labels" (list $) | nindent 2 }}
spec:
  policyName: public-services-federation.deckhouse.io
  validationActions: [Deny]
