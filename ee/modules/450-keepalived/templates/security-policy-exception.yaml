{{- if (.Values.global.enabledModules | has "admission-policy-engine") }}
---
apiVersion: deckhouse.io/v1alpha1
kind: SecurityPolicyException
metadata:
  name: keepalived
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "keepalived")) | nindent 2 }}
spec:
  securityContext:
    runAsNonRoot:
      allowedValue: false
      metadata:
        description: |
          keepalived must run as root to manage VirtualIP addresses via VRRP on the host
          network interfaces.
    runAsUser:
      allowedValues:
        - 0
      metadata:
        description: |
          UID 0 is required for VRRP packet handling and binding virtual IP addresses.
    capabilities:
      allowedValues:
        add:
          - NET_ADMIN
          - NET_RAW
          - DAC_OVERRIDE
        drop:
          - ALL
      metadata:
        description: |
          NET_ADMIN/NET_RAW are required for VRRP and VIP management; DAC_OVERRIDE is
          required to execute the keepalived binary which is owned by UID 64535 with mode 0700.
  network:
    hostNetwork:
      allowedValue: true
      metadata:
        description: |
          keepalived must join the host network namespace to send VRRP advertisements and
          configure virtual IP addresses on node interfaces.
{{- end }}
