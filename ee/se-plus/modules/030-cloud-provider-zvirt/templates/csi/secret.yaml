{{- define "csi_cloud_config" }}
ovirt_url: {{ .Values.cloudProviderZvirt.provider.parameters.server | quote }}
ovirt_username: {{ include "zvirt_credential_secret" (list . "d8-credentials" "identity") | quote }}
ovirt_password: {{ include "zvirt_credential_secret" (list . "d8-credentials" "secret") | quote }}
ovirt_insecure: {{ dig "provider" "parameters" "insecure" false .Values.cloudProviderZvirt }}
  {{- if dig "provider" "parameters" "caBundle" "" .Values.cloudProviderZvirt }}
ovirt_cafile: "/etc/cloud/ca/zvirt_ca.pem"
  {{- end }}
clusterid: {{ .Values.global.discovery.clusterUUID }}
{{- end }}

{{- if not (default false (dig "storage" "disabled" false .Values.cloudProviderZvirt)) }}
{{- if and (.Values.cloudProviderZvirt.provider.parameters.server) (include "zvirt_credential_secret" (list . "d8-credentials" "identity")) (include "zvirt_credential_secret" (list . "d8-credentials" "secret")) (ne .Values.global.discovery.clusterUUID "") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: csi-controller-manager
  namespace: d8-cloud-provider-zvirt
  {{- include "helm_lib_module_labels" (list . (dict "app" "csi-controller")) | nindent 2 }}
type: Opaque
data:
  cloud-config: {{ include "csi_cloud_config" . | b64enc | quote }}
{{- end }}

{{- if dig "provider" "parameters" "caBundle" "" .Values.cloudProviderZvirt }}
---
apiVersion: v1
kind: Secret
metadata:
  name: csi-controller-manager-ca
  namespace: d8-cloud-provider-zvirt
  {{- include "helm_lib_module_labels" (list . (dict "app" "csi-controller")) | nindent 2 }}
type: Opaque
data:
  zvirt_ca.pem: {{ dig "provider" "parameters" "caBundle" "" .Values.cloudProviderZvirt | quote }}
{{- end }}
{{- end }}
