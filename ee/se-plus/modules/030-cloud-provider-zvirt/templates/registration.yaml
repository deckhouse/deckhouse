{{- $providerID := "zvirt" }}
{{- define "registration_values" }}
{{- $context := index . 0 }}
{{- $providerDiscoveryData := $context.Values.cloudProviderZvirt.internal.providerDiscoveryData | required "internal.providerDiscoveryData is required" }}
{{- $zones :=  $providerDiscoveryData.zones }}
{{- $region := "default" }}
type: {{ b64enc "zvirt" | quote }}
# oVirt/zVirt lacks regions and zones, so we mock a single region and zone
region: {{ b64enc $region | quote }}
zones: {{ $zones | toJson | b64enc | quote }}
# Served InstanceClass version that node-controller must use. Change it only after adding the
# version and conversions: it affects the checksum that names an immutable machine template.
instanceClassAPIVersion: {{ b64enc "v1" | quote }}
instanceClassKind: {{ b64enc "ZvirtInstanceClass" | quote }}
machineClassKind: {{ b64enc "" | quote }}
capiClusterKind: {{ b64enc "ZvirtCluster" | quote }}
capiClusterAPIVersion: {{ b64enc "infrastructure.cluster.x-k8s.io/v1" | quote }}
capiClusterName: {{ b64enc "zvirt" | quote }}
capiMachineTemplateKind: {{ b64enc "ZvirtMachineTemplate" | quote }}
capiMachineTemplateAPIVersion: {{ b64enc "infrastructure.cluster.x-k8s.io/v1" | quote }}
sshPublicKey: {{ $context.Values.cloudProviderZvirt.nodes.parameters.sshPublicKey | b64enc | quote }}

{{- $zvirtValues := dict }}

{{- $_ := set $zvirtValues "sshPublicKey" $context.Values.cloudProviderZvirt.nodes.parameters.sshPublicKey }}
{{- $_ := set $zvirtValues "server" $context.Values.cloudProviderZvirt.provider.parameters.server }}
{{- $_ := set $zvirtValues "username" (include "zvirt_credential_secret" (list $context "d8-credentials" "identity")) }}
{{- $_ := set $zvirtValues "password" (include "zvirt_credential_secret" (list $context "d8-credentials" "secret")) }}
{{- $_ := set $zvirtValues "insecure" (dig "provider" "parameters" "insecure" false $context.Values.cloudProviderZvirt) }}
{{- $_ := set $zvirtValues "clusterID" $context.Values.cloudProviderZvirt.provider.parameters.clusterID }}

zvirt: {{ $zvirtValues | toJson | b64enc | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: d8-node-manager-cloud-provider
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list . (dict
    "cloud-provider.deckhouse.io/registration" ""
    "cloud-provider.deckhouse.io/name" $providerID
    )) | nindent 2 }}
type: Opaque
data: {{- include "registration_values" (list . ) | nindent 2 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "d8-node-manager-cloud-provider-%s" $providerID }}
  namespace: kube-system
  {{- include "helm_lib_module_labels" (list . (dict
    "cloud-provider.deckhouse.io/registration" ""
    "cloud-provider.deckhouse.io/name" $providerID
    )) | nindent 2 }}
type: Opaque
data: {{- include "registration_values" (list . ) | nindent 2 }}
