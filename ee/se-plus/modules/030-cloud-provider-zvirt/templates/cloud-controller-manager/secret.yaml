{{- if not (default false (dig "ccm" "disabled" false .Values.cloudProviderZvirt)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ccm-zvirt-credentials
  namespace: d8-cloud-provider-zvirt
  {{- include "helm_lib_module_labels" (list . (dict "app" "cloud-controller-manager")) | nindent 2 }}
type: Opaque
data:
  username: {{ include "zvirt_credential_secret" (list . "d8-credentials" "identity") | b64enc | quote }}
  password: {{ include "zvirt_credential_secret" (list . "d8-credentials" "secret") | b64enc | quote }}
  server: {{ .Values.cloudProviderZvirt.provider.parameters.server | b64enc | quote }}
  insecure: {{ dig "provider" "parameters" "insecure" false .Values.cloudProviderZvirt | toString | b64enc | quote }}
  caBundle: {{ dig "provider" "parameters" "caBundle" "" .Values.cloudProviderZvirt | quote }}
{{- end }}
