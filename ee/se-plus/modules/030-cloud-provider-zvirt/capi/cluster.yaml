version: v1
template: |
  apiVersion: infrastructure.cluster.x-k8s.io/v1
  kind: ZvirtCluster
  metadata:
    name: {{ .cluster.name | quote }}
    namespace: {{ .cluster.namespace | quote }}
    labels:
      app: capz-controller-manager
  spec:
    {{- with get .provider "clusterID" }}
    id: {{ . | quote }}
    {{- end }}
