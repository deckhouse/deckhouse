kind: VsphereCloudDiscoveryData
apiVersions:
- apiVersion: deckhouse.io/v1
  openAPISpec:
    type: object
    additionalProperties: false
    required: [apiVersion, kind, vmFolderPath]
    properties:
      apiVersion:
        type: string
        enum: [deckhouse.io/v1, deckhouse.io/v1alpha1]
      kind:
        type: string
        enum: [VsphereCloudDiscoveryData]
      vmFolderPath:
        type: string
        minLength: 1
      resourcePoolPath:
        type: string
      datacenter:
        type: string
      zones:
        type: array
        items:
          type: string
      datastores:
        type: array
        items:
          type: object
          required: [name]
          properties:
            zones:
              type: array
              items:
                type: string
            path:
              type: string
            name:
              type: string
              minLength: 1
            datastoreType:
              type: string
            datastoreURL:
              type: string
        description: List of datastores
      storagePolicies:
        type: array
        items:
          type: object
          required: [name, id]
          properties:
            name:
              type: string
              minLength: 1
            id:
              type: string
              minLength: 1
        description: List of storage policies
      zoneComputeClusterPaths:
        type: object
        additionalProperties:
          type: string
        description: |
          Zone tag name to absolute inventory path of the ClusterComputeResource it is
          attached to (e.g. "e2e-zone-1" -> "/DatacenterLAB/host/stage-hypers"). Populated by
          cloud-data-discoverer and consumed by the ensure_failure_domains hook to render an
          absolute resourcePool.
      tagURNs:
        type: array
        items:
          type: string
        description: |
          vCenter tag URNs (format urn:vmomi:InventoryServiceTag:<uuid>:GLOBAL) to attach
          to every VM CAPV clones for this cluster. Populated by cloud-data-discoverer via
          EnsureClusterTagURN — currently a single entry, the deckhouse-cluster-name/
          <clusterUUID> tag reused from the MCM era. Consumed by capi/template.yaml which
          renders them into VSphereMachineTemplate.spec.tagIDs.
      thumbprint:
        type: string
        pattern: '^([A-Fa-f0-9]{2}:){19}[A-Fa-f0-9]{2}$'
        description: |
          Colon-separated SHA-1 fingerprint of the vCenter leaf TLS certificate, computed
          by cloud-data-discoverer from the same TLS session it uses for discovery
          (verified against caBundle or the system trust store when insecure=false).
          Rendered into VSphereCluster.spec.thumbprint by capi/cluster.yaml. CAPV's session
          code (`insecure := thumbprint == ""`) pins the leaf cert to this value on every
          reconcile. Empty before the first discovery cycle — CAPV runs insecure until then.
      internalNetworkNames:
        description: List of cluster internal network names
        type: array
        items:
          type: string
      instances:
        type: object
        additionalProperties: false
        properties:
          mainNetwork:
            type: string
