{{- $pcc := .Values.cloudProviderVsphere.internal.providerClusterConfiguration | required "internal.providerClusterConfiguration is required" }}
{{- $pdd := .Values.cloudProviderVsphere.internal.providerDiscoveryData | default dict }}
{{- $datacenter := $pdd.datacenter | default "" }}
{{- $mainNetwork := "" }}
{{- if and $pdd.instances $pdd.instances.mainNetwork }}
  {{- $mainNetwork = $pdd.instances.mainNetwork }}
{{- end }}
{{- $zones := $pcc.zones | default (list) }}
{{- $datastoresByZone := dict }}
{{- range $ds := ($pdd.datastores | default (list)) }}
  {{- range $z := ($ds.zones | default (list)) }}
    {{- if not (hasKey $datastoresByZone $z) }}
      {{- $_ := set $datastoresByZone $z $ds.path }}
    {{- end }}
  {{- end }}
{{- end }}
{{- range $zone := $zones }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VSphereFailureDomain
metadata:
  name: {{ printf "vsphere-%s" $zone | quote }}
  {{- include "helm_lib_module_labels" (list $ (dict "app" "capv-controller-manager")) | nindent 2 }}
spec:
  region:
    name: {{ $pcc.region | quote }}
    type: Datacenter
    tagCategory: {{ $pcc.regionTagCategory | quote }}
  zone:
    name: {{ $zone | quote }}
    type: ComputeCluster
    tagCategory: {{ $pcc.zoneTagCategory | quote }}
  topology:
    datacenter: {{ $datacenter | quote }}
    {{- if index $datastoresByZone $zone }}
    datastore: {{ index $datastoresByZone $zone | quote }}
    {{- end }}
    {{- if $mainNetwork }}
    networks:
      - {{ $mainNetwork | quote }}
    {{- end }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VSphereDeploymentZone
metadata:
  name: {{ $zone | quote }}
  {{- include "helm_lib_module_labels" (list $ (dict "app" "capv-controller-manager")) | nindent 2 }}
spec:
  server: {{ $pcc.provider.server | quote }}
  failureDomain: {{ printf "vsphere-%s" $zone | quote }}
  controlPlane: false
  placementConstraint:
    folder: {{ $pcc.vmFolderPath | quote }}
    {{- if $pdd.resourcePoolPath }}
    resourcePool: {{ $pdd.resourcePoolPath | quote }}
    {{- end }}
{{- end }}
