---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capv-controller-manager
  namespace: d8-cloud-provider-vsphere
  {{- include "helm_lib_module_labels" (list . (dict "app" "capv-controller-manager")) | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:cloud-provider-vsphere:capv-controller-manager
  {{- include "helm_lib_module_labels" (list . (dict "app" "capv-controller-manager")) | nindent 2 }}
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  - nodes
  - secrets
  - serviceaccounts
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resourceNames:
  - vsphereclusteridentities.infrastructure.cluster.x-k8s.io
  - vsphereclusters.infrastructure.cluster.x-k8s.io
  - vsphereclustertemplates.infrastructure.cluster.x-k8s.io
  - vspheredeploymentzones.infrastructure.cluster.x-k8s.io
  - vspherefailuredomains.infrastructure.cluster.x-k8s.io
  - vspheremachines.infrastructure.cluster.x-k8s.io
  - vspheremachinetemplates.infrastructure.cluster.x-k8s.io
