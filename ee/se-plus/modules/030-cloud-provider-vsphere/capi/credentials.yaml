version: v1
template: |
  apiVersion: v1
  kind: Secret
  metadata:
    name: capi-user-credentials
    namespace: {{ .cluster.namespace | quote }}
    labels:
      app: capv-controller-manager
  type: Opaque
  data:
    username: {{ .provider.username | required "provider.username is required" | b64enc | quote }}
    password: {{ .provider.password | required "provider.password is required" | b64enc | quote }}
