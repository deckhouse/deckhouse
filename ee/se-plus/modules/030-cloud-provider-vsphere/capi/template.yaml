version: v2


rolloutFields:
  - numCPUs
  - memory
  - rootDiskSize
  - template
  - mainNetwork
  - additionalNetworks
  - disableTimesync
  - runtimeOptions
  # resourcePool is a rollout-relevant field again because the hook creates a per-NG
  # VSphereDeploymentZone for InstanceClasses that carry it, and the MachineDeployment's
  # failureDomain string encodes the NG identity for that DZ lookup. Changing the value
  # requires new nodes to pick up the override — datastore is intentionally omitted:
  # CAPV can only override datastore via VSphereFailureDomain.spec.topology.datastore,
  # which is immutable and shared across NodeGroups in the zone.
  - resourcePool

# failureDomain sits on the generic MachineDeployment node-controller builds — the provider
# template renders the machine template only. Replaces v1 machine-deployment-spec-patch.yaml,
# whose sole job was ${zone} string substitution. CAPV resolves the string to a
# VSphereDeploymentZone (DZ) and reads its placementConstraint + linked VSphereFailureDomain
# topology to override VSphereVM.spec on clone (pkg/services/vimmachine.go generateOverrideFunc).
#
# There are two shapes for the string:
#
#   1. Zone-baseline "<sanZone>": for InstanceClasses that do NOT override resourcePool.
#      hook creates a single "dz-<sanZone>" per zone with resourcePool derived from
#      providerDiscoveryData.resourcePoolPath (module-wide default).
#
#   2. NG-override "<sanZone>-<sanNG>": for InstanceClasses that carry spec.resourcePool.
#      hook creates an extra DZ named "<sanZone>-<sanNG>" for every (NG that uses that IC,
#      zone) pair, pointing at the same FD as the baseline but with placementConstraint
#      .resourcePool = IC.spec.resourcePool. CAPV's overrideFunc reads .PlacementConstraint
#      .ResourcePool from DZ; datastore is deliberately not overridable this way because
#      CAPV reads datastore from VSphereFailureDomain.spec.topology, which is one per zone
#      and immutable via the FD webhook.
#
# Names go through DNS-1123 sanitization on both sides. The raw vSphere tag "E2E Zone 1"
# and the raw NG name "Worker Fast" would both fail Kubernetes object-name validation with
# 422 and loop the reconcile forever. The Go implementation is hooks/ensure_failure_domains
# .go:rfc1123SubdomainName; the sprig sanitization here mirrors it step-for-step. Drift
# between the two is guarded by hooks/ensure_failure_domains_sanitize_parity_test.go, which
# extracts these literals from template.yaml and asserts equality with the Go function on
# a golden set of inputs.
machineDeployment:
  additionalFields:
    failureDomain: >-
      {{- $sanZone := lower .zone | replace " " "-" -}}
      {{- $sanZone = regexReplaceAll "[^a-z0-9.-]" $sanZone "" -}}
      {{- $sanZone = trimAll "-." $sanZone -}}
      {{- if hasKey .instanceClass "resourcePool" -}}
        {{- $sanNG := lower .nodeGroup.name | replace " " "-" -}}
        {{- $sanNG = regexReplaceAll "[^a-z0-9.-]" $sanNG "" -}}
        {{- $sanNG = trimAll "-." $sanNG -}}
        {{- printf "%s-%s" $sanZone $sanNG -}}
      {{- else -}}
        {{- $sanZone -}}
      {{- end -}}

# Rendered under machinetemplate.Render: missingkey=error, sprig sandbox, no access to Helm
# .Values. Optional fields MUST go through hasKey / get / dig — a direct path like
# `.instanceClass.runtimeOptions | default dict` still evaluates the missing key first and
# fails the render. Numbers arrive as JSON floats — use `| int` where an integer is required.
template: |
  {{- $ic := .instanceClass }}
  {{- $icd := get .provider "instanceClassDefaults" | default dict }}
  {{- $runtime := get $ic "runtimeOptions" | default dict }}
  {{- $memoryMiB := add ($ic.memory | int) (mod ($ic.memory | int) 4) }}

  {{- /* Network devices: mainNetwork first, then any additionalNetworks. mainNetwork on
         VsphereInstanceClass is optional — the documented fallback is providerClusterConfiguration
         .masterNodeGroup.instanceClass.mainNetwork, which templates/registration.yaml already
         publishes as .provider.instances.mainNetwork. The fallback fires only when the
         InstanceClass omits the key entirely (v1 semantics preserved: an explicit empty string
         still renders an empty-name device, matching the pre-migration checksum). */ -}}
  {{- $networks := list }}
  {{- if hasKey $ic "mainNetwork" }}
    {{- $networks = append $networks $ic.mainNetwork }}
  {{- else }}
    {{- $providerInstances := get .provider "instances" | default dict }}
    {{- $fallbackMain := get $providerInstances "mainNetwork" }}
    {{- if $fallbackMain }}
      {{- $networks = append $networks $fallbackMain }}
    {{- end }}
  {{- end }}
  {{- if hasKey $ic "additionalNetworks" }}
    {{- range $n := $ic.additionalNetworks }}
      {{- $networks = append $networks $n }}
    {{- end }}
  {{- end }}

  {{- /* customVMXKeys: disableTimesync (default true) → tools.syncTime=FALSE;
         runtimeOptions.nestedHardwareVirtualization (default true) → vhv.enable=TRUE. */ -}}
  {{- $customVMXKeys := dict }}
  {{- $disableTimesync := true }}
  {{- if hasKey $ic "disableTimesync" }}
    {{- $disableTimesync = $ic.disableTimesync }}
  {{- else if hasKey $icd "disableTimesync" }}
    {{- $disableTimesync = $icd.disableTimesync }}
  {{- end }}
  {{- if $disableTimesync }}
    {{- $_ := set $customVMXKeys "tools.syncTime" "FALSE" }}
  {{- end }}
  {{- $nestedHV := true }}
  {{- if hasKey $runtime "nestedHardwareVirtualization" }}
    {{- $nestedHV = $runtime.nestedHardwareVirtualization }}
  {{- end }}
  {{- if $nestedHV }}
    {{- $_ := set $customVMXKeys "vhv.enable" "TRUE" }}
  {{- end }}

  {{- /* runtimeOptions → CAPV resources.{shares,limits,requests}. Memory reservation defaults
         to 80% of memoryMiB (matches v1). CPU shares/limits are integers, memory strings. */ -}}
  {{- $resources := dict }}
  {{- $shares := dict }}
  {{- $limits := dict }}
  {{- $requests := dict }}
  {{- if hasKey $runtime "cpuShares" }}
    {{- $_ := set $shares "cpu" ($runtime.cpuShares | int) }}
  {{- end }}
  {{- if hasKey $runtime "memoryShares" }}
    {{- $_ := set $shares "memory" ($runtime.memoryShares | int) }}
  {{- end }}
  {{- if hasKey $runtime "cpuLimit" }}
    {{- $_ := set $limits "cpu" (printf "%dM" ($runtime.cpuLimit | int)) }}
  {{- end }}
  {{- if hasKey $runtime "memoryLimit" }}
    {{- $_ := set $limits "memory" (printf "%dMi" ($runtime.memoryLimit | int)) }}
  {{- end }}
  {{- if hasKey $runtime "cpuReservation" }}
    {{- $_ := set $requests "cpu" (printf "%dM" ($runtime.cpuReservation | int)) }}
  {{- end }}
  {{- $memoryReservationPct := 80 }}
  {{- if hasKey $runtime "memoryReservation" }}
    {{- $memoryReservationPct = $runtime.memoryReservation | int }}
  {{- end }}
  {{- $memoryReservationMiB := mul (div $memoryMiB 100) $memoryReservationPct }}
  {{- $_ := set $requests "memory" (printf "%dMi" $memoryReservationMiB) }}
  {{- if gt (len $shares) 0 }}{{- $_ := set $resources "shares" $shares }}{{- end }}
  {{- if gt (len $limits) 0 }}{{- $_ := set $resources "limits" $limits }}{{- end }}
  {{- if gt (len $requests) 0 }}{{- $_ := set $resources "requests" $requests }}{{- end }}

  {{- /* MCM used to attach display-name tags (deckhouse-cluster-name / deckhouse-node-role) for
         vCenter UI grouping. CAPV rejects display names and demands URN-format tag IDs
         (urn:vmomi:InventoryServiceTag:<uuid>:GLOBAL); resolving/creating those per (NodeGroup,
         zone) is not wired yet — cloud-data-discoverer does not publish tag URNs. Until it does,
         VMs are created without tags. See PR #21595 follow-up. */ -}}
  {{- $tags := dig "tagURNs" (list) .provider }}

  {{- /* Optional string fields — go through get to survive missingkey=error. Fall back to
         instanceClassDefaults from the discovery payload when the InstanceClass omits them.
         resourcePool and datastore intentionally do NOT read from the InstanceClass under CAPI:
         CAPV's overrideWithFailureDomainFunc rewrites both from the resolved DeploymentZone /
         FailureDomain topology on every reconcile (pkg/services/vimmachine.go), so a value from
         the InstanceClass would be a dead-write that never lands on the VM. Sourcing them from
         the discovery defaults keeps the pre-DZ/FD fresh-install window (before ensure_failure_domains
         has published the CRs) working without misleading operators into thinking VsphereInstanceClass
         .{resourcePool,datastore} still tunes the placement. */ -}}
  {{- $template := get $ic "template" | default (get $icd "template") }}
  {{- $datastore := get $icd "datastore" }}
  {{- $rootDiskSize := get $ic "rootDiskSize" | default 20 }}
  {{- $rp := get $icd "resourcePoolPath" }}

  apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
  kind: VSphereMachineTemplate
  spec:
    template:
      spec:
        template: {{ $template | quote }}
        server: {{ .provider.server | quote }}
        {{- /* thumbprint pins the vCenter TLS certificate: CAPV's session code does
               `insecure := thumbprint == ""` (pkg/session/session.go), so an unset thumbprint on
               a non-dev vCenter silently disables TLS validation for every clone task. Falls back
               to the empty string when the operator explicitly opted into providerClusterConfiguration
               .provider.insecure: true. */ -}}
        {{- $thumbprint := get .provider "thumbprint" }}
        {{- if $thumbprint }}
        thumbprint: {{ $thumbprint | quote }}
        {{- end }}
        {{- /* datacenter + absolute folder are baseline: CAPV's `generateOverrideFunc` in
               pkg/services/vimmachine.go overrides them from the resolved VSphereDeploymentZone
               / VSphereFailureDomain topology when both CRs exist. If DZ/FD are missing at the
               time of the first reconcile (fresh install, hook lagging) it returns (nil, false)
               and only logs a warning — VSphereVM.spec is immutable, so an empty datacenter or
               a bare folder at that moment survives forever. Keep both explicit so CAPV's own
               finder can always clone the VM even without the override. */ -}}
        {{- $dc := get .provider "datacenter" }}
        {{- if $dc }}
        datacenter: {{ $dc | quote }}
        {{- end }}
        {{- $folder := .provider.vmFolderPath }}
        {{- if and $dc (not (hasPrefix "/" $folder)) }}
        folder: {{ printf "/%s/vm/%s" $dc $folder | quote }}
        {{- else }}
        folder: {{ $folder | quote }}
        {{- end }}
        datastore: {{ $datastore | quote }}
        {{- /* Prefer an absolute resourcePool inventory path built from the zone's
               ClusterComputeResource (published by ensure_failure_domains hook) joined with
               providerDiscoveryData.resourcePoolPath. CAPV's finder resolves a bare name relative
               to the datacenter and errors out ambiguously when several compute clusters carry a
               resource pool of the same name. Fall back to the raw value only if the hook has
               not populated the map yet (fresh install). CAPV then further overrides the RP from
               the resolved VSphereDeploymentZone.spec.placementConstraint.resourcePool when the
               DZ has one, so this is a safe pre-resolution. */ -}}
        {{- if $rp }}
        {{- $zoneCluster := dig "zoneComputeClusterPaths" .zone "" .provider }}
        {{- if $zoneCluster }}
        resourcePool: {{ printf "%s/Resources/%s" $zoneCluster $rp | quote }}
        {{- else }}
        resourcePool: {{ $rp | quote }}
        {{- end }}
        {{- end }}
        numCPUs: {{ $ic.numCPUs | int }}
        memoryMiB: {{ $memoryMiB }}
        diskGiB: {{ $rootDiskSize | int }}
        cloneMode: fullClone
        network:
          devices:
          {{- range $networks }}
          - networkName: {{ . | quote }}
            dhcp4: true
          {{- end }}
        {{- if gt (len $customVMXKeys) 0 }}
        customVMXKeys:
          {{- range $k, $v := $customVMXKeys }}
          {{ $k | quote }}: {{ $v | quote }}
          {{- end }}
        {{- end }}
        {{- if gt (len $resources) 0 }}
        resources:
          {{- toYaml $resources | nindent 10 }}
        {{- end }}
        {{- if gt (len $tags) 0 }}
        tagIDs:
        {{- range $tags }}
          - {{ . | quote }}
        {{- end }}
        {{- end }}
