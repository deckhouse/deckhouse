linters-settings:
  no-cyrillic:
    exclude-rules:
      directories:
        # The RBACv2 templates carry the localized title and description of every role and
        # capability they ship. That is product text, not a source comment: the console shows it
        # to whoever is choosing what to grant, and `d8:namespace-capability:kubernetes:view_logs`
        # on its own tells that person nothing.
        - templates/rbacv2
  module:
    oss:
      disable: false
  container:
    exclude-rules:
      read-only-root-filesystem:
        - kind: DaemonSet
          name: csi-node
          container: node-driver-registrar
        - kind: DaemonSet
          name: csi-node
          container: node
      dns-policy:
        - kind: Deployment
          name: cloud-controller-manager
      liveness-probe:
        - kind: Deployment
          name: csi-controller
          container: controller
        - kind: Deployment
          name: csi-controller
          container: provisioner
        - kind: Deployment
          name: csi-controller
          container: attacher
        - kind: Deployment
          name: csi-controller
          container: resizer
        - kind: Deployment
          name: csi-controller
          container: livenessprobe
        - kind: DaemonSet
          name: csi-node
          container: node-driver-registrar
        - kind: DaemonSet
          name: csi-node
          container: node
        - kind: Deployment
          name: csi-controller
          container: syncer
      readiness-probe:
        - kind: Deployment
          name: csi-controller
          container: controller
        - kind: Deployment
          name: csi-controller
          container: provisioner
        - kind: Deployment
          name: csi-controller
          container: attacher
        - kind: Deployment
          name: csi-controller
          container: resizer
        - kind: Deployment
          name: csi-controller
          container: livenessprobe
        - kind: DaemonSet
          name: csi-node
          container: node-driver-registrar
        - kind: DaemonSet
          name: csi-node
          container: node
        - kind: Deployment
          name: csi-controller
          container: syncer
  openapi:
    exclude-rules:
      enum:
        - "properties.internal.properties.providerClusterConfiguration.properties.apiVersion"
        - "properties.internal.properties.providerDiscoveryData.properties.apiVersion"
  rbac:
    exclude-rules:
      # CAPV's VSphereCluster reconciler owns the identity Secret (capi-user-credentials)
      # that lives in d8-cloud-instance-manager alongside the CAPI Cluster, not in the
      # module namespace. Placement lint would otherwise force these into
      # d8-cloud-provider-vsphere, breaking the finalizer cleanup path.
      placement:
        - kind: Role
          name: capv-controller-manager:capi-user-credentials
        - kind: RoleBinding
          name: capv-controller-manager:capi-user-credentials
