{{- if and .Values.userAuthz.enableMultiTenancy (.Values.global.enabledModules | has "operator-prometheus") }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: permission-browser-apiserver
  namespace: d8-monitoring
  {{- include "helm_lib_module_labels" (list . (dict "prometheus" "main")) | nindent 2 }}
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: permission-browser-apiserver
  namespaceSelector:
    matchNames:
    - d8-{{ $.Chart.Name }}
  podMetricsEndpoints:
  - port: https-metrics
    scheme: https
    bearerTokenSecret:
      name: prometheus-token
      key: token
    tlsConfig:
      insecureSkipVerify: true
    relabelings:
    - regex: endpoint|pod|service
      action: labeldrop
    - targetLabel: tier
      replacement: cluster
{{- /*
  Deliberately NOT dropping pods that are not ready.

  Readiness of these two now means "the rules are listed and being tracked", so an instance whose
  watch has broken reports itself unready - and that is exactly the instance the alerts below are
  about. Keeping the usual pod_ready filter here would hide it from RulesNotSynced,
  RulesWatchErrors, DirectoryDiverged and RulePropagationLag at the moment each of them became
  true, leaving the whole set blind to the only failure it can see.

  The metrics endpoint does not depend on readiness: the process serves it as soon as it is up, and
  the sidecar in front of it is a separate container.
*/}}
{{- end }}
