---
image: {{ .ModuleName }}/{{ .ImageName }}
from: common/distroless
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-user-authz-webhook-artifact
  add: /src/webhook
  to: /webhook
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-user-authz-webhook-artifact
  add: /src/healthcheck
  to: /healthcheck
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: [ "/webhook" ]
---
image: {{ .ModuleName }}/{{ .ImageName }}-user-authz-webhook-src-artifact
from: common/src-artifact
final: false
git:
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
    to: /src
    includePaths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
    stageDependencies:
      install:
        - '**/*.go'
        - '**/go.mod'
        - '**/go.sum'
shell:
  install:
    - cd /src
---
image: {{ .ModuleName }}/{{ .ImageName }}-user-authz-webhook-artifact
from: {{ index $.Images "builder/golang" }}
final: false
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-user-authz-webhook-src-artifact
    add: /src
    to: /src
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - export GOPROXY=$(cat /run/secrets/GOPROXY) CGO_ENABLED=0 GOOS=linux GOARCH=amd64
    - cd /src
    - |
      {{- include "image-build.build" (set $ "BuildCommand" `go build -ldflags '-s -w' -o webhook ./cmd/webhook/main.go`) | indent 6 }}
    - go build -ldflags '-s -w' -o healthcheck ./cmd/healthcheck/main.go
    - chown 64535:64535 webhook healthcheck
    - chmod 0700 webhook healthcheck
