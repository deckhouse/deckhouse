linters-settings:
  no-cyrillic:
    exclude-rules:
      directories:
        # The RBACv2 templates carry the localized title and description of every role and
        # capability they ship. That is product text, not a source comment: the console shows it
        # to whoever is choosing what to grant, and `d8:namespace-capability:kubernetes:view_logs`
        # on its own tells that person nothing.
        - templates/rbacv2
  module:
    oss:
      disable: true
  container:
    exclude-rules:
      host-network-ports:
        - kind: DaemonSet
          name: node-local-dns
          container: coredns
      ports:
        - kind: DaemonSet
          name: node-local-dns
          container: coredns
      read-only-root-filesystem:
        - kind: DaemonSet
          name: node-local-dns
          container: coredns
        - kind: DaemonSet
          name: node-local-dns
          container: iptables-loop
      liveness-probe:
        - kind: DaemonSet
          name: node-local-dns
          container: iptables-loop
      readiness-probe:
        - kind: DaemonSet
          name: node-local-dns
          container: iptables-loop
