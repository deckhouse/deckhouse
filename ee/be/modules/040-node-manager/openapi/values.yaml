x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    properties:

      capiControllerManagerWebhookCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: [ "YjY0ZW5jX3N0cmluZwo=" ]
          key:
            type: string
            x-examples: [ "YjY0ZW5jX3N0cmluZwo=" ]
          ca:
            type: string
            x-examples: [ "YjY0ZW5jX3N0cmluZwo=" ]

      capsControllerManagerWebhookCert:
        type: object
        default: { }
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: [ "YjY0ZW5jX3N0cmluZwo=" ]
          key:
            type: string
            x-examples: [ "YjY0ZW5jX3N0cmluZwo=" ]
          ca:
            type: string
            x-examples: [ "YjY0ZW5jX3N0cmluZwo=" ]

      nodeControllerWebhookCert:
        type: object
        default: { }
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: [ "YjY0ZW5jX3N0cmluZwo=" ]
          key:
            type: string
            x-examples: [ "YjY0ZW5jX3N0cmluZwo=" ]
          ca:
            type: string
            x-examples: [ "YjY0ZW5jX3N0cmluZwo=" ]

      machineControllerManagerEnabled:
        type: boolean
      capiControllerManagerEnabled:
        type: boolean
        x-examples:
        - true
      capsControllerManagerEnabled:
        type: boolean
      deployAutoscaler:
        type: boolean
      deployAutoscalerMCM:
        type: boolean
      autoscalerNodes:
        type: array
        items:
          type: string
      autoscalerMCMNodes:
        type: array
        items:
          type: string
      clusterMasterAddresses:
        type: array
        x-doc-deprecated: true
        description: |
          Deprecated. Use `clusterMasterEndpoints`.

          Array of API servers addresses.
        x-examples:
          - ["10.0.0.1:6443", "10.0.0.2:6443", "10.0.0.3:6443"]
        items:
          type: string
          pattern: '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}:[1-9][0-9]{0,4}$'
      clusterMasterEndpoints:
        type: array
        description: |
          Array of cluster master endpoints with ports for kube-apiserver and registry-packages-proxy services.
        default: []
        x-examples:
          - [
              {"address":"10.0.0.1","kubeApiPort":6443,"rppServerPort":4219,"rppBootstrapServerPort":4282},
              {"address":"10.0.0.2","kubeApiPort":6443,"rppServerPort":4219,"rppBootstrapServerPort":4282},
              {"address":"10.0.0.3","kubeApiPort":6443,"rppServerPort":4219,"rppBootstrapServerPort":4282}
            ]
        items:
          type: object
          additionalProperties: false
          required:
            - address
            - kubeApiPort
            - rppServerPort
            - rppBootstrapServerPort
          properties:
            address:
              type: string
              pattern: '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$'
            kubeApiPort:
              type: integer
              minimum: 1
              maximum: 65535
            rppServerPort:
              type: integer
              minimum: 1
              maximum: 65535
            rppBootstrapServerPort:
              type: integer
              minimum: 1
              maximum: 65535

      standbyNodeGroups:
        type: array
        description: |
          Settings for standby Pods.
        items:
          type: object
          properties:
            name:
              type: string
              x-dmt-default: name
            standby:
              type: number
            reserveCPU:
              type: [integer, string]
            reserveMemory:
              type: [integer, string]
            taints:
              type: array
              description: |
                Similar to the `.spec.taints` field of the [Node](https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.25/#taint-v1-core) object.

                **Caution!** Only `effect`, `key`, `value` fields are available.
              items:
                type: object
                properties:
                  effect:
                    type: string
                    enum:
                    - NoSchedule
                    - PreferNoSchedule
                    - NoExecute
                  key:
                    type: string
                  value:
                    type: string

      bashibleApiServerCA:
        type: string
        x-examples:
          - LS0tQ0VSVC0tLSBhYWFxcXEgLS1FTkQgQ0VSVC0tLQo=
        description: |
          CA certificate for API server used by bashible.
      bashibleApiServerCrt:
        type: string
        x-examples:
          - LS0tQ0VSVC0tLSBhYWFxcXEgLS1FTkQgQ0VSVC0tLQo=
        description: |
          Certificate for API server used by bashible.
      bashibleApiServerKey:
        type: string
        x-examples:
          - LS0tcHJpdmtleS0tLSBhYWFxcXEgLS1lbmQgcHJpdmtleS0tLQo=
        description: |
          Private key for API server used by bashible.

      customMIGNames:
        type: object
        default: {}
        description: |
          Resolved MIG configuration names for node groups with custom MIG partitions.
        additionalProperties:
          type: string
        x-examples:
          - worker-gpu-custom: custom-worker-gpu-custom-12345678

      instancePrefix:
        type: string
        x-examples:
          - "myprefix"
        description: |
          Prefix for instance name.

      machineDeployments:
        type: object
        description: |
          Checksums of all EXISTING MachineClasses in the map "{MachineDeployment name}": "{name, nodeGroup, Checksum}"
        x-examples:
          - worker:
              name: "myprefix-worker-02320933"
              nodeGroup: "workers"
              checksum: "62090f2241986a8361242e47cf541657099fdccc0c08e34cd694922bdcf31893"
        additionalProperties:
          type: object
          properties:
            name:
              type: string
              description: Name of the MachineDeployment.
            nodeGroup:
              type: string
              description: Name of the NodeGroup.
            checksum:
              type: string
              description: Checksum of the MachineClass, to be reused in MachineDeployment templates at right moments.

      cloudProvider:
        type: object
        additionalProperties: true
        description: |
          Settings specific for cloud provider: access, zones, regions, etc.
        properties:
          type:
            type: string
          region:
            type: string
          zones:
            type: array
            items:
              type: string
          instanceClassKind:
            type: string
          instanceClassAPIVersion:
            type: string
            description: |
              Storage version of the InstanceClass CRD, published by the cloud provider module.
              node-controller reads the InstanceClass through it and never resolves a version itself:
              the value decides the instance-class checksum, which names an immutable MachineTemplate.
          machineClassKind:
            type: string
        x-examples:
          - type: aws
            machineClassKind: AWSInstanceClass
            aws:
              providerAccessKeyId: myprovaccesskeyid
              providerSecretAccessKey: myprovsecretaccesskey
              region: myregion
              loadBalancerSecurityGroupID: mylbsecuritygroupid
              keyName: mykeyname
              instances:
                iamProfileName: myiamprofilename
                additionalSecurityGroups:
                  - ["mysecgroupid1", "mysecgroupid2"]
              internal:
                zoneToSubnetIdMap:
                  zonea: mysubnetida
                  zoneb: mysubnetidb
              tags:
                aaa: aaa
      clusterAutoscalerPriorities:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
      nodeGroups:
        type: array
        description: |
          Array of available NodeGroups.
        items:
          type: object
          properties:
            name:
              type: string
              description: |
                A name of the NodeGroup.
            engine:
              type: string
              enum: ["None", "MCM", "CAPI"]
              description: |
                Effective machinery selected for this NodeGroup.
            nodeType:
              # See NodeGroup in candi/openapi/node_group.yaml
              type: string
              enum: ["CloudEphemeral", "CloudPermanent", "CloudStatic", "Static"]
            gpu:
              # This is a copy from NodeGroup object. We trust that hook will not change it.
              type: object
              additionalProperties: true
            cloudInstances:
              # This is a copy from NodeGroup object. We trust that hook will not change it.
              type: object
              additionalProperties: true
            fencing:
              # This is a copy from NodeGroup object. We trust that hook will not change it.
              type: object
              properties:
                mode:
                  type: string
                watchdog:
                  type: object
                  properties:
                    timeout:
                      type: integer
        x-examples:
          - - name: worker
              nodeType: CloudEphemeral
              cloudInstances:
                classReference:
                  kind: AWSInstanceClass
                  name: worker
                maxPerZone: 1
                minPerZone: 1
                zones:
                  - zonea
      upmeterDiscovery:
        type: object
        required:
          - ephemeralNodeGroupNames
        properties:
          ephemeralNodeGroupNames:
            type: array
            items:
              type: string
